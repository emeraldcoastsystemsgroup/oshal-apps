  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell) and family (Home shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the company view makes three reads, GET /api/scan-to-print/jobs, /printers and /home-summary, and the real routes behind them (the whole mounted router and the Home summary route) only SELECT the caller's own rows, the printers SELECT never naming the key column; it never reconstructs, slices, reads a model file, contacts a printer or creates an object.
      - Fed by the package's real routes, the objects read as four stats (objects, printable models, failed reconstructions, sent to a printer in seven days), a title ladder, a table of the newest eight with state, source, extents and the printable verdict shown only while a reconstruction is current, a needs-attention list (failed, not printable in the validation block's terms, print-check warnings) and the printers by label and kind, never their address.
      - A full 200-object list, odd rows, a seven-day count or printers list that could not be read, signed out, refused, the route's own failure, an unreadable answer and an unreachable server each read as what they are; the one action opens the full page in the frame and no row or item links anywhere.
      - Under the company view the surface script binds no listener, reads nothing and takes in no ?artifact (which would create an object); the full page, and a core without the kit, still boot.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: printing-bambu
    name: Bambu Lab printer on the home network
    purpose: Prove the LAN client against a fake printer on real loopback TLS — identity from the certificate, status, a refused access code, a device whose certificate names another serial, FTPS upload with the session reuse the printer requires, the no-storage refusal, and every start rule (never while vendor-signed commands are required, never while busy, a refused start reported) — plus MQTT framing, state normalisation, the project_file command and host validation.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/printing-bambu.test.js
    expected:
      - The serial and model code come from the printer's certificate; a wrong access code and an impostor serial are refused with a reason.
      - An upload resumes the control TLS session on the data channel and confirms the stored size; a printer without storage says so.
      - No start command is published while the printer requires vendor-signed commands or is busy; an allowed start names the stored file and the matching AMS tray.
      - A printer that never answers a TLS 1.3 hello (as reported for the P2S 01.02.00.00 broker; the fake does it on every port) is identified, read, uploaded to and started; no connection offers it TLS 1.3, and a positive control proves the fake ignores an uncapped hello.
    prerequisites:
