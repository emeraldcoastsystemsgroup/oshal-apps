<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<!-- CHANGE LOG
  SEQ | AUTHOR | DESCRIPTION
  1 | maintainer@emeraldcoastsystemsgroup.com | The Social desk (Roger, 2026-10-30: the tab was one Facebook card; he wants a publisher's tools a person can use to post or stream to two or three services, Slack included). The shape is the one Buffer, Later and Metricool share: a channel rail with the connected accounts, a Queue and a week Calendar, a composer that writes once and customizes per channel with a live preview, "Add to queue" / "Post now" / "Schedule", Drafts and Sent, an Engage list (Slack DMs and mentions, X mentions, reply in place), Go Live events that announce a stream (the Restream Events idea) and one Settings panel (posting plan, Slack channel, the publishing job). Every colour derives from the portal theme tokens.
-->
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Social — Intelligent Communication</title>
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css" />
<script src="/shared/ui/js/surface-theme.js"></script>
<style>
  :root {
    --bg: var(--bg-primary, #0e0e16); --panel: var(--bg-secondary, #15151f); --panel2: var(--bg-tertiary, #1c1c28); --card: var(--bg-card, var(--bg-secondary, #15151f));
    --line: var(--border-color, #2a2a3a); --text: var(--text-primary, #f0f0f6); --muted: var(--text-secondary, #9a9ab0); --accent: var(--accent-primary, #7c5cff);
    --on-accent: var(--text-on-accent, #fff); --ok: var(--status-success, #00d3a7); --warn: var(--status-warning, #f5b800); --bad: var(--status-error, #ff5c7a);
    --shadow: var(--card-shadow, 0 8px 30px rgba(0,0,0,.25)); --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); display: grid; grid-template-columns: 236px 1fr; overflow: hidden; }
  button { font: inherit; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  a { color: var(--accent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text) 18%, transparent); border-radius: 6px; } ::-webkit-scrollbar-track { background: transparent; }
  /* ── rail ── */
  .rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .rail .brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 10px; font-weight: 700; font-size: 17px; }
  .rail .brand .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent-gradient, var(--accent)); display: grid; place-items: center; color: var(--on-accent); font-size: 15px; }
  .newpost { margin: 6px 14px 14px; padding: 11px 14px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 650; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .newpost svg { width: 16px; height: 16px; flex: none; }
  .newpost:hover { filter: brightness(1.08); }
  .nav { display: flex; flex-direction: column; padding: 0 8px; gap: 2px; }
  .nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; background: transparent; color: var(--text); border-radius: 9px; font-size: 14px; text-align: left; }
  .nav button svg { width: 17px; height: 17px; opacity: .8; }
  .nav button .n { margin-left: auto; font-size: 12px; color: var(--muted); background: var(--panel2); padding: 1px 7px; border-radius: 10px; }
  .nav button .n:empty { display: none; }
  .nav button.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--text); font-weight: 600; }
  .nav button.on svg { opacity: 1; color: var(--accent); }
  .rail h4 { margin: 18px 18px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .chlist { display: flex; flex-direction: column; padding: 0 8px; gap: 2px; overflow: auto; min-height: 0; flex: 1; }
  .chrow { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border: 0; background: transparent; color: var(--text); border-radius: 9px; font-size: 13.5px; text-align: left; width: 100%; }
  .chrow:hover { background: var(--panel2); }
  .chrow .who { display: flex; flex-direction: column; min-width: 0; }
  .chrow .who b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chrow .who span { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chrow .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
  .chrow .dot.connected { background: var(--ok); } .chrow .dot.reconnect { background: var(--warn); }
  .rail .foot { padding: 10px 8px 14px; border-top: 1px solid var(--line); }
  /* avatars with a brand badge (the Buffer channel avatar) */
  .av { position: relative; width: 34px; height: 34px; flex: none; }
  .av img, .av .ph { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: var(--panel2); display: grid; place-items: center; color: var(--muted); font-size: 15px; }
  .av .badge { position: absolute; right: -4px; bottom: -4px; width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 10px; font-weight: 800; border: 2px solid var(--panel); }
  .av.dim { opacity: .4; filter: grayscale(1); }
  .av.lg, .av.lg img, .av.lg .ph { width: 54px; height: 54px; } .av.lg .badge { width: 22px; height: 22px; font-size: 12px; }
  /* ── main ── */
  .main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .head { display: flex; align-items: center; gap: 12px; padding: 16px 22px 12px; border-bottom: 1px solid var(--line); }
  .head h1 { margin: 0; font-size: 20px; }
  .head .sub { color: var(--muted); font-size: 13px; }
  .head .sp { flex: 1; }
  .body { overflow: auto; padding: 18px 22px 40px; min-height: 0; min-width: 0; }
  .btn { padding: 8px 13px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 13.5px; display: inline-flex; align-items: center; gap: 7px; }
  .btn:hover { background: var(--panel2); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--text); background: var(--panel2); }
  .btn.danger { color: var(--bad); }
  .btn svg { width: 15px; height: 15px; }
  .banner { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn) 10%, var(--panel)); border-radius: 12px; margin-bottom: 16px; font-size: 13.5px; }
  .banner.ok { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); background: color-mix(in srgb, var(--ok) 9%, var(--panel)); }
  .banner .sp { flex: 1; }
  .day { margin: 18px 0 8px; font-size: 12.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .day::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .post { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; align-items: start; }
  .post .time { font-weight: 700; font-size: 14px; } .post .time small { display: block; color: var(--muted); font-weight: 500; font-size: 11.5px; }
  .post .txt { white-space: pre-wrap; line-height: 1.5; font-size: 14px; overflow-wrap: anywhere; }
  .post .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 20px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .chip.ok { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); } .chip.bad { border-color: color-mix(in srgb, var(--bad) 60%, var(--line)); color: var(--bad); }
  .chip a { color: inherit; text-decoration: none; } .chip a:hover { text-decoration: underline; }
  .post .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .post img.media { max-height: 120px; border-radius: 8px; margin-top: 8px; border: 1px solid var(--line); }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  .empty .big { font-size: 40px; margin-bottom: 8px; }
  .empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
  /* calendar */
  .cal { display: grid; grid-template-columns: repeat(7, minmax(120px, 1fr)); gap: 8px; min-width: 860px; }
  .cal .col { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-height: 420px; display: flex; flex-direction: column; }
  .cal .col.today { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
  .cal .colh { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; }
  .cal .colh b { font-size: 18px; color: var(--text); }
  .cal .col.today .colh b { color: var(--accent); }
  .cal .slot { margin: 8px 8px 0; padding: 8px 10px; border-radius: 9px; background: var(--card); border: 1px solid var(--line); font-size: 12.5px; cursor: pointer; }
  .cal .slot:hover { border-color: var(--accent); }
  .cal .slot .t { font-weight: 700; display: flex; gap: 5px; align-items: center; } .cal .slot .t i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .cal .slot .x { color: var(--muted); margin-top: 3px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .cal .slot.sent { opacity: .7; } .cal .slot.failed { border-color: color-mix(in srgb, var(--bad) 60%, var(--line)); }
  .cal .add { margin: auto 8px 8px; padding: 8px; border: 1px dashed var(--line); border-radius: 9px; background: transparent; color: var(--muted); font-size: 12.5px; }
  .cal .add:hover { color: var(--text); border-color: var(--accent); }
  .calwrap { overflow: auto; }
  /* engage */
  .msg { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; }
  .msg .from { font-weight: 650; font-size: 14px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .msg .from span { color: var(--muted); font-weight: 500; font-size: 12.5px; }
  .msg .txt { margin-top: 4px; white-space: pre-wrap; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
  .msg .acts { margin-top: 8px; display: flex; gap: 6px; align-items: center; }
  .msg .reply { margin-top: 8px; display: none; gap: 8px; }
  .msg .reply.open { display: flex; }
  .msg .reply textarea { flex: 1; min-height: 44px; }
  textarea, input[type=text], input[type=url], input[type=datetime-local], input[type=time], select { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; width: 100%; }
  textarea:focus, input:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); border-color: var(--accent); }
  textarea { resize: vertical; min-height: 110px; line-height: 1.5; }
  label.f { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; }
  /* channel cards + go live cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .ccard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .ccard .top { display: flex; align-items: center; gap: 12px; }
  .ccard .top .who { min-width: 0; } .ccard .top .who b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .ccard .top .who span { color: var(--muted); font-size: 12.5px; }
  .state { font-size: 12px; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); } .state i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: inline-block; }
  .state.connected { color: var(--ok); } .state.connected i { background: var(--ok); } .state.reconnect { color: var(--warn); } .state.reconnect i { background: var(--warn); }
  .ccard .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
  .tog { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 20px; border: 1px solid var(--line); background: var(--panel2); color: var(--muted); font-size: 13px; }
  .tog.on { border-color: var(--accent); color: var(--text); background: color-mix(in srgb, var(--accent) 14%, var(--panel2)); }
  .tog .k { width: 10px; height: 10px; border-radius: 50%; background: var(--line); } .tog.on .k { background: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
  .panel h3 { margin: 0 0 4px; font-size: 15px; } .panel .hint { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  .times { display: flex; flex-wrap: wrap; gap: 8px; } .times .chip button { border: 0; background: transparent; color: var(--muted); padding: 0 0 0 4px; font-size: 14px; line-height: 1; }
  .status { font-size: 13px; color: var(--muted); min-height: 18px; } .status.bad { color: var(--bad); } .status.ok { color: var(--ok); }
  /* composer */
  .scrim { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
  .scrim.open { display: flex; }
  .composer { width: min(980px, 100%); max-height: 94vh; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
  .composer .ctop { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .composer .ctop h2 { margin: 0; font-size: 16px; margin-right: 8px; }
  .composer .ctop .x { margin-left: auto; }
  .avtog { border: 2px solid transparent; background: transparent; padding: 2px; border-radius: 50%; }
  .avtog.on { border-color: var(--accent); } .avtog .av { width: 36px; height: 36px; } .avtog .av img, .avtog .av .ph { width: 36px; height: 36px; }
  .cbody { display: grid; grid-template-columns: 1.15fr .85fr; min-height: 0; overflow: auto; }
  .cwrite { padding: 16px 18px; border-right: 1px solid var(--line); min-width: 0; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
  .tabs button { border: 1px solid var(--line); background: var(--panel2); color: var(--muted); border-radius: 20px; padding: 5px 11px; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; }
  .tabs button.on { color: var(--text); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel2)); }
  .tabs button .c { font-variant-numeric: tabular-nums; } .tabs button .c.over { color: var(--bad); font-weight: 700; }
  .counter { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; } .counter .over { color: var(--bad); font-weight: 700; }
  .cprev { padding: 16px 18px; background: var(--bg); min-width: 0; }
  .cprev h5 { margin: 0 0 10px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .pcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .pcard .ph2 { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; } .pcard .ph2 b { display: block; font-size: 14px; } .pcard .ph2 span { color: var(--muted); font-size: 12px; }
  .pcard .pt { white-space: pre-wrap; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; min-height: 40px; }
  .pcard img { width: 100%; border-radius: 9px; margin-top: 10px; border: 1px solid var(--line); }
  .cfoot { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .cfoot .status { flex: 1; }
  .when { display: none; gap: 8px; align-items: center; } .when.open { display: flex; }
  .menu { position: relative; }
  .menu .dd { position: absolute; right: 0; bottom: 110%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 200px; display: none; z-index: 2; overflow: hidden; }
  .menu.open .dd { display: block; }
  .menu .dd button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--text); padding: 10px 14px; font-size: 13.5px; }
  .menu .dd button:hover { background: var(--panel2); }
  .menu .dd button small { display: block; color: var(--muted); font-size: 11.5px; }
  .split { display: inline-flex; } .split .btn:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; } .split .btn:last-child { border-top-left-radius: 0; border-bottom-left-radius: 0; padding: 8px 9px; border-left: 1px solid color-mix(in srgb, var(--on-accent) 30%, transparent); }
  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .rail { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; align-items: center; gap: 4px; padding: 8px 10px; overflow-x: auto; }
    .rail .brand { padding: 0 6px; font-size: 15px; } .rail .brand .word { display: none; }
    .newpost { margin: 0 4px; padding: 8px 12px; font-size: 13px; white-space: nowrap; }
    .nav { flex-direction: row; padding: 0; } .nav button { padding: 7px 9px; white-space: nowrap; font-size: 13px; } .nav button .n { display: none; }
    .rail h4, .chlist { display: none; } .rail .foot { border-top: 0; padding: 0; }
    .head { padding: 12px 14px; flex-wrap: wrap; } .body { padding: 12px 14px 60px; }
    .post { grid-template-columns: 1fr; gap: 8px; } .post .acts { justify-content: flex-start; }
    .cbody { grid-template-columns: 1fr; } .cwrite { border-right: 0; border-bottom: 1px solid var(--line); }
    .grid2 { grid-template-columns: 1fr; } .scrim { padding: 0; } .composer { max-height: 100vh; border-radius: 0; }
  }
</style>

<script>
(function () {

  var API = '/api/email-social';
  var S = { channels: [], settings: null, posts: [], events: [], job: null, jobs: [], view: 'queue', week: 0, editing: null, sel: [], variants: {}, tab: 'all', connectList: {} };
  var LETTER = { x: 'X', linkedin: 'in', facebook: 'f', slack: '#', mastodon: 'm' };
  var DEST_LETTER = { youtube: '▶', twitch: 'T', 'facebook-live': 'f', kick: 'K', 'linkedin-live': 'in', 'tiktok-live': '♪' };
  var DEST_COLOR = { youtube: '#ff0000', twitch: '#9146ff', 'facebook-live': '#1877f2', kick: '#53fc18', 'linkedin-live': '#0a66c2', 'tiktok-live': '#000' };

  /* ── loads ── */

  /* ── rail ── */
  function paintRail() {
    var list = $('chlist'); list.innerHTML = '';
    var shown = S.channels.filter(function (c) { return c.state === 'connected' || c.state === 'reconnect' || configured(c); });
    shown.forEach(function (c) {
      var who = c.account ? '<b>' + esc(c.account.name || c.label) + '</b><span>' + esc(c.account.handle || c.label) + '</span>' : '<b>' + esc(c.label) + '</b><span>' + (c.state === 'reconnect' ? 'Needs reconnecting' : c.state === 'connected' ? 'Connected' : 'Not connected') + '</span>';
      var b = el('<button class="chrow">' + avatar(c) + '<span class="who">' + who + '</span><i class="dot ' + esc(c.state) + '"></i></button>');
      b.onclick = function () { if (c.state === 'connected') openComposer({ channels: [c.id] }); else setView('channels'); };
      list.appendChild(b);
    });

  }
  /* ── views ── */
  var VIEWS = {
    queue: { title: 'Queue', sub: 'What goes out next, in your posting plan.' }, calendar: { title: 'Calendar', sub: 'The week at a glance.' }, drafts: { title: 'Drafts', sub: 'Saved, not scheduled.' },
    sent: { title: 'Sent', sub: 'What went out, with a link to each post.' }, engage: { title: 'Engage', sub: 'Direct messages and mentions, answered in place.' }, live: { title: 'Go Live', sub: 'Plan a stream and announce it on your channels.' },
    channels: { title: 'Channels', sub: 'The accounts this desk posts to.' }, settings: { title: 'Settings', sub: 'Your posting plan and the publishing job.' },
  };
  function render() {
    var v = VIEWS[S.view] || VIEWS.queue; $('title').textContent = v.title; $('subtitle').textContent = v.sub; $('headActions').innerHTML = '';

    ({ queue: paintQueue, calendar: paintCalendar, drafts: paintDrafts, sent: paintSent, engage: paintEngage, live: paintLive, channels: paintChannels, settings: paintSettings })[S.view](body);
  }
  function jobBanner(body) {
    var scheduled = S.posts.some(function (p) { return p.status === 'scheduled'; });

    var active = S.job && S.job.status === 'active';
    var b = el('<div class="banner' + (active ? ' ok' : '') + '"><span class="sp">' + (active ? 'Your publishing job is on: scheduled posts go out within five minutes of their time.' : 'Scheduled posts go out when your publishing job is on. It runs every five minutes as you.') + '</span>' + (active ? '' : '<button class="btn primary" id="turnOn">Turn on</button>') + '</div>');
    if (!active) b.querySelector('#turnOn').onclick = turnOnJob;
    body.appendChild(b);
  }
  async function turnOnJob(ev) {
    var btn = ev.currentTarget; btn.disabled = true; btn.textContent = 'Turning on…';
    try {
      var job = await jobsRow();
      if (!job) throw new Error('The social-publish job is not offered on this installation.');
      if (job.status !== 'active') await json('/api/v1/agent/schedules/' + encodeURIComponent(job.id) + '/activate', { method: 'POST', body: JSON.stringify({ class: 'person' }) });

  }
  function alertLine(text) { var s = $('subtitle'); s.textContent = text; s.style.color = 'var(--bad)'; setTimeout(function () { s.style.color = ''; }, 6000); }
  function postCard(p, opts) {
    var when = p.status === 'sent' || p.status === 'partial' ? p.sentAt : p.scheduledAt;
    var acts = '';

    acts += '<button class="btn ghost danger" data-act="del">Delete</button>';

    card.addEventListener('click', function (e) { var b = e.target.closest('[data-act]'); if (b) act(b.getAttribute('data-act'), p, b); });
    return card;
  }
  async function act(kind, p, btn) {
    if (kind === 'edit') return openComposer(p);
    if (kind === 'del') { if (!confirm('Delete this post?')) return; await api('/posts/' + encodeURIComponent(p.id), { method: 'DELETE' }); return reloadPosts(); }
    if (kind === 'now') { btn.disabled = true; btn.textContent = 'Posting…'; try { var r = await api('/posts/' + encodeURIComponent(p.id) + '/publish', { method: 'POST', body: '{}' }); if (!r.ok) alertLine(firstFailure(r.post)); } catch (err) { alertLine(err.message); } return reloadPosts(); }
  }
  function firstFailure(post) { var o = post && post.outcomes || {}; for (var k in o) if (!o[k].ok) return (ch(k) || { label: k }).label + ': ' + (o[k].message || o[k].error); return 'Not posted.'; }

  }
  function paintQueue(body) {
    jobBanner(body);
    if (!S.channels.some(function (c) { return c.state === 'connected'; })) {
      var e = el('<div class="empty"><div class="big">✦</div><b>Connect a channel to start posting</b>X, LinkedIn, a Facebook Page, Slack. One post, every channel you pick.<br><br><button class="btn primary" id="goCh">Add a channel</button></div>');
      e.querySelector('#goCh').onclick = function () { setView('channels'); }; body.appendChild(e); return;
    }
    var q = S.posts.filter(function (p) { return p.status === 'scheduled' || p.status === 'sending' || p.status === 'failed' || p.status === 'partial'; });

  }
  function paintDrafts(body) { grouped(body, S.posts.filter(function (p) { return p.status === 'draft'; }), '<div class="empty"><div class="big">✎</div><b>No drafts</b>Save a post as a draft to finish it later.</div>'); }
  function paintSent(body) { grouped(body, S.posts.filter(function (p) { return p.status === 'sent'; }).slice().reverse(), '<div class="empty"><div class="big">✓</div><b>Nothing sent yet</b>Posts that went out show here, with a link to each.</div>'); }
  function weekStart(offset) { var d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - d.getDay() + offset * 7); return d; }
  function paintCalendar(body) {
    var start = weekStart(S.week), end = new Date(start); end.setDate(start.getDate() + 7);
    var h = $('headActions'); h.innerHTML = '';
    var prev = el('<button class="btn ghost" aria-label="Previous week"><svg><use href="#i-left"/></svg></button>'), today = el('<button class="btn">Today</button>'), next = el('<button class="btn ghost" aria-label="Next week"><svg><use href="#i-right"/></svg></button>');

    body.appendChild(wrap);

  /* ── engage ── */
  async function paintEngage(body) {

  }
  /* ── go live ── */
  function destLabel(id) { var d = (S.destinations || []).find(function (x) { return x.id === id; }); return d ? d.label : id; }
  function announcementTexts(f) {
    var when = f.startAt ? new Date(f.startAt) : null, day = when ? fmtDay(when.toISOString()) : '', time = when ? fmtTime(when.toISOString()) : '';

      { key: 'announce', label: 'Announce it now', text: '🎥 Going live ' + (day === 'Today' ? 'today' : day === 'Tomorrow' ? 'tomorrow' : day) + ' at ' + time + ': ' + f.title + ' — on ' + where + '.' + link, offsetMin: null },
      { key: 'soon', label: '15 minutes before', text: 'Starting in 15 minutes: ' + f.title + '. Come hang out on ' + where + '.' + link, offsetMin: -15 },
      { key: 'live', label: 'When it starts', text: "We're live now: " + f.title + (f.watchUrl ? ' 👉 ' + f.watchUrl : ' — on ' + where + '.'), offsetMin: 0 },
    ];
  }
  async function paintLive(body) {
    body.innerHTML = '';
    var h = $('headActions'); var plan = el('<button class="btn primary"><svg><use href="#i-plus"/></svg> Plan a stream</button>'); h.appendChild(plan);
    var listEl = el('<div></div>'); body.appendChild(listEl);
    var form = el('<div class="panel" id="liveForm" hidden><h3>Plan a stream</h3><div class="hint">Say where you go live and the desk announces it on your channels at the right times. Streaming itself runs in your usual app (OBS, Streamlabs, the platform studio); the console links open it.</div>'
      + '<div class="grid2"><div><label class="f">Title</label><input type="text" id="lvTitle" placeholder="Friday build night" /><label class="f">When</label><input type="datetime-local" id="lvAt" /><label class="f">Watch link (optional)</label><input type="url" id="lvUrl" placeholder="https://… where people watch" /></div>'
      + '<div><label class="f">Where you stream</label><div class="row" id="lvDest"></div><label class="f">Announce on</label><div class="row" id="lvCh"></div></div></div>'
      + '<label class="f">Announcements</label><div id="lvAnn"></div><div class="row" style="margin-top:12px"><button class="btn primary" id="lvSave">Save and announce</button><button class="btn ghost" id="lvCancel">Cancel</button><span class="status" id="lvStatus"></span></div></div>');
    body.insertBefore(form, listEl);
    var f = { title: '', startAt: '', watchUrl: '', destinations: [], channels: S.channels.filter(function (c) { return c.state === 'connected'; }).map(function (c) { return c.id; }), ann: {} };
    var def = new Date(Date.now() + 2 * 3600000); def.setMinutes(0, 0, 0); form.querySelector('#lvAt').value = localInput(def); f.startAt = def.toISOString();
    (S.destinations || []).forEach(function (d) { var t = el('<button class="tog"><span class="k"></span>' + esc(d.label) + '</button>'); t.onclick = function () { t.classList.toggle('on'); f.destinations = t.classList.contains('on') ? f.destinations.concat(d.id) : f.destinations.filter(function (x) { return x !== d.id; }); paintAnn(); }; form.querySelector('#lvDest').appendChild(t); });
    S.channels.filter(function (c) { return c.state === 'connected'; }).forEach(function (c) { var t = el('<button class="tog on">' + avatar(c) + esc(c.account && c.account.name ? c.account.name : c.label) + '</button>'); t.onclick = function () { t.classList.toggle('on'); f.channels = t.classList.contains('on') ? f.channels.concat(c.id) : f.channels.filter(function (x) { return x !== c.id; }); }; form.querySelector('#lvCh').appendChild(t); });
    function paintAnn() {
      var box = form.querySelector('#lvAnn'); box.innerHTML = '';
      announcementTexts(f).forEach(function (a) {
        if (!(a.key in f.ann)) f.ann[a.key] = { on: true, text: '' };
        var row = el('<div class="row" style="margin-bottom:8px;align-items:flex-start"><label class="tog' + (f.ann[a.key].on ? ' on' : '') + '" style="min-width:170px"><span class="k"></span>' + esc(a.label) + '</label><textarea style="min-height:52px;flex:1">' + esc(f.ann[a.key].text || a.text) + '</textarea></div>');
        row.querySelector('label').onclick = function () { f.ann[a.key].on = !f.ann[a.key].on; row.querySelector('label').classList.toggle('on', f.ann[a.key].on); };
        row.querySelector('textarea').oninput = function (e) { f.ann[a.key].text = e.target.value; };
        box.appendChild(row);
      });
    }
    ['lvTitle', 'lvUrl', 'lvAt'].forEach(function (id) { form.querySelector('#' + id).oninput = function (e) { if (id === 'lvTitle') f.title = e.target.value; if (id === 'lvUrl') f.watchUrl = e.target.value; if (id === 'lvAt') f.startAt = e.target.value ? new Date(e.target.value).toISOString() : ''; Object.keys(f.ann).forEach(function (k) { f.ann[k].text = ''; }); paintAnn(); }; });
    paintAnn();
    plan.onclick = function () { form.hidden = false; form.querySelector('#lvTitle').focus(); };
    form.querySelector('#lvCancel').onclick = function () { form.hidden = true; };
    form.querySelector('#lvSave').onclick = async function () {
      var st = form.querySelector('#lvStatus'); st.textContent = 'Saving…'; st.className = 'status';
      var start = Date.parse(f.startAt);
      var announcements = announcementTexts(f).filter(function (a) { return f.ann[a.key].on; }).map(function (a) { return { key: a.key, text: f.ann[a.key].text || a.text, channels: f.channels, at: a.offsetMin == null ? new Date().toISOString() : new Date(start + a.offsetMin * 60000).toISOString() }; });
      try { await api('/events', { method: 'POST', body: JSON.stringify({ title: f.title, startAt: f.startAt, watchUrl: f.watchUrl, destinations: f.destinations, announcements: announcements }) }); form.hidden = true; await reloadPosts(); }
      catch (err) { st.textContent = err.message; st.className = 'status bad'; }
    };
    var r; try { r = await api('/events'); } catch (err) { listEl.innerHTML = '<div class="empty">' + esc(err.message) + '</div>'; return; }
    S.events = r.events || [];
    if (!S.events.length) { listEl.innerHTML = '<div class="empty"><div class="big">📡</div><b>No streams planned</b>Plan a stream: pick where you go live, and the desk announces it on your channels before and when you start.</div>'; return; }
    S.events.forEach(function (ev) {
      var dests = ev.destinations.map(function (id) { var d = (S.destinations || []).find(function (x) { return x.id === id; }) || { id: id, label: id }; return '<a class="chip" href="' + esc(d.console || '#') + '" target="_blank" rel="noopener"><i style="background:' + (DEST_COLOR[id] || 'var(--muted)') + '"></i>' + esc(d.label) + ' console</a>'; }).join('');
      var posts = ev.posts.map(function (p) { return '<span class="chip ' + (p.status === 'sent' ? 'ok' : p.status === 'failed' ? 'bad' : '') + '">' + esc(p.status === 'sent' ? 'sent ' + fmtTime(p.sentAt) : p.status === 'scheduled' ? 'announces ' + fmtDay(p.scheduledAt) + ' ' + fmtTime(p.scheduledAt) : p.status) + '</span>'; }).join('');
      var card = el('<div class="post"><div class="time">' + esc(fmtTime(ev.startAt)) + '<small>' + esc(fmtDay(ev.startAt)) + '</small></div><div><div class="txt"><b>' + esc(ev.title) + '</b>' + (ev.watchUrl ? ' · <a href="' + esc(ev.watchUrl) + '" target="_blank" rel="noopener">watch link</a>' : '') + '</div><div class="meta">' + dests + '</div><div class="meta">' + posts + '</div></div><div class="acts"><button class="btn ghost danger" data-act="del">Delete</button></div></div>');
      card.querySelector('[data-act=del]').onclick = async function () { if (!confirm('Delete this stream and its unsent announcements?')) return; await api('/events/' + encodeURIComponent(ev.id), { method: 'DELETE' }); reloadPosts(); };
      listEl.appendChild(card);
    });
  }
  /* ── channels ── */
  function connectUrl(c) { return '/api/connect/' + encodeURIComponent(c.connect) + '/start?return=' + encodeURIComponent('/utilities?connected=' + encodeURIComponent(c.connect) + '&window=connect'); }
  function paintChannels(body) {
    var cards = el('<div class="cards"></div>');

      var slack = c.id === 'slack' && c.state === 'connected' ? '<label class="f">Posts go to</label><select data-c="slackch"><option value="">Choose a channel…</option></select>' : '';
      var card = el('<div class="ccard"><div class="top">' + avatar(c, 'lg') + '<div class="who">' + who + '</div></div><span class="state ' + esc(c.state) + '"><i></i>' + state + (c.note ? ' · ' + esc(c.note) : '') + '</span>' + slack + '<div class="acts">' + acts + '</div></div>');
      card.addEventListener('click', function (e) { var b = e.target.closest('[data-c]'); if (!b || b.tagName === 'SELECT') return; if (b.getAttribute('data-c') === 'post') openComposer({ channels: [c.id] }); else connect(c, b); });
      if (slack) fillSlack(card.querySelector('select'), c);
      cards.appendChild(card);
    });
    body.appendChild(cards);
    var more = S.channels.filter(function (c) { return !configured(c) && c.state !== 'connected' && c.state !== 'reconnect'; });
    if (more.length) body.appendChild(el('<p class="hint" style="color:var(--muted);font-size:12.5px;margin-top:16px">Not offered on this installation yet: ' + esc(more.map(function (c) { return c.label; }).join(', ')) + '. An administrator registers the provider app under Utilities &amp; Connectors.</p>'));
  }
  async function fillSlack(sel, c) {
    sel.onchange = async function () { var o = sel.options[sel.selectedIndex]; S.settings = await api('/settings', { method: 'PUT', body: JSON.stringify({ slackChannel: sel.value, slackLabel: o ? o.textContent : '' }) }); c.slackChannel = sel.value; c.slackLabel = o ? o.textContent : ''; };
    try { var r = await api('/slack/channels'); (r.channels || []).forEach(function (x) { var o = document.createElement('option'); o.value = x.id; o.textContent = (x.isPrivate ? '🔒 ' : '#') + x.name; if (x.id === (S.settings && S.settings.slackChannel)) o.selected = true; sel.appendChild(o); }); }
    catch (err) { var o = document.createElement('option'); o.textContent = 'Could not list channels: ' + err.message; sel.appendChild(o); }
  }
  function connect(c, btn) {
    btn.disabled = true; btn.textContent = 'Waiting for ' + c.label + '…';
    var w = window.open(connectUrl(c), '_blank', 'noopener');
    if (!w) { window.top.location.href = connectUrl(c); return; }
    var started = Date.now(), timer = setInterval(async function () {
      if (Date.now() - started > 600000) { clearInterval(timer); btn.disabled = false; btn.textContent = 'Connect ' + c.label; return; }
      var r = await api('/channels?identity=1').catch(function () { return null; }); if (!r) return;
      var fresh = (r.channels || []).find(function (x) { return x.id === c.id; });
      if (fresh && fresh.state === 'connected') { clearInterval(timer); S.channels = r.channels; paintRail(); render(); }
    }, 4000);
  }
  /* ── settings ── */
  function paintSettings(body) {
    var s = S.settings || { plan: { days: [1, 2, 3, 4, 5], times: ['09:00', '12:30', '17:00'] }, timezone: '' };
    var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var plan = el('<div class="panel"><h3>Posting plan</h3><div class="hint">"Add to queue" puts a post at the next free time here, in ' + esc(s.timezone || 'your time zone') + '.</div><label class="f">Days</label><div class="row" id="plDays"></div><label class="f">Times</label><div class="times" id="plTimes"></div><div class="row" style="margin-top:10px"><input type="time" id="plNew" style="width:150px" /><button class="btn" id="plAdd">Add time</button><span class="status" id="plStatus"></span></div></div>');
    days.forEach(function (d, i) { var t = el('<button class="tog' + (s.plan.days.indexOf(i) >= 0 ? ' on' : '') + '"><span class="k"></span>' + d + '</button>'); t.onclick = function () { var on = s.plan.days.indexOf(i) >= 0; s.plan.days = on ? s.plan.days.filter(function (x) { return x !== i; }) : s.plan.days.concat(i); savePlan(); }; plan.querySelector('#plDays').appendChild(t); });
    s.plan.times.forEach(function (t) { var c = el('<span class="chip">' + esc(new Date('2000-01-01T' + t + ':00').toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })) + '<button aria-label="Remove">×</button></span>'); c.querySelector('button').onclick = function () { s.plan.times = s.plan.times.filter(function (x) { return x !== t; }); savePlan(); }; plan.querySelector('#plTimes').appendChild(c); });
    plan.querySelector('#plAdd').onclick = function () { var v = plan.querySelector('#plNew').value; if (!v) return; if (s.plan.times.indexOf(v) < 0) s.plan.times.push(v); savePlan(); };
    async function savePlan() { var st = plan.querySelector('#plStatus'); st.textContent = 'Saving…'; try { S.settings = await api('/settings', { method: 'PUT', body: JSON.stringify({ plan: s.plan }) }); render(); } catch (err) { st.textContent = err.message; st.className = 'status bad'; } }
    body.appendChild(plan);
    var active = S.job && S.job.status === 'active';
    var job = el('<div class="panel"><h3>Publishing job</h3><div class="hint">Scheduled posts and announcements go out from a job that runs every five minutes as you. Post now never needs it.</div><div class="row"><span class="state ' + (active ? 'connected' : '') + '"><i></i>' + (S.job ? (active ? 'On' : 'Off') : 'Not offered on this installation') + '</span>' + (S.job && !active ? '<button class="btn primary" id="jobOn">Turn on</button>' : '') + '<a class="btn ghost" href="/swarm-admin/jobs" target="_blank" rel="noopener">All jobs <svg><use href="#i-ext"/></svg></a></div></div>');
    if (S.job && !active) job.querySelector('#jobOn').onclick = turnOnJob;
    body.appendChild(job);
    var slack = ch('slack');
    if (slack && slack.state === 'connected') { var sp = el('<div class="panel"><h3>Slack</h3><div class="hint">Posts to Slack go to this channel of your workspace.</div><select id="setSlack"><option value="">Choose a channel…</option></select></div>'); body.appendChild(sp); fillSlack(sp.querySelector('select'), slack); }
  }
  /* ── composer ── */
  function openComposer(p, keepDate) {
    S.editing = p && p.id ? p : null;
    S.sel = (p && p.channels ? p.channels.slice() : []).filter(function (id) { var c = ch(id); return c && c.state === 'connected'; });
    if (!S.sel.length && !(p && p.channels && p.channels.length)) S.sel = S.channels.filter(function (c) { return c.state === 'connected'; }).map(function (c) { return c.id; });
    S.variants = Object.assign({}, p && p.variants || {}); S.tab = 'all';
    $('cTitle').textContent = S.editing ? 'Edit post' : 'New post';
    $('cText').value = p && p.text || ''; S.base = $('cText').value; $('cMedia').value = p && p.mediaUrl || ''; $('cStatus').textContent = ''; $('cStatus').className = 'status';
    $('cWhen').classList.remove('open'); $('cMenu').classList.remove('open');
    var at = p && p.scheduledAt ? new Date(p.scheduledAt) : new Date(Date.now() + 3600000); $('cAt').value = localInput(at);
    if (keepDate) { $('cWhen').classList.add('open'); }
    paintComposerChannels(); paintTabs(); paintPreview();
    $('scrim').classList.add('open'); $('cText').focus();
  }
  function closeComposer() { $('scrim').classList.remove('open'); }
  function paintComposerChannels() {
    var box = $('cChannels'); box.innerHTML = '';
    S.channels.filter(function (c) { return c.state === 'connected' || configured(c); }).forEach(function (c) {
      var on = S.sel.indexOf(c.id) >= 0, b = el('<button class="avtog' + (on ? ' on' : '') + '" title="' + esc(c.account ? c.account.name + ' · ' + c.label : c.state === 'connected' ? c.label : 'Connect ' + c.label) + '" aria-pressed="' + on + '">' + avatar(c) + '</button>');
      b.onclick = function () { if (c.state !== 'connected') { closeComposer(); setView('channels'); return; } if (on) S.sel = S.sel.filter(function (x) { return x !== c.id; }); else S.sel.push(c.id); if (S.tab !== 'all' && S.sel.indexOf(S.tab) < 0) S.tab = 'all'; paintComposerChannels(); paintTabs(); paintPreview(); };
      box.appendChild(b);
    });
    if (!S.channels.some(function (c) { return c.state === 'connected'; })) box.appendChild(el('<span class="status">Connect a channel first (Channels).</span>'));
  }
  function activeText(id) { return (id && S.variants[id]) || $('cText').value; }
  function paintTabs() {
    var tabs = $('cTabs'); tabs.innerHTML = '';
    if (S.sel.length < 1) { $('cCount').textContent = ''; $('cHint').textContent = ''; return; }
    var all = el('<button' + (S.tab === 'all' ? ' class="on"' : '') + '>All channels</button>'); all.onclick = function () { S.tab = 'all'; $('cText').value = $('cText').value; paintTabs(); paintPreview(); }; tabs.appendChild(all);
    S.sel.forEach(function (id) { var c = ch(id), n = activeText(id).length, over = n > c.limit;
      var b = el('<button' + (S.tab === id ? ' class="on"' : '') + '><i style="width:8px;height:8px;border-radius:50%;background:' + c.color + ';display:inline-block"></i>' + esc(c.label) + ' <span class="c' + (over ? ' over' : '') + '">' + n + '/' + c.limit + '</span>' + (S.variants[id] ? ' ✎' : '') + '</button>');
      b.onclick = function () { S.tab = id; paintTabs(); paintPreview(); }; tabs.appendChild(b); });
    var ta = $('cText');
    if (S.tab === 'all') { ta.placeholder = 'What do you want to say? Write it once; customize per channel if you like.'; ta.value = S.base != null ? S.base : ta.value; }

    paintCount();
  }
  function paintCount() {
    var text = $('cText').value, n = text.length;
    if (S.tab === 'all') { var tight = S.sel.map(function (id) { return ch(id); }).sort(function (a, b) { return a.limit - b.limit; })[0]; $('cCount').innerHTML = tight ? '<span class="' + (n > tight.limit ? 'over' : '') + '">' + n + '</span> / ' + tight.limit + ' (' + esc(tight.label) + ' is the tightest)' : n + ' characters'; $('cHint').textContent = S.sel.length > 1 ? 'Click a channel tab to customize its text' : ''; }
    else { var c = ch(S.tab); $('cCount').innerHTML = '<span class="' + (n > c.limit ? 'over' : '') + '">' + n + '</span> / ' + c.limit; $('cHint').textContent = S.variants[S.tab] ? 'Custom text for ' + c.label : 'Using the shared text'; }
  }
  function paintPreview() {
    var id = S.tab !== 'all' ? S.tab : S.sel[0], c = id ? ch(id) : null, text = c ? activeText(c.id) : $('cText').value, media = $('cMedia').value.trim();
    $('pLabel').textContent = c ? c.label + ' preview' : 'Preview';
    var who = c ? avatar(c) + '<div><b>' + esc(c.account && c.account.name ? c.account.name : c.label) + '</b><span>' + esc(c.account && c.account.handle ? c.account.handle : 'now') + '</span></div>' : '<div><b>Your post</b><span>Pick a channel</span></div>';
    $('pCard').innerHTML = '<div class="ph2">' + who + '</div><div class="pt">' + (esc(text) || '<span style="color:var(--muted)">Your words show here as people will see them.</span>') + '</div>' + (/^https:\/\//i.test(media) ? '<img src="' + esc(media) + '" alt="" />' : '');
  }
  $('cText').addEventListener('input', function () { if (S.tab === 'all') S.base = $('cText').value; else { var v = $('cText').value; if (v === S.base || !v) delete S.variants[S.tab]; else S.variants[S.tab] = v; } paintCount(); paintTabs(); paintPreview(); });
  $('cMedia').addEventListener('input', paintPreview);
  function payload(when) { if (S.tab === 'all') S.base = $('cText').value; return { text: S.base != null ? S.base : $('cText').value, channels: S.sel, variants: S.variants, mediaUrl: $('cMedia').value.trim(), when: when }; }
  async function send(when) {
    var st = $('cStatus'); st.className = 'status'; st.textContent = when === 'now' ? 'Posting…' : 'Saving…';
    var body = payload(when);
    try {
      var r = S.editing ? await api('/posts/' + encodeURIComponent(S.editing.id), { method: 'PATCH', body: JSON.stringify(body) }) : await api('/posts', { method: 'POST', body: JSON.stringify(body) });
      if (S.editing && when === 'now') r = await api('/posts/' + encodeURIComponent(S.editing.id) + '/publish', { method: 'POST', body: '{}' });
      if (when === 'now' && r.post && r.post.status !== 'sent') { st.className = 'status bad'; st.textContent = firstFailure(r.post); await reloadPosts(); return; }
      closeComposer(); S.base = null; await reloadPosts();
      if (when === 'draft') setView('drafts'); else if (when === 'now') setView('sent'); else setView('queue');
    } catch (err) { st.className = 'status bad'; st.textContent = err.message + (err.body && err.body.channel ? ' (' + (ch(err.body.channel) || {}).label + ')' : ''); }
  }
  $('cQueue').onclick = function () { send('queue'); }; $('cNow').onclick = function () { send('now'); }; $('cDraft').onclick = function () { send('draft'); };
  $('cMore').onclick = function (e) { e.stopPropagation(); $('cMenu').classList.toggle('open'); };
  $('cMenu').querySelector('.dd').addEventListener('click', function (e) { var b = e.target.closest('[data-send]'); if (!b) return; $('cMenu').classList.remove('open'); var k = b.getAttribute('data-send'); if (k === 'schedule') { $('cWhen').classList.add('open'); $('cAt').focus(); } else send(k); });
  $('cSchedule').onclick = function () { var v = $('cAt').value; if (!v) return; send(new Date(v).toISOString()); }; $('cWhenX').onclick = function () { $('cWhen').classList.remove('open'); };
  $('cClose').onclick = closeComposer; $('scrim').addEventListener('click', function (e) { if (e.target === $('scrim')) closeComposer(); });
  document.addEventListener('click', function () { $('cMenu').classList.remove('open'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeComposer(); });
  $('newPost').onclick = function () { S.base = null; openComposer(null); };
  document.querySelectorAll('.nav button').forEach(function (b) { b.addEventListener('click', function () { setView(b.getAttribute('data-view')); }); });
  var want = new URLSearchParams(location.search).get('view'); if (want && VIEWS[want]) S.view = want;
  document.querySelectorAll('.nav button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-view') === S.view); });
  loadAll();
})();
