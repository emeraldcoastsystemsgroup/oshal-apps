# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | Register all shipped package tests with explicit runner and fixture boundaries; retain readiness smoke identity.
# 2 | maintainer@emeraldcoastsystemsgroup.com | 1.3.0: register the Outlook Graph adapter and provider switch unit case, the surface mailbox-switch case, and the cross-user mailbox denial case (real kernel broker, forced-RLS disposable PostgreSQL); none contacts a mailbox.
# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.4.0: extend the three cases to the Yahoo leg (switch, list-only surface row, real core IMAP reader against a loopback responder); the isolation case needs a framework checkout carrying core's imap-mail-reader.
# 4 | maintainer@emeraldcoastsystemsgroup.com | 1.4.0: the isolation case also expects 409 no_mail_connection from message, draft and send for a caller with no mailbox (the Yahoo fallback is list, digest and summary only).
# 5 | maintainer@emeraldcoastsystemsgroup.com | 1.4.1: register the audience view contract of My Day (ADR-164 D6): the company view for the Business shell reads only the digest and the saved digest on open, writes a new digest only on a click, and names each empty, refused and failed state.
# 6 | maintainer@emeraldcoastsystemsgroup.com | 1.4.2: the family audience view registered beside the company one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
# 7 | maintainer@emeraldcoastsystemsgroup.com | Register the native-kernel egress case: mailbox, calendar, send and Social profile requests reach their declared hosts with no credential and map to the package's rows; missing or lapsed connections keep the 409s.
# 8 | maintainer@emeraldcoastsystemsgroup.com | surface-provider and audience-view: the surfaces no longer offer Yahoo (no Yahoo connector on this installation; its runtime answers a Yahoo read 501). No switch option, a saved Yahoo choice falls back to the server's pick, and the no-mailbox notices name Google and Outlook only.
# 9 | maintainer@emeraldcoastsystemsgroup.com | Register email-send-tool: the approval-held send tool and its persona rule.
# 10 | maintainer@emeraldcoastsystemsgroup.com | 1.4.8: the kernel-egress case also expects a Gmail search to look for the person's words over the window across all mail, and the email-messages tool to send query, days and max.
# 11 | maintainer@emeraldcoastsystemsgroup.com | 1.5.0: register mail-store: the stored Gmail copy (sync, deadline, failure, search, owner isolation, kernel-safe SQL, the /messages, /sync and /sync/status routes) on a disposable PostgreSQL with forced row security; and mail-store-browser: the Inbox's search box and copy line in Chromium.
# 12 | maintainer@emeraldcoastsystemsgroup.com | 1.5.1: mail-store expects a pass to resume below and above the copy instead of re-reading it, and a filling copy to answer only windows it reaches.
# 10 | maintainer@emeraldcoastsystemsgroup.com | 1.6.0: register the Social desk cases: social-rules (the posting plan's next slot, post normalization, every publish through the kernel egress with no credential, partial sends and retries, the due pass budget, Engage and replies), social-store (the three tables on a disposable PostgreSQL under forced owner row security) and social-desk-browser (the desk in Chromium over a loopback fixture at 1280 and 412).
# -----------------------------------------------------------------------------
version: 1
cases:
  - id: package-readiness
    name: Installed package readiness
    purpose: Verify the existing metadata-only readiness probe without provider or user-data access.
    level: integration
    runner:
      kind: smoke
      smoke: package-readiness
    expected:
      - The installed email-summarizer package identity satisfies its manifest smoke assertions.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: safe-smoke
  - id: session-crypto
    name: Digest encryption contract
    purpose: Exercise the compiled encryption helper with synthetic secrets and inspect digest route wiring.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/session-crypto.test.mjs
    expected:
      - Missing SESSION_SECRET fails closed and randomized authenticated envelopes round-trip.
      - Compiled digest writes and reads preserve the required-secret error.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: outlook-mailbox
    name: Outlook adapter and provider switch
    purpose: Exercise the compiled Microsoft Graph adapter and the google|outlook switch with a recording fetch - no network, credentials or framework checkout.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/outlook-mailbox.test.mjs
    expected:
      - Graph messages normalize onto MailSummary with unread, important and starred derived from isRead, importance and the follow-up flag.
      - The inbox list is one fixed Graph request with a clamped $top and receivedDateTime window; pagination stops at the cap and after five pages.
      - A nextLink off graph.microsoft.com or outside /me is never followed.
      - Message ids are URL-encoded, the text body is preferred and an HTML body is flattened.
      - A named provider resolves alone with no fallback; a refused refresh reports reconnect_required.
      - Yahoo is accepted by the switch but is never a brokered-token provider, so its app password cannot be resolved by the package.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: kernel-egress
    name: Native kernel mail egress
    purpose: Drive the compiled mail routes with OSHAL_EGRESS=kernel, the bridge's inert framework stand-ins, synthetic connection metadata and a recording fetch - no network or credentials.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/kernel-egress.test.cjs
    expected:
      - Gmail, Calendar, Graph and Facebook requests go to gmail.googleapis.com, www.googleapis.com, graph.microsoft.com and graph.facebook.com with no Authorization, Prefer or access_token.
      - Gmail answers map to the same bounded summaries; Graph answers to the same rows; the digest counts them.
      - The default mailbox follows the caller's connection metadata (Google first); no or a lapsed connection answers the same 409s, and so does a kernel "not connected" refusal or a 401.
      - A confirmed Gmail send posts the fenced MIME (CRLF flattened); a confirmed Outlook send posts Graph sendMail JSON; neither uses the inert framework sender.
      - Outside the kernel the broker token still travels as a Bearer header.
      - A search reaches Gmail as the person's words plus newer_than:<days>d over all mail (a search naming its own date keeps it; one line, at most 300 characters); no words list the inbox; email-messages declares query, days and max on its route.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: mail-store
    name: Stored Gmail copy
    purpose: Sync and search the person's stored mail copy with the compiled store and routes on a uniquely named disposable PostgreSQL database carrying the declared migration and forced owner row security; Gmail is a scripted reader and a recording fetch - no network or credentials.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/mail-store.test.cjs
    expected:
      - A first pass stores mail newest first back 180 days; a later pass fetches only new mail; a duplicate is skipped.
      - A pass that reaches its deadline keeps what it stored; the next pass asks Gmail only for mail newer and older than the copy, never the stored range again; a state left by passes that did not resume picks up from its last run.
      - A copy still filling answers only a window it reaches; a longer search reads Gmail live.
      - A failed Gmail read keeps the stored mail, records the failure on the state and is reported.
      - A search matches words at word starts (prep finds preparation, act is not found inside contact), honours OR, from: and newer_than:, and lists the closest matches marked matchedAll false when no message holds every word.
      - Under forced row security one person never reads, describes or writes another person's copy.
      - The store SQL has no ON CONFLICT, ORDER BY, DISTINCT or OFFSET.
      - GET /messages reads Gmail live until a pass has run and when the copy is over 30 minutes old, and answers from the copy (source stored, up to 180 days, no Gmail request) once POST /sync has stored it; GET /sync/status reports the copy and the mail-copy schedule.
    prerequisites: [runner:node-test, fixture:postgres-35689]
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: Drop only the suite's own uniquely named database and role; preserve the shared PostgreSQL server.
    limits: { timeoutMs: 60000, maxMemoryMb: 256 }
    installation: never
  - id: mail-store-browser
    name: Inbox stored-copy controls
    purpose: Drive the Inbox page and email-store.js in Chromium over a loopback fixture of the email and schedule routes - no network, mailbox or credentials.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/mail-store-browser.test.cjs
    expected:
      - Before a copy exists the line says search reads Gmail directly (30 days) and offers Keep a copy.
      - Keep a copy activates the person's mail-copy job with class person and runs one POST /api/email/sync; the line then gives the count, how far back, when it was updated and that it updates every 10 minutes, with Update now.
      - Search all your mail asks GET /api/email/messages with the words and days=180, lists the stored matches, and a match opens in the reader.
      - A failed pass shows its reason and keeps the button; at 412 px the page does not scroll sideways.
    prerequisites: [runner:node-test, browser:chromium]
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: Close the loopback fixture server and the browser.
    limits: { timeoutMs: 60000, maxMemoryMb: 512 }
    installation: never
  - id: surface-provider
    name: Inbox and My Day mailbox switch
    purpose: Run the two surface scripts in a node:vm context with a minimal DOM and a recording fetch; this is not a browser receipt.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/surface-provider.test.mjs
    expected:
      - The chosen mailbox reaches the API as ?provider=, and an unknown saved value falls back to the server default.
      - Opening and drafting a message stay on the mailbox the list used; the My Day summary follows the digest's mailbox.
      - A missing connection shows the matching Connect notice linking to /utilities.
      - A Yahoo list the server picks opens from the list data alone, with no message or draft request.
      - No surface offers Yahoo; a saved Yahoo choice is not requested and the no-mailbox notice names Google and Outlook only.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: mailbox-isolation
    name: Cross-user mailbox denial
    purpose: Mount the packaged /api/email routes over loopback HTTP on the real kernel token broker and production per-user envelope crypto, against a disposable PostgreSQL with core migrations 060, 100 and 101 (FORCE row-level security) and a NOBYPASSRLS runtime role. Yahoo goes through core's real fixed IMAP reader to a loopback IMAP responder. The Gmail, Calendar and Graph hosts and the communications-bot dispatch are recording seams.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/isolation.core.test.js
    expected:
      - The runtime role sees only the stamped owner's connections and a forged row in another user's name is refused.
      - A user without an Outlook connection gets 409 for list, read, digest and summary, and no token of another user is ever sent.
      - Another user's Gmail message id is requested only with the caller's own token.
      - Each summary prompt reaches communications-bot with only its owner's rows.
      - A provider outside google|outlook|yahoo is 400, no session is 401, and a send without confirmation is 428 before any connection is used.
      - A user without a Yahoo grant gets 409 for Yahoo list, digest and summary and no IMAP session opens; the owner's Yahoo list uses a read-only session and the summary carries only the owner's rows.
      - Yahoo message, draft and send answer 400 without contacting Yahoo.
      - A caller with no mailbox who names no provider gets 409 no_mail_connection from list, message, draft and send, and no IMAP session opens.
    prerequisites:
      - runner:vitest
      - harness:oshal-core-root
      - harness:core-test-fixtures
      - engine-container:disposable-postgres
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures:
        - tests/email-mailbox-isolation.spec.ts
        - tests/mailbox.config.mjs
      cleanup: The suite closes its loopback server, restores fetch and its environment, and stops its own PostgreSQL container including anonymous volumes.
    limits:
      timeoutMs: 300000
      maxMemoryMb: 1024
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell) and family (Home shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the company view reads only GET /api/email/digest (with the mailbox picked in My Day) and /summary/cached; never POST /summary.
      - The counts are labelled as a sample of the newest 25 messages of the last day; flagged mail, today's calendar (all-day events named) and senders show what the digest returned.
      - A new digest is written only when the reader clicks Summarize my day, once even on a double click, and a refused run is named.
      - A mailbox that is not connected, a core without a Yahoo reader, a refusal and a failed read each read as what they are.
      - Under an audience view the full page binds no mailbox switch and reads nothing.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: mailbox-connect
    name: Connect notices start the mailbox provider's own sign-in
    purpose: >-
      Run the shipped connect notice of My Day and Inbox: one button per mailbox provider starts that provider's
      sign-in through the kernel's authorize step at the top level ('Connect Google or Outlook' opened the unfiltered
      Connections page), an All connections link stays, and a refused or insecure sign-in is said without navigating.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/mailbox-connect.test.cjs
    expected:
      - No mailbox offers Connect Google (Gmail) and Connect Outlook / Microsoft 365; a missing Outlook offers only Outlook.
      - A button fetches /connectors/<id>/authorize and navigates only to an https sign-in address.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: email-send-tool
    name: Send an email behind an approval card
    purpose: email-send is approval-held on POST /api/email/send with confirm true, a recipient and a body required, and the
      persona sends only through it.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
      - tests/email-send-tool.test.cjs
    expected:
    - Every assertion passes.
    prerequisites:
    - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: social-rules
    name: Social desk rules and publish paths
    purpose: Exercise the posting plan, post normalization and every channel's publish, identity, Engage and reply path with a recording fetch under OSHAL_EGRESS=kernel - no network, database, accounts or credentials.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/social-rules.test.cjs
    expected:
      - Add to queue takes the next plan time in the person's zone, skipping off days and taken slots; an empty plan falls back to the default.
      - A post needs a channel and text; a text over a channel's cap, a past time and a non-https image are refused; a variant equal to the shared text is not kept.
      - X, LinkedIn, Slack, a Facebook Page and Mastodon each receive exactly their provider request with no Authorization header; a kernel not-connected refusal is the channel's 409, Slack without a chosen channel a 400, a provider error a 502 naming the status.
      - Posting now to two channels where one refuses ends partial with the refusal recorded, and a retry sends only the channel that failed.
      - The due pass sends what is due, leaves what is not, and stops at its budget for the next pass.
      - Engage lists Slack DMs and mentions and X mentions newest first; a reply goes to the Slack thread or as an X reply.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation:
      mode: disposable
    limits: { timeoutMs: 30000, maxMemoryMb: 256 }
    installation: never
  - id: social-store
    name: Social desk tables under row security
    purpose: Apply migration 002 to a disposable PostgreSQL and drive posts, settings and events through two people's pools under forced owner row security.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/social-store.test.cjs
    expected:
      - The migration and the store hold no ON CONFLICT, ORDER BY or DISTINCT; the migration applies twice.
      - A post is stored, listed in send order, read by key, edited, found by the due read only when scheduled and due, and deleted; one person never reads, edits or deletes another's.
      - Settings default, save, keep the fields not given, and a row stored between the read and the insert is updated rather than an error.
      - Deleting an event removes its unsent announcements and keeps the sent ones.
    prerequisites: [runner:node-test, env:OSHAL_TEST_POSTGRES]
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: Drop only the suite's own uniquely named database and role; preserve the shared PostgreSQL server.
    limits: { timeoutMs: 60000, maxMemoryMb: 256 }
    installation: never
  - id: social-desk-browser
    name: Social desk in the browser
    purpose: Drive tools/email-social.html in Chromium over a loopback fixture of the desk routes, the schedules API and the connector list - no network, accounts or credentials.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/social-desk-browser.test.cjs
    expected:
      - The rail names the connected X and Slack accounts and shows LinkedIn as not connected; the queue starts empty.
      - New post opens the composer with the connected channels on; the counter names the tightest channel; a channel tab keeps its own text; Add to queue sends one POST /posts with the shared text, the variant and when=queue, and the post lists under its day.
      - The banner's Turn on activates the social-publish job with class person.
      - Go Live's Plan a stream sends the event with its destinations and three announcements on the chosen channels; Channels offers Connect for an unconnected account and saving the Slack channel writes the settings.
      - At 412 px the page does not scroll sideways and every rail action stays reachable.
    prerequisites: [runner:node-test, browser:chromium]
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: Close the loopback fixture server and the browser.
    limits: { timeoutMs: 90000, maxMemoryMb: 512 }
    installation: never
