# -----------------------------------------------------------------------------
# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — email-summarizer (Intelligent Communication, ADR-037)
#
# THE REFERENCE COMMS IMPLEMENTATION: this is the app ADR-037 describes — a
# per-user connector (Gmail), a codex bot that runs scripts/oshal-gmail.js in
# its own sandbox, and a cockpit surface. Originally emitted by codex-packer
# (the kernel keeps the archived emission at ai-lab/packer-emissions/).
#
# Carved out of OSHAL core 2026-07-19 (ADR-085 Wave 3, "skill with a surface" —
# ONLY the surface carves). What STAYS framework-resident per ADR-093:
#   - the communications-bot REAL node (email-bot container + BOTH registry
#     blocks b0…0001 + the core ai-lab/bot-personas/email-summarizer.yaml
#     persona) — the persona here is a package COPY for the registrar;
#   - the kernel email-send machinery at @/app/routes/email-routes: sendGmail
#     (with the header-injection fence — every header-bound value CRLF-flattened
#     at the ONE MIME builder) + sendOutlookMail + summarizeGmailMetadata —
#     notify-routes, jarvis-brief-cron, and other store packages send through
#     it, so this package IMPORTS it instead of forking the builder;
#   - the gmail/google connector + scripts/oshal-gmail.js (the codex bot's
#     shell-out leg), scripts/oshal-outlook.js + scripts/oshal-twilio.js (the
#     M365 + phone/text legs, with the CLI-level no-send confirm gate);
#   - the inbox-ingest/Signals engine (oshal_inbox_messages) — the Social app's
#     Signals view reads it; this app's ingest never owned it.
# This package is the app: the inbox/my-day/social surfaces + the /api/email
# routes (read + AI summary/draft on the bot + the no-send 428-gated /send) +
# the app's own oshal_email_digests store (owner-RLS at the lazy-DDL chokepoint).
# Framework: OSHAL (see docs/build-your-own-swarm-app.md)
# ─────────────────────────────────────────────────────────────────────────────

name: email-summarizer
suite: ai-productivity   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 64, high: 256, basis: declared }
  features:
    - id: day-summary
      unit: day summary
      tier: T2
      generation: none
      degrade: disable
    - id: reply-draft
      unit: reply draft
      tier: T2
      generation: none
      degrade: disable
    - id: comms-ticket
      unit: communications ticket
      tier: T3
      generation: none
      degrade: disable
displayName: Intelligent Communication
description: >-
  Your inbox, calendar, social channels and day in one surface. Reads the signed-in
  user's own connected Gmail + Google Calendar or Outlook / Microsoft 365 mail +
  calendar, builds a prioritized "My Day" digest, drafts replies with the
  communications bot, and publishes to the person's own X, LinkedIn, Facebook
  Page, Slack and Mastodon accounts from a Buffer-style desk: write once,
  customize per channel, add to the queue, schedule or post now, answer Slack
  and X mentions in place, and announce a live stream on every channel. Sending
  mail is a single explicit-confirm gated action; every social publish goes out
  on the person's own connection through the kernel. The bot does the reasoning
  on its own harness/model with cost captured per user.
version: 1.6.1
testing:
  version: 1
  catalog: tests/test-lab.yaml
uses: [test-catalog, app-dependencies]
status: active

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: email-summarizer
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/email-summarizer/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# Runtime connector allow-list — the mailbox/calendar provider, the M365 + phone
# legs the bot's broker hands tokens for, and the Social tab's identity read.
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: []
    tools: []
    connectors: [google, outlook, yahoo, twilio, facebook, meta-business, twitter, linkedin, slack, mastodon]

# Outbound hosts (native kernel): the sandbox has no network and no token broker, so every mailbox,
# calendar, send and profile request goes through the kernel's fenced egress, which applies the
# caller's own connection for that host as the Authorization header. This package never holds a token.
egress:
  - host: gmail.googleapis.com
    credential: { connector: gmail, header: authorization, prefix: "Bearer " }
  - host: www.googleapis.com
    credential: { connector: google-calendar, header: authorization, prefix: "Bearer " }
  - host: graph.microsoft.com
    credential: { connector: outlook, header: authorization, prefix: "Bearer " }
  - host: graph.facebook.com
    credential: { connector: facebook, header: authorization, prefix: "Bearer " }
  # The Social desk's publish channels: each request carries the caller's own connection, applied by the kernel.
  - host: api.twitter.com
    credential: { connector: twitter, header: authorization, prefix: "Bearer " }
  - host: api.linkedin.com
    credential: { connector: linkedin, header: authorization, prefix: "Bearer " }
  - host: slack.com
    credential: { connector: slack, header: authorization, prefix: "Bearer " }
  - host: mastodon.social
    credential: { connector: mastodon, header: authorization, prefix: "Bearer " }

# Per-app skin (approved palette) — gray so the comms workspace reads distinct.
theme: gray

# The bot a Jarvis creation request goes to (its own workflow bot).
chatBot: communications-bot

ticketType: email-summarizer

workflow:
  name: Email Digest Pipeline
  # No `pipeline:` — this is not an incident. A ticketType=email-summarizer ticket
  # (e.g. a cron-driven daily digest) routes via the generic single-bot worker
  # dispatch (dispatchManifestWorkerTicket) straight to the email bot over the
  # mesh — the background half of ADR-036. Interactive work uses the direct
  # BotNodeClient path (no ticket). Same bot owns both.
  workerBot: communications-bot
  # One-and-done: the persona is its own quality gate (Mode A/B + preflight
  # + side-effect rules + PII handling all baked in). No reviewer needed.

# ADR-090 addendum (skill profiles): teach the generic `summarize` capability this app's
# COMMS domain. Same mechanism little-monsters uses for class-notes — one capability, a
# different declared pattern → domain-appropriate output. Resolved by ticketType at dispatch
# and composed into the worker prompt; the communications-bot still does the reasoning (ADR-036).
skillProfiles:
  summarize:
    pattern: email-digest
    instructions: >-
      Summarize the inbox/thread for a busy professional who wants to act, not read. Lead with
      what NEEDS A REPLY and by when. Name each sender and the single decision or ask on the
      table. Flag anything time-sensitive (deadlines, meetings, approvals). Keep it skimmable —
      short lines, no restating full email bodies. Never invent senders, dates, or commitments
      that are not in the source.
    sections:
      - needs-reply
      - decisions-and-asks
      - deadlines-and-meetings
      - fyi
    outputContract: markdown, newest/most-urgent first

# The comms NODE (container + static registry blocks) is framework-resident (ADR-093);
# the persona here is a package COPY for the registrar — the container keeps using
# /app/ai-lab. ADR-083: this manifest and the Social package's manifest BOTH declare
# communications-bot, and manifest bot upserts clobber base_capabilities whole-array
# — keep this list the SAME UNION as social's or load order decides the bot's identity.
bots:
  - agentId: b0000000-0000-0000-0000-000000000001
    name: communications-bot
    posture: inline   # native kernel: an application bot with route-backed tools (tools below); no dedicated node
    persona: personas/email-summarizer.yaml
    role: comms/email-calendar-social
    capabilities:
      - email-summarization
      - gmail-triage
      - outlook-mail
      - calendar-digest
      - meeting-agenda
      - reply-drafting
      - inbox-triage
      - social-signals-feed
      - social-publishing
      - sms-texting
      - voice-calls

# Route-backed reads for communications-bot (native kernel: executorType api, inside /api/email).
# Each runs under the caller with the caller's own mail connection applied by the kernel's egress.
tools:
  - name: email-digest
    displayName: My Day Digest
    type: api
    category: communication
    description: The last day's mail and today's calendar as counts plus unread, important, starred and priority lists.
    executor: { executorType: api, apiEndpoint: "GET /api/email/digest" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} for "my day", a summary, triage or "what did I miss". no_mail_connection means no mailbox is connected.
    tags: [email, route-backed]
  - name: email-messages
    displayName: Inbox
    type: api
    category: communication
    description: The person's mail (sender, subject, preview, time, unread/important/starred), or a search of it by words over a number of days, from their stored copy of Gmail when it is current.
    executor: { executorType: api, apiEndpoint: "GET /api/email/messages?q={input.query}&days={input.days}&max={input.max}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        query: { type: string, maxLength: 300, description: "Words the wanted mail would contain (sender, subject or preview); OR between alternatives; from:, subject: and newer_than: work. Gmail only." }
        days: { type: integer, minimum: 1, maximum: 180, description: "How many days back to look (default 7; up to 180 on the stored copy, 30 when read live)." }
        max: { type: integer, minimum: 1, maximum: 50, description: "How many messages to list (default 25, newest first; the person's Inbox page lists everything the copy holds, fifty at a time)." }
    usageInstructions: >-
      Call with {} to list recent mail. To find something ("an offer for ACT prep in the last 2 days"), call with
      {"query":"ACT prep","days":2}; try close variants of the words and a wider window before saying nothing was found,
      and say which words and how many days you searched. The answer's source says where it came from: "stored" is the
      person's copy of their Gmail (store.stored messages back to store.oldestAt, current to store.syncedThrough; matchedAll
      false means no message held every word and the closest are listed), "live" is Gmail itself (at most 30 days). Use a
      returned id with email-message to read one in full.
    tags: [email, route-backed]
  - name: email-message
    displayName: Read Message
    type: api
    category: communication
    description: One full message from the person's mailbox by its id.
    executor: { executorType: api, apiEndpoint: "GET /api/email/message/{input.id}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        id: { type: string }
      required: [id]
    usageInstructions: Call with {id} taken from email-messages or email-digest; never guess an id.
    tags: [email, route-backed]

  - name: email-send
    displayName: Send Email
    cardText: Sends this email from your own mailbox.
    type: api
    category: communication
    description: Send one email from the person's own connected mailbox (Gmail, Outlook or Yahoo). Held for the person's approval.
    executor: { executorType: api, apiEndpoint: "POST /api/email/send" }
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        confirm: { type: boolean, const: true }
        to: { type: string, minLength: 3, maxLength: 320, description: The recipient address as the person gave it; leave it out to send to the person themselves ("email it to me"). }
        subject: { type: string, maxLength: 300 }
        body: { type: string, maxLength: 20000 }
      required: [confirm, body]
    usageInstructions: >-
      Call once with {"confirm":true,"to","subject","body"} when the person asks to send an email; write the subject and
      body from what they asked. For "email it to me" leave "to" out: it goes to their own address. To send something an
      earlier step made (a deck, a document), put its title and its link in the body. The approval card is their confirmation. Say it was sent only when the tool answers ok;
      an insufficient_scope answer means their mailbox connection does not allow sending: say to reconnect it with send access.
    tags: [email, route-backed, approval-required]

  - name: social-post
    displayName: Post to social channels
    cardText: Posts this on your connected social channels.
    type: api
    category: communication
    description: Publish one text on the person's own connected channels (X, LinkedIn, Facebook Page, Slack, Mastodon) now, or add it to their posting queue. Held for the person's approval.
    executor: { executorType: api, apiEndpoint: "POST /api/email-social/posts" }
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        confirm: { type: boolean, const: true }
        text: { type: string, minLength: 1, maxLength: 3000, description: The post, written for the person in their voice; X allows 280 characters. }
        channels: { type: array, minItems: 1, maxItems: 5, items: { type: string, enum: [x, linkedin, facebook, slack, mastodon] }, description: Where to post. }
        when: { type: string, enum: [now, queue], description: now posts immediately; queue takes the next time in the person's posting plan. }
      required: [confirm, text, channels, when]
    usageInstructions: >-
      Call once with {"confirm":true,"text","channels","when"} when the person asks to post, share, tweet or announce something
      on their social channels; write the text from what they asked and keep it inside each channel's length (X: 280). Use
      "now" only when they say now; otherwise "queue". The approval card is their confirmation. Say it was posted only when the
      answer's post.status is "sent"; a "partial" or "failed" status names which channel refused and why in post.outcomes; a
      no_<channel>_connection outcome means that account is not connected yet (the Social desk's Channels view connects it).
    tags: [social, route-backed, approval-required]

# ─────────────────────────────────────────────────────────────────────────────
# COCKPIT UI SURFACE — ribbon icons open the email client pages (served by the
# packaged createEmailRoutes at /api/email/*) in the main stage. Read-only
# Gmail + Calendar for the signed-in user's connected Google account (connect
# once at /utilities). Replies are AI-drafted, not sent without confirmation.
# ─────────────────────────────────────────────────────────────────────────────
ui:
  static:
    # My Day is the dashboard / intro to Intelligent Communication — list it first.
    - toolName: email-myday
      label: My Day
      icon: codicon codicon-calendar
      iframeUrl: /api/email/my-day
      section: top
    - toolName: email-inbox
      label: Inbox
      icon: codicon codicon-mail
      iframeUrl: /api/email/inbox
      section: top
    # The Social desk (1.6.0): queue, calendar, composer, drafts, sent, channels and settings in one surface.
    - toolName: email-social
      label: Social
      icon: codicon codicon-megaphone
      iframeUrl: /api/email-social/
      section: top
    - toolName: email-engage
      label: Engage
      icon: codicon codicon-comment-discussion
      iframeUrl: /api/email-social/?view=engage
      section: top
    - toolName: email-golive
      label: Go Live
      icon: codicon codicon-broadcast
      iframeUrl: /api/email-social/?view=live
      section: top

summary:
  path: /api/email-summarizer/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items

routes:
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/email-summarizer/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/email-summarizer/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/email-app-routes.js
    factory: createEmailRoutes
    mountPath: /api/email
    auth: oidc   # what core server.ts mounted (requiresAuth — ADR-085 D2)
    requiresAuth: true
    requiresContext: true

  - module: routes/social-desk.js
    factory: createSocialDeskRoutes
    mountPath: /api/email-social
    auth: oidc   # the desk exposes the caller's own channels, posts and mentions
    requiresAuth: true
    requiresContext: true

# oshal_email_digests stays lazy DDL at the route's ensureEmailSchema chokepoint (owner-RLS appended).
# The stored mail copy is declared: the native kernel provisions only declared tables.
migrations:
  - migrations/001-email-mail-store.sql
  - migrations/002-email-social-desk.sql

# The stored copy is kept current by the person's own job: every 10 minutes, as the person who turned it on.
schedules:
  - id: mail-copy
    cron: "*/10 * * * *"
    runsAs: user
    target: service-route
    route: /api/email/sync
    method: POST
    body: {}
    timeoutSeconds: 60
    description: Keep a searchable copy of your Gmail (sender, subject, preview and time; never the full message) so Intelligent Communication searches it without asking Gmail each time.
    offer: Keep a searchable copy of my Gmail so Intelligent Communication can search all of it.
  - id: social-publish
    cron: "*/5 * * * *"
    runsAs: user
    target: service-route
    route: /api/email-social/run-due
    method: POST
    body: {}
    timeoutSeconds: 60
    description: Send the social posts and stream announcements you scheduled, on your own connected accounts, within five minutes of their time.
    offer: Send my scheduled social posts and stream announcements when their time comes.

# When /cockpit?app=email-summarizer is requested, show this app's surfaces and
# hide the generic framework tabs (settings stays so config is always reachable).
ribbon:
  hideFrameworkItems:
    - tickets
    - chat
    - calendar
    - addressbook
    - dashboard
    - logs
    - operations
  defaultView: email-myday

integrations:
  offers:
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
    - id: review-sales
      label: Review with Sales
      targetApp: intelligent-sales
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
