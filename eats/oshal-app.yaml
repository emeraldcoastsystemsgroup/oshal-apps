# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | Declare the existing workflow bot and package-local reasoning persona with its dedicated-node posture.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Release 1.3.4: GET /cart is a pure read (a diner with no cart gets the empty cart with null ids); the first add creates the cart. The native host refuses SQL writes on a GET.
# 3 | maintainer@emeraldcoastsystemsgroup.com | eats-concierge runs inline (posture: inline, same enrolled UUID). The in-page concierge (POST /api/eats/chat) calls it through the native kernel's package bot turn, which refuses a node-posture bot bound to an unreachable node ("this bot requires an enrolled node"), so every message answered "I'm having trouble reaching my assistant". Guarded by scripts/check-store-bots.test.mjs.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Release 1.3.5: on the native kernel (no Uber Eats provider) the package answers search, menu and the order handoff from its own curated catalog and ubereats.com deep link (routes/uber-catalog.js). Asked to order food, Jarvis had no restaurant to offer and invented an order. The tool descriptions name food delivery and say ordering ends at the Uber Eats link the diner opens.
# 5 | maintainer@emeraldcoastsystemsgroup.com | 1.3.6: declare eats-concierge as the chatBot, so a request from Jarvis that asks to make, build, order or plan something reaches it. A workflow application with no chatBot keeps every creation request with the assistant (jarvis_creation_kept), which answered without this application's tools.
# 8 | maintainer@emeraldcoastsystemsgroup.com | 1.5.0: the place cache (migration 041). What Google answers (address resolutions, searches, restaurant cards) is saved per person for Google's 30-day limit and served first: a search younger than a day asks Google nothing, Refresh asks again, and at Google's quota the saved answer is served with its saved time and the reason. search-restaurants is a POST now (the kernel admits no write on a GET); GET /search still reads.
# 7 | maintainer@emeraldcoastsystemsgroup.com | 1.4.2: Use location works for real: coordinates resolve through the Geocoding API's reverse lookup on maps.googleapis.com (second egress host, same key), because Places Text Search refuses coordinates as a query (seen live). The key needs the Geocoding API allowed on it; until then the page says so and asks for a typed street address.
# 6 | maintainer@emeraldcoastsystemsgroup.com | 1.4.0 (1.4.1: the home summary's empty line reads "No saved Uber Eats links yet", as the household guard expects): real restaurants. Search answers from Google Places around the diner's delivery address through the kernel's egress (places.googleapis.com with the kernel-held google-places key as the key query parameter; the package never holds it). The curated five-restaurant catalog, the menu and the cart tools are gone: Uber has no consumer API, so a menu the package cannot read is not priced here. Ordering is the Uber Eats search link at the diner's resolved address (its Google place id in Uber's location token) for the chosen restaurant, proven in a browser. Tools: search-restaurants (query + address), open-uber-eats (approval-gated hand-off), ask-eats-concierge.

# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — eats ("Eats" Uber Eats Concierge)
# Carved out of OSHAL core 2026-07-18 (ADR-085 Wave 2 carve #4). The eats-concierge
# REAL bot-node (eats-bot container, BOTH registry blocks, worker+foundation personas,
# uberToolKit.js, oshal-uber.js CLI, migration 041 bot seed) STAYS in the framework repo
# per ADR-093 interim — this manifest declares NO bots; workflow.workerBot resolves via
# the static registry.
#
# An AI food-delivery concierge that drives a visual surface: it finds the real
# restaurants near the diner's delivery address (Google Places), learns the diner's
# cuisine + dietary preferences, and hands off into Uber Eats at that address with
# the chosen restaurant searched.
#
# Checkout truth: Uber has no consumer API to search Eats or place an order on a
# third party's behalf, so ordering is a HAND-OFF: the link carries the address as
# Uber's own location token, and the diner picks the dishes, signs in and pays on
# Uber. No menu or price is invented here; no payment or diner credentials touch OSHAL.
# ─────────────────────────────────────────────────────────────────────────────

name: eats
suite: ai-home   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 64, high: 256, basis: declared }
  features:
    - id: eats-concierge-chat
      unit: concierge chat turn
      tier: T2
      generation: none
      degrade: template
    - id: eats-order-ticket
      unit: food order ticket
      tier: T4
      generation: none
      degrade: disable
displayName: Eats
description: >-
  AI food-delivery concierge: the real restaurants near your delivery address from
  Google Places, your tastes and allergies remembered, and a one-tap hand-off into
  Uber Eats at your address with the restaurant you chose. Other swarm bots can ask
  it to find food.
version: 1.5.0
status: active

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: eats
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/eats/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# No person-held connector: the restaurant source is the installation's Google Places key, which the
# kernel holds (OSHAL_CONNECTOR_SECRET_GOOGLE_PLACES) and places on the egress below; ordering is a hand-off
# into Uber Eats on the diner's own sign-in.
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: []
    tools: []
    connectors: []

# Outbound hosts (native kernel: the sandbox reaches only these). Google Places answers the restaurants
# near the delivery address and the address's own place id; the kernel adds the google-places key as the
# `key` query parameter and this package never sees it.
egress:
  - host: places.googleapis.com
    credential: { connector: google-places, query: key }
  # The Geocoding API's reverse lookup turns the page's Use location coordinates into a street address with its place id
  # (Places Text Search refuses coordinates); the same key, which must have the Geocoding API allowed on it.
  - host: maps.googleapis.com
    credential: { connector: google-places, query: key }

# Kernel skills this app declares (ADR-090 uses: contract, fail-closed at load).
# `app-dependencies` is the compatibility floor for the tiered dependencies block above: a core
# that predates required/optional refuses this package instead of installing it without its
# required dependencies and without its connector allow-list.
uses:
  - app-dependencies
  - test-catalog

# Test Lab registration (TLAB-07): the package's first suites, each with its runner and fixture boundary.
testing:
  version: 1
  catalog: tests/test-lab.yaml

# Guests never build orders (this app hands off to Uber Eats checkout). Request only —
# grants come from the operator endpoint (D4).
guestTier: blocked

tools:
  - name: search-restaurants
    displayName: Search Restaurants
    type: api
    category: commerce
    description: Find the real restaurants near the diner's delivery address (Google Places) for food delivery, each with its Uber Eats link. Use it for "order food", "get me delivery", "I want tacos" and any restaurant or cuisine request.
    executor: { executorType: api, apiEndpoint: "POST /api/eats/search" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        query: { type: string, description: "The craving, cuisine or restaurant name; empty lists restaurants" }
        address: { type: string, description: "The delivery address; omit to use the diner's saved address" }
      required: [query]
    usageInstructions: >-
      Call with {query} and, when the diner names one, {address}. Use the returned items as the only source of
      restaurants: each has placeId, name, cuisine, rating, priceLabel, openNow, delivery, distanceKm and uberUrl.
      There are no menus or prices here: the diner chooses dishes in Uber Eats. To order, call open-uber-eats with
      the placeId. A 400 address_required means the diner must give a delivery address first; a 503 with a message
      means the restaurant source is unavailable, say that message, never that nothing matched. The answer's
      served field is "live" or "saved" (results kept from an earlier search, savedAt says when; savedNote says why).
    routingTags: [food, restaurants, delivery]
    skills: [restaurant-search, dietary-awareness]
    tags: [eats, route-backed]

  - name: open-uber-eats
    displayName: Open in Uber Eats
    type: api
    category: commerce
    description: Hand the diner off into Uber Eats at their delivery address with the chosen restaurant searched. Nothing is ordered or paid in oshal.
    executor: { executorType: api, apiEndpoint: "POST /api/eats/order" }
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        placeId: { type: string, description: "The restaurant's placeId from search-restaurants" }
        address: { type: string, description: "The delivery address; omit to use the diner's saved address" }
      required: [placeId]
    usageInstructions: >-
      Call only after the diner chose a restaurant and asked to order from it. It records the hand-off and returns
      checkoutUrl, the Uber Eats page at the diner's address with that restaurant searched; give the diner that link.
      The diner picks the dishes, confirms the address and pays in Uber Eats. Never say an order was placed.
    routingTags: [food, checkout, handoff]
    skills: [checkout-handoff]
    tags: [eats, route-backed, approval-required]

  - name: ask-eats-concierge
    displayName: Ask Eats Concierge
    type: api
    category: commerce
    description: Let the Eats concierge reason over the diner's tastes, allergies and the restaurants near them.
    executor: { executorType: api, apiEndpoint: "POST /api/eats/chat" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        message: { type: string }
      required: [message]
    usageInstructions: >-
      Call with {message} when the diner wants conversational help choosing where to order from.
    routingTags: [food, concierge, delivery]
    skills: [preference-learning, dietary-awareness]
    tags: [eats, route-backed]

# UI SURFACES — ribbon icons that open the Eats surface.
ui:
  static:
    - toolName: eats-concierge
      label: Order Food
      icon: codicon codicon-flame
      iframeUrl: /api/eats/app
      section: top
    - toolName: eats-browse
      label: Restaurants
      icon: codicon codicon-search
      iframeUrl: /api/eats/app?view=browse
      section: top

# THE ASSISTANT RAIL (surface-bridge). Without this block the cockpit relay forwards NOTHING for
# this app (fail-closed). context = the Eats surface publishes the restaurants on screen and the
# delivery address, so the floating assistant answers about the screen the diner is on; set_field = it
# can fill the delivery address or the search box, and field_change = the diner's own edits of those
# two fields travel back; custom = its `search` and `open_uber_eats` ops run through the same functions
# the buttons call; propose/submit = a hand-off is ALWAYS a confirm card and the diner's answer returns
# to the assistant (nothing opens until Confirm); notify = it can confirm in the surface.
surface:
  ops: [context, set_field, field_change, custom, propose, submit, notify]

# ROUTES — app-owned API + surface, gated to this app's activation.
routes:
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/eats/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/eats/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/eats-routes.js
    factory: createEatsRoutes
    mountPath: /api/eats
    auth: service-or-oidc   # what server.ts ACTUALLY mounts (ADR-085 D2)
    requiresContext: true

# Belt-and-braces: same seven tables ensureEatsSchema creates lazily (owner RLS at the
# chokepoint). Idempotent — safe where core migration 040 already ran. 041 (bot seed)
# stays core with the bot.
migrations:
  - migrations/040-eats-platform.sql
  - migrations/041-eats-place-cache.sql

# WORKFLOW — tickets of type 'eats' route to the concierge.
# The bot a Jarvis creation request goes to (its own workflow bot).
chatBot: eats-concierge

ticketType: eats
workflow:
  name: Eats Concierge Pipeline
  pipeline: eats
  workerBot: eats-concierge
  phases:
    - intake     # understand the craving + dietary needs
    - find       # search the real restaurants near the address
    - delivery   # hand off into Uber Eats, record history

# RIBBON VISIBILITY — focus mode for /cockpit?app=eats
ribbon:
  hideFrameworkItems:
    - tickets
    - chat
    - calendar
    - addressbook
    - dashboard
    - logs
    - operations
  hideChatPanel: true
  defaultView: eats-concierge

integrations:
  accepts:
    - id: plan-meal
      contextType: planning-brief
      version: 1
      surface: eats-concierge
      fields:
        - title
        - notes
        - sourceUrl
  offers:
    - id: plan-shopping
      label: Plan shopping
      targetApp: purchasing
      targetAction: plan-purchase
      contextType: planning-brief
      version: 1
    - id: plan-ride
      label: Plan a ride
      targetApp: rides
      targetAction: plan-ride
      contextType: planning-brief
      version: 1
    - id: plan-movie
      label: Plan a movie night
      targetApp: movies
      targetAction: plan-movie
      contextType: planning-brief
      version: 1
    - id: plan-music
      label: Plan music
      targetApp: spotify
      targetAction: plan-music
      contextType: planning-brief
      version: 1

summary:
  path: /api/eats/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items

# Preserve the existing worker UUID and dedicated-node posture in the package contract.
bots:
  - agentId: b0080000-0000-0000-0000-000000000001
    name: eats-concierge
    persona: personas/eats-concierge.yaml
    posture: inline   # native kernel: runs with the route-backed tools below; no dedicated node
    role: commerce/food-delivery
    capabilities: ['restaurant-search', 'uber-eats-checkout-handoff', 'dietary-filtering', 'cuisine-preferences']
