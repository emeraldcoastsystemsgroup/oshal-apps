# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | The package's first suites (TLAB-07 "locate/create behavior coverage"): the readiness smoke, the assistant-rail and order-total unit suites, the compiled-route money and hand-off boundary, and the 390 px Chromium commerce smoke with its real prerequisites.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Register the family audience view contract (ADR-164 D6): the shared kit after the theme bootstrap, the boot with exactly the family audience, every start path of the full page gated on the kit's decision, and the view's reads confined to this package's routes.
# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.3.2: the company audience view registered beside the family one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
# 4 | maintainer@emeraldcoastsystemsgroup.com | GET /cart is read-only under the native admission rule: the route and Chromium cases now expect a fresh diner's cart read to create nothing while the first add still creates the cart.
