# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | The package's first suites (TLAB-07 "locate/create behavior coverage"): the readiness smoke, the assistant-rail and order-total unit suites, the compiled-route money and hand-off boundary, and the 390 px Chromium commerce smoke with its real prerequisites.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Register the family audience view contract (ADR-164 D6): the shared kit after the theme bootstrap, the boot with exactly the family audience, every start path of the full page gated on the kit's decision, and the view's reads confined to this package's routes.
# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.3.2: the company audience view registered beside the family one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
# 4 | maintainer@emeraldcoastsystemsgroup.com | GET /cart is read-only under the native admission rule: the route and Chromium cases now expect a fresh diner's cart read to create nothing while the first add still creates the cart.
# 5 | maintainer@emeraldcoastsystemsgroup.com | Register the not-connected / honest-state surface test added with the native provider rails.
# 6 | maintainer@emeraldcoastsystemsgroup.com | Register the no-rail route suite: with no Uber Eats rail the concierge turn answers without touching the refusing catalog, and /config names the absent rail.
# 7 | maintainer@emeraldcoastsystemsgroup.com | Register envelope: a malformed concierge envelope shows its say text, never the raw object, and only stated notes are saved (sweep 8).
# 8 | maintainer@emeraldcoastsystemsgroup.com | Register stated-notes: remember notes match by word stem so a stated allergy is always saved, a raw-newline say is the reply, and an empty say never claims options.
# 9 | maintainer@emeraldcoastsystemsgroup.com | Register remembered: the profile lists what the concierge remembers and Forget removes a note (sweep 9: an invented "wants spicy food" could not be removed and a remembered allergy left the Dietary card at "No diet set").
# 10 | maintainer@emeraldcoastsystemsgroup.com | remembered adds the Per-order budget card: a remembered spending note ("budget: cheap") is marked budget and shown while no dollar cap is set (sweep 10: the card read "Budget open").
# 11 | maintainer@emeraldcoastsystemsgroup.com | Register allergens: every chat dish is checked against the diner's allergies and diet (demo sweep 2: a Vegetarian Pad Thai right after a peanut allergy).
# 12 | maintainer@emeraldcoastsystemsgroup.com | Register allergy-surface: in Chromium the person's own Send shows the Pad Thai reply with its allergy-check line under it.
# 13 | maintainer@emeraldcoastsystemsgroup.com | 1.3.5: no rail now means the package's own catalog: the no-rail case expects the turn, search, menu, cart and order handoff to answer from it with an ubereats.com link; register the uber-catalog unit suite.
# 15 | maintainer@emeraldcoastsystemsgroup.com | 1.5.0: register place-cache (the cache module over the harness pool) and re-describe routes-real-restaurants with the cache cases (a POST saves, a fresh saved search asks Google nothing, Refresh asks, the quota fallback serves the saved answer with its time, nothing past 30 days, GET never writes).
# 14 | maintainer@emeraldcoastsystemsgroup.com | 1.4.0: real restaurants. The cart-totals, no-rail and uber-catalog cases are retired with the cart and the curated catalog; registered instead: uber-link (the Uber Eats location token pinned to the browser-proven string), places (the Google Places client over a recording fetch, key-free), routes-real-restaurants (the compiled routes: address required, geocode once, the restaurants with their Uber Eats links, the recorded hand-off, the chat proposal, ownership, read-only admission, the photo route), places-unavailable (API not enabled, key not configured, no address: said in words, never an empty result); the commerce-bridge, not-connected, allergens and surface-mobile cases re-described for the new surface.
# -----------------------------------------------------------------------------
version: 1
cases:
  - id: package-readiness
    name: Installed package readiness
    purpose: Verify the existing metadata-only readiness probe without provider or user-data access.
    level: integration
    runner:
      kind: smoke
      smoke: package-readiness
    expected:
      - The installed eats package identity satisfies its manifest smoke assertions.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: safe-smoke
  - id: commerce-bridge
    name: Eats assistant rail contract
    purpose: Prove the manifest declares its surface-bridge ops from the closed vocabulary, the page loads the shared client and producer, advertises exactly the custom ops it applies (search, open_uber_eats), opens Uber Eats from the explicit hand-off only with the place id and address, turns a chat proposal into a confirm card, and keeps its context digest under the contract cap.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/eats-commerce-bridge.test.js
    expected:
      - surface.ops lists context, set_field, field_change, custom, propose, submit and notify, all from the bridge vocabulary.
      - The only window.open is inside requestOrder(); the chat reply turns a proposal into a propose card; a relayed open_uber_eats proposes and never opens.
      - A 40-restaurant list digests to at most 4000 characters.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: uber-link
    name: The Uber Eats location token and links
    purpose: >-
      The hand-off link is Uber Eats' own search page carrying the delivery address as Uber's location token (base64 of the
      URL-encoded JSON with the address, its Google place id as reference, referenceType google_places and the coordinates).
      The token is pinned to the exact string a browser check accepted on 2026-10-30 (406 taco results around Central Park).
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/uber-link.test.js
    expected:
      - placeToken(Central Park) equals the browser-proven token; it decodes to the five fields in Uber's order.
      - The search and feed links are ubereats.com pages with q and pl; without a place they carry no pl.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: places
    name: The Google Places client, key-free
    purpose: >-
      Over a recording fetch: a geocode is one Text Search with the address fields in the URL; a restaurant search is biased
      to the address and restricted to restaurants; no request carries a key or an X-Goog header (the kernel places the key at
      egress); Google's documents normalize to the restaurant card; a photo is resolved without following the redirect; every
      refusal is named in words (Places API (New) not enabled with its activation link, key refused, quota, unreachable, the
      kernel's missing-key sentence naming OSHAL_CONNECTOR_SECRET_GOOGLE_PLACES, address not found).
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/places-client.test.js
    expected:
      - Every request shape, normalization and refusal case passes.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: routes-real-restaurants
    name: Real restaurants near the address, the place cache and the Uber Eats hand-off
    purpose: Drive the compiled Eats routes with an in-memory pool and a recording Google Places double through the address, the search, the per-person cache, the hand-off, the chat proposal, ownership, the native read-only admission and the photo route.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/eats-routes.test.js
    expected:
      - A search without an address is 400 in words before any Places call; with one it resolves the address once and lists the restaurants Google returned, each with an Uber Eats link whose token carries the address's place id; the saved profile address is the default; coordinates resolve through the Geocoding reverse lookup.
      - A POST search saves the address, the search and the cards; a second POST within a day asks Google nothing (served saved); Refresh asks Google and replaces the row; at Google's quota a saved search older than a day is served with its saved time and the reason; past thirty days nothing saved is served; GET /search reads the saved rows and never writes.
      - Places API not enabled and a missing kernel key are 503 with the sentence, never an empty list; an unknown address is 404.
      - POST /order records the hand-off row and answers the Uber Eats search link for the chosen restaurant, from the saved card when there is one; a chat "order" choice is a proposal that writes nothing.
      - One diner never sees another's hand-offs; an anonymous caller is 401 before any query or Places call; every GET answers under read-only admission with no SQL write; the photo route answers Google's image URL key-free.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/eats-routes-harness.js
    limits:
      timeoutMs: 60000
      maxMemoryMb: 256
    installation: never
  - id: place-cache
    name: The place cache keeps Google's answers for thirty days
    purpose: >-
      The cache module over the harness pool: keys carry the person; a day is fresh and thirty days (Google's limit) is
      the most a row is ever served; lookups, searches and cards round-trip; an expired row reads as nothing; a replace is
      DELETE then INSERT with no ON CONFLICT; a concurrent duplicate is tolerated; a JSON column as text or parsed both read.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/eats-place-cache.test.js
    expected:
      - Every key, life, round-trip and refusal case passes.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 15000
    installation: never
  - id: places-unavailable
    name: No restaurant search can run
    purpose: >-
      Through the compiled chat route: with Places API (New) not enabled, with no kernel key, and with no delivery address, the
      prompt states that no search ran and why, in the server's words, and forbids calling it an empty result; the turn still
      answers; with no address no Places call is made; a search that ran and matched nothing is still "no match".
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/eats-places-unavailable.test.js
    expected:
      - Each of the four states passes.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 15000
    installation: never
  - id: surface-mobile-commerce
    name: Eats at phone width in Chromium
    purpose: Drive the actual Eats surface at 390 x 844 inside a parent frame over the compiled router and the real core bridge client - the start on the saved address, a search that fills a grid the page scrolls through, a card's Order on Uber Eats, a chat order that waits for Confirm, the floating assistant's relayed ops, the photos through the server, and the context envelopes the parent receives.
    level: browser
    runner:
      kind: playwright
      scope: package
      files:
        - tests/surface.core.spec.mjs
    expected:
      - No horizontal overflow; the restaurants Google answered render with their facts and a photo fetched through the server.
      - A card's Order on Uber Eats fires exactly one POST /order carrying only placeId and address and opens ubereats.com/search once with the restaurant and the location token.
      - A chat order renders a confirm card with no hand-off POST and no window.open; Confirm fires exactly one POST /order and opens Uber Eats once; Cancel on a relayed proposal hands off nothing.
      - The parent frame receives context envelopes naming the restaurants and a submit for the confirm; the page raises no errors.
      - Under the native admission rule no GET in the session attempts a SQL write.
    prerequisites:
      - runner:playwright
      - harness:oshal-core-root
      - browser:chromium
      - core:dependencies
      - core:surface-bridge
      - core:shared-theme-assets
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures:
        - tests/surface.core.fixture.mjs
        - tests/eats-routes-harness.js
      cleanup: Close the owned Chromium process and the loopback HTTP server; the recorded hand-offs stay in the disposable in-memory pool, with no database, provider or model.
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its family (Home shell) and company (Business shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: not-connected
    name: The restaurant source is unavailable
    purpose: >-
      A refused restaurant search (HTTP 503 with the server's sentence) reads as that sentence on the Eats page, never as no
      matching restaurants; without an address the page asks for one and makes no request.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/eats-not-connected.test.js
    expected:
      - A refused search and concierge turn show the server's own words; a real empty answer still reads as no match; restaurants render with an Order on Uber Eats button.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: saved-notes
    name: Saved notes are earlier preferences, not this request
    purpose: >-
      Through the compiled route: the diner's saved concierge notes reach the prompt as preferences from earlier
      conversations that are never restated as the current request (the concierge answered 'vegetarian and spicy' to a
      vegetarian request), and a chat turn saves only a note not already saved.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/eats-saved-notes.test.js
    expected:
      - The prompt carries SAVED PREFERENCES with 'wants spicy food' and the request on its own DINER line after it.
      - >-
        A turn remembering 'Wants  spicy food', a budget note twice and a blank saves only the budget note once.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: envelope
    name: The concierge reply is its say text
    purpose: >-
      Through the compiled route with a scripted concierge: a reply whose fields lack commas (sweep 8 showed
      the raw object) is shown as its say text, an envelope still unparsable shows only its say text and acts
      on nothing, and only a remember note the diner stated in this message is saved.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/eats-envelope.test.js
    expected:
      - >-
        The sweep-8 comma-less envelope replies with its say text and saves only 'order for two people' and
        'vegetarian preference' of seven remember entries.
      - >-
        An envelope still unparsable shows its decoded say text and saves nothing; plain prose is still the
        reply; a valid fenced envelope parses as before.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: stated-notes
    name: A stated allergy is always saved
    purpose: >-
      Through the compiled route with a scripted concierge: remember notes match the diner's message by word stem,
      so a stated allergy, a paraphrased dislike and a diet are saved while an unstated note is still dropped; a say
      holding a raw newline is the reply; an empty say is neither the raw object nor a claim of options.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/eats-stated-notes.test.js
    expected:
      - >-
        For "I'm allergic to peanuts, hold the onion, I eat vegan" the turn saves 'peanut allergy', 'no onions' and
        'vegan', and drops 'spicy preference'.
      - Short food words (egg, soy) and an allergy stated in other words are kept; with nothing stated none is saved.
      - A say with a raw newline is the reply, and an empty say with no card shown never names options.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: remembered
    name: What the concierge remembers, shown and forgettable
    purpose: >-
      Drive the compiled GET /profile and POST /notes/forget over the native kernel's real concierge store
      (crates/host-process/bridge/concierge_store.js) on an in-memory person-scoped documents pool, and read the page's
      Dietary card and remembered list.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/eats-remembered.test.js
    expected:
      - GET /profile lists each remembered note once, marked when it records an allergy, an intolerance or a diet.
      - POST /notes/forget removes every saved copy of the caller's note and no other diner's; nothing saved answers 404, no note 400.
      - The Dietary card adds remembered restrictions and every note is listed with Forget, which asks first.
      - A remembered spending note is marked budget; the page's own loadProfile shows it on the Per-order budget card while no dollar cap is set, and a set cap wins.
    prerequisites:
      - runner:node-test
      - fixture:kernel-checkout
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 20000
    installation: never
  - id: allergens
    name: A peanut allergy excludes or flags peanut places and dishes
    purpose: >-
      Through the compiled chat route with a scripted concierge: a remembered or stated allergy holds the restaurants whose
      name carries the allergen or a dish usually made with it back from the prompt, the cards and any proposal, the prompt
      states the restriction as a fact, and a dish the reply names that usually carries it gets an allergy-check line.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/eats-allergens.test.js
    expected:
      - With a saved peanut allergy, Pad Thai Kitchen and Peanut Palace are held back; Thai Garden is shown and a held place is never proposed.
      - The demo's own Pad Thai reply returns unchanged with the line "Pad Thai usually contains peanuts (you avoid peanuts)", saved with the reply.
      - A reply naming the risk itself gets no line; with no restriction nothing is held.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/eats-routes-harness.js
    limits:
      timeoutMs: 15000
    installation: never
  - id: allergy-surface
    name: The page shows the allergy check under the reply
    purpose: >-
      In Chromium at 412x915 the person types the demo's peanut-allergy message into the shipped Eats page and presses Send;
      the compiled chat route on real express answers with the demo's own Pad Thai reply as the scripted model.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/eats-allergy-surface.test.cjs
    expected:
      - The reply bubble is the concierge's words unchanged, and the next line is the status "Allergy and diet check - Pad Thai usually contains peanuts (you avoid peanuts)".
    prerequisites:
      - runner:node-test
      - dependency:playwright
      - browser:chromium
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/eats-routes-harness.js
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
