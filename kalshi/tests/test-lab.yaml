version: 1
cases:
  - id: package-readiness
    name: Installed package readiness
    purpose: Verify the existing metadata-only package smoke without user data or provider calls.
    level: integration
    runner: { kind: smoke, smoke: package-readiness }
    expected: [The installed kalshi readiness marker satisfies the manifest assertions.]
    prerequisites: []
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 15000 }
    installation: safe-smoke
  - id: briefing-delivery
    name: Registered briefing enqueue behavior
    purpose: Exercise the compiled public scan producer using real alert decisions and isolated task-writer ports.
    level: integration
    runner: { kind: node-test, scope: package, files: [tests/kalshi-briefing-delivery.test.js] }
    expected:
      - Declined or failed enqueues never complete missing tasks or mark Jarvis delivery.
      - Accepted enqueues retain the exact recipient and registered producer session.
      - Existing package opt-out and separate outward opt-in retain their behavior.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: disposable, cleanup: Each case loads a fresh compiled module and uses only in-memory dependency fixtures. }
    limits: { timeoutMs: 30000, maxMemoryMb: 256 }
    installation: never
  - id: scan-config-alert-rules
    name: Scan configuration and alert decisions
    purpose: Run the existing compiled-module configuration, scope, freshness, deduplication and alert-rule tests.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/kalshi-scan-config.test.js] }
    expected:
      - Configuration layers, authority scopes and value bounds retain the declared defaults.
      - Alert floors, first-seen rules, daily budgets and settlement summaries stay correct.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 30000, maxMemoryMb: 256 }
    installation: never
  - id: trends
    name: Saved market trend calculations
    purpose: Run the existing compiled-module trend calculations without framework services or provider calls.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/kalshi-trends.test.js] }
    expected:
      - Daily cumulative values and rolling settlement windows preserve their mathematics.
      - Strategy grouping and days-to-verdict projections remain read-only.
      - Sized paper fills return profit and loss over the ask plus the taker fee, and a total loss is exactly minus one.
      - A zero-stake pre-registered pick leaves the paper bankroll unchanged and a ruinous run stops at zero.
      - The paper book compounds every strategy together in grading order and ignores the selected display window.
      - The starting paper bankroll comes from deployment configuration with the shipped fallback.
      - The compiled route and surface carry the paper bankroll and label it as paper money.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 30000, maxMemoryMb: 256 }
    installation: never
  - id: pops
    name: Price since announced for open alerts
    purpose: Run the compiled price-move module against an in-memory candle transport and clock, with no provider calls.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/kalshi-pops.test.js] }
    expected:
      - A pick is priced on its own side, and an announced price outside the contract range yields nothing.
      - Candle prices prefer the book middle, then the last trade, then the period mean, walking back past empty candles.
      - Reads stay capped per request, spaced under the shared public request limit, and served from the cache inside its window.
      - One failing or empty market is counted as unavailable and reported to the caller logger, never thrown.
      - One shared cache serves every caller, so each caller keeps its own announced price and side off a single market read.
      - The announced-hand read stays scoped to the caller and excludes settled markets.
      - The compiled route and surface carry the column through the framework candle client.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 30000, maxMemoryMb: 256 }
    installation: never
  - id: settings-alerts-browser
    name: Settings and alerts in Chromium
    purpose: Run the existing Node browser harness over the shipped route and surface using synthetic signed sessions.
    level: browser
    runner: { kind: node-test, scope: package, files: [tests/kalshi-settings-alerts-browser.test.js] }
    expected:
      - Caller settings persist within the caller scope and deployment settings require an operator.
      - Cross-user, anonymous and forged requests fail closed while saved alert results render correctly.
    prerequisites: [runner:node-test, dependency:express, dependency:playwright, browser:chromium]
    sideEffects: fixture-write
    isolation: { mode: disposable, cleanup: The harness closes Chromium and its loopback HTTP server; settings and accounts exist only in fixture memory. }
    limits: { timeoutMs: 120000, maxMemoryMb: 1024 }
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell) and family (Home shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the company view reads only GET /scan (the saved snapshot), GET /alerts (the ledger and its paper record) and GET /home-summary; it never reads /status, /portfolio or /alerts/pops, which ask Kalshi live, never /trends or /settings, and never writes.
      - The stats are the playable-hand count, the snapshot's age with its freshness, the paper alert record and the recorded alerts over five days; the hands table names strength, side, market, ask, net edge, stake, close and risk flags as the snapshot ranks them, capped at ten; the alerts list names each alert's strength, side, edge, delivery and settlement outcome, newest first, capped at eight, under the record line.
      - Waiting for the first scan, a running first scan, the scan switched off, a folded scan, a stale or failed snapshot, an open staking gate, a 401, a 403, a failed snapshot read, a failed or refused alerts read (which never hides the hands), a failed, unavailable or partial home summary and no alerts at all each read as what they are.
      - Under an audience view the page's own start (the snapshot, alert, settings and trend loads, the pollers, the account read) and its connected-actions mount do not run; without the audience, and without the kit, they run as before.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
