version: 1
cases:
  - id: package-readiness
    name: Installed package readiness
    purpose: Verify the existing metadata-only package smoke without user data or provider calls.
    level: integration
    runner: { kind: smoke, smoke: package-readiness }
    expected: [The installed kalshi readiness marker satisfies the manifest assertions.]
    prerequisites: []
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 15000 }
    installation: safe-smoke
  - id: briefing-delivery
    name: Registered briefing enqueue behavior
    purpose: Exercise the compiled public scan producer using real alert decisions and isolated task-writer ports.
    level: integration
    runner: { kind: node-test, scope: package, files: [tests/kalshi-briefing-delivery.test.js] }
    expected:
      - Declined or failed enqueues never complete missing tasks or mark Jarvis delivery.
      - Accepted enqueues retain the exact recipient and registered producer session.
      - Existing package opt-out and separate outward opt-in retain their behavior.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: disposable, cleanup: Each case loads a fresh compiled module and uses only in-memory dependency fixtures. }
    limits: { timeoutMs: 30000, maxMemoryMb: 256 }
    installation: never
  - id: scan-config-alert-rules
    name: Scan configuration and alert decisions
    purpose: Run the existing compiled-module configuration, scope, freshness, deduplication and alert-rule tests.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/kalshi-scan-config.test.js] }
    expected:
      - Configuration layers, authority scopes and value bounds retain the declared defaults.
      - Alert floors, first-seen rules, daily budgets and settlement summaries stay correct.
      - GET /scan serves only hands whose market is still open and counts the ones that closed after the snapshot was taken.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 30000, maxMemoryMb: 256 }
    installation: never
  - id: trends
    name: Saved market trend calculations
    purpose: Run the existing compiled-module trend calculations without framework services or provider calls.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/kalshi-trends.test.js] }
    expected:
      - Daily cumulative values and rolling settlement windows preserve their mathematics.
      - Strategy grouping and days-to-verdict projections remain read-only.
      - Sized paper fills return profit and loss over the ask plus the taker fee, and a total loss is exactly minus one.
      - A zero-stake pre-registered pick leaves the paper bankroll unchanged and a ruinous run stops at zero.
      - The paper book compounds every strategy together in grading order and ignores the selected display window.
      - The starting paper bankroll comes from deployment configuration with the shipped fallback.
      - The compiled route and surface carry the paper bankroll and label it as paper money.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 30000, maxMemoryMb: 256 }
    installation: never
  - id: pops
    name: Price since announced for open alerts
    purpose: Run the compiled price-move module against an in-memory candle transport and clock, with no provider calls.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/kalshi-pops.test.js] }
    expected:
      - A pick is priced on its own side, and an announced price outside the contract range yields nothing.
      - Candle prices prefer the book middle, then the last trade, then the period mean, walking back past empty candles.
      - Reads stay capped per request, spaced under the shared public request limit, and served from the cache inside its window.
      - One failing or empty market is counted as unavailable and reported to the caller logger, never thrown.
      - One shared cache serves every caller, so each caller keeps its own announced price and side off a single market read.
      - The announced-hand read stays scoped to the caller and excludes settled markets.
      - The compiled route and surface carry the column through the framework candle client.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 30000, maxMemoryMb: 256 }
    installation: never
  - id: settings-alerts-browser
    name: Settings and alerts in Chromium
    purpose: Run the existing Node browser harness over the shipped route and surface using synthetic signed sessions.
    level: browser
    runner: { kind: node-test, scope: package, files: [tests/kalshi-settings-alerts-browser.test.js] }
    expected:
      - Caller settings persist within the caller scope and deployment settings require an operator.
      - Cross-user, anonymous and forged requests fail closed while saved alert results render correctly.
      - Every Settings label reads its manifest label and allowed range, never a configuration key (sweep 14).
    prerequisites: [runner:node-test, dependency:express, dependency:playwright, browser:chromium]
    sideEffects: fixture-write
    isolation: { mode: disposable, cleanup: The harness closes Chromium and its loopback HTTP server; settings and accounts exist only in fixture memory. }
    limits: { timeoutMs: 120000, maxMemoryMb: 1024 }
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell) and family (Home shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the company view reads only GET /scan (the saved snapshot), GET /alerts (the ledger and its paper record) and GET /home-summary; it never reads /status, /portfolio or /alerts/pops, which ask Kalshi live, never /trends or /settings, and never writes.
      - The stats are the playable-hand count, the snapshot's age with its freshness, the paper alert record and the recorded alerts over five days; the hands table names strength, side, market, ask, net edge, stake, close and risk flags as the snapshot ranks them, capped at ten; the alerts list names each alert's strength, side, edge, delivery and settlement outcome, newest first, capped at eight, under the record line.
      - Waiting for the first scan, a running first scan, the scan switched off, a folded scan, a stale or failed snapshot, an open staking gate, a 401, a 403, a failed snapshot read, a failed or refused alerts read (which never hides the hands), a failed, unavailable or partial home summary and no alerts at all each read as what they are.
      - Under an audience view the page's own start (the snapshot, alert, settings and trend loads, the pollers, the account read) and its connected-actions mount do not run; without the audience, and without the kit, they run as before.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: native-reads
    name: Scan reads and the portfolio read on the native kernel
    purpose: Load the compiled scan engine and router with recording ports under OSHAL_EGRESS=kernel and off it - no database, network or Kalshi key.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/kalshi-native-reads.test.js] }
    expected:
      - Under OSHAL_EGRESS=kernel ensureScanSchema sends no SQL, so a read issues no ALTER or index declaration the kernel refuses.
      - Off the kernel the scan tables are still declared, the alert table with batch_id as migration 076 has it.
      - GET /portfolio, POST /orders and DELETE /orders/:orderId without a Kalshi connection answer 409 connected:false, never a 404 the kernel serves as a missing asset.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 15000 }
    installation: never
  - id: exchange-state
    name: Exchange status header
    purpose: >-
      The header says trading halted only when a scan read a halted exchange; otherwise the status is unknown.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/kalshi-exchange-state.test.js
    expected:
      - No scan yet or a null status reads as unknown.
      - A scanned halted or active exchange reads as such.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: scan-schedule-and-calibration
    name: Where the scan runs, and the calibration table it ranks against
    purpose: >-
      Load the compiled routes with the native runtime's prediction-markets shape and recording ports - no database,
      network or Kalshi key - and read the package's own calibration table.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/kalshi-scan-schedule.test.js] }
    expected:
      - Loading the package and building its router starts no timer; the background-scan schedule is a person-activated POST to the mounted /scan/tick.
      - With no market reader the tick and Scan now answer 503 naming the missing reader, before any SQL.
      - The package ships data/kalshi-calibration.json (generated 2026-07-13, horizons 24/6/1, a provenance block), and with a reader a scan may run against it.
      - Before the first scan GET /scan carries the table's generatedAt; a missing table's gate reason is words with no file path.
      - The page says whether the background scan will run and how old the calibration table is.
      - On the native kernel a due tick scans and writes the snapshot without asking swarm_applications (the kernel is the authority that an installed, active application is being ticked); off the kernel zero registry rows still mean not installed.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 15000 }
    installation: never
  - id: kalshi-phone-layout
    name: Kalshi tables on a phone
    purpose: Render a synthetic scan, scorecard and alert history with the page's own code in Chromium at 412 x 915 and in the 392 x 641 cockpit frame.
    level: browser
    runner: { kind: node-test, scope: package, files: [tests/browser/kalshi-phone-layout.test.cjs] }
    expected:
      - Scan, Scorecard and Alerts never make the page wider than the screen.
      - The 12-column scan table keeps every column and scrolls sideways in its own box.
      - Opening the page and switching tabs writes nothing.
    prerequisites: [runner:node-test, dependency:playwright, browser:chromium]
    sideEffects: none
    isolation: { mode: none, cleanup: Each case closes its browser context; pages and answers are synthetic and served inside the browser with no network or server. }
    limits: { timeoutMs: 60000, maxMemoryMb: 1024 }
    installation: never
  - id: market-title
    name: Market titles show no markdown markers
    purpose: Run the shipped marketTitle() out of the surface and read where titles print (sweep 8 showed 'Will average **gas prices** be above...').
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/kalshi-market-title.test.js] }
    expected:
      - A markdown-bold title renders its words in strong with no asterisk; a stray marker is dropped; markup in a title stays escaped.
      - The scan row and the order dialog print titles through marketTitle.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 15000 }
    installation: never
  - id: market-explainer
    name: Market walkthrough words and numbers
    purpose: Pin the pure explainer: browse rows, the reasons a market is skipped, fold and playable walkthroughs, the quant's question, open-market filtering.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/kalshi-market-explainer.test.js] }
    expected:
      - A skipped market says why in the evaluator's own terms and is never evaluated.
      - A fold is explained in cents and percentages with a zero stake; a playable hand says its stake and paper-only under a closed gate.
      - Markets that closed since the scan are dropped and counted.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 15000 }
    installation: never
  - id: markets-routes
    name: Browse and walkthrough routes
    purpose: Run the compiled routes over a stored snapshot: GET /markets filters, sorts and bounds; GET /markets/:ticker answers from the snapshot, else live, with 404/503 refusals; GET /scan ships no browse rows; runScan stores one row per walked market.
    level: integration
    runner: { kind: node-test, scope: package, files: [tests/kalshi-markets-routes.test.js] }
    expected:
      - Every open walked market is listed with a verdict headline; closed ones are counted, not listed.
      - A market outside the last scan is read live and priced against the shipped table; an unknown ticker is 404; no market reader is 503.
      - Anonymous callers are refused on every route.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: disposable, cleanup: Fresh module graphs with in-memory pool and feed fixtures. }
    limits: { timeoutMs: 30000, maxMemoryMb: 256 }
    installation: never
  - id: quant-contract
    name: Quant concierge contract
    purpose: Prove the manifest, persona, tools, rating and page agree: chatBot is the declared quant, every tool is an authorized read of a mounted route, the rating names the hosted feature, the Markets tab leads the page.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/kalshi-quant-contract.test.js] }
    expected:
      - The persona authorizes each declared tool and never trades.
      - Each api tool reads a route the package mounts, read-only and without approval.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 15000 }
    installation: never
