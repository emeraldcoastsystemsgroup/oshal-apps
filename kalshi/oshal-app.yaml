summary:
  path: /api/kalshi/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items
integrations:
  offers:
    - id: review-finance
      label: Review with Finance
      targetApp: finance
      targetAction: review-context
      contextType: financial-review
      version: 1
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
    - id: review-research
      label: Research with Trading
      targetApp: intelligent-trades
      targetAction: review-research
      contextType: research-brief
      version: 1
    - id: prepare-recap
      label: Prepare a trade recap
      targetApp: daily-trade-recap
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
