# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | Release 1.9.1 (concierge audit batch 2b; Roger, 2026-11-10: "make sure it holds the existing pattern that was designated in Create"): kalshi-quant, the package's only bot and its side-chat concierge (chatBot), runs inline, now explicit (it already resolved to inline, so nothing moves off a node), and its persona follows Create's create-editor: the plain-prose answer rule, the ```tool_call fence for the three route reads kalshi_market, kalshi_markets and kalshi_scan, and runtime harness claude-code (metadata; the kernel takes inference from the installation). No route, tool, schedule, routing word or order path changed: the quant still reads only and never places an order. Guard: tests/kalshi-create-concierge.test.js (Test Lab create-concierge).
# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — kalshi ("Kalshi Prediction Markets", ADR-094)
#
# Predictive edge over CFTC-regulated event contracts. The engine treats every open
# contract like a poker hand: hand strength = calibrated true probability learned from
# Kalshi's OWN settled-market tape (price→outcome buckets per category/horizon, beta-shrunk
# toward price so no history ⇒ no edge); pot odds = the ask plus Kalshi's quadratic taker
# fee; sizing = quarter-Kelly discounted per risk flag (wide spread / thin book / thin
# evidence / long-dated), capped at 5% bankroll.
#
# Carved out of OSHAL core 2026-07-19 (ADR-085 Wave 3, "skill with a surface" —
# ONLY the surface carves). What STAYS framework-resident per ADR-093:
#   - the prediction-markets ENGINE (src/features/prediction-markets: public client,
#     fee math, calibration, bet evaluator, RSA-PSS auth, portfolio, strategy
#     scorecard) — imported via @/ aliases; connector-account-lookup real-imports
#     probeKalshiAccount, so the slice is NOT orphaned (D8 verified);
#   - the kalshi connector card + OSHAL_CRED_KALSHI broker key (two-value paste:
#     API Key ID + RSA private-key PEM, stored keyId:PEM — BYO, never a platform key);
#   - scripts/oshal-kalshi-{scan,calibration,grade,forward,arb}.ts (the calibration
#     study + forward-test/grading CLIs) + config-seed/kalshi-calibration.json;
#   - migrations 074/075 (kernel-owned history; this package ships migrations/
#     COPIES so fresh installs create kalshi_orders + the forward-test ledger);
#   - the tool-kalshi-home default tile in config-seed/profiles/oshal-framework.json.
# This package is the app: the /api/kalshi routes (surface + scan/scorecard/
# calibration/status + Phase-2 portfolio and CONFIRM-GATED orders — demo exchange
# unless KALSHI_LIVE_ENABLED, every order/refusal audited to kalshi_orders) + the
# ranked-hand surface HTML. The fail-closed order posture ships byte-identical to the
# kernel original.
#
# 2026-07-30 — THE SCAN IS ALWAYS ON, and it is no longer on the request path. A poller
# owned by this package (src-routes/kalshi-scan-cron.ts, started by the route factory, so
# it runs only where this app is installed + active) re-scans on the cadence configured
# below, stores the result in kalshi_scan_snapshots, and posts NEW playable hands to each
# entitled user's Jarvis feed. GET /scan serves that snapshot instantly. Before this, a
# cold open paid a 23-second feed walk (live log: openPaged=60000 evaluable=6 ms=23125).
# 2026-09-04 — 1.1.1: the Alerts tab shows each announced hand's settlement OUTCOME and a W-L record
# line. The grades were always in kalshi_predictions (every alerted hand is pre-registered and graded
# daily); the surface never showed them per alert ("where is the win/loss record").
#
# 2026-09-04 — 1.1.2: the "contrarian-extreme" forward test. For every scan hand with our P >= .90 or
# <= .10 the OPPOSITE side is pre-registered at its own ask (= 1 - our bid), zero stake, graded by the
# same daily judge. Operator: "bet against ourselves at the extremes". A hypothesis, not a strategy —
# in-sample it made ~6c a contract on 79 hands, one survivor of fourteen variants.
#
# 2026-09-05 — 1.2.0: a TRENDS tab (operator: "keep track of Kalshi like we do stocks"). GET /trends serves
# the ledger as time series (src-routes/kalshi-trends.ts, read-only, no framework imports): cumulative P&L
# per strategy, rolling hit vs breakeven, days-to-verdict, and the four books (paper/real x manual/auto —
# the unbuilt one says so). Inline SVG on the surface; series hues by a fixed strategy->slot map.
#
# 2026-09-28 — 1.6.2: a COMPANY audience view for the Business shells (ADR-164 D6). Studio, Orbit and Commons open the
# first surface (/api/kalshi/) with ?audience=company; the page answers with the SAVED scan state (top hands, snapshot
# age, paper alert record, recent alerts) from /scan, /alerts and /home-summary only, painted by the shared kit. It
# never reads /status, /portfolio or /alerts/pops (each asks Kalshi live) and never writes; every start path of the
# full page is gated on the kit's decision. No route, schema or manifest key changes beyond the version.
#
# 2026-10-30 — 1.6.5: THE SCAN DOES ITS JOB; JARVIS HEARS NOTHING UNTIL YOU SAY SO. notifyJarvis now defaults to
# false (user scope, switchable on the Settings tab), so turning the background-scan job on keeps the snapshot fresh
# and alerts nobody. The schedule's offer says only that. Roger, 2026-10-29: "i dont want kalshi to tell jarvis i want
# kalshi to do its job .. and maybe later ill want it to tell jarvis".
#
# 2026-10-30 — 1.7.0: BROWSE KALSHI, AND A QUANT WHO WALKS YOU THROUGH EVERY BET. The snapshot keeps every market the
# scan walked (not only the playable hands); a MARKETS tab lists them with the book, the horizon and the evaluator's
# verdict in words, a Why button opens the walkthrough (price vs calibrated chance, fee, net edge, evidence, book, flags,
# sizing), and Ask the quant hands that question to this application's own concierge, kalshi-quant, which reads the
# same numbers through the kalshi_market / kalshi_markets / kalshi_scan tools and explains them in plain words. Any
# ticker can be looked up live (GET /markets/:ticker). Roger, 2026-10-30: "i should also be able to browse kalshi not
# just the edges and talk to an agent quant who can walk me through why every bet is bad".
#
# Framework: OSHAL (see docs/adr/085-remote-app-packages-and-registries.md)
# ─────────────────────────────────────────────────────────────────────────────

name: kalshi
suite: ai-finance   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features:
    - id: quant-walkthrough
      unit: question
      tier: T2
      generation: hosted
      degrade: template   # the Why walkthrough is deterministic words from the evaluator's numbers; the quant adds conversation
displayName: Kalshi Prediction Markets
description: >-
  Browse Kalshi's open event contracts with a verdict on every one, and ask the quant why a bet is bad
  or good. Every open market is evaluated like a poker hand —
  calibrated true probability (from settled-market history) versus price plus fees — and the
  playable hands are ranked with Kelly-sized stakes and explicit risk flags. Portfolio view and
  order placement ride the per-user connector, confirm-gated and demo-exchange-first
  (KALSHI_LIVE_ENABLED gates live money; every order and refusal is audited).
# 1.7.5: UX audit (kalshi--kalshi-home), layout only: the header names the Kalshi account state beside the exchange line; one stale chip with Scan now; a phone bottom bar with More; each market title once, 50 rows then Show more; the Why panel dates a scan verdict; a 44px ticker lookup by the search. No order path changed.
# 1.7.6: UX audit follow-up: the bars, sheets, menus and dialogs this lane added are opaque (the theme card tone over the page colour; light-blue cards are 62% white, so the phone bar and menus let the page show through).
# 1.7.7: tests only. The Test Lab catalog parses again (three case purposes, market-explainer, markets-routes and quant-contract, held an unquoted second colon, so the kernel refused the whole package at install); the audience-view guard expects the Markets load the 1.7.0 tab added to the page's start; the phone-layout proof opens Alerts through More, where the 1.7.5 bottom bar put it. No route, tool, screen or order path changed.
# 1.7.8: Jarvis routing words (backlog P4-16n): kalshi-quant adds the plural 'prediction markets', because a phrase matches only as written. "Which prediction markets have an edge tonight?" now reaches Kalshi. No route, tool or permission changed.
# 1.8.0: THE PREDICTIONS GET GRADED. Nothing on the native kernel graded them (the grader was a command-line script of the
# retired platform), so the Scorecard stood at graded 0 with 3,430 and 1,395 pending (Roger, 2026-11-10: "Kalshi makes
# predictions but never follows up on if it got them correct ... I can't find a moat if it's not scoring its calls").
# routes/kalshi-grade.js reads Kalshi's public results for every prediction past its close, forty markets a lookup, and
# writes the outcome, our Brier, the market's Brier and one contract at the recorded ask (the retired grader's formulas).
# No Kalshi account, no order. It runs from the background-scan job on the firings where no scan is due, so the job a
# person already turned on does it with nothing new to activate, and from the Scorecard tab (GET /grade, POST /grade),
# which grades what is waiting when it is opened and says where the ledger stands.
# 1.8.1: grading a large ledger is quick. On production a ledger of 4,800 predictions graded 100 of 4,544 in the first
# scheduled run, because each prediction was its own write and a write there reads the person's whole table (about 0.4 s).
# A lookup's markets are now graded by two writes (those that settled YES, those that settled NO), the scores computed in
# the statement from the row's own columns. The Scorecard says "Not finished" with how far it got when a walk stops
# early, instead of saying Kalshi has no result for markets it never asked about.
# 1.9.0: THE CALIBRATION TABLE IS REBUILT BY THE PACKAGE. The scan prices every market against a table of what a price
# actually settled at, built on 2026-07-13 by a command-line study of the retired platform that nothing runs any more
# (the page said 120 days old). The background-scan job now takes a turn at rebuilding it with the time each firing has
# left (lib/kalshi-calibration-walk.js, lib/kalshi-calibration-store.js): the same questions the study asked Kalshi's
# public API (twelve categories, their series, up to 60 settled markets a series and 400 a category, each market's
# hourly prices at 24, 6 and 1 hours before close), one at a time, with the walk's place, samples and finished tables
# in this package's own tables (migrations/077-kalshi-calibration.sql). A whole rebuild takes many firings (about
# half a day); a table is rebuilt when it is thirty days old. Until the first rebuild finishes the shipped table is
# read; GET /calibration and /status say which (`source`). No account, no order, nothing new to turn on.
version: 1.9.1
status: active
# This package owns deterministic surfaces and routes; its own quant owns the right rail (ADR-083 inline concierge).
chatBot: kalshi-quant

bots:
  # The conversational specialist: reasons over the package's routes through the tools below; never trades.
  - agentId: 0bfe0791-8c27-4267-ba30-b254f45d76b6
    name: kalshi-quant
    persona: personas/kalshi-quant.yaml
    posture: inline
    role: kalshi/quant
    capabilities:
      - market-walkthrough
      - edge-explanation

# These capabilities are the minimum core contract; older cores must reject the package.
uses: [jarvis-briefings, test-catalog, app-dependencies]
testing:
  version: 1
  catalog: tests/test-lab.yaml
briefings:
  - id: playable-hands
    title: Kalshi playable hands
    description: New playable scan candidates, subject to your Kalshi alert rules and application access.
    sessionId: kalshi-alerts
    defaults: { enabled: true, frequency: as-available, channel: voice }

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: kalshi
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/kalshi/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# Runtime connector allow-list — the per-user Kalshi API key (keyId:PEM) the
# broker resolves for portfolio reads + order placement (BYO, never platform).
dependencies:
  required:
    apps: []
    tools: []
    connectors: [kalshi]
  optional:
    apps: []
    tools: []
    connectors: []

# OUTBOUND HOSTS. A native package has no network of its own: the kernel's fenced egress carries
# the prediction-markets reads (open markets, series fee models, candles, the exchange state) and
# refuses any host not declared here. Kalshi's market data is public; no credential is attached.
egress:
  - host: api.elections.kalshi.com

theme: light-blue

# ─────────────────────────────────────────────────────────────────────────────
# SETTINGS — the ALWAYS-ON SCAN's configuration, and the single source of truth for its
# defaults (operator, 2026-07-30: "it should always be running on new opportunities every
# X ms based on configuration ... every hour ... all of this should be in the yaml as
# config, and can be changed in settings").
#
# HOW THESE VALUES ARE USED. The package reads THIS FILE at activation (via
# ctx.appPackageDir) and takes each `default` as the base config; a deployment row and a
# per-user row in `kalshi_scan_settings` override it, and every value is clamped by
# src-routes/kalshi-scan-config.ts. So: edit this file to change the shipped default for a
# fresh install; use the app's **Settings tab** (GET/PUT /api/kalshi/settings) to change a
# running deployment without a redeploy. Reloaded within a minute — no restart.
#
# `scope:` says WHO may change a key. `deployment` = one scan serves everyone, so the
# cadence is operator-only (403 otherwise). `user` = your own alerts, saved per person.
# (`scope`/`min`/`max`/`enum` extend the store contract's type/default/label triple; the
# framework does not yet render manifest settings itself — this app renders its own panel
# from this schema. See README "Framework gap".)
# ─────────────────────────────────────────────────────────────────────────────
settings:
  schema:
    scanEnabled:
      type: boolean
      default: true
      scope: deployment
      label: Keep scanning in the background
    scanIntervalMinutes:
      type: integer
      default: 60          # the operator's "like every hour"
      min: 5
      max: 1440
      scope: deployment
      label: Scan every (minutes)
    scanOnActivate:
      type: boolean
      default: true
      scope: deployment
      label: Run one scan shortly after start (so the first open is warm)
    scanMaxMarketsPaged:
      type: integer
      default: 60000       # Kalshi pages 1000 at a time; >99% of the flat feed is parlay legs
      min: 1000
      max: 200000
      scope: deployment
      label: Markets paged per scan
    scanMaxMarketsKept:
      type: integer
      default: 1500
      min: 50
      max: 5000
      scope: deployment
      label: Evaluable markets kept per scan
    staleAfterMinutes:
      type: integer
      default: 180
      min: 5
      max: 10080
      scope: deployment
      label: Label the snapshot stale after (minutes)
    notifyJarvis:
      type: boolean
      default: false        # off until the person switches it on: the scan does its job, Jarvis hears nothing
      scope: user
      label: Tell Jarvis when new playable hands appear (off until you switch it on)
    notifyOutward:
      type: boolean
      default: false        # opt-in: an hourly job may not start emailing/texting on its own
      scope: user
      label: Also send to my notification channel (email/SMS/Telegram)
    alertMinEdgeCents:
      type: number
      default: 3
      min: 0
      max: 50
      scope: user
      label: Only alert at or above this net edge (¢)
    alertMinStrength:
      type: string
      default: playable
      enum: [monster, strong, playable]
      scope: user
      label: Minimum hand strength to alert on
    alertTopN:
      type: integer
      default: 5
      min: 1
      max: 25
      scope: user
      label: Hands named in one alert
    alertMaxPerDay:
      type: integer
      default: 6
      min: 0
      max: 48
      scope: user
      label: Maximum alerts per day

# The background scan runs only inside an admitted request: this schedule fires POST /scan/tick as the
# person who activated it, and the tick scans only when the stored snapshot is older than the configured
# scanIntervalMinutes (so a fifteen-minute fire is cheap when nothing is due). It replaces the one-minute
# in-process timer, whose ticks ran outside any request and were refused their SQL by the native kernel.
schedules:
  - id: background-scan
    cron: "*/15 * * * *"
    runsAs: user
    target: service-route
    route: /api/kalshi/scan/tick
    method: POST
    body: {}
    timeoutSeconds: 300
    description: Scan Kalshi's open markets when the snapshot is due. Jarvis hears about new hands only when Tell Jarvis is on in Settings.
    offer: Keep my Kalshi edge scan fresh.

# ─────────────────────────────────────────────────────────────────────────────
# TOOLS — read-only reads of this package's own routes for the kalshi-quant concierge (and Jarvis).
# Each is an API tool over a mounted /api/kalshi route, called as the person asking. None places
# an order; the order routes stay confirm-gated on the page.
# ─────────────────────────────────────────────────────────────────────────────
tools:
  - name: kalshi_market
    displayName: Kalshi market walkthrough
    type: api
    category: finance
    description: >-
      One Kalshi market with the evaluator's full walkthrough: verdict (monster, strong, playable,
      fold or not evaluable), the side, price vs calibrated chance, fee, net edge, evidence
      (settled-market count and confidence), book, risk flags, sizing, and the numbers behind them.
      Read from the last scan, else live from Kalshi. Read-only. Input: {"ticker":"KXRAIN-26OCT31-AUS"}.
    executor: { executorType: api, apiEndpoint: "GET /api/kalshi/markets/{input.ticker}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      required: [ticker]
      properties:
        ticker: { type: string, description: "The Kalshi market ticker, such as KXRAIN-26OCT31-AUS (find one with kalshi_markets)" }
    usageInstructions: Call it for any question about one market; speak its numbers in cents and percentages and keep its verdict and reasons.
    routingTags: [kalshi, market, bet, odds, edge, why]
    skills: [kalshi]
    tags: [kalshi]

  - name: kalshi_markets
    displayName: Kalshi markets browse
    type: api
    category: finance
    description: >-
      The markets the last scan walked, each with its book, close time and verdict headline.
      Filter by a search word (title, ticker or category), a category, a verdict (all, playable,
      fold, not-evaluable) and a sort (closes, edge, volume). Read-only.
      Input: {"q":"rain","category":"Weather","verdict":"all","sort":"edge","limit":20}.
    executor: { executorType: api, apiEndpoint: "GET /api/kalshi/markets?q={input.q}&category={input.category}&verdict={input.verdict}&sort={input.sort}&limit={input.limit}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        q: { type: string, description: "A word from the market title, ticker or category" }
        category: { type: string, description: "An exact category name from the list" }
        verdict: { type: string, enum: [all, playable, fold, not-evaluable] }
        sort: { type: string, enum: [verdict, closes, edge, volume], description: "verdict (default): priced markets first, strongest and best edge on top" }
        limit: { type: integer, minimum: 1, maximum: 200, description: "Rows to return (default 300 on the route; ask for fewer)" }
    usageInstructions: Use it to find a market by words before kalshi_market, or to answer what is open in a category; name the scan's time.
    routingTags: [kalshi, markets, browse, search]
    skills: [kalshi]
    tags: [kalshi]

  - name: kalshi_scan
    displayName: Kalshi edge scan
    type: api
    category: finance
    description: >-
      The last background scan: the playable hands ranked by strength and edge, the strategy's
      stake gate and scorecard, the calibration table's age and the scan's freshness. Read-only. Input: {}.
    executor: { executorType: api, apiEndpoint: "GET /api/kalshi/scan" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
    usageInstructions: Use it for "what is playable now" questions; say when the scan ran and whether the strategy may stake.
    routingTags: [kalshi, scan, playable, hands]
    skills: [kalshi]
    tags: [kalshi]

# ROUTES — the packaged surface router, mounted /api/kalshi on activation. (In
# core server.ts this was createKalshiRoutes behind serviceSecretOr(requiresAuth),
# same as /api/trading. Handlers also self-gate via callerSub.)
routes:
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/kalshi/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/kalshi/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/kalshi-routes.js
    factory: createKalshiRoutes
    mountPath: /api/kalshi
    auth: service-or-oidc   # what core server.ts mounted (ADR-085 D2)
    requiresAuth: true
    requiresContext: true

# DATABASE MIGRATIONS — applied idempotently on load. Package COPIES of the
# kernel's 074 (order audit trail) + 075 (forward-test prediction ledger +
# forecast log); the route's lazy ensureKalshiSchema also self-heals kalshi_orders.
migrations:
  - migrations/074-kalshi-orders.sql
  - migrations/075-kalshi-forward-test.sql
  # OWNED BY THIS PACKAGE (not a kernel copy): the background scan's snapshot, its config
  # overrides, and the per-user alert ledger. kalshi-scan-engine also self-heals these, so the
  # app works whether or not APP_PACKAGE_MIGRATIONS is on.
  - migrations/076-kalshi-scan-automation.sql
  # The calibration rebuild's walk, samples and tables (1.9.0).
  - migrations/077-kalshi-calibration.sql

# ─────────────────────────────────────────────────────────────────────────────
# COCKPIT UI SURFACE — one ribbon icon opens the edge-scan page served by
# createKalshiRoutes at /api/kalshi/ (ranked hands, calibration freshness, filters).
# ─────────────────────────────────────────────────────────────────────────────
