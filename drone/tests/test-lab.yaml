version: 1
cases:
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its family (Home shell) and company (Business shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the family view makes two reads, GET /api/drone/missions and GET /api/drone/home-summary, and the real routes behind them only SELECT the caller's own rows; it never writes, never reads live telemetry, the fleet or the chat, and never sends a vehicle command.
      - Fed by the package's real routes, the saved plans read as plain stats (saved, not flown yet, plans started in five days, commands turned down in five days) and as tiles naming each plan's shape, origin and state; no tile opens, flies or changes anything.
      - A plan the route marks flown reads Started, never flown, because the route writes that flag when a flight starts; the title ladder, a full 50-plan list and odd rows each read as what they are.
      - A summary count that could not be checked reads Could not check while the saved plans still show; signed out, refused, the route's own failure, an unreadable answer and an unreachable server each read as what they are.
      - Under the family view the page's main script and connected-actions script bind no listener, read nothing, start no poll and mount no offer; the full page still runs every start step.
      - Under a view the page's own module loads and mounts nothing; without the audience, and without the kit, it loads /shared/ui/js/jarvis-chat-frame.js and mounts the one chat window into the Operator chat as Drone Ops' concierge (drone-operator, no Close, loaded once shown); a kernel without the window gets a plain line instead.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: location-scoping
    name: Position for the drone's group
    purpose: >-
      Verify that GET /state, GET /fleet and GET /fleet/:droneId/state return live position and home only when the
      kernel's locatedDevice answers for the caller (a member of the group that owns the drone's location record),
      that everyone else gets both as null with positionWithheld, that a refused or failed location read is a
      withheld answer and never an error, and that the surface guards every read of a withheld drone's position.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/location-scoping.test.cjs
    expected:
      - A member of the drone's group reads position and home on all three routes; battery, status, the fence and the fleet flags are unchanged.
      - A non-member reads null position and home with positionWithheld true, and no coordinate of that drone appears in the answer.
      - A drone enrolled nowhere is withheld from everyone; a locatedDevice refusal or failure is logged and answered as withheld.
      - The surface guards every read of position and home it makes from the fleet and state answers.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: fleet-hint-native
    name: Fleet hint says what this installation sudroneorts
    purpose: The Drone Ops page must not tell a person to run the retired platform's npm run drone:node; the native kernel ships no drone node.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/fleet-hint-native.test.cjs
    expected:
      - The visible page names no npm script, drone:node or swarm secret.
      - The Fleet hint says no drone node ships with this installation, so none can be added here.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: chat-no-drone
    name: Operator chat with no drone registered
    purpose: Drive the compiled POST /chat (the draft-drone-mission tool) with a double of the native drone service (configured false, every read throws) and with an engine whose reads fail, and run the surface's own applyFleetAvailability and syncOperatorChat.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/chat-no-drone.test.cjs
    expected:
      - Both answer 200 with noDrone true, draft null and a plain reply naming that no drone or simulator is registered; no raw executor text, no planner call, no mission row.
      - While no drone is registered the operator chat window's help line says nothing can be drafted or flown yet, with its own starters, and says what a drone allows again once one is; each is told once per change.
      - The page has no chat input, Send or chat request of its own.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: battery-unknown
    name: An unknown battery reads empty, never full
    purpose: >-
      In Chromium at 412x915 the shipped Drone Ops page opens over a fleet that reports no drone (sweep 14: the header
      battery bar was full and green beside "–%").
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/battery-unknown.test.cjs
    expected:
      - The No drone connected empty state shows on the canvas, the percentage reads "–%" and the bar's fill is 0 px wide.
    prerequisites:
      - runner:node-test
      - dependency:playwright
      - browser:chromium
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
  - id: flight-bar-layout
    name: The flight safety bar stays on screen
    purpose: >-
      UX audit 2026-11-06 (drone--drone-ops): scrolling the rail to name a mission moved Land, Return home and Abort ALL
      off screen. In Chromium the shipped Drone Ops page keeps them in a fixed 52px flight bar; layout only, no command is sent.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/flight-bar-layout.test.cjs
    expected:
      - At 412x915 with touch, Land, Return home and Abort ALL are inside the viewport, 52px tall and uncovered at the top, at the end of the rail, and in the Plan view with the mission name in view.
      - At 1440x900 the bar sits at the bottom of the canvas, the canvas keeps at least 60% of the width, the rail scrolls on its own and the page does not.
      - Plan waypoints, Direct goto, 3D and CAM are one exclusive choice; the small buttons are 44px.
      - With no drone one empty state sits on the canvas, the banner and map hint do not repeat it, flight buttons, mission inputs and Clear all are off, and no /fleet/<drone>/ poll is sent.
      - Brief opens the diagnostic brief sheet over the canvas, never over the rail, and Done closes it.
      - Every non-GET request is aborted and counted; none is sent.
    prerequisites:
      - runner:node-test
      - dependency:playwright
      - browser:chromium
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
  - id: phone-first-screen
    name: Drone Ops shows the no-drone state near the top on a phone
    purpose: "Guard 1.4.1 (lane mobilesweep2): the real page in a stand-in for Today over the native no-drone fleet answer, at 412x915, 390x844 and 360x780 with touch and at 1440x900."
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/drone-phone-first-screen.test.cjs
    expected:
      - On a phone the no-drone card starts within the top 30% of the screen (it was 306 px, 33%) and the header is one row with Brief, without the provider pill or the battery.
      - Land, Return home and Abort ALL stay in the flight bar; nothing scrolls sideways; the desktop keeps the provider pill, the battery and the card in the middle of the map.
      - Opening Drone Ops writes nothing and raises no page error.
    prerequisites:
      - runner:node-test
      - runtime:store-pinned-toolchain
      - runtime:chromium
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 120000
    installation: never
  - id: one-chat-window
    name: The Operator chat is the one chat window, with the screen on every turn
    purpose: >-
      Serve the shipped page with the kernel's one chat window from a kernel platform export (OSHAL_KERNEL_PLATFORM) and its
      stand-in kernel over a local fixture server, a made-up fleet of two simulator drones and no provider; requests off the
      loopback are refused.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/drone-one-chat-window.test.mjs
    expected:
      - At 1440x900 and 412x915 the Operator chat in the Plan view is the window (concierge drone, bot drone-operator) after Missions, inside the rail, with its model menu, Files, Tap to talk, Keep trying and conversations; nothing runs sideways.
      - A model picked in the window rides on the turn; the person's words alone reach drone-operator's door with context.app drone.
      - context.screen_state carries the Fleet list, the selected drone's telemetry and home, the geofence and the saved missions as the page shows them; no document is named.
      - A draft the turn saved is listed under Missions and drawn on the map after the turn; the page draws no transcript, message box or Send of its own and sends no POST /api/drone/chat or GET /api/drone/conversation; no page error.
      - A flight the bot proposes is the window's approval card; nothing flies before Approve, Approve sends exactly the held request to the mission's execute route, and the page reads its missions again for each Drone Ops card that ran.
      - With no drone registered the window's help line says nothing can be drafted or flown yet and each turn carries the reason on its screen.
    prerequisites: [runner:node-test, runtime:store-pinned-toolchain, runtime:chromium, 'source:shared-ui']
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: Stop the fixture server.
    limits:
      timeoutMs: 120000
    installation: never

  - id: drone-bot-tools-contract
    name: Inline concierge posture, tool schemas, plain-prose rule, and tool_call fence
    purpose: 'Verify drone-operator declares explicit inline posture, chatBot binding, object inputSchemas on all four tools, and plain-prose + ```tool_call {"tool": ...} instructions for oshald.'
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/drone-bot-tools-contract.test.cjs
    expected:
      - drone-operator declares posture inline and chatBot drone-operator with explicit object inputSchemas on all four tools.
      - personas/drone-operator.yaml teaches plain prose for direct chat and the ```tool_call fence using "tool" for all four declared tools.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
