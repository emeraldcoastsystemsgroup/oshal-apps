# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — movies ("Movies & TV")
# Carved out of OSHAL core 2026-07-18 (ADR-085 Wave 2 carve #1).
#
# An AI movies & TV concierge that drives a visual surface: it searches films +
# shows (TMDB), shows where each is streaming + trailers, recommends from the
# viewer's taste, curates a watchlist, and hands off streaming + ticket links.
#
# Handoff truth: discovery uses the free TMDB API (operator key). "Watch" opens a
# where-to-watch (JustWatch) page and "Tickets" opens a Fandango search — the viewer
# streams or buys there. OSHAL never streams or sells.
#
# BOT NOTE: movies-concierge (b00b…001) is declared below (bots:) and runs inline on
# the native kernel (1.1.7). Its platform-era bot-node (movies-bot container,
# registry blocks, moviesToolKit.js / oshal-tmdb.js) stayed in the framework repo
# as the ADR-093 interim operator fragment.
# ─────────────────────────────────────────────────────────────────────────────

name: movies
suite: ai-home   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 64, high: 256, basis: declared }
  features:
    - id: movie-chat
      unit: concierge chat turn
      tier: T2
      generation: none
      degrade: disable
    - id: movies-ticket
      unit: movie or TV request ticket
      tier: T4
      generation: none
      degrade: disable
displayName: Movies & TV
description: >-
  AI movies & TV concierge — search films and shows, see where they're streaming,
  watch trailers, get recommendations, build a watchlist, and find showtimes. Other
  swarm bots can ask it what to watch or where to watch it.
version: 1.1.8
testing:
  version: 1
  catalog: tests/test-lab.yaml
status: active

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: movies
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/movies/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# TMDB is the one connector this app reads (operator/tenant key or env fallback);
# declaring it scopes the app profile's connector surface to exactly that.
dependencies:
  required:
    apps: []
    tools: []
    connectors: [tmdb]
  optional:
    apps: []
    tools: []
    connectors: []

# Kernel skills this app declares (ADR-090 uses: contract, fail-closed at load).
# `app-dependencies` is the compatibility floor for the tiered dependencies block above: a core
# that predates required/optional refuses this package instead of installing it without its
# required dependencies and without its connector allow-list.
uses:
  - app-dependencies
  - test-catalog

# Guests never reach the concierge (was hardcoded Tier C in core's
# guest-capability matrix; the literal left with this carve). Request only —
# grants come from the operator endpoint (D4).
guestTier: blocked

# Outbound hosts (native kernel): the sandbox has no network, so every TMDB read goes through the
# kernel's fenced egress, which applies the tmdb connector's key (the person's saved connection or
# the installation's OSHAL_CONNECTOR_SECRET_TMDB) as ?api_key=. This package never holds the key.
egress:
  - host: api.themoviedb.org
    credential: { connector: tmdb, query: api_key }

# The Movie Concierge's tools (1.1.8): the one chat window's bot reaches the catalog, the watchlist and the viewer's tastes
# through the package's own routes, as the person. Reads and the watchlist add run at once, as the page's chat did.
tools:
  - name: search-titles
    displayName: Search Movies and Shows
    type: api
    category: media
    description: Search real movies and TV shows by title, person or mood (The Movie Database); each result has its key for the other tools.
    executor: { executorType: api, apiEndpoint: "GET /api/movies/search?q={input.query}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        query: { type: string, description: "A title, a person or a few words of what the viewer wants" }
      required: [query]
    usageInstructions: >-
      Use the returned items as the only titles: each has key ("movie:603"), id, mediaType, title, year, overview,
      rating and genres. A 409 not_configured means the movie database is not connected here; say so.
    routingTags: [movies, tv, search]
    skills: [title-search]
    tags: [movies, route-backed]

  - name: trending-titles
    displayName: Trending This Week
    type: api
    category: media
    description: The movies and shows trending this week (The Movie Database).
    executor: { executorType: api, apiEndpoint: "GET /api/movies/trending" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, additionalProperties: false, properties: {} }
    usageInstructions: Use for "what is popular", "what's new" or an open request with nothing to search for.
    routingTags: [movies, tv, trending]
    skills: [movie-tv-discovery]
    tags: [movies, route-backed]

  - name: title-details
    displayName: Title Details and Where to Watch
    type: api
    category: media
    description: One title in full - details, where it streams, rents or sells in the viewer's region, its trailer, titles like it and a tickets link for a movie.
    executor: { executorType: api, apiEndpoint: "GET /api/movies/title?type={input.mediaType}&id={input.id}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        mediaType: { type: string, enum: [movie, tv], description: "The title's mediaType" }
        id: { type: integer, description: "The title's id" }
      required: [mediaType, id]
    usageInstructions: >-
      Call with the mediaType and id of a title from search-titles, trending-titles or the screen. where.link is the
      where-to-watch page; where.flatrate lists the subscription services. Never claim to play or buy anything.
    routingTags: [movies, tv, streaming]
    skills: [where-to-watch-streaming]
    tags: [movies, route-backed]

  - name: movie-tickets
    displayName: Find Showtimes
    type: api
    category: media
    description: A Fandango search link for a movie's showtimes and tickets near a place; the viewer picks a theater and pays there.
    executor: { executorType: api, apiEndpoint: "GET /api/movies/tickets?title={input.title}&location={input.location}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        title: { type: string, description: "The movie's title" }
        location: { type: string, description: "A city or ZIP code; omit when the viewer named none" }
      required: [title]
    usageInstructions: Give the viewer the returned url; OSHAL never sells tickets.
    routingTags: [movies, showtimes, tickets]
    skills: [showtimes-handoff]
    tags: [movies, route-backed]

  - name: read-watchlist
    displayName: Read the Watchlist
    type: api
    category: media
    description: The titles on the viewer's watchlist, newest first.
    executor: { executorType: api, apiEndpoint: "GET /api/movies/watchlist" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, additionalProperties: false, properties: {} }
    usageInstructions: Use before recommending, so a title already saved is not offered as new.
    routingTags: [movies, watchlist]
    skills: [watchlist-curation]
    tags: [movies, route-backed]

  - name: add-to-watchlist
    displayName: Add to Watchlist
    type: api
    category: media
    description: Save a title to the viewer's watchlist.
    executor: { executorType: api, apiEndpoint: "POST /api/movies/watchlist" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        key: { type: string, description: "The title's key, such as movie:603" }
        title: { type: string }
        year: { type: string }
        mediaType: { type: string, enum: [movie, tv] }
        id: { type: integer }
        posterUrl: { type: string }
        tmdbUrl: { type: string }
      required: [key, title]
    usageInstructions: Call when the viewer asks to save a title, with the fields its search or details result gave; say it was added only from the result.
    routingTags: [movies, watchlist]
    skills: [watchlist-curation]
    tags: [movies, route-backed]

  - name: read-movie-taste
    displayName: Read the Viewer's Tastes
    type: api
    category: media
    description: What the concierge keeps about this viewer - remembered notes and the profile's favorite genres and streaming services.
    executor: { executorType: api, apiEndpoint: "GET /api/movies/notes" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, additionalProperties: false, properties: {} }
    usageInstructions: Read before recommending; weight picks toward the services the viewer has.
    routingTags: [movies, preferences]
    skills: [movie-taste-learning]
    tags: [movies, route-backed]

  - name: remember-movie-taste
    displayName: Remember a Taste
    type: api
    category: media
    description: Keep a taste the viewer states (a genre, a show they loved, a service they have) for later picks.
    executor: { executorType: api, apiEndpoint: "POST /api/movies/notes" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        note: { type: string, description: "The short note to keep, such as \"loves slow-burn sci-fi\"" }
        said: { type: string, description: "The viewer's own words this turn that state it, copied exactly" }
      required: [note, said]
    usageInstructions: Call when the viewer states a taste worth keeping, with said copied from their own words; a note their words do not state is not kept.
    routingTags: [movies, preferences]
    skills: [movie-taste-learning]
    tags: [movies, route-backed]

# Compiled-JS route (built from src-routes/ by `oshal-app build`). One OIDC mount;
# every route resolves the viewer sub itself; the surface serves from this
# package's tools/ via ctx.appPackageDir.
routes:
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/movies/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/movies/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/movies-routes.js
    factory: createMoviesRoutes
    mountPath: /api/movies
    auth: oidc
    requiresContext: true

# Belt-and-braces: the same five tables ensureMoviesSchema creates lazily
# (owner RLS at the chokepoint). Idempotent — safe on DBs where core migration
# 048 already ran.
migrations:
  - migrations/048-movies-platform.sql

# The bot a Jarvis creation request goes to (its own workflow bot).
chatBot: movies-concierge

# WORKFLOW — tickets of type 'movies' route to the concierge (see BOT NOTE).
ticketType: movies
workflow:
  name: Movies & TV Concierge Pipeline
  pipeline: movies
  workerBot: movies-concierge
  phases:
    - intake     # understand the mood / title / "what's on tonight"
    - find       # search titles, check where-to-watch, recommend
    - handoff    # save to watchlist + hand off the stream/ticket link

# ─────────────────────────────────────────────────────────────────────────────
# COCKPIT UI SURFACE — one ribbon icon opens the Movies surface (served by
# createMoviesRoutes from this package's tools/).
# ─────────────────────────────────────────────────────────────────────────────
ui:
  static:
    - toolName: movies-concierge
      label: Movies & TV
      icon: codicon codicon-device-camera-video
      iframeUrl: /api/movies/app
      section: top

ribbon:
  hideFrameworkItems:
    - tickets
    - chat
    - calendar
    - addressbook
    - dashboard
    - logs
    - operations
  hideChatPanel: true
  # One assistant entry (UX audit 2026-11-06): the in-page Ask sheet is the concierge (since 1.1.8 the kernel's one chat window), so the shell's orb is withheld here;
  # it sat on the sheet's Send button at 1440x900. Remove this line to bring the orb back.
  hideAssistant: true
  defaultView: movies-concierge

summary:
  path: /api/movies/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items

integrations:
  offers:
    - id: plan-meal
      label: Plan a meal
      targetApp: eats
      targetAction: plan-meal
      contextType: planning-brief
      version: 1
    - id: plan-music
      label: Plan music
      targetApp: spotify
      targetAction: plan-music
      contextType: planning-brief
      version: 1
    - id: plan-ride
      label: Plan a ride
      targetApp: rides
      targetAction: plan-ride
      contextType: planning-brief
      version: 1
  accepts:
    - id: plan-movie
      contextType: planning-brief
      version: 1
      surface: movies-concierge
      fields:
        - title
        - notes
        - sourceUrl

# The concierge keeps its UUID. It runs inline: the native kernel answers the Ask sheet's chat
# route with it as an application bot turn; no dedicated node.
bots:
  - agentId: b00b0000-0000-0000-0000-000000000001
    name: movies-concierge
    persona: personas/movies-concierge.yaml
    posture: inline   # native kernel: an application bot turn; no dedicated node
    role: media/film-tv
    capabilities: ['movie-tv-discovery', 'title-search', 'where-to-watch-streaming', 'watchlist-curation', 'movie-taste-learning', 'showtimes-handoff']
