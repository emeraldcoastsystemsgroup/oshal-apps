version: 1
cases:
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its family (Home shell) and company (Business shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the family view reads only /api/movies/config and /api/movies/watchlist; never trending, search, title detail, the concierge or its conversation.
      - Only themoviedb.org title pages link out, in a new tab; saved times are formatted as timestamps.
      - Not connected keeps the watchlist and offers the connection; an unknown connection check, an empty watchlist, a refusal and a failure each read as what they are.
      - Under an audience view the module script adds no handoff listener and fetches no connected-actions offer.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: concierge-envelope
    name: Concierge reply envelope is never shown raw
    purpose: >-
      Parse the Movie Concierge reply with the package-local parser the compiled route uses: a fenced, prose-wrapped or bare envelope is read, an unreadable one is a plain apology, plain prose stays the reply.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/movies-envelope.test.cjs
    expected:
      - A ```json fenced envelope, an envelope inside prose and a bare one each give its say, show, watchlist and remember.
      - An envelope that cannot be parsed, or one with no say, answers a plain apology and never the raw object.
      - Plain prose stays the reply and an empty reply stays empty.
      - The compiled route and its TypeScript source import ./movies-envelope and not the framework concierge-envelope helper.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: title-sheet-contrast
    name: Title sheet and accent buttons read in every theme
    purpose: >-
      Read the served page CSS: the title sheet is opaque on the surface token over the scrim token with no blur, the synopsis uses the second ink token, accent buttons use the on-accent token, and the Light Blue and Graphite fallbacks reach 4.5:1.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/movies-title-sheet.test.cjs
    expected:
      - The sheet background is the surface token with an opaque fallback and no backdrop blur; the modal uses the scrim token with no blur.
      - The synopsis uses the second ink token and no fixed light grey remains.
      - Accent buttons and the viewer chat bubble use the on-accent ink token.
      - With the current Light Blue and Graphite theme values the synopsis and button ink are at least 4.5:1.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: media-home
    name: Media home leads with artwork, Search and Watchlist are views
    purpose: >-
      Read and run the served page: a hero from Trending with Where to watch as the one primary, poster rows with one caption line, Home, Search and Watchlist views with Movies and TV chips, a literal search placeholder, and the concierge as a sheet with suggested prompts.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/movies-media-home.test.cjs
    expected:
      - Browse has no inner header, overline or connection chip.
      - The hero is the first trending title with one primary, Where to watch, and + Watchlist as the secondary; every trending title is a poster captioned title and year.
      - Home, Search and Watchlist are views, a bottom bar on a phone; Movies and TV chips filter them; the search placeholder is Search movies and shows.
      - An empty watchlist says so in its own view.
      - The concierge is a sheet with two to four suggested prompts; opening a title closes it and opening it closes the title sheet.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
