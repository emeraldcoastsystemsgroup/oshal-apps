version: 1
cases:
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its family (Home shell) and company (Business shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the family view reads only /api/movies/config and /api/movies/watchlist; never trending, search, title detail, the concierge or its conversation.
      - Only themoviedb.org title pages link out, in a new tab; saved times are formatted as timestamps.
      - Not connected keeps the watchlist and offers the connection; an unknown connection check, an empty watchlist, a refusal and a failure each read as what they are.
      - Under an audience view the module script adds no handoff listener and fetches no connected-actions offer.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: concierge-envelope
    name: Concierge reply envelope is never shown raw
    purpose: >-
      Parse the Movie Concierge reply with the package-local parser the compiled route uses: a fenced, prose-wrapped or bare envelope is read, an unreadable one is a plain apology, plain prose stays the reply.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/movies-envelope.test.cjs
    expected:
      - A ```json fenced envelope, an envelope inside prose and a bare one each give its say, show, watchlist and remember.
      - An envelope that cannot be parsed, or one with no say, answers a plain apology and never the raw object.
      - Plain prose stays the reply and an empty reply stays empty.
      - The compiled route and its TypeScript source import ./movies-envelope and not the framework concierge-envelope helper.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: title-sheet-contrast
    name: Title sheet and accent buttons read in every theme
    purpose: >-
      Read the served page CSS: the title sheet is opaque on the surface token over the scrim token with no blur, the synopsis uses the second ink token, accent buttons use the on-accent token, and the Light Blue and Graphite fallbacks reach 4.5:1.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/movies-title-sheet.test.cjs
    expected:
      - The sheet background is the surface token with an opaque fallback and no backdrop blur; the modal uses the scrim token with no blur.
      - The synopsis uses the second ink token and no fixed light grey remains.
      - Accent buttons and the viewer chat bubble use the on-accent ink token.
      - With the current Light Blue and Graphite theme values the synopsis and button ink are at least 4.5:1.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: media-home
    name: Media home leads with artwork, Search and Watchlist are views
    purpose: >-
      Read and run the served page: a hero from Trending with Where to watch as the one primary, poster rows with one caption line, Home, Search and Watchlist views with Movies and TV chips, a literal search placeholder, and the concierge as a sheet holding the kernel's one chat window.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/movies-media-home.test.cjs
    expected:
      - Browse has no inner header, overline or connection chip.
      - The hero is the first trending title with one primary, Where to watch, and + Watchlist as the secondary; every trending title is a poster captioned title and year.
      - Home, Search and Watchlist are views, a bottom bar on a phone; Movies and TV chips filter them; the search placeholder is Search movies and shows.
      - An empty watchlist says so in its own view.
      - The concierge is a sheet that holds the kernel's one chat window (the Movie Concierge) and no chat of the page's own; opening a title closes it and opening it closes the title sheet.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: one-chat-window
    name: The Movie Concierge is the kernel's one chat window
    purpose: >-
      In Chromium at 1440x900 and 412x915 the shipped Movies & TV page over the compiled router (an in-memory pool and a TMDB double
      connected through the kernel), beside the kernel's one chat window served from a kernel platform export with its stand-in kernel.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/movies-one-chat-window.test.cjs
    expected:
      - Ask opens the sheet, which holds the window (concierge=movies, bot=movies-concierge) with its model menu, Files, Tap to talk, Keep trying and conversations.
      - A turn reaches movies-concierge with context.app movies, the picked model and the screen (the view, the type shown, the trending titles with their keys, the watchlist); no POST /api/movies/chat and no message box on the page.
      - The window and its message box sit inside the sheet and on the screen, nothing scrolls sideways, and the window's own Close closes the sheet.
      - A title the concierge saves during a turn shows on the page's watchlist once the answer is done, without a reload.
    prerequisites:
      - runner:node-test
      - dependency:playwright
      - browser:chromium
      - harness:kernel-platform-export
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/movies-routes-harness.cjs
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
  - id: concierge-tools
    name: The Movie Concierge's tools are routes this router answers
    purpose: >-
      Read the manifest and persona and drive the compiled routes: what the page's chat route did for the page is the concierge's tools.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/movies-tools.test.cjs
        - tests/movies-routes-harness.cjs
    expected:
      - Every tool the manifest declares names a method and path the compiled router answers, and the persona names each one.
      - GET /notes returns the viewer's remembered notes and the profile's tastes, and no other viewer's.
      - POST /notes keeps a taste the viewer states in their own words, once; one they did not state is not kept; a call without a note or words is refused.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/movies-routes-harness.cjs
    limits:
      timeoutMs: 15000
    installation: never
