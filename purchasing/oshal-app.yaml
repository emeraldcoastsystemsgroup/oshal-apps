# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | Declare the existing workflow bot and package-local reasoning persona with its dedicated-node posture.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Release 1.3.4: GET /cart is a pure read (a shopper with no list gets listId null) and the chat surface creates the default list through POST /lists before its first add; the native host refuses SQL writes on a GET.
# 3 | maintainer@emeraldcoastsystemsgroup.com | The concierge reads the shopping list. Route-backed reads shopping-lists (GET /api/purchasing/lists), shopping-list-items (GET /api/purchasing/lists/{listId}/items) and shopping-cart (GET /api/purchasing/cart): the Home assistant answered "I do not have direct access to view your current shopping list or cart ... none provide a read current cart capability" while the Home list showed an item. shopping-concierge runs inline (same UUID b0070000-0000-0000-0000-000000000001) so the Home and Jarvis screens that borrow it, and POST /api/purchasing/chat, are not refused "this bot requires an enrolled node". Guarded by purchasing/tests/shopping-concierge-reads.test.cjs and scripts/check-store-bots.mjs.
# 4 | maintainer@emeraldcoastsystemsgroup.com | shopping-list-add (POST /api/purchasing/lists/default/items, held for the shopper's approval) puts one item on the shopping list as written. Sweep 9: the Home screen adds to the list, but neither its concierge nor Jarvis could (only read tools), and one reply said "I'll add a single entry" and added nothing. Guarded by purchasing/tests/shopping-list-add.test.cjs.
# 5 | maintainer@emeraldcoastsystemsgroup.com | Sweep 10: shopping-list-add's description says to call it as soon as an item is asked for, the card being the shopper's confirmation (its "Held for the shopper's approval" read as "ask first": the concierge wrote "Please confirm so I can add it" and made no card). Words only; no route, schema or binding change. Guarded by purchasing/tests/shopping-list-add.test.cjs.
# 6 | maintainer@emeraldcoastsystemsgroup.com | Sweep 12: shopping-list-add declares `cardText`, the people-facing sentence its approval card shows under the heading (the card read 'Shopping list add' then 'Add to Shopping List', the same words twice). Words only; no route, schema or binding change. Guarded by purchasing/tests/shopping-list-add.test.cjs.
# 7 | maintainer@emeraldcoastsystemsgroup.com | shopping-list-add says the cart is the list's pending items: asked to "order groceries ... put them in a cart", Jarvis's Shopping handoff answered it could not add to a cart and did nothing. Release 1.3.5.
# 8 | maintainer@emeraldcoastsystemsgroup.com | 1.3.6: declare shopping-concierge as the chatBot, so a request from Jarvis that asks to make, build, order or plan something reaches it. A workflow application with no chatBot keeps every creation request with the assistant (jarvis_creation_kept), which answered without this application's tools.
# 9 | maintainer@emeraldcoastsystemsgroup.com | 1.3.7: shopping-list-add-many puts several free-text items on the list behind one approval card (POST /lists/default/items with items[]). Asked from Jarvis for milk, eggs, bread and bananas, the concierge proposed only milk. Guarded by purchasing/tests/shopping-list-add-many.test.cjs.

# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — purchasing ("Shopping" Concierge)
# Carved out of OSHAL core 2026-07-18 (ADR-085 Wave 2 carve #5). The shop-concierge
# REAL bot-node (purchasing container, BOTH registry blocks, worker+foundation personas,
# walmartProvider.js / walmartToolKit.js / purchasingTools.js, oshal-walmart.js CLI,
# migration 036 bot seed) STAYS in the framework repo per ADR-093 interim — this manifest
# declares NO bots; workflow.workerBot resolves via the static registry.
#
# An AI shopping concierge that drives a surface: it searches real retailer
# catalogs (Walmart I/O Affiliate API first, Amazon PA-API next), builds and
# displays shopping lists, learns each shopper's preferences ("add milk" ->
# their usual 2% store brand, and it tells them what + why), watches deal feeds,
# and — because it lives in the swarm — answers OTHER bots that need a purchase
# made (the home/IoT bot says "we're low on milk", this bot builds the basket).
#
# Checkout truth: retailers complete payment on their own domain. This app
# builds the basket and hands off a tracked checkout link (affiliate) — it does
# not take the shopper's money. That handoff is also how the business earns.
# ─────────────────────────────────────────────────────────────────────────────

name: purchasing
suite: ai-productivity   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 64, high: 256, basis: declared }
  features:
    - id: shopping-chat
      unit: shopping chat turn
      tier: T2
      generation: none
      degrade: disable
    - id: shopping-ticket
      unit: shopping request ticket
      tier: T4
      generation: none
      degrade: disable
displayName: Shopping
description: >-
  AI shopping concierge — search Walmart/Amazon, build lists, learn your
  preferences, find deals, and hand off a ready-to-checkout cart. Other swarm
  bots can ask it to make a purchase.
version: 1.3.7
status: active  # active | inactive

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: purchasing
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/purchasing/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# walmart is the connector this app uses (operator affiliate cred via broker;
# checkout is a deep-link handoff).
dependencies:
  required:
    apps: []
    tools: []
    connectors: [walmart]
  optional:
    apps: []
    tools: []
    connectors: []

# Kernel skills this app declares (ADR-090 uses: contract, fail-closed at load).
# `app-dependencies` is the compatibility floor for the tiered dependencies block above: a core
# that predates required/optional refuses this package instead of installing it without its
# required dependencies and without its connector allow-list.
uses:
  - app-dependencies
  - test-catalog

# Test Lab registration (TLAB-07): every shipped suite with its runner and fixture boundary.
testing:
  version: 1
  catalog: tests/test-lab.yaml

# Guests never build carts (this app hands off to retailer checkout). Request only —
# grants come from the operator endpoint (D4).
guestTier: blocked

# Framework tools exposed to the selector/runtime layer. These are route-backed
# app actions, not UI buttons; the executor calls them with the signed-in user's
# scoped identity and connector credentials.
tools:
  - name: search-products
    displayName: Search Products
    type: api
    category: commerce
    description: Search the shopper's connected retail catalog for real products.
    executor: { executorType: api, apiEndpoint: "GET /api/purchasing/search?q={input.query}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        query: { type: string }
      required: [query]
    usageInstructions: >-
      Call with {query}. Returns real product cards scoped to the signed-in shopper.
    routingTags: [shopping, products, retail]
    skills: [product-search, price-comparison]
    tags: [shopping, route-backed]

  - name: compare-prices
    displayName: Compare Prices
    type: api
    category: commerce
    description: Compare real retailer product options for a shopping intent.
    executor: { executorType: api, apiEndpoint: "GET /api/purchasing/search?q={input.query}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        query: { type: string }
      required: [query]
    usageInstructions: >-
      Call with {query} before recommending an item; summarize price, retailer, and tradeoffs from the returned cards.
    routingTags: [shopping, prices, retail]
    skills: [price-comparison, product-search]
    tags: [shopping, route-backed]

  - name: scan-deals
    displayName: Scan Deals
    type: api
    category: commerce
    description: Find current deal candidates for a shopping query.
    executor: { executorType: api, apiEndpoint: "GET /api/purchasing/deals?q={input.query}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        query: { type: string }
      required: [query]
    usageInstructions: >-
      Call with {query} when the shopper asks for deals, savings, or cheaper alternatives.
    routingTags: [shopping, deals, retail]
    skills: [deal-finding, product-search]
    tags: [shopping, route-backed]

  - name: suggest-from-history
    displayName: Suggest From History
    type: api
    category: commerce
    description: Read shopper-scoped repeat-purchase suggestions and remembered preferences.
    executor: { executorType: api, apiEndpoint: "GET /api/purchasing/suggestions" }
    defaultAuthMode: auto
    requiresApproval: false
    usageInstructions: >-
      Call with {} when the shopper asks what they usually buy, what to restock, or what OSHAL remembers.
    routingTags: [shopping, preferences, history]
    skills: [preference-learning, shopping-list-management]
    tags: [shopping, route-backed]

  - name: shopping-lists
    displayName: Shopping Lists
    type: api
    category: commerce
    description: The shopper's own shopping lists, each with its id, name and how many items are still to buy.
    executor: { executorType: api, apiEndpoint: "GET /api/purchasing/lists" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: >-
      Call with {} whenever the shopper asks what is on their list or what they still need. Then call
      shopping-list-items with a returned list_id. An empty "lists" array means they have no list yet.
    routingTags: [shopping, list, groceries]
    skills: [shopping-list-management]
    tags: [shopping, route-backed]

  - name: shopping-list-items
    displayName: Shopping List Items
    type: api
    category: commerce
    description: The items on one of the shopper's lists (title, quantity, price when the catalog priced it, status).
    executor: { executorType: api, apiEndpoint: "GET /api/purchasing/lists/{input.listId}/items" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        listId: { type: string, description: a list_id returned by shopping-lists }
      required: [listId]
    usageInstructions: >-
      Call with {listId} using a list_id from shopping-lists, never a guess. Name the items exactly as
      their titles read. An item with no price is a free-text entry ("milk") with no product chosen yet.
    routingTags: [shopping, list, groceries]
    skills: [shopping-list-management]
    tags: [shopping, route-backed]

  - name: shopping-list-add
    displayName: Add to Shopping List
    cardText: Puts this item on your shopping list, exactly as written. Nothing is bought.
    type: api
    category: commerce
    description: Put one item on the shopper's shopping list exactly as written (a free-text entry such as "AA batteries", no product chosen), on the list Home shows. The cart IS this list's pending items, so use it for "add to my cart", "order groceries" and "buy" requests too (checkout later hands the cart to the retailer; nothing is bought here). Call it as soon as they ask to add an item; the approval card it makes is their confirmation, so never ask them to confirm in words first.
    executor: { executorType: api, apiEndpoint: "POST /api/purchasing/lists/default/items" }
    defaultAuthMode: auto
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 300, description: "The item exactly as the shopper named it." }
        quantity: { type: integer, minimum: 1, maximum: 99 }
      required: [title]
    usageInstructions: >-
      Call once per item the shopper asked to put on their list, with {"title"} as they wrote it and "quantity" when they
      gave one. No product search is needed. The shopper approves the card; until the tool answers with the saved item
      it is only proposed, so never say it was added before that, and never propose the same item again on a "yes".
    routingTags: [shopping, list, groceries]
    skills: [shopping-list-management]
    tags: [shopping, route-backed]

  - name: shopping-list-add-many
    displayName: Add items to Shopping List
    cardText: Puts these items on your shopping list, exactly as written. Nothing is bought.
    type: api
    category: commerce
    description: Put several items on the shopper's shopping list at once, each exactly as written (free-text entries such as "milk", "eggs", no product chosen), on the list Home shows. The cart IS this list's pending items, so use it for "add milk, eggs and bread to my cart" and "order groceries" requests too. One approval card holds every item; nothing is bought here.
    executor: { executorType: api, apiEndpoint: "POST /api/purchasing/lists/default/items" }
    defaultAuthMode: auto
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            properties:
              title: { type: string, minLength: 1, maxLength: 300, description: The item exactly as the shopper named it. }
              quantity: { type: integer, minimum: 1, maximum: 99 }
            required: [title]
      required: [items]
    usageInstructions: >-
      Call once with {"items": [{"title": ...}, ...]} holding every item the shopper asked for in this message, each as they
      wrote it, with "quantity" when they gave one. The shopper approves the one card; until the tool answers with the saved
      items they are only proposed, so never say they were added before that, and never propose them again on a "yes".
    routingTags: [shopping, list, groceries]
    skills: [shopping-list-management]
    tags: [shopping, route-backed]

  - name: shopping-cart
    displayName: Shopping Cart
    type: api
    category: commerce
    description: The shopper's open cart (their default list's pending items) with the server-computed total.
    executor: { executorType: api, apiEndpoint: "GET /api/purchasing/cart" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: >-
      Call with {} for the cart and its total. listId null means no cart yet. unpricedLines counts items
      with no price, so the total covers only the priced ones; say so when it is not zero.
    routingTags: [shopping, cart, total]
    skills: [shopping-list-management, checkout-handoff]
    tags: [shopping, route-backed]

  - name: explain-pick
    displayName: Explain Shopping Pick
    type: api
    category: commerce
    description: Ask the shopping concierge to explain or refine a choice using current cart, profile, and catalog context.
    executor: { executorType: api, apiEndpoint: "POST /api/purchasing/chat" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        message: { type: string }
      required: [message]
    usageInstructions: >-
      Call with {message} to explain why an item fits, compare candidates, or refine the basket.
    routingTags: [shopping, explanation, preferences]
    skills: [preference-learning, product-search]
    tags: [shopping, route-backed]

  - name: prepare-checkout
    displayName: Prepare Checkout Handoff
    type: api
    category: commerce
    description: Build a retailer checkout handoff for the shopper's current cart. No payment is taken in OSHAL.
    executor: { executorType: api, apiEndpoint: "POST /api/purchasing/checkout" }
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        listId: { type: string }
    usageInstructions: >-
      Call only after the shopper asks to checkout or order. It returns a handoff URL; the shopper finishes payment on the retailer site.
    routingTags: [shopping, checkout, handoff]
    skills: [checkout-handoff, shopping-list-management]
    tags: [shopping, route-backed, approval-required]

# ─────────────────────────────────────────────────────────────────────────────
# UI SURFACES — ribbon icons that open the concierge surface.
# ─────────────────────────────────────────────────────────────────────────────
ui:
  static:
    - toolName: shop-concierge
      label: Assistant
      icon: codicon codicon-comment-discussion
      iframeUrl: /api/purchasing/chat
      section: top
    - toolName: shop-browse
      label: Browse
      icon: codicon codicon-search
      iframeUrl: /api/purchasing/dashboard
      section: top
    - toolName: shop-lists
      label: Cart
      icon: codicon codicon-list-unordered
      iframeUrl: /api/purchasing/dashboard?view=lists
      section: top
    - toolName: shop-deals
      label: Deals
      icon: codicon codicon-tag
      iframeUrl: /api/purchasing/dashboard?view=deals
      section: top

# THE ASSISTANT RAIL (surface-bridge). Without this block the cockpit relay forwards NOTHING for
# this app (fail-closed). context = the Shopping surface publishes the cart, its server-computed
# total, the ship address and the products on screen, so the floating assistant answers about the
# screen the shopper is on; set_field = it can fill the ship address or the search box, and
# field_change = the shopper's own edits of those two fields travel back; custom = its `search`,
# `add_product` and `checkout` ops run through the same functions the buttons call; propose/submit
# = a checkout is ALWAYS a confirm card and the shopper's answer returns to the assistant (nothing
# opens until Confirm); notify = it can confirm in the surface.
surface:
  ops: [context, set_field, field_change, custom, propose, submit, notify]

# ─────────────────────────────────────────────────────────────────────────────
# ROUTES — app-owned API + surface, gated to this app's activation.
# ─────────────────────────────────────────────────────────────────────────────
routes:
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/purchasing/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/purchasing/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/purchasing-routes.js
    factory: createPurchasingRoutes
    mountPath: /api/purchasing
    auth: service-or-oidc   # what server.ts ACTUALLY mounts (ADR-085 D2)
    requiresAuth: true
    requiresContext: true

# ─────────────────────────────────────────────────────────────────────────────
# DATABASE MIGRATIONS — applied idempotently on first load.
# ─────────────────────────────────────────────────────────────────────────────
# Belt-and-braces: the eight shop_* tables ensurePurchasingSchema creates lazily (owner
# RLS at the chokepoint). Idempotent — safe where core migrations already ran. 036 (bot
# seed) stays core with the bot.
migrations:
  - migrations/035-purchasing-platform.sql
  - migrations/037-purchasing-chat-memory.sql
  - migrations/038-purchasing-profile.sql

# ─────────────────────────────────────────────────────────────────────────────
# WORKFLOW — tickets of type 'shopping' route to the concierge.
# Used when another bot (or the surface) dispatches an async purchase task.
# ─────────────────────────────────────────────────────────────────────────────
# The bot a Jarvis creation request goes to (its own workflow bot).
chatBot: shopping-concierge

ticketType: shopping
workflow:
  name: Shopping Concierge Pipeline
  pipeline: shopping
  workerBot: shopping-concierge
  phases:
    - intake       # understand the request (resolve "milk" -> a concrete SKU)
    - shop         # search, compare, apply preferences, build the basket
    - delivery     # hand off a tracked checkout link, record history

# THEMING — the dashboard loads /api/purchasing/purchasing.css, which the packaged
# route serves from this package's tools/ (ctx.appPackageDir). No framework-level
# sharedCss field needed: the surface references the css by its own route URL.

# ─────────────────────────────────────────────────────────────────────────────
# RIBBON VISIBILITY — focus mode for /cockpit?app=purchasing
# ─────────────────────────────────────────────────────────────────────────────
ribbon:
  hideFrameworkItems:
    - tickets
    - chat
    - calendar
    - addressbook
    - dashboard
    - logs
    - operations
  # The Assistant surface IS the chat, so hide the cockpit's generic right-rail
  # swarm-bot panel (same as jarvis).
  hideChatPanel: true
  defaultView: shop-concierge

integrations:
  accepts:
    - id: plan-purchase
      contextType: planning-brief
      version: 1
      surface: shop-concierge
      fields:
        - title
        - notes
        - sourceUrl
  offers:
    - id: plan-meal
      label: Plan a meal
      targetApp: eats
      targetAction: plan-meal
      contextType: planning-brief
      version: 1

summary:
  path: /api/purchasing/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items

# Preserve the existing worker UUID; the native kernel runs it inline with this package's route-backed tools.
bots:
  - agentId: b0070000-0000-0000-0000-000000000001
    name: shopping-concierge
    persona: personas/shopping-concierge.yaml
    posture: inline   # native kernel: an application bot with the route-backed tools above; no dedicated node
    role: commerce/purchasing
    capabilities: ['product-search', 'retail-price-comparison', 'shopping-list-management', 'cross-retailer-cart-building', 'rollback-deal-tracking', 'retail-checkout-handoff', 'purchase-preference-memory']
