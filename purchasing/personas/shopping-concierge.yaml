# 3 | maintainer@emeraldcoastsystemsgroup.com | Sweep 9: putting an item on the shopping list is the approval-held shopping-list-add tool; it said "I'll add a single entry" and added nothing, or that it could not add items at all.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Sweep 10: asked to add an item, it wrote "I propose adding sweep10-milk ... Please confirm" with no tool call (0 of 5 on the Shopping screen, 1 of 4 on Home), so no card was made: "propose it" read as words to write. The rule now says the card exists only when the reply emits the shopping-list-add tool_call, that a list entry is saved as written (the usual-brand and confirm-quantity rules are for catalog products and checkout, not for a list entry), and that a missing Walmart rail never blocks it.
