  <!-- Audience view (ADR-164 D6). The Home shell opens this page with ?audience=family: the household's shopping list
       (the active list's pending items, the other lists, the saved checkout-link count) from the SAME /api/purchasing
       routes the full page reads, painted by the shared kit in the family grammar. On open it reads only /lists,
       /lists/:id/items and /home-summary: no catalog call (search, deals, resolve), no concierge, no write. Adding and
       removing stay in the full page and the homebase's own shopping module; the one action escapes to Shopping in
       the cockpit. Any other request runs the full dashboard below unchanged, with its own ?view= tabs. -->
  <link rel="stylesheet" href="/shared/ui/css/app-view.css" />
  <script src="/shared/ui/js/app-view.js"></script>
  <script>
  (function () {
    var A = window.AppView; if (!A) return;
    var FULL = '/cockpit/?app=purchasing';
    function call(path) {
      return fetch('/api/purchasing' + path, { credentials: 'same-origin', headers: { Accept: 'application/json' } }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; throw e; } return j; });
      });
    }
    function refused(e) { return !!e && (e.status === 401 || e.status === 403); }
    // The home summary is its own mount and may fail on its own: the list still shows and the checkout-link count reads as unknown.
    function summary() { return call('/home-summary').catch(function (e) { if (refused(e)) throw e; return null; }); }
    function isPending(item) { return !item.status || item.status === 'pending'; }
    // The same pick as the full page and the routes: the oldest list still active (GET /lists is ordered by creation).
    function activeList(lists) { return lists.filter(function (l) { return !l.status || l.status === 'active'; })[0] || null; }
    function stamp(value) { var t = new Date(String(value)).getTime(); return isFinite(t) ? t : 0; }
    function newest(items) { return items.reduce(function (best, i) { return !best || stamp(i.created_at) > stamp(best.created_at) ? i : best; }, null); }
    function price(item) { var n = Number(item.unit_price); return item.unit_price !== null && item.unit_price !== undefined && item.unit_price !== '' && isFinite(n) ? A.money(n) + ' each' : 'no price yet'; }
    function line(item) { return { icon: '🛒', title: item.title || 'Untitled', text: '×' + (Number(item.quantity) || 1) + ' · ' + price(item), meta: 'added ' + A.when(item.created_at) }; }
    function tile(l) { var n = Number(l.item_count) || 0; return { icon: '📝', title: l.name || 'My List', text: n === 1 ? '1 thing on it' : n + ' things on it', meta: 'started ' + A.when(l.created_at), badge: l.status === 'archived' ? 'Archived' : null }; }
    function handoffs(sum) { return ((sum && sum.metrics) || []).filter(function (m) { return m.id === 'shopping-handoffs-5d'; })[0] || null; }
    function stats(items, lists, sum) {
      var last = newest(items), links = handoffs(sum);
      return [
        { id: 'pending', label: 'On the list', value: items.length },
        { id: 'lists', label: 'Lists', value: lists.length },
        { id: 'added', label: 'Last added', value: last ? A.when(last.created_at) : '—' },
        { id: 'handoffs', label: 'Checkout links, 5 days', value: links ? links.value : '—', hint: links ? 'Not confirmed purchases' : 'Could not check' }
      ];
    }
    function lede(list, items) {
      var last = newest(items);
      if (!list) return 'Nothing has been started yet. Open Shopping to start a list.';
      if (!items.length) return 'The list is empty. Add things in Shopping or on the home list.';
      return items.length + (items.length === 1 ? ' thing' : ' things') + ' to pick up. Newest: ' + (last.title || 'Untitled') + ', added ' + A.when(last.created_at) + '.';
    }
    function model(lists, list, items, sum) {
      var others = lists.filter(function (l) { return !list || l.list_id !== list.list_id; });
      return {
        kicker: 'Our list',
        title: list ? (list.name || 'My List') : 'No list yet',
        lede: lede(list, items),
        actions: [{ label: 'Open the shopping list', primary: true, onClick: function () { A.open(FULL); } }],
        stats: stats(items, lists, sum),
        sections: [
          { kind: 'list', id: 'items', title: 'On the list', empty: list ? 'Nothing on the list yet.' : 'No list yet.', items: items.slice(0, 30).map(line),
            note: sum && sum.partial ? 'Some saved shopping data could not be checked.' : null },
          others.length ? { kind: 'tiles', id: 'lists', title: 'Other lists', items: others.map(tile) } : null
        ]
      };
    }
    function family() {
      return Promise.all([call('/lists'), summary()]).then(function (r) {
        var lists = r[0].lists || [], list = activeList(lists);
        return (list ? call('/lists/' + encodeURIComponent(list.list_id) + '/items') : Promise.resolve({ items: [] })).then(function (j) {
          return model(lists, list, (j.items || []).filter(isPending), r[1]);
        });
      }).catch(function (e) {
        if (!refused(e)) throw e && e.status >= 500 ? new Error('Shopping could not read the list (HTTP ' + e.status + ').') : e;
        return { kicker: 'Our list', title: e.status === 401 ? 'Sign in to see the shopping list' : 'This account cannot open Shopping',
          lede: e.status === 401 ? 'Shopping shows the list of whoever is signed in, and this session is not signed in.' : 'The Shopping routes refused this account (HTTP 403).' };
      });
    }
    // List is Shopping's first surface since the UX audit (the chat page was), so the all-inclusive shells that frame it
    // with ?audience=company get the same list card instead of the full page.
    A.boot({ app: 'purchasing', escapeLabel: 'Open Shopping in the cockpit', audiences: { company: family, family: family } });
  })();
  </script>

<body>
  <!-- UX audit 2026-11-05 (shop-lists, shop-concierge, shop-browse, shop-deals): this page is Shopping's one screen, List.
       An Add an item field (free text, the one primary) writes to POST /lists/:id/items; each row ticks off, steps its
       quantity (POST /lists/:id/items/:itemId) and is removed from its ⋯ menu. The storefront (search, deals) and
       Checkout are shown only when the readiness read (GET /deals) says this installation has a retail rail; without
       one they are not rendered at all. Errors are an alert in the error colour where the work is, never green header
       text. No inner Shop | List | Deals bar: the application's screens are the navigation. -->
  <main class="list-screen" data-ds-work>
    <form id="add-form" class="add-item" autocomplete="off">
      <label class="sr-only" for="add-title">Add an item</label>
      <input id="add-title" type="text" maxlength="300" placeholder="Add an item" enterkeyhint="done" />
      <button type="submit" class="primary" id="add-btn" data-ds-primary>Add</button>
    </form>
    <div id="alert" class="alert hidden" role="alert"></div>
    <p id="status" class="status-line" role="status"></p>
    <div id="list-items"></div>
    <div class="list-foot">
      <button id="checkout" class="secondary hidden" type="button" disabled>Checkout</button>
    </div>
    <div id="checkout-result" class="checkout-result hidden"></div>

    <details id="prefs" class="prefs">
      <summary>Shopping preferences</summary>
      <div class="pref-row hidden" id="pref-retailer-row"><span>Store</span><b id="pref-retailer">Walmart</b></div>
      <label class="pref-row" for="pref-diet"><span>Household notes</span><input id="pref-diet" type="text" maxlength="300" placeholder="e.g. no peanuts, vegetarian" /></label>
      <label class="pref-row" for="pref-budget"><span>Monthly budget ($)</span><input id="pref-budget" type="number" min="0" step="1" inputmode="numeric" placeholder="No budget" /></label>
      <div class="pref-row"><span>Usuals</span><span id="pref-usuals" class="pref-usuals">None yet</span></div>
      <p id="pref-saved" class="status-line" role="status"></p>
    </details>

    <section id="storefront" class="hidden" aria-label="Shop">
      <form id="search-form" class="searchbar">
        <input id="q" type="text" placeholder='Find a product, e.g. "coffee"' autocomplete="off" />
        <button id="mic" type="button" title="Speak">🎙️</button>
        <button type="submit">Search</button>
      </form>
      <p id="resolve-line" class="resolve-line"></p>
      <div id="results" class="grid"></div>
      <h2 class="deals-title">Deals</h2>
      <div id="deals" class="grid"></div>
    </section>
  </main>

  <style>
    .list-screen { padding: 16px; max-width: 760px; margin: 0 auto; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .add-item { display: flex; gap: 8px; margin-bottom: 12px; }
    .add-item input { flex: 1; min-width: 0; min-height: 44px; padding: 10px 14px; border: 1px solid var(--ds-line-control, var(--line)); border-radius: 10px; font-size: 16px; background: var(--ds-surface, var(--card)); color: var(--ink); }
    .add-item .primary { min-height: 44px; }
    .alert { color: var(--status-error, #b91c1c); border: 1px solid var(--status-error, #b91c1c); background: var(--card); border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 14px; line-height: 20px; }
    .status-line { color: var(--muted); font-size: 14px; line-height: 20px; min-height: 0; margin: 4px 2px; }
    .status-line:empty { display: none; }
    .list-row { gap: 8px; padding: 6px 8px; }
    .list-row.done .lr-title { text-decoration: line-through; color: var(--muted); }
    .tick { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; flex: none; cursor: pointer; }
    .tick input { width: 22px; height: 22px; }
    .stepper { display: inline-flex; align-items: center; gap: 2px; flex: none; }
    .stepper button { width: 44px; height: 44px; border: 1px solid var(--ds-line-control, var(--line)); background: var(--ds-surface, var(--card)); color: var(--ink); border-radius: 10px; font-size: 18px; cursor: pointer; }
    .stepper output { min-width: 24px; text-align: center; font-weight: 600; font-size: 14px; }
    .row-more { position: relative; flex: none; }
    .row-more summary { list-style: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 10px; font-size: 20px; }
    .row-more summary::-webkit-details-marker { display: none; }
    .row-more .menu { position: absolute; right: 0; top: 46px; z-index: 5; background: var(--ds-surface, var(--bg-card-solid, var(--card))); border: 1px solid var(--line); border-radius: 10px; padding: 4px; min-width: 140px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
    .row-more .menu button { width: 100%; min-height: 44px; text-align: left; background: none; border: 0; color: var(--status-error, #b91c1c); font: inherit; font-size: 14px; cursor: pointer; padding: 0 12px; }
    .list-foot { display: flex; justify-content: flex-end; margin-top: 12px; }
    .secondary { min-height: 44px; padding: 0 18px; border: 1px solid var(--ds-line-control, var(--line)); background: var(--ds-surface, var(--card)); color: var(--ink); border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
    .secondary:disabled { opacity: 1; color: var(--muted); background: var(--subtle, var(--card)); cursor: default; }
    .deals-title { font-size: 16px; line-height: 24px; margin: 22px 0 0; }
    .prefs { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 10px; }
    .prefs summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 700; font-size: 14px; }
    .pref-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--line); font-size: 14px; }
    .pref-row input { width: 55%; min-height: 44px; padding: 8px 10px; border: 1px solid var(--ds-line-control, var(--line)); border-radius: 10px; font-size: 16px; background: var(--ds-surface, var(--card)); color: var(--ink); }
    .pref-usuals { color: var(--muted); text-align: right; font-size: 14px; }
  </style>

  <script>
    const $ = (s) => document.querySelector(s);
    // The parsed body carries the HTTP status, so a refused provider call is never read as an empty result.
    const api = (p, opts) => fetch('/api/purchasing' + p, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts))
      .then((r) => r.json().catch(() => ({})).then((body) => Object.defineProperty(body && typeof body === 'object' ? body : {}, 'httpStatus', { value: r.status })));
    // Products, deals and checkout come from a retailer; where the installation has no retail rail the server refuses them (HTTP 503).
    const NOT_CONNECTED = 'Shopping at a store is not connected on this installation. Ask your administrator to connect a retailer.';
    const providerRefused = (r) => Boolean(r && (r.httpStatus === 503 || r.error === 'native_executor_unavailable'));
    let listId = null, RAIL = false, ITEMS = [];

    function setStatus(msg) { $('#status').textContent = msg || ''; }
    function showAlert(msg) { const box = $('#alert'); box.textContent = msg || ''; box.classList.toggle('hidden', !msg); }

    function card(item, onAdd) {
      const el = document.createElement('div');
      el.className = 'card';
      const price = typeof item.price === 'number' ? '$' + item.price.toFixed(2) : '—';
      const img = document.createElement(item.imageUrl ? 'img' : 'div');
      if (item.imageUrl) { img.src = item.imageUrl; img.alt = ''; } else img.className = 'noimg';
      const title = document.createElement('div'); title.className = 'title'; title.textContent = item.title || '';
      const meta = document.createElement('div'); meta.className = 'meta';
      const pr = document.createElement('span'); pr.className = 'price'; pr.textContent = price; meta.append(pr);
      const add = document.createElement('button'); add.className = 'add'; add.textContent = 'Add to list';
      add.addEventListener('click', () => onAdd(item, el));
      el.append(img, title, meta, add);
      return el;
    }

    async function ensureList() {
      if (listId) return listId;
      const { lists } = await api('/lists');
      if (lists && lists[0]) { listId = lists[0].list_id; return listId; }
      const created = await api('/lists', { method: 'POST', body: '{}' });
      if (!created.list) { showAlert('Lists are read-only in guest mode. Sign in to keep a list.'); return null; }
      listId = created.list.list_id;
      return listId;
    }

    // The one primary: a free-text item, as written (no product, no price; checkout leaves it out until it is matched).
    $('#add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = $('#add-title').value.replace(/\s+/g, ' ').trim();
      if (!title) { $('#add-title').focus(); return; }
      if (!await ensureList()) return;
      $('#add-btn').disabled = true;
      try {
        const r = await api('/lists/' + listId + '/items', { method: 'POST', body: JSON.stringify({ title, quantity: 1 }) });
        if (r.httpStatus >= 400 || !r.item) { showAlert('“' + title + '” was not added: ' + (r.error || 'HTTP ' + r.httpStatus) + '.'); return; }
        showAlert(''); $('#add-title').value = ''; await loadList();
      } finally { $('#add-btn').disabled = false; $('#add-title').focus(); }
    });

    let lastQuery = '';
    async function addToList(item, basis) {
      if (!await ensureList()) return;
      const reason = basis || (item.onSale ? 'on rollback' : 'best match');
      const r = await api('/lists/' + listId + '/items', {
        method: 'POST',
        body: JSON.stringify({
          productId: item.productId, title: item.title, brand: item.brand, retailer: item.retailer,
          imageUrl: item.imageUrl, productUrl: item.productUrl, price: item.price, quantity: item.quantity || 1,
          itemKey: lastQuery || item.title, reason: 'Added ' + (item.title || '') + ' — ' + reason + '.',
        }),
      });
      if (r.httpStatus >= 400) { showAlert((item.title || 'That product') + ' was not added: ' + (r.message || r.error || 'HTTP ' + r.httpStatus) + '.'); return; }
      setStatus('Added ' + (item.title || '') + ' (' + reason + ')');
      loadList();
    }

    // Search (only with a retail rail): first ask for the shopper's usual.
    $('#search-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = $('#q').value.trim();
      if (!q) return;
      lastQuery = q;
      setStatus('Searching…'); showAlert('');
      $('#resolve-line').textContent = '';
      const resolved = await api('/resolve', { method: 'POST', body: JSON.stringify({ item: q }) });
      if (resolved.hasUsual && resolved.item) {
        $('#resolve-line').textContent = '🧠 ' + resolved.reason + ' ';
        const b = document.createElement('button'); b.className = 'link'; b.textContent = 'Add it';
        b.addEventListener('click', () => addToList(resolved.item, 'your usual'));
        $('#resolve-line').append(b);
      }
      const found = await api('/search?q=' + encodeURIComponent(q));
      const grid = $('#results');
      grid.innerHTML = '';
      setStatus('');
      if (providerRefused(found)) { showAlert(NOT_CONNECTED); return; }
      const { items, source } = found;
      setStatus(source === 'mock' ? 'Demo catalog, not live store results' : '');
      (items || []).forEach((it) => grid.appendChild(card(it, (item) => addToList(item))));
    });

    // Voice — "listening" via the browser speech API.
    $('#mic').addEventListener('click', () => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { setStatus('Voice is not supported in this browser'); return; }
      const rec = new SR();
      rec.lang = 'en-US';
      setStatus('Listening…');
      rec.onresult = (ev) => { $('#q').value = ev.results[0][0].transcript; $('#search-form').requestSubmit(); };
      rec.onerror = () => setStatus('Could not hear that');
      rec.start();
    });

    /** One row's own change (tick off, quantity), then the list again. */
    async function updateRow(item, change) {
      const r = await api('/lists/' + listId + '/items/' + encodeURIComponent(item.item_id), { method: 'POST', body: JSON.stringify(change) });
      if (r.httpStatus >= 400) showAlert('“' + (item.title || 'That item') + '” could not be changed: ' + (r.error || 'HTTP ' + r.httpStatus) + '.');
      await loadList();
    }

    function rowFor(i) {
      const done = i.status === 'done', qty = Number(i.quantity) || 1;
      const row = document.createElement('div');
      row.className = 'list-row' + (done ? ' done' : '');
      const tick = document.createElement('label'); tick.className = 'tick';
      const box = document.createElement('input'); box.type = 'checkbox'; box.checked = done; box.setAttribute('aria-label', 'Got ' + (i.title || 'it'));
      box.addEventListener('change', () => updateRow(i, { checked: box.checked }));
      tick.append(box);
      const main = document.createElement('div'); main.className = 'lr-main';
      const t = document.createElement('span'); t.className = 'lr-title'; t.textContent = i.title || ''; main.append(t);
      if (i.unit_price != null) { const pr = document.createElement('span'); pr.className = 'lr-why'; pr.textContent = '$' + Number(i.unit_price).toFixed(2) + ' each'; main.append(pr); }
      const step = document.createElement('div'); step.className = 'stepper';
      const minus = document.createElement('button'); minus.type = 'button'; minus.textContent = '−'; minus.setAttribute('aria-label', 'One fewer ' + (i.title || ''));
      minus.disabled = qty <= 1; minus.addEventListener('click', () => updateRow(i, { quantity: qty - 1 }));
      const out = document.createElement('output'); out.textContent = String(qty);
      const plus = document.createElement('button'); plus.type = 'button'; plus.textContent = '+'; plus.setAttribute('aria-label', 'One more ' + (i.title || ''));
      plus.addEventListener('click', () => updateRow(i, { quantity: qty + 1 }));
      step.append(minus, out, plus);
      const more = document.createElement('details'); more.className = 'row-more';
      const sum = document.createElement('summary'); sum.textContent = '⋯'; sum.setAttribute('aria-label', 'More for ' + (i.title || 'this item')); sum.title = 'More for ' + (i.title || 'this item');
      const menu = document.createElement('div'); menu.className = 'menu'; menu.setAttribute('data-no-glass', '');
      const rm = document.createElement('button'); rm.type = 'button'; rm.className = 'rm'; rm.textContent = 'Remove';
      rm.addEventListener('click', async () => { await api('/lists/' + listId + '/items/' + encodeURIComponent(i.item_id), { method: 'DELETE' }); loadList(); });
      menu.append(rm); more.append(sum, menu);
      row.append(tick, main, step, more);
      return row;
    }

    async function loadList() {
      if (!await ensureList()) {
        $('#list-items').innerHTML = '<p class="empty">Sign in to keep a shopping list.</p>';
        return;
      }
      const { items } = await api('/lists/' + listId + '/items');
      ITEMS = items || [];
      const wrap = $('#list-items');
      wrap.replaceChildren();
      const pending = ITEMS.filter((i) => i.status !== 'done'), done = ITEMS.filter((i) => i.status === 'done');
      if (!ITEMS.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'Your list is empty. Add the first thing above.'; wrap.append(p); }
      [...pending, ...done].forEach((i) => wrap.appendChild(rowFor(i)));
      // Checkout only with a retail rail; solid-disabled while nothing is left to buy.
      $('#checkout').classList.toggle('hidden', !RAIL);
      $('#checkout').disabled = !pending.length;
    }

    $('#checkout').addEventListener('click', async () => {
      if (!RAIL || !await ensureList()) return;
      setStatus('Building your cart…'); showAlert('');
      const r = await api('/checkout', { method: 'POST', body: JSON.stringify({ listId }) });
      const box = $('#checkout-result');
      setStatus('');
      if (providerRefused(r)) { showAlert(NOT_CONNECTED); return; }
      if (r.error) { showAlert('Checkout could not start: ' + r.error + '.'); return; }
      window.open(r.checkoutUrl, '_blank', 'noopener');
      box.classList.remove('hidden');
      box.replaceChildren();
      const p = document.createElement('p'); const strong = document.createElement('strong'); strong.textContent = 'Cart ready — $' + r.total + '.'; p.append(strong, ' ' + (r.note || ''));
      const a = document.createElement('a'); a.className = 'primary'; a.href = r.checkoutUrl; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Open checkout →';
      box.append(p, a);
    });

    function showDeals(found) {
      const grid = $('#deals');
      grid.innerHTML = '';
      const { items } = found;
      (items || []).forEach((it) => grid.appendChild(card(it, (item) => addToList(item, 'on rollback'))));
    }

    /** Preferences, from the chat page's read-only cards (UX audit 2026-11-05): rows that edit in place and save on change. */
    async function loadPrefs() {
      const [p, u] = await Promise.all([api('/profile'), api('/preferences')]);
      const profile = (p && p.profile) || {};
      $('#pref-diet').value = Array.isArray(profile.dietary) ? profile.dietary.join(', ') : '';
      $('#pref-budget').value = profile.budget_monthly ? String(Math.round(Number(profile.budget_monthly))) : '';
      $('#pref-retailer').textContent = String(profile.preferred_retailer || 'walmart').replace(/^./, (c) => c.toUpperCase());
      $('#pref-retailer-row').classList.toggle('hidden', !RAIL);
      const usuals = ((u && u.preferences) || []).slice(0, 5).map((x) => x.title || x.item_key).filter(Boolean);
      $('#pref-usuals').textContent = usuals.length ? usuals.join(', ') : 'None yet';
    }
    async function savePref(body) {
      const r = await api('/profile', { method: 'POST', body: JSON.stringify(body) });
      $('#pref-saved').textContent = r.httpStatus >= 400 || !r.profile ? '' : 'Saved';
      if (r.httpStatus >= 400 || !r.profile) showAlert('Your preference was not saved: ' + (r.error || 'HTTP ' + r.httpStatus) + '.');
    }
    $('#pref-diet').addEventListener('change', () => savePref({ dietary: $('#pref-diet').value.split(',').map((x) => x.trim()).filter(Boolean).slice(0, 20) }));
    $('#pref-budget').addEventListener('change', () => { const n = Math.round(Number($('#pref-budget').value)); if (Number.isFinite(n) && n >= 0) savePref({ budgetMonthly: n }); });

    /** One readiness read on load: GET /deals answers 503 (native_executor_unavailable) when there is no retail rail. */
    async function start() {
      const deals = await api('/deals?feed=rollback').catch(() => ({ httpStatus: 503 }));
      RAIL = !providerRefused(deals) && deals.httpStatus < 400;
      $('#storefront').classList.toggle('hidden', !RAIL);
      if (RAIL) showDeals(deals);
      await loadList();
      loadPrefs().catch(() => {});
      if (new URLSearchParams(location.search).get('view') === 'shop' && RAIL) $('#q').focus();
    }

    // Under an audience view (ADR-164 D6) the kit paints the family view instead and this start does not run; without
    // the kit or without an audience the List screen starts (old ?view=shop and ?view=deals addresses land here too).
    if (!window.AppView || !AppView.active()) start();
  </script>
  <script type="module">
    import { receiveHandoff } from '/cockpit/js/app-handoff.js';
    // A planning brief handed to Shopping lands on List with its title in Add an item, for the shopper to add or edit.
    if (!window.AppView || !AppView.active()) {
      receiveHandoff({ app: 'purchasing', action: 'plan-purchase', contextType: 'planning-brief', version: 1, fields: ['title', 'notes', 'sourceUrl'] },
        (context) => { const field = document.getElementById('add-title'); field.value = String(context.title || '').slice(0, 300); field.focus(); });
      document.addEventListener('toggle', (e) => {
        if (e.target && e.target.tagName === 'DETAILS' && e.target.open) {
          try { history.pushState({ shopDisclosure: 1 }, ''); } catch {}
        }
      }, true);
      window.addEventListener('popstate', () => {
        document.querySelectorAll('details[open]').forEach((d) => { d.open = false; });
      });
    }
  </script>
</body>
</html>
