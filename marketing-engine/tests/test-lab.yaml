# 1 | maintainer@emeraldcoastsystemsgroup.com | Register every shipped Node test suite with exact files and honest fixture boundaries; retain readiness smoke identity.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Register the company audience view contract (ADR-164 D6, 0.5.2): kit placement and boot, both extra start paths gated, the view's four GETs and what it paints, and its named refusals.
# 3 | maintainer@emeraldcoastsystemsgroup.com | Expect each refused or failed publish run to show its recorded cause instead of a fixed "daily cap reached" / "no consent" label.
# 4 | maintainer@emeraldcoastsystemsgroup.com | 0.5.3: the family audience view registered beside the company one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
# 5 | maintainer@emeraldcoastsystemsgroup.com | Register record-fields: the campaign card shows its ICP card and message map as labelled fields, not JSON, and Draft content starts from the campaign brief.
# 6 | maintainer@emeraldcoastsystemsgroup.com | home-summary also proves each recent campaign's real draft count and time (sweep 11: the concierge invented draft times).
