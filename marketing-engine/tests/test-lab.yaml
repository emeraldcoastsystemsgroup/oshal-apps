version: 1
cases:
  - id: record-fields
    name: Campaign records read as fields; the draft starts from the brief
    purpose: Run the page's own recordFieldsHtml and campaignBrief and read how the campaign card and Draft content dialog use them.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/record-fields.test.mjs
    expected:
      - A message map renders as labelled, escaped fields with lists as bullets and nested records indented; no JSON punctuation.
      - The card renders the ICP card and the message map through it; Draft content starts from message_map.brief.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: package-readiness
    name: Installed package readiness
    purpose: Retain the existing metadata-only installation probe without running a business workflow.
    level: integration
    runner:
      kind: smoke
      smoke: package-readiness
    expected:
      - The installed marketing-engine metadata satisfies its existing manifest smoke assertions.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: safe-smoke
  - id: home-summary
    name: Scoped home summary
    purpose: Exercise the compiled summary handler with a synthetic router and scripted query responses.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/home-summary.test.mjs
    expected:
      - "Each newest-draft time is an RFC 3339 instant with seconds, so the kernel writes it in the person's zone; the persona says nothing of other campaigns without the not-in-this-summary row and quotes times as written (sweep 13)."
      - Anonymous requests stop before SQL and reads retain owner predicates and bounded results.
      - Missing source data stays distinct from failure; returned summaries obey the core item limits.
      - Each of the six most recently updated campaigns carries its real draft count and newest draft time or "No drafts", the rest are one "Other campaigns" metric, a failed draft read is Unavailable, and the concierge persona never extends a time or count to campaigns the summary does not list (sweep 11).
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: >-
        The runner removes the disposable container and staged files; all business records are synthetic
        in-memory fixtures.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 256
    installation: never
  - id: marketing-gates
    name: Consent and spending gates
    purpose: Exercise the compiled consent, cap and import rules without any publishing rail.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/marketing-gates.test.mjs
    expected:
      - Missing consent, malformed booleans, paused channels and exhausted daily caps refuse publishing.
      - Campaign imports cannot enable consent, standing authorization or spending.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: >-
        The runner removes the disposable container and staged files; all business records are synthetic
        in-memory fixtures.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 256
    installation: never
  - id: marketing-manifest
    name: Bot routing and persona parity
    purpose: Compare shipped bot identifiers and routing metadata with the package persona definitions.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/marketing-manifest.test.mjs
    expected:
      - Inline bots, workflow selectors and persona identities agree.
      - Routing descriptors use specific natural-language keywords without known cross-domain collisions.
    prerequisites:
      - runner:node-test
      - fixture:package-personas
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: >-
        The runner removes the disposable container and staged files; all business records are synthetic
        in-memory fixtures.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 256
    installation: never
  - id: marketing-model
    name: Marketing arithmetic and links
    purpose: Exercise pure compiled UTM, reallocation, scorecard and reporting-period calculations.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/marketing-model.test.mjs
    expected:
      - UTM links encode their values and refuse unsuitable URLs.
      - Budget proposals respect reallocation caps and floors; missing metrics stay no-data.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: >-
        The runner removes the disposable container and staged files; all business records are synthetic
        in-memory fixtures.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 256
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell) and family (Home shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - The board's refresh and the connected-actions module run only without an audience view; under a view no handoff is received, nothing is mounted and no section is appended to the page.
      - The company view sends only its four GETs, lists pending budget approvals and drafts (never published content), flags a channel that is on with a daily cap of 0, and marks a scorecard source without events as No data.
      - Each refused or failed publish run shows the cause the run ledger recorded (detail.reason from the real publish gate for every consent and cap branch, detail.error for a failed send), and a run without a recorded reason gets a label naming every cause its outcome covers.
      - Refusals are named - an unreadable board keeps the setup probes, a signed-out caller gets a sign-in message, and a failed Home summary or content read degrades to what is known instead of a guessed number.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
