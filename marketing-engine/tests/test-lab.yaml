  - id: marketing-audience-csv
    name: Audience CSV import with consent attestation and suppression protection
    purpose: Exercise compiled marketing-audience-csv and POST /audience/contacts/import-csv with RFC-4180 fixtures and synthetic pools.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/marketing-audience-csv.test.mjs
    expected:
      - RFC-4180 parser handles UTF-8 BOM, CRLF, quoted commas, escaped quotes, embedded newlines, blank lines, malformed quotes, 1 MiB byte cap, and 5,000-row cap.
      - Imports lacking a consent source on any row refuse atomically (400 consent_source_required) with zero writes; plain and undocumented confirmed rows import as pending while documented prior consent imports as confirmed with full evidence.
      - Suppressed addresses (including case/whitespace variants) are never re-subscribed or written, duplicates within a CSV are deduplicated, invalid emails are reported cleanly, foreign listIds are refused, and unauthenticated requests answer 401.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: All fixture records are synthetic in-memory objects; nothing is written to disk.
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: marketing-audience-rls
    name: Audience, compliance, double opt-in, broadcast, sequences, launch plans, and finance link enforcing-role PostgreSQL FORCE RLS proof
    purpose: Apply migrations 001-009 as a NOSUPERUSER NOBYPASSRLS table-owning role in a disposable PostgreSQL 16 instance and prove cross-owner isolation across all marketing-engine tables plus atomic channel_allocation commit and rollback against finance projects.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/marketing-audience-rls.test.mjs
    expected:
      - All five audience tables, compliance settings, double opt-in tables, broadcast tables, sequence tables, and launch plans (oshal_marketing_launch_plans) are owned by the enforcing role with ENABLE and FORCE ROW LEVEL SECURITY and an exact-owner policy carrying no operator bypass.
      - A second owner, an unstamped connection, and a system/operator stamp read zero rows from every audience, compliance, double opt-in, broadcast, sequence, and launch plan table and cannot mutate another owner's rows.
      - Consent export, CSV attestation, compliance approval, double opt-in single-use confirmation, broadcast dry-run and one-click unsubscribe, sequence strict standing auth with step suppression stop and welcome auto-enroll, launch plan unified calendar and recorded-numbers retro, and export-first contact deletion all pass under FORCE RLS.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: Removes its uniquely labeled tmpfs PostgreSQL container (or temporary schema/role when OSHAL_TEST_POSTGRES is provided) and verifies removal before exit.
    limits:
      timeoutMs: 120000
      maxMemoryMb: 512
    installation: never
