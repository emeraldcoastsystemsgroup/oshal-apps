# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com   | Marketing Engine v0.1.0: campaign board, per-channel
#     consent (default OFF), deterministic metrics ingest, weekly backlog-gated review tickets,
#     four inline concierge bots. Per oshal docs/business/marketing-engine-spec.md + ADR-131.
#     Publishing rides existing rails (LinkedIn action, Mastodon action, Bluesky fixed op, Resend
#     action); campaign import NEVER arms spend or consent (the series-pump import rule).
# 2 | maintainer@emeraldcoastsystemsgroup.com   | 0.4.1: every bot declares a one-line
#     selectorDescriptor + natural-language routingKeywords on its manifest entry (ADR-083
#     DECLARED precondition). The loader resolves persona paths from the server cwd, so for a
#     store package only the manifest fields reach agents.base_selector_descriptor; without them
#     routing fell back to hyphenated capability tags and Jarvis described the app generically.
#     Keywords carry no bare cross-domain collision term (post, linkedin, budget, target) and no
#     phrase already owned by another active bot (go-to-market, press release).
#     Home summary footnote now fits the core 120-char item cap. Guarded by
#     tests/marketing-manifest.test.mjs and tests/home-summary.test.mjs.

# 3 | maintainer@emeraldcoastsystemsgroup.com | Register every shipped test suite with explicit sealed-runner prerequisites; preserve readiness smoke (0.4.2).
# 4 | maintainer@emeraldcoastsystemsgroup.com   | 0.5.0, marketing suite P0: three per-user
#     readiness probes (first campaign, an armed channel, a configured sender) behind a new
#     session-authenticated route, so the Marketing Suite group's setup dashboard reads this app's
#     own store instead of guessing. "Armed" means enabled AND a daily cap of at least one — a cap
#     of zero means never, and an enabled channel with cap 0 is the trap the probe surfaces.
#     marketing-routes.ts (974 code lines, over the 800-line plan threshold) split verbatim into
#     support/bots/publish/campaigns/measure modules; the mount, factory and all 20 routes are
#     unchanged, guarded by a route-table parity check.
# 5 | maintainer@emeraldcoastsystemsgroup.com   | 0.5.1, ADR-157 S3: both scheduled services declare
#     runsAs: system. Each one opens runWithSystemIdentity and enumerates owners from the store —
#     ingestUserSubs (active campaigns UNION channel authorizations) and activeCampaignOwners —
#     then works per owner. Neither reads the caller, so a per-person activation would sweep every
#     other owner under one person's name. No `requires:` is declared: this package imports no
#     ADR-149 authorization catalog, and the loader refuses a `requires` naming a permission no
#     catalog defines. The classification widens nothing — per-channel consent still gates every
#     outward action and the weekly review still opens a backlog ticket a human must approve.
# 6 | maintainer@emeraldcoastsystemsgroup.com   | 0.5.2, ADR-164 D6: tools/marketing-engine.html
#     provides the company audience view the Business shell requests with ?audience=company —
#     campaigns, pending approvals and drafts, setup readiness, the latest scorecard week, channel
#     consent and recent publish outcomes over the existing GET routes, read-only. No route,
#     schema or permission change. Guarded by tests/audience-view.test.cjs (test-lab.yaml).
# 7 | maintainer@emeraldcoastsystemsgroup.com | 0.5.4: campaign-director declares its core word (campaign) and email-campaign phrases (marketing email campaign, marketing email, email campaign, newsletter, drip campaign): "Draft a marketing email campaign" went to Intelligent Communication, which said it could not. Guarded by the kernel's jarvis_routing_store_tests sweep_requests_reach_the_application_that_does_the_work.
# 8 | maintainer@emeraldcoastsystemsgroup.com | Roger, 2026-11-04: the default look is now Light Blue, "the white background blue highlights"; this package declared midnight, so it now declares light-blue. A person's saved theme still wins.
# 9 | maintainer@emeraldcoastsystemsgroup.com | 0.5.7 (UX audit 2026-11-06): the UTM builder is on the Channels tab with labelled fields and checks itself before any request; one refresh only; the imports note is a plain line. Guard: tests/ux-utm.test.mjs.
# 10 | maintainer@emeraldcoastsystemsgroup.com | 0.5.8 (UX audit 2026-11-06): add Board status filter chips (Active, Draft, Archived, All, default Active) and campaign search input updating the Board count, make primary buttons solid without gradient or glow, and on phone move the tab bar to a fixed opaque bottom bar (Board, Scorecard, Channels, Approvals, More -> Experiments) while stacking campaign rows as cards.
# 11 | maintainer@emeraldcoastsystemsgroup.com | 0.5.9: person-facing and model-facing product references name Open Swarm; technical identifiers and URLs keep their forms. Guard: tests/product-name.test.mjs.
# 12 | maintainer@emeraldcoastsystemsgroup.com | 0.5.10 (lane mobilesweep1, the phone first-screen sweep of 2026-11-16): on a phone the campaign list starts at 176 px (19%) instead of 357 px (39%): the page's title and tagline step aside (Today's bar names the page), and the Board's controls are two rows, search with Import (its icon) and + New, then the four status chips. Desktop unchanged. Presentation only (tools/marketing-engine.html, CSS in its 760 px phone block).
# 13 | maintainer@emeraldcoastsystemsgroup.com | 0.5.11: declare `approvals:` (`/api/marketing/budget/proposals`, `/approvals`) so proposed budget changes appear in the cross-application Approvals screen (`/cockpit/?screen=approvals`) and execute through the existing confirmed `/decide` route.
# 14 | maintainer@emeraldcoastsystemsgroup.com | 0.6.0, P1 audience store: add migration 003-marketing-audience.sql (`oshal_marketing_contacts`, `oshal_marketing_consents`, `oshal_marketing_lists`, `oshal_marketing_list_members`, `oshal_marketing_suppressions`, all exact-owner FORCE RLS), owner-scoped `/api/marketing/audience/*` routes (contacts list & segmentation, consent evidence capture/export, export-first contact delete, lists & memberships, normalized-hash suppressions), pure model unit tests, and enforcing-role PostgreSQL RLS proof.
# 15 | maintainer@emeraldcoastsystemsgroup.com | 0.6.1, P1 CSV import with consent attestation: add pure RFC-4180 CSV parser (`marketing-audience-csv`) and `POST /api/marketing/audience/contacts/import-csv` enforcing mandatory consent source per contact (atomic 400 refusal when missing), pending-by-default unless documented prior consent (`confirmed` + non-empty evidence + valid ISO-8601 timestamp) is present, strict refusal to re-subscribe suppressed addresses, and owner-scoped list attachment; proven by `tests/marketing-audience-csv.test.mjs` and extended enforcing-role PostgreSQL 16 FORCE RLS tests.
# 16 | maintainer@emeraldcoastsystemsgroup.com | 0.6.2, P1 HTML email templates & Compliance pane: add migration 004-marketing-compliance.sql (`oshal_marketing_compliance_settings` with exact-owner FORCE RLS plus idempotent `template_id`/`html_body`/`text_body` columns on `oshal_marketing_content`), pure HTML + plain-text template engine and compliance linter (`announcement`, `newsletter`, `launch` with XSS escaping, http(s)-only URLs, unremovable sender identity, physical postal address, and unsubscribe link), owner-scoped `/compliance`, `/templates`, `/templates/render`, and `/content/:id/approve` routes under `/api/marketing`, fail-closed compliance refusal (`422` + `skipped_compliance` ledger row) before Resend email publishing, and the Compliance pane in `tools/marketing-engine.html`.
# 17 | maintainer@emeraldcoastsystemsgroup.com | 0.6.3, P1 double opt-in sign-up forms: add migration 005-marketing-double-optin.sql (`oshal_marketing_signup_forms` and `oshal_marketing_optin_tokens` with exact-owner FORCE RLS), pure double opt-in model (`marketing-optin-model`: form validation, bounded sliding-window per-IP/per-form rate limiter, HMAC-SHA256 signed single-use expirable confirmation tokens, honeypot screening, UTM capture, static-site HTML/JS embed snippet builder), owner-scoped `/audience/signup-forms*` and `/audience/opt-in/confirm` routes under `/api/marketing`, and the Sign-up forms & double opt-in card in the Compliance pane.
