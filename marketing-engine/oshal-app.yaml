# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com   | Marketing Engine v0.1.0: campaign board, per-channel
#     consent (default OFF), deterministic metrics ingest, weekly backlog-gated review tickets,
#     four inline concierge bots. Per oshal docs/business/marketing-engine-spec.md + ADR-131.
#     Publishing rides existing rails (LinkedIn action, Mastodon action, Bluesky fixed op, Resend
#     action); campaign import NEVER arms spend or consent (the series-pump import rule).
# 2 | maintainer@emeraldcoastsystemsgroup.com   | 0.4.1: every bot declares a one-line
#     selectorDescriptor + natural-language routingKeywords on its manifest entry (ADR-083
#     DECLARED precondition). The loader resolves persona paths from the server cwd, so for a
#     store package only the manifest fields reach agents.base_selector_descriptor; without them
#     routing fell back to hyphenated capability tags and Jarvis described the app generically.
#     Keywords carry no bare cross-domain collision term (post, linkedin, budget, target) and no
#     phrase already owned by another active bot (go-to-market, press release).
#     Home summary footnote now fits the core 120-char item cap. Guarded by
#     tests/marketing-manifest.test.mjs and tests/home-summary.test.mjs.

# 3 | maintainer@emeraldcoastsystemsgroup.com | Register every shipped test suite with explicit sealed-runner prerequisites; preserve readiness smoke (0.4.2).
# 4 | maintainer@emeraldcoastsystemsgroup.com   | 0.5.0, marketing suite P0: three per-user
#     readiness probes (first campaign, an armed channel, a configured sender) behind a new
#     session-authenticated route, so the Marketing Suite group's setup dashboard reads this app's
#     own store instead of guessing. "Armed" means enabled AND a daily cap of at least one — a cap
#     of zero means never, and an enabled channel with cap 0 is the trap the probe surfaces.
#     marketing-routes.ts (974 code lines, over the 800-line plan threshold) split verbatim into
#     support/bots/publish/campaigns/measure modules; the mount, factory and all 20 routes are
#     unchanged, guarded by a route-table parity check.
# 5 | maintainer@emeraldcoastsystemsgroup.com   | 0.5.1, ADR-157 S3: both scheduled services declare
#     runsAs: system. Each one opens runWithSystemIdentity and enumerates owners from the store —
#     ingestUserSubs (active campaigns UNION channel authorizations) and activeCampaignOwners —
#     then works per owner. Neither reads the caller, so a per-person activation would sweep every
#     other owner under one person's name. No `requires:` is declared: this package imports no
#     ADR-149 authorization catalog, and the loader refuses a `requires` naming a permission no
#     catalog defines. The classification widens nothing — per-channel consent still gates every
#     outward action and the weekly review still opens a backlog ticket a human must approve.

name: marketing-engine
displayName: Marketing Engine
description: >-
  Takes a built oshal product to traffic, users, and revenue: campaign board with stage-gated
  intake, per-channel consent (explicit opt-in, default OFF), UTM-tagged links, a deterministic
  metrics scorecard, experiment registry, budget proposals a human approves, and weekly review
  tickets worked by inline concierge bots only after human approval.
version: 0.5.1
status: active
suite: ai-productivity
theme: midnight
scope: public

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: marketing-engine
  ref: main

uses:
  - test-catalog
  - notifications
  - app-dependencies   # compatibility floor for the tiered dependencies block (ADR-085 addendum)

dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: []
    tools: []
    # The complete connector allow-list this app's surfaces may offer (ADR-133).
    # twitter + meta-business are offered for account connection and measurement context only —
    # publishing to X/Facebook stays on the Switchboard desk; no marketing-engine code path posts there.
    connectors:
      - linkedin
      - mastodon
      - bluesky
      - resend
      - google
      - google-search-console
      - posthog
      - twitter
      - meta-business

guestTier: blocked

bots:
  # All four are INLINE concierges: no container key on purpose (reasoning rides the caller's
  # hosted/BYO brain via executeBotOrInline; connector reads/writes happen in routes, never on
  # the bot). capabilities lists are the FULL identity — manifest reload clobbers the array.
  # selectorDescriptor + routingKeywords are declared HERE, not in the persona: the loader reads
  # persona routing fields from a server-cwd path a store package never lives at (ADR-083).
  - agentId: cadf0000-0000-4000-8000-000000000001
    name: campaign-director
    persona: personas/campaign-director.yaml
    role: marketing/campaign-strategy
    selectorDescriptor: "Select when the user wants to plan, review, or steer a marketing campaign: stage-gate reviews, the weekly marketing scorecard, campaign copy from a brief, experiments, or a budget reallocation proposal. Drafts and proposes only; never publishes or spends."
    routingKeywords:
      - marketing campaign
      - campaign plan
      - campaign review
      - weekly marketing review
      - campaign brief
      - channel copy
      - marketing experiment
      - a/b test
      - marketing budget
      - ad spend
      - budget reallocation
    capabilities:
      - campaign-planning
      - marketing-scorecard-review
      - budget-proposals
      - experiment-review
      - content-briefing
  - agentId: cadf0000-0000-4000-8000-000000000002
    name: market-analyst
    persona: personas/market-analyst.yaml
    role: marketing/market-research
    selectorDescriptor: "Select when the user wants market research for a campaign: an ideal customer profile (ICP), where that audience gathers, competitor positioning, SEO keyword research, or pricing comparables. Researches and structures only; never contacts anyone."
    routingKeywords:
      - ideal customer profile
      - icp card
      - audience research
      - market research
      - competitor scan
      - competitive positioning
      - keyword research
      - seo keywords
      - pricing comparables
      - buyer objections
      - message angles
    capabilities:
      - icp-research
      - competitor-scan
      - keyword-research
      - pricing-comparables
  - agentId: cadf0000-0000-4000-8000-000000000003
    name: growth-analyst
    persona: personas/growth-analyst.yaml
    role: marketing/measurement
    selectorDescriptor: "Select when the user wants marketing numbers explained: a weekly scorecard narrative from Search Console, PostHog, or GitHub traffic, funnel analysis, or traffic and signup anomalies. Reads and explains only; never changes a campaign."
    routingKeywords:
      - scorecard narrative
      - growth metrics
      - funnel analysis
      - conversion funnel
      - traffic trends
      - search console
      - posthog
      - github traffic
      - signup trends
      - week-over-week change
      - traffic anomaly
    capabilities:
      - funnel-analysis
      - scorecard-narrative
      - anomaly-flagging
  - agentId: cadf0000-0000-4000-8000-000000000004
    name: launch-coordinator
    persona: personas/launch-coordinator.yaml
    role: marketing/launches
    selectorDescriptor: "Select when the user is preparing a product launch: a launch checklist, Hacker News, Reddit, or Product Hunt drafts a human posts by hand, press outreach drafts, or a launch retrospective. Drafts only; never posts or submits."
    routingKeywords:
      - product launch
      - launch checklist
      - launch plan
      - launch day
      - show hn
      - hacker news
      - reddit launch
      - product hunt
      - press outreach
      - media pitch
      - launch retro
      - community launch drafts
    capabilities:
      - launch-checklists
      - community-post-drafts
      - press-outreach-drafts
      - launch-retro

chatBot: campaign-director

# ONE ticket queue: the weekly review + any ad-hoc campaign work. NO autoStart — tickets wait in
# backlog until a human approves them (the front gate for bot work; operator directive 2026-07-24).
ticketType: marketing-campaign
workflow:
  name: marketing-campaign-review
  workerBot: campaign-director

schedules:
  # Deterministic, no-LLM. Consent rows gate every outward action; ingest only READS sources.
  #
  # ADR-157: both are SYSTEM services. Each opens runWithSystemIdentity and enumerates the owners
  # it serves from this app's own store, then works per owner — the caller never selects the set.
  # A per-person activation would therefore reach into every other owner's data under one person's
  # identity, which is exactly what the class exists to prevent, so a swarm administrator activates
  # them once for the application instead.
  - id: daily-metrics-ingest
    cron: "20 6 * * *"
    scope: framework
    runsAs: system
    description: Pull configured metrics sources (Search Console, PostHog, GitHub traffic) into the owner-scoped marketing_events store. Reads only; sources missing config are recorded as NO DATA, never invented.
    target: service-route
    route: /api/marketing-ops/ingest
    handler: runMarketingDailyIngest
  - id: weekly-campaign-review
    cron: "0 12 * * 1"
    scope: framework
    runsAs: system
    description: Roll up the weekly scorecard and open ONE backlog review ticket per owner with active campaigns. No bot runs and nothing publishes until a human approves the ticket in the cockpit.
    target: service-route
    route: /api/marketing-ops/weekly
    handler: runMarketingWeeklyReview

routes:
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/marketing-engine/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/marketing-routes.js
    factory: createMarketingRoutes
    mountPath: /api/marketing
    auth: oidc
    requiresAuth: true
    requiresContext: true
  - module: routes/marketing-ops-routes.js
    factory: createMarketingOpsRoutes
    mountPath: /api/marketing-ops
    auth: service
    requiresContext: true
  - module: routes/marketing-readiness.js
    factory: createMarketingReadinessRoutes
    mountPath: /api/marketing-engine/readiness
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/marketing-engine/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

# Per-user setup probes the Marketing Suite group's setup dashboard reads (ADR-141). Session-
# authenticated siblings of smoke:, answered from THIS package's own owner-scoped store — a group
# step is done only when this app says so. Read-only; they arm nothing.
readiness:
  - name: campaign
    path: /api/marketing-engine/readiness
    readyPointer: /campaign/ready
    detailPointer: /campaign/detail
  - name: channels
    path: /api/marketing-engine/readiness
    readyPointer: /channels/ready
    detailPointer: /channels/detail
  - name: sender
    path: /api/marketing-engine/readiness
    readyPointer: /sender/ready
    detailPointer: /sender/detail

smoke:
  - name: package-readiness
    method: GET
    path: /api/marketing-engine/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

ui:
  static:
    - toolName: marketing-engine
      label: Marketing
      icon: codicon codicon-megaphone
      iframeUrl: /api/marketing
      section: top
    - toolName: marketing-content-studio
      label: Content Studio
      icon: codicon codicon-edit
      iframeUrl: /api/content/studio
      section: top
    - toolName: marketing-linkedin-assistant
      label: LinkedIn Assistant
      icon: codicon codicon-comment-discussion
      iframeUrl: /api/linkedin-assistant/panel
      section: top

ribbon:
  defaultView: marketing-engine

migrations:
  - migrations/001-marketing-core.sql
  - migrations/002-marketing-metrics.sql

integrations:
  accepts:
    - id: prepare-brief
      contextType: research-brief
      version: 1
      surface: marketing-engine
      fields:
        - title
        - notes
        - sourceUrl
  offers:
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
    - id: prepare-post
      label: Prepare a post
      targetApp: switchboard
      targetAction: prepare-post
      contextType: communication-brief
      version: 1
    - id: prepare-social
      label: Prepare a social draft
      targetApp: social
      targetAction: prepare-post
      contextType: communication-brief
      version: 1
    - id: prepare-video
      label: Prepare a video clip
      targetApp: vids
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
    - id: prepare-episode
      label: Prepare a video episode
      targetApp: video
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
    - id: prepare-brand
      label: Prepare a brand graphic
      targetApp: brand-graphics
      targetAction: prepare-brief
      contextType: research-brief
      version: 1

summary:
  path: /api/marketing-engine/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items

testing:
  version: 1
  catalog: tests/test-lab.yaml
