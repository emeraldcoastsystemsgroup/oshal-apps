# 21 | maintainer@emeraldcoastsystemsgroup.com | 0.6.7, P3 launch plans, grounded retros, and unified marketing calendar: add migration 008-marketing-launch-plans.sql (`oshal_marketing_launch_plans` with exact-owner FORCE RLS plus idempotent `scheduled_for` column on `oshal_marketing_content`), pure launch plan/calendar/retro model (`marketing-launch-model`: dated milestones, default launch-coordinator asset checklist, deduplicated chronological unified calendar across engine content, milestones, broadcasts, and optional Switchboard posts, and strictly recorded-numbers-only campaign retro emitting NO DATA where unrecorded), owner-scoped `/launch-plans*` and `/calendar` routes under `/api/marketing`, and Launch Plans & Unified Calendar cards in `#pane-experiments`.
# 22 | maintainer@emeraldcoastsystemsgroup.com | 0.6.8, P2 campaign-to-finance-project link and atomic channel-allocation proposals: add migration 009-marketing-finance-link.sql (`finance_project_id` and `channel_allocations` on `oshal_marketing_campaigns`), declare `create-budget-project` offer to `finance` (optional app, zero change to `dependencies.required`), add owner-scoped `/campaigns/:id/finance-project`, `/campaigns/:id/budget-summary`, and `/campaigns/:id/reallocation-proposals` under `/api/marketing`, wire `reallocationProposals()` into the weekly review, extend `decideBudgetProposal` to apply `channel_allocation` atomically across campaign/Finance lines and budget ledger in one transaction, and add the Create budget in Finance hand-off and live Finance summary in campaign detail.
