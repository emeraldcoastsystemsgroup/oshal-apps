# 19 | maintainer@emeraldcoastsystemsgroup.com | 0.6.5, P1 one-click unsubscribe and broadcast pipeline: add migration 006-marketing-broadcasts.sql (`oshal_marketing_messages` and `oshal_marketing_deliveries` with exact-owner FORCE RLS), pure broadcast gate engine (`marketing-broadcast-model`: signed per-recipient/per-list HMAC-SHA256 unsubscribe tokens, RFC 8058 List-Unsubscribe/List-Unsubscribe-Post headers, full send gate chain), owner-scoped `/broadcasts*`, `/audience/unsubscribe`, and `/audience/preferences/:contactId` routes under `/api/marketing`, and the Broadcasts & One-Click Unsubscribe card in the Compliance pane.
