# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | Import career-hunter from its single owning application, career-hunter, instead of relying on global aliases or duplicate bot ownership.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Name the screen's concierge (chatBot: career-hunter, the required bot this app already imports and its workerBot) so the shell offers a live conversation; it declared no bot or chatBot, so its concierge panel was hidden.
# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.1.6: the review page no longer forces color-scheme: dark, so its native form controls follow the portal theme like the rest of the page.
# 4 | maintainer@emeraldcoastsystemsgroup.com | 1.1.8: the review page's buttons are on the design standard's scale (docs/ux/design-standard.md §4.1; Roger F14, 2026-11-06: "not following the general sizing of objects"): body-size labels at 600 (15px on a desktop with a fine pointer), 44px tall with 16px sides, radius m, a solid secondary fill with the control edge, and the label on one line, so a button hugs its label instead of wrapping into a two-line bubble.
# 5 | maintainer@emeraldcoastsystemsgroup.com | 1.1.9: UX design-standard sweep (D1=glass, D2=c, job-apply--job-apply-review): declare DS-00 collection contract on tools/review.html, load surface-glass.css, put radii and font sizes on the standard scale, hide duplicate header title when framed, and withhold all-zero counters when no runs exist.
# 6 | maintainer@emeraldcoastsystemsgroup.com | 1.1.10 (concierge audit T15, the store's PENDING list): the screen's concierge is career-concierge, Career's inline front desk since career-hunter 1.57.0 (career-hunter is now its dedicated-node worker), imported from the required member career-hunter beside the career-hunter worker the workflow keeps. The Intelligent Career group made the same switch in 1.1.12, and the store bot contract refuses a node-posture chatBot (scripts/check-store-bots.mjs). career-concierge needs the same Career permissions (app.open, career.execute) as career-hunter. No route, tool, permission or workflow change.
# 7 | maintainer@emeraldcoastsystemsgroup.com | 1.2.0: Job Apply is the tool Career and Jarvis use to apply to jobs, with one per-person setting: which connected device applies to jobs. Adds the job-apply-settings screen (/api/job-apply/settings) so the Job Apply tile opens the connected-device setting instead of a ticket queue, explains how to connect a device when none are connected, and exposes the read-only job_apply_device_config route tool.

name: job-apply
suite: ai-knowledge   # ADR-097: primary catalog shelf (tools keep their own category:)
chatBot: career-concierge # Concierge the shell offers beside this screen: Career's own, imported from career-hunter below.
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 64, high: 256, basis: declared }
  features:
    - id: job-application-ticket
      unit: job application submission
      tier: T4
      generation: none
      degrade: disable
displayName: Job Apply
description: >-
  Choose which connected device Career and Jarvis use when applying to jobs. Lists your connected
  Open Swarm Orbit computers and browser workers, explains how to connect one when none are connected,
  and runs the job-apply submission workflow.
version: 1.2.0
theme: light-blue
testing:
  version: 1
  catalog: tests/test-lab.yaml
status: active

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: job-apply
  ref: main

tools:
  - name: job_apply_device_config
    displayName: Job Apply Device Configuration
    type: api
    category: productivity
    description: Read the Job Apply connected-device setting contract and the endpoints Career and Jarvis use to inspect or choose the connected device that applies to jobs.
    executor: { executorType: api, apiEndpoint: "GET /api/job-apply/config" }
    defaultAuthMode: auto
    requiresApproval: false
    routingTags: [job-apply, career, connected-device, apply]
    tags: [job-apply, route-backed]

routes:
  - module: routes/review.js
    factory: createReviewRoutes
    mountPath: /api/job-apply
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/job-apply/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/job-apply/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

smoke:
  - name: package-readiness
    method: GET
    path: /api/job-apply/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

dependencies:
  required:
    apps: [career-hunter]
    bots:
      - app: career-hunter
        name: career-hunter
      - app: career-hunter
        name: career-concierge
    tools: []
    connectors: []
  optional:
    apps: []
    tools: []
    connectors: []

uses:
  - app-dependencies
  - test-catalog

ticketType: job-apply
workflow:
  name: Job Application Submission
  pipeline: job-apply
  workerBot: career-hunter

summary:
  path: /api/job-apply/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items

ui:
  static:
    - toolName: job-apply-settings
      label: Job Apply
      icon: codicon codicon-send
      iframeUrl: /api/job-apply/settings
      section: top

ribbon:
  defaultView: job-apply-settings

integrations:
  offers:
    - id: review-career
      label: Review in Career
      targetApp: career-hunter
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
