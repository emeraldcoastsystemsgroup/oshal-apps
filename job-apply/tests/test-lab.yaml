version: 1
cases:
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell) and family (Home shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the company view reads only GET /home-summary, the one read this view makes; it writes nothing and never fetches the connected-actions plan.
      - The stats are the route's five ledger counts with their tones; the runs table reads company, state and last update from the route's detail string; the notes list carries the route's own non-run sentences.
      - The title names the account's state (failed or unknown to review, runs active, verified in five days, no runs active, no runs yet); an unchecked source, a 401, a 403, a 503 with the route's body, a non-JSON failure and a failure with its own error each read as what they are.
      - Under an audience view the page's module script binds no handoff listener, mounts no connected actions and reads nothing; without the audience it reads GET /api/apply-operator/workers.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: job-apply-device-setting
    name: Job Apply connected-device setting screen at phone and desktop viewports
    purpose: >-
      Drive tools/review.html in headless Chromium at 412x915 with touch and 1440x900 over synthetic same-origin routes:
      zero devices shows None connected with setup instructions, and two connected devices let the person pick and save either device.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/job-apply-device-browser.test.cjs
    expected:
      - Zero connected devices renders None connected, setup instructions for Open Swarm Orbit, Connect a device (/cockpit/tools/devices.html), Open in Career, no job-ticket list, 44px targets and zero horizontal overflow.
      - Two connected devices render selectable radio cards; choosing beta-laptop then alpha-desk sends PUT /api/apply-operator/workers with the chosen deviceId and updates the live status banner.
    prerequisites:
      - runner:node-test
      - browser:chromium
      - fixture:store-toolchain
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: Close the browser contexts; every request is answered inside the browser.
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
