# 1   | maintainer@emeraldcoastsystemsgroup.com     | 1.1.2: register the audience view contract of the review page (ADR-164 D6) with its runner and isolation boundaries.
# 2   | maintainer@emeraldcoastsystemsgroup.com     | 1.1.3: the family audience view registered beside the company one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
# 3   | maintainer@emeraldcoastsystemsgroup.com     | 1.2.0: register job-apply-device-setting for the single connected-device setting screen in Chromium at 412x915 (touch) and 1440x900.
