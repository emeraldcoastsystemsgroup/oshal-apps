# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR                                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1   | maintainer@emeraldcoastsystemsgroup.com     | 1.1.2: register the audience view contract of the review page (ADR-164 D6) with its runner and isolation boundaries: the company view for the Business shell reads only GET /home-summary on open (the one read this page has), names the account's state, an unchecked source, a refusal and a failure for what they are, and leaves the full page's own start (handoff listener, connected actions, refresh) ungated only when no audience view renders.
# 2 | maintainer@emeraldcoastsystemsgroup.com | 1.1.3: the family audience view registered beside the company one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
# -----------------------------------------------------------------------------
version: 1
cases:
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell) and family (Home shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the company view reads only GET /home-summary, the one read this page has; it writes nothing and never fetches the connected-actions plan.
      - The stats are the route's five ledger counts with their tones; the runs table reads company, state and last update from the route's detail string; the notes list carries the route's own non-run sentences.
      - The title names the account's state (failed or unknown to review, runs active, verified in five days, no runs active, no runs yet); an unchecked source, a 401, a 403, a 503 with the route's body, a non-JSON failure and a failure with its own error each read as what they are.
      - Under an audience view the page's module script binds no handoff listener, mounts no connected actions and reads nothing; without the audience it still runs every start step.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
