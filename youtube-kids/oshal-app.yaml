# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR                                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1   | maintainer@emeraldcoastsystemsgroup.com     | Declare migrations/001-youtube-activity.sql: on the native kernel GET /status 500'd "SQL schema is not provisioned" for everyone who had not uploaded, because a read cannot create the table. Register the package's Test Lab catalog.
# 2   | maintainer@emeraldcoastsystemsgroup.com     | 1.2.1: declare kid-lens-bot as the chatBot, so a request from Jarvis that asks to make, build, order or plan something reaches it.
# 3   | maintainer@emeraldcoastsystemsgroup.com     | 1.2.2: kid-lens-bot declares routing words (youtube, youtube kids, kid video, kids video, ...).
# 4   | maintainer@emeraldcoastsystemsgroup.com     | 1.3.0: UX audit 2026-11-06 (youtube-kids-review MERGE, P0): Kid Lens Review leaves the menu and the parent brief is the app's one screen; no fixed sakura theme.
# 5   | maintainer@emeraldcoastsystemsgroup.com     | 1.3.1: the planned control 'Child ▾ · Not available yet' at the left of the Kid Lens header (design standard §4.10, backlog RP-KL-01).
# 6   | maintainer@emeraldcoastsystemsgroup.com     | 1.3.2: the review template behind the redirect shows 'Your next brief' only when a connected action renders.
# 7   | maintainer@emeraldcoastsystemsgroup.com     | 1.3.3: the review page's buttons are on the design standard's scale.
# 8   | maintainer@emeraldcoastsystemsgroup.com     | 1.4.0: RP-KL-01 household child profiles (up to 8 per signed-in parent), one watch history and parent brief per child, live Child ▾ header switcher, forced-RLS migrations, and concierge child-profile tools.
# -----------------------------------------------------------------------------

name: youtube-kids
suite: ai-home
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features:
    - id: kid-lens-brief
      unit: parent brief
      tier: T3
      generation: none
      degrade: disable
    - id: youtube-kids-brief-ticket
      unit: brief ticket
      tier: T3
      generation: none
      degrade: disable
displayName: Kid Lens
description: >-
  Upload your YouTube Takeout watch history for each child in your household (up to 8 profiles)
  and get a parent-friendly brief on what each kid is into — top interests, what the unfamiliar
  channels actually are, gift ideas, and conversation openers. Read-only; nothing is posted or sent.
version: 1.4.0

artifacts:
  accepts:
    - id: takeout
      label: Ingest into Kid Lens
      icon: 🧒
      types: [application/json]
      mode: post
      endpoint: /api/youtube-kids/import-artifact
status: inactive
testing:
  version: 1
  catalog: tests/test-lab.yaml

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: youtube-kids
  ref: main

smoke:
  - name: package-readiness
    method: GET
    path: /api/youtube-kids/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: []
    tools: []
    connectors: []

uses:
  - app-dependencies
  - memory
  - test-catalog

chatBot: kid-lens-bot

ticketType: youtube-kids-brief

workflow:
  name: Kid Lens Brief
  workerBot: kid-lens-bot

bots:
  - agentId: a0000000-0000-0000-0000-000000000043
    name: kid-lens-bot
    routingKeywords:
      - youtube
      - youtube kids
      - kid video
      - kids video
      - safe video
      - video for my kid
      - watch history
      - kid lens
    persona: personas/kid-lens-analyzer.yaml
    role: family/youtube-insights
    capabilities:
      - watch-history-analysis
      - interest-clustering
      - channel-decoding
      - gift-suggestion
      - conversation-prompts
      - child-profiles

tools:
  - name: kid-lens-children-list
    displayName: List Kid Lens Child Profiles
    type: api
    category: youtube-kids
    description: List the signed-in parent's Kid Lens child profiles, whether each child has an uploaded watch history, and whether a parent brief is ready.
    executor: { executorType: api, apiEndpoint: "GET /api/youtube-kids/children" }
    defaultAuthMode: auto
    requiresApproval: false
    routingTags: [kid-lens, youtube-kids, children, profiles]
    skills: [child-profiles]
    tags: [youtube-kids, route-backed]

  - name: kid-lens-child-brief
    displayName: Read Child Parent Brief
    type: api
    category: youtube-kids
    description: Read the stored parent brief for a specific child profile (or the default child when childId is omitted) without re-running analysis.
    executor: { executorType: api, apiEndpoint: "GET /api/youtube-kids/brief?childId={childId}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        childId:
          type: string
          description: Optional child profile ID from kid-lens-children-list.
    routingTags: [kid-lens, youtube-kids, brief, children]
    skills: [child-profiles, watch-history-analysis]
    tags: [youtube-kids, route-backed]

  - name: kid-lens-child-add
    displayName: Add Kid Lens Child Profile
    type: api
    category: youtube-kids
    description: Add a household child profile by first name (up to 8 profiles per parent account).
    executor: { executorType: api, apiEndpoint: "POST /api/youtube-kids/children" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        name:
          type: string
          description: The child's first name (1 to 40 characters).
      required: [name]
    routingTags: [kid-lens, youtube-kids, children, add]
    skills: [child-profiles]
    tags: [youtube-kids, route-backed]

  - name: kid-lens-child-rename
    displayName: Rename Kid Lens Child Profile
    type: api
    category: youtube-kids
    description: Rename one of the signed-in parent's Kid Lens child profiles.
    executor: { executorType: api, apiEndpoint: "POST /api/youtube-kids/children/rename" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        childId:
          type: string
          description: Child profile ID from kid-lens-children-list.
        name:
          type: string
          description: Updated first name (1 to 40 characters).
      required: [childId, name]
    routingTags: [kid-lens, youtube-kids, children, rename]
    skills: [child-profiles]
    tags: [youtube-kids, route-backed]

  - name: kid-lens-child-delete
    displayName: Delete Kid Lens Child Profile
    cardText: Delete this child profile along with its uploaded watch history and saved parent brief.
    type: api
    category: youtube-kids
    description: Delete one of the signed-in parent's child profiles along with its uploaded YouTube watch history and saved brief.
    executor: { executorType: api, apiEndpoint: "POST /api/youtube-kids/children/delete" }
    defaultAuthMode: approval
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        childId:
          type: string
          description: Child profile ID from kid-lens-children-list.
      required: [childId]
    routingTags: [kid-lens, youtube-kids, children, delete]
    skills: [child-profiles]
    tags: [youtube-kids, route-backed]

  - name: kid-lens-child-analyze
    displayName: Analyze Child Watch History
    type: api
    category: youtube-kids
    description: Run or refresh the Kid Lens parent brief for a child profile that already has an uploaded watch history.
    executor: { executorType: api, apiEndpoint: "POST /api/youtube-kids/brief" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        childId:
          type: string
          description: Optional child profile ID from kid-lens-children-list.
    routingTags: [kid-lens, youtube-kids, brief, analyze]
    skills: [child-profiles, watch-history-analysis]
    tags: [youtube-kids, route-backed]

routes:
  - module: routes/review.js
    factory: createReviewRoutes
    mountPath: /api/youtube-kids/review
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/youtube-kids/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/youtube-kids/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/youtube-kids-routes.js
    factory: createYoutubeKidsRoutes
    mountPath: /api/youtube-kids
    auth: oidc
    requiresContext: true

migrations:
  - migrations/001-youtube-activity.sql
  - migrations/002-youtube-children.sql
  - migrations/003-youtube-children-rls.sql

nativeMigrations:
  - id: migrations/003-youtube-children-rls.sql
    native: skip
    reason: "Row security for oshal_youtube_children and oshal_youtube_activity: ENABLE/FORCE and pg_policies-guarded CREATE POLICY are PostgreSQL-only; the native per-person scope keeps each parent's profiles and briefs in their own database."

takeout:
  - kind: youtube-watch-history
    label: YouTube watch history
    pathSuffix: Takeout/YouTube and YouTube Music/history/watch-history.json
    htmlPathSuffix: Takeout/YouTube and YouTube Music/history/watch-history.html
    maxBytes: 67108864
    module: routes/youtube-kids-routes.js
    handler: ingestTakeoutWatchHistory

ui:
  static:
    - toolName: youtube-kids
      label: Kid Lens
      icon: codicon codicon-device-camera-video
      iframeUrl: /api/youtube-kids/
      section: top

ribbon:
  hideFrameworkItems:
    - tickets
    - chat
    - calendar
    - addressbook
    - dashboard
    - logs
    - operations
  defaultView: kidlens-home

summary:
  path: /api/youtube-kids/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items

integrations:
  offers:
    - id: plan-gift
      label: Discuss gift ideas
      targetApp: purchasing
      targetAction: plan-purchase
      contextType: planning-brief
      version: 1
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
