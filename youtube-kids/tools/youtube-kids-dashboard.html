<!DOCTYPE html>
<!--
  Kid Lens surface — the YouTube-Takeout "what is my kid into" app.
  Self-contained iframe page (served by createYoutubeKidsRoutes at /api/youtube-kids/).
  Two states: upload (no data yet) and brief (renders the bot's Markdown analysis), per child profile.
  All work is auth-gated server-side; this page calls the JSON API.

  CHANGE LOG
  SEQ | AUTHOR                                  | DESCRIPTION
  1   | maintainer@emeraldcoastsystemsgroup.com | The brief is read with GET /brief (stored brief only) and produced with POST /brief, on Re-analyze or when GET answers {brief:null, hasData:true}; with no watch history the upload screen shows.
  2   | maintainer@emeraldcoastsystemsgroup.com | UX audit 2026-11-06 (youtube-kids, and the Kid Lens Review merge): this brief is the app's one screen; theme tokens, conditional Re-analyze primary, Cancel on upload, single readiness probe, 3-tile row.
  3   | maintainer@emeraldcoastsystemsgroup.com | Planned control (DS-45): greyed 'Child ▾' at the left of the header, backlog RP-KL-01.
  4   | maintainer@emeraldcoastsystemsgroup.com | RP-KL-01: replace planned placeholder with live Child ▾ household profile switcher (up to 8 profiles per parent, inline add/rename/two-step delete, per-child upload and brief).
-->
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kid Lens</title>
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css" />
<script src="/shared/ui/js/surface-theme.js"></script>
<style>
  :root {
    --bg: var(--bg-primary);
    --panel: var(--bg-card);
    --panel2: var(--bg-tertiary);
    --line: var(--border-color);
    --text: var(--text-primary);
    --muted: var(--text-muted);
    --accent: var(--accent-primary, #3b82f6);
    --accent2: var(--accent-primary-hover, #ffd36e);
    --danger: var(--status-error, #dc2626);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
  .page { max-width:820px; margin:0 auto; padding:30px 24px 70px; }
  .head { display:flex; align-items:center; gap:12px; margin-bottom:4px; position:relative; }
  .child-picker { position:relative; flex:0 0 auto; }
  .child-btn { min-height:38px; max-width:190px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:inline-flex; align-items:center; gap:6px; }
  .child-menu { position:absolute; top:calc(100% + 6px); left:0; z-index:40; width:min(330px, calc(100vw - 28px)); background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px; box-shadow:0 12px 28px rgba(0,0,0,.22); }
  .child-menu[hidden] { display:none; }
  .child-list { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .child-row { border:1px solid var(--line); border-radius:9px; background:var(--panel); padding:7px 9px; display:flex; flex-direction:column; gap:6px; }
  .child-row.active { border-color:var(--accent); }
  .child-row-main { display:flex; align-items:center; gap:6px; }
  .child-select { flex:1 1 auto; min-width:0; text-align:left; background:transparent; border:none; color:var(--text); font-size:13px; font-weight:600; padding:4px 2px; cursor:pointer; display:flex; flex-direction:column; gap:2px; }
  .child-meta { font-size:11px; font-weight:400; color:var(--muted); }
  .mini-btn { border:1px solid var(--line); background:var(--panel2); color:var(--text); border-radius:6px; padding:5px 8px; font-size:12px; font-weight:600; cursor:pointer; min-height:32px; }
  .mini-btn.danger { border-color:var(--danger); color:var(--danger); }
  .child-inline { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .child-input { flex:1 1 130px; min-width:0; border:1px solid var(--line); border-radius:7px; background:var(--panel2); color:var(--text); padding:7px 9px; font-size:13px; }
  .child-add { display:flex; gap:6px; align-items:center; border-top:1px solid var(--line); padding-top:10px; }
  .child-msg { font-size:12px; margin-top:8px; color:var(--muted); }
  .child-msg.err { color:var(--danger); }
  h1 { font-size:23px; margin:0; }
  .badge { font-size:20px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:22px; line-height:1.5; }
  .actions { margin-left:auto; display:flex; gap:8px; }
  .btn { border:none; border-radius:8px; padding:9px 15px; cursor:pointer; font-size:13px; font-weight:600; }
  .btn.primary { background:var(--accent-primary); color:var(--text-on-accent, #fff); }
  .btn.ghost { background:var(--panel2); border:1px solid var(--line); color:var(--text); }
  .btn:disabled { opacity:.5; cursor:default; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; }
  .panel h2 { font-size:16px; margin:0 0 8px; }
  .steps { color:var(--muted); font-size:13px; line-height:1.7; padding-left:20px; margin:6px 0 18px; }
  .steps code { background:var(--panel2); border:1px solid var(--line); border-radius:5px; padding:1px 6px; color:var(--text); font-size:12px; }
  .drop { border:2px dashed var(--line); border-radius:12px; padding:26px; text-align:center; color:var(--muted); transition:border-color .15s,background .15s; cursor:pointer; }
  .drop.over { border-color:var(--accent); background:var(--panel2); }
  .drop strong { color:var(--text); }
  input[type=file] { display:none; }
  .stats { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; margin-bottom:18px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:11px 15px; min-width:0; }
  .stat .n { font-size:20px; font-weight:700; color:var(--accent); }
  .stat .l { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .brief { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:8px 26px 22px; }
  .brief h2 { color:var(--text); font-size:15px; border-bottom:2px solid var(--accent); padding-bottom:6px; margin:22px 0 10px; }
  .brief h3 { font-size:14px; margin:16px 0 6px; }
  .brief ul { margin:6px 0 6px; padding-left:20px; }
  .brief li { font-size:14px; line-height:1.6; margin:3px 0; }
  .brief p { font-size:14px; line-height:1.65; color:var(--text-secondary, #e8dbe6); }
  .brief strong { color:var(--text); }
  .notice { color:var(--muted); padding:30px 0; text-align:center; font-size:14px; }
  .upload-actions { display:flex; justify-content:flex-end; margin-top:18px; }
  .upload-actions[hidden] { display:none; }
  .ok { color:var(--text); }
  .err { color:var(--status-error, #ff8b8b); }
  .spin { color:var(--muted); font-size:14px; padding:28px 0; text-align:center; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); animation:p 1s infinite; }
  @keyframes p { 0%,100%{opacity:.3} 50%{opacity:1} }
  @media (max-width: 640px) {
    .page { padding: 16px 14px 50px; }
    .head { flex-wrap: wrap; gap: 8px; }
    .child-btn { min-height: 44px; font-size: 14px; }
    .mini-btn { min-height: 38px; padding: 6px 10px; }
    .actions { margin-left: 0; width: 100%; flex-wrap: wrap; }
    .actions .btn { flex: 1 1 auto; font-size: 14px; padding: 11px 12px; min-height: 44px; }
    .panel { padding: 16px; }
    .drop { padding: 20px 14px; }
    .stat { padding: 10px 8px; }
    .stat .n { font-size: clamp(13px, 3.5vw, 17px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .upload-actions .btn { min-height: 44px; }
    input[type=text], input[type=email], input[type=search], select, textarea { font-size: 16px; }
  }
</style>
  <link rel="stylesheet" href="/shared/ui/css/surface-glass.css" />
</head>
<body>
<div class="page">
  <div class="head">
    <div class="child-picker" id="childPicker">
      <button type="button" class="btn ghost child-btn" id="childPickerBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="childMenu"><span id="childPickerLabel">Child</span> ▾</button>
      <div class="child-menu" id="childMenu" role="dialog" aria-label="Child profiles" hidden></div>
    </div>
    <span class="badge">👀</span>
    <h1>Kid Lens</h1>
    <div class="actions" id="actions" style="display:none">
      <button class="btn ghost" id="reupload">Upload new export</button>
      <button class="btn ghost" id="reanalyze">Re-analyze</button>
    </div>
  </div>
  <div class="sub" id="subhead">What your kid is into on YouTube — interests, what the channels actually are, gift ideas, and things to talk to them about. Built from your own Google Takeout watch history. Nothing is posted or shared.</div>
  <div id="main"><div class="spin"><span class="dot"></span> Loading…</div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const main = $('main');
const state = {
  takeoutService: null,
  takeoutProbe: null,
  hasBrief: false,
  children: [],
  maxChildren: 8,
  activeChildId: null,
  menuOpen: false,
  renamingId: null,
  deletingId: null,
  menuError: '',
};

function escHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function activeChild() {
  return state.children.find((c) => c.childId === state.activeChildId) || null;
}

function withChildQuery(base) {
  return state.activeChildId ? `${base}?childId=${encodeURIComponent(state.activeChildId)}` : base;
}

function updateChildButton() {
  const cur = activeChild();
  const label = $('childPickerLabel');
  if (label) label.textContent = cur ? cur.name : 'Child';
  const btn = $('childPickerBtn');
  if (btn) btn.setAttribute('aria-expanded', state.menuOpen ? 'true' : 'false');
}

function renderChildMenu() {
  const menu = $('childMenu');
  if (!menu) return;
  menu.hidden = !state.menuOpen;
  updateChildButton();
  if (!state.menuOpen) return;
  const rowsHtml = state.children.length
    ? state.children.map((c, idx) => {
        const isActive = c.childId === state.activeChildId;
        const meta = c.hasBrief ? 'Brief ready' : c.hasData ? `${(c.totalWatched || 0).toLocaleString()} videos uploaded` : 'No upload yet';
        let extra = '';
        if (state.renamingId === c.childId) {
          extra = `<div class="child-inline">
            <input type="text" class="child-input" id="renameInput_${idx}" maxlength="40" value="${escHtml(c.name)}" aria-label="New first name" />
            <button type="button" class="mini-btn" id="renameSave_${idx}">Save</button>
            <button type="button" class="mini-btn" id="renameCancel_${idx}">Cancel</button>
          </div>`;
        } else if (state.deletingId === c.childId) {
          extra = `<div class="child-inline">
            <span class="child-meta">Delete ${escHtml(c.name)}'s export &amp; brief?</span>
            <button type="button" class="mini-btn danger" id="deleteConfirm_${idx}">Delete</button>
            <button type="button" class="mini-btn" id="deleteCancel_${idx}">Keep</button>
          </div>`;
        }
        return `<div class="child-row${isActive ? ' active' : ''}" data-child-id="${escHtml(c.childId)}">
          <div class="child-row-main">
            <button type="button" class="child-select" id="childSel_${idx}">
              <span>${escHtml(c.name)}</span>
              <span class="child-meta">${escHtml(meta)}</span>
            </button>
            <button type="button" class="mini-btn" id="childRen_${idx}">Rename</button>
            <button type="button" class="mini-btn danger" id="childDel_${idx}">Delete</button>
          </div>${extra}
        </div>`;
      }).join('')
    : '<div class="child-meta" style="padding:4px 2px 8px">Add a profile for each child in your household (up to 8).</div>';
  const addHtml = state.children.length >= state.maxChildren
    ? `<div class="child-add"><span class="child-meta">Up to ${state.maxChildren} child profiles per account.</span></div>`
    : `<div class="child-add">
        <input type="text" class="child-input" id="newChildName" maxlength="40" placeholder="Child's first name" aria-label="Child's first name" />
        <button type="button" class="btn primary" id="addChildBtn">Add</button>
      </div>`;
  const msgHtml = state.menuError ? `<div class="child-msg err" id="childMenuMsg">${escHtml(state.menuError)}</div>` : '';
  menu.innerHTML = `<div class="child-list">${rowsHtml}</div>${addHtml}${msgHtml}`;
  bindChildMenuHandlers();
}

function bindChildMenuHandlers() {
  state.children.forEach((c, idx) => {
    const sel = $('childSel_' + idx);
    if (sel) sel.onclick = () => selectChild(c.childId);
    const ren = $('childRen_' + idx);
    if (ren) ren.onclick = () => { state.renamingId = c.childId; state.deletingId = null; state.menuError = ''; renderChildMenu(); };
    const del = $('childDel_' + idx);
    if (del) del.onclick = () => { state.deletingId = c.childId; state.renamingId = null; state.menuError = ''; renderChildMenu(); };
    const rSave = $('renameSave_' + idx);
    if (rSave) rSave.onclick = () => submitRenameChild(c.childId, $('renameInput_' + idx)?.value || '');
    const rCancel = $('renameCancel_' + idx);
    if (rCancel) rCancel.onclick = () => { state.renamingId = null; renderChildMenu(); };
    const dConfirm = $('deleteConfirm_' + idx);
    if (dConfirm) dConfirm.onclick = () => submitDeleteChild(c.childId);
    const dCancel = $('deleteCancel_' + idx);
    if (dCancel) dCancel.onclick = () => { state.deletingId = null; renderChildMenu(); };
  });
  const addBtn = $('addChildBtn');
  const addInput = $('newChildName');
  if (addBtn && addInput) {
    addBtn.onclick = () => submitAddChild(addInput.value);
    addInput.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); submitAddChild(addInput.value); } };
  }
}

async function refreshChildren() {
  try {
    const r = await fetch('/api/youtube-kids/children');
    if (!r.ok) return;
    const j = await r.json();
    if (!Array.isArray(j.children)) return;
    state.children = j.children;
    state.maxChildren = Number(j.maxChildren) || 8;
    if (state.activeChildId && !state.children.some((c) => c.childId === state.activeChildId)) {
      state.activeChildId = state.children[0]?.childId || null;
    } else if (!state.activeChildId && state.children.length > 0) {
      const withData = state.children.find((c) => c.hasData) || state.children[0];
      state.activeChildId = withData.childId;
    }
    renderChildMenu();
  } catch { /* keep initial state when offline or unprovisioned */ }
}

async function selectChild(childId) {
  state.activeChildId = childId;
  state.menuOpen = false;
  state.renamingId = null;
  state.deletingId = null;
  state.menuError = '';
  renderChildMenu();
  const cur = activeChild();
  state.hasBrief = Boolean(cur && cur.hasBrief);
  if (cur && cur.hasData) await loadBrief(false);
  else renderUpload();
}

async function submitAddChild(rawName) {
  state.menuError = '';
  try {
    const r = await fetch('/api/youtube-kids/children', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: rawName }),
    });
    const j = await r.json();
    if (!r.ok) { state.menuError = refusalText(j, 'Could not add profile.'); renderChildMenu(); return; }
    state.children = Array.isArray(j.children) ? j.children : state.children;
    state.activeChildId = j.child?.childId || state.activeChildId;
    state.menuOpen = false;
    state.hasBrief = false;
    renderChildMenu();
    renderUpload();
  } catch (e) { state.menuError = e.message; renderChildMenu(); }
}

async function submitRenameChild(childId, rawName) {
  state.menuError = '';
  try {
    const r = await fetch('/api/youtube-kids/children/rename', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ childId, name: rawName }),
    });
    const j = await r.json();
    if (!r.ok) { state.menuError = refusalText(j, 'Could not rename profile.'); renderChildMenu(); return; }
    state.children = Array.isArray(j.children) ? j.children : state.children;
    if (j.child?.childId && state.activeChildId === childId) state.activeChildId = j.child.childId;
    state.renamingId = null;
    renderChildMenu();
  } catch (e) { state.menuError = e.message; renderChildMenu(); }
}

async function submitDeleteChild(childId) {
  state.menuError = '';
  try {
    const r = await fetch('/api/youtube-kids/children/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ childId }),
    });
    const j = await r.json();
    if (!r.ok) { state.menuError = refusalText(j, 'Could not delete profile.'); renderChildMenu(); return; }
    state.children = Array.isArray(j.children) ? j.children : [];
    state.deletingId = null;
    const deletedActive = state.activeChildId === childId || (childId === 'default' && state.activeChildId === 'child-1');
    if (deletedActive) state.activeChildId = state.children[0]?.childId || null;
    state.menuOpen = false;
    renderChildMenu();
    const next = activeChild();
    state.hasBrief = Boolean(next && next.hasBrief);
    if (next && next.hasData) await loadBrief(false);
    else renderUpload();
  } catch (e) { state.menuError = e.message; renderChildMenu(); }
}

/** Tiny Markdown → HTML for the brief (## / ### headings, - bullets, **bold**, paragraphs). */
function renderMarkdown(md) {
  const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  const lines = String(md || '').split(/\r?\n/);
  let html = '', inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) { closeList(); continue; }
    if (line.startsWith('## ')) { closeList(); html += '<h2>' + inline(line.slice(3)) + '</h2>'; }
    else if (line.startsWith('### ')) { closeList(); html += '<h3>' + inline(line.slice(4)) + '</h3>'; }
    else if (/^[-*]\s+/.test(line)) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + inline(line.replace(/^[-*]\s+/,'')) + '</li>'; }
    else { closeList(); html += '<p>' + inline(line) + '</p>'; }
  }
  closeList();
  return html;
}

function fmtDate(iso) { try { return new Date(iso).toLocaleDateString(); } catch { return iso || '—'; } }

function refusalText(j, fallback) {
  return (j && (j.message || j.error || j.detail)) || fallback;
}

async function takeoutServiceInstalled() {
  if (!state.takeoutProbe) state.takeoutProbe = probeTakeoutService();
  return state.takeoutProbe;
}
async function probeTakeoutService() {
  try {
    const r = await fetch('/api/takeout/dropbox/list');
    if (r.status !== 404) return true;
    const j = await r.json().catch(() => ({}));
    return j.refused !== 'not_found';
  } catch { return false; }
}

function jsonOnlyUpload() {
  state.takeoutService = false;
  $('zipStep').innerHTML = 'Export, then unzip it and find <code>Takeout/YouTube and YouTube Music/history/watch-history.json</code>.';
  $('dropLabel').innerHTML = '<strong>Choose your watch-history.json</strong><br/>or drag &amp; drop it here';
  $('file').setAttribute('accept', '.json,application/json');
  $('dbxSection').innerHTML = '<div class="sub">Dropbox pickup and .zip unpacking are not available on this installation: '
    + 'the Takeout archive service is not installed. Upload watch-history.json above instead.</div>';
}

function archiveUpload() {
  state.takeoutService = true;
  $('zipStep').innerHTML = 'Export. You can drop the whole <strong>.zip</strong> here, or deliver it to your <strong>Dropbox</strong> and pick it up below — no need to dig out a single file.';
  $('dropHead').textContent = '2 · Drop the Takeout zip (or watch-history.json)';
  $('dropLabel').innerHTML = '<strong>Choose your Takeout .zip</strong><br/>or drag &amp; drop it here — I\'ll unzip and find the history';
  $('file').setAttribute('accept', '.json,.zip,application/json,application/zip');
  $('dbxOffer').hidden = false;
  $('dbxBtn').hidden = false;
  $('dbxList').innerHTML = '';
}

function renderUpload() {
  $('actions').style.display = 'none';
  const cur = activeChild();
  const who = cur ? ` for ${escHtml(cur.name)}` : '';
  main.innerHTML = `
    <div class="panel">
      <h2>1 · Export watch history${who}</h2>
      <ol class="steps">
        <li>Go to <code>takeout.google.com</code> and click <strong>Deselect all</strong>.</li>
        <li>Select only <strong>YouTube and YouTube Music</strong> → its options → keep <strong>history</strong> → set the format to <strong>JSON</strong>.</li>
        <li id="zipStep">Export, then unzip it and find <code>Takeout/YouTube and YouTube Music/history/watch-history.json</code>.</li>
      </ol>
      <h2 id="dropHead">2 · Choose watch-history.json</h2>
      <div class="drop" id="drop"><span id="dropLabel"><strong>Choose your watch-history.json</strong><br/>or drag &amp; drop it here</span></div>
      <input type="file" id="file" accept=".json,application/json" />
      <div id="upmsg" style="margin-top:12px;font-size:13px;"></div>
      <div id="dbxSection"><div id="dbxOffer" hidden>
        <h2 style="margin-top:22px">Or · Pick up from Dropbox</h2>
        <div class="sub" style="margin-bottom:10px">If you told Takeout to deliver to Dropbox (or dropped the zip in your OSHAL Dropbox folder), grab it here.</div>
        <button class="btn ghost" id="dbxBtn" hidden>Find my Takeout in Dropbox</button>
        <div id="dbxList" style="margin-top:12px;"></div>
      </div></div>
      <div class="upload-actions" id="uploadActions" ${state.hasBrief ? '' : 'hidden'}><button class="btn ghost" id="cancelUpload">Cancel</button></div>
    </div>`;
  const drop = $('drop'), file = $('file');
  drop.onclick = () => file.click();
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
  file.onchange = () => { if (file.files[0]) upload(file.files[0]); };
  $('dbxBtn').onclick = listDropbox;
  $('cancelUpload').onclick = () => loadBrief(false);
  takeoutServiceInstalled().then((installed) => { if (!$('dropHead')) return; if (installed) archiveUpload(); else jsonOnlyUpload(); });
}

async function upload(f) {
  const msg = $('upmsg');
  msg.className = ''; msg.style.color = 'var(--muted)';
  const isZip = /\.zip$/i.test(f.name);
  try {
    if (isZip && state.takeoutService === false) {
      msg.className = 'err';
      msg.textContent = 'This installation cannot unpack a .zip: the Takeout archive service is not installed. Unzip it and choose watch-history.json.';
      return;
    }
    if (isZip) {
      msg.innerHTML = '<span class="dot"></span> Uploading & unzipping ' + (f.size/1048576).toFixed(1) + ' MB…';
      const r = await fetch('/api/takeout/ingest-zip', { method:'POST', headers:{ 'Content-Type':'application/octet-stream' }, body:f });
      return afterIngest(await r.json(), r.ok, msg);
    }
    const text = await f.text();
    msg.innerHTML = '<span class="dot"></span> Uploading & parsing ' + (text.length/1048576).toFixed(1) + ' MB…';
    const r = await fetch(withChildQuery('/api/youtube-kids/upload-takeout'), { method:'POST', headers:{ 'Content-Type':'text/plain' }, body:text });
    const j = await r.json();
    if (!r.ok) { msg.className = 'err'; msg.textContent = refusalText(j, 'Upload failed.'); return; }
    if (j.childId) state.activeChildId = j.childId;
    refreshChildren();
    msg.className = 'ok';
    msg.textContent = `Parsed ${j.totalWatched.toLocaleString()} watches across ${j.distinctChannels} channels. Analyzing…`;
    await loadBrief(true);
  } catch (e) {
    msg.className = 'err'; msg.textContent = 'Could not read that file: ' + e.message;
  }
}

async function afterIngest(j, ok, msg) {
  if (!ok) { msg.className = 'err'; msg.textContent = refusalText(j, 'Could not read that archive.'); return; }
  const yt = (j.ingested || []).find((s) => s.kind === 'youtube-watch-history' && s.ok);
  if (yt) { refreshChildren(); msg.className = 'ok'; msg.textContent = `Found your watch history (${yt.summary}). Analyzing…`; await loadBrief(true); return; }
  const html = (j.htmlHits || []).length;
  msg.className = 'err';
  msg.textContent = html ? 'Your history was exported as HTML — re-run Takeout and choose JSON format.' : 'No YouTube watch history found in that archive.';
}

async function listDropbox() {
  const box = $('dbxList');
  box.innerHTML = '<span class="dot"></span> Looking in your Dropbox…';
  try {
    const r = await fetch('/api/takeout/dropbox/list');
    const j = await r.json();
    if (!r.ok) { box.innerHTML = '<span class="err"></span>'; box.firstChild.textContent = refusalText(j, 'Dropbox could not be read (HTTP ' + r.status + ').'); return; }
    if (!j.candidates || !j.candidates.length) { box.innerHTML = '<span class="sub">No .zip files found in your OSHAL Dropbox folder yet. Deliver your Takeout there (or drop the zip in), then try again.</span>'; return; }
    box.innerHTML = j.candidates.map((c, i) =>
      `<div class="stat" style="display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:8px">
         <div><div class="l">${c.looksLikeTakeout ? '📦 Takeout' : 'zip'}</div><strong>${c.name}</strong> <span class="sub">${c.size ? (c.size/1048576).toFixed(0)+' MB' : ''}</span></div>
         <button class="btn primary" data-path="${encodeURIComponent(c.path)}" id="pk${i}">Use this</button>
       </div>`).join('');
    j.candidates.forEach((c, i) => { $('pk'+i).onclick = () => pickup(c.path); });
  } catch (e) { box.innerHTML = '<span class="err">' + e.message + '</span>'; }
}

async function pickup(dropboxPath) {
  const msg = $('upmsg');
  msg.className = ''; msg.style.color = 'var(--muted)';
  msg.innerHTML = '<span class="dot"></span> Downloading & unzipping from Dropbox… (large archives take a bit)';
  try {
    const r = await fetch('/api/takeout/dropbox/pickup', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ path: dropboxPath }) });
    await afterIngest(await r.json(), r.ok, msg);
  } catch (e) { msg.className = 'err'; msg.textContent = e.message; }
}

const ANALYZING = '<div class="spin"><span class="dot"></span> Kid Lens is reading the watch history… (this calls the analyzer bot, ~30s)</div>';

async function fetchBrief(forceRefresh) {
  if (!forceRefresh) {
    const r = await fetch(withChildQuery('/api/youtube-kids/brief'));
    const j = await r.json();
    if (!r.ok || j.brief || !j.hasData) return { r, j };
  }
  main.innerHTML = ANALYZING;
  const init = state.activeChildId
    ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ childId: state.activeChildId }) }
    : { method: 'POST' };
  const r = await fetch(withChildQuery('/api/youtube-kids/brief'), init);
  return { r, j: await r.json() };
}

function emphasiseReanalyze(st) {
  const waiting = Boolean(st && st.hasData && (!st.hasBrief || (st.uploadedAt && st.briefAt && new Date(st.uploadedAt) > new Date(st.briefAt))));
  $('reanalyze').className = 'btn ' + (waiting ? 'primary' : 'ghost');
}

async function loadBrief(forceRefresh) {
  $('actions').style.display = 'flex';
  main.innerHTML = forceRefresh ? ANALYZING : '<div class="spin"><span class="dot"></span> Loading the brief…</div>';
  try {
    const st = await (await fetch(withChildQuery('/api/youtube-kids/status'))).json();
    if (st.childId && !state.activeChildId) { state.activeChildId = st.childId; updateChildButton(); }
    const { r, j } = await fetchBrief(forceRefresh);
    if (!r.ok) { main.innerHTML = '<div class="notice err"></div>'; main.firstChild.textContent = refusalText(j, 'The brief could not be built (HTTP ' + r.status + ').'); return; }
    if (!j.brief) { state.hasBrief = false; renderUpload(); return; }
    state.hasBrief = true;
    if (forceRefresh) refreshChildren();
    emphasiseReanalyze({ ...st, hasBrief: true, briefAt: j.briefAt || st.briefAt });
    const range = st.dateRange || {};
    main.innerHTML = `
      <div class="stats">
        <div class="stat"><div class="n">${(st.totalWatched||0).toLocaleString()}</div><div class="l">videos watched</div></div>
        <div class="stat"><div class="n">${fmtDate(range.from)}</div><div class="l">earliest</div></div>
        <div class="stat"><div class="n">${fmtDate(range.to)}</div><div class="l">latest</div></div>
      </div>
      <div class="brief">${renderMarkdown(j.brief)}</div>`;
  } catch (e) {
    main.innerHTML = '<div class="notice err">' + e.message + '</div>';
  }
}

$('childPickerBtn').onclick = () => {
  state.menuOpen = !state.menuOpen;
  state.menuError = '';
  renderChildMenu();
};
document.addEventListener('click', (e) => {
  const picker = $('childPicker');
  if (state.menuOpen && picker && typeof picker.contains === 'function' && !picker.contains(e.target)) {
    state.menuOpen = false;
    renderChildMenu();
  }
});
$('reupload').onclick = renderUpload;
$('reanalyze').onclick = () => loadBrief(true);

(async function init() {
  refreshChildren();
  try {
    const st = await (await fetch('/api/youtube-kids/status')).json();
    if (st.childId && !state.activeChildId) { state.activeChildId = st.childId; updateChildButton(); }
    if (st.hasData) { await loadBrief(false); } else { renderUpload(); }
  } catch (e) {
    main.innerHTML = '<div class="notice err">Could not load: ' + e.message + '</div>';
  }
})();
</script>
</body>
</html>
