<!DOCTYPE html>
<!--
  Kid Lens surface — the YouTube-Takeout "what is my kid into" app.
  Self-contained iframe page (served by createYoutubeKidsRoutes at /api/youtube-kids/).
  Two states: upload (no data yet) and brief (renders the bot's Markdown analysis).
  All work is auth-gated server-side; this page just calls the JSON API.

  CHANGE LOG
  SEQ | AUTHOR                                  | DESCRIPTION
  1   | maintainer@emeraldcoastsystemsgroup.com | The brief is read with GET /brief (stored brief only) and produced with POST /brief, on Re-analyze or when GET answers {brief:null, hasData:true}; with no watch history the upload screen shows. A GET is admitted read-only on the native kernel, so the old GET that ran the analyzer and stored its brief was always refused.
  2   | maintainer@emeraldcoastsystemsgroup.com | UX audit 2026-11-06 (youtube-kids, and the Kid Lens Review merge): this brief is the app's one screen. Buttons wear the person's theme (the primary was a fixed pink, #ff6fa5); Re-analyze is the primary only when a new export is waiting to be analyzed, otherwise it is secondary like Upload new export. The upload view has a Cancel back to the saved brief, and it opens on the way that always works here (choose watch-history.json, heading included); the .zip and Dropbox ways appear only when the Takeout archive service answers, and that readiness read runs once per page instead of on every upload view. Brief headings use the theme's text colour (the light accent was under 4.5:1 on light themes) and the three stat tiles sit in one row.
  3   | maintainer@emeraldcoastsystemsgroup.com | Planned control (DS-45): a greyed 'Child ▾' at the left of the header, 'Child profiles, not available yet', backlog RP-KL-01 (one brief per child). No click handler; a press changes nothing.
-->
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kid Lens</title>
<!-- Framework theme tokens + the bootstrap that picks the operator's theme (and follows it live).
     Theme files scope to [data-theme="…"] with NO :root fallback, so the default on <html> above
     matters — without it the surface would have no colours at all. -->
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css" />
<script src="/shared/ui/js/surface-theme.js"></script>
<style>
  /* This surface keeps its own short alias names but DERIVES them from the framework theme rather
     than hardcoding hex, so all eleven themes work — not just the dark one whose colours the old
     literal palette (#1a1320 …) happened to match. --accent2 (a highlight used as text) follows the
     theme so it stays legible on light themes; the primary button uses the theme accent and its ink. */
  :root {
    --bg: var(--bg-primary);
    --panel: var(--bg-card);
    --panel2: var(--bg-tertiary);
    --line: var(--border-color);
    --text: var(--text-primary);
    --muted: var(--text-muted);
    --accent: var(--accent-primary, #3b82f6);
    --accent2: var(--accent-primary-hover, #ffd36e);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
  .page { max-width:820px; margin:0 auto; padding:30px 24px 70px; }
  .head { display:flex; align-items:center; gap:12px; margin-bottom:4px; }
  /* A planned control (DS-45): greyed, opaque, never the accent; it has no click handler. */
  .not-yet { flex:0 0 auto; min-height:36px; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--ds-surface-2, var(--panel2)); color:var(--ds-ink-disabled, var(--muted)); font-size:13px; font-weight:600; opacity:1; cursor:not-allowed; }
  h1 { font-size:23px; margin:0; }
  .badge { font-size:20px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:22px; line-height:1.5; }
  .actions { margin-left:auto; display:flex; gap:8px; }
  .btn { border:none; border-radius:8px; padding:9px 15px; cursor:pointer; font-size:13px; font-weight:600; }
  .btn.primary { background:var(--accent-primary); color:var(--text-on-accent, #fff); }
  .btn.ghost { background:var(--panel2); border:1px solid var(--line); color:var(--text); }
  .btn:disabled { opacity:.5; cursor:default; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; }
  .panel h2 { font-size:16px; margin:0 0 8px; }
  .steps { color:var(--muted); font-size:13px; line-height:1.7; padding-left:20px; margin:6px 0 18px; }
  .steps code { background:var(--panel2); border:1px solid var(--line); border-radius:5px; padding:1px 6px; color:var(--text); font-size:12px; }
  .drop { border:2px dashed var(--line); border-radius:12px; padding:26px; text-align:center; color:var(--muted); transition:border-color .15s,background .15s; cursor:pointer; }
  .drop.over { border-color:var(--accent); background:var(--panel2); }
  .drop strong { color:var(--text); }
  input[type=file] { display:none; }
  .stats { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; margin-bottom:18px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:11px 15px; min-width:0; }
  .stat .n { font-size:20px; font-weight:700; color:var(--accent); }
  .stat .l { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .brief { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:8px 26px 22px; }
  .brief h2 { color:var(--text); font-size:15px; border-bottom:2px solid var(--accent); padding-bottom:6px; margin:22px 0 10px; }
  .brief h3 { font-size:14px; margin:16px 0 6px; }
  .brief ul { margin:6px 0 6px; padding-left:20px; }
  .brief li { font-size:14px; line-height:1.6; margin:3px 0; }
  .brief p { font-size:14px; line-height:1.65; color:var(--text-secondary, #e8dbe6); }
  .brief strong { color:var(--text); }
  .notice { color:var(--muted); padding:30px 0; text-align:center; font-size:14px; }
  .upload-actions { display:flex; justify-content:flex-end; margin-top:18px; }
  .upload-actions[hidden] { display:none; }
  .ok { color:var(--text); }
  .err { color:var(--status-error, #ff8b8b); }
  .spin { color:var(--muted); font-size:14px; padding:28px 0; text-align:center; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); animation:p 1s infinite; }
  @keyframes p { 0%,100%{opacity:.3} 50%{opacity:1} }
  @media (max-width: 640px) {
    .page { padding: 16px 14px 50px; }
    .head { flex-wrap: wrap; gap: 8px; }
    .actions { margin-left: 0; width: 100%; flex-wrap: wrap; }
    .actions .btn { flex: 1 1 auto; font-size: 14px; padding: 11px 12px; min-height: 44px; }
    .panel { padding: 16px; }
    .drop { padding: 20px 14px; }
    .stat { padding: 10px 8px; }
    .stat .n { font-size: clamp(13px, 3.5vw, 17px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .upload-actions .btn { min-height: 44px; }
    input[type=text], input[type=email], input[type=search], select, textarea { font-size: 16px; }
  }
</style>
  <link rel="stylesheet" href="/shared/ui/css/surface-glass.css" />
</head>
<body>
<div class="page">
  <div class="head">
    <button type="button" class="not-yet" id="childNotYet" aria-disabled="true" data-ds-not-yet data-ds-backlog="RP-KL-01" aria-label="Child profiles, not available yet" title="Not available yet">Child ▾</button>
    <span class="badge">👀</span>
    <h1>Kid Lens</h1>
    <div class="actions" id="actions" style="display:none">
      <button class="btn ghost" id="reupload">Upload new export</button>
      <button class="btn ghost" id="reanalyze">Re-analyze</button>
    </div>
  </div>
  <div class="sub">What your kid is into on YouTube — interests, what the channels actually are, gift ideas, and things to talk to them about. Built from your own Google Takeout watch history. Nothing is posted or shared.</div>
  <div id="main"><div class="spin"><span class="dot"></span> Loading…</div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const main = $('main');
/** Whether the Takeout archive service is installed here (null until asked, read once per page), and
 *  whether a saved brief exists to go back to from the upload view. */
const state = { takeoutService: null, takeoutProbe: null, hasBrief: false };

/** Tiny Markdown → HTML for the brief (## / ### headings, - bullets, **bold**, paragraphs). */
function renderMarkdown(md) {
  const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  const lines = String(md || '').split(/\r?\n/);
  let html = '', inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) { closeList(); continue; }
    if (line.startsWith('## ')) { closeList(); html += '<h2>' + inline(line.slice(3)) + '</h2>'; }
    else if (line.startsWith('### ')) { closeList(); html += '<h3>' + inline(line.slice(4)) + '</h3>'; }
    else if (/^[-*]\s+/.test(line)) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + inline(line.replace(/^[-*]\s+/,'')) + '</li>'; }
    else { closeList(); html += '<p>' + inline(line) + '</p>'; }
  }
  closeList();
  return html;
}

function fmtDate(iso) { try { return new Date(iso).toLocaleDateString(); } catch { return iso || '—'; } }

/** A server refusal in words: the route's message, its error, or the kernel's detail — never "undefined". */
function refusalText(j, fallback) {
  return (j && (j.message || j.error || j.detail)) || fallback;
}

/**
 * Whether the Takeout archive service (/api/takeout: .zip ingest and Dropbox pickup) is installed here.
 * The kernel answers 404 {refused:'not_found'} for an application that is not installed; any other
 * answer (a listing, "connect Dropbox", a sign-in refusal) means the service exists.
 */
async function takeoutServiceInstalled() {
  if (!state.takeoutProbe) state.takeoutProbe = probeTakeoutService();
  return state.takeoutProbe;
}
async function probeTakeoutService() {
  try {
    const r = await fetch('/api/takeout/dropbox/list');
    if (r.status !== 404) return true;
    const j = await r.json().catch(() => ({}));
    return j.refused !== 'not_found';
  } catch { return false; }
}

/** Without the archive service the page offers only what works: the watch-history.json file itself. */
function jsonOnlyUpload() {
  state.takeoutService = false;
  $('zipStep').innerHTML = 'Export, then unzip it and find <code>Takeout/YouTube and YouTube Music/history/watch-history.json</code>.';
  $('dropLabel').innerHTML = '<strong>Choose your watch-history.json</strong><br/>or drag &amp; drop it here';
  $('file').setAttribute('accept', '.json,application/json');
  $('dbxSection').innerHTML = '<div class="sub">Dropbox pickup and .zip unpacking are not available on this installation: '
    + 'the Takeout archive service is not installed. Upload watch-history.json above instead.</div>';
}

/** With the archive service installed the page also offers the whole .zip and the Dropbox pickup. */
function archiveUpload() {
  state.takeoutService = true;
  $('zipStep').innerHTML = 'Export. You can drop the whole <strong>.zip</strong> here, or deliver it to your <strong>Dropbox</strong> and pick it up below — no need to dig out a single file.';
  $('dropHead').textContent = '2 · Drop the Takeout zip (or watch-history.json)';
  $('dropLabel').innerHTML = '<strong>Choose your Takeout .zip</strong><br/>or drag &amp; drop it here — I\'ll unzip and find the history';
  $('file').setAttribute('accept', '.json,.zip,application/json,application/zip');
  $('dbxOffer').hidden = false;
  $('dbxBtn').hidden = false;
  $('dbxList').innerHTML = '';
}

/** Upload screen: it opens on the way that always works here (watch-history.json); the .zip and Dropbox
 *  ways are added only when the archive service answers. Cancel returns to a saved brief when there is one. */
function renderUpload() {
  $('actions').style.display = 'none';
  main.innerHTML = `
    <div class="panel">
      <h2>1 · Export your watch history</h2>
      <ol class="steps">
        <li>Go to <code>takeout.google.com</code> and click <strong>Deselect all</strong>.</li>
        <li>Select only <strong>YouTube and YouTube Music</strong> → its options → keep <strong>history</strong> → set the format to <strong>JSON</strong>.</li>
        <li id="zipStep">Export, then unzip it and find <code>Takeout/YouTube and YouTube Music/history/watch-history.json</code>.</li>
      </ol>
      <h2 id="dropHead">2 · Choose watch-history.json</h2>
      <div class="drop" id="drop"><span id="dropLabel"><strong>Choose your watch-history.json</strong><br/>or drag &amp; drop it here</span></div>
      <input type="file" id="file" accept=".json,application/json" />
      <div id="upmsg" style="margin-top:12px;font-size:13px;"></div>
      <div id="dbxSection"><div id="dbxOffer" hidden>
        <h2 style="margin-top:22px">Or · Pick up from Dropbox</h2>
        <div class="sub" style="margin-bottom:10px">If you told Takeout to deliver to Dropbox (or dropped the zip in your OSHAL Dropbox folder), grab it here.</div>
        <button class="btn ghost" id="dbxBtn" hidden>Find my Takeout in Dropbox</button>
        <div id="dbxList" style="margin-top:12px;"></div>
      </div></div>
      <div class="upload-actions" id="uploadActions" ${state.hasBrief ? '' : 'hidden'}><button class="btn ghost" id="cancelUpload">Cancel</button></div>
    </div>`;
  const drop = $('drop'), file = $('file');
  drop.onclick = () => file.click();
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
  file.onchange = () => { if (file.files[0]) upload(file.files[0]); };
  $('dbxBtn').onclick = listDropbox;
  $('cancelUpload').onclick = () => loadBrief(false);
  // The answer may arrive after Cancel has left this view: then there is nothing to update.
  takeoutServiceInstalled().then((installed) => { if (!$('dropHead')) return; if (installed) archiveUpload(); else jsonOnlyUpload(); });
}

/** Upload a dropped file — a Takeout .zip (unzip server-side) or a raw watch-history.json. */
async function upload(f) {
  const msg = $('upmsg');
  msg.className = ''; msg.style.color = 'var(--muted)';
  const isZip = /\.zip$/i.test(f.name);
  try {
    if (isZip && state.takeoutService === false) {
      msg.className = 'err';
      msg.textContent = 'This installation cannot unpack a .zip: the Takeout archive service is not installed. Unzip it and choose watch-history.json.';
      return;
    }
    if (isZip) {
      msg.innerHTML = '<span class="dot"></span> Uploading & unzipping ' + (f.size/1048576).toFixed(1) + ' MB…';
      const r = await fetch('/api/takeout/ingest-zip', { method:'POST', headers:{ 'Content-Type':'application/octet-stream' }, body:f });
      return afterIngest(await r.json(), r.ok, msg);
    }
    const text = await f.text();
    msg.innerHTML = '<span class="dot"></span> Uploading & parsing ' + (text.length/1048576).toFixed(1) + ' MB…';
    const r = await fetch('/api/youtube-kids/upload-takeout', { method:'POST', headers:{ 'Content-Type':'text/plain' }, body:text });
    const j = await r.json();
    if (!r.ok) { msg.className = 'err'; msg.textContent = refusalText(j, 'Upload failed.'); return; }
    msg.className = 'ok';
    msg.textContent = `Parsed ${j.totalWatched.toLocaleString()} watches across ${j.distinctChannels} channels. Analyzing…`;
    await loadBrief(true);
  } catch (e) {
    msg.className = 'err'; msg.textContent = 'Could not read that file: ' + e.message;
  }
}

/** Handle a /api/takeout response (zip ingest or Dropbox pickup): confirm the YouTube slice landed. */
async function afterIngest(j, ok, msg) {
  if (!ok) { msg.className = 'err'; msg.textContent = refusalText(j, 'Could not read that archive.'); return; }
  const yt = (j.ingested || []).find((s) => s.kind === 'youtube-watch-history' && s.ok);
  if (yt) { msg.className = 'ok'; msg.textContent = `Found your watch history (${yt.summary}). Analyzing…`; await loadBrief(true); return; }
  const html = (j.htmlHits || []).length;
  msg.className = 'err';
  msg.textContent = html ? 'Your history was exported as HTML — re-run Takeout and choose JSON format.' : 'No YouTube watch history found in that archive.';
}

/** List Takeout .zip candidates in the user's connected Dropbox. */
async function listDropbox() {
  const box = $('dbxList');
  box.innerHTML = '<span class="dot"></span> Looking in your Dropbox…';
  try {
    const r = await fetch('/api/takeout/dropbox/list');
    const j = await r.json();
    if (!r.ok) { box.innerHTML = '<span class="err"></span>'; box.firstChild.textContent = refusalText(j, 'Dropbox could not be read (HTTP ' + r.status + ').'); return; }
    if (!j.candidates || !j.candidates.length) { box.innerHTML = '<span class="sub">No .zip files found in your OSHAL Dropbox folder yet. Deliver your Takeout there (or drop the zip in), then try again.</span>'; return; }
    box.innerHTML = j.candidates.map((c, i) =>
      `<div class="stat" style="display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:8px">
         <div><div class="l">${c.looksLikeTakeout ? '📦 Takeout' : 'zip'}</div><strong>${c.name}</strong> <span class="sub">${c.size ? (c.size/1048576).toFixed(0)+' MB' : ''}</span></div>
         <button class="btn primary" data-path="${encodeURIComponent(c.path)}" id="pk${i}">Use this</button>
       </div>`).join('');
    j.candidates.forEach((c, i) => { $('pk'+i).onclick = () => pickup(c.path); });
  } catch (e) { box.innerHTML = '<span class="err">' + e.message + '</span>'; }
}

/** Pick up a chosen Takeout archive from Dropbox and ingest it. */
async function pickup(dropboxPath) {
  const msg = $('upmsg');
  msg.className = ''; msg.style.color = 'var(--muted)';
  msg.innerHTML = '<span class="dot"></span> Downloading & unzipping from Dropbox… (large archives take a bit)';
  try {
    const r = await fetch('/api/takeout/dropbox/pickup', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ path: dropboxPath }) });
    await afterIngest(await r.json(), r.ok, msg);
  } catch (e) { msg.className = 'err'; msg.textContent = e.message; }
}

const ANALYZING = '<div class="spin"><span class="dot"></span> Kid Lens is reading the watch history… (this calls the analyzer bot, ~30s)</div>';

/** The brief: the stored one (GET reads only), or a new analysis (POST runs the bot and stores it)
 *  when re-analyze is asked for or GET answers that this history has not been analyzed yet. */
async function fetchBrief(forceRefresh) {
  if (!forceRefresh) {
    const r = await fetch('/api/youtube-kids/brief');
    const j = await r.json();
    if (!r.ok || j.brief || !j.hasData) return { r, j };
  }
  main.innerHTML = ANALYZING;
  const r = await fetch('/api/youtube-kids/brief', { method:'POST' });
  return { r, j: await r.json() };
}

/** Re-analyze leads only when the saved export is newer than the brief (or has none); otherwise it is secondary. */
function emphasiseReanalyze(st) {
  const waiting = Boolean(st && st.hasData && (!st.hasBrief || (st.uploadedAt && st.briefAt && new Date(st.uploadedAt) > new Date(st.briefAt))));
  $('reanalyze').className = 'btn ' + (waiting ? 'primary' : 'ghost');
}

/** Brief screen — stats + the rendered analysis. */
async function loadBrief(forceRefresh) {
  $('actions').style.display = 'flex';
  main.innerHTML = forceRefresh ? ANALYZING : '<div class="spin"><span class="dot"></span> Loading the brief…</div>';
  try {
    const st = await (await fetch('/api/youtube-kids/status')).json();
    const { r, j } = await fetchBrief(forceRefresh);
    if (!r.ok) { main.innerHTML = '<div class="notice err"></div>'; main.firstChild.textContent = refusalText(j, 'The brief could not be built (HTTP ' + r.status + ').'); return; }
    if (!j.brief) { renderUpload(); return; }
    state.hasBrief = true;
    emphasiseReanalyze({ ...st, hasBrief: true, briefAt: j.briefAt || st.briefAt });
    const range = st.dateRange || {};
    main.innerHTML = `
      <div class="stats">
        <div class="stat"><div class="n">${(st.totalWatched||0).toLocaleString()}</div><div class="l">videos watched</div></div>
        <div class="stat"><div class="n">${fmtDate(range.from)}</div><div class="l">earliest</div></div>
        <div class="stat"><div class="n">${fmtDate(range.to)}</div><div class="l">latest</div></div>
      </div>
      <div class="brief">${renderMarkdown(j.brief)}</div>`;
  } catch (e) {
    main.innerHTML = '<div class="notice err">' + e.message + '</div>';
  }
}

$('reupload').onclick = renderUpload;
$('reanalyze').onclick = () => loadBrief(true);

/** Boot: show the brief if data exists, else the upload screen. */
(async function init() {
  try {
    const st = await (await fetch('/api/youtube-kids/status')).json();
    if (st.hasData) { await loadBrief(false); } else { renderUpload(); }
  } catch (e) {
    main.innerHTML = '<div class="notice err">Could not load: ' + e.message + '</div>';
  }
})();
</script>
</body>
</html>
