# 1 | maintainer@emeraldcoastsystemsgroup.com | Initial creation
# 2 | maintainer@emeraldcoastsystemsgroup.com | 0.1.1: declare the director's tool authorizations. Without them the install seeded no
#   |                                         | agent_tools rows, so every tool call was refused as unregistered and the director
#   |                                         | could only talk. Every tool here is auto: each write is a revision restore undoes,
#   |                                         | and deleting a project is not a tool. The generic shell and workspace-file tools are off.
# 3 | maintainer@emeraldcoastsystemsgroup.com | 0.2.0: the director runs on its own bot node (scene-studio-bot) instead of inline;
#   |                                         | the header says so. Persona content and authorizations are unchanged. On the node its
#   |                                         | turns are protected direct turns, which use the generic protected prompt, so its
#   |                                         | working rules also ride in the tools' usage text (oshal-app.yaml).
#   |                                         | Transform3D is now described row by row (the old "basis columns" text
#   |                                         | inverted rotations; the engine's own templates read row-major), and the
#   |                                         | material recipe no longer leans on the deprecated use_nodes.
# 4 | maintainer@emeraldcoastsystemsgroup.com | 0.2.1: header only — the director is served by core's shared concierge
