# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — life ("Life")
# Pure launcher (operator decision 2026-07-31, same shape as games/oshal-app.yaml):
# owns no runtime, no data, no bots of its own. life.oshal.ai is the front door
# for the day-to-day lifestyle/spend apps that don't make sense standing alone as
# their own subdomain — movies, music, food, rides, shopping, travel, payments, and
# the weekly bake-off. Each tile below routes straight to the installed sibling
# app's own surface. Framework: OSHAL (see docs/adr/085-remote-app-packages-and-registries.md)
# ─────────────────────────────────────────────────────────────────────────────

name: life
suite: ai-home   # ADR-097: primary catalog shelf (tools keep their own category:)
displayName: Life
description: >-
  One desk for everything lifestyle: movies & TV, music, food delivery, rides, shopping,
  travel, payments, and the weekly AI Bake-Off — each already its own app, gathered here
  so you don't have to hunt the full catalog for them.
version: 1.0.0
status: active
scope: public
theme: sakura

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: life
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
routes:
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/life/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

smoke:
  - name: package-readiness
    method: GET
    path: /api/life/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# Installing this launcher also resolves every playable/usable sibling (games-launcher
# precedent) — npm-style dependency resolution, fail-closed.
dependencies:
  apps:
    - movies
    - spotify
    - eats
    - rides
    - purchasing
    - travel
    - payments
    - bake-off
  tools: []
  connectors: []

# The launcher owns no runtime or data. Its surfaces route to the installed apps.
ui:
  static:
    - toolName: life-movies
      label: Movies & TV
      icon: codicon codicon-device-camera-video
      iframeUrl: /api/movies/app
      section: top
    - toolName: life-spotify
      label: Music
      icon: codicon codicon-unmute
      iframeUrl: /api/spotify/app
      section: top
    - toolName: life-eats
      label: Order Food
      icon: codicon codicon-flame
      iframeUrl: /api/eats/app
      section: top
    - toolName: life-rides
      label: Get a Ride
      icon: codicon codicon-milestone
      iframeUrl: /api/rides/app
      section: top
    - toolName: life-shopping
      label: Shopping
      icon: codicon codicon-gift
      iframeUrl: /api/purchasing/chat
      section: top
    - toolName: life-travel
      label: Travel
      icon: codicon codicon-globe
      iframeUrl: /api/travel/app
      section: top
    - toolName: life-payments
      label: Payments
      icon: codicon codicon-credit-card
      iframeUrl: /api/payments/
      section: top
    - toolName: life-bakeoff
      label: AI Bake-Off
      icon: codicon codicon-symbol-color
      iframeUrl: /api/bake-off/
      section: top

ribbon:
  hideFrameworkItems:
    - tickets
    - chat
    - calendar
    - addressbook
    - dashboard
    - echo
    - logs
    - operations
  hideChatPanel: true
  defaultView: life-movies
