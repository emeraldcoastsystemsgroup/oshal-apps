# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — life ("Life")
# Pure launcher (operator decision 2026-07-31, same shape as games/oshal-app.yaml):
# owns no runtime, no data, no bots of its own. life.oshal.ai is the front door
# for the day-to-day lifestyle/spend apps that don't make sense standing alone as
# their own subdomain — movies, music, food, rides, shopping, travel, payments, and
# the weekly bake-off. Each tile below routes straight to the installed sibling
# app's own surface. Framework: OSHAL (see docs/adr/085-remote-app-packages-and-registries.md)
# ─────────────────────────────────────────────────────────────────────────────
# CHANGE LOG
# SEQ | AUTHOR | DESCRIPTION
# 1 | maintainer@emeraldcoastsystemsgroup.com | Sweep 10: declare a Home summary (routes/home-summary.js) naming which parts work without a connection and what the rest need; the concierge on the Movies tab said no part of Life was usable. Version unchanged.

name: life
suite: ai-home   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features: []   # no model in the loop (T0)
displayName: Life
description: >-
  One desk for everything lifestyle: movies & TV, music, food delivery, rides, shopping,
  travel, payments, and the weekly AI Bake-Off — each already its own app, gathered here
  so you don't have to hunt the full catalog for them.
version: 1.0.1
status: active
scope: public
theme: sakura
# Every lifestyle application is optional, so the framework concierge remains the stable rail.
chatBot: general-bot

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: life
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
routes:
  # Life's Home summary (sweep 10): which parts work without a connection and what the rest need, so the concierge
  # answers for every tab, not only the one on screen. Static notes: no data, no provider, no model.
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/life/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: false
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/life/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

smoke:
  - name: package-readiness
    method: GET
    path: /api/life/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

testing:
  version: 1
  catalog: tests/test-lab.yaml

summary:
  path: /api/life/home-summary
  itemsPointer: /items

# No sibling is required: the launcher owns no runtime or data, so every one of them is OFFERED
# at install as an unchecked choice and never installed unasked.
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps:
      - movies
      - spotify
      - eats
      - rides
      - purchasing
      - travel
      - payments
      - bake-off
    tools: []
    connectors: []

# Kernel skills this app declares (ADR-090 uses: contract, fail-closed at load).
# `app-dependencies` is the compatibility floor for the tiered dependencies block above: a core
# that predates required/optional refuses this package instead of installing it without its
# required dependencies and without its connector allow-list.
uses:
  - app-dependencies

# The launcher owns no runtime or data. Its surfaces route to the installed apps.
ui:
  static:
    - toolName: life-movies
      label: Movies & TV
      icon: codicon codicon-device-camera-video
      iframeUrl: /api/movies/app
      section: top
    - toolName: life-spotify
      label: Music
      icon: codicon codicon-unmute
      iframeUrl: /api/spotify/app
      section: top
    - toolName: life-eats
      label: Order Food
      icon: codicon codicon-flame
      iframeUrl: /api/eats/app
      section: top
    - toolName: life-rides
      label: Get a Ride
      icon: codicon codicon-milestone
      iframeUrl: /api/rides/app
      section: top
    - toolName: life-shopping
      label: Shopping
      icon: codicon codicon-gift
      iframeUrl: /api/purchasing/chat
      section: top
    - toolName: life-travel
      label: Travel
      icon: codicon codicon-globe
      iframeUrl: /api/travel/app
      section: top
    - toolName: life-payments
      label: Payments
      icon: codicon codicon-credit-card
      iframeUrl: /api/payments/
      section: top
    - toolName: life-bakeoff
      label: AI Bake-Off
      icon: codicon codicon-symbol-color
      iframeUrl: /api/bake-off/
      section: top

ribbon:
  hideFrameworkItems:
    - tickets
    - chat
    - calendar
    - addressbook
    - dashboard
    - logs
    - operations
  hideChatPanel: true
  defaultView: life-movies
