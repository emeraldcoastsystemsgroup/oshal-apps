version: 1
cases:
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its family (Home shell) and company (Business shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the family view makes one read, GET /api/spaces/home-summary, and the real route behind it only SELECTs the caller's own scans; it never reads the scan or scene list (their GET self-heals orphaned scans with an UPDATE), a scan's dimensions, scene, artifact or geometry (each reads the whole model file), the viewer or a capture plan, and never uploads, imports, flies a drone scan or computes coverage.
      - Fed by the package's real route, the saved scans read as plain stats (real spaces ready, practice rooms, being built, did not finish), a title ladder and tiles naming how each scan was made and where it stands; no tile opens, builds or changes anything.
      - A count the route could not check reads Could not check while the latest scans still show, a scan query it could not run says the latest scans could not be checked, and odd rows read as what they are; signed out, refused, the route's own 503, an unreadable answer and an unreachable server each read as what they are.
      - Under the family view the page's main script and connected-actions script bind no listener, read nothing, start no refresh and mount no offer; the full page, and a core without the kit, still run every start step.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: capture-session
    name: Capture session reaches the upload
    purpose: >-
      Verify that the guided capture page remembers the id of the session its telemetry carries, and that the upload
      page names that session on the walk-through upload and on the import, so the scan can be anchored to where it
      was captured.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/spaces-capture-session.test.js
    expected:
      - The capture page remembers the session id its telemetry carries when the capture starts and again when it ends.
      - The walk-through upload and the import each carry the remembered session, and it is forgotten once an upload has carried it.
      - A failed upload keeps the session for the retry.
      - No session is sent when the remembered one is older than two hours, unreadable, or the browser refuses storage, and the upload still goes.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: capture-anchor
    name: A new scan is anchored from its capture GPS
    purpose: >-
      Verify that an upload naming its guided-capture session registers the scan with that session, reads the GPS the
      session recorded through the kernel's capture join, and hands the location kernel skill's anchorMap the scan, its
      origin, heading, footprint and capture time, as the caller; and that every other case registers the scan without
      an anchor and says why.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/capture-anchor.core.test.js
    expected:
      - Readings posted to the route's own telemetry sink are read back by the kernel's capture reader, and the most accurate fix becomes the anchor's origin.
      - The walk-through lane and the import lane each register the scan naming its session and ask for one anchor, as the caller, with the optional place.
      - An upload with no session, a value that is not a session id, a session with no GPS fix and another person's session each register the scan without an anchor and name the reason.
      - A refusal by the kernel registers the scan, names the refusal, and is logged without the error's message.
      - No answer and no log line carries a coordinate.
    prerequisites:
      - runner:node-test
      - fixture:core-checkout
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: Close the loopback HTTP servers and remove the temporary scans root the capture sidecars were written under.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 512
    installation: never
  - id: live-capture-link
    name: LIVE guided capture link follows availability
    purpose: >-
      Run the shipped applyAvailability and setLiveCapture from tools/spaces.html against a stub DOM: where the scan list answers
      configured:false (no reconstruction engine; the capture plan answers 503) the LIVE guided capture link is switched off with its reason.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/spaces-live-capture.test.js
    expected:
      - With no scan engine the link has no href, is aria-disabled and says why; with an engine it stays live.
      - A refused capture plan also switches the link off.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: spaces-phone-layout
    name: Spaces forms on a phone
    purpose: Open the real Spaces page with the native unavailable reason in Chromium at 412 x 915 and in the 392 x 641 cockpit frame, and with a connected engine and a refused drone scan.
    level: browser
    runner: { kind: node-test, scope: package, files: [tests/browser/spaces-phone-layout.test.cjs] }
    expected:
      - The capture forms are laid out at their natural height (no inner scroll box) and the last control is reachable by scrolling the page.
      - The 3D viewer follows the forms and is at least 300px tall; nothing is wider than the screen and nothing is written.
      - With a connected engine, tapping the drone scan after scrolling to it shows its refusal toast inside the visible screen; the only write is that refused POST.
      - Each toast (the refused drone scan, and "Choose a video first" with the native unavailable reason) is the topmost thing at its centre; the "Prepare a diagnostic brief" panel sits in the page flow, not fixed over the page.
    prerequisites: [runner:node-test, dependency:playwright, browser:chromium]
    sideEffects: none
    isolation: { mode: none, cleanup: Each case closes its browser context; pages and answers are synthetic and served inside the browser with no network or server. }
    limits: { timeoutMs: 60000, maxMemoryMb: 1024 }
    installation: never
  - id: spaces-surfaces
    name: Packaged surfaces and viewer copy
    purpose: Read the packaged route source, the compiled route and the shipped pages - no browser, server or GPU.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/spaces-surfaces.test.js
    expected:
      - The packaged factory and the /pair endpoint are present in source and compiled routes.
      - The empty viewer names the Walk-through video field and the Reconstruct 3D scene button and gives no left/right direction, which is wrong at phone width.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
