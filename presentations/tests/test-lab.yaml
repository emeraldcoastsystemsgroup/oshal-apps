      - Dragging is one undoable geometry edit; focused Word drafts save before assistant reads and valid shared properties recover after rejected mobile drafts.
    prerequisites: [runner:node-test, runtime:office-pinned-node-dependencies, service:disposable-postgres-35689, browser:chromium, source:kernel-shared-ui]
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures: [tests/office/fixture.mjs]
      cleanup: Remove only each unique fixture database and role and its own HTTP and browser children; preserve the shared disposable service and unrelated data.
    limits: {timeoutMs: 180000, maxMemoryMb: 1024}
