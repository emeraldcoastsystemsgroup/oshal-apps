# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | Register all shipped package tests with explicit runner and fixture boundaries; retain readiness smoke identity.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Register the Create brand kit rules: nearest look, byline and brand voice.
# 3 | maintainer@emeraldcoastsystemsgroup.com | Register Chromium Guide-to-artifact acceptance over the shipped AI Office page and owner-scoped local receipt.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Register the approval-gated Slack Office adapter contract with injected owner-token upload and refusal proof.
# 5 | maintainer@emeraldcoastsystemsgroup.com | The audience-view case covers the classroom view beside company: its model as behaviour and the full studio's other start paths off under a view.
# 6 | maintainer@emeraldcoastsystemsgroup.com | The audience-view case covers the family view (Home shell) beside company and classroom: its model as behaviour over the single /list read, its Open items and its named states.
# 7 | maintainer@emeraldcoastsystemsgroup.com | 2.13.0 brand looks: the brand-look case covers the exact look (asked for on the nearest look, picked when nothing chose one, carried by renders and sends, reopened from a saved file); the new brand-render case drives the compiled route with the framework's own deck engine and reads the brand back out of each generated file.
