  - id: office-phone-browser
    name: Word on a phone starts on an empty paragraph with the panes on screen
    purpose: >-
      At 390x844 with touch, a new Word document shows the shared bottom pane bar on screen and under the finger, an empty first
      paragraph with a placeholder, and typed text as the paragraph's whole text; Office's own menus still open. Real routes over
      disposable PostgreSQL, the kernel's shared editor from OSHAL_PLATFORM_ROOT.
    level: browser
    runner:
      kind: external
      scope: package
      files:
        - tests/office/phone-browser.test.mjs
    expected:
      - Every pane button is inside the screen and hit-testable; the first paragraph is empty with a placeholder; typing gives exactly the typed text.
      - '2.18.7: one app bar row (title with its save state, Save, More) and content within 74 px of the frame; Insert waits in More and a choice there runs and closes More.'
      - '2.18.7: every drawn Navigation item is under the finger with Your documents open.'
      - '2.19.0: the bottom bar is the app''s own and under the finger; the caret is on line 1 and the placeholder shows without it; the app row is Back, the name, Undo, Redo, Save and Export in one row; Insert is a sheet whose choice runs and closes it; Your documents is its own first screen with every card and New under the finger.'
    prerequisites:
      - runner:node
      - runtime:chromium
      - service:postgres-disposable-35689
    sideEffects: fixture-write
    isolation:
      mode: disposable
