      - The landing paints no phantom empty "making" bar, the AI-partner box takes the rail's width with Dictate and
        Send under it, and the slide design row is on the canvas (Roger, 2026-11-03, on the demo).
      - Document mode shows its own design row (Replace/Remove image, no caption knob — the .docx exporter does not
        render captions), the section textarea holds prose only, and prose edits keep the design directives.
      - On a 412x915 phone the header is static and compact (never a sticky translucent wall over the content), nothing
