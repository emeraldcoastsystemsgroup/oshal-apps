  - id: structured-office-persistence-and-editing
    name: Real isolated Office persistence and browser editing
    purpose: Exercise the actual server and forced-RLS PostgreSQL with original-owner isolation, immutable revisions and retries, then edit real slides, rich text and workbook ranges in Chromium including mobile properties and saved assistant handoff.
    level: integration
    runner:
      kind: node-test
      scope: package
