    purpose: With nothing asked of the studio and nothing typed, the shipped page reopens the newest My-files record
      (title, outline, format) instead of an empty editor; ?kind= narrows to that format and an empty list leaves the
      studio untouched (Roger, 2026-11-02, on the demo).
    level: browser
    runner:
      kind: playwright
      scope: package
      files:
        - tests/presentations-resume-latest.test.mjs
    expected:
