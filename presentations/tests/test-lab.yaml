    installation: never
  - id: image-render
    name: An authored image lands in the real .pptx and .docx
    purpose: >-
      The design row's "Add image" writes an inline #image: data URI; this proves the kernel's own deck engine
      (renderPptx + the content sniffer) embeds those exact bytes as archive media — the control is never draft-only —
      and that non-image bytes are dropped, not embedded.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/presentations-image-render.core.spec.mjs
    expected:
      - The authored image's exact bytes are in ppt/media beyond any theme decor, and every outline slide is a real slide.
      - A data URI whose payload is not image bytes is dropped by the sniffer and the deck still renders.
      - >-
        The same #image: data URI through renderDocx lands the authored bytes in word/media and the directive line never
        leaks into the document text.
    prerequisites:
      - runner:node-test
      - harness:oshal-core-root
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: In-memory render only; no browser, network, storage or provider use.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 512
    installation: never
  - id: brand-look
