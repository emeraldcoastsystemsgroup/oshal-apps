      - The nearest built-in look follows hue, canvas darkness and fonts, and never replaces a look already chosen.
      - The exact brand look is asked for on the nearest look's layout, leads the looks and is picked only when nothing chose a look; a refused or unreachable one leaves the nearest look picked.
      - Renders and sends carry the kit for the brand look and an id for any other; a saved brand look reopens as today's brand look.
      - The brand name fills only an empty byline and the brand voice rides AI drafts only while switched on.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: In-memory script context only; no browser, network or provider use.
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: brand-render
    name: Files drawn in your brand
    purpose: Drive the compiled AI Office route with the framework's own deck engine and read a brand kit's colors and faces back out of each generated file.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/brand-look-render.core.spec.mjs
    expected:
      - A deck, a document and a workbook generated from the caller's kit carry its colors and faces, and the caller's record names the look brand:<base>.
      - A built-in look still renders and records by its id.
      - An invalid kit is refused with the engine's reason before any outline draft, render, save or record.
      - POST /brand-look builds the look for a signed-in caller only; email and Slack deliver in the brand look and refuse an invalid kit before reading a token or sending.
    prerequisites:
      - runner:node-test
      - fixture:core-checkout
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: In-memory route seams only; no storage, database, model, mailbox or Slack call leaves the process.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 512
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell), classroom (Classroom shell) and family (Home shell)
      audience views through the shared kit: kit loaded after the theme bootstrap, boot with this application's own
      name and exactly its audiences, full-page start gated on the kit's decision, head block parses and reads only
      this package's own routes; the classroom and family models run against a stub kit, and every other start path
      of the full studio off under a view.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - The classroom view offers its five starters in order as studio deep links, lists the learner's work newest first with outside links in a new tab, reads only /list and /starters, and names the no-catalog, empty, signed-out and unreadable states.
      - The family view reads only /list, lists the household's documents newest first in plain words with an Open badge on exactly the items that open in a new tab, opens the full studio from its one action, and names the empty, signed-out, refused and unreadable states.
      - Under any audience view the brand-kit read, the starters and brand boot, the surface-bridge attach and the hand-off and connected actions do not run.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: kernel-egress
    name: Native kernel delivery egress
    purpose: Drive the compiled email and Slack delivery routes with OSHAL_EGRESS=kernel, the bridge's inert framework stand-ins, a stub renderer, synthetic connection metadata and a recording fetch - no network, credentials or recipients.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/kernel-egress.test.cjs
    expected:
      - A confirmed email posts the fenced MIME (CRLF flattened, artifact attached) to gmail.googleapis.com, or Graph sendMail JSON to graph.microsoft.com, with no Authorization and only headers the egress accepts; the inert framework sender is never used.
      - Gmail is tried first and a kernel "not connected" refusal falls through to Microsoft; no usable mailbox answers 409 no_mail_connection, and a provider refusal is a 502, never a delivered send.
      - A confirmed Slack delivery runs files.getUploadURLExternal, the raw-byte upload to the pre-signed files.slack.com URL and files.completeUploadExternal with no credential; an upload URL on any other host is refused before the bytes leave.
      - No, a lapsed or a kernel-refused Slack connection answers 409 no_slack_connection.
      - Outside the kernel the broker token still reaches the framework sender and Slack client.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: record-before-answer
    name: A saved Office file is recorded before the request answers
    purpose: Drive the compiled POST /pptx route against a pool that, like the native kernel, refuses every query once the request has answered, with inert framework stand-ins and a stub renderer and store; run the surface's when() date formatter.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/presentations-record-before-answer.test.cjs
    expected:
      - The My decks INSERT lands before the answer, carrying the saved name, slide count and format; no query runs after the answer.
      - A refused record still answers 200 with the saved file.
      - The surface shows no date for a deck whose createdAt is missing or invalid, never the 1970 epoch.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: ai-draft-outline
    name: An AI draft fills the studio, survives a cut-off outline and fails in plain words
    purpose: Drive the compiled POST /pptx route with a deck-builder double whose reply is whole, cut off late, cut off early or missing; run the surface's fillDrafted() out of the shipped page.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/presentations-ai-draft-outline.test.cjs
    expected:
      - A topic draft answers with the title and the outline it drafted; a person's own outline is not echoed back.
      - The draft asks the deck-builder for 8192 output tokens (the 2048 default cut a six-slide outline off).
      - An outline cut off after at least half the requested slides keeps its complete slides and says so in note.
      - An outline cut off earlier, or a reply with no outline, answers 502 with plain words and a code (outline_cut_off / outline_missing), never a parser message, and saves nothing.
      - fillDrafted writes the outline into empty Title and Outline and never overwrites a typed title.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: generate-reenable
    name: Every way out of a generate turns the buttons back on
    purpose: Run the shipped page's generate() against button and fetch doubles for a refused answer, a network error and a saved draft.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/presentations-generate-reenable.test.cjs
    expected:
      - After a refused draft all four generate buttons are enabled, the status is cleared and the server's plain refusal is shown.
      - After a network error and after a success the buttons are enabled too; a cut-off note shows beside the saved file.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never

  - id: editing-workspace-source
    name: Slides, sheets and AI proposal workspace
    purpose: Verify actual draft modules and Chromium interaction with explicitly named shell, catalog and Guide HTTP fixtures.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/office-assets.test.mjs
        - tests/office-entry-actions.test.mjs
        - tests/office-assistant.test.mjs
        - tests/office-workspace-browser.test.mjs
        - tests/presentations-slide-workspace.test.mjs
        - tests/presentations-slide-workspace-browser.test.mjs
        - tests/presentations-sheet-workspace.test.mjs
        - tests/presentations-sheet-workspace-browser.test.mjs
    expected:
      - Editing selected slides and cells preserves other sections and structured source.
      - AI suggestions require review and cannot overwrite a newer human draft.
      - The Concierge remains available on desktop and phone.
      - Generate opens the current editable document Concierge without navigation or an automatic model call; historical file imports and audience views remain available.
      - >-
        The design row writes only renderer-honoured directives — a picked layout as `#layout:`, an image file as the
        inline `#image:` data URI drawn on the canvas with its `#caption:` — and removal or undo restores the outline exactly.
      - splitDesign separates design directives from prose and mergeDesign keeps the person's design through helper
        edits (a returned "(attached)" placeholder is never written; a person-given https image URL is).
    prerequisites:
      - runner:node-test
      - browser:chromium
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: Close only owned Chromium contexts and loopback HTTP servers; retain no installed records or external deliveries.
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
