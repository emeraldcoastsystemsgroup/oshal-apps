version: 1
cases:
  - id: routing-words
    name: AI Office routing words
    purpose: Keep the words people use for a PowerPoint deck or a Word document declared on deck-builder, which holds the create tools.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/presentations-routing-words.test.cjs
    expected:
      - deck-builder declares powerpoint, power point, slide deck, word document, intelligent office and ai office.
      - The package still declares presentations-create-deck and presentations-create-document.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
