# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | Register all shipped package tests with explicit runner and fixture boundaries; retain readiness smoke identity.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Register the Create brand kit rules: nearest look, byline and brand voice.
# 3 | maintainer@emeraldcoastsystemsgroup.com | Register Chromium Guide-to-artifact acceptance over the shipped AI Office page and owner-scoped local receipt.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Register the approval-gated Slack Office adapter contract with injected owner-token upload and refusal proof.
# 5 | maintainer@emeraldcoastsystemsgroup.com | The audience-view case covers the classroom view beside company: its model as behaviour and the full studio's other start paths off under a view.
# 6 | maintainer@emeraldcoastsystemsgroup.com | The audience-view case covers the family view (Home shell) beside company and classroom: its model as behaviour over the single /list read, its Open items and its named states.
# 7 | maintainer@emeraldcoastsystemsgroup.com | 2.13.0 brand looks: the brand-look case covers the exact look (asked for on the nearest look, picked when nothing chose one, carried by renders and sends, reopened from a saved file); the new brand-render case drives the compiled route with the framework's own deck engine and reads the brand back out of each generated file.
# 8 | maintainer@emeraldcoastsystemsgroup.com | Run the framework fixture refusal guard beside the Guide artifact contract, which now compiles actual source without a machine-specific or ignored dist dependency.
# 9 | maintainer@emeraldcoastsystemsgroup.com | Register the native-kernel delivery egress case: email through gmail.googleapis.com / graph.microsoft.com and Slack through slack.com plus files.slack.com carry no credential; missing, lapsed or refused connections keep the 409s; outside the kernel the framework sender and Slack client are unchanged.
# 10 | maintainer@emeraldcoastsystemsgroup.com | record-before-answer: the compiled POST /pptx writes its My decks record before the request answers (the native kernel refuses SQL after the answer), a refused record still answers with the saved file, and the surface shows no date for a missing createdAt.
# 11 | maintainer@emeraldcoastsystemsgroup.com | Register ai-draft-outline (the topic draft fills Title and Outline; sweep 10: an outline cut off at the output budget keeps its complete slides or answers 502 in plain words, and the draft asks for 8192 output tokens) and generate-reenable (sweep 10: a failed generate left every generate button disabled).
# 12 | maintainer@emeraldcoastsystemsgroup.com | Register create-tools: deck-builder's presentations-create-deck and presentations-create-document are automatic writes onto POST /pptx and /docx whose body renders and saves, and the persona says to call them.
# -----------------------------------------------------------------------------
version: 1
cases:
  - id: package-readiness
    name: Installed package readiness
    purpose: Verify the existing metadata-only readiness probe without provider or user-data access.
    level: integration
    runner:
      kind: smoke
      smoke: package-readiness
    expected:
      - The installed presentations package identity satisfies its manifest smoke assertions.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: safe-smoke
  - id: surface-parse
    name: Office surface syntax and navigation
    purpose: Parse the packaged classic and module scripts and verify the walkthrough, explorer and bridge contract.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/presentations-surface-parse.test.js
    expected:
      - Classic and module scripts parse using Node without running a browser.
      - Walkthrough, file explorer, purpose controls and surface-bridge targets remain present.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: starters
    name: Office starter catalog
    purpose: Exercise the compiled starter catalog and verify the surface uses the owning catalog and deep links.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/presentations-starters.test.js
    expected:
      - Document, workbook and deck starters have complete purpose-specific outlines.
      - Starter groups, surface vocabulary and deep links stay consistent.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: destination
    name: Storage destination handler
    purpose: Call the compiled destination handler with synthetic router, preferences and storage seams.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/presentations-destination.test.mjs
    expected:
      - Anonymous requests stop before lookup and overrides do not read preferences or write data.
      - Allowed providers resolve a findable destination; preference failures return an honest error.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: guide
    name: Deck-builder guide operations
    purpose: Exercise the signed-in guide route and verify only bounded editor actions reach the surface.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/presentations-guide.test.mjs
    expected:
      - Anonymous guide requests stop before bot execution.
      - Valid deck-builder replies expose only whitelisted editor operations with bounded fields.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: guide-artifact
    name: Guide-to-artifact acceptance
    purpose: Drive a signed-in Guide turn through the bounded editor contract into a real PPTX and a disposable owner-scoped local receipt.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/presentations-guide-artifact.test.mjs
        - tests/presentations-framework-fixture.test.mjs
    expected:
      - The Guide response is reduced to the declared editor bridge vocabulary and updates the resulting outline state.
      - The resulting outline renders as a structurally valid PPTX and returns an owner-scoped OSHAL-local receipt.
      - The acceptance path performs no email, provider delivery, deletion, or other outward action.
    prerequisites:
      - runner:node-test
      - fixture:core-checkout
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: Temporary local artifact directory and synthetic framework/storage seams are removed after the test.
    limits:
      timeoutMs: 30000
      maxMemoryMb: 512
    installation: never
  - id: guide-browser-artifact
    name: Guide drives the AI Office surface
    purpose: Walk the actual AI Office HTML in Chromium from its Guide entry path through bounded editor actions and a same-origin owner-scoped local receipt.
    level: browser
    runner:
      kind: playwright
      scope: package
      files:
        - tests/presentations-guide-browser.test.mjs
    expected:
      - The shipped page accepts a Guide turn and applies only the bounded title/outline actions to the visible editor.
      - The real Generate control sends the edited outline and renders the owner-scoped local receipt returned by the same-origin endpoint.
      - The disposable fixture rejects external traffic and proves no email or delete action crosses the path.
    prerequisites:
      - runner:playwright
      - browser:chromium
      - harness:oshal-core-root
      - core:shared-theme-assets
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: Close the Chromium context and loopback server; retain no artifact, provider call, mailbox action or installed record.
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
  - id: slack-delivery
    name: Approval-gated Slack Office delivery
    purpose: Render one Office artifact and hand it to an injected caller-owned Slack upload seam while proving confirmation refusal and no real network.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/presentations-slack-delivery.test.mjs
    expected:
      - Missing explicit confirmation returns 428 and performs no upload.
      - Confirmed delivery uses the authenticated caller's Slack token, bounded channel and rendered Office bytes.
      - The disposable test makes no Slack, mailbox, recipient or provider request.
    prerequisites:
      - runner:node-test
      - fixture:core-checkout
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: Restore module seams; retain no artifact, provider call, mailbox action or installed record.
    limits:
      timeoutMs: 30000
      maxMemoryMb: 512
    installation: never
  - id: brand-look
    name: Your brand in AI Office
    purpose: Run the surface's own brand code against a stubbed session to prove the look, byline and voice rules.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/presentations-brand.test.js
    expected:
      - The Create brand kit is read once in the viewer's session with a bounded wait; a refusal changes nothing.
      - The nearest built-in look follows hue, canvas darkness and fonts, and never replaces a look already chosen.
      - The exact brand look is asked for on the nearest look's layout, leads the looks and is picked only when nothing chose a look; a refused or unreachable one leaves the nearest look picked.
      - Renders and sends carry the kit for the brand look and an id for any other; a saved brand look reopens as today's brand look.
      - The brand name fills only an empty byline and the brand voice rides AI drafts only while switched on.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: In-memory script context only; no browser, network or provider use.
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: brand-render
    name: Files drawn in your brand
    purpose: Drive the compiled AI Office route with the framework's own deck engine and read a brand kit's colors and faces back out of each generated file.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/brand-look-render.core.spec.mjs
    expected:
      - A deck, a document and a workbook generated from the caller's kit carry its colors and faces, and the caller's record names the look brand:<base>.
      - A built-in look still renders and records by its id.
      - An invalid kit is refused with the engine's reason before any outline draft, render, save or record.
      - POST /brand-look builds the look for a signed-in caller only; email and Slack deliver in the brand look and refuse an invalid kit before reading a token or sending.
    prerequisites:
      - runner:node-test
      - fixture:core-checkout
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: In-memory route seams only; no storage, database, model, mailbox or Slack call leaves the process.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 512
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell), classroom (Classroom shell) and family (Home shell)
      audience views through the shared kit: kit loaded after the theme bootstrap, boot with this application's own
      name and exactly its audiences, full-page start gated on the kit's decision, head block parses and reads only
      this package's own routes; the classroom and family models run against a stub kit, and every other start path
      of the full studio off under a view.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - The classroom view offers its five starters in order as studio deep links, lists the learner's work newest first with outside links in a new tab, reads only /list and /starters, and names the no-catalog, empty, signed-out and unreadable states.
      - The family view reads only /list, lists the household's documents newest first in plain words with an Open badge on exactly the items that open in a new tab, opens the full studio from its one action, and names the empty, signed-out, refused and unreadable states.
      - Under any audience view the brand-kit read, the starters and brand boot, the surface-bridge attach and the hand-off and connected actions do not run.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: kernel-egress
    name: Native kernel delivery egress
    purpose: Drive the compiled email and Slack delivery routes with OSHAL_EGRESS=kernel, the bridge's inert framework stand-ins, a stub renderer, synthetic connection metadata and a recording fetch - no network, credentials or recipients.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/kernel-egress.test.cjs
    expected:
      - A confirmed email posts the fenced MIME (CRLF flattened, artifact attached) to gmail.googleapis.com, or Graph sendMail JSON to graph.microsoft.com, with no Authorization and only headers the egress accepts; the inert framework sender is never used.
      - Gmail is tried first and a kernel "not connected" refusal falls through to Microsoft; no usable mailbox answers 409 no_mail_connection, and a provider refusal is a 502, never a delivered send.
      - A confirmed Slack delivery runs files.getUploadURLExternal, the raw-byte upload to the pre-signed files.slack.com URL and files.completeUploadExternal with no credential; an upload URL on any other host is refused before the bytes leave.
      - No, a lapsed or a kernel-refused Slack connection answers 409 no_slack_connection.
      - Outside the kernel the broker token still reaches the framework sender and Slack client.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: record-before-answer
    name: A saved Office file is recorded before the request answers
    purpose: Drive the compiled POST /pptx route against a pool that, like the native kernel, refuses every query once the request has answered, with inert framework stand-ins and a stub renderer and store; run the surface's when() date formatter.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/presentations-record-before-answer.test.cjs
    expected:
      - The My decks INSERT lands before the answer, carrying the saved name, slide count and format; no query runs after the answer.
      - A refused record still answers 200 with the saved file.
      - The surface shows no date for a deck whose createdAt is missing or invalid, never the 1970 epoch.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: ai-draft-outline
    name: An AI draft fills the studio, survives a cut-off outline and fails in plain words
    purpose: Drive the compiled POST /pptx route with a deck-builder double whose reply is whole, cut off late, cut off early or missing; run the surface's fillDrafted() out of the shipped page.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/presentations-ai-draft-outline.test.cjs
    expected:
      - A topic draft answers with the title and the outline it drafted; a person's own outline is not echoed back.
      - The draft asks the deck-builder for 8192 output tokens (the 2048 default cut a six-slide outline off).
      - An outline cut off after at least half the requested slides keeps its complete slides and says so in note.
      - An outline cut off earlier, or a reply with no outline, answers 502 with plain words and a code (outline_cut_off / outline_missing), never a parser message, and saves nothing.
      - fillDrafted writes the outline into empty Title and Outline and never overwrites a typed title.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: generate-reenable
    name: Every way out of a generate turns the buttons back on
    purpose: Run the shipped page's generate() against button and fetch doubles for a refused answer, a network error and a saved draft.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/presentations-generate-reenable.test.cjs
    expected:
      - After a refused draft all four generate buttons are enabled, the status is cleared and the server's plain refusal is shown.
      - After a network error and after a success the buttons are enabled too; a cut-off note shows beside the saved file.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never

  - id: editing-workspace-source
    name: Slides, sheets and AI proposal workspace
    purpose: Verify actual draft modules and Chromium interaction with explicitly named shell, catalog and Guide HTTP fixtures.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/office-assets.test.mjs
        - tests/office-assistant.test.mjs
        - tests/office-workspace-browser.test.mjs
        - tests/presentations-slide-workspace.test.mjs
        - tests/presentations-slide-workspace-browser.test.mjs
        - tests/presentations-sheet-workspace.test.mjs
        - tests/presentations-sheet-workspace-browser.test.mjs
    expected:
      - Editing selected slides and cells preserves other sections and structured source.
      - AI suggestions require review and cannot overwrite a newer human draft.
      - The AI partner remains visible on desktop and phone.
    prerequisites:
      - runner:node-test
      - browser:chromium
    sideEffects: fixture-write
    isolation:
      mode: disposable
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
  - id: create-tools
    name: deck-builder makes the deck or document itself
    purpose: >-
      The manifest's create tools are automatic route writes onto the compiled POST /pptx and /docx, the body their schema
      describes renders and saves the file, and the persona tells the bot to call them instead of sending the person to Generate.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/presentations-create-tools.test.cjs
    expected:
      - Both tools are declared automatic, both bodies answer ok with the saved path, and the persona names the tools.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
