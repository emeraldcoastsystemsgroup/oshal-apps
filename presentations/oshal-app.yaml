# -----------------------------------------------------------------------------
# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — presentations (AI Office: deck / document / workbook studio)
# Carved out of OSHAL core 2026-07-19 (ADR-085 Wave 2). "Skills with a surface":
# ONLY the surface carves — the deck-generation ENGINE (@/features/
# presentation-generation: pptx/docx/xlsx renderers, themes, layouts, office
# import) is a contracted Tier-0b KERNEL SKILL (Little Monsters calls it too)
# and STAYS core, as do the legacy Presentron proxy at /api/presentations
# (framework Settings service-runtime tile), the storage-target save layer, and
# the email senders this app calls through @/ aliases. The deck-builder REAL
# bot node (deck-builder-bot container, LOCAL-registry block a0…042, core
# persona) stays in the framework repo per ADR-093 interim — this manifest
# re-declares the bot with a package persona COPY (career-hunter/storage
# precedent) so the app keeps its right-rail agent + agent_ids wiring.
# Framework: OSHAL (see docs/build-your-own-swarm-app.md)
# ─────────────────────────────────────────────────────────────────────────────

name: presentations
suite: ai-productivity   # ADR-097: primary catalog shelf (tools keep their own category:)
displayName: AI Office
description: >-
  One outline, three artifacts: a themed PowerPoint deck, Word document, or live Excel
  workbook — ten shared looks, fully editable in Microsoft Office, Google Workspace or
  LibreOffice. A guided visual start walks you from artifact to look to outline — or just
  talk to the Guide, open a file you already have, or type one line and AI drafts it all.
  Phone-friendly: dictate instead of typing, resume recent files in one tap, and drive
  edits with tap chips. My files is a real file browser - click a file for
  download, open-in-provider, or edit-and-regenerate. Saves to Dropbox, Google Drive, OneDrive, or OSHAL local.
version: 2.12.1
testing:
  version: 1
  catalog: tests/test-lab.yaml

# ADR-139 wave 1 — "Send to…" destination (open mode): an Office file from anywhere in the
# swarm opens straight into the outline editor (the surface's existing /sections/import lane).
artifacts:
  accepts:
    - id: open
      label: Open in AI Office
      icon: 📊
      types:
        - application/vnd.openxmlformats-officedocument.presentationml.presentation
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      mode: open
status: active

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: presentations
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/presentations/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# Kernel skills this app CALLS (D8 contract — resolved from the framework dist):
# deck-generation = the whole render/import engine; storage = the ADR-041 target layer
# the artifacts save through.
uses:
  - test-catalog
  - deck-generation
  - storage
  - app-dependencies   # compatibility floor for the tiered dependencies block (ADR-085 addendum)

# Runtime connector allow-list — where artifacts save (ADR-108 delivery adapters) and
# the mailboxes the approval-gated email leg sends over.
# ── Cross-package prerequisites: what this package actually reaches ─────────
# OPTIONAL, NOT REQUIRED: tools/presentations.html:728 reads /api/create/brand-kit to badge the
# nearest built-in look and fill an empty cover byline. Its own catch says it: "No Create access
# or no kit: the studio keeps its own looks." The renderer still draws all ten looks.
# AI OFFICE IS NOT A DEPENDENCY OF ITS CALLERS, EITHER — the deck-generation engine is a KERNEL
# skill, and the ~41 packages that offer to `presentations` do so through integrations.offers,
# which resolves to state:'unavailable' when this app is absent (see little-monsters).
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: [create]   # owns the brand kit the look-picker badges; absent, the built-in looks are used unchanged
    tools: []
    connectors: [dropbox, github, google-drive, google, microsoft]

# Guest tier REQUEST (ADR-085 D4): core listed 'presentations' Tier-A (interactive demo
# app — guests could build a deck). Unapproved default = guests read-only until the
# operator approves via PATCH /api/swarm/apps/presentations/guest-tier.
guestTier: full

# Per-app skin (approved palette). Moved off midnight (creative-studio claimed it first;
# office.oshal.ai gets its own distinct color, operator decision 2026-07-31).
theme: light-blue

# The app's right-rail chat agent is deck-builder — it walks you from a blank topic
# to a finished outline you can generate. The deck-builder NODE (deck-builder-bot
# container + static registry block) is framework-resident (ADR-093); the persona here
# is a package COPY for the registrar — the container keeps using /app/ai-lab. The
# Generate endpoint's outline drafting still runs on the comms bot via BotNodeClient.
bots:
  - agentId: a0000000-0000-0000-0000-000000000042
    name: deck-builder
    persona: personas/deck-builder.yaml
    role: presentations/guide
    capabilities:
      - presentation-outline
      - slide-structure
      - deck-template-recommendation
      - pitch-deck-drafting
      - deck-guidance

ui:
  static:
    - toolName: presentations-studio
      label: AI Office
      icon: codicon codicon-files
      iframeUrl: /api/presentations/sections/ui
      section: top

# Surface-bridge op allow-list (framework `surface.ops`, validated fail-closed at load —
# an UNDECLARED block means the cockpit relay carries NOTHING for this app). The Guide's
# applyActions vocabulary rides the generic contract now: set_field (title / theme),
# set_content (outline), and the slide-structure ops (add_slide / update_slide / set_theme)
# ride the contract's namespaced `custom` op — the closed vocabulary never grows per app.
surface:
  ops: [set_field, set_content, custom]

routes:
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/presentations/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/presentations/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/bot-presentation-routes.js
    factory: createBotPresentationRoutes
    mountPath: /api/presentations/sections
    auth: oidc   # what core server.ts mounted (requiresAuth — ADR-085 D2)
    requiresAuth: true
    requiresContext: true

# No migrations: oshal_presentations is lazy DDL — the packaged ensurePresentationsSchema
# carries CREATE + owner-RLS at the chokepoint (table stays in place across the carve).

# Trim the ribbon to: the Presentations surface, the ticket queue (your decks),
# settings, and logs. Hide everything else.
ribbon:
  hideFrameworkItems:
    - chat
    - calendar
    - addressbook
    - dashboard
    - echo
    - operations
  defaultView: presentations-studio

integrations:
  accepts:
    - id: prepare-brief
      contextType: research-brief
      version: 1
      surface: presentations-studio
      fields:
        - title
        - notes
        - sourceUrl
  offers:
    - id: prepare-campaign
      label: Prepare a campaign
      targetApp: marketing-engine
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
    - id: prepare-post
      label: Prepare a post
      targetApp: switchboard
      targetAction: prepare-post
      contextType: communication-brief
      version: 1
    - id: prepare-video
      label: Prepare a video clip
      targetApp: vids
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
    - id: prepare-episode
      label: Prepare a video episode
      targetApp: video
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
    - id: prepare-brand
      label: Prepare a brand graphic
      targetApp: brand-graphics
      targetAction: prepare-brief
      contextType: research-brief
      version: 1

summary:
  path: /api/presentations/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items
