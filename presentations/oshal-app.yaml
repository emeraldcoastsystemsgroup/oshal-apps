# -----------------------------------------------------------------------------
# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — presentations (AI Office: deck / document / workbook studio)
# Carved out of OSHAL core 2026-07-19 (ADR-085 Wave 2). "Skills with a surface":
# ONLY the surface carves — the deck-generation ENGINE (@/features/
# presentation-generation: pptx/docx/xlsx renderers, themes, layouts, office
# import) is a contracted Tier-0b KERNEL SKILL (Little Monsters calls it too)
# and STAYS core, as do the legacy Presentron proxy at /api/presentations
# (framework Settings service-runtime tile), the storage-target save layer, and
# the email senders this app calls through @/ aliases. The deck-builder REAL
# bot node (deck-builder-bot container, LOCAL-registry block a0…042, core
# persona) stays in the framework repo per ADR-093 interim — this manifest
# re-declares the bot with a package persona COPY (career-hunter/storage
# precedent) so the app keeps its right-rail agent + agent_ids wiring.
# Framework: OSHAL (see docs/build-your-own-swarm-app.md)
# ─────────────────────────────────────────────────────────────────────────────

# 20 | maintainer@emeraldcoastsystemsgroup.com | 2.18.0: real saved slide/document/workbook editors with native exports, original-owned import attestations and shared AI approval cards.
name: presentations
suite: ai-productivity   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 128, high: 512, basis: declared }
  features:
    - id: ai-outline-draft
      unit: deck, document or sheet outline
      tier: T2
      generation: none
      degrade: template
    - id: deck-guide
      unit: guide chat turn
      tier: T2
      generation: none
      degrade: disable
displayName: AI Office
description: "Edit PowerPoint slides, Word documents and Excel workbooks in place, with selectable content, typed properties, revision history, real Office exports and a pinned Concierge."
version: 2.18.8
testing:
  version: 1
  catalog: tests/test-lab.yaml

# ADR-139 wave 1 — "Send to…" destination (open mode): an Office file from anywhere in the
# swarm opens straight into the outline editor (the surface's existing /sections/import lane).
artifacts:
  accepts:
    - id: open
      label: Open in AI Office
      icon: 📊
      types:
        - application/vnd.openxmlformats-officedocument.presentationml.presentation
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      mode: open
authorization:
  version: 1
  catalog: authorization.yaml

status: active

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: presentations
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/presentations/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# Kernel skills this app CALLS (D8 contract — resolved from the framework dist):
# deck-generation = the whole render/import engine; storage = the ADR-041 target layer
# the artifacts save through.
uses:
  - test-catalog
  - deck-generation
  - storage
  - application-authorization
  - app-dependencies   # compatibility floor for the tiered dependencies block (ADR-085 addendum)

# Runtime connector allow-list — where artifacts save (ADR-108 delivery adapters), the
# approval-gated email leg sends over, and the explicit-confirmation Slack file leg uploads through.
# ── Cross-package prerequisites: what this package actually reaches ─────────
# OPTIONAL, NOT REQUIRED: tools/presentations.html:728 reads /api/create/brand-kit to badge the
# nearest built-in look and fill an empty cover byline. Its own catch says it: "No Create access
# or no kit: the studio keeps its own looks." The renderer still draws all ten looks.
# AI OFFICE IS NOT A DEPENDENCY OF ITS CALLERS, EITHER — the deck-generation engine is a KERNEL
# skill, and the ~41 packages that offer to `presentations` do so through integrations.offers,
# which resolves to state:'unavailable' when this app is absent (see little-monsters).
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: [create]   # owns the brand kit the look-picker badges; absent, the built-in looks are used unchanged
    tools: []
    connectors: [dropbox, github, google-drive, google, microsoft, slack]

# Native kernel egress: the hosts the email and Slack delivery legs send through when the package runs in
# the kernel's sandbox. The kernel applies the caller's own connection for the named connector as a Bearer
# token; the package never holds it. files.slack.com is the pre-signed upload URL Slack hands back, which
# takes no credential.
egress:
  - host: gmail.googleapis.com
    credential: { connector: gmail, header: authorization, prefix: "Bearer " }
  - host: graph.microsoft.com
    credential: { connector: outlook, header: authorization, prefix: "Bearer " }
  - host: slack.com
    credential: { connector: slack, header: authorization, prefix: "Bearer " }
  - host: files.slack.com

# Guest tier REQUEST (ADR-085 D4): core listed 'presentations' Tier-A (interactive demo
# app — guests could build a deck). Unapproved default = guests read-only until the
# operator approves via PATCH /api/swarm/apps/presentations/guest-tier.
guestTier: full

# Per-app skin (approved palette). Moved off midnight (creative-studio claimed it first;
# office.oshal.ai gets its own distinct color, operator decision 2026-07-31).
theme: light-blue

# The app's right-rail chat agent is deck-builder — it walks you from a blank topic
# to a finished outline you can generate. The deck-builder NODE (deck-builder-bot
# container + static registry block) is framework-resident (ADR-093); the persona here
# is a package COPY for the registrar — the container keeps using /app/ai-lab. The
# Generate endpoint's outline drafting still runs on the comms bot via BotNodeClient.
bots:
  - agentId: a0000000-0000-0000-0000-000000000042
    name: deck-builder
    routingKeywords:
      - a powerpoint
      - the powerpoint
      - powerpoint about
      - powerpoint on
      - a presentation
      - presentation about
      - a slide deck
      - a slideshow
      - a word document
      - intelligent office
    persona: personas/deck-builder.yaml
    role: presentations/guide
    capabilities:
      - presentation-outline
      - slide-structure
      - deck-template-recommendation
      - pitch-deck-drafting
      - deck-guidance

ui:
  static:
    - toolName: presentations-studio
      label: AI Office
      icon: codicon codicon-files
      iframeUrl: /api/presentations/editor/app
      section: top

# Surface-bridge op allow-list (framework `surface.ops`, validated fail-closed at load —
# an UNDECLARED block means the cockpit relay carries NOTHING for this app). The Guide's
# applyActions vocabulary rides the generic contract now: set_field (title / theme),
# set_content (outline), and the slide-structure ops (add_slide / update_slide / set_theme)
# ride the contract's namespaced `custom` op — the closed vocabulary never grows per app.
surface:
  ops: [set_field, set_content, custom]

# Route-backed read for deck-builder (native kernel: executorType api, inside this package's mount).
tools:
  - name: presentations-list
    displayName: My Decks
    type: api
    category: productivity
    description: The person's saved decks, documents and workbooks, newest first (title, format, slides, where it saved, its link).
    executor: { executorType: api, apiEndpoint: "GET /api/presentations/sections/list" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} when the person asks what they have made. Name only decks this returns; an empty list means nothing is saved yet.
    tags: [presentations, route-backed]

  - name: presentations-create-deck
    displayName: Make a PowerPoint deck
    type: api
    category: productivity
    description: Make a separate PowerPoint file (.pptx) from a title and slides when no current office-editor document is being edited. In an open Office editor, use office-apply-edits to populate or change that same document instead.
    executor: { executorType: api, apiEndpoint: "POST /api/presentations/sections/pptx" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        title: { type: string, maxLength: 120 }
        subtitle: { type: string, maxLength: 200 }
        theme: { type: string }
        sections:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            properties:
              title: { type: string }
              content: { type: string }
              notes: { type: string }
            required: [title]
      required: [title, sections]
    usageInstructions: >-
      Write the whole PowerPoint deck yourself and call this once with {title, sections}: each section is one
      slide with a title and content, one line per point (the structure lines in your
      instructions make tables, charts and timelines). Use only facts the person or an earlier tool gave you; a number you
      do not have is a TBD line, never invented. The answer names where it saved and its link; tell the person that, and
      never say a file was made unless this returned ok. Then offer to open it in AI Office with the returned
      openUrl as a link ("Open it in AI Office").
    tags: [presentations, route-backed]

  - name: presentations-create-document
    displayName: Make a Word document
    type: api
    category: productivity
    description: Make a separate Word file (.docx) from a title and sections when no current office-editor document is being edited. In an open Office editor, use office-apply-edits to populate or change that same document instead.
    executor: { executorType: api, apiEndpoint: "POST /api/presentations/sections/docx" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        title: { type: string, maxLength: 120 }
        subtitle: { type: string, maxLength: 200 }
        theme: { type: string }
        sections:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            properties:
              title: { type: string }
              content: { type: string }
              notes: { type: string }
            required: [title]
      required: [title, sections]
    usageInstructions: >-
      Write the whole Word document yourself and call this once with {title, sections}: each section is one
      heading with a title and content, one line per point (the structure lines in your
      instructions make tables, charts and timelines). Use only facts the person or an earlier tool gave you; a number you
      do not have is a TBD line, never invented. The answer names where it saved and its link; tell the person that, and
      never say a file was made unless this returned ok. Then offer to open it in AI Office with the returned
      openUrl as a link ("Open it in AI Office").
    tags: [presentations, route-backed]

  - name: office-editing-contract
    displayName: Office editing contract
    type: api
    category: productivity
    description: >-
      Read the installed structured Office model, exact closed operation names/keys, examples, units and
      limits before proposing an edit. Text replacement uses text-range with actual page/id/start/end/text;
      a presentation/Word text update is not a replace_text or set_text command.
    executor:
      executorType: api
      apiEndpoint: GET /api/presentations/editor/editing-contract
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    usageInstructions: Read this before editing an open Office document. Copy its fresh requestKey unchanged for the next create/edit proposal; never invent an identity. An uncertain identical retry keeps its prior key.
    routingTags:
      - office
      - editing
      - presentation
      - document
      - spreadsheet
    skills:
      - office-editing
    tags:
      - route-backed
  - name: office-list-documents
    displayName: List editable Office documents
    type: api
    category: productivity
    description: List the original person’s saved editable slides, documents and workbooks.
    executor:
      executorType: api
      apiEndpoint: GET /api/presentations/editor/documents
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    usageInstructions: Use actual document IDs returned here or by CURRENT DOCUMENT context; never guess ownership.
    routingTags:
      - office
      - editing
      - presentation
      - document
      - spreadsheet
    skills:
      - office-editing
    tags:
      - route-backed
  - name: office-read-model-part
    displayName: Read exact Office model part
    type: api
    category: productivity
    description: Read a bounded exact JSON fragment at a pinned saved revision.
    executor:
      executorType: api
      apiEndpoint: >-
        GET
        /api/presentations/editor/documents/{input.id}/model-part?revision={input.revision}&offset={input.offset}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
        revision:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 4194304
      required:
        - id
        - revision
        - offset
    usageInstructions: >-
      Prefer office-read-selection-part for the active objects/range. Otherwise start at offset0 and follow nextOffset until all relevant actual IDs and properties are known. Keep the
      same saved revision. Fragments are exact text, never a complete model until reassembled.
    routingTags:
      - office
      - editing
      - presentation
      - document
      - spreadsheet
    skills:
      - office-editing
    tags:
      - route-backed
  - name: office-read-selection-part
    displayName: Read current Office selection
    type: api
    category: productivity
    description: >-
      Read exact selected objects or cell ranges at the saved revision without scanning unrelated content.
      Reassemble text fragments through nextOffset before editing. The result supplies real page/object or
      sheet IDs, rich text runs/styles and wholeTextRanges with exact UTF-16 start/end for text replacement.
      Copy those ranges instead of counting characters. Follow office-editing-contract and office-apply-edits' closed
      operation examples; never infer an operation name from natural-language intent.
    executor:
      executorType: api
      apiEndpoint: GET /api/presentations/editor/documents/{input.id}/selection-part?revision={input.revision}&offset={input.offset}&selectionJson={input.selectionJson}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, minLength: 1, maxLength: 80}
        revision: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, maximum: 4194304}
        selectionJson: {type: string, minLength: 2, maxLength: 4096}
      required: [id, revision, offset, selectionJson]
    usageInstructions: Use the exact selection from CURRENT DOCUMENT. Start offset0 and follow nextOffset at the same revision. Reassemble exact text and verify textSha256 when necessary. Embedded images expose their digest and geometry; original image bytes stay unchanged. Use office-read-model-part for content outside the selection.
    routingTags: [office, editing, presentation, document, spreadsheet]
    skills: [office-editing]
    tags: [route-backed]
  - name: office-create-document
    displayName: Create editable Office document
    type: api
    category: productivity
    description: Create an original-owned editable presentation, Word document or workbook.
    executor:
      executorType: api
      apiEndpoint: POST /api/presentations/editor/documents
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - pptx
            - docx
            - xlsx
        title:
          type: string
          minLength: 1
          maxLength: 120
        requestKey:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          minLength: 36
          maxLength: 36
      required:
        - kind
        - title
        - requestKey
    usageInstructions: >-
      Read office-editing-contract and copy its fresh requestKey. Create a blank supported document only when requested; after approval read its actual IDs before
      inserting content. Reuse requestKey only for an uncertain same-input retry.
    routingTags:
      - office
      - editing
      - presentation
      - document
      - spreadsheet
    skills:
      - office-editing
    tags:
      - route-backed
  - name: office-apply-edits
    displayName: Edit saved Office document
    type: api
    category: productivity
    description: |
      Propose an atomic edit to the actual saved Office document; nothing changes until its native card is approved.
      Also use this to write/generate content in the CURRENT office-editor document, including a blank one.
      Keep its recordId as id and fields.revision as baseRevision; do not create a separate legacy file or send the user to Generate.
      First read office-editing-contract and office-read-selection-part at the current saved revision.
      Send {id,baseRevision,requestKey,operationsJson}; operationsJson is a JSON STRING containing an array.
      Copy requestKey from the just-read office-editing-contract response; never invent or alter it.
      That key is a new valid UUID v4: xxxxxxxx-xxxx-4xxx-[89ab]xxx-xxxxxxxxxxxx, hexadecimal only.
      Keep that exact key only when retrying the same uncertain input; do not reuse another edit's key.
      PPTX text boxes AND Word paragraphs use the SAME text-range operation. Read the concatenated runs' current text.
      For whole-text replacement COPY the selected item's wholeTextRanges skeleton from the selection read,
      then add text with the replacement. It supplies exact op/page/id/start/end; do not count or guess end.
      TEXT_REPLACEMENT_OPERATION_JSON
      {"op":"text-range","page":"actual-page-id","id":"actual-selected-text-id","start":0,"end":5,"text":"New words"}
      END_TEXT_REPLACEMENT_OPERATION_JSON
      The example replaces 5 characters. For whole text use the ACTUAL wholeTextRanges entry, never the example end.
      PPTX_GEOMETRY_OPERATION_JSON
      {"op":"update-object","page":"actual-page-id","id":"actual-selected-shape-id","patch":{"x":120,"fill":"#2563eb"}}
      END_PPTX_GEOMETRY_OPERATION_JSON
      WORKBOOK_CELL_OPERATION_JSON
      {"op":"cell","sheet":"actual-sheet-id","from":"A1","value":"New words"}
      END_WORKBOOK_CELL_OPERATION_JSON
      Only supported closed operations/fields are accepted. Never invent replace_text, set_text, text or update_slide ops.
      Use real IDs from the saved selection and preserve unrelated content. Read the contract for other edits.
    executor:
      executorType: api
      apiEndpoint: POST /api/presentations/editor/documents/{input.id}/edits
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
        baseRevision:
          type: integer
          minimum: 1
          maximum: 100
        requestKey:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          minLength: 36
          maxLength: 36
        operationsJson:
          type: string
          minLength: 2
          maxLength: 12000
      required:
        - id
        - baseRevision
        - requestKey
        - operationsJson
    usageInstructions: >-
      Read the actual editing contract and relevant saved model first. operationsJson is a JSON array of
      closed operations, never code. Use latest baseRevision and real stable object IDs from the current
      document/selection. Preserve unrelated objects. One batch creates one immutable revision after the real
      approval card; report success only after the route result. A stale revision needs rereading and a new
      proposal.
    routingTags:
      - office
      - editing
      - presentation
      - document
      - spreadsheet
    skills:
      - office-editing
    tags:
      - route-backed
  - name: office-export-document
    displayName: Export saved Office document
    type: api
    category: productivity
    description: Render a real Office artifact from an exact owned saved revision and return its guarded download URL.
    executor:
      executorType: api
      apiEndpoint: >-
        GET
        /api/presentations/editor/documents/{input.id}/export?revision={input.revision}&format={input.format}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
        revision:
          type: integer
          minimum: 1
          maximum: 100
        format:
          type: string
          enum:
            - pptx
            - docx
            - xlsx
            - json
      required:
        - id
        - revision
        - format
    usageInstructions: >-
      Use the document’s own Office kind or json. The actual renderer must return ready; then offer the
      guarded download URL. Do not claim a provider upload or delivery.
    routingTags:
      - office
      - editing
      - presentation
      - document
      - spreadsheet
    skills:
      - office-editing
    tags:
      - route-backed

routes:
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/presentations/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/presentations/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/office-editor/application.mjs
    factory: createOfficeEditorRoutes
    mountPath: /api/presentations/editor
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/bot-presentation-routes.js
    factory: createBotPresentationRoutes
    mountPath: /api/presentations/sections
    auth: oidc   # what core server.ts mounted (requiresAuth — ADR-085 D2)
    requiresAuth: true
    requiresContext: true

# The "My decks" record table is declared so the native kernel provisions it; on PostgreSQL the
# packaged ensurePresentationsSchema still adds its owner-RLS at the chokepoint.
migrations:
  - migrations/001-presentations.sql
  - migrations/002-office-editor.sql
  - migrations/native/002-office-editor.sql
nativeMigrations:
  - id: migrations/002-office-editor.sql
    native: skip
    reason: Native schema retains immutable revisions and physically scoped original-person data; PostgreSQL adds forced original-owner policies.

# Trim the ribbon to: the Presentations surface, the ticket queue (your decks),
