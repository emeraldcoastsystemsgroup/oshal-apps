# Original-owned structured Office editing; exact mount paths avoid legacy/editor operation ambiguity.
version: 1
resources:
  documents:
    scopes:
      - own
permissions:
  document.view:
    resource: documents
    effect: read
    minimumTier: viewer
  document.read:
    resource: documents
    effect: read
    minimumTier: viewer
  document.create:
    resource: documents
    effect: write
    minimumTier: editor
  document.change:
    resource: documents
    effect: write
    minimumTier: editor
  document.delete:
    resource: documents
    effect: write
    minimumTier: editor
  document.export:
    resource: documents
    effect: export
    minimumTier: editor
  legacy.access:
    resource: documents
    effect: write
    minimumTier: editor
roles:
  viewer:
    tier: viewer
    grants:
      - permission: document.view
        scope: own
      - permission: document.read
        scope: own
  editor:
    tier: editor
    grants:
      - permission: document.view
        scope: own
      - permission: document.read
        scope: own
      - permission: document.create
        scope: own
      - permission: document.change
        scope: own
      - permission: document.export
        scope: own
      - permission: legacy.access
        scope: own
  admin:
    tier: admin
    grants:
      - permission: document.view
        scope: own
      - permission: document.read
        scope: own
      - permission: document.create
        scope: own
      - permission: document.change
        scope: own
      - permission: document.delete
        scope: own
      - permission: document.export
        scope: own
      - permission: legacy.access
        scope: own
bindings:
  http:
    - id: office-route-0
      method: GET
      path: /api/presentations/editor/app
      allOf:
        - document.view
    - id: office-route-1
      method: GET
      path: /api/presentations/editor/assets/:name
      allOf:
        - document.view
    - id: office-route-2
      method: GET
      path: /api/presentations/editor/permissions
      allOf:
        - document.view
    - id: office-route-3
      method: GET
      path: /api/presentations/editor/editing-contract
      allOf:
        - document.view
    - id: office-route-4
      method: GET
      path: /api/presentations/editor/documents
      allOf:
        - document.view
        - document.read
    - id: office-route-5
      method: POST
      path: /api/presentations/editor/documents
      allOf:
        - document.view
        - document.create
    - id: office-route-6
      method: GET
      path: /api/presentations/editor/documents/:id
      allOf:
        - document.view
        - document.read
    - id: office-route-7
      method: GET
      path: /api/presentations/editor/documents/:id/model-part
      allOf:
        - document.view
        - document.read
    - id: office-route-8
      method: POST
      path: /api/presentations/editor/documents/:id/revisions
      allOf:
        - document.view
        - document.change
        - document.read
    - id: office-route-9
      method: POST
      path: /api/presentations/editor/documents/:id/edits
      allOf:
        - document.view
        - document.change
        - document.read
    - id: office-route-10
      method: DELETE
      path: /api/presentations/editor/documents/:id
      allOf:
        - document.view
        - document.delete
        - document.read
    - id: office-route-11
      method: POST
      path: /api/presentations/editor/import/inspect
      allOf:
        - document.view
        - document.read
    - id: office-route-12
      method: POST
      path: /api/presentations/editor/import
      allOf:
        - document.view
        - document.create
    - id: office-route-13
      method: GET
      path: /api/presentations/editor/documents/:id/original
      allOf:
        - document.view
        - document.export
        - document.read
    - id: office-route-14
      method: GET
      path: /api/presentations/editor/documents/:id/revisions/:revision/content
      allOf:
