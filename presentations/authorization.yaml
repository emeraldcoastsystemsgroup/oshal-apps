      allOf:
        - document.view
    - id: office-route-17
      method: GET
      path: /api/presentations/sections/themes
      allOf:
        - document.view
    - id: office-route-18
      method: GET
      path: /api/presentations/sections/starters
      allOf:
        - document.view
    - id: office-route-19
