    - id: office-shares-grant
      method: POST
      path: /api/presentations/editor/documents/:id/shares
      allOf: [document.view, document.read, document.change]
    - id: office-shares-revoke
      method: DELETE
      path: /api/presentations/editor/documents/:id/shares/:shareId
      allOf: [document.view, document.read, document.change]
