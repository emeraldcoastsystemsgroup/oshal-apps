        - document.export
        - document.read
    - id: office-read-selection-part
      allOf: [document.view, document.read]
    - id: office-collaborate-document
      allOf: [document.view, document.read]
    - id: office-list-shares
      allOf: [document.view, document.read]
    - id: office-share-document
      allOf: [document.view, document.read, document.change]
    - id: office-revoke-share
      allOf: [document.view, document.read, document.change]
  bots:
    - id: a0000000-0000-0000-0000-000000000042
      allOf:
        - document.view
