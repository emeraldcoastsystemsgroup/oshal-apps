<!doctype html><html lang="en" data-theme="light-blue"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Office</title><link rel="stylesheet" href="/shared/ui/css/surface-themes.css"><script src="/shared/ui/js/surface-theme.js"></script><link rel="stylesheet" href="/api/presentations/editor/assets/office.css"><link rel="stylesheet" href="/shared/ui/css/editor-foundation.css"></head><body>
<header id="office-header"><a href="/api/create/home" class="office-back">Create</a><label class="office-title-field"><span id="document-title-label">Presentation title</span><input id="document-title" aria-label="Document title" maxlength="120" value="Untitled document"></label><span id="document-kind" aria-label="Document format"></span><span id="save-state" role="status">Opening…</span><div class="office-file-actions"><div class="office-new-document" role="group" aria-label="Create a document"><label>Format<select id="new-kind" aria-label="New document type"><option value="pptx">PowerPoint</option><option value="docx">Word</option><option value="xlsx">Excel</option></select></label><button id="new-document">New</button></div><button id="generate-document" type="button">Generate</button>
<details id="office-file-menu" class="office-command-menu"><summary>File</summary><div class="office-menu-popover" role="group" aria-label="File commands"><button id="browse-documents">Your documents</button><button id="open-file">Open file</button><button id="save-copy">Save copy</button><button id="delete-document" class="danger">Delete document</button></div></details>
<button id="undo" class="office-icon-action" aria-label="Undo" title="Undo">↶</button><button id="redo" class="office-icon-action" aria-label="Redo" title="Redo">↷</button><button id="save-document" class="primary">Save</button>
<details id="office-export-menu" class="office-command-menu"><summary>Export</summary><div class="office-menu-popover office-menu-end" role="group" aria-label="Export formats"><button id="export-document">Office file</button><button id="export-json">Editable project</button></div></details>
</div></header>
<main id="office-root"><aside id="office-navigation"><details id="office-document-library"><summary>Your documents</summary><div id="document-list"></div><button id="refresh-documents">Refresh documents</button></details><h2 id="page-list-title">Slides</h2><nav id="page-list" aria-label="Document pages"></nav><div class="office-page-actions"><button id="add-page">Add slide</button><details class="office-command-menu" data-hide-empty="true"><summary>Page actions</summary><div class="office-menu-popover" role="group" aria-label="Page actions"><button id="remove-page">Remove slide</button><button id="move-page-up">Move earlier</button><button id="move-page-down">Move later</button></div></details></div><details class="office-object-library"><summary>Objects</summary><div id="object-list"></div></details><details><summary>Saved revisions</summary><select id="saved-revisions" aria-label="Saved revision"></select><button id="open-revision">View revision</button><button id="restore-revision">Restore as new revision</button></details><button id="download-original" hidden>Download original import</button><details id="office-previous-files" hidden><summary>Previous generated files</summary><button id="refresh-previous-files" type="button">Find previous files</button><p id="previous-files-status" role="status"></p><div id="previous-files-list"></div></details></aside>
<section id="office-viewport"><div id="insert-toolbar" role="toolbar" aria-label="Insert and arrange"><details id="office-insert-menu" class="office-command-menu" data-hide-empty="true"><summary>Insert</summary><div class="office-menu-popover" role="group" aria-label="Insert content"><button data-insert="text">Text box</button><button data-insert="rect">Rectangle</button><button data-insert="ellipse">Ellipse</button><button data-insert="image">Image</button><button data-insert="table">Table</button><button id="add-paragraph">Paragraph</button></div></details><details id="office-arrange-menu" class="office-command-menu" data-hide-empty="true"><summary>Arrange</summary><div class="office-menu-popover" role="group" aria-label="Arrange content"><button id="bring-forward">Bring forward</button><button id="send-backward">Send backward</button></div></details><button id="duplicate-item">Duplicate</button><button id="delete-item">Delete selected</button><label>Zoom<select id="zoom" aria-label="Document zoom"><option value="fit">Fit</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label></div><div id="sheet-formula" hidden><output id="cell-address">A1</output><input id="cell-value" aria-label="Cell value or formula" autocomplete="off"><button id="apply-cell">Apply</button></div><div id="sheet-window" hidden><button id="rows-earlier">Previous rows</button><button id="rows-later">Next rows</button><button id="columns-earlier">Previous columns</button><button id="columns-later">Next columns</button><output id="window-position"></output></div><div id="document-canvas" tabindex="0" aria-label="Editable document"></div><div id="canvas-help" role="status"></div></section>
<aside id="office-inspector"><h2>Page and document</h2><form id="page-settings"><label>Page width (pt)<input id="page-width" type="number" min="200" max="1440"></label><label>Page height (pt)<input id="page-height" type="number" min="200" max="1440"></label><div id="word-settings"><label>Top margin<input id="margin-top" type="number" min="0" max="200"></label><label>Right margin<input id="margin-right" type="number" min="0" max="200"></label><label>Bottom margin<input id="margin-bottom" type="number" min="0" max="200"></label><label>Left margin<input id="margin-left" type="number" min="0" max="200"></label><label>Header<input id="page-header" maxlength="1000"></label><label>Footer<input id="page-footer" maxlength="1000"></label></div><button>Apply page settings</button></form><section id="sheet-settings" hidden><label>Sheet name<input id="sheet-name" maxlength="31"></label><label>Rows<input id="sheet-rows" type="number" min="1" max="1000"></label><label>Columns<input id="sheet-columns" type="number" min="1" max="100"></label><button id="apply-sheet">Apply sheet settings</button><button id="add-row">Add row</button><button id="add-column">Add column</button></section><p id="format-note">Native editable Office file export.</p></aside>
<section id="office-ai"><h2>Concierge</h2><p id="ai-context">Works with this saved document, its revision and selected objects.</p><div id="ai-log" aria-live="polite"></div><form id="ai-form"><label>Ask for a change<textarea id="ai-message" rows="4" required placeholder="Make the selected heading blue and larger"></textarea></label><button id="ai-send">Send</button></form></section></main>
<p id="office-status" role="status" aria-live="polite"></p><input id="office-file" type="file" accept=".pptx,.docx,.xlsx,.json" hidden><input id="image-file" type="file" accept="image/png,image/jpeg" hidden>
<dialog id="import-review"><h2>Review Office import</h2><p id="import-summary"></p><ul id="import-findings"></ul><label id="conversion-choice"><input id="accept-conversion" type="checkbox">Create an editable conversion with these findings. Keep the exact original separately.</label><button id="confirm-import">Import editable copy</button><button id="cancel-import">Cancel</button></dialog>
<script type="module" src="/api/presentations/editor/assets/controller.mjs"></script></body></html>
