<!doctype html>
<!-- CHANGE LOG
1 | maintainer@emeraldcoastsystemsgroup.com | Direct structured Office editing: one page with the document, its pages, its properties and the Concierge.
2 | maintainer@emeraldcoastsystemsgroup.com | 2.19.0, the oshal design standard (docs/ux/design-standard.md §3, §4, §5.1; Google Docs, Word and ONLYOFFICE, REFP CONVENTIONS §5.1). The page declares its contract (an editor whose first action is typing; the document canvas is the work). One app row: Back to your documents, the document's name and its menu, Undo, Redo, then Save while there is something to save and Export, the one primary, once there is content. The Format select and the Create and Generate bar are gone: New lives in the document menu and on your documents, Generate in Insert and the Concierge. Every menu and sheet is built by design.mjs as an opaque top-layer layer; the commands below stay as the hidden buttons those layers press, so every guard keeps working. Help text leaves the canvas for More > Help.
3 | maintainer@emeraldcoastsystemsgroup.com | 2.20.0 (RP-OFF-05): add `#export-pdf` and `#export-txt` command targets for the Export sheet.
-->
<html lang="en" data-theme="light-blue" data-ds-category="editor" data-ds-first-action="type"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Office</title><link rel="stylesheet" href="/shared/ui/css/surface-themes.css"><script src="/shared/ui/js/surface-theme.js"></script><link rel="stylesheet" href="/shared/ui/css/editor-foundation.css"><link rel="stylesheet" href="/api/presentations/editor/assets/office.css"></head><body>
<header id="office-header"><button id="office-back" class="office-icon-action" type="button" aria-label="Your documents" title="Your documents"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="office-name"><button id="document-name" type="button" aria-haspopup="dialog"><span class="office-name-line"><span id="document-name-text">Untitled document</span><span class="office-caret" aria-hidden="true">▾</span></span><span id="save-state" role="status">Opening…</span></button></div><span id="document-kind" hidden></span><button id="undo" class="office-icon-action" type="button" aria-label="Undo" title="Undo">↶</button><button id="redo" class="office-icon-action" type="button" aria-label="Redo" title="Redo">↷</button><div id="office-desktop-tools" class="office-desktop-tools" role="group" aria-label="Document tools"></div><div class="office-finish"><button id="save-document" type="button">Save</button><button id="office-export" class="primary" type="button" aria-haspopup="dialog">Export</button><button id="office-edit" class="primary" type="button" hidden>Edit</button></div></header>
<main id="office-root"><aside id="office-navigation"><div class="office-pane-head"><h2 id="page-list-title">Slides</h2></div><nav id="page-list" aria-label="Document pages"></nav><div class="office-page-actions"><button id="add-page" type="button">Add slide</button><button id="office-page-menu" type="button" class="office-icon-action" aria-label="Page actions" title="Page actions" aria-haspopup="dialog">⋯</button></div></aside>
<section id="office-viewport"><section id="office-home" hidden aria-labelledby="office-home-title"><h2 id="office-home-title">Your documents</h2><div id="office-home-list" class="office-home-list"></div><button id="office-home-new" class="primary office-home-new" type="button" aria-haspopup="dialog" data-ef-floating>+ New</button></section><div id="sheet-formula" hidden><output id="cell-address">A1</output><input id="cell-value" aria-label="Cell value or formula" autocomplete="off"><button id="apply-cell" type="button">Apply</button></div><div id="sheet-window" hidden><button id="rows-earlier" type="button">Previous rows</button><button id="rows-later" type="button">Next rows</button><button id="columns-earlier" type="button">Previous columns</button><button id="columns-later" type="button">Next columns</button><output id="window-position"></output></div><div id="document-canvas" tabindex="0" aria-label="Editable document" data-ds-work></div></section>
<aside id="office-inspector"><section id="office-doc-summary" aria-labelledby="office-doc-summary-title"><h3 id="office-doc-summary-title">Page</h3><dl id="office-doc-facts"></dl><button id="open-page-setup" type="button" aria-haspopup="dialog">Page setup…</button></section></aside>
<section id="office-ai"><h2>Concierge</h2><p id="ai-context">Works with this saved document, its revision and selected objects.</p><div id="ai-log" aria-live="polite"></div><form id="ai-form"><label>Ask for a change<textarea id="ai-message" rows="4" required placeholder="Make the selected heading blue and larger"></textarea></label><button id="ai-send">Send</button></form></section></main>
<p id="office-status" class="office-sr-only" role="status" aria-live="polite"></p>
<div id="office-commands" hidden>
<input id="document-title" aria-label="Document name" maxlength="120" value="Untitled document">
<button id="browse-documents" type="button">Your documents</button><button id="open-file" type="button">Open a file…</button><button id="save-copy" type="button">Duplicate</button><button id="delete-document" type="button" class="danger">Delete document</button><button id="export-document" type="button">Office file</button><button id="export-pdf" type="button">PDF</button><button id="export-txt" type="button">Plain text</button><button id="export-json" type="button">Editable project</button><button id="generate-document" type="button">Generate a draft</button>
<div id="insert-toolbar"><button data-insert="text" type="button">Text box</button><button data-insert="rect" type="button">Rectangle</button><button data-insert="ellipse" type="button">Ellipse</button><button data-insert="image" type="button">Image</button><button data-insert="table" type="button">Table</button><button id="add-paragraph" type="button">Paragraph</button><button id="bring-forward" type="button">Bring forward</button><button id="send-backward" type="button">Send backward</button><button id="duplicate-item" type="button">Duplicate</button><button id="delete-item" type="button">Delete selected</button><label>Zoom<select id="zoom" aria-label="Zoom"><option value="fit">Fit</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label></div>
<button id="remove-page" type="button">Remove slide</button><button id="move-page-up" type="button">Move earlier</button><button id="move-page-down" type="button">Move later</button>
<div id="document-list"></div><button id="refresh-documents" type="button">Refresh documents</button>
<div id="object-list"></div>
<div id="office-revisions"><label>Saved revision<select id="saved-revisions" aria-label="Saved revision"></select></label><button id="open-revision" type="button">View revision</button><button id="restore-revision" type="button">Restore as new revision</button></div>
<button id="download-original" type="button" hidden>Download original import</button>
<div id="office-previous-files" hidden><button id="refresh-previous-files" type="button">Find previous files</button><p id="previous-files-status" role="status"></p><div id="previous-files-list"></div></div>
<div id="office-page-setup"><form id="page-settings"><label>Page width (pt)<input id="page-width" type="number" min="200" max="1440"></label><label>Page height (pt)<input id="page-height" type="number" min="200" max="1440"></label><div id="word-settings"><label>Top margin<input id="margin-top" type="number" min="0" max="200"></label><label>Right margin<input id="margin-right" type="number" min="0" max="200"></label><label>Bottom margin<input id="margin-bottom" type="number" min="0" max="200"></label><label>Left margin<input id="margin-left" type="number" min="0" max="200"></label><label>Header<input id="page-header" maxlength="1000"></label><label>Footer<input id="page-footer" maxlength="1000"></label></div><button>Apply page settings</button></form><section id="sheet-settings" hidden><label>Sheet name<input id="sheet-name" maxlength="31"></label><label>Rows<input id="sheet-rows" type="number" min="1" max="1000"></label><label>Columns<input id="sheet-columns" type="number" min="1" max="100"></label><button id="apply-sheet" type="button">Apply sheet settings</button><button id="add-row" type="button">Add row</button><button id="add-column" type="button">Add column</button></section></div>
<p id="canvas-help"></p>
</div>
<input id="office-file" type="file" accept=".pptx,.docx,.xlsx,.json" hidden><input id="image-file" type="file" accept="image/png,image/jpeg" hidden>
<dialog id="import-review" data-ds-sheet><h2>Review Office import</h2><p id="import-summary"></p><ul id="import-findings"></ul><label id="conversion-choice"><input id="accept-conversion" type="checkbox">Create an editable conversion with these findings. Keep the exact original separately.</label><div class="office-dialog-actions"><button id="cancel-import" type="button">Cancel</button><button id="confirm-import" class="primary" type="button">Import editable copy</button></div></dialog>
<script type="module" src="/api/presentations/editor/assets/controller.mjs"></script></body></html>
