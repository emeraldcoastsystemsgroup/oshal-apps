<script>
(function () {
  var A = window.AppView; if (!A) return;
  var KICKER = 'Creative · Create';
  var LEDE = 'Say what you are making (a resume, a budget, a launch deck, a headshot, a short video) and Create opens the studio that owns it, already set up. Your own image projects are listed here; looking starts nothing.';
  var AUDIENCE_STUDIOS = [
    ['AI Office', 'Presentations, documents and spreadsheets'], ['Portrait Studio', 'Headshots and character portraits'], ['Video Studio', 'Short videos and the manual timeline editor'], ['Vids Studio', 'Clips rendered on your own worker'], ['Stories', 'Kid-safe animated episodes'], ['3D Scan-to-Print', 'Printable objects from photos'], ['CAD Studio', 'Parametric parts and editable dimensions'], ['LoRA Studio', 'Characters, training images and captions'], ['Image editor', 'Layered image designs']
  ];
  var REFUSALS = { 401: 'Sign in to see your projects.', 403: 'Create is not available to this account.' };
  function read() {
    return fetch('/api/create/home-summary', { credentials: 'same-origin', cache: 'no-store', headers: { Accept: 'application/json' } }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, body: j && typeof j === 'object' ? j : {} }; });
    }, function () { return { ok: false, status: 0, body: {} }; });
  }
  function openFull() { window.location.assign(window.location.pathname); }
  function count(v) { return typeof v === 'string' && /^\d+$/.test(v.trim()) ? Number(v) : null; }
  function project(item) {
    var d = String(item.detail || ''), at = d.indexOf(' · updated '), when = at < 0 ? '' : d.slice(at + 11), a = Array.isArray(item.actions) ? item.actions[0] : null;
    var q = a && typeof a.query === 'string' && /^project=[A-Za-z0-9-]+$/.test(a.query) ? a.query : '';
    return { title: String(item.text || 'Untitled project'), text: at < 0 ? d : d.slice(0, at), meta: /^\d{4}-\d{2}-\d{2}T/.test(when) ? 'Updated ' + A.when(when) : '', href: q ? '/api/create/editor?' + q : undefined };
  }
  function refusal(res) {
    var why = REFUSALS[res.status] || (res.status ? 'Your projects cannot be checked right now (HTTP ' + res.status + ').' : 'Create could not be reached.');
    return { kicker: KICKER, title: 'Your projects are not available right now', lede: why + ' No figure is shown in its place.', actions: [{ label: 'Open Create', primary: true, onClick: openFull }] };
  }
  function family() {
    return read().then(function (res) {
      if (!res.ok) return refusal(res);
      var items = Array.isArray(res.body.items) ? res.body.items : [], metrics = Array.isArray(res.body.metrics) ? res.body.metrics : [], m = metrics[0] || null, n = m ? count(m.value) : null;
      return { kicker: KICKER, title: n === null ? 'Your image projects' : n === 0 ? 'No image projects yet' : n + ' image project' + (n === 1 ? '' : 's'), lede: LEDE,
        actions: [{ label: 'Open Create', primary: true, onClick: openFull }],
        stats: m ? [{ id: 'image-projects', label: String(m.label || 'Image projects'), value: m.value, tone: n > 0 ? 'ok' : null, hint: n === null ? 'Could not be checked' : null }] : [],
        sections: [{ kind: 'list', id: 'projects', title: 'Your image projects', wide: true, note: items.length ? 'Newest first. Each opens in the image editor.' : 'Nothing saved yet. Open Create to start one.', items: items.map(project) }, { kind: 'list', id: 'studios', title: 'What Create can open', wide: true, items: AUDIENCE_STUDIOS.map(function (s) { return { title: s[0], text: s[1] }; }) }] };
    });
  }
  A.boot({ app: 'create', escapeLabel: 'Open Create in the cockpit', audiences: { family: family, company: family } });
})();
</script>

    var sheet = el('div', 'mock sheet'), tb = firstTable(st.outline), rows = tb.length ? tb : [['Label', 'Value']].concat(firstSeries(st.outline)).concat([['Total', '=SUM']]);
    rows.slice(0, 5).forEach(function (r, i) { var row = el('div', i ? 'r' + (i === rows.length - 1 && !tb.length ? ' tot' : '') : 'hd'); r.forEach(function (c) { row.appendChild(el('span', null, c)); }); sheet.appendChild(row); });
    return sheet;
  }
  function preview(st) {
    var t = titlesOf(st.outline);
    if (st.kind === 'xlsx') return sheetPreview(st);
    if (st.kind === 'docx') {
      var page = el('div', 'mock page'); page.appendChild(el('div', 't'));
      t.slice(0, 4).forEach(function (h) { page.appendChild(el('div', 'h', h)); page.appendChild(el('div', 'l')); });
      return page;
    }
    var slide = el('div', 'mock slide'); slide.appendChild(el('div', 't'));
    var cols = el('div', 'cols'), left = el('div', 'col'), right = el('div', 'col');
    t.slice(0, 3).forEach(function (h) { left.appendChild(el('div', 'h', h)); left.appendChild(el('div', 'l')); });
    right.style.display = 'flex'; right.style.alignItems = 'flex-end'; right.style.gap = '3px'; right.style.height = '34px';
    [10, 18, 26, 22].forEach(function (hgt) { var b = el('div', 'bar'); b.style.height = hgt + 'px'; b.style.flex = '1'; right.appendChild(b); });
    cols.appendChild(left); cols.appendChild(right); slide.appendChild(cols);
    return slide;
  }
  function otherPreview(item) {
    if (item.preview === 'design') { var design = el('div', 'mock design'); design.appendChild(svgNode('<svg viewBox="0 0 160 90" aria-hidden="true"><rect x="12" y="13" width="44" height="6" fill="#bef264"/><rect x="12" y="32" width="110" height="10" fill="#ffffff"/><rect x="12" y="49" width="86" height="10" fill="#ffffff"/><circle cx="137" cy="75" r="29" fill="#a78bfa"/></svg>')); return design; }
    if (item.preview === 'cube') { var model = el('div', 'mock photo cube'); model.appendChild(svgNode('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10"/></svg>')); return model; }
    if (item.preview === 'photo') { var p = el('div', 'mock photo'); p.appendChild(svgNode('<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="30" r="14" fill="#7d2ae8"/><path d="M12 76c3-18 15-24 28-24s25 6 28 24" fill="#a259ff"/></svg>')); return p; }
    var ph = el('div', 'mock phone'); var sc = el('div', 'screen'); sc.appendChild(svgNode('<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M8 6l10 6-10 6z"/></svg>')); ph.appendChild(sc); return ph;
  }

  /* ── State of the sheet ── */
  var KINDS = [], STARTERS = [], activeCat = 'foryou', activeGroup = 'all', tquery = '';
  function kindOf(id) { for (var i = 0; i < KINDS.length; i++) if (KINDS[i].id === id) return KINDS[i]; return null; }
  function groupLabel(kindId, groupId) { var k = kindOf(kindId); if (!k || !Array.isArray(k.groups)) return groupId; for (var i = 0; i < k.groups.length; i++) if (k.groups[i].id === groupId) return k.groups[i].label; return groupId; }
  function officeQuery(st) { return 'kind=' + encodeURIComponent(st.kind) + '&starter=' + encodeURIComponent(st.id) + '&theme=' + encodeURIComponent(st.theme || ''); }
  var BADGE = { pptx: 'Slides', docx: 'Document', xlsx: 'Spreadsheet' };

  /* Every template, normalised: image designs first, then the Office starters, then the other studios. */
  function allCards() {
    var other = OTHER.map(function (o) { var s = byTool[o.tool]; return { id: 'other-' + o.id, cat: o.cat, group: o.group, groupLabel: o.groupLabel, name: o.name, desc: o.desc, badge: s.name, tint: TINT[o.cat], tool: o.tool, app: s.app, query: o.query || '', other: o }; });
    var office = STARTERS.map(function (st) { return { id: 'office-' + st.id, cat: st.kind, group: st.group, groupLabel: groupLabel(st.kind, st.group), name: st.name, desc: st.desc, icon: st.icon, badge: BADGE[st.kind], tint: TINT[st.kind], tool: 'create-office', app: 'presentations', query: officeQuery(st), st: st }; });
    return other.filter(function (c) { return c.cat === 'image'; }).concat(office, other.filter(function (c) { return c.cat !== 'image'; }));
  }
  function cardText(c) { return (c.name + ' ' + c.desc + ' ' + c.groupLabel + ' ' + c.cat).toLowerCase(); }
  function cardNode(c) {
    var access = ACCESS[c.app], studio = byTool[c.tool];   // undefined until the probe answers: no badge, still opens
    var b = el(access === 'locked' ? 'div' : 'button', 'card' + (access === 'locked' ? ' locked' : '')); b.dataset.q = cardText(c); b.title = c.desc;
    if (access !== 'locked') b.type = 'button';
    var pv = el('span', 'pv t-' + c.tint); pv.appendChild(el('span', 'badge', c.badge)); if (c.icon) pv.appendChild(el('span', 'icon', c.icon));
    pv.appendChild(c.st ? preview(c.st) : otherPreview(c.other));
    if (access === 'locked') pv.appendChild(el('span', 'lock', '🔒 Not provisioned'));
    else if (access === 'unknown') pv.appendChild(el('span', 'lock unknown', 'Access: can’t check'));
    b.appendChild(pv); b.appendChild(el('span', 'name', c.name));
    if (access === 'locked') {   // a card, not a button: its Access link is the one thing to press
      b.setAttribute('aria-label', c.name + ' — not provisioned: ' + studio.name + ' is not assigned to you');
      b.setAttribute('aria-disabled', 'true'); b.appendChild(accessLink(c.app));
      b.addEventListener('click', function () { toast(studio.name + ' is not assigned to you — an administrator grants it in Access.'); });
      return b;
    }
    b.setAttribute('aria-label', c.name + ' — ' + c.desc);
    b.addEventListener('click', function () { if (go(c.tool, c.query)) closeNew(true); });
    return b;
  }
  function blankNode(blank) {
    var studio = byTool[blank.tool], locked = ACCESS[studio.app] === 'locked';
    var b = el('button', 'blank' + (locked ? ' locked' : '')); b.type = 'button'; b.dataset.blank = blank.id;
    var thumb = el('span', 'bthumb t-' + blank.tint); thumb.appendChild(svgNode(art(blank.art)));
    if (locked) thumb.appendChild(el('span', 'lockdot', '🔒'));
    b.appendChild(thumb); b.appendChild(el('b', null, blank.label)); b.appendChild(el('span', 'hint', blank.hint));
    b.setAttribute('aria-label', 'Blank ' + blank.label.toLowerCase() + ' — opens ' + studio.name + (locked ? ', not assigned to you' : ''));
    if (locked) b.setAttribute('aria-disabled', 'true');
    b.addEventListener('click', function () { if (go(blank.tool, blank.query || '')) closeNew(true); });
    return b;
  }
  var blankRow = document.getElementById('blankRow'), customForm = document.getElementById('customSizeForm');
  var customW = document.getElementById('customWidth'), customH = document.getElementById('customHeight'), customErr = document.getElementById('customSizeError');
  function renderBlanks() {
    blankRow.replaceChildren();
    BLANKS.forEach(function (blank) { blankRow.appendChild(blankNode(blank)); });
    var locked = ACCESS.create === 'locked';
    var custom = el('button', 'blank' + (locked ? ' locked' : '')); custom.type = 'button'; custom.dataset.blank = 'custom';
    var thumb = el('span', 'bthumb t-lilac'); thumb.appendChild(svgNode('<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 15v5h-5M4 4l7 7M20 20l-7-7"/></svg>'));
    if (locked) thumb.appendChild(el('span', 'lockdot', '🔒'));
    custom.appendChild(thumb); custom.appendChild(el('b', null, 'Custom size')); custom.appendChild(el('span', 'hint', '16 – 8192 px'));
    custom.setAttribute('aria-label', 'Custom size — opens Image editor' + (locked ? ', not assigned to you' : ''));
    custom.setAttribute('aria-expanded', customForm.hidden ? 'false' : 'true');
    if (locked) custom.setAttribute('aria-disabled', 'true');
    custom.addEventListener('click', function () {
      if (locked) { toast('Image editor is not assigned to you — an administrator grants it in Access.'); return; }
      customForm.hidden = !customForm.hidden; customErr.hidden = true;
      custom.setAttribute('aria-expanded', customForm.hidden ? 'false' : 'true');
      if (!customForm.hidden) { customW.focus(); customW.select(); }
    });
    blankRow.appendChild(custom);
  }
  document.getElementById('customSizeCancel').addEventListener('click', function () { customForm.hidden = true; customErr.hidden = true; renderBlanks(); });
  customForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var parsed = parseCustomSize(customW.value, customH.value);
    if (!parsed.ok) { customErr.textContent = parsed.message; customErr.hidden = false; return; }
    customErr.hidden = true;
    if (go('create-editor', parsed.query)) closeNew(true);
  });

  var importIn = document.getElementById('importInput'), importBox = document.getElementById('importBox');
  function resetImportUi() { importBox.hidden = true; importIn.value = ''; if (actionsPromise) void actionsPromise.then(function (C) { C.resetImport(); }); }
  document.getElementById('importFile').addEventListener('click', function () { void loadController(); importIn.click(); });
  importIn.addEventListener('change', function () {
    var f = this.files && this.files[0]; if (!f) return;
    loadController().then(function (C) { C.runImport(f, {}); });
  });

  /* ── Render the template half ── */
  var catsEl = document.getElementById('cats'), chipsEl = document.getElementById('chips'), secEl = document.getElementById('sections');
  function renderCats() {
    catsEl.replaceChildren();
    var cards = allCards();
    CATEGORIES.forEach(function (c) {
      var b = el('button', 'cat'); b.type = 'button'; b.dataset.cat = c.id; b.setAttribute('aria-pressed', c.id === activeCat ? 'true' : 'false');
      var n = c.id === 'foryou' ? cards.length : cards.filter(function (x) { return x.cat === c.id; }).length;
      b.appendChild(el('span', 'n', c.name)); b.appendChild(el('span', 'c', n));
      b.addEventListener('click', function () { activeCat = c.id; activeGroup = 'all'; renderTemplates(); catsEl.querySelector('[aria-pressed="true"]').focus({ preventScroll: true }); });
      catsEl.appendChild(b);
    });
  }
  function groupsFor(cat) {
    if (cat === 'foryou') return [];
    var seen = {}, out = [];
    allCards().filter(function (c) { return c.cat === cat; }).forEach(function (c) { if (!seen[c.group]) { seen[c.group] = true; out.push({ id: c.group, label: c.groupLabel }); } });
    return out;
  }
  function renderChips() {
    chipsEl.replaceChildren();
    var groups = groupsFor(activeCat); if (groups.length < 2) return;
    [{ id: 'all', label: 'Everything' }].concat(groups).forEach(function (g) {
      var b = el('button'); b.type = 'button'; b.setAttribute('aria-pressed', g.id === activeGroup ? 'true' : 'false');
      var sw = el('span', 'sw'); sw.style.background = g.id === 'all' ? 'var(--gradient)' : (SWATCH[g.id] || 'var(--accent)'); b.appendChild(sw); b.appendChild(el('span', null, g.label));
      b.addEventListener('click', function () { activeGroup = g.id; renderTemplates(); chipsEl.querySelector('[aria-pressed="true"]').focus({ preventScroll: true }); });
      chipsEl.appendChild(b);
    });
  }
  function section(title, sub, cards) {
    var s = el('section', 'sec'); if (title) s.appendChild(el('h4', null, title)); if (sub) s.appendChild(el('p', 'sub', sub));
    var g = el('div', 'tgrid'); cards.forEach(function (c) { g.appendChild(cardNode(c)); }); s.appendChild(g); return s;
  }
  function noMatch() {
    var box = el('div', 'nomatch'); box.appendChild(el('b', null, 'No templates match'));
    box.appendChild(el('span', null, 'Try another word, or clear the search and the format.'));
    var clear = el('button', 'btn2', 'Clear'); clear.type = 'button'; clear.id = 'tplReset';
    clear.addEventListener('click', function () { tquery = ''; tqEl.value = ''; activeCat = 'foryou'; activeGroup = 'all'; renderTemplates(); tqEl.focus(); });
    box.appendChild(clear); return box;
  }
  function renderSections() {
    secEl.replaceChildren();
    var q = tquery.trim().toLowerCase(), k = kindOf(activeCat);
    var mine = allCards().filter(function (c) {
      return (activeCat === 'foryou' || c.cat === activeCat) && (activeGroup === 'all' || c.group === activeGroup) && (!q || cardText(c).indexOf(q) !== -1);
    });
    document.getElementById('tplSearchForm').classList.toggle('has-q', q.length > 0);
    if (!mine.length) { secEl.appendChild(noMatch()); return; }
    if (q || activeCat === 'foryou' || activeGroup !== 'all') {
      secEl.appendChild(section(q ? matchWords(mine.length) : '', activeGroup !== 'all' && k ? 'Opens in ' + k.opens + '.' : '', mine)); return;
    }
    groupsFor(activeCat).forEach(function (g) {
      var own = mine.filter(function (c) { return c.group === g.id; });
      if (own.length) secEl.appendChild(section(g.label, k ? 'Opens in ' + k.opens + '.' : '', own));
    });
  }
  function renderTemplates() { renderCats(); renderChips(); renderSections(); }
  function renderSheet() { renderBlanks(); renderTemplates(); }

  var tqEl = document.getElementById('tq');
  tqEl.addEventListener('input', function () { tquery = tqEl.value; renderSections(); });
  document.getElementById('tplClear').addEventListener('click', function () { tquery = ''; tqEl.value = ''; renderSections(); tqEl.focus(); });
  document.getElementById('tplSearchForm').addEventListener('submit', function (e) { e.preventDefault(); var first = secEl.querySelector('.card'); if (first) first.click(); });

  /* ── Open and close: a sheet on a phone, a dialog on desktop; Back, Escape, the scrim and Done close it ── */
  var sheet = document.getElementById('newSheet'), sheetPushed = false;
  function openNew(opts) {
    opts = opts || {};
    customForm.hidden = true; customErr.hidden = true; resetImportUi();
    if (opts.cat && CATEGORIES.some(function (c) { return c.id === opts.cat; })) { activeCat = opts.cat; activeGroup = 'all'; }
    if (typeof opts.query === 'string') { tquery = opts.query; tqEl.value = opts.query; }
    renderSheet();
    if (!sheet.open) sheet.showModal();
    if (!sheetPushed) { try { history.pushState({ createNew: true }, ''); sheetPushed = true; } catch (_) { /* no history in this frame */ } }
    var first = blankRow.querySelector('.blank:not(.locked)'); if (first && !opts.query) first.focus({ preventScroll: true }); else tqEl.focus();
  }
  /** @param {boolean} leaving A studio opens next: keep the history entry, the navigation replaces it. */
  function closeNew(leaving) {
    if (sheet.open) sheet.close();
    if (sheetPushed && !leaving) { sheetPushed = false; history.back(); } else sheetPushed = false;
    document.getElementById('newBtn').focus({ preventScroll: true });
  }
  window.addEventListener('popstate', function () { sheetPushed = false; if (sheet.open) sheet.close(); });
  sheet.addEventListener('cancel', function (e) { e.preventDefault(); closeNew(false); });
  sheet.addEventListener('click', function (e) { if (e.target === sheet) closeNew(false); });
  document.getElementById('newDone').addEventListener('click', function () { closeNew(false); });
  document.getElementById('newBtn').addEventListener('click', function () { openNew({}); });

  /* ── The shell's assistant orb rests above --oshal-app-bottom-inset on a phone (cockpit jarvis-orb.js, the same
     contract the shared editor reports its pane bar through), so Home reports New's top edge and the orb sits above
     New instead of on it. Removed again when Home goes away. ── */
  function orbInset(viewHeight, frameTop, fabTop) { return Math.max(0, Math.round(viewHeight - (frameTop + fabTop) - 4)); }
  function clearOrb() {
    try {
      var outer = window.parent !== window ? window.parent.document.documentElement : null, frame = window.frameElement;
      var fab = document.getElementById('newBtn');
      if (!outer || !frame) return;
      var box = fab ? fab.getBoundingClientRect() : null;   // New is position:fixed, so offsetParent is always null
      if (!box || !box.height) { outer.style.removeProperty('--oshal-app-bottom-inset'); return; }
      var inset = orbInset(window.parent.innerHeight, frame.getBoundingClientRect().top, box.top);
      outer.style.setProperty('--oshal-app-bottom-inset', inset + 'px');
    } catch (_) { /* a standalone or cross-origin open has no orb to move */ }
  }
  clearOrb();
  window.addEventListener('resize', clearOrb);
  window.addEventListener('load', clearOrb);
  window.addEventListener('pagehide', function () { try { window.parent.document.documentElement.style.removeProperty('--oshal-app-bottom-inset'); } catch (_) { /* no shell */ } });
  (function swipeDown() {
    var y0 = null, grip = document.getElementById('sheetHead'), handle = document.getElementById('sheetHandle');
    [grip, handle].forEach(function (n) {
      n.addEventListener('pointerdown', function (e) { if (e.pointerType !== 'mouse') y0 = e.clientY; });
      n.addEventListener('pointerup', function (e) { if (y0 !== null && e.clientY - y0 > 80) closeNew(false); y0 = null; });
    });
  })();

  /* ── The Office catalog, from the owning app ── */
  function loadStarters() {
    return fetchJson('/api/presentations/sections/starters', 4000).then(function (cat) {
      KINDS = Array.isArray(cat.kinds) ? cat.kinds : [];
      STARTERS = (Array.isArray(cat.starters) ? cat.starters : []).filter(function (s) { return s && /^[a-z0-9-]+$/.test(String(s.id)) && /^(pptx|docx|xlsx)$/.test(String(s.kind)); });
      renderTemplates(); applyFilters();
    }).catch(function () {
      KINDS = []; STARTERS = [];   // the Blank row still opens every Office kind
      if (sheet.open) toast('AI Office templates could not be loaded — Blank still opens each studio.');
    });
  }
  /** Access answers re-draw what depends on them: locks on blanks and template cards. */
  function applyAccess() { if (sheet.open) renderSheet(); else renderBlanks(); }

  /* An address can open New directly: /api/create/home?new=1[&cat=docx] (the old /api/create/new forwards here). */
  function openFromAddress() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('new') !== '1') return;
    var cat = params.get('cat'); params.delete('new'); params.delete('cat');
    try { history.replaceState(history.state, '', window.location.pathname + (params.toString() ? '?' + params.toString() : '') + window.location.hash); } catch (_) { /* address stays */ }
    openNew({ cat: cat || '' });
  }

  // Audience view (ADR-164 D6): under a view the page starts nothing; without one, or on a core without the kit, it starts as before.
  if (!window.AppView || !AppView.active()) {
  renderBlanks();
  loadStarters();
  openFromAddress();
  Promise.all(STUDIOS.map(function (s) { return accessFor(s.app).then(function (state) { ACCESS[s.app] = state; }); })).then(function () {
    applyAccess();
    openIncomingArtifact();
    loadProfile();
    loadSummaries();
    loadBrandCard();
  });
  }
})();
