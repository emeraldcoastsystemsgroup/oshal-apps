<!doctype html>
<!--
  Create — the home page of the Create studio: your work first, one New at the bottom right.
  Served by create-routes at /api/create/home. Self-contained: no CDN scripts,
  no inline event handlers, cockpit-iframe friendly.

  Everything it shows is real: "Continue creating" and "This week" come from each member
  studio's Home summary probe (GET /api/<app>/home-summary), asked here in the signed-in
  user's own session — never impersonated, never cached server-side. A probe that fails or
  times out renders "can't check", not a zero. A saved Create image is drawn by the image
  editor's own renderer from the person's own project (GET /api/create/projects/<id>); every
  other studio's card is a tinted cover with the studio glyph and the title, because no
  member summary carries a picture.

  The New sheet (phone) or dialog (desktop) is the former New screen (/api/create/new now
  forwards here with ?new=1): a Blank row first, each opening a blank ready document in the
  studio that owns it, then templates with search and one row of format chips. The Office
  templates come from AI Office's OWN starter catalog (GET /api/presentations/sections/starters).

  Navigation speaks the ribbon's `app-navigate` dialect (postMessage to the
  cockpit shell); opened standalone, a card falls back to the studio's own URL.

  Framed with ?audience=family|company (the shells, ADR-164 D6) the page paints the shared
  kit's read-only card of the person's own image projects instead and starts nothing else.

  CHANGE LOG
  -----------------------------------------------------------------------------
  SEQ | AUTHOR                                      | DESCRIPTION
  -----------------------------------------------------------------------------
  1   | maintainer@emeraldcoastsystemsgroup.com     | Initial home surface — hero, search, starters, continue creating, studios, this week
  2   | maintainer@emeraldcoastsystemsgroup.com     | Unwrap the profile envelope ({ profile: {...} }) — the studios row rendered its empty state against the live api
  3   | maintainer@emeraldcoastsystemsgroup.com     | Starters open their studio on a purpose (app-navigate + query: kind=pptx|docx|xlsx); See every template → the New screen
  4   | maintainer@emeraldcoastsystemsgroup.com     | Authorization-aware: access asked first (GET /api/authorization/me?app=); a locked studio never opens and its probes are never asked
  5   | maintainer@emeraldcoastsystemsgroup.com     | Follow the portal palette and live parent changes while retaining the bundled Create skin when application colors are enabled.
  6   | maintainer@emeraldcoastsystemsgroup.com     | Compact recent-first workspace, responsive starter grid, keyboard section focus and search handoff parity.
  7   | maintainer@emeraldcoastsystemsgroup.com     | Add 3D Scan-to-Print to studios, quick starts and owner-scoped summary discovery through existing access checks.
  8   | maintainer@emeraldcoastsystemsgroup.com     | Open owned editable images with saved-project context and omit launcher aliases from studio cards.
  9   | maintainer@emeraldcoastsystemsgroup.com     | Forward admitted image artifact handoffs to the editor while keeping ordinary Home visits unchanged.
  10  | maintainer@emeraldcoastsystemsgroup.com     | Your brand band: the saved brand kit's swatches, fonts and logo (or a setup prompt), read only after Create access is open.
  11  | maintainer@emeraldcoastsystemsgroup.com     | Add Video Studio's manual timeline editor as its own studio card and an Edit video quick start (CREATE-EDIT-05d). It shares Video Studio's access answer and summary, so its catalog entry is marked summary: false and is never probed twice.
  12  | maintainer@emeraldcoastsystemsgroup.com     | Add Brand Graphics as a studio card and a Brand intro clip quick start; both open the brand-graphics package's own review page, behind the same access check as every studio.
  13  | maintainer@emeraldcoastsystemsgroup.com     | Add the existing CAD editor, parametric-model quick start and owner summary behind the studio access checks.
  14  | maintainer@emeraldcoastsystemsgroup.com     | UX audit 2026-11-06 (create--create-home FIX-LAYOUT, create--create-new MERGE): the first screen is your work as picture cards, newest first (a real render for saved images, a tinted cover with the studio glyph elsewhere), with skeletons while the studios answer, meta in words ("Image editor · 2 days ago", "Built · revision 1") and a tap that opens; ⋯ holds Open plus greyed Rename/Duplicate/Delete placeholders. One New at the bottom right opens the merged New sheet/dialog: a Blank row first (each a real blank start in its studio), greyed Custom size and Import a file, then templates with search, one row of 44px format chips and "No templates match" + Clear. Search sits in the app row (behind an icon on a phone) over work and templates; "Set up your brand" is one 44px row only while no kit exists; the hero, the section pills, the quick-start grid and the studios grid are gone (the rail lists the studios). Home is now Create's first surface, so the family/company audience view moves here from the New page unchanged (its studio list renamed AUDIENCE_STUDIOS) and the full start is gated on the kit's decision.
  15  | maintainer@emeraldcoastsystemsgroup.com     | A start access refuses keeps the New sheet open (go() says whether it opened); a locked template is a card, not a button, so its Access link stays pressable; the 3D template preview keeps its stroke cube on the light gradient for contrast; a saved image's picture is contained in its card, never cropped.
  16  | maintainer@emeraldcoastsystemsgroup.com     | UX audit 2026-11-06 (create--create-new): the Blank row's image start is two sized blanks, Image 1080 × 1080 and Image 1920 × 1080, each opening the editor's blank canvas at that size (?size=).
  17  | maintainer@emeraldcoastsystemsgroup.com     | The trial check (visitor seat, 412x915): the shell's orb sat on New's right half. Home now reports New's top edge to the shell as --oshal-app-bottom-inset (the contract the shared editor already uses for its pane bar), so the orb rests above New on a phone; the property is removed when Home goes away.
  19  | maintainer@emeraldcoastsystemsgroup.com     | The trial re-check: the orb still sat on New, because New is position:fixed and a fixed element's offsetParent is always null, so clearOrb removed the inset every time. It now reads New's box (a zero height means hidden) and runs again on load.
  20  | maintainer@emeraldcoastsystemsgroup.com     | The trial sweep (@design-apply, 11:27Z): the Video clip template said "rendered on your own desktop worker", set-up wording a visitor cannot act on. It now says what the clip is.
  18  | maintainer@emeraldcoastsystemsgroup.com     | The trial check (visitor seat): every template in the New sheet wore "Access: can't check" because the sixteen access probes share one 3 s limit while the kernel answers them in turn (~0.3 s each). The access probe waits 10 s (ACCESS_TIMEOUT_MS); a real failure still shows the badge.
-->
<html lang="en" data-theme="create">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create</title>
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css" />
<script src="/shared/ui/js/surface-theme.js"></script>
<!-- Audience view (ADR-164 D6). Home is Create's first surface, so Jarvis (the Home shell) frames this page with
     ?audience=family and Studio, Orbit and Commons with ?audience=company (the old /api/create/new forwards its ?audience= here): the signed-in account's OWN image projects from GET /api/create/home-summary (the package's
     bound summary read: project.view + project.read, owner-scoped), painted by the shared kit in each shell's grammar, and
     what Create can open. The view asks no studio for its access, reads no AI Office starter catalog and writes nothing.
     Any other request runs the full Create page below unchanged. -->
<link rel="stylesheet" href="/shared/ui/css/app-view.css" />
<script src="/shared/ui/js/app-view.js"></script>
<script>
(function () {
  var A = window.AppView; if (!A) return;
  var KICKER = 'Creative · Create';
  var LEDE = 'Say what you are making (a resume, a budget, a launch deck, a headshot, a short video) and Create opens the studio that owns it, already set up. Your own image projects are listed here; looking starts nothing.';
  var AUDIENCE_STUDIOS = [
    ['AI Office', 'Presentations, documents and spreadsheets'], ['Portrait Studio', 'Headshots and character portraits'],
    ['Video Studio', 'Short videos and the manual timeline editor'], ['Vids Studio', 'Clips rendered on your own worker'],
    ['Stories', 'Kid-safe animated episodes'], ['3D Scan-to-Print', 'Printable objects from photos'], ['CAD Studio', 'Parametric parts and editable dimensions'], ['LoRA Studio', 'Characters, training images and captions'], ['Image editor', 'Layered image designs']
  ];
  var REFUSALS = { 401: 'Sign in to see your projects.', 403: 'Create is not available to this account.' };
  function read() {
    return fetch('/api/create/home-summary', { credentials: 'same-origin', cache: 'no-store', headers: { Accept: 'application/json' } }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, body: j && typeof j === 'object' ? j : {} }; });
    }, function () { return { ok: false, status: 0, body: {} }; });
  }
  function openFull() { window.location.assign(window.location.pathname); }
  function count(v) { return typeof v === 'string' && /^\d+$/.test(v.trim()) ? Number(v) : null; }
  // A project item is '<title>' with the detail 'Layered image · updated <ISO instant>' and one image-editor action.
  function project(item) {
    var d = String(item.detail || ''), at = d.indexOf(' · updated '), when = at < 0 ? '' : d.slice(at + 11);
    var a = Array.isArray(item.actions) ? item.actions[0] : null;
    var q = a && typeof a.query === 'string' && /^project=[A-Za-z0-9-]+$/.test(a.query) ? a.query : '';
    return { title: String(item.text || 'Untitled project'), text: at < 0 ? d : d.slice(0, at),
      meta: /^\d{4}-\d{2}-\d{2}T/.test(when) ? 'Updated ' + A.when(when) : '', href: q ? '/api/create/editor?' + q : undefined };
  }
  function refusal(res) {
    var why = REFUSALS[res.status] || (res.status ? 'Your projects cannot be checked right now (HTTP ' + res.status + ').' : 'Create could not be reached.');
    return { kicker: KICKER, title: 'Your projects are not available right now', lede: why + ' No figure is shown in its place.',
      actions: [{ label: 'Open Create', primary: true, onClick: openFull }] };
  }
  function family() {
    return read().then(function (res) {
      if (!res.ok) return refusal(res);
      var items = Array.isArray(res.body.items) ? res.body.items : [], metrics = Array.isArray(res.body.metrics) ? res.body.metrics : [];
      var m = metrics[0] || null, n = m ? count(m.value) : null;
      return { kicker: KICKER, title: n === null ? 'Your image projects' : n === 0 ? 'No image projects yet' : n + ' image project' + (n === 1 ? '' : 's'), lede: LEDE,
        actions: [{ label: 'Open Create', primary: true, onClick: openFull }],
        stats: m ? [{ id: 'image-projects', label: String(m.label || 'Image projects'), value: m.value, tone: n > 0 ? 'ok' : null, hint: n === null ? 'Could not be checked' : null }] : [],
        sections: [
          { kind: 'list', id: 'projects', title: 'Your image projects', wide: true, note: items.length ? 'Newest first. Each opens in the image editor.' : 'Nothing saved yet. Open Create to start one.', items: items.map(project) },
          { kind: 'list', id: 'studios', title: 'What Create can open', wide: true, items: AUDIENCE_STUDIOS.map(function (s) { return { title: s[0], text: s[1] }; }) }
        ] };
    });
  }
  // ADR-164 D6: the Business shells' audience (company) paints this same account-scoped card in its own grammar.
  A.boot({ app: 'create', escapeLabel: 'Open Create in the cockpit', audiences: { family: family, company: family } });
})();
</script>
<!-- The package skin: the SAME tokens the cockpit wears while this app is focused. -->
<link rel="stylesheet" href="/api/create/theme/create.css" />
<style>
  /* Short alias names, each DERIVED from the framework tokens the skin defines. The hex after the
     comma is a last-resort fallback for a standalone open before the skin route answers. */
  :root {
    --bg: var(--bg-primary, #f8f7fd);
    --paper: var(--bg-card-hover, #ffffff);
    --solid: var(--ds-surface, var(--bg-primary, #ffffff));
    --panel: var(--bg-tertiary, #f3f0fb);
    --skel: var(--ds-surface-2, var(--bg-tertiary, #ece8f5));
    --line: var(--border-color, rgba(23,18,54,.08));
    --line-hover: var(--border-color-hover, rgba(23,18,54,.16));
    --text: var(--text-primary, #171236);
    --muted: var(--text-secondary, #4b4670);
    --faint: var(--text-muted, #8b86a8);
    --disabled: var(--ds-ink-disabled, color-mix(in srgb, var(--text) 45%, var(--bg)));
    --accent: var(--accent-primary, #7d2ae8);
    --accent-hover: var(--accent-primary-hover, #6a1fcf);
    --on-accent: var(--text-on-accent, #ffffff);
    --gradient: var(--accent-gradient, linear-gradient(135deg,#7d2ae8 0%,#a259ff 48%,#00c4cc 100%));
    --ok: var(--status-success, #0f9d58);
    --warn: var(--status-warning, #d97706);
    --peach: var(--create-tint-peach, #ffe6d9);
    --lilac: var(--create-tint-lilac, #ebe2ff);
    --sky: var(--create-tint-sky, #dcefff);
    --mint: var(--create-tint-mint, #d9f7ec);
    --lemon: var(--create-tint-lemon, #fff3c9);
    --rose: var(--create-tint-rose, #ffe0ee);
    --sheet-paper: var(--create-paper, #ffffff);
    --ink-on-tint: var(--create-ink-on-tint, #2a2350);
    --scrim: var(--ds-scrim, rgba(10, 8, 30, .45));
    --shadow: var(--card-shadow, 0 2px 10px rgba(23,18,54,.06));
    --shadow-deep: var(--depth-shadow, 0 24px 60px rgba(23,18,54,.12));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); overscroll-behavior: contain; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  a { color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .hidden { display: none !important; }

  /* The work owns the scroll; the bottom keeps room for New (52px) above the shell's assistant button. */
  main { max-width: 1240px; margin: 0 auto; padding: 0 24px 168px; }
  @media (max-width: 600px) { main { padding: 0 16px 160px; } }

  /* ── App row: the page title and search (an icon on a phone) ─────────────── */
  .approw { display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 10px 0 6px; }
  .approw h1 { flex: 0 0 auto; margin: 0; font-size: 20px; letter-spacing: -0.02em; font-weight: 750; }
  .search { flex: 1 1 auto; max-width: 560px; margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 14px; height: 44px; border-radius: 12px; background: var(--solid); border: 1px solid var(--line-hover); }
  .search:focus-within { border-color: var(--accent); }
  .search svg { flex: 0 0 auto; color: var(--faint); }
  .search input { flex: 1; border: 0; background: transparent; font-size: 16px; color: var(--text); min-width: 0; }
  .search input::placeholder { color: var(--faint); }
  .search .clear { border: 0; background: transparent; border-radius: 999px; width: 36px; height: 36px; cursor: pointer; color: var(--muted); display: none; font-size: 20px; line-height: 1; }
  .search.has-q .clear { display: inline-flex; align-items: center; justify-content: center; }
  .icon-btn { display: none; flex: 0 0 auto; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--text); cursor: pointer; align-items: center; justify-content: center; margin-left: auto; }
  .icon-btn:hover { background: var(--panel); }
  @media (max-width: 600px) {
    .icon-btn { display: inline-flex; }
    .approw .search { display: none; }
    .approw.searching h1 { display: none; }
    .approw.searching .search { display: flex; max-width: none; margin-left: 0; }
    .approw.searching .icon-btn { margin-left: 0; }
  }
  #filterStatus { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  #filterStatus[hidden] { display: none; }
  .link { border: 0; background: none; color: var(--accent); font-weight: 700; cursor: pointer; padding: 0 4px; min-height: 44px; }
  .link:hover { text-decoration: underline; }

  /* ── Set up your brand: one 44px row, only while there is no kit ─────────── */
  .brand-row[hidden] { display: none; }
  .brand-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; margin: 0 0 14px; padding: 6px 14px 6px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--solid); text-align: left; cursor: pointer; }
  .brand-row:hover { border-color: var(--line-hover); }
  .brand-row .logo { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--gradient); color: var(--on-accent); font-weight: 800; font-size: 14px; }
  .brand-row b { font-weight: 700; }
  .brand-row .why { color: var(--muted); font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brand-row .chev { color: var(--muted); font-size: 18px; }
  @media (max-width: 600px) { .brand-row .why { display: none; } .brand-row b { flex: 1; } }

  /* ── Sections ─────────────────────────────────────────────────────────── */
  section { margin: 0 0 30px; }
  .sec-head { display: flex; align-items: baseline; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; margin-bottom: 12px; }
  h2 { margin: 0; font-size: 18px; letter-spacing: -0.02em; font-weight: 750; }
  .note { color: var(--muted); font-size: 12.5px; margin: 0; }
  #recentNote { margin: -2px 0 12px; }
  .empty { color: var(--muted); padding: 26px; border: 1px dashed var(--line-hover); border-radius: 16px; text-align: center; }

  /* ── Work: picture cards, 2 columns on a phone, auto-fill 160px on desktop (§4.5) ── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
  @media (max-width: 600px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
  .wcard { position: relative; min-width: 0; }
  .wopen { display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; color: var(--text); }
  .wopen:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 10px; }
  .thumb { position: relative; display: grid; place-items: center; width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 8px; }
  .wopen:hover .thumb { border-color: var(--line-hover); box-shadow: var(--shadow); }
  .thumb canvas.render { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--sheet-paper); }
  .sheetp { position: relative; display: flex; flex-direction: column; gap: 4px; background: var(--sheet-paper); color: var(--ink-on-tint); border-radius: 4px; box-shadow: 0 6px 16px rgba(23,18,54,.14); padding: 8% 9%; overflow: hidden; }
  .sheetp[data-shape="slide"] { width: 84%; aspect-ratio: 16 / 9; }
  .sheetp[data-shape="page"] { height: 86%; aspect-ratio: 1 / 1.294; }
  .sheetp[data-shape="land"] { width: 80%; aspect-ratio: 4 / 3; }
  .sheetp[data-shape="square"] { height: 80%; aspect-ratio: 1 / 1; }
  .sheetp svg { width: 30px; height: 22px; flex: 0 0 auto; }
  .sheetp .ctitle { font-size: 11px; line-height: 1.25; font-weight: 800; letter-spacing: -0.01em; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .wcard .title { font-weight: 650; font-size: 14px; line-height: 1.35; padding-right: 40px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .wcard .meta, .wcard .state { color: var(--muted); font-size: 12px; line-height: 1.4; padding-right: 36px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wcard .state.warn { color: var(--warn); }
  /* ⋯ sits at the card's bottom right, beside the caption, never on the picture. */
  .wcard .more { position: absolute; right: -8px; bottom: -6px; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--text); cursor: pointer; font-size: 20px; line-height: 1; }
  .wcard .more:hover { background: var(--panel); }
  .wcard.locked .wopen { cursor: not-allowed; }
  .skel .thumb, .skel .bar { background: var(--skel); border-color: transparent; }
  .skel .bar { display: block; height: 12px; border-radius: 6px; margin: 6px 0; width: 80%; }
  .skel .bar.short { width: 50%; }
  @media (prefers-reduced-motion: no-preference) { .skel .thumb, .skel .bar { animation: pulse 1.4s ease-in-out infinite; } }
  @keyframes pulse { 50% { opacity: .55; } }
  .t-peach { background: var(--peach); } .t-lilac { background: var(--lilac); } .t-sky { background: var(--sky); }
  .t-mint { background: var(--mint); } .t-lemon { background: var(--lemon); } .t-rose { background: var(--rose); }

  /* This week: metric pills. */
  .metrics { display: flex; flex-wrap: wrap; gap: 10px; }
  .metric { display: inline-flex; flex-wrap: wrap; max-width: 100%; overflow-wrap: anywhere; align-items: center; gap: 10px; background: var(--solid); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .metric .sw { width: 10px; height: 10px; border-radius: 3px; }
  .metric strong { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
  .metric span { color: var(--muted); font-size: 12.5px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding-top: 12px; border-top: 1px solid var(--line); }

  /* ── One New, bottom right (52px), lifted above the shell's 48px assistant button ── */
  .fab { position: fixed; right: calc(16px + env(safe-area-inset-right)); bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 5; display: inline-flex; align-items: center; gap: 8px; height: 52px; padding: 0 20px; border: 0; border-radius: 16px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: var(--shadow-deep); }
  .fab:hover { background: var(--accent-hover); }
  .fab, .blank, .card, .wopen { -webkit-tap-highlight-color: transparent; }
  .fab svg { width: 22px; height: 22px; }

  /* ── Row menu (⋯): top layer, opaque, 44px rows (§4.3) ───────────────────── */
  .menu { margin: 0; padding: 6px; min-width: 220px; border: 1px solid var(--line-hover); border-radius: 14px; background: var(--solid); color: var(--text); box-shadow: var(--shadow-deep); }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; text-align: left; cursor: pointer; }
  .menu button:hover:not([data-ds-not-yet]) { background: var(--panel); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
  [data-ds-not-yet] { color: var(--disabled) !important; cursor: default !important; background: transparent; }
  [data-ds-not-yet] small, [data-ds-not-yet] .nyet { margin-left: auto; font-size: 12px; color: inherit; }

  /* ── The New sheet (phone) / dialog (desktop) ────────────────────────────── */
  dialog.sheet { padding: 0; border: 1px solid var(--line-hover); border-radius: 20px; background: var(--solid); color: var(--text); width: min(760px, calc(100vw - 48px)); max-width: none; max-height: min(88vh, 920px); box-shadow: var(--shadow-deep); overflow: hidden; }
  dialog.sheet[open] { display: flex; flex-direction: column; }
  dialog.sheet::backdrop { background: var(--scrim); }
  .sheet .handle { display: none; width: 36px; height: 5px; border-radius: 3px; background: var(--disabled); margin: 8px auto 0; }
  .sheet-head { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 56px; padding: 0 12px 0 20px; border-bottom: 1px solid var(--line); }
  .sheet-head h2 { font-size: 18px; }
  .tertiary { border: 0; background: none; color: var(--accent); font-weight: 700; min-height: 44px; padding: 0 12px; border-radius: 10px; cursor: pointer; }
  .sheet-body { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 16px 20px 28px; }
  .sheet-body h3 { margin: 0 0 10px; font-size: 15px; font-weight: 750; }
  .sheet-body section { margin-bottom: 22px; }
  @media (max-width: 600px) {

  /* Blank row: one row, sideways on a phone. */
  .blankrow { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x proximity; }
  .blank { flex: 0 0 96px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: 0; background: none; cursor: pointer; text-align: center; scroll-snap-align: start; color: var(--text); }
  .blank .bthumb { position: relative; display: grid; place-items: center; width: 96px; height: 72px; border-radius: 10px; border: 1px solid var(--line); }
  .blank:hover:not([data-ds-not-yet]) .bthumb { border-color: var(--accent); }
  .blank .bthumb > svg { width: 64px; height: 48px; filter: drop-shadow(0 6px 10px rgba(23,18,54,.14)); }
  .blank[data-ds-not-yet] .bthumb > svg { width: 26px; height: 26px; filter: none; }
  .blank b { font-size: 12.5px; font-weight: 700; line-height: 1.25; }
  .blank span.hint { font-size: 11px; color: var(--muted); line-height: 1.2; }
  .blank[data-ds-not-yet] .bthumb { background: var(--skel); border-style: dashed; }
  .blank[data-ds-not-yet] span.hint { color: inherit; }
  .blank.locked { cursor: not-allowed; }
  .blank.locked .bthumb { filter: saturate(.35); }
  .lockdot { position: absolute; left: 4px; bottom: 4px; font-size: 10px; font-weight: 800; color: var(--on-accent); background: rgba(23,18,54,.72); border-radius: 999px; padding: 1px 6px; }
  .import { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; margin-top: 8px; padding: 0 12px; border: 1px dashed var(--line-hover); border-radius: 12px; text-align: left; }
  .import svg { width: 20px; height: 20px; }
  /* Templates: search, then one sideways row of 44px format chips. */
  .sheet .search { max-width: none; margin: 0 0 10px; }
  .fchips, .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin-bottom: 8px; scrollbar-width: thin; }
  .chips:empty { display: none; }
  .fchips button, .chips button { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 1px solid var(--line-hover); border-radius: 999px; background: var(--solid); color: var(--text); font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .fchips button .c { color: var(--muted); font-size: 12px; }
  .fchips button[aria-pressed="true"], .chips button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .fchips button[aria-pressed="true"] .c { color: inherit; }
  .chips .sw { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .sec { margin-bottom: 20px; }
  .sec h4 { margin: 0 0 4px; font-size: 14px; font-weight: 750; }
  .sec .sub { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  @media (max-width: 600px) { .tgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
  .nomatch { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 18px; border: 1px dashed var(--line-hover); border-radius: 14px; color: var(--muted); }
  .nomatch b { color: var(--text); }
  .btn2 { min-height: 44px; padding: 0 16px; border: 1px solid var(--line-hover); border-radius: 12px; background: var(--solid); color: var(--text); font-weight: 600; cursor: pointer; }

  /* Template card: a drawn preview from the template's own section titles, one caption line. */
  .card { display: flex; flex-direction: column; min-width: 0; border: 0; padding: 0; background: none; text-align: left; cursor: pointer; color: var(--text); }
  .card .pv { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; border: 1px solid var(--line); padding: 30px 10px 0; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
  .card:hover .pv { border-color: var(--line-hover); box-shadow: var(--shadow); }
  .card .pv .badge { position: absolute; left: 8px; top: 7px; font-size: 10.5px; font-weight: 800; letter-spacing: .04em; color: var(--ink-on-tint); background: var(--sheet-paper); border-radius: 999px; padding: 2px 8px; max-width: calc(100% - 44px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .pv .icon { position: absolute; right: 8px; top: 5px; font-size: 15px; }
  .card .name { font-weight: 650; font-size: 14px; margin: 8px 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card.locked { cursor: not-allowed; }
  .card.locked .pv { filter: saturate(.35); }
  .card .pv .lock { position: absolute; left: 6px; bottom: 6px; font-size: 10.5px; font-weight: 800; color: var(--on-accent); background: rgba(23,18,54,.72); border-radius: 999px; padding: 3px 8px; }
  .card .pv .lock.unknown { background: rgba(217,119,6,.85); }
  .card .access { display: inline-flex; align-items: center; min-height: 44px; padding: 0 2px; color: var(--accent); font-weight: 700; font-size: 13px; text-decoration: none; }
  /* Drawn previews: a page, a slide, a sheet — with the starter's real section titles as strips. */
  .mock { background: var(--sheet-paper); border-radius: 6px 6px 0 0; box-shadow: 0 8px 20px rgba(23,18,54,.14); overflow: hidden; }
  .mock.page { width: 58%; height: 100%; padding: 10px 9px; }
  .mock.slide { width: 92%; height: 92%; padding: 9px 10px; }
  .mock.sheet { width: 92%; height: 96%; padding: 0; }
  .mock .t { height: 7px; border-radius: 3px; background: var(--accent); margin-bottom: 6px; }
  .mock.slide .t { width: 60%; }
  .mock .l { height: 3px; border-radius: 2px; background: #d9d3ee; margin-bottom: 4px; }
  .mock .h { font-size: 7px; font-weight: 800; color: var(--ink-on-tint); margin: 4px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mock.slide .cols { display: flex; gap: 6px; }
  .mock.slide .col { flex: 1; min-width: 0; }
  .mock.slide .bar { border-radius: 2px 2px 0 0; background: var(--accent); opacity: .85; }
  .mock.sheet .hd { display: flex; background: var(--accent); }
  .mock.sheet .hd span, .mock.sheet .r span { flex: 1; font-size: 6px; padding: 2px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mock.sheet .hd span { color: var(--on-accent); font-weight: 800; }
  .mock.sheet .r { display: flex; border-bottom: 1px solid #ece8f5; }
  .mock.sheet .r span { color: #4b4670; }
  .mock.sheet .r.tot span { font-weight: 800; color: var(--accent); }
  .mock.photo { width: 62%; height: 100%; display: grid; place-items: center; background: linear-gradient(180deg, var(--sheet-paper), #f3f0fb); }
  .mock.photo.cube { color: #225e65; }
  .mock.photo svg { width: 70%; height: 70%; }
  .mock.phone { width: 36%; height: 100%; border-radius: 10px 10px 0 0; padding: 7px 6px; }
  .mock.phone .screen { height: 100%; border-radius: 5px; background: var(--accent); display: grid; place-items: center; }
  .mock.phone .screen svg { width: 22px; height: 22px; }
  .mock.design { width: 92%; height: 92%; background: #231f42; }

  #status { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 12px; font-size: 13px; box-shadow: var(--shadow-deep); opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 6; }
  #status.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #status { transition: none; } }
</style>
</head>

<script>
(function () {
  'use strict';

  var PLANNED = [

  }
  function firstSeries(outline) {
    return String(outline || '').split('\n').map(function (l) { var m = /^([^:|#>]{1,24}):\s*(-?[\d.,]+[kmbt%x]?)$/i.exec(l.trim()); return m ? [m[1], m[2]] : null; }).filter(Boolean).slice(0, 3);
  }
  function sheetPreview(st) {
    var sheet = el('div', 'mock sheet'), tb = firstTable(st.outline), rows = tb.length ? tb : [['Label', 'Value']].concat(firstSeries(st.outline)).concat([['Total', '=SUM']]);
    rows.slice(0, 5).forEach(function (r, i) { var row = el('div', i ? 'r' + (i === rows.length - 1 && !tb.length ? ' tot' : '') : 'hd'); r.forEach(function (c) { row.appendChild(el('span', null, c)); }); sheet.appendChild(row); });
    return sheet;
  }
  function preview(st) {
    var t = titlesOf(st.outline);
    if (st.kind === 'xlsx') return sheetPreview(st);
    if (st.kind === 'docx') {
      var page = el('div', 'mock page'); page.appendChild(el('div', 't'));
      t.slice(0, 4).forEach(function (h) { page.appendChild(el('div', 'h', h)); page.appendChild(el('div', 'l')); });
      return page;
    }
    var slide = el('div', 'mock slide'); slide.appendChild(el('div', 't'));
    var cols = el('div', 'cols'), left = el('div', 'col'), right = el('div', 'col');
    t.slice(0, 3).forEach(function (h) { left.appendChild(el('div', 'h', h)); left.appendChild(el('div', 'l')); });
    right.style.display = 'flex'; right.style.alignItems = 'flex-end'; right.style.gap = '3px'; right.style.height = '34px';
    [10, 18, 26, 22].forEach(function (hgt) { var b = el('div', 'bar'); b.style.height = hgt + 'px'; b.style.flex = '1'; right.appendChild(b); });
    cols.appendChild(left); cols.appendChild(right); slide.appendChild(cols);
    return slide;
  }
  function otherPreview(item) {
    if (item.preview === 'design') { var design = el('div', 'mock design'); design.appendChild(svgNode('<svg viewBox="0 0 160 90" aria-hidden="true"><rect x="12" y="13" width="44" height="6" fill="#bef264"/><rect x="12" y="32" width="110" height="10" fill="#ffffff"/><rect x="12" y="49" width="86" height="10" fill="#ffffff"/><circle cx="137" cy="75" r="29" fill="#a78bfa"/></svg>')); return design; }
    if (item.preview === 'cube') { var model = el('div', 'mock photo cube'); model.appendChild(svgNode('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10"/></svg>')); return model; }
    if (item.preview === 'photo') { var p = el('div', 'mock photo'); p.appendChild(svgNode('<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="30" r="14" fill="#7d2ae8"/><path d="M12 76c3-18 15-24 28-24s25 6 28 24" fill="#a259ff"/></svg>')); return p; }
    var ph = el('div', 'mock phone'); var sc = el('div', 'screen'); sc.appendChild(svgNode('<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M8 6l10 6-10 6z"/></svg>')); ph.appendChild(sc); return ph;
  }

  /* ── State of the sheet ── */
  var KINDS = [], STARTERS = [], activeCat = 'foryou', activeGroup = 'all', tquery = '';
  function kindOf(id) { for (var i = 0; i < KINDS.length; i++) if (KINDS[i].id === id) return KINDS[i]; return null; }
  function groupLabel(kindId, groupId) { var k = kindOf(kindId); if (!k || !Array.isArray(k.groups)) return groupId; for (var i = 0; i < k.groups.length; i++) if (k.groups[i].id === groupId) return k.groups[i].label; return groupId; }
  function officeQuery(st) { return 'kind=' + encodeURIComponent(st.kind) + '&starter=' + encodeURIComponent(st.id) + '&theme=' + encodeURIComponent(st.theme || ''); }
  var BADGE = { pptx: 'Slides', docx: 'Document', xlsx: 'Spreadsheet' };

  /* Every template, normalised: image designs first, then the Office starters, then the other studios. */
  function allCards() {
    var other = OTHER.map(function (o) { var s = byTool[o.tool]; return { id: 'other-' + o.id, cat: o.cat, group: o.group, groupLabel: o.groupLabel, name: o.name, desc: o.desc, badge: s.name, tint: TINT[o.cat], tool: o.tool, app: s.app, query: o.query || '', other: o }; });
    var office = STARTERS.map(function (st) { return { id: 'office-' + st.id, cat: st.kind, group: st.group, groupLabel: groupLabel(st.kind, st.group), name: st.name, desc: st.desc, icon: st.icon, badge: BADGE[st.kind], tint: TINT[st.kind], tool: 'create-office', app: 'presentations', query: officeQuery(st), st: st }; });
    return other.filter(function (c) { return c.cat === 'image'; }).concat(office, other.filter(function (c) { return c.cat !== 'image'; }));
  }
  function cardText(c) { return (c.name + ' ' + c.desc + ' ' + c.groupLabel + ' ' + c.cat).toLowerCase(); }
  function cardNode(c) {
    var access = ACCESS[c.app], studio = byTool[c.tool];   // undefined until the probe answers: no badge, still opens
    var b = el(access === 'locked' ? 'div' : 'button', 'card' + (access === 'locked' ? ' locked' : '')); b.dataset.q = cardText(c); b.title = c.desc;
    if (access !== 'locked') b.type = 'button';
    var pv = el('span', 'pv t-' + c.tint); pv.appendChild(el('span', 'badge', c.badge)); if (c.icon) pv.appendChild(el('span', 'icon', c.icon));
    pv.appendChild(c.st ? preview(c.st) : otherPreview(c.other));
    if (access === 'locked') pv.appendChild(el('span', 'lock', '🔒 Not provisioned'));
    else if (access === 'unknown') pv.appendChild(el('span', 'lock unknown', 'Access: can’t check'));
    b.appendChild(pv); b.appendChild(el('span', 'name', c.name));
    if (access === 'locked') {   // a card, not a button: its Access link is the one thing to press
      b.setAttribute('aria-label', c.name + ' — not provisioned: ' + studio.name + ' is not assigned to you');
      b.setAttribute('aria-disabled', 'true'); b.appendChild(accessLink(c.app));
      b.addEventListener('click', function () { toast(studio.name + ' is not assigned to you — an administrator grants it in Access.'); });
      return b;
    }
    b.setAttribute('aria-label', c.name + ' — ' + c.desc);
    b.addEventListener('click', function () { if (go(c.tool, c.query)) closeNew(true); });
    return b;
  }
  function blankNode(blank) {
    var studio = byTool[blank.tool], locked = ACCESS[studio.app] === 'locked';
    var b = el('button', 'blank' + (locked ? ' locked' : '')); b.type = 'button'; b.dataset.blank = blank.id;
    var thumb = el('span', 'bthumb t-' + blank.tint); thumb.appendChild(svgNode(art(blank.art)));
    if (locked) thumb.appendChild(el('span', 'lockdot', '🔒'));
    b.appendChild(thumb); b.appendChild(el('b', null, blank.label)); b.appendChild(el('span', 'hint', blank.hint));
    b.setAttribute('aria-label', 'Blank ' + blank.label.toLowerCase() + ' — opens ' + studio.name + (locked ? ', not assigned to you' : ''));
    if (locked) b.setAttribute('aria-disabled', 'true');
    b.addEventListener('click', function () { if (go(blank.tool, blank.query || '')) closeNew(true); });
    return b;
  }
  var blankRow = document.getElementById('blankRow');
  function renderBlanks() {
    blankRow.replaceChildren();
    BLANKS.forEach(function (blank) { blankRow.appendChild(blankNode(blank)); });
    var custom = planned('blank', 'Custom size', 'RP-CRE-02');
    var thumb = el('span', 'bthumb'); thumb.appendChild(svgNode('<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 15v5h-5M4 4l7 7M20 20l-7-7"/></svg>'));
    custom.appendChild(thumb); custom.appendChild(el('b', null, 'Custom size')); custom.appendChild(el('span', 'hint', 'Not available yet'));
    blankRow.appendChild(custom);
  }

  /* ── Render the template half ── */
  var catsEl = document.getElementById('cats'), chipsEl = document.getElementById('chips'), secEl = document.getElementById('sections');
  function renderCats() {
    catsEl.replaceChildren();
    var cards = allCards();
    CATEGORIES.forEach(function (c) {
      var b = el('button', 'cat'); b.type = 'button'; b.dataset.cat = c.id; b.setAttribute('aria-pressed', c.id === activeCat ? 'true' : 'false');
      var n = c.id === 'foryou' ? cards.length : cards.filter(function (x) { return x.cat === c.id; }).length;
      b.appendChild(el('span', 'n', c.name)); b.appendChild(el('span', 'c', n));
      b.addEventListener('click', function () { activeCat = c.id; activeGroup = 'all'; renderTemplates(); catsEl.querySelector('[aria-pressed="true"]').focus({ preventScroll: true }); });
      catsEl.appendChild(b);
    });
  }
  function groupsFor(cat) {
    if (cat === 'foryou') return [];
    var seen = {}, out = [];
    allCards().filter(function (c) { return c.cat === cat; }).forEach(function (c) { if (!seen[c.group]) { seen[c.group] = true; out.push({ id: c.group, label: c.groupLabel }); } });
    return out;
  }
  function renderChips() {
    chipsEl.replaceChildren();
    var groups = groupsFor(activeCat); if (groups.length < 2) return;
    [{ id: 'all', label: 'Everything' }].concat(groups).forEach(function (g) {
      var b = el('button'); b.type = 'button'; b.setAttribute('aria-pressed', g.id === activeGroup ? 'true' : 'false');
      var sw = el('span', 'sw'); sw.style.background = g.id === 'all' ? 'var(--gradient)' : (SWATCH[g.id] || 'var(--accent)'); b.appendChild(sw); b.appendChild(el('span', null, g.label));
      b.addEventListener('click', function () { activeGroup = g.id; renderTemplates(); chipsEl.querySelector('[aria-pressed="true"]').focus({ preventScroll: true }); });
      chipsEl.appendChild(b);
    });
  }
  function section(title, sub, cards) {
    var s = el('section', 'sec'); if (title) s.appendChild(el('h4', null, title)); if (sub) s.appendChild(el('p', 'sub', sub));
    var g = el('div', 'tgrid'); cards.forEach(function (c) { g.appendChild(cardNode(c)); }); s.appendChild(g); return s;
  }
  function noMatch() {
    var box = el('div', 'nomatch'); box.appendChild(el('b', null, 'No templates match'));
    box.appendChild(el('span', null, 'Try another word, or clear the search and the format.'));
    var clear = el('button', 'btn2', 'Clear'); clear.type = 'button'; clear.id = 'tplReset';
    clear.addEventListener('click', function () { tquery = ''; tqEl.value = ''; activeCat = 'foryou'; activeGroup = 'all'; renderTemplates(); tqEl.focus(); });
    box.appendChild(clear); return box;
  }
  function renderSections() {
    secEl.replaceChildren();
    var q = tquery.trim().toLowerCase(), k = kindOf(activeCat);
    var mine = allCards().filter(function (c) {
      return (activeCat === 'foryou' || c.cat === activeCat) && (activeGroup === 'all' || c.group === activeGroup) && (!q || cardText(c).indexOf(q) !== -1);
    });
    document.getElementById('tplSearchForm').classList.toggle('has-q', q.length > 0);
    if (!mine.length) { secEl.appendChild(noMatch()); return; }
    if (q || activeCat === 'foryou' || activeGroup !== 'all') {
      secEl.appendChild(section(q ? matchWords(mine.length) : '', activeGroup !== 'all' && k ? 'Opens in ' + k.opens + '.' : '', mine)); return;
    }
    groupsFor(activeCat).forEach(function (g) {
      var own = mine.filter(function (c) { return c.group === g.id; });
      if (own.length) secEl.appendChild(section(g.label, k ? 'Opens in ' + k.opens + '.' : '', own));
    });
  }
  function renderTemplates() { renderCats(); renderChips(); renderSections(); }
  function renderSheet() { renderBlanks(); renderTemplates(); }

  var tqEl = document.getElementById('tq');
  tqEl.addEventListener('input', function () { tquery = tqEl.value; renderSections(); });
  document.getElementById('tplClear').addEventListener('click', function () { tquery = ''; tqEl.value = ''; renderSections(); tqEl.focus(); });
  document.getElementById('tplSearchForm').addEventListener('submit', function (e) { e.preventDefault(); var first = secEl.querySelector('.card'); if (first) first.click(); });

  /* ── Open and close: a sheet on a phone, a dialog on desktop; Back, Escape, the scrim and Done close it ── */
  var sheet = document.getElementById('newSheet'), sheetPushed = false;
  function openNew(opts) {
    opts = opts || {};
    if (opts.cat && CATEGORIES.some(function (c) { return c.id === opts.cat; })) { activeCat = opts.cat; activeGroup = 'all'; }
    if (typeof opts.query === 'string') { tquery = opts.query; tqEl.value = opts.query; }
    renderSheet();
    if (!sheet.open) sheet.showModal();
    if (!sheetPushed) { try { history.pushState({ createNew: true }, ''); sheetPushed = true; } catch (_) { /* no history in this frame */ } }
    var first = blankRow.querySelector('.blank:not([data-ds-not-yet])'); if (first && !opts.query) first.focus({ preventScroll: true }); else tqEl.focus();
  }
  /** @param {boolean} leaving A studio opens next: keep the history entry, the navigation replaces it. */
  function closeNew(leaving) {
    if (sheet.open) sheet.close();
    if (sheetPushed && !leaving) { sheetPushed = false; history.back(); } else sheetPushed = false;
    document.getElementById('newBtn').focus({ preventScroll: true });
  }
  window.addEventListener('popstate', function () { sheetPushed = false; if (sheet.open) sheet.close(); });
  sheet.addEventListener('cancel', function (e) { e.preventDefault(); closeNew(false); });
  sheet.addEventListener('click', function (e) { if (e.target === sheet) closeNew(false); });
  document.getElementById('newDone').addEventListener('click', function () { closeNew(false); });
  document.getElementById('newBtn').addEventListener('click', function () { openNew({}); });

  /* ── The shell's assistant orb rests above --oshal-app-bottom-inset on a phone (cockpit jarvis-orb.js, the same
     contract the shared editor reports its pane bar through), so Home reports New's top edge and the orb sits above
     New instead of on it. Removed again when Home goes away. ── */
  function orbInset(viewHeight, frameTop, fabTop) { return Math.max(0, Math.round(viewHeight - (frameTop + fabTop) - 4)); }
  function clearOrb() {
    try {
      var outer = window.parent !== window ? window.parent.document.documentElement : null, frame = window.frameElement;
      var fab = document.getElementById('newBtn');
      if (!outer || !frame) return;
      var box = fab ? fab.getBoundingClientRect() : null;   // New is position:fixed, so offsetParent is always null
      if (!box || !box.height) { outer.style.removeProperty('--oshal-app-bottom-inset'); return; }
      var inset = orbInset(window.parent.innerHeight, frame.getBoundingClientRect().top, box.top);
      outer.style.setProperty('--oshal-app-bottom-inset', inset + 'px');
    } catch (_) { /* a standalone or cross-origin open has no orb to move */ }
  }
  clearOrb();
  window.addEventListener('resize', clearOrb);
  window.addEventListener('load', clearOrb);
  window.addEventListener('pagehide', function () { try { window.parent.document.documentElement.style.removeProperty('--oshal-app-bottom-inset'); } catch (_) { /* no shell */ } });
  (function swipeDown() {
    var y0 = null, grip = document.getElementById('sheetHead'), handle = document.getElementById('sheetHandle');
    [grip, handle].forEach(function (n) {
      n.addEventListener('pointerdown', function (e) { if (e.pointerType !== 'mouse') y0 = e.clientY; });
      n.addEventListener('pointerup', function (e) { if (y0 !== null && e.clientY - y0 > 80) closeNew(false); y0 = null; });
    });
  })();

  /* ── The Office catalog, from the owning app ── */
  function loadStarters() {
    return fetchJson('/api/presentations/sections/starters', 4000).then(function (cat) {
      KINDS = Array.isArray(cat.kinds) ? cat.kinds : [];
      STARTERS = (Array.isArray(cat.starters) ? cat.starters : []).filter(function (s) { return s && /^[a-z0-9-]+$/.test(String(s.id)) && /^(pptx|docx|xlsx)$/.test(String(s.kind)); });
      renderTemplates(); applyFilters();
    }).catch(function () {
      KINDS = []; STARTERS = [];   // the Blank row still opens every Office kind
      if (sheet.open) toast('AI Office templates could not be loaded — Blank still opens each studio.');
    });
  }
  /** Access answers re-draw what depends on them: locks on blanks and template cards. */
  function applyAccess() { if (sheet.open) renderSheet(); else renderBlanks(); }

  /* An address can open New directly: /api/create/home?new=1[&cat=docx] (the old /api/create/new forwards here). */
  function openFromAddress() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('new') !== '1') return;
    var cat = params.get('cat'); params.delete('new'); params.delete('cat');
    try { history.replaceState(history.state, '', window.location.pathname + (params.toString() ? '?' + params.toString() : '') + window.location.hash); } catch (_) { /* address stays */ }
    openNew({ cat: cat || '' });
  }

  // Audience view (ADR-164 D6): under a view the page starts nothing; without one, or on a core without the kit, it starts as before.
  if (!window.AppView || !AppView.active()) {
  renderBlanks();
  loadStarters();
  openFromAddress();
  Promise.all(STUDIOS.map(function (s) { return accessFor(s.app).then(function (state) { ACCESS[s.app] = state; }); })).then(function () {
    applyAccess();
    openIncomingArtifact();
    loadProfile();
    loadSummaries();
    loadBrandCard();
  });
  }
})();
</script>
