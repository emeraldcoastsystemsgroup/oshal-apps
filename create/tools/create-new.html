<!doctype html>
<!--
  Create — the old New address. The New screen merged into Create Home (UX audit 2026-11-06):
  its Blank row and templates are the sheet (phone) or dialog (desktop) behind Home's one New
  button. This page only forwards: a visit lands on /api/create/home?new=1 (with the same ?cat=
  format), so every old link, the framework rail tile and a bookmark open Home with New open;
  a shell's ?audience= view (ADR-164 D6) forwards to Home, which now serves that card.

  CHANGE LOG
  -----------------------------------------------------------------------------
  SEQ | AUTHOR                                      | DESCRIPTION
  -----------------------------------------------------------------------------
  1   | maintainer@emeraldcoastsystemsgroup.com     | Initial — categories rail, search, purpose chips, template cards drawn from each studio's catalog
  2   | maintainer@emeraldcoastsystemsgroup.com     | Authorization-aware: a studio the person is not provisioned for renders LOCKED with the Access link, never opens (GET /api/authorization/me?app=)
  3   | maintainer@emeraldcoastsystemsgroup.com     | Follow the portal palette and live parent changes while retaining the bundled Create skin when application colors are enabled.
  4   | maintainer@emeraldcoastsystemsgroup.com     | Cohesive catalog workspace with a real Home return, nonduplicated templates and responsive accessible filters.
  5   | maintainer@emeraldcoastsystemsgroup.com     | Add the 3D and print category and Scan-to-Print starter using the owning studio's fixed entry point.
  6   | maintainer@emeraldcoastsystemsgroup.com     | Add the owned layered-image editor as one distinct Image design starter and category.
  7   | maintainer@emeraldcoastsystemsgroup.com     | Link the original editable image template gallery with exact query context.
  8   | maintainer@emeraldcoastsystemsgroup.com     | Add the Edit video card: it opens Video Studio's own manual timeline editor through the create-video-editor rail tile (CREATE-EDIT-05d); the existing Short video card still opens generation.
  9   | maintainer@emeraldcoastsystemsgroup.com     | 1.9.3: the family audience view and its company alias for the whole-portal shells (ADR-164 D6): the kit and one builder over the package's own home-summary follow the theme bootstrap; the page's start (render, the per-studio access checks and the AI Office starter read) runs only when no view is active.
  10  | maintainer@emeraldcoastsystemsgroup.com     | Add the Brand intro clip card in Video; it opens the brand-graphics package's own review page.
  11  | maintainer@emeraldcoastsystemsgroup.com     | Add CAD parts and LoRA character workspaces so New covers all fourteen modules; retain locked-studio navigation checks without assigning access.
  12  | maintainer@emeraldcoastsystemsgroup.com     | UX audit 2026-11-06 (create--create-new MERGE): New is now the sheet/dialog behind Create Home's one New button, so this address forwards to /api/create/home?new=1 (keeping a known ?cat=); a ?audience= view forwards to Home, which is Create's first surface and now serves the family/company card unchanged.
-->
<html lang="en" data-theme="create">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create — New</title>
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css" />
<script src="/shared/ui/js/surface-theme.js"></script>
<link rel="stylesheet" href="/api/create/theme/create.css" />
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg-primary, #f8f7fd); color: var(--text-primary, #171236); }
  .forward { max-width: 480px; margin: 48px auto; padding: 0 20px; font-size: 15px; line-height: 1.5; }
  .forward a { display: inline-flex; align-items: center; min-height: 44px; color: var(--accent-primary, #7d2ae8); font-weight: 700; }
</style>
</head>
<body>
<main class="forward" id="forward">
  <p>New is part of Create Home now.</p>
  <p><a id="homeLink" href="/api/create/home?new=1">Open Create Home with New</a></p>
</main>
<script>
(function () {
  'use strict';
  var CATS = /^(?:foryou|image|pptx|docx|xlsx|portrait|video|story|training|3d)$/;
  /* Where this address now lives: Home's audience card for a shell's view, else Home with New open on the same format. */
  function homeAddress(search) {
    var params = new URLSearchParams(search || ''), next = new URLSearchParams();
    var audience = params.get('audience'), cat = params.get('cat');
    if (audience && /^[a-z][a-z0-9-]{0,31}$/.test(audience)) { next.set('audience', audience); return '/api/create/home?' + next.toString(); }
    next.set('new', '1');
    if (cat && CATS.test(cat)) next.set('cat', cat);
    return '/api/create/home?' + next.toString();
  }
  var to = homeAddress(window.location.search);
  document.getElementById('homeLink').href = to;
  window.location.replace(to);
})();
</script>
</body>
</html>
