# -----------------------------------------------------------------------------
# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — create ("Create")
#
# The Canva-shaped front door for everything you make with oshal: one rail, one
# skin, one home page ("What will you create today?") over the studios that are
# already installed — AI Office (deck / document / workbook), Portrait Studio,
# Video Studio, LoRA Studio, Vids Studio, the Creative Studio story pipeline and
# 3D Scan-to-Print.
#
# Create owns manual layered-image projects and their private immutable revisions, and
# each person's brand kit (colors, fonts, logo and voice) that the other studios read.
# The portable browser renderer is reusable; member studios retain their existing
# generation pipelines and domain data. Manual editing makes no provider calls.
# The package skin is optional; all surfaces follow the portal theme chooser.
#
# Framework: OSHAL (docs/adr/085-remote-app-packages-and-registries.md)
# ─────────────────────────────────────────────────────────────────────────────

name: create
suite: ai-creative   # ADR-097: primary catalog shelf (tools keep their own category:)
displayName: Create
description: >-
  One studio for everything you make: decks, documents and workbooks from AI
  Office, portraits, short videos, story episodes, LoRA characters and 3D scans —
  a single home page that shows what you were working on and one tap to pick up
  where you left off, in every studio you already have.
version: 1.8.0
testing:
  version: 1
  catalog: tests/test-lab.yaml
uses: [test-catalog, application-authorization, authenticated-artifacts, app-dependencies]
# Context refresh uses the existing request_context operation; the editor
# advertises no mutation capabilities or custom editing operations.
surface:
  ops: [context, custom]
artifacts:
  accepts:
    - id: image-layer
      label: Add image layer in Create
      types: [image/png, image/jpeg, image/webp]
      mode: open
authorization:
  version: 1
  catalog: authorization.yaml
status: active
scope: public
theme: create   # package-bundled skin: ui/create.css (ADR-085), used when Application colors is enabled

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: create
  ref: main

# ADR-085 dependencies, tiered. Create fronts seven studios and requires none of them: it owns
# its own projects, brand kit and image editor, and every studio entry is a tile or a catalog
# fetch that degrades on its own (the evidence is recorded against the optional tier below).
# They are OFFERED at install as unchecked choices and never installed unasked; declining them
# all installs Create alone. `presentations` stays an APP dependency rather than
# `uses: [deck-generation]` because Create embeds AI Office's SURFACE
# (/api/presentations/sections/ui), not its engine - the validator's kernel-skill warning is
# about the engine (Little Monsters' old mis-declaration), which this package never calls.
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    # Every studio Create fronts is a tile it routes to, not a runtime it needs. Create owns its
    # projects, brand kit and image editor (migrations/001, migrations/002); the studio grid renders
    # "No studio is installed yet" when none is present (tools/create-home.html:448) and the AI Office
    # starter fetch catches its own failure with "the studios still open" (tools/create-new.html:421).
    apps:
      - presentations
      - portrait-studio
      - video
      - lora
      - vids
      - creative-studio
      - scan-to-print
    tools: []
    connectors: []

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
routes:
  - module: routes/create-routes.js
    factory: createCreateRoutes
    mountPath: /api/create
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/create/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/create-project-routes.js
    factory: createCreateProjectRoutes
    mountPath: /api/create
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

migrations:
  - migrations/001-create-projects.sql
  - migrations/002-create-brand-kits.sql

summary:
  path: /api/create/home-summary
  tilesPointer: /metrics
  itemsPointer: /items

smoke:
  - name: package-readiness
    method: GET
    path: /api/create/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# ─────────────────────────────────────────────────────────────────────────────
# UI — the Create rail. The first tile is this package's own home; the rest are
# the member studios' own surfaces (ADR-085 D11: toolNames are global, hence the
# create- prefix). `group:` bands render in first-appearance order.
# ─────────────────────────────────────────────────────────────────────────────
ui:
  static:
    - toolName: create-new
      label: Create
      icon: codicon codicon-add
      iframeUrl: /api/create/new
      section: top
    - toolName: create-home
      label: Home
      icon: codicon codicon-home
      iframeUrl: /api/create/home
      section: top
    - toolName: create-brand
      label: Brand Kit
      icon: codicon codicon-symbol-color
      iframeUrl: /api/create/brand
      section: top
    - toolName: create-editor
      label: Image editor
      icon: codicon codicon-edit
      iframeUrl: /api/create/editor
      section: top
      group: Studios
    - toolName: create-office
      label: AI Office
      icon: codicon codicon-files
      iframeUrl: /api/presentations/sections/ui
      section: top
      group: Studios
    - toolName: create-portrait
      label: Portrait
      icon: codicon codicon-person
      iframeUrl: /api/portrait-studio/app
      section: top
      group: Studios
    - toolName: create-video
      label: Video
      icon: codicon codicon-device-camera-video
      iframeUrl: /api/video/ui
      section: top
      group: Studios
    - toolName: create-lora
      label: LoRA
      icon: codicon codicon-circuit-board
      iframeUrl: /api/lora/ui
      section: top
      group: Studios
    - toolName: create-scan-to-print
      label: 3D Scan-to-Print
      icon: codicon codicon-package
      iframeUrl: /api/scan-to-print/app
      section: top
      group: Studios
    - toolName: create-vids
      label: Vids
      icon: codicon codicon-play-circle
      iframeUrl: /api/vids/app
      section: top
      group: Pipeline
    - toolName: create-story
      label: Stories
      icon: codicon codicon-sparkle
      iframeUrl: /api/creative-studio/review
      section: top
      group: Pipeline

# Ribbon chrome while /cockpit?app=create is focused: a creative tool, not a
# ticket/queue console — the operational trays go, Settings stays (that is where
# storage targets and connections live), and the global assistant orb stays as
# the "ask for it" path.
ribbon:
  hideFrameworkItems:
    - tickets
    - chat
    - calendar
    - addressbook
    - dashboard
    - echo
    - logs
    - operations
  hideChatPanel: true
  hideStatusBar: true
  defaultView: create-home
