# Ribbon chrome while /cockpit?app=create is focused: a creative tool, not a
# ticket/queue console — the operational trays go, Settings stays (that is where
# storage targets and connections live), and the global assistant orb stays as
# the "ask for it" path.
ribbon:
  hideFrameworkItems:
    - tickets
    - chat
    - calendar
    - addressbook
    - dashboard
    - logs
    - operations
  hideChatPanel: false
  hideStatusBar: true
  defaultView: create-home

bots:
  - agentId: 992feff6-bda5-4d30-a075-22fd6f4aa9ee
    name: create-editor
    persona: personas/create-editor.yaml
    posture: inline
    role: creative/create-editor
    capabilities:
      - create-project-inspection
      - create-revision-editing
    selectorDescriptor: >-
      Select for owned Create image/vector projects: masks, adjustments, layers, groups, paths and layout
      edits. Do not select for unimplemented RAW, motion, PDF or audio workstations.
    routingKeywords:
      - image editing
      - vector editing
      - mask
      - adjustment layer
      - create editor

# Route-backed tools run as the original caller; edits use the existing approval cards.
tools:
  - name: create-inspect-psd
    displayName: Inspect PSD Import
    type: api
    category: creative
    description: Inspect this person's actual owned PSD artifact and report supported editable layers and conversion losses. Saves nothing.
    executor:
      executorType: api
      apiEndpoint: GET /api/create/psd-artifacts/{input.ref}/inspect
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        ref: { type: string, minLength: 68, maxLength: 68, description: 'Actual protected artifact reference: art_ followed by 64 lowercase hexadecimal characters.' }
      required: [ref]
      additionalProperties: false
    usageInstructions: Use an actual protected artifact ref supplied in this request. Never invent refs, URLs, paths or ownership. Read the returned SHA/profile/report and ask which permitted conversion mode the person wants before proposing import.
    routingTags: [creative, editing, psd]
    skills: [creative-editing]
    tags: [route-backed]
  - name: create-import-psd
    displayName: Import Reviewed PSD
    type: api
    category: creative
    description: Create an owned editable project or explicitly flattened copy from a reviewed PSD artifact, retaining its immutable original and conversion report.
    executor:
      executorType: api
      apiEndpoint: POST /api/create/psd-artifact-imports
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        ref: { type: string, minLength: 68, maxLength: 68, description: 'Actual protected artifact reference: art_ followed by 64 lowercase hexadecimal characters.' }
        title: { type: string, minLength: 1, maxLength: 160 }
        mode: { type: string, enum: [editable, flattened] }
        expectedSha256: { type: string, minLength: 64, maxLength: 64, description: 'Exact inspected SHA256, 64 lowercase hexadecimal characters.' }
        requestKey: { type: string, format: uuid, minLength: 36, maxLength: 36, description: 'Canonical lowercase RFC4122 UUID4; retain the same key for this exact sealed import on uncertain retries.' }
      required: [ref, title, mode, expectedSha256, requestKey]
      additionalProperties: false
    usageInstructions: Inspect this same artifact first. Explain all reported losses and get an explicit conversion choice; editable requires editable=true, flattened requires flattened=true and is one rendered image. Use the inspected SHA. Generate one UUID4 requestKey for this approved import and retain it on uncertain retries; changed bytes/mode/title with that key refuse. This call proposes a held approval card, saves nothing before approval, and never opens the editor automatically. A success returns the immutable first revision and source metadata; read the current project before subsequent edits. Do not claim full Photoshop fidelity or PSD export.
    routingTags: [creative, editing, psd]
    skills: [creative-editing]
    tags: [route-backed]
  - name: create-psd-source
    displayName: Read PSD Source Report
    type: api
    category: creative
    description: Read the immutable original PSD digest, import mode and conversion report for an owned project.
    executor:
      executorType: api
      apiEndpoint: GET /api/create/projects/{input.id}/psd-source
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        id: { type: string, minLength: 36, maxLength: 36 }
      required: [id]
      additionalProperties: false
    usageInstructions: Use an actual owned project id from the current list or import result. Source lineage describes the first import; later edits are ordinary Create revisions. The editor's original download requires a separate current export grant.
    routingTags: [creative, editing, psd]
    skills: [creative-editing]
    tags: [route-backed]
  - name: create-editing-contract
    displayName: Create Editing Contract
    type: api
    category: creative
    description: Read the installed editing operations, examples, limits and unsupported features.
    executor:
      executorType: api
      apiEndpoint: GET /api/create/editing-contract
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      additionalProperties: false
    usageInstructions: >-
      Read this before constructing edits. It describes the installed source contract; it does not certify
      installed rendering.
    routingTags:
      - creative
      - editing
    skills:
      - creative-editing
    tags:
      - route-backed
  - name: create-list-projects
    displayName: Create List Projects
    type: api
    category: creative
    description: List this person’s own saved editing projects.
    executor:
      executorType: api
      apiEndpoint: GET /api/create/projects
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      additionalProperties: false
    usageInstructions: Choose a project returned here; never guess an id or ownership.
    routingTags:
      - creative
      - editing
    skills:
      - creative-editing
    tags:
      - route-backed
  - name: create-read-project
    displayName: Create Read Project
    type: api
    category: creative
    description: Inspect an owned project document and its exact current revision.
    executor:
      executorType: api
      apiEndpoint: GET /api/create/projects/{input.id}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        id:
          type: string
          minLength: 36
          maxLength: 36
      required:
        - id
      additionalProperties: false
    usageInstructions: >-
      Read before editing; use actual layer/track/source/clip ids and returned revision. Large documents may
      exceed bounded tool output; ask for the editor surface rather than invent missing data.
    routingTags:
      - creative
      - editing
    skills:
      - creative-editing
    tags:
      - route-backed
  - name: create-new-project
    displayName: Create New Project
    type: api
    category: creative
    description: Create an empty owned editable project.
    executor:
      executorType: api
      apiEndpoint: POST /api/create/agent-projects
    defaultAuthMode: ask
