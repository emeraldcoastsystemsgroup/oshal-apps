# -----------------------------------------------------------------------------
# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — create ("Create")
#
# The Canva-shaped front door for everything you make with oshal: one rail, one
# skin, one home page ("What will you create today?") over the studios that are
# already installed — AI Office (deck / document / workbook), Portrait Studio,
# Video Studio, LoRA Studio, Vids Studio, the Creative Studio story pipeline,
# 3D Scan-to-Print and Brand Graphics.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Supply the complete current source editing contract in the agent apply-tool context; keep approval and original-owner bindings unchanged.
#
# Create owns manual layered-image projects and their private immutable revisions, and
# each person's brand kit (colors, fonts, logo and voice) that the other studios read.
# The portable browser renderer is reusable; member studios retain their existing
# generation pipelines and domain data. Manual editing makes no provider calls; only
# region regeneration (project.generate) calls the media-generation kernel skill.
# The package skin is optional; all surfaces follow the portal theme chooser.
#
# Framework: OSHAL (docs/adr/085-remote-app-packages-and-registries.md)
# ─────────────────────────────────────────────────────────────────────────────

name: create
suite: ai-creative   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 512, basis: declared }
  features:
    - id: create-editing-command
      unit: editing command
      tier: T1
      generation: none
      degrade: disable
    - id: region-regenerate
      unit: region regeneration
      tier: T0
      generation: hosted
      degrade: disable
displayName: Create
description: >-
  One studio for everything you make: decks, documents and workbooks from AI
  Office, portraits, short videos, story episodes, LoRA characters, 3D scans and
  brand intro clips —
  a single home page that shows what you were working on and one tap to pick up
  where you left off, in every studio you already have.
version: 1.15.0
testing:
  version: 1
  catalog: tests/test-lab.yaml
uses: [test-catalog, application-authorization, authenticated-artifacts, app-dependencies, media-generation, experience-roles]
# The editor surface bridge remains read-only (request_context); agent edits use
# the separately authorized original-owner HTTP tools below.
surface:
  ops: [context, custom]
artifacts:
  accepts:
    - id: image-layer
      label: Add image layer in Create
      types: [image/png, image/jpeg, image/webp]
      mode: open
authorization:
  version: 1
  catalog: authorization.yaml
  roleTemplates:
    - id: admin
      version: 1
      label: Create Studio Administrator
      members:
        - { app: create, role: admin }
        - { app: presentations, role: '@app-admin' }
        - { app: portrait-studio, role: manager }
        - { app: video, role: admin }
        - { app: lora, role: trainer }
        - { app: vids, role: '@app-admin' }
        - { app: creative-studio, role: '@app-admin' }
        - { app: scan-to-print, role: maker }
        - { app: brand-graphics, role: '@app-admin' }
        - { app: motion-studio, role: administrator }
        - { app: publishing-studio, role: administrator }
        - { app: pdf-workbench, role: administrator }
        - { app: scene-studio, role: creator }
    - id: creator
      version: 1
      label: Creator
      members:
        - { app: create, role: creator }
        - { app: presentations, role: '@app-admin' }
        - { app: portrait-studio, role: creator }
        - { app: video, role: creator }
        - { app: lora, role: trainer }
        - { app: vids, role: '@app-admin' }
        - { app: creative-studio, role: '@app-admin' }
        - { app: scan-to-print, role: maker }
        - { app: brand-graphics, role: '@app-admin' }
        - { app: motion-studio, role: creator }
        - { app: publishing-studio, role: creator }
        - { app: pdf-workbench, role: editor }
        - { app: scene-studio, role: creator }
status: active
scope: public
theme: create   # package-bundled skin: ui/create.css (ADR-085), used when Application colors is enabled
# The inline editing concierge understands Create-owned image/vector projects.
# Optional studios retain their own agents and generation controls.
chatBot: create-editor

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: create
  ref: main

# ADR-085 dependencies, tiered. Create fronts seven studios and requires none of them: it owns
# its own projects, brand kit and image editor, and every studio entry is a tile or a catalog
# fetch that degrades on its own (the evidence is recorded against the optional tier below).
# They are OFFERED at install as unchecked choices and never installed unasked; declining them
# all installs Create alone. `presentations` stays an APP dependency rather than
# `uses: [deck-generation]` because Create embeds AI Office's SURFACE
# (/api/presentations/sections/ui), not its engine - the validator's kernel-skill warning is
# about the engine (Little Monsters' old mis-declaration), which this package never calls.
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    # Every studio Create fronts is a tile it routes to, not a runtime it needs. Create owns its
    # projects, brand kit and image editor (migrations/001, migrations/002); the studio grid renders
    # "No studio is installed yet" when none is present (tools/create-home.html:448) and the AI Office
    # starter fetch catches its own failure with "the studios still open" (tools/create-new.html:421).
    apps:
      - presentations
      - portrait-studio
      - video
      - lora
      - vids
      - creative-studio
      - scan-to-print
      - brand-graphics
      - motion-studio
      - publishing-studio
      - pdf-workbench
      - scene-studio
    tools: []
    connectors: []

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
routes:
  - module: routes/create-routes.js
    factory: createCreateRoutes
    mountPath: /api/create
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/create/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/create-project-routes.js
    factory: createCreateProjectRoutes
    mountPath: /api/create
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

migrations:
  - migrations/001-create-projects.sql
  - migrations/002-create-brand-kits.sql
  - migrations/003-force-row-level-security.sql
  - migrations/004-owner-policy-standard-identity-arm.sql
  - migrations/005-create-region-edits.sql
  - migrations/native/001-create.sql
  - migrations/native/002-create-images.sql
  - migrations/006-create-psd.sql
  - migrations/native/003-create-psd.sql
# The native kernel applies the native file above in place of 001-005, whose policy DO blocks and catalog read-backs are PostgreSQL-only.
nativeMigrations:
  - id: migrations/006-create-psd.sql
    native: skip
    reason: "Its immutable source/part tables, keys and checks are in migrations/native/003-create-psd.sql; exact-owner RLS is PostgreSQL-only, native Person SQL isolation and explicit owner joins remain required."
  - id: migrations/001-create-projects.sql
    native: skip
    reason: "Its tables, indexes and immutable rejection trigger are in migrations/native/001-create.sql; its exact-owner policy DO loop is PostgreSQL-only, and the native per-person scope and its owner-field check keep each person's rows their own."
  - id: migrations/002-create-brand-kits.sql
    native: skip
    reason: "Its table and index are in migrations/native/001-create.sql; its RLS ENABLE/FORCE and pg_policy-guarded CREATE POLICY are PostgreSQL-only, and the native per-person scope and its owner-field check keep each person's rows their own."
  - id: migrations/003-force-row-level-security.sql
    native: skip
    reason: "It only forces row security and reads pg_class back, which is PostgreSQL-only; the native per-person scope and its owner-field check keep each person's rows their own."
  - id: migrations/004-owner-policy-standard-identity-arm.sql
    native: skip
    reason: "It only rewrites the exact-owner policies and reads pg_policies back, which is PostgreSQL-only; the native per-person scope and its owner-field check keep each person's rows their own."
  - id: migrations/005-create-region-edits.sql
    native: skip
    reason: "Its table and indexes are in migrations/native/001-create.sql; its RLS ENABLE/FORCE and pg_policy-guarded CREATE POLICY are PostgreSQL-only, and the native per-person scope and its owner-field check keep each person's rows their own."

summary:
  path: /api/create/home-summary
  tilesPointer: /metrics
  itemsPointer: /items

smoke:
  - name: package-readiness
    method: GET
    path: /api/create/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

