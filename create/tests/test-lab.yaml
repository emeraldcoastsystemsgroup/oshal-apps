version: 1
cases:
  - id: region-edit-browser
    name: Change a region in the real editor, twice
    purpose: Drive the real editor in Chromium through the real compiled Create routes over a disposable PostgreSQL with the named create-region-fixture-provider.
    level: browser
    runner:
      kind: playwright
      scope: package
      files: [tests/browser/create-region-edit-proof.mjs]
    expected:
      - Before sending, the panel names the region, its layer and the saved revision, and the configured image service with its cost.
      - Two complete generate, manual edit, regenerate, edit cycles land as revisions 2 and 4; every manual change is kept and the title stays editable text; undo and redo step across an accepted candidate.
      - A delayed candidate is refused after a newer manual save locked its target and after another tab saved; reject, cancel and a provider failure leave the project as it was.
      - Without project.generate the panel explains why and no region request is ever sent.
      - A free disclosure captured at the click stays free across asynchronous save and a paid refresh; refusal generates nothing and only another explicit click submits a paid cap.
      - Missing, string-valued or unsupported consent versions and missing or unknown cost classes disable region submission.
    prerequisites: [runner:playwright, browser:chromium, harness:oshal-core-root, core:dependencies, core:shared-theme-assets, service:docker, image:postgres-16-alpine-local]
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures: [tests/browser/create-region-edit-fixture.mjs, tests/region-edit.fixture.mjs, tests/project-api.fixture.mjs, tests/project-postgres.fixture.mjs]
      cleanup: Close browser contexts and loopback servers, remove the unique PostgreSQL fixture container and temporary storage; synthetic actors and a named fixture provider only.
    limits: {timeoutMs: 300000, maxMemoryMb: 1536}
    installation: never
  - id: region-edit-composite
    name: Region compositing leaves everything outside the region untouched
    purpose: Composite real provider-shaped answers into real images with sharp and compare every decoded pixel against the mask the compositor used.
    level: integration
    runner:
      kind: external
      scope: package
      files:
        - tests/region-edit-composite.test.mjs
    expected:
      - Every pixel the mask does not cover is byte-identical to the source, and every fully covered pixel is the provider's answer.
      - An inward feather softens only inside the region; box, rotated-quad and whole-image regions replace exactly what they cover.
      - The provider anchor is exactly the crop box; empty, non-image, SVG, GIF, oversized and size-mismatched inputs are refused.
    prerequisites:
      - runner:node
      - core:dependencies
      - harness:oshal-core-root
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/region-edit.fixture.mjs
        - tests/project-api.fixture.mjs
      cleanup: In-memory synthetic images only; no files, database, network or provider.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 512
    installation: never
  - id: region-edit-api
    name: Region edit HTTP admission with a named fixture provider
    purpose: Drive the compiled region-edit routes over real HTTP with the explicitly named create-region-fixture-provider and a strict non-writing database double.
    level: integration
    runner:
      kind: external
      scope: package
      files:
        - tests/region-edit-api.test.mjs
    expected:
      - Every region route refuses a missing project.view, project.read, project.generate or project.change before decoding, storage or any provider call.
      - Unknown fields, bad revisions, instructions and selections, bad IDs, tenant selectors and inactive identities are refused without database work.
      - The provider report names the fixture provider and cost class, refuses the CLI transport and never generates.
      - Provider reports advertise numeric costConsentVersion 1; malformed supplied maxCostClass values are refused before storage, provider resolution or generation.
      - The operator-only antigravity-cli rail is reported configured for the operator; a caller the kernel refuses, or whose provider is not available to them, is reported not configured with no provider tried and no generation; codex-cli stays refused.
    prerequisites:
      - runner:node
      - core:dependencies
      - harness:oshal-core-root
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures:
        - tests/region-edit.fixture.mjs
        - tests/project-api.fixture.mjs
      cleanup: Close loopback servers and remove owned temporary asset directories; synthetic actors and a named fixture provider only.
    limits:
      timeoutMs: 120000
      maxMemoryMb: 512
    installation: never
  - id: region-edit-postgres
    name: Region edit candidates, acceptance and ownership in PostgreSQL
    purpose: Apply the real migrations to a uniquely named disposable PostgreSQL and run the whole region-edit lifecycle over HTTP with the named fixture provider.
    level: integration
    runner:
      kind: external
      scope: package
      files:
        - tests/region-edit-postgres.test.mjs
    expected:
      - A candidate changes only the region; accepting it appends one child revision on the revision the person holds and records its source revision.
      - Two generate, manual edit, regenerate, manual edit cycles keep every manual change.
      - A late candidate never replaces a newer manual revision; replaced or locked targets are refused; cancel, failure and timeout keep the last revision.
      - A second owner and a colliding issuer see and act on nothing, down to the forced policy; revocation during generation discards the result.
      - One request in flight per person, a rolling daily ceiling, cleanup that keeps pending candidates, and no provider or cost for manual editing.
      - Explicit free and paid caps permit only known compatible providers; omitted caps retain legacy paid behavior.
      - Free-to-paid or unknown provider changes while queued fail before either generation method or accounting; the checked provider instance is used without fallback.
      - The operator's edit on the operator-only antigravity-cli rail becomes a ready candidate; anyone else's fails region_edit_provider_unavailable with nothing generated and no other provider tried; codex-cli is still refused before generation.
    prerequisites:
      - runner:node
      - core:dependencies
      - harness:oshal-core-root
      - service:docker
      - image:postgres-16-alpine-local
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures:
        - tests/project-postgres.fixture.mjs
        - tests/project-api.fixture.mjs
        - tests/region-edit.fixture.mjs
      cleanup: Remove the unique fixture container and temporary storage; never connect to the installed database or a real provider.
    limits:
      timeoutMs: 180000
      maxMemoryMb: 1024
    installation: never
