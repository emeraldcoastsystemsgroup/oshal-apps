  - id: editor-owner-rls
    name: Exact-owner row security holds against the role that OWNS the tables
    purpose: >-
      Apply the real migrations as the application role, so the reader is the table owner - the installed
      condition - and prove the exact-owner policy still refuses a missing, mismatched or wrong-issuer
      identity, including the write path, and that the platform identity arm lets core's catalog-driven
      /api/me export and delete reach the same person's rows without widening the policy to anyone else.
      One case performs the defect live: NO FORCE hands the row back to the wrong identity, FORCE takes it
      away again.
    level: integration
    runner:
      kind: external
      scope: package
      files:
        - tests/project-owner-rls.test.mjs
    expected:
      - Every table this package owns is row-security ENABLEd, FORCEd, and owned by the reading role.
      - An unstamped, mismatched-subject or mismatched-issuer read returns no rows, and a cross-owner UPDATE/DELETE changes none.
      - Writing a row for another owner is refused by WITH CHECK rather than silently dropped.
      - Removing FORCE exempts the owner immediately, which is why ENABLE alone protects nothing here.
      - Every owned table's policy carries both identity arms and no operator arm.
      - Stamped only with the platform identity core arrives with, the catalog-driven /api/me export reads every owned table and the delete removes every row.
      - A second person, an unstamped connection and the empty system stamp all read and delete nothing through either arm.
    prerequisites:
      - runner:node
      - core:dependencies
      - harness:oshal-core-root
      - service:docker
      - image:postgres-16-alpine-local
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures:
        - tests/project-postgres.fixture.mjs
      cleanup: Remove the unique fixture container and temporary storage; never connect to the installed database.
    limits:
      timeoutMs: 180000
      maxMemoryMb: 1024
    installation: never
