# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | Register all shipped package tests with explicit runner and fixture boundaries; retain readiness smoke identity.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Register actual Home/New palette, input retention, optional application colors and cross-tab browser proof.
# 3 | maintainer@emeraldcoastsystemsgroup.com | Register actual responsive workspace layout, distinct templates, keyboard navigation and unchanged studio access boundaries.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Register real Scan-to-Print launchers, access-gated owner summaries and query-free handoffs using the existing isolated Create fixture.
# 5 | maintainer@emeraldcoastsystemsgroup.com | Register seven editor suites with explicit model, browser, HTTP, PostgreSQL and real core admission boundaries.
# 6 | maintainer@emeraldcoastsystemsgroup.com | Include real shared-pool concurrency and queued authorization checks in the existing editor authorization recipe.
# 7 | maintainer@emeraldcoastsystemsgroup.com | Register original editable templates and real gallery, project, export and access behavior.
# 8 | maintainer@emeraldcoastsystemsgroup.com | Register shared artifact handoffs and bounded read-only editor context against the real core contracts.
# 9 | maintainer@emeraldcoastsystemsgroup.com | Retain the Home boot-order guard for the access-gated artifact handoff in the existing surface recipe.
# 10 | maintainer@emeraldcoastsystemsgroup.com | Register the brand kit: shared contract, HTTP boundary, PostgreSQL ownership and the real page, editor and Home in Chromium.
# 11 | maintainer@emeraldcoastsystemsgroup.com | Register the owner-role row-security proof: the api owns these tables and is the role that reads them, so the exact-owner policy only filters anything once the tables are FORCEd, and every other recipe here reads them through a role that is not the owner.
# 12 | maintainer@emeraldcoastsystemsgroup.com | Extend the owner-role row-security recipe with the platform identity arm: the same policy must also be satisfiable by the oshal.current_sub / oshal.current_issuer stamp core's catalog-driven /api/me export and delete arrive with, or forcing these tables makes a person's export omit their projects and their deletion remove nothing, both reporting success.
# 13 | maintainer@emeraldcoastsystemsgroup.com | 1.8.3 image filters: the model, renderer and workspace recipes now also cover saturation, grayscale, sepia and blur, named looks, neutral-value omission and preview-equals-export pixels.
# 14 | maintainer@emeraldcoastsystemsgroup.com | 1.8.4 region selection: register the source-pixel coordinate model (zoom, crop, rotation, resize, stale and ambiguous refusals) and the real-pointer Chromium proof that also checks the bounded read-only Jarvis region context.
# 15 | maintainer@emeraldcoastsystemsgroup.com | 1.9.0 region regeneration: register the real-sharp compositing boundary, the HTTP admission boundary with the named fixture provider and the disposable-PostgreSQL candidate/accept/reject/cancel lifecycle; the owner-RLS and core-authorization recipes now also cover create_region_edits, project.generate and the generator role.
# 16 | maintainer@emeraldcoastsystemsgroup.com | 1.9.1 region edit panel: register the real-Chromium proof that runs two complete generate, manual edit, regenerate, edit cycles through the real editor and the real compiled routes over a disposable PostgreSQL with the named fixture provider.
# 17 | maintainer@emeraldcoastsystemsgroup.com | 1.9.2 Edit video: the surface, New and workspace recipes now also cover the create-video-editor tile, card and quick start that open Video Studio's own editor.
# 18 | maintainer@emeraldcoastsystemsgroup.com | 1.9.3 audience views: register the audience-view contract and behaviour case (the view fed by the real compiled router over a strict read-only pool double).
# 19 | maintainer@emeraldcoastsystemsgroup.com | 1.9.4 cost consent: extend HTTP, PostgreSQL and real-editor recipes with explicit cap validation, post-queue refusal, legacy compatibility and click-time disclosure snapshots; registration is not execution evidence.
# 20 | maintainer@emeraldcoastsystemsgroup.com | 1.9.5 command-line image rails: the HTTP and PostgreSQL recipes now also expect the operator-only antigravity-cli rail to serve the operator, a refused or unavailable caller to be reported not configured with no other provider tried, and codex-cli to stay refused.
# 21 | maintainer@emeraldcoastsystemsgroup.com | 1.9.6 Brand Graphics: register the real Home, Quick start and New launchers, the access-gated owner summary and the exact handoffs on the existing isolated Create fixture.
