    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 30000 }
    installation: never
  - id: paper-facts
    name: The trading bots' facts carry the native paper book
    purpose: Load the shipped trading-book-facts.js with the legacy book store stood in as the native bridge answers it and prove the paper slot reports the person's native paper book after a tick, stays absent for a person without one, and is untouched on a host without the native paper engine.
