<!DOCTYPE html>
<!--
  Trading surface — signal-justified stock trading (ADR-052) across N accounts (ADR-134), with the
  information architecture of ADR-136: land on ALL accounts as tiles, click into ONE account for its
  detail (KPIs, Buy a stock, positions, chart + signal model + order ticket, journal, performance),
  and keep platform-level work — per-account strategy configuration, the Strategy Lab/Studio/Tuning,
  market research, cross-account reports — in the top-level navigation where it is never buried.

  This file is the SHELL: theme, styles, header, hosts. The runtime is ui/app.js (state, api(), the
  router) plus one module per view under ui/. Served by createTradingRoutes at /api/trading/ with
  the modules at /api/trading/ui/*. All data is live from /api/trading/* — nothing is simulated.
  Paper is one account like any other; live orders are gated server-side and need an explicit confirm.
-->
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trading</title>
<!-- Framework theme tokens + the bootstrap that picks the operator's theme (and follows it live).
     Theme files scope to [data-theme="…"] with NO :root fallback, so the default on <html> above
     matters — without it the surface would have no colors at all. -->
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css" />
<script src="/shared/ui/js/surface-theme.js"></script>
<style>
  /* This surface keeps its own short alias names, but DERIVES them from the framework theme rather
     than hardcoding hex — so all eleven themes work, not just midnight. Semantic status colors come
     from the theme too, with the old hex as a fallback so the surface stays legible if a theme omits
     one. Buy/sell BUTTONS (--buy2) keep a constant brand green by design. */
  :root {
    --bg:var(--bg-primary); --panel:var(--bg-secondary); --panel2:var(--bg-tertiary); --line:var(--border-color);
    --text:var(--text-primary); --muted:var(--text-secondary); --accent:var(--accent-primary, #7c6cff); --accent2:var(--status-success, #00d3a7);
    --scrollbar-thumb:rgba(255,255,255,.14);
    --buy:var(--status-success, #2fbf8f); --buy2:#1ba883; --sell:var(--status-error, #ec7672); --warn:var(--status-warning, #e3bd6a); --danger:var(--status-error, #f0908c);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,sans-serif;
    background:radial-gradient(1100px 460px at 50% -10%, color-mix(in srgb, var(--accent) 12%, transparent) 0, transparent 70%), var(--bg); color:var(--text); }
  .page { max-width:1480px; margin:0 auto; padding:18px 18px 70px; }
  .head { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:9px 14px; }
  ::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:6px}
  h1 { font-size:19px; margin:0; letter-spacing:.2px; }
  .badge { font-size:19px; }
  .sub { color:var(--muted); font-size:13px; line-height:1.5; }
  .actions { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .chip { display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; color:var(--text-primary, #dce8e5); }
  .chip i { width:8px; height:8px; border-radius:50%; background:var(--buy); }
  .btn { border:1px solid var(--line); background:var(--panel2); border-radius:8px; padding:9px 14px; cursor:pointer; font-size:13px; font-weight:700; color:var(--text); }
  .btn.primary { background:var(--buy2); color:#05130e; border-color:var(--buy2); }
  .btn.buy { background:var(--buy2); color:#05130e; border-color:var(--buy2); }
  .btn.ghost { background:var(--panel2); border:1px solid var(--line); color:var(--text); }
  .btn.sm { padding:5px 10px; font-size:12px; }
  .btn:hover { border-color:var(--accent); }
  .btn:disabled { opacity:.45; cursor:default; }
  .icon-btn { width:38px; min-height:36px; border:1px solid var(--line); background:var(--panel2); color:var(--text); border-radius:8px; cursor:pointer; font-weight:800; font-size:15px; }
  .icon-btn:hover { border-color:var(--accent); background:var(--panel2); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; box-shadow:0 22px 50px -34px #000; }
  .panel h2 { font-size:14px; margin:0 0 12px; }
  .panel.head2 { display:flex; align-items:center; gap:10px; }

  /* top-level navigation (ADR-136) */
  .nav { display:inline-flex; gap:2px; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--panel2); }
  .nav button { background:transparent; color:var(--muted); border:none; padding:8px 16px; cursor:pointer; font-size:13px; font-weight:700; }
  .nav button.on { background:var(--buy2); color:#05130e; }
  .nav button:hover:not(.on) { color:var(--text); }
  .acctctx { display:flex; gap:8px; align-items:center; }
  .acctctx select { width:auto; min-width:180px; padding:7px 9px; }
  .acctctx[hidden] { display:none; }

  /* account tiles — the landing page */
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; margin-bottom:16px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; cursor:pointer; transition:.14s; display:flex; flex-direction:column; gap:6px; text-align:left; color:inherit; }
  .tile:hover { border-color:var(--accent); transform:translateY(-1px); }
  .tile.view-only { opacity:.92; }
  .tile .t-name { font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .tile .t-eq { font-size:24px; font-weight:800; letter-spacing:-.4px; font-variant-numeric:tabular-nums; }
  .tile .t-row { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted); }
  .tile .t-row b { color:var(--text); font-weight:700; }
  .tile .t-actions { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .tile .t-strat { font-size:12px; color:var(--muted); }
  .tile .t-strat .ok { font-weight:700; }
  .hero-total { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .hero-total .n { font-size:30px; font-weight:800; letter-spacing:-.5px; font-variant-numeric:tabular-nums; }
  .acct-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .acct-head h2 { margin:0; font-size:17px; }
  .acct-head .spacer { margin-left:auto; }

  /* KPI strip */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(124px,1fr)); gap:10px; margin-bottom:16px; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:12px 14px; }
  .kpi .n { font-size:20px; font-weight:800; color:var(--text); letter-spacing:-.3px; font-variant-numeric:tabular-nums; }
  .kpi .n.pos { color:var(--buy); } .kpi .n.neg { color:var(--sell); }
  .kpi .l { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-top:3px; }
  .kpi .s { font-size:11px; color:var(--muted); margin-top:2px; }
  .kpi .v { font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; }

  /* master-detail */
  .dash { display:grid; grid-template-columns:330px minmax(0,1fr); gap:16px; align-items:start; }
  @media (max-width:1000px){ .dash { grid-template-columns:1fr; } }

  /* universe list (LEFT) */
  .uni-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .uni-head h2 { font-size:14px; margin:0; }
  .uni-head span { font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); }
  .uni-list { display:grid; gap:7px; max-height:660px; overflow:auto; padding-right:4px; }
  .uni-row { display:grid; grid-template-columns:1fr auto; gap:3px 10px; align-items:center; width:100%; text-align:left;
    padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg-tertiary, #16202b); cursor:pointer; color:inherit; transition:.14s; }
  .uni-row:hover { border-color:var(--border-color-hover, #3a4b58); background:var(--bg-card-hover, #1a2531); }
  .uni-row.active { border-color:var(--buy2); background:rgba(27,168,131,.10); box-shadow:inset 3px 0 0 var(--buy2); }
  .uni-row .s { font-weight:800; font-size:14px; }
  .uni-row .p { font-variant-numeric:tabular-nums; font-weight:800; font-size:13px; text-align:right; }
  .uni-row .a { font-size:11px; font-weight:700; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .uni-row .c { font-size:12px; font-weight:800; text-align:right; font-variant-numeric:tabular-nums; }
  .uni-row .gbar { grid-column:1 / -1; height:4px; border-radius:5px; background:var(--bg-tertiary, #233039); overflow:hidden; margin-top:5px; }
  .uni-row .gbar i { display:block; height:100%; border-radius:5px; }

  /* detail (RIGHT) */
  .det-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .det-id h2 { font-size:15px; margin:0; display:flex; align-items:center; gap:9px; }
  .det-price { font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:4px; }
  .det-meta { display:flex; gap:10px; align-items:center; flex-wrap:wrap; color:var(--muted); font-size:12.5px; font-weight:700; margin-top:2px; }
  .tf-switch { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .tf-switch button { background:var(--panel2); color:var(--muted); border:none; padding:6px 11px; cursor:pointer; font-size:12px; font-weight:700; }
  .tf-switch button.on { background:var(--buy2); color:#05130e; }
  .det-chart { height:330px; width:100%; border:1px solid var(--line); border-radius:8px; background:var(--bg-tertiary, #0e1620); overflow:hidden; }
  /* signal model bars */
  .sigmodel { display:grid; gap:9px; }
  .sm-row { display:grid; grid-template-columns:84px 1fr 56px; gap:10px; align-items:center; }
  .sm-row .k { font-size:12px; font-weight:800; color:var(--muted); text-transform:capitalize; }
  .sm-bar { position:relative; height:11px; border-radius:6px; background:var(--bg-tertiary, #1c2731); overflow:hidden; }
  .sm-bar .mid { position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--border-color, #34424f); z-index:1; }
  .sm-bar i { position:absolute; top:0; bottom:0; border-radius:6px; }
  .sm-bar i.pos { left:50%; background:linear-gradient(90deg,#34c79a,#1ba883); }
  .sm-bar i.neg { right:50%; background:linear-gradient(90deg,#ec7672,#c54747); }
  .sm-row .v { font-size:11px; font-weight:800; text-align:right; font-variant-numeric:tabular-nums; }
  .sm-why { margin:11px 0 0; font-size:13px; color:var(--muted); font-weight:600; line-height:1.5; }
  /* detail stat grid — the "what I own / made" numbers, always shown even when the chart can't load */
  .det-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:8px; margin:12px 0 14px; }
  .det-stats .st { background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:8px 10px; }
  .det-stats .st .l { font-size:9.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
  .det-stats .st .v { font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:3px; }

  /* the direct-trade ticket (ADR-136 D3) */
  .ticket { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr); gap:16px; align-items:start; }
  @media (max-width:1000px){ .ticket { grid-template-columns:1fr; } }
  .steps { display:flex; gap:6px; margin-bottom:12px; }
  .steps span { font-size:11px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); padding:5px 10px; border:1px solid var(--line); border-radius:20px; }
  .steps span.on { color:#05130e; background:var(--buy2); border-color:var(--buy2); }
  .steps span.done { color:var(--buy); border-color:var(--buy); }
  .summary-box { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:13px; line-height:1.6; }
  .summary-box b { font-size:15px; }

  /* single-stock research, watchlist and protected lots (ADR-138) */
  .research-grid { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr); gap:16px; }
  @media (max-width:1000px){ .research-grid { grid-template-columns:1fr; } }
  .news-item { padding:8px 0; border-bottom:1px solid var(--line); }
  .filing-row { display:flex; gap:8px; font-size:12.5px; padding:4px 0; }
  .news-item a, .filing-row a { color:var(--accent2); }
  .pill.pinned { color:var(--accent2); border-color:var(--accent); }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--muted); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.4px; padding:7px 8px; border-bottom:1px solid var(--line); cursor:pointer; user-select:none; }
  th.num, td.num { text-align:right; font-variant-numeric:tabular-nums; }
  td { padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:hover td { background:color-mix(in srgb, var(--accent) 6%, transparent); }
  .pos-row.active td { background:color-mix(in srgb, var(--accent) 16%, transparent); }
  .pos-row.active td:first-child { box-shadow:inset 3px 0 0 var(--accent); }
  input, select, textarea { width:100%; padding:8px; background:var(--panel2); border:1px solid var(--line); border-radius:8px; color:var(--text); font-family:inherit; font-size:13px; }
  textarea { resize:vertical; min-height:54px; }
  label.f { display:block; font-size:12px; color:var(--muted); margin-bottom:10px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .switch { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .switch button { background:var(--panel2); color:var(--muted); border:none; padding:7px 14px; cursor:pointer; font-size:12px; font-weight:700; }
  .switch button.on { background:var(--buy2); color:#05130e; }
  .switch button.on.live { background:var(--warn); color:#2b1d00; }
  .switch button:disabled { opacity:.4; cursor:not-allowed; }
  .pill { display:inline-block; font-size:10px; padding:2px 7px; border-radius:20px; border:1px solid var(--line); color:var(--muted); text-transform:uppercase; letter-spacing:.4px; font-weight:700; }
  .pill.buy { color:var(--buy); border-color:var(--buy); } .pill.sell { color:var(--sell); border-color:var(--sell); } .pill.hold { color:var(--muted); }
  .pill.own { color:var(--accent2); border-color:var(--accent); }
  /* ADR-159 - what the engine will NOT trade. `unmanaged` is amber, not red: it is a deliberate
     withholding, not a fault. `fenced` matches the pinned pill because both are the operator's
     own ring-fence. `unknown` is grey and quiet - it is an absence of knowledge, not a warning. */
  .pill.unmanaged { color:var(--warn); border-color:var(--warn); }
  .pill.fenced { color:var(--accent2); border-color:var(--accent); }
  .pill.unknown { color:var(--muted); border-color:var(--muted); }
  .pill.filled { color:var(--buy); border-color:var(--buy); } .pill.rejected { color:var(--danger); border-color:var(--danger); } .pill.pending,.pill.accepted{ color:var(--warn); border-color:var(--warn); }
  .livebanner { background:#3a2a08; border:1px solid #6b4a18; color:var(--warn); border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:14px; }
  .livebanner.viewonly { background:#2b2b2b; border-color:#555; color:var(--muted); }
  .err { color:var(--danger); } .ok { color:var(--buy); } .warn { color:var(--warn); }
  .spin { color:var(--muted); font-size:14px; padding:22px 0; text-align:center; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--buy); animation:p 1s infinite; }
  @keyframes p { 0%,100%{opacity:.3} 50%{opacity:1} }
  .foot { color:var(--muted); font-size:11px; margin-top:8px; }
  .why { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-top:8px; font-size:13px; }
  .why .rat { white-space:pre-wrap; line-height:1.55; color:var(--text-primary, #dbe6fb); }
  .sig { border-left:3px solid var(--buy2); padding:6px 10px; margin:8px 0; background:var(--bg-tertiary, #16202b); border-radius:0 8px 8px 0; }
  .sig a { color:var(--accent2); }

  /* sub-tabs inside a view */
  .tabbar { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 14px; border-bottom:1px solid var(--line); }
  .tabbar button { background:transparent; border:none; border-bottom:2px solid transparent; color:var(--muted); padding:10px 14px; cursor:pointer; font-size:13px; font-weight:700; }
  .tabbar button.on { color:var(--text); border-bottom-color:var(--buy2); }

  /* symbol-search autocomplete (ui/symbol-search.js) */
  .ss-wrap{position:relative}
  .ss-drop{position:absolute;z-index:70;left:0;right:0;top:100%;max-height:300px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 18px 40px -20px #000;margin-top:2px}
  .ss-item{display:flex;gap:8px;align-items:baseline;padding:7px 10px;cursor:pointer;font-size:13px}
  .ss-item:hover,.ss-item.on{background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .ss-item b{min-width:56px}
  .ss-item .nm{color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ss-item .ex{font-size:11px;color:var(--muted)}
  .ss-etf{font-size:10px;border:1px solid var(--line);border-radius:10px;padding:0 6px;color:var(--muted)}

  /* market-movers report tabs (view-research.js) */
  .mv-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .mv-tabs button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
  .mv-tabs button.on{background:var(--buy2);color:#05130e;border-color:var(--buy2)}

  /* settings modal */
  .modal-overlay { position:fixed; inset:0; background:rgba(6,10,14,.62); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); display:grid; place-items:start center; padding-top:84px; z-index:60; }
  .modal-overlay[hidden] { display:none; }
  .modal { width:min(440px,92vw); }
  .modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-head h2 { margin:0; font-size:16px; }

  @media (max-width:640px) {
    .page { padding:12px 10px 60px; }
    .grid2 { grid-template-columns:1fr; }
    input, select, textarea { font-size:16px; }
    .panel table { display:block; overflow-x:auto; white-space:nowrap; }
    .uni-list { max-height:300px; }
    .nav button { padding:8px 10px; font-size:12px; }
  }
</style>
  <link rel="stylesheet" href="/shared/ui/css/surface-glass.css" />
  <script src="/api/trading-charts/vendor/lightweight-charts.js?v=4.2.0"></script>
</head>
<body>
<div class="page">
  <div class="head">
    <span class="badge">📈</span>
    <h1>Trading</h1>
    <nav class="nav" id="nav" aria-label="Trading sections">
      <button data-view="accounts" class="on">Accounts</button>
      <button data-view="strategies">Strategies</button>
      <button data-view="research">Research</button>
      <button data-view="reports">Reports</button>
    </nav>
    <div class="actions">
      <div class="acctctx" id="acctCtx" hidden>
        <button class="btn ghost sm" id="backBtn" title="Back to all accounts">← All accounts</button>
        <span class="chip"><i id="engineDot"></i><span id="engineState"></span></span>
        <select id="bookSel" title="Switch account"></select>
      </div>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">C</button>
      <button class="btn ghost sm" id="refreshBtn">Refresh</button>
    </div>
  </div>
  <section class="panel" id="researchDraftPanel" hidden aria-label="Research draft">
    <h2>Continue your research</h2><p class="sub">Review the source context and choose a stock to investigate.</p>
    <label for="researchDraft">Evidence and questions</label><textarea id="researchDraft" rows="4" maxlength="6000" style="width:100%;display:block;margin:10px 0;font:inherit"></textarea>
    <label for="researchTicker">Stock ticker</label><input id="researchTicker" maxlength="10" placeholder="Enter a stock ticker">
    <button class="btn" id="researchDraftGo">Research this stock</button><p class="sub" id="researchDraftStatus" role="status"></p>
  </section>
  <section class="panel connected-app-actions" aria-label="Connected application actions" style="display:flex;gap:12px;flex-wrap:wrap"></section>
  <div id="main"><div class="spin"><span class="dot"></span> Loading…</div></div>
</div>

<div class="modal-overlay" id="settings" hidden>
  <div class="modal panel" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="modal-head"><h2>Settings</h2><button class="icon-btn" id="settingsClose" aria-label="Close">&times;</button></div>
    <div id="settingsBody" class="sub">Loading…</div>
  </div>
</div>

<!-- Runtime + one module per view (ADR-136 D2). Classic scripts, global functions — the moved
     code is byte-compatible with the pre-split page. app.js MUST load first. -->
<script src="/api/trading/ui/app.js"></script>
<script src="/api/trading/ui/symbol-search.js"></script>
<script src="/api/trading/ui/shared-positions.js"></script>
<script src="/api/trading/ui/ticket.js"></script>
<script src="/api/trading/ui/view-accounts.js"></script>
<script src="/api/trading/ui/view-account.js"></script>
<script src="/api/trading/ui/view-strategies.js"></script>
<script src="/api/trading/ui/view-events.js"></script>
