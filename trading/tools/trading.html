<!DOCTYPE html>
<!--
  Trading surface — signal-justified stock trading (ADR-052). Self-contained iframe page
  (served by createTradingRoutes at /api/trading/). MASTER-DETAIL cockpit: a KPI strip, then a
  left "universe" list (held positions + conviction-ranked recommendations) and a right DETAIL
  pane (real candle chart + the deterministic signal model + an order ticket) for the focused
  name. The deep features (journal, Strategy Lab — saved variations + persisted backtests +
  out-of-sample forward curves + regression drift (ADR-092), plus per-strategy notes/lessons
  journals and APPLY-TO-PROFILE with the hub strategy strip (ADR-095) — tuning, performance,
  recommendations, algorithms, capture/signals) live in tabs below (?tab=lab deep-links). Every
  order links back to its decision + the signal(s) that triggered it.
  Paper-only by default; live is gated server-side and needs an explicit confirm. Theme syncs to
  the cockpit. All data is live from /api/trading/* — nothing here is simulated.
-->
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trading</title>
<!-- Framework theme tokens + the bootstrap that picks the operator's theme (and follows it live).
     Theme files scope to [data-theme="…"] with NO :root fallback, so the default on <html> above
     matters — without it the surface would have no colors at all. -->
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css" />
<script src="/shared/ui/js/surface-theme.js"></script>
<style>
  /* This surface keeps its own short alias names, but DERIVES them from the framework theme rather
     than hardcoding hex — so all eleven themes work, not just midnight. Semantic status colors come
     from the theme too, with the old hex as a fallback so the surface stays legible if a theme omits
     one. Buy/sell BUTTONS (--buy2) keep a constant brand green by design. */
  :root {
    --bg:var(--bg-primary); --panel:var(--bg-secondary); --panel2:var(--bg-tertiary); --line:var(--border-color);
    --text:var(--text-primary); --muted:var(--text-secondary); --accent:var(--accent-primary, #7c6cff); --accent2:var(--status-success, #00d3a7);
    --scrollbar-thumb:rgba(255,255,255,.14);
    --buy:var(--status-success, #2fbf8f); --buy2:#1ba883; --sell:var(--status-error, #ec7672); --warn:var(--status-warning, #e3bd6a); --danger:var(--status-error, #f0908c);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,sans-serif;
    background:radial-gradient(1100px 460px at 50% -10%, color-mix(in srgb, var(--accent) 12%, transparent) 0, transparent 70%), var(--bg); color:var(--text); }
  .page { max-width:1480px; margin:0 auto; padding:18px 18px 70px; }
  .head { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 14px; }
  ::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:6px}
  h1 { font-size:19px; margin:0; letter-spacing:.2px; }
  .badge { font-size:19px; }
  .sub { color:var(--muted); font-size:13px; line-height:1.5; }
  .actions { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .chip { display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; color:var(--text-primary, #dce8e5); }
  .chip i { width:8px; height:8px; border-radius:50%; background:var(--buy); }
  .btn { border:1px solid var(--line); background:var(--panel2); border-radius:8px; padding:9px 14px; cursor:pointer; font-size:13px; font-weight:700; color:var(--text); }
  .btn.primary { background:var(--buy2); color:#05130e; border-color:var(--buy2); }
  .btn.buy { background:var(--buy2); color:#05130e; border-color:var(--buy2); }
  .btn.ghost { background:var(--panel2); border:1px solid var(--line); color:var(--text); }
  .btn.sm { padding:5px 10px; font-size:12px; }
  .btn:hover { border-color:var(--accent); }
  .btn:disabled { opacity:.45; cursor:default; }
  .icon-btn { width:38px; min-height:36px; border:1px solid var(--line); background:var(--panel2); color:var(--text); border-radius:8px; cursor:pointer; font-weight:800; font-size:15px; }
  .icon-btn:hover { border-color:var(--accent); background:var(--panel2); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; box-shadow:0 22px 50px -34px #000; }
  .panel h2 { font-size:14px; margin:0 0 12px; }
  .panel.head2 { display:flex; align-items:center; gap:10px; }

  /* KPI strip */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(124px,1fr)); gap:10px; margin-bottom:16px; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:12px 14px; }
  .kpi .n { font-size:20px; font-weight:800; color:var(--text); letter-spacing:-.3px; font-variant-numeric:tabular-nums; }
  .kpi .n.pos { color:var(--buy); } .kpi .n.neg { color:var(--sell); }
  .kpi .l { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-top:3px; }
  .kpi .s { font-size:11px; color:var(--muted); margin-top:2px; }

  /* master-detail */
  .dash { display:grid; grid-template-columns:330px minmax(0,1fr); gap:16px; align-items:start; }
  @media (max-width:1000px){ .dash { grid-template-columns:1fr; } }

  /* universe list (LEFT) */
  .uni-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .uni-head h2 { font-size:14px; margin:0; }
  .uni-head span { font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); }
  .uni-list { display:grid; gap:7px; max-height:660px; overflow:auto; padding-right:4px; }
  .uni-row { display:grid; grid-template-columns:1fr auto; gap:3px 10px; align-items:center; width:100%; text-align:left;
    padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg-tertiary, #16202b); cursor:pointer; color:inherit; transition:.14s; }
  .uni-row:hover { border-color:var(--border-color-hover, #3a4b58); background:var(--bg-card-hover, #1a2531); }
  .uni-row.active { border-color:var(--buy2); background:rgba(27,168,131,.10); box-shadow:inset 3px 0 0 var(--buy2); }
  .uni-row .s { font-weight:800; font-size:14px; }
  .uni-row .p { font-variant-numeric:tabular-nums; font-weight:800; font-size:13px; text-align:right; }
  .uni-row .a { font-size:11px; font-weight:700; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .uni-row .c { font-size:12px; font-weight:800; text-align:right; font-variant-numeric:tabular-nums; }
  .uni-row .gbar { grid-column:1 / -1; height:4px; border-radius:5px; background:var(--bg-tertiary, #233039); overflow:hidden; margin-top:5px; }
  .uni-row .gbar i { display:block; height:100%; border-radius:5px; }

  /* detail (RIGHT) */
  .det-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .det-id h2 { font-size:15px; margin:0; display:flex; align-items:center; gap:9px; }
  .det-price { font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:4px; }
  .det-meta { display:flex; gap:10px; align-items:center; flex-wrap:wrap; color:var(--muted); font-size:12.5px; font-weight:700; margin-top:2px; }
  .tf-switch { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .tf-switch button { background:var(--panel2); color:var(--muted); border:none; padding:6px 11px; cursor:pointer; font-size:12px; font-weight:700; }
  .tf-switch button.on { background:var(--buy2); color:#05130e; }
  .det-chart { height:330px; width:100%; border:1px solid var(--line); border-radius:8px; background:var(--bg-tertiary, #0e1620); overflow:hidden; }
  /* signal model bars */
  .sigmodel { display:grid; gap:9px; }
  .sm-row { display:grid; grid-template-columns:84px 1fr 56px; gap:10px; align-items:center; }
  .sm-row .k { font-size:12px; font-weight:800; color:var(--muted); text-transform:capitalize; }
  .sm-bar { position:relative; height:11px; border-radius:6px; background:var(--bg-tertiary, #1c2731); overflow:hidden; }
  .sm-bar .mid { position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--border-color, #34424f); z-index:1; }
  .sm-bar i { position:absolute; top:0; bottom:0; border-radius:6px; }
  .sm-bar i.pos { left:50%; background:linear-gradient(90deg,#34c79a,#1ba883); }
  .sm-bar i.neg { right:50%; background:linear-gradient(90deg,#ec7672,#c54747); }
  .sm-row .v { font-size:11px; font-weight:800; text-align:right; font-variant-numeric:tabular-nums; }
  .sm-why { margin:11px 0 0; font-size:13px; color:var(--muted); font-weight:600; line-height:1.5; }
  /* detail stat grid — the "what I own / made" numbers, always shown even when the chart can't load */
  .det-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:8px; margin:12px 0 14px; }
  .det-stats .st { background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:8px 10px; }
  .det-stats .st .l { font-size:9.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
  .det-stats .st .v { font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:3px; }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--muted); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.4px; padding:7px 8px; border-bottom:1px solid var(--line); cursor:pointer; user-select:none; }
  th.num, td.num { text-align:right; font-variant-numeric:tabular-nums; }
  td { padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:hover td { background:color-mix(in srgb, var(--accent) 6%, transparent); }
  .pos-row.active td { background:color-mix(in srgb, var(--accent) 16%, transparent); }
  .pos-row.active td:first-child { box-shadow:inset 3px 0 0 var(--accent); }
  input, select, textarea { width:100%; padding:8px; background:var(--panel2); border:1px solid var(--line); border-radius:8px; color:var(--text); font-family:inherit; font-size:13px; }
  textarea { resize:vertical; min-height:54px; }
  label.f { display:block; font-size:12px; color:var(--muted); margin-bottom:10px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .switch { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .switch button { background:var(--panel2); color:var(--muted); border:none; padding:7px 14px; cursor:pointer; font-size:12px; font-weight:700; }
  .switch button.on { background:var(--buy2); color:#05130e; }
  .switch button.on.live { background:var(--warn); color:#2b1d00; }
  .switch button:disabled { opacity:.4; cursor:not-allowed; }
  .pill { display:inline-block; font-size:10px; padding:2px 7px; border-radius:20px; border:1px solid var(--line); color:var(--muted); text-transform:uppercase; letter-spacing:.4px; font-weight:700; }
  .pill.buy { color:var(--buy); border-color:var(--buy); } .pill.sell { color:var(--sell); border-color:var(--sell); } .pill.hold { color:var(--muted); }
  .pill.own { color:var(--accent2); border-color:var(--accent); }
  .pill.filled { color:var(--buy); border-color:var(--buy); } .pill.rejected { color:var(--danger); border-color:var(--danger); } .pill.pending,.pill.accepted{ color:var(--warn); border-color:var(--warn); }
  .livebanner { background:#3a2a08; border:1px solid #6b4a18; color:var(--warn); border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:14px; }
  .err { color:var(--danger); } .ok { color:var(--buy); }
  .spin { color:var(--muted); font-size:14px; padding:22px 0; text-align:center; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--buy); animation:p 1s infinite; }
  @keyframes p { 0%,100%{opacity:.3} 50%{opacity:1} }
  .foot { color:var(--muted); font-size:11px; margin-top:8px; }
  .why { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-top:8px; font-size:13px; }
  .why .rat { white-space:pre-wrap; line-height:1.55; color:var(--text-primary, #dbe6fb); }
  .sig { border-left:3px solid var(--buy2); padding:6px 10px; margin:8px 0; background:var(--bg-tertiary, #16202b); border-radius:0 8px 8px 0; }
  .sig a { color:var(--accent2); }

  /* tabs */
  .tabbar { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 14px; border-bottom:1px solid var(--line); }
  .tabbar button { background:transparent; border:none; border-bottom:2px solid transparent; color:var(--muted); padding:10px 14px; cursor:pointer; font-size:13px; font-weight:700; }
  .tabbar button.on { color:var(--text); border-bottom-color:var(--buy2); }

  /* settings modal */
  .modal-overlay { position:fixed; inset:0; background:rgba(6,10,14,.62); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); display:grid; place-items:start center; padding-top:84px; z-index:60; }
  .modal-overlay[hidden] { display:none; }
  .modal { width:min(440px,92vw); }
  .modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-head h2 { margin:0; font-size:16px; }

  @media (max-width:640px) {
    .page { padding:12px 10px 60px; }
    .grid2 { grid-template-columns:1fr; }
    input, select, textarea { font-size:16px; }
    .panel table { display:block; overflow-x:auto; white-space:nowrap; }
    .uni-list { max-height:300px; }
  }
</style>
  <link rel="stylesheet" href="/shared/ui/css/surface-glass.css" />
  <script src="/api/trading-charts/vendor/lightweight-charts.js?v=4.2.0"></script>
</head>
<body>
<div class="page">
  <div class="head">
    <span class="badge">📈</span>
    <h1>Trading</h1>
    <div class="actions">
      <span class="chip"><i id="engineDot"></i><span id="engineState">Autopilot</span></span>
      <div class="switch" id="bookSwitch">
        <button data-mode="paper" class="on" id="paperBtn">Paper</button>
        <button data-mode="live" id="liveBtn">Live</button>
      </div>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">C</button>
      <button class="btn ghost sm" id="refreshBtn">Refresh</button>
    </div>
  </div>
  <div id="main"><div class="spin"><span class="dot"></span> Loading…</div></div>
</div>

<div class="modal-overlay" id="settings" hidden>
  <div class="modal panel" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="modal-head"><h2>Settings</h2><button class="icon-btn" id="settingsClose" aria-label="Close">&times;</button></div>
    <div id="settingsBody" class="sub">Loading…</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const main = $('main');
let MODE = 'paper';
let STATUS = { liveEnabled:false, paperConfigured:false, liveConfigured:false, guardrails:{} };
let STATE = { equity:0, positions:[], posSort:{ key:'marketValue', dir:-1 } };
let UNIVERSE = {};          // symbol -> { symbol, price, changePct, conviction, stance, held, avg, signals }
let CURRENT = null;         // focused symbol
let FOC_TF = '1Day';
let PERF_PERIOD = '1M';
/* deep-linkable tab: /api/trading/?tab=lab (or #tab=lab) opens straight into a tab — the hub
   strategy strip + external links use this to land on the Strategy Lab. */
let TAB = (function(){ try {
  const q = new URLSearchParams(location.search).get('tab') || (location.hash.match(/tab=([a-z]+)/i)||[])[1] || 'journal';
  return ['journal','lab','tuning','perf','reco','algos','capture'].includes(q) ? q : 'journal';
} catch { return 'journal'; } })();

const money = (n) => (n < 0 ? '-$' : '$') + Math.abs(Number(n||0)).toLocaleString(undefined, { maximumFractionDigits: 2 });
const pct = (n) => (n>=0?'+':'') + Number(n||0).toFixed(2) + '%';
const fmtDate = (iso) => { try { return new Date(iso).toLocaleString(); } catch { return iso || '—'; } };
const esc = (s) => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const cls = (n) => Number(n)>0?'pos':(Number(n)<0?'neg':'');
const gColor = (g) => g>=58 ? '#34c79a' : g>=46 ? '#e3bd6a' : '#ec7672';
/* one detail stat tile + a combined "$ amount (with %)" cell, colored by sign */
const st = (l, v) => '<div class="st"><div class="l">' + l + '</div><div class="v">' + v + '</div></div>';
const dollarPctCell = (d, p) => {
  const ref = d!=null ? d : (p!=null ? p : 0);
  const klass = ref>=0 ? 'ok' : 'err';
  const dPart = d!=null ? money(d) : '—';
  const pPart = p!=null ? ' <span style="font-size:11px;font-weight:700">' + pct(p) + '</span>' : '';
  return '<span class="' + klass + '">' + dPart + pPart + '</span>';
};

async function api(path, opts) {
  const sep = path.includes('?') ? '&' : '?';
  const r = await fetch('/api/trading' + path + sep + 'mode=' + MODE, Object.assign({ credentials: 'include' }, opts || {}));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.message || j.error || ('HTTP ' + r.status));
  return j;
}

/* ── book switch + settings ─────────────────────────────────── */
function wireSwitch() {
  $('paperBtn').onclick = () => setMode('paper');
  $('liveBtn').onclick = () => { if (STATUS.liveEnabled) setMode('live'); };
  $('liveBtn').disabled = !STATUS.liveEnabled;
  $('liveBtn').title = STATUS.liveEnabled ? '' : 'Live trading is disabled (TRADING_LIVE_ENABLED is not true).';
  $('refreshBtn').onclick = render;
  $('settingsBtn').onclick = openSettings;
  $('settingsClose').onclick = closeSettings;
  $('settings').addEventListener('click', (e) => { if (e.target === $('settings')) closeSettings(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSettings(); });
}
function setMode(m) { MODE = m; $('paperBtn').className = m==='paper'?'on':''; $('liveBtn').className = m==='live'?'on live':''; render(); }
function openSettings() {
  const g = STATUS.guardrails || {};
  $('settingsBody').innerHTML =
    '<div class="foot" style="margin-bottom:8px">BOOK</div>' +
    '<div style="margin-bottom:14px">Paper ' + (STATUS.paperConfigured?'<span class="ok">connected</span>':'<span class="err">not configured</span>') +
      ' · Live ' + (STATUS.liveEnabled ? (STATUS.liveConfigured?'<span class="ok">armed</span>':'<span class="warn">enabled, not configured</span>') : '<span class="foot">disabled</span>') + '</div>' +
    '<div class="foot" style="margin-bottom:8px">GUARDRAILS</div>' +
    '<table><tbody>' + (Object.keys(g).length ? Object.entries(g).map(([k,v]) =>
      '<tr><td style="color:var(--muted)">' + esc(k) + '</td><td class="num">' + esc(typeof v==='object'?JSON.stringify(v):v) + '</td></tr>').join('')
      : '<tr><td class="foot">No guardrail config returned by /status.</td></tr>') + '</tbody></table>';
  $('settings').hidden = false;
}
function closeSettings() { $('settings').hidden = true; }

/* ── main render ─────────────────────────────────────────────── */
async function render() {
  main.innerHTML = '<div class="spin"><span class="dot"></span> Loading the ' + MODE + ' book…</div>';
  try {
    STATUS = await api('/status');
    $('liveBtn').disabled = !STATUS.liveEnabled;
    $('engineState').textContent = MODE === 'live' ? 'Live book' : 'Paper book';
    const configured = MODE === 'live' ? STATUS.liveConfigured : STATUS.paperConfigured;
    const live = MODE === 'live'
      ? '<div class="livebanner">LIVE book — orders place REAL trades with REAL money. Each order asks you to confirm.</div>' : '';
    if (!configured) {
      main.innerHTML = live + '<div class="panel"><h2>Broker not connected</h2><div class="sub err">Set ALPACA_' + MODE.toUpperCase() +
        '_KEY_ID and ALPACA_' + MODE.toUpperCase() + '_SECRET_KEY' + (MODE==='live'?' and TRADING_LIVE_ENABLED=true':' (free + instant at alpaca.markets)') + '.</div></div>';
      return;
    }
    main.innerHTML = live +
      '<div id="kpis" class="kpis"></div>' +
      // WHAT the book is running (env defaults vs an applied lab strategy) — always visible on the hub.
      '<div id="stratStrip"></div>' +
      // LEAD with the open positions — the whole book up top, full width.
      '<div id="positionsHero"><div class="panel"><div class="spin"><span class="dot"></span> Loading positions…</div></div></div>' +
      // The detail pane (chart + signal model + ticket) reveals below when you click a position.
      '<div class="panel" id="focus"><div class="foot" style="padding:22px 6px;text-align:center">Select a position above to open its chart, signal model and order ticket.</div></div>' +
      '<div class="tabbar" id="tabbar"></div><div id="tabpanel"></div>';
    renderTabs();
    loadStrategyStrip();            // the hub's "what strategy is my profile on?" strip (async)
    await loadKpisAndPositions();   // KPI strip + STATE.positions + render the positions table (hero)
    annotatePositionSignals();      // annotate each position with its current stored signal (async, DB)
    loadPerfSummary();              // fill total-return / vs-S&P KPI tiles without opening the tab
    selectTab(TAB);                 // render the active tab's content
  } catch (e) {
    main.innerHTML = '<div class="panel err">' + esc(e.message) + '</div>';
  }
}

/* ── KPI strip + positions → universe seed ───────────────────── */
async function loadKpisAndPositions() {
  try {
    const j = await api('/ledger');
    const a = j.account || { equity:0, cash:0, buyingPower:0 };
    const pos = (j.positions || []).map(p => {
      const cost = Number(p.avgEntryPrice||0) * Number(p.qty||0);
      const px = Number(p.currentPrice|| (cost? (Number(p.marketValue)/Number(p.qty)) : 0));
      return Object.assign({}, p, { cost, price:px, retPct: cost>0 ? (Number(p.unrealizedPl)/cost)*100 : 0 });
    });
    STATE.equity = Number(a.equity||0); STATE.positions = pos;
    const upl = pos.reduce((s,p)=>s+Number(p.unrealizedPl||0),0);
    // ONE consolidated, honest day number. Prefer the server's day = equity − last COMPLETED session close
    // (reliable baseline). Only if that's unavailable fall back to the intraday-move sum. We do NOT add
    // realized-since-entry here — that's accumulated profit, not today's move, and made a down day look green.
    const serverDay = (j.day && j.day.dayPL != null) ? j.day : null;
    const intradayKnown = pos.some(p => p.unrealizedIntradayPl != null);
    const intradayPL = pos.reduce((s,p) => s + (p.unrealizedIntradayPl != null ? Number(p.unrealizedIntradayPl) : 0), 0);
    const dayPL = serverDay ? Number(serverDay.dayPL) : intradayPL;
    const dayPct = serverDay ? Number(serverDay.dayPLPct) : (STATE.equity - dayPL > 0 ? (dayPL/(STATE.equity - dayPL))*100 : 0);
    // hold ourselves accountable: show today's move next to SPY's today move (are we beating the market today?)
    const spyPos = pos.find(p => p.symbol === 'SPY');
    const spyDayPct = (spyPos && spyPos.changeToday != null) ? Number(spyPos.changeToday)*100 : null;
    const spyBit = spyDayPct!=null ? (' <span class="s">vs S&P '+pct(spyDayPct)+'</span>') : '';
    const dayNode = (serverDay || intradayKnown) ? ('<span class="n" style="color:'+(dayPL>=0?'var(--buy)':'var(--sell)')+'">' + money(dayPL) + '</span> <span class="s">' + pct(dayPct) + ' today</span>' + spyBit) : '—';
    $('kpis').innerHTML =
      kpi(money(a.equity), 'Equity') +
      '<div class="kpi"><div>' + dayNode + '</div><div class="l">Day P&L</div></div>' +
      kpi('<span id="kTot">—</span>', 'Total return') +
      kpi('<span id="kVs">—</span>', 'vs S&P 500') +
      kpi(money(upl), 'Open P&L', null, cls(upl)) +
      kpi('<span id="kReal">—</span>', 'Realized today') +
      kpi('<span id="kWin">—</span>', 'Win rate 30d') +
      kpi(money(a.cash), 'Cash') +
      kpi(String(pos.length), 'Positions');
    // seed universe with held names (instant), then focus the largest holding (or SPY)
    pos.forEach(p => { UNIVERSE[p.symbol] = Object.assign(UNIVERSE[p.symbol]||{}, {
      symbol:p.symbol, price:p.price, changePct: p.changeToday!=null?Number(p.changeToday)*100:null,
      held:true, qty:p.qty, avg:Number(p.avgEntryPrice||0), retPct:p.retPct, mktValue:Number(p.marketValue||0),
      uPl:Number(p.unrealizedPl||0), uPlDay:(p.unrealizedIntradayPl!=null?Number(p.unrealizedIntradayPl):null) }); });
    renderPortfolioTable();   // the hero table at the top — lead with the open book
    loadRealized();
  } catch (e) { $('kpis').innerHTML = '<div class="panel err">' + esc(e.message) + '</div>'; }
}
function kpi(n, l, id, klass) { return '<div class="kpi"' + (id?(' id="'+id+'"'):'') + '><div class="n ' + (klass||'') + '">' + n + '</div><div class="l">' + l + '</div></div>'; }

/* ── positions list (LEFT) — YOUR BOOK; the signal is annotated ON each holding ──

function renderPositions() {

  host.innerHTML = items.map(u => {

/* one deterministic scan of the held book → annotate each position with its current ensemble signal */
async function annotatePositionSignals() {
  const held = Object.values(UNIVERSE).filter(u => u.held).map(u => u.symbol);
  if (!held.length) return;
  try {
    // DB lookup of the engine's recorded signals — ONE query for the whole book, no market-data calls.
    const j = await api('/signal-latest', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ symbols: held }) });
    (j.results || []).forEach(s => { if (UNIVERSE[s.symbol]) UNIVERSE[s.symbol].signal = (s.ensemble || {}).action || 'hold'; });

/* ── portfolio table (TAB) — the whole book at a glance: avg cost, value, day & total P&L ──
 * Read-only ledger of what the AI holds and how each name is doing. Sortable; click a row to
 * open that name's chart + signal model + ticket in the detail pane above. This is the view the
 * old screen had — every position and its money, without clicking through one at a time. */
function posSortVal(p) {
  switch (STATE.posSort.key) {
    case 'symbol': return p.symbol;
    case 'qty': return Number(p.qty)||0;
    case 'avg': return Number(p.avgEntryPrice)||0;
    case 'last': return Number(p.price)||0;
    case 'dayPl': return p.unrealizedIntradayPl!=null?Number(p.unrealizedIntradayPl):-1e15;
    case 'dayPct': return p.changeToday!=null?Number(p.changeToday):-1e15;
    case 'uPl': return Number(p.unrealizedPl)||0;
    case 'retPct': return Number(p.retPct)||0;
    default: return Number(p.marketValue)||0;
  }
}
function renderPortfolioTable() {

  const dir = STATE.posSort.dir;
  const rows = pos.slice().sort((a,b)=>{ const va=posSortVal(a), vb=posSortVal(b); return dir * (va<vb?-1:va>vb?1:0); });
  const arrow = (k) => STATE.posSort.key===k ? (STATE.posSort.dir<0?' ▾':' ▴') : '';
  const th = (k,label,extra) => '<th class="' + (extra||'') + '" data-sort="' + k + '">' + label + arrow(k) + '</th>';
  const body = rows.map(p => {

    return '<tr data-fsym="' + esc(p.symbol) + '" class="pos-row' + (p.symbol===CURRENT?' active':'') + '" style="cursor:pointer">' +

  host.innerHTML = '<div class="panel"><div class="panel head2"><h2 style="margin:0">Portfolio — your whole book (' + MODE + ')</h2>' +
      '<span class="foot" style="margin-left:auto">' + pos.length + ' held · ' + money(tot.mv) + ' value</span></div>' +
    '<div style="overflow-x:auto"><table><thead><tr>' +
      th('symbol','Symbol') + '<th>Signal</th>' + th('qty','Qty','num') + th('avg','Avg cost','num') + th('last','Last','num') +
      th('marketValue','Mkt value','num') + th('dayPl','Today $','num') + th('dayPct','Today %','num') + th('uPl','Total $','num') + th('retPct','Total %','num') +
    '</tr></thead><tbody>' + body + '</tbody>' +

      '<td class="num ' + (tot.day>=0?'ok':'err') + '"><strong>' + money(tot.day) + '</strong></td><td></td>' +
      '<td class="num ' + (tot.upl>=0?'ok':'err') + '"><strong>' + money(tot.upl) + '</strong></td><td></td></tr></tfoot>' +
    '</table></div>' +
    '<div class="foot" style="margin-top:8px">Click any row to open its chart, signal model and order ticket below. The AI manages these positions — this table is your read-only ledger of what it holds and how each is doing.</div></div>';
  host.querySelectorAll('th[data-sort]').forEach(t => t.onclick = () => {

async function drawFocusChart(sym) {
  const el = $('focChart'); if (!el) return;
  if (!window.LightweightCharts) { el.innerHTML = '<div class="foot err" style="padding:14px">Chart library failed to load.</div>'; return; }
  if (FCHART) { try { FCHART.remove(); } catch {} FCHART = null; FENTRY = null; }
  const css = getComputedStyle(document.documentElement); const line = (v,d)=>(css.getPropertyValue(v).trim()||d);
  FCHART = LightweightCharts.createChart(el, { width: el.clientWidth, height: 330,
    layout:{ background:{ type:'solid', color:'transparent' }, textColor: line('--muted','#8a99a3') },
    grid:{ vertLines:{ color: line('--line','#26333f') }, horzLines:{ color: line('--line','#26333f') } },
    timeScale:{ timeVisible: FOC_TF==='5Min'||FOC_TF==='1Hour', borderColor: line('--line','#26333f') },
    rightPriceScale:{ borderColor: line('--line','#26333f') }, crosshair:{ mode:0 } });
  FCANDLE = FCHART.addCandlestickSeries({ upColor:'#34c79a', downColor:'#ec7672', wickUpColor:'#34c79a', wickDownColor:'#ec7672', borderVisible:false });
  FVOL = FCHART.addHistogramSeries({ priceFormat:{ type:'volume' }, priceScaleId:'' });
  FVOL.priceScale().applyOptions({ scaleMargins:{ top:0.82, bottom:0 } });
  try {
    const bars = await chartBars(sym, FOC_TF);
    FCANDLE.setData(bars.map(b => ({ time:b.t, open:b.o, high:b.h, low:b.l, close:b.c })));
    FVOL.setData(bars.map(b => ({ time:b.t, value:b.v, color: b.c>=b.o?'rgba(52,199,154,.35)':'rgba(236,118,114,.35)' })));
    const avg = (UNIVERSE[sym]||{}).avg || 0;
    if (avg > 0) FENTRY = FCANDLE.createPriceLine({ price: avg, color:'#5fa8ff', lineWidth:1, lineStyle:2, axisLabelVisible:true, title:'avg cost' });
    FCHART.timeScale().fitContent();
    try { new ResizeObserver(()=>{ if (FCHART && el.clientWidth) FCHART.applyOptions({ width: el.clientWidth }); }).observe(el); } catch {}
  } catch (e) {
    const m = String(e.message || '');
    const feedDown = /HTTP 50\d|alpaca_|fetch failed|timed?_?out|timeout|data_feed|broker_not_configured/i.test(m);
    el.innerHTML = '<div style="padding:18px 16px;color:var(--muted);font-size:13px;line-height:1.6">' +
      '<div style="font-weight:800;color:var(--text);margin-bottom:4px">Live chart unavailable</div>' +
      (feedDown
        ? 'The market-data feed isn’t responding right now (' + esc(m) + '). The position numbers above are live from your broker — only the candles are missing.'
        : esc(m)) +
      ' <button class="btn ghost sm" id="focChartRetry" style="margin-top:10px;display:block">Retry chart</button></div>';
    const rb = document.getElementById('focChartRetry'); if (rb) rb.onclick = () => drawFocusChart(sym);
  }
}
/* the deterministic "influence model": the engine's per-algo signals + ensemble for this name.
 * Default = a pure DB read of the engine's RECORDED signals (no Alpaca call, no rate limit). The
 * "Recompute live" button is the only click path that re-hits the market-data feed on demand. */
function renderSigModel(sym, s, live) {
  const host = $('focSig'), why = $('focWhy'), conv = $('focConv'); if (!host || CURRENT !== sym) return;
  const e = s.ensemble || { action:'hold', score:0 };
  const sigs = s.signals || [];
  const ALGOS = ['momentum','gravity','donchian','meanrev'];
  if (conv) conv.innerHTML = 'ensemble <span class="pill ' + (e.action==='buy'?'buy':e.action==='sell'?'sell':'hold') + '">' + e.action + (e.score!=null?(' ' + e.score):'') + '</span>';
  host.innerHTML = ALGOS.map(algo => {
    const v = sigs.find(x => (x.algo||'').toLowerCase().startsWith(algo.slice(0,4)));
    const dir = v ? v.dir : null;
    const mag = v && v.confidence!=null ? Math.round(Math.abs(v.confidence)*100) : (dir? 60 : 0);
    const wpx = Math.min(50, mag/2);
    const barI = dir==='up' ? '<i class="pos" style="width:' + wpx + '%"></i>' : dir==='down' ? '<i class="neg" style="width:' + wpx + '%"></i>' : '';
    const val = dir==='up' ? '<span class="v ok">▲</span>' : dir==='down' ? '<span class="v err">▼</span>' : '<span class="v foot">—</span>';
    return '<div class="sm-row"><span class="k">' + algo + '</span><span class="sm-bar"><span class="mid"></span>' + barI + '</span>' + val + '</div>';
  }).join('');
  const mtf = s.mtf ? ' Multi-timeframe conviction: <strong class="' + (s.mtf.dir==='up'?'ok':'err') + '">' + s.mtf.dir + ' ' + Math.round((s.mtf.confidence||0)*100) + '%</strong>.' : '';
  if (s.error) why.innerHTML = '<span class="err">' + esc(s.error) + '</span>';
  else if (!sigs.length && !s.mtf) why.innerHTML = '<span class="err">No stored signal for ' + esc(sym) + ' yet — the engine hasn’t scored it recently. Hit “Recompute live”.</span> <button class="btn ghost sm" id="focRecompute" style="margin-top:8px">Recompute live</button>';
  else why.innerHTML = (live
      ? 'Recomputed live just now from market data (momentum, gravity, donchian, mean-reversion — no LLM).'
      : 'Latest stored read from the engine — a DB lookup, no live call' + (s.asOf?(' · as of ' + fmtDate(s.asOf)):'') + '.') +
    mtf + ' Current: ' + e.action + (e.score!=null?(' (score ' + e.score + ')'):'') + '.' +
    ' <button class="btn ghost sm" id="focRecompute" style="margin-top:8px">Recompute live</button>';
  const rb = $('focRecompute'); if (rb) rb.onclick = () => recomputeSignalLive(sym);
  renderTicket(sym, e);
}
/* passive read — pure DB lookup of the engine's recorded signals (no Alpaca call, no rate limit) */
async function loadSignalModel(sym) {
  try {
    const j = await api('/signal-latest', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ symbols:[sym] }) });
    renderSigModel(sym, (j.results || []).find(x => x.symbol===sym) || { signals:[], ensemble:{ action:'hold', score:0 } }, false);
  } catch (err) {
    if (CURRENT === sym) { const h=$('focSig'); if (h) h.innerHTML = '<div class="foot err">' + esc(err.message) + '</div>'; const c=$('focConv'); if (c) c.textContent=''; }
  }
}
/* explicit, user-triggered live recompute — the ONLY click path that calls the market-data feed */
async function recomputeSignalLive(sym) {
  const why = $('focWhy'); if (why) why.innerHTML = '<span class="dot"></span> Recomputing from live market data…';
  try {
    const j = await api('/scan', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ symbols:[sym] }) });
    renderSigModel(sym, (j.scanned || []).find(x => x.symbol===sym) || { signals:[], ensemble:{ action:'hold', score:0 } }, true);
  } catch (err) {
    if (CURRENT === sym && why) why.innerHTML = '<span class="err">' + esc(err.message) + '</span>';
  }
}
function renderTicket(sym, ensemble) {

  host.innerHTML = '<div class="why"><div class="panel head2" style="padding:0;background:none;border:0;box-shadow:none;margin:0 0 8px"><h2 style="margin:0;font-size:13px">Order ticket</h2><span class="pill ' + (act==='buy'?'buy':'sell') + '" style="margin-left:auto">' + act.toUpperCase() + '</span></div>' +
    '<button class="btn ' + (act==='buy'?'buy':'ghost') + ' sm" id="focTrade">' + (MODE==='live'?'Reason &amp; place LIVE order':'Reason &amp; place paper order') + '</button> <span class="sub" id="focTradeMsg"></span><div id="focTradeOut"></div></div>';
  $('focTrade').onclick = () => focusTrade(sym);
}
async function focusTrade(sym) {
  const out = $('focTradeOut'), msg = $('focTradeMsg'); if (!out) return;
  msg.className='sub'; msg.innerHTML='<span class="dot"></span> Deterministic decision…';
  try {
    const d = await api('/decide-algo', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ symbol: sym }) });

function copyText(text, msgEl) {
  const done = () => { if (msgEl) { msgEl.textContent = 'copied ✓'; setTimeout(() => { msgEl.textContent = ''; }, 1800); } };
  try { navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); }
  catch { fallbackCopy(text, done); }
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
  ta.select(); try { document.execCommand('copy'); } catch {} document.body.removeChild(ta); done();
}
async function labApply(id) {

/* Blend builder — checked rotation strategies → one weighted portfolio strategy ("30% A + 20% B"). */
async function labBlendSelected() {
  const picked = LAB.strategies.filter(s => LAB.selected.has(s.id));
  const rot = picked.filter(s => (s.config || {}).kind === 'rotation');
  if (rot.length < 2) { $('labMsg').textContent = 'Check at least 2 ROTATION strategies (the checkboxes on the left), then Blend.'; return; }
  if (rot.length < picked.length) $('labMsg').textContent = (picked.length - rot.length) + ' non-rotation selection(s) skipped — blends take rotation components only.';
  const components = [];
  const equal = Math.floor(100 / (rot.length + 1)); // leave room for a core by default
  for (const s of rot) {
    const w = prompt('Percent of the money for:\n"' + s.name + '"\n\n(The unallocated remainder becomes the SPY core.)', String(equal));
    if (w == null) return;
    const pct = Math.round(Number(w));
    if (!(pct >= 1 && pct <= 95)) { $('labMsg').textContent = 'Weights must be 1–95%.'; return; }
    components.push({ strategyId: s.id, weightPct: pct, _name: s.name });
  }
  const total = components.reduce((t, c) => t + c.weightPct, 0);
  if (total > 100) { $('labMsg').textContent = 'Weights sum to ' + total + '% — must be ≤ 100.'; return; }
  const name = prompt('Name this blend:', components.map(c => c.weightPct + '% ' + c._name.split(' ')[0]).join(' + ') + (total < 100 ? ' + ' + (100 - total) + '% core' : ''));
  if (!name) return;
  try {
    await labApi('/strategies', jbody({
      name: name.trim(),
      description: 'Blend: ' + components.map(c => c.weightPct + '% ' + c._name).join(' + ') + (total < 100 ? ' · ' + (100 - total) + '% SPY core' : ''),
      config: { kind: 'blend', coreSymbol: 'SPY', components: components.map(c => ({ strategyId: c.strategyId, weightPct: c.weightPct })) },
    }));
    $('labMsg').textContent = 'Blend saved — hit Backtest to see what the mix would have done.';
    await refreshLabList();
  } catch (e) { $('labMsg').textContent = e.message; }
}

async function drawLabChart() {
  const el = $('labChart'), msg = $('labChartMsg'), leg = $('labLegend'); if (!el) return;
  if (LAB.chart) { try { LAB.chart.remove(); } catch {} LAB.chart = null; }
  if (!window.LightweightCharts) { msg.innerHTML = '<span class="err">chart lib missing</span>'; return; }
  const ids = [...LAB.selected]; leg.innerHTML = '';
  if (!ids.length) { msg.textContent = 'Select a strategy above to chart its curves.'; return; }
  msg.textContent = 'loading curves…';
  const css = getComputedStyle(document.documentElement); const line = (v,d)=> (css.getPropertyValue(v).trim()||d);
  LAB.chart = LightweightCharts.createChart(el, { width: el.clientWidth, height: 320,
    layout:{ background:{ type:'solid', color:'transparent' }, textColor: line('--muted','#8a99a3') },
    grid:{ vertLines:{ color: line('--line','#26333f') }, horzLines:{ color: line('--line','#26333f') } },
    rightPriceScale:{ borderColor: line('--line','#26333f') }, timeScale:{ borderColor: line('--line','#26333f') }, crosshair:{ mode:0 } });
  let spyDrawn = false; const legends = [];
  for (let i = 0; i < ids.length; i++) {
    try {
      const detail = await labApi('/strategies/' + ids[i]);
      const s = detail.strategy;
      const runId = s.baselineRunId || ((detail.runs||[]).find(r => r.kind==='backtest' && r.status==='ok') || {}).id;
      const color = LAB_COLORS[i % LAB_COLORS.length];
      if (runId) {
        const rr = await labApi('/runs/' + runId);
        const curve = (rr.run && rr.run.curve) || [];
        if (curve.length) {
          LAB.chart.addLineSeries({ color, lineWidth: 2, title: s.name }).setData(curve.map(p => ({ time: p.d, value: p.e })));
          if (!spyDrawn) { LAB.chart.addLineSeries({ color: line('--muted','#8a99a3'), lineWidth: 1, lineStyle: 2, title: 'SPY' }).setData(curve.map(p => ({ time: p.d, value: p.s }))); spyDrawn = true; }
        }
      }
      const fwd = (detail.forward && detail.forward.points) || [];
      if (fwd.length) LAB.chart.addLineSeries({ color, lineWidth: 2, lineStyle: 2, title: s.name + ' (fwd)' }).setData(fwd.map(p => ({ time: p.d, value: p.e })));
      legends.push('<span style="color:' + color + '">■</span> ' + esc(s.name) + (fwd.length ? ' <span class="foot">(+' + fwd.length + ' fwd)</span>' : ''));
    } catch (e) { legends.push('<span class="err">' + esc(e.message) + '</span>'); }
  }
  LAB.chart.timeScale().fitContent();
  leg.innerHTML = legends.join(' · ');
  msg.textContent = '';
  try { new ResizeObserver(()=>{ if (LAB.chart && el.clientWidth) LAB.chart.applyOptions({ width: el.clientWidth }); }).observe(el); } catch {}
}

  host.innerHTML =
    '<div class="panel"><h2>Capture a signal</h2>' +
    '<div class="sub" style="margin-bottom:12px">Snapshot what you read — a tweet, a headline. Stored immutably so any trade can be traced back to it.</div>' +
    '<div class="grid2">' +
      '<label class="f">Source<select id="sgSource"><option value="x">X / Twitter</option><option value="news">News</option><option value="inbox">Inbox</option><option value="manual">Manual</option></select></label>' +
      '<label class="f">Symbols (comma-sep)<input id="sgSymbols" placeholder="AAPL, SPY"></label>' +
      '<label class="f">Author / publisher<input id="sgAuthor" placeholder="@source"></label>' +
      '<label class="f">Link (optional)<input id="sgUrl" placeholder="https://…"></label>' +
    '</div>' +
    '<label class="f">Headline / title<input id="sgTitle" placeholder="Short form"></label>' +
    '<label class="f">Body<textarea id="sgBody" placeholder="Paste the artifact text…"></textarea></label>' +
    '<button class="btn primary" id="sgBtn">Capture signal</button> <span id="sgMsg" class="sub"></span></div>' +
    '<div id="feed"></div>';
  $('sgBtn').onclick = captureSignal;
}
async function captureSignal() {
  const msg = $('sgMsg'); const btn = $('sgBtn');
  const body = { source: $('sgSource').value, symbols: $('sgSymbols').value.split(',').map(s=>s.trim()).filter(Boolean),
    author: $('sgAuthor').value.trim(), url: $('sgUrl').value.trim(), title: $('sgTitle').value.trim(), body: $('sgBody').value.trim() };
  if (!body.body && !body.title) { msg.className='sub err'; msg.textContent='Add a headline or body.'; return; }
  btn.disabled = true; msg.className='sub'; msg.innerHTML='<span class="dot"></span> Capturing…';
  try { await api('/signals', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    msg.className='sub ok'; msg.textContent='Captured.'; $('sgBody').value=''; $('sgTitle').value=''; await loadFeed();
  } catch (e) { msg.className='sub err'; msg.textContent=e.message; } finally { btn.disabled=false; }
}
async function loadFeed() {
  const host = $('feed'); if (!host) return;
  let signals = [];
  try { signals = (await api('/signals')).signals || []; } catch (e) { host.innerHTML='<div class="panel err">'+esc(e.message)+'</div>'; return; }
  host.innerHTML = '<div class="panel"><h2>Signal feed</h2>' +
    (signals.length ? signals.map(s =>
      '<div class="sig"><div><strong>' + esc(s.title || (s.body||'').slice(0,80)) + '</strong> ' +
      (s.symbols && s.symbols.length ? '<span class="pill">' + s.symbols.map(esc).join(', ') + '</span>' : '') + '</div>' +
      '<div class="foot">' + esc(s.source) + (s.author ? ' · ' + esc(s.author) : '') + ' · ' + fmtDate(s.observed_at) +
      (s.url ? ' · <a href="' + esc(s.url) + '" target="_blank">source</a>' : '') + '</div>' +
      '<div style="margin-top:6px"><button class="btn ghost sm" data-sig="' + s.signal_id + '">Reason over this →</button> <span class="sub" id="dm_' + s.signal_id + '"></span></div>' +
      '<div id="dec_' + s.signal_id + '"></div></div>'
    ).join('') : '<div class="foot">No signals captured yet for the ' + MODE + ' book.</div>') + '</div>';
  host.querySelectorAll('button[data-sig]').forEach(b => b.onclick = () => decide(b.getAttribute('data-sig')));
}
async function decide(signalId) {
  const msg = $('dm_' + signalId); const host = $('dec_' + signalId);
  msg.className='sub'; msg.innerHTML='<span class="dot"></span> Analyst is reasoning… (~20s)';
  try {
    const j = await api('/decide', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ signalIds:[signalId] }) });
    msg.textContent=''; const d = j.decision; const actionable = d.action !== 'hold' && d.symbol && d.qty > 0;
    host.innerHTML = '<div class="why"><div><span class="pill ' + d.action + '">' + d.action + '</span> ' +
      (actionable ? '<strong>' + esc(d.symbol) + '</strong> · ' + d.qty + ' sh · ' + esc(d.orderType||'market') + (d.limitPrice?(' @ '+money(d.limitPrice)):'') : 'no trade') +
      ' <span class="foot">confidence ' + Math.round((d.confidence||0)*100) + '%</span></div>' +
      '<div class="rat" style="margin-top:8px">' + esc(d.rationale) + '</div>' +
      (actionable ? '<div style="margin-top:10px"><button class="btn ' + (d.side==='sell'?'ghost':'buy') + ' sm" id="exec_' + j.decisionId + '">' + (MODE==='live'?'Place LIVE order':'Place paper order') + '</button> <span class="sub" id="em_' + j.decisionId + '"></span></div>' : '') + '</div>';
    if (actionable) $('exec_' + j.decisionId).onclick = () => execute(j.decisionId, d);
  } catch (e) { msg.className='sub err'; msg.textContent=e.message; }
}
async function execute(decisionId, d) {
  const msg = $('em_' + decisionId); const btn = $('exec_' + decisionId);
  const label = d.side + ' ' + d.qty + ' ' + d.symbol + (d.orderType==='limit'?(' @ '+money(d.limitPrice)):' at market');
  if (MODE === 'live' && !confirm('Place a LIVE order to ' + label + '? This trades REAL money.')) return;
  btn.disabled = true; msg.className='sub'; msg.innerHTML='<span class="dot"></span> Placing…';
  const requestId = 'req-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  try { const j = await api('/orders', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ decisionId, requestId, confirm: MODE==='live' }) });
    msg.className='sub ok'; msg.textContent = 'Order ' + j.order.status + ' (' + (j.order.id||'').slice(0,8) + ').'; UNIVERSE = {}; await loadKpisAndPositions();
  } catch (e) { msg.className='sub err'; msg.textContent=e.message; btn.disabled=false; }
}

/* ── trade journal — tab ─────────────────────────────────────── */
async function loadJournal() {
  const host = $('tabbody'); if (!host) return;
  let trades = [];
  try { trades = (await api('/journal')).trades || []; } catch (e) { host.innerHTML='<div class="panel err">'+esc(e.message)+'</div>'; return; }
  host.innerHTML = '<div class="panel"><h2>Trade journal — what the bot did &amp; why (' + MODE + ' book)</h2>' +
    (trades.length ? trades.map((t,i) => renderTrade(t,i)).join('') : '<div class="foot">No trades in the ' + MODE + ' book yet.</div>') + '</div>';
  host.querySelectorAll('button[data-exp]').forEach(b => b.onclick = () => { const el = $('exp_' + b.getAttribute('data-exp')); el.style.display = el.style.display === 'none' ? 'block' : 'none'; });
}
function renderTrade(t, i) {
  const sig = (t.signals || [])[0];
  const sigLine = sig ? '<span class="pill">' + esc(sig.source) + '</span> ' + esc(sig.author || '') + ' — ' + esc(sig.title || (sig.body||'').slice(0,90)) + (sig.url ? ' · <a href="'+esc(sig.url)+'" target="_blank">source</a>' : '') : '<span class="foot">algo / no signal</span>';
  const px = (t.order_type === 'limit' || t.order_type === 'stop_limit') ? (' @ ' + money(t.limit_price)) : (t.order_type === 'stop') ? (' stop ' + money(t.stop_price)) : (t.order_type === 'trailing_stop') ? (' trail ' + (t.trail_percent ? t.trail_percent + '%' : money(t.trail_price))) : '';
  const fill = Number(t.filled_qty) > 0 ? (' · filled ' + t.filled_qty + (t.filled_avg_price ? ' @ ' + money(t.filled_avg_price) : '')) : '';
  // A sell isn't inherently "bad" — what matters is whether the CLOSE made money. Color the card by
  // realized P&L when we closed a position, and show the gain/loss plainly. Buys (opens) stay neutral.
  const rp = (t.realized_pnl != null && t.realized_pnl !== '') ? Number(t.realized_pnl) : null;
  const showRp = rp != null && (t.side === 'sell' || rp !== 0);
  const borderColor = showRp ? (rp >= 0 ? 'var(--buy)' : 'var(--sell)') : (t.side==='buy'?'var(--buy)':'var(--sell)');
  const rpBadge = showRp ? ' <strong class="' + (rp>=0?'ok':'err') + '" title="Realized profit/loss on this close">' + (rp>=0?'+':'') + money(rp) + (rp>=0?' profit':' loss') + '</strong>' : '';
  return '<div class="sig" style="border-left-color:' + borderColor + '">' +
    '<div><span class="pill ' + t.side + '">' + t.side + '</span> <strong>' + esc(t.symbol) + '</strong> · ' + t.qty + ' sh · ' + esc(t.order_type) + px +
      ' <span class="pill ' + esc(t.status) + '">' + esc(t.status) + '</span>' + rpBadge +
      ' <span class="foot">' + fmtDate(t.created_at) + ' · conf ' + Math.round((t.confidence||0)*100) + '%' + fill + '</span>' +
      ' <button class="btn ghost sm" data-fsym="' + esc(t.symbol) + '" style="float:right">Focus →</button></div>' +
    '<div class="foot" style="margin-top:4px">SIGNAL: ' + sigLine + '</div>' +
    '<div style="margin-top:4px"><button class="btn ghost sm" data-exp="' + i + '">Why?</button></div>' +
    '<div id="exp_' + i + '" style="display:none"><div class="why"><div class="rat">' + esc(t.rationale) + '</div>' +
      (t.signals||[]).map(s => '<div class="sig"><strong>' + esc(s.title || (s.body||'').slice(0,80)) + '</strong><div class="foot">' + esc(s.source) + (s.author?(' · '+esc(s.author)):'') + ' · ' + fmtDate(s.observed_at) + '</div>' + (s.body ? '<div class="rat" style="margin-top:4px">' + esc(s.body) + '</div>' : '') + '</div>').join('') +
    '</div></div></div>';
}

/* ── Tuning — nightly optimizer & approvals tab ──────────────────
 * Shows the parameter changes the nightly optimizer backtested and recommends, with Approve/Reject;
 * the current live params; recent decisions; and a "Run optimization now" button. Nothing the optimizer
 * proposes changes how the bot trades until you approve it here. */
const fmtExp = (n) => n==null ? '—' : (Number(n)>=0?'+':'') + Number(n).toFixed(2) + '%';
const fmtWin = (n) => n==null ? '—' : Math.round(Number(n)*100) + '%';
async function loadTuning() {
  const host = $('tabbody'); if (!host) return;
  host.innerHTML = '<div class="panel"><div class="panel head2"><h2 style="margin:0">Tuning — nightly optimizer &amp; approvals</h2>' +
      '<button class="btn ghost sm" id="optRunBtn" style="margin-left:auto">Run optimization now</button></div>' +
    '<div class="sub" style="margin-bottom:8px">Each night the engine backtests small parameter tweaks against recent market history and proposes the ones that would have improved results. <strong>Nothing changes how the bot trades until you approve it here.</strong> Paper book.</div>' +
    '<div id="optMsg" class="sub" style="min-height:18px"></div>' +
    '<div id="tunePending"><div class="spin"><span class="dot"></span></div></div>' +
    '<div id="tuneParams" style="margin-top:18px"></div>' +
    '<div id="tuneHistory" style="margin-top:18px"></div></div>';
  $('optRunBtn').onclick = runOptimizeNow;
  await refreshTuning();
}
async function refreshTuning() { await Promise.all([loadTuneRecs(), loadTuneParams()]); }
async function loadTuneRecs() {
  const host = $('tunePending'), hist = $('tuneHistory'); if (!host) return;
  let j; try { j = await api('/recommendations-tuning'); } catch (e) { host.innerHTML = '<div class="foot err">' + esc(e.message) + '</div>'; return; }
  const pending = j.pending || [];
  if (!pending.length) {
    host.innerHTML = '<div class="why" style="margin-top:4px"><strong>No pending recommendations.</strong> The optimizer hasn’t found a parameter change worth making since the last run — the current settings are holding up. Run it now, or check back after tonight’s 5:30am pass.</div>';
  } else {
    host.innerHTML = '<div class="foot" style="margin:6px 0 8px">' + pending.length + ' recommended change(s) — review and approve:</div>' +
      pending.map(r =>
        '<div class="sig" style="border-left-color:var(--buy)">' +
          '<div><strong>' + esc(r.label) + '</strong>: <span class="foot">' + r.currentValue + '</span> &rarr; <strong class="ok">' + r.proposedValue + '</strong></div>' +
          '<div class="foot" style="margin-top:4px">backtest: win-rate ' + fmtWin(r.baselineWinrate) + ' &rarr; <strong>' + fmtWin(r.proposedWinrate) + '</strong> · expectancy ' + fmtExp(r.baselineExpectancy) + ' &rarr; <strong>' + fmtExp(r.proposedExpectancy) + '</strong> · ' + (r.proposedSignals||0) + ' signals</div>' +
          '<div style="margin-top:8px"><button class="btn buy sm" data-approve="' + r.recId + '">Approve &amp; apply</button> <button class="btn ghost sm" data-reject="' + r.recId + '">Reject</button> <span class="sub" id="recmsg_' + r.recId + '"></span></div>' +
        '</div>'
      ).join('');
    host.querySelectorAll('button[data-approve]').forEach(b => b.onclick = () => actOnRec(b.getAttribute('data-approve'), 'approve'));
    host.querySelectorAll('button[data-reject]').forEach(b => b.onclick = () => actOnRec(b.getAttribute('data-reject'), 'reject'));
  }
  const history = j.history || [];
  hist.innerHTML = history.length ? ('<div class="foot" style="margin-bottom:6px">RECENT DECISIONS</div>' +
    '<table><thead><tr><th>When</th><th>Parameter</th><th class="num">Change</th><th>Decision</th></tr></thead><tbody>' +
    history.map(r => '<tr><td class="foot">' + fmtDate(r.resolvedAt) + '</td><td>' + esc(r.label) + '</td><td class="num">' + r.currentValue + ' &rarr; ' + r.proposedValue + '</td><td><span class="pill ' + (r.status==='applied'?'buy':'sell') + '">' + esc(r.status) + '</span></td></tr>').join('') +
    '</tbody></table>') : '';
}
async function actOnRec(id, action) {
  const msg = $('recmsg_' + id); if (msg) { msg.className='sub'; msg.innerHTML='<span class="dot"></span> ' + (action==='approve'?'Applying…':'Rejecting…'); }
  try { await api('/recommendations-tuning/' + encodeURIComponent(id) + '/' + action, { method:'POST' }); await refreshTuning(); }
  catch (e) { if (msg) { msg.className='sub err'; msg.textContent = e.message; } }
}
async function loadTuneParams() {
  const host = $('tuneParams'); if (!host) return;
  let j; try { j = await api('/strategy-params'); } catch { host.innerHTML=''; return; }
  const ps = j.params || [];
  host.innerHTML = '<div class="foot" style="margin-bottom:6px">CURRENT LIVE PARAMETERS (paper engine)</div>' +
    '<table><thead><tr><th>Parameter</th><th class="num">Value</th><th>Source</th><th>Updated</th></tr></thead><tbody>' +
    ps.map(p => '<tr><td>' + esc(p.label) + '</td><td class="num"><strong>' + p.value + '</strong></td><td>' + (p.isDefault?'<span class="pill hold">default</span>':'<span class="pill buy">tuned</span>') + '</td><td class="foot">' + (p.updatedAt?fmtDate(p.updatedAt):'—') + '</td></tr>').join('') +
    '</tbody></table>' +
    '<div class="foot" style="margin-top:8px">Backtest scores signal direction vs. the next ~5 sessions’ move (a ranking proxy, not a fills/slippage simulator). v1 tunes the algo + ensemble parameters; multi-timeframe weights come later.</div>';
}
async function runOptimizeNow() {
  const btn = $('optRunBtn'), msg = $('optMsg'); if (!btn) return;
  btn.disabled = true; msg.className='sub'; msg.innerHTML='<span class="dot"></span> Backtesting parameter tweaks across the universe… (~10–30s)';
  try {
    const j = await api('/optimize-now', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ mode: MODE }) });
    msg.className='sub ok'; msg.textContent = 'Done — assessed ' + (j.assessed||0) + ' symbols, ' + (j.recommendations||0) + ' recommendation(s).' + (j.skipped?(' ('+j.skipped+')'):'');
    await refreshTuning();
  } catch (e) { msg.className='sub err'; msg.textContent = e.message; } finally { btn.disabled=false; }
}

/* Theme is handled by /shared/ui/js/surface-theme.js (loaded in <head>): it sets data-theme on
 * <html> from the operator's saved cockpit theme and live-follows changes via the storage event —
 * so this surface needs no per-surface token mirroring. Its :root aliases derive from the framework
 * tokens, which flow from whichever [data-theme] is active. */
(function init() { wireSwitch();
  // delegated Focus buttons rendered inside tabs
  document.addEventListener('click', (e) => { const b = e.target.closest && e.target.closest('button[data-fsym]'); if (b && b.closest('#tabpanel')) { const s=b.getAttribute('data-fsym'); if(!UNIVERSE[s]) UNIVERSE[s]={symbol:s}; focus(s); const f=$('focus'); if (f) f.scrollIntoView({ behavior:'smooth', block:'start' }); } });
  render();
})();
</script>
</body>
</html>
