# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — trading ("Intelligent Trades", ADR-052)
#
# Signal-justified stock trading. The app captures market signals into immutable
# snapshots, the trading-analyst bot reasons over them into a decision tree, and
# the controller executes the decision via the provider-agnostic BrokerAdapter
# (Alpaca paper / Schwab live). Every order is FK-bound to its decision, which
# references the signal(s) that triggered it — a trade with no justification is
# unrepresentable (ADR-052).
#
# Carved out of OSHAL core 2026-07-20 (ADR-085 Wave 3, "skill with a surface" —
# ADR-093: ONLY the surface carves). NOTE: the package DIR is `trading` (install
# with `oshal-app install trading`) but the app NAME stays `intelligent-trades` —
# the exact identity the kernel manifest (swarm-apps/trading.yaml) registered, so
# ?app=intelligent-trades URLs, the tool-intelligent-trades-home default tile,
# guest-tier records, and the 'intelligent-trades' queue id all survive the carve
# unchanged. What STAYS framework-resident (ADR-093):
#   - the ENGINE: src/features/trading (BrokerAdapter/reader, market data,
#     algorithms, ensemble, sizing/portfolio, risk policies) and EVERY
#     src/app/trading-*.ts module — trading-engine.ts (placeDecisionOrder with
#     the env-level live_blocked gate: TRADING_LIVE_ENABLED + explicit confirm;
#     analyzeAndRecordDecision; recordOrder/rebindOrder;
#     resolveMaturedPredictions), trading-schema.ts, the 8 dispatch/reconcile
#     loops (swing/schedule/review/research/optimize/assess, reconcile,
#     reconcile-ledger — the AUTOPILOT itself), the strategy-lab sim/ops/store,
#     config-overrides, strategy-params, daily-equity/rotation/peaks/gate-block
#     stores. The kernel's risky-write-guards.spec.ts keeps the live_blocked +
#     confirm-string source guard at the engine; THIS package's
#     tests/trading-surface-live-gate.spec.ts pins the surface gates.
#   - src/app/routes/trading-routes-helpers.ts (callerSub/resolveMode/servePage/
#     guardrails — global-search + the engine import it) — the packaged routes
#     import it back via @/app/routes/trading-routes-helpers;
#   - the trading-analyst / trading-research-analyst / weather-analyst registry
#     entries + ai-lab personas (the personas/ here are package COPIES for the
#     registrar), the trading-bot + weather-bot compose containers;
#   - scripts/oshal-trade-ops.js (the trading_* CLI the tools below invoke — it
#     speaks HTTP to the same /api/trading* paths this package mounts), the
#     watchdog/recap/regression CLIs, migrations 034/035/072 (the routes also
#     lazily self-heal the schema via the kernel ensureTradingSchema);
#   - ALL TRADING_* compose env, the schedule pins, strategy-log.md, and the
#     tool-intelligent-trades-home default tile in
#     config-seed/profiles/oshal-framework.json (carved apps keep their tiles).
# This package is the app: the four route surfaces (/api/trading,
# /api/trading/autopilot, /api/trading/lab, /api/trading-charts), trading.html +
# the vendored chart lib, the manifest (bots, tools, workflow, surface), and the
# surface guards that carved with their subjects.
# Framework: OSHAL (see docs/adr/085-remote-app-packages-and-registries.md)
# ─────────────────────────────────────────────────────────────────────────────

name: intelligent-trades
suite: ai-finance   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 64, high: 256, basis: declared }
  features:
    - id: trade-decision
      unit: trade decision
      tier: T2
      generation: none
      degrade: template
    - id: strategy-draft
      unit: strategy draft
      tier: T2
      generation: none
      degrade: disable
    - id: strategy-studio
      unit: strategy studio turn
      tier: T3
      generation: none
      degrade: disable
    - id: futures-study-review
      unit: futures study review
      tier: T3
      generation: none
      degrade: disable
    - id: earnings-release-read
      unit: earnings release
      tier: T1
      generation: none
      degrade: disable
    - id: trading-decision-ticket
      unit: trading decision ticket
      tier: T4
      generation: none
      degrade: disable
displayName: Intelligent Trades
description: >-
  Research stocks, track connected brokerage accounts and test strategies in a separate
  paper book, with a decision trail from signals to orders. Trading actions follow the
  connected account's supported controls. Cash equities. No crypto.
version: 1.40.2
status: active

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: trading
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/intelligent-trades/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# ── Cross-package prerequisites: what this package actually reaches ─────────
# OPTIONAL, NOT REQUIRED: oshal-app.yaml:376 frames /api/world/app in the World tab. Signals,
# decisions, orders and the broker adapters never read it, so an absent World leaves one empty
# tab and changes nothing else.
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: [world, futures-research]   # optional World surface and opt-in scheduled Futures reviewer
    tools: []
    connectors: [finnhub]   # Optional company news; the kernel retains the caller's key.

# Kernel skills this app declares (ADR-090 uses: contract, fail-closed at load).
# `app-dependencies` is the compatibility floor for the tiered dependencies block above: a core
# that predates required/optional refuses this package instead of installing it without its
# required dependencies and without its connector allow-list.
uses:
  - app-dependencies
  - bound-workflow-results
  - futures-forward-receipts
  - futures-archive-import
  # The research route reads the shared world index even when the World surface is absent.
  - world-data
  # ADR-090: the specialist-context channel. A protected bot-node run is TOOL-LESS, so the
  # controller-side fact append registered by createTradingRoutes is the accountable trading
  # bot's ONLY data channel. Declared here so a kernel that predates the channel REFUSES this
  # package instead of installing it with the bot silently blind.
  - specialist-context
  # The package's tests are registered with the AI Test Lab (tests/test-lab.yaml). Declared so a
  # kernel that predates package catalogs refuses the package instead of silently ignoring them.
  - test-catalog

# AI Test Lab catalog: the readiness smoke and the ADR-052 addendum parity suites (T1 in BACKLOG.md
# tracks registering the rest).
testing:
  version: 1
  catalog: tests/test-lab.yaml

# OUTBOUND HOSTS. A native package has no network of its own: the kernel's fenced egress carries
# Research's SEC filings and annual financial statements (the ticker table, submissions and concepts; public, keyless, sent with
# the SEC's required contact User-Agent) and refuses any host not declared here.
egress:
  - host: www.sec.gov
  - host: data.sec.gov
  - host: finnhub.io
    credential: { connector: finnhub, header: x-finnhub-token }

# Dark, focused trading skin.
theme: midnight

ticketType: trading-decision

workflow:
  name: Trading Decision
  # Custom single-bot pipeline (any value != 'incident-rca'/'swarm' + a workerBot routes via
  # chooseDispatchPath -> manifest-worker). A ticketType=trading-decision ticket (created by
  # POST /api/trading/trigger from a captured signal, or kernel-side by the schedule/dispatch
  # loops) is dispatched to the trading-analyst bot, which runs its tool-factory-loaded tools
  # and decides. The interactive capture → decide → execute path in trading-routes still works
  # direct. The kernel queue-classification keeps its 'trading-decision' → 'intelligent-trades'
  # row (the kernel loops create those tickets whether or not this app is installed).
  pipeline: trading
  workerBot: trading-analyst

# The right-rail chat agent when this app is focused. Without it the cockpit took the first
# bot below (futures-research-analyst), which only emits a json futures study; the analyst
# answers a person's question in prose.
chatBot: trading-analyst

bots:
  # Interactive research-only concierge; omit container to use the kernel's inline default.
  - agentId: 90a8023d-7f86-485a-b215-f427d92ce032
    name: futures-research-analyst
    persona: personas/futures-research-analyst.yaml
    role: trading/futures-research
    accessRoles: [operator, swarm]
    capabilities: [futures-study-review]
  - agentId: a0000000-0000-0000-0000-000000000046
    name: trading-analyst
    persona: personas/trading-analyst.yaml
    role: trading/decision-specialist
    capabilities:
      - market-signal-analysis
      - trade-decision
      - decision-tree-justification
      - portfolio-audit
      - autopilot-pnl
      - order-forensics
      - risk-gate-forensics
  # Feed bots — find + classify the gravity masses (ADR-054) the decision reasons over.
  - agentId: a0000000-0000-0000-0000-000000000049
    name: trading-research-analyst
    persona: personas/trading-research-analyst.yaml
    role: trading/research-mass-finder
    capabilities:
      - event-classification
      - influencer-gravity
      - coupling-estimation
  - agentId: a0000000-0000-0000-0000-00000000004a
    name: weather-analyst
    persona: personas/weather-analyst.yaml
    role: trading/weather-mass-finder
    capabilities:
      - weather-impact
      - disaster-demand
      - coupling-estimation

# ─────────────────────────────────────────────────────────────────────────────
# TOOLS — the trading_* OPERATOR capability set. Each is a thin cli over the local
# /api/trading* control surface (scripts/oshal-trade-ops.js <verb> {input} — kernel-resident),
# authenticated as an internal service call on behalf of the acting user. This is what lets the
# trading-analyst bot + Jarvis TURN THE KNOBS (not just reason): start/stop the autopilot,
# scan the deterministic engine, read positions, and place PAPER trades. Live execution stays
# behind the cockpit's manual confirm — no tool here places a live order. Mirrors world.
# ─────────────────────────────────────────────────────────────────────────────
tools:
  - name: trading_status
    displayName: Trading Status
    type: api
    category: trading
    description: >-
      The whole trading book at a glance: paper/live broker config + the autopilot legs
      (technical/research/fast/assess/review) — enabled?, cron, next/last run. Read-only. Input: {}.
    executor: { executorType: api, apiEndpoint: "GET /api/trading/status" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
    usageInstructions: Call with {} to report whether the autopilot is running and how the book is configured.
    routingTags: [trading, status, autopilot]
    skills: [trading]
    tags: [intelligent-trades]

  - name: trading_autopilot
    displayName: Trading Autopilot Control
    type: cli
    category: trading
    description: >-
      Turn the autopilot knob: enable (start the every-5-min multi-timeframe paper advisor plus
      its research/fast/assess/review legs), disable (stop all legs), or status. Paper-only.
      Input: {action: "enable"|"disable"|"status", cron?, universe?}.
    executor:
      executorType: cli
      cliCommand: node /app/scripts/oshal-trade-ops.js autopilot {input}
    defaultAuthMode: auto
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        action: { type: string, enum: [enable, disable, status], description: "enable | disable | status" }
        cron: { type: string, description: "override cadence (default */5 * * * *)" }
        universe: { type: array, items: { type: string }, description: "symbols to PIN; omit it and every leg tracks the engine's own default universe as it grows. A list over TRADING_UNIVERSE_MAX_PIN is refused, never truncated" }
      required: [action]
    usageInstructions: "{action:'enable'} starts autonomous paper trading; {action:'disable'} stops it. Confirm with the user before enabling or disabling."
    routingTags: [trading, autopilot, control]
    skills: [trading]
    tags: [intelligent-trades]

  - name: trading_scan
    displayName: Trading Signal Scan
    type: cli
    category: trading
    description: >-
      Run the deterministic engine (momentum / gravity / donchian / mean-rev + ensemble) over a
      watchlist — reproducible from market data, no LLM. Returns per-symbol signals + the ensemble
      action/score. Input: {symbols: string[] or "A,B,C"}.
    executor:
      executorType: cli
      cliCommand: node /app/scripts/oshal-trade-ops.js scan {input}
    defaultAuthMode: auto
    requiresApproval: false
    timeoutMs: 60000
    inputSchema:
      type: object
      properties:
        symbols: { type: array, items: { type: string }, description: "tickers to score" }
      required: [symbols]
    routingTags: [trading, scan, signals, algos]
    skills: [trading]
    tags: [intelligent-trades]

  - name: trading_positions
    displayName: Trading Positions
    type: api
    category: trading
    description: >-
      The selected book's open positions: symbol, quantity, average cost, last price, market value
      and unrealized P&L. Read-only and owner-scoped. Input: {}.
    executor: { executorType: api, apiEndpoint: "GET /api/trading/positions" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
    routingTags: [trading, positions, ledger]
    skills: [trading]
    tags: [intelligent-trades]

  - name: trading_account
    displayName: Trading Account
    type: api
    category: trading
    description: >-
      The selected book's cash, buying power, equity and portfolio value. Read-only and
      owner-scoped. Input: {}.
    executor: { executorType: api, apiEndpoint: "GET /api/trading/account" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
    usageInstructions: Call with {} for how much cash the book has and its buying power.
    routingTags: [trading, account, cash]
    skills: [trading]
    tags: [intelligent-trades]

  - name: trading_accounts
    displayName: Trading Accounts (Schwab)
    type: api
    category: trading
    description: >-
      Every connected brokerage account (Schwab) with its masked number, type, equity, cash, buying power,
      day change and current holdings (symbol, quantity, market value). Read-only, owner-scoped and view-only:
      it never places an order. Input: {}.
    executor: { executorType: api, apiEndpoint: "GET /api/trading/accounts" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
    usageInstructions: Call with {} for the person's Schwab accounts and what they hold; trading_account and trading_positions read only the selected (paper) book.
    routingTags: [trading, accounts, schwab, holdings]
    skills: [trading]
    tags: [intelligent-trades]

  - name: trading_trade
    displayName: Place Paper Trade
    type: cli
    category: trading
    description: >-
      Decide one symbol with the deterministic ensemble and, if actionable, place the resulting
      PAPER order (never live). Returns the decision + order status. Input: {symbol}.
    executor:
      executorType: cli
      cliCommand: node /app/scripts/oshal-trade-ops.js trade {input}
    defaultAuthMode: auto
    requiresApproval: true
    timeoutMs: 60000
    inputSchema:
      type: object
      properties:
        symbol: { type: string, description: "ticker to trade" }
      required: [symbol]
    usageInstructions: Places a PAPER order only (never live). Confirm with the user before trading.
    routingTags: [trading, order, paper]
    skills: [trading]
    tags: [intelligent-trades]

  # The named read the ADR-090 specialist-context facts run under. It is a real read-only surface
  # (GET /api/trading/summary) as a tool, and it is the name the kernel resolves this package's
  # ownership of when createTradingRoutes registers the reader: SpecialistContextRegistry refuses
  # a registration whose bot AND tool this manifest does not both declare. When this app gains an
  # authorization catalog, this is the binding that carries the read permission.
  - name: trading_book_facts
    displayName: Trading Book Facts
    type: api
    category: trading
    description: >-
      Today's numbers for ONE book per key, never summed across books and never across live and
      paper: recorded equity, the day change against that book's prior session close, and
      engine-priced realized P&L. Read-only, owner-scoped, and it never calls the venue - a book
      with no recorded snapshot today reads "unknown", never a stale figure and never 0.
      Input: {}.
    executor: { executorType: api, apiEndpoint: "GET /api/trading/summary" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
    usageInstructions: Call with {} to read each book's own equity, day change and realized P&L.
    routingTags: [trading, performance, summary]
    skills: [trading]
    tags: [intelligent-trades]
  # Named read-only module tools for Jarvis and the Trading concierge. The API adapter
  # preserves the original caller and percent-encodes symbol/query placeholders.
  - name: trading_stock_info
    displayName: Stock quote and research
    type: api
    category: trading
    description: >-
      Read a stock ticker's current quote and company research from the Trading module.
      Includes source, timestamp, delay status, SEC filings and an explicit availability
      reason for each missing section. Never invent company financials or news when a
      section is unavailable. Read-only. Input: {"symbol":"NVDA"}.
    executor: { executorType: api, apiEndpoint: "GET /api/trading/research/{input.symbol}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      required: [symbol]
      properties:
        symbol: { type: string, description: "Stock ticker, such as NVDA, ANET or BRK.B" }
    usageInstructions: Use for stock prices and company research; retain the source, as-of timestamp and availability reasons in your answer.
    routingTags: [trading, stock, stocks, quote, price, ticker, company, research]
    skills: [trading]
    tags: [intelligent-trades]

  - name: trading_stock_chart
    displayName: Stock price history
    type: api
    category: trading
    description: >-
      Read actual OHLCV candle bars for a stock ticker through the Trading module and
      the caller's connected market-data source. Read-only. Input: {"symbol":"NVDA",
      "timeframe":"1Day"}. Reports missing data as unavailable; never places orders.
    executor: { executorType: api, apiEndpoint: "GET /api/trading-charts/bars?symbol={input.symbol}&timeframe={input.timeframe}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      required: [symbol]
      properties:
        symbol: { type: string, description: "Stock ticker" }
        timeframe: { type: string, enum: [5Min, 15Min, 1Hour, 1Day, 1Week] }
    usageInstructions: Use actual returned bars for price-history questions; disclose missing or delayed data.
    routingTags: [trading, stock, stocks, chart, candles, price, history]
    skills: [trading]
    tags: [intelligent-trades]

  - name: trading_company_search
    displayName: Find companies by name
    type: api
    category: trading
    description: >-
      Find company names and tickers in the public SEC company directory, up to 25
      matches. Includes source and cache fetch time; this directory does not prove
      broker tradability, current prices or financial fundamentals. Read-only.
      Input: {"q":"NVIDIA"}. Ask which company when several matches are plausible.
    executor: { executorType: api, apiEndpoint: "GET /api/trading/companies/search?q={input.q}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      required: [q]
      properties:
        q: { type: string, description: "Company name or ticker, 1–80 characters" }
    usageInstructions: Resolve a company name before stock research. Use returned tickers without inventing a match; disclose unavailable directory reads and ambiguous companies.
    routingTags: [trading, stock, stocks, company, name, ticker, search]
    skills: [trading]
    tags: [intelligent-trades]

  - name: trading_symbol_search
    displayName: Find stock tickers
    type: api
    category: trading
    description: >-
      Search stock ticker prefixes through the Trading module using the caller's
      connected source. This native search matches symbols, not company names.
      Read-only. Input: {"q":"NVD"}.
    executor: { executorType: api, apiEndpoint: "GET /api/trading/symbols/search?q={input.q}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      required: [q]
      properties:
        q: { type: string, description: "Ticker prefix, such as NVD" }
    usageInstructions: Look up a ticker prefix, then call trading_stock_info with a returned ticker. For company names use trading_company_search first.
    routingTags: [trading, stock, stocks, symbol, ticker, company, search]
    skills: [trading]
    tags: [intelligent-trades]

  # How the selected book did over a period, against SPY: the same response the Performance tile reads.
  - name: trading_performance
    displayName: Trading Performance
    type: api
    category: trading
    description: >-
      How the caller's selected book did over a period: start and end equity, total return and the
      S&P 500 (SPY) return over the same days, from the book's recorded daily equity or the broker's
      equity curve. Read-only and owner-scoped. Input: {"period": "1W" | "1M" | "3M" | "1Y"}.
    executor: { executorType: api, apiEndpoint: "GET /api/trading/performance?period={input.period}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      required: [period]
      properties:
        period: { type: string, enum: ["1W", "1M", "3M", "1Y"], description: "1W for last week, 1M, 3M or 1Y" }
    usageInstructions: Call with {"period":"1W"} for "how did we do last week", 1M for the month.
    routingTags: [trading, performance, return]
    skills: [trading]
    tags: [intelligent-trades]

# ─────────────────────────────────────────────────────────────────────────────
# ROUTES — the packaged surface routers, dynamic-mounted on activation by the
# ManifestRouteMounter. Auth per route matches EXACTLY what core server.ts
# mounted (ADR-085 D2):
#   /api/trading/autopilot + /api/trading/lab + /api/trading were
#   serviceSecretOr(requiresAuth) → auth: service-or-oidc (the trading_* operator
#   tools / Jarvis / the regression CLI reach the book via an internal service
#   call resolving the acting user from X-OSHAL-User-Sub; external callers hit
#   the OIDC wall);
#   /api/trading-charts had NO wrapper → auth: public (self-guarded: the vendored
#   chart lib is a public MIT JS asset, and GET /bars self-gates via callerSub →
#   401 — keeps the lib loadable in the authed iframe with no cookie/SameSite
#   dependency).
# The dispatcher runs most-specific mounts first, so autopilot/lab win over
# /api/trading exactly like the original BEFORE-ordering in server.ts.
# ─────────────────────────────────────────────────────────────────────────────
# Declared stores (native kernel): provisioned in a person's scope before the first read.
migrations:
  - migrations/001-trading-watchlist.sql
  - migrations/002-native-paper.sql
  - migrations/003-native-predictions.sql
  - migrations/004-native-futures-research.sql
  - migrations/005-native-futures-reviews.sql
  - migrations/006-native-futures-predictions.sql
  - migrations/007-native-portfolio.sql

routes:
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/trading/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/intelligent-trades/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  # TRADE-01: the native paper autopilot (arm/disarm/status, the scheduled tick, fills and decisions).
  # Paper only: fills are simulated at the kernel's prices.latest price in the caller's own scope; nothing
  # under routes/paper/ reaches a broker. On a host without the kernel price intents a tick answers 503.
  - module: routes/trading-paper-routes.js
    factory: createTradingPaperRoutes
    mountPath: /api/trading/paper
    auth: service-or-oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/trading-autopilot-routes.js
    factory: createTradingAutopilotRoutes
    mountPath: /api/trading/autopilot
    auth: service-or-oidc   # what core server.ts ACTUALLY mounted (ADR-085 D2)
    requiresAuth: true
    requiresContext: true   # Futures run ledger reads the framework pool through the route context.
  - module: routes/trading-strategy-lab-routes.js
    factory: createTradingStrategyLabRoutes
    mountPath: /api/trading/lab
    auth: service-or-oidc   # what core server.ts ACTUALLY mounted (ADR-085 D2)
    requiresAuth: true
    requiresContext: true
  - module: routes/trading-charts-routes.js
    factory: createTradingChartsRoutes
    mountPath: /api/trading-charts
    auth: public   # what core server.ts ACTUALLY mounted (no wrapper; router self-guards /bars)
    requiresAuth: false
    requiresContext: false
  - module: routes/trading-routes.js
    factory: createTradingRoutes
    mountPath: /api/trading
    auth: service-or-oidc   # what core server.ts ACTUALLY mounted (ADR-085 D2)
    requiresAuth: true
    requiresContext: true

# TRADE-01: the native paper autopilot. A PERSON job: each person who arms their paper book activates
# it for themselves (the trading page makes the person's own POST /api/v1/agent/schedules/{id}/activate
# with class person), and the kernel fires the tick as that person every five minutes of the New York
# session. The tick refuses when the person has not armed, writes nothing outside the regular session,
# and is idempotent per five-minute window. Deterministic: no model runs in the tick.
schedules:
  - id: portfolio-watcher
    cron: "*/5 9-16 * * 1-5"
    timezone: America/New_York
    runsAs: user
    target: service-route
    route: /api/trading/portfolio/watch/tick
    method: POST
    body: {}
    timeoutSeconds: 120
    description: Check my assigned strategies, reconcile broker orders and fills, and execute only explicitly activated account-specific monthly mandates.
    offer: Monitor my portfolios every five minutes; trade only accounts with an explicitly approved live strategy mandate.
  - id: paper-autopilot
    cron: "*/5 9-15 * * 1-5"
    timezone: America/New_York
    runsAs: user
    target: service-route
    route: /api/trading/paper/tick
    method: POST
    body: {}
    timeoutSeconds: 120
    description: Paper autopilot tick - multi-timeframe decisions from kernel prices, simulated fills in your own paper book (never a broker order).
    offer: Run my paper trading autopilot every five minutes while the US market is open.
  - id: futures-research
    cron: "15 2 * * 2-6"
    timezone: America/New_York
    runsAs: user
    target: service-route
    route: /api/trading/autopilot/futures/tick
    method: POST
    body: {}
    timeoutSeconds: 300
    description: Futures study - your saved ES/CL walk-forward study over your Schwab connection, once a night after the session (research only, never an order).
    offer: Run my saved Futures study every night after the market session.

# ─────────────────────────────────────────────────────────────────────────────
# COCKPIT UI SURFACE — one ribbon icon opens the Trading page (served by the
# packaged createTradingRoutes at /api/trading/ from this package's
# tools/trading.html). The page handles the PAPER/LIVE book switch, the
# account/positions ledger, the signal feed, the decide → execute flow, and the
# per-order "why" provenance panel for the signed-in user.
# ─────────────────────────────────────────────────────────────────────────────
ui:
  static:
    - toolName: intelligent-trades-home
      label: Intelligent Trades
      icon: codicon codicon-pulse
      iframeUrl: /api/trading/
      section: top
    # World Intelligence tile (world/oshal-app.yaml, auth: public route) surfaced directly in
    # the trading ribbon — signal-justified trades benefit from the same geopolitical/economic
    # read the world app already produces. Distinct toolName from world's own 'world-dashboard'
    # (ADR-085 D11: tool/tile names are effectively global — never reuse another app's).
    - toolName: intelligent-trades-world
      label: World Intelligence
      icon: codicon codicon-globe
      iframeUrl: /api/world/app
      section: top

ribbon:
  hideFrameworkItems:
    - tickets
    - chat
    - calendar
    - addressbook
    - dashboard
    - logs
    - operations
  # Intelligent Trades is account/strategy-shaped, not ticket/queue-shaped: the cockpit's bottom
  # bots/tickets/cost/queue status bar is swarm-operator telemetry a trader never needs (operator 2026-09-04).
  hideStatusBar: true
  defaultView: intelligent-trades-home

summary:
  path: /api/trading/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items
integrations:
  offers:
    - id: review-finance
      label: Review with Finance
      targetApp: finance
      targetAction: review-context
      contextType: financial-review
      version: 1
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
    - id: prepare-recap
      label: Prepare a trade recap
      targetApp: daily-trade-recap
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
  accepts:
    - id: review-research
      contextType: research-brief
      version: 1
      surface: intelligent-trades-home
      fields:
        - title
        - notes
        - sourceUrl
