  - id: phone-start
    name: PDF workbench on a phone starts in one step
    purpose: >-
      At 390x844 with touch, the empty state's one primary action Upload a PDF opens the chosen PDF at its page, Blank page
      opens a blank Letter page, and the Document menu opens as an opaque sheet between the app bar and the pane bar with only
      what the seat can do. Real routes and PDF engine, disposable PostgreSQL, the kernel's shared editor from OSHAL_PLATFORM_ROOT.
    level: browser
    runner:
      kind: external
      scope: package
      files:
        - tests/browser/phone-start.test.mjs
    expected:
      - Upload a PDF in the document menu opens the PDF in one step; More lists only what the seat can do as an opaque modal menu.
      - The first screen is a blank page under one app row (the document menu, Undo, Redo, Add text, More) with the modes as the bottom bar; every Format item on screen is under the finger.
    prerequisites:
      - runner:node
      - runtime:pypdf-pinned
      - runtime:chromium
      - service:postgres-disposable-35689
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: Remove only this run's unique fixture database, role, browser context and temporary paths; preserve the shared disposable PostgreSQL 35689.
    installation: never
    limits:
      timeoutMs: 180000
      maxMemoryMb: 768
  - id: design-standard
    name: PDF Workbench meets the oshal design standard at phone and desktop size
    purpose: >-
      docs/ux/design-standard.md §3.1, §4.3, §4.4, §4.10, §5.1 with the Acrobat and PDFgear conventions (REFP CONVENTIONS
      §5.2), at 412x743 with real touch and at 1440x900: with no PDFs a blank Letter page whose one primary is Add text, where a
      tap and typing put the words on the page and the first edit makes an untitled PDF holding the typed text object; menus and
      sheets are opaque modal dialogs the browser's Back closes; More, the Annotate, Sign and Pages modes and the concierge carry
      live enabled controls for RP-PDF-01..10 and RP-ALL-01 with zero planned placeholders; with PDFs the home is their
      thumbnails with one New (PDF or From photos); a delete asks in the page. Also screenToPdf at every rotation.
    level: browser
    runner:
      kind: external
      scope: package
      files:
        - tests/browser/design-standard.test.mjs
    expected:
      - One primary (Add text, then Export, New on the home), the typed text saved in revision 2, Back closes every menu and sheet, zero planned placeholders, no native dialog.
      - Every RP-PDF-01..10 and RP-ALL-01 control is live and enabled at phone and desktop size.
    prerequisites:
      - runner:node
      - runtime:pypdf-pinned
      - runtime:chromium
      - service:postgres-disposable-35689
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: Remove only this run's unique fixture database, role, browser context and temporary paths; preserve the shared disposable PostgreSQL 35689.
    installation: never
    limits:
      timeoutMs: 240000
      maxMemoryMb: 768
  - id: rp-pdf-features
    name: Reference product PDF workflows, OOXML exports and signature RLS
    purpose: >-
      Verify RP-PDF-01..10 backend routes, Python sidecar engine mutations, real PDF /Annots (/Highlight, /Underline,
      /StrikeOut with /QuadPoints and /Ink), stroke eraser, caller signatures under forced two-arm RLS, check/cross vector
      marks, blank page insertion, multi-photo PDF creation, compressed PDF revisions, valid OOXML (.docx, .xlsx, .pptx) ZIP
      exports, and non-mutating view preferences.
    level: integration
    runner:
      kind: external
      scope: package
      files:
        - tests/rp-pdf-features.test.mjs
    expected:
      - Exported PDFs contain valid native /Annots dictionaries, stroked vector paths, XObject signatures, inserted blank pages, photo pages and compressed revisions.
      - Exported .docx, .xlsx and .pptx archives pass OOXML structure validation, and caller signatures/view preferences enforce two-arm PostgreSQL RLS.
    prerequisites:
      - runner:node
      - runtime:pypdf-pinned
      - runtime:poppler-tesseract-eng
      - service:postgres-disposable-35689
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: Remove only this run's unique fixture database, role, engine worker and temporary paths; preserve shared PostgreSQL 35689.
    installation: never
    limits:
      timeoutMs: 120000
      maxMemoryMb: 768
  - id: rp-pdf-workbench
    name: Browser E2E proof for RP-PDF-01..10 and RP-ALL-01
    purpose: >-
      Prove all ten reference-product enhancements (select-text markup, freehand ink and stroke eraser, caller signatures,
      check/cross marks, blank page insertion, multi-photo PDF creation, file-size compression, Word/Excel/PowerPoint conversion,
      single/two-page view toggle, night reading mode) and Concierge suggested prompts end-to-end in Chromium against real
      routes, Python PDF worker and disposable PostgreSQL.
    level: browser
    runner:
      kind: external
      scope: package
      files:
        - tests/browser/rp-pdf-workbench.test.mjs
    expected:
      - Every RP-PDF-01..10 UI workflow persists or exports valid PDF/OOXML bytes and view preferences without mutating PDF bytes on view toggles.
      - Zero data-ds-not-yet placeholders remain and Concierge renders live Summarize this PDF and Ask about this page prompts.
    prerequisites:
      - runner:node
      - runtime:pypdf-pinned
      - runtime:poppler-tesseract-eng
      - runtime:chromium
      - service:postgres-disposable-35689
      - runtime:kernel-shared-ui
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: Remove only this run's unique fixture database, role, browser context and temporary paths; preserve shared PostgreSQL 35689.
    installation: never
    limits:
      timeoutMs: 180000
      maxMemoryMb: 768
