    installation: never
  - id: phone-start
    name: PDF workbench on a phone starts in one step
    purpose: >-
      At 390x844 with touch, the empty state's one primary action Upload a PDF opens the chosen PDF at its page, Blank page
      opens a blank Letter page, and the Document menu opens as an opaque sheet between the app bar and the pane bar with only
      what the seat can do. Real routes and PDF engine, disposable PostgreSQL, the kernel's shared editor from OSHAL_PLATFORM_ROOT.
    level: browser
    runner:
      kind: external
      scope: package
      files:
        - tests/browser/phone-start.test.mjs
    expected:
      - Upload a PDF is hit-testable on the first screen and one tap opens the PDF; Blank page opens one blank page; the Document sheet covers neither bar.
      - 0.2.4: the app bar is one row (title, Save, More) and content starts within 74 px of the frame; the start card's links are labelled and boxless; the Document menu waits in More and opens there in place; every drawn Properties item is under the finger.
    prerequisites:
      - runner:node
      - runtime:pypdf-pinned
      - runtime:chromium
      - service:postgres-disposable-35689
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: Remove only this run's unique fixture database, role, browser context and temporary paths; preserve the shared disposable PostgreSQL 35689.
    installation: never
    limits:
      timeoutMs: 180000
      maxMemoryMb: 768
