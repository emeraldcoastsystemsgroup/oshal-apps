version: 1
cases:
  - id: model
    name: Bounded immutable page model
    purpose: >-
      Bounded immutable page model. Source fixture seams remain explicit; this is not installed
      kernel admission.
    level: integration
    runner:
      kind: external
      scope: package
      files:
        - tests/model.test.mjs
    expected:
      - Bounded immutable page model succeeds with genuine bounded source fixtures.
    prerequisites:
      - runner:node
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: >-
        Remove only unique fixture database/role/children/temp paths. Preserve shared
        PostgreSQL35689; never use live data or remove its container.
    limits:
      timeoutMs: 30000
      maxMemoryMb: 768
    installation: never
