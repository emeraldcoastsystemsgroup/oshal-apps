# CHANGE LOG: 1 | maintainer@emeraldcoastsystemsgroup.com | Own job status is read; cancellation retains held write management.
version: 1
resources:
  documents:
    scopes:
      - own
permissions:
  document.view:
    resource: documents
    effect: read
    minimumTier: viewer
  document.read:
    resource: documents
    effect: read
    minimumTier: viewer
  document.create:
    resource: documents
    effect: write
    minimumTier: editor
  document.change:
    resource: documents
    effect: write
    minimumTier: editor
  document.delete:
    resource: documents
    effect: write
    minimumTier: editor
  document.export:
    resource: documents
    effect: export
    minimumTier: editor
  document.ocr:
    resource: documents
    effect: write
    minimumTier: editor
  document.job.manage:
    resource: documents
    effect: write
    minimumTier: editor
  document.job.read:
    resource: documents
    effect: read
    minimumTier: viewer
roles:
  viewer:
    tier: viewer
    grants:
      - permission: document.view
        scope: own
      - permission: document.job.read
        scope: own
  reader:
    tier: viewer
    grants:
      - permission: document.view
        scope: own
      - permission: document.read
        scope: own
      - permission: document.job.read
        scope: own
  creator:
    tier: editor
    grants:
      - permission: document.view
        scope: own
      - permission: document.read
        scope: own
      - permission: document.create
        scope: own
      - permission: document.job.read
        scope: own
  editor:
    tier: editor
    grants:
      - permission: document.view
        scope: own
      - permission: document.read
        scope: own
      - permission: document.change
        scope: own
      - permission: document.job.manage
        scope: own
      - permission: document.job.read
        scope: own
  exporter:
    tier: editor
    grants:
      - permission: document.view
        scope: own
      - permission: document.read
        scope: own
      - permission: document.export
        scope: own
      - permission: document.job.read
        scope: own
  ocr:
    tier: editor
    grants:
      - permission: document.view
        scope: own
      - permission: document.read
        scope: own
      - permission: document.ocr
        scope: own
      - permission: document.job.manage
        scope: own
      - permission: document.job.read
        scope: own
  administrator:
    tier: admin
    grants:
      - permission: document.view
        scope: own
      - permission: document.read
        scope: own
      - permission: document.create
        scope: own
      - permission: document.change
        scope: own
      - permission: document.delete
        scope: own
      - permission: document.export
        scope: own
      - permission: document.ocr
        scope: own
      - permission: document.job.manage
        scope: own
      - permission: document.job.read
        scope: own
bindings:
  http:
    - id: pdf-route-0
      method: GET
      path: /app
      allOf:
        - document.view
    - id: pdf-route-1
      method: GET
      path: /ui/:asset
      allOf:
        - document.view
    - id: pdf-route-2
      method: GET
      path: /permissions
      allOf:
        - document.view
    - id: pdf-route-3
      method: GET
      path: /editing-contract
      allOf:
        - document.view
    - id: pdf-route-4
      method: GET
      path: /home-summary
      allOf:
