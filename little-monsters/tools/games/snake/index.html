<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Monster Snake</title>
<!--
  CHANGE LOG
  ---------------------------------------------------------------------------
  SEQ | AUTHOR                                    | DESCRIPTION
  ---------------------------------------------------------------------------
  1   | maintainer@emeraldcoastsystemsgroup.com   | Monster Snake mini-game: keyboard, swipe and on-screen pad controls, stored best score, lm-game score and lm-exit messages to the arcade
  2   | maintainer@emeraldcoastsystemsgroup.com   | Little Monsters design system: shared theme bootstrap (classroom default) and package stylesheet replace the hard-coded dark palette, radial background and glass; chips, hint, direction pad, canvas frame and the game-over dialog use tokens while the playfield keeps its own colour; the canvas scales with its aspect ratio so it fits a phone; a best score reads — until one exists; the arcade-only "I'm done" control hides when the game is opened on its own
  ---------------------------------------------------------------------------
-->
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css">
<script src="/shared/ui/js/surface-theme.js" data-theme-default="classroom"></script>
<link rel="stylesheet" href="/api/education/education.css">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px; }
  h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.2px; }
  .hud { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .hud b { font-variant-numeric: tabular-nums; }
  /* The playfield keeps its own dark colour so the pink monster snake and the apple read the same under every skin. */
  canvas { width: min(94vw, 380px, 56vh); height: auto; border-radius: 14px; border: 2px solid var(--lm-accent-line); background: #241640; touch-action: none; }
  .dpad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); gap: 6px; margin-top: 2px; }
  .dpad button { border: 1px solid var(--lm-line-strong); border-radius: 12px; background: var(--lm-card); color: var(--lm-accent); font-size: 22px; font-weight: 800; cursor: pointer; touch-action: manipulation; }
  .dpad button:active { background: var(--lm-accent); color: var(--lm-on-accent); }
  .dpad .sp { visibility: hidden; }
  .over-score { margin: 8px auto 16px; }
  .over-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
</style>
</head>
<body>
  <h1>🐍 Monster Snake</h1>
  <div class="hud"><span class="lm-pill is-neutral">Score <b id="score">0</b></span><span class="lm-pill is-info">Best <b id="best">—</b></span></div>
  <canvas id="cv" width="380" height="380"></canvas>
  <div class="dpad" aria-label="Direction pad">
    <span class="sp"></span><button type="button" onpointerdown="turn(0,-1)" aria-label="Up">▲</button><span class="sp"></span>
    <button type="button" onpointerdown="turn(-1,0)" aria-label="Left">◀</button><span class="sp"></span><button type="button" onpointerdown="turn(1,0)" aria-label="Right">▶</button>
    <span class="sp"></span><button type="button" onpointerdown="turn(0,1)" aria-label="Down">▼</button><span class="sp"></span>
  </div>
  <p class="lm-help">Arrow keys · swipe · or tap the pad</p>
  <div class="lm-modal" id="over" role="dialog" aria-modal="true" aria-labelledby="overTitle">
    <div class="lm-modal-card lm-text-center">
      <h2 class="lm-display" id="overTitle">Game over</h2>
      <p class="lm-lead over-score" id="overScore"></p>
      <div class="over-actions">
        <button type="button" class="lm-btn lm-btn-primary" onclick="reset()">Play again</button>
        <button type="button" class="lm-btn lm-btn-ghost" id="doneBtn" onclick="if(window.parent!==window)window.parent.postMessage({type:'lm-exit'},'*')">I'm done</button>
      </div>
    </div>
  </div>
<script>
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var N=19, CELL=cv.width/N;
var storedBest=null; try{ storedBest=localStorage.getItem('lm-snake-best'); }catch(e){}
var snake,dir,nextDir,food,score,best=+(storedBest||0),alive,tick,speed;
document.getElementById('best').textContent=storedBest?best:'—';
if(window.parent===window) document.getElementById('doneBtn').classList.add('hide');
function reset(){
  snake=[{x:9,y:9},{x:8,y:9},{x:7,y:9}]; dir={x:1,y:0}; nextDir=dir; score=0; alive=true; speed=140;
  placeFood(); document.getElementById('score').textContent=0; document.getElementById('over').classList.remove('is-open');
  if(tick) clearInterval(tick); tick=setInterval(step,speed); draw();
}
function placeFood(){ do{ food={x:(Math.random()*N)|0,y:(Math.random()*N)|0}; }while(snake.some(function(s){return s.x===food.x&&s.y===food.y;})); }
function turn(x,y){ if(snake&&(x!==-dir.x||y!==-dir.y)) nextDir={x:x,y:y}; }
function step(){
  if(!alive) return; dir=nextDir;
  var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(function(s){return s.x===head.x&&s.y===head.y;})) return die();
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){ score++; document.getElementById('score').textContent=score; placeFood();
    if(score%4===0&&speed>60){ speed-=8; clearInterval(tick); tick=setInterval(step,speed); } }
  else snake.pop();
  draw();
}
function rr(x,y,w,h,r){ ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.fill(); }
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.font=(CELL-2)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🍎',(food.x+.5)*CELL,(food.y+.55)*CELL);
  snake.forEach(function(s,i){
    ctx.fillStyle = i===0 ? '#ec4faa' : 'rgba(236,79,170,'+Math.max(0.3,0.85-i*0.02)+')';
    rr(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2,4);
    if(i===0){ ctx.font=(CELL-7)+'px serif'; ctx.fillText('👀',(s.x+.5)*CELL,(s.y+.55)*CELL); ctx.font=(CELL-2)+'px serif'; }
  });
}
function die(){ alive=false; clearInterval(tick);
  if(score>best){ best=score; try{ localStorage.setItem('lm-snake-best',best); }catch(e){} document.getElementById('best').textContent=best; }
  document.getElementById('overScore').textContent='You scored '+score+' apples!';
  document.getElementById('over').classList.add('is-open');
  try{ if(window.parent!==window) window.parent.postMessage({type:'lm-game',game:'snake',score:score},'*'); }catch(e){}
}
document.addEventListener('keydown',function(e){
  var k=e.key,h=false; if(k==='ArrowUp'){turn(0,-1);h=1;}else if(k==='ArrowDown'){turn(0,1);h=1;}else if(k==='ArrowLeft'){turn(-1,0);h=1;}else if(k==='ArrowRight'){turn(1,0);h=1;} if(h)e.preventDefault();
});
var sx,sy;
cv.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY;});
cv.addEventListener('pointerup',function(e){ var dx=e.clientX-sx,dy=e.clientY-sy; if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
  if(Math.abs(dx)>Math.abs(dy)) turn(dx>0?1:-1,0); else turn(0,dy>0?1:-1); });
reset();
</script>
</body>
</html>
