<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Monster Snake</title>
<style>
  :root{--pink:#ec4faa;--blue:#5b8def;--panel:#241640;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:radial-gradient(900px 500px at 50% -10%,#2a1850,#120a26) fixed,#120a26;color:#fdeaf6;
    font-family:system-ui,'Inter',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:10px;padding:10px;}
  h1{margin:0;font-size:20px;font-weight:800;}
  .hud{display:flex;gap:18px;font-weight:800;font-size:15px;}
  .hud .blue{color:var(--blue);}
  canvas{background:var(--panel);border-radius:14px;border:2px solid rgba(236,79,170,.3);touch-action:none;max-width:94vw;max-height:58vh;}
  .dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:6px;margin-top:2px;}
  .dpad button{border:none;border-radius:12px;background:var(--panel);color:#fff;font-size:22px;font-weight:800;cursor:pointer;}
  .dpad button:active{background:var(--pink);}
  .dpad .sp{visibility:hidden;}
  .over{position:fixed;inset:0;background:rgba(10,6,24,.86);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;}
  .over.on{display:flex;}
  .over h2{font-size:26px;margin:0;}
  .btn{background:var(--pink);color:#fff;border:none;border-radius:12px;padding:12px 24px;font-weight:800;font-size:16px;cursor:pointer;}
  .hint{font-size:12px;color:#b98cc8;}
</style>
  <link rel="stylesheet" href="/shared/ui/css/surface-glass.css" />
</head>
<body>
  <h1>🐍 Monster Snake</h1>
  <div class="hud"><span>Score <span id="score">0</span></span><span class="blue">Best <span id="best">0</span></span></div>
  <canvas id="cv" width="380" height="380"></canvas>
  <div class="dpad">
    <span class="sp"></span><button onpointerdown="turn(0,-1)">▲</button><span class="sp"></span>
    <button onpointerdown="turn(-1,0)">◀</button><span class="sp"></span><button onpointerdown="turn(1,0)">▶</button>
    <span class="sp"></span><button onpointerdown="turn(0,1)">▼</button><span class="sp"></span>
  </div>
  <div class="hint">Arrow keys · swipe · or tap the pad</div>
  <div class="over" id="over"><h2>Game Over</h2><div id="overScore"></div><button class="btn" onclick="reset()">Play again</button>
    <button class="btn" style="background:transparent;border:1px solid #5b8def;color:#cfe0ff;margin-left:8px;" onclick="if(window.parent!==window)window.parent.postMessage({type:'lm-exit'},'*')">I'm done</button></div>
<script>
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var N=19, CELL=cv.width/N;
var snake,dir,nextDir,food,score,best=+(localStorage.getItem('lm-snake-best')||0),alive,tick,speed;
document.getElementById('best').textContent=best;
function reset(){
  snake=[{x:9,y:9},{x:8,y:9},{x:7,y:9}]; dir={x:1,y:0}; nextDir=dir; score=0; alive=true; speed=140;
  placeFood(); document.getElementById('score').textContent=0; document.getElementById('over').classList.remove('on');
  if(tick) clearInterval(tick); tick=setInterval(step,speed); draw();
}
function placeFood(){ do{ food={x:(Math.random()*N)|0,y:(Math.random()*N)|0}; }while(snake.some(function(s){return s.x===food.x&&s.y===food.y;})); }
function turn(x,y){ if(snake&&(x!==-dir.x||y!==-dir.y)) nextDir={x:x,y:y}; }
function step(){
  if(!alive) return; dir=nextDir;
  var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(function(s){return s.x===head.x&&s.y===head.y;})) return die();
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){ score++; document.getElementById('score').textContent=score; placeFood();
    if(score%4===0&&speed>60){ speed-=8; clearInterval(tick); tick=setInterval(step,speed); } }
  else snake.pop();
  draw();
}
function rr(x,y,w,h,r){ ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.fill(); }
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.font=(CELL-2)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🍎',(food.x+.5)*CELL,(food.y+.55)*CELL);
  snake.forEach(function(s,i){
    ctx.fillStyle = i===0 ? '#ec4faa' : 'rgba(236,79,170,'+Math.max(0.3,0.85-i*0.02)+')';
    rr(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2,4);
    if(i===0){ ctx.font=(CELL-7)+'px serif'; ctx.fillText('👀',(s.x+.5)*CELL,(s.y+.55)*CELL); ctx.font=(CELL-2)+'px serif'; }
  });
}
function die(){ alive=false; clearInterval(tick);
  if(score>best){ best=score; localStorage.setItem('lm-snake-best',best); document.getElementById('best').textContent=best; }
  document.getElementById('overScore').textContent='You scored '+score+' apples!';
  document.getElementById('over').classList.add('on');
  try{ if(window.parent!==window) window.parent.postMessage({type:'lm-game',game:'snake',score:score},'*'); }catch(e){}
}
document.addEventListener('keydown',function(e){
  var k=e.key,h=false; if(k==='ArrowUp'){turn(0,-1);h=1;}else if(k==='ArrowDown'){turn(0,1);h=1;}else if(k==='ArrowLeft'){turn(-1,0);h=1;}else if(k==='ArrowRight'){turn(1,0);h=1;} if(h)e.preventDefault();
});
var sx,sy;
cv.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY;});
cv.addEventListener('pointerup',function(e){ var dx=e.clientX-sx,dy=e.clientY-sy; if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
  if(Math.abs(dx)>Math.abs(dy)) turn(dx>0?1:-1,0); else turn(0,dy>0?1:-1); });
reset();
</script>
</body>
</html>
