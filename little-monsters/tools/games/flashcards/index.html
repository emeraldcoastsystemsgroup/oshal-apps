<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Flashcard Blitz</title>
<!--
  CHANGE LOG
  ---------------------------------------------------------------------------
  SEQ | AUTHOR                                    | DESCRIPTION
  ---------------------------------------------------------------------------
  1   | maintainer@emeraldcoastsystemsgroup.com   | Flashcard Blitz mini-game: timed multiple choice over the learner's own flashcards with a practice fallback, streak and lives, lm-game score and lm-exit messages to the arcade
  2   | maintainer@emeraldcoastsystemsgroup.com   | Little Monsters design system: shared theme bootstrap (classroom default) and package stylesheet replace the hard-coded dark palette and glass; chips, timer (lm-progress), question card, choices and the game-over dialog use tokens with semantic right/wrong colours; the arcade-only "I'm done" control hides when the game is opened on its own
  ---------------------------------------------------------------------------
-->
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css">
<script src="/shared/ui/js/surface-theme.js" data-theme-default="classroom"></script>
<link rel="stylesheet" href="/api/education/education.css">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 14px; }
  h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.2px; }
  .hud { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .hud b { font-variant-numeric: tabular-nums; }
  .timebar { width: min(92vw, 460px); }
  .timebar > span { transition: width .1s linear; }
  .q { width: min(92vw, 460px); min-height: 90px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 18px;
    font-size: 18px; font-weight: 700; overflow-wrap: anywhere; background: var(--lm-card); border: 1px solid var(--lm-line); border-radius: var(--lm-radius-lg); box-shadow: var(--lm-shadow-soft); }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(92vw, 460px); }
  .opt { min-height: var(--lm-touch); padding: 12px; border-radius: var(--lm-radius-md); border: 1px solid var(--lm-line-strong); background: var(--lm-card); color: var(--lm-ink);
    font-size: 14px; font-weight: 600; cursor: pointer; overflow-wrap: anywhere; }
  .opt:hover { border-color: var(--lm-accent-line); background: var(--lm-accent-wash); }
  .opt.right { background: var(--lm-success); border-color: var(--lm-success); color: #fff; }
  .opt.wrong { background: var(--lm-danger); border-color: var(--lm-danger); color: #fff; }
  .over-score { margin: 8px auto 16px; }
  .over-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
</style>
</head>
<body>
  <h1>🃏 Flashcard Blitz</h1>
  <div class="hud"><span class="lm-pill is-neutral">Score <b id="score">0</b></span><span class="lm-pill is-info">Streak <b id="streak">0</b></span><span class="lm-pill is-danger" id="lives">❤️❤️❤️</span></div>
  <div class="lm-progress timebar" aria-hidden="true"><span id="timebar" style="width:100%"></span></div>
  <div class="q" id="q">Loading your cards…</div>
  <div class="opts" id="opts"></div>
  <p class="lm-help" id="src"></p>
  <div class="lm-modal" id="over" role="dialog" aria-modal="true" aria-labelledby="overTitle">
    <div class="lm-modal-card lm-text-center">
      <h2 class="lm-display" id="overTitle">Time!</h2>
      <p class="lm-lead over-score" id="overScore"></p>
      <div class="over-actions">
        <button type="button" class="lm-btn lm-btn-primary" onclick="start()">Play again</button>
        <button type="button" class="lm-btn lm-btn-ghost" id="doneBtn" onclick="if(window.parent!==window)window.parent.postMessage({type:'lm-exit'},'*')">I'm done</button>
      </div>
    </div>
  </div>
<script>
var pool=[], score=0, streak=0, lives=3, cur=null, timer=null, timeLeft=0, busy=false;
var FALLBACK=[
  {q:'7 × 8 = ?',a:'56'},{q:'Capital of France?',a:'Paris'},{q:'H₂O is…',a:'Water'},{q:'12 + 19 = ?',a:'31'},
  {q:'A noun is a person, place or…',a:'Thing'},{q:'Powerhouse of the cell?',a:'Mitochondria'},{q:'Red planet?',a:'Mars'},
  {q:'9 × 6 = ?',a:'54'},{q:'Past tense of "run"?',a:'Ran'},{q:'Largest ocean?',a:'Pacific'}
];
if(window.parent===window) document.getElementById('doneBtn').classList.add('hide');
async function loadPool(){
  try{
    var sr=await fetch('/api/education/flashcards/sets'); if(sr.ok){ var sets=(await sr.json()).sets||[];
      for(var i=0;i<Math.min(sets.length,5);i++){ var cr=await fetch('/api/education/flashcards/sets/'+sets[i].set_id+'/cards');
        if(cr.ok)(((await cr.json()).cards)||[]).forEach(function(c){ if(c.front&&c.back)pool.push({q:String(c.front),a:String(c.back)}); }); } }
  }catch(e){}
  if(pool.length<4){ pool=FALLBACK.slice(); document.getElementById('src').textContent='Practice set (make your own in Card Maker!)'; }
  else document.getElementById('src').textContent='From your flashcards 🎯';
  start();
}
function start(){ score=0; streak=0; lives=3; busy=false; updateHud(); document.getElementById('over').classList.remove('is-open'); next(); }
function updateHud(){ document.getElementById('score').textContent=score; document.getElementById('streak').textContent=streak;
  document.getElementById('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives); }
function next(){
  busy=false; cur=pool[Math.random()*pool.length|0];
  document.getElementById('q').textContent=cur.q;
  var others=pool.filter(function(c){return c.a!==cur.a;}); var opts=[cur.a];
  for(var k=0;k<3&&others.length;k++){ var j=Math.random()*others.length|0; opts.push(others[j].a); others.splice(j,1); }
  for(var s=opts.length-1;s>0;s--){ var t=Math.random()*(s+1)|0; var tmp=opts[s];opts[s]=opts[t];opts[t]=tmp; }
  var box=document.getElementById('opts'); box.innerHTML='';
  opts.forEach(function(o){ var b=document.createElement('button'); b.type='button'; b.className='opt'; b.textContent=o; b.onclick=function(){answer(b,o);}; box.appendChild(b); });
  timeLeft=100; if(timer)clearInterval(timer); timer=setInterval(tickTime,80);
}
function tickTime(){ timeLeft-=1.4; document.getElementById('timebar').style.width=Math.max(0,timeLeft)+'%';
  if(timeLeft<=0){ clearInterval(timer); answer(null,null); } }
function answer(btn,val){
  if(busy)return; busy=true; clearInterval(timer);
  var correct = val===cur.a;
  document.querySelectorAll('.opt').forEach(function(b){ if(b.textContent===cur.a)b.classList.add('right'); });
  if(correct){ var gain=10+Math.floor(timeLeft/10)+streak*2; score+=gain; streak++; }
  else { if(btn)btn.classList.add('wrong'); streak=0; lives--; }
  updateHud();
  setTimeout(function(){ if(lives<=0) end(); else next(); }, correct?550:900);
}
function end(){ clearInterval(timer);
  document.getElementById('overScore').textContent='You scored '+score+'!';
  document.getElementById('over').classList.add('is-open');
  try{ if(window.parent!==window) window.parent.postMessage({type:'lm-game',game:'flashcards',score:score},'*'); }catch(e){}
}
loadPool();
</script>
</body>
</html>
