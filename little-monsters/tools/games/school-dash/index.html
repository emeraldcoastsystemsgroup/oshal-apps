<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Monster Dash</title>
<!--
  CHANGE LOG
  ---------------------------------------------------------------------------
  SEQ | AUTHOR                                    | DESCRIPTION
  ---------------------------------------------------------------------------
  1   | maintainer@emeraldcoastsystemsgroup.com   | Monster Dash mini-game: endless canvas runner with jumps, stars and a stored best distance, lm-game score and lm-exit messages to the arcade
  2   | maintainer@emeraldcoastsystemsgroup.com   | Little Monsters design system: shared theme bootstrap (classroom default) and package stylesheet replace the hard-coded dark palette and glass; chip, hint, canvas frame and the game-over dialog use tokens while the canvas keeps its night-sky world; the canvas now scales with its aspect ratio so it fits a phone; the arcade-only "I'm done" control hides when the game is opened on its own
  ---------------------------------------------------------------------------
-->
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css">
<script src="/shared/ui/js/surface-theme.js" data-theme-default="classroom"></script>
<link rel="stylesheet" href="/api/education/education.css">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px; }
  h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.2px; }
  .hud b { font-variant-numeric: tabular-nums; }
  /* The canvas is the game world and keeps its own night-sky art; the frame around it is chrome. */
  canvas { width: min(96vw, 640px); height: auto; border-radius: 14px; border: 2px solid var(--lm-accent-line); touch-action: none; background: linear-gradient(180deg, #2a1850, #1a0f33); }
  .over-score { margin: 8px auto 16px; }
  .over-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
</style>
</head>
<body>
  <h1>🏃 Monster Dash</h1>
  <div class="hud"><span class="lm-pill is-neutral">Distance <b id="score">0</b>&nbsp;m</span></div>
  <canvas id="cv" width="640" height="280"></canvas>
  <p class="lm-help">Press Space / tap to jump · double-tap for a double jump</p>
  <div class="lm-modal" id="over" role="dialog" aria-modal="true" aria-labelledby="overTitle">
    <div class="lm-modal-card lm-text-center">
      <h2 class="lm-display" id="overTitle">Nice run!</h2>
      <p class="lm-lead over-score" id="overScore"></p>
      <div class="over-actions">
        <button type="button" class="lm-btn lm-btn-primary" onclick="reset()">Run again</button>
        <button type="button" class="lm-btn lm-btn-ghost" id="doneBtn" onclick="if(window.parent!==window)window.parent.postMessage({type:'lm-exit'},'*')">I'm done</button>
      </div>
    </div>
  </div>
<script>
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=cv.width,H=cv.height,GROUND=H-46;
var storedBest=null; try{ storedBest=localStorage.getItem('lm-dash-best'); }catch(e){}
var monster,obstacles,coins,score,best=+(storedBest||0),speed,alive,raf,jumps,spawnT,coinT;
if(window.parent===window) document.getElementById('doneBtn').classList.add('hide');
function reset(){
  monster={x:80,y:GROUND-44,w:40,h:44,vy:0}; obstacles=[]; coins=[]; score=0; speed=4.2; alive=true; jumps=0; spawnT=0; coinT=40;
  document.getElementById('over').classList.remove('is-open');
  if(raf) cancelAnimationFrame(raf); loop();
}
function jump(){ if(!alive) return; if(monster.y>=GROUND-monster.h-1){ monster.vy=-12; jumps=1; } else if(jumps<2){ monster.vy=-10.5; jumps++; } }
function spawnObstacle(){
  var tall=Math.random()<0.35;
  obstacles.push({x:W+10,y:GROUND-(tall?54:34),w:tall?26:34,h:tall?54:34,emoji:tall?'📚':'🎒'});
}
function loop(){
  if(!alive) return;
  ctx.clearRect(0,0,W,H);
  // ground
  ctx.fillStyle='#3a2566'; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle='rgba(255,255,255,.08)'; for(var gx=(score*3)%40;gx<W;gx+=40){ctx.beginPath();ctx.moveTo(gx,GROUND);ctx.lineTo(gx-14,H);ctx.stroke();}
  // physics
  monster.vy+=0.6; monster.y+=monster.vy;
  if(monster.y>GROUND-monster.h){ monster.y=GROUND-monster.h; monster.vy=0; jumps=0; }
  // monster
  ctx.font='40px serif'; ctx.textBaseline='alphabetic'; ctx.fillText('🐲',monster.x,monster.y+monster.h);
  // spawn
  if(--spawnT<=0){ spawnObstacle(); spawnT=Math.max(48, 120-(score*0.5)) + Math.random()*40; }
  if(--coinT<=0){ coins.push({x:W+10,y:GROUND-70-Math.random()*60}); coinT=60+Math.random()*60; }
  // obstacles
  ctx.font='30px serif';
  for(var i=obstacles.length-1;i>=0;i--){ var o=obstacles[i]; o.x-=speed;
    ctx.fillText(o.emoji,o.x,o.y+o.h);
    if(o.x+o.w<0){ obstacles.splice(i,1); continue; }
    if(monster.x+monster.w-8>o.x+4 && monster.x+8<o.x+o.w-4 && monster.y+monster.h-6>o.y+4){ return die(); }
  }
  // coins
  ctx.font='22px serif';
  for(var j=coins.length-1;j>=0;j--){ var c=coins[j]; c.x-=speed; ctx.fillText('⭐',c.x,c.y);
    if(c.x<-20){ coins.splice(j,1); continue; }
    if(Math.abs((monster.x+20)-(c.x+8))<26 && Math.abs((monster.y+20)-(c.y-8))<26){ score+=5; coins.splice(j,1); } }
  // score / speed
  score+=0.2; speed+=0.0015;
  document.getElementById('score').textContent=Math.floor(score);
  raf=requestAnimationFrame(loop);
}
function die(){ alive=false; cancelAnimationFrame(raf); var s=Math.floor(score);
  if(s>best){ best=s; try{ localStorage.setItem('lm-dash-best',best); }catch(e){} }
  document.getElementById('overScore').textContent='You ran '+s+' m · Best '+best+' m';
  document.getElementById('over').classList.add('is-open');
  try{ if(window.parent!==window) window.parent.postMessage({type:'lm-game',game:'dash',score:s},'*'); }catch(e){}
}
document.addEventListener('keydown',function(e){ if(e.key===' '||e.key==='ArrowUp'){ e.preventDefault(); jump(); } });
cv.addEventListener('pointerdown',function(e){ e.preventDefault(); jump(); });
reset();
</script>
</body>
</html>
