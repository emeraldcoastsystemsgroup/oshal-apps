<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Monsters — Monster Arcade</title>
<!--
  CHANGE LOG
  ---------------------------------------------------------------------------
  DATE           | AUTHOR                                      | DESCRIPTION
  ---------------------------------------------------------------------------
  2026-08-05     | maintainer@emeraldcoastsystemsgroup.com     | Document the shipped curriculum-linked warm-up path and its intentional empty-state fallback.
  2026-09-26     | maintainer@emeraldcoastsystemsgroup.com     | Little Monsters design system: shared theme bootstrap (classroom default), package stylesheet and page frame replace the per-page theme reader, glass and literal palette; hero, game cards, the warm-up dialog (lm-modal) and the play stage use tokens and read on light and dark skins; toasts come from the frame. Game labels now match the games' own titles (Monster Dash, Monster Snake, Monster 2048); a game's stored best score shows on its card when one exists. Warm-up gate, XP posts and the lm-game / lm-exit message handling are unchanged.
  ---------------------------------------------------------------------------
-->
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css">
<script src="/shared/ui/js/surface-theme.js" data-theme-default="classroom"></script>
<link rel="stylesheet" href="/api/education/education.css">
<style>
  .game-emoji { font-size: 36px; line-height: 1; margin-bottom: 10px; }
  .game-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
  .gate-q { font-weight: 700; font-size: 17px; margin-bottom: 12px; }
  .gate-opts { display: grid; gap: 8px; }
  /* Answer choice: a full-width, left-aligned option the design system has no component for. */
  .opt {
    display: block; width: 100%; text-align: left; min-height: var(--lm-touch); padding: 12px 16px;
    border-radius: var(--lm-radius-md); border: 1px solid var(--lm-line-strong); background: var(--lm-card); color: var(--lm-ink);
    font-size: 15px; font-weight: 600; cursor: pointer; transition: border-color 160ms ease, background 160ms ease;
  }
  .opt:hover { border-color: var(--lm-accent-line); background: var(--lm-accent-wash); }
  .opt.wrong { border-color: var(--lm-danger); background: color-mix(in srgb, var(--lm-danger) 10%, transparent); color: var(--lm-danger); }
  .gate-foot { display: flex; justify-content: flex-end; margin-top: 12px; }
  /* Play stage: a full-window frame for the chosen game, above the page and any standalone top bar. */
  .stage { position: fixed; inset: 0; z-index: 900; display: none; flex-direction: column; background: var(--lm-bg); }
  .stage.is-open { display: flex; }
  .stage-bar { display: flex; align-items: center; gap: 10px; padding: 8px var(--lm-gutter); background: var(--lm-card); border-bottom: 1px solid var(--lm-line); }
  .stage-bar b { flex: 1; min-width: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stage iframe { flex: 1; width: 100%; border: 0; background: var(--lm-bg); }
</style>
</head>
<body>
<main class="lm-page">
  <header class="lm-hero">
    <div>
      <div class="lm-eyebrow">Monster arcade</div>
      <h1 class="lm-display">Warm up, then play.</h1>
      <p class="lm-lead">Beat a quick brain warm-up, then play. Win points and your monster grows! &#128293;</p>
    </div>
    <img class="lm-hero-art" src="/api/education/logo-256.png" alt="" width="168" height="162">
  </header>
  <section class="lm-section">
    <div class="lm-section-head"><h2>Games</h2><span class="lm-subtle lm-small">One warm-up question unlocks each game</span></div>
    <div class="lm-grid" id="grid" style="--min:300px"></div>
  </section>
</main>

<!-- Study gate -->
<div class="lm-modal" id="ov" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="lm-modal-card">
    <div class="lm-modal-head"><h2 id="gateTitle">Brain warm-up &#129504;</h2></div>
    <p class="lm-help lm-mb-md">Answer to unlock <strong id="gateGame">the game</strong>.</p>
    <div class="gate-q" id="gateQ"></div>
    <div class="gate-opts" id="gateOpts"></div>
    <div class="lm-status is-error lm-mt-md" id="gateMsg" role="status"></div>
    <div class="gate-foot"><button type="button" class="lm-btn lm-btn-quiet" id="gateCancel">Maybe later</button></div>
  </div>
</div>

<!-- Play stage -->
<div class="stage" id="stage">
  <div class="stage-bar"><b id="stageTitle">Game</b><button type="button" class="lm-btn lm-btn-ghost" id="stageBack">&#8592; Back to arcade</button></div>
  <iframe id="stageFrame" title="game" allow="autoplay; fullscreen"></iframe>
</div>

<script src="/api/education/mascot.js?v=4"></script>
<script>
var esc = window.LM.esc;
// Bundled games (served from /api/education/games/<id>/index.html). Names are the games' own titles;
// bestKey is the localStorage key a game keeps its best score under, when it keeps one.
var GAMES = [
  { id:'milkshake-maker', name:'Milkshake Maker', emoji:'🥤', blurb:'Remember the recipe' },
  { id:'quiz-arena',      name:'Quiz Arena',      emoji:'⚔️', blurb:'Battle with your flashcards' },
  { id:'snake',           name:'Monster Snake',   emoji:'🐍', blurb:'Eat apples, don’t crash', bestKey:'lm-snake-best' },
  { id:'2048',            name:'Monster 2048',    emoji:'🔢', blurb:'Merge your way to 2048', bestKey:'lm-2048-best' },
  { id:'school-dash',     name:'Monster Dash',    emoji:'🏃', blurb:'Jump the backpacks', bestKey:'lm-dash-best' },
  { id:'flashcards',      name:'Flashcard Blitz', emoji:'🃏', blurb:'Beat the clock' },
];
// Dependency-free fallback bank for students with fewer than four accessible cards.
// loadCurriculum below replaces it with the student's current flashcards when available.
var WARMUPS = [
  { q:'What is 7 × 8?', a:'56', opts:['54','56','48','63'] },
  { q:'Which planet is known as the Red Planet?', a:'Mars', opts:['Venus','Mars','Jupiter','Mercury'] },
  { q:'What is H2O commonly called?', a:'Water', opts:['Salt','Air','Water','Acid'] },
  { q:'A noun is a person, place, or …?', a:'Thing', opts:['Action','Thing','Color','Sound'] },
  { q:'What is 12 + 19?', a:'31', opts:['29','31','32','41'] },
  { q:'The powerhouse of the cell is the …?', a:'Mitochondria', opts:['Nucleus','Ribosome','Mitochondria','Membrane'] },
];

// Curriculum-linked warm-up: pull the student's REAL flashcards so the gate quizzes
// what they're actually studying. Falls back to WARMUPS if they have no cards yet.
var CURR = []; // [{q, a}]
(async function loadCurriculum(){
  try{
    var sr = await fetch('/api/education/flashcards/sets'); if(!sr.ok) return;
    var sets = (await sr.json()).sets || [];
    for(var i=0;i<Math.min(sets.length,4);i++){
      try{
        var cr = await fetch('/api/education/flashcards/sets/'+sets[i].set_id+'/cards');
        if(!cr.ok) continue;
        (((await cr.json()).cards)||[]).forEach(function(c){ if(c.front&&c.back) CURR.push({q:String(c.front), a:String(c.back)}); });
      }catch(e){}
    }
  }catch(e){}
})();
function buildWarmup(){
  // Use a real flashcard if we have at least 4 (need 3 distractors); else the bank.
  if(CURR.length>=4){
    var card=CURR[Math.floor(Math.random()*CURR.length)];
    var pool=CURR.filter(function(c){return c.a!==card.a;});
    var opts=[card.a];
    for(var k=0;k<3 && pool.length;k++){ var j=Math.floor(Math.random()*pool.length); opts.push(pool[j].a); pool.splice(j,1); }
    return { q:card.q, a:card.a, opts:opts };
  }
  return WARMUPS[Math.floor(Math.random()*WARMUPS.length)];
}

/** A game's stored best score, or null when it has never been played here. */
function bestScore(g){
  if(!g.bestKey) return null;
  try{ var v=localStorage.getItem(g.bestKey); return v==null||v===''?null:Number(v); }catch(e){ return null; }
}
var grid = document.getElementById('grid');
GAMES.forEach(function(g){
  var best=bestScore(g);
  var b = document.createElement('button'); b.type='button'; b.className='lm-card is-clickable game';
  b.innerHTML = '<div class="game-emoji">'+g.emoji+'</div><h3>'+esc(g.name)+'</h3><div class="lm-card-meta">'+esc(g.blurb)+'</div>'
    +'<div class="game-foot"><span class="lm-pill is-neutral">Warm-up first</span>'+(best!=null&&Number.isFinite(best)?'<span class="lm-pill is-gold">Best '+best+'</span>':'')+'</div>';
  b.onclick = function(){ openGate(g); };
  grid.appendChild(b);
});

// Feed the real scoring module: POST /api/education/xp (awardXP → lm_xp_events + level).
function awardXp(eventType, meta){
  try{
    fetch('/api/education/xp',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({eventType:eventType,metadata:meta||{}})})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&d.xpAwarded){ toast('+'+d.xpAwarded+' XP'+(d.level?'  •  Level '+d.level:'')); }
        if(d&&d.boxesGranted>0){ setTimeout(function(){ toast('🎁 Mystery box earned! Open it in My Monsters'); },1600); }
      })
      .catch(function(){});
  }catch(e){}
}
function toast(msg){ window.LM.toast(msg); }

var pending = null;
function openGate(g){
  pending = g;
  document.getElementById('gateGame').textContent = g.name;
  var w = buildWarmup();
  document.getElementById('gateQ').textContent = w.q;
  var box = document.getElementById('gateOpts'); box.innerHTML='';
  document.getElementById('gateMsg').textContent='';
  // shuffle options
  var opts = w.opts.slice(); for(var i=opts.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=opts[i]; opts[i]=opts[j]; opts[j]=t; }
  opts.forEach(function(o){
    var ob=document.createElement('button'); ob.type='button'; ob.className='opt'; ob.textContent=o;
    ob.onclick=function(){
      if(o===w.a){ awardXp('game_warmup',{game:g.id}); play(g); }
      else { ob.classList.add('wrong'); document.getElementById('gateMsg').textContent='Not quite — try again!'; }
    };
    box.appendChild(ob);
  });
  document.getElementById('ov').classList.add('is-open');
}
document.getElementById('gateCancel').onclick=function(){ document.getElementById('ov').classList.remove('is-open'); };

var bonusedThisGame=false;
function play(g){
  bonusedThisGame=false;
  document.getElementById('ov').classList.remove('is-open');
  document.getElementById('stageTitle').textContent = g.name;
  document.getElementById('stageFrame').src = '/api/education/games/'+g.id+'/index.html?v=3';
  document.getElementById('stage').classList.add('is-open');
}
// Games postMessage their score on game-over; reward a one-time skill bonus per play.
// Only trust the message if it came from OUR game iframe (same-origin) — otherwise any
// other window could post a fake score to farm XP.
window.addEventListener('message', function(e){
  var frame=document.getElementById('stageFrame');
  if(!frame || e.source!==frame.contentWindow) return;
  var d=e.data; if(!d) return;
  // A game's "I'm done" button asks the arcade to return to the grid.
  if(d.type==='lm-exit'){ exitStage(); return; }
  if(d.type!=='lm-game') return;
  if(!bonusedThisGame && (d.score||0) >= 20){ bonusedThisGame=true; awardXp('game_played',{game:d.game,score:d.score}); toast('🔥 Nice game!'); }
});
function exitStage(){
  // Award a play-session XP when the student finishes a game and returns to the arcade.
  var title = document.getElementById('stageTitle').textContent;
  awardXp('game_played',{game:title});
  document.getElementById('stage').classList.remove('is-open');
  document.getElementById('stageFrame').src='about:blank';
}
document.getElementById('stageBack').onclick=exitStage;
</script>
</body>
</html>
