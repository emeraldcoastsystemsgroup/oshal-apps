<link rel="stylesheet" href="/shared/ui/css/surface-themes.css">
<script src="/shared/ui/js/surface-theme.js" data-theme-default="classroom"></script>
<link rel="stylesheet" href="/api/education/education.css">
<style>
  /* The tutor is a full-height conversation, not a scrolling page. */
  html, body { height: 100%; }
  body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  /* The shell is .tutor-shell, never .tutor: every tutor reply carries class "msg tutor". */
  .tutor-shell { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 980px; margin: 0 auto; }

  /* Header */
  .tutor-head { display: flex; align-items: center; gap: 12px; padding: 12px var(--lm-gutter); border-bottom: 1px solid var(--lm-line); background: var(--lm-card); }
  .history-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--lm-line); border-radius: var(--lm-radius-md); background: var(--lm-card); }
  .history-open { flex: 1 1 auto; min-width: 0; min-height: var(--lm-touch); text-align: left; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; padding: 4px 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .history-open strong { display: block; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-open small { color: var(--lm-muted); font-size: 12.5px; }
  .tutor-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--lm-accent-soft); padding: 4px; flex: 0 0 42px; }
  .tutor-who { min-width: 0; flex: 1; }
  .tutor-name { font-weight: 800; font-size: 16px; letter-spacing: -0.2px; }
  .tutor-class { font-size: 12.5px; color: var(--lm-muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tts-toggle.is-on { background: var(--lm-accent-soft); color: var(--lm-accent); border-color: var(--lm-accent-line); }
  .tutor-class .ground-off { color: var(--lm-muted); }
  .tutor-class .ground-on { color: var(--lm-success); font-weight: 700; }
  /* Header ⋯: the read-aloud toggle lives here (one secondary action beside the class picker). */
  .tutor-more { position: relative; flex: 0 0 auto; }
  .tutor-more > summary { list-style: none; cursor: pointer; font-size: 20px; line-height: 1; }
  .tutor-more > summary::-webkit-details-marker { display: none; }
  .tutor-more-menu { position: absolute; right: 0; top: calc(100% + 6px); min-width: 220px; display: grid; gap: 2px; padding: 8px; background: var(--lm-card); border: 1px solid var(--lm-line); border-radius: var(--lm-radius-md); box-shadow: var(--lm-shadow); z-index: 70; }
  .tutor-more-menu .lm-btn { justify-content: flex-start; width: 100%; }

  /* Conversation */
  .tutor-messages { flex: 1; min-height: 0; overflow-y: auto; padding: 18px var(--lm-gutter); display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: min(80%, 640px); padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; }
  .msg.student { align-self: flex-end; background: var(--lm-accent); color: var(--lm-on-accent); border-bottom-right-radius: 5px; box-shadow: var(--lm-shadow-soft); }
  .msg.tutor { align-self: flex-start; background: var(--lm-card); border: 1px solid var(--lm-line); border-bottom-left-radius: 5px; }
  .msg.typing { align-self: flex-start; background: var(--lm-card); border: 1px solid var(--lm-line); color: var(--lm-muted); font-style: italic; }
  .msg.typing .dots { display: inline-block; }
  .msg.typing .dots span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--lm-muted); margin: 0 2px; animation: dot-pulse 1.4s infinite; }
  .msg.typing .dots span:nth-child(2) { animation-delay: 0.2s; }
  .msg.typing .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  .msg .read-btn { margin-top: 8px; }
  .msg pre { background: var(--lm-input-bg); border: 1px solid var(--lm-line); border-radius: 10px; padding: 10px; overflow-x: auto; margin-top: 8px; font-size: 13px; }
  .msg code { background: var(--lm-input-bg); border-radius: 6px; padding: 1px 5px; font-size: 0.92em; }
  .msg pre code { background: none; padding: 0; }
  .msg ul, .msg ol { margin: 6px 0; padding-left: 20px; }
  .msg .rr-block { margin: 6px 0; }
  .msg .rr-doc { border-left: 3px solid var(--lm-accent); padding-left: 10px; }
  .msg .rr-doc-title { margin: 0 0 6px; font-size: 15px; }
  .msg .rr-doc-section h4 { margin: 8px 0 3px; font-size: 14px; }
  .msg .rr-doc-section p { margin: 4px 0; }
  .msg img.msg-photo { max-width: 220px; border-radius: 10px; margin-top: 8px; display: block; }
  .msg .msg-table { overflow-x: auto; margin: 8px 0; }
  .msg .msg-table table { border-collapse: collapse; font-size: 14px; }
  .msg .msg-table th, .msg .msg-table td { border: 1px solid var(--lm-line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .msg .msg-table th { background: var(--lm-bg-2); font-weight: 700; }
  .grounding { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .grounding details { font-size: 12.5px; color: var(--lm-muted); }
  .grounding summary { cursor: pointer; user-select: none; }
  .grounding ul { margin: 6px 0 0; padding-left: 18px; line-height: 1.5; }
  .grounding .src-n { color: var(--lm-success); font-weight: 700; }

  /* Welcome */
  .tutor-welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 24px 8px; }
  .tutor-welcome img { width: clamp(88px, 14vw, 132px); height: auto; filter: drop-shadow(0 12px 22px color-mix(in srgb, var(--lm-ink) 18%, transparent)); }
  .tutor-welcome h2 { font-size: clamp(24px, 3.4vw, 32px); }
  .tutor-welcome p { max-width: 46ch; }
  /* Starter chips: one sideways-scrolling row directly above the composer, so none slides under it. */
  .suggestions { display: flex; flex-wrap: nowrap; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 10px var(--lm-gutter) 2px; flex: 0 0 auto; }
  .suggestions::-webkit-scrollbar { display: none; }
  .suggestion { white-space: nowrap; flex: 0 0 auto; }

  /* Composer */
  .attach-preview { padding: 8px var(--lm-gutter) 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .attach-chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 4px 4px 8px; border-radius: 12px; border: 1px solid var(--lm-line); background: var(--lm-card); font-size: 13px; color: var(--lm-ink-2); max-width: 100%; }
  .attach-chip img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; }
  .attach-chip .attach-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
  .tutor-compose { position: relative; display: flex; gap: 8px; align-items: flex-end; padding: 12px var(--lm-gutter) 14px; border-top: 1px solid var(--lm-line); background: var(--lm-card); }
  /* 16px text so a phone never zooms the page when the box takes focus. */
  .tutor-compose textarea { flex: 1; min-width: 0; resize: none; max-height: 120px; line-height: 1.4; font-size: 16px; }
  .tutor-compose .lm-btn-icon { flex: 0 0 var(--lm-touch); height: var(--lm-touch); font-size: 19px; }
  /* Send is the one primary; its glyph wears the theme's accent ink (Graphite's near-white accent needs dark ink). */
  #sendBtn { color: var(--ds-on-accent, var(--text-on-accent, var(--lm-on-accent))); }
  /* + opens a small sheet (Camera, File) on a phone; a wide screen keeps the two buttons. */
  #plusBtn { display: none; }
  .attach-sheet { position: absolute; left: 10px; bottom: calc(100% + 6px); display: grid; gap: 2px; min-width: 210px; padding: 8px; background: var(--lm-card); border: 1px solid var(--lm-line); border-radius: var(--lm-radius-md); box-shadow: var(--lm-shadow); z-index: 70; }
  .attach-sheet[hidden] { display: none; }
  .attach-sheet .lm-btn { justify-content: flex-start; width: 100%; }
  .mic-btn.listening { background: var(--lm-danger); color: var(--lm-on-accent); border-color: var(--lm-danger); animation: pulse-mic 1.5s infinite; }
  @keyframes pulse-mic { 0%, 100% { box-shadow: none; } 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--lm-danger) 25%, transparent); } }

  /* Live camera */
  .cam-inner video { width: 100%; border-radius: 12px; background: var(--lm-ink); max-height: 60vh; }
  .cam-actions { display: flex; gap: 10px; margin-top: 12px; }
  .cam-actions .lm-btn { flex: 1; }

  @media (max-width: 640px) {
    .tutor-compose { gap: 6px; padding-inline: 10px; }
    #plusBtn { display: inline-flex; }
    #camBtn, #attachBtn { display: none; }
    .suggestions { padding-inline: 10px; }
    .attach-preview { padding-inline: 10px; }
    .tutor-head { padding-inline: 12px; flex-wrap: wrap; row-gap: 8px; column-gap: 6px; }
    .tutor-who { flex: 1 1 calc(100% - 56px); }
    .tutor-head #classSelect { min-width: 0 !important; flex: 1 1 96px; max-width: 100%; }
    .tutor-head #newChatBtn { padding-inline: 10px; }
    .msg { max-width: 92%; }
  }
</style>

<script src="/api/education/lm-voice.js"></script>
<script src="/api/education/mascot.js?v=4"></script>
<script>
// The renderer is an optional browser bundle. The escaped legacy renderer remains the
// availability path when an older installed core has not published it yet.
var tutorResponseRendererReady = import('/dist/response-renderer.js').catch(function () { return null; });

/**
 * Tutor Chat — client-side chat interface.
 *
 * Talks to the class-tutor bot through POST /api/education/tutor-chat (the caller's identity
 * comes from the session; no student id is kept on this page). Read-aloud goes through the
 * shared neural voice helper (lm-voice.js) with the browser voice as its own fallback.
 */

var params = new URLSearchParams(window.location.search);
var activeClassId = params.get('classId') || '';
var activeThreadId = '';
var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
var tutorClasses = [];
/** The composer hint: the full sentence on a wide screen, a short one where four buttons share the row with the box. */
function composerHint() {
  return window.matchMedia && window.matchMedia('(max-width: 640px)').matches ? 'Ask me anything…' : 'Ask me anything, or snap a photo of your worksheet';
}
var ttsEnabled = false;
var isProcessing = false;
// The photo/document the student attached but hasn't sent yet:
// { base64, mediaType, dataUrl, name, isImage }.
var pendingAttachment = null;

/** Short, non-blocking notice (never an alert for a non-destructive message). */
function notice(text) { if (window.LM && window.LM.toast) window.LM.toast(text); }

/**
 * @description Whether the chosen class has materials the tutor's reply can ground on. Mirrors the reply's own
 * rule (src-routes/education-tutor-routes.ts searchAuthorizedGrounding: the caller's own uploads, or rows with
 * share_status 'approved'), read through the two list routes the class page already uses.
 * @param {string} classId The class to check.
 * @returns {Promise<boolean>} True when at least one own or approved material exists; false on any refusal.
 */
function classHasMaterials(classId) {
  var base = '/api/education/classes/' + encodeURIComponent(classId);
  function count(path) {
    return fetch(base + path).then(function (r) { return r.ok ? r.json() : { materials: [] }; })
      .then(function (d) { return (d && Array.isArray(d.materials)) ? d.materials.length : 0; })
      .catch(function () { return 0; });
  }
  return Promise.all([count('/materials'), count('/shared-materials')]).then(function (n) { return n[0] + n[1] > 0; });
}

var groundCheck = 0;
/** @description Choose the class the tutor grounds on and say truthfully whether it has materials. @param {string} classId The class id, or '' for all classes. @returns {Promise<void>} */
function selectTutorClass(classId, userChanged) {
  var prev = activeClassId;
  activeClassId = classId || '';
  if (userChanged && prev !== activeClassId) activeThreadId = '';
  var el = document.getElementById('tutorClass');
  var cls = (tutorClasses || []).find(function (c) { return c.class_id === activeClassId; });
  if (!cls) { el.textContent = 'Any of your classes'; return Promise.resolve(); }
  var label = cls.name + (cls.subject ? ' · ' + cls.subject : '') + ' · ';
  el.textContent = label;
  var mine = ++groundCheck;
  return classHasMaterials(cls.class_id).then(function (has) {
    if (mine !== groundCheck) return;
    var badge = document.createElement('span');
    badge.className = has ? 'ground-on' : 'ground-off';
    badge.id = 'groundBadge';
    badge.textContent = has ? 'Textbook grounded' : 'No class materials yet';
    el.textContent = label;
    el.appendChild(badge);
  });
}

/** Name the class this conversation is about — the real one, or all of them when the floating tutor opens without a class. */
async function labelClass() {
  var el = document.getElementById('tutorClass');
  var sel = document.getElementById('classSelect');
  try {
    var resp = await fetch('/api/education/classes');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    var data = await resp.json();
    tutorClasses = data.classes || [];
    if (sel) {
      sel.innerHTML = '<option value="">All classes</option>' + tutorClasses.map(function (c) {
        return '<option value="' + escapeHtml(c.class_id) + '">' + escapeHtml(c.name) + (c.subject ? ' (' + escapeHtml(c.subject) + ')' : '') + '</option>';
      }).join('');
    }
    if (!activeClassId && tutorClasses.length > 0) {
      activeClassId = tutorClasses[0].class_id;
    }
    if (sel) sel.value = activeClassId;
    selectTutorClass(activeClassId);
  } catch (_e) {
    el.textContent = activeClassId ? '—' : 'Any of your classes';
  }
}

/** Read a chosen photo/document, stash it, and show a preview chip. */
function handleAttach(event) {
  var file = event.target.files && event.target.files[0];
  event.target.value = ''; // allow re-selecting the same file
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { notice('That file is a bit big — please pick one under 8 MB.'); return; }
  var reader = new FileReader();
  reader.onload = function () {
    var dataUrl = String(reader.result || '');
    var comma = dataUrl.indexOf(',');
    pendingAttachment = {
      base64: comma >= 0 ? dataUrl.slice(comma + 1) : '',
      mediaType: file.type || 'application/octet-stream',
      dataUrl: dataUrl,
      name: file.name || 'attachment',
      isImage: /^image\//.test(file.type),
    };
    renderAttachPreview();
  };
  reader.onerror = function () { notice('Sorry, I could not read that file.'); };
  reader.readAsDataURL(file);
}

/** Draw (or hide) the pending-attachment chip above the composer. */
function renderAttachPreview() {
  var el = document.getElementById('attachPreview');
  if (!pendingAttachment) { el.classList.add('hide'); el.innerHTML = ''; return; }
  var thumb = pendingAttachment.isImage
    ? '<img src="' + pendingAttachment.dataUrl + '" alt="" />'
    : '<span aria-hidden="true">📄</span>';
  el.innerHTML = '<span class="attach-chip">' + thumb +
    '<span class="attach-name">' + escapeHtml(pendingAttachment.name) + '</span>' +
    '<button type="button" class="lm-btn lm-btn-quiet lm-btn-icon" onclick="clearAttachment()" title="Remove" aria-label="Remove attachment">&times;</button></span>';
  el.classList.remove('hide');
}

/** Drop the pending attachment. */
function clearAttachment() { pendingAttachment = null; renderAttachPreview(); }

// ── Live camera capture (real getUserMedia, not a file picker) ──
var camStream = null;
async function openCamera() {
  var modal = document.getElementById('camModal');
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no camera api');
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    document.getElementById('camVideo').srcObject = camStream;
    modal.classList.add('is-open');
  } catch (e) {
    // No camera / permission denied → fall back to the OS picker (which can still open a camera on mobile).
    document.getElementById('cameraInput').click();
  }
}
function closeCamera() {
  document.getElementById('camModal').classList.remove('is-open');
  if (camStream) { try { camStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} camStream = null; }
}
function capturePhoto() {
  var v = document.getElementById('camVideo');
  var c = document.createElement('canvas');
  c.width = v.videoWidth || 640; c.height = v.videoHeight || 480;
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  var dataUrl = c.toDataURL('image/jpeg', 0.85);
  var comma = dataUrl.indexOf(',');
  pendingAttachment = { base64: comma >= 0 ? dataUrl.slice(comma + 1) : '', mediaType: 'image/jpeg', dataUrl: dataUrl, name: 'photo.jpg', isImage: true };
  renderAttachPreview();
  closeCamera();
}

/** Toggle read-aloud for every reply. */
function toggleTTS() {
  ttsEnabled = !ttsEnabled;
  var btn = document.getElementById('ttsToggle');
  btn.textContent = ttsEnabled ? '🔊 Read replies aloud: On' : '🔈 Read replies aloud: Off';
  btn.setAttribute('aria-pressed', ttsEnabled ? 'true' : 'false');
  btn.classList.toggle('is-on', ttsEnabled);
}

/** Send a message from the input field. */
function sendFromInput() {
  var input = document.getElementById('input');
  var text = input.value.trim();
  // A photo on its own is a valid message ("here's my worksheet") — only block
  // when there's neither text nor an attachment.
  if ((!text && !pendingAttachment) || isProcessing) return;
  input.value = '';
  input.style.height = 'auto';
  sendMessage(text);
}

/** Handle Enter key (Shift+Enter for newline). */
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendFromInput();
  }
  // Auto-resize textarea
  setTimeout(function() {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
  }, 0);
}

/** @description Show the student's turn (with the photo thumbnail, if any) and leave the welcome state. @param {string} text The question. @param {object|null} attachment The photo/document being sent. @returns {void} */
function showStudentTurn(text, attachment) {
  var welcome = document.getElementById('welcome');
  if (welcome) welcome.classList.add('hide');
  var chips = document.getElementById('suggestions');
  if (chips) chips.classList.add('hide');
  var studentId = addMessage(text || (attachment ? "Here's my work — can you help?" : ''), 'student');
  if (attachment && attachment.isImage) {
    var sEl = document.getElementById(studentId);
    if (sEl) { var im = document.createElement('img'); im.className = 'msg-photo'; im.src = attachment.dataUrl; sEl.appendChild(im); }
  }
}

/** @description POST one tutor turn. A photo/doc rides along so the tutor can read handwritten work (vision) per the guardrails. @param {string} text The question. @param {object|null} attachment The attachment. @returns {Promise<object>} The tutor's answer. */
async function postTutorTurn(text, attachment) {
  var payload = { message: text, classId: activeClassId || params.get('classId') || '' };
  if (activeThreadId) payload.threadId = activeThreadId;
  if (attachment && attachment.base64) {
    payload.imageData = attachment.base64;
    payload.imageMediaType = attachment.mediaType;
  }
  var resp = await fetch('/api/education/tutor-chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (!resp.ok) throw new Error('Tutor unavailable');
  return resp.json();
}

/** Send a message to the tutor bot. */
async function sendMessage(text) {
  if (isProcessing) return;
  isProcessing = true;
  var generation = chatGeneration;

  // Take ownership of any pending attachment, then clear the composer chip.
  var attachment = pendingAttachment;
  pendingAttachment = null;
  renderAttachPreview();
  showStudentTurn(text, attachment);

  var typingId = addMessage('<span class="dots"><span></span><span></span><span></span></span> Thinking…', 'typing');
  document.getElementById('sendBtn').disabled = true;

  try {
    var data = await postTutorTurn(text, attachment);
    removeMessage(typingId);
    // A reply to a conversation the student already cleared with New chat is dropped.
    if (generation !== chatGeneration) return;
    if (data.threadId) activeThreadId = String(data.threadId);
    var reply = data.response || data.message || 'Sorry, I had trouble with that. Try again?';
    var tutorMsgId = addMessage(reply, 'tutor');
    if (data.grounded && Array.isArray(data.sources) && data.sources.length) {
      appendGroundingBadge(tutorMsgId, data.sources);
    }
    if (ttsEnabled) speakText(reply);
  } catch (err) {
    removeMessage(typingId);
    if (generation === chatGeneration) addMessage('Sorry, I couldn\'t connect. Please try again in a moment.', 'tutor');
  } finally {
    isProcessing = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

var chatGeneration = 0;
/** @description Start a fresh conversation: clear the thread, any pending photo, the companion check-ins and speech, and show the welcome and starter chips again. @returns {void} */
function newChat() {
  chatGeneration++;
  activeThreadId = '';
  document.querySelectorAll('#messages .msg').forEach(function (m) { m.remove(); });
  var welcome = document.getElementById('welcome');
  if (welcome) welcome.classList.remove('hide');
  var chips = document.getElementById('suggestions');
  if (chips) chips.classList.remove('hide');
  clearAttachment();
  if (companionTimer) { clearInterval(companionTimer); companionTimer = null; }
  try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (_e) { /* no speech engine */ }
  var input = document.getElementById('input');
  input.value = ''; input.style.height = 'auto'; input.focus();
}

function formatHistoryDate(iso) {
  if (!iso) return 'Saved';
  var d = new Date(iso);
  return isNaN(d.getTime()) ? 'Saved' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function openHistoryDrawer() {
  var cls = (tutorClasses || []).find(function (c) { return c.class_id === activeClassId; });
  document.getElementById('historySub').textContent = cls
    ? 'Saved conversations for ' + cls.name + ', newest first.'
    : 'Your saved tutoring conversations, newest first.';
  document.getElementById('historyStatus').textContent = '';
  document.getElementById('historyDrawer').classList.add('is-open');
  loadHistoryThreads();
}
function closeHistoryDrawer() {
  document.getElementById('historyDrawer').classList.remove('is-open');
}
async function loadHistoryThreads() {
  var list = document.getElementById('historyList');
  list.innerHTML = '<div class="lm-loading">Loading saved conversations…</div>';
  var payload = { action: 'list' };
  if (activeClassId && UUID_RE.test(activeClassId)) payload.classId = activeClassId;
  try {
    var resp = await fetch('/api/education/tutor-chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
    });
    var data = await resp.json().catch(function () { return {}; });
    if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
    var threads = data.threads || [];
    if (!threads.length) {
      list.innerHTML = '<div class="lm-empty"><strong>No saved conversations yet.</strong>Ask a question and your thread is saved automatically for you.</div>';
      return;
    }
    list.innerHTML = threads.map(function (t) {
      var q = String(t.firstQuestion || t.title || 'Homework question');
      return '<div class="history-row" data-thread-row="' + escapeHtml(t.threadId) + '">' +
        '<button type="button" class="history-open" data-thread-open="' + escapeHtml(t.threadId) + '">' +
          '<strong>' + escapeHtml(q) + '</strong>' +
          '<small>' + escapeHtml(formatHistoryDate(t.updatedAt || t.createdAt)) + '</small>' +
        '</button>' +
        '<button type="button" class="lm-btn lm-btn-ghost lm-btn-sm" data-thread-delete="' + escapeHtml(t.threadId) + '" aria-label="Delete conversation ' + escapeHtml(q) + '">Delete</button>' +
      '</div>';
    }).join('');
  } catch (err) {
    list.innerHTML = '<div class="lm-callout is-warning">' + escapeHtml(err.message) + '</div>';
  }
}
async function restoreHistoryThread(threadId) {
  var status = document.getElementById('historyStatus');
  status.className = 'lm-status lm-mb-sm'; status.textContent = 'Opening conversation…';
  try {
    var resp = await fetch('/api/education/tutor-chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'get', threadId: threadId }),
    });
    var data = await resp.json().catch(function () { return {}; });
    if (!resp.ok || !data.thread) throw new Error(data.error || 'Could not load conversation.');
    var t = data.thread;
    chatGeneration++;
    activeThreadId = String(t.threadId);
    if (t.classId && t.classId !== activeClassId) {
      var sel = document.getElementById('classSelect');
      if (sel) sel.value = t.classId;
      selectTutorClass(t.classId, false);
    }
    document.querySelectorAll('#messages .msg').forEach(function (m) { m.remove(); });
    var msgs = Array.isArray(t.messages) ? t.messages : [];
    document.getElementById('welcome').classList.toggle('hide', msgs.length > 0);
    document.getElementById('suggestions').classList.toggle('hide', msgs.length > 0);
    msgs.forEach(function (m) {
      var kind = m.role === 'assistant' ? 'tutor' : 'student';
      var id = addMessage(String(m.content || ''), kind);
      if (kind === 'tutor' && Array.isArray(m.sources) && m.sources.length) appendGroundingBadge(id, m.sources);
    });
    closeHistoryDrawer();
    document.getElementById('input').focus();
  } catch (err) {
    status.className = 'lm-status lm-mb-sm is-error'; status.textContent = err.message;
  }
}
async function deleteHistoryThread(threadId) {
  var status = document.getElementById('historyStatus');
  try {
    var resp = await fetch('/api/education/tutor-chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'delete', threadId: threadId }),
    });
    var data = await resp.json().catch(function () { return {}; });
    if (!resp.ok) throw new Error(data.error || 'Could not delete conversation.');
    if (activeThreadId === threadId) newChat();
    status.className = 'lm-status lm-mb-sm is-success'; status.textContent = 'Conversation deleted.';
    await loadHistoryThreads();
  } catch (err) {
    status.className = 'lm-status lm-mb-sm is-error'; status.textContent = err.message;
  }
}

/** @description Open or close the phone's + sheet (Camera, File). @param {boolean} [open] Force a state; toggles when omitted. @returns {void} */
function toggleAttachSheet(open) {
  var sheet = document.getElementById('attachSheet'), plus = document.getElementById('plusBtn');
  var show = typeof open === 'boolean' ? open : sheet.hidden;
  sheet.hidden = !show;
  plus.setAttribute('aria-expanded', show ? 'true' : 'false');
}

/** Add a message to the chat. Returns the message element ID. */
function addMessage(text, type) {
  var container = document.getElementById('messages');
  var div = document.createElement('div');
  var id = 'msg-' + Date.now() + '-' + Math.random().toString(36).slice(2,6);
  div.id = id;
  div.className = 'msg ' + type;

  if (type === 'tutor') {
    // Bind the read-aloud handler in JS (closure over the real text) instead of inlining the
    // reply into an onclick string — that avoids any attribute-injection from echoed content.
    div.innerHTML = '<div class="tutor-content">' + mdToHtml(escapeHtml(text)) + '</div>'
      + '<button type="button" class="lm-read-btn read-btn">🔈 Read aloud</button>';
    var rb = div.querySelector('.read-btn'); if (rb) rb.addEventListener('click', function () { speakText(text); });
    upgradeTutorMessage(div, text);
  } else if (type === 'typing') {
    // The typing indicator is trusted, hardcoded markup (the animated dots). It must
    // render as HTML — using textContent here was the bug that printed the literal
    // "<span class="dots">…" code instead of animating.
    div.innerHTML = text;
  } else {
    div.textContent = text;
  }

  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return id;
}

/** Upgrade one tutor reply in place once the shared renderer is available.
 *  The capability list deliberately excludes outbound/action components: this child app can
 *  display prose, code, diagrams, tables and bounded documents, but never invent delivery UI.
 *  The existing grounding badge is appended to the message, outside this replaceable region. */
function upgradeTutorMessage(div, text) {
  tutorResponseRendererReady.then(function (renderer) {
    if (!renderer || typeof renderer.renderResponseHtml !== 'function') return;
    return renderer.renderResponseHtml(String(text || ''), {
      capabilities: ['markdown', 'code', 'mermaid', 'oshal:chart', 'oshal:table', 'oshal:doc'],
    }).then(function (result) {
      var content = div.querySelector('.tutor-content');
      if (!content || !result || !result.html) return;
      content.innerHTML = result.html;
    });
  }).catch(function () { /* the escaped tutor renderer remains visible */ });
}

/** @description Split one pipe-table row into its cells. @param {string} line An escaped row like "| a | b |". @returns {string[]} The trimmed cells. */
function pipeCells(line) {
  return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); });
}

/** @description True for a Markdown table's separator row ("| --- | :---: |"). @param {string} line One line. @returns {boolean} */
function isPipeSeparator(line) {
  return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(line || '');
}

/**
 * @description Read a Markdown pipe table starting at lines[i] (a header row followed by a separator row).
 * Cells are already HTML-escaped, so they are inserted as they are.
 * @param {string[]} lines The reply's lines.
 * @param {number} i Index of the header row.
 * @returns {{html:string,next:number}|null} The table and the index after it, or null when no table starts here.
 */
function pipeTable(lines, i) {
  if (!/^\s*\|.*\|\s*$/.test(lines[i] || '') || !isPipeSeparator(lines[i + 1])) return null;
  var head = pipeCells(lines[i]);
  var rows = [], j = i + 2;
  for (; j < lines.length && /^\s*\|.*\|\s*$/.test(lines[j]); j++) rows.push(pipeCells(lines[j]));
  var html = '<div class="msg-table"><table><thead><tr>' + head.map(function (c) { return '<th scope="col">' + c + '</th>'; }).join('') + '</tr></thead><tbody>'
    + rows.map(function (r) { return '<tr>' + head.map(function (_h, k) { return '<td>' + (r[k] || '') + '</td>'; }).join('') + '</tr>'; }).join('')
    + '</tbody></table></div>';
  return { html: html, next: j };
}

/** Minimal, safe markdown -> HTML for tutor replies. Input MUST already be HTML-escaped.
 *  Handles **bold**, `code`, bullet/numbered lists, pipe tables and line breaks (ADHD-friendly formatting). */
function mdToHtml(s) {
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
  var lines = s.split('\n'), out = [], inUl = false;
  function closeUl() { if (inUl) { out.push('</ul>'); inUl = false; } }
  for (var i = 0; i < lines.length; i++) {
    var ln = lines[i];
    var table = pipeTable(lines, i);
    if (table) { closeUl(); out.push(table.html); i = table.next - 1; continue; }
    var m = ln.match(/^\s*(?:[-•]|\d+\.)\s+(.*)$/);
    if (m) {
      if (!inUl) { out.push('<ul>'); inUl = true; }
      out.push('<li>' + m[1] + '</li>');
    } else if (ln.trim() === '') {
      closeUl();
      if (out.length && out[out.length - 1] !== '<br>') out.push('<br>');
    } else {
      closeUl();
      out.push(ln + '<br>');
    }
  }
  closeUl();
  return out.join('');
}

/** Append a "grounded in your textbook" badge + collapsible source snippets under a tutor reply.
 *  Driven by the tutor-chat API's grounded/sources fields (RAG over the class's own materials).
 *  Plain text and a <details> only — never a link, form or input inside a reply. */
function appendGroundingBadge(msgId, sources) {
  var el = document.getElementById(msgId);
  if (!el) return;
  var items = sources.map(function (s) {
    return '<li><span class="src-n">[' + escapeHtml(String(s.n)) + ']</span> ' + escapeHtml(String(s.text || '').slice(0, 220)) + '…</li>';
  }).join('');
  var wrap = document.createElement('div');
  wrap.className = 'grounding';
  wrap.innerHTML =
    '<span class="lm-pill is-success">📖 Grounded in your class textbook</span>'
    + '<details><summary>' + sources.length + ' source' + (sources.length > 1 ? 's' : '') + ' from your materials</summary>'
    + '<ul>' + items + '</ul></details>';
  el.appendChild(wrap);
  var c = document.getElementById('messages');
  if (c) c.scrollTop = c.scrollHeight;
}

/** Remove a message by ID. */
function removeMessage(id) {
  var el = document.getElementById(id);
  if (el) el.remove();
}

/** Speak text with the shared neural voice; the browser voice is the fallback. */
function speakText(text) {
  var clean = (text || '').replace(/<[^>]*>/g, '');
  if (window.lmSpeak) { window.lmSpeak(clean); return; } // neural voice + fallback
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    var utterance = new SpeechSynthesisUtterance(clean);
    utterance.rate = 0.9;
    utterance.pitch = 1.0;
    window.speechSynthesis.speak(utterance);
  }
}

/** HTML escape. */
function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

/** Voice input — browser speech recognition. */
var recognition = null;
var isListening = false;

function toggleVoiceInput() {
  if (isListening) {
    stopListening();
    return;
  }

  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    notice('Voice input is not supported in this browser. Try Chrome or Edge.');
    return;
  }

  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onstart = function() {
    isListening = true;
    document.getElementById('micBtn').classList.add('listening');
    document.getElementById('input').placeholder = 'Listening…';
  };

  recognition.onresult = function(event) {
    var transcript = '';
    for (var i = 0; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    document.getElementById('input').value = transcript;
  };

  recognition.onend = function() {
    stopListening();
    // Auto-send if we got text
    var input = document.getElementById('input');
    if (input.value.trim().length > 0) {
      sendFromInput();
    }
  };

  recognition.onerror = function(event) {
    stopListening();
    if (event.error !== 'no-speech') {
      console.warn('Speech recognition error:', event.error);
    }
  };

  recognition.start();
}

function stopListening() {
  isListening = false;
  document.getElementById('micBtn').classList.remove('listening');
  document.getElementById('input').placeholder = composerHint();
  if (recognition) { try { recognition.stop(); } catch (e) {} }
}

/** Study companion mode — tutor checks in every 10 minutes. */
var companionTimer = null;
var companionMinutes = 0;

function startCompanionMode() {
  sendMessage('I am starting my homework now. Can you study with me? Check in on me every few minutes to see how I am doing.');

  companionMinutes = 0;
  if (companionTimer) clearInterval(companionTimer);

  companionTimer = setInterval(function() {
    companionMinutes += 10;
    var checkIns = [
      'How is it going? Need help with anything?',
      'Still working? You are doing great! Let me know if you get stuck.',
      'Check-in! How are you feeling about this assignment?',
      'You have been at it for ' + companionMinutes + ' minutes. Want to take a quick stretch break?',
      'Nice focus! Remember, I am here if you need me.',
    ];
    var msg = checkIns[Math.floor(Math.random() * checkIns.length)];
    addMessage(msg, 'tutor');
    // Use the shared neural voice (lmSpeak) instead of the robotic browser voice,
    // and let it cancel any prior utterance so check-ins don't pile up.
    if (ttsEnabled) speakText(msg);
  }, 10 * 60 * 1000); // Every 10 minutes
}

// Suggestion chips: bound here so the prompts never live inside onclick attributes.
document.querySelectorAll('.suggestion').forEach(function (btn) {
  btn.addEventListener('click', function () {
    if (btn.dataset.action === 'companion') startCompanionMode();
    else if (btn.dataset.say) sendMessage(btn.dataset.say);
  });
});
document.getElementById('ttsToggle').addEventListener('click', toggleTTS);
document.getElementById('historyBtn').addEventListener('click', openHistoryDrawer);
document.getElementById('historyCloseBtn').addEventListener('click', closeHistoryDrawer);
document.getElementById('historyDrawer').addEventListener('click', function (e) {
  if (e.target.id === 'historyDrawer') { closeHistoryDrawer(); return; }
  var openBtn = e.target.closest('[data-thread-open]');
  if (openBtn) { restoreHistoryThread(openBtn.dataset.threadOpen); return; }
  var delBtn = e.target.closest('[data-thread-delete]');
  if (delBtn) deleteHistoryThread(delBtn.dataset.threadDelete);
});
document.getElementById('newChatBtn').addEventListener('click', newChat);
document.getElementById('plusBtn').addEventListener('click', function (e) { e.stopPropagation(); toggleAttachSheet(); });
document.querySelectorAll('#attachSheet [data-attach]').forEach(function (b) {
  b.addEventListener('click', function () {
    toggleAttachSheet(false);
    if (b.dataset.attach === 'camera') openCamera(); else document.getElementById('fileInput').click();
  });
});
document.addEventListener('click', function (e) {
  if (!e.target.closest('#attachSheet')) toggleAttachSheet(false);
  var more = document.getElementById('tutorMore');
  if (more.open && !e.target.closest('#tutorMore')) more.open = false;
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  toggleAttachSheet(false);
  closeHistoryDrawer();
  document.getElementById('tutorMore').open = false;
});
document.getElementById('input').placeholder = composerHint();
labelClass();

// Auto-prefill from URL param (used by "Break it down" in the class view and the formula lab).
(function() {
  var prefill = params.get('prefill');
  if (prefill) {
    setTimeout(function() { sendMessage(prefill); }, 500);
  }
})();

// ADR-139 receive: a "Send to… → Ask the Tutor about it" dispatch lands with a one-shot
// handle ref in our url (the dashboard forwards it here). The shared image/PDF becomes the
// pending attachment — exactly as if the student had picked it — so the next question is
// "here's my homework". Expired/foreign refs 404 and the chat opens normally.
(function () {
  var ref = params.get('artifact');
  if (!ref || !/^art_[A-Za-z0-9_-]{8,64}$/.test(ref)) return;
  fetch('/api/artifacts/handles/' + encodeURIComponent(ref))
    .then(function (r) { if (!r.ok) throw new Error('expired'); return r.json(); })
    .then(function (meta) {
      return fetch('/api/artifacts/handles/' + encodeURIComponent(ref) + '/content')
        .then(function (r) { if (!r.ok) throw new Error('expired'); return r.blob(); })
        .then(function (blob) {
          if (blob.size > 8 * 1024 * 1024) return; // the tutor's own attach ceiling
          var reader = new FileReader();
          reader.onload = function () {
            var dataUrl = String(reader.result || '');
            var comma = dataUrl.indexOf(',');
            pendingAttachment = {
              base64: comma >= 0 ? dataUrl.slice(comma + 1) : '',
              mediaType: meta.type || blob.type || 'application/octet-stream',
              dataUrl: dataUrl,
              name: meta.name || 'shared-file',
              isImage: /^image\//.test(meta.type || blob.type || ''),
            };
            renderAttachPreview();
          };
          reader.readAsDataURL(blob);
        });
    })
    .catch(function () { /* expired — normal chat state */ });
})();
