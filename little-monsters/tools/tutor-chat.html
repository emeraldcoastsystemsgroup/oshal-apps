<script>
// Sync iframe theme to parent cockpit's data-theme. Storage events don't fire
// in the writing window, so a MutationObserver on the parent <html> is the
// reliable path for live same-tab updates when the operator cycles themes.
(function(){
  function applyTheme(n){
    if(!n)return;
    document.documentElement.setAttribute('data-theme',n);
    var href='/cockpit/css/themes/'+n+'.css';
    var link=document.querySelector('link[data-lm-theme-link="1"]');
    if(link){if(link.getAttribute('href')!==href)link.setAttribute('href',href);return;}
    link=document.createElement('link');link.rel='stylesheet';link.href=href;
    link.setAttribute('data-lm-theme-link','1');document.head.appendChild(link);
  }
  function initial(){
    try{if(window.parent&&window.parent!==window){var p=window.parent.document.documentElement.getAttribute('data-theme');if(p)return p;}}catch(_e){}
    try{var s=window.localStorage.getItem('cockpit-theme');if(s)return s;}catch(_e){}
    return 'midnight';
  }
  applyTheme(initial());
  try{if(window.parent&&window.parent!==window){
    var ph=window.parent.document.documentElement;
    new MutationObserver(function(ms){for(var i=0;i<ms.length;i++){if(ms[i].attributeName==='data-theme'){var t=ph.getAttribute('data-theme');if(t)applyTheme(t);}}}).observe(ph,{attributes:true,attributeFilter:['data-theme']});
  }}catch(_e){}
})();
</script>

<script>
/**
 * Tutor Chat — Client-side chat interface.
 *
 * Connects to the class-tutor bot via SSE streaming for real-time responses.
 * Supports TTS read-aloud via the read-aloud tool / browser speechSynthesis.
 */

var ttsEnabled = false;
var isProcessing = false;
// The photo/document the student attached but hasn't sent yet:
// { base64, mediaType, dataUrl, name, isImage }.
var pendingAttachment = null;

/** Read a chosen photo/document, stash it, and show a preview chip. */
function handleAttach(event) {
  var file = event.target.files && event.target.files[0];
  event.target.value = ''; // allow re-selecting the same file
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { alert('That file is a bit big — please pick one under 8 MB.'); return; }
  var reader = new FileReader();
  reader.onload = function () {
    var dataUrl = String(reader.result || '');
    var comma = dataUrl.indexOf(',');
    pendingAttachment = {
      base64: comma >= 0 ? dataUrl.slice(comma + 1) : '',
      mediaType: file.type || 'application/octet-stream',
      dataUrl: dataUrl,
      name: file.name || 'attachment',
      isImage: /^image\//.test(file.type),
    };
    renderAttachPreview();
  };
  reader.onerror = function () { alert('Sorry, I could not read that file.'); };
  reader.readAsDataURL(file);
}

/** Draw (or hide) the pending-attachment chip above the input. */
function renderAttachPreview() {
  var el = document.getElementById('attachPreview');
  if (!pendingAttachment) { el.style.display = 'none'; el.innerHTML = ''; return; }
  var thumb = pendingAttachment.isImage
    ? '<img src="' + pendingAttachment.dataUrl + '" alt="attachment" />'
    : '<span class="codicon codicon-file"></span>';
  el.innerHTML = '<span class="attach-chip">' + thumb +
    '<span>' + escapeHtml(pendingAttachment.name) + '</span>' +
    '<button class="attach-x" onclick="clearAttachment()" title="Remove">&times;</button></span>';
  el.style.display = 'flex';
}

/** Drop the pending attachment. */
function clearAttachment() { pendingAttachment = null; renderAttachPreview(); }

// ── Live camera capture (real getUserMedia, not a file picker) ──
var camStream = null;
async function openCamera() {
  var modal = document.getElementById('camModal');
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no camera api');
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    document.getElementById('camVideo').srcObject = camStream;
    modal.classList.add('open');
  } catch (e) {
    // No camera / permission denied → fall back to the OS picker (which can still open a camera on mobile).
    document.getElementById('cameraInput').click();
  }
}
function closeCamera() {
  document.getElementById('camModal').classList.remove('open');
  if (camStream) { try { camStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} camStream = null; }
}
function capturePhoto() {
  var v = document.getElementById('camVideo');
  var c = document.createElement('canvas');
  c.width = v.videoWidth || 640; c.height = v.videoHeight || 480;
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  var dataUrl = c.toDataURL('image/jpeg', 0.85);
  var comma = dataUrl.indexOf(',');
  pendingAttachment = { base64: comma >= 0 ? dataUrl.slice(comma + 1) : '', mediaType: 'image/jpeg', dataUrl: dataUrl, name: 'photo.jpg', isImage: true };
  renderAttachPreview();
  closeCamera();
}

// Auto-prefill from URL param (used by "Break it down" button in class view)
(function() {
  var params = new URLSearchParams(window.location.search);
  var prefill = params.get('prefill');
  if (prefill) {
    setTimeout(function() { sendMessage(prefill); }, 500);
  }
})();

/** Toggle text-to-speech. */
function toggleTTS() {
  ttsEnabled = !ttsEnabled;
  var btn = document.getElementById('ttsToggle');
  btn.textContent = ttsEnabled ? 'TTS On' : 'TTS Off';
  btn.classList.toggle('active', ttsEnabled);
}

/** Send a message from the input field. */
function sendFromInput() {
  var input = document.getElementById('input');
  var text = input.value.trim();
  // A photo on its own is a valid message ("here's my worksheet") — only block
  // when there's neither text nor an attachment.
  if ((!text && !pendingAttachment) || isProcessing) return;
  input.value = '';
  input.style.height = 'auto';
  sendMessage(text);
}

/** Handle Enter key (Shift+Enter for newline). */
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendFromInput();
  }
  // Auto-resize textarea
  setTimeout(function() {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
  }, 0);
}

/** Send a message to the tutor bot. */
async function sendMessage(text) {
  if (isProcessing) return;
  isProcessing = true;

  // Hide welcome screen
  var welcome = document.getElementById('welcome');
  if (welcome) welcome.style.display = 'none';

  // Take ownership of any pending attachment, then clear the composer chip.
  var attachment = pendingAttachment;
  pendingAttachment = null;
  renderAttachPreview();

  // Add student message (with the photo thumbnail, if any)
  var studentId = addMessage(text || (attachment ? "Here's my work — can you help?" : ''), 'student');
  if (attachment && attachment.isImage) {
    var sEl = document.getElementById(studentId);
    if (sEl) { var im = document.createElement('img'); im.className = 'msg-photo'; im.src = attachment.dataUrl; sEl.appendChild(im); }
  }

  // Show typing indicator
  var typingId = addMessage('<span class="dots"><span></span><span></span><span></span></span> Thinking...', 'typing');

  document.getElementById('sendBtn').disabled = true;

  try {
    // POST to tutor chat endpoint. When a photo/doc is attached, include it so the
    // tutor can analyze the student's handwritten work (vision) per the guardrails.
    var payload = { message: text, classId: new URLSearchParams(window.location.search).get('classId') || '' };
    if (attachment && attachment.base64) {
      payload.imageData = attachment.base64;
      payload.imageMediaType = attachment.mediaType;
    }
    var resp = await fetch('/api/education/tutor-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    // Remove typing indicator
    removeMessage(typingId);

    if (!resp.ok) throw new Error('Tutor unavailable');

    var data = await resp.json();
    var reply = data.response || data.message || 'Sorry, I had trouble with that. Try again?';

    var tutorMsgId = addMessage(reply, 'tutor');
    if (data.grounded && Array.isArray(data.sources) && data.sources.length) {
      appendGroundingBadge(tutorMsgId, data.sources);
    }

    // TTS if enabled
    if (ttsEnabled) {
      speakText(reply);
    }
  } catch (err) {
    removeMessage(typingId);
    addMessage('Sorry, I couldn\'t connect. Please try again in a moment.', 'tutor');
  }

  isProcessing = false;
  document.getElementById('sendBtn').disabled = false;
}

/** Add a message to the chat. Returns the message element ID. */
function addMessage(text, type) {
  var container = document.getElementById('messages');
  var div = document.createElement('div');
  var id = 'msg-' + Date.now() + '-' + Math.random().toString(36).slice(2,6);
  div.id = id;
  div.className = 'msg ' + type;

  if (type === 'tutor') {
    // Bind the read-aloud handler in JS (closure over the real text) instead of inlining the
    // reply into an onclick string — that avoids any attribute-injection from echoed content.
    div.innerHTML = mdToHtml(escapeHtml(text)) + '<button class="read-btn">Read aloud</button>';
    var rb = div.querySelector('.read-btn'); if (rb) rb.addEventListener('click', function () { speakText(text); });
  } else if (type === 'typing') {
    // The typing indicator is trusted, hardcoded markup (the animated dots). It must
    // render as HTML — using textContent here was the bug that printed the literal
    // "<span class="dots">…" code instead of animating.
    div.innerHTML = text;
  } else {
    div.textContent = text;
  }

  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return id;
}

/** Minimal, safe markdown -> HTML for tutor replies. Input MUST already be HTML-escaped.
 *  Handles **bold**, `code`, bullet/numbered lists, and line breaks (ADHD-friendly formatting). */
function mdToHtml(s) {
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
  var lines = s.split('\n'), out = [], inUl = false;
  function closeUl() { if (inUl) { out.push('</ul>'); inUl = false; } }
  for (var i = 0; i < lines.length; i++) {
    var ln = lines[i];
    var m = ln.match(/^\s*(?:[-•]|\d+\.)\s+(.*)$/);
    if (m) {
      if (!inUl) { out.push('<ul style="margin:6px 0;padding-left:20px;line-height:1.5">'); inUl = true; }
      out.push('<li>' + m[1] + '</li>');
    } else if (ln.trim() === '') {
      closeUl();
      if (out.length && out[out.length - 1] !== '<br>') out.push('<br>');
    } else {
      closeUl();
      out.push(ln + '<br>');
    }
  }
  closeUl();
  return out.join('');
}

/** Append a "grounded in your textbook" badge + collapsible source snippets under a tutor reply.
 *  Driven by the tutor-chat API's grounded/sources fields (RAG over the class's own materials). */
function appendGroundingBadge(msgId, sources) {
  var el = document.getElementById(msgId);
  if (!el) return;
  var items = sources.map(function (s) {
    return '<li style="margin-bottom:4px"><span style="color:#5fdcc0;font-weight:700">[' + s.n + ']</span> '
      + escapeHtml(String(s.text || '').slice(0, 220)) + '…</li>';
  }).join('');
  var wrap = document.createElement('div');
  wrap.style.cssText = 'margin-top:10px;display:flex;flex-direction:column;gap:6px';
  wrap.innerHTML =
    '<div style="display:inline-flex;align-items:center;gap:6px;align-self:flex-start;'
    + 'background:rgba(94,220,192,.14);color:#5fdcc0;border:1px solid rgba(94,220,192,.4);'
    + 'border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600">'
    + '<span class="codicon codicon-book"></span> Grounded in your class textbook</div>'
    + '<details style="font-size:12px;color:#9fb3c8"><summary style="cursor:pointer;user-select:none">'
    + sources.length + ' source' + (sources.length > 1 ? 's' : '') + ' from your materials</summary>'
    + '<ul style="margin:6px 0 0;padding-left:18px;line-height:1.5">' + items + '</ul></details>';
  el.appendChild(wrap);
  var c = document.getElementById('messages');
  if (c) c.scrollTop = c.scrollHeight;
}

/** Remove a message by ID. */
function removeMessage(id) {
  var el = document.getElementById(id);
  if (el) el.remove();
}

/** Speak text using browser TTS (fallback when PollyService unavailable). */
function speakText(text) {
  var clean = (text || '').replace(/<[^>]*>/g, '');
  if (window.lmSpeak) { window.lmSpeak(clean); return; } // neural voice + fallback
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    var utterance = new SpeechSynthesisUtterance(clean);
    utterance.rate = 0.9;
    utterance.pitch = 1.0;
    window.speechSynthesis.speak(utterance);
  }
}

/** HTML escape. */
function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

/** Voice input — browser speech recognition. */
var recognition = null;
var isListening = false;

function toggleVoiceInput() {
  if (isListening) {
    stopListening();
    return;
  }

  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert('Voice input is not supported in this browser. Try Chrome.');
    return;
  }

  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onstart = function() {
    isListening = true;
    document.getElementById('micBtn').classList.add('listening');
    document.getElementById('input').placeholder = 'Listening...';
  };

  recognition.onresult = function(event) {
    var transcript = '';
    for (var i = 0; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    document.getElementById('input').value = transcript;
  };

  recognition.onend = function() {
    stopListening();
    // Auto-send if we got text
    var input = document.getElementById('input');
    if (input.value.trim().length > 0) {
      sendFromInput();
    }
  };

  recognition.onerror = function(event) {
    stopListening();
    if (event.error !== 'no-speech') {
      console.warn('Speech recognition error:', event.error);
    }
  };

  recognition.start();
}

function stopListening() {
  isListening = false;
  document.getElementById('micBtn').classList.remove('listening');
  document.getElementById('input').placeholder = 'Ask me anything... or tap the mic to speak';
  if (recognition) { try { recognition.stop(); } catch (e) {} }
}

/** Study companion mode — tutor checks in every 10 minutes. */
var companionTimer = null;
var companionMinutes = 0;

function startCompanionMode() {
  sendMessage('I am starting my homework now. Can you study with me? Check in on me every few minutes to see how I am doing.');

  companionMinutes = 0;
  if (companionTimer) clearInterval(companionTimer);

  companionTimer = setInterval(function() {
    companionMinutes += 10;
    var checkIns = [
      'How is it going? Need help with anything?',
      'Still working? You are doing great! Let me know if you get stuck.',
      'Check-in! How are you feeling about this assignment?',
      'You have been at it for ' + companionMinutes + ' minutes. Want to take a quick stretch break?',
      'Nice focus! Remember, I am here if you need me.',
    ];
    var msg = checkIns[Math.floor(Math.random() * checkIns.length)];
    addMessage(msg, 'tutor');
    // Use the shared neural voice (lmSpeak) instead of the robotic browser voice,
    // and let it cancel any prior utterance so check-ins don't pile up.
    if (ttsEnabled) speakText(msg);
  }, 10 * 60 * 1000); // Every 10 minutes
}

/** Escape for attribute (single-quote-safe). */
function escapeAttr(str) {
  return (str || '').replace(/'/g, "\\'").replace(/\n/g, ' ').substring(0, 500);
}
