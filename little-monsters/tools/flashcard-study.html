<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Monsters — Flashcard Study</title>

<link rel="stylesheet" href="/shared/ui/css/surface-themes.css">
<script src="/shared/ui/js/surface-theme.js" data-theme-default="classroom"></script>
<link rel="stylesheet" href="/api/education/education.css">
<style>
  .study-hero { margin-bottom: 16px; }
  .study-progress { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .study-progress .lm-progress { flex: 1; }
  .study-progress .progress-text { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }

  /* The flip card is the one page-specific component: two faces on a 3D turn. */
  .card-container { width: 100%; height: clamp(260px, 42vh, 340px); perspective: 1000px; cursor: pointer; margin-bottom: 16px; }
  .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.5s; transform-style: preserve-3d; }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden; overflow: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: 28px; text-align: center; border-radius: var(--lm-radius-xl);
    border: 1px solid var(--lm-line); background: var(--lm-card); box-shadow: var(--lm-shadow-soft);
  }
  .card-back { background: var(--lm-accent-wash); border-color: var(--lm-accent-line); transform: rotateY(180deg); }
  .card-label { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--lm-muted); }
  .card-text { font-size: 20px; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
  .study-side-switch { display: flex; justify-content: center; gap: 4px; padding: 4px; margin: 0 auto 12px; width: fit-content; max-width: 100%; background: var(--lm-bg-2); border-radius: var(--lm-radius-pill); }
  .study-side-switch.hide { display: none; }
  .study-side-switch button { min-height: var(--lm-touch); padding: 6px 16px; border: 0; border-radius: var(--lm-radius-pill); background: transparent; color: var(--lm-ink-2); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .study-side-switch button[aria-pressed="true"] { background: var(--lm-card); color: var(--lm-accent); box-shadow: var(--lm-shadow-soft); }
  .study-tools { display: flex; flex-wrap: nowrap; justify-content: center; gap: 8px; margin: 0 0 16px; }
  .study-tools .lm-btn { min-height: var(--lm-touch); min-width: var(--lm-touch); }
  .study-tools .lm-btn[aria-pressed="true"] { background: var(--lm-accent-soft); color: var(--lm-accent); border-color: var(--lm-accent-line); }
  @media (max-width: 480px) {
    .study-tools .lm-btn { padding-inline: 0; flex: 1 1 0; }
    .study-tools .tool-word { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  }
  #hintBtn.is-shown { cursor: default; color: var(--lm-ink-2); text-decoration: none; }

  .voice-answer-btn.listening { background: var(--lm-danger); color: #fff; border-color: var(--lm-danger); animation: pulse-voice 1.5s infinite; }
  @keyframes pulse-voice { 0%, 100% { box-shadow: none; } 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--lm-danger) 25%, transparent); } }
  .voice-result { text-align: center; margin-bottom: 16px; }
  .voice-result-text { font-size: 17px; font-weight: 600; color: var(--lm-ink); min-height: 24px; margin-top: 6px; }
  .my-answer { width: 100%; padding: 10px 14px; border-radius: var(--lm-radius-sm); background: var(--lm-card); border: 1px solid var(--lm-line); font-size: 14px; color: var(--lm-ink-2); text-align: left; }
  .my-answer::before { content: 'You said'; display: block; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--lm-muted); margin-bottom: 4px; }

  .tap-hint { margin-bottom: 16px; }
  .answer-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .stats { margin-bottom: 20px; }
  #emptyActions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
  #emptyActions .lm-btn { margin-top: 0; }
  .done-screen .big-emoji { font-size: 64px; line-height: 1; margin-bottom: 12px; }
  .done-screen p { color: var(--lm-ink-2); margin: 8px auto 0; max-width: 42ch; }
  .done-actions { justify-content: center; }
  @media (max-width: 480px) {
    .answer-btns { grid-template-columns: 1fr; }
    .card-face { padding: 20px; }
    .card-text { font-size: 18px; }
  }
</style>
</head>
<body>
<main class="lm-page is-narrow">
  <div class="lm-row lm-mb-sm"><a class="lm-btn lm-btn-quiet" href="/api/education/flashcards-hub">← My flashcards</a></div>
  <header class="lm-hero study-hero">
    <div>
      <div class="lm-eyebrow">Study</div>
      <h1 class="lm-display">One card at a time.</h1>
      <p class="lm-lead" id="deckTitle">Loading deck…</p>
    </div>
  </header>

  <!-- Progress -->
  <div class="study-progress" id="progressRow">
    <div class="lm-progress" aria-hidden="true"><span id="progressFill" style="width:0%"></span></div>
    <span class="lm-small lm-muted progress-text" id="progressText">—</span>
  </div>

  <!-- Prompt side toggle (RP-LM-04) -->
  <div class="study-side-switch hide" id="promptSideSwitch" role="group" aria-label="Prompt side">
    <button type="button" id="termFirstBtn" data-side="term" aria-pressed="true" onclick="setPromptSide('term')">Term first</button>
    <button type="button" id="defFirstBtn" data-side="definition" aria-pressed="false" onclick="setPromptSide('definition')">Definition first</button>
  </div>

  <!-- Flashcard -->
  <div class="card-container" id="cardContainer" onclick="flipCard()" role="button" aria-label="Flashcard - click or press Space to flip" tabindex="0">
    <div class="card-inner" id="cardInner">
      <div class="card-face card-front">
        <div class="card-label" id="frontLabel">Term</div>
        <div class="card-text" id="cardFront">Loading…</div>
        <button type="button" class="lm-text-button hide" id="hintBtn" onclick="event.stopPropagation(); showHint()">Show hint</button>
      </div>
      <div class="card-face card-back" id="cardBackFace" aria-hidden="true">
        <div class="card-label" id="backLabel">Definition</div>
        <div class="card-text" id="cardBack"></div>
        <div class="my-answer hide" id="myAnswer"></div>
      </div>
    </div>
  </div>

  <!-- One row of card tools under the card (the faces' own buttons overlapped each other). -->
  <div class="study-tools" id="studyTools" role="toolbar" aria-label="Card tools">
    <button type="button" class="lm-btn lm-btn-ghost" id="readFrontBtn" aria-label="Read aloud" onclick="speakCard('front')">&#128264;<span class="tool-word">&nbsp;Read aloud</span></button>
    <button type="button" class="lm-btn lm-btn-ghost voice-answer-btn" id="voiceAnswerBtn" aria-label="Speak answer" onclick="startVoiceAnswer()">&#127908;<span class="tool-word">&nbsp;Speak answer</span></button>
    <button type="button" class="lm-btn lm-btn-ghost" id="readBackBtn" aria-label="Read answer" onclick="speakCard('back')" disabled>&#128264;<span class="tool-word">&nbsp;Read answer</span></button>
    <button type="button" class="lm-btn lm-btn-ghost" id="shuffleBtn" aria-label="Shuffle cards" aria-pressed="false" onclick="toggleShuffle()">&#128256;<span class="tool-word">&nbsp;Shuffle</span></button>
  </div>

  <!-- Voice answer display (shown between question and flip) -->
  <div class="lm-callout voice-result hide" id="voiceResult">
    <div class="lm-eyebrow">Your answer</div>
    <div class="voice-result-text" id="voiceResultText"></div>
    <button type="button" class="lm-btn lm-btn-primary lm-mt-md" onclick="flipCard()">Flip to check &#8594;</button>
  </div>

  <p class="lm-help lm-text-center tap-hint" id="tapHint">Tap the card to flip &mdash; or speak your answer first<br><span class="lm-small">Keyboard: Space = flip · 1/2/3 = rate · R = read · V = voice · H = hint</span></p>

  <!-- Answer Buttons -->
  <div class="answer-btns hide" id="answerBtns">
    <button type="button" class="lm-btn lm-btn-lg lm-btn-danger" onclick="answer(0)">Don't got it</button>
    <button type="button" class="lm-btn lm-btn-lg lm-btn-success" onclick="answer(2)">Got it!</button>
  </div>

  <!-- Stats -->
  <div class="lm-grid is-tight stats" id="statsRow" style="--min:100px">
    <div class="lm-stat is-success"><div class="lm-stat-value" id="correctCount">0</div><div class="lm-stat-label">Correct</div></div>
    <div class="lm-stat is-streak"><div class="lm-stat-value" id="wrongCount">0</div><div class="lm-stat-label">Reviewing</div></div>
    <div class="lm-stat"><div class="lm-stat-value" id="remainCount">—</div><div class="lm-stat-label">Remaining</div></div>
  </div>

  <!-- Empty state: no deck to study -->
  <div class="lm-empty hide" id="emptyState">
    <div class="lm-empty-icon">🃏</div>
    <strong>No flashcards yet.</strong>
    <span id="emptyText"></span>
    <div id="emptyActions"></div>
    <div class="lm-status lm-mt-md" id="genStatus" role="status"></div>
  </div>

  <!-- Done Screen -->
  <div class="lm-card is-feature lm-text-center done-screen hide" id="doneScreen">
    <div class="big-emoji" id="doneEmoji"></div>
    <h2 class="lm-display" id="doneTitle"></h2>
    <p id="doneMessage"></p>
    <div class="lm-hero-actions done-actions">
      <button type="button" class="lm-btn lm-btn-primary lm-btn-lg" onclick="restartDeck()">Study again</button>
      <a class="lm-btn lm-btn-ghost lm-btn-lg" href="/api/education/flashcards-hub">Back to my flashcards</a>
    </div>
  </div>

  <div id="mascot-container"></div>
</main>

<script src="/api/education/mascot.js?v=4"></script>
<script src="/api/education/lm-voice.js"></script>
<script>
/**
 * Flashcard Study Mode — Implements spaced repetition review.
 *
 * Cards are scored on a 3-point scale:
 *   0 = Didn't know (show again soon)
 *   1 = Hard (show again later)
 *   2 = Got it (move to done)
 */

var originalDeck = [];
var deck = [];
var currentIndex = 0;
var isFlipped = false;
var correct = 0;
var reviewing = 0;
var mascot = null;
var me = null;
var studentId = null;
var classId = null;
var setId = null;
var activeSetId = null;
var studyPrefs = { shuffle: false, promptSide: 'term' };

// Initialize mascot
if (typeof LMMascot !== 'undefined') {
  mascot = new LMMascot(document.getElementById('mascot-container'));
}

/** The learner this session belongs to: the stored id when present, else the signed-in identity from the frame. */
async function resolveStudent() {
  try { me = await window.LM.me(); } catch (e) { me = null; }
  var stored = null;
  try { stored = localStorage.getItem('lm-student-id'); } catch (e) { stored = null; }
  studentId = stored || (me && me.studentId) || null;
}

/** True when the caller may generate a class set: an admin, or the teacher who owns the class (the generate route's rule). */
async function teachesClass(id) {
  if (!me || (me.role !== 'teacher' && me.role !== 'admin')) return false;
  if (me.role === 'admin') return true;
  try {
    var r = await fetch('/api/education/classes');
    if (!r.ok) return false;
    return ((await r.json()).classes || []).some(function (c) { return c.class_id === id && c.teacher_student_id === me.studentId; });
  } catch (e) { return false; }
}

/** One-tap: auto-generate a grounded flashcard set from this class's own textbook, then reload. */
async function generateFromTextbook() {
  if (!classId) return;
  var btn = document.getElementById('genBtn');
  var status = document.getElementById('genStatus');
  if (btn) { btn.disabled = true; btn.textContent = 'Generating from your textbook…'; }
  try {
    var resp = await fetch('/api/education/flashcards/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ classId: classId, count: 8 }),
    });
    var data = await resp.json();
    if (!resp.ok || data.error) {
      if (status) status.textContent = data.reason || data.error || 'Could not generate cards.';
      if (btn) { btn.disabled = false; btn.textContent = 'Generate from your textbook'; }
      return;
    }
    if (status) status.textContent = 'Created ' + data.cardCount + ' cards grounded in your textbook — loading…';
    setTimeout(function () { window.location.reload(); }, 900);
  } catch (e) {
    if (status) status.textContent = 'Error: ' + e.message;
    if (btn) { btn.disabled = false; btn.textContent = 'Generate from your textbook'; }
  }
}

function mapCards(cards) {
  return (cards || []).filter(function (c) { return c && c.card_id; }).map(function (c) {
    return { id: c.card_id, front: c.front, back: c.back, hints: c.hints || [], topic: c.topic || '' };
  });
}
/** The cards route carries no title, so a set opened by id takes its title from the caller's set list. */
async function titleFor(id) {
  try {
    var r = await fetch('/api/education/flashcards/sets');
    if (!r.ok) return '';
    var s = ((await r.json()).sets || []).filter(function (x) { return x.set_id === id; })[0];
    return s ? (s.title || '') : '';
  } catch (e) { return ''; }
}

/** Show the empty state honestly: only the class's teacher/admin is offered generation; everyone else is pointed to the hub. */
async function showEmpty() {
  ['cardContainer', 'promptSideSwitch', 'studyTools', 'progressRow', 'tapHint', 'statsRow'].forEach(function (id) { document.getElementById(id).classList.add('hide'); });
  document.getElementById('deckTitle').textContent = 'No flashcards yet';
  var text = document.getElementById('emptyText'), acts = document.getElementById('emptyActions');
  if (classId && await teachesClass(classId)) {
    text.textContent = 'This class has no set yet. Build one from its textbook, or make cards by hand.';
    acts.innerHTML = '<button type="button" class="lm-btn lm-btn-primary" id="genBtn" onclick="generateFromTextbook()">Generate from your textbook</button>' +
      '<a class="lm-btn lm-btn-ghost" href="/api/education/flashcards-hub">Make cards by hand</a>';
  } else if (classId) {
    text.textContent = 'Your teacher has not shared a set for this class yet. You can make your own cards any time.';
    acts.innerHTML = '<a class="lm-btn lm-btn-primary" href="/api/education/flashcards-hub">Make my own cards</a>';
  } else {
    text.textContent = 'Pick a set in My flashcards, or make a new one, to start studying.';
    acts.innerHTML = '<a class="lm-btn lm-btn-primary" href="/api/education/flashcards-hub">Open my flashcards</a>';
  }
  document.getElementById('emptyState').classList.remove('hide');
}

function prefsKey(id) { return 'lm-flashcard-prefs:' + String(id || 'default'); }
function readLocalPrefs(id) {
  try {
    var raw = JSON.parse(localStorage.getItem(prefsKey(id)) || 'null');
    if (raw && typeof raw === 'object') {
      return { shuffle: Boolean(raw.shuffle), promptSide: raw.promptSide === 'definition' ? 'definition' : 'term' };
    }
  } catch (e) {}
  return { shuffle: false, promptSide: 'term' };
}
function saveLocalPrefs(id, p) {
  try { localStorage.setItem(prefsKey(id), JSON.stringify(p)); } catch (e) {}
}
function persistStudyPrefs() {
  if (!activeSetId) return;
  saveLocalPrefs(activeSetId, studyPrefs);
  fetch('/api/education/flashcards/review', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ setId: activeSetId, preferences: studyPrefs }),
  }).catch(function () {});
}
function syncStudyPrefsUi() {
  var shuf = document.getElementById('shuffleBtn');
  if (shuf) shuf.setAttribute('aria-pressed', studyPrefs.shuffle ? 'true' : 'false');
  var termBtn = document.getElementById('termFirstBtn'), defBtn = document.getElementById('defFirstBtn');
  if (termBtn) termBtn.setAttribute('aria-pressed', studyPrefs.promptSide === 'term' ? 'true' : 'false');
  if (defBtn) defBtn.setAttribute('aria-pressed', studyPrefs.promptSide === 'definition' ? 'true' : 'false');
}
function shuffleCards(cards) {
  var copy = cards.slice();
  if (copy.length < 2) return copy;
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
  }
  var unchanged = copy.every(function (c, idx) { return c.id === cards[idx].id; });
  if (unchanged) { var first = copy[0]; copy[0] = copy[copy.length - 1]; copy[copy.length - 1] = first; }
  return copy;
}
function applyDeckOrder() {
  deck = studyPrefs.shuffle ? shuffleCards(originalDeck) : originalDeck.slice();
  currentIndex = 0; correct = 0; reviewing = 0;
  document.getElementById('correctCount').textContent = '0';
  document.getElementById('wrongCount').textContent = '0';
  document.getElementById('remainCount').textContent = deck.length;
  syncStudyPrefsUi();
}
function toggleShuffle() {
  studyPrefs = { shuffle: !studyPrefs.shuffle, promptSide: studyPrefs.promptSide };
  persistStudyPrefs();
  if (!originalDeck.length) return;
  document.getElementById('doneScreen').classList.add('hide');
  ['cardContainer', 'promptSideSwitch', 'studyTools'].forEach(function (id) { document.getElementById(id).classList.remove('hide'); });
  applyDeckOrder();
  showCard();
}
function setPromptSide(side) {
  var next = side === 'definition' ? 'definition' : 'term';
  if (studyPrefs.promptSide === next) return;
  studyPrefs = { shuffle: studyPrefs.shuffle, promptSide: next };
  persistStudyPrefs();
  syncStudyPrefsUi();
  if (currentIndex < deck.length) showCard();
}

/** Load a flashcard deck from the API. Shows the empty state if no sets exist. */
async function loadDeck() {
  var params = new URLSearchParams(window.location.search);
  setId = params.get('setId');
  classId = params.get('classId');
  activeSetId = setId || null;
  var title = '', serverPrefs = null;
  originalDeck = [];
  deck = [];

  try {
    if (setId) {
      var resp = await fetch('/api/education/flashcards/sets/' + encodeURIComponent(setId) + '/cards?includePrefs=1');
      if (resp.ok) {
        var body = await resp.json();
        originalDeck = mapCards(body.cards);
        if (body.preferences) serverPrefs = body.preferences;
      }
      title = await titleFor(setId);
    } else {
      // Load the first available set for the class (or across all sets)
      var setsResp = await fetch('/api/education/flashcards/sets' + (classId ? '?classId=' + encodeURIComponent(classId) : ''));
      if (setsResp.ok) {
        var sets = (await setsResp.json()).sets || [];
        if (sets.length > 0) {
          var firstSet = sets[0];
          activeSetId = firstSet.set_id;
          title = firstSet.title || '';
          var cardsResp = await fetch('/api/education/flashcards/sets/' + encodeURIComponent(firstSet.set_id) + '/cards?includePrefs=1');
          if (cardsResp.ok) {
            var cBody = await cardsResp.json();
            originalDeck = mapCards(cBody.cards);
            if (cBody.preferences) serverPrefs = cBody.preferences;
          }
        }
      }
    }
  } catch (e) {
    console.warn('[Flashcards] API fetch failed:', e.message);
  }

  if (originalDeck.length === 0) { await showEmpty(); return; }

  var localPrefs = readLocalPrefs(activeSetId);
  studyPrefs = serverPrefs
    ? { shuffle: Boolean(serverPrefs.shuffle), promptSide: serverPrefs.promptSide === 'definition' ? 'definition' : 'term' }
    : localPrefs;
  saveLocalPrefs(activeSetId, studyPrefs);

  document.getElementById('emptyState').classList.add('hide');
  ['cardContainer', 'promptSideSwitch', 'studyTools', 'progressRow', 'tapHint', 'statsRow'].forEach(function (id) { document.getElementById(id).classList.remove('hide'); });
  document.getElementById('deckTitle').textContent = (title || 'Study deck') + ' — ' + originalDeck.length + (originalDeck.length === 1 ? ' card' : ' cards');
  applyDeckOrder();
  showCard();
}

/** Display the current card (front side). */
function showCard() {
  if (currentIndex >= deck.length) {
    showDoneScreen();
    return;
  }

  var card = deck[currentIndex];
  var defFirst = studyPrefs.promptSide === 'definition';
  document.getElementById('frontLabel').textContent = defFirst ? 'Definition' : 'Term';
  document.getElementById('backLabel').textContent = defFirst ? 'Term' : 'Definition';
  document.getElementById('cardFront').textContent = defFirst ? card.back : card.front;
  document.getElementById('cardBack').textContent = defFirst ? card.front : card.back;

  // Reset flip and voice answer
  isFlipped = false;
  mySpokenAnswer = '';
  document.getElementById('cardInner').classList.remove('flipped');
  setFaces(false);
  document.getElementById('answerBtns').classList.add('hide');
  document.getElementById('tapHint').classList.remove('hide');
  document.getElementById('voiceResult').classList.add('hide');
  document.getElementById('myAnswer').classList.add('hide');
  stopVoiceAnswer();

  // Show hint button if hints available
  var hintBtn = document.getElementById('hintBtn');
  hintBtn.classList.toggle('hide', !card.hints || card.hints.length === 0);
  hintBtn.classList.remove('is-shown');
  hintBtn.textContent = 'Show hint';

  updateProgress();
}

/** Voice answer — speak your answer, see it transcribed, then flip to check. */
var voiceRecognition = null;
var isVoiceListening = false;
var mySpokenAnswer = '';

function startVoiceAnswer() {
  if (isVoiceListening) { stopVoiceAnswer(); return; }

  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    window.LM.toast('Voice input is not supported in this browser. Try Chrome.');
    return;
  }

  voiceRecognition = new SpeechRecognition();
  voiceRecognition.continuous = false;
  voiceRecognition.interimResults = true;
  voiceRecognition.lang = 'en-US';

  voiceRecognition.onstart = function() {
    isVoiceListening = true;
    document.getElementById('voiceAnswerBtn').classList.add('listening');
    document.getElementById('voiceAnswerBtn').innerHTML = '&#127908; Listening...';
    document.getElementById('voiceResult').classList.remove('hide');
    document.getElementById('voiceResultText').textContent = 'Listening...';
  };

  voiceRecognition.onresult = function(event) {
    var transcript = '';
    for (var i = 0; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    mySpokenAnswer = transcript;
    document.getElementById('voiceResultText').textContent = transcript || 'Listening...';
  };

  voiceRecognition.onend = function() {
    stopVoiceAnswer();
    if (mySpokenAnswer) {
      document.getElementById('voiceResultText').textContent = mySpokenAnswer;
    }
  };

  voiceRecognition.onerror = function(event) {
    stopVoiceAnswer();
    if (event.error !== 'no-speech') {
      document.getElementById('voiceResultText').textContent = '(Could not hear you — try again)';
    }
  };

  voiceRecognition.start();
}

function stopVoiceAnswer() {
  isVoiceListening = false;
  var btn = document.getElementById('voiceAnswerBtn');
  btn.classList.remove('listening');
  btn.innerHTML = '&#127908; Speak answer';
  if (voiceRecognition) { try { voiceRecognition.stop(); } catch (e) {} }
}

/** Read a card side aloud using browser TTS. */
function speakCard(side) {
  var text = side === 'front'
    ? document.getElementById('cardFront').textContent
    : document.getElementById('cardBack').textContent;
  if (window.lmSpeak) { window.lmSpeak(text); return; } // neural voice + fallback
  if ('speechSynthesis' in window && text) {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.rate = 0.85;
    speechSynthesis.speak(u);
  }
}

/** Only the face that shows is read by a screen reader; Read answer waits for the flip, Speak answer stops after it. */
function setFaces(flipped) {
  document.querySelector('.card-front').setAttribute('aria-hidden', flipped ? 'true' : 'false');
  document.getElementById('cardBackFace').setAttribute('aria-hidden', flipped ? 'false' : 'true');
  document.getElementById('readBackBtn').disabled = !flipped;
  document.getElementById('voiceAnswerBtn').disabled = flipped;
}

/** Flip the card to show the answer. */
function flipCard() {
  if (isFlipped) return;
  isFlipped = true;
  stopVoiceAnswer();
  document.getElementById('cardInner').classList.add('flipped');
  setFaces(true);
  document.getElementById('answerBtns').classList.remove('hide');
  document.getElementById('tapHint').classList.add('hide');
  document.getElementById('voiceResult').classList.add('hide');

  // Show spoken answer on the back for comparison
  var myAnswerEl = document.getElementById('myAnswer');
  if (mySpokenAnswer) {
    myAnswerEl.textContent = mySpokenAnswer;
    myAnswerEl.classList.remove('hide');
  } else {
    myAnswerEl.classList.add('hide');
  }
}

/** Show a progressive hint. */
function showHint() {
  var card = deck[currentIndex];
  if (!card.hints || card.hints.length === 0) return;
  var hintBtn = document.getElementById('hintBtn');
  hintBtn.textContent = card.hints[0];
  hintBtn.classList.add('is-shown');
}

/** Record answer and advance. Sends review to SM-2 API. */
function answer(score) {
  var card = deck[currentIndex];

  if (score === 0) {
    reviewing++;
    deck.push(card);
  } else if (score === 1) {
    correct++;
  } else {
    correct++;
    if (mascot && correct % 3 === 0) {
      mascot.setMood('proud');
    }
  }

  // Record review via API (fire-and-forget — don't block UI). The route binds the review to the caller.
  if (card.id) {
    var body = { cardId: card.id, score: score };
    if (studentId) body.studentId = studentId;
    fetch('/api/education/flashcards/review', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    }).catch(function(e) { console.debug('[Flashcards] Review sync failed:', e.message); });
  }

  currentIndex++;
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = reviewing;
  document.getElementById('remainCount').textContent = Math.max(0, deck.length - currentIndex);
  updateProgress(); // the finished deck reads 6/6, not the last card's 5/6

  showCard();
}

/** Update the progress bar. */
function updateProgress() {
  var total = deck.length;
  var done = currentIndex;
  var pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = done + '/' + total;
}

/** Show the completion screen. */
function showDoneScreen() {
  document.getElementById('cardContainer').classList.add('hide');
  document.getElementById('promptSideSwitch').classList.add('hide');
  document.getElementById('studyTools').classList.add('hide');
  document.getElementById('answerBtns').classList.add('hide');
  document.getElementById('tapHint').classList.add('hide');
  document.getElementById('voiceResult').classList.add('hide');

  var screen = document.getElementById('doneScreen');
  screen.classList.remove('hide');

  var total = correct + reviewing;
  var accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;

  if (accuracy >= 90) {
    document.getElementById('doneEmoji').textContent = '🌟';
    document.getElementById('doneTitle').textContent = 'Outstanding!';
    document.getElementById('doneMessage').textContent = correct + ' out of ' + total + ' correct (' + accuracy + '%). You crushed it!';
  } else if (accuracy >= 70) {
    document.getElementById('doneEmoji').textContent = '💪';
    document.getElementById('doneTitle').textContent = 'Great work!';
    document.getElementById('doneMessage').textContent = correct + ' out of ' + total + ' correct (' + accuracy + '%). You\'re getting stronger!';
  } else if (accuracy >= 50) {
    document.getElementById('doneEmoji').textContent = '🚀';
    document.getElementById('doneTitle').textContent = 'Making progress!';
    document.getElementById('doneMessage').textContent = correct + ' out of ' + total + ' (' + accuracy + '%). Try again — you\'ll do even better!';
  } else {
    document.getElementById('doneEmoji').textContent = '💡';
    document.getElementById('doneTitle').textContent = 'Learning takes practice!';
    document.getElementById('doneMessage').textContent = 'You reviewed ' + total + ' cards. That takes courage! Try the ones you missed again.';
  }

  // Speak the result with the same neural voice as the cards; the browser voice is only the fallback.
  var doneSpeech = document.getElementById('doneTitle').textContent + '. ' + document.getElementById('doneMessage').textContent;
  if (window.lmSpeak) {
    window.lmSpeak(doneSpeech);
  } else if ('speechSynthesis' in window) {
    var msg = doneSpeech;
    var u = new SpeechSynthesisUtterance(msg);
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }

  if (mascot) mascot.setMood('proud');
  if (typeof lmConfetti === 'function') lmConfetti();

  // Record XP via API. The route awards the caller; the learner id rides along when known.
  var body = { eventType: 'flashcard_session' };
  if (studentId) body.studentId = studentId;
  fetch('/api/education/xp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  }).then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (d && d.xpAwarded) window.LM.toast('+' + d.xpAwarded + ' XP' + (d.level ? ' · Level ' + d.level : '')); })
    .catch(function() {});
}

/** Reset and study the deck again. */
function restartDeck() {
  currentIndex = 0;
  correct = 0;
  reviewing = 0;
  document.getElementById('correctCount').textContent = '0';
  document.getElementById('wrongCount').textContent = '0';
  document.getElementById('cardContainer').classList.remove('hide');
  document.getElementById('promptSideSwitch').classList.remove('hide');
  document.getElementById('studyTools').classList.remove('hide');
  document.getElementById('doneScreen').classList.add('hide');
  loadDeck();
  if (mascot) mascot.setMood('happy');
}

// ── Keyboard Shortcuts (ADHD: reduce friction, study faster) ──
document.addEventListener('keydown', function(e) {
  // Don't capture if typing in an input
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  switch (e.key) {
    case ' ':       // Space = flip card
    case 'Enter':
      e.preventDefault();
      if (!isFlipped) flipCard();
      break;
    case '1':       // 1 = Didn't know
      if (isFlipped) answer(0);
      break;
    case '2':       // 2 = Hard
      if (isFlipped) answer(1);
      break;
    case '3':       // 3 = Got it!
      if (isFlipped) answer(2);
      break;
    case 'r':       // R = read aloud current side
    case 'R':
      speakCard(isFlipped ? 'back' : 'front');
      break;
    case 'h':       // H = show hint
    case 'H':
      if (!isFlipped) showHint();
      break;
    case 'v':       // V = voice answer
    case 'V':
      if (!isFlipped) startVoiceAnswer();
      break;
  }
});

// Boot: identity first (reviews and XP carry it), then the deck.
(async function () { await resolveStudent(); loadDeck(); })();
</script>
</body>
</html>
