<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Monsters — Formula Lab</title>
<!--
  CHANGE LOG
  ---------------------------------------------------------------------------
  SEQ | AUTHOR                                    | DESCRIPTION
  ---------------------------------------------------------------------------
  1   | maintainer@emeraldcoastsystemsgroup.com   | Formula reference: Physics 1 and Chemistry formulas with search, a worked example per card and a deep link that prefills the tutor
  2   | maintainer@emeraldcoastsystemsgroup.com   | Little Monsters design system: shared theme bootstrap (classroom default), package stylesheet and page frame replace the per-page theme reader, glass link and literal pink/dark palette; hero, search field, per-subject sections with generated counts, expandable cards (keyboard and aria-expanded), an empty state for a search with no match, copy that presents the sheet as a fixed reference rather than personal data
  ---------------------------------------------------------------------------
-->
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css">
<script src="/shared/ui/js/surface-theme.js" data-theme-default="classroom"></script>
<link rel="stylesheet" href="/api/education/education.css">
<style>
  .search-field { max-width: 560px; margin-bottom: 18px; }
  .f .eq { font-family: "Cambria Math", var(--lm-font-display); font-size: 21px; margin: 6px 0 2px; color: var(--lm-accent); overflow-wrap: anywhere; }
  .f .ex { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--lm-line-strong); font-size: 14px; line-height: 1.55; color: var(--lm-ink-2); }
  .f.open .ex { display: block; }
  .f .ex b { color: var(--lm-accent); }
  .f .ex .deck { margin-top: 10px; }
  .f .taptip { margin-top: 10px; }
  .f.open .taptip { display: none; }
</style>
</head>
<body>
<main class="lm-page">
  <header class="lm-hero">
    <div>
      <div class="lm-eyebrow">Reference sheet</div>
      <h1 class="lm-display">Formula Lab</h1>
      <p class="lm-lead">Your digital cheat-sheet — Physics 1 &amp; Chemistry, always one tap away. Tap a formula to see it worked through step by step.</p>
    </div>
    <img class="lm-hero-art" src="/api/education/logo-256.png" alt="" width="168" height="162">
  </header>

  <div class="lm-field search-field">
    <label for="search">Find a formula</label>
    <input class="lm-input" type="search" id="search" placeholder="Search formulas (e.g. velocity, moles, force)…" oninput="filt()" autocomplete="off">
    <p class="lm-help" id="searchHelp"></p>
  </div>

  <div id="out"></div>
</main>

<script src="/api/education/mascot.js?v=4"></script>
<script>
var esc = window.LM.esc;
var DEFAULT_HELP = 'One reference sheet for everyone — it is not personal, and nothing you type here is saved.';
// Each formula carries a worked example (ex). Tap a card to see it solved step by step.
var DATA = {
  'Physics 1': [
    {n:'Average velocity', eq:'v = Δx / Δt', d:'displacement over time', ex:'A runner covers <b>100 m</b> in <b>20 s</b>.<br>v = 100 / 20 = <b>5 m/s</b>.'},
    {n:'Acceleration', eq:'a = Δv / Δt', d:'change in velocity over time', ex:'A car goes 0→<b>30 m/s</b> in <b>6 s</b>.<br>a = 30 / 6 = <b>5 m/s²</b>.'},
    {n:'Kinematics (no t)', eq:'v² = v₀² + 2aΔx', d:'final velocity from distance', ex:'Start 0, a=<b>2 m/s²</b>, Δx=<b>25 m</b>.<br>v² = 0 + 2·2·25 = 100 → v = <b>10 m/s</b>.'},
    {n:'Position', eq:'x = x₀ + v₀t + ½at²', d:'position under constant a', ex:'x₀=0, v₀=<b>4 m/s</b>, a=<b>2</b>, t=<b>3 s</b>.<br>x = 0 + 4·3 + ½·2·9 = 12 + 9 = <b>21 m</b>.'},
    {n:"Newton's 2nd law", eq:'F = m·a', d:'net force = mass × acceleration', ex:'<b>3 kg</b> at <b>4 m/s²</b>.<br>F = 3·4 = <b>12 N</b>.'},
    {n:'Weight', eq:'W = m·g', d:'g ≈ 9.8 m/s²', ex:'<b>10 kg</b> object.<br>W = 10·9.8 = <b>98 N</b>.'},
    {n:'Momentum', eq:'p = m·v', d:'mass × velocity', ex:'<b>2 kg</b> at <b>5 m/s</b>.<br>p = 2·5 = <b>10 kg·m/s</b>.'},
    {n:'Kinetic energy', eq:'KE = ½mv²', d:'energy of motion', ex:'<b>4 kg</b> at <b>3 m/s</b>.<br>KE = ½·4·3² = ½·4·9 = <b>18 J</b>.'},
    {n:'Potential energy', eq:'PE = m·g·h', d:'gravitational PE', ex:'<b>2 kg</b> at <b>5 m</b> high.<br>PE = 2·9.8·5 = <b>98 J</b>.'},
    {n:'Work', eq:'W = F·d·cosθ', d:'force through a distance', ex:'<b>10 N</b> pushes <b>3 m</b> (θ=0).<br>W = 10·3·1 = <b>30 J</b>.'},
    {n:'Power', eq:'P = W / t', d:'work over time', ex:'<b>60 J</b> in <b>4 s</b>.<br>P = 60 / 4 = <b>15 W</b>.'},
    {n:"Hooke's law", eq:'F = -k·x', d:'spring restoring force', ex:'k=<b>200 N/m</b>, stretched <b>0.1 m</b>.<br>F = 200·0.1 = <b>20 N</b> (pulling back).'},
  ],
  'Chemistry': [
    {n:'Moles', eq:'n = m / M', d:'mass / molar mass', ex:'<b>36 g</b> of water (M=18).<br>n = 36 / 18 = <b>2 mol</b>.'},
    {n:'Molarity', eq:'M = n / V', d:'moles of solute per liter', ex:'<b>0.5 mol</b> in <b>2 L</b>.<br>M = 0.5 / 2 = <b>0.25 M</b>.'},
    {n:'Ideal gas law', eq:'PV = nRT', d:'R = 0.0821 L·atm/mol·K', ex:'n=<b>1</b>, T=<b>273 K</b>, V=<b>22.4 L</b>.<br>P = nRT/V = (1·0.0821·273)/22.4 ≈ <b>1 atm</b>.'},
    {n:'Density', eq:'ρ = m / V', d:'mass per volume', ex:'<b>20 g</b> in <b>10 mL</b>.<br>ρ = 20 / 10 = <b>2 g/mL</b>.'},
    {n:'Percent yield', eq:'% = (actual/theoretical)·100', d:'reaction efficiency', ex:'Got <b>8 g</b>, expected <b>10 g</b>.<br>% = (8/10)·100 = <b>80%</b>.'},
    {n:'Dilution', eq:'M₁V₁ = M₂V₂', d:'concentration before/after', ex:'<b>2 M</b>, <b>50 mL</b> → <b>200 mL</b>.<br>M₂ = (2·50)/200 = <b>0.5 M</b>.'},
    {n:'pH', eq:'pH = -log[H⁺]', d:'acidity', ex:'[H⁺] = <b>0.001 M</b>.<br>pH = -log(0.001) = <b>3</b>.'},
    {n:'pH + pOH', eq:'pH + pOH = 14', d:'at 25 °C', ex:'pH = <b>9</b>.<br>pOH = 14 - 9 = <b>5</b>.'},
    {n:'Heat', eq:'q = m·c·ΔT', d:'specific heat', ex:'<b>100 g</b> water (c=4.18), ΔT=<b>10°</b>.<br>q = 100·4.18·10 = <b>4180 J</b>.'},
    {n:'Avogadro', eq:'1 mol = 6.022×10²³', d:'particles per mole', ex:'<b>2 mol</b> of atoms.<br>2·6.022×10²³ = <b>1.2×10²⁴ atoms</b>.'},
  ],
};
function countAll() { return Object.keys(DATA).reduce(function (n, k) { return n + DATA[k].length; }, 0); }
function card(x) {
  var c = document.createElement('div'); c.className = 'lm-card is-clickable f'; c.setAttribute('role', 'button'); c.tabIndex = 0; c.setAttribute('aria-expanded', 'false');
  var deck = '<a class="lm-btn lm-btn-soft deck" href="/api/education/tutor?prefill=' + encodeURIComponent('Give me a quick overview of ' + x.n + ' (' + x.eq + ') with one more worked example.') + '">🎓 Ask the tutor for an overview →</a>';
  c.innerHTML = '<h3 class="n">' + esc(x.n) + '</h3><div class="eq">' + esc(x.eq) + '</div><div class="lm-card-meta">' + esc(x.d) + '</div>'
    + '<div class="ex"><b>Example.</b> ' + x.ex + '<br>' + deck + '</div>'
    + '<div class="taptip lm-small lm-muted">Tap for a worked example ›</div>';
  function toggle() { var open = c.classList.toggle('open'); c.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  c.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('a')) return; toggle(); });
  c.addEventListener('keydown', function (e) { if (e.target !== c) return; if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  return c;
}
function render(filter) {
  var out = document.getElementById('out'); out.innerHTML = '';
  var f = (filter || '').trim().toLowerCase(), shown = 0;
  Object.keys(DATA).forEach(function (subj) {
    var items = DATA[subj].filter(function (x) { return !f || (x.n + ' ' + x.eq + ' ' + x.d).toLowerCase().indexOf(f) >= 0; });
    if (!items.length) return;
    shown += items.length;
    var sec = document.createElement('section'); sec.className = 'lm-section';
    sec.innerHTML = '<div class="lm-section-head"><h2>' + esc(subj) + '</h2><span class="lm-pill is-neutral">' + items.length + (items.length === 1 ? ' formula' : ' formulas') + '</span></div>';
    var g = document.createElement('div'); g.className = 'lm-grid'; g.style.setProperty('--min', '260px');
    items.forEach(function (x) { g.appendChild(card(x)); });
    sec.appendChild(g); out.appendChild(sec);
  });
  if (!shown) {
    out.innerHTML = '<div class="lm-empty"><div class="lm-empty-icon">🔍</div><strong>No formulas match “' + esc(filter.trim()) + '”.</strong>Try a shorter word, like “force” or “mol”.<br><button type="button" class="lm-btn lm-btn-ghost" onclick="clearSearch()">Clear search</button></div>';
  }
  document.getElementById('searchHelp').textContent = f ? 'Showing ' + shown + ' of ' + countAll() + ' formulas.' : DEFAULT_HELP;
}
function clearSearch() { var s = document.getElementById('search'); s.value = ''; render(''); s.focus(); }
function filt() { render(document.getElementById('search').value); }
render('');
</script>
</body>
</html>
