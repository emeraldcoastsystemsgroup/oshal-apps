<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Monsters - Lecture Presentation</title>
<!--
  CHANGE LOG
  ---------------------------------------------------------------------------
  DATE           | AUTHOR                    | DESCRIPTION
  ---------------------------------------------------------------------------
  2026-06-12     | roger.murphy@agenticfederal.us   | Lightweight lecture slide player — replays the deck generated by /process-transcript (no deck engine, no deps). Loads ?lectureId= via the slides endpoint or the just-generated deck from sessionStorage.
  2026-06-17     | roger.murphy@emeraldcoastsystemsgroup.com | Export to PowerPoint: a topbar button POSTs /lectures/:lectureId/pptx (the presentation generator) and downloads the saved .pptx.
  ---------------------------------------------------------------------------
-->
<script>
// Sync iframe theme to parent cockpit's data-theme (same pattern as the other LM pages).
(function(){
  function applyTheme(n){
    if(!n)return;
    document.documentElement.setAttribute('data-theme',n);
    var href='/cockpit/css/themes/'+n+'.css';
    var link=document.querySelector('link[data-lm-theme-link="1"]');
    if(link){if(link.getAttribute('href')!==href)link.setAttribute('href',href);return;}
    link=document.createElement('link');link.rel='stylesheet';link.href=href;
    link.setAttribute('data-lm-theme-link','1');document.head.appendChild(link);
  }
  function initial(){
    try{if(window.parent&&window.parent!==window){var p=window.parent.document.documentElement.getAttribute('data-theme');if(p)return p;}}catch(_e){}
    try{var s=window.localStorage.getItem('cockpit-theme');if(s)return s;}catch(_e){}
    return 'midnight';
  }
  applyTheme(initial());
  try{if(window.parent&&window.parent!==window){
    var ph=window.parent.document.documentElement;
    new MutationObserver(function(ms){for(var i=0;i<ms.length;i++){if(ms[i].attributeName==='data-theme'){var t=ph.getAttribute('data-theme');if(t)applyTheme(t);}}}).observe(ph,{attributes:true,attributeFilter:['data-theme']});
  }}catch(_e){}
})();
</script>
<link rel="stylesheet" href="/api/education/education.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; padding: 0; overflow: hidden; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; font-size: 13px; color: var(--text-muted);
    border-bottom: 1px solid var(--border-color); flex: 0 0 auto;
  }
  .topbar .deck-title { font-weight: 700; color: var(--text-primary); font-size: 14px; }
  .topbar button {
    background: none; border: 1px solid var(--border-color); color: var(--text-muted);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px;
  }
  .topbar button:hover { color: var(--text-primary); border-color: var(--accent-primary); }

  .stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 24px; cursor: pointer; user-select: none; position: relative;
  }
  .slide {
    max-width: 760px; width: 100%; text-align: center;
    animation: slidein 0.35s ease;
  }
  @keyframes slidein { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .slide .emoji { font-size: 64px; line-height: 1; margin-bottom: 18px; }
  .slide h2 { font-size: clamp(24px, 4.5vw, 40px); margin-bottom: 22px; line-height: 1.2; }
  .slide ul { list-style: none; display: inline-block; text-align: left; }
  .slide li {
    font-size: clamp(16px, 2.4vw, 22px); line-height: 1.45; margin: 12px 0;
    padding-left: 30px; position: relative; color: var(--text-primary);
    opacity: 0; animation: bulletin 0.3s ease forwards;
  }
  .slide li::before { content: '✦'; position: absolute; left: 0; color: var(--accent-primary); }
  .slide li:nth-child(1) { animation-delay: 0.10s; }
  .slide li:nth-child(2) { animation-delay: 0.25s; }
  .slide li:nth-child(3) { animation-delay: 0.40s; }
  .slide li:nth-child(4) { animation-delay: 0.55s; }
  .slide li:nth-child(5) { animation-delay: 0.70s; }
  .slide li:nth-child(6) { animation-delay: 0.85s; }
  @keyframes bulletin { to { opacity: 1; } }

  .slide.title-slide h1 { font-size: clamp(30px, 6vw, 52px); margin-bottom: 14px; }
  .slide.title-slide .sub { color: var(--text-muted); font-size: 16px; }
  .slide .end-actions { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .slide .end-actions a {
    display: inline-block; text-decoration: none; padding: 14px 22px; border-radius: 12px;
    font-weight: 700; font-size: 15px;
    background: linear-gradient(135deg, #7c5cff, #5fdcc0); color: #0a0e1a;
  }
  .slide .end-actions a.secondary { background: none; border: 1px solid var(--border-color); color: var(--text-primary); }

  .nav-hint { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--text-muted); opacity: 0.7; }

  .bottombar { flex: 0 0 auto; padding: 12px 16px 16px; }
  .progress-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #7c5cff, #5fdcc0); transition: width 0.3s ease; width: 0; }
  .counter { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 8px; }

  .arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border-color);
    background: var(--bg-secondary); color: var(--text-primary); font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .arrow:hover { border-color: var(--accent-primary); }
  .arrow.prev { left: 14px; }
  .arrow.next { right: 14px; }
  .arrow:disabled { opacity: 0.25; cursor: default; }

  .loading, .errorbox { text-align: center; color: var(--text-muted); font-size: 15px; padding: 40px; }
  .errorbox { color: var(--status-error); }

  @media (max-width: 640px) {
    .topbar { flex-wrap: wrap; gap: 6px; padding: 8px 12px; }
    .topbar .deck-title { font-size: 13px; min-width: 0; flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar > span { flex: 0 0 auto; }
    .stage { padding: 12px 8px 12px 8px; }
    .arrow.prev { left: 4px; }
    .arrow.next { right: 4px; }
    .slide { padding: 0 52px; }
    .slide .end-actions a { padding: 12px 16px; font-size: 14px; }
    .bottombar { padding: 8px 12px 12px; }
  }
</style>
  <link rel="stylesheet" href="/shared/ui/css/surface-glass.css" />
</head>
<body>

<div class="topbar">
  <span class="deck-title" id="deckTitle">Lecture Presentation</span>
  <span style="display:flex; gap:8px;">
    <button id="pptxBtn" onclick="exportPptx()" style="display:none;">⬇ PowerPoint</button>
    <button onclick="goBack()">✕ Close</button>
  </span>
</div>

<div class="stage" id="stage" onclick="next()">
  <div class="loading" id="loading">Loading your presentation…</div>
  <button class="arrow prev" id="prevBtn" onclick="event.stopPropagation(); prev()">←</button>
  <button class="arrow next" id="nextBtn" onclick="event.stopPropagation(); next()">→</button>
  <div class="nav-hint">tap, →, or space to continue</div>
</div>

<div class="bottombar">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="counter" id="counter"></div>
</div>

<script>
/**
 * Lecture presentation player. The "deck" is plain JSON produced by the same
 * LLM pass that makes notes + flashcards: [{title, bullets[], emoji}].
 * Slide 0 is a synthesized title slide; the last slide is a synthesized
 * "you did it" slide with study links. No deck engine, no dependencies.
 */
var deck = null;     // {title, className, slides:[...]}
var current = 0;     // index into views
var views = [];      // [{type:'title'}|{type:'slide',i}|{type:'end'}]
var params = new URLSearchParams(location.search);

function goBack() {
  var classId = params.get('classId') || (deck && deck.classId) || '';
  location.href = '/api/education/recorder' + (classId ? '?classId=' + encodeURIComponent(classId) : '');
}

function buildViews() {
  views = [{ type: 'title' }];
  for (var i = 0; i < deck.slides.length; i++) views.push({ type: 'slide', i: i });
  views.push({ type: 'end' });
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function render() {
  var stage = document.getElementById('stage');
  var old = stage.querySelector('.slide, .loading, .errorbox');
  if (old) old.remove();

  var v = views[current];
  var el = document.createElement('div');
  el.className = 'slide';

  if (v.type === 'title') {
    el.classList.add('title-slide');
    el.innerHTML = '<div class="emoji">🎬</div><h1>' + esc(deck.title || 'Your Lecture') + '</h1>' +
      '<div class="sub">' + esc(deck.className || '') + ' — let’s replay what you learned</div>';
  } else if (v.type === 'end') {
    var classId = params.get('classId') || deck.classId || '';
    var setId = params.get('setId') || '';
    var fcUrl = '/api/education/flashcards?' + (setId ? 'setId=' + encodeURIComponent(setId) + '&' : '') + (classId ? 'classId=' + encodeURIComponent(classId) : '');
    var quizUrl = '/api/education/quiz' + (classId ? '?classId=' + encodeURIComponent(classId) : '');
    el.classList.add('title-slide');
    el.innerHTML = '<div class="emoji">🎉</div><h1>You did it!</h1>' +
      '<div class="sub">That’s the whole lecture. Lock it in while it’s fresh:</div>' +
      '<div class="end-actions">' +
      '<a href="' + fcUrl + '">🃏 Study the flashcards</a>' +
      '<a class="secondary" href="' + quizUrl + '">📝 Take a quick quiz</a>' +
      '</div>';
  } else {
    var s = deck.slides[v.i];
    var bullets = (s.bullets || []).map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('');
    el.innerHTML = (s.emoji ? '<div class="emoji">' + esc(s.emoji) + '</div>' : '') +
      '<h2>' + esc(s.title) + '</h2>' + (bullets ? '<ul>' + bullets + '</ul>' : '');
  }

  stage.insertBefore(el, stage.querySelector('.nav-hint'));

  var pct = views.length > 1 ? (current / (views.length - 1)) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('counter').textContent = (current + 1) + ' / ' + views.length;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === views.length - 1;
}

function next() { if (deck && current < views.length - 1) { current++; render(); } }
function prev() { if (deck && current > 0) { current--; render(); } }

/** The lecture id for export — from the URL, else the loaded deck (sessionStorage / server). */
function lectureIdForExport() { return params.get('lectureId') || (deck && deck.lectureId) || ''; }

/** Render this lecture to a real .pptx via the presentation generator and download it.
 *  Posts to /lectures/:id/pptx, which saves to the student's Files store and returns a URL. */
async function exportPptx() {
  var lectureId = lectureIdForExport();
  if (!lectureId) { alert('Open a saved lecture to export it to PowerPoint.'); return; }
  var btn = document.getElementById('pptxBtn');
  var label = btn.textContent; btn.disabled = true; btn.textContent = 'Building…';
  try {
    var resp = await fetch('/api/education/lectures/' + encodeURIComponent(lectureId) + '/pptx', { method: 'POST' });
    var data = await resp.json().catch(function () { return {}; });
    if (!resp.ok) throw new Error(data.error || ('Export failed (' + resp.status + ')'));
    var link = data.downloadUrl || data.url;
    if (!link) throw new Error('No download link was returned.');
    window.location.href = link;
    btn.textContent = '✓ Saved';
  } catch (e) {
    alert('Could not export to PowerPoint: ' + e.message);
    btn.textContent = label;
  } finally {
    btn.disabled = false;
    setTimeout(function () { btn.textContent = label; }, 3000);
  }
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  if (e.key === 'Escape') goBack();
});

function showError(msg) {
  var stage = document.getElementById('stage');
  var old = stage.querySelector('.slide, .loading, .errorbox');
  if (old) old.remove();
  var el = document.createElement('div');
  el.className = 'errorbox';
  el.textContent = msg;
  stage.insertBefore(el, stage.querySelector('.nav-hint'));
}

/** Standalone entry: list the student's lectures that have a generated deck so
 *  they can open one. Our own presentation creator — no external service. */
async function showPicker() {
  var stage = document.getElementById('stage');
  var old = stage.querySelector('.slide, .loading, .errorbox, .pickerbox');
  if (old) old.remove();
  var box = document.createElement('div');
  box.className = 'pickerbox';
  box.style.cssText = 'max-width:560px;margin:0 auto;text-align:left;width:100%;';
  box.innerHTML = '<div class="loading">Loading your presentations…</div>';
  stage.insertBefore(box, stage.querySelector('.nav-hint'));
  try {
    var resp = await fetch('/api/education/lectures/recent?limit=30');
    var data = resp.ok ? await resp.json() : { lectures: [] };
    var withSlides = (data.lectures || []).filter(function (l) { return l.has_slides; });
    if (!withSlides.length) {
      box.innerHTML = '<h2 style="margin-bottom:8px;">Your presentations</h2><p style="opacity:0.8;">None yet — record a lecture and you\'ll get a replay presentation here automatically.</p>';
      return;
    }
    box.innerHTML = '<h2 style="margin-bottom:12px;">Your presentations</h2>' + withSlides.map(function (l) {
      var label = (l.class_name || 'Lecture') + ' — ' + String(l.lecture_date || '').slice(0, 10);
      return '<a href="?lectureId=' + encodeURIComponent(l.lecture_id) +
        (l.class_id ? '&classId=' + encodeURIComponent(l.class_id) : '') +
        '" style="display:block;padding:12px 16px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.15);border-radius:12px;text-decoration:none;color:inherit;">&#9654;&nbsp; ' + esc(label) + '</a>';
    }).join('');
  } catch (e) {
    box.innerHTML = '<p>Could not load your presentations.</p>';
  }
}

/** Load the deck: freshly-generated (sessionStorage handoff from the recorder)
 *  beats a server roundtrip; otherwise fetch by lectureId. */
async function load() {
  var lectureId = params.get('lectureId');
  try {
    var cached = sessionStorage.getItem('lm-slides-preview');
    if (cached) {
      var c = JSON.parse(cached);
      if (!lectureId || c.lectureId === lectureId) { deck = c; }
    }
  } catch (_e) { /* fall through to fetch */ }

  if (!deck && lectureId) {
    try {
      var resp = await fetch('/api/education/lectures/' + encodeURIComponent(lectureId) + '/slides');
      if (!resp.ok) {
        var err = await resp.json().catch(function () { return {}; });
        showError(err.error || 'Could not load this presentation.');
        return;
      }
      deck = await resp.json();
    } catch (e) {
      showError('Could not load this presentation: ' + e.message);
      return;
    }
  }

  // Opened standalone (no lecture chosen) → show a picker of your presentations.
  if (!deck && !lectureId) { return showPicker(); }

  if (!deck || !Array.isArray(deck.slides) || deck.slides.length === 0) {
    showError('No presentation here yet. Record a lecture first, then come back!');
    return;
  }

  document.getElementById('deckTitle').textContent = deck.title || 'Lecture Presentation';
  if (lectureIdForExport()) document.getElementById('pptxBtn').style.display = '';
  buildViews();
  current = 0;
  render();
}

load();
</script>
</body>
</html>
