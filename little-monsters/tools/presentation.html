<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Monsters — Lecture Presentation</title>
<!--
  CHANGE LOG
  ---------------------------------------------------------------------------
  DATE           | AUTHOR                    | DESCRIPTION
  ---------------------------------------------------------------------------
  2026-06-12     | roger.murphy@agenticfederal.us   | Lightweight lecture slide player — replays the deck generated by /process-transcript (no deck engine, no deps). Loads ?lectureId= via the slides endpoint or the just-generated deck from sessionStorage.
  2026-06-17     | roger.murphy@emeraldcoastsystemsgroup.com | Export to PowerPoint: a topbar button POSTs /lectures/:lectureId/pptx (the presentation generator) and downloads the saved .pptx.
  2026-09-26     | maintainer@emeraldcoastsystemsgroup.com     | Little Monsters design system: shared theme bootstrap (classroom default), package stylesheet and page frame replace the per-page theme reader, cockpit theme links and glass; the bar, arrows, progress and end-of-deck actions use the system's buttons and progress with tokens only (the hard-coded gradient and white-on-dark assumptions are gone); the lecture picker is a real list with an honest, role-aware empty state; Close returns to the class (or the dashboard) through the page frame instead of the teacher-only recorder; toasts replace alerts
  ---------------------------------------------------------------------------
-->
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css">
<script src="/shared/ui/js/surface-theme.js" data-theme-default="classroom"></script>
<link rel="stylesheet" href="/api/education/education.css">
<style>
  /* The player is a full-height stage, not a scrolling page. */
  html, body { height: 100%; }
  body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  .deck { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; }

  .deck-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px var(--lm-gutter); border-bottom: 1px solid var(--lm-line); background: var(--lm-card); }
  .deck-title { font-weight: 800; font-size: 15px; min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .deck-actions { display: flex; gap: 6px; flex: 0 0 auto; }

  .deck-stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 24px 72px; cursor: pointer; user-select: none; overflow: hidden; }
  .deck.is-browsing .deck-stage { cursor: default; user-select: auto; align-items: flex-start; overflow-y: auto; padding: clamp(16px, 2.5vw, 28px) var(--lm-gutter) 40px; }
  .deck.is-browsing .deck-arrow, .deck.is-browsing .deck-hint, .deck.is-browsing .deck-foot { display: none; }
  .pickerbox { width: 100%; max-width: 640px; margin: 0 auto; }
  a.lm-item { text-decoration: none; color: inherit; }

  .slide { max-width: 760px; width: 100%; text-align: center; animation: lm-pop 0.35s ease; }
  .slide .emoji { font-size: 64px; line-height: 1; margin-bottom: 18px; }
  .slide h1, .slide h2 { font-family: var(--lm-font-display); font-weight: 400; letter-spacing: -0.5px; line-height: 1.15; }
  .slide h2 { font-size: clamp(26px, 4.5vw, 42px); margin-bottom: 22px; }
  .slide ul { list-style: none; display: inline-block; text-align: left; }
  .slide li { font-size: clamp(17px, 2.4vw, 22px); line-height: 1.45; margin: 12px 0; padding-left: 30px; position: relative; color: var(--lm-ink); opacity: 0; animation: bullet-in 0.3s ease forwards; }
  .slide li::before { content: '✦'; position: absolute; left: 0; color: var(--lm-accent); }
  .slide li:nth-child(1) { animation-delay: 0.10s; }
  .slide li:nth-child(2) { animation-delay: 0.25s; }
  .slide li:nth-child(3) { animation-delay: 0.40s; }
  .slide li:nth-child(4) { animation-delay: 0.55s; }
  .slide li:nth-child(5) { animation-delay: 0.70s; }
  .slide li:nth-child(6) { animation-delay: 0.85s; }
  @keyframes bullet-in { to { opacity: 1; } }
  .slide.title-slide h1 { font-size: clamp(32px, 6vw, 54px); margin-bottom: 14px; }
  .slide.title-slide .sub { color: var(--lm-ink-2); font-size: 17px; }
  .slide .end-actions { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .deck-hint { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--lm-muted); pointer-events: none; }
  .deck-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: var(--lm-card); font-size: 18px; z-index: 2; }
  .deck-arrow:hover { transform: translateY(-50%); }
  .deck-arrow.prev { left: 14px; }
  .deck-arrow.next { right: 14px; }
  .deck-foot { flex: 0 0 auto; padding: 12px var(--lm-gutter) 16px; }
  .deck-counter { text-align: center; font-size: 12.5px; color: var(--lm-muted); margin-top: 8px; font-variant-numeric: tabular-nums; }

  @media (max-width: 640px) {
    .deck-bar { padding: 8px 10px; }
    .deck-stage { padding: 12px 54px; }
    .deck-arrow.prev { left: 6px; }
    .deck-arrow.next { right: 6px; }
    .deck-foot { padding: 8px 12px 12px; }
  }
</style>
</head>
<body>

<main class="deck" id="deck" aria-label="Lecture presentation">
  <header class="deck-bar">
    <span class="deck-title" id="deckTitle">Presentations</span>
    <div class="deck-actions">
      <button type="button" class="lm-btn lm-btn-ghost hide" id="pptxBtn" onclick="exportPptx()">⬇ PowerPoint</button>
      <button type="button" class="lm-btn lm-btn-quiet" onclick="goBack()">✕ Close</button>
    </div>
  </header>

  <div class="deck-stage" id="stage" onclick="next()">
    <div class="lm-loading" id="loading">Loading your presentation…</div>
    <button type="button" class="lm-btn lm-btn-ghost lm-btn-icon deck-arrow prev" id="prevBtn" onclick="event.stopPropagation(); prev()" aria-label="Previous slide">←</button>
    <button type="button" class="lm-btn lm-btn-ghost lm-btn-icon deck-arrow next" id="nextBtn" onclick="event.stopPropagation(); next()" aria-label="Next slide">→</button>
    <div class="deck-hint" id="navHint">tap, →, or space to continue</div>
  </div>

  <footer class="deck-foot">
    <div class="lm-progress is-thin" aria-hidden="true"><span id="progressFill"></span></div>
    <div class="deck-counter" id="counter"></div>
  </footer>
</main>

<script src="/api/education/mascot.js?v=4"></script>
<script>
/**
 * Lecture presentation player. The "deck" is plain JSON produced by the same
 * LLM pass that makes notes + flashcards: [{title, bullets[], emoji}].
 * Slide 0 is a synthesized title slide; the last slide is a synthesized
 * "you did it" slide with study links. No deck engine, no dependencies.
 */
var deck = null;     // {title, className, slides:[...]}
var current = 0;     // index into views
var views = [];      // [{type:'title'}|{type:'slide',i}|{type:'end'}]
var params = new URLSearchParams(location.search);
var esc = window.LM.esc;

/** Leave the player: back to the lecture's class when it is known, else the dashboard. */
function goBack() {
  var classId = params.get('classId') || (deck && deck.classId) || '';
  if (classId) window.LM.openClass(classId); else window.LM.navigate('dashboard');
}

function buildViews() {
  views = [{ type: 'title' }];
  for (var i = 0; i < deck.slides.length; i++) views.push({ type: 'slide', i: i });
  views.push({ type: 'end' });
}

/** Remove whatever the stage is showing (a slide, the loader, an error or the picker). */
function clearStage() {
  var stage = document.getElementById('stage');
  stage.querySelectorAll('.slide, #loading, .errorbox, .pickerbox').forEach(function (n) { n.remove(); });
  return stage;
}

function render() {
  var stage = clearStage();
  document.getElementById('deck').classList.remove('is-browsing');

  var v = views[current];
  var el = document.createElement('div');
  el.className = 'slide';

  if (v.type === 'title') {
    el.classList.add('title-slide');
    el.innerHTML = '<div class="emoji">🎬</div><h1>' + esc(deck.title || 'Your lecture') + '</h1>' +
      '<div class="sub">' + esc(deck.className || '') + (deck.className ? ' — ' : '') + 'let’s replay what was covered</div>';
  } else if (v.type === 'end') {
    var classId = params.get('classId') || deck.classId || '';
    var setId = params.get('setId') || '';
    var fcUrl = '/api/education/flashcards?' + (setId ? 'setId=' + encodeURIComponent(setId) + '&' : '') + (classId ? 'classId=' + encodeURIComponent(classId) : '');
    var quizUrl = '/api/education/quiz' + (classId ? '?classId=' + encodeURIComponent(classId) : '');
    el.classList.add('title-slide');
    el.innerHTML = '<div class="emoji">🎉</div><h1>You did it!</h1>' +
      '<div class="sub">That’s the whole lecture. Lock it in while it’s fresh:</div>' +
      '<div class="end-actions">' +
      '<a class="lm-btn lm-btn-primary lm-btn-lg" href="' + fcUrl + '">🃏 Study the flashcards</a>' +
      '<a class="lm-btn lm-btn-ghost lm-btn-lg" href="' + quizUrl + '">📝 Take a quick quiz</a>' +
      '</div>';
  } else {
    var s = deck.slides[v.i];
    var bullets = (s.bullets || []).map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('');
    el.innerHTML = (s.emoji ? '<div class="emoji">' + esc(s.emoji) + '</div>' : '') +
      '<h2>' + esc(s.title) + '</h2>' + (bullets ? '<ul>' + bullets + '</ul>' : '');
  }

  stage.insertBefore(el, document.getElementById('navHint'));

  var pct = views.length > 1 ? (current / (views.length - 1)) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('counter').textContent = (current + 1) + ' / ' + views.length;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === views.length - 1;
}

function next() { if (deck && current < views.length - 1) { current++; render(); } }
function prev() { if (deck && current > 0) { current--; render(); } }

/** The lecture id for export — from the URL, else the loaded deck (sessionStorage / server). */
function lectureIdForExport() { return params.get('lectureId') || (deck && deck.lectureId) || ''; }

/** Render this lecture to a real .pptx via the presentation generator and download it.
 *  Posts to /lectures/:id/pptx, which saves to the caller's Files store and returns a URL. */
async function exportPptx() {
  var lectureId = lectureIdForExport();
  if (!lectureId) { window.LM.toast('Open a saved lecture to export it to PowerPoint.'); return; }
  var btn = document.getElementById('pptxBtn');
  var label = btn.textContent; btn.disabled = true; btn.textContent = 'Building…';
  try {
    var resp = await fetch('/api/education/lectures/' + encodeURIComponent(lectureId) + '/pptx', { method: 'POST' });
    var data = await resp.json().catch(function () { return {}; });
    if (!resp.ok) throw new Error(data.error || ('Export failed (' + resp.status + ')'));
    var link = data.downloadUrl || data.url;
    if (!link) throw new Error('No download link was returned.');
    window.location.href = link;
    btn.textContent = '✓ Saved';
  } catch (e) {
    window.LM.toast('Could not export to PowerPoint: ' + e.message);
    btn.textContent = label;
  } finally {
    btn.disabled = false;
    setTimeout(function () { btn.textContent = label; }, 3000);
  }
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  if (e.key === 'Escape') goBack();
});

function showError(msg) {
  var stage = clearStage();
  document.getElementById('deck').classList.add('is-browsing');
  var el = document.createElement('div');
  el.className = 'lm-empty errorbox pickerbox';
  el.innerHTML = '<div class="lm-empty-icon">☁️</div><strong>This presentation could not be opened.</strong><span></span>';
  el.querySelector('span').textContent = msg;
  stage.insertBefore(el, document.getElementById('navHint'));
}

/** The empty state is honest about who makes presentations: a teacher can go record one,
 *  a learner is told the replay arrives with the lecture, and an unknown identity gets neither claim. */
function emptyPicker(who) {
  var role = who && who.role;
  var teacher = role === 'teacher' || role === 'admin';
  var text = teacher ? 'Record a lecture and its replay presentation appears here automatically.'
    : role === 'student' ? 'When your teacher records a lecture, its replay appears here with the flashcards and notes.'
    : 'Recorded lectures with a replay appear here.';
  return '<div class="lm-empty"><div class="lm-empty-icon">🎬</div><strong>No presentations yet.</strong>' + text +
    '<div><button type="button" class="lm-btn lm-btn-primary" id="emptyCta" data-view="' + (teacher ? 'recorder' : 'dashboard') + '">' +
    (teacher ? '🎤 Record a lecture' : 'Back to my dashboard') + '</button></div></div>';
}

/** Standalone entry: list the caller's lectures that have a generated deck so
 *  they can open one. Our own presentation creator — no external service. */
async function showPicker() {
  var stage = clearStage();
  document.getElementById('deck').classList.add('is-browsing');
  var box = document.createElement('div');
  box.className = 'pickerbox';
  var head = '<div class="lm-section-head"><h2 class="lm-display">Your presentations</h2><span class="lm-subtle lm-small" id="deckCount"></span></div>';
  box.innerHTML = head + '<div class="lm-loading">Loading your presentations…</div>';
  stage.insertBefore(box, document.getElementById('navHint'));
  try {
    var resp = await fetch('/api/education/lectures/recent?limit=30');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    var data = await resp.json();
    var withSlides = (data.lectures || []).filter(function (l) { return l.has_slides; });
    if (!withSlides.length) {
      var who = null;
      try { who = await window.LM.me(); } catch (_e) { who = null; }
      box.innerHTML = head + emptyPicker(who);
      var cta = document.getElementById('emptyCta');
      cta.addEventListener('click', function (e) { e.stopPropagation(); window.LM.navigate(cta.getAttribute('data-view')); });
      return;
    }
    box.innerHTML = head + '<ul class="lm-list">' + withSlides.map(function (l) {
      var date = String(l.lecture_date || '').slice(0, 10);
      var href = '?lectureId=' + encodeURIComponent(l.lecture_id) + (l.class_id ? '&classId=' + encodeURIComponent(l.class_id) : '');
      return '<li><a class="lm-item is-clickable" href="' + href + '">' +
        '<span class="lm-tile-icon" aria-hidden="true">▶</span>' +
        '<span class="lm-item-body"><strong>' + esc(l.class_name || 'Lecture') + '</strong>' + (date ? '<small>' + esc(date) + '</small>' : '') + '</span>' +
        '</a></li>';
    }).join('') + '</ul>';
    document.getElementById('deckCount').textContent = withSlides.length + (withSlides.length === 1 ? ' presentation' : ' presentations');
  } catch (e) {
    box.innerHTML = head + '<div class="lm-empty"><div class="lm-empty-icon">☁️</div><strong>Your presentations could not be loaded right now.</strong>Nothing is assumed in their place; try again in a moment.</div>';
  }
}

/** Load the deck: freshly-generated (sessionStorage handoff from the recorder)
 *  beats a server roundtrip; otherwise fetch by lectureId. */
async function load() {
  var lectureId = params.get('lectureId');
  try {
    var cached = sessionStorage.getItem('lm-slides-preview');
    if (cached) {
      var c = JSON.parse(cached);
      if (!lectureId || c.lectureId === lectureId) { deck = c; }
    }
  } catch (_e) { /* fall through to fetch */ }

  if (!deck && lectureId) {
    try {
      var resp = await fetch('/api/education/lectures/' + encodeURIComponent(lectureId) + '/slides');
      if (!resp.ok) {
        var err = await resp.json().catch(function () { return {}; });
        showError(err.error || 'Could not load this presentation.');
        return;
      }
      deck = await resp.json();
    } catch (e) {
      showError('Could not load this presentation: ' + e.message);
      return;
    }
  }

  // Opened standalone (no lecture chosen) → show a picker of your presentations.
  if (!deck && !lectureId) { return showPicker(); }

  if (!deck || !Array.isArray(deck.slides) || deck.slides.length === 0) {
    showError('This lecture has no presentation yet.');
    return;
  }

  document.getElementById('deckTitle').textContent = deck.title || 'Lecture presentation';
  if (lectureIdForExport()) document.getElementById('pptxBtn').classList.remove('hide');
  buildViews();
  current = 0;
  render();
}

load();
</script>
</body>
</html>
