<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Monsters - My Monsters</title>
<script>
(function(){function a(n){if(!n)return;document.documentElement.setAttribute('data-theme',n);var h='/cockpit/css/themes/'+n+'.css',l=document.querySelector('link[data-lm-theme-link]');if(l){if(l.getAttribute('href')!==h)l.setAttribute('href',h);return;}l=document.createElement('link');l.rel='stylesheet';l.href=h;l.setAttribute('data-lm-theme-link','1');document.head.appendChild(l);}function i(){try{if(window.parent&&window.parent!==window){var p=window.parent.document.documentElement.getAttribute('data-theme');if(p)return p;}}catch(e){}try{var s=localStorage.getItem('cockpit-theme');if(s)return s;}catch(e){}return 'little-monsters';}a(i());try{if(window.parent&&window.parent!==window){var ph=window.parent.document.documentElement;new MutationObserver(function(m){for(var k=0;k<m.length;k++)if(m[k].attributeName==='data-theme'){var t=ph.getAttribute('data-theme');if(t)a(t);}}).observe(ph,{attributes:true,attributeFilter:['data-theme']});}}catch(e){}})();
</script>
<link rel="stylesheet" href="/api/education/education.css">
<style>
  body{margin:0;color:var(--text-primary,#fdeaf6);font-family:system-ui,'Inter',sans-serif;}
  .wrap{padding:22px clamp(14px,4vw,40px) 70px;max-width:820px;}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
  h1{margin:0;font-size:clamp(20px,3vw,28px);}
  .lvl{margin-left:auto;text-align:right;font-size:12px;color:var(--text-muted);}
  .lvl b{display:block;font-size:18px;color:var(--accent-primary,#ec4faa);}
  /* Avatar */
  .stage{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0 18px;}
  .avatar{position:relative;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle at 50% 40%, rgba(236,79,170,.18), transparent 70%);display:flex;align-items:center;justify-content:center;}
  .avatar img{width:88%;height:88%;object-fit:contain;animation:bob 3s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .acc{position:absolute;font-size:46px;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
  .acc.top{top:2px;left:50%;transform:translateX(-50%);}
  .acc.eyes{top:43%;left:50%;transform:translate(-50%,-50%);font-size:40px;}
  .acc.side{bottom:14%;right:14%;font-size:38px;}
  .name{font-weight:800;font-size:18px;}
  @keyframes rainbow{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
  /* ── Tricks (the animation hook) ── */
  .avatar img.t-spin{animation:tSpin 1.1s ease;}@keyframes tSpin{to{transform:rotate(360deg)}}
  .avatar img.t-jump{animation:tJump .7s ease 2;}@keyframes tJump{0%,100%{transform:translateY(0)}40%{transform:translateY(-46px) scale(1.05)}}
  .avatar img.t-wiggle{animation:tWig .5s ease 3;}@keyframes tWig{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
  .avatar img.t-dance{animation:tDance .6s ease 3;}@keyframes tDance{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-16px) rotate(-8deg)}75%{transform:translateX(16px) rotate(8deg)}}
  .avatar img.t-flip{animation:tFlip 1s ease;}@keyframes tFlip{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-60px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
  .trickbar{background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:14px;text-align:center;margin-bottom:18px;}
  .trickbar .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
  .trickbar .tbtn{background:var(--bg-secondary);border:1px solid var(--border-color);color:var(--text-primary);border-radius:12px;padding:9px 16px;font-weight:800;cursor:pointer;}
  .trickbar .tbtn:hover{border-color:var(--accent-primary,#ec4faa);}
  .parade{position:fixed;left:0;right:0;bottom:0;height:90px;pointer-events:none;z-index:40;overflow:hidden;}
  .parade .p{position:absolute;bottom:6px;width:62px;height:62px;object-fit:contain;animation:march linear forwards;}
  @keyframes march{from{left:-70px}to{left:105%}}
  @keyframes step{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .newtrick{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;background:var(--accent-primary,#ec4faa);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;box-shadow:0 8px 24px -8px rgba(0,0,0,.5);display:none;}
  .newtrick.on{display:block;animation:ntPop .4s ease;}@keyframes ntPop{from{transform:translateX(-50%) scale(.7);opacity:0}}
  /* Boxes */
  .boxbar{background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:16px;text-align:center;margin-bottom:18px;}
  .boxbar .btn{background:var(--accent-primary,#ec4faa);color:#fff;border:none;border-radius:12px;padding:12px 22px;font-weight:800;cursor:pointer;font-size:15px;}
  .boxbar .btn:disabled{opacity:.5;cursor:default;}
  .picker{display:none;justify-content:center;gap:18px;margin-top:14px;}
  .picker.on{display:flex;}
  .gift{font-size:64px;cursor:pointer;transition:.15s;animation:wiggle 1.2s ease-in-out infinite;}
  .gift:hover{transform:scale(1.12) translateY(-4px);}
  .gift.dim{opacity:.25;pointer-events:none;animation:none;}
  .gift.win{animation:pop .5s ease;}
  @keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
  .reveal{text-align:center;margin-top:8px;font-size:15px;font-weight:800;min-height:22px;}
  /* Collection */
  .tabs{display:flex;gap:8px;margin-bottom:12px;}
  .tabs button{border:1px solid var(--border-color);background:var(--bg-secondary);color:var(--text-secondary);
    border-radius:999px;padding:7px 16px;font-weight:700;font-size:13px;cursor:pointer;}
  .tabs button.on{background:var(--accent-primary,#ec4faa);color:#fff;border-color:transparent;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;}
  .it{border:1px solid var(--border-color);border-radius:14px;background:var(--bg-card);padding:12px;text-align:center;cursor:pointer;transition:.15s;}
  .it.locked{opacity:.45;cursor:default;}
  .it.eq{border-color:var(--accent-primary,#ec4faa);box-shadow:0 0 0 2px var(--accent-primary,#ec4faa) inset;}
  .it .pic{width:62px;height:62px;margin:0 auto;display:flex;align-items:center;justify-content:center;}
  .it .pic img{width:100%;height:100%;object-fit:contain;}
  .it .pic .em{font-size:42px;}
  .it .nm{font-weight:700;font-size:12px;margin-top:6px;}
  .it .ra{font-size:10px;margin-top:2px;text-transform:uppercase;letter-spacing:.05em;}
  .ra.common{color:#9fb3c8}.ra.uncommon{color:#46d39a}.ra.rare{color:#5b8def}.ra.legendary{color:#f6c945}
  .hint{font-size:12px;color:var(--text-muted);margin-top:8px;}
</style>
  <link rel="stylesheet" href="/shared/ui/css/surface-glass.css" />
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>🧸 My Monsters</h1>
    <div class="lvl"><b id="lvl">Lv 1</b><span id="xp">0 XP</span></div>
  </div>

  <div class="stage">
    <div class="avatar" id="avatar"><img id="avImg" src="/api/education/mascot.png" alt="your monster"><span class="acc" id="avAcc" style="display:none"></span></div>
    <div class="name" id="avName">Pinky</div>
  </div>

  <div class="boxbar">
    <div id="boxMsg" style="font-weight:800;font-size:16px;">🎁 Mystery boxes: <span id="boxCount">0</span></div>
    <div class="hint" id="boxHint">Play games, ace quizzes and study to level up — every level drops a box!</div>
    <button class="btn" id="openBtn" style="margin-top:10px;" onclick="startOpen()" disabled>Open a box</button>
    <div class="picker" id="picker">
      <span class="gift" data-b="0" onclick="pick(0)">🎁</span>
      <span class="gift" data-b="1" onclick="pick(1)">🎁</span>
      <span class="gift" data-b="2" onclick="pick(2)">🎁</span>
    </div>
    <div class="reveal" id="reveal"></div>
  </div>

  <div class="trickbar">
    <div style="font-weight:800;font-size:15px;">🎬 Monster Tricks</div>
    <div class="small" style="color:var(--text-muted);font-size:12px;margin-top:2px;">Your monster loves to show off — and learns a new trick every time you open a gift!</div>
    <div class="btns">
      <button class="tbtn" onclick="playTrick()">✨ Do a trick!</button>
      <button class="tbtn" onclick="parade()">🥳 Parade!</button>
    </div>
  </div>

  <div class="tabs">
    <button id="tabMon" class="on" onclick="setTab('monster')">Monsters</button>
    <button id="tabAcc" onclick="setTab('accessory')">Accessories</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="hint" id="collHint"></div>
</div>

<div class="parade" id="parade"></div>
<div class="newtrick" id="newtrick"></div>
<script>
var MASCOT='/api/education/mascot.png';
var state=null, tab='monster';
// ── Tricks / animation hook ──
var TRICKS=['t-spin','t-jump','t-wiggle','t-dance','t-flip'];
var trickTimer=null;
function playTrick(name){
  var img=document.getElementById('avImg'); if(!img) return;
  TRICKS.forEach(function(t){ img.classList.remove(t); });
  void img.offsetWidth; // restart animation
  img.classList.add(name || TRICKS[Math.random()*TRICKS.length|0]);
}
function skinOf(id){ var it=findItem(id); if(!it) return ''; if(it.rainbow) return 'animation:march linear forwards, rainbow 4s linear infinite;'; return 'filter:hue-rotate('+(Number(it.hue)||0)+'deg)'+(it.sat?(' saturate('+(Number(it.sat)||1)+')'):'')+';'; }
function parade(){
  if(!state) return;
  var box=document.getElementById('parade'); box.innerHTML='';
  var owned=(state.inventory||['mon-pink']).filter(function(id){ return findItem(id) && findItem(id).type==='monster'; });
  if(!owned.length) owned=['mon-pink'];
  owned.forEach(function(id,i){
    var img=document.createElement('img'); img.className='p'; img.src=MASCOT;
    var sk=skinOf(id); img.setAttribute('style',sk+'animation-duration:'+(3.2+i*0.4)+'s;animation-delay:'+(i*0.5)+'s;');
    box.appendChild(img);
    setTimeout(function(){ if(img.parentNode) img.remove(); }, (3.2+i*0.4+i*0.5)*1000+400);
  });
}
function newTrick(name){
  var n=document.getElementById('newtrick'); n.textContent='🎉 '+(name||'Your monster')+' learned a new trick!';
  n.classList.add('on'); setTimeout(function(){ n.classList.remove('on'); },2600);
  setTimeout(function(){ playTrick('t-flip'); }, 400);
}
function startTrickIdle(){ if(trickTimer) clearInterval(trickTimer); trickTimer=setInterval(function(){ if(document.visibilityState==='visible') playTrick(); }, 26000); }

function skinStyle(item){
  if(!item) return '';
  if(item.rainbow) return 'animation:bob 3s ease-in-out infinite, rainbow 6s linear infinite;';
  // Coerce to numbers so the value can only ever be a CSS angle/factor (no style injection).
  var s='filter:hue-rotate('+(Number(item.hue)||0)+'deg)';
  if(item.sat) s+=' saturate('+(Number(item.sat)||1)+')';
  return s+';';
}
function findItem(id){ return state && state.catalog ? state.catalog.find(function(i){return i.id===id;}) : null; }

async function loadState(){
  try{ var r=await fetch('/api/education/rewards'); state = r.ok ? await r.json() : null; }catch(e){ state=null; }
  if(!state){ document.getElementById('collHint').textContent='Could not load your collection.'; return; }
  document.getElementById('lvl').textContent='Lv '+(state.level||1);
  document.getElementById('xp').textContent=(state.xp||0)+' XP';
  document.getElementById('boxCount').textContent=state.boxes||0;
  document.getElementById('openBtn').disabled = !(state.boxes>0);
  document.getElementById('boxHint').style.display = state.boxes>0 ? 'none':'block';
  renderAvatar(); renderGrid();
  startTrickIdle();
}

function renderAvatar(){
  var eq=state.equipped||{};
  var mon=findItem(eq.monster)||findItem('mon-pink');
  var img=document.getElementById('avImg');
  img.src=MASCOT; img.style.cssText=skinStyle(mon);
  document.getElementById('avName').textContent = mon? mon.name : 'Pinky';
  var accEl=document.getElementById('avAcc');
  var acc=findItem(eq.accessory);
  if(acc){ accEl.textContent=acc.emoji; accEl.className='acc '+(acc.pos||'top'); accEl.style.display=''; }
  else { accEl.style.display='none'; }
}

function renderGrid(){
  var owned=new Set(state.inventory||['mon-pink']);
  var eq=state.equipped||{};
  var items=(state.catalog||[]).filter(function(i){return i.type===tab;});
  var grid=document.getElementById('grid'); grid.innerHTML='';
  items.forEach(function(it){
    var have = it.id==='mon-pink' || owned.has(it.id);
    var equipped = eq[it.type]===it.id;
    var d=document.createElement('div'); d.className='it'+(have?'':' locked')+(equipped?' eq':'');
    var pic = it.type==='monster'
      ? '<img src="'+MASCOT+'" style="'+(have?skinStyle(it):'filter:grayscale(1) opacity(.6)')+'">'
      : '<span class="em">'+(have?it.emoji:'❔')+'</span>';
    d.innerHTML='<div class="pic">'+pic+'</div><div class="nm">'+(have?it.name:'Locked')+'</div>'
      +'<div class="ra '+it.rarity+'">'+it.rarity+'</div>';
    if(have){ d.onclick=function(){ equip(it, equipped); }; }
    grid.appendChild(d);
  });
  var ownedCount=(state.inventory||[]).length, total=(state.catalog||[]).length;
  document.getElementById('collHint').textContent='Collected '+ownedCount+' of '+total+'. Tap one you own to wear it.';
}

async function equip(it, alreadyEquipped){
  // Tapping an equipped accessory takes it off.
  var id = (it.type==='accessory' && alreadyEquipped) ? 'none-accessory' : it.id;
  try{ await fetch('/api/education/rewards/equip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({itemId:id})}); }catch(e){}
  await loadState();
}

function setTab(t){ tab=t; document.getElementById('tabMon').classList.toggle('on',t==='monster');
  document.getElementById('tabAcc').classList.toggle('on',t==='accessory'); renderGrid(); }

// ── Box opening: pick 1 of 3 ──
var opening=false;
function startOpen(){
  if(opening || !(state.boxes>0)) return;
  opening=true;
  document.getElementById('openBtn').disabled=true;
  document.getElementById('reveal').textContent='Pick a box!';
  var p=document.getElementById('picker'); p.classList.add('on');
  p.querySelectorAll('.gift').forEach(function(g){ g.className='gift'; });
}
async function pick(b){
  if(!opening) return; opening=false;
  var gifts=document.getElementById('picker').querySelectorAll('.gift');
  gifts.forEach(function(g,i){ if(i!==b) g.classList.add('dim'); });
  var chosen=gifts[b]; chosen.classList.add('win');
  var rv=document.getElementById('reveal'); rv.textContent='Opening…';
  try{
    var r=await fetch('/api/education/rewards/open',{method:'POST',headers:{'Content-Type':'application/json'}});
    var d=await r.json();
    if(!r.ok){ rv.textContent=d.error||'Could not open.'; resetPicker(); await loadState(); return; }
    chosen.textContent = d.item.type==='monster' ? '🎉' : d.item.emoji;
    confetti();
    rv.innerHTML = d.duplicate
      ? 'Duplicate '+esc(d.item.name)+' — <b>+'+d.bonusXp+' XP</b> sparkle!'
      : 'You won <b>'+esc(d.item.name)+'</b>! <span class="ra '+d.item.rarity+'">'+d.item.rarity+'</span>';
    if(!d.duplicate) setTimeout(function(){ newTrick(d.item.name); }, 700);
    setTimeout(function(){ resetPicker(); loadState(); }, 1800);
  }catch(e){ rv.textContent='Something went wrong.'; resetPicker(); }
}
function resetPicker(){
  var p=document.getElementById('picker'); p.classList.remove('on');
  p.querySelectorAll('.gift').forEach(function(g){ g.className='gift'; g.textContent='🎁'; });
}
function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function confetti(){
  var cols=['#ec4faa','#5b8def','#46d39a','#f6c945','#a855f7'];
  for(var i=0;i<28;i++){ (function(){ var p=document.createElement('div');
    var c=cols[Math.floor(Math.random()*cols.length)], l=Math.random()*100, sz=6+Math.random()*7, du=1.4+Math.random()*1.4;
    p.style.cssText='position:fixed;top:-12px;left:'+l+'%;width:'+sz+'px;height:'+sz+'px;background:'+c+';z-index:99;border-radius:'+(Math.random()>0.5?'50%':'2px')+';animation:fall '+du+'s ease-in forwards;';
    document.body.appendChild(p); setTimeout(function(){p.remove();},du*1000+200); })(); }
  if(!document.getElementById('cfk')){ var s=document.createElement('style'); s.id='cfk'; s.textContent='@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:0}}'; document.head.appendChild(s); }
}
loadState();
</script>
</body>
</html>
