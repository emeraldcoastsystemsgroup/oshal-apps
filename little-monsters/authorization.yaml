# CHANGE LOG
# 1 | maintainer@emeraldcoastsystemsgroup.com | Import named school roles with explicit HTTP, bot and tutor handoff bindings; existing roster relationships still restrict every record.
# Own scope describes the caller and their existing school relationships, not every school record.
# Teacher and admin structural grants also require a current issuer-bound teacher/admin roster row.
# No wildcard HTTP binding: unknown paths, tool operations and jobs remain denied.
version: 1
resources:
  learner:
    scopes: [own]
  teaching:
    scopes: [own]
permissions:
  app.open:
    resource: learner
    effect: read
    minimumTier: viewer
  study.read:
    resource: learner
    effect: read
    minimumTier: viewer
  study.create:
    resource: learner
    effect: write
    minimumTier: editor
  study.change:
    resource: learner
    effect: write
    minimumTier: editor
  study.delete:
    resource: learner
    effect: write
    minimumTier: editor
  study.generate:
    resource: learner
    effect: execute
    minimumTier: editor
  class.create:
    resource: learner
    effect: write
    minimumTier: editor
  class.enroll:
    resource: learner
    effect: write
    minimumTier: editor
  material.create:
    resource: learner
    effect: write
    minimumTier: editor
  material.share:
    resource: learner
    effect: write
    minimumTier: editor
  material.delete:
    resource: learner
    effect: write
    minimumTier: editor
  lecture.create:
    resource: learner
    effect: write
    minimumTier: editor
  lecture.export:
    resource: learner
    effect: export
    minimumTier: editor
  tutor.execute:
    resource: learner
    effect: execute
    minimumTier: editor
  teaching.read:
    resource: teaching
    effect: read
    minimumTier: viewer
  class.change:
    resource: teaching
    effect: write
    minimumTier: editor
  class.delete:
    resource: teaching
    effect: write
    minimumTier: editor
  roster.change:
    resource: teaching
    effect: write
    minimumTier: editor
  assignment.create:
    resource: teaching
    effect: write
    minimumTier: editor
  material.moderate:
    resource: teaching
    effect: write
    minimumTier: editor
  class-study.generate:
    resource: teaching
    effect: execute
    minimumTier: editor
roles:
  student:
    tier: editor
    grants:
      - { permission: app.open, scope: own }
      - { permission: study.read, scope: own }
      - { permission: study.create, scope: own }
      - { permission: study.change, scope: own }
      - { permission: study.delete, scope: own }
      - { permission: study.generate, scope: own }
      - { permission: class.create, scope: own }
      - { permission: class.enroll, scope: own }
      - { permission: material.create, scope: own }
