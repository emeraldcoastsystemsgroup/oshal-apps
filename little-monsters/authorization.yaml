      - { permission: material.delete, scope: own }
      - { permission: lecture.create, scope: own }
      - { permission: lecture.export, scope: own }
      - { permission: tutor.execute, scope: own }
  teacher:
    tier: editor
    sensitive: true
    grants:
      - { permission: app.open, scope: own }
      - { permission: study.read, scope: own }
      - { permission: study.create, scope: own }
      - { permission: study.change, scope: own }
      - { permission: study.delete, scope: own }
      - { permission: study.generate, scope: own }
      - { permission: class.create, scope: own }
      - { permission: class.enroll, scope: own }
      - { permission: material.create, scope: own }
      - { permission: material.share, scope: own }
      - { permission: material.delete, scope: own }
      - { permission: lecture.create, scope: own }
      - { permission: lecture.export, scope: own }
      - { permission: tutor.execute, scope: own }
      - { permission: teaching.read, scope: own }
      - { permission: class.change, scope: own }
      - { permission: class.delete, scope: own }
      - { permission: roster.change, scope: own }
      - { permission: assignment.create, scope: own }
      - { permission: material.moderate, scope: own }
      - { permission: class-study.generate, scope: own }
  admin:
    tier: admin
    sensitive: true
    grants:
      - { permission: app.open, scope: own }
      - { permission: study.read, scope: own }
      - { permission: study.create, scope: own }
      - { permission: study.change, scope: own }
      - { permission: study.delete, scope: own }
      - { permission: study.generate, scope: own }
      - { permission: class.create, scope: own }
      - { permission: class.enroll, scope: own }
      - { permission: material.create, scope: own }
      - { permission: material.share, scope: own }
      - { permission: material.delete, scope: own }
      - { permission: lecture.create, scope: own }
      - { permission: lecture.export, scope: own }
      - { permission: tutor.execute, scope: own }
      - { permission: teaching.read, scope: own }
      - { permission: class.change, scope: own }
      - { permission: class.delete, scope: own }
      - { permission: roster.change, scope: own }
      - { permission: assignment.create, scope: own }
      - { permission: material.moderate, scope: own }
      - { permission: class-study.generate, scope: own }
