  - id: structural-roles
    name: Student and teaching structural roles
    purpose: >-
      Exercise the real core catalog, preview/apply, resource adapters and HTTP guard with synthetic school
      identities.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/authorization/catalog.test.cjs
    expected:
      - A student can study and upload without teaching, roster, moderation or platform management rights.
      - >-
        Teaching needs both a named structural grant and a current exact issuer/subject teacher or admin
        roster row.
      - >-
        Deny, revocation, unknown routes, missing identity relationships and cross-issuer matches remain
        refused.
      - Every shipped HTTP route, HEAD request, game file, bot and test suite has an explicit catalog binding.
      - >-
        The class-material hand-off (POST /import-artifact and its artifact action) needs material create and
        share, admits a student and a teacher, and refuses unassigned, share-denied and revoked actors.
    prerequisites:
      - runner:node-test
      - core:dependencies
      - harness:oshal-core-root
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures:
        - tests/authorization/fixture.cjs
        - src-routes/education-authorization.ts
        - src-routes/education-access.ts
        - authorization.yaml
      cleanup: >-
        Close the owned loopback HTTP server and discard synthetic in-memory policy and roster fixtures; no
        provider, live database or account writes.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 512
    installation: never
  - id: authorization-groups-delegation
    name: Directory-group grants and delegated AI through the real guards
    purpose: >-
      Prove group-derived and direct school roles differ through core's real policy, HTTP guard and controller execution
      guard (BotNodeClient and the inline orchestrator) for the tutor and study bots, with explicit deny and revocation.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/authorization/group-delegation.test.cjs
    expected:
      - >-
        A verified directory group mapped to the non-sensitive student role grants study and tutor functions; a direct
        teacher grant adds teaching functions the group member does not get, over the same HTTP routes.
      - >-
        A group-mapped deny wins over a direct grant and follows membership; clearing it restores exactly that
        permission; a whole-app group deny refuses everything.
      - >-
        Stale, overage (incomplete), foreign-tenant, future-dated and missing directory evidence refuse with
        authorization_directory_unavailable instead of guessing; unmapping a group revokes it.
      - Sensitive teacher and admin group mappings require an approval verifier and are refused without one.
      - >-
        The tutor and quiz bots are admitted for a granted learner and refused before any endpoint for an unassigned
        actor, a mismatched subject, an explicit tutor deny, and a direct or group grant revoked between queue and
        execution.
    prerequisites:
      - runner:node-test
      - core:dependencies
      - harness:oshal-core-root
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures:
        - tests/authorization/fixture.cjs
        - src-routes/education-authorization.ts
        - authorization.yaml
      cleanup: >-
        Close the owned loopback HTTP server, reset core's execution-policy port and discard the in-memory policy,
        roster and endpoint recorders; no provider, bot node, live database or account writes.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 512
    installation: never
  - id: authorization-record-rights-postgres
    name: School record rights on disposable PostgreSQL through the compiled routes
    purpose: >-
      Mount the compiled manifest entrypoint behind core's real HTTP guard over a private PostgreSQL 16 with every
      package migration applied as a NOSUPERUSER NOBYPASSRLS runtime role, and prove who reads and writes which records.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/authorization/record-rights-postgres.test.cjs
    expected:
      - >-
        A teacher's class list, analytics and roster contain only their own class; another teacher's class and the
        other school answer 403; a tenant admin reads their own school only.
      - >-
        A learner reads only their own dashboard and enrolled classes; another learner's dashboard is a
        non-revealing 404; a teacher sees only their class slice of a learner, and aggregates exclude other classes.
      - Roster writes succeed only into the teacher's own class and a refused write leaves no row.
      - Unassigned, denied and revoked actors are refused by the guard before any package handler SQL.
    prerequisites:
      - runner:node-test
      - core:dependencies
      - harness:oshal-core-root
      - harness:core-test-fixtures
      - engine-container:disposable-postgres
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures:
        - tests/authorization/school-postgres.fixture.cjs
        - tests/authorization/fixture.cjs
        - routes/education-routes.js
        - authorization.yaml
      cleanup: >-
        Close the loopback server and remove the uniquely named PostgreSQL container with its anonymous volumes;
        the machine-wide fixture slot is released. No deployment database is read or written.
    limits:
      timeoutMs: 300000
      maxMemoryMb: 1024
    installation: never
  - id: authorization-permission-ui
    name: Permission-aware Little Monsters pages in Chromium
    purpose: >-
      Drive the actual dashboard, teacher and Tutor pages in disposable Chromium contexts over the two-school
      PostgreSQL fixture and core's real guard, one synthetic person per context.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/authorization/permission-ui-browser.test.cjs
    expected:
      - A learner's dashboard paints only their own quiz average and enrolled classes and no teaching overview.
      - >-
        A learner requesting the teacher view receives a 403 with no page or roster data; an unassigned person
        receives core's role-guidance page instead of the dashboard.
      - The teacher view lists only the teacher's own class tile, roster and class average.
      - An explicit tutor deny refuses the Tutor turn from the real page and the page says it could not connect.
      - Revoking a teacher mid-session refuses the next analytics request and the next navigation.
    prerequisites:
      - runner:node-test
      - core:dependencies
      - harness:oshal-core-root
      - harness:core-test-fixtures
      - engine-container:disposable-postgres
      - browser:chromium
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures:
        - tests/authorization/school-postgres.fixture.cjs
        - tools/student-dashboard.html
        - tools/teacher-analytics.html
        - tools/tutor-chat.html
      cleanup: >-
        Close every browser context and Chromium, the loopback server, and remove the PostgreSQL container with its
        anonymous volumes; requests off the fixture origin are aborted.
    limits:
      timeoutMs: 300000
      maxMemoryMb: 1536
    installation: never
