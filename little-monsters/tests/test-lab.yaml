# CHANGE LOG
# 1 | maintainer@emeraldcoastsystemsgroup.com | Register all shipped suites, the new structural-role boundary and existing readiness smoke; legacy fixture gaps remain explicit.
version: 1
cases:
  - id: lm-authz
    name: Little Monsters authz
    purpose: Run the shipped dependency-free lm-authz suite over package sources and compiled route artifacts.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/lm-authz.test.cjs
    expected:
      - >-
        The existing package security or documentation contract passes using only synthetic records and local
        fixtures.
    prerequisites:
      - runner:node-test
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: >-
        Tests own only synthetic memory and temporary fixture directories; their cleanup hooks close and
        remove those fixtures.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 512
    installation: never
