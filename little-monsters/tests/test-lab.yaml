# CHANGE LOG
# 1 | maintainer@emeraldcoastsystemsgroup.com | Register all shipped suites, the new structural-role boundary and existing readiness smoke; legacy fixture gaps remain explicit.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Register tutor-shared-renderer: the Tutor proved as the app consumer of core's shared response renderer in Chromium over a loopback fixture (the framework-coupled gate discovers tests/tutor-renderer.core.spec.mjs by name). The live-port education-e2e case stays as the legacy full-stack variant.
# 3 | maintainer@emeraldcoastsystemsgroup.com | Register lm-artifact-import-behavior: the compiled class-material receiver driven over loopback HTTP (approved/requested outcomes, share-requests listing, and write-free refusals), and name the class-material hand-off in the structural-roles expectations now that the catalog binds it.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Register the enterprise-authorization pilot suites: directory-group grants and the delegated-AI execution guard (authorization-groups-delegation), record rights on a disposable PostgreSQL 16 through the compiled routes (authorization-record-rights-postgres) and the permission-aware pages in Chromium (authorization-permission-ui). All are isolated fixture evidence with installation: never; none is live acceptance.
version: 1
cases:
  - id: lm-artifact-import
    name: Little Monsters class-material artifact receiver
    purpose: Pin the owner-bound Send to… class picker and its authenticated material-import endpoint across source and compiled package artifacts.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/lm-artifact-import.test.cjs
    expected:
      - >-
        The class-material destination remains declared for images and PDFs, redeems through the shared
        owner-bound relay, and reuses the teacher-approved/requested lifecycle.
    prerequisites:
      - runner:node-test
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: >-
        The guard reads package files only and creates no persistent application data.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 512
    installation: never
  - id: lm-artifact-import-behavior
    name: Little Monsters class-material import outcomes
    purpose: >-
      Drive the compiled POST /import-artifact receiver over loopback HTTP and prove who may file a Send to…
      document into which class, with which share state, and that every refusal writes nothing.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/lm-artifact-import-behavior.test.cjs
    expected:
      - >-
        A class teacher's PDF becomes an approved, stored and grounded material listed in the class's shared
        materials; an enrolled student's image becomes a requested material listed only in the class
        teacher's share requests.
      - >-
        A student outside the chosen class is refused with 403 before the handle is redeemed; foreign, expired
        and oversize handles pass the relay's 404 or 413 through; bytes that are neither PDF nor image are
        refused with 415 whatever type they claim; a missing subject is 401 and a malformed class id is 400.
        None of these writes a row or a file.
    prerequisites:
      - runner:node-test
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: >-
        Each case runs in its own directory under a temporary root the suite removes; the database, artifact
        relay, text extraction and RAG are in-memory doubles, so no provider, live database or vector store
        is touched.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 512
    installation: never
