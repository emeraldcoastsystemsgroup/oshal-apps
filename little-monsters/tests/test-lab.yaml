  - id: tutor-shared-renderer
    name: Tutor renders core's shared untrusted reply safely in Chromium
    purpose: >-
      Prove the Tutor is a conforming app consumer of core's shared response renderer - the actual
      tools/tutor-chat.html over a loopback fixture, the renderer bundled from the framework source,
      and a scripted tutor endpoint answering with the renderer's own SHARED_UNTRUSTED_RESPONSE vector.
    level: browser
    runner:
      kind: playwright
      scope: package
      files:
        - tests/tutor-renderer.core.spec.mjs
    expected:
      - >-
        The reply renders to the vector's expected block sequence - the one Jarvis and the swarm-bot chat
        bubble produce in core - with the hostile gallery and download as escaped fallbacks and no link,
        image, form, input, script, frame or button in the rendered region.
      - >-
        The grounding badge and read-aloud control stay on the message, exactly one tutor turn is posted,
        and nothing is requested off the fixture origin (never the hostile host).
      - Without the renderer bundle the reply stays readable escaped text with nothing live.
    prerequisites:
      - runner:playwright
      - harness:oshal-core-root
      - browser:chromium
      - core:dependencies
      - core:shared-theme-assets
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: >-
        Close the owned Chromium process and the loopback HTTP server. The tutor endpoint is scripted in
        memory; there is no database, provider, model or external traffic.
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
