# -----------------------------------------------------------------------------
# ─────────────────────────────────────────────────────────────────────────────
# OSHAL App Package — Little Monsters
# Format: ADR-085 (remote app packages). This file is self-contained: every path
# below is RELATIVE TO THIS PACKAGE, never the framework repo. Installing this
# package clones it into the swarm's deployed-apps/ and hot-loads it — nothing is
# compiled into the core image.
#
# Provenance is stamped by the installer from `source` (git-subdir). This is the
# first app carved out of the OSHAL monolith to prove the format (ADR-085 P2).
# ─────────────────────────────────────────────────────────────────────────────

name: little-monsters
suite: ai-home   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features:
    - id: lecture-study-materials
      unit: lecture study pack
      tier: T2
      generation: none
      degrade: disable
    - id: lecture-recording-pipeline
      unit: lecture recording ticket
      tier: T4
      generation: none
      degrade: disable
    - id: study-set-generation
      unit: flashcard set or quiz
      tier: T2
      generation: none
      degrade: disable
    - id: tutoring-turn
      unit: tutoring turn
      tier: T3
      generation: hosted
      degrade: disable
displayName: Little Monsters
description: >-
  Voice-first ADHD study companion for K-12 students. Record lectures, then
  make flashcards, a practice quiz or a summary of the lecture as a PDF from
  them; read the student's class textbooks (list their books, read a chapter,
  make chapter flashcards and a lesson summary); keep the student's classes,
  schedule and action items (reminders) on
  their school calendar; and chat with a Socratic tutor grounded only in
  caller-owned or teacher/admin-approved class material through per-material
  RAG collections.
version: 1.4.18
lastingStorage: true
chatBot: class-tutor # Concierge the cockpit offers beside this application's screens.

authorization:
  version: 1
  catalog: authorization.yaml
  roleTemplates:
    - id: student
      version: 2
      label: Student
      members:
        - app: little-monsters
          role: student
        - app: presentations
          role: '@app-admin'
        - app: circuit-lab
          role: '@app-admin'
        - app: email-summarizer
          role: '@app-admin'
    - id: teacher
      version: 2
      label: Teacher
      members:
        - app: little-monsters
          role: teacher
        - app: presentations
          role: '@app-admin'
        - app: circuit-lab
          role: '@app-admin'
        - app: email-summarizer
          role: '@app-admin'
    - id: admin
      version: 2
      label: School administrator
      members:
        - app: little-monsters
          role: admin
        - app: presentations
          role: '@app-admin'
        - app: circuit-lab
          role: '@app-admin'
        - app: email-summarizer
          role: '@app-admin'
testing:
  version: 1
  catalog: tests/test-lab.yaml

# ADR-139 wave 1/2 — "Send to…" destinations: an image or PDF can open in the Tutor as a
# pending attachment, or open the dashboard's class picker for teacher/requested class filing.
artifacts:
  accepts:
    - id: tutor
      label: Ask the Tutor about it
      icon: 🧑‍🏫
      types: [image/*, application/pdf]
      mode: open
    - id: class-material
      label: File into a class
      icon: 📚
      keywords: [class, classroom, handout, material, school]
      useWhen: Choose a class before filing this owner-bound image or PDF as a class material.
      types: [image/*, application/pdf]
      mode: open
status: active
# ADR-085 §5: RAG collections this app OWNS. Reported by uninstall-impact; deleted
# at uninstall ONLY under the operator's explicit ?dropData=true (toggle-off never
# touches them). `lm-cls-*` remains cleanup-only for collision-prone historical
# collections; each newly grounded upload uses one exact lm-material collection so a single
# moderation or deletion action never leaves text mixed into a shared bucket.
ragCollections:
  - "lm-class-*"
  - "lm-cls-*"
  - "lm-prv-*"
  - "lm-shr-*"
  - "lm-material-*"
  - "lm-global-*"
# Deployment-wide visibility, matching the pre-carve-out behavior (the in-repo
# manifest had no scope → defaulted public). 'person' made the installed row
# RLS-visible ONLY to its owner — and the installer didn't even stamp one, so
# every non-operator session (the students this app exists for) lost the app
# and fell back to a stale disk profile. A classroom/family app is shared.
scope: public

# Where this package came from — the installer pins ref+sha at install time.
source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: little-monsters
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/little-monsters/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# ── ADR-090 D8: kernel SKILLS this app calls ────────────────────────────────
# Derived from what this package's code ACTUALLY imports, not from its description:
#   @/features/presentation-generation → deck-generation   (the Presentations tab)
#   @/features/voice-providers         → voice             (lecture recording / TTS)
#   @/features/rag                     → rag               (textbook-grounded tutor)
#   @/features/llm-provider            → tool-registry     (harness + model access)
#   @/app/routes/storage-target        → storage           (materials → Dropbox/GitHub/local)
#
# These are KERNEL SKILLS — shared capabilities the framework always provides. A skill is not an
# app: it never installs, never ref-counts, and can never be uninstalled out from under this app.
#
# This supersedes the old `dependencies.apps: [presentations]`, which was a mis-declaration: what
# LM needs is the always-present deck-generation ENGINE, not the presentations app's surface. When
# presentations carves to the store, only its SURFACE carves — the engine stays kernel (migration
# plan §2, "skills with a surface"). Declaring the skills here is also what keeps their modules in
# the built image: scripts/check-kernel-skills.ts fails CI if a declared skill goes missing, so LM
# can never again be broken at mount by a core-side prune (which is exactly how it lost
# google-calendar, and how `notifications` was pruned).
uses:
  - bound-workflow-results # prompt-containment imports the shared orchestration module
  - application-authorization
  - experience-roles
  - test-catalog
  - deck-generation
  - voice
  - rag
  - tool-registry
  - storage
  - app-dependencies   # compatibility floor for the tiered dependencies block (ADR-085 addendum)

# ── ADR-090 addendum (skill profiles) ───────────────────────────────────────
# Teach the generic `summarize` capability the CLASS-NOTES domain, declaratively. `summarize`
# is a profileable CAPABILITY (bot reasoning), NOT a kernel module — so it is NOT in `uses:`
# above (that list is for importable modules and its validator would reject a non-module id).
# The lecture-scribe persona STAYS and still runs the full audio→transcript→notes→flashcards
# pipeline; this block makes the notes SHAPE a declared profile the dispatch path composes into
# the worker prompt, so the same capability yields class-notes here and meeting-notes elsewhere.
skillProfiles:
  summarize:
    pattern: class-notes
    instructions: >-
      Turn the lecture transcript into study notes a K-12 student can revise from. Use plain,
      grade-appropriate language. Pull out the key concepts, define every new term, capture any
      formulas with a worked example, and list the homework/assignments mentioned. Where the
      class knowledge base supports a point, cite the source (e.g. "See textbook Chapter 5,
      p.47"). Do not invent facts, dates, or assignments that are not in the transcript.
    sections:
      - key-concepts
      - definitions
      - formulas-and-examples
      - homework-and-assignments
    outputContract: markdown study notes, concept-first

# ── ADR-085: complete application prerequisites ──────────────────────────────
# The product bundle includes the full AI Office and Circuit Lab applications for every
# student/teacher/admin role. The local lecture player and PPTX export still use the
# kernel deck-generation engine; these requirements describe the complete learning
# workspace, including the prepare-study-plan handoff, rather than a new code import.
# Each native role template above names all included application roles explicitly.
#
# Both connector tiers stay DECLARED and empty: this keeps the general connector
# catalog out of the child-facing ribbon. Kernel voice/model/storage readiness and
# caller-owned provider connections are separate from application role assignments.
# Teacher/admin catalog grants still require the existing issuer-bound school roster;
# a composite never creates a school membership, enrollment or provider credential.
dependencies:
  required:
    apps:
      - presentations
      - circuit-lab
      - email-summarizer
    tools: []
    connectors: []
  optional:
    apps: []
    tools: []
    connectors: []

# ── ADR-085: app-scoped settings (typed keys the app reads; per-app settings panel) ──
settings:
  schema:
    dailyGoalMinutes:
      type: integer
      default: 30
      label: Daily study goal (minutes)
    gamesRequireStudy:
      type: boolean
      default: true
      label: Require study time before the games arcade unlocks
    readAloudVoice:
      type: string
      default: gemini-tts
      label: Read-aloud voice provider

# ─────────────────────────────────────────────────────────────────────────────
# BOTS — agentIds are this app's OWN (ed0000…). A package may NOT re-declare a
# bot owned by another installed app (validator rule, ADR-085) — manifest upserts
# clobber base_capabilities whole-array, so ownership must be exclusive.
# ─────────────────────────────────────────────────────────────────────────────
bots:
  - agentId: ed000000-0000-0000-0000-000000000001
    name: lecture-scribe
    persona: personas/lecture-scribe.yaml
    role: education/lecture-processing
    capabilities: [audio-transcription, note-generation, assignment-extraction, flashcard-generation, knowledge-indexing]
  - agentId: ed000000-0000-0000-0000-000000000002
    name: class-tutor
    routingKeywords:
      - practice quiz
      - quiz for my kid
      - homework help
      - homework
      - study guide
      - flashcards
      - my kid
      - for my son
      - for my daughter
      - little monsters
      - my classes
      - new class
      - add a class
      - add class
      - add my class
      - my assignments
      - assignments due
      - school reminder
      - study reminder
      - school action items
      - school calendar
      - my school
      - homework list
      - lecture
      - lectures
      - my lecture
      - the lecture
      - lecture summary
      - lecture as a pdf
      - notes as a pdf
      - lecture notes
      - practice quiz on
      - my textbook
      - math book
      - my math book
      - from chapter
      - lesson summary
      - my books
      - my textbooks
      - textbook
      - class books
      - school books
    persona: personas/class-tutor.yaml
    role: education/tutor
    capabilities: [tutoring, socratic-method, subject-expertise, rag-query, text-to-speech]
  - agentId: ed000000-0000-0000-0000-000000000003
    name: quiz-master
    persona: personas/quiz-master.yaml
    role: education/assessment
    capabilities: [quiz-generation, assessment, bloom-taxonomy, performance-analysis]
  - agentId: ed000000-0000-0000-0000-000000000004
    name: textbook-librarian
    persona: personas/textbook-librarian.yaml
    role: education/knowledge-management
    capabilities: [pdf-ingestion, knowledge-management, content-indexing, quality-verification]
  - agentId: ed000000-0000-0000-0000-000000000005
    name: study-coach
    persona: personas/study-coach.yaml
    role: education/planning
    capabilities: [study-planning, performance-analysis, motivation, scheduling]
  - agentId: ed000000-0000-0000-0000-000000000006
    name: writing-coach
    persona: personas/writing-coach.yaml
    role: education/writing
    capabilities: [writing-feedback, essay-structure, grammar-guidance, rubric-analysis]

# NOTE: no toolsDir. The field is DECLARED-BUT-DEAD in the framework — nothing in core consumes it,
# so bundled tool JS under tools/ is not callable (ADR-085 D12). The loader WARNs on it and the field
# is removed in the next store release. The tools/ folder is kept for the execution path if it lands.

# Route-backed tools for Jarvis and this app's bots (native kernel: executorType api, inside this
# package's /api/education mount). Each one calls an existing caller-scoped route, so a student sees
# and changes only their own classes and events; the two writes are held for the person's approval.
tools:
  - name: lm-my-classes
    displayName: My Classes
    type: api
    category: education
    description: The person's Little Monsters classes (the ones they created or are enrolled in), each with its class_id, name, subject, grade, teacher and schedule.
    executor: { executorType: api, apiEndpoint: "GET /api/education/classes" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} before naming any class, and to find a class_id. An empty list means the person has no classes yet; offer lm-add-class.
    routingTags: [school, classes, education]
    tags: [education, route-backed]
  - name: lm-add-class
    displayName: Add Class
    type: api
    category: education
    description: Add a class to the person's Little Monsters and enroll them in it. Held for the person's approval.
    cardText: Adds this class to your Little Monsters.
    executor: { executorType: api, apiEndpoint: "POST /api/education/classes" }
    defaultAuthMode: auto
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120, description: "The class name as the person said it (Biology, Period 3 English)." }
        subject: { type: string, minLength: 1, maxLength: 80, description: "The subject (Biology, Math, English). Use the name when the person gave nothing else." }
        gradeLevel: { type: string, maxLength: 40 }
        teacherName: { type: string, maxLength: 120 }
        schedule: { type: string, maxLength: 200, description: "When it meets, in the person's words (Tuesdays and Thursdays at 10am)." }
        room: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 1000 }
      required: [name, subject]
    usageInstructions: Call once per class the person asked to add. Read lm-my-classes first and never add a class whose name is already listed. The approval card is the person's confirmation; never call it again because they said yes. Say a class is added only when its result shows a classId.
    routingTags: [school, classes, education]
    tags: [education, route-backed]
  - name: lm-my-schedule
    displayName: My School Calendar
    type: api
    category: education
    description: The person's Little Monsters calendar - their own reminders and study sessions plus the due dates, quizzes and tests of their classes - each with event_id, title, event_type, event_date, event_time and class_name.
    executor: { executorType: api, apiEndpoint: "GET /api/education/calendar" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} for anything about what is coming up, due, scheduled or on their list, and to find an event_id before removing one. Answer only from what it returns, using the date on this turn's Current time line for "today" and "this week".
    routingTags: [school, schedule, education]
    tags: [education, route-backed]
  - name: lm-my-assignments
    displayName: My Assignments
    type: api
    category: education
    description: The assignments of the person's classes, soonest due first, each with title, class_name, assignment_type, due_date and status.
    executor: { executorType: api, apiEndpoint: "GET /api/education/assignments" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} when the person asks about homework, assignments or what is due.
    routingTags: [school, assignments, education]
    tags: [education, route-backed]
  - name: lm-add-reminder
    displayName: Add to My School Calendar
    type: api
    category: education
    description: Put one item on the person's own Little Monsters calendar - an action item, reminder, study session, due date, quiz or test. Held for the person's approval.
    cardText: Adds this item to your Little Monsters calendar.
    executor: { executorType: api, apiEndpoint: "POST /api/education/calendar" }
    defaultAuthMode: auto
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200, description: "The item in the person's words (Finish the lab write-up)." }
        eventDate: { type: string, minLength: 10, maxLength: 10, description: "The day, as YYYY-MM-DD (2026-10-21). Use the date on this turn's Current time line to resolve today, tomorrow or a weekday." }
        eventTime: { type: string, maxLength: 8, description: "Optional time of day, 24-hour HH:MM (15:30). Leave it out when the person gave no time." }
        eventType: { type: string, enum: [reminder, study-session, assignment, quiz, test, custom], description: "reminder for an action item or to-do; study-session for planned study; assignment, quiz or test for something due." }
        classId: { type: string, format: uuid, description: "Optional. The class_id from lm-my-classes when the item belongs to one of the person's classes, never a class name." }
        description: { type: string, maxLength: 1000, description: "Optional. Only a note the person asked to keep, in their own words." }
      required: [title, eventDate, eventType]
    usageInstructions: Call once per item; a list of action items is one call per item, each with its own date (ask for a date only when the person gave none and none is implied). Each call makes one card, so name only the items you made a card for in this reply. Never call it again for an item already proposed or saved, or because the person said yes. Say an item is saved only when its result shows an eventId.
    routingTags: [school, reminders, education]
    tags: [education, route-backed]
  - name: lm-remove-reminder
    displayName: Remove from My School Calendar
    type: api
    category: education
    description: Remove one item the person added to their own Little Monsters calendar. Held for the person's approval.
    cardText: Removes this item from your Little Monsters calendar.
    executor: { executorType: api, apiEndpoint: "DELETE /api/education/calendar/{input.eventId}" }
    defaultAuthMode: auto
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        eventId: { type: string, format: uuid, description: "Call lm-my-schedule first: the event_id exactly as it lists it, never the title." }
      required: [eventId]
    usageInstructions: Read lm-my-schedule first and send the event_id of the item the person named. Class due dates set by a teacher cannot be removed here.
    routingTags: [school, reminders, education]
    tags: [education, route-backed]
  - name: lm-my-lectures
    displayName: My Lectures
    type: api
    category: education
    description: The person's most recent lectures across their classes, newest first, each with lecture_id, class_id, class_name, lecture_date, flashcard_set_id and whether notes, slides, a transcript and a recording exist.
    executor: { executorType: api, apiEndpoint: "GET /api/education/lectures/recent" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} to find a lecture the person names ("today's lecture", "my photosynthesis lecture") and its lecture_id, class_id and flashcard_set_id before any other lecture tool.
    routingTags: [school, lectures, education]
    tags: [education, route-backed]
  - name: lm-lecture-notes
    displayName: Lecture Notes
    type: api
    category: education
    description: One lecture's study notes (markdown) and transcript.
    executor: { executorType: api, apiEndpoint: "GET /api/education/lectures/{input.lectureId}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        lectureId: { type: string, format: uuid, description: "The lecture_id from lm-my-lectures, never a title." }
      required: [lectureId]
    usageInstructions: Read lm-my-lectures first. Use the notes to summarise or answer questions about the lecture; quote only what they say.
    routingTags: [school, lectures, education]
    tags: [education, route-backed]
  - name: lm-make-flashcards
    displayName: Make Flashcards
    type: api
    category: education
    description: Generate a new flashcard set for one of the person's own classes, grounded in that class's material, focused on a topic when given, or made from one chapter of a class book (materialId + chapter).
    executor: { executorType: api, apiEndpoint: "POST /api/education/flashcards/generate" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        classId: { type: string, format: uuid, description: "The class_id from lm-my-classes, lm-my-lectures or lm-my-books." }
        topic: { type: string, maxLength: 200, description: "Optional focus, such as the lecture's topic (photosynthesis)." }
        count: { type: integer, minimum: 3, maximum: 20 }
        materialId: { type: string, format: uuid, description: "A book's materialId from lm-my-books, to make the cards from one of its chapters (with chapter and that book's classId)." }
        chapter: { type: integer, minimum: 1, maximum: 99, description: "The chapter number, with materialId." }
      required: [classId]
    usageInstructions: Call once when the person asks for new flashcards. For a book chapter pass the book's classId, materialId and chapter from lm-my-books. Give the answer's studyUrl exactly as returned (a relative link starting /api/education/) as a markdown link named "Study the flashcards". Never write any other URL or host for it.
    routingTags: [school, flashcards, education]
    tags: [education, route-backed]
  - name: lm-make-quiz
    displayName: Make a Practice Quiz
    type: api
    category: education
    description: Generate a multiple-choice practice quiz for one of the person's classes, grounded in the class material and focused on a topic when given.
    executor: { executorType: api, apiEndpoint: "POST /api/education/quiz/generate" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        classId: { type: string, format: uuid, description: "The class_id from lm-my-classes or lm-my-lectures." }
        topic: { type: string, maxLength: 200, description: "Optional focus, such as the lecture's topic." }
        count: { type: integer, minimum: 3, maximum: 10 }
      required: [classId]
    usageInstructions: Call once when the person asks for a quiz. Show the questions and choices (the answers are not returned and are never invented), then give the answer's quizUrl exactly as returned (a relative link starting /api/education/) as a markdown link named "Take the quiz" so they can answer and get it graded. Never write any other URL or host for it.
    routingTags: [school, quiz, education]
    tags: [education, route-backed]
  - name: lm-lecture-summary-pdf
    displayName: Lecture Summary PDF
    type: api
    category: education
    description: Make a PDF of one lecture's summary notes and save it to the person's files.
    executor: { executorType: api, apiEndpoint: "POST /api/education/lectures/{input.lectureId}/summary-pdf" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        lectureId: { type: string, format: uuid, description: "The lecture_id from lm-my-lectures, never a title." }
      required: [lectureId]
    usageInstructions: Read lm-my-lectures first. The answer has downloadUrl and fileName; give the person the downloadUrl as a markdown link named with the fileName. Say the PDF is ready only when the answer has a downloadUrl.
    routingTags: [school, lectures, pdf, education]
    tags: [education, route-backed]
  - name: lm-my-books
    displayName: My Books
    type: api
    category: education
    description: The books (class materials) the person can read in their classes, each with its materialId, title, class and subject.
    executor: { executorType: api, apiEndpoint: "GET /api/education/my-books" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call before reading or making cards from a book. When the person's words match more than one book or class (two math books, two math classes), ask which one and name the choices; do not pick one.
    routingTags: [school, textbooks, education]
    tags: [education, route-backed]
  - name: lm-book-chapter
    displayName: Book Chapter
    type: api
    category: education
    description: One chapter of a class book - its heading and text - or, when the chapter is not found, the chapter headings the book has.
    executor: { executorType: api, apiEndpoint: "GET /api/education/materials/{input.materialId}/chapters/{input.chapter}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        materialId: { type: string, format: uuid, description: "The book's materialId from lm-my-books, never a title." }
        chapter: { type: integer, minimum: 1, maximum: 99, description: "The chapter number." }
      required: [materialId, chapter]
    usageInstructions: Read lm-my-books first. Write lesson summaries and answers from the chapter text only. When found is false, say the chapter was not found and list the chapters it has (or that its text has no chapter headings).
    routingTags: [school, textbooks, education]
    tags: [education, route-backed]

# ─────────────────────────────────────────────────────────────────────────────
# UI SURFACES — toolbar/ribbon config (ADR-085 `toolbar`). Static entries are
# ribbon icons; the dynamic block generates one icon per lm_classes row.
# ─────────────────────────────────────────────────────────────────────────────
ui:
  # No floating `assistant:` bubble. It sat in the corner where every other application shows the
  # Jarvis orb, so a student pressing "Jarvis" reached the textbook Tutor, which cannot add a class
  # or read their schedule. The Tutor is the lm-tutor tab below; the corner is Jarvis, which reaches
  # this app through the tools declared under `tools:`.
  static:
    - { toolName: lm-dashboard,     label: Class dashboard,   icon: codicon codicon-home,        iframeUrl: /api/education/dashboard,        section: top }
    - { toolName: lm-myday,         label: My Day,            icon: codicon codicon-calendar,            iframeUrl: /api/education/my-day,           section: top }
    - { toolName: lm-tutor,         label: Tutor,             icon: codicon codicon-comment-discussion,  iframeUrl: /api/education/tutor,            section: top }
    - { toolName: lm-flashcards,    label: Flashcards,        icon: codicon codicon-versions,            iframeUrl: /api/education/flashcards-hub,   section: top }
    - { toolName: lm-arcade,        label: Games,             icon: codicon codicon-game,                iframeUrl: /api/education/arcade,           section: top }
    - { toolName: lm-monsters,      label: My Monsters,       icon: codicon codicon-heart,               iframeUrl: /api/education/my-monsters,      section: top }
    - { toolName: lm-recorder,      label: Record,            icon: codicon codicon-record,              iframeUrl: /api/education/recorder,         section: top }
    # This package-owned lecture picker calls the framework-resident deck-generation skill
    # declared in `uses`; it does not require the separately packaged AI Office surface.
    - { toolName: lm-presentations, label: Presentations,     icon: codicon codicon-graph,               iframeUrl: /api/education/presentation, section: top }
    - { toolName: lm-timelines,     label: Timelines,         icon: codicon codicon-history,             iframeUrl: /api/education/timelines,        section: top }
    - { toolName: lm-formula-lab,   label: Formula Lab,       icon: codicon codicon-symbol-operator,     iframeUrl: /api/education/formula-lab,      section: top }
    - { toolName: lm-stem,          label: STEM Helpers,      icon: codicon codicon-beaker,              iframeUrl: /api/education/stem-helpers,     section: top }
    - { toolName: lm-citations,     label: Citations,         icon: codicon codicon-quote,               iframeUrl: /api/education/citations,        section: top }
    - { toolName: lm-files,         label: My Files,          icon: codicon codicon-folder,              iframeUrl: /api/education/files,            section: top }
    # The standard email viewer (Intelligent Communication's inbox; each person connects their own mailbox)
    # and the core personal file browser, where Little Monsters' saved lecture PDFs and decks also appear,
    # each shown below the Little Monsters top bar by tools/standard-view.html.
    - { toolName: lm-email,         label: Email,             icon: codicon codicon-mail,                iframeUrl: /api/education/email,            section: top }
    - { toolName: lm-storage,       label: Storage,           icon: codicon codicon-folder-library,      iframeUrl: /api/education/storage,          section: top }
    - { toolName: lm-teacher,       label: Teacher,           icon: codicon codicon-mortar-board,        iframeUrl: /api/education/teacher,          section: bottom }
    - { toolName: lm-voice-settings, label: Voice,            icon: codicon codicon-unmute,              iframeUrl: /api/education/voice-settings,   section: bottom }
  dynamic:
    source: lm_classes
    where: "status = 'active'"
    toolNameTemplate: "lm-class-{class_id_prefix}"
    labelField: name
    icon: codicon codicon-book
    iframeUrlTemplate: /api/education/class?classId={class_id}
    section: top
    # ADR-085 generic per-user visibility: the framework asks THIS endpoint (with the
    # caller's session) which lm-* tools the caller may see — the static surfaces for their
    # role plus their class icons. Fail-closed.
    visibility:
      endpoint: /api/education/class-tool-keys
      pattern: "lm-*"

# ─────────────────────────────────────────────────────────────────────────────
# ROUTES — compiled JS bundled in this package (routes/*.js), mounted in-process
# by the loader at activation (ADR-085 P1, flag APP_PACKAGE_DYNAMIC_ROUTES).
# The .js files are produced by the extraction build — see BUILD.md.
# ─────────────────────────────────────────────────────────────────────────────
routes:
  - module: routes/review.js
    factory: createReviewRoutes
    mountPath: /api/little-monsters/review
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/little-monsters/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/little-monsters/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - { module: routes/education-routes.js,          factory: createEducationRoutes,         mountPath: /api/education, requiresAuth: true,  requiresContext: true }
  - { module: routes/education-calendar-routes.js,  factory: createEducationCalendarRoutes, mountPath: /api/education, requiresAuth: true,  requiresContext: true }
  - { module: routes/education-voice-routes.js,     factory: createEducationVoiceRoutes,    mountPath: /api/education, requiresAuth: true,  requiresContext: false }

# ─────────────────────────────────────────────────────────────────────────────
# MIGRATIONS — this app's OWN schema, bundled and applied idempotently on install
# (ADR-085 P2 migration runner). Tracked per-app so uninstall can optionally drop it.
# ─────────────────────────────────────────────────────────────────────────────
# Ordered: 019 creates the base lm_* schema; the rest ALTER/extend it.
# (migrations/uninstall.sql is NOT listed — it is the explicit opt-in teardown, ADR-085 §5.)
migrations:
  - migrations/019-education-platform.sql
  - migrations/020-seed-education-bots.sql
  - migrations/021-calendar-and-notifications.sql
  - migrations/024-lecture-slides.sql
  - migrations/025-calendar-google-sync.sql
  - migrations/026-education-identity.sql
  - migrations/027-class-publishing.sql
  - migrations/028-class-materials.sql
  - migrations/029-material-sharing.sql
  - migrations/030-multi-tenant.sql
  - migrations/031-tenant-domain-uniqueness.sql
  - migrations/032-oidc-principal-binding.sql
  - migrations/033-flashcard-set-ownership.sql
  - migrations/034-material-rag-lifecycle.sql
  - migrations/035-enrollment-tenant-invariant.sql
  - migrations/036-authoritative-progress.sql
  - migrations/037-authorization-audit.sql
  - migrations/038-rewards.sql
  - migrations/native/001-little-monsters.sql
# The native kernel applies the final-shape native file above in place of the PostgreSQL-only
# forms below (it accepts no PL/pgSQL triggers, catalog-probing DO guards or platform tables).
nativeMigrations:
  - id: migrations/020-seed-education-bots.sql
    native: skip
    reason: "It seeds the platform's agents and persona_layers tables, which are not package tables; the native kernel registers the six bots from this manifest's bots: block."
  - id: migrations/031-tenant-domain-uniqueness.sql
    native: skip
    reason: "Its unique lower(domain) index is in migrations/native/001-little-monsters.sql; the DO block that refuses duplicate historical domains is PostgreSQL-only and a fresh native scope has none."
  - id: migrations/032-oidc-principal-binding.sql
    native: skip
    reason: "Its external_issuer column and (external_issuer, external_id) unique index are in migrations/native/001-little-monsters.sql; the native kernel has no DROP INDEX, and the retired subject-only index 026 created admits one learner per subject in a person's own native scope, which is that person."
  - id: migrations/033-flashcard-set-ownership.sql
    native: skip
    reason: "Its owner_student_id column and private-owner index are in migrations/native/001-little-monsters.sql; its DO-guarded NOT VALID constraints are PostgreSQL-only."
  - id: migrations/035-enrollment-tenant-invariant.sql
    native: skip
    reason: "Its enrollment tenant_id column and the (student_id, tenant_id) and (class_id, tenant_id) unique indexes are in migrations/native/001-little-monsters.sql; its cross-tenant DO check, PL/pgSQL tenant trigger and composite foreign keys are PostgreSQL-only, and one person's native scope holds only the seeded default school."
  - id: migrations/036-authoritative-progress.sql
    native: skip
    reason: "Its XP dedupe key and lm_quiz_attempts table are in migrations/native/001-little-monsters.sql; its PL/pgSQL tenant trigger and composite foreign keys are PostgreSQL-only."
  - id: migrations/037-authorization-audit.sql
    native: skip
    reason: "Its lm_authorization_audit table and indexes are in migrations/native/001-little-monsters.sql; its PL/pgSQL stamp and append-only triggers are PostgreSQL-only."

# Voice channels (provider ids from the swarm voice-providers registry; swarm-default defers).
voice:
  tts: { provider: gemini-tts }
  stt: { provider: swarm-default }

# ── Workflow + ticket type (rides the kernel queue; the app does not own it) ──
ticketType: education
workflow:
  name: Education Processing Pipeline
  pipeline: education
  workerBot: lecture-scribe
  phases: [intake, processing, delivery]

# Theme is a requested host skin id; an unregistered id falls back to the operator's theme.
# The education surface styling that must travel with the package is bundled via sharedCss.
theme: little-monsters
sharedCss: ui/education.css

# Ribbon visibility when /cockpit?app=little-monsters is focused.
ribbon:
  hideFrameworkItems: [tickets, chat, calendar, addressbook, dashboard, logs, operations]
  defaultView: lm-dashboard
  # The kids' app has its OWN tutor (see ui.assistant); the generic swarm-bot chat rail alongside it
  # is redundant and confusing. This is the field the pre-carve-out shell script used to fake by
  # hiding the rail from JS — the framework has supported it declaratively all along, and the
  # package simply never set it (ADR-085 D9).
  hideChatPanel: true

summary:
  path: /api/little-monsters/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items
integrations:
  offers:
    - id: prepare-study-plan
      label: Prepare a study plan
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
