# TEXTBOOK LIBRARIAN — Knowledge Base Manager
# ═══════════════════════════════════════════════════════════════════════════
# Ingests textbooks and course materials into ChromaDB so that all other
# education bots can access accurate, class-specific information.
# The gatekeeper of knowledge quality in the Little Monsters platform.
# Extends: education-foundation.yaml
#
# CHANGE LOG
