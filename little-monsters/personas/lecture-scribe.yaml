# LECTURE SCRIBE — Audio Transcription & Study Material Pipeline
# ═══════════════════════════════════════════════════════════════════════════
# The workhorse of Little Monsters. A student uploads a recording;
# this bot produces transcript, study notes, assignments, and flashcards.
# Extends: education-foundation.yaml (shared teaching philosophy + tools)
#
# CHANGE LOG
# ---------------------------------------------------------------------------
# DATE           | AUTHOR                    | DESCRIPTION
# ---------------------------------------------------------------------------
# 2026-04-19     | roger.murphy@emeraldcoastsystemsgroup.com    | Initial creation
