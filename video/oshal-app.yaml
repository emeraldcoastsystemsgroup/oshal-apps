# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | 1.6.2: ship the manual timeline editor's pure half (CREATE-EDIT-05a) - the shared timeline document contract, immutable operations, bounded history and the timeline-to-FFmpeg compiler - with two registered Lab cases. No route, table, permission or surface change.
# 2 | maintainer@emeraldcoastsystemsgroup.com | 1.7.0: the manual editor's persistence and routes (CREATE-EDIT-05b) - migration 068 (private forced-RLS projects, immutable revisions and owned media), the /api/video/editor routes mounted beside the studio, and Video's first named authorization catalog, which binds every existing studio, series, pump, summary and readiness endpoint as well. Activating this release on an installation with existing Video grants needs the reviewed AUTH-07 catalog migration; a legacy app-admin assignment is not translated.
# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.8.0: export jobs for the manual editor (CREATE-EDIT-05c) - migration 069 (forced two-arm owner RLS), the runtime FFmpeg behind a Video-owned adapter with one encode per process, one job per owner, four queued, cancellation that terminates only the tracked child, a private work directory that is always removed, epoch-scoped interruption on restart and publication only after the real output is decoded and verified. Five export bindings join the catalog; no new permission or role.
# 4 | maintainer@emeraldcoastsystemsgroup.com | 1.9.0: the manual editor screen (CREATE-EDIT-05d) - a Video editor tile at /api/video/editor: import clips and music with the native picker, trim, split, reorder and remove, clip and music volume, titles, undo and redo, frame-exact in-browser preview, save and reopen, and export or preview through the export jobs; every action has a keyboard equivalent. Three bindings join the catalog: the page and its fixed module allowlist under editor.view, and deleting one unused upload under editor.delete. Ships the installed-box acceptance walk (tests/editor-live-acceptance.mjs) with its committed one-second clip.
# 5 | maintainer@emeraldcoastsystemsgroup.com | 1.9.2: authorization.yaml binds the package's three bots to studio.generate, so a protected chat turn to the concierge (screenplay-writer) is admitted instead of refused authorization_operation_unbound. No route, tool or bot change.
# 6 | maintainer@emeraldcoastsystemsgroup.com | Import vids-operator from its single owning application, vids, instead of relying on global aliases or duplicate bot ownership.
# 7 | maintainer@emeraldcoastsystemsgroup.com | 1.9.4: declare existing series storyboarding and pump schema; await native ticket and screenplay acknowledgements.
# 8 | maintainer@emeraldcoastsystemsgroup.com | 1.9.5: use declared native media transport and full-read-set transactions while retaining ordinary PostgreSQL behavior.
# -----------------------------------------------------------------------------
# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — video ("Video Studio")
# Carved out of OSHAL core 2026-07-19 (ADR-085 Wave 3, "skill with a surface" —
# ONLY the surface carves). This package is the app: the /api/video routes
# (storyboard / generate / list / series lifecycle — routes/video-routes.js built
# from src-routes/), the studio surface (tools/video.html, self-served at
# /api/video/ui from ctx.appPackageDir), package COPIES of the three personas for
# the registrar, and migration COPIES for fresh installs.
#
# What STAYS framework-resident per ADR-093 (this package ships none of it):
#   - the video-series CONDUCTOR engine (src/app/series-pipeline.ts /
#     series-orchestrator.ts / series-dispatch.ts / series-drive.ts) + the
#     startSeriesReconciler cron in server.ts — the packaged routes reach it via
#     @/ aliases; the conductor is the runtime (ADR-082);
#   - the src/features/video-generation slice (renderVideo, storyboard sanitizer,
#     Veo cost model);
#   - the video-director (…048) + screenplay-writer (…052) INLINE nodes,
#     registered in BOTH swarm-bot-registry blocks, + the kernel personas;
#   - scripts/migrations/066-video-series.sql + 067-video-episode-scenes.sql
#     (kernel-owned history; this package ships migrations/ COPIES so fresh
#     installs create the hand-off tables);
#   - the SHARED vids-operator remote-client desktop worker
#     (packages/oshal-vids-operator) + its registry entries — the render stage.
# Framework: OSHAL (see docs/adr/085-remote-app-packages-and-registries.md)
# ─────────────────────────────────────────────────────────────────────────────

name: video
suite: ai-creative   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features:
    - id: storyboard
      unit: storyboard
      tier: T2
      generation: none
      degrade: disable
    - id: clip-render
      unit: short video
      tier: T2
      generation: hosted
      degrade: disable
    - id: series-episode
      unit: series episode
      tier: T3
      generation: hosted
      degrade: disable
displayName: Video Studio
description: >-
  Make prompted short-form videos (TikTok / YouTube Shorts / Instagram Reels) from an idea.
  Shape the style, tone, length, captions and voiceover; the director storyboards it and the
  studio renders a real .mp4 with voiceover and captions, saved to your Files storage.
version: 1.9.6
status: active

# Per-app skin (approved palette) — sakura so the media studio reads distinct.
theme: sakura

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: video
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/video/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# Kernel skills this package IMPORTS (ADR-085 §2). Declared because an undeclared import is
# invisible to the prune guard: the first carve that drops the skill would break this app at
# MOUNT time, not at compile time. See docs/apps/kernel-skills.md.
uses:
  - media-generation # video-routes.js renders through the video-generation slice (Veo + storyboard)
  - storage          # video-routes.js saves finished MP4s through the kernel storage target
  - app-dependencies # compatibility floor for the tiered dependencies block (ADR-085 addendum)
  - test-catalog
  - application-authorization # the named catalog below; older cores refuse it instead of ignoring it

# ADR-149 named catalog: studio view/read/generate, pump management, and the manual editor's own
# view/read/create/change/delete/export. Every endpoint of every route below has a binding.
authorization:
  version: 1
  catalog: authorization.yaml

testing:
  version: 1
  catalog: tests/test-lab.yaml

# ── Cross-package prerequisites: what this package actually reaches ─────────
# OPTIONAL, NOT REQUIRED: tools/video.html:461 reads /api/create/brand-kit to offer the "in brand
# colours" chip. The chip stays hidden when the read returns nothing, so storyboarding, generation
# and the series lifecycle are identical without Create.
dependencies:
  required:
    apps: [vids]
    bots:
      - app: vids
        name: vids-operator
    tools: []
    connectors: []
  optional:
    apps: [create]   # owns the brand kit the brand chips read; absent, the chips stay hidden
    tools: []
    connectors: []

# Server-side TTS for narration defers to the swarm default (Google Cloud TTS when the
# operator OAuth profile is present). Override here to pin a specific provider.
voice:
  tts:
    provider: swarm-default

# The Video Studio's bots — inline on the api, registered in BOTH swarm-bot-registry
# blocks (kernel-resident). The personas here are package COPIES for the registrar;
# the inline nodes keep using /app/ai-lab (core).
bots:
  - agentId: a0000000-0000-0000-0000-000000000048
    name: video-director
    persona: personas/video-director.yaml
    role: video/storyboard-director
    capabilities:
      - video-storyboard
      - scene-direction
      - short-form-scripting
      - caption-writing

  # The SERIES screenwriter (ticketType video-series). Reason-only, inline on the api.
  # Its persona is the quality gate: four scenes, dialogue on every scene, no narrator,
  # a distinct camera per frame, motion-only direction. It writes; it never renders.
  - agentId: a0000000-0000-0000-0000-000000000052
    name: screenplay-writer
    persona: personas/screenplay-writer.yaml
    role: media/screenplay-writer
    capabilities:
      - episode-scripting
      - series-bible
      - dialogue-writing
      - shot-direction

# Vids owns the renderer. Its stable bot identity is imported above.

# A series is a queued, multi-stage job (unlike a single clip, which is interactive).
ticketType: video-series

# The stage hand-off store (video_series / video_episodes / episode scenes). COPIES of
# the kernel-owned 066/067 so fresh installs create the tables; both are idempotent.
migrations:
  - migrations/066-video-series.sql
  - migrations/067-video-episode-scenes.sql
  - migrations/070-video-series-storyboarding-status.sql
  - migrations/071-video-pump.sql
  - migrations/068-video-edit-projects.sql   # the manual editor's own private, forced-RLS tables
  - migrations/069-video-edit-exports.sql    # its export jobs, same forced two-arm policy

# ─────────────────────────────────────────────────────────────────────────────
# ROUTES — the packaged surface router, mounted /api/video on activation. (In core
# server.ts this was createBotVideoRoutes behind requiresAuth; it now mounts from
# this package, auth: oidc — ADR-085 D2.)
# ─────────────────────────────────────────────────────────────────────────────
routes:
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/video/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/video/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/video-routes.js
    factory: createBotVideoRoutes
    mountPath: /api/video
    auth: oidc   # what core server.ts mounted (requiresAuth — ADR-085 D2)
    requiresAuth: true
    requiresContext: true
  # The manual timeline editor (CREATE-EDIT-05): its own projects, owned media and revisions under
  # /api/video/editor. Mounted beside the studio; it makes no provider call and spends nothing.
  - module: routes/video-editor-routes.js
    factory: createVideoEditorRoutes
    mountPath: /api/video
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false
  # The joke-shorts pump's controls: import the show library, enrol a show (the operator's
  # one-time authorization for its render spend), read the node's availability + the run
  # ledger, run one cycle on demand. The pump ENGINE is framework-resident (ADR-093:
  # src/app/series-pump.ts + vids-node-availability.ts); this package owns the content and
  # the switches. Auth-gated exactly like the studio — enrolling a show authorizes spend.
  - module: routes/video-pump-routes.js
    factory: createVideoPumpRoutes
    mountPath: /api/video/pump
    auth: oidc
    requiresAuth: true
    requiresContext: true

# ── The series pipeline ────────────────────────────────────────────────────────────────
#
#   describe -> WRITE -> [approve the script] -> STORYBOARD -> RENDER (remote node) -> ASSEMBLE
#
# THE CONDUCTOR IS THE PIPELINE, NOT A GRAPH (ADR-082, resolved 2026-07-19): the
# state-machine conductor (advanceVideoSeries in the kernel's series-orchestrator)
# is the runtime — it holds at the approval gate ON THE SCRIPT, serializes renders,
# and hands off through the user_sub-keyed video_series / video_episodes tables.
# The workflow below only registers the `video-series` ticket type; a queue-approved
# ticket lands on the screenplay-writer — the same first step the conductor drives.
# (The dead `pipeline: graph` block was retired 2026-07-19; this package's
# tests/video-manifest-no-graph.spec.ts guards it never returns.)
workflow:
  name: Video Series Pipeline
  pipeline: manifest-worker
  workerBot: screenplay-writer

ui:
  static:
    - toolName: video-studio
      label: Video Studio
      icon: codicon codicon-device-camera-video
      iframeUrl: /api/video/ui
      section: top
    # The manual timeline editor: your own clips, trimmed, split, reordered, titled and scored, then exported.
    - toolName: video-editor
      label: Video editor
      icon: codicon codicon-edit
      iframeUrl: /api/video/editor
      section: top

# Trim the ribbon to the studio + the essentials. Hide the generic framework items.
ribbon:
  hideFrameworkItems:
    - chat
    - calendar
    - addressbook
    - dashboard
    - operations
  defaultView: video-studio

integrations:
  offers:
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
    - id: prepare-video
      label: Prepare a video clip
      targetApp: vids
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
  accepts:
    - id: prepare-brief
      contextType: research-brief
      version: 1
      surface: video-studio
      fields:
        - title
        - notes
        - sourceUrl

summary:
  path: /api/video/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items
