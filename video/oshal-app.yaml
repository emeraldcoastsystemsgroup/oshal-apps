# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | 1.6.2: ship the manual timeline editor's pure half (CREATE-EDIT-05a) - the shared timeline document contract, immutable operations, bounded history and the timeline-to-FFmpeg compiler - with two registered Lab cases. No route, table, permission or surface change.
# 2 | maintainer@emeraldcoastsystemsgroup.com | 1.7.0: the manual editor's persistence and routes (CREATE-EDIT-05b) - migration 068 (private forced-RLS projects, immutable revisions and owned media), the /api/video/editor routes mounted beside the studio, and Video's first named authorization catalog, which binds every existing studio, series, pump, summary and readiness endpoint as well. Activating this release on an installation with existing Video grants needs the reviewed AUTH-07 catalog migration; a legacy app-admin assignment is not translated.
# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.8.0: export jobs for the manual editor (CREATE-EDIT-05c) - migration 069 (forced two-arm owner RLS), the runtime FFmpeg behind a Video-owned adapter with one encode per process, one job per owner, four queued, cancellation that terminates only the tracked child, a private work directory that is always removed, epoch-scoped interruption on restart and publication only after the real output is decoded and verified. Five export bindings join the catalog; no new permission or role.
# 4 | maintainer@emeraldcoastsystemsgroup.com | 1.9.0: the manual editor screen (CREATE-EDIT-05d) - a Video editor tile at /api/video/editor: import clips and music with the native picker, trim, split, reorder and remove, clip and music volume, titles, undo and redo, frame-exact in-browser preview, save and reopen, and export or preview through the export jobs; every action has a keyboard equivalent. Three bindings join the catalog: the page and its fixed module allowlist under editor.view, and deleting one unused upload under editor.delete. Ships the installed-box acceptance walk (tests/editor-live-acceptance.mjs) with its committed one-second clip.
# 5 | maintainer@emeraldcoastsystemsgroup.com | 1.9.2: authorization.yaml binds the package's three bots to studio.generate, so a protected chat turn to the concierge (screenplay-writer) is admitted instead of refused authorization_operation_unbound. No route, tool or bot change.
# 6 | maintainer@emeraldcoastsystemsgroup.com | Import vids-operator from its single owning application, vids, instead of relying on global aliases or duplicate bot ownership.
# 7 | maintainer@emeraldcoastsystemsgroup.com | 1.9.4: declare existing series storyboarding and pump schema; await native ticket and screenplay acknowledgements.
# 8 | maintainer@emeraldcoastsystemsgroup.com | 1.9.5: use declared native media transport and full-read-set transactions while retaining ordinary PostgreSQL behavior.
# 9 | maintainer@emeraldcoastsystemsgroup.com | video-editor routing words "video studio" and "video project": "Create a new project in Video Studio" scored Scene Studio's "studio" and never this app, so Jarvis offered Scene Studio for it. No route, tool, permission or binding change.
# 10 | maintainer@emeraldcoastsystemsgroup.com | Sweep 13: the held editor tools read 'Video New Project' / 'Video Apply Edits' with no sentence on their approval cards; they are 'New video project' / 'Apply video edits' with a cardText each. Words only: no route, scope, schema or binding change.
# 11 | maintainer@emeraldcoastsystemsgroup.com | Declare protected owned-job discovery and approval-held Motion job import with closed inputs.
# -----------------------------------------------------------------------------
# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — video ("Video Studio")
# Carved out of OSHAL core 2026-07-19 (ADR-085 Wave 3, "skill with a surface" —
# ONLY the surface carves). This package is the app: the /api/video routes
# (storyboard / generate / list / series lifecycle — routes/video-routes.js built
# from src-routes/), the studio surface (tools/video.html, self-served at
# /api/video/ui from ctx.appPackageDir), package COPIES of the three personas for
# the registrar, and migration COPIES for fresh installs.
#
# What STAYS framework-resident per ADR-093 (this package ships none of it):
#   - the video-series CONDUCTOR engine (src/app/series-pipeline.ts /
#     series-orchestrator.ts / series-dispatch.ts / series-drive.ts) + the
#     startSeriesReconciler cron in server.ts — the packaged routes reach it via
#     @/ aliases; the conductor is the runtime (ADR-082);
#   - the src/features/video-generation slice (renderVideo, storyboard sanitizer,
#     Veo cost model);
#   - the video-director (…048) + screenplay-writer (…052) INLINE nodes,
#     registered in BOTH swarm-bot-registry blocks, + the kernel personas;
#   - scripts/migrations/066-video-series.sql + 067-video-episode-scenes.sql
#     (kernel-owned history; this package ships migrations/ COPIES so fresh
#     installs create the hand-off tables);
#   - the SHARED vids-operator remote-client desktop worker
#     (packages/oshal-vids-operator) + its registry entries — the render stage.
# Framework: OSHAL (see docs/adr/085-remote-app-packages-and-registries.md)
# ─────────────────────────────────────────────────────────────────────────────

name: video
suite: ai-creative   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features:
    - id: video-editing-command
      unit: editing command
      tier: T1
      generation: none
      degrade: disable
    - id: storyboard
      unit: storyboard
      tier: T2
      generation: none
      degrade: disable
    - id: clip-render
      unit: short video
      tier: T2
      generation: hosted
      degrade: disable
    - id: series-episode
      unit: series episode
      tier: T3
      generation: hosted
      degrade: disable
displayName: Video Studio
description: >-
  Make prompted short-form videos (TikTok / YouTube Shorts / Instagram Reels) from an idea.
  Shape the style, tone, length, captions and voiceover; the director storyboards it and the
  studio renders a real .mp4 with voiceover and captions, saved to your Files storage.
version: 1.11.0
status: active
chatBot: video-editor

# Per-app skin (approved palette) — sakura so the media studio reads distinct.
theme: sakura

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: video
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/video/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# Kernel skills this package IMPORTS (ADR-085 §2). Declared because an undeclared import is
# invisible to the prune guard: the first carve that drops the skill would break this app at
# MOUNT time, not at compile time. See docs/apps/kernel-skills.md.
uses:
  - media-generation # video-routes.js renders through the video-generation slice (Veo + storyboard)
  - storage          # video-routes.js saves finished MP4s through the kernel storage target
  - app-dependencies # compatibility floor for the tiered dependencies block (ADR-085 addendum)
  - test-catalog
  - application-authorization # the named catalog below; older cores refuse it instead of ignoring it
  - experience-roles

# ADR-149 named catalog: studio view/read/generate, pump management, and the manual editor's own
# view/read/create/change/delete/export. Every endpoint of every route below has a binding.
authorization:
  version: 1
  catalog: authorization.yaml
  roleTemplates:
    - id: admin
      version: 1
      label: Video Studio Administrator
      members:
        - { app: video, role: admin }
        - { app: vids, role: '@app-admin' }
        - { app: create, role: admin }
        - { app: motion-studio, role: administrator }
    - id: creator
      version: 1
      label: Video Creator
      members:
        - { app: video, role: producer }
        - { app: video, role: creator }
        - { app: video, role: editor }
        - { app: video, role: exporter }
        - { app: vids, role: '@app-admin' }
        - { app: create, role: creator }
        - { app: motion-studio, role: creator }

testing:
  version: 1
  catalog: tests/test-lab.yaml

# ── Cross-package prerequisites: what this package actually reaches ─────────
# OPTIONAL, NOT REQUIRED: tools/video.html:461 reads /api/create/brand-kit to offer the "in brand
# colours" chip. The chip stays hidden when the read returns nothing, so storyboarding, generation
# and the series lifecycle are identical without Create.
dependencies:
  required:
    apps: [vids]
    bots:
      - app: vids
        name: vids-operator
    tools: []
    connectors: []
  optional:
    apps: [create, motion-studio] # optional brand kit and exact editable Motion render source
    tools: []
    connectors: []

# Server-side TTS for narration defers to the swarm default (Google Cloud TTS when the
# operator OAuth profile is present). Override here to pin a specific provider.
voice:
  tts:
    provider: swarm-default

# The Video Studio's bots — inline on the api, registered in BOTH swarm-bot-registry
# blocks (kernel-resident). The personas here are package COPIES for the registrar;
# the inline nodes keep using /app/ai-lab (core).
bots:
  - agentId: c504b2de-81f6-44c9-bad5-b4c042b7c4c6
    name: video-editor
    persona: personas/video-editor.yaml
    posture: inline
    role: creative/video-editor
    capabilities:
      - video-project-inspection
      - video-revision-editing
    selectorDescriptor: >-
      Select for owned Video manual timeline projects: multitrack clips, linked audio, fades, keyframes,
      captions and render jobs. Prompted video storyboards remain video-director; series scripts remain
      screenplay-writer.
    routingKeywords:
      - video studio
      - video project
      - multitrack
      - video editing
      - timeline
      - trim clips
      - video captions
  - agentId: a0000000-0000-0000-0000-000000000048
    name: video-director
    persona: personas/video-director.yaml
    role: video/storyboard-director
    capabilities:
      - video-storyboard
      - scene-direction
      - short-form-scripting
      - caption-writing

  # The SERIES screenwriter (ticketType video-series). Reason-only, inline on the api.
  # Its persona is the quality gate: four scenes, dialogue on every scene, no narrator,
  # a distinct camera per frame, motion-only direction. It writes; it never renders.
  - agentId: a0000000-0000-0000-0000-000000000052
    name: screenplay-writer
    persona: personas/screenplay-writer.yaml
    role: media/screenplay-writer
    capabilities:
      - episode-scripting
      - series-bible
      - dialogue-writing
      - shot-direction

# Vids owns the renderer. Its stable bot identity is imported above.

# A series is a queued, multi-stage job (unlike a single clip, which is interactive).
ticketType: video-series

# The stage hand-off store (video_series / video_episodes / episode scenes). COPIES of
# the kernel-owned 066/067 so fresh installs create the tables; both are idempotent.
migrations:
  - migrations/066-video-series.sql
  - migrations/067-video-episode-scenes.sql
  - migrations/070-video-series-storyboarding-status.sql
  - migrations/071-video-pump.sql
  - migrations/068-video-edit-projects.sql   # the manual editor's own private, forced-RLS tables
  - migrations/072-video-motion-sources.sql # immutable exact-owner editable Motion source lineage
  - migrations/069-video-edit-exports.sql    # its export jobs, same forced two-arm policy

# ─────────────────────────────────────────────────────────────────────────────
# ROUTES — the packaged surface router, mounted /api/video on activation. (In core
# server.ts this was createBotVideoRoutes behind requiresAuth; it now mounts from
# this package, auth: oidc — ADR-085 D2.)
# ─────────────────────────────────────────────────────────────────────────────
routes:
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/video/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/video/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/video-routes.js
    factory: createBotVideoRoutes
    mountPath: /api/video
    auth: oidc   # what core server.ts mounted (requiresAuth — ADR-085 D2)
    requiresAuth: true
    requiresContext: true
  # The manual timeline editor (CREATE-EDIT-05): its own projects, owned media and revisions under
  # /api/video/editor. Mounted beside the studio; it makes no provider call and spends nothing.
  - module: routes/video-editor-routes.js
    factory: createVideoEditorRoutes
    mountPath: /api/video
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false
  # The joke-shorts pump's controls: import the show library, enrol a show (the operator's
  # one-time authorization for its render spend), read the node's availability + the run
  # ledger, run one cycle on demand. The pump ENGINE is framework-resident (ADR-093:
  # src/app/series-pump.ts + vids-node-availability.ts); this package owns the content and
  # the switches. Auth-gated exactly like the studio — enrolling a show authorizes spend.
  - module: routes/video-pump-routes.js
    factory: createVideoPumpRoutes
    mountPath: /api/video/pump
    auth: oidc
    requiresAuth: true
    requiresContext: true

# ── The series pipeline ────────────────────────────────────────────────────────────────
#
#   describe -> WRITE -> [approve the script] -> STORYBOARD -> RENDER (remote node) -> ASSEMBLE
#
# THE CONDUCTOR IS THE PIPELINE, NOT A GRAPH (ADR-082, resolved 2026-07-19): the
# state-machine conductor (advanceVideoSeries in the kernel's series-orchestrator)
# is the runtime — it holds at the approval gate ON THE SCRIPT, serializes renders,
# and hands off through the user_sub-keyed video_series / video_episodes tables.
# The workflow below only registers the `video-series` ticket type; a queue-approved
# ticket lands on the screenplay-writer — the same first step the conductor drives.
# (The dead `pipeline: graph` block was retired 2026-07-19; this package's
# tests/video-manifest-no-graph.spec.ts guards it never returns.)
workflow:
  name: Video Series Pipeline
  pipeline: manifest-worker
  workerBot: screenplay-writer

ui:
  static:
    - toolName: video-studio
      label: Video Studio
      icon: codicon codicon-device-camera-video
      iframeUrl: /api/video/ui
      section: top
    # The manual timeline editor: your own clips, trimmed, split, reordered, titled and scored, then exported.
    - toolName: video-editor
      label: Video editor
      icon: codicon codicon-edit
      iframeUrl: /api/video/editor
      section: top

# Trim the ribbon to the studio + the essentials. Hide the generic framework items.
ribbon:
  hideFrameworkItems:
    - chat
    - calendar
    - addressbook
    - dashboard
    - operations
  defaultView: video-studio

integrations:
  offers:
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
    - id: prepare-video
      label: Prepare a video clip
      targetApp: vids
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
  accepts:
    - id: prepare-brief
      contextType: research-brief
      version: 1
      surface: video-studio
      fields:
        - title
        - notes
        - sourceUrl

summary:
  path: /api/video/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items

# Route-backed tools run as the original caller; edits use the existing approval cards.
tools:
  - name: video-editing-contract
    displayName: Video Editing Contract
    type: api
    category: creative
    description: Read the installed editing operations, examples, limits and unsupported features.
    executor:
      executorType: api
      apiEndpoint: GET /api/video/editor/editing-contract
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      additionalProperties: false
    usageInstructions: >-
      Read this before constructing edits. It describes the installed source contract; it does not certify
      installed rendering.
    routingTags:
      - creative
      - editing
    skills:
      - creative-editing
    tags:
      - route-backed
  - name: video-list-projects
    displayName: Video List Projects
    type: api
    category: creative
    description: List this person’s own saved editing projects.
    executor:
      executorType: api
      apiEndpoint: GET /api/video/editor/projects
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      additionalProperties: false
    usageInstructions: Choose a project returned here; never guess an id or ownership.
    routingTags:
      - creative
      - editing
    skills:
      - creative-editing
    tags:
      - route-backed
  - name: video-read-project
    displayName: Video Read Project
    type: api
    category: creative
    description: Inspect an owned project document and its exact current revision.
    executor:
      executorType: api
      apiEndpoint: GET /api/video/editor/projects/{input.id}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        id:
          type: string
          minLength: 36
          maxLength: 36
      required:
        - id
      additionalProperties: false
    usageInstructions: >-
      Read before editing; use actual layer/track/source/clip ids and returned revision. Large documents may
      exceed bounded tool output; ask for the editor surface rather than invent missing data.
    routingTags:
      - creative
      - editing
    skills:
      - creative-editing
    tags:
      - route-backed
  - name: video-new-project
    displayName: New video project
    type: api
    category: creative
    description: Create an empty owned editable project.
    executor:
      executorType: api
      apiEndpoint: POST /api/video/editor/agent-projects
    defaultAuthMode: ask
    requiresApproval: true
    cardText: Creates an empty video project you can open from the Video editor tab.
    inputSchema:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - title
      additionalProperties: false
    usageInstructions: >-
      Create only when requested. Returns an owned saved project. Video starts with empty video1/audio1
      tracks; Create starts with an empty canvas.
    routingTags:
      - creative
      - editing
    skills:
      - creative-editing
    tags:
      - route-backed
  - name: video-apply-edits
    displayName: Apply video edits
    type: api
    category: creative
    description: Apply a bounded batch of immutable editing operations as one new owned revision.
    executor:
      executorType: api
      apiEndpoint: POST /api/video/editor/projects/{input.id}/operations
    defaultAuthMode: ask
    requiresApproval: true
    cardText: Saves these edits to your video project as a new revision.
    inputSchema:
      type: object
      properties:
        id:
          type: string
          minLength: 36
          maxLength: 36
        baseRevision:
          type: integer
          minimum: 1
          maximum: 100000
        operations:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required:
              - type
            properties:
              type:
                type: string
                enum:
                  - migrate
                  - rename
                  - addSource
                  - removeSource
                  - replaceMotionSource
                  - addTrack
                  - track
                  - addClip
                  - clip
                  - moveClip
                  - removeClip
                  - split
                  - extractAudio
                  - unlink
                  - text
                  - removeText
              id:
                type: string
                maxLength: 100
              name:
                type: string
                minLength: 1
                maxLength: 120
              key:
                type: string
                maxLength: 32
              kind:
                type: string
                enum:
                  - video
                  - audio
              track:
                type: string
                maxLength: 100
              patch:
                type: object
              entry:
                type: object
              start:
                type: integer
                minimum: 0
                maximum: 1800
              in:
                type: integer
                minimum: 0
                maximum: 1800
              out:
                type: integer
                minimum: 1
                maximum: 1800
              frame:
                type: integer
                minimum: 0
                maximum: 1800
              ripple:
                type: boolean
              sourceKey:
                type: string
                maxLength: 32
              sourceMetadata:
                type: object
      required:
        - id
        - baseRevision
        - operations
      additionalProperties: false
    usageInstructions: >-
      Read editing-contract and read-project first. Use returned revision exactly; at most16 operations/16KiB
      total. One batch saves one revision. Existing open browser drafts need an explicit reload. On conflict
      re-read and reconsider intent; never retry blindly. The person approves the exact edit card before
      execution.
    routingTags:
      - creative
      - editing
    skills:
      - creative-editing
    tags:
      - route-backed
  - name: video-render-project
    displayName: Video Render Project
    type: api
    category: creative
    description: Start an actual owned preview or MP4 export job for an explicit saved revision.
    executor:
      executorType: api
      apiEndpoint: POST /api/video/editor/projects/{input.id}/exports
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        id:
          type: string
          minLength: 36
          maxLength: 36
        revision:
          type: integer
          minimum: 1
          maximum: 100000
        variant:
          type: string
          enum:
            - preview
            - export
      required:
        - id
        - revision
        - variant
      additionalProperties: false
    usageInstructions: >-
      Do not claim completion from accepted/queued. Poll video-render-status; native/runtime failures are real
      and must be reported.
    routingTags:
      - creative
      - editing
    skills:
      - creative-editing
    tags:
      - route-backed
  - name: video-list-renders
    displayName: Video List Renders
    type: api
    category: creative
    description: List owned render jobs for a project.
    executor:
      executorType: api
      apiEndpoint: GET /api/video/editor/projects/{input.id}/exports
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        id:
          type: string
          minLength: 36
          maxLength: 36
      required:
        - id
      additionalProperties: false
    usageInstructions: Read actual job states; no rendering is started.
    routingTags:
      - creative
      - editing
    skills:
      - creative-editing
    tags:
      - route-backed
  - name: video-render-status
    displayName: Video Render Status
    type: api
    category: creative
    description: Read one owned render job status and output measurements.
    executor:
      executorType: api
      apiEndpoint: GET /api/video/editor/exports/{input.id}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        id:
          type: string
          minLength: 36
          maxLength: 36
      required:
        - id
      additionalProperties: false
    usageInstructions: >-
      Only a succeeded job has a usable output. Link /api/video/editor/exports/<returned id>/download only
      after succeeded. Do not invent output or provider results.
    routingTags:
      - creative
      - editing
    skills:
      - creative-editing
    tags:
      - route-backed
  - name: video-cancel-render
    displayName: Video Cancel Render
    type: api
    category: creative
    description: Cancel one owned render job.
    executor:
      executorType: api
      apiEndpoint: POST /api/video/editor/exports/{input.id}/cancel
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        id:
          type: string
          minLength: 36
          maxLength: 36
      required:
        - id
      additionalProperties: false
    usageInstructions: Cancel only the job the person requested. Report actual returned state.
    routingTags:
      - creative
      - editing
    skills:
      - creative-editing
    tags:
      - route-backed

  - name: video-list-motion-renders
    displayName: Find owned Motion renders
    type: api
    category: creative
    description: List every ready owned Motion MP4 with its actual composition title, immutable revision and render profile. Requires original Writer and current Motion export access.
    executor:
      executorType: api
      apiEndpoint: POST /api/video/editor/motion-renders
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      additionalProperties: false
      properties: {}
    usageInstructions: >-
      Discover actual ready Motion jobs before proposing an import. Resolve a named composition from the protected
      returned title and revision; ask if ambiguous. Returns jobs, at most two complete ready MP4 receipts;
      overflow refuses rather than silently omitting a render. This metadata call creates no project, render,
      handle or media. It still requires original Writer Video read/change and current Motion export authority.
      Report source duration/size/profile incompatibility honestly; never invent a job or handle.
    routingTags: [creative, editing, motion]
    skills: [creative-editing]
    tags: [route-backed]
  - name: video-import-motion-render-job
    displayName: Import owned Motion render
    type: api
    category: creative
    description: Import an actual discovered owned ready Motion job through native typed exchange and preserve its editable composition source.
    cardText: Import this owned Motion render into your Video media with its editable source link.
    executor:
      executorType: api
      apiEndpoint: POST /api/video/editor/motion-render-jobs/{input.id}/import
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      required: [id, name, requestKey]
      properties:
        id: { type: string, minLength: 36, maxLength: 36 }
        name: { type: string, minLength: 1, maxLength: 120 }
        requestKey: { type: string, minLength: 36, maxLength: 36 }
    usageInstructions: >-
      Use the actual id returned by video-list-motion-renders, not a guessed source or caller lineage.
      Generate one requestKey UUID and retain it for an uncertain same-render reply; native recovery is bounded
      to one hour and the current source generation. Approval mints a typed owned Motion handle internally
      and uses the existing verified H264 import. It returns sourceMetadata and sourceUrl, not a saved Video edit.
