<tspan x="56" y="38.0">TRIAGENORTH / PRODUCT DESIGN</tspan>
</text>
<text font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#14233B">
<tspan x="56" y="93.0">Keep the workflow and external issue aligned</tspan>
</text>
<text font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#576B83">
<tspan x="56" y="128.0">Development-installed shared services; original-person authority and transport acceptance remain separate from release certification.</tspan>
</text>
