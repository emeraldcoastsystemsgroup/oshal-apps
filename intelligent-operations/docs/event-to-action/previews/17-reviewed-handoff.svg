<tspan x="442" y="218.0">Immutable mapping</tspan>
</text>
<text font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#576B83">
<tspan x="442" y="253.0">Personal named account</tspan>
<tspan x="442" y="275.95">Selected endpoint revision</tspan>
<tspan x="442" y="298.9">Explicit provider state IDs</tspan>
</text>
<rect x="792" y="185" width="320" height="160" rx="10" fill="#E8F7F4" stroke="#D6E0EB"/>
<rect x="792" y="197" width="4" height="136" rx="1" fill="#007F88" stroke="#007F88"/>
