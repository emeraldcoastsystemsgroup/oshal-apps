<tspan x="74" y="218.0">Canonical workflow</tspan>
</text>
<text font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#576B83">
<tspan x="74" y="253.0">Owned ticket + exact revision</tspan>
<tspan x="74" y="275.95">Status + phase trigger</tspan>
<tspan x="74" y="298.9">No second ticket engine</tspan>
</text>
<rect x="424" y="185" width="320" height="160" rx="10" fill="#F3F6FA" stroke="#D6E0EB"/>
