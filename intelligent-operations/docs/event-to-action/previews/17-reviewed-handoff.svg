<tspan x="810" y="218.0">Review and confirm</tspan>
</text>
<text font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#576B83">
<tspan x="810" y="253.0">Show proposed operation</tspan>
<tspan x="810" y="275.95">Reserve before dispatch</tspan>
<tspan x="810" y="298.9">Recheck authority + revision</tspan>
</text>
<rect x="1160" y="185" width="384" height="160" rx="10" fill="#E8F7F4" stroke="#D6E0EB"/>
