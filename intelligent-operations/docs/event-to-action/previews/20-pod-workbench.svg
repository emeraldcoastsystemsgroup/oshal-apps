<tspan x="74" y="748.0">Operational limits</tspan>
</text>
<text font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#576B83">
<tspan x="74" y="781.0">Initial console: bounded single commands, no stdin/TTY. Check UID before and after; this is not an atomic exec precondition. A client timeout does not prove remote termination or service</tspan>
<tspan x="74" y="801.25">recovery.</tspan>
</text>
