</text>
<text font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#576B83">
<tspan x="496" y="258.0">Baseline / warm-up / missing samples</tspan>
<tspan x="496" y="280.95">Score, confidence and window</tspan>
<tspan x="496" y="303.9">Known shift versus normal control</tspan>
</text>
