</text>
<text font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#576B83">
<tspan x="1062" y="478.0">Bounded event-time graph</tspan>
<tspan x="1062" y="500.95">Explicit degraded fallback</tspan>
<tspan x="1062" y="523.9">Only then capture and investigate</tspan>
</text>
<rect x="56" y="633" width="1488" height="147" rx="10" fill="#FFF2DC" stroke="#D6E0EB"/>
<rect x="56" y="645" width="4" height="123" rx="1" fill="#AE6500" stroke="#AE6500"/>
<text font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#20334D">
<tspan x="74" y="666.0">Service acceptance required</tspan>
</text>
<text font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#576B83">
<tspan x="74" y="702.0">Cold / stale / unavailable is not healthy. Prove baseline and injected shift, false positives, late data, two workers, crash recovery and bounded collection.</tspan>
<tspan x="74" y="726.3">A fixed threshold or imported score does not prove an anomaly engine.</tspan>
</text>
