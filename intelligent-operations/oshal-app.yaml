# CHANGE LOG: 27 | maintainer@emeraldcoastsystemsgroup.com | Drop the routing phrase "inventory health": it tied Operations with Finance on "What's the health of my cluster?" (kernel jarvis_routing guard); "degraded systems" and "is the inventory current" keep systems questions routed.
# CHANGE LOG: 26 | maintainer@emeraldcoastsystemsgroup.com | Routing words for hand-offs and investigations as people actually ask ("handed to us by another swarm", "my investigations"); the live Jarvis check missed the first.
# CHANGE LOG: 25 | maintainer@emeraldcoastsystemsgroup.com | Jarvis tools ops-systems, ops-response-plans and ops-anomalies (reads of the caller's own summaries) and routing words for system health, remediation and anomalies.
# CHANGE LOG: 24 | maintainer@emeraldcoastsystemsgroup.com | Scheduled live discovery: declare connector.read.kubernetes (kernel ADR-196, reads only, shown at consent) and say in the schedule offer that it refreshes the chosen cluster's inventory when turned on.
# CHANGE LOG: 23 | maintainer@emeraldcoastsystemsgroup.com | Git explorer: repository-link migrations and the Git explorer navigation entry.
# CHANGE LOG: 22 | maintainer@emeraldcoastsystemsgroup.com | Jarvis works inside Operations: read-only tools ops-attention, ops-handoffs and ops-investigations over the caller's own routes, and routing words for operations attention and swarm hand-offs (contract change).
# CHANGE LOG: 21 | maintainer@emeraldcoastsystemsgroup.com | Provisioning: migrations and the Provisioning navigation entry.
# CHANGE LOG: 20 | maintainer@emeraldcoastsystemsgroup.com | Swarm hand-off: delegations migrations and the Swarm hand-off navigation entry (kernel ADR-194).
# CHANGE LOG: 19 | maintainer@emeraldcoastsystemsgroup.com | Register Git promotion storage with native caller-isolated migration ownership.
# CHANGE LOG: 18 | maintainer@emeraldcoastsystemsgroup.com | Add the Command helper toolbar entry and its own-scope command records; the package still executes nothing itself.
# CHANGE LOG: 17 | maintainer@emeraldcoastsystemsgroup.com | Use the kernel notification rail (notify.send) so a scheduled tick can tell the person about admitted symptoms, anomaly candidates and failures through their own channel preferences.
# CHANGE LOG: 16 | maintainer@emeraldcoastsystemsgroup.com | Register the anomaly service state with native caller-isolated migration ownership.
# CHANGE LOG: 15 | maintainer@emeraldcoastsystemsgroup.com | Register the response stage storage (plans, byte-exact artifacts, approvals, executions) with native caller-isolated migration ownership, and describe reviewed exec remediation honestly: approval is bound to exact artifacts and target, execution is the person's own confirmed connection, recovery is a measured outcome.
# CHANGE LOG: 14 | maintainer@emeraldcoastsystemsgroup.com | Describe installed operator evidence views and separately admitted pod access accurately.
# CHANGE LOG: 13 | maintainer@emeraldcoastsystemsgroup.com | Expose consistent native navigation, default Systems inspection and a canonical-source RCA library.
# CHANGE LOG: 12 | maintainer@emeraldcoastsystemsgroup.com | Declare original-person manual ticket handoff storage with native scope isolation.
# CHANGE LOG: 11 | maintainer@emeraldcoastsystemsgroup.com | Persist caller-owned links from reserved evidence to canonical investigation tickets.
# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | Native port of the platform's Intelligent Operations RCA queue. The native kernel held only its migrated declaration (no bots, workflow or queue registered), so activating it opened an empty application. Its bots are now declared here under names the kernel does not own (its fleet already has rca-specialist), and the platform reviewer loop (reviewerBot queue-bot, maxRevisions 2) is written out as explicit phases: investigate, review, revise. It replaces Issue RCA, Incident Remediation and SAP Incident, which the platform retired into it on 2026-06-18. The platform's runbook corpus, log and cluster access are not available to a native bot; the description and personas say so.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Correct entry 1: the platform unified Issue RCA and Incident Remediation into this application (header of its swarm-apps/intelligent-operations.yaml); SAP Incident was not part of that and stays a turned-off migrated declaration, because its sap-rca-specialist persona and sap-runbooks corpus exist in no repository.
# 3 | maintainer@emeraldcoastsystemsgroup.com | Ship the store's canonical service-authenticated package-readiness route (routes/package-smoke.js, byte-identical to the reviewed module) and its smoke expectation, which the store security contract requires of every package except Pumpkin and the four front-door groups. It reads only this manifest; no screen, user data or model call.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Correct entry 2: SAP Incident's sap-rca-specialist persona and its manifest (swarm-apps-incident/sap-incident.yaml) are in the archived core trunk at commit 41da137, not in the current platform tree or the stores, and its sap-runbooks corpus was populated by an operator from SAP documentation; this installation searches no such collection. SAP Incident is not yet ported and stays a turned-off migrated declaration.
# 6 | maintainer@emeraldcoastsystemsgroup.com | Register the signed-in experience with named reader/operator roles and caller-owned source, event and inventory records.
# 5 | maintainer@emeraldcoastsystemsgroup.com | Add the package-owned Operations incident workspace and local alert-format preview, preserving the workflow and specialist identities. Automatic monitoring and infrastructure execution remain unavailable. Register foundation checks with Test Lab.
# 7 | maintainer@emeraldcoastsystemsgroup.com | Keep report acceptance separate from infrastructure execution and link the incident experience to the native ticket board.
# 8 | maintainer@emeraldcoastsystemsgroup.com | Define the focused Operations toolbar and preserve its app context when opening canonical tickets.
# 9 | maintainer@emeraldcoastsystemsgroup.com | Open the existing estate toolbar destination on the current-user Systems inventory lens; detailed topology remains linked inside it.
# 10 | maintainer@emeraldcoastsystemsgroup.com | Register three-bank telemetry storage and native caller-isolated migration ownership.
name: intelligent-operations
suite: ai-engineering
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 192, high: 768, basis: declared }
  features:
    - id: incident-rca
      unit: incident ticket
      tier: T3
      generation: none
      degrade: disable
displayName: Intelligent Operations
description: >-
  Inspect source-owned telemetry, recorded topology and incident work in an operator workspace.
  Stored-query filtering, noise reduction and bounded evidence packets support accountable RCA
  investigation and review. A separately configured personal Kubernetes connection enables current
  pod inspection, logs and reviewed commands; the evidence-only analysis bot receives selected
  results and no cluster credential. Report acceptance does not establish verified recovery. A
  generated response (remediate.sh, verify.sh, rollback.md, verify.md) can be approved as exact
  artifacts for one exec on one observed pod through that same personal connection, then verified
  against a resolved signal before the canonical ticket is updated.
version: 1.1.1
status: active
scope: public
theme: midnight
access:
  supported: [deny, viewer, editor, admin]
  defaultTier: editor
source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: intelligent-operations
  ref: main
uses:
  - application-authorization
  - experience
  - app-dependencies
  - test-catalog
  - notify.send
  - connector.read.kubernetes
  - connector.read.splunk
  - connector.read.jira
  - connector.read.gitlab
  - connector.read.servicenow
testing:
  version: 1
  catalog: tests/test-lab.yaml
smoke:
  - name: package-readiness
    method: GET
    path: /api/intelligent-operations/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false
authorization:
  version: 1
  catalog: authorization.yaml
experience:
  version: 1
  label: Operations
  entry: /api/intelligent-operations/app
  shell: page
  skin: midnight
  surfaces: []
routes:
  - module: routes/experience.js
    factory: createOperationsExperienceRoutes
    mountPath: /api/intelligent-operations
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/intelligent-operations/_smoke
    auth: service
    requiresContext: true
    requiresAi: false
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: []
    tools: []
    connectors: []

# The package-owned workspace reads the canonical ticket projection; no alternate incident engine.
ticketType: intelligent-operations
workflow:
  name: Intelligent Operations RCA Pipeline
  phases:
    - name: investigate
      bot: ops-rca-specialist
    - name: review
      bot: ops-incident-reviewer
    - name: revise
      bot: ops-rca-specialist
    - name: queue-deliver
      action: complete
      approval:
        approver: admin
chatBot: ops-rca-specialist
ui:
  static:
    - toolName: operations-workspace
      label: Overview
      icon: codicon codicon-server-environment
      iframeUrl: /api/intelligent-operations/app#overview
      section: top
    - toolName: operations-estate
      label: Systems
      icon: codicon codicon-type-hierarchy
      iframeUrl: /api/intelligent-operations/app#systems
      section: top
    - toolName: operations-data
      label: Data pipeline
      icon: codicon codicon-filter
      iframeUrl: /api/intelligent-operations/app#data
      section: top
    - toolName: operations-sources
      label: Sources
      icon: codicon codicon-plug
      iframeUrl: /api/intelligent-operations/app#sources
      section: top
    - toolName: operations-topology
      label: Topology
      icon: codicon codicon-type-hierarchy
      iframeUrl: /api/intelligent-operations/app#estate
      section: top
    - toolName: operations-streams
      label: Live context
      icon: codicon codicon-pulse
      iframeUrl: /api/intelligent-operations/app#streams
      section: top
    - toolName: operations-replay
      label: Scenario lab
      icon: codicon codicon-beaker
