# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | Native port of the platform's Intelligent Operations RCA queue. The native kernel held only its migrated declaration (no bots, workflow or queue registered), so activating it opened an empty application. Its bots are now declared here under names the kernel does not own (its fleet already has rca-specialist), and the platform reviewer loop (reviewerBot queue-bot, maxRevisions 2) is written out as explicit phases: investigate, review, revise. It replaces Issue RCA, Incident Remediation and SAP Incident, which the platform retired into it on 2026-06-18. The platform's runbook corpus, log and cluster access are not available to a native bot; the description and personas say so.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Correct entry 1: the platform unified Issue RCA and Incident Remediation into this application (header of its swarm-apps/intelligent-operations.yaml); SAP Incident was not part of that and stays a turned-off migrated declaration, because its sap-rca-specialist persona and sap-runbooks corpus exist in no repository.
# 3 | maintainer@emeraldcoastsystemsgroup.com | Ship the store's canonical service-authenticated package-readiness route (routes/package-smoke.js, byte-identical to the reviewed module) and its smoke expectation, which the store security contract requires of every package except Pumpkin and the four front-door groups. It reads only this manifest; no screen, user data or model call.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Correct entry 2: SAP Incident's sap-rca-specialist persona and its manifest (swarm-apps-incident/sap-incident.yaml) are in the archived core trunk at commit 41da137, not in the current platform tree or the stores, and its sap-runbooks corpus was populated by an operator from SAP documentation; this installation searches no such collection. SAP Incident is not yet ported and stays a turned-off migrated declaration.
# 6 | maintainer@emeraldcoastsystemsgroup.com | Register the signed-in experience with named reader/operator roles and caller-owned source, event and inventory records.
# 5 | maintainer@emeraldcoastsystemsgroup.com | Add the package-owned Operations incident workspace and local alert-format preview, preserving the workflow and specialist identities. Automatic monitoring and infrastructure execution remain unavailable. Register foundation checks with Test Lab.
# 7 | maintainer@emeraldcoastsystemsgroup.com | Keep report acceptance separate from infrastructure execution and link the incident experience to the native ticket board.
# 8 | maintainer@emeraldcoastsystemsgroup.com | Define the focused Operations toolbar and preserve its app context when opening canonical tickets.
# 9 | maintainer@emeraldcoastsystemsgroup.com | Open the existing estate toolbar destination on the current-user Systems inventory lens; detailed topology remains linked inside it.
# 10 | maintainer@emeraldcoastsystemsgroup.com | Register three-bank telemetry storage and native caller-isolated migration ownership.
# 11 | maintainer@emeraldcoastsystemsgroup.com | 1.1.3: migration 031's cohort index is a btree on (user_sub, created_at DESC); the native kernel's migration grammar accepts btree indexes only (crates/packages/src/sql_constraints/ddl.rs index_contract), so the GIN expression index refused the whole declared set and the package's tables were never provisioned in a scope on the native kernel (the Spark, 2026-11-03). The ?| lookup it served stays correct without it. tests/migrations-native-grammar.test.cjs guards every migration against that grammar.
# 12 | maintainer@emeraldcoastsystemsgroup.com | 1.1.4: Connections gains Your SSH connection (experience/command-helper.js mountConnection, inside the bound SSH asset, since the catalog binds each asset path): the username and the key file (or the pasted key) are checked in the browser (OpenSSH envelope, ed25519, no passphrase) and saved as the kernel's ssh connection {"username","privateKey"} (ADR-195) through POST /connectors/ssh/connect; the card reads its standing, lists the administrator-selected hosts under one confirmation, checks the login with one confirmed uptime recorded as a command run, and disconnects. Cloud & SSH commands names a missing connection instead of clearing the page on the kernel's 403 capability_not_granted. The standard Connections dialog's one masked line saved a pasted key that never logged in (the Spark, 2026-11-03). The Credentials & access SSH card opens that card, never the standard dialog. Review fixes the same day: the key leaves the page once the kernel has it or a retry cannot change the answer, the kernel's capability refusal keeps its meaning (missing, revoked or expired, turned off), a record the kernel cannot read is named on Check login, Disconnect says revoked, a lapsed session names the way back, pastes are canonicalized, no save where no hosts are selected.
# 13 | maintainer@emeraldcoastsystemsgroup.com | 1.1.5: Investigate again: an evidence card whose ticket failed or was cancelled opens a fresh ticket for the same sealed evidence through the same POST /investigations (again:true) and records the earlier attempt; the scheduled tick never retries. On the Spark three dev-droplet investigations were settled no_live_claimant while the operator worker was down (2026-10-23 to 2026-11-03) and could never run again. The Overview incident card keeps the Operations tickets of a person with more than 1,000 tickets (its cap on the whole list said "Incident work response is unavailable"), and both incident lists and the evidence cards name each investigation by its alert. Git explorer: a provider switch's late load no longer erases a newer message (the store gate failed on it under load).
# 14 | maintainer@emeraldcoastsystemsgroup.com | 1.1.6: Monitored installations (Roger, 2026-11-03: no proof the dev droplet is monitored). A droplet's InstallationHeartbeat alert arrives every minute through the same producer door and route as its alerts, and is never admitted as an event: Operations keeps its time and readings, 15-minute history for 14 days, the readings in the source's telemetry banks and the droplet with its containers in the topology. Systems and Overview show each installation: when it was last heard, every check in words, what is firing and the charts. The processing tick raises InstallationSilent when one stops reporting for 10 minutes (a dead droplet cannot report its own death), the next report clears it, and a gap in the schedule itself blames nobody. Fixed on the way: every later outage of an alert was refused as a conflict, because its event id had no start time. No catalog change, no new asset path: delivering it suspends no assignment.
# 18 | maintainer@emeraldcoastsystemsgroup.com | 1.1.10, what a fourth review proved on the real stack (2026-11-04). Only the tick's own decisions reach the phone, because 1.1.8 paged a replay's synthetic alerts. Each report carries what Prometheus lists and how long it has been up, which now decides whether an alert cleared, including when no resolve ever comes, so a quick restart, a dead exporter or a wrong clock says nothing false and a reboot leaves nothing standing. An engine outage spends no retries and names a critical once. A message fits the shortest rail with what is firing first. Each failing step is its own news. A rail that keeps refusing is on the attention list. The kernel's conflict wording retries like any conflict. Discovery and detection stop at the tick's deadline, and correlation deferred by it is owed to the next tick.
# 16 | maintainer@emeraldcoastsystemsgroup.com | 1.1.8, what a third review proved on the real stack (2026-11-04). The phone: a message is owed until the rail takes it, from the decisions on record, naming the latest word per alert, and cleared is not said while another of that type is on the card or when a dead Prometheus's alerts time out. The tick: alarms first, one failing step stops only itself, it tells the phone once per failing streak, and it starts nothing new after 25 s so the kernel never ends it at 60 s. A blip that becomes an outage gets its evidence after the window. Stop watching refuses a server still reporting. Jarvis says when the silence watch has stopped. The Overview no longer says healthy under a firing critical, and a page with failed reads no longer calls a healthy server silent or offers to delete it.
# 15 | maintainer@emeraldcoastsystemsgroup.com | 1.1.7, what two independent reviews of Monitored installations proved. The alarm: a failed admit no longer loses InstallationSilent or its resolve, both stay owed and the tick retries them; one report between two silences is a second occurrence; a resolve evaluated first makes the older firing late; a flap inside the window is recorded and told with no second packet or ticket. The phone: critical alerts only, as they fire, fire again and clear, and a second container is its own symptom and message. Jarvis: ops-attention and ops-systems name what is silent and what critical is firing. Evidence: a packet seals one series per reading and is bounded in bytes, and one already over the ceiling is a refused start instead of holding a slot for good. GET /telemetry says when the watch last ran; scans every 10 minutes; a delivery whose admission failed answers 503; stopping the watch leaves nothing behind. Guards: tests/installations-alarm.test.cjs, tests/installations-screen.test.cjs.
# 16 | maintainer@emeraldcoastsystemsgroup.com | Roger, 2026-11-04: the default look is now Light Blue, "the white background blue highlights"; this package declared midnight, so it now declares light-blue. A person's saved theme still wins.
name: intelligent-operations
suite: ai-engineering
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 192, high: 768, basis: declared }
  features:
    - id: incident-rca
      unit: incident ticket
      tier: T3
      generation: none
      degrade: disable
displayName: Intelligent Operations
description: >-
  Watch monitored installations and recorded server health: last-heard times, firing alerts, and
  healthy, degraded or unknown assets. Inspect source-owned telemetry, recorded topology and
  incident work in an operator workspace.
  Stored-query filtering, noise reduction and bounded evidence packets support accountable RCA
  investigation and review. A separately configured personal Kubernetes connection enables current
  pod inspection, logs and reviewed commands; the evidence-only analysis bot receives selected
  results and no cluster credential. Report acceptance does not establish verified recovery. A
  generated response (remediate.sh, verify.sh, rollback.md, verify.md) can be approved as exact
  artifacts for one exec on one observed pod through that same personal connection, then verified
  against a resolved signal before the canonical ticket is updated. Four monitoring desks over the
  same pipeline, App Ops, Sec Ops, Platform Ops and Dev Ops, each with its own alert rules, alert
  topic and role: what is firing in security, in the platform, in the applications or in releases.
version: 1.5.3
status: active
scope: public
theme: light-blue
access:
  supported: [deny, viewer, editor, admin]
  defaultTier: editor
source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: intelligent-operations
  ref: main
uses:
  - application-authorization
  - experience
  - app-dependencies
  - test-catalog
  - notify.send
  - connector.read.kubernetes
  - connector.read.splunk
  - connector.read.jira
  - connector.read.gitlab
  - connector.read.servicenow
testing:
  version: 1
  catalog: tests/test-lab.yaml
smoke:
  - name: package-readiness
    method: GET
    path: /api/intelligent-operations/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false
authorization:
  version: 1
  catalog: authorization.yaml
experience:
  version: 1
  label: Operations
  entry: /api/intelligent-operations/app
  shell: page
  skin: light-blue
  surfaces: []
routes:
  - module: routes/experience.js
    factory: createOperationsExperienceRoutes
    mountPath: /api/intelligent-operations
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/intelligent-operations/_smoke
    auth: service
    requiresContext: true
    requiresAi: false
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: []
    tools: []
    connectors: []

