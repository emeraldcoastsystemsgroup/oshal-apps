ribbon:
  defaultView: operations-estate
  hideFrameworkItems: [chat, calendar, addressbook, dashboard, logs, settings, operations]
  showPlatformTools: false

tools:
  - name: ops-attention
    displayName: Operations attention
    type: api
    category: operations
    description: What waits on the person in Intelligent Operations, from their own saved records only - response plans to approve, executions without verified recovery, overdue break-glass reconciliations, firing anomaly baselines, investigations started automatically or whose automatic start was refused or uncertain, processing that needs review, and swarm hand-offs sent and received.
    executor: { executorType: api, apiEndpoint: "GET /api/intelligent-operations/attention" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} when the person asks what needs their attention in operations, about incidents, servers that stopped reporting, critical alerts, response plans, anomalies or hand-offs. Read the summary sentence aloud and offer to open the page named for each count. Nothing here runs anything.
    routingTags: [operations, incidents, attention]
    tags: [operations, route-backed, read-only]
  - name: ops-handoffs
    displayName: Swarm hand-offs
    type: api
    category: operations
    description: The person's swarm-to-swarm hand-offs - response plans sent to peer swarms with their delivery state, and delegations from other swarms they filed as investigations with the ticket.
    executor: { executorType: api, apiEndpoint: "GET /api/intelligent-operations/delegations" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} when the person asks what was handed to or received from another swarm. Delegations not yet filed are on the Swarm hand-off page; sending and filing happen there with the person's confirmation.
    routingTags: [operations, swarm, hand-off]
    tags: [operations, route-backed, read-only]
  - name: ops-investigations
    displayName: Operations investigations
    type: api
    category: operations
    description: The person's evidence investigations with their canonical ticket state, including whether each was started automatically, refused or uncertain.
    executor: { executorType: api, apiEndpoint: "GET /api/intelligent-operations/investigations" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} when the person asks about investigations or RCA tickets. Starting or approving happens in Incident work.
    routingTags: [operations, incidents, investigations]
    tags: [operations, route-backed, read-only]
