      section: top
    - toolName: operations-workflow
      label: Workflow Studio
      icon: codicon codicon-type-hierarchy-sub
      iframeUrl: /workflow-studio/
      section: top
ribbon:
  defaultView: operations-estate
  hideFrameworkItems: [chat, calendar, addressbook, dashboard, logs, settings, operations]
  showPlatformTools: false

tools:
  - name: ops-attention
    displayName: Operations attention
    type: api
    category: operations
    description: What waits on the person in Intelligent Operations, from their own saved records only - response plans to approve, executions without verified recovery, overdue break-glass reconciliations, firing anomaly baselines, investigations started automatically or whose automatic start was refused or uncertain, processing that needs review, and swarm hand-offs sent and received.
    executor: { executorType: api, apiEndpoint: "GET /api/intelligent-operations/attention" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} when the person asks what needs their attention in operations, about incidents, response plans, anomalies or hand-offs. Read the summary sentence aloud and offer to open the page named for each count. Nothing here runs anything.
    routingTags: [operations, incidents, attention]
    tags: [operations, route-backed, read-only]
  - name: ops-handoffs
    displayName: Swarm hand-offs
    type: api
    category: operations
    description: The person's swarm-to-swarm hand-offs - response plans sent to peer swarms with their delivery state, and delegations from other swarms they filed as investigations with the ticket.
    executor: { executorType: api, apiEndpoint: "GET /api/intelligent-operations/delegations" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} when the person asks what was handed to or received from another swarm. Delegations not yet filed are on the Swarm hand-off page; sending and filing happen there with the person's confirmation.
    routingTags: [operations, swarm, hand-off]
    tags: [operations, route-backed, read-only]
  - name: ops-investigations
    displayName: Operations investigations
    type: api
    category: operations
    description: The person's evidence investigations with their canonical ticket state, including whether each was started automatically, refused or uncertain.
    executor: { executorType: api, apiEndpoint: "GET /api/intelligent-operations/investigations" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} when the person asks about investigations or RCA tickets. Starting or approving happens in Incident work.
    routingTags: [operations, incidents, investigations]
    tags: [operations, route-backed, read-only]
  - name: ops-systems
    displayName: Operations systems health
    type: api
    category: operations
    description: The person's recorded inventory health - counts of healthy, degraded and unknown assets, the degraded and unknown assets themselves (name, kind, cluster scope, namespace, pressure) and whether scheduled discovery is keeping the inventory current.
    executor: { executorType: api, apiEndpoint: "GET /api/intelligent-operations/summary/systems" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} when the person asks which systems, nodes, pods or workloads are unhealthy or degraded, or whether the inventory is current. Read the summary sentence, name the degraded assets with their cluster and namespace, and offer to open Systems. Nothing here reads a cluster now or runs anything.
    routingTags: [operations, systems, health, kubernetes]
    tags: [operations, route-backed, read-only]
  - name: ops-response-plans
    displayName: Operations response plans
    type: api
    category: operations
    description: The person's response plans - the ticket, the target pod, the generated files, whether the plan is approved, invalidated or expired, and each execution's result and verified recovery.
    executor: { executorType: api, apiEndpoint: "GET /api/intelligent-operations/summary/responses" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} when the person asks about remediation, response plans, what was executed or whether recovery was verified. Say which plans wait for approval and which executions lack verified recovery. Approving and running happen only in Incident work with the person's fresh confirmation; never claim Jarvis approved or ran anything.
    routingTags: [operations, remediation, response, recovery]
    tags: [operations, route-backed, read-only]
  - name: ops-anomalies
    displayName: Operations anomaly baselines
    type: api
    category: operations
    description: The person's anomaly detection - whether it is on, and the metric baselines with readiness, last score and whether each is firing, firing first.
    executor: { executorType: api, apiEndpoint: "GET /api/intelligent-operations/summary/anomalies" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} when the person asks about anomalies, unusual metrics or what is firing. Name firing metrics with their resource and score, and offer to open Live context. Nothing here changes detection.
    routingTags: [operations, anomalies, metrics]
    tags: [operations, route-backed, read-only]
bots:
  - agentId: a0000000-0000-0000-0000-000000000016
    name: ops-rca-specialist
    routingKeywords:
      - needs my attention in operations
      - operations attention
      - swarm hand-off
      - handed off to another swarm
      - delegation from another swarm
      - response plan
      - incident investigation
      - degraded systems
      - unhealthy pods
      - is the inventory current
      - remediation status
      - response plans
      - verified recovery
      - anomalies firing
      - handed to us by another swarm
      - another swarm
      - from another swarm
      - operations investigations
      - my investigations
    persona: personas/ops-rca-specialist.yaml
    role: incident/rca
    capabilities:
      - root-cause-analysis
      - timeline-reconstruction
      - impact-assessment
      - remediation-proposal
  - agentId: 5b770acf-69d5-4361-8d2e-19a2cd05e181
    name: ops-incident-reviewer
    persona: personas/ops-incident-reviewer.yaml
    role: incident/review
    capabilities:
      - deliverable-review
      - quality-gate

schedules:
  - id: operations-process-recorded-alerts
    cron: "* * * * *"
    runsAs: user
    target: service-route
    route: /api/intelligent-operations/pipeline/process
    method: POST
    body: {}
    description: Evaluate admitted alerts and optionally preserve retained evidence from explicitly enabled source revisions, with durable retries under the activating person's authority. When the person turns on scheduled discovery, also read one chosen cluster and namespace through their own Kubernetes connection (reads only) and save it as a live scan.
    offer: Process my enabled Operations sources every minute, and refresh my chosen cluster's live inventory if I turn that on. This does not authorize infrastructure actions.
    timeoutSeconds: 120

