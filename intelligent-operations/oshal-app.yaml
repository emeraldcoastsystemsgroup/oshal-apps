    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} when the person asks what is firing in releases or deployments, about dev ops, what was promoted or rolled back, a label mismatch, the trial being behind or a red gate. Read the summary sentence aloud, name the alert types, and offer to open Dev Ops. Nothing here runs anything or changes a rule.
