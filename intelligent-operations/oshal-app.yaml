schedules:
  - id: operations-process-recorded-alerts
    startsItself: true
    cron: "* * * * *"
    runsAs: user
    target: service-route
    route: /api/intelligent-operations/pipeline/process
    method: POST
    body: {}
    description: Evaluate admitted alerts and optionally preserve retained evidence from explicitly enabled source revisions, with durable retries under the activating person's authority. When the person turns on scheduled discovery, also read one chosen cluster and namespace through their own Kubernetes connection (reads only) and save it as a live scan.
    offer: Process my enabled Operations sources every minute, and refresh my chosen cluster's live inventory if I turn that on. This does not authorize infrastructure actions.
    timeoutSeconds: 120

