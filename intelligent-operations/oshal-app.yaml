  - name: ops-remove-source
    displayName: Remove an Operations source
    cardText: Removes this source from Operations; everything it recorded stays.
    type: api
    category: operations
    description: Remove one of the person's saved sources from Operations, such as a retired or made-up monitored installation. It leaves Sources, Systems, the desks and the attention list, and alerts sent to it are refused; its alerts, readings and investigations stay. Held for the person's approval.
    executor: { executorType: api, apiEndpoint: "POST /api/intelligent-operations/sources/remove" }
    defaultAuthMode: auto
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: "The source's exact name, as ops-systems names its installation. Send name or sourceId, not both." }
        sourceId: { type: string, pattern: "^[a-f0-9]{64}$", description: "The source's id, when a tool result gave it. Send sourceId or name, not both." }
        confirm: { type: boolean, const: true }
      required: [confirm]
    usageInstructions: Only when the person asks to remove a source or a monitored installation from Operations. Use the exact name ops-systems gives, send confirm true, and the person approves before it runs. A 409 answer means two saved sources share that name or it is a desk's own source, and a 404 means no saved source has it; say so in the answer's words. Say it is removed only after the tool answers removed true.
    routingTags: [operations, systems]
    tags: [operations, route-backed]
