      label: Credentials & access
      icon: codicon codicon-key
      iframeUrl: /api/intelligent-operations/app#credentials
      section: top
    - toolName: operations-commands
      label: Command helper
      icon: codicon codicon-terminal
      iframeUrl: /api/intelligent-operations/app#commands
      section: top
    - toolName: operations-git
      label: Git explorer
      icon: codicon codicon-source-control
      iframeUrl: /api/intelligent-operations/app#git
