      - Missing native scheduler status is shown as unavailable; revoked access clears private work.
    prerequisites: [runner:node-test, runtime:python3, browser:chromium, service:disposable-postgres, service:disposable-opensearch]
    sideEffects: disposable databases, rule indexes, local engine and HTTP servers
    isolation: { mode: disposable, cleanup: Remove owned fixture databases and indexes and close every engine and browser. }
