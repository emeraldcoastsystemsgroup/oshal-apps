    purpose: "Verify in Chromium over the shipped assets that App Ops, Sec Ops, Platform Ops and Dev Ops follow Overview, that each tab shows Firing now, Sources, Rules, Runbooks and Settings, that an empty desk says what fills each panel and names its probe, that Settings shows the topic with the way to Notifications, the source, the producer tokens and the host threshold file path with the last snapshot or that none was reported, that nothing overflows at 390x844 or 412x915, that the four topics are seeded once with channel none through POST /api/notify/prefs, that a rule toggle is reached by keyboard and saved through the desk's own policy route with the binding's revision, and that a refused desk clears and names its role."
    level: integration
    runner: { kind: node-test, scope: package, files: [tests/desks-screen.test.cjs] }
    expected:
      - The menu reads Overview, App Ops, Sec Ops, Platform Ops, Dev Ops; each desk page has the five panels.
      - An empty Platform Ops says no source has reported yet and names the heartbeat; the 21 default rules show read-only.
      - The four topics are posted once with channel none; Notifications is linked in the top window.
      - A capture toggle flipped by keyboard enables Save; the save posts the desk's rules and expectedRevision to its own route.
      - A 403 on one desk clears it and names the role; the other desks still read.
    prerequisites: [runner:node-test, dependency:playwright, browser:chromium]
    sideEffects: none
    isolation: { mode: disposable, cleanup: Close the browser and the loopback fixture server. }
    limits: { timeoutMs: 120000, maxMemoryMb: 768 }
    installation: never
  - id: remove-source
    name: Remove a saved source
    purpose: "Verify (backlog P5-55b) through the real router, real SQL with forced owner policies and a store per person that POST /sources/remove takes confirm: true and one way to name the source, that another person cannot remove it, that Sources, Systems' installations, the systems summary and the attention list drop it, that its alerts are refused, that its installation row, day history and stream stay, that a retry answers the first removal and saving the same source again brings it back with its history, that a shared or unknown name and a desk's own source are refused in words, and that the Jarvis tool is held for approval under records.write, which a reader lacks; and in Chromium over the shipped Systems page that Remove this source takes two presses, says what stays, posts confirm true, drops the card and reloads the records, is never offered on a desk's own source, and says a refusal on the card."
    level: integration
    runner: { kind: node-test, scope: package, files: [tests/remove-source.test.cjs, tests/installations-screen.test.cjs] }
    expected:
      - A removal without confirm true, with both names or an unknown key is 400; another person's is 404.
      - After removal Sources, Systems, the systems summary and the attention list no longer name it, and its alerts answer 404.
      - Its installation row, day history and stream are still in SQL; saving it again shows its earlier reports.
      - A shared name is 409, an unknown name 404, a desk's own source 409 and its card offers no removal.
      - The Systems card posts {sourceId, confirm true} only on the second press and goes when the server says removed.
    prerequisites: [runner:node-test, service:postgres-disposable-35689, dependency:playwright, browser:chromium]
    sideEffects: none
    isolation: { mode: disposable, cleanup: Drop the fixture database and role; close the browser and the loopback fixture server. }
    limits: { timeoutMs: 180000, maxMemoryMb: 768 }
    installation: never
