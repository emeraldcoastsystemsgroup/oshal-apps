version: 1
cases:
  - id: first-use-processing
    name: First-use tick with default or disabled evaluation
    purpose: Verify that a fresh person's first tick activates the four desks (sources, mappings, default policies through the real percolator, processing list) and nothing else - no connector, ticket or notification - that later ticks do no work and call no engine, and that explicitly disabled evaluation with eligible admitted data still evaluates, captures, discovers, investigates and notifies nothing.
    level: integration
    runner: { kind: node-test, scope: package, files: [tests/first-use-processing.test.cjs] }
    expected:
      - The first tick creates the four desk sources and publishes their default policies, and sends, opens and reaches nothing.
      - Repeated ticks after that make no engine, connector, ticket or notification call.
      - Disabled evaluation leaves pending admitted data undecided and creates no work or message.
    prerequisites: [runner:node-test, service:postgres-disposable-35689, service:opensearch]
    sideEffects: none
    isolation: { mode: disposable, cleanup: Drop the fixture database and role and delete its rules index. }
    limits: { timeoutMs: 120000, maxMemoryMb: 512 }
    installation: never
  - id: one-time-communication-guard
    name: One-time authorized notification acceptance
    purpose: Verify durable pre-send reservations, lost-ack holds and muted test topics using filesystem state and an explicit native API fixture.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/communications.test.cjs] }
    expected:
      - Exactly one initial attempt per authorized channel is reserved before any possible send.
      - Reopening an accepted or uncertain test never sends again and test routes are muted.
      - Missing transports and changed destinations refuse before an additional send.
    prerequisites: [runner:node-test, runtime:python3]
    sideEffects: none
    isolation: { mode: disposable, cleanup: Remove the temporary fixture ledger; no real recipient or cluster is contacted. }
    limits: { timeoutMs: 15000, maxMemoryMb: 128 }
    installation: never
