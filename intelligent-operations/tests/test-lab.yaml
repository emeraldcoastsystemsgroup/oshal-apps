# 1 | maintainer@emeraldcoastsystemsgroup.com | Register Systems projection, renderer and controller checks alongside the existing package cases.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Register retained telemetry and actual host/cloud replay acceptance.
version: 1
cases:
  - id: one-time-communication-guard
    name: One-time authorized notification acceptance
    purpose: Verify durable pre-send reservations, lost-ack holds and muted test topics using filesystem state and an explicit native API fixture.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/communications.test.cjs] }
    expected:
      - Exactly one initial attempt per authorized channel is reserved before any possible send.
      - Reopening an accepted or uncertain test never sends again and test routes are muted.
      - Missing transports and changed destinations refuse before an additional send.
    prerequisites: [runner:node-test, runtime:python3]
    sideEffects: none
    isolation: { mode: disposable, cleanup: Remove the temporary fixture ledger; no real recipient or cluster is contacted. }
    limits: { timeoutMs: 15000, maxMemoryMb: 128 }
    installation: never
  - id: systems-observations
    name: Current-user Systems inventory projection
    purpose: Check native identity joins, temporal event association, bounded filters and actual text rendering using already authorized graph fixtures.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/systems.test.cjs] }
    expected:
      - Names, providers, scopes and resource kinds cannot collapse distinct assets or ambiguous cloud identities.
      - Quarantined, future and duplicate deliveries do not inflate related observations.
      - Placement uses recorded edges; unknown health, partial collections and bounded totals remain explicit.
      - Untrusted names render as text and detail buttons retain exact graph and event identities.
      - The shipped controller clears rows and private filter options on access refusal; a late graph cannot restore them.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 15000, maxMemoryMb: 256 }
    installation: never
