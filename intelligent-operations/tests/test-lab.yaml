  - id: monitored-installations
    name: Monitored installations and the silence alarm
    purpose: "Verify that a heartbeat is proof of life and never an event, that its readings reach the card, the 15-minute history, the telemetry banks and the topology, that an installation that goes quiet raises InstallationSilent exactly once through the real percolator and tick and clears on its next report, that a gap in the schedule itself blames nobody, that what is firing follows the alerts, that the attention message names the alert and the installation, and that the shipped Systems and Overview pages say all of it in words, keep the frame on a failed read, clear on refusal and fit a phone."
    level: integration
    runner: { kind: node-test, scope: package, files: [tests/installations.test.cjs, tests/installations-alarm.test.cjs, tests/installations-screen.test.cjs] }
    expected:
      - The event ledger holds no heartbeat.
      - A second silence is its own occurrence; one silence is raised once.
      - A failed admit never loses an alarm or its resolve; the next tick settles what is owed.
      - A warning stays off the phone; a critical is told as it fires, fires again and clears; a flap opens no second packet.
      - A phone message is owed until the rail takes it and names the latest word per alert; nothing after the watch can hold up an alarm; a failing tick tells the phone once.
      - What the report lists decides whether an alert cleared, including when no resolve ever comes; a blip that becomes an outage gets its evidence after the window.
      - Only the tick's own decisions reach the phone; an engine outage names a critical once and spends no retries; each failing step is its own news.
      - A tick starts nothing new past its time, so the kernel never ends it; Jarvis says when the silence watch has stopped.
      - Jarvis names what is silent and what critical is firing.
      - A full evidence window seals in a few KB and any window stays under the investigation input ceiling.
      - A bank that refuses readings never makes a live installation look dead.
      - Nothing stays on screen after access is withdrawn.
    prerequisites: [runner:node-test, service:postgres-disposable-35689, service:opensearch, dependency:playwright, browser:chromium]
    sideEffects: none
    isolation: { mode: disposable, cleanup: Drop the fixture database and role and delete the rules index. }
    limits: { timeoutMs: 180000, maxMemoryMb: 512 }
    installation: never
