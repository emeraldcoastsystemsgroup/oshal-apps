  - id: temporal-topology
    name: Temporal inventory and explainable graph correlation
    purpose: Exercise actual scoped SQL transactions, native identity translation and the shipped Estate and Data views.
    level: integration
    runner: { kind: node-test, scope: package, files: [tests/topology.test.cjs] }
    expected:
      - Complete scans retire only their collection; partial scans preserve original timestamps and historical queries replay late scans correctly.
      - Concurrent retries reuse a scan; conflicting identities and forged owners are refused.
      - Unaffected shared hubs do not merge incidents; stale or unavailable dependencies produce a visible fallback.
      - Saved correlation binds exact deliveries, scans and policy without dispatching work.
      - Kubernetes UIDs, owner chains, runtime container IDs and endpoint conditions survive translation without pod secrets.
    prerequisites: [runner:node-test, runtime:python3, browser:chromium, toolchain:playwright, service:disposable-postgres]
    sideEffects: disposable database and loopback fixture server
    isolation: { mode: disposable, cleanup: Drop fixture databases and roles and close all browsers and server connections in finally. }
    limits: { timeoutMs: 60000, maxMemoryMb: 768 }
    installation: never
  - id: percolation-reduction
    name: Stored-query filtering and transactional symptom reduction
    purpose: Run the shipped engine against disposable OpenSearch and scoped PostgreSQL, then publish and evaluate from the actual Data view.
    level: integration
    runner: { kind: node-test, scope: package, files: [tests/pipeline.test.cjs] }
    expected:
      - Every sealed rule page is evaluated and incomplete backend results never become no-match.
      - One hundred distinct occurrences across independent pools reserve one job; replay and uncertain acknowledgement do not inflate it.
      - Owner isolation, explicit window boundaries, late state, rollback and publication conflicts remain visible.
      - The browser can publish a source policy and inspect durable filtering and reduction results.
    prerequisites: [runner:node-test, runtime:python3, browser:chromium, toolchain:playwright, service:disposable-postgres, service:disposable-opensearch]
    sideEffects: disposable databases, rule indexes, local engine process and loopback HTTP server
    isolation: { mode: disposable, cleanup: Delete only test-owned rule indexes and databases; close browser, engine and server in finally. }
    limits: { timeoutMs: 120000, maxMemoryMb: 768 }
    installation: never

