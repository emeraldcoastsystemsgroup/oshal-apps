  - id: response-stage
    name: Approved response, isolated execution and verified recovery
    purpose: Verify byte-exact generated-file extraction, plans bound to observed targets, approvals invalidated by revision change or expiry, one dispatch per approval under concurrency and lost acknowledgements, operator reports that never change canonical state, recovery outcomes that require a resolved admitted signal, server-read ticket updates, and the shipped panel driving confirmed native exec fixtures.
    level: integration
    runner: { kind: node-test, scope: package, files: [tests/execution.test.cjs] }
    expected:
      - remediate.sh, verify.sh, rollback.md and verify.md are extracted byte-exact with digests only from fenced file=NAME sections; an answer without the approval statement or a complete set cannot be executed.
      - A plan is refused for a pod the caller's recorded inventory has not observed; the same accepted work yields the same plan identity.
      - An approval binds principal, artifact digests, target and canonical revision; a changed revision or expiry refuses dispatch before anything runs.
      - Twelve concurrent callers reserve exactly one dispatch per approval; a lost commit acknowledgement never authorizes a second one.
      - Verification is healthy only with a passing command, matching pod identity and a resolved admitted signal for the same resource; firing deliveries do not count.
      - The browser makes no native action while planning or approving, dispatches the exact reserved argv once with a fresh confirmation, and clears private plan state on refusal.
    prerequisites: [runner:node-test, service:postgres-disposable-35689, toolchain:playwright-chromium]
    sideEffects: none
    isolation: { mode: disposable, cleanup: Drop the fixture database and role; no cluster or provider is contacted. }
    limits: { timeoutMs: 120000, maxMemoryMb: 512 }
    installation: never
