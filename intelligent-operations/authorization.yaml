# CHANGE LOG: 20 | maintainer@emeraldcoastsystemsgroup.com | Git explorer asset and repository links: read under app.open, link and unlink under records.write.
# CHANGE LOG: 19 | maintainer@emeraldcoastsystemsgroup.com | Jarvis tools ops-attention, ops-handoffs and ops-investigations (reads, app.open) and the attention route.
# CHANGE LOG: 18 | maintainer@emeraldcoastsystemsgroup.com | Provisioning: read requests and the page asset under app.open; render requests under records.write.
# CHANGE LOG: 17 | maintainer@emeraldcoastsystemsgroup.com | Swarm hand-off: read delegations and the page asset under app.open; reserve, report and file delegations under records.write.
# CHANGE LOG: 16 | maintainer@emeraldcoastsystemsgroup.com | Admit the live cluster panel asset under app.open; the reads themselves are the person's own confirmed connector actions.
# CHANGE LOG: 15 | maintainer@emeraldcoastsystemsgroup.com | Admit Git promotion: asset under app.open, reservations and reports under records.write; provider writes stay on the person's own confirmed connector actions.
# CHANGE LOG: 14 | maintainer@emeraldcoastsystemsgroup.com | Admit the command helper: asset and history under app.open, recorded runs under records.write; no execution authority is granted here.
# CHANGE LOG: 13 | maintainer@emeraldcoastsystemsgroup.com | Admit the anomaly service: readiness reads and its assets under app.open; configuration and manual runs under records.write.
# CHANGE LOG: 12 | maintainer@emeraldcoastsystemsgroup.com | Admit the response stage: own reads and artifact/receipt downloads under app.open; plan, approval, dispatch reservation, reports and ticket-update records under the existing records.write grant. No infrastructure authority is granted here; execution uses the person's own native Kubernetes connection, confirmed per action.
# CHANGE LOG: 11 | maintainer@emeraldcoastsystemsgroup.com | Admit the operator workspace asset under the existing own read grant.
# CHANGE LOG: 10 | maintainer@emeraldcoastsystemsgroup.com | Admit the pod console asset; execution still requires the native original-user connector scope.
# CHANGE LOG: 9 | maintainer@emeraldcoastsystemsgroup.com | Admit the source-cited RCA library asset without granting report or infrastructure writes.
# CHANGE LOG: 8 | maintainer@emeraldcoastsystemsgroup.com | Admit the resource-tree asset with the existing own-scope read grant.
# CHANGE LOG: 7 | maintainer@emeraldcoastsystemsgroup.com | Bind both declared inline bots to the existing own-scope read grant for Jarvis handoffs.
# CHANGE LOG: 6 | maintainer@emeraldcoastsystemsgroup.com | Admit bounded own ticket handoff reads and writes plus its authenticated UI asset.
# CHANGE LOG: 5 | maintainer@emeraldcoastsystemsgroup.com | Bind preprocessed investigation creation and current workflow reads to existing own-scope grants.
# CHANGE LOG: 4 | maintainer@emeraldcoastsystemsgroup.com | Admit the 3D graph module through the same current-user read permission as the experience.
# CHANGE LOG: 3 | maintainer@emeraldcoastsystemsgroup.com | Bind candidate policy trials and editor assets to existing current-user grants.
# CHANGE LOG: 1 | maintainer@emeraldcoastsystemsgroup.com | Native own-scope experience and records permissions; a viewer cannot import data.
# CHANGE LOG: 2 | maintainer@emeraldcoastsystemsgroup.com | Require the existing operator grant for stream configuration, intake and evidence pinning.
version: 1
resources:
  application:
    scopes:
      - own
permissions:
  app.open:
    resource: application
    effect: read
    minimumTier: viewer
  records.write:
    resource: application
    effect: write
    minimumTier: editor
roles:
  reader:
    tier: viewer
    grants:
      - permission: app.open
        scope: own
  operator:
    tier: editor
    grants:
      - permission: app.open
        scope: own
      - permission: records.write
        scope: own
bindings:
