version: 1
cases:
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its family (Home shell) and company (Business shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the family view makes two reads, GET /api/pumpkin/home-summary and GET /api/pumpkin/responses, and both routes run only owner-scoped SELECTs; it never writes, never reads the live rooms or the projector stream and never makes the pumpkin speak.
      - Fed by the real routes, the counts read as plain stats, pinned favourites as tiles and the other saved lines as a list with plain face and source words, update times and playlist sends; no line speaks, replays or links out.
      - A long playlist shows the newest eight favourites and twenty other lines and says where the rest are; nothing saved yet reads as nothing saved.
      - An empty list beside a summary that counts saved lines is named as a failed read and the summary newest lines show instead; a count that could not be checked reads as not checked.
      - Signed out, refused, every source failed, a non-JSON failure and an unreachable server each read as what they are.
      - Under the family view the module script mounts no connected actions, binds no Refresh handler and reads nothing; the full page still runs every start step.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: surface-scripts
    name: Surface scripts served by the package
    purpose: Read the bundled pages' script tags, build the compiled router with inert framework stand-ins, and run the shipped scripts in a VM - no browser, database or provider.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/pumpkin-surface-scripts.test.cjs
    expected:
      - No page loads a script from the framework's /pumpkin/ page directory.
      - pumpkin-face.js and pumpkin-audio.js load from /api/pumpkin/assets/, each answered by a registered GET route that sends the file from the package's tools/.
      - Running the shipped files defines window.PumpkinFace and window.PumpkinAudio.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: room-transport
    name: Projector room link on a non-streaming runtime
    purpose: Build the compiled router with inert framework stand-ins and drive register, /stream and /rooms/poll through a response shaped like the native kernel bridge's (buffered, no writeHead), plus the swarm door and the paired-remote push - no browser, database or provider.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/pumpkin-swarm-push.test.cjs
    expected:
      - On a buffered response register answers transport poll with its interval, and GET /stream answers 501 stream_unavailable, never 500.
      - On a streaming response register keeps the sse transport.
      - A polling screen starts at the present, receives a remote rooms/say and a swarm /speak in order once each, and counts as one listener for both.
      - A screen that stopped polling is no longer counted, and a poll for an unknown room answers 409 unknown_room so the projector re-registers.
      - POST /chat, /rooms/say, /rooms/ask and /speak have each saved the spoken line before they answer, so the page's Saved responses re-read shows it (sweep 8 read 'Nothing saved yet').
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: live-rooms-hint
    name: Say/Ask status names only rooms a screen is watching
    purpose: Run the shipped otherWatchedRoomsHint from tools/pumpkin-app.html in a VM - no browser, database or provider.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/pumpkin-live-rooms-hint.test.cjs
    expected:
      - The room this remote just registered, live with zero listeners, is not listed as a live room after "no projector is listening".
      - The current room is never offered as the alternative.
      - Another room with a screen attached is named with its label and slug.
      - A missing rooms list reads as no projector screen connected.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: model-unavailable
    name: A reply the model could not give names its cause
    purpose: >-
      Drive the compiled /rooms/ask and /chat with the real room registry and reply parser while the bot turn rejects the way the
      native bridge rejects a refused intent (an Error carrying the kernel's reason).
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/pumpkin-model-unavailable.test.cjs
    expected:
      - The answer is 503 model_unavailable, its message says nothing was spoken and gives the reason, its detail is the bounded reason.
      - Nothing is pushed to the room and nothing is saved; a working reply still reaches the room.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: review-saved-times
    name: "Pumpkin Review shows a saved line's local time"
    purpose: "Feed the compiled home-summary route's JSON into the review page's shipped refresh over a stub DOM in the America/Chicago zone - no browser, network or database."
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/review-saved-times.test.cjs
    expected:
      - "The summary detail carries the saved instant and the page renders it as the local date and time (Oct 13, 2026, 5:55 AM in Chicago) with no raw instant."
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 60000
      maxMemoryMb: 256
    installation: never
