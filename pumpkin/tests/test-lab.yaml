# 1   | maintainer@emeraldcoastsystemsgroup.com     | Register the package's audience view contract test (ADR-164 D6) with its runner and isolation boundaries: the static kit contract plus the family view behaviour over the real home-summary and playlist routes (two reads, plain stats and saved lines, every named state, the module script gated).
# 2 | maintainer@emeraldcoastsystemsgroup.com | 1.3.3: the company audience view registered beside the family one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
# 3 | maintainer@emeraldcoastsystemsgroup.com | Register surface-scripts: the pages load the face and voice scripts from this package's own /api/pumpkin/assets routes, and the shipped files define the constructors the pages call.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Register room-transport: on a runtime whose response cannot stream (the native kernel bridge) the projector's room link polls instead of a /stream that answered 500.
# 5 | maintainer@emeraldcoastsystemsgroup.com | Register live-rooms-hint: a Say/Ask that reached no screen names only other rooms a screen is attached to, never the current room.
