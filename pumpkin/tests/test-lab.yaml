# 7 | maintainer@emeraldcoastsystemsgroup.com | Register model-unavailable: a refused bot turn answers 503 with the cause (sweep 9: it was 500 internal_error).
# 8 | maintainer@emeraldcoastsystemsgroup.com | Register review-saved-times: Pumpkin Review shows a saved line's time in the viewer's zone, not a raw UTC instant (sweep 13).
