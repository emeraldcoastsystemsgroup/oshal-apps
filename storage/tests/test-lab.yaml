version: 1
cases:
  - id: file-sources-picker
    name: Connected shares as file picker sources
    purpose: Drive the compiled /api/storage/sources listings and file routes with OSHAL_EGRESS=kernel, a recording fetch that enforces the kernel's forwarded headers and declared hosts, synthetic connection metadata and a storage.* intent double.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/file-sources.test.cjs] }
    expected:
      - Dropbox, Google Drive, GitHub and OSHAL-local each answer {items, folders, nextCursor} with folder cursors, next pages and a q search (Dropbox inside the open folder, Drive by name, GitHub repository names and paths under the open folder, OSHAL-local by name).
      - Every item's listed type is exactly the type its file route serves, so the kernel's handle check holds; Google documents are exported (document and slides as PDF, sheet as CSV) and a form is not offered.
      - Provider calls carry no Authorization header and only headers the kernel forwards; each credential goes only to its connector's API host, and a Dropbox file comes through its credential-free *.dropboxusercontent.com temporary link.
      - A source the person has not connected answers an empty page that says so and calls no provider; a file over 4 MB is 413; traversal paths and invalid cursors are 400; a signed-out caller is 401.
      - The manifest declares each source's list route inside /api/storage/, routed by routes/file-sources.js, and the egress hosts the routes call.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: disposable }
    limits: { timeoutMs: 20000 }
    installation: never
  - id: notes-save-read
    name: Save a text note and read it back
    purpose: Drive the compiled /local/save, /local/read and /local/list handlers under the native kernel (a storage.* intent double answering like the kernel's file store) and on the legacy per-user directory.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/notes.test.cjs] }
    expected:
      - "Every delete request calls storage-delete-note in that reply, nothing is called deleted or saved before the tool answers ok, and a card is named by what it does, never by where it sits (sweep 13)."
      - An unconfirmed save touches nothing; a confirmed one saves the named .txt or .md note for the verified caller with OSHAL local forced.
      - A file of the same name is never replaced unless replace is true; names, kinds and sizes are bounded before anything is written.
      - GET /local/read returns the saved text; a missing note answers 404; the list shows the saved note.
      - DELETE /local/note removes a saved note (storage.delete under the kernel); a missing one answers 404 and deletes nothing.
      - The manifest offers storage-save-note held for approval and storage-read-file.
      - GET /local/list answers usage (file count, total bytes and "<used> of 250.0 MB" with what it counts) and the assistant's usage action says it in words.
      - The persona proposes a held tool at once (the card is the confirmation, never a typed yes first) and answers space questions from the usage.
      - A .txt note is saved and read back without chat **bold** only; __init__, *.txt globs, # comment lines, `code` ticks, a crontab line, x**2, bullets and links are saved exactly as approved; a .md note is saved exactly as sent; the tool and persona ask for plain text.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: disposable }
    limits: { timeoutMs: 20000 }
    installation: never
  - id: kernel-egress-providers
    name: Native kernel GitHub and Dropbox calls through the declared egress
    purpose: Drive the compiled storage handlers with OSHAL_EGRESS=kernel, a recording fetch, a stubbed assistant reply and synthetic connection metadata.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/kernel-egress.test.cjs] }
    expected:
      - The repo list, repo creation, Dropbox folder picker and the assistant's create_repo and list_files reach api.github.com or api.dropboxapi.com with only accepted headers, no Authorization header and no key in the URL; answers map as before.
      - GET /prefs lists the caller's usable connections from connection metadata (Google aliases as google) and does not read the framework connections table.
      - A kernel "not connected" refusal, or metadata with no usable connection, gives each route's own not-connected answer.
      - Outside the kernel the brokered token is still sent as the Bearer header and the connections table still answers GET /prefs.
      - The manifest declares api.github.com and api.dropboxapi.com with their Bearer credentials.
      - 'List my files lists the store the Files bucket points at; with Files on OSHAL local it never answers about Dropbox.'
      - Under the native kernel list_files and /local/list read the kernel's personal file store through storage.list, never the sandbox directory; the legacy framework lists its per-user directory.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: disposable }
    limits: { timeoutMs: 20000 }
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell) and family (Home shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - With nothing saved the compiled route (routes/home-summary.js, run with a stub Router and pool) says the default target is in use and that Automatic resolves to OSHAL (local) unless GitHub, Dropbox or Google Drive is connected, never that the location is unset; its saved and failed answers match the summaries the view is tested with.
      - On open the company view reads only GET /home-summary, GET /prefs and GET /local/list; it never POSTs /assistant (the chat turn, which runs a model and acts with the caller's tokens) and never reads /dropbox/folders or /github/repos (live provider calls).
      - The title names the effective code and files targets; the stats are the two targets with their saved or automatic state, the connected stores among GitHub, Dropbox and Google Drive, and the top-level file count of the oshal-local store; the table lists those files by name with their size, capped at twelve; the stores list marks each store connected or not and which bucket it serves.
      - Signed out (401), refused (403), nothing saved, an empty store, a partial summary, a failed prefs read, a failed store listing and a failed summary read each read as what they are; only both the summary and the prefs failing raises the kit's failure notice.
      - Under an audience view the page's own script adds no greeting and fetches nothing; without the audience, and without the kit, it still greets as before.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
