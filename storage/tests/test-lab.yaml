# 1   | maintainer@emeraldcoastsystemsgroup.com     | Register the package's audience view contract test (ADR-164 D6) with its runner and isolation boundaries: the company view of the assistant page for the Business shells reads only GET /home-summary, GET /prefs and GET /local/list on open, never POSTs /assistant and never calls a provider, names signed-out, refused, unsaved, empty, partial and failed states for what they are, and leaves the full page's own start ungated only when no audience view renders.
# 2 | maintainer@emeraldcoastsystemsgroup.com | 1.2.2: the family audience view registered beside the company one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
# 3 | maintainer@emeraldcoastsystemsgroup.com | Register the native-kernel egress case: the GitHub and Dropbox pickers, repo creation and the assistant's create_repo / list_files call the declared hosts with no Authorization header, GET /prefs reads connections from metadata, and a missing or unusable connection gives each route's own not-connected answer.
# 4 | maintainer@emeraldcoastsystemsgroup.com | kernel-egress also covers list_files by Files bucket: OSHAL local lists the caller's local store (no provider call, no Dropbox in the answer), Dropbox lists Dropbox, GitHub says it cannot list a repository here. The case writes a disposable temp directory, so its isolation is disposable.
# 5 | maintainer@emeraldcoastsystemsgroup.com | The audience-view case also expects the summary to say what Automatic resolves to (the concierge called the location unset while Settings showed OSHAL local).
