# 7 | maintainer@emeraldcoastsystemsgroup.com | Register the notes case (save a text note with approval, read it back, list it from the kernel's file store under the native kernel); kernel-egress expects list_files and /local/list to read the kernel's file store under the kernel.
# 8 | maintainer@emeraldcoastsystemsgroup.com | The notes case also expects the usage answer (sweep 9: "How much space am I using?" had no answer) and the persona's one-step approval for held tools.
# 9 | maintainer@emeraldcoastsystemsgroup.com | The notes case also expects a .txt note to be saved as plain text (sweep 10: a saved note kept the chat's **bold** and * bullets) while a .md note keeps its Markdown.
# 10 | maintainer@emeraldcoastsystemsgroup.com | Review of sweep 10: the notes case expects only word-bounded **bold** taken out of a .txt note; dunders, globs, # lines, code ticks, a crontab line, x**2, bullets and links are saved exactly as approved.
# 11 | maintainer@emeraldcoastsystemsgroup.com | The notes case also expects every delete request to call the delete tool and a card named by what it does (sweep 13).
# 12 | maintainer@emeraldcoastsystemsgroup.com | 1.3.0: register the file-sources case (the shared file picker's Dropbox, Google Drive, GitHub and OSHAL-local sources, Jarvis's "+ Add").
