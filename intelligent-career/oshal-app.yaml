# ─────────────────────────────────────────────────────────────────────────────
# OSHAL application GROUP — Intelligent Career (ADR-141)
# CHANGE LOG
# 1 | maintainer@emeraldcoastsystemsgroup.com | Hide the framework Tickets workbench and open directly on Search Jobs instead of falling back to an unfiltered global queue.
# 2 | maintainer@emeraldcoastsystemsgroup.com | 1.1.6: Rebuilt on main together with Career 1.47.3; no change to the toolbar, setup or ribbon.
# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.1.7: the Social Signals tile is merged into Social's Workspace · Engage (UX audit 2026-11-06, social--social-signals): its tile is removed here and the signals setup step opens the Workspace.
# 4 | maintainer@emeraldcoastsystemsgroup.com | 1.1.8: Prepare & submit, Application status and Approvals are stages of the Job Board (career-hunter 1.48.0, UX audit 2026-11-06), so their tiles left this toolbar.
# 5 | maintainer@emeraldcoastsystemsgroup.com | 1.1.9: the Resume band borrows Career's Master record (career-hunter 1.51.0), the read-only page with every role, bullet, skill and history record, with Download and Print.
# 6 | maintainer@emeraldcoastsystemsgroup.com | 1.1.10: Print Ingest is no longer a member of the Intelligent Career group; it is a platform tool and is opened from Platform.
# 7 | maintainer@emeraldcoastsystemsgroup.com | 1.1.11: the front door opens on Career's Home (career-hunter 1.53.0), which leads the toolbar ungrouped. Home carries the job search box, the person's pipeline and their next step; Career's page frame draws this toolbar as one bar across the top of every Career page.
#
# A group carries NO code. It binds four installed applications into one front
# door with one toolbar and a setup dashboard:
#   career-hunter    the job board, search, resume + strengthen, profile studio
#   portrait-studio  the profile picture
#   social           LinkedIn / Facebook presence and the signals you comment on
#
# Every toolbar tile is BORROWED from a member by app + surface name — the loader
# copies the member's label, icon and URL at activation and again at every
# profile synthesis, so a member that moves a surface is followed and a member
# that drops one fails this group instead of leaving a dead tile. Nothing here
# is a copied URL (that is the launcher defect ADR-141 exists to remove).
#
# The setup dashboard is rendered by the kernel from `setup:` below. Each step
# points at a `readiness:` probe the member declares over its OWN store, asked
# in the signed-in user's session — a step is done only when the member says so.
#
# Framework: OSHAL (docs/adr/141-application-groups.md)
# ─────────────────────────────────────────────────────────────────────────────

name: intelligent-career
kind: group
suite: ai-knowledge   # ADR-097: primary catalog shelf
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features: []   # no model in the loop (T0)
displayName: Intelligent Career
description: >-
  One front door for your job search: the board, search, resume and strengthen
  tools, your profile picture, and your LinkedIn and Facebook presence — with a
  setup page that shows what is connected and what still needs you.
version: 1.1.11
status: active
scope: public
theme: daylight
# career-hunter is a required member, so its packaged concierge owns this group's right rail.
chatBot: career-hunter

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: intelligent-career
  ref: main

# The members. Installing this group resolves all four (npm-style, fail-closed);
# the reverse-dependency guard blocks a member's uninstall while the group is active.
dependencies:
  required:
    apps:
      - career-hunter
      - portrait-studio
      - social
    connectors: []
  optional:
    apps: []
    # The runtime connector allow-list. A group carries no code, so it reads no credential
    # itself — but its toolbar borrows the MEMBERS' surfaces, and inside this front door those
    # surfaces are where a person connects an account (social-accounts sits in the bottom tray;
    # career-settings holds the engine keys). So the allow-list is the union of the members' own
    # declared lists, in member order, and nothing beyond them:
    #   career-hunter    anthropic, firecrawl, google, twilio
    #   portrait-studio  google, microsoft
    #   social           linkedin, twitter, meta-business, facebook, google
    # DECLARED rather than absent because absent means UNFILTERED: it pinned the Connectors tile
    # and offered the entire platform provider catalog — banking, crypto, infrastructure —
    # inside a job-search front door (RibbonNav.js connectorsAllowed). Optional, like every
    # member's own list: the group installs and opens with none of them connected, and the setup
    # page is what reports each one unready.
    connectors: [anthropic, firecrawl, google, twilio, microsoft, linkedin, twitter, meta-business, facebook]

# ── Toolbar — borrowed by reference ──────────────────────────────────────────
# `group:` bands render in first-appearance order; `section: bottom` is the pinned
# base tray (ungrouped by the renderer). The kernel prepends its Setup tile.
toolbar:
  # UX audit 2026-11-06: Prepare & submit, Application status and Approvals are stages of the
  # Job Board (career-hunter 1.48.0), so they left this toolbar with the member's menu.
  # Home leads, ungrouped: the first screen of Career as its own application (career-hunter 1.53.0).
  - { app: career-hunter,   surface: career-home }
  - { app: career-hunter,   surface: career-search,         group: Job Search }
  - { app: career-hunter,   surface: career-board,          group: Job Search }
  - { app: career-hunter,   surface: career-recruiters,     group: Connections }
  - { app: career-hunter,   surface: career-insights,       group: Review }
  - { app: career-hunter,   surface: career-resume-studio,  group: Resume }
  - { app: career-hunter,   surface: career-experience-library, group: Resume }
  - { app: career-hunter,   surface: career-master-record,  group: Resume }
  - { app: career-hunter,   surface: career-strengthen,     group: Resume }
  - { app: career-hunter,   surface: career-profile-studio, group: Presence }
  - { app: portrait-studio, surface: portrait-studio,       group: Presence }
  - { app: social,          surface: linkedin-assistant,    group: Presence }
  - { app: social,          surface: social-workspace,      group: Presence }
  - { app: career-hunter,   surface: career-submission-activity, group: Activity }
  - { app: social,          surface: social-accounts,       section: bottom }
  - { app: career-hunter,   surface: career-settings,       group: Configuration }
  - { app: career-hunter,   surface: career-companies,      group: Configuration }

# ── Setup — the seven steps of ADR-141 D1 ─────────────────────────────────────
# `readiness` names a probe the member declares; `fix` is the toolbar surface the
# dashboard opens for the step. Order is the order a new user should take them.
setup:
  - { label: Upload your resume,                          app: career-hunter,   readiness: resume,       fix: career-resume-studio }
  - { label: Take or upload a profile picture,            app: portrait-studio, readiness: portrait,     fix: portrait-studio }
  - { label: Connect Facebook,                            app: social,          readiness: facebook,     fix: social-accounts }
  - { label: Pick the articles you want to comment on,    app: social,          readiness: signals,      fix: social-workspace }
  - { label: Review your resume story by story,           app: career-hunter,   readiness: stories,      fix: career-strengthen }
  - { label: Add performance reports and other documents, app: career-hunter,   readiness: materials,    fix: career-settings }

# ── Ribbon chrome ───────────────────────────────────────────────────────────
# This front door opens on job discovery. Generic tickets stay outside the Career
# rail; application preparation and submission have their own Career surfaces.
ribbon:
  defaultView: career-hunter--career-home
  hideFrameworkItems:
    - tickets
    - chat
    - calendar
    - addressbook
    - dashboard
    - logs
    - operations
