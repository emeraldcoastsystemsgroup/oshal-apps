# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — daily-trade-recap ("Daily Trade Recap")
# Carved out of OSHAL core 2026-07-19 (ADR-085 Wave 3, "skill with a surface" —
# Initial carve retained the media workflow; the package now owns Recap Review,
# a saved-work summary and registered recorded-report briefings.
# This package is the app: the manifest (ticketType 'daily-trade-recap' + the
# approval-gated graph workflow) + the three trade_recap_* CLI tools + a package
# COPY of the vids-operator persona for the registrar.
#
# NOTE: despite the name this is a VIDS-family media pipeline (its only real
# dependency is the SHARED vids-operator remote-client desktop worker), which is
# why it carves with the media cluster and NOT the trading wave.
#
# What STAYS framework-resident per ADR-093 (this package ships none of it):
#   - the SHARED vids-operator remote-client desktop worker
#     (packages/oshal-vids-operator → `npx oshal-vids worker`) + its registry
#     entries in BOTH swarm-bot-registry blocks (all four vids-family apps
#     reference it);
#   - ALL trading engines, schedule pins, and the deck-data pipeline — the recap
#     stage scripts (scripts/oshal-recap-agent-remote.js, oshal-recap-render-
#     remote.js, oshal-recap-email.js, oshal-trade-data.js, oshal-trade-recap.js,
#     oshal-deck-data.js) are kernel-owned; the tools below shell to them at
#     their host-mount paths;
#   - the 5PM CT recap cron (a HOST scheduled task driving
#     scripts/run-daily-recap.ps1) and the generic workflow:<ticketType> schedule
#     dispatch engine (src/app/workflow-ticket-schedule-dispatch.ts).
# Framework: OSHAL (see docs/adr/085-remote-app-packages-and-registries.md)
# ─────────────────────────────────────────────────────────────────────────────

name: daily-trade-recap
# CHANGE LOG: 1 | maintainer@emeraldcoastsystemsgroup.com | Register bounded recorded-report briefing collection and isolated contract evidence.
# CHANGE LOG: 2 | maintainer@emeraldcoastsystemsgroup.com | 1.2.1, ADR-157 S3: classify the recorded-report collector as a system service. It is not one person's job — collectCompletedReports opens runWithSystemIdentity and reads the journal for EVERY owner, then fans each row to the owner recorded on it, so a per-person activation would run the same whole-application sweep once per activating person. No `requires:` is declared because this package imports no ADR-149 authorization catalog, and the loader refuses a `requires` naming a permission no catalog defines.
suite: ai-finance   # ADR-097: primary catalog shelf (tools keep their own category:)
displayName: Daily Trade Recap
status: active
description: >-
  Review saved trade-recap work and receive owner-qualified recorded-report updates in Jarvis.
  The existing approval-gated media workflow renders and emails the after-close recap;
  briefing collection reads its report journal and does not generate reports or trade.
scope: public
ticketType: daily-trade-recap
version: 1.2.1

uses: [jarvis-briefings, test-catalog, app-dependencies]
testing:
  version: 1
  catalog: tests/test-lab.yaml
briefings:
  - id: recorded-reports
    title: Recorded trading reports
    description: Existing owner-qualified report journal entries; not confirmation of email or site delivery.
    sessionId: daily-trade-recap-recorded-reports
    defaults: { enabled: true, frequency: as-available, channel: voice }
schedules:
  # ADR-157: a SYSTEM service. collectCompletedReports reads the report journal under the system
  # identity with no owner filter and publishes to whichever owner each row names, re-authorizing
  # every recipient through the kernel's exact-owner briefing transaction. Nothing about the run
  # depends on who turned it on, so it is activated once by a swarm administrator, not per person.
  - id: daily-trade-recap-recorded-reports
    cron: "*/15 * * * *"
    scope: framework
    runsAs: system
    description: Reconcile at most 50 report journal entries from the last 72 hours into registered owner briefings.
    target: service-route
    route: /api/daily-trade-recap/briefings/collect
    handler: collectCompletedReports

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: daily-trade-recap
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
routes:
  - module: routes/completed-report-briefings.js
    factory: createCompletedReportBriefingRoutes
    mountPath: /api/daily-trade-recap/briefings
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/review.js
    factory: createReviewRoutes
    mountPath: /api/daily-trade-recap
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/daily-trade-recap/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/daily-trade-recap/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

smoke:
  - name: package-readiness
    method: GET
    path: /api/daily-trade-recap/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: []
    tools: []
    connectors: []

# Stage bot reuses the already-registered SHARED vids-operator worker (registered in
# BOTH swarm-bot-registry blocks, kernel-resident) — deliberately NO bots: block here
# (a brand-new bot would need a registry code entry); the loader backfills agent_ids
# from workflow.workerBot. The persona ships as a registrar COPY only. It is
# authorized for trade_recap_pipeline (agent_tools) and instructed by the ticket to
# call exactly that one tool.
tools:
  # The whole pipeline in ONE call so the bot makes a single deterministic tool
  # invocation: render on the remote node (A2A) -> email with attached preview.
  - name: trade_recap_pipeline
    displayName: Produce + publish the daily trade recap (agent-driven)
    type: cli
    category: media
    description: >-
      Hand the daily recap GOAL + the day's authoritative data to the video PC's LOCAL
      AGENT (the node's claude/codex CLI) and let it DRIVE Google Vids itself per the
      operator SOP (packages/oshal-vids-operator/RECAP-SOP.md): regenerate + reconcile the
      numbers, build the deck, generate fresh Jamie Lee clips (Veo "Animate an image",
      Nyx voice), assemble, archive the dated MP4+deck, publish to agenticfederal + emerald,
      verify, and report. This is the monitored, swarm-connected bot — not a rigid build and
      not a click list. Never fabricates: surfaces the real error + failed step.
    executor:
      executorType: cli
      cliCommand: node /run/desktop/mnt/host/c/Projects/open-shal-swarm-harness-agent-llm/scripts/oshal-recap-agent-remote.js {input}
    defaultAuthMode: auto
    timeoutMs: 2400000
    inputSchema:
      type: object
      properties:
        node: { type: string, description: "Override video/render node (clientId or name); default auto-picks it" }
        date: { type: string, description: "Trading day YYYY-MM-DD; default today" }
        dryRun: { type: boolean, description: "Produce + archive but do NOT publish to the sites (for a supervised first run)" }
        publish: { type: boolean, description: "Publish to both sites (default true unless dryRun)" }
        cli: { type: string, description: "Force the node agent CLI: claude | codex (default: claude if signed in)" }
    usageInstructions: >-
      Call after the close. With no arguments ({}) it produces + publishes TODAY's recap by
      driving the node's local agent, polling until it finishes (~15-30 min). Pass
      { dryRun: true } for a supervised first run (produces + archives, no publish). Returns
      the agent's own JSON summary (date, dayPct, dayPl, clips, archived, published, notes).
    routingTags: [trade, recap, video, report, daily, trading]
    skills: [trade-recap, trade-recap-pipeline]
    tags: [daily-trade-recap]

  # --- Sub-steps the pipeline tool calls internally (kept registered for direct use) ---
  - name: trade_recap_render
    displayName: Render the recap video on the remote node
    type: cli
    category: media
    description: >-
      Dispatch the daily trade-recap RENDER to the framework render node over A2A
      (shell.exec). Builds real Alpaca data -> PowerPoint deck -> narrated MP4 + a
      compressed copy. Returns the paths + the day's numbers. Never fabricates.
    executor:
      executorType: cli
      cliCommand: node /run/desktop/mnt/host/c/Projects/open-shal-swarm-harness-agent-llm/scripts/oshal-recap-render-remote.js {input}
    defaultAuthMode: auto
    timeoutMs: 600000
    inputSchema:
      type: object
      properties:
        node: { type: string, description: "Override render node (clientId or name)" }
    routingTags: [trade, recap, video, render, build]
    skills: [trade-recap]
    tags: [daily-trade-recap]

  - name: trade_recap_email
    displayName: Email the daily trade recap
    type: cli
    category: communication
    description: >-
      Email the daily trade-recap (numbers in the body + the compressed video attached)
      via the operator's Google connection. Reads the day's deck-data.json (falling back
      to recap-data.json) + the recap-email.mp4 produced by the render step.
    executor:
      executorType: cli
      cliCommand: node /run/desktop/mnt/host/c/Projects/open-shal-swarm-harness-agent-llm/scripts/oshal-recap-email.js {input}
    defaultAuthMode: auto
    timeoutMs: 120000
    inputSchema:
      type: object
      properties:
        to: { type: string, description: "Recipient (default owner@example.com)" }
    routingTags: [recap, email, notify]
    skills: [trade-recap]
    tags: [daily-trade-recap]

workflow:
  name: Daily Trade Recap
  pipeline: graph
  workerBot: vids-operator
  stages:
    - bot: vids-operator
      name: Render + email the recap
      approvalAfter: true
  processDefinition:
    name: Daily Trade Recap
    nodeGraph:
      nodes:
        - id: n-start
          type: start
          title: Start
          config:
            triggerMode: manual
        - id: n-recap
          type: execute-agent
          title: Render + email the recap
          config:
            agentBinding: vids-operator
            workType: authored
        - id: n-gate
          type: approval-gate
          title: Approve for posting
          config:
            gateState: approval_required
        - id: n-deliver
          type: deliver
          title: Deliver
          config:
            deliveryMode: standard
      edges:
        - id: e-start-recap
          source: n-start
          target: n-recap
        - id: e-recap-gate
          source: n-recap
          target: n-gate
        - id: e-gate-deliver
          source: n-gate
          target: n-deliver
      topologicalOrder:
        - n-start
        - n-recap
        - n-gate
        - n-deliver
  autoStart: true

summary:
  path: /api/daily-trade-recap/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items

integrations:
  offers:
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
    - id: prepare-episode
      label: Prepare a video episode
      targetApp: video
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
  accepts:
    - id: prepare-brief
      contextType: research-brief
      version: 1
      surface: recap-review
      fields:
        - title
        - notes
        - sourceUrl

ui:
  static:
    - toolName: recap-review
      label: Recap Review
      iframeUrl: /api/daily-trade-recap/review
      icon: codicon codicon-report
      section: top
