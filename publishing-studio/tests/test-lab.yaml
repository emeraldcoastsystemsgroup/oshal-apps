    name: Publishing Studio opens on a platform without the planned-control helper
    purpose: A regression guard for 0.4.1. Real Chromium over the real routes and disposable SQL, with only the shared planned-control helper's address answering 404, as on an older kernel platform.
    level: browser
    runner:
      kind: external
