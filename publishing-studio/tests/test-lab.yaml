      files: [tests/workbench-older-platform.test.mjs]
    expected:
      - The studio reaches ready, draws no greyed placeholder and its tool row is Text, Image, Shape, Concierge, More.
      - Add text frame still makes a publication and opens the Text sheet; no page error.
    prerequisites: [runner:node, runtime:publishing-pinned-python, runtime:publishing-pinned-typst, service:disposable-postgres-35689, browser:chromium, source:kernel-shared-ui]
    sideEffects: fixture-write
    isolation:
