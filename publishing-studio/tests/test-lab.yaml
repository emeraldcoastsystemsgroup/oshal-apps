  - id: model
    name: Closed human/agent model and actual Python parity
    purpose: >-
      Closed human/agent model and actual Python parity. Actual source fixtures name their grant/port/kept-run seams;
      this is not installed kernel or configured-provider acceptance.
    level: integration
    runner:
      kind: external
      scope: package
      files:
        - tests/model.test.mjs
    expected:
      - Required source assertions pass with genuine declared prerequisites; no skip or fallback.
    prerequisites:
      - runner:node
      - runtime:publishing-pinned-python
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: >-
        Remove only unique own fixture databases/roles/children/temp directories.
        Preserve shared PostgreSQL127.0.0.1:35689 and its container; never use live data.
    limits:
      timeoutMs: 30000
      maxMemoryMb: 1536
    installation: never
