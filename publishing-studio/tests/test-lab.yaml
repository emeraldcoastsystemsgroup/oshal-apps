  - id: document-handoff
    name: Manual and concierge publication handoff
    purpose: Automatically save current editor fields before concierge reading and retain complete model undo across saved same-document updates while guarding dirty or switched publications.
    level: integration
    runner:
      kind: external
      scope: package
      files: [tests/browser/document-handoff.test.mjs]
    expected:
      - Unapplied manual text saves without pressing Apply or Save before the assistant reads.
      - The same original-owner native story refreshes, then the next manual change reaches the next handoff.
      - Failed saves and concurrent focused fields preserve the browser draft.
      - Real assistant story, style and view updates undo and redo across saves without losing the earlier manual history.
      - Unchanged saved revisions retain redo, and a delayed refresh cannot replace a newly opened publication.
      - Old handoffs preserve a later historical view, and old approval cards cannot execute from a different document.
      - The embedded chat saves before sending its real request; a full manual batch saves before pending fields continue.
    prerequisites: [runner:node, browser:chromium, runtime:publishing-pinned-python, runtime:typst-pinned, fixture:postgres-35689, core:shared-theme-assets]
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: Remove only unique own fixture databases, roles, children and temporary directories; preserve shared PostgreSQL.
    limits: { timeoutMs: 180000, maxMemoryMb: 1536 }
    installation: never
