      allOf:
        - document.view
        - document.read
    - id: publishing-route-15
      method: POST
      path: /documents/:document/revisions
      allOf:
        - document.view
        - document.read
        - document.change
        - asset.read
    - id: publishing-route-16
      method: POST
      path: /documents/:document/edits
      allOf:
        - document.view
        - document.read
        - document.change
        - asset.read
    - id: publishing-route-17
      method: POST
      path: /documents/:document/render
      allOf:
        - document.view
