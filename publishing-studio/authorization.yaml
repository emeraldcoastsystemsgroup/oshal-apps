# CHANGE LOG: 1 | maintainer@emeraldcoastsystemsgroup.com | Keep original-owned read/export/asset/job grants distinct.
version: 1
resources:
  documents:
    scopes:
      - own
  assets:
    scopes:
      - own
permissions:
  document.view:
    resource: documents
    effect: read
    minimumTier: viewer
  document.read:
    resource: documents
    effect: read
    minimumTier: viewer
  document.create:
    resource: documents
    effect: write
    minimumTier: editor
  document.change:
    resource: documents
    effect: write
    minimumTier: editor
  document.delete:
    resource: documents
    effect: write
    minimumTier: editor
  document.render:
    resource: documents
    effect: write
    minimumTier: editor
  document.export:
    resource: documents
    effect: export
    minimumTier: editor
  asset.read:
    resource: assets
    effect: read
    minimumTier: viewer
  asset.import:
    resource: assets
    effect: write
    minimumTier: editor
  asset.delete:
    resource: assets
    effect: write
    minimumTier: editor
  job.read:
    resource: documents
    effect: read
    minimumTier: viewer
  job.manage:
    resource: documents
    effect: write
    minimumTier: editor
roles:
  viewer:
    tier: viewer
    grants:
      - permission: document.view
        scope: own
      - permission: job.read
        scope: own
  reader:
    tier: viewer
    grants:
      - permission: document.view
        scope: own
      - permission: document.read
        scope: own
      - permission: asset.read
        scope: own
      - permission: job.read
        scope: own
  creator:
    tier: editor
    grants:
      - permission: document.view
        scope: own
      - permission: document.read
        scope: own
      - permission: document.create
        scope: own
      - permission: asset.read
        scope: own
      - permission: asset.import
        scope: own
      - permission: job.read
        scope: own
  editor:
    tier: editor
    grants:
      - permission: document.view
        scope: own
      - permission: document.read
        scope: own
      - permission: document.change
        scope: own
      - permission: document.render
        scope: own
      - permission: asset.read
        scope: own
      - permission: job.read
        scope: own
      - permission: job.manage
        scope: own
  exporter:
    tier: editor
    grants:
      - permission: document.view
        scope: own
      - permission: document.read
        scope: own
      - permission: asset.read
        scope: own
      - permission: document.export
        scope: own
      - permission: job.read
        scope: own
  administrator:
    tier: admin
    grants:
      - permission: document.view
        scope: own
      - permission: document.read
        scope: own
      - permission: document.create
        scope: own
      - permission: document.change
        scope: own
      - permission: document.delete
        scope: own
      - permission: document.render
        scope: own
      - permission: document.export
        scope: own
      - permission: asset.read
        scope: own
      - permission: asset.import
        scope: own
      - permission: asset.delete
        scope: own
      - permission: job.read
        scope: own
      - permission: job.manage
        scope: own
bindings:
  http:
    - id: publishing-route-0
      method: GET
      path: /app
      allOf:
        - document.view
    - id: publishing-route-1
      method: GET
      path: /ui/:asset
      allOf:
        - document.view
    - id: publishing-route-2
      method: GET
      path: /permissions
      allOf:
        - document.view
    - id: publishing-route-3
      method: GET
      path: /editing-contract
      allOf:
        - document.view
    - id: publishing-route-4
      method: GET
      path: /_smoke
      allOf:
        - document.view
    - id: publishing-route-5
      method: GET
      path: /home-summary
      allOf:
        - document.view
        - document.read
    - id: publishing-route-6
      method: GET
      path: /assets
      allOf:
        - document.view
        - asset.read
    - id: publishing-route-7
      method: POST
      path: /assets/upload
      allOf:
        - document.view
        - asset.import
    - id: publishing-route-8
      method: POST
      path: /assets/import-artifact
      allOf:
        - document.view
        - asset.import
    - id: publishing-route-9
      method: GET
