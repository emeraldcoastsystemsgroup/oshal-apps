      allOf:
        - document.view
        - asset.read
    - id: publishing-route-10
      method: DELETE
      path: /assets/:asset
      allOf:
        - document.view
        - asset.delete
    - id: publishing-route-11
      method: GET
      path: /documents
      allOf:
        - document.view
        - document.read
    - id: publishing-route-12
      method: POST
      path: /documents
      allOf:
        - document.view
        - document.create
        - asset.read
    - id: publishing-route-13
      method: GET
      path: /documents/:document
      allOf:
        - document.view
        - document.read
    - id: publishing-route-14
