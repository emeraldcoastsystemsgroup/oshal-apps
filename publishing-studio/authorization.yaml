    - id: publishing-route-20
      method: GET
      path: /documents/:document/revisions/:revision/preview/:page
      allOf:
        - document.view
        - document.read
    - id: publishing-route-21
      method: GET
      path: /documents/:document/revisions/:revision/content
      allOf:
        - document.view
        - document.read
        - document.export
    - id: publishing-route-22
      method: POST
      path: /documents/:document/export
      allOf:
        - document.view
        - document.read
        - document.export
    - id: publishing-route-23
      method: DELETE
      path: /documents/:document
      allOf:
        - document.view
        - document.read
        - document.delete
  tools:
    - id: publishing-editing-contract
      allOf:
        - document.view
    - id: publishing-list-documents
      allOf:
        - document.view
        - document.read
    - id: publishing-list-assets
      allOf:
        - document.view
        - asset.read
    - id: publishing-read-document
      allOf:
        - document.view
        - document.read
    - id: publishing-read-model-part
      allOf:
        - document.view
        - document.read
    - id: publishing-import-artifact
      allOf:
        - document.view
        - asset.import
    - id: publishing-create-document
      allOf:
        - document.view
        - document.create
        - asset.read
    - id: publishing-apply-edits
      allOf:
        - document.view
        - document.read
        - document.change
        - asset.read
    - id: publishing-restore-revision
      allOf:
        - document.view
        - document.read
        - document.change
        - asset.read
    - id: publishing-start-render
      allOf:
