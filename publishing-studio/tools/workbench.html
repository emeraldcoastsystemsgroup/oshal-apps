<!doctype html>
<!-- CHANGE LOG
1 | maintainer@emeraldcoastsystemsgroup.com | 0.4.0, the oshal design standard (docs/ux/design-standard.md §3, §5.0, §5.1; Canva and Adobe Express, REFP CONVENTIONS §5.5): the page declares its contract (an editor whose first action is pressing Add text frame; the page is the work). One app row (back to your publications, the publication's name and its menu, undo, redo, a Saved caption, Save revision while there is something to save, More, and the one primary: Add text frame on an empty page, Download PDF once there is content); the page on top and one tool row below it; Your publications as their own view with one New at the bottom right; every legacy control keeps its id and moves into the sheet or pane that holds it, so the routes, the history and the concierge handoff are unchanged. The package stylesheet loads after the shared editor's so the standard's tokens win.
-->
<html lang="en" data-theme="light-blue" data-ds-category="editor" data-ds-first-action="tap"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publishing Studio — OSHAL</title><link rel="stylesheet" href="/shared/ui/css/surface-themes.css"><script src="/shared/ui/js/surface-theme.js"></script><link rel="stylesheet" href="/shared/ui/css/editor-foundation.css"><link rel="stylesheet" href="/api/publishing-studio/ui/workbench.css"></head>
<body>
<header class="top">
 <div class="pub-brand" data-ef-phone="brand"><h1>Publishing Studio</h1></div>
 <div class="pub-approw" role="toolbar" aria-label="Publication">
  <button id="back-to-list" type="button" class="pub-icon" aria-label="Your publications" title="Your publications"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="document-menu" type="button" class="pub-docmenu" aria-haspopup="dialog" aria-label="Publication menu"><span id="document-title">Untitled publication</span><span class="pub-caret" aria-hidden="true">▾</span></button>
  <button id="undo" type="button" class="pub-icon" aria-label="Undo" title="Undo"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="redo" type="button" class="pub-icon" aria-label="Redo" title="Redo"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <span id="pub-tools-slot" class="pub-tools-slot"></span>
  <span class="pub-grow"></span>
  <span id="save-state" class="pub-saved" aria-live="polite"></span>
  <button id="save" type="button" class="pub-secondary">Save revision</button>
  <span id="comment-slot" class="pub-comment-slot"></span>
  <button id="more-menu" type="button" class="pub-icon" aria-label="More" title="More" aria-haspopup="dialog"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg></button>
  <button id="add-first" type="button" class="primary">Add text frame</button>
  <button id="export-pdf" type="button" class="primary" aria-label="Download PDF"><span class="pub-long">Download PDF</span><span class="pub-short" aria-hidden="true">Download</span></button>
 </div>
 <div id="pub-hold-header" hidden><span id="revision"></span><button id="render" type="button">Render &amp; preflight</button><button id="refresh" type="button">Refresh files</button></div>
</header>
<p id="status" role="status" aria-live="polite">Opening your workspace…</p>
<main>
<aside class="rail" aria-label="Pages">
 <div class="pub-pane-head"><h2>Pages</h2><button id="pages-toggle" type="button" class="pub-icon" aria-expanded="true" aria-controls="page-rail" aria-label="Hide pages" title="Hide pages"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 5h16v14H4zM9 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button></div>
 <nav id="page-rail" aria-label="Pages"></nav>
 <div class="pub-page-tools"><label>View<select id="page-view"><option value="facing">Facing pages</option><option value="single">Single page</option></select></label><div class="pub-pair"><button id="add-page" type="button">Add page</button><button id="remove-page" type="button" class="pub-danger">Remove page</button></div></div>
 <div id="pub-hold-rail" hidden><form id="new"><label>Title<input id="new-title" maxlength="160" value="Untitled publication" required></label><label>Pages<input id="new-pages" type="number" min="1" max="8" value="1" required></label><button>Create publication</button></form></div>
</aside>
<section class="workspace" aria-label="Page editing workspace">
 <section id="publications" class="pub-list" aria-labelledby="publications-heading" hidden><h2 id="publications-heading" class="pub-list-title">Your publications</h2><div id="documents" class="pub-cards"></div><button id="new-publication" type="button" class="primary pub-new" data-ef-floating aria-haspopup="dialog">New</button></section>
 <div id="spread" data-ds-work></div>
 <div id="pub-hold-work" hidden><div class="document-bar"><h2 id="document-heading"></h2></div><p id="draft-note"></p><p id="preflight" role="status"></p><button id="cancel-render" type="button">Cancel render</button><button id="export-layout" type="button">Download layout</button><button id="reopen" type="button">Reopen saved</button><label>Saved revision<select id="history"></select></label><button id="open-history" type="button">Open revision</button><button id="restore-history" type="button">Restore as new revision</button><button id="delete-document" type="button">Delete publication</button></div>
</section>
<aside class="inspector" aria-label="Properties">
 <div id="pub-hold-inspector" hidden><h2>Selection</h2><p id="selection">No page selected</p><fieldset id="properties"><legend>Frame or object</legend><label>Item<select id="item"></select></label><form id="geometry"><div class="numbers"><label>X<input id="x" type="number" step="0.1" required></label><label>Y<input id="y" type="number" step="0.1" required></label><label>Width<input id="width" type="number" step="0.1" required></label><label>Height<input id="height" type="number" step="0.1" required></label></div><button>Apply geometry</button></form></fieldset><button id="replace-story" type="button">Apply text</button><label>Kind<select id="object-kind"><option value="rect">Rectangle</option><option value="image">Image</option><option value="text">Text</option><option value="number">Page number</option><option value="frame">Linked text frame</option></select></label><label>Text<textarea id="object-text" rows="2"></textarea></label><label>Color<input id="object-color" type="color" value="#3656cc"></label><button id="add-object" type="button">Add to selected page</button><button id="remove-object" type="button">Remove selected item</button></div>
 <p id="pub-page-summary" class="pub-note pub-sec" data-pub-sec="summary">Letter page · 8.5 × 11 in · 0.75 in margins</p>
 <p id="field-edits" role="status"></p><button id="discard-fields" type="button" class="pub-secondary">Discard field edits</button>
 <section id="pub-sec-text" class="pub-sec" data-pub-sec="text" aria-labelledby="pub-sec-text-h"><h3 id="pub-sec-text-h">Text</h3><label class="pub-hidden-field">Story<select id="story"></select></label><label>Your text<textarea id="story-text" rows="6"></textarea></label><div class="numbers"><label>Paragraph style<select id="story-paragraph-style"></select></label><label>Character style<select id="story-character-style"></select></label></div></section>
 <section id="pub-sec-format" class="pub-sec" data-pub-sec="format" aria-labelledby="pub-sec-format-h"><h3 id="pub-sec-format-h">Text style</h3><div class="numbers"><label>Font<select id="fmt-font"><option>Libertinus Serif</option></select></label><label>Size<input id="fmt-size" type="number" min="6" max="96" step="0.5"></label></div><div class="numbers pub-end"><label>Colour<input id="fmt-color" type="color"></label><span class="pub-toggles"><button id="fmt-bold" type="button" class="pub-toggle" aria-pressed="false" aria-label="Bold"><b>B</b></button><button id="fmt-italic" type="button" class="pub-toggle" aria-pressed="false" aria-label="Italic"><i>I</i></button></span></div><div id="fmt-align" class="pub-segments" role="group" aria-label="Alignment"><button type="button" data-align="left" aria-pressed="false">Left</button><button type="button" data-align="center" aria-pressed="false">Centre</button><button type="button" data-align="right" aria-pressed="false">Right</button></div><p class="pub-note" id="fmt-note"></p></section>
 <section id="pub-sec-arrange" class="pub-sec" data-pub-sec="arrange" aria-labelledby="pub-sec-arrange-h"><h3 id="pub-sec-arrange-h">Arrange</h3><div id="pub-arrange-host"></div><div class="pub-link-row"><label>Next linked frame<select id="next-frame"></select></label><button id="link-frame" type="button" class="pub-secondary">Apply link</button></div></section>
 <section id="pub-sec-page" class="pub-sec" data-pub-sec="page" aria-labelledby="pub-sec-page-h"><h3 id="pub-sec-page-h">Page</h3><form id="page-properties"><div class="numbers"><label>Trim width<input id="page-width" type="number" min="72" max="1440" step="0.1"></label><label>Trim height<input id="page-height" type="number" min="72" max="1440" step="0.1"></label></div><div class="numbers"><label>Bleed<input id="bleed" type="number" min="0" max="36" step="0.1"></label><label>Margin<input id="margin" type="number" min="0" step="0.1"></label></div><div class="numbers"><label>Vertical guides<input id="guides-x" inputmode="decimal"></label><label>Horizontal guides<input id="guides-y" inputmode="decimal"></label></div><label>Master<select id="master"></select></label><button class="pub-secondary">Apply page settings</button></form></section>
 <section id="pub-sec-master" class="pub-sec" data-pub-sec="master" aria-labelledby="pub-sec-master-h"><h3 id="pub-sec-master-h">Master</h3><label>Master objects (JSON)<textarea id="master-objects" rows="5"></textarea></label><button id="apply-master" type="button" class="pub-secondary">Apply master objects</button></section>
 <section id="pub-sec-styles" class="pub-sec" data-pub-sec="styles" aria-labelledby="pub-sec-styles-h"><h3 id="pub-sec-styles-h">Styles</h3><label>Character style<select id="character-style"></select></label><form id="character-properties"><div class="numbers"><label>Font<input id="font" value="Libertinus Serif"></label><label>Size<input id="font-size" type="number" min="6" max="96" step="0.1"></label></div><div class="numbers"><label>Weight<select id="font-weight"><option value="400">Regular</option><option value="700">Bold</option></select></label><label>Style<select id="font-style"><option value="normal">Normal</option><option value="italic">Italic</option></select></label></div><div class="numbers pub-end"><label>Colour<input id="font-color" type="color"></label><button class="pub-secondary">Apply character style</button></div></form><label>Paragraph style<select id="paragraph-style"></select></label><form id="paragraph-properties"><div class="numbers"><label>Leading<input id="leading" type="number" min="0" max="96" step="0.1"></label><label>Space after<input id="space-after" type="number" min="0" max="96" step="0.1"></label></div><div class="numbers"><label>Indent<input id="indent" type="number" min="0" max="144" step="0.1"></label><label>Alignment<select id="align"><option>left</option><option>center</option><option>right</option></select></label></div><button class="pub-secondary">Apply paragraph style</button></form></section>
 <section id="pub-sec-image" class="pub-sec" data-pub-sec="image" aria-labelledby="pub-sec-image-h"><h3 id="pub-sec-image-h">Image</h3><form id="asset-upload"><label>A PNG or JPEG from your device<input id="asset-file" type="file" accept="image/png,image/jpeg" required></label><label>Image title<input id="asset-title" maxlength="160" required></label><button class="pub-secondary">Upload and place</button></form><div id="pub-your-images"><label>Your images<select id="object-asset"></select></label><button id="place-image" type="button" class="pub-secondary">Place on the page</button><div id="asset-list"></div></div></section>
 <section class="chat"></section>
</aside>
</main><footer></footer>
<script type="module" src="/api/publishing-studio/ui/workbench.mjs"></script></body></html>
