# 0.3.6 | maintainer@emeraldcoastsystemsgroup.com | Phones (F6 and the trial check, 2026-11-06): New publication is the empty state's one first action, dead document controls wait until a publication is open, one app bar row (Save revision, More), the editor viewport is the one scroller, first pane Publications.
# 0.3.7 | maintainer@emeraldcoastsystemsgroup.com | Touch (the round-2 trial check, 2026-11-06): a finger scrolls the open publication's page, also from a frame or the page margin, and a tap selects a frame; only the chosen frame's Move handle (touch screens) drags it, as in the reference editors; a mouse still drags outlines directly. Choosing a frame keeps the scroll position. Previews are asked for only when the opened revision has a ready render (GET /documents/:id answers rendered), so opening revision 1 logs no 409s.
# 0.4.0 | maintainer@emeraldcoastsystemsgroup.com | The oshal design standard (docs/ux/design-standard.md §3-§5; Canva and Adobe Express, REFP CONVENTIONS §5.5; Roger F6; UX audit decision publishing-studio--publishing-studio): the page declares its contract; with nothing saved it opens on one blank Letter page whose one first action is Add text frame, and with publications on Your publications (newest first, one New: Blank Letter, Blank A4, the planned From template); text typed in a frame is drawn on the page at once; Render and Download PDF run on the current draft and save it first; one app row (back, the publication's menu, undo, redo, Saved, More, the one primary) and one tool row (Text, Image, Shape, Pages, Styles, Concierge, More) that switches to the chosen item's tools under a selection float; Styles, Pages, Master and the item tools are half sheets on a phone and the Pages | page | Properties·Concierge panes on a desktop; one inspector; limits and how-to in Help; no browser dialog; planned controls for RP-PUB-01..07. POST /documents takes an optional size for a blank publication; no permission, binding or authorization change.
# 0.4.1 | maintainer@emeraldcoastsystemsgroup.com | The studio opens on a platform without the shared planned-control helper (an older kernel platform, such as the store gate's fixture platform): the greyed placeholders are then simply not drawn, instead of the editor never starting. 0.4.0 was merged with this fix only in the gate's working tree.
# 0.4.2 | maintainer@emeraldcoastsystemsgroup.com | At 1440x900 Your publications fills the app: the editor's desktop grid kept the list in its second column, an implicit 267px strip at the right with the rest of the app empty (the trial check of 0.4.1, 2026-11-06). Guard: tests/browser/design-standard.test.mjs, "Your publications takes the whole width".
# 0.5.0 | maintainer@emeraldcoastsystemsgroup.com | Starter templates, multi-select and grouping, image background cutout, proportional format resize, Create brand kit integration, forced-RLS pinned comments, social post scheduling and publishing behind explicit confirmation, and item animation presets with collapsible timeline and H.264 MP4 video export (RP-PUB-01..08).
# 0.5.1 | maintainer@emeraldcoastsystemsgroup.com | Snapshot-load referenced revision, blob, chunk, output, and comment-reply rows before native SQL updates and cascade deletes across video jobs, social posts, comments, and document removal.
# CHANGE LOG: request-key | maintainer@emeraldcoastsystemsgroup.com | 0.3.5: issue fresh contract request keys and reject edit keys outside the existing backend UUID contract.
# 0.3.4 | maintainer@emeraldcoastsystemsgroup.com | Use an obviously synthetic UUIDv4 request example while requiring a fresh identifier for each new request.
# 0.3.1 | maintainer@emeraldcoastsystemsgroup.com | Share the pinned native concierge, live saved-document refresh, same-session manual follow-up and controller-owned approval cards.
# 0.3.0 | maintainer@emeraldcoastsystemsgroup.com | Complete validated model history survives saves and same-document assistant updates with original CAS and asset ownership.
# 0.2.0 | maintainer@emeraldcoastsystemsgroup.com | Shared editor shell and contextual properties use existing document commands, history and automatic assistant handoff.
# CHANGE LOG: 1 | maintainer@emeraldcoastsystemsgroup.com | Declare real bounded Publishing routes and original held agent contracts.
# 2 | maintainer@emeraldcoastsystemsgroup.com | 0.1.1: automatically save inspector drafts and refresh the concierge document handoff.
# 3 | maintainer@emeraldcoastsystemsgroup.com | 0.1.2: the page opens inside the cockpit. Its query rule refused the v= every cockpit frame carries and the audience= an experience adds, so the screen showed {"error":"publishing_personal_scope_only"} instead of the studio. Found by the main menu's every-screen sweep. No contract change.
name: publishing-studio
suite: ai-creative
displayName: Publishing Studio
description: >-
  Original-owned bounded English print and animated layouts, starter templates, linked stories,
  styles, masters, subject cutouts, comments, social scheduling and native Typst PDF/PNG/MP4 output.
version: 0.5.1
runtime: process
lastingStorage: true
status: active
scope: public
uses:
  - application-authorization
  - test-catalog
  - app-dependencies
  - experience-roles
testing:
  version: 1
  catalog: tests/test-lab.yaml
authorization:
  version: 1
  catalog: authorization.yaml
  roleTemplates:
    - id: administrator
      version: 1
      label: Publishing Studio Administrator
      members:
        - { app: publishing-studio, role: administrator }
    - id: creator
      version: 1
      label: Publishing Creator
      members:
        - { app: publishing-studio, role: creator }
        - { app: publishing-studio, role: editor }
        - { app: publishing-studio, role: exporter }
chatBot: publishing-editor
rating:
  memoryMb: { low: 384, high: 1536, basis: declared }
  features:
    - id: publishing-editing-command
      unit: editing command
      tier: T1
      generation: none
      degrade: disable
source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: publishing-studio
  ref: main
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: [create]
    tools: []
    connectors: [twitter, linkedin]
egress:
  - host: api.twitter.com
    credential: { connector: twitter, header: authorization, prefix: "Bearer " }
  - host: api.linkedin.com
    credential: { connector: linkedin, header: authorization, prefix: "Bearer " }
routes:
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/publishing-studio/_smoke
    auth: service
    requiresContext: true
    requiresAi: false
  - module: routes/application.mjs
    factory: createPublishingRoutes
    mountPath: /api/publishing-studio
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false
smoke:
  - name: package-readiness
    method: GET
    path: /api/publishing-studio/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false
migrations:
  - migrations/001-publishing-studio.sql
  - migrations/native/001-publishing-studio.sql
  - migrations/002-publishing-features.sql
  - migrations/native/002-publishing-features.sql
nativeMigrations:
  - id: migrations/001-publishing-studio.sql
    native: skip
    reason: >-
      Native final schema retains Person scope and immutable rows; PostgreSQL additionally applies
      forced original-owner RLS.
  - id: migrations/002-publishing-features.sql
    native: skip
    reason: >-
      Native final schema provisions comments, social posts and video render jobs without PG GUC
      policy DDL; PostgreSQL additionally applies forced two-arm original-owner RLS.
schedules:
  - id: publishing-social-publish
    cron: "*/5 * * * *"
    runsAs: user
    target: service-route
    route: /api/publishing-studio/social/run-due
    method: POST
    body: {}
    timeoutSeconds: 60
    description: Publish the social posts you scheduled from Publishing Studio on your own connected accounts within five minutes of their scheduled time.
    offer: Publish my scheduled Publishing Studio social posts when their time comes.
summary:
  path: /api/publishing-studio/home-summary
  tilesPointer: /metrics
  itemsPointer: /items
ui:
  static:
    - toolName: publishing-studio
      label: Publishing Studio
      icon: codicon codicon-layout
      iframeUrl: /api/publishing-studio/app
      section: top
ribbon:
  defaultView: publishing-studio
  hideChatPanel: false
bots:
  - agentId: 04b8a632-2b12-43f2-914b-10d7d6a0c891
    name: publishing-editor
    persona: personas/publishing-editor.yaml
    posture: inline
    role: creative/publishing-editor
    capabilities:
      - publishing-layout
      - linked-stories
      - publishing-preflight
    selectorDescriptor: >-
      Choose for owned English brochures/publications, linked text frames, page/master/style/image
      layout and Typst PDF/PNG preflight. Bounded 8 pages; not full InDesign, PDF/X or CMYK.
    routingKeywords:
      - publishing
      - brochure
      - linked text
      - master page
      - print layout
tools:
  - name: publishing-editing-contract
    displayName: Read current publishing contract
    type: api
    category: creative
    description: >-
      Read current publishing contract. Read the current full operation fields, null transport,
      font/profile limits before edits. Source model is immutable per revision; never claim a
      truncated observation complete.
    executor:
      executorType: api
      apiEndpoint: GET /api/publishing-studio/editing-contract
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    usageInstructions: >-
      Read the current full operation fields, null transport, font/profile limits before edits.
      Source model is immutable per revision; never claim a truncated observation complete.
    routingTags:
      - publishing
      - brochure
      - layout
    skills:
      - publishing-editing
    tags:
      - route-backed
  - name: publishing-list-documents
    displayName: List owned publications
    type: api
    category: creative
    description: >-
      List owned publications. Choose actual returned owned document UUIDs, never invent IDs or
      owners.
    executor:
      executorType: api
      apiEndpoint: GET /api/publishing-studio/documents
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    usageInstructions: Choose actual returned owned document UUIDs, never invent IDs or owners.
    routingTags:
      - publishing
      - brochure
      - layout
    skills:
      - publishing-editing
    tags:
      - route-backed
  - name: publishing-list-assets
    displayName: List owned image originals
    type: api
    category: creative
    description: >-
      List owned image originals. Only owned PNG/JPEG originals. Use returned id/hash/bytes/mime
      when constructing layout assets.
    executor:
      executorType: api
      apiEndpoint: GET /api/publishing-studio/assets
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    usageInstructions: >-
      Only owned PNG/JPEG originals. Use returned id/hash/bytes/mime when constructing layout
      assets.
    routingTags:
      - publishing
      - brochure
      - layout
    skills:
      - publishing-editing
    tags:
      - route-backed
  - name: publishing-read-document
    displayName: Read publication revision receipt
    type: api
    category: creative
    description: >-
      Read publication revision receipt. Pin exact immutable saved revision/model SHA. Read every
      model part needed before proposing edits; counts are not full model.
    executor:
      executorType: api
      apiEndpoint: GET /api/publishing-studio/documents/{input.id}?revision={input.revision}&receipt=1
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 36
          maxLength: 36
        revision:
          type: integer
          minimum: 1
          maximum: 100
      required:
        - id
        - revision
    usageInstructions: >-
      Pin exact immutable saved revision/model SHA. Read every model part needed before proposing
      edits; counts are not full model.
    routingTags:
      - publishing
      - brochure
      - layout
    skills:
      - publishing-editing
    tags:
      - route-backed
  - name: publishing-read-model-part
    displayName: Read exact publication model part
    type: api
    category: creative
    description: >-
      Read exact publication model part. Read one exact descriptor or part=complete JSON-text
      fragments at UTF16 offset0, following nextOffset to null at the same revision/modelSHA and
      textSHA. Reassemble and verify complete model, never treat a truncated observation as
      complete. Oversized descriptors require complete fragments.
    executor:
      executorType: api
      apiEndpoint: >-
        GET
        /api/publishing-studio/documents/{input.id}/model/{input.part}/{input.offset}?revision={input.revision}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 36
          maxLength: 36
        revision:
          type: integer
          minimum: 1
          maximum: 100
        part:
          type: string
          enum:
            - pages
            - masters
            - stories
            - assets
            - paragraphStyles
            - characterStyles
            - complete
        offset:
          type: integer
          minimum: 0
          maximum: 524288
      required:
        - id
        - revision
        - part
        - offset
    usageInstructions: >-
      Read one exact descriptor or part=complete JSON-text fragments at UTF16 offset0, following
      nextOffset to null at the same revision/modelSHA and textSHA. Reassemble and verify complete
      model, never treat a truncated observation as complete. Oversized descriptors require complete
      fragments.
    routingTags:
      - publishing
      - brochure
      - layout
    skills:
      - publishing-editing
    tags:
      - route-backed
  - name: publishing-import-artifact
    displayName: Import owned publishing image artifact
    type: api
    category: creative
    description: >-
      Import owned publishing image artifact. Use genuine native art_ handle only; current
      owner/producer, whole SHA, PNG/JPEG <=4MiB. Original bytes retained immutable; held approval.
    executor:
      executorType: api
      apiEndpoint: POST /api/publishing-studio/assets/import-artifact
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        ref:
          type: string
          minLength: 68
          maxLength: 68
        title:
          type: string
          minLength: 1
          maxLength: 160
        requestKey:
          type: string
          minLength: 36
          maxLength: 36
      required:
        - ref
        - title
        - requestKey
    usageInstructions: >-
      Use genuine native art_ handle only; current owner/producer, whole SHA, PNG/JPEG <=4MiB.
      Original bytes retained immutable; held approval.
    routingTags:
      - publishing
      - brochure
      - layout
    skills:
      - publishing-editing
    tags:
      - route-backed
  - name: publishing-create-document
    displayName: Create owned publication
    type: api
    category: creative
    description: >-
      Create owned publication. Creates saved initial linked-story layout. A UUID requestKey seals
      exact inputs; reuse only same-input uncertain retries.
    executor:
      executorType: api
      apiEndpoint: POST /api/publishing-studio/documents
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        pageCount:
          type: integer
          minimum: 1
          maximum: 8
        size:
          type: string
          enum:
            - letter
            - a4
            - a5
            - square
            - portrait
            - widescreen
        templateId:
          type: string
          enum:
            - event-flyer
            - newsletter
            - booklet
        requestKey:
          type: string
          minLength: 36
          maxLength: 36
      required:
        - title
        - pageCount
        - requestKey
    usageInstructions: >-
      Creates saved initial linked-story layout. A UUID requestKey seals exact inputs; reuse only
      same-input uncertain retries.
    routingTags:
      - publishing
      - brochure
      - layout
    skills:
      - publishing-editing
    tags:
      - route-backed
  - name: publishing-apply-edits
    displayName: Save publication operations
    type: api
    category: creative
    description: >-
      Save publication operations. Read publishing-editing-contract first for complete per-operation
      JSON schemas. Supply operationsJson as a JSON array of exact canonical operations (raw null
      allowed), never code. Explain edits and hold approval; latest baseRevision CAS. Native total
      input <=16KiB, including escaping. Saving appends immutable history; rendering is separate.
      Preserve every unaffected story/object. Invoke this actual tool to hold the native approval
      card; an approval summary or ordinary JSON/code fence does not create a card. requestKey
      MUST be a fresh UUIDv4 exactly 36 characters including hyphens, never a label or counter.
      UUIDv4 has the exact form xxxxxxxx-xxxx-4xxx-[89ab]xxx-xxxxxxxxxxxx, hexadecimal only:
      the third group starts with 4 (NOT 7), and the fourth starts with 8,9,a or b.
      Copy requestKey unchanged from the just-read publishing-editing-contract response.
      Never invent a key or reuse an illustrative example. A UUIDv7 or sequential placeholder fails unchanged validation.
      Operation example: [{"op":"replace-story","story":"story","paragraphs":[{"style":"body","runs":[{"style":"default","text":"Replacement text"}]}]}].
      Copy the actual story ID and existing paragraph/run styles from the saved model; replace
      only requested text. The complete call has id, baseRevision, requestKey and operationsJson.
    executor:
      executorType: api
      apiEndpoint: POST /api/publishing-studio/documents/{input.id}/edits
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 36
          maxLength: 36
        baseRevision:
          type: integer
          minimum: 1
          maximum: 100
        requestKey:
          description: Copy requestKey unchanged from the just-read editing contract response for this new edit; never invent it. Read a fresh contract for each new intent; retry an uncertain result with the identical key and body.
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          minLength: 36
          maxLength: 36
        operationsJson:
          type: string
          minLength: 2
          maxLength: 15000
      required:
        - id
        - baseRevision
        - requestKey
        - operationsJson
    usageInstructions: >-
      Read publishing-editing-contract first for complete per-operation JSON schemas. Supply
      operationsJson as a JSON array of exact canonical operations (raw null allowed), never code.
      Explain edits and hold approval; latest baseRevision CAS. Native total input <=16KiB,
      including escaping. Saving appends immutable history; rendering is separate. Preserve every
      unaffected story/object.
    routingTags:
      - publishing
      - brochure
      - layout
    skills:
      - publishing-editing
    tags:
      - route-backed
  - name: publishing-restore-revision
    displayName: Restore publication history
    type: api
    category: creative
    description: >-
      Restore publication history. Append older model as new revision under latest baseRevision CAS.
      Never overwrite history.
    executor:
      executorType: api
      apiEndpoint: POST /api/publishing-studio/documents/{input.id}/revisions
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 36
          maxLength: 36
        baseRevision:
          type: integer
          minimum: 1
          maximum: 100
        restoreRevision:
          type: integer
          minimum: 1
          maximum: 100
        requestKey:
          type: string
          minLength: 36
          maxLength: 36
      required:
        - id
        - baseRevision
        - restoreRevision
        - requestKey
    usageInstructions: Append older model as new revision under latest baseRevision CAS. Never overwrite history.
    routingTags:
      - publishing
      - brochure
      - layout
    skills:
      - publishing-editing
    tags:
      - route-backed
  - name: publishing-start-render
    displayName: Render pinned publication revision
    type: api
    category: creative
    description: >-
      Render pinned publication revision. Actual native Typst render retained under original
      authority.202/queued is incomplete; poll returned job until ready. Preflight/overset/font
      errors are failures, never completed exports.
    executor:
      executorType: api
      apiEndpoint: POST /api/publishing-studio/documents/{input.id}/render
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 36
          maxLength: 36
        revision:
          type: integer
          minimum: 1
          maximum: 100
        requestKey:
          type: string
          minLength: 36
          maxLength: 36
      required:
        - id
        - revision
        - requestKey
    usageInstructions: >-
      Actual native Typst render retained under original authority.202/queued is incomplete; poll
      returned job until ready. Preflight/overset/font errors are failures, never completed exports.
    routingTags:
      - publishing
      - brochure
      - layout
    skills:
      - publishing-editing
    tags:
      - route-backed
  - name: publishing-job-status
    displayName: Read owned publishing render job
    type: api
    category: creative
    description: >-
      Read owned publishing render job. Ready identifies complete outputs pinned to immutable model
      SHA. Failed/cancelled/expired is not a render success.
    executor:
      executorType: api
      apiEndpoint: GET /api/publishing-studio/jobs/{input.id}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 36
          maxLength: 36
      required:
        - id
    usageInstructions: >-
      Ready identifies complete outputs pinned to immutable model SHA. Failed/cancelled/expired is
      not a render success.
    routingTags:
      - publishing
      - brochure
      - layout
    skills:
      - publishing-editing
    tags:
      - route-backed
  - name: publishing-export
    displayName: Export exact publication revision
    type: api
    category: creative
    description: >-
      Export exact publication revision. Hold export approval. layout is native JSON; pdf/preview
      require ready pinned render; preview requires 1-based page, other formats forbid page. Returns
      current-export-guarded contentUrl and full SHA, not raw bytes.
    executor:
      executorType: api
      apiEndpoint: POST /api/publishing-studio/documents/{input.id}/export
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 36
          maxLength: 36
        revision:
          type: integer
          minimum: 1
          maximum: 100
        format:
          type: string
          enum:
            - layout
            - pdf
            - preview
            - mp4
        page:
          type: integer
          minimum: 1
          maximum: 8
      required:
        - id
        - revision
        - format
    usageInstructions: >-
      Hold export approval. layout is native JSON; pdf/preview require ready pinned render; preview
      requires 1-based page, other formats forbid page. Returns current-export-guarded contentUrl
      and full SHA, not raw bytes.
    routingTags:
      - publishing
      - brochure
      - layout
    skills:
      - publishing-editing
    tags:
      - route-backed
  - name: publishing-cancel-render
    displayName: Cancel owned publishing render
    type: api
    category: creative
    description: >-
      Cancel owned publishing render. Cancel only explicitly requested owned job; do not claim ready
      output survives cancellation.
    executor:
      executorType: api
      apiEndpoint: POST /api/publishing-studio/jobs/{input.id}/cancel
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 36
          maxLength: 36
      required:
        - id
    usageInstructions: Cancel only explicitly requested owned job; do not claim ready output survives cancellation.
    routingTags:
      - publishing
      - brochure
      - layout
    skills:
      - publishing-editing
    tags:
      - route-backed
  - name: publishing-delete-document
    displayName: Delete owned publication
    type: api
    category: creative
    description: >-
      Delete owned publication. Only after explicit user request/approval; cannot delete other
      principals or silently reclaim shared image originals.
    executor:
      executorType: api
      apiEndpoint: DELETE /api/publishing-studio/documents/{input.id}
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 36
          maxLength: 36
      required:
        - id
    usageInstructions: >-
      Only after explicit user request/approval; cannot delete other principals or silently reclaim
      shared image originals.
    routingTags:
      - publishing
      - brochure
      - layout
    skills:
      - publishing-editing
    tags:
      - route-backed
  - name: publishing-remove-background
    displayName: Remove image background
    type: api
    category: creative
    description: Extract foreground subject of an owned image into a new transparent PNG while keeping original unchanged.
    executor: { executorType: api, apiEndpoint: "POST /api/publishing-studio/assets/{input.asset}/remove-background" }
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        asset: { type: string, minLength: 1, maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 160 }
        threshold: { type: number, minimum: 8, maximum: 120 }
        requestKey: { type: string, minLength: 36, maxLength: 36 }
      required: [asset, requestKey]
    usageInstructions: Supply owned asset id and fresh UUIDv4 requestKey; original asset stays intact.
    routingTags: [publishing, cutout, image]
    skills: [publishing-editing]
    tags: [route-backed]
  - name: publishing-resize-document
    displayName: Resize publication into new format copy
    type: api
    category: creative
