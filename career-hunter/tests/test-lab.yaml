  - id: native-manual-score
    name: Native score acknowledgement, stopping and result receipts
    purpose: Verify owner-bound kept starts, strict candidate limits, distinct stopping states and durable count-only success receipts without models or real engine children.
    level: integration
    runner:
      kind: node-test
      scope: package
      files: [tests/career-manual-score-native.test.mjs]
    expected:
      - A start is acknowledged only after native retention and honors saved location and remote selectors.
      - Only an exact successful result publishes bounded counts to that owner's private generation.
      - Kernel status outages, missing receipts and unavailable cancellation never become fabricated completion.
      - Stop acknowledgements stay pending until an exact stopped receipt, and final publication remains distinct.
