# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | Register real Career palette proof and every existing suite with explicit harness prerequisites.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Register actual board/search navigation, responsive results, filters, loading and unchanged submission-confirmation boundaries.
# 3 | maintainer@emeraldcoastsystemsgroup.com | Register the ADR-141 D7 story-evidence suite: the master document, the studio preview and the tailored-packet citation contract run in the same existing Python-and-engine harness.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Say that the story-evidence contract now drives the real generate_for. The earlier expectation covered the prompt and the verifier as separate pieces, so a reader could not tell that the packet itself — the thing the done-when names — was unguarded.
# 5 | maintainer@emeraldcoastsystemsgroup.com | Register the Career worker rail (1.24.0): the dependency-free route and two-user isolation suites as a runnable node-test recipe, and the engine half (Python contract with provider tripwires, end-to-end completion through the compiled rail) beside the other Python-engine harnesses.
# 6 | maintainer@emeraldcoastsystemsgroup.com | Worker rail recipe: name its scoped doubles and their open real companions (entry 5's purpose said the isolation suite launched real runner children; its spawn is an in-memory child), and add the queue/deadline expectations: the per-call deadline starts at the slot grant, and the wait for a slot has its own ceiling.
# 7 | maintainer@emeraldcoastsystemsgroup.com | Register the ADR-141 D7 review-conversation suite in the Python-and-engine harness. Until now the only guard on the Strengthen story review was the engine contract, so the surface could stop advancing, or the route could stop reaching the engine, with every suite still green. The new suite drives the shipped card through the compiled routes, the real engine dispatch and runner, the launcher and the engine to "Every role has a story". It names its scoped doubles, including the Postgres pool that answers the Firecrawl brokerage query with no row.
# 8 | maintainer@emeraldcoastsystemsgroup.com | Register the PostgreSQL storage-cutover proofs (1.25.0): the convergence, reverse-sync and drill contracts on disposable PostgreSQL + real SQLite stores, the observation window and status-route suite, and the `cutover-status` PAT smoke that reads the installed route as the signed-in operator. Split the legacy-python story-review expectation (1,052 characters) into four entries: the core catalog validator (scripts/oshal-test-catalog.js) caps an expectation at 500 characters and rejected the whole catalog, so no Career case could register.
# 9 | maintainer@emeraldcoastsystemsgroup.com | storage-cutover: the contracts take the shared PostgreSQL server one at a time and wait (bounded) for the cluster-wide txid horizon, so a transaction in another database delays them instead of failing them. cutover-observation: an unreadable window.json resets the window and the sample exits 2.
# 10 | maintainer@emeraldcoastsystemsgroup.com | The signed rail (1.25.1): worker-rail and worker-rail-engine now describe the per-run grant contract and the mirrored kernel callback rail, worker-rail gains the automation-issuer suite, and kernel-signed-rail registers the framework-coupled suite that activates the real package (catalog, verifier) through the kernel's enforce-mode runtime and mounter and admits the engine child's signed completion while refusing the 1.24.0 caller.
# 11 | maintainer@emeraldcoastsystemsgroup.com | worker-rail gains the route-binding guard (career-catalog-route-bindings): the first 1.25.1 catalog left GET /companies-admin, the page the Companies ribbon item opens, unbound, and oshal-app validate cannot see the routers, so every literal route in src-routes is now matched against the catalog under the kernel's segment rule. kernel-signed-rail adds the companion expectation that runs the kernel's own matcher over the same enumeration and requires the guard's mirror to agree.
# 12 | maintainer@emeraldcoastsystemsgroup.com | Register the ADR-141 D7 live acceptance (1.26.0): test-lab-cleanup drives the two owner-scoped removals through the compiled routes and the real engine on the SQLite store and on disposable FORCE-RLS PostgreSQL, and proves the live script against a loopback api; stories-live-acceptance is the level-live walk itself, run as the operator automation identity after install. worker-rail's binding guard now also pins the two new DELETE bindings.
# 13 | maintainer@emeraldcoastsystemsgroup.com | Register the Test Lab application seam (1.27.0): test-lab-application-seam drives POST /test-lab/applications and DELETE /test-lab/applications/:postingId/:tag through the compiled routes, the caller's real SQLite store and a disposable PostgreSQL database holding the package's own application migrations, plus one approve round trip through the real handler, runner, launcher and engine. worker-rail's binding guard now also pins the two seam bindings. The live half is core's career-rail-live-proof.js --complete (approve -> draft on the Career bot), run by the deploy lane after install.
# 14 | maintainer@emeraldcoastsystemsgroup.com | Register the engine process-tree stop (1.27.1): engine-stop-tree runs the compiled runner and the real launcher with a stand-in engine on Linux and proves a cancel, the runner deadline and the lease-loss fence leave the engine and its child exited within 5 s (read from /proc, since a killed orphan stays a zombie where node is PID 1), the run settled, and an adopted launcher that outlives the runner fences its own engine. The fixture-procfs suite for the launcher's group fence runs beside it.
# 15 | maintainer@emeraldcoastsystemsgroup.com | Register refresh completion status against the compiled routes and real temporary filesystem markers (1.27.2); engine, graph, scoring, logger and route collaborators remain scoped doubles.
# 16 | maintainer@emeraldcoastsystemsgroup.com | Register compiled native root routes and actual SQLite summary counters without fabricated onboarding state.
