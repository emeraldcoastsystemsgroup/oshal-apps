  - id: worker-rail
    name: Career worker rail route and two-user isolation
    purpose: >-
      Drive the compiled worker rail over a loopback listener behind a mirror of the kernel's signed-package-callbacks
      rail (POST only, the real compiled verifier first, the owner refreshed and permission-checked, the handler as that
      owner), and run the compiled runner for two users with its spawn replaced by an in-memory child to prove their
      per-run grants, run ids and brokered keys never cross and the fleet secret reaches no child. Scoped doubles: the
      kernel callback rail, the Express Router and raw body reader, the kernel request-identity module, BotNodeClient
      endpoint lookup, the heartbeat registry, executeBotOrInline (a recorder), and in the isolation spec the runner's
      spawn and user-store leaf. The real kernel boundary is kernel-signed-rail; the remaining real companions
      (BotNodeClient with the Redis heartbeat, a real spawned launcher child, cost settlement with a live receipt) are
      the on-box acceptance in the package BACKLOG.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/career-worker-rail.test.mjs
        - tests/career-worker-rail-isolation.test.mjs
        - tests/career-cron-cursor.test.mjs
        - tests/career-automation-issuer.test.mjs
        - tests/career-catalog-route-bindings.test.mjs
    expected:
      - Every literal route registered in src-routes, under every manifest mount that serves it, matches exactly one authorization.yaml http binding under the kernel's segment rule; an unbound or doubly bound route is named and fails.
      - The Companies page the ribbon opens (GET /companies-admin) is bound to career.administer like its list and seturl data routes; the classic-board wildcard is bound at four depths and unbound one deeper.
      - Unsigned, service-secret, browser, tampered, replayed, foreign-owner, wrong-method, settled-run and issuer-less requests are refused before any bot call.
      - An admitted completion reaches the Career bot exactly once, direct and non-agentic, attributed to the run owner.
      - A missing node or missing/stale heartbeat answers 503 career-worker-unavailable and the run ends failed, never running.
      - The package semaphore bounds concurrency, the deadline answers 504 and an owner's cancel answers 409 and revokes the token.
      - The per-call deadline starts when a call holds a slot, so eight concurrent calls at concurrency 2 with a bot faster than the deadline all answer 200.
      - The wait for a slot has its own ceiling (504 career-worker-queue-timeout) and a queued call whose run is cancelled answers 409; neither reaches the bot.
      - The environment the runner hands each user's engine child holds only its own grant, run id and brokered key, never the fleet secret or a model-provider key; a launch without a verified issuer mints nothing.
      - A failed scoring run leaves the nightly keyword-pass cursor unadvanced; a successful one advances it once; the model passes carry the issuer the opt-in recorded, and an opt-in without one skips them.
      - Saving the automation opt-in records the kernel identity's issuer, never a body field; reading returns it or null for a row saved before 1.25.1.
      - DELETE /stories/test-lab/:tag and DELETE /jobs/:id/packet are each registered once and bound once, to career.change; the catalog has no other new DELETE binding.
      - POST /test-lab/applications and DELETE /test-lab/applications/:postingId/:tag are each registered once, in career-test-lab-applications.ts, and bound once, to career.change.
    prerequisites:
      - runner:node-test
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures:
        - tests/helpers/worker-rail-harness.mjs
        - tests/helpers/career-rail-signer.cjs
        - tests/helpers/request-identity-stub.mjs
      cleanup: Close the loopback listeners and remove the temporary lease store; no provider, database or network call is made.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 256
    installation: never
  - id: worker-rail-engine
    name: Career engine model rail contract
    purpose: >-
      Prove the multi-user engine's only model path is the worker rail, with subprocess and provider SDK tripwires armed,
      that every request it sends is signed with the per-run grant (the fixture recomputes the HMAC over the bytes it
      received) and carries no service secret, and send one production engine completion through the compiled verifier
      and rail to the Career bot double.
    level: integration
    runner:
      kind: external
      scope: package
      files:
        - tests/career-model-rail.test.mjs
    expected:
      - No codex/claude subprocess, Anthropic SDK or OpenAI path is reached; model keys and rail entries leave the environment.
      - Every completion carries the five grant headers with a fresh nonce and a signature the fixture verifies; no service secret, subject or bearer token header is sent.
      - A rail failure raises CareerWorkerUnavailable through the real scorer and every later call refuses without a request.
      - The standalone single-user engine keeps its legacy provider detection.
    prerequisites:
      - runner:node
      - runner:python
      - fixture:complete-career-engine
      - harness:career-python-contracts
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures:
        - tests/helpers/worker-rail-harness.mjs
        - tests/career-model-rail-contract.py
      cleanup: Stop the loopback listeners and remove the temporary engine data directory.
    limits:
      timeoutMs: 180000
      maxMemoryMb: 512
    installation: never
  - id: kernel-signed-rail
    name: Engine rail through the kernel's enforce-mode boundary
    purpose: >-
      Activate the real package through the kernel's manifest reader (which admits the callbackVerifier only because the
      catalog is declared), ADR-149 enforce-mode authorization runtime and route mounter, then act as the engine child:
      a grant minted by the compiled dispatch and runner under the kernel's real request identity, signed as the engine
      signs, and the production Python engine's own signer. Request identity, the principal directory, the Career bot
      rail and node client are named fixture seams; the database is a tripwire the path never reaches.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/career-rail-kernel-boundary.core.test.js
    expected:
      - The package activates in enforce mode with the catalog, the verifier and POST /complete bound to career.execute.
      - A completion signed with a runner-minted grant is admitted, runs as the owner and dispatches one accounted bot call; no database query is made.
      - The exact 1.24.0 caller (fleet secret, asserted subject, bearer token), an unsigned request, a browser session and a GET are refused before package code.
      - A foreign owner, a tampered body, a replay, a settled run, an owner without the member role, a revoked role and a deactivated owner are refused with no handler call.
      - The production Python engine's signed completion is admitted, and refused once its run is settled.
      - Over every literal route in src-routes under every registered mount, the kernel's own resolveOperationPermissions binds each request to exactly one permission set and the bare route-binding guard's mirrored rule returns the same set.
    prerequisites:
      - runner:node-test
      - runner:python
      - fixture:core-checkout
      - harness:core-test-fixtures
    sideEffects: fixture-write
