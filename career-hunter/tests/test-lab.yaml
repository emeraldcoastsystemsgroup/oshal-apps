version: 1
cases:
  - id: keyword-search-relevance
    name: Most relevant orders keyword title matches first without implying résumé fit
    purpose: Verify actual SQLite full-text and bounded fallback search, all filters before pagination, stable title tiers and retained explicit or saved sort choices in the shipped search page.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/career-search-relevance.test.mjs
        - tests/career-native-search.test.mjs
        - tests/career-search-screen.test.mjs
    expected:
      - Every primary keyword must occur in the title for the first tier, with first-seen date and id as stable ties; explicit recent, posted, salary and title orders remain available.
      - Empty keyword searches use newest order, eligibility filters precede pages, and bounded fallback description sampling is disclosed without claiming a complete corpus search.
      - A chosen saved or session sort is retained; only an absent choice defaults to Most relevant, and keyword relevance never claims an AI fit assessment.
    prerequisites:
      - runner:node-test
      - runner:playwright
    sideEffects: synthetic SQLite and browser fixtures only
    isolation:
      mode: disposable
    limits:
      timeoutMs: 180000
    installation: never
  - id: career-accounts
    name: Career Settings shows its actual authorization separately from successful mailbox evidence
    purpose: Exercise the shipped Accounts section with admitted native connection metadata and synthetic dated monitor evidence, without external account actions.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/career-settings-accounts.test.mjs
    expected:
      - Gmail saved authorization never implies a mailbox read succeeded or selects an address; unavailable metadata stays explicit and text labels are safely rendered.
      - Connect opens only the existing native authorization flow after a click; callback signals trigger a fresh persisted read, and no mail check, send or schedule runs automatically.
      - LinkedIn profile sign-in stays distinct from OAuth and optional Social navigation requires an actual role-admitted frame entry; account controls remain44px at phone and desktop sizes.
    prerequisites:
      - runner:node-test
      - runner:playwright
    sideEffects: synthetic browser fixtures only; no live OAuth, mailbox or credential actions
    isolation:
      mode: disposable
    limits:
      timeoutMs: 180000
    installation: never
  - id: native-source-browser
    name: Anonymous native source browser
    purpose: Exercise the shipped browser reader against a disposable loopback employer and validate its Python adapter and database publication semantics.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/browser/career-source-browser-proof.mjs
        - tests/career-native-source-browser.test.mjs
    expected:
      - Pagination reads beyond page two and asynchronous search JSON and embedded single-job JSON-LD retain employer evidence.
      - Each source has a fresh anonymous context; applicant form submissions and mutations remain blocked.
      - The adapter admits only bounded closed metadata, excludes applicant credentials and preserves exact supplied descriptions.
      - Missing runtimes, failed reads and partial enumeration retain old active postings and expose closed source outcomes.
      - A hard helper deadline kills its process group and aborts the ingest namespace without publication.
      - The site is told a current Chrome and this reader by name, never a headless browser.
      - A cookie notice that covers the jobs is accepted and the jobs behind it are read, and an accept button outside a notice or inside a form is never pressed.
      - A human check or a sign-in page with no jobs is a named failure that closes nothing, and a page that answers past a check keeps its jobs.
      - A delayed anonymous browser check can navigate to jobs; Avature next-page controls retain locations and exclude community forms and navigation links.
      - A refusal, a missing page and a browser that cannot start each fail under their own cause.
    prerequisites: [runner:node-test, fixture:store-toolchain, fixture:python-engine]
    sideEffects: fixture-write
    isolation: {mode: disposable, cleanup: "Close the loopback server and browsers; remove temporary SQLite databases. Native namespace proofs run separately in the kernel delivery lane."}
    limits: {timeoutMs: 120000, maxMemoryMb: 1024}
    installation: never
  - id: native-corpus-observations
    name: Native pull state and previous publication
    purpose: Verify the compiled refresh route and displayed operational facts with synthetic native observations, without reading a real corpus or starting work.
    level: integration
    runner:
      kind: node-test
      scope: package
      files: [tests/career-native-refresh-health.test.mjs]
    expected:
      - Normal Career readers receive only safe scheduler fields without a corpus scan or operator API requirement.
      - A running pull stays separate from the last successful publication and its source counts.
      - Missing, failed, disabled and older-kernel observations remain truthful; unknown counts are never zero.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: {mode: disposable, cleanup: "Release synthetic route contexts; no installation or provider is contacted."}
    limits: {timeoutMs: 30000, maxMemoryMb: 128}
    installation: never
  - id: score-run-control-browser
    name: Score and stop controls on a narrow screen
    purpose: Verify the actual Settings page's score/stop events, exact run selection, stopping versus completion and 390-pixel layout using synthetic native responses only.
    level: browser
    runner:
      kind: playwright
      scope: package
      files: [tests/browser/career-score-control-proof.mjs]
    expected:
      - Stop requests carry only the acknowledged run id and do not report cancellation before the stopped receipt.
      - Final publication follows its saved score result, and kernels without cancellation keep Stop hidden.
      - Reload resumes the exact acknowledged task without another start; stale tab ids cannot select a different active run.
      - The narrow page has no horizontal overflow or uncaught script errors.
    prerequisites: [runner:playwright, browser:chromium, fixture:store-toolchain]
    sideEffects: fixture-write
    isolation: {mode: disposable, cleanup: "Close browser contexts and loopback servers; no installation or provider is contacted."}
    limits: {timeoutMs: 60000, maxMemoryMb: 512}
    installation: never
  - id: bounded-master-edit
    name: Bounded master reads and exact edits
    purpose: Verify complete large-profile paging and all-or-none revision-checked edits without changing an installed profile.
    level: integration
    runner:
      kind: node-test
      scope: package
      files: [tests/career-master-sections.test.mjs, tests/career-master-section-routes.test.mjs, tests/career-work-history-engine.test.mjs]
    expected:
      - Every recorded item remains reachable under bounded responses and explicit continuation offsets.
      - Conflicts, wrong text, unsupported credentials and invalid edits preserve the original master.
      - Successful edits preserve anchors, qualifications and group metadata with exact backup and audit.
    prerequisites: [runner:node-test, runner:python]
    sideEffects: fixture-write
    isolation: {mode: disposable, cleanup: "Remove synthetic master profiles, backups and audit files."}
