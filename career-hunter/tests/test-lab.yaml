    name: Stopping a run stops its engine process tree (Linux)
    purpose: >-
      Run the COMPILED runner, which launches the REAL bin/oshal-jobhunter.js for the manual score verb; the launcher
      starts a stand-in engine (JOBHUNTER_PYTHON) that records its pid and its child's, holds the inherited stdout and
      never exits. Cancel the run, let its runner deadline pass, or remove its lease generation, and read each process
      state from /proc. Scoped doubles: the kernel logger and the user-store path leaf. The real engine, the route and
      the installed package are core's career-rail-live-proof.js --complete on the box.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/career-cancel-engine-tree.test.mjs
        - tests/career-process-group.test.mjs
    expected:
      - After an owner cancel the stand-in engine and its child have exited within 5 s and the run is cancelled; another owner's cancel answers not-found.
      - With the launcher frozen, the runner deadline leaves the engine and its child exited and the run failed with reason timeout, and the lease-loss fence leaves them exited and the run failed.
      - An adopted launcher that leads its own process group runs the engine inside that group, fences it at the deadline without killing itself and exits 124.
      - An adopted launcher that does not lead a group keeps the engine in a group of its own, so its fence never reaches its parent.
      - Over a fixture procfs the launcher's group fence refuses unless it leads its group, signals only live members of its own group and re-scans for a member forked mid-fence.
    prerequisites:
      - runner:node-test
      - fixture:linux-procfs
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures:
        - tests/career-cancel-engine-tree.test.mjs
      cleanup: >-
        The suite kills any stand-in process it started that is still running and removes its temporary store.
    limits:
      timeoutMs: 120000
      maxMemoryMb: 256
    installation: never

