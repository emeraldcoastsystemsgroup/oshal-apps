    name: One concierge, one résumé and two cards in turn, on the installed package
    purpose: >-
      After career-hunter 1.62.0 is installed on a test slot, walk the kernel's real concierge and the model the
      installation runs as a test person whose résumé is made up: from My résumé's context ask for a new job with two
      bullets and approve the card; from Work history's ask for a new version of the résumé; ask for two cards from one
      reading and approve both in turn; from My résumé's ask about saved jobs. Graded by the tool trace, the cards and
      the main résumé the routes answer; the main résumé is put back to the revision the walk started on. Run with
      CAREER_LIVE_BASE=http://127.0.0.1:38798 CAREER_LIVE_ENV=<the slot's environment file>
      node career-hunter/tests/career-one-concierge-live-proof.mjs.
    level: live
    runner:
      kind: external
      scope: package
      files:
        - tests/career-one-concierge-live-proof.mjs
    expected:
      - career-concierge answers every turn; a résumé change is one career_resume_patch card and the job and bullets are in the main résumé after Approve.
      - Asked for a new version of the résumé it reads the main résumé, names the new job and My résumé, and never says it cannot see the document.
      - Two cards from one reading both apply, the second on the revision the first left; the last line is PASSED and the résumé is back as it was.
    prerequisites:
      - runner:node
      - credential:test-person
      - install:career-hunter-1.62.0
    sideEffects: external-write
    isolation:
      mode: live
      cleanup: >-
        One Undo puts the test person's main résumé back to the exact revision the walk started on; a walk that cannot
        says RESTORE FAILED and exits 1. It refuses any base that is not a loopback address.
    limits:
      timeoutMs: 900000
      maxMemoryMb: 256
    installation: never
