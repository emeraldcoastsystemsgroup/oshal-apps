    installation: safe-smoke
  - id: cutover-status
    name: Storage-cutover observation status (installed)
    purpose: >-
      Read GET /api/career-hunter/cutover/status on the installed package as the signed-in operator (PAT). Proves the
      route is mounted, operator-gated and serving the observer's archive; read-only, no sample is taken.
    level: integration
    runner:
      kind: smoke
      smoke: cutover-status
    expected:
