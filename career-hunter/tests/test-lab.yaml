    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: storage-cutover
    name: PostgreSQL storage cutover (loader, convergence, reverse sync, drill)
    purpose: >-
      Run the real loader, convergence reporter, reverse projector and engine against synthetic SQLite stores built from
      the engine schema and a disposable PostgreSQL database owned by a LOGIN NOSUPERUSER NOBYPASSRLS role with the
      package migrations (including 106) applied. Nothing is doubled; the live corpus and the deployment database are
      never touched.
    level: integration
    runner:
      kind: external
      scope: package
      files:
        - tests/career-convergence-contract.test.mjs
        - tests/career-reverse-sync.test.mjs
        - tests/career-cutover-drill.test.mjs
    expected:
      - Two loader runs converge (report --require-convergence exit 0) and the second changes zero observable rows.
      - A broken posting, score, application and pre-103 interview exit 2 and are each named; owner B never sees owner A's rows.
      - A committed owner write records one outbox row; rollback, no-op and the operator loader replay record none; owners cannot read or forge the outbox.
      - Killing the projector before the SQLite commit, after it, and before the checkpoint commit each replays to convergence with no duplicate and no lost lifecycle evidence; a full replay from horizon 0 changes nothing.
      - A change committed after a higher change_id is held back and then delivered; unknown tables, schema versions, owners, collisions, missing source ids and SQLite schema drift stop the worker without moving its checkpoint.
      - The drill refuses rollback while a claim is outstanding or the projector lags, then rolls back to SQLite holding every PostgreSQL write; observation samples archive a report and reset on a missing marker or a gap.
      - Contracts sharing one server serialise on its contract lock, and every projector pass that must see new rows first waits (bounded, named on timeout) for the cluster-wide txid horizon to pass them.
    prerequisites:
      - runner:node
      - runner:python
      - fixture:disposable-postgres
      - fixture:career-loader-drivers
      - harness:career-python-contracts
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures:
        - tests/career-convergence-contract.py
        - tests/career-reverse-sync-contract.py
        - tests/career-cutover-drill.py
        - tests/helpers/career_pg.py
        - tests/helpers/career_fixture.py
        - tests/helpers/career-pg-env.mjs
      cleanup: >-
        Each contract drops its disposable database and role and removes its temporary SQLite stores; the loopback ATS
        is shut down.
    limits:
      timeoutMs: 300000
      maxMemoryMb: 1024
    installation: never
  - id: cutover-observation
    name: Seven-day observation window and status route
    purpose: >-
      Drive the real observe_cutover bounds and window functions into an archive and serve it through the COMPILED
      status route over loopback HTTP. Scoped doubles: the Express Router, the OIDC session (header-driven), isOperator
      (a mirror of the kernel's OSHAL_OPERATOR_SUBS branch), the logger, and the unused better-sqlite3/caller-sub
      imports. The real kernel mount and a live sample are covered by the cutover-status smoke and the storage-cutover
      drill.
    level: unit
    runner:
      kind: external
      scope: package
      files:
        - tests/career-cutover-observation.test.mjs
    expected:
      - Anonymous callers get 401 and non-operators 403 before the archive is read.
      - Seven days of in-bounds daily samples complete the window.
      - A sample gap, a failed nightly marker, convergence drift, projector lag or failure, or an isolation leak each reset it.
      - An unreadable or non-object window.json is logged at ERROR, kept aside, and resets the window; that sample exits 2.
      - The route serves the window and the latest sample without the per-owner probe breakdown.
    prerequisites:
      - runner:node
      - runner:python
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: The suite removes its temporary archive directories and closes its loopback listener.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 256
    installation: never
