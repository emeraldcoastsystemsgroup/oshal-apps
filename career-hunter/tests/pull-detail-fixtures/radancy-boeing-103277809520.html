<html><head><title>Mid-Level IT Core Infrastructure Lead at Boeing</title>
<script type="application/ld+json">{"@context":"http://schema.org","@type":"JobPosting","baseSalary":{"@type":"MonetaryAmount","currency":"","value":{"@type":"QuantitativeValue","unitText":""}},"datePosted":"2026-11-14","description":"<p>At Boeing, we innovate and collaborate to make the world a better place. We’re committed to fostering an environment for every teammate that’s welcoming, respectful and inclusive, with great opportunity for professional growth. Find your future with us.</p><br><p style='margin: 0px;'><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>This role is at Spirit AeroSystems, Inc. a wholly owned subsidiary of The Boeing Company, supporting Spirit&rsquo;s Commercial Business Units (&ldquo;Spirit Commercial&rdquo;). Spirit Commercial designs and builds commercial aerostructures, including for Boeing Commercial Airplanes, one of Boeing&rsquo;s three business units and the premier manufacturer of commercial jetliners for decades. Spirit Commercial&rsquo;s core products include fuselages, pylons, nacelles and wing components, with a focus on innovative composite and aluminum manufacturing solutions.</span></p> <p style='margin: 0px;'><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>This is a lead position within the IT Core Infrastructure organization. This position has service ownership and operational responsibilities for the Core Infrastructure covering Network, Data Center, Hosting (both cloud and on-premises), Storage, Servers, and Backup, System and Infrastructure Monitoring and alerting. As an <strong>IT Core Infrastructure Lead</strong>, you will provide technical expertise to support the team across these environments, serve as Service Owner for the operational services delivered by our service provider partners, and act as backup to the Manager when needed. You will ensure available and reliable IT infrastructure services to The Boeing Company locations spanning multiple sites, drive improvements in the infrastructure environments, and collaborate across other IT functional areas and service providers to ensure cohesive solutioning for new stand-ups, migrations, and transitions, as well as resolution of issues.</span></p><p style='margin: 0px;'>&nbsp;</p><p style='margin: 0px;'><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>This role offers the opportunity to build broader breadth and depth across the Core Infrastructure environment, with support from the Manager and team to grow technically and in leadership scope over time.</span></p><p style='margin: 0px;'>&nbsp;</p><p style='margin: 0px;'><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>The preferred candidate for this role will have prior experience and working knowledge across several infrastructure areas such as network, hosting and cloud, storage, servers, backup, and monitoring, along with vendor partnership management, strong team communication skills, the ability to communicate both written and verbally across the organization in a professional manner, analysis skills, and experience developing and communicating technical project proposals, and leading or supporting teams to successful execution and completion.</span></p><p style='margin: 0px;'>&nbsp;</p><p style='margin: 0px;'><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'><strong>Position Responsibilities:</strong></span></p><ul><li><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>Serve as the technical subject matter expert supporting the team across infrastructure environments</span></li><li><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>Act as Service Owner for the operational services delivered by our service provider partner</span></li><li><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>Serve as backup to the Manager when needed</span></li><li><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>Ensure available and reliable IT infrastructure services</span></li><li><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>Collaborate with outsourced service providers and internal stakeholders</span></li><li><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>Partner with outsourced service providers to ensure IT infrastructure services meet standards, meet or exceed SLAs, implement process improvements, resolve escalations, and set priorities as needed</span></li><li><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>Oversee successful upgrades and improvements in the infrastructure environments</span></li><li><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>Collaborate across other IT functional areas, service providers, and Boeing Enterprise to ensure cohesive solutioning for new stand-ups, migrations and transitions, as well as resolutions to issues</span></li><li><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>Ensure representation regarding IT infrastructure related outages or issues</span></li><li><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>Remove roadblocks or escalate, as appropriate, to the Manager</span></li><li><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>Monitor backlog and address for mitigation</span></li><li><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>Work within the established vendor management governance framework.</span></li></ul> <p style='margin: 0px;'><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'><strong>Basic Qualifications (Required Skills/Experience):</strong></span></p><ul><li>Bachelor of Science in a related IT discipline or equivalent work experience</li><li>Working knowledge of infrastructure disciplines (network, storage, servers, hosting/cloud, backup, monitoring)</li><li>6+ years of related experience</li><li>Strong interpersonal and communication skills</li><li>Demonstrated leadership skills, or clear leadership potential</li><li>Self-motivated with a proactive approach to learning new technologies and expanding technical scope</li><li>Must be onsite at the Wichita facility</li><li>Ability to travel periodically or occasionally to other sites.</li></ul><p style='margin: 0px;'><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'><strong>Preferred Qualifications (Desired Skills/Experience):</strong></span></p><ul><li>Cloud: AWS, Azure</li><li>Hardware:</li><li>Software:</li><li>OS: Windows, Unix</li><li>Network: Cisco ISE / TACACS</li><li>Or similar <span style='font-size: 10.0pt; font-family: 'Arial',sans-serif;'>software, hardware, network, platform, and cloud tools.</span></li></ul><p style='margin-bottom: 0in;'><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'><strong>Drug Free Workplace:</strong></span></p><p style='margin-bottom: 0in;'><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>We are a Drug Free Workplace where post offer applicants and employees are subject to testing for marijuana, cocaine, opioids, amphetamines, PCP, and alcohol when criteria are met as outlined in our policies.</span></p><p style='margin-bottom: 0in;'>&nbsp;</p><p style='margin-bottom: 0in;'><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'><strong>Pay &amp; Benefits: </strong></span></p><p style='margin: 0px;'><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>We strive to deliver a Total Rewards package that will attract, engage and retain the top talent.&nbsp; Elements of the Total Rewards package include competitive base pay and variable compensation opportunities.&nbsp;</span></p><p style='margin: 0px;'>&nbsp;</p><p style='margin: 0px;'><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>We also provide eligible employees with an opportunity to enroll in a variety of benefit programs, generally including health insurance, flexible spending accounts, health savings accounts, retirement savings plans, life and disability insurance programs, and a number of programs that provide for both paid and unpaid time away from work.&nbsp;</span></p><p style='margin: 0px;'>&nbsp;</p><p style='margin: 0px;'><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>The specific programs and options available to any given employee may vary depending on eligibility factors such as geographic location, date of hire, and the applicability of collective bargaining agreements.</span></p><p style='margin: 0px;'>&nbsp;</p><p style='margin: 0px;'><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>Pay is based upon candidate experience and qualifications, as well as market and business considerations.&nbsp;</span></p><p style='margin: 0px;'>&nbsp;</p><p style='margin: 0px;'><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'>Summary Pay Range: $88,150 - $135,150&nbsp;</span></p><p style='margin: 0px;'><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'><strong>&nbsp;</strong></span></p><p style='margin: 0px;'><span style='font-family: arial, helvetica, sans-serif; font-size: 10pt;'><strong>Kansas Tax Credit:</strong>&nbsp;Join Spirit AeroSystems&rsquo; Kansas team and you may be eligible for a $5,000 state of Kansas Aviation tax credit for up to five years.&nbsp;<a href='https://nam02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fwww.aircapitaloftheworld.com%2Ftaxcredits&amp;data=05%7C01%7CKelly.Carl%40KornFerry.com%7Cf62095f8d35e4d1c9ce208dac657e52f%7Ce9d2138743f14e06a253f9ed9096dc48%7C0%7C0%7C638040378102646084%7CUnknown%7CTWFpbGZsb3d8eyJWIjoiMC4wLjAwMDAiLCJQIjoiV2luMzIiLCJBTiI6Ik1haWwiLCJXVCI6Mn0%3D%7C3000%7C%7C%7C&amp;sdata=aLVqUe7iQpK84clcPZxyFJN%2FmcsaTS7oV7d0iTciQ%2Fc%3D&amp;reserved=0' t
