<script type="application/ld+json">{"@context": "http://schema.org", "@type": "JobPosting", "datePosted": "2026-11-12T20:09:06", "description": "## Standard Job Description\n\nSpace is a critical domain, connecting our technologies, our security, and our humanity. While others view space as a destination, we see it as a realm of possibilities, where we can do more \u2014 we can innovate, invest, inspire, and integrate our capabilities to transform the future. \n\nAt Lockheed Martin Space, we aim to harness the full potential of space to cultivate innovation, reduce costs, and push the boundaries of what technology can achieve. We\u2019re creating future-ready solutions, focusing on resiliency and urgency through our 21st Century Security\u00ae vision. We\u2019re erasing boundaries and forming partnerships across industries and around the world. We\u2019re advancing spacecraft and the workforce to fuel the next generation. And we\u2019re reimagining how space can connect us, ensuring security and prosperity.\n\nJoin us in shaping a new era in space and find a career that\u0027s built for you!\n\nManages the integration and testing of in-house developed and COTS/GOTS components, elements, subsystems and/or systems. Responsible for coordinating subordinate employee recruitment, selection and training, performance assessment, work assignments, salary, and recognition/disciplinary actions. Oversees the synthesis of customer contractual needs and requirements into system test solutions that acknowledge technical, schedule and cost constraints. Directs the following activities: establishing functional and technical specifications and standards, solving hardware/software interface problems, defining input/output parameters, and ensuring integration of the entire system or subsystem. Manages the development and directs preparation and execution of comprehensive test plans, procedures and schedules for complete systems and/or subsystems. Coordinates subsystem and/or system testing activities with programs and other organizations.\n\nThe Strategic Alignment Team organization is a team responsible for efficient operations.This position for an associate manager of the Tactical Execution group is responsible for identifying, clearing, and managing obstacles in the production process flow, serving as the central communication hub between Production Integrators/Test Engineers and external organizations. Ensures minimal disruption to schedule, quality, and flight hardware timelines through proactive monitoring, prioritization, and rapid resolution of emerging issues.\n\n## Basic Qualifications\n\n  * Engineering Bachelor\u0027s degree or higher (Mechanical, Aerospace, Electrical or Manufacturing preferred) or equivalent experience/combined education\n  * Experience with the assembly and integration of complex aerospace systems or equivalent\n  * Minimum 3 years experience leading a technical workforce\n  * Experience supporting multi-functional teams including manufacturing and/or AIT\u0026L disciplines\n  * Experience reviewing and interpreting engineering drawings and providing technical feedback for manufacturing\n  * Excellent communication skills and demonstrated experience briefing senior leaders and customers\n  * Must be a United States citizen\n\n\n\n## Desired Skills\n\n  * Experience with the Orion program and NASA customer\n  * Experience with CAD/CAM software such as Creo Parametric, Creo View\n  * Demonstrated proficiency establishing and maintaining effective working relationships and working collaboratively across multiple organizations\n  * Experience with lean/six-sigma concepts, green belt certification preferred\n  * Must thrive in an environment of rapid change with the ability to communicate and champion that change to the team\n  * Strong understanding assembly processes and manufacturing operations\n  * Proven experience in production operations, flow management, or technical coordination\n  * Strong background in issue prioritization, root\u2011cause resolution, and cross\u2011functional collaboration\n  * Experience maintaining dashboards or tracking systems for work-in-progress and production blockers\n  * Excellent communication skills for serving as a liaison between internal teams and external organizations\n  * Detail\u2011oriented with the ability to balance schedule, quality, and risk considerations\n  * Ability to translate operational data into actionable improvement plans\n  * Detail-oriented with excellent documentation and communication skills\n\n\n\nPay Information\n\nFull-Time Salary Range: $104900.00 - $194700.00\n\nAt Lockheed Martin, we know mission success starts with taking care of our people. Our Total Rewards program is designed to attract top talent, support your well-being, and help you grow\u2014both professionally and personally.\n\nThe salary range for this position is as listed on the requisition. Please note that the salary information listed is a general guideline only. Lockheed Martin considers factors such as (but not limited to) scope and responsibilities of the position, candidate\u0027s work experience, education/ training, key skills as well as market(work location) and business considerations when extending an offer. \n\nBenefits offered: Medical, Dental, Vision, Flexible work arrangements and schedules (e.g., 4x10), 401(k) match, Paid time off, Holidays, Parental Leave, EAP, Flexible Spending Accounts, Education Assistance, Life Insurance, Short-Term Disability, and Long-Term Disability.\n\n  * Annual short-term and/or long-term incentive compensation programs may be offered depending on the position. Payments under these annual programs are not guaranteed and can vary from year to year and are tied to a range of performance metrics.\n  * For (Washington state applicants only) Non-represented full-time employees: accrue at least 10 hours per month of Paid Time Off (PTO) to be used for incidental absences and other reasons; receive at least 90
