iness, and governance, risk, and compliance (GRC) support across systems at multiple classification levels, including cloud environments and SaaS platforms.<\/p>\n<p>&nbsp;<\/p>\n<p><strong>Location:<\/strong> Washington, DC<\/p>\n<p><strong>Responsibilities<\/strong>&nbsp;<\/p>\n<ul>\n <li>Assess security controls for accuracy and evidence&nbsp;<\/li>\n <li>Review system documentation and accept / reject documents&nbsp;<\/li>\n <li>Emphasis on coordination with System Owner, ISSE, ISSO to fix items that need rework&nbsp;<\/li>\n <li>Emphasis on continuously monitoring systems across ISSM portfolio to focus on quality throughout SAA lifecycle&nbsp;<\/li>\n <li>Oversee and coordinate activities within the Prepare step, ensuring roles, responsibilities, and risk management strategies are clearly defined and maintained&nbsp;<\/li>\n <li>Guide system categorization efforts to ensure all information systems are appropriately classified based on mission/business impact and regulatory requirements&nbsp;<\/li>\n <li>Advise on the selection, tailoring, and documentation of security controls aligned with system categorizations, risk appetite, and compliance requirements&nbsp;<\/li>\n <li>Oversee the implementation of technical, operational, and management controls throughout system and application lifecycles, with a particular focus on quality and completeness of all deliverables&nbsp;<\/li>\n <li>Ensure comprehensive security control assessments are planned, executed, and documented to validate the effectiveness of implemented safeguards&nbsp;&nbsp;<\/li>\n <li>Prepare risk management documentation for system authorization and executive decision-making&nbsp;<\/li>\n <li>Direct ongoing monitoring and continuous assessment activities, collecting metrics to adjust security strategies and ensure sustained compliance&nbsp;<\/li>\n <li>Serve as a principal technical advisor on cybersecurity, bringing subject-matter expertise to risk analysis, incident response, system remediation, and audit support efforts&nbsp;<\/li>\n <li>Foster a culture of security awareness, providing technical guidance and training to both team members and stakeholders&nbsp;<\/li>\n <li>Track, report, and communicate status, risks, and improvement opportunities related to security engineering activities to leadership and stakeholders&nbsp;<\/li>\n <li>Maintain up-to-date knowledge of RMF, NIST guidance, and industry best practices in support of continuous process improvement&nbsp;<\/li>\n<\/ul>\n<p>#FederalCyberISaaS<\/p>\n<h2>Qualifications<\/h2>\n<p><strong>Required Qualifications:&nbsp;<\/strong><\/p>\n<ul>\n <li><p><strong>Top Secret <\/strong>security clearance upon hire. The selected candidate must be eligible to obtain/maintain a TS/SCI clearance and successfully complete a polygraph examination if required by the customer.&nbsp; Must be a U.S. Citizen.<\/p><\/li>\n <li>Minimum <strong>8 years<\/strong> each of: (1) secure design/analysis/test; (2) methods/standards for safeguard implementation; (3) creating/updating security test plans&nbsp;<\/li>\n <li><strong>Must meet applicable DoW 8140.03 qualification requirements for <\/strong><strong> Work Role 612 (Security Control Assessor), Advanced Proficiency<\/strong> level, through<strong> at least one of the following:<\/strong>\n  <ul>\n   <li><strong>Certification:<\/strong>\n    <ul>\n     <li>CCISO - Certified Chief Information Security Officer<\/li>\n     <li>CISA - Certified Information Systems Auditor<\/li>\n     <li>CISM - Certified Information Security Manager<\/li>\n     <li>CISSP - Certified Information Systems Security Professional<\/li>\n     <li>CISSP-ISSEP - Certified Information Systems Security Professional - Information Systems Security Engineering Professional<\/li>\n     <li>CySA+ - CompTIA Cybersecurity Analyst plus<\/li>\n     <li>GSLC - GIAC Security Leadership Certification<\/li>\n     <li>GSNA - GIAC Systems and Network Auditor; &nbsp;<strong><u>OR<\/u><\/strong><\/li>\n    <\/ul><\/li>\
