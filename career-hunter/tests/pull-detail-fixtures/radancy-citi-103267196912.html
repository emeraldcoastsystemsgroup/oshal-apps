pments.</li><li>Mentor junior bankers and contribute to a high-performance culture.</li><li>Exercise sound judgment and disciplined risk management.</li><li>Partner with Banking Industry teams to deliver insights that strengthen client relationships and deliver business growth through increased impact</li></ul><p><b>Qualifications</b></p><ul><li>8&#43; years of Corporate Banking, Investment Banking, or related financial services experience.</li><li>Proven ability to build, manage and grow relationships with large corporate and multinational clients.</li><li>Track record of winning new business, increasing wallet share and delivering multi-product revenue growth.</li><li>Strong knowledge of corporate banking, lending, capital markets, treasury and trade solutions, and risk management products.</li><li>Understanding of the Industrials sector, including industry trends, business models and key client priorities.</li><li>Proven ability to build relationships with senior executives and influence strategic client discussions.</li><li>Strong business development, negotiation, relationship management and credit skills.</li><li>Experience leading cross-functional teams and delivering solutions across multiple product areas.</li><li>Strong analytical, communication and presentation skills.</li><li>Ability to operate effectively in a complex global organization.</li><li>Demonstrated commitment to sound risk management and regulatory compliance.</li><li>Series 63<span style='color:#000000'> and 79</span> licenses preferred.</li></ul><p><b>Education:</b></p><ul><li>Bachelor’s/University degree, Master’s degree preferred</li></ul><p style='text-align:inherit'><span><span><span><span><span><span><span><span><span><span><span><span><span class='WHR0'>------------------------------------------------------</span></span></span></span></span></span></span></span></span></span></span></span></span></p><h2><b>Job Family Group: </b></h2>Institutional Banking<p style='text-align:inherit'><
