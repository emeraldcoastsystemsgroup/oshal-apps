<script type="application/ld+json">{"@context": "http://schema.org", "@type": "JobPosting", "datePosted": "2026-11-12T00:00:00", "description": "RELOCATION ASSISTANCE: Relocation assistance may be available\n\nCLEARANCE REQUIRED FOR START: No\n\nCLEARANCE TYPE: Secret\n\nTRAVEL: Yes, 10% of the Time\n\n## Description\n\nAt Northrop Grumman, our employees have incredible opportunities to work on revolutionary systems that impact people\u0027s lives around the world today, and for generations to come. Our pioneering and inventive spirit has enabled us to be at the forefront of many technological advancements in our nation\u0027s history - from the first flight across the Atlantic Ocean, to stealth bombers, to landing on the moon. We look for people who have bold new ideas, courage and a pioneering spirit to join forces to invent the future, and have fun along the way. Our culture thrives on intellectual curiosity, cognitive diversity and bringing your whole self to work \u2014 and we have an insatiable drive to do what others think is impossible. Our employees are not only part of history, they\u0027re making history.\n\nNorthrop Grumman is in need of a Test Engineer in Energetics Manufacturing \u2013 level 3 or 4 to work at its Elkton, Maryland facility. \n\nNorthrop Grumman Propulsion Systems and Controls (PS\u0026C) facility in Elkton, Maryland began solid-propellant rocket operations in 1948. Today, the Elkton PS\u0026C facility designs, develops, and produces solid-propellant propulsion and ordnance systems in programs professionally managed for a wide variety of Government and commercial customers. The facility also serves as the hub for offsite engineering and test facilities in Ronkonkoma, NY and Palm Beach Gardens, FL.\n\nElkton, Maryland is located on the Upper Chesapeake Bay, midway between Philadelphia and Baltimore. Discover charming small towns, parks with miles of trails, specialty and antique shops, award winning restaurants, and inns. You can hike, bike, camp, bird watch, ride horseback, or drop a fishing line. Five rivers, Chesapeake Bay and the C\u0026D Canal can be explored by boat or by land. Experience panoramic views from Turkey Point Lighthouse on a bluff overlooking the Bay, or from the banks of the C\u0026D Canal where ships from around the globe cruise. https://www.ccgov.org/government/tourism\n\nRole Description:\n\nAs a Test Engineer, develop environmental, structural, dynamic, and static test processes for aerospace components including; rocket motors, rocket motor components, and rocket motor initiation systems using customer specifications, engineering drawings, test plans and other documentation as applicable.\n\n  * The test preparation process includes: review of requirements, development and coordination of safety protocols, design and integration of support equipment, and documenting the test process.\n  * The test engineer is responsible for: selection and integration of test instrumentation and data acquisition systems, development of ordnance initiation process, training test technicians, training and supporting other test engineers, troubleshooting test anomalies, and review of test data.\n  * Test engineers work closely with the Safety and Hazards Analysis departments and support cross functional teams in designing and setting up energetic test processes. \n  * Test engineers must have demonstrated ability to manage complex test projects and be non-compromising with regards to safety even when working under pressure. \n  * Test engineers must be comfortable presenting technical data to internal/external customers, suppliers, and vendors. \n  * Test engineers spend time in test facilities (including at offsite customers) developing solutions to a variety of complex testing challenges. \n\n  \n\n\nLevel to be hired will be determined on demonstrated experience, education, and competency.\n\n  \n\n\nThis position falls under a Federal Explosives License issued by the Bureau of Alcohol, Tobacco, Firearms and Explosives (ATF) for this location. Candidates hired into this role will be required to complete and submit an Employee Possessor Questionnaire to ATF for approval to be a possessor.\n\nBasic qualifications for level 3 (Principal Engineer):\n\n  * Must have a bachelors degree in STEM plus at least 5 years of related experience. Will consider those with a masters degree in STEM plus at least 3 years of experience or those with a PhD in STEM with at least 1 year of experience. Mechanical Engineering or Electrical Engineering degree preferred.\n  * Ability to obtain and maintain a DoD Security Clearance, US citizenship is a prerequisite.\n  * Must be disciplined to follow detailed instructions and comply with procedures.\n  * Excellent written and oral communication skills to create clear and understandable planning for operators.\n  * Experience in a manufacturing or production environment, preferably with complex hardware or process\u2011intensive operations.\n  * Experience with process documentation, work instructions, and/or routings.\n  * Exposure to Lean manufacturing and/or continuous improvement tools and methods.\n  * Ability to collaborate effectively with cross\u2011functional teams (Operations, Quality, EH\u0026S, Facilities, Supply Chain, Finance).\n  * Have a working knowledge of test instrumentation and data systems.\n\n\n\nBasic qualifications for level 4 (Sr. Principal Engineer):\n\n  * Must have a bachelors degree in STEM plus at least 8 years of related experience. Will consider those with a masters degree in STEM plus at least 6 years of experience or those with a PhD in STEM with at least 4 years of experience. Mechanical Engineering or Electrical Engineering degree preferred.\n  * Ability to obtain and maintain a DoD Security Clearance, US citizenship is a prerequisite.\n  * Must be disciplined to follow detailed instructions and comply with procedures\n  * Excellent written and oral communication skills to create clear and understandable planning for operators\n  * Experience in a manufacturing or production environment, preferably with complex hardware or process\u2011intensive operations\n  * Experience with process documentation, work instructions, and/or routings\n  * Exposure to Lean manufacturing and/or continuous improvement tools and methods\n  * Ability to collaborate effectively with cross\u2011functional teams (Operations, Quality, EH\u0026S, Facilities, Supply Chain, Finance)\n  * Have a working knowledge of test instrumentation and data systems\n\n\n\nPreferred Qualifications: \n\n  * Experience in energetics, ordnance, propellants, or other hazardous materials manufacturing environments\n  * Experience with ERP/MRP systems for routings, BOMs, and WIP tracking\n  * Strong interpersonal and communication skills, with the ability to train and support operators and maintenance personnel\n  * Ability to create/modify simple sketches in CAD or related software for planning sketches\n  * Working Knowledge of Dewesoft DAQ software and hardware\n  * Electrical Engineering Knowledge \u2013 Ability to draw a schematic and spec parts\n  * Mechanical engineering Knowledge \u2013 good understanding of pressure and fluids\n  * Experience with FLIR cameras and thermal data\n\n\n  * Strong documentation skills\n  * Active secret or higher clearance\n\n  \n\n\nPrimary Level Salary Range: $108,800.00 - $163,200.00\n\nSecondary Level Salary Range: $135,800.00 - $203,600.00\n\nThe above salary range represents a general guideline; however, Northrop Grumman considers a number of factors when determining base salary offers such as the scope and responsibilities of the position and the candidate\u0027s experience, education, skills and current market conditions.\n\nDepending on the position, employees may be eligible for overtime, shift differential, and a discretionary bonus in addition to base pay. Annual bonuses are designed to reward individual contributions as well as allow employees to share
