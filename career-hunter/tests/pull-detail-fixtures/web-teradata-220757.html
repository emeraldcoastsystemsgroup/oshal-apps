<html><head><title>Staff Global Program Manager at Teradata</title>
<script type="application/ld+json">{"@context":"http://schema.org/","hiringOrganization":{"@type":"Organization","name":"Teradata"},"description":"\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003e\u003cstrong\u003eOur Company:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e \n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003eAt Teradata, we believe that people thrive when empowered with better information. Teradata Autonomous Knowledge Platform activates enterprise intelligence by unifying data, knowledge and business context to achieve tangible outcomes. With Teradata, organizations can provide agents with full context for impact when it matters. Our solution lets businesses connect and scale on premises, in the cloud, or through a hybrid approach. Teradata delivers real business value with AI.\u003c/span\u003e\u003c/p\u003e \n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003e\u003cstrong\u003eWhat the role is about:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e \n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003eIn this role, you will be responsible for leading and planning strategic programs that accelerate Teradata's AI Studio product capabilities from concept through customer delivery. You will orchestrate execution across 10+ cross-functional teams, driving delivery of customer-facing AI features, platform capabilities, and product initiatives at the pace and quality the market demands.\u003c/span\u003e\u003c/p\u003e \n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003eYour day-to-day responsibilities will include leading complex programs, managing interdependencies, and collaborating with senior leadership across Product, Engineering, TPM, Infrastructure, Field/GTM/Sales, and Data Science/AI teams to ensure successful outcomes. A key aspect of this role is navigating ambiguity, driving clarity in loosely defined problem spaces, and ensuring alignment across diverse stakeholders while maintaining strong execution discipline.\u003c/span\u003e\u003c/p\u003e \n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003e\u003cstrong\u003eImpact This Role Has\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e \n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003eThe impact of this role is to deliver faster AI innovation and differentiated value for Teradata's customers through disciplined, end-to-end program execution. The role will drive delivery of AI Studio product initiatives — from feature development through launch — overseeing the full product introduction lifecycle.\u003c/span\u003e\u003c/p\u003e \n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003eAccelerate AI capability delivery through close partnership with Engineering and Product, while improving time-to-market and predictability via strong dependency management and execution rigor. Ensure customer value realization by aligning AI Studio capabilities to measurable business outcomes, strengthening Teradata's position as a leader in enterprise AI and analytics.\u003c/span\u003e\u003c/p\u003e \n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003eOperate as a trusted integrator across teams, driving alignment, accountability, and focus on high-impact outcomes. Role impact is ultimately defined by enabling day-one revenue at launch through strong stakeholder alignment on launch criteria, incorporation of customer feedback, and delivery of high-quality, launch-ready assets across teams.\u003c/span\u003e\u003c/p\u003e \n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003e\u003cstrong\u003eWhat success looks like:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e \n\u003cul\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eShape and execute program strategy by translating AI Studio product goals into measurable customer and business outcomes\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eAdopt and adapt project management processes, practices, and tools to balance agility, speed, risk, and compliance; bring a mindset of iterative and incremental delivery to seek rapid feedback from the field and customers; create an environment of continuous improvement\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eLead complex, multi-workstream programs, managing scope, milestones, risks, and dependencies across 10+ teams spanning Product, Engineering, Data Science, and GTM\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eBuild and maintain integrated program plans across Product, Engineering, TPM, GTM, and AI/ML platform organizations\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eProactively identify and resolve cross-team dependencies and risks, ensuring smooth and predictable execution\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eProvide clear, concise executive-level communications, including status updates, business reviews, and program summaries\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eAct as a central integrator and trusted advisor across internal teams, translating AI Studio strategy into coordinated, executable delivery plans\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eDeliver high-quality launches of customer-facing AI features and platform capabilities\u003c/span\u003e\u003c/li\u003e \n\u003c/ul\u003e \n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003e\u003cstrong\u003eWho will you work with on the team:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e \n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003eThis requires someone adept at integrating efforts and activities across many leadership levels and organizations, including regular engagement with managers and senior leaders from Product Management, AI/ML Engineering, Data Science, Field/Sales Enablement, Technical Enablement, Sales, Marketing, Customer Success, Finance, IT, and more.\u003c/span\u003e\u003c/p\u003e \n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003e\u003cstrong\u003eWho this position reports to:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e \n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003eThis position reports to the Senior Director of AI Studio Delivery within the Product Operations, PMO, and Partnerships organization.\u003c/span\u003e\u003c/p\u003e \n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003e\u003cstrong\u003eQualifications \u0026amp; Core Competencies\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e \n\u003cul\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003e6+ years of experience in program/project management within the technology industry, including global, cross-functional environments\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eProven ability to lead large, complex programs across 10+ teams, driving alignment and execution\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eStrong expertise in dependency management, orchestrating multiple interdependent workstreams with precision\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eDemonstrated experience partnering with Product, Engineering, TPM, Infrastructure, and GTM/Sales organizations\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eAbility to operate effectively in ambiguity, bringing structure, clarity, and direction to evolving problem spaces\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eExcellent executive communication skills (verbal and written), with the ability to translate complex initiatives into business impact\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eStrong collaboration and influencing skills, with the ability to drive outcomes without direct authority\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eDeep understanding and practical application of Agile methodologies to enable iterative, outcome-driven delivery\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eStrategic mindset, connecting program execution to customer value and business outcomes\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eProven ability to act as a trusted integrator and leader, ensuring alignment, accountability, and focus on high-impact priorities\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eBachelor's degree required\u003c/span\u003e\u003c/li\u003e \n\u003c/ul\u003e \n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003e\u003cstrong\u003ePreferred Qualifications:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e \n\u003cul\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eExperience delivering AI, ML, or data platform products in a fast-paced enterprise environment\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eFamiliarity with AI/ML development workflows, data platforms, cloud infrastructure, or analytics ecosystems\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eAgile certifications (Scrum, SAFe) or PMP preferred\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eExperience delivering customer-facing features, platform capabilities, or AI-powered product integrations\u003c/span\u003e\u003c/li\u003e \n \u003cli\u003e\u003cspan style=\"font-size: 12pt;\"\u003eAdvanced degree preferred\u003c/span\u003e\u003c/li\u003e \n\u003c/ul\u003e \n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003e#LI-VB1\u003c/span\u003e\u003c/p\u003e","@type":"JobPosting","title":"Staff Global Program Manager","identifier":"220757","datePosted":"2026-11-14T09:32:06.79Z","jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"VIRTUAL","addressCountry":"India"}}}</script>
