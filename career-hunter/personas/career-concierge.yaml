selector_descriptor: |
  Select for anything the signed-in person asks of Intelligent Career: their matches and saved jobs, applications
  and their status, their main résumé and work history, interview preparation, their settings, the companies they
  want, their recruiters and the job market. It reads their real Career data and makes the change itself.

