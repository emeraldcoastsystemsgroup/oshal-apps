<html lang="en" data-theme="midnight" data-career-surface="journey" data-ds-category="collection" data-ds-first-action="tap"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My jobs</title>
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css"><script src="/shared/ui/js/surface-theme.js"></script><link rel="stylesheet" href="/api/career-hunter/static/career-journey.css"><link rel="stylesheet" href="/api/career-hunter/static/career-kit.css"><style>
.details-needed-label{font-weight:700;color:var(--ds-warn-ink,var(--status-warning,#8a5a00))}
.details-needed{flex-basis:100%;margin:6px 0 0;font-size:13px;line-height:1.45;color:var(--ds-ink-2,var(--text));max-width:70ch}
.details-needed a{white-space:nowrap;font-weight:600}
.posting-source,.posting-reading{margin:8px 0;font-size:13px;line-height:1.45;color:var(--ds-ink-2,var(--muted))}
.posting-missing{margin:4px 0 12px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--ds-warn-ink,var(--status-warning,#8a5a00)) 45%,var(--ds-edge,var(--line)));border-radius:var(--ds-radius-m,10px);background:color-mix(in srgb,var(--ds-warn-ink,var(--status-warning,#8a5a00)) 8%,var(--ds-surface,var(--panel)));max-width:70ch}
.posting-missing p{margin:0 0 8px;line-height:1.5}
.posting-missing b{color:var(--ds-warn-ink,var(--status-warning,#8a5a00))}
.posting-missing-actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0!important}
.posting-missing-actions .btn{display:inline-flex;align-items:center;min-height:44px}
.home-line{margin:0 0 12px;font-size:14px;line-height:20px;color:var(--ds-ink-2,var(--muted))}
.home-line a{font-weight:600;color:var(--ds-accent-ink,var(--accent))}
#jobsHomeLine[hidden]{display:none!important}
@media(pointer:coarse),(max-width:640px){.home-line a{display:inline-flex;align-items:center;min-height:44px}}
@media(pointer:coarse),(max-width:640px){.details-needed a{display:flex;width:fit-content;align-items:center;min-height:44px}}
html,body{overscroll-behavior:contain}
html.in-shell #pageTitle{display:none}
.btn.primary{color:var(--ds-on-accent,var(--text-on-accent,#fff))}
.filters>summary{min-height:44px;display:flex;align-items:center;cursor:pointer}
.filter-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
.filter-fields :is(select,input){width:100%;min-height:44px}
[data-stage-filter][hidden]{display:none!important}
#careerStages{margin:0 0 12px}
:is(#keywordSearch,#filters,#searchModes,#boardPhoneControls)[hidden]{display:none!important}
.reply-line{display:inline-flex;align-items:center;min-height:44px;margin:4px 0 0;padding:0 12px;border:1px solid var(--ds-line-control,var(--line));border-radius:var(--ds-radius-m,10px);background:var(--ds-surface-2,var(--panel));color:var(--ds-ink,var(--text));font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
.reply-line:hover{border-color:var(--accent)}
.fit-link{color:var(--ds-accent-ink,var(--accent));font-weight:600}
.pick-mark{display:block;width:fit-content;margin:0 0 2px;padding:2px 10px;border-radius:var(--ds-radius-m,10px);background:color-mix(in srgb,var(--accent) 14%,var(--ds-surface,var(--panel)));color:var(--ds-accent-ink,var(--accent));font-size:12px;font-weight:700}
.company-sent-badge{display:inline-flex;align-items:center;gap:4px;margin:1px 0 1px 4px;padding:2px 8px;border:1px solid color-mix(in srgb,var(--ds-ok,var(--status-success)) 40%,var(--ds-surface,var(--panel)));border-radius:var(--ds-radius-m,10px);background:color-mix(in srgb,var(--ds-ok,var(--status-success)) 14%,var(--ds-surface,var(--panel)));color:color-mix(in srgb,var(--ds-ok,var(--status-success)) 65%,var(--ds-ink,var(--text)));font-size:12px;font-weight:700;line-height:1.3;vertical-align:middle;white-space:nowrap;max-width:100%}
.app-line{margin:6px 0 0;font-size:14px;line-height:20px;color:var(--ds-ink-2,var(--muted))}
.app-line b{color:var(--ds-ink,var(--text))}
.app-line:is([data-line="failed"],[data-line="answer"]) b{color:var(--ds-bad,var(--status-error))}
#activityLink{display:inline-flex;align-items:center;min-height:44px;margin:0;font-size:14px;color:var(--ds-accent-ink,var(--accent))}
#activityLink[hidden]{display:none}
#actionState{position:sticky;bottom:calc(var(--cf-bottom,0px) + 12px);z-index:5;width:fit-content;max-width:100%;margin:16px auto 0;padding:10px 16px;border:1px solid var(--ds-edge,var(--line));border-radius:var(--ds-radius-m,10px);background:var(--ds-surface,var(--panel));color:var(--ds-ink,var(--text));font-size:14px;font-weight:600;box-shadow:var(--ds-elev-float,0 2px 6px rgb(0 0 0 / .16))}
#actionState:empty{display:none}
#openBoardFilters,#matchesLayoutSwitch{display:none}
.match-deck{display:flex;flex-direction:column;gap:12px}
.match-deck-stage{position:relative;min-height:280px}
.match-card{border:1px solid var(--ds-edge,var(--line));border-radius:var(--ds-radius-xl,20px);background:var(--ds-surface,var(--panel));padding:20px 18px;display:flex;flex-direction:column;gap:12px;touch-action:pan-y;user-select:none;min-width:0}
.match-card.peek{position:absolute;inset:0;transform:scale(.97) translateY(8px);z-index:0;pointer-events:none;overflow:hidden}
.match-card.lead{position:relative;z-index:1;min-height:280px;transition:transform .2s ease;will-change:transform;box-shadow:var(--ds-elev-float,0 2px 6px rgb(0 0 0 / .16))}
.match-card.lead.dragging{transition:none}
.match-card.lead.flung{transition:transform .17s ease-in,opacity .17s ease-in;opacity:0}
.match-card :is(h2,p,div,span,button,b){touch-action:pan-y}
.match-card.lead::before,.match-card.lead::after{position:absolute;top:14px;padding:4px 12px;border-radius:var(--ds-radius-m,10px);font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:0;transition:opacity .1s ease;pointer-events:none;background:var(--ds-surface,var(--panel));z-index:2}
.match-card.lead::before{content:'Save';left:14px;color:var(--ds-ok,var(--status-success));border:2px solid var(--ds-ok,var(--status-success))}
.match-card.lead::after{content:'Pass';right:14px;color:var(--ds-bad,var(--status-error));border:2px solid var(--ds-bad,var(--status-error))}
.match-card.lead[data-swipe="save"]::before,.match-card.lead[data-swipe="pass"]::after{opacity:1}
.match-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.match-card h2{font-size:22px;line-height:28px;margin:0;overflow-wrap:anywhere}
.match-card .job-title{font-size:inherit;line-height:inherit;font-weight:700;min-height:44px;display:inline-flex;align-items:center;text-align:left;font-family:inherit;cursor:pointer}
.match-card .co{font-size:15px;line-height:22px;color:var(--ds-ink-2,var(--muted));margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.match-card .match-fit{flex:none;margin:0;padding:4px 10px;border-radius:var(--ds-radius-m,10px);background:color-mix(in srgb,var(--accent) 12%,var(--ds-surface,var(--panel)));color:var(--ds-ink,var(--text));font-size:13px;line-height:20px;font-weight:600;white-space:nowrap}
.match-card .match-fit b{font-size:17px;color:var(--ds-accent-ink,var(--accent))}
.match-card .meta{font-size:14px;line-height:20px;gap:4px 14px}
.match-card .match-pay{color:var(--ds-ink,var(--text));font-weight:600}
.match-card .why{font-size:15px;line-height:22px;color:var(--ds-ink-2,var(--muted));margin:0;max-height:154px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:7;line-clamp:7}
.match-deck-state.match-card{min-height:220px;align-items:center;justify-content:center;border-style:dashed;user-select:auto}
.match-deck-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#matchActionDock{display:contents}
#deckActionButtons:empty{display:none}
.match-deck-actions{display:grid;grid-template-columns:minmax(64px,auto) minmax(0,1fr) minmax(0,1fr) minmax(64px,auto);gap:8px}
.match-deck-actions :is(.ck-btn,.ck-primary){min-height:48px;padding:0 12px}
.match-deck-actions [data-deck-act="pass"]{color:var(--ds-bad,var(--status-error));border-color:color-mix(in srgb,var(--ds-bad,var(--status-error)) 45%,var(--ds-line-control,var(--line)))}
.match-deck-actions :is(.ck-btn,.ck-primary):disabled{color:var(--ds-ink-disabled,var(--muted));border-color:var(--ds-line-control,var(--line))}
@media(max-width:640px){
  #pageDescription,#filters{display:none}
  #careerStages{flex-wrap:wrap;overflow:visible}
  #boardPhoneControls{display:flex;justify-content:flex-end;margin:0 0 8px}
  #matchActionDock[data-deck-active]{display:flex;flex-direction:column;gap:8px;position:sticky;bottom:calc(var(--cf-bottom,0px) + 8px);z-index:6;padding:8px;border:1px solid var(--ds-edge,var(--line));border-radius:var(--ds-radius-m,10px);background:var(--ds-surface,var(--panel));box-shadow:var(--ds-elev-float,0 2px 6px rgb(0 0 0 / .16))}
  #matchActionDock[data-deck-active] #actionState{position:static;width:100%;margin:0;box-shadow:none}
  #openBoardFilters{display:inline-flex}
  #matchesLayoutSwitch:not([hidden]){display:inline-flex;margin:0 0 10px}
  .search-row{flex-wrap:wrap}
  .search-row input[type="search"]{flex:1 1 100%}
  .search-row :is(button,.ck-btn){flex:1 1 44%}
  dialog .filter-fields{grid-template-columns:1fr}
  .fit-link{display:flex;align-items:center;min-height:44px;width:100%}
}
</style>

<main class="wrap">
<div id="careerStages"></div>

<nav class="journey-nav" aria-label="Career workspace" hidden><a class="btn" data-career-tool="career-search" href="/api/career-hunter/search-ui">Search jobs</a><a class="btn" data-career-tool="career-board" href="/api/career-hunter/board-native">My jobs <span data-stage-count="saved"></span></a><a class="btn" data-career-tool="career-submissions" href="/api/career-hunter/board-native?view=queue">Prepare &amp; submit <span data-stage-count="queued"></span></a><a class="btn" data-career-tool="career-application-status" href="/api/career-hunter/board-native?view=status">Application status <span data-stage-count="tracked"></span></a></nav>
<header><h1 id="pageTitle">My jobs</h1><p class="muted" id="pageDescription"></p></header>
<a id="activityLink" href="/api/career-hunter/submissions" data-career-tool="career-submission-activity" hidden>Follow what is being sent</a>
<div class="actions" id="boardPhoneControls" hidden></div>
<div class="actions" id="searchModes" hidden><a class="btn" data-career-tool="career-search" href="/api/career-hunter/search-ui">All openings</a><span class="btn" aria-current="page">Recommended for you</span><div class="ck-seg" id="matchesLayoutSwitch" role="tablist" aria-label="Matches view" hidden><button type="button" role="tab" data-layout="deck" aria-selected="true">Cards</button><button type="button" role="tab" data-layout="list" aria-selected="false">List</button></div></div>

<label>Results per page<select id="per"><option>25</option><option selected>50</option><option>100</option><option>200</option></select></label>
<label data-stage-filter="match">Minimum AI fit<select id="min_score"><option value="">Any</option><option>70</option><option>80</option><option>90</option></select></label>
<label data-stage-filter="match">Pay basis<select id="pay_period"><option value="year">Annual · USD</option><option value="hour">Hourly · USD</option><option value="month">Monthly · USD</option></select></label>
<label data-stage-filter="match">Pay from<input id="min_pay" type="number" min="0.01" max="10000000" step="0.01" placeholder="Any"></label><label data-stage-filter="match">Pay to<input id="max_pay" type="number" min="0.01" max="10000000" step="0.01" placeholder="Any"></label>
<label>Posted / indexed<select id="days"><option value="">Any time</option><option value="7">7 days</option><option value="14">14 days</option><option value="30">30 days</option></select></label><label>Work arrangement<select id="remote"><option value="">Any</option><option value="1">Fully remote</option><option value="0">On-site / hybrid</option></select></label><label data-stage-filter="near">Within<select id="within"><option value="">Any distance</option><option value="10" data-miles>10 miles</option><option value="25" data-miles>25 miles</option><option value="50" data-miles>50 miles</option><option value="100" data-miles>100 miles</option><option value="remote">Remote only</option></select></label>
<button type="button" class="ck-tertiary" id="clearFilters">Clear filters</button>
</div></details>
<section class="ab-panel rg-panel" id="regenerate" aria-labelledby="regenerateTitle" aria-live="polite" hidden></section><section class="ab-panel" id="applyBatch" aria-labelledby="applyBatchTitle" aria-live="polite" hidden></section><section class="jt-progress" id="bulkProgress" aria-label="Bulk progress" aria-live="polite" hidden></section>
<div class="list-state" id="requestState" role="status" aria-live="polite"></div><div id="list" aria-label="Jobs" data-ds-work></div><div id="jobsTable" class="jt" hidden></div><div class="jt-bulkbar" id="bulkBar" role="region" aria-label="Selected jobs" hidden></div><div id="matchActionDock"><p id="actionState" role="status" aria-live="polite"></p><div class="match-deck-actions" id="deckActionButtons"></div></div><nav class="pager" id="pager" aria-label="Job result pages"></nav>

</main>

</dialog>
