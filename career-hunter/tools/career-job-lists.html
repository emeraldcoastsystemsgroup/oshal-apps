<!doctype html>
<!-- CHANGE LOG:
  1 | maintainer@emeraldcoastsystemsgroup.com | Separate the saved shortlist, preparation index, recommendations and submitted records; open one application through its admitted toolbar destination.
  2 | maintainer@emeraldcoastsystemsgroup.com | UX audit 2026-11-06: the stage control replaces the four-link nav (kept hidden for its counts), the kit is loaded, the pay and fit filters are marked as finding-only, and Clear filters is added; the summary is 44px.
  3 | maintainer@emeraldcoastsystemsgroup.com | UX Design Standard sweep: phone Filters sheet (#boardFilterSheet) with Back dismissal, merged New matches phone swipe deck (Pass, Save, Undo, More + Cards/List toggle), primary ink var(--text-on-accent), overscroll containment, and DS-00..DS-45 contract compliance. -->
<html lang="en" data-theme="midnight" data-career-surface="journey" data-ds-category="collection" data-ds-first-action="tap"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Board</title>
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css"><script src="/shared/ui/js/surface-theme.js"></script><link rel="stylesheet" href="/api/career-hunter/static/career-journey.css"><link rel="stylesheet" href="/api/career-hunter/static/career-kit.css"><style>
html,body{overscroll-behavior:contain}
html.in-shell #pageTitle{display:none}
.btn.primary{color:var(--ds-on-accent,var(--text-on-accent,#fff))}
.filters>summary{min-height:44px;display:flex;align-items:center;cursor:pointer}
.filter-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
.filter-fields :is(select,input){width:100%;min-height:44px}
[data-stage-filter][hidden]{display:none!important}
#careerStages{margin:0 0 12px}
#openBoardFilters,#matchesLayoutSwitch{display:none}
.match-deck{display:flex;flex-direction:column;gap:12px}
.match-deck-stage{position:relative;min-height:340px}
.match-card{border:1px solid var(--ds-edge,var(--line));border-radius:var(--ds-radius-xl,20px);background:var(--ds-surface,var(--panel));padding:18px;display:flex;flex-direction:column;gap:10px;touch-action:pan-y;user-select:none}
.match-card.peek{position:absolute;inset:0;transform:scale(.97) translateY(8px);z-index:0;pointer-events:none}
.match-card.lead{position:relative;z-index:1;transition:transform .2s ease}
.match-card h2{font-size:18px;line-height:24px;margin:0}
.match-card .co{font-size:14px;color:var(--ds-ink-2,var(--muted));margin:0;font-weight:600}
.match-card .why{font-size:14px;line-height:20px;color:var(--ds-ink-2,var(--muted));margin:0;max-height:140px;overflow:auto}
.match-deck-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:640px){
  #pageDescription,#filters{display:none}
  #openBoardFilters{display:inline-flex}
  #matchesLayoutSwitch:not([hidden]){display:inline-flex;margin:0 0 10px}
  .search-row{flex-wrap:wrap}
  .search-row input[type="search"]{flex:1 1 100%}
  .search-row :is(button,.ck-btn){flex:1 1 44%}
  dialog .filter-fields{grid-template-columns:1fr}
}
</style>
<link rel="stylesheet" href="/shared/ui/css/surface-glass.css">
<link rel="stylesheet" href="/api/career-hunter/static/career-theme.css">
</head><body>
<main class="wrap">
<div id="careerStages"></div>
<nav class="journey-nav" aria-label="Career workspace" hidden><a class="btn" data-career-tool="career-search" href="/api/career-hunter/search-ui">Search jobs</a><a class="btn" data-career-tool="career-board" href="/api/career-hunter/board-native">Job Board <span data-stage-count="saved"></span></a><a class="btn" data-career-tool="career-submissions" href="/api/career-hunter/board-native?view=queue">Prepare &amp; submit <span data-stage-count="queued"></span></a><a class="btn" data-career-tool="career-application-status" href="/api/career-hunter/board-native?view=status">Application status <span data-stage-count="tracked"></span></a></nav>
<header><h1 id="pageTitle">Job Board</h1><p class="muted" id="pageDescription"></p></header>
<div class="actions" id="searchModes" hidden><a class="btn" data-career-tool="career-search" href="/api/career-hunter/search-ui">All openings</a><span class="btn" aria-current="page">Recommended for you</span><div class="ck-seg" id="matchesLayoutSwitch" role="tablist" aria-label="Matches view" hidden><button type="button" role="tab" data-layout="deck" aria-selected="true">Cards</button><button type="button" role="tab" data-layout="list" aria-selected="false">List</button></div></div>
<form class="search-row" id="keywordSearch" role="search"><input type="search" id="q" aria-label="Search job titles, companies and descriptions" placeholder="Search title, company or description…"><button class="btn primary" type="submit">Search</button><button type="button" class="ck-btn" id="openBoardFilters" aria-haspopup="dialog">Filters</button></form>
<details class="filters" id="filters"><summary>Sort and filter</summary><div class="filter-fields" id="boardFilterFields">
<label>Sort<select id="sort"><option value="ai">Best AI fit</option><option value="recent">Newest</option><option value="posted">Date posted</option><option value="salary">Salary</option><option value="company">Company</option><option value="generated">Prepared</option><option value="applied">Application date</option></select></label>
<label>Results per page<select id="per"><option>25</option><option selected>50</option><option>100</option><option>200</option></select></label>
<label data-stage-filter="match">Minimum AI fit<select id="min_score"><option value="">Any</option><option>70</option><option>80</option><option>90</option></select></label>
<label data-stage-filter="match">Pay basis<select id="pay_period"><option value="year">Annual · USD</option><option value="hour">Hourly · USD</option><option value="month">Monthly · USD</option></select></label>
<label data-stage-filter="match">Pay from<input id="min_pay" type="number" min="0.01" max="10000000" step="0.01" placeholder="Any"></label><label data-stage-filter="match">Pay to<input id="max_pay" type="number" min="0.01" max="10000000" step="0.01" placeholder="Any"></label>
<label>Posted / indexed<select id="days"><option value="">Any time</option><option value="7">7 days</option><option value="14">14 days</option><option value="30">30 days</option></select></label><label>Work arrangement<select id="remote"><option value="">Any</option><option value="1">Fully remote</option><option value="0">On-site / hybrid</option></select></label>
<button type="button" class="ck-tertiary" id="clearFilters">Clear filters</button>
</div></details>
<div class="list-state" id="requestState" role="status" aria-live="polite"></div><div id="list" aria-label="Jobs" data-ds-work></div><nav class="pager" id="pager" aria-label="Job result pages"></nav>
<details id="earlier" hidden><summary>Earlier preparation records <span id="earlierCount"></span></summary><p class="hint">Previous unsubmitted records are retained separately. Opening one lets you choose whether to continue it.</p><button class="btn" id="showEarlier">Show earlier preparation</button></details>
<p id="actionState" role="status" aria-live="polite"></p></main>
<dialog class="ck-sheet" id="boardFilterSheet" data-ds-sheet data-no-glass aria-labelledby="boardFilterSheetTitle">
  <header><h2 id="boardFilterSheetTitle">Filters</h2><span><button type="button" class="ck-tertiary" id="boardSheetClear">Clear filters</button><button type="button" class="ck-tertiary" id="boardSheetDone">Done</button></span></header>
  <div class="ck-sheet-body" id="boardFilterSheetBody"></div>
</dialog>
<script src="/api/career-hunter/static/career-job-actions.js"></script><script src="/api/career-hunter/static/career-navigation.js"></script><script src="/api/career-hunter/static/career-job-feedback.js"></script><script src="/api/career-hunter/static/career-stages.js"></script><script src="/api/career-hunter/static/career-job-lists.js"></script>
</body></html>
