<!doctype html>
<!--
  CHANGE LOG
  -----------------------------------------------------------------------------
  SEQ | AUTHOR | DESCRIPTION
  -----------------------------------------------------------------------------
  1 | maintainer@emeraldcoastsystemsgroup.com | 1.61.0 (Roger, 2026-11-13: "we are missing the page to put in my expierence"). Work history, under Résumé beside My résumé: one card per job (title, employer, months, bullets) in the order the résumé shows them, Add a job first, Edit opening the card as a form, a job moved or removed, every save and every change the concierge makes shown with Undo. One column on a phone with 44 px controls and 16 px fields; nothing scrolls sideways. Screen logic: career-work-history-page.js; the edits: career-work-history.js.
-->
<html lang="en" data-theme="midnight" data-career-surface="work-history" data-ds-category="collection" data-ds-first-action="tap">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work history</title>
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css">
<script src="/shared/ui/js/surface-theme.js"></script>
<link rel="stylesheet" href="/api/career-hunter/static/career-theme.css">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--ds-page); color: var(--ds-ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wh-wrap { max-width: 880px; margin: 0 auto; padding: 20px 28px 40px; }
  .wh-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .wh-head h1 { margin: 0; font-size: 24px; line-height: 1.25; }
  .wh-head p { margin: 4px 0 0; color: var(--ds-ink-2); max-width: 600px; }
  #whNotice { margin: 12px 0 0; color: var(--ds-ink-2); }
  .wh-jobs { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 12px; }
  .wh-job { background: var(--ds-surface); border: 1px solid var(--ds-edge); border-radius: var(--ds-radius-l); padding: 16px 18px; min-width: 0; }
  .wh-job-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .wh-job h2 { margin: 0; font-size: 18px; line-height: 1.3; overflow-wrap: anywhere; }
  .wh-meta { margin: 2px 0 0; color: var(--ds-ink-2); overflow-wrap: anywhere; }
  .wh-bullets { margin: 10px 0 0; padding-left: 20px; }
  .wh-bullets li { margin: 4px 0; overflow-wrap: anywhere; }
  .wh-editing { border-color: var(--ds-accent); }
  .wh-form h2 { margin-bottom: 8px; }
  .wh-form h3 { margin: 18px 0 6px; font-size: 15px; }
  .wh-label { display: grid; gap: 6px; margin: 12px 0 0; font-weight: 600; font-size: 14px; }
  .wh-form input:not([type=checkbox]), .wh-form select, .wh-form textarea { width: 100%; min-width: 0; min-height: 44px; padding: 10px 12px; border: 1px solid var(--ds-line-control); border-radius: var(--ds-radius-m); background: var(--ds-surface); color: var(--ds-ink); font: inherit; font-weight: 400; }
  .wh-form textarea { resize: vertical; line-height: 1.45; }
  .wh-form :is(input, select, textarea):disabled { color: var(--ds-ink-disabled); background: var(--ds-surface-2); }
  .wh-dates { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .wh-month { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 8px; margin: 0; padding: 0; border: 0; min-width: 0; }
  .wh-month legend { padding: 0 0 6px; font-weight: 600; font-size: 14px; }
  .wh-check { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-top: 6px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .wh-check input { width: 22px; height: 22px; margin: 0; }
  .wh-bullet-list { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 8px; }
  .wh-bullet { display: flex; gap: 6px; align-items: flex-start; }
  .wh-bullet textarea { flex: 1 1 auto; }
  .wh-bullet-tools { display: flex; flex: 0 0 auto; }
  .wh-error { margin: 12px 0 0; padding: 10px 12px; border: 1px solid var(--ds-bad); border-radius: var(--ds-radius-m); }
  .wh-form-foot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .wh-form-foot .wh-remove { margin-left: auto; }
  .wh-empty { margin-top: 18px; }
  #whConfirm { max-width: min(460px, calc(100vw - 32px)); }
  #whConfirm form { display: grid; gap: 16px; }
  #whConfirm footer { display: flex; justify-content: flex-end; gap: 8px; }
  @media (max-width: 720px) {
    .wh-wrap { padding: 14px 16px 24px; }
    .wh-head { flex-direction: column; align-items: stretch; gap: 10px; }
    .wh-head h1 { font-size: 22px; }
    .wh-head .ck-primary { width: 100%; }
    .wh-job { padding: 14px; }
    .wh-dates { grid-template-columns: 1fr; }
    .wh-form :is(input:not([type=checkbox]), select, textarea) { font-size: 16px; }
    .wh-bullet { flex-direction: column; align-items: stretch; }
    .wh-bullet-tools { justify-content: flex-end; }
    .wh-form-foot > button { flex: 1 1 calc(50% - 4px); }
    .wh-form-foot .wh-remove { margin-left: 0; flex-basis: 100%; }
  }
</style>
<link rel="stylesheet" href="/api/career-hunter/static/career-frame.css"><script src="/api/career-hunter/static/career-frame.js"></script></head>
<body>
<main class="wh-wrap" data-ds-work>
  <header class="wh-head">
    <div>
      <h1>Work history</h1>
      <p>The jobs your résumé is built from. My résumé and every application start from them.</p>
    </div>
    <button type="button" id="whAdd" class="ck-primary">Add a job</button>
  </header>
  <p id="whNotice" role="status" aria-live="polite" hidden></p>
  <section id="whEmpty" class="ck-empty wh-empty" hidden>
    <div class="ck-empty-icon" aria-hidden="true">💼</div>
    <p id="whEmptyText"></p>
    <a id="whUpload" class="ck-btn" data-career-tool="career-resume-studio" href="/api/career-hunter/resume-studio" hidden>Open My résumé</a>
  </section>
  <ol id="whJobs" class="wh-jobs" aria-label="Jobs"></ol>
</main>
<dialog id="whConfirm" class="ck-sheet" data-ds-sheet data-no-glass aria-labelledby="whConfirmTitle">
  <form method="dialog">
    <h2 id="whConfirmTitle">Remove this job?</h2>
    <p id="whConfirmText"></p>
    <footer><button value="cancel" class="ck-btn">Cancel</button><button value="remove" class="ck-danger solid">Remove</button></footer>
  </form>
</dialog>
<script src="/api/career-hunter/static/career-navigation.js"></script>
<script src="/api/career-hunter/static/career-resume-office.js"></script>
<script src="/api/career-hunter/static/career-change-bar.js"></script>
<script src="/api/career-hunter/static/career-work-history.js"></script>
<script src="/api/career-hunter/static/career-work-history-page.js"></script>
</body>
</html>
