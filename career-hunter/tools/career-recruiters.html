<!doctype html>
<!--
  CHANGE LOG
  6 | maintainer@emeraldcoastsystemsgroup.com | Give firm and contact links44px targets with long-label wrapping, preserving native destinations and tracker behavior.
  -----------------------------------------------------------------------------
  SEQ | AUTHOR | DESCRIPTION
  -----------------------------------------------------------------------------
  1 | maintainer@emeraldcoastsystemsgroup.com | Follow the shared portal palette and scoped Career branding without changing screen workflows or document paper.
  3 | maintainer@emeraldcoastsystemsgroup.com | UX audit 2026-11-06 (grade F): a failed list showed "All 0 · No recruiters in this view" over 18 saved firms. A list that does not answer 200 now shows "Couldn't load your recruiters" with Retry (role=alert, DS-41) and never the empty state. The add form has labels above its fields with the required mark in the label, and on a phone it is an "Add recruiter" sheet with one primary Add. Status selects are 44px, the row's Delete moved into its ⋯ menu with an in-page confirm (no window.confirm), a search field appears past 10 firms, and the status chips are the kit's segmented control (the selected one is ink, not a second accent button). Guard: tests/career-recruiters-screen.test.mjs.
  4 | maintainer@emeraldcoastsystemsgroup.com | Career opens as its own application: load the page frame (career-frame.js and its stylesheet), which draws Career's top bar and takes the whole window when the page is the top window or the cockpit frames it.
  2 | maintainer@emeraldcoastsystemsgroup.com | Sweep 10: in a fresh conversation the concierge answered "Which recruiter did I just add?" with "not visible in the current view" while the row sat at the end of a long list, beyond what its screen snapshot carries, and nothing on the screen said which row was new (the "Added" toast lasts two seconds). The All view names the latest added recruiter and its bucket above the list (the highest id, so it survives a reload). Guard: tests/recruiters-latest.test.cjs.
  5 | maintainer@emeraldcoastsystemsgroup.com | Judge's report 2026-11-11, change 1: a new person's list opened on eighteen firms they never added, under a form. The engine no longer seeds any (db.py 19), so the page opens on "No recruiters yet" with what the list is for and one filled button, Add a recruiter, which reveals the form (a sheet on a phone, in the page on a computer); a store with no firm in it shows that same empty state instead of "All 0 · No recruiters in this view". "Bucket" reads "Type" in every label (the stored field keeps its name), and the type example is an ordinary one. Guard: tests/career-recruiters-screen.test.mjs.
-->

<!--
  Career Hunter — native Recruiters tracker (Phase 3). Reads/writes per-user
  recruiter_firms via /api/career-hunter/recruiters CRUD. Author: roger.murphy@emeraldcoastsystemsgroup.com
-->
<html lang="en" data-theme="midnight" data-career-surface="recruiters-ui"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Recruiters</title>
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css">
<script src="/shared/ui/js/surface-theme.js"></script>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:1080px; margin:0 auto; padding:20px 22px 60px; }
  h1 { font-size:20px; margin:0 0 4px; } .sub { color:var(--ds-ink-2); font-size:14px; margin:0 0 14px; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:0 0 6px; }
  .toolbar .ck-seg { flex:1 1 320px; margin:0; }
  #search { min-height:44px; padding:8px 12px; border:1px solid var(--ds-line-control); border-radius:var(--ds-radius-m); background:var(--ds-surface); color:var(--ds-ink); font:inherit; font-size:15px; width:min(280px,100%); }
  .addform { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)) auto; gap:12px; align-items:end; margin:10px 0 18px;
    padding:14px; border:1px solid var(--ds-edge); border-radius:var(--ds-radius-l); background:var(--ds-surface); }
  .req { color:var(--ds-bad); }
  .wrap.adding #openAdd, .wrap.adding [data-open-add], .wrap.is-empty > #openAdd { display:none; }
  .addform[hidden] { display:none; }
  .addform .formacts { display:flex; gap:8px; align-items:center; }
  .row { display:flex; align-items:center; gap:12px; background:var(--ds-surface); border:1px solid var(--ds-edge); border-radius:var(--ds-radius-m); padding:10px 14px; margin-bottom:8px; }
  .row .who { min-width:200px; }
  .row .firm { font-weight:600; font-size:15px; min-width:0; } .row .firm a { color:var(--ds-accent-ink); text-decoration:none; }
  .row .bucket { font-size:13px; color:var(--ds-ink-2); }
  .row .contact { font-size:14px; color:var(--ds-ink-2); flex:1; min-width:120px; } .row .contact a { color:var(--ds-accent-ink); }
  .row .firm a,.row .contact a { display:inline-flex; align-items:center; min-width:44px; min-height:44px; max-width:100%; overflow-wrap:anywhere; }
  .row select, .row input.note { min-height:44px; background:var(--ds-surface); color:var(--ds-ink); border:1px solid var(--ds-line-control); border-radius:var(--ds-radius-m); padding:8px 10px; font:inherit; font-size:14px; }
  .row input.note { flex:1; min-width:120px; }
  .row .ck-confirm { flex-basis:100%; }
  .latest { font-size:14px; color:var(--ds-ink-2); margin:0 0 12px; overflow-wrap:anywhere; } .latest b { color:var(--ds-ink); }
  .grp { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ds-ink-2); margin:16px 0 8px; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ds-surface); border:1px solid var(--ds-edge); border-radius:9px; padding:9px 15px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; } .toast.show { opacity:1; } .toast.err { border-color:var(--ds-bad); color:var(--ds-bad); }
  @media (max-width:640px){
    .wrap { padding:14px 12px 48px; }
    #openAdd, [data-open-add] { width:100%; }
    .wrap > .addform { display:none; }
    dialog .addform #cancelAdd { display:none; }
    dialog .addform { display:flex; flex-direction:column; align-items:stretch; border:0; padding:0; margin:0; }
    dialog .addform .formacts, dialog .addform .ck-primary { width:100%; }
    #search { width:100%; }
    .row { flex-direction:column; align-items:stretch; gap:8px; }
    .row .who, .row .contact { min-width:0; width:100%; }
    .row select, .row input.note { width:100%; font-size:16px; }
    .row .rowtail { display:flex; gap:8px; } .row .rowtail select { flex:1; }
  }
  @media (min-width:641px){ .row .rowtail { display:contents; } }
</style>
  <link rel="stylesheet" href="/shared/ui/css/surface-glass.css" />
<link rel="stylesheet" href="/api/career-hunter/static/career-theme.css">
<link rel="stylesheet" href="/api/career-hunter/static/career-frame.css"><script src="/api/career-hunter/static/career-frame.js"></script></head>
<body>
<div class="wrap">
  <h1>Recruiters</h1>
  <p class="sub">The recruiters and firms you are in touch with: where each one stands and what to do next.</p>
  <div class="toolbar">
    <div class="ck-seg" id="tabs" role="toolbar" aria-label="Filter by status"></div>
    <input id="search" type="search" placeholder="Search firms" aria-label="Search firms" hidden>
  </div>
  <button class="ck-primary" id="openAdd" type="button">Add a recruiter</button>
  <form class="addform" id="addForm" autocomplete="off" hidden>
    <label class="ck-field"><span>Firm or recruiter <span class="req" aria-hidden="true">*</span><span class="sr-only"> (required)</span></span><input id="firm" required></label>
    <label class="ck-field"><span>Type</span><input id="bucket" placeholder="e.g. Staffing agency"></label>
    <label class="ck-field"><span>Website</span><input id="website" inputmode="url"></label>
    <label class="ck-field"><span>Contact name</span><input id="contact_name"></label>
    <div class="formacts"><button class="ck-primary" type="submit">Add</button><button class="ck-tertiary" type="button" id="cancelAdd">Cancel</button></div>
  </form>
  <p class="latest" id="latest" hidden></p>
  <div id="list"></div>
</div>
<dialog class="ck-sheet" id="addSheet" aria-labelledby="addSheetTitle">
  <header><h2 id="addSheetTitle">Add a recruiter</h2><button class="ck-icon" type="button" id="closeAdd" aria-label="Close">✕</button></header>
  <div class="ck-sheet-body" id="addSheetBody"></div>
</dialog>
<div class="ck-menu" id="rowMenu" popover role="menu"><button type="button" class="bad" role="menuitem" id="menuDelete">Delete…</button></div>
<div class="toast" id="toast" role="status"></div>
<style>.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}</style>
<script>
const STATUSES=["To contact","Contacted","Replied","Call scheduled","Submitted me","On radar","Dead"];
const $=id=>document.getElementById(id); const listEl=$('list'), tabsEl=$('tabs'), toastEl=$('toast'), wrapEl=document.querySelector('.wrap');
let activeStatus='', rows=[], menuFor=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,err){ toastEl.textContent=m; toastEl.className='toast show'+(err?' err':''); setTimeout(()=>toastEl.className='toast',2200); }

function row(r){
  const opts=STATUSES.map(s=>`<option${r.status===s?' selected':''}>${s}</option>`).join('');
  const site=r.website?`<a href="${esc(r.website)}" target="_blank" rel="noopener">${esc(r.firm)}</a>`:esc(r.firm);
  const contact=r.contact_name?(r.contact_link?`<a href="${esc(r.contact_link)}" target="_blank" rel="noopener">${esc(r.contact_name)}</a>`:esc(r.contact_name)):'';
  return `<div class="row" data-id="${r.id}">
    <div class="who"><div class="firm">${site}</div><div class="bucket">${esc(r.bucket||'')}</div></div>
    <div class="contact">${contact}${r.contact_role?` · ${esc(r.contact_role)}`:''}</div>
    <input class="note" value="${esc(r.next_action||'')}" placeholder="Next action" aria-label="Next action for ${esc(r.firm)}" data-field="next_action">
    <div class="rowtail"><select aria-label="Status of ${esc(r.firm)}" data-field="status">${opts}</select>
    <button class="ck-icon" type="button" aria-haspopup="menu" aria-label="More for ${esc(r.firm)}" data-menu="${r.id}">⋯</button></div>
  </div>`;
}

/** DS-41: a list that does not answer 200 is an error with Retry, never the empty state. */
function showError(){
  tabsEl.innerHTML=''; $('latest').hidden=true; $('search').hidden=true;
  listEl.innerHTML='<div class="ck-alert" role="alert"><h2>Couldn’t load your recruiters</h2><p>Your saved firms are not lost. Try again in a moment.</p><button class="ck-btn" type="button" id="retry">Retry</button></div>';
  $('retry').onclick=load;
}
function showEmpty(){
  activeStatus=''; rows=[]; tabsEl.innerHTML=''; $('search').hidden=true; showLatest([]); wrapEl.classList.add('is-empty');
  listEl.innerHTML='<div class="ck-empty"><div class="ck-empty-icon" aria-hidden="true">👥</div><h2>No recruiters yet</h2><p>When a recruiter or a staffing firm gets in touch, add them here. Career keeps who they are, where things stand and what you plan to do next.</p><button type="button" class="ck-primary" data-open-add>Add a recruiter</button></div>';
}
function render(){
  const q=$('search').value.trim().toLowerCase();
  const shown=q?rows.filter(r=>[r.firm,r.bucket,r.contact_name].some(v=>String(v||'').toLowerCase().includes(q))):rows;
  const groups={}; shown.forEach(r=>{ const b=r.bucket||'Other'; (groups[b]=groups[b]||[]).push(r); });
  listEl.innerHTML=Object.keys(groups).sort().map(b=>`<div class="grp">${esc(b)} (${groups[b].length})</div>`+groups[b].map(row).join('')).join('')
    || `<div class="ck-empty"><h2>No recruiters in this view</h2><p>${q?'Nothing matches that search.':'Choose another status.'}</p></div>`;
}
async function load(){
  listEl.innerHTML='<p class="sub" aria-busy="true">Loading…</p>';
  let data;
  try {
    const u=new URLSearchParams(); if(activeStatus) u.set('status',activeStatus);
    const res=await fetch('/api/career-hunter/recruiters?'+u);
    if(!res.ok) throw new Error('HTTP '+res.status);
    data=await res.json();
  } catch(e){ showError(); return; }
  const { recruiters=[], byStatus=[], empty } = data||{};
  const map=Object.fromEntries(byStatus.map(s=>[s.status,s.n])); const total=byStatus.reduce((a,s)=>a+s.n,0);
  if(empty||total===0){ showEmpty(); return; }
  wrapEl.classList.remove('is-empty');
  const tabs=[{k:'',label:'All',n:total}].concat(STATUSES.filter(s=>map[s]).map(s=>({k:s,label:s,n:map[s]})));
  tabsEl.innerHTML=tabs.map(t=>`<button type="button" class="tab" aria-pressed="${t.k===activeStatus}" data-k="${esc(t.k)}">${esc(t.label)}<span class="n">${t.n}</span></button>`).join('');
  tabsEl.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ activeStatus=b.dataset.k; load(); });
  $('search').hidden=total<=10;
  rows=recruiters; showLatest(recruiters); render();
}
// The latest added recruiter (the highest id), named above the list on the All view, so a person and the concierge
// can tell which row is new after the two-second toast and after a reload.
function showLatest(recruiters){
  const el=$('latest');
  const newest=activeStatus?null:recruiters.reduce((a,r)=>(!a||Number(r.id)>Number(a.id)?r:a),null);
  el.hidden=!newest;
  el.innerHTML=newest?`Latest added: <b>${esc(newest.firm)}</b> · type ${esc(newest.bucket||'Other')} · status ${esc(newest.status||'To contact')}`:'';
}
async function upd(id,field,value){
  try { const r=await fetch('/api/career-hunter/recruiters/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({[field]:value})});
    if(!r.ok) throw new Error('HTTP '+r.status); toast('Saved'); if(field==='status') load();
  } catch(e){ toast('Couldn’t save: '+e.message+'. Try again.',true); }
}
async function addRecruiter(){
  const firm=$('firm').value.trim(); if(!firm){ toast('Enter a firm name',true); $('firm').focus(); return; }
  try { const r=await fetch('/api/career-hunter/recruiters',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({firm,bucket:$('bucket').value.trim(),website:$('website').value.trim(),contact_name:$('contact_name').value.trim()})});
    if(!r.ok) throw new Error('HTTP '+r.status); ['firm','bucket','website','contact_name'].forEach(k=>$(k).value=''); closeAdd(); toast('Added '+firm); load();
  } catch(e){ toast('Couldn’t add: '+e.message+'. Try again.',true); }
}
/** DS-44: Delete confirms in the row, never through window.confirm. */
function askDelete(id){
  const el=listEl.querySelector(`.row[data-id="${id}"]`); if(!el||el.querySelector('.ck-confirm')) return;
  const r=rows.find(x=>String(x.id)===String(id))||{};
  el.insertAdjacentHTML('beforeend',`<div class="ck-confirm" role="alertdialog" aria-label="Delete ${esc(r.firm)}"><span>Delete <b>${esc(r.firm)}</b>? Its notes go too.</span><button type="button" class="ck-danger solid" data-del="${id}">Delete</button><button type="button" class="ck-tertiary" data-cancel>Cancel</button></div>`);
  el.querySelector('[data-cancel]').focus();
}
async function del(id){
  try { const r=await fetch('/api/career-hunter/recruiters/'+id,{method:'DELETE'}); if(!r.ok) throw new Error('HTTP '+r.status); toast('Deleted'); load(); }
  catch(e){ toast('Couldn’t delete: '+e.message+'. Try again.',true); }
}
listEl.addEventListener('change',e=>{ const f=e.target.dataset.field, id=e.target.closest('.row')?.dataset.id; if(f&&id) upd(id,f,e.target.value); });
listEl.addEventListener('click',e=>{
  const m=e.target.closest('[data-menu]'); if(m){ menuFor=m.dataset.menu; const menu=$('rowMenu');
    const rect=m.getBoundingClientRect(); menu.style.top=Math.min(rect.bottom+4,innerHeight-60)+'px'; menu.style.left=Math.max(8,rect.right-200)+'px';
    if(menu.showPopover) menu.showPopover(); else menu.hidden=false; return; }
  const d=e.target.closest('[data-del]'); if(d){ del(d.dataset.del); return; }
  if(e.target.closest('[data-cancel]')) e.target.closest('.ck-confirm').remove();
});
$('menuDelete').onclick=()=>{ const menu=$('rowMenu'); if(menu.hidePopover) menu.hidePopover(); else menu.hidden=true; if(menuFor) askDelete(menuFor); };
$('search').addEventListener('input',render);
$('addForm').addEventListener('submit',e=>{ e.preventDefault(); addRecruiter(); });
const form=$('addForm'), formHome=form.parentNode, formNext=form.nextSibling, sheet=$('addSheet');
const phone=window.matchMedia('(max-width:640px)');
/** Add a recruiter reveals the form: a sheet on a phone, in the page on a computer. The form's Add is then the one filled button. */
function openAdd(){
  form.hidden=false; wrapEl.classList.add('adding');
  if(phone.matches){ $('addSheetBody').append(form); sheet.showModal(); }
  $('firm').focus();
}
function putAway(){ form.hidden=true; wrapEl.classList.remove('adding'); }
function closeAdd(){ if(sheet.open) sheet.close(); else putAway(); }
sheet.addEventListener('close',()=>{ formHome.insertBefore(form,formNext); putAway(); });
sheet.addEventListener('click',e=>{ if(e.target===sheet) closeAdd(); });
$('openAdd').onclick=openAdd; $('closeAdd').onclick=closeAdd; $('cancelAdd').onclick=closeAdd;
listEl.addEventListener('click',e=>{ if(e.target.closest('[data-open-add]')) openAdd(); });
load();
</script>
</body></html>
