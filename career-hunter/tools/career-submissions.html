<!DOCTYPE html>
<!--
  Submissions — the print-queue view of the desktop worker.

  Everything the apply rail does happens on ANOTHER machine, in a browser the operator is not looking
  at. This surface is the window: is the desktop connected and claiming, what is waiting, what is
  being submitted right now. It polls the caller's own application records
  (/api/career-hunter/applications) and the desktop dispatcher's worker answer
  (/api/apply-operator/workers), both served by the native kernel, and folds them into the lanes.

  Exact approved intents can resume an interrupted start here. Employer answers
  require a new packet review. No action creates approval without that review.

  CHANGE LOG
  -----------------------------------------------------------------------------
  6 | maintainer@emeraldcoastsystemsgroup.com | Show interrupted approval/start states and resume the existing approved packet without a fresh intent; keep expired and uncertain outcomes out of automatic recovery.
  SEQ                 | AUTHOR                                      | DESCRIPTION
  -----------------------------------------------------------------------------
  1 | maintainer@emeraldcoastsystemsgroup.com | Merge safe board-feed provenance summaries into completed runs and default missing evidence to unverified.
  2 | maintainer@emeraldcoastsystemsgroup.com | Render exact assigned-worker acknowledgement, callback-pending, no-worker, assist-review, and failed states; animate only confirmed running work.
  3 | maintainer@emeraldcoastsystemsgroup.com | Follow the shared portal palette and scoped Career branding without changing screen workflows or document paper.
  5 | maintainer@emeraldcoastsystemsgroup.com | Isolate activity cards from shared row styles, align the page with Career, and add responsive title/status/action layouts.
  4 | maintainer@emeraldcoastsystemsgroup.com | Native kernel: build the queue from the caller's application records and the native worker answer instead of the old platform's /api/apply-operator/queue, /story and /shot, which the native kernel does not serve (the screen showed "Could not reach the queue"). Narrated runs are not retained natively, so a run says so instead of fetching them.
  7 | maintainer@emeraldcoastsystemsgroup.com | UX audit 2026-11-06 (grade C): the top said "no worker connected" three times ("last seen 722h 39m ago") and the lanes were not buttons. One status row now reads "No computer connected · last seen 30 days ago" with one secondary Connect a computer, and the separate computer picker row is gone; the lanes are one row of 44px filter chips (role=tab with counts) that scroll sideways on a phone; an empty queue is "Nothing sent yet" with one primary Open Job Board; the Submission queue / Application status pill pair is gone (both are Job Board stages). Job Apply's counters fold in here as one row computed from these same records (active, failed or unknown, manually marked, verified in 24 hours and 5 days), and each row names its portal. Guard: tests/career-submission-activity.test.mjs.
  8 | maintainer@emeraldcoastsystemsgroup.com | UX Design Standard sweep: withhold Connect a computer from guest visitors (/api/guest/session + /api/auth/user), contain overscroll, hide redundant framed headers, and align radii/typography to the design standard.
-->
<html lang="en" data-theme="midnight" data-career-surface="submissions" data-ds-category="collection" data-ds-first-action="tap"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Submission activity</title>
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css"/>
<script src="/shared/ui/js/surface-theme.js"></script>
<style>
  * { box-sizing:border-box; }
  html, body { overscroll-behavior:contain; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:18px 20px 60px; }
  h1 { font-size:24px; margin:0 0 4px; line-height:32px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 14px; }
  .career-eyebrow { display:none; }
  html.in-shell .career-intro { display:none; }

  /* Worker status — the headline. A wedged box is the failure this queue actually has, so it gets
     a full-width banner and a plain instruction, never a silently empty list. */
  .worker { display:flex; gap:11px; align-items:flex-start; border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:12px 14px; margin:0 0 14px; }
  .worker .dot { width:10px; height:10px; border-radius:50%; margin-top:6px; flex:none; background:var(--muted); }
  .worker.ok .dot { background:var(--accent2); box-shadow:0 0 0 3px rgba(63,185,80,.15); }
  .worker.warn .dot { background:var(--warn); box-shadow:0 0 0 3px rgba(210,153,34,.15); }
  .worker.off .dot { background:var(--danger); box-shadow:0 0 0 3px rgba(248,81,73,.15); }
  .worker b { font-size:14px; } .worker p { margin:2px 0 0; font-size:14px; color:var(--muted); }
  .worker .host { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:var(--muted); }

  .nodebar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 10px; font-size:14px; color:var(--muted); }
  .nodebar select { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:5px 9px; font-size:14px; }
  .rtarget { color:var(--muted); font-size:12px; }
  .lanes { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px; }
  .lane { border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:7px 13px; cursor:pointer; }
  .lane.active { border-color:var(--accent); }
  .lane .n { font-size:18px; font-weight:600; } .lane .l { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }

  .activity-row { border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:12px 14px; margin:0 0 8px; }
  .activity-row.live { border-color:var(--accent); }
  .rtop { display:flex; gap:10px; align-items:baseline; justify-content:space-between; flex-wrap:wrap; }
  .rtitle { font-weight:600; font-size:15px; margin:0; }
  .rco { color:var(--muted); font-size:12px; }
  .pill { font-size:12px; text-transform:uppercase; letter-spacing:.04em; border:1px solid var(--line); border-radius:20px; padding:2px 10px; color:var(--muted); white-space:nowrap; }
  .pill.queued { color:var(--accent); border-color:var(--accent); }
  .pill.submitting { color:var(--warn); border-color:var(--warn); }
  .pill.applied { color:var(--muted); border-color:var(--line); }
  .pill.needs_you { color:var(--danger); border-color:var(--danger); }
  .pill.failed { color:var(--danger); border-color:var(--danger); }
  .rmeta { color:var(--muted); font-size:12px; margin:5px 0 0; display:flex; gap:12px; flex-wrap:wrap; }
  .rmeta a { color:var(--accent); text-decoration:none; }
  .application-proof { margin:8px 0 0; padding:6px 10px; border:1px solid var(--line); border-radius:10px;
    color:var(--muted); font-size:12px; line-height:1.4; }
  .application-proof b { display:block; color:var(--text); }
  .application-proof.proof-manual { border-color:rgba(74,163,255,.42); }
  .application-proof.proof-worker { border-color:rgba(210,153,34,.48); }
  .application-proof.proof-confirmation { border-color:rgba(63,185,80,.52); }
  .application-proof.proof-unverified { border-color:rgba(248,81,73,.42); }

  /* Live progress bar — the one thing that says "it is moving" during a long submission. */
  .bar { height:4px; border-radius:6px; background:var(--panel2); overflow:hidden; margin:8px 0 0; }
  .bar i { display:block; height:100%; background:var(--warn); width:30%; animation:slide 1.6s ease-in-out infinite; }
  @keyframes slide { 0%{margin-left:-30%} 100%{margin-left:100%} }

  /* The story: one beat per row, screenshots inline. Reads top-to-bottom as what happened. */
  .story { margin:11px 0 0; border-top:1px solid var(--line); padding-top:10px; }
  .beat { display:flex; gap:11px; padding:8px 0; border-bottom:1px dashed var(--line); }
  .beat:last-child { border-bottom:0; }
  .beat .seq { flex:none; width:22px; height:22px; border-radius:50%; border:1px solid var(--line); color:var(--muted); font-size:12px; display:flex; align-items:center; justify-content:center; }
  .beat .body { flex:1; min-width:0; }
  .beat .lab { font-size:14px; font-weight:600; }
  .beat .note { font-size:12px; color:var(--muted); margin:2px 0 0; white-space:pre-wrap; }
  .beat .when { font-size:12px; color:var(--muted); }
  .beat img { display:block; margin:7px 0 0; max-width:100%; border:1px solid var(--line); border-radius:10px; cursor:zoom-in; background:#fff; }
  .empty { color:var(--muted); font-size:14px; padding:16px 0; }

  /* Full-size frame viewer — a form screenshot is unreadable at thumbnail width. */
  .lb { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; padding:24px; z-index:50; cursor:zoom-out; }
  .lb.show { display:flex; } .lb img { max-width:100%; max-height:100%; border-radius:10px; }
  .btn { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:10px; min-height:44px; padding:8px 14px; font-size:14px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; }
  .btn:hover { border-color:var(--accent); }
  /* UX audit 2026-11-06: one status row, chips for lanes, one counters row. */
  .worker { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .worker .grow { flex:1 1 220px; min-width:0; }
  .worker .grow b { display:block; }
  .apply-counters { display:flex; flex-wrap:wrap; gap:8px 18px; margin:4px 0 12px; color:var(--ds-ink-2); font-size:14px; }
  .apply-counters b { color:var(--ds-ink); }
  .career-lanes > button { min-height:44px; }
  .nodebar[hidden] { display:none !important; }
</style>
<link rel="stylesheet" href="/api/career-hunter/static/career-hunter.css"/>
<script src="/api/artifacts/send-to.js" defer></script>
<link rel="stylesheet" href="/api/career-hunter/static/career-theme.css">
<style>
  html[data-career-surface="submissions"] .wrap { width:100%; max-width:1280px; padding:26px 28px 56px; }
  html[data-career-surface="submissions"] .career-intro { align-items:flex-start; margin-bottom:24px; }
  .activity-row { display:block; padding:18px 20px; margin-bottom:12px; }
  .activity-row .rtop { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px 24px; align-items:start; }
  .ridentity { min-width:0; }
  .rtitle { font-size:16px; line-height:1.4; overflow-wrap:anywhere; }
  .rco { margin-top:4px; font-size:14px; }
  .activity-row .rmeta { margin-top:14px; padding-top:12px; border-top:1px solid var(--line); font-size:14px; line-height:1.5; align-items:center; gap:10px 18px; }
  .activity-row .rmeta > span:first-child { flex:1; min-width:180px; }
  .activity-row .rmeta a { padding:4px 0; font-weight:600; }
  .pill { padding:4px 10px; font-size:12px; font-weight:600; letter-spacing:.025em; }
  .pill.needs_you { color:var(--warn); border-color:color-mix(in srgb,var(--warn) 45%,var(--line)); background:color-mix(in srgb,var(--warn) 8%,var(--panel)); }
  .lanes { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:10px; margin:20px 0; }
  .lane { text-align:left; padding:12px 14px; min-width:0; }
  .lane .n { font-size:24px; line-height:1.2; margin-bottom:5px; }
  .lane .l { text-transform:none; letter-spacing:0; font-size:12px; overflow-wrap:anywhere; }
  .lane.active { background:color-mix(in srgb,var(--accent) 8%,var(--panel)); box-shadow:inset 0 0 0 1px var(--accent); }
  .nodebar { margin-bottom:12px; gap:10px 16px; }
  .nodebar label { display:flex; align-items:center; gap:8px; }
  .nodebar select { min-height:44px; }
  .worker { padding:14px 16px; margin-bottom:0; }
  .worker p { font-size:14px; max-width:850px; }
  @media(max-width:900px) { .career-intro { flex-wrap:wrap; gap:16px; } .lanes { grid-template-columns:repeat(4,minmax(0,1fr)); } }
  @media(max-width:600px) {
    html[data-career-surface="submissions"] .wrap { padding:16px 14px 40px; }
    .career-intro .sub { display:none; }
    .career-intro h1 { font-size:24px; } .career-view-nav { flex-wrap:wrap; }
    .lanes { grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .lane { padding:10px; } .activity-row { padding:15px; }
    .activity-row .rtop { grid-template-columns:minmax(0,1fr); gap:10px; }
    .activity-row .pill { justify-self:start; } .rtitle { font-size:15px; }
    .activity-row .rmeta { align-items:flex-start; } .activity-row .rmeta > span:first-child { flex-basis:100%; min-width:0; }
  }
</style>
</head><body>

<div class="wrap">
  <header class="career-intro">
    <div><p class="career-eyebrow">Career / Job search</p><h1>Submission activity</h1>
      <p class="sub">Track queued applications, review requests, and submission records.</p></div>
    <nav hidden aria-hidden="true"><a href="/api/career-hunter/board-native?view=queue">Submission queue</a><a href="/api/career-hunter/board-native?view=status">Application status ↗</a></nav>
  </header>

  <div class="nodebar" hidden>
    <label>Computer <select id="nodeSel"><option value="">default</option></select></label>
    <span class="nodehint" id="nodeHint"></span>
  </div>
  <div class="worker" id="worker"><span class="dot"></span><div><b>Checking your computer…</b></div></div>
  <div class="ck-seg career-lanes" id="lanes" role="tablist" aria-label="Submission lanes"></div>
  <div class="apply-counters" id="applyCounters" aria-label="Submission runs"></div>
  <p id="submissionNotice" role="status" hidden></p>
  <div id="list" data-ds-work><div class="empty">Loading…</div></div>
</div>
<div class="lb" id="lb" onclick="this.classList.remove('show')"><img id="lbimg" alt="Submission screenshot"/></div>

<script src="/api/career-hunter/static/career-job-actions.js"></script>
<script src="/api/career-hunter/static/career-submit.js"></script>
<script>
const $=id=>document.getElementById(id);
// APPLICATION_PROVENANCE_START
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const APPLICATION_PROVENANCE=Object.freeze({
  'manual-mark':{tone:'manual',label:'Marked applied manually',detail:'An operator recorded this status; no automated submission confirmation is claimed.'},
  'worker-reported':{tone:'worker',label:'Worker reported submitted',detail:'A worker reported completion; employer receipt is not confirmed.'},
  'verified-submission':{tone:'confirmation',label:'Confirmation file present',detail:'A retained confirmation artifact exists; this does not prove employer acceptance.'},
  unverified:{tone:'unverified',label:'Historical applied — unverified',detail:'No source and retained confirmation jointly establish this historical status.'},
});
/** Reduce a worker task id to a non-sensitive diagnostic suffix, never the full identifier. */
function applicationTaskReference(value){
  if(typeof value!=='string') return '';
  const raw=value.trim(); if(!raw) return '';
  if(raw.length<=8) return 'Worker task recorded';
  const tail=raw.replace(/[^A-Za-z0-9]/g,'').slice(-6);
  return tail.length===6?`Worker task …${tail}`:'Worker task recorded';
}
/** Resolve the exact allowlisted source; missing and future values deliberately fail closed. */
function applicationProvenance(record){
  const raw=record&&typeof record.application_source==='string'?record.application_source:'';
  let source=Object.prototype.hasOwnProperty.call(APPLICATION_PROVENANCE,raw)?raw:'unverified';
  const hasConfirmation=record&&typeof record.confirmation_path==='string'&&record.confirmation_path.trim();
  if(source==='verified-submission'&&!hasConfirmation) source='unverified';
  const base=APPLICATION_PROVENANCE[source]; let detail=base.detail;
  if(source==='worker-reported'){
    const ref=applicationTaskReference(record.application_task_id); detail=(ref?ref+'. ':'')+detail;
  }
  return {source,tone:base.tone,label:base.label,detail};
}
/** Render only escaped summary text; raw task ids and confirmation paths never enter the DOM. */
function applicationProofHtml(record){
  const summarized=record&&typeof record.tone==='string'&&typeof record.label==='string';
  if(!record||(!summarized&&record.status!=='applied')) return '';
  const proof=summarized?record:applicationProvenance(record);
  return `<div class="application-proof proof-${esc(proof.tone)}"><b>${esc(proof.label)}</b><span>${esc(proof.detail)}</span></div>`;
}
// APPLICATION_PROVENANCE_END
const LANES=[['queued','Queued'],['submitting','Submitting'],['applied','Completed'],['needs_you','Needs you'],['failed','Failed'],['dismissed','Dismissed']];

// NATIVE_QUEUE_START
/** Each application record status, as the lane it belongs in and what it is waiting on. */
const STATUS_LANES=Object.freeze({
  approval_required:['needs_you','Waiting for your approval on the Job Board.'],
  drafting:['queued','Drafting the résumé for this posting.'],
  drafted:['needs_you','Draft ready: review it, then submit it.'],
  applied:['applied',''],
  denied:['dismissed','You declined this one.'],
  dismissed:['dismissed','Dismissed.'],
  error:['failed','The draft failed; queue it again from the Job Board.'],
});
/** The worker banner from the native dispatcher answer (GET /api/apply-operator/workers). */
function workerFromNative(w){
  const workers=Array.isArray(w&&w.workers)?w.workers:[];
  const available=Boolean(w&&w.available);
  const observed=Array.isArray(w&&w.observedBrowserNodes)?w.observedBrowserNodes:[];
  const seen=observed.map(n=>Number(n.lastSeen)).filter(Number.isFinite).sort((a,b)=>b-a)[0];
  const detail=available?'Ready to claim the next submission.'
    :w&&w.reason==='application_submission_dispatcher_not_connected'?'The desktop submission dispatcher is not connected, so nothing is submitted automatically. Submit from the Job Board yourself, or connect a desktop worker.'
    :(w&&w.reason?String(w.reason).replace(/_/g,' '):'No desktop worker answered.');
  return {available,connected:workers.length>0,detail,lastSeenAt:seen?new Date(seen).toISOString():null};
}
/** The lanes, counts and rows from the caller's application records (GET /api/career-hunter/applications). */
function queueFromNative(applications, workers, submissions=[]){
  const nativeItems=(Array.isArray(submissions)?submissions:[]).map(a=>{
    const expired=!Number.isFinite(Date.parse(a.authorizationExpiresAt))||Date.parse(a.authorizationExpiresAt)<=Date.now();
    const queuedDetail=expired?'Approval expired. This approved application cannot be resumed.'
      :!a.nativeTicketId?'Approval saved; finish queueing this application.'
      :!a.nativeWorkId?'Ticket saved; finish starting the approved application.'
      :'Approved and waiting for your browser worker.';
    const lane={queued:'queued',claimed:'submitting',reviewing:'submitting',submitting:'submitting',submitted:'applied',needs_you:'needs_you',failed:'failed',unknown:'needs_you',cancelled:'dismissed'}[a.status]||'needs_you';
    return {ticketId:a.id,submissionId:a.id,postingId:a.postingId,title:a.title,company:a.company,lane,status:a.status,
      executionState:['claimed','reviewing','submitting'].includes(a.status)?'working':'settled',
      executionDetail:a.reason||({queued:queuedDetail,claimed:'Worker claimed this application.',reviewing:'Filling and verifying your approved application.',submitting:'Final action authorized; awaiting employer confirmation.'}[a.status]||a.status),
      canResume:a.status==='queued'&&!a.nativeWorkId&&!expired,
      updatedAt:a.updatedAt,jobUrl:a.url,assignedClientId:a.nativeNodeId,questions:a.questions||[],milestones:a.milestones||[],
      metrics:a.metrics,confirmationFile:a.confirmationFile,application_source:a.status==='submitted'?'worker-reported':null};
  });
  const submittedIds=new Set(nativeItems.map(i=>i.postingId));
  const items=(Array.isArray(applications)?applications:[]).filter(a=>!submittedIds.has(a.posting_id)).map(a=>{
    const [lane,detail]=STATUS_LANES[a.status]||['failed','Unknown state: '+String(a.status||'none')+'.'];
    return {ticketId:a.ticket_id||('posting-'+a.posting_id),postingId:a.posting_id,title:a.title,company:a.company,lane,status:a.status,
      executionState:lane==='queued'?'queued':'settled',executionDetail:detail,updatedAt:a.updated_at,application_source:a.application_source};
  });
  items.push(...nativeItems);
  const counts={}; items.forEach(it=>{ counts[it.lane]=(counts[it.lane]||0)+1; });
  return {worker:workerFromNative(workers),counts,items};
}
// NATIVE_QUEUE_END

let filter='';            // '' = all lanes
let openTicket=null;      // the run whose story is expanded
let stories={};           // ticketId -> beats (kept across polls so an open run doesn't flicker)
let lastSig='';           // change signature, so a poll that changed nothing doesn't re-render
let isGuestVisitor=false; // true when /api/guest/session or /api/auth/user identifies a trial guest
const guestProbe=Promise.all([
  fetch('/api/guest/session',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null),
  fetch('/api/auth/user',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null),
]).then(([g,u])=>{
  isGuestVisitor=Boolean((g&&(g.guest===true||g.active===true))||(u&&(u.guest===true||/^urn:oshal:guest:|^guest[-:]/i.test(String(u.sub||u.principal_id||'')))));
}).catch(()=>{});
const resuming=new Set();
const applicationProofs=new Map(); // postingId -> redacted summary; no task id or path is retained.
let applicationProofReadAt=0;

function rel(ms){
  if(ms==null) return '';
  const s=Math.round(ms/1000);
  if(s<60) return s+'s';
  const m=Math.round(s/60); if(m<60) return m+'m';
  return Math.floor(m/60)+'h '+(m%60)+'m';
}
function ago(iso){ if(!iso) return ''; const d=Date.parse(iso); if(isNaN(d)) return ''; const ms=Date.now()-d, days=Math.floor(ms/86400000); return days>=2?days+' days ago':days===1&&ms>=129600000?'2 days ago':rel(ms)+' ago'; }

function renderWorker(w){
  const el=$('worker');
  const cls = w.available ? 'ok' : (w.connected ? 'warn' : 'off');
  const head = w.available ? 'Computer ready'
             : w.wedged ? 'Your computer stopped taking work'
             : w.connected ? 'Computer unavailable'
             : 'No computer connected';
  const canConnect = !w.available && !isGuestVisitor;
  el.className='worker '+cls;
  el.innerHTML=`<span class="dot"></span><div class="grow">
    <b>${esc(head)}${w.lastSeenAt?` · last seen ${esc(ago(w.lastSeenAt))}`:''}</b>
    ${w.available?'':`<span class="host">${esc(w.hostname||'')}</span>`}
  </div>${canConnect?'<button type="button" class="ck-btn" id="connectComputer">Connect a computer</button>':''}`;
  const connect=$('connectComputer'); if(connect) connect.onclick=()=>CareerSubmit.connectWorker();
}

function renderLanes(counts){
  const total=LANES.reduce((n,[k])=>n+(counts[k]||0),0);
  $('lanes').innerHTML=[['','All',total]].concat(LANES.map(([k,l])=>[k,l,counts[k]||0]))
    .map(([k,l,n])=>`<button type="button" role="tab" class="lane" aria-selected="${k===filter}" data-k="${k}">${esc(l)}<span class="n">${n}</span></button>`).join('');
  $('lanes').querySelectorAll('.lane').forEach(d=>d.onclick=()=>{ filter=d.dataset.k; lastSig=''; poll(); });
}

function beatHtml(t,b){
  // ADR-139 standard tag: an application screenshot is a sendable artifact (the shared
  // component anchors its chip on the frame and adds right-click).
  const shot=b.file?`/api/apply-operator/shot/${encodeURIComponent(t)}/${encodeURIComponent(b.file)}`:'';
  const img=b.file?`<img loading="lazy" src="${shot}" alt="${esc(b.label)}" onclick="zoom(this.src)" data-artifact-source="${shot}" data-artifact-type="image/png" data-artifact-name="${esc(b.label||'screenshot')}.png"/>`:'';
  return `<div class="beat">
    <div class="seq">${b.seq}</div>
    <div class="body">
      <div class="lab">${esc(b.label)} <span class="when">· ${esc(ago(b.at))}</span></div>
      ${b.note?`<div class="note">${esc(b.note)}</div>`:''}
      ${img}
    </div></div>`;
}

function storyHtml(it){
  if(it.submissionId){
    const evidence=it.confirmationFile?`<p><a target="_blank" rel="noopener" href="/api/career-hunter/submission-queue/${encodeURIComponent(it.submissionId)}/confirmation">View retained employer confirmation ↗</a></p>`:'';
    return `<div class="story"><p>${esc(it.executionDetail||'')}</p>${(it.milestones||[]).map(m=>`<p>✓ ${esc(m.replace(/_/g,' '))}</p>`).join('')}${it.metrics?`<p>${esc(it.metrics.actions||0)} actions · ${esc(it.metrics.screenshots||0)} screenshots</p>`:''}${evidence}${it.status==='needs_you'&&it.questions?.length?`<button class="btn" onclick="answerSubmission('${it.submissionId}',${Number(it.postingId)})">Answer employer questions</button>`:''}</div>`;
  }
  const beats=stories[it.ticketId];
  if(beats===undefined) return `<div class="story"><div class="empty">Loading the run…</div></div>`;
  if(!beats.length){
    const message=it.executionState==='no_worker'?'No worker picked this up.'
      :it.executionState==='assigned'?'Assigned to a worker, but it has not claimed the task yet.'
      :it.executionState==='working'?'The worker claimed this task; its first narrated step has not arrived yet.'
      :it.executionState==='callback_pending'?'The worker finished; trusted result settlement is pending.'
      :(it.executionDetail||'This run has no retained narrated steps.');
    return `<div class="story"><div class="empty">${esc(message)}</div></div>`;
  }
  return `<div class="story">${beats.map(b=>beatHtml(it.ticketId,b)).join('')}</div>`;
}

/** Job Apply's counters, folded in: computed from these same records (the native submission truth). */
function renderCounters(all){
  const el=$('applyCounters'); if(!el) return;
  const now=Date.now(), within=(it,h)=>{const t=Date.parse(it.updatedAt);return Number.isFinite(t)&&now-t<=h*3600000;};
  const verified=all.filter(it=>it.lane==='applied'&&it.confirmationFile);
  const c={active:all.filter(it=>['queued','submitting'].includes(it.lane)).length,
    review:all.filter(it=>it.lane==='failed'||it.status==='unknown').length,
    manual:all.filter(it=>it.application_source==='manual-mark').length,
    day:verified.filter(it=>within(it,24)).length,five:verified.filter(it=>within(it,120)).length};
  el.hidden=!all.length;
  el.innerHTML=`<span><b>${c.active}</b> active</span><span><b>${c.review}</b> failed or unknown</span><span><b>${c.manual}</b> marked manually</span><span><b>${c.day}</b> verified in 24 h</span><span><b>${c.five}</b> verified in 5 days</span>`;
}
function portalOf(url){ try{ return new URL(url).hostname.replace(/^www\./,''); }catch(_){ return ''; } }
function rowHtml(it){
  const live=it.executionState==='working';
  const open=openTicket===it.ticketId;
  const n=stories[it.ticketId]?stories[it.ticketId].length:0;
  const proof=it.lane==='applied'
    ? (applicationProofs.get(Number(it.postingId))||applicationProvenance(it)) : null;
  return `<div class="activity-row${live?' live':''}">
    <div class="rtop">
      <div class="ridentity">
        <p class="rtitle">${esc(it.title||'Application')}</p>
        ${it.company||it.jobUrl?`<div class="rco">${esc([it.company,portalOf(it.jobUrl)].filter(Boolean).join(' · '))}</div>`:''}
      </div>
      <span class="pill ${it.lane}">${esc((LANES.find(l=>l[0]===it.lane)||[,it.status])[1]||it.status)}</span>
    </div>
    <div class="rmeta">
      ${live&&it.inFlightMs!=null?`<span>running ${esc(rel(it.inFlightMs))}</span>`:`<span>${esc(it.executionDetail||ago(it.updatedAt))}</span>`}
      ${it.assignedClientId?`<span class="rtarget">assigned to ${esc(it.assignedHostname||it.assignedClientId.slice(0,12))}</span>`
        :it.targetClientId?`<span class="rtarget">target ${esc(it.targetHostname||it.targetClientId.slice(0,12))}</span>`:''}
      ${it.jobUrl?`<a href="${esc(it.jobUrl)}" target="_blank" rel="noopener">posting ↗</a>`:''}
      <a href="#" onclick="toggle('${it.ticketId}');return false">${open?'Hide activity ▲':(n?`View activity (${n} steps) ▾`:'View activity ▾')}</a>
      ${it.canResume?`<button class="btn" onclick="resumeSubmission('${it.submissionId}')" ${resuming.has(it.submissionId)?'disabled':''}>${resuming.has(it.submissionId)?'Resuming…':'Resume approved submission'}</button>`:''}
    </div>
    ${proof?applicationProofHtml(proof):''}
    ${live?'<div class="bar"><i></i></div>':''}
    ${open?storyHtml(it):''}
  </div>`;
}

async function answerSubmission(id,postingId){
  try{await CareerSubmit.answerAndReview(id,postingId);lastSig='';await poll();}
  catch(error){window.alert(error.message);}
}

async function resumeSubmission(id){
  if(resuming.has(id))return;resuming.add(id);
  const notice=$('submissionNotice');notice.hidden=false;notice.setAttribute('role','status');
  notice.textContent='Resuming the same approved application…';
  try{
    lastSig='';await poll();
    const item=await CareerSubmit.resumeApproved(id);
    notice.textContent=item.status==='queued'?'Approved application queued for your browser worker.'
      :item.status==='submitted'?'This application is already recorded as submitted.'
      :item.status==='unknown'?'The employer outcome is uncertain. Check the employer before any further attempt.'
      :['claimed','reviewing','submitting'].includes(item.status)?'This application is already in progress.'
      :'Application status: '+item.status.replace(/_/g,' ')+'.';
  }catch(error){notice.setAttribute('role','alert');notice.textContent=error.message;}
  finally{resuming.delete(id);lastSig='';await poll();}
}

function zoom(src){ $('lbimg').src=src; $('lb').classList.add('show'); }

/** Narrated runs are not retained by the native kernel; a run shows its record's state instead. */
async function loadStory(t){ stories[t]=[]; }

async function toggle(t){
  if(openTicket===t){ openTicket=null; lastSig=''; return poll(); }
  openTicket=t;
  if(stories[t]===undefined){ lastSig=''; poll(); await loadStory(t); }
  lastSig=''; poll();
}

function selectedNode(){ const s=$('nodeSel'); return s ? s.value : ''; }

// Populate the computer picker from the live leaf-node list. Selecting one scopes the worker banner
// to THAT machine's reachability (via ?clientId), so you can check any node you might target.
async function loadWorkers(){
  const sel=$('nodeSel'), hint=$('nodeHint'); if(!sel) return;
  try {
    const { workers=[], defaultClientId } = await CareerSubmit.workers();
    sel.disabled=true;
    const keep=sel.value;
    const label=w=>`${w.hostname||w.clientId.slice(0,12)}${w.isDefault?' (default)':''}${w.available?'':' — '+w.state}`;
    sel.innerHTML='<option value="">default'+(defaultClientId?'':' — none connected')+'</option>'
      + workers.map(w=>`<option value="${esc(w.clientId)}">${esc(label(w))}</option>`).join('');
    sel.value = workers.some(w=>w.clientId===keep) ? keep : '';
    if(hint) hint.textContent = workers.length ? `${workers.length} leaf node${workers.length===1?'':'s'} available` : 'Connect a dedicated browser worker to submit your approved packets.';
  } catch(e){ if(hint) hint.textContent=''; }
}

/** Refresh bounded applied-job evidence and retain only the already-redacted UI summary. */
async function refreshApplicationProofs(){
  const now=Date.now(); if(now-applicationProofReadAt<30000) return;
  applicationProofReadAt=now;
  try{
    const r=await fetch('/api/career-hunter/jobs?status=applied&sort=applied&per=150&lane=all');
    if(!r.ok) return;
    const {jobs=[]}=await r.json(); const next=new Map();
    jobs.forEach(j=>next.set(Number(j.id),applicationProvenance(j)));
    applicationProofs.clear(); next.forEach((value,key)=>applicationProofs.set(key,value));
  }catch(e){ /* Queue rows remain explicitly unverified when the evidence feed is unavailable. */ }
}

let pollBusy=false;
async function poll(){
  if(pollBusy)return;pollBusy=true;
  try{
  let q;
  const node=selectedNode();
  const proofLoad=refreshApplicationProofs();
  try {
    const submissions=await CareerSubmit.synchronize();
    const [apps,workers]=await Promise.all([
      fetch('/api/career-hunter/applications').then(r=>{ if(!r.ok) throw new Error('applications HTTP '+r.status); return r.json(); }),
      CareerSubmit.workers().catch(()=>null),
    ]);
    q=queueFromNative(apps&&apps.applications,workers,submissions);
  }
  catch(e){ $('list').innerHTML='<div class="empty">Could not read your applications: '+esc(e.message)+'</div>'; return; }
  if(!q||!q.worker) return;
  await Promise.all([proofLoad, guestProbe]);

  renderWorker(q.worker);
  renderLanes(q.counts||{});

  const items=(q.items||[]).filter(it=>!filter||it.lane===filter);

  // Only a worker-confirmed live submission re-pulls beats each cycle.
  if(openTicket){
    const it=(q.items||[]).find(i=>i.ticketId===openTicket);
    if(it&&it.executionState==='working') await loadStory(openTicket);
  }

  // Only repaint on real change: repainting every 5s would fight the user's scroll and reload images.
  const sig=JSON.stringify([filter,openTicket,isGuestVisitor,q.worker.available,q.worker.detail,q.counts,
    items.map(i=>[i.ticketId,i.lane,i.executionState,i.executionDetail,i.assignedClientId,
      i.updatedAt,Math.round((i.inFlightMs||0)/5000),
      applicationProofs.get(Number(i.postingId))?.source||'unverified']),
    openTicket?(stories[openTicket]||[]).length:0]);
  if(sig===lastSig) return;
  lastSig=sig;

  renderCounters(q.items||[]);
  $('list').innerHTML = items.length ? items.map(rowHtml).join('')
    : filter ? '<div class="empty">Nothing in this lane.</div>'
    : '<div class="ck-empty"><div class="ck-empty-icon" aria-hidden="true">📨</div><h2>Nothing sent yet</h2><p>Prepare a job on the Job Board, review it, then choose Review and submit.</p><a class="ck-primary" id="openBoard" data-career-tool="career-board" href="/api/career-hunter/board-native">Open Job Board</a></div>';
  const ob=$('openBoard'); if(ob) ob.onclick=e=>{ if(window.parent===window) return; e.preventDefault(); CareerJobActions.navigate('career-board', ob.href); };
  }finally{pollBusy=false;}
}

const nsel=$('nodeSel');
if(nsel) nsel.addEventListener('change', ()=>{ lastSig=''; poll(); });
loadWorkers();
poll();
setInterval(()=>{ if(!document.hidden){loadWorkers();poll();} }, 15000);
</script>
