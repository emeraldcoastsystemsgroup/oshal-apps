<!doctype html>
<!--
  CHANGE LOG
  10 | maintainer@emeraldcoastsystemsgroup.com | Answer the same owned native gate through current application authority rather than requiring broad platform administration.
  -----------------------------------------------------------------------------
  SEQ | AUTHOR | DESCRIPTION
  -----------------------------------------------------------------------------
  1 | maintainer@emeraldcoastsystemsgroup.com | Follow the shared portal palette and scoped Career branding without changing screen workflows or document paper.
  2 | maintainer@emeraldcoastsystemsgroup.com | Show retained per-source attempts, complete pulls, failures, HTTP 304 checks and posting delta counts; unavailable history stays explicit.
  3 | maintainer@emeraldcoastsystemsgroup.com | Show the latest nightly source review above the table: what was repaired, what needs a person, what the pull did and what is still broken.
  4 | maintainer@emeraldcoastsystemsgroup.com | UX audit 2026-11-06 (grade C): a 450px nightly review and pull telemetry sat between the search box and the table, so a matching row landed under the orb. Two views in this page: Companies (search, chips, then the table at once, with Company, Jobs, Platform and Latest pull sortable, your pending source changes under it, and the explanation under Help) and Source health (the nightly source review and the failed/partial line; the page is administrators only already). The in-page Job Board and Cockpit links are gone (the shell has Apps); chips, buttons, the search field and the attention checkbox are 44px. Guard: tests/career-companies-views.test.mjs.
  5 | maintainer@emeraldcoastsystemsgroup.com | Add, Remove and Put back. "Add employer" opens a name and link form; each row has Remove, which asks once before it saves; a Removed chip lists removed employers with Put back. Each is saved for the next nightly pull and reported under Source changes. Removed employers are left out of every other chip and count. Needs attention no longer counts a board an administrator set by hand, or a read that has jobs but could not prove the end of its list. The reader's new causes (refused, sign-in, browser unavailable) are said in words. Guard: tests/browser/career-companies-add-remove-proof.mjs.
  6 | maintainer@emeraldcoastsystemsgroup.com | Career opens as its own application: load the page frame (career-frame.js and its stylesheet), which draws Career's top bar and takes the whole window when the page is the top window or the cockpit frames it.
  7 | maintainer@emeraldcoastsystemsgroup.com | Source maintenance in the Source health view, above the nightly review. "Needs you" lists each source Career could not connect, with what was tried, and Archive (the existing Remove) or Keep trying; a press is saved for the next nightly pull and the line says so. "For a developer" lists each open repair brief with Copy brief and Download. "New sources found" lists the employers connected to a job site last night and the suggestions, which take the existing Accept. Employer and board text is escaped. Guard: tests/browser/career-source-maintenance-page-proof.mjs.
  9 | maintainer@emeraldcoastsystemsgroup.com | Answer the same original-owner native decision ticket through explicit human confirmation and show queued/applied outcomes only after authoritative reconciliation.
  8 | maintainer@emeraldcoastsystemsgroup.com | "Suggested, not connected" lists every open suggestion the engine keeps, with the date it was found, in place of last night's only: a suggestion left the page after one night while the runbook does not return to an employer for weeks. A search that was stopped says it did not finish, and the count of employers reads right for one.
-->

<style>
  /* Every alias DERIVES from a framework token carried by surface-themes.css above. The old
     --surface-* names never existed in the framework, so each alias always fell back to its
     hardcoded dark hex and the surface ignored the operator's theme entirely. */
  :root {
    --bg: var(--bg-primary); --panel: var(--bg-card);
    --line: var(--border-color); --text: var(--text-primary);
    --muted: var(--text-muted); --accent: var(--accent-primary);
    --warn: var(--status-warning); --bad: var(--status-error);
    /* Ink for text sitting ON the accent fill — the page background contrasts with the accent in
       every theme, because each theme pairs a bright accent with a dark page (or the inverse). */
    --on-accent: var(--bg-primary);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px 20px 8px; }
  .head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .top-nav { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
  .top-nav a { color: var(--accent); text-decoration: none; font-weight: 600; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
  .top-nav a:hover { border-color: var(--accent); }
  h1 { margin: 0 0 2px; font-size: 18px; font-weight: 650; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .bar { display: flex; gap: 10px; align-items: center; padding: 10px 20px; flex-wrap: wrap; }
  input[type=search], input.url {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 7px 10px; font: inherit; }
  input[type=search] { width: 280px; max-width: 100%; }
  input.url { width: 100%; }
  .filters { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  button.flt {
    background: var(--panel); color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  button.flt:hover { border-color: var(--accent); color: var(--text); }
  button.flt.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  label.chk { color: var(--muted); font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .pager { display: inline-flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  .count { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  button.pg {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  button.pg:hover:not(:disabled) { border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { position: sticky; top: 0; background: var(--bg); color: var(--muted); font-weight: 600; font-size: 12px; z-index: 1; }
  td.name { font-weight: 600; white-space: nowrap; }
  td.jobs { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.none { color: var(--bad); border-color: var(--bad); }
  .urlcell { display: flex; gap: 8px; min-width: 380px; }
  button { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 8px; padding: 7px 12px;
           font: inherit; font-weight: 650; cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .55; cursor: default; }
  .msg { font-size: 12px; margin-top: 3px; }
  .msg.ok { color: var(--accent); } .msg.err { color: var(--bad); }
  .empty { padding: 40px 20px; color: var(--muted); }
  .wrap { max-height: calc(100vh - 140px); overflow: auto; }
  .review { margin: 0 12px 14px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .review h2 { margin: 0 0 2px; font-size: 14px; font-weight: 650; }
  .review-stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 10px 0; }
  .review-stats div { display: flex; flex-direction: column; }
  .review-stats strong { font-size: 18px; font-variant-numeric: tabular-nums; }
  .review details { margin-top: 6px; }
  .review summary { cursor: pointer; font-weight: 600; font-size: 12.5px; }
  .review ul { margin: 6px 0 0; padding-inline-start: 18px; font-size: 12.5px; overflow-wrap: anywhere; }
  @media (max-width: 640px) {
    header, .bar { padding-left: 12px; padding-right: 12px; }
    input[type=search] { width: 100%; }
    .pager { margin-left: 0; width: 100%; justify-content: space-between; }
  }

<script>
const $ = (s) => document.querySelector(s);
const PAGE_SIZE = 100;
let ALL = [];
let statusFilter = 'all';
let page = 1;

/** Removed employers are out of every pull, so they appear only under the Removed chip. */
function isRemoved(c) { return c.discover_status === 'removed'; }
/** A board an administrator set by hand (`manual`) is a choice, not a fault; a read that found jobs but could not prove the
 *  end of its list (`partial`) is still reading, and the Unconfirmed pulls chip lists it. */
function needsAttention(c) { return !isRemoved(c) && (!c.ats_type || (c.active_jobs || 0) === 0
  || (c.discover_status && !['found', 'manual'].includes(c.discover_status))
  || ['failed', 'empty_unconfirmed'].includes(c.pull_health?.status)); }
function unconfirmedPull(c) { return !isRemoved(c) && ['failed', 'partial', 'empty_unconfirmed', 'running'].includes(c.pull_health?.status); }

let sourceChangeMode = 'now';
let CHANGES = [];
const PULL_REASONS = { fetch_failed: 'The source could not be read.', http_refused: 'The source refused a request.', pagination_incomplete: 'Not every page was received.', completion_unverified: 'This connector has no complete-feed proof yet.', empty_unconfirmed: 'An empty response does not prove every job closed.', invalid_feed_rows: 'The source returned invalid or duplicate job records.', page_limit_reached: 'The source has more jobs than could be read.', browser_navigation_failed: 'The page could not be opened.', browser_read_failed: 'The page could not be read.', challenge_detected: 'The site asked for a human check.', login_required: 'The page asked for a sign-in.', browser_refused: 'The site refused the reader.', browser_runtime_unavailable: 'The page reader could not start on this installation.', pull_interrupted: 'The pull stopped three times while reading this source, so it was skipped that night.' };

/** One expandable list; nothing at all when it is empty, so the card stays short on a quiet night. */
function reviewList(title, items, line, hint, actions) {
  const shown = Array.isArray(items) ? items.filter(Boolean) : [];
  if (!shown.length) return '';
  return '<details><summary>' + esc(title) + ' (' + shown.length + ')</summary>'
    + (hint ? '<p class="sub">' + esc(hint) + '</p>' : '')
    + '<ul>' + shown.map(item => '<li>' + esc(line(item)) + (actions ? actions(item) : '') + '</li>').join('') + '</ul></details>';
}

/** One press per board the review named, only where a saved change reaches the next pull. */
function acceptButtons(item) {
  if (sourceChangeMode !== 'next-pull' || !item.id) return '';
  if (latestChange(item.id)?.state === 'waiting') return ' <span class="sub">Saved. Waiting for the next pull.</span>';
  return (item.options || []).map(board => ' <button type="button" class="pg accept" data-company="' + esc(item.id)
    + '" data-board="' + esc(board) + '">Accept ' + esc(board) + '</button>').join('');
}

/** The newest change for one company, if any. */
function latestChange(companyId) {
  return CHANGES.find(change => change && change.companyId === companyId);
}

/** What became of a change, in words. Employer and board text is escaped by whoever shows this. */
function changeText(change) {
  const d = change.detail || {};
  const n = (value) => Number(value || 0).toLocaleString();
  const adding = String(change.target || '').startsWith('add:');
  switch (change.state) {
    case 'waiting': return 'Waiting for the next nightly pull.';
    case 'started': return 'The last pull did not finish applying this.';
    case 'applied': return 'Applied: now reading ' + d.board + ', ' + n(d.jobs) + ' jobs, ' + n(d.new) + ' new, ' + n(d.closed) + ' closed.';
    case 'added': return 'Added: now reading ' + d.board + ', ' + n(d.jobs) + ' jobs, ' + n(d.new) + ' new.';
    case 'removed': return 'Removed: ' + n(d.closed) + ' open jobs closed. The pull no longer reads it.';
    case 'restored': return 'Put back: the pull reads it again.';
    case 'removed_employer': return 'Not applied: this employer is removed. Put it back first.';
    case 'kept': return 'Kept: Career keeps trying this source' + (day(d.until) ? ' and does not ask about it again before ' + day(d.until) + '.' : '.');
    case 'no_decision': return 'Not applied: no decision was waiting for this source.';
    case 'saved_no_jobs': return adding
      ? 'Added, but no jobs could be read from that link yet. Paste the job search link into its row and press Resolve.'
      : 'The link was saved, but no jobs could be read from it, so the source did not change.';
    case 'no_jobs': return 'Not applied: that board returned no jobs.';
    case 'duplicate': return d.board
      ? (adding ? 'Added, but ' + d.owner + ' already uses ' + d.board + ', so it reads nothing yet.' : 'Not applied: ' + d.owner + ' already uses ' + d.board + '.')
      : 'Not added: ' + d.owner + ' is already listed.';
    case 'unknown_company': return 'Not applied: that company is no longer listed.';
    case 'bad_target': return adding ? 'Not added: the name or the link could not be used.' : 'Not applied: that is not a job board link.';
    case 'unsafe': return 'Not applied: that link leads to a private address.';
    case 'timeout': return 'Not applied: reading it took more than 5 minutes.';
    case 'interrupted': return 'Not applied: the pull stopped 3 times while applying it. Press Resolve to try again.';
    default: return 'Not applied: the pull could not read it.';
  }
}

function renderSourceChanges() {
  const card = $('#sourceChanges');
  const shown = CHANGES.filter(Boolean).slice(0, 20);
  card.hidden = !shown.length;
  if (!shown.length) return;
  card.innerHTML = '<h2 id="sourceChangesTitle">Source changes</h2><ul>'
    + shown.map(change => '<li>' + esc(changeName(change)) + ': ' + esc(changeWhat(change)) + '. ' + esc(changeText(change)) + undoButton(change) + '</li>').join('')
    + '</ul>';
}

/** An added employer has no row until the pull makes it, so its name comes from what was sent. */
function addedParts(change) {
  const m = /^add:([^|]*)\|(.*)$/.exec(String(change.target || ''));
  if (!m) return null;
  try { return { name: decodeURIComponent(m[1]), link: decodeURIComponent(m[2]) }; } catch { return null; }
}
function changeName(change) {
  return ALL.find(c => c.id === change.companyId)?.name || change.detail?.name || addedParts(change)?.name || ('Company ' + change.companyId);
}
function changeWhat(change) {
  const target = String(change.target || '');
  if (target === 'remove:employer') return 'Remove';
  if (target === 'restore:employer') return 'Put back';
  if (target === 'keep:employer') return 'Keep trying';
  if (/^decision:[1-9][0-9]*:[^:]+:(archive|keep)$/.test(target)) return target.endsWith(':keep') ? 'Keep trying' : 'Archive';
  const added = addedParts(change);
  return added ? 'Add with ' + added.link : target;
}

/** A wrong press closes the jobs the new board does not list, so going back takes one press too. */
function undoButton(change) {
  const before = change.detail?.from;
  if (change.state !== 'applied' || sourceChangeMode !== 'next-pull' || !before || /:$/.test(before)) return '';
  if (latestChange(change.companyId) !== change) return '';
  return ' <button type="button" class="pg undo" data-company="' + esc(change.companyId) + '" data-board="' + esc(before) + '">Undo: back to ' + esc(before) + '</button>';
}

async function undoChange(button) {
  button.disabled = true;
  let error = 'Could not be saved.';
  try {
    const d = await sendChange(Number(button.dataset.company), 'board', button.dataset.board);
    if (d.ok && d.queued) { render(); return; }
    error = d.error || error;
  } catch (e) { error = 'Request failed: ' + e; }
  button.disabled = false;
  button.insertAdjacentHTML('afterend', ' <span class="sub">' + esc(error) + '</span>');
}

/** Ask for a change; the answer says whether it applied now or waits for the next pull. */
async function sendChange(companyId, field, value) {
  const r = await fetch('/api/career-hunter/companies-admin/seturl?companyId=' + encodeURIComponent(companyId)
    + '&' + field + '=' + encodeURIComponent(value), { method: 'POST' });
  const d = await r.json();
  if (d.ok && d.queued && d.request) {
    CHANGES.unshift(d.request);
    renderSourceChanges();
  }
  return d;
}

async function acceptSuggestion(button) {
  const line = button.parentElement;
  button.disabled = true;
  const company = Number(button.dataset.company);
  let error = 'Could not be saved.';
  try {
    const d = await sendChange(company, 'board', button.dataset.board);
    if (d.ok && d.queued) {
      line.querySelectorAll('button.accept').forEach(b => b.remove());
      line.insertAdjacentHTML('beforeend', ' <span class="sub">Saved. Waiting for the next pull.</span>');
      render();
      return;
    }
    error = d.error || error;
  } catch (e) { error = 'Request failed: ' + e; }
  button.disabled = false;
  line.insertAdjacentHTML('beforeend', ' <span class="sub">' + esc(error) + '</span>');
}

function renderSourceReview(r) {

    + '<div class="review-stats">' + stat('Repaired', outcomes.repaired) + stat('Suggested', outcomes.suggested)

    + stat('No feed', r.sources.noFeed) + '</div>'
    + '<p class="sub">Verified whole: ' + n(r.sources.whole) + esc(was) + '. Partly verified: ' + n(r.sources.unverified) + '.</p>'
    + '<p class="sub">Last pull read ' + n(r.delta.read) + ' jobs: ' + n(r.delta.new) + ' new, ' + n(r.delta.changed) + ' changed, '

    + reviewList('Suggested, not applied', r.review.suggested, i => i.company + ': ' + (i.options || []).join(', ') + (i.jobs == null ? '' : ', ' + n(i.jobs) + ' jobs') + ', ' + i.reason,
      sourceChangeMode === 'next-pull'

/** A stored time as a date in the reader's own format, or nothing when it is not a time. */
function day(value) {
  return value && Number.isFinite(Date.parse(value)) ? new Date(value).toLocaleDateString() : '';
}

const REVIEW_WORDS = { nothing: 'nothing was found', blocked: 'the site refused the check', timeout: 'the check ran out of time', error: 'the check failed' };
let BRIEFS = new Map();
let BRIEF_LINKS = [];
let DECISIONS = [], CURRENT_ACTIONS = [], DECISION_ERROR = null;

/** What was tried for one source, in two short sentences. Employer and board text is escaped by whoever shows this. */
function triedText(e) {
  const n = (value) => Number(value || 0).toLocaleString();
  const reviews = Array.isArray(e.reviews) ? e.reviews : [];
  let failed = 0;
  while (failed < reviews.length && Object.hasOwn(REVIEW_WORDS, String(reviews[failed]?.outcome))) failed++;
  const tried = [e.board, e.link, e.homepage].filter(Boolean);
  const first = (tried.length ? 'Tried ' + tried.join(' and ') + '. ' : 'It has no board or link to try. ')
    + (failed ? 'The nightly review checked ' + n(failed) + ' times in a row without connecting it, last on ' + day(reviews[0].at) + ': ' + REVIEW_WORDS[reviews[0].outcome] + '.' : '');
  const second = (e.failuresInARow ? 'The pull has not read it ' + n(e.failuresInARow) + ' times in a row. ' + (PULL_REASONS[e.lastErrorCode] ? PULL_REASONS[e.lastErrorCode] + ' ' : '') : '')
    + (day(e.lastJobsReadAt) ? 'Jobs were last read on ' + day(e.lastJobsReadAt) + '. ' : 'No jobs have been read from it. ')
    + n(e.openJobs) + ' open jobs are still stored.';
  return [first, second];
}

/** This exact current action's original-owner native binding; no company-name matching. */
function boundDecision(action) {
  return DECISIONS.find(item => item.actionId === action.id && item.companyId === action.companyId && item.openedAt === action.openedAt);
}

function decisionButtons(action) {
  if (sourceChangeMode !== 'next-pull') return '';
  const item = boundDecision(action), status = item?.state;
  if (status === 'queued_next_pull') return '<div class="sub saved">Queued for the next nightly pull. '
    + (item.outcome === 'keep' ? 'Keep trying' : 'Archive') + ' has not been applied yet.</div>';
  if (status === 'applied') return '<div class="sub saved">The nightly pull applied '
    + (item.outcome === 'keep' ? 'Keep trying.' : 'Archive.') + '</div>';
  const ref = ' data-company="' + esc(action.companyId) + '" data-action="' + esc(action.id) + '" data-opened="' + esc(action.openedAt) + '"';
  if (status && status !== 'awaiting_approval') return '<p class="sub">' + esc(item.error || 'The decision needs a status check. No source change is assumed.')
    + '</p><div class="rowactions"><button type="button" class="quiet check-decision"' + ref + '>Check decision</button></div>';
  return (item?.ticketId ? '<p class="sub">Your native decision ticket is waiting for your choice.</p>' : '')
    + '<div class="rowactions"><button type="button" class="danger archive"' + ref + '>Archive</button>'
    + '<button type="button" class="quiet keep"' + ref + '>Keep trying</button></div>';
}

function needsYouHtml(m) {
  const n = (value) => Number(value || 0).toLocaleString();
  const head = '<h2 id="needsYouTitle">Needs you</h2>';
  if (!m.actions.length) return head + '<p class="sub">No source needs a decision.' + (day(m.report?.finishedAt) ? ' Maintenance last ran on ' + esc(day(m.report.finishedAt)) + '.' : '') + '</p>';
  const count = Number(m.actionCount || m.actions.length);
  return head + (DECISION_ERROR ? '<p class="sub">' + esc(DECISION_ERROR) + '</p>' : '') + '<p class="sub">Career could not connect ' + n(count) + (count === 1 ? ' source' : ' sources') + '. Archive closes the employer\'s open jobs and stops reading it, '
    + 'the same as Remove, and Put back undoes it. Keep trying leaves it listed and does not ask again for ' + n(m.keepTryingDays) + ' days.'
    + (count > m.actions.length ? ' The ' + n(m.actions.length) + ' that have waited longest are shown.' : '') + '</p><ul>'
    + m.actions.map(action => { const [first, second] = triedText(action.evidence || {}); return '<li><strong>' + esc(action.company) + '</strong>'
      + '<div class="sub">' + esc(first) + '</div><div class="sub">' + esc(second) + '</div>' + decisionButtons(action) + '<div class="msg" hidden></div></li>'; }).join('') + '</ul>';
}

async function decisionJson(url, options) {
  const response = await fetch(url, options), body = await response.json();
  return {response,body};
}

function decisionInput(action, ticketId) {
  return {actionId:action.id,companyId:action.companyId,openedAt:action.openedAt,...(ticketId ? {ticketId} : {})};
}

async function checkSourceDecision(action, ticketId) {
  const answer = await decisionJson('/api/career-hunter/companies-admin/decision-sync', {
    method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(decisionInput(action,ticketId))});
  if (answer.body.decision) {
    DECISIONS = DECISIONS.filter(item => !(item.actionId === action.id && item.companyId === action.companyId && item.openedAt === action.openedAt));
    DECISIONS.push(answer.body.decision);
  }
  return answer;
}

async function confirmSourceChoice(ticketId, choice) {
  if (!/^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/.test(ticketId)) throw new Error('The original decision ticket is unavailable.');
  const path = '/tickets/' + ticketId + '/application/';
  const issued = await decisionJson(path + 'confirmation',{method:'POST'});
  if (!issued.response.ok || typeof issued.body.confirmation !== 'string') throw new Error('Human confirmation could not be obtained.');
  return decisionJson(path + 'decision', {method:'POST',headers:{'content-type':'application/json','x-oshal-confirm':issued.body.confirmation},
    body:JSON.stringify({outcome:choice === 'archive' ? 'approve' : 'cancel'})});
}

/** A choice confirms the exact native ticket once; sync reads its actual outcome before any source handoff. */
async function decideSource(button) {
  const line = button.closest('li'), msg = line.querySelector('.msg');
  const action = CURRENT_ACTIONS.find(item => item.id === Number(button.dataset.action) && item.companyId === Number(button.dataset.company)
    && item.openedAt === button.dataset.opened);
  if (!action) { show(msg,'This source decision changed. Refresh Source health.','err'); return; }
  const choice = button.classList.contains('archive') ? 'archive' : button.classList.contains('keep') ? 'keep' : 'check';
  line.querySelectorAll('button').forEach(control => { control.disabled = true; });
  let ticketId = boundDecision(action)?.ticketId, attempted = false;
  try {
    let answer = await checkSourceDecision(action,ticketId);
    ticketId = answer.body.decision?.ticketId;
    if (!answer.response.ok) throw new Error(answer.body.error || 'The decision could not be checked.');
    if (choice !== 'check' && answer.body.decision?.state === 'awaiting_approval') {
      attempted = true;
      await confirmSourceChoice(ticketId,choice);
      answer = await checkSourceDecision(action,ticketId);
    }
    if (answer.body.queued === true || answer.body.applied === true || choice === 'check') { await load(); return; }
    throw new Error(answer.body.error || 'Your choice was not confirmed. Check the decision before trying again.');
  } catch (error) {
    if (attempted && ticketId) {
      try {
        const checked = await checkSourceDecision(action,ticketId);
        if (checked.body.queued === true || checked.body.applied === true) { await load(); return; }
      } catch { /* The person can explicitly check again; no native choice is retried. */ }
    }
    show(msg,error.message || 'The decision outcome is unknown. Check its status.','err');
  }
  line.querySelectorAll('button').forEach(control => { control.disabled = false; });
}

function developerHtml(briefs) {
  const n = (value) => Number(value || 0).toLocaleString();
  const word = (value) => String(value || '').replace(/[^A-Za-z0-9_-]/g, '_');
  BRIEF_LINKS.forEach(link => URL.revokeObjectURL(link));
  BRIEFS = new Map(briefs.map(brief => [String(brief.id), String(brief.brief || '')]));
  BRIEF_LINKS = briefs.map(brief => URL.createObjectURL(new Blob([String(brief.brief || '')], { type: 'text/markdown' })));
  const head = '<h2 id="forDeveloperTitle">For a developer</h2>';
  if (!briefs.length) return head + '<p class="sub">No reader needs a repair.</p>';
  return head + '<p class="sub">Readers whose reads keep ending part way, so jobs that left those boards stay open. Each brief says what is wrong, '
    + 'which employers it affects and what done means. Copy or download it and hand it to a developer.</p><ul>'
    + briefs.map((brief, index) => '<li><strong>' + esc(brief.reader) + ' reader</strong><div class="sub">'
      + esc((PULL_REASONS[brief.reason] || 'The read ended with the code ' + brief.reason + '.') + ' ' + n(brief.employers?.count) + ' employers, '
        + n(brief.employers?.jobs) + ' open jobs stored.') + '</div><div class="rowactions">'
      + '<button type="button" class="quiet copy-brief" data-brief="' + esc(brief.id) + '">Copy brief</button>'
      + '<a class="download" download="brief-' + esc(word(brief.reader)) + '-' + esc(word(brief.reason)) + '.md" href="' + esc(BRIEF_LINKS[index]) + '">Download</a>'
      + '</div><div class="msg" hidden></div></li>').join('') + '</ul>';
}

/** Copy one brief's Markdown. Where the page may not use the clipboard, a selected text box does the same. */
async function copyBrief(button) {
  const text = BRIEFS.get(button.dataset.brief) || '';
  let copied = false;
  try { await navigator.clipboard.writeText(text); copied = true; }
  catch {
    const area = document.createElement('textarea');
    area.value = text; area.setAttribute('readonly', ''); area.style.position = 'fixed'; area.style.opacity = '0';
    document.body.appendChild(area); area.select();
    try { copied = document.execCommand('copy'); } catch { copied = false; }
    area.remove();
  }
  show(button.closest('li').querySelector('.msg'), copied ? 'Copied.' : 'Could not copy here. Use Download.', copied ? 'ok' : 'err');
}

function newSourcesHtml(m) {
  const n = (value) => Number(value || 0).toLocaleString();
  const found = m.report?.discovery || {};
  const list = (title, count, items, line, actions) => !items.length ? '' : '<p class="sub"><b>' + esc(title) + ' (' + n(count) + ')</b></p><ul>'
    + items.map(item => '<li>' + esc(line(item)) + (actions ? actions(item) : '') + '</li>').join('') + '</ul>';
  const connected = Array.isArray(found.connected) ? found.connected.filter(Boolean) : [];
  const suggested = Array.isArray(m.suggestions) ? m.suggestions.filter(Boolean) : [];
  const total = Math.max(Number(m.suggestionCount || 0), suggested.length);
  const tried = Number(found.tried || 0), waiting = Number(found.waiting || 0);
  return '<h2 id="newSourcesTitle">New sources found</h2><p class="sub">Last night Career looked for a job site for ' + n(tried)
    + (tried === 1 ? ' employer that has none. ' : ' employers that have none. ') + n(waiting) + (waiting === 1 ? ' waits' : ' wait') + ' for a later night.'
    + (found.timedOut || found.errorType || found.stopped ? ' The search did not finish.' : '') + '</p>'
    + list('Connected', connected.length, connected, i => i.company + ': now reading ' + i.board + ', ' + n(i.jobs) + ' jobs.')
    + list('Suggested, not connected', total, suggested, i => i.company + ': ' + (i.options || []).join(', ') + ', ' + n(i.jobs) + ' jobs. '
      + (day(i.suggestedAt) ? 'Found on ' + day(i.suggestedAt) + '. ' : '')
      + (i.owner ? i.owner + ' already uses this board.' : 'Not connected because ' + i.reason + '.'), i => i.owner ? '' : acceptButtons(i))
    + (total > suggested.length ? '<p class="sub">The ' + n(suggested.length) + ' found most recently are shown.</p>' : '');
}

/** The three source maintenance cards. Absent before maintenance has run; an unreadable answer says so and hides nothing else. */
function renderMaintenance(m) {
  const needs = $('#needsYou'), developer = $('#forDeveloper'), found = $('#newSources');
  needs.hidden = developer.hidden = found.hidden = !m;
  if (!m) return;
  if (m.unreadable || !Array.isArray(m.actions) || !Array.isArray(m.briefs)) {
    needs.innerHTML = '<h2 id="needsYouTitle">Needs you</h2><p class="sub">Source maintenance could not be read.</p>';
    developer.hidden = found.hidden = true;
    return;
  }
  needs.innerHTML = needsYouHtml(m);
  developer.innerHTML = developerHtml(m.briefs);
  found.innerHTML = newSourcesHtml(m);
}

function pullHealth(c) {
  const h = c.pull_health;
  if (!h || h.status === 'unavailable') return '<span class="sub">No pull recorded yet</span>';
  const labels = { ok: 'Complete', not_modified: 'Unchanged · HTTP 304', running: 'Attempt unfinished', failed: 'Pull failed', partial: 'Partial · existing jobs kept', empty_unconfirmed: 'Empty result · existing jobs kept' };
  const stamp = (value) => value && Number.isFinite(Date.parse(value)) ? new Date(value).toLocaleString() : 'not recorded';
  return '<strong>' + esc(labels[h.status] || 'Unknown outcome') + '</strong>'
    + '<div class="sub">Attempt: ' + esc(stamp(h.last_attempt_at)) + '</div>'
    + '<div class="sub">Last complete pull: ' + esc(stamp(h.last_success_at)) + '</div>'
    + (h.last_error_code ? '<div class="sub">' + esc(PULL_REASONS[h.last_error_code] || 'Pull could not be confirmed.') + '</div>' : '')
    + '<div class="sub">' + Number(h.new_count || 0) + ' new · ' + Number(h.changed_count || 0) + ' changed · '
    + Number(h.unchanged_count || 0) + ' unchanged · ' + Number(h.closed_count || 0) + ' closed</div>'
    + (h.consecutive_failures ? '<div class="sub">' + Number(h.consecutive_failures) + ' consecutive unconfirmed attempts</div>' : '');
}

function matchesSearch(c, q) {
  if (!q) return true;
  const hay = [c.name, c.ats_token, c.ats_type, c.careers_url].map(v => String(v || '').toLowerCase()).join(' ');
  return hay.includes(q);
}

function updateCounts() {
  const needs = ALL.filter(needsAttention).length;
  const removed = ALL.filter(isRemoved).length;
  const listed = ALL.length - removed;
  const active = listed - needs;
  $('#cntAll').textContent = ALL.length ? '(' + listed.toLocaleString() + ')' : '';
  $('#cntRemoved').textContent = '(' + removed.toLocaleString() + ')';
  $('#fltRemoved').hidden = !removed && statusFilter !== 'removed';
  $('#cntActive').textContent = ALL.length ? '(' + active.toLocaleString() + ')' : '';
  $('#cntNeeds').textContent = ALL.length ? '(' + needs.toLocaleString() + ')' : '';
  $('#cntProblems').textContent = '(' + ALL.filter(unconfirmedPull).length.toLocaleString() + ')';
  const count = (statuses) => ALL.filter(c => statuses.includes(c.pull_health?.status)).length.toLocaleString();
  $('#healthSummary').textContent = count(['failed']) + ' failed · ' + count(['partial']) + ' partial · '
    + count(['empty_unconfirmed']) + ' empty/unconfirmed · ' + count(['running']) + ' unfinished · '
    + count(['ok', 'not_modified']) + ' confirmed · '
    + ALL.filter(c => !c.pull_health || c.pull_health.status === 'unavailable').length.toLocaleString() + ' unrecorded sources';
}

function setStatusFilter(next) {
  statusFilter = next;
  $('#attn').checked = (next === 'needs');
  document.querySelectorAll('button.flt').forEach(b => {
    const on = b.dataset.filter === next;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', String(on));
  });
  page = 1;
  render();
}

let sortKey = '', sortDir = 1;
const SORTS = {
  name: c => String(c.name || '').toLowerCase(),
  jobs: c => Number(c.active_jobs || 0),
  platform: c => String(c.ats_type || '~').toLowerCase(),
  pull: c => String(c.pull_health?.last_attempt_at || ''),
};
function setView(view) {
  const v = view === 'health' ? 'health' : 'companies';
  document.documentElement.dataset.companiesView = v;
  document.querySelectorAll('#companiesViews [data-view]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === v)));
  try { const u = new URL(location.href); if (v === 'health') u.searchParams.set('view', 'health'); else u.searchParams.delete('view'); history.replaceState(null, '', u.pathname + u.search); } catch { /* address is best effort */ }
}
function render() {
  updateCounts();
  const q = (($('#companySearch').value || $('#q').value) || '').trim().toLowerCase();
  const rows = ALL.filter(c => {
    if (!matchesSearch(c, q)) return false;
    if (statusFilter === 'removed') return isRemoved(c);
    if (isRemoved(c)) return false;
    if (statusFilter === 'active') return !needsAttention(c);
    if (statusFilter === 'problems') return unconfirmedPull(c);
    if (statusFilter === 'needs' || $('#attn').checked) return needsAttention(c);
    return true;
  });
  if (sortKey) rows.sort((a, b) => { const x = SORTS[sortKey](a), y = SORTS[sortKey](b); return (x < y ? -1 : x > y ? 1 : 0) * sortDir; });
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if (page > totalPages) page = totalPages;
  if (page < 1) page = 1;
  const startIdx = (page - 1) * PAGE_SIZE;
  const endIdx = Math.min(startIdx + PAGE_SIZE, rows.length);
  const pageRows = rows.slice(startIdx, endIdx);

  $('#count').textContent = rows.length
    ? 'Showing ' + (startIdx + 1).toLocaleString() + '–' + endIdx.toLocaleString() + ' of ' + rows.length.toLocaleString() + ' companies'
    : 'Showing 0 of ' + ALL.length.toLocaleString() + ' companies';
  $('#prevPage').disabled = page <= 1;
  $('#nextPage').disabled = endIdx >= rows.length;

  const tb = $('#rows'); tb.innerHTML = '';
  for (const c of pageRows) {
    if (isRemoved(c)) { tb.appendChild(removedRow(c)); continue; }
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="name">' + esc(c.name) + '</td>' +
      '<td class="jobs">' + (c.active_jobs || 0).toLocaleString() + '</td>' +
      '<td><span class="' + (c.ats_type ? 'pill' : 'pill none') + '">' + esc(c.ats_type || 'none') + '</span>' +
      (String(c.source_lists || '').includes('"user:') ? ' <span class="pill" title="added through a user\'s own target list">user-added</span>' : '') + '</td>' +
      '<td>' + pullHealth(c) + '</td>' +
      '<td><div class="urlcell"><input class="url" value="' + esc(c.careers_url || '') + '" ' +
      'placeholder="paste careers / jobs search URL…" aria-label="Careers URL for ' + esc(c.name) + '" /><button type="button">Resolve</button></div>' +
      (latestChange(c.id) ? '<div class="sub change">' + esc(changeText(latestChange(c.id))) + '</div>' : '') +
      (sourceChangeMode === 'next-pull' ? '<div class="rowactions"><button type="button" class="quiet remove">Remove</button></div>' : '') +
      '<div class="msg" hidden></div></td>';
    const input = tr.querySelector('input.url');
    const btn = tr.querySelector('.urlcell button');
    const msg = tr.querySelector('.msg');
    btn.onclick = () => resolve(c, input, btn, msg, tr);
    const remove = tr.querySelector('button.remove');
    if (remove) remove.onclick = () => askRemove(c, remove);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') btn.click(); });
    tb.appendChild(tr);
  }
  $('#empty').hidden = rows.length > 0;
  $('#empty').textContent = ALL.length === 0 ? '' : 'No companies match.';
}

async function resolve(c, input, btn, msg, tr) {
  const url = (input.value || '').trim();
  if (!url) { show(msg, 'Enter a URL first.', 'err'); return; }
  btn.disabled = true; btn.textContent = 'Resolving…'; msg.hidden = true;
  try {
    const d = await sendChange(c.id, 'url', url);
    if (d.ok && d.queued) {
      const line = tr.querySelector('.change');
      if (line) line.textContent = changeText(d.request);
      else msg.insertAdjacentHTML('beforebegin', '<div class="sub change">' + esc(changeText(d.request)) + '</div>');
      show(msg, d.message || 'Saved.', 'ok');
    } else if (d.ok && d.result) {
      c.active_jobs = d.result.jobs != null ? d.result.jobs : c.active_jobs;
      c.ats_type = d.result.atype || c.ats_type; c.careers_url = url;
      tr.querySelector('td.jobs').textContent = (c.active_jobs || 0).toLocaleString();
      updateCounts();
      show(msg, d.result.message || 'Done.', 'ok');
    } else {
      show(msg, (d.error || 'Failed — could not resolve.'), 'err');
    }
  } catch (e) { show(msg, 'Request failed: ' + e, 'err'); }
  btn.disabled = false; btn.textContent = 'Resolve';
}

/** A removed employer's row: what it was, what was asked, and Put back. */
function removedRow(c) {
  const tr = document.createElement('tr');
  const change = latestChange(c.id);
  tr.innerHTML = '<td class="name">' + esc(c.name) + '</td><td class="jobs">' + (c.active_jobs || 0).toLocaleString() + '</td>'
    + '<td><span class="pill">removed</span></td><td><span class="sub">Not read by the pull</span></td>'
    + '<td>' + (change ? '<div class="sub change">' + esc(changeText(change)) + '</div>' : '')
    + '<div class="rowactions"><button type="button" class="restore">Put back</button></div><div class="msg" hidden></div></td>';
  const button = tr.querySelector('button.restore');
  button.onclick = () => employerChange('restore', c, button, tr.querySelector('.msg'));
  return tr;
}

/** Remove asks once, in the row: it closes the employer's open jobs at the next pull. */
function askRemove(c, button) {
  const box = button.parentElement;
  const jobs = Number(c.active_jobs || 0).toLocaleString();
  box.innerHTML = '<span class="sub">Remove ' + esc(c.name) + '? The next pull closes its ' + esc(jobs) + ' open jobs and stops reading it. Put back undoes it.</span>'
    + '<button type="button" class="danger confirm">Yes, remove</button><button type="button" class="quiet cancel">Cancel</button>';
  box.querySelector('button.cancel').onclick = () => render();
  const confirm = box.querySelector('button.confirm');
  confirm.onclick = () => employerChange('remove', c, confirm, box.parentElement.querySelector('.msg'));
}

/** Save a Remove or Put back for the next pull and say so in the row. */
async function employerChange(kind, c, button, msg) {
  button.disabled = true;
  try {
    const r = await fetch('/api/career-hunter/companies-admin/' + kind + '?companyId=' + encodeURIComponent(c.id), { method: 'POST' });
    const d = await r.json();
    if (d.ok && d.queued && d.request) {
      CHANGES.unshift(d.request);
      renderSourceChanges();
      button.parentElement.innerHTML = '<span class="sub">' + esc(d.message || 'Saved.') + '</span>';
      return;
    }
    show(msg, d.error || 'Could not be saved.', 'err');
  } catch (e) { show(msg, 'Request failed: ' + e, 'err'); }
  button.disabled = false;
}

/** Add an employer from its name and careers link; the next pull makes it and reads its jobs. */
async function addEmployer(event) {
  event.preventDefault();
  const name = $('#addName').value.trim(), link = $('#addLink').value.trim();
  if (name.length < 2) { show($('#addMsg'), 'Enter the employer\'s name.', 'err'); return; }
  if (!/^https?:\/\/\S+$/i.test(link)) { show($('#addMsg'), 'Enter its careers page or job board link, starting with https://', 'err'); return; }
  $('#addSave').disabled = true;
  try {
    const r = await fetch('/api/career-hunter/companies-admin/add?name=' + encodeURIComponent(name) + '&url=' + encodeURIComponent(link), { method: 'POST' });
    const d = await r.json();
    if (d.ok && d.queued && d.request) {
      CHANGES.unshift(d.request);
      renderSourceChanges();
      $('#addName').value = ''; $('#addLink').value = '';
      show($('#addMsg'), d.message || 'Saved.', 'ok');
    } else {
      show($('#addMsg'), d.error || 'Could not be saved.', 'err');
    }
  } catch (e) { show($('#addMsg'), 'Request failed: ' + e, 'err'); }
  $('#addSave').disabled = false;
}

function toggleAddForm(open) {
  $('#addForm').hidden = !open;
  $('#addEmployer').setAttribute('aria-expanded', String(open));
  if (open) { $('#addMsg').hidden = true; $('#addName').focus(); }
}

function show(el, t, cls) { el.textContent = t; el.className = 'msg ' + cls; el.hidden = false; }
function esc(s) { return String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m])); }

function readCompanyState(d) {
  ALL = d.companies || [];
  sourceChangeMode = d.sourceChangeMode === 'next-pull' ? 'next-pull' : 'now';
  CHANGES = Array.isArray(d.sourceChanges) ? d.sourceChanges : [];
  DECISIONS = Array.isArray(d.sourceDecisions) ? d.sourceDecisions : [];
  CURRENT_ACTIONS = Array.isArray(d.sourceMaintenance?.actions) ? d.sourceMaintenance.actions : [];
  DECISION_ERROR = d.sourceDecisionError || null;
}

async function load() {
  try {
    const r = await fetch('/api/career-hunter/companies-admin/list');
    if (r.status === 403) { document.body.innerHTML = '<div class="empty">Admin only.</div>'; return; }
    if (!r.ok) throw new Error('Source configuration could not be read (HTTP ' + r.status + ').');
    const d = await r.json();
    readCompanyState(d);
    $('#addEmployer').hidden = sourceChangeMode !== 'next-pull';
    if (sourceChangeMode === 'next-pull') {
      $('#companiesIntro').textContent = 'Every company and its detected job board. Paste the real careers or jobs link and press Resolve. '
        + 'Add employer lists a new employer from its name and careers link. Remove closes an employer\'s open jobs and stops reading it; '
        + 'the Removed chip lists removed employers, with Put back. The next nightly pull applies each change and reads the jobs, and Source changes shows what happened.';
    }
    try { renderSourceChanges(); } catch { $('#sourceChanges').hidden = true; }
    $('#healthNote').textContent = d.sourceHealth?.available
      ? 'Source history records each employer separately. Boards may still be fetched in full; unchanged posting bodies are retained. Only verified complete results may close missing jobs.'
      : 'This snapshot has no recorded pull history yet. Existing jobs and dates do not prove that every source was checked. History appears after the updated ingestion runs.';
    $('#sourceChanges').onclick = (event) => {
      const button = event.target.closest('button.undo');
      if (button) undoChange(button);
    };
    $('#sourceReview').onclick = (event) => {
      const button = event.target.closest('button.accept');
      if (button) acceptSuggestion(button);
    };
    try { renderSourceReview(d.sourceReview); }
    catch { renderSourceReview({ unreadable: true }); } // A bad report must not hide the company list.
    $('#needsYou').onclick = (event) => {
      const button = event.target.closest('button.archive, button.keep, button.check-decision');
      if (button) decideSource(button);
    };
    $('#forDeveloper').onclick = (event) => {
      const button = event.target.closest('button.copy-brief');
      if (button) copyBrief(button);
    };
    $('#newSources').onclick = (event) => {
      const button = event.target.closest('button.accept');
      if (button) acceptSuggestion(button);
    };
    try { renderMaintenance(d.sourceMaintenance); }
    catch { renderMaintenance({ unreadable: true }); }
    render();
  } catch (e) {
    $('#healthNote').textContent = e.message || 'Source configuration could not be read.';
    $('#empty').hidden = false; $('#empty').textContent = 'Failed to load companies. Try Refresh status.';
  }
}
$('#companySearch').addEventListener('input', () => { $('#q').value = $('#companySearch').value; page = 1; render(); });
$('#q').addEventListener('input', () => { $('#companySearch').value = $('#q').value; page = 1; render(); });
$('#attn').addEventListener('change', () => setStatusFilter($('#attn').checked ? 'needs' : 'all'));
document.querySelectorAll('button.flt').forEach(b => b.addEventListener('click', () => setStatusFilter(b.dataset.filter)));
$('#prevPage').addEventListener('click', () => { if (page > 1) { page--; render(); } });
$('#nextPage').addEventListener('click', () => { page++; render(); });
$('#healthReload').addEventListener('click', load);
$('#addEmployer').addEventListener('click', () => toggleAddForm($('#addForm').hidden));
$('#addCancel').addEventListener('click', () => toggleAddForm(false));
$('#addForm').addEventListener('submit', addEmployer);
document.querySelectorAll('#companiesViews [data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
document.querySelectorAll('th .sorter').forEach(b => b.addEventListener('click', () => {
  const key = b.dataset.sort; sortDir = sortKey === key ? -sortDir : (key === 'jobs' ? -1 : 1); sortKey = key;
  document.querySelectorAll('thead th').forEach(th => th.setAttribute('aria-sort', th.contains(b) ? (sortDir > 0 ? 'ascending' : 'descending') : (th.querySelector('.sorter') ? 'none' : th.getAttribute('aria-sort') || 'none')));
  page = 1; render();
}));
setView(new URLSearchParams(location.search).get('view'));
load();
</script>
</body>
</html>
