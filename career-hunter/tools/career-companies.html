<!doctype html>
<!--
  CHANGE LOG
  -----------------------------------------------------------------------------
  SEQ | AUTHOR | DESCRIPTION
  -----------------------------------------------------------------------------
  1 | maintainer@emeraldcoastsystemsgroup.com | Follow the shared portal palette and scoped Career branding without changing screen workflows or document paper.
  2 | maintainer@emeraldcoastsystemsgroup.com | Show retained per-source attempts, complete pulls, failures, HTTP 304 checks and posting delta counts; unavailable history stays explicit.
  3 | maintainer@emeraldcoastsystemsgroup.com | Show the latest nightly source review above the table: what was repaired, what needs a person, what the pull did and what is still broken.
  4 | maintainer@emeraldcoastsystemsgroup.com | UX audit 2026-11-06 (grade C): a 450px nightly review and pull telemetry sat between the search box and the table, so a matching row landed under the orb. Two views in this page: Companies (search, chips, then the table at once, with Company, Jobs, Platform and Latest pull sortable, your pending source changes under it, and the explanation under Help) and Source health (the nightly source review and the failed/partial line; the page is administrators only already). The in-page Job Board and Cockpit links are gone (the shell has Apps); chips, buttons, the search field and the attention checkbox are 44px. Guard: tests/career-companies-views.test.mjs.
-->

<html lang="en" data-theme="midnight" data-career-surface="companies-admin">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Companies — Admin</title>
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css" />
<script src="/shared/ui/js/surface-theme.js"></script>
<style>
  /* Every alias DERIVES from a framework token carried by surface-themes.css above. The old
     --surface-* names never existed in the framework, so each alias always fell back to its
     hardcoded dark hex and the surface ignored the operator's theme entirely. */
  :root {
    --bg: var(--bg-primary); --panel: var(--bg-card);
    --line: var(--border-color); --text: var(--text-primary);
    --muted: var(--text-muted); --accent: var(--accent-primary);
    --warn: var(--status-warning); --bad: var(--status-error);
    /* Ink for text sitting ON the accent fill — the page background contrasts with the accent in
       every theme, because each theme pairs a bright accent with a dark page (or the inverse). */
    --on-accent: var(--bg-primary);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px 20px 8px; }
  .head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .top-nav { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
  .top-nav a { color: var(--accent); text-decoration: none; font-weight: 600; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
  .top-nav a:hover { border-color: var(--accent); }
  h1 { margin: 0 0 2px; font-size: 18px; font-weight: 650; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .bar { display: flex; gap: 10px; align-items: center; padding: 10px 20px; flex-wrap: wrap; }
  input[type=search], input.url {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 7px 10px; font: inherit; }
  input[type=search] { width: 280px; max-width: 100%; }
  input.url { width: 100%; }
  .filters { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  button.flt {
    background: var(--panel); color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  button.flt:hover { border-color: var(--accent); color: var(--text); }
  button.flt.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  label.chk { color: var(--muted); font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .pager { display: inline-flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  .count { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  button.pg {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  button.pg:hover:not(:disabled) { border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { position: sticky; top: 0; background: var(--bg); color: var(--muted); font-weight: 600; font-size: 12px; z-index: 1; }
  td.name { font-weight: 600; white-space: nowrap; }
  td.jobs { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.none { color: var(--bad); border-color: var(--bad); }
  .urlcell { display: flex; gap: 8px; min-width: 380px; }
  button { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 8px; padding: 7px 12px;
           font: inherit; font-weight: 650; cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .55; cursor: default; }
  .msg { font-size: 12px; margin-top: 3px; }
  .msg.ok { color: var(--accent); } .msg.err { color: var(--bad); }
  .empty { padding: 40px 20px; color: var(--muted); }
  .wrap { max-height: calc(100vh - 140px); overflow: auto; }
  .review { margin: 0 12px 14px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .review h2 { margin: 0 0 2px; font-size: 14px; font-weight: 650; }
  .review-stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 10px 0; }
  .review-stats div { display: flex; flex-direction: column; }
  .review-stats strong { font-size: 18px; font-variant-numeric: tabular-nums; }
  .review details { margin-top: 6px; }
  .review summary { cursor: pointer; font-weight: 600; font-size: 12.5px; }
  .review ul { margin: 6px 0 0; padding-inline-start: 18px; font-size: 12.5px; overflow-wrap: anywhere; }
  @media (max-width: 640px) {
    header, .bar { padding-left: 12px; padding-right: 12px; }
    input[type=search] { width: 100%; }
    .pager { margin-left: 0; width: 100%; justify-content: space-between; }
  }
</style>
<link rel="stylesheet" href="/shared/ui/css/surface-glass.css" />
<link rel="stylesheet" href="/api/career-hunter/static/career-kit.css" />
<style>
/* UX audit 2026-11-06: two views, 44px controls, sortable columns. */
html[data-companies-view="companies"] [data-view-of="health"], html[data-companies-view="health"] [data-view-of="companies"] { display: none !important; }
#companiesViews { margin: 0; padding: 0; }
.flt, .pg, #companySearch { min-height: 44px; }
.chk { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; }
#attn { width: 22px; height: 22px; }
.urlcell button, .review button { min-height: 44px; }
th .sorter { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; font: inherit; }
th[aria-sort="ascending"]::after { content: " ▲"; font-size: 10px; }
th[aria-sort="descending"]::after { content: " ▼"; font-size: 10px; }
details.help > summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; }
</style>
<style id="career-theme-inline">
  :root[data-career-surface] {
    --career-brand-accent: var(--accent-primary);
    --bg: var(--bg-primary); --bg2: var(--bg-secondary); --page: var(--bg-primary);
    --panel: var(--bg-secondary); --panel2: var(--bg-tertiary);
    --card: var(--bg-card); --card2: var(--bg-card-hover);
    --control: var(--bg-secondary); --hover: var(--bg-card-hover);
    --line: var(--border-color); --border: var(--border-color);
    --ink: var(--text-primary); --text: var(--text-primary);
    --muted: var(--text-secondary); --sub: var(--text-secondary);
    --accent: var(--career-brand-accent); --navy: var(--career-brand-accent);
    --navy2: var(--accent-primary-hover); --teal: var(--career-brand-accent);
    --accent2: var(--status-success); --green: var(--status-success); --good: var(--status-success);
    --red: var(--status-error); --bad: var(--status-error); --danger: var(--status-error);
    --warn: var(--status-warning); --amber: var(--status-warning);
    --on-accent: var(--text-on-accent, #fff); --teal-ink: var(--text-on-accent, #fff);
  }
  html[data-career-surface], html[data-career-surface] body {
    background-color: var(--bg-primary); color: var(--text-primary);
  }
  html[data-career-surface] body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  html[data-career-surface] :is(.wrap > h1, main > header > h1, body > header > h1) {
    letter-spacing: -.025em; font-weight: 650;
    border-inline-start: 3px solid var(--career-brand-accent); padding-inline-start: 11px;
  }
  html[data-career-surface] :is(button.primary, .btn.primary, .tab.active) {
    background: var(--career-brand-accent); border-color: var(--career-brand-accent);
    color: var(--text-on-accent, #fff);
  }
  html[data-career-surface] :is(input, select, textarea) { accent-color: var(--career-brand-accent); }
  html[data-career-surface] :is(button, a, input, select, textarea):focus-visible {
    outline: 2px solid var(--career-brand-accent); outline-offset: 3px;
  }
</style>

<body>
  <header>
    <div class="head-row">
      <h1>Companies <span class="sub">· admin</span></h1>
      <nav class="top-nav" aria-label="Career navigation">
        <div class="ck-seg" role="tablist" aria-label="Companies views" id="companiesViews">
          <button type="button" role="tab" data-view="companies" aria-selected="true">Companies</button>
          <button type="button" role="tab" data-view="health" aria-selected="false">Source health</button>
        </div>
      </nav>
    </div>
    <details class="help" id="companiesHelp"><summary>Help</summary><div class="sub" id="companiesIntro">Every company and its detected job board. Paste the real careers / jobs URL and hit
      <b>Resolve</b> to re-detect the ATS and scrape now. Writes the shared corpus for all users.</div></details>
  </header>
  <div class="bar" data-view-of="companies">
    <input type="search" id="companySearch" placeholder="Search companies by name, token, or ATS…" aria-label="Search companies" autocomplete="off" />
    <input type="search" id="q" placeholder="search company…" autocomplete="off" hidden aria-hidden="true" />
    <div class="filters" role="group" aria-label="Filter companies by ATS status">
      <button type="button" class="flt active" id="fltAll" data-filter="all" aria-pressed="true">All <span id="cntAll"></span></button>
      <button type="button" class="flt" id="fltActive" data-filter="active" aria-pressed="false">Active ATS <span id="cntActive"></span></button>
      <button type="button" class="flt" id="fltNeeds" data-filter="needs" aria-pressed="false">Needs URL <span id="cntNeeds"></span></button>
      <button type="button" class="flt" id="fltProblems" data-filter="problems" aria-pressed="false">Unconfirmed pulls <span id="cntProblems"></span></button>
    </div>
    <label class="chk"><input type="checkbox" id="attn" /> needs attention only (failed pull / no jobs / not found)</label>
    <button type="button" class="pg" id="healthReload">Refresh status</button>
    <div class="pager">
      <span class="count" id="count" role="status" aria-live="polite"></span>
      <button type="button" class="pg" id="prevPage" disabled>Prev</button>
      <button type="button" class="pg" id="nextPage" disabled>Next</button>
    </div>
  </div>
  <div class="wrap">
    <div data-view-of="health">
    <p class="sub" id="healthNote" role="status">Checking source history…</p>
    <p class="sub" id="healthSummary" role="status"></p>
    <section class="review" id="sourceReview" aria-labelledby="sourceReviewTitle" hidden></section>
    </div>
    <table data-view-of="companies">
      <thead><tr><th aria-sort="none"><button type="button" class="sorter" data-sort="name">Company</button></th><th style="text-align:right" aria-sort="none"><button type="button" class="sorter" data-sort="jobs">Jobs</button></th><th aria-sort="none"><button type="button" class="sorter" data-sort="platform">Platform</button></th><th aria-sort="none"><button type="button" class="sorter" data-sort="pull">Latest pull</button></th>
        <th id="urlHeading">Careers / jobs URL — paste the real search URL &amp; Resolve</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" data-view-of="companies" hidden></div>
    <section class="review" id="sourceChanges" data-view-of="companies" aria-labelledby="sourceChangesTitle" hidden></section>
  </div>
<script>
const $ = (s) => document.querySelector(s);
const PAGE_SIZE = 100;
let ALL = [];
let statusFilter = 'all';
let page = 1;

function needsAttention(c) { return !c.ats_type || (c.active_jobs || 0) === 0 || (c.discover_status && c.discover_status !== 'found')
  || ['failed', 'partial', 'empty_unconfirmed'].includes(c.pull_health?.status); }
function unconfirmedPull(c) { return ['failed', 'partial', 'empty_unconfirmed', 'running'].includes(c.pull_health?.status); }

let sourceChangeMode = 'now';
let CHANGES = [];
const PULL_REASONS = { fetch_failed: 'The source could not be read.', http_refused: 'The source refused a request.', pagination_incomplete: 'Not every page was received.', completion_unverified: 'This connector has no complete-feed proof yet.', empty_unconfirmed: 'An empty response does not prove every job closed.', invalid_feed_rows: 'The source returned invalid or duplicate job records.', page_limit_reached: 'The source has more jobs than could be read.', browser_navigation_failed: 'The page could not be opened.', browser_read_failed: 'The page could not be read.', challenge_detected: 'The site asked for a human check.', pull_interrupted: 'The pull stopped three times while reading this source, so it was skipped that night.' };

/** One expandable list; nothing at all when it is empty, so the card stays short on a quiet night. */
function reviewList(title, items, line, hint, actions) {
  const shown = Array.isArray(items) ? items.filter(Boolean) : [];
  if (!shown.length) return '';
  return '<details><summary>' + esc(title) + ' (' + shown.length + ')</summary>'
    + (hint ? '<p class="sub">' + esc(hint) + '</p>' : '')
    + '<ul>' + shown.map(item => '<li>' + esc(line(item)) + (actions ? actions(item) : '') + '</li>').join('') + '</ul></details>';
}

/** One press per board the review named, only where a saved change reaches the next pull. */
function acceptButtons(item) {
  if (sourceChangeMode !== 'next-pull' || !item.id) return '';
  if (latestChange(item.id)?.state === 'waiting') return ' <span class="sub">Saved. Waiting for the next pull.</span>';
  return (item.options || []).map(board => ' <button type="button" class="pg accept" data-company="' + esc(item.id)
    + '" data-board="' + esc(board) + '">Accept ' + esc(board) + '</button>').join('');
}

/** The newest change for one company, if any. */
function latestChange(companyId) {
  return CHANGES.find(change => change && change.companyId === companyId);
}

/** What became of a change, in words. Employer and board text is escaped by whoever shows this. */
function changeText(change) {
  const d = change.detail || {};
  const n = (value) => Number(value || 0).toLocaleString();
  switch (change.state) {
    case 'waiting': return 'Waiting for the next nightly pull.';
    case 'started': return 'The last pull did not finish applying this.';
    case 'applied': return 'Applied: now reading ' + d.board + ', ' + n(d.jobs) + ' jobs, ' + n(d.new) + ' new, ' + n(d.closed) + ' closed.';
    case 'saved_no_jobs': return 'The link was saved, but no jobs could be read from it, so the source did not change.';
    case 'no_jobs': return 'Not applied: that board returned no jobs.';
    case 'duplicate': return 'Not applied: ' + d.owner + ' already uses ' + d.board + '.';
    case 'unknown_company': return 'Not applied: that company is no longer listed.';
    case 'bad_target': return 'Not applied: that is not a job board link.';
    case 'unsafe': return 'Not applied: that link leads to a private address.';
    case 'timeout': return 'Not applied: reading it took more than 5 minutes.';
    case 'interrupted': return 'Not applied: the pull stopped 3 times while applying it. Press Resolve to try again.';
    default: return 'Not applied: the pull could not read it.';
  }
}

function renderSourceChanges() {
  const card = $('#sourceChanges');
  const shown = CHANGES.filter(Boolean).slice(0, 20);
  card.hidden = !shown.length;
  if (!shown.length) return;
  const name = (id) => ALL.find(c => c.id === id)?.name || ('Company ' + id);
  card.innerHTML = '<h2 id="sourceChangesTitle">Source changes</h2><ul>'
    + shown.map(change => '<li>' + esc(name(change.companyId)) + ': ' + esc(change.target || '') + '. ' + esc(changeText(change)) + undoButton(change) + '</li>').join('')
    + '</ul>';
}

/** A wrong press closes the jobs the new board does not list, so going back takes one press too. */
function undoButton(change) {
  const before = change.detail?.from;
  if (change.state !== 'applied' || sourceChangeMode !== 'next-pull' || !before || /:$/.test(before)) return '';
  if (latestChange(change.companyId) !== change) return '';
  return ' <button type="button" class="pg undo" data-company="' + esc(change.companyId) + '" data-board="' + esc(before) + '">Undo: back to ' + esc(before) + '</button>';
}

async function undoChange(button) {
  button.disabled = true;
  let error = 'Could not be saved.';
  try {
    const d = await sendChange(Number(button.dataset.company), 'board', button.dataset.board);
    if (d.ok && d.queued) { render(); return; }
    error = d.error || error;
  } catch (e) { error = 'Request failed: ' + e; }
  button.disabled = false;
  button.insertAdjacentHTML('afterend', ' <span class="sub">' + esc(error) + '</span>');
}

/** Ask for a change; the answer says whether it applied now or waits for the next pull. */
async function sendChange(companyId, field, value) {
  const r = await fetch('/api/career-hunter/companies-admin/seturl?companyId=' + encodeURIComponent(companyId)
    + '&' + field + '=' + encodeURIComponent(value), { method: 'POST' });
  const d = await r.json();
  if (d.ok && d.queued && d.request) {
    CHANGES.unshift(d.request);
    renderSourceChanges();
  }
  return d;
}

async function acceptSuggestion(button) {
  const line = button.parentElement;
  button.disabled = true;
  const company = Number(button.dataset.company);
  let error = 'Could not be saved.';
  try {
    const d = await sendChange(company, 'board', button.dataset.board);
    if (d.ok && d.queued) {
      line.querySelectorAll('button.accept').forEach(b => b.remove());
      line.insertAdjacentHTML('beforeend', ' <span class="sub">Saved. Waiting for the next pull.</span>');
      render();
      return;
    }
    error = d.error || error;
  } catch (e) { error = 'Request failed: ' + e; }
  button.disabled = false;
  line.insertAdjacentHTML('beforeend', ' <span class="sub">' + esc(error) + '</span>');
}

function renderSourceReview(r) {
  const card = $('#sourceReview');
  card.hidden = !r;
  if (!r) return;
  if (r.unreadable || !r.review || !r.sources || !r.delta) {
    card.innerHTML = '<h2 id="sourceReviewTitle">Nightly source review</h2><p class="sub">The latest report could not be read.</p>';
    return;
  }
  const n = (value) => Number(value || 0).toLocaleString();
  const outcomes = r.review.outcomes || {};
  const stat = (label, value) => '<div><strong>' + n(value) + '</strong><span class="sub">' + esc(label) + '</span></div>';
  const was = r.previousSources ? ' (was ' + n(r.previousSources.whole) + ')' : '';
  const when = Number.isFinite(Date.parse(r.finishedAt)) ? new Date(r.finishedAt).toLocaleString() : 'not recorded';
  card.innerHTML = '<h2 id="sourceReviewTitle">Nightly source review</h2>'
    + '<p class="sub">' + esc(when) + '. Checked ' + n(r.review.checked) + ' sources; ' + n(r.review.waiting) + ' waiting for a later night.</p>'
    + '<div class="review-stats">' + stat('Repaired', outcomes.repaired) + stat('Suggested', outcomes.suggested)
    + stat('Refused us', outcomes.blocked) + stat('Reading nothing', r.sources.empty) + stat('Failing', r.sources.failed)
    + stat('No feed', r.sources.noFeed) + '</div>'
    + '<p class="sub">Verified whole: ' + n(r.sources.whole) + esc(was) + '. Partly verified: ' + n(r.sources.unverified) + '.</p>'
    + '<p class="sub">Last pull read ' + n(r.delta.read) + ' jobs: ' + n(r.delta.new) + ' new, ' + n(r.delta.changed) + ' changed, '
    + n(r.delta.unchanged) + ' unchanged, ' + n(r.delta.closed) + ' closed. ' + n(r.delta.notModified) + ' sources answered not modified.</p>'
    + reviewList('Repaired', r.review.repaired, i => i.company + ': ' + i.from + ' → ' + i.to + ', ' + n(i.jobs) + ' jobs')
    + reviewList('Suggested, not applied', r.review.suggested, i => i.company + ': ' + (i.options || []).join(', ') + (i.jobs == null ? '' : ', ' + n(i.jobs) + ' jobs') + ', ' + i.reason,
      sourceChangeMode === 'next-pull'
        ? 'Nothing was changed, because the review could not prove these boards belong to the employer. Accept one and the next pull moves the employer to it, and closes its jobs that board does not list. You can undo it from Source changes. Or paste a link into its row below.'
        : 'To accept one, paste that employer\'s job board URL into its row below and press Resolve.', acceptButtons)
    + reviewList('Board already held by another employer', r.review.duplicates, i => i.company + ': ' + i.board + ' is held by ' + i.owner)
    + reviewList('Closed more than half its jobs in this pull', r.massClosed, i => i.company + ' (' + i.ats + '): ' + n(i.closed) + ' closed, ' + n(i.kept) + ' kept',
      'A large closure can be real, or a feed that stopped returning everything.')
    + reviewList('Same job count three pulls running', r.stuck, i => i.company + ' (' + i.ats + '): ' + n(i.jobs) + ' jobs',
      'Usually a limit on how many jobs the source returns, so some jobs may be missing.')
    + reviewList('Still broken', r.stillBroken, i => i.company + ' (' + i.ats + '): ' + (PULL_REASONS[i.code] || 'Could not be confirmed.') + ' ' + n(i.pulls) + ' pulls in a row');
}

function pullHealth(c) {
  const h = c.pull_health;
  if (!h || h.status === 'unavailable') return '<span class="sub">No pull recorded yet</span>';
  const labels = { ok: 'Complete', not_modified: 'Unchanged · HTTP 304', running: 'Attempt unfinished', failed: 'Pull failed', partial: 'Partial · existing jobs kept', empty_unconfirmed: 'Empty result · existing jobs kept' };
  const stamp = (value) => value && Number.isFinite(Date.parse(value)) ? new Date(value).toLocaleString() : 'not recorded';
  return '<strong>' + esc(labels[h.status] || 'Unknown outcome') + '</strong>'
    + '<div class="sub">Attempt: ' + esc(stamp(h.last_attempt_at)) + '</div>'
    + '<div class="sub">Last complete pull: ' + esc(stamp(h.last_success_at)) + '</div>'
    + (h.last_error_code ? '<div class="sub">' + esc(PULL_REASONS[h.last_error_code] || 'Pull could not be confirmed.') + '</div>' : '')
    + '<div class="sub">' + Number(h.new_count || 0) + ' new · ' + Number(h.changed_count || 0) + ' changed · '
    + Number(h.unchanged_count || 0) + ' unchanged · ' + Number(h.closed_count || 0) + ' closed</div>'
    + (h.consecutive_failures ? '<div class="sub">' + Number(h.consecutive_failures) + ' consecutive unconfirmed attempts</div>' : '');
}

function matchesSearch(c, q) {
  if (!q) return true;
  const hay = [c.name, c.ats_token, c.ats_type, c.careers_url].map(v => String(v || '').toLowerCase()).join(' ');
  return hay.includes(q);
}

function updateCounts() {
  const needs = ALL.filter(needsAttention).length;
  const active = ALL.length - needs;
  $('#cntAll').textContent = ALL.length ? '(' + ALL.length.toLocaleString() + ')' : '';
  $('#cntActive').textContent = ALL.length ? '(' + active.toLocaleString() + ')' : '';
  $('#cntNeeds').textContent = ALL.length ? '(' + needs.toLocaleString() + ')' : '';
  $('#cntProblems').textContent = '(' + ALL.filter(unconfirmedPull).length.toLocaleString() + ')';
  const count = (statuses) => ALL.filter(c => statuses.includes(c.pull_health?.status)).length.toLocaleString();
  $('#healthSummary').textContent = count(['failed']) + ' failed · ' + count(['partial']) + ' partial · '
    + count(['empty_unconfirmed']) + ' empty/unconfirmed · ' + count(['running']) + ' unfinished · '
    + count(['ok', 'not_modified']) + ' confirmed · '
    + ALL.filter(c => !c.pull_health || c.pull_health.status === 'unavailable').length.toLocaleString() + ' unrecorded sources';
}

function setStatusFilter(next) {
  statusFilter = next;
  $('#attn').checked = (next === 'needs');
  document.querySelectorAll('button.flt').forEach(b => {
    const on = b.dataset.filter === next;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', String(on));
  });
  page = 1;
  render();
}

let sortKey = '', sortDir = 1;
const SORTS = {
  name: c => String(c.name || '').toLowerCase(),
  jobs: c => Number(c.active_jobs || 0),
  platform: c => String(c.ats_type || '~').toLowerCase(),
  pull: c => String(c.pull_health?.last_attempt_at || ''),
};
function setView(view) {
  const v = view === 'health' ? 'health' : 'companies';
  document.documentElement.dataset.companiesView = v;
  document.querySelectorAll('#companiesViews [data-view]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === v)));
  try { const u = new URL(location.href); if (v === 'health') u.searchParams.set('view', 'health'); else u.searchParams.delete('view'); history.replaceState(null, '', u.pathname + u.search); } catch { /* address is best effort */ }
}
function render() {
  updateCounts();
  const q = (($('#companySearch').value || $('#q').value) || '').trim().toLowerCase();
  const rows = ALL.filter(c => {
    if (!matchesSearch(c, q)) return false;
    if (statusFilter === 'active') return !needsAttention(c);
    if (statusFilter === 'problems') return unconfirmedPull(c);
    if (statusFilter === 'needs' || $('#attn').checked) return needsAttention(c);
    return true;
  });
  if (sortKey) rows.sort((a, b) => { const x = SORTS[sortKey](a), y = SORTS[sortKey](b); return (x < y ? -1 : x > y ? 1 : 0) * sortDir; });
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if (page > totalPages) page = totalPages;
  if (page < 1) page = 1;
  const startIdx = (page - 1) * PAGE_SIZE;
  const endIdx = Math.min(startIdx + PAGE_SIZE, rows.length);
  const pageRows = rows.slice(startIdx, endIdx);

  $('#count').textContent = rows.length
    ? 'Showing ' + (startIdx + 1).toLocaleString() + '–' + endIdx.toLocaleString() + ' of ' + rows.length.toLocaleString() + ' companies'
    : 'Showing 0 of ' + ALL.length.toLocaleString() + ' companies';
  $('#prevPage').disabled = page <= 1;
  $('#nextPage').disabled = endIdx >= rows.length;

  const tb = $('#rows'); tb.innerHTML = '';
  for (const c of pageRows) {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="name">' + esc(c.name) + '</td>' +
      '<td class="jobs">' + (c.active_jobs || 0).toLocaleString() + '</td>' +
      '<td><span class="' + (c.ats_type ? 'pill' : 'pill none') + '">' + esc(c.ats_type || 'none') + '</span>' +
      (String(c.source_lists || '').includes('"user:') ? ' <span class="pill" title="added through a user\'s own target list">user-added</span>' : '') + '</td>' +
      '<td>' + pullHealth(c) + '</td>' +
      '<td><div class="urlcell"><input class="url" value="' + esc(c.careers_url || '') + '" ' +
      'placeholder="paste careers / jobs search URL…" aria-label="Careers URL for ' + esc(c.name) + '" /><button type="button">Resolve</button></div>' +
      (latestChange(c.id) ? '<div class="sub change">' + esc(changeText(latestChange(c.id))) + '</div>' : '') +
      '<div class="msg" hidden></div></td>';
    const input = tr.querySelector('input.url');
    const btn = tr.querySelector('button');
    const msg = tr.querySelector('.msg');
    btn.onclick = () => resolve(c, input, btn, msg, tr);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') btn.click(); });
    tb.appendChild(tr);
  }
  $('#empty').hidden = rows.length > 0;
  $('#empty').textContent = ALL.length === 0 ? '' : 'No companies match.';
}

async function resolve(c, input, btn, msg, tr) {
  const url = (input.value || '').trim();
  if (!url) { show(msg, 'Enter a URL first.', 'err'); return; }
  btn.disabled = true; btn.textContent = 'Resolving…'; msg.hidden = true;
  try {
    const d = await sendChange(c.id, 'url', url);
    if (d.ok && d.queued) {
      const line = tr.querySelector('.change');
      if (line) line.textContent = changeText(d.request);
      else msg.insertAdjacentHTML('beforebegin', '<div class="sub change">' + esc(changeText(d.request)) + '</div>');
      show(msg, d.message || 'Saved.', 'ok');
    } else if (d.ok && d.result) {
      c.active_jobs = d.result.jobs != null ? d.result.jobs : c.active_jobs;
      c.ats_type = d.result.atype || c.ats_type; c.careers_url = url;
      tr.querySelector('td.jobs').textContent = (c.active_jobs || 0).toLocaleString();
      updateCounts();
      show(msg, d.result.message || 'Done.', 'ok');
    } else {
      show(msg, (d.error || 'Failed — could not resolve.'), 'err');
    }
  } catch (e) { show(msg, 'Request failed: ' + e, 'err'); }
  btn.disabled = false; btn.textContent = 'Resolve';
}

function show(el, t, cls) { el.textContent = t; el.className = 'msg ' + cls; el.hidden = false; }
function esc(s) { return String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m])); }

async function load() {
  try {
    const r = await fetch('/api/career-hunter/companies-admin/list');
    if (r.status === 403) { document.body.innerHTML = '<div class="empty">Admin only.</div>'; return; }
    if (!r.ok) throw new Error('Source configuration could not be read (HTTP ' + r.status + ').');
    const d = await r.json();
    ALL = d.companies || [];
    sourceChangeMode = d.sourceChangeMode === 'next-pull' ? 'next-pull' : 'now';
    CHANGES = Array.isArray(d.sourceChanges) ? d.sourceChanges : [];
    if (sourceChangeMode === 'next-pull') {
      $('#companiesIntro').textContent = 'Every company and its detected job board. Paste the real careers or jobs link and press Resolve. The next nightly pull applies it and reads its jobs, and this page shows what happened.';
    }
    try { renderSourceChanges(); } catch { $('#sourceChanges').hidden = true; }
    $('#healthNote').textContent = d.sourceHealth?.available
      ? 'Source history records each employer separately. Boards may still be fetched in full; unchanged posting bodies are retained. Only verified complete results may close missing jobs.'
      : 'This snapshot has no recorded pull history yet. Existing jobs and dates do not prove that every source was checked. History appears after the updated ingestion runs.';
    $('#sourceChanges').onclick = (event) => {
      const button = event.target.closest('button.undo');
      if (button) undoChange(button);
    };
    $('#sourceReview').onclick = (event) => {
      const button = event.target.closest('button.accept');
      if (button) acceptSuggestion(button);
    };
    try { renderSourceReview(d.sourceReview); }
    catch { renderSourceReview({ unreadable: true }); } // A bad report must not hide the company list.
    render();
  } catch (e) {
    $('#healthNote').textContent = e.message || 'Source configuration could not be read.';
    $('#empty').hidden = false; $('#empty').textContent = 'Failed to load companies. Try Refresh status.';
  }
}
$('#companySearch').addEventListener('input', () => { $('#q').value = $('#companySearch').value; page = 1; render(); });
$('#q').addEventListener('input', () => { $('#companySearch').value = $('#q').value; page = 1; render(); });
$('#attn').addEventListener('change', () => setStatusFilter($('#attn').checked ? 'needs' : 'all'));
document.querySelectorAll('button.flt').forEach(b => b.addEventListener('click', () => setStatusFilter(b.dataset.filter)));
$('#prevPage').addEventListener('click', () => { if (page > 1) { page--; render(); } });
$('#nextPage').addEventListener('click', () => { page++; render(); });
$('#healthReload').addEventListener('click', load);
document.querySelectorAll('#companiesViews [data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
document.querySelectorAll('th .sorter').forEach(b => b.addEventListener('click', () => {
  const key = b.dataset.sort; sortDir = sortKey === key ? -sortDir : (key === 'jobs' ? -1 : 1); sortKey = key;
  document.querySelectorAll('thead th').forEach(th => th.setAttribute('aria-sort', th.contains(b) ? (sortDir > 0 ? 'ascending' : 'descending') : (th.querySelector('.sorter') ? 'none' : th.getAttribute('aria-sort') || 'none')));
  page = 1; render();
}));
setView(new URLSearchParams(location.search).get('view'));
load();
</script>
</body>
</html>
