# OSHAL app package — career-hunter (Career Hunter)
# Carved out of OSHAL core 2026-07-18 (ADR-085 Wave 3 #1 — the biggest carve: the
# job-hunting APP ships here). ENGINE-CARVE 2026-07-20: the ADR-093 interim is retired —
# the Python engine now ships IN this package (engine/ = the jobhunter package + seeds +
# sync tooling) and the CLI wrapper moved to bin/oshal-jobhunter.js (engine resolved
# package-relative). Manifest cliCommands invoke it via {packageDir}/bin/. Core keeps only
# the Python INTERPRETER as a base-image runtime (like node); nothing career-specific.
# The per-user job store stays on the api-output volume (JOBHUNTER_STORE_ROOT unchanged) —
# that is this swarm's installed-app DATA, not code, and never lived in the repo.
# ONE-BOT 2026-07-20: career-advisor (cb…0002) retired; the app has a SINGLE agent that
# registers inline from this manifest (packaged claude-code shape on the api) — so there
# are NO dedicated career containers and NO compose fragment. Engine work runs server-side
# via the {packageDir}/bin CLI tools (the inline bot calls tools; it never shells out).
# Framework: OSHAL (see docs/adr/2026-04-20-ADR-swarm-application-manifests.md)
#
# A node in the hive: turns the battle-tested Python job-hunter engine into an OSHAL
# app. The shared jobs CORPUS is ingested once from employers' public ATS feeds and shared
# by all users; every per-user
# signal (keyword/AI fit, status, resume/cover, lifecycle) is isolated per user_sub.
# ONE career-hunter agent (inline packaged shape) owns the domain — it calls the framework
# tools below; the native cockpit board is served directly by the package; an Approvals surface
# (near Settings) drives the human-in-the-loop application ticket queue.
#
# Everything reduces to a tool, a CLI, a connector, or a surface:
#   CLI        bin/oshal-jobhunter.js  (query/draft/score/refresh — engine in engine/)
#   Tools      the framework `tools:` below ({packageDir} cliCommands, server-side)
#   Connector  anthropic (click-to-connect)   [firecrawl = a per-user settings field]
#   Surfaces   board (native package surface) · approvals · settings
# ─────────────────────────────────────────────────────────────────────────────

name: career-hunter
suite: ai-knowledge   # ADR-097: primary catalog shelf (tools keep their own category:)
displayName: Intelligent Career
description: >-
  Reads openings from employers' own public ATS job feeds into a shared corpus, scores every
  posting against your private career profile, and turns the best fits into a human-in-the-loop
  application queue — approve, approve-with-OSHAL, or deny, then it writes a tailored resume +
  cover letter. Single-tenant, multi-user (per-user isolation); multi-tenant ready.
version: 1.12.1
status: active
theme: daylight

# Kernel skills this package IMPORTS (ADR-085 §2). Declared because an undeclared import is
# invisible to the prune guard: the first carve that drops the skill would break this app at
# MOUNT time, not at compile time. See docs/apps/kernel-skills.md.
uses:
  - graph            # career-graph-routes.js queries the caller-scoped graph tier
  - notifications    # career-digest.js sends the digest through the kernel notifier


source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: career-hunter
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/career-hunter/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# ADR-085 dependencies. `apps:` names the OTHER installed packages this one links into:
# the Presence ribbon group carries a cross-app tile to portrait-studio's own surface
# (/api/portrait-studio/app), so with portrait-studio absent that tile would load nothing.
# Declaring it makes the reverse-dependency guard block a portrait-studio uninstall while
# Career Hunter is active, and lets the installer pull it in.
#
# `connectors:` is deliberately ABSENT, not []. The key doubles as this app's runtime
# connector allow-list — PRESENT means "this is the complete set my surfaces may offer",
# and [] means "offer none". This app reaches at least four provider ids today (anthropic +
# firecrawl in career-settings-routes/career-engine-dispatch, google + twilio in
# career-digest), and the LinkedIn rail may add more, so an empty or partially-guessed list
# would silently strip working connectors off the settings surface. Absent = unfiltered =
# today's behaviour. Declaring the accurate allow-list is worth doing as its own audited
# change, not as a side effect of a ribbon edit.
dependencies:
  apps: [portrait-studio]
  tools: []

# Guests may browse read-only; every write is gated. (Was hardcoded Tier A in core —
# the literal left with this carve. Request only; grants come from the operator, D4.)
guestTier: readonly

# ─────────────────────────────────────────────────────────────────────────────
# BOT — ONE registered bot (2026-07-20 consolidation: career-advisor cb…0002 retired;
# career-hunter absorbs the advisor/chat duties). It registers from THIS manifest at
# activate (standard inline packaged shape) — no kernel registry entry, no container.
# It never shells out: every engine action is a framework tool below, executed
# server-side from this package ({packageDir}/bin/oshal-jobhunter.js); the engine does
# its own LLM work under the user's connected key.
# ─────────────────────────────────────────────────────────────────────────────
chatBot: career-hunter

bots:
  - agentId: cb000000-0000-0000-0000-000000000001
    name: career-hunter
    persona: personas/career-hunter.yaml   # package copy — the one persona (worker + advisor)
    # ADR-093 Tier 2: this bot runs at its own dedicated node (the core compose ships the
    # `career-bot` service, profile `career-node`). Dispatch leaves the controller, so the
    # ADR-127 demo-CLI carve can run the operator's turns on the deployment's mounted CLI
    # login — inline on the controller, SEC-05 refuses every CLI and the bot was stuck on
    # the hosted-only ladder. With the node service not running, dispatch fails visibly
    # rather than silently degrading onto a runtime the declaration opted out of.
    container: career-bot
    port: 5000
    role: career/job-hunt-owner
    capabilities:
      - ats-scraping
      - job-scoring
      - resume-generation
      - cover-letter-generation
      - careers-discovery
      - job-search
      - job-fit-advice
      - job-matching
      - application-strategy
      - application-status
      - resume-tailoring
      - recruiter-outreach
      - career-coaching
  # NOTE: Apply submission is a controller-owned, trusted rail rather than a framework tool.
  # Core selects and claims the job, stages job/profile data, and records the model-hidden
  # completion through private oshal-apply.js calls. The dedicated apply-operator worker bot
  # (cb…003) drives only the browser and is registered in the kernel registry, not here.

# Bot tools auto-discovered at load (wrap the CLI verbs + the surface HTML).

# ─────────────────────────────────────────────────────────────────────────────
# FRAMEWORK TOOLS — registered into the dynamic tool registry; their usageInstructions
# auto-inject into authorized bots' prompts, and the runtime runs them server-side
# (the bot CALLS the tool — it never shells out). Scoped to the signed-in user via the
# tool-executor (OSHAL_USER_SUB + .oshal-user-sub in the task workspace).
# ─────────────────────────────────────────────────────────────────────────────
tools:
  - name: career_database
    displayName: Career Database
    type: cli
    description: >-
      Read the signed-in user's career-hunter data — scored job matches, applied/generated
      pipeline counts, fresh high-fit roles, and resume gap themes — from their migrated jobs
      database. Use it to answer anything about their job search with real numbers.
    executor:
      executorType: cli
      cliCommand: node {packageDir}/bin/oshal-jobhunter.js query
    defaultAuthMode: auto
    usageInstructions: >-
      Call career_database (no arguments) to get a JSON snapshot of THIS user's hunt:
      freshHighFit.count = roles ≥70% fit posted in the last 3 days; topMatches = best-fit
      roles (title/company/fit/salary/status); recentApplied = the user's MOST RECENTLY
      APPLIED jobs (title/company/fit/salary_max/applied_at), newest first; pipeline =
      applied/generated/promoted counts; topGaps = resume gap themes by how many jobs they
      cost. For ANY question about jobs the user APPLIED to / recent applications, answer
      ONLY from recentApplied — NEVER from topMatches (those are best-FIT roles, not
      applications). ALWAYS call this before answering questions about their jobs, matches,
      applications, fit, or gaps. The data is already scoped to the signed-in user — never
      ask them to set up a database or for their role/location; you already have it.

  # ── engine work tools: what the codex sandbox shell-out used to do, now server-side ──
  - name: career_draft
    displayName: Draft Application
    type: cli
    description: >-
      Write the tailored resume + cover letter PDFs for ONE approved posting — the engine
      tailors against the user's real profile (its own LLM pass under their connected key)
      and returns the output packet paths.
    executor:
      executorType: cli
      cliCommand: node {packageDir}/bin/oshal-jobhunter.js draft --job {input.postingId}
    defaultAuthMode: auto
    usageInstructions: >-
      Call career_draft with input.postingId (the posting id from the ticket or
      career_database) to produce the tailored resume + cover letter for that ONE job.
      Report the output paths it prints. This is the standard draft — never claim a draft
      was made without calling it.
  - name: career_draft_oshal
    displayName: Draft Application (OSHAL variant)
    type: cli
    description: >-
      Same as career_draft but includes the OSHAL/open-source resume section. OPT-IN only.
    executor:
      executorType: cli
      cliCommand: node {packageDir}/bin/oshal-jobhunter.js draft --job {input.postingId} --oshal
    defaultAuthMode: auto
    usageInstructions: >-
      Call career_draft_oshal ONLY when the ticket or operator explicitly approved the
      OSHAL/open-source variant for input.postingId. When in doubt, use career_draft.
  - name: career_score
    displayName: Score Fresh Postings
    type: cli
    description: >-
      AI fit-score the signed-in user's fresh in-lane postings (bounded to recent postings;
      the engine's own scoring pass under the user's connected key).
    executor:
      executorType: cli
      cliCommand: node {packageDir}/bin/oshal-jobhunter.js score
    defaultAuthMode: auto
    usageInstructions: >-
      Call career_score (no arguments) when a ticket or the operator asks to score fresh
      postings. It is bounded to recent in-lane roles; report the counts it prints.

  # The kernel's oshal-apply.js profile/queue/trace verbs intentionally are NOT registered here.
  # They remain controller-private implementation details of staged dispatch and trusted ingest.
  - name: career_refresh
    displayName: Refresh Jobs Database
    type: cli
    description: >-
      Start the full jobs-database refresh NOW — scrape every company's ATS feed, re-index all
      users' keyword matches, AI-score the new roles, and queue the top drafts. The same chain
      the nightly 18:00-CT cron runs. Admin-only; runs detached for hours.
    executor:
      executorType: cli
      cliCommand: node {packageDir}/bin/oshal-jobhunter.js refresh
    defaultAuthMode: auto
    usageInstructions: >-
      Call career_refresh (no arguments) when the operator asks you to update, refresh, rescrape,
      or re-index the jobs database. It returns immediately with {ok,started} — the scrape runs
      detached and takes hours, so tell the operator it's underway, never that it's done. If it
      returns 403/admin-only, this user isn't a career admin: say so and stop (do not retry). If
      it returns "already running", report that the refresh is in progress. To check progress,
      call career_refresh_status and read {running, corpusFreshAt}.
  - name: career_refresh_status
    displayName: Refresh Status
    type: cli
    description: >-
      Whether a jobs-database refresh is currently running, plus the corpus's newest
      last-seen timestamp (how fresh the data is).
    executor:
      executorType: cli
      cliCommand: node {packageDir}/bin/oshal-jobhunter.js refresh-status
    defaultAuthMode: auto
    usageInstructions: >-
      Call career_refresh_status (no arguments) to answer "is the refresh done / how fresh is
      the jobs data". {running:true} = scrape+index still going; corpusFreshAt = newest
      last-seen timestamp in the shared corpus (UTC). Data from tonight = the morning is ready.

  # ── resume editing tools: "a bot and a tool to edit the database and re-render the resume" ──
  # The bot reads the master editor document with career_resume_read, proposes edits in
  # conversation, and applies them with career_resume_save — which rides the SAME audited route
  # rails Resume Studio uses (validation, backup snapshot, whitelist write-back; a numeric
  # postingId save also re-renders that packet's PDF). The save is approval-gated: nothing
  # changes the durable career profile without the user confirming the tool call.
  - name: career_resume_read
    displayName: Read Resume (Master Document)
    type: cli
    description: >-
      Read the signed-in user's editable resume document — the durable master career profile
      (headline, summary, competencies, experience with bullets, skills, clearance) every
      tailored resume is generated from.
    executor:
      executorType: cli
      cliCommand: node {packageDir}/bin/oshal-jobhunter.js resume base
    defaultAuthMode: auto
    usageInstructions: >-
      Call career_resume_read (no arguments) BEFORE proposing or making any resume edit — it
      returns {ok, resume} where resume is the current master document. Quote the user's real
      content back when discussing changes; never invent sections that are not in the document.
  - name: career_resume_save
    displayName: Save Resume Edits
    type: api
    description: >-
      Apply an edited resume document — 'master' saves the durable career profile through the
      whitelist write-back (backup snapshot + audit), a numeric postingId saves that job
      packet's tailored resume AND re-renders its PDF.
    executor: { executorType: api, apiEndpoint: "POST /api/career-hunter/resume/save" }
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        postingId:
          description: "'master' for the durable profile, or the numeric posting id for a job packet"
        resume:
          type: object
          description: The FULL edited resume document (start from career_resume_read's output)
      required: [postingId, resume]
    usageInstructions: >-
      Call career_resume_save ONLY after the user approves the specific edits. Send the FULL
      resume document (career_resume_read's shape with your changes applied), never a fragment.
      postingId 'master' = update the durable profile; a numeric postingId = save + re-render
      that packet's PDF. Report the changelog/paths the call returns. Titles, organizations and
      date spans on master experience entries are anchors and cannot be changed here — say so
      if asked.

# ─────────────────────────────────────────────────────────────────────────────
# UI SURFACES
#
# The `top` tray is SECTIONED by the optional `group:` label (see
# docs/ribbon-groups-adr-085-addendum.md). The cockpit ribbon buckets top items by that
# label, preserving group order by FIRST APPEARANCE and item order within a group; the
# entries below are listed in the order they render so the manifest reads like the rail.
#   (no group) Mobile — the pinned front door, deliberately the ungrouped lead band
#   Job Search  board · submissions · recruiters · insights — find work and watch it move
#   Resume      strengthen · resume studio — the artifact you send
#   Presence    profile studio · portrait studio — how you look to a recruiter
#
# `section: bottom` items are FORCED ungrouped by the renderer (they are the pinned base
# tray, already visually divided), so they carry no `group:` — adding one is a silent no-op:
#   approvals (bottom) — the human-in-the-loop application ticket queue, near Settings
#   companies (bottom) — admin-only corpus/ATS administration
#   settings  (bottom) — Anthropic click-to-connect + Firecrawl API-key field + cron toggles
#
# A deployment whose core predates the `group:` key drops it during profile synthesis and
# renders the same flat ribbon it renders today — degrade-to-flat, never a broken rail.
# ─────────────────────────────────────────────────────────────────────────────
ui:
  static:
    - toolName: career-mobile
      label: Mobile
      icon: codicon codicon-device-mobile
      iframeUrl: /api/career-hunter/mobile
      section: top
    # ── Job Search ──────────────────────────────────────────────────────────
    # Search Jobs leads the group on purpose: it is the one screen in it that works
    # before anything is set up. The Job Board below needs an indexed résumé to say
    # anything at all — this searches the shared corpus and never mentions a match.
    - toolName: career-search
      label: Search Jobs
      icon: codicon codicon-search
      iframeUrl: /api/career-hunter/search-ui
      section: top
      group: Job Search
    - toolName: career-board
      label: Job Board
      icon: codicon codicon-briefcase
      iframeUrl: /api/career-hunter/board-native
      section: top
      group: Job Search
    # Submissions — what the desktop worker is doing with the queued résumés: worker reachability,
    # the ticket lanes, and the narrated screenshot story per run. Sits next to the Job Board because
    # that is where a submission is queued and this is where you watch it.
    - toolName: career-submissions
      label: Submissions
      icon: codicon codicon-desktop-download
      iframeUrl: /api/career-hunter/submissions
      section: top
      group: Job Search
    - toolName: career-recruiters
      label: Recruiters
      icon: codicon codicon-organization
      iframeUrl: /api/career-hunter/recruiters-ui
      section: top
      group: Job Search
    # Insights is search ANALYTICS (pipeline funnel, open roles by company/state, salary
    # bands) — it reads the hunt, so it belongs with the hunt, not with the resume.
    - toolName: career-insights
      label: Insights
      icon: codicon codicon-graph-line
      iframeUrl: /api/career-hunter/insights-ui
      section: top
      group: Job Search
    # ── Resume ──────────────────────────────────────────────────────────────
    - toolName: career-strengthen
      label: Strengthen
      icon: codicon codicon-sparkle
      iframeUrl: /api/career-hunter/strengthen-ui
      section: top
      group: Resume
    - toolName: career-resume-studio
      label: Resume Studio
      icon: codicon codicon-edit
      iframeUrl: /api/career-hunter/resume-studio
      section: top
      group: Resume
    # ── Presence — how a recruiter sees you before they read the resume ──────
    # Profile Studio — LinkedIn profile customization (plan -> approve -> desktop
    # browser-control apply via linkedin-profile-operator; no LinkedIn edit API exists).
    - toolName: career-profile-studio
      label: Profile Studio
      icon: codicon codicon-account
      iframeUrl: /api/career-hunter/profile-studio
      section: top
      group: Presence
    # Portrait Studio — a CROSS-APP tile into the separate portrait-studio package
    # (declared under dependencies.apps). The headshot is part of the same presence
    # story as the LinkedIn profile, so it is reachable without leaving the hunt.
    # NOTE: the ribbon derives a view's guest tier from the iframeUrl's app segment, so
    # this tile inherits portrait-studio's tier, NOT this package's guestTier: readonly.
    # The toolName is career-SCOPED on purpose: registerDynamicToolUI/deregisterDynamicToolUI
    # key the shared tile registry by toolName alone, so reusing the bare `portrait-studio`
    # name would let this package's activation repoint — and its unload DEREGISTER —
    # portrait-studio's own ribbon tile.
    - toolName: career-portrait-studio
      label: Portrait Studio
      icon: codicon codicon-device-camera
      iframeUrl: /api/portrait-studio/app
      section: top
      group: Presence
    - toolName: career-approvals
      label: Approvals
      icon: codicon codicon-checklist
      iframeUrl: /api/career-hunter/approvals
      section: bottom
    # Admin only (server gates on CAREER_HUNTER_ADMIN_SUBS): view every company + its detected
    # board, paste a real careers URL to re-detect the ATS + scrape. Writes the SHARED corpus.
    - toolName: career-companies
      label: Companies
      icon: codicon codicon-globe
      iframeUrl: /api/career-hunter/companies-admin
      section: bottom
    - toolName: career-settings
      label: Career Settings
      icon: codicon codicon-settings-gear
      iframeUrl: /api/career-hunter/settings
      section: bottom

# ─────────────────────────────────────────────────────────────────────────────
# SURFACE — the surface-bridge op allow-list. FAIL-CLOSED: without this block the
# cockpit relay forwards NOTHING for this app, which is why the floating assistant
# could not see Resume Studio at all.
#   context  Resume Studio publishes WHICH resume is open + a digest of it, so the
#            floating Jarvis stops being blind to the screen the operator is on.
#   custom   Jarvis drives an edit back as {name:'resume_action', data:<action>} —
#            the SAME whitelisted action vocabulary the concierge already emits, so
#            it lands through the studio's existing applyAction() with no second
#            edit path to keep in sync.
#   notify   confirm an applied edit in the surface, not only in the chat bubble.
# Deliberately NOT declared: set_field/set_content (the sheet is a rendered preview,
# not a form — an edit must go through applyAction so it stays a real document
# mutation) and navigate (nothing here needs to move the ribbon).
# ─────────────────────────────────────────────────────────────────────────────
surface:
  ops: [context, custom, notify]

# ─────────────────────────────────────────────────────────────────────────────
# ROUTES — mounted conditionally by the loader.
# ─────────────────────────────────────────────────────────────────────────────
routes:
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/career-hunter/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/career-hunter-routes.js
    factory: createCareerHunterRoutes
    mountPath: /api/career-hunter
    auth: service-or-oidc   # what server.ts ACTUALLY mounts (ADR-085 D2; drifted to oidc here when the mount gained the service path — the standing guard caught it)
    requiresAuth: true
    requiresContext: true

# ─────────────────────────────────────────────────────────────────────────────
# DATABASE MIGRATIONS — applied idempotently on first load.
# ─────────────────────────────────────────────────────────────────────────────
  - module: routes/career-graph-routes.js
    factory: createCareerGraphRoutes
    mountPath: /api/career-hunter/graph
    auth: oidc

# Package copies are idempotent (safe on DBs where the core migrations already ran).
# NEW career-rls.sql closes the 060 gap: career_digest_settings + career_score_settings
# shipped without owner RLS.
# 095-career-corpus.sql moves the jobs corpus INTO the swarm database, which is what
# makes this a normal install rather than a 1.9 GB SQLite file per user on a volume:
# ONE shared career_postings table ingested once for everyone, with each user's match
# scores and application progression in FORCE-RLS tables keyed by user_sub.
migrations:
  - migrations/031-career-hunter.sql
  - migrations/077-career-digest.sql
  - migrations/082-career-title-profile.sql
  - migrations/090-career-rls.sql
  - migrations/091-career-automation.sql
  - migrations/095-career-corpus.sql
  - migrations/096-career-corpus-complete.sql
  # 097 adds the `postings` / `companies` compatibility VIEWS. The engine's ~53
  # `FROM postings` and ~68 `FROM companies` reads resolved to a per-connection SQLite
  # TEMP view (temp shadows main and every ATTACHed schema); Postgres has no equivalent,
  # so the shadow becomes a real view and RLS on the per-user tables — not a WHERE clause
  # — scopes it to the acting user. Must run AFTER 096: it reads apply_active /
  # confirmation_path / hq / gsearched / referral and career_company_reputation.
  - migrations/097-career-postings-view.sql
  # 098 does for the PER-USER tables what 097 did for the shared corpus: compatibility
  # VIEWS named recruiter_firms / gap_themes / interview_assessments, so the engine's
  # existing reads work verbatim. Like 097 they are security_invoker, so FORCE RLS on the
  # underlying tables scopes them to the caller. Must run AFTER 096, which creates those
  # three tables.
  - migrations/098-career-peruser-views.sql
  # 099 gives interview_bank.py's three tables a Postgres home. They were missed by 095/096
  # because that module builds its own schema with executescript() instead of going through
  # db.py, so it never appeared in the SQLite dumps those migrations were derived from.
  # Shared (no RLS): a question bank is the same for everyone and posting tags are derived
  # deterministically from the posting itself. Must run AFTER 095 — career_posting_tags
  # carries an FK to career_postings.
  - migrations/099-career-interview-bank.sql
  - migrations/100-career-application-provenance.sql
  - migrations/101-career-apply-claim-lease.sql
  - migrations/102-career-apply-run-binding.sql
  - migrations/103-career-interview-source-identity.sql

# ─────────────────────────────────────────────────────────────────────────────
# WORKFLOW — career-application tickets route to the career-hunter worker bot.
# Single-bot (no external reviewer): the persona self-gates. Human approval gates
# live in the Approvals surface (approval_required -> approved -> in_process_build).
# ─────────────────────────────────────────────────────────────────────────────
ticketType: career-application
workflow:
  name: Career Application Pipeline
  pipeline: career-application
  workerBot: career-hunter

# ─────────────────────────────────────────────────────────────────────────────
# THEMING
# ─────────────────────────────────────────────────────────────────────────────
# (sharedCss dropped at carve: surfaces load career-hunter.css via /api/career-hunter/static/,
#  served from this package tools/ — the field would point outside the package.)

# ─────────────────────────────────────────────────────────────────────────────
# RIBBON VISIBILITY — keep the native `tickets` view available (it is the queue);
# hide the rest of the framework chrome. `settings` always stays.
# ─────────────────────────────────────────────────────────────────────────────
ribbon:
  hideFrameworkItems:
    - chat
    - calendar
    - addressbook
    - dashboard
    - echo
    - logs
    - operations
  defaultView: career-board
