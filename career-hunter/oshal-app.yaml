# -----------------------------------------------------------------------------
# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — career-hunter (Career Hunter)
# Carved out of OSHAL core 2026-07-18 (ADR-085 Wave 3 #1 — the biggest carve: the
# job-hunting APP ships here). ENGINE-CARVE 2026-07-20: the ADR-093 interim is retired —
# the Python engine now ships IN this package (engine/ = the jobhunter package + seeds +
# sync tooling) and the CLI wrapper moved to bin/oshal-jobhunter.js (engine resolved
# package-relative). Manifest cliCommands invoke it via {packageDir}/bin/. Core keeps only
# the Python INTERPRETER as a base-image runtime (like node); nothing career-specific.
# WORKER RAIL 1.24.0: the engine's deterministic work (corpus, stores, PDF rendering) still runs
# on the controller, but every MODEL call it makes goes to the dedicated career-bot node through
# the package route /api/career-hunter/engine (see routes below). The engine child holds no
# vendor login and no model-provider key; the bot's own provider does the reasoning.
# The per-user job store stays on the api-output volume (JOBHUNTER_STORE_ROOT unchanged) —
# that is this swarm's installed-app DATA, not code, and never lived in the repo.
# ONE-BOT 2026-07-20: career-advisor (cb…0002) retired; the app has a SINGLE agent,
# registered from this manifest. It declares `container: career-bot`, so it runs on the
# dedicated career-bot node the core compose ships (profile career-node), not inline on the
# api. Engine work runs server-side via the {packageDir}/bin CLI; the engine's model calls
# come back to this bot through the worker rail.
# Framework: OSHAL (see docs/adr/2026-04-20-ADR-swarm-application-manifests.md)
#
# A node in the hive: turns the battle-tested Python job-hunter engine into an OSHAL
# app. The shared jobs CORPUS is ingested once from employers' public ATS feeds and shared
# by all users; every per-user
# signal (keyword/AI fit, status, resume/cover, lifecycle) is isolated per user_sub.
# ONE career-hunter agent (on its career-bot node) owns the domain's reasoning — it calls the
# framework tools below and answers the engine's worker-rail completions; the native cockpit
# board is served directly by the package; an Approvals surface (near Settings) drives the
# human-in-the-loop application ticket queue.
#
# Everything reduces to a tool, a CLI, a connector, or a surface:
#   CLI        bin/oshal-jobhunter.js  (query/draft/score/refresh — engine in engine/)
#   Tools      the framework `tools:` below ({packageDir} cliCommands, server-side)
#   Connector  anthropic (Career Settings card; not brokered into the engine since 1.24.0)
#              [firecrawl = a per-user settings field, brokered for web search]
#   Rail       /api/career-hunter/engine — the engine's model calls, run on the career-bot
#   Surfaces   board (native package surface) · approvals · settings
# ─────────────────────────────────────────────────────────────────────────────

# 141 | maintainer@emeraldcoastsystemsgroup.com | Remove a Career pick through its owner board dismissal while retaining application and native ticket history.
# 142 | maintainer@emeraldcoastsystemsgroup.com | Prepare and Open use the owner status writer, bounded explicit recovery and the admitted shell, with truthful action names.
# 143 | maintainer@emeraldcoastsystemsgroup.com | 1.60.11: each job a complete read stops listing is recorded with the read that closed it; a job the employer only re-keyed stays the same job (saved and removed state kept); each nightly pull writes a closure receipt (closed, re-keyed, possible re-key per source).
name: career-hunter
suite: ai-knowledge   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 64, high: 256, basis: declared }
  features:
    - id: career-assistant
      unit: career assistant task
      tier: T4
      generation: none
      degrade: disable
    - id: job-fit-scoring
      unit: job posting fit score
      tier: T2
      generation: none
      degrade: template
    - id: application-packet
      unit: tailored resume and cover letter
      tier: T3
      generation: none
      degrade: disable
    - id: resume-studio-guide
      unit: resume edit turn
      tier: T3
      generation: none
      degrade: disable
    - id: job-guide
      unit: job guide turn
      tier: T3
      generation: none
      degrade: disable
    - id: interview-preparation
      unit: interview guide or practice feedback
      tier: T3
      generation: none
      degrade: disable
    - id: linkedin-profile-draft
      unit: profile draft turn
      tier: T2
      generation: none
      degrade: disable
    - id: profile-ingest
      unit: resume or artifact ingest
      tier: T2
      generation: none
      degrade: disable
    - id: story-review
      unit: story review answer
      tier: T2
      generation: none
      degrade: template
displayName: Intelligent Career
description: >-
  Search employers' public job feeds, score selected recent openings against your private career
  profile, and save jobs to your board. Move a selected job to your submission queue, choose any other
  experience to include, generate and review its résumé and cover letter, then approve submission.
  Prepare for interviews after submitting.
  Track recorded applications and matching email updates in your private workspace.
  Your main résumé is one record: edit it as a Word document on the My résumé page or job by job on Work history, and each shows what the other saved.
  One concierge on every page, and through Jarvis, reads and changes anything in Career for you: your saved jobs and applications, your résumé and work history, your settings, the companies you want and your recruiters. A change to your résumé, and anything that spends or sends, waits for your approval, with Undo.
  The Download my data page lists every role, bullet, skill and history record Career keeps for you, with Download and Print.
version: 1.62.0

localEditing:
  itemId: master
  format: odt
  exportTool: career_resume_local_export
  importTool: career_resume_local_import
  description: Export your main résumé as an OpenDocument Text (.odt) document for local editing in LibreOffice Writer and import edited versions back while keeping previous snapshots.

# ── ADR-139 artifact exchange — this app as a "Send to…" DESTINATION ─────────
# Any document anywhere in the swarm (files browser, another app) can be sent
# to Career: the handle is redeemed through the kernel relay and rides the SAME
# leased store→absorb transaction as a direct artifact upload — the engine
# extracts true career facts into the caller's profile (add-only, audited).
artifacts:
  accepts:
    - id: absorb
      label: Add to Career profile
      icon: 💼
      types:
        - application/pdf
        - text/*
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/msword
        - application/json
      mode: post
      endpoint: /api/career-hunter/artifacts/import
status: active

# Kernel skills this package IMPORTS (ADR-085 §2). Declared because an undeclared import is
# invisible to the prune guard: the first carve that drops the skill would break this app at
# MOUNT time, not at compile time. See docs/apps/kernel-skills.md.
uses:
  - package-tools
  - specialist-context
  - test-catalog     # installed scenario registration; unavailable harnesses stay pending
  - graph            # career-graph-routes.js queries the caller-scoped graph tier
  - notifications    # career-digest.js sends the digest through the kernel notifier
  - app-dependencies # compatibility floor for the tiered dependencies block (ADR-085 addendum)
  # ADR-149 permissions (1.25.1): authorization.yaml binds every route, tool, the Career bot and
  # the Send-to-Career action to named permissions. The loader admits a callbackVerifier only with
  # a catalog, and an older core refuses this capability instead of mounting the rail unguarded.
  - application-authorization
  # The engine rail's per-run grants ride the kernel's signed-package-callbacks rail: the kernel
  # runs the package verifier first, refreshes the grant owner and checks career.execute before
  # routes/career-worker-rail.js runs as that owner.
  - signed-package-callbacks
  - experience-roles
  - experience

authorization:
  version: 1
  catalog: authorization.yaml
  roleTemplates:
    - id: member
      version: 1
      label: Job seeker
      members:
        - app: career-hunter
          role: member
    - id: admin
      version: 1
      label: Job source administrator
      members:
        - app: career-hunter
          role: admin


# Career's home page is the Career experience entry.
experience:
  version: 1
  label: Intelligent Career
  entry: /api/career-hunter/home
  shell: page
  skin: daylight

testing:
  version: 1
  catalog: tests/test-lab.yaml

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: career-hunter
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/career-hunter/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false
  # Operator-only storage-cutover observation status (BACKEND-CUTOVER.md). Read-only: it serves
  # the archive engine/sync/observe_cutover.py writes and answers `state: not-started` until the
  # first sample exists. Run from the Test Lab with the operator automation identity's PAT.
  - name: cutover-status
    method: GET
    path: /api/career-hunter/cutover/status
    auth: pat
    requiresUser: true
    expect:
      status: 200
      jsonPointer: /state
      rejectValues: [noop, stub, empty]
    requiresAi: false

# ADR-085 dependencies, tiered. `optional.apps` names another installed package this one links
# into but does not need: the Presence ribbon group carries a cross-app tile to
# portrait-studio's own surface (/api/portrait-studio/app), and the headshot picker probes that
# app and hides its own button on a 404. It is offered at install as an unchecked choice and
# never installed unasked; a portrait-studio uninstall is no longer blocked by this app, it is
# reported as an optional dependent instead.
#
# `connectors:` is DECLARED below, and the audited change that entry 23 records is what this
# comment used to defer. The key doubles as this app's runtime connector allow-list — PRESENT
# means "this is the complete set my surfaces may offer", [] means "offer none", and ABSENT
# means UNFILTERED: the cockpit pins the Connectors tile and puts the whole platform provider
# catalog inside this app. The four ids are cited at the block itself.
# ── ADR-141 per-user readiness — what the Intelligent Career group's setup page asks ──
# Each probe runs AS THE SIGNED-IN USER (the owning route admits a browser session) and
# reads this app's own store; a step is done only when readyPointer resolves to true.
#   resume    — the existing resume-state route: hasResume + a one-line summary
#   stories   — roles carrying a story (roles[].stories[]); honest "0 of N" until D7 ships
#   materials — documents added under uploads/artifacts (performance reports, Send-to-Career)
readiness:
  - name: resume
    path: /api/career-hunter/resume/state
    readyPointer: /hasResume
    detailPointer: /summary
  - name: stories
    path: /api/career-hunter/readiness
    readyPointer: /stories/ready
    detailPointer: /stories/detail
  - name: materials
    path: /api/career-hunter/readiness
    readyPointer: /materials/ready
    detailPointer: /materials/detail

# ── ADR-144 guest-seed contract — this app owns its guest demo data ──
# The kernel calls this once when an anonymous guest session starts, AS the fresh guest (service
# secret + x-oshal-user-sub). The route copies the bundled, pre-indexed demo profile
# (engine/seeds/career_db.default.json) into the guest's own store dir, so a guest always opens on
# an indexed candidate instead of the empty onboarding — and it is guest-only, so a real user's
# resume is never touched. Owned by the /api/career-hunter mount (auth: service-or-oidc), which the
# kernel may call with the service secret.
guestSeed:
  path: /api/career-hunter/guest-seed

dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    # portrait-studio is a cross-app tile plus an opportunistic headshot picker, never a runtime.
    # tools/career-profile-studio.html:243 says so in the code - "If the app isn't installed (404)
    # the button never appears and upload still works" - and the probe at :247 hides the button.
    # presentations (AI Office): Resume Studio embeds its Word editor on the master resume
    # (tools/career-resume-office.js reads /api/presentations/editor). Without it the master opens
    # in the classic view and says why, so it is optional.
    # social: Home's day plan reads the person's saved post drafts (tools/career-home.html reads
    # /api/social/content/drafts) and only when the person's own profile lists Social's workspace.
    # Without Social the step is simply absent, so it is optional.
    apps: [portrait-studio, presentations, social]
    tools: []
    # The runtime connector allow-list. Every id is one THIS package's own code reads a
    # caller-owned credential for, and nothing else is:
    #   anthropic  routes/career-settings-routes.js reads, saves and clears this row for the
    #              Career Settings card. Since 1.24.0 it is NOT brokered into the engine.
    #   firecrawl  routes/career-engine-dispatch.js reads exactly provider = 'firecrawl' out of
    #              oshal_connections and bin/oshal-jobhunter.js brokers it into the engine for
    #              deterministic web search.
    #              firecrawl has no platform connector spec today — its key is pasted on this
    #              app's own Settings card and stored as a provider row. It is named here so the
    #              allow-list covers every credential this package reads, and so a firecrawl
    #              connector, if one is ever published, is offerable here instead of filtered out.
    #   google     routes/career-digest.js:95 reads provider IN ('google','twilio'); :142 sends
    #   twilio     the digest through the user's own Google token and :165 texts through their
    #              own Twilio connection.
    # All four are OPTIONAL because the app installs and runs with none of them connected: the
    # digest reports itself unready, and the engine's model work runs on the career-bot node
    # under the user's configured brain (1.24.0 worker rail) — the anthropic row is still saved
    # and cleared by the Career Settings card, but the engine is no longer handed it.
    # LinkedIn is deliberately absent — the Profile Studio plans and approves a profile change
    # and then applies it through desktop browser control ("no LinkedIn edit API exists", see the
    # ribbon comment below), so it never reads a LinkedIn credential.
    connectors: [anthropic, firecrawl, google, twilio]

# Guests may browse read-only; every write is gated. (Was hardcoded Tier A in core —
# the literal left with this carve. Request only; grants come from the operator, D4.)
guestTier: readonly

# ─────────────────────────────────────────────────────────────────────────────
# BOT — ONE registered bot (2026-07-20 consolidation: career-advisor cb…0002 retired;
# career-hunter absorbs the advisor/chat duties). It registers from THIS manifest at
# activate and runs on its own `career-bot` node (container below).
# It never shells out: every engine action is a framework tool below, executed
# server-side from this package ({packageDir}/bin/oshal-jobhunter.js). Since 1.24.0 the
# engine does NO LLM work of its own: each model call it needs is sent through the worker
# rail (/api/career-hunter/engine) to THIS bot, cost-attributed to the run's owner.
# ─────────────────────────────────────────────────────────────────────────────
# ONE CONCIERGE (1.62.0; Roger, 2026-11-14: "i want one concierge for the entire app that can do everything that needs
# to be done in the app"). career-concierge is the one assistant a person meets in Career: on every page (the pane of
# tools/career-concierge.mjs names it and no other), through Jarvis's hand-off (the kernel's default is chatBot) and in
# the Intelligent Career group. It carries every person-facing tool below. career-hunter is the engine's worker: its
# turns are the engine's own (ranking and classifying jobs, drafting an application's documents) and its persona text
# is part of the scoring model identity the kernel computes (crates/oshald/src/package_bot_turn.rs model_identity),
# so that text is not edited for wording. The kernel has no switch that keeps a declared bot out of conversation
# while it runs the package's own turns (its facts reader is what lets it run them and also what lists it), so its
# role below says what it is, which is what Jarvis's catalog shows beside each bot's name.
chatBot: career-concierge

bots:
  - agentId: cb000000-0000-0000-0000-000000000005
    name: career-concierge
    persona: personas/career-concierge.yaml
    posture: inline
    role: "concierge: the one assistant a person talks to, for everything in Career"
    # A resume request reaches Career (and its Resume Studio) by these words, not by AI Office's "a word document".
    routingKeywords: [my resume, master resume, edit my resume, tighten my resume, update my resume]
    capabilities:
      - job-search
      - job-fit-advice
      - job-matching
      - application-status
      - application-strategy
      - resume-tailoring
      - work-history
      - career-settings
      - job-sources
      - recruiters
      - career-coaching
    selectorDescriptor: >-
      Select for anything the signed-in person asks of Intelligent Career: their matches and saved jobs, applications
      and their status, their main résumé and work history, interview preparation, their settings, the companies they
      want, their recruiters and the job market. It reads their real Career data and makes the change itself.
  - agentId: cb000000-0000-0000-0000-000000000001
    name: career-hunter
    persona: personas/career-hunter.yaml   # package copy — the one persona (worker + advisor)
    # ADR-093 Tier 2: this bot runs at its own dedicated node (the core compose ships the
    # `career-bot` service, profile `career-node`). Dispatch leaves the controller, so the
    # ADR-127 demo-CLI carve can run the operator's turns on the deployment's mounted CLI
    # login — inline on the controller, SEC-05 refuses every CLI and the bot was stuck on
    # the hosted-only ladder. With the node service not running, dispatch fails visibly
    # rather than silently degrading onto a runtime the declaration opted out of.
    container: career-bot
    port: 5000
    role: "engine worker: ranks and classifies jobs in Career's runs; not for conversation"
    capabilities:
      - job-scoring
      - job-classification
      - resume-generation
      - cover-letter-generation
  - agentId: cb000000-0000-0000-0000-000000000004
    name: career-submission-browser
    posture: node
    persona: Execute only an approved exact application form intent through browser-form-v1. No model inference, invented answers or automatic final-action retries.
    role: "browser worker: sends one approved application form; not for conversation"
    capabilities: [application-submission]

# Bot tools auto-discovered at load (wrap the CLI verbs + the surface HTML).

# ─────────────────────────────────────────────────────────────────────────────
# FRAMEWORK TOOLS — registered into the dynamic tool registry; their usageInstructions
# auto-inject into authorized bots' prompts, and the runtime runs them server-side
# (the bot CALLS the tool — it never shells out). Scoped to the signed-in user via the
# tool-executor (OSHAL_USER_SUB + .oshal-user-sub in the task workspace).
# ─────────────────────────────────────────────────────────────────────────────
tools:
  # The first eight names are what Jarvis's catalog lists for Career beside its description (the kernel shows eight
  # tool names, 200 characters), so they are the things a person asks for most. Every route tool of this application
  # goes to every bot of it; the native kernel shows a turn the twelve whose descriptions fit the message best, and
  # reads description and inputSchema only (never usageInstructions), so each description says what its tool is for.
  - name: career_database
    displayName: Find Jobs and My Matches
    type: builtin
    description: >-
      Read the signed-in user's career-hunter data — scored job matches, applied/generated
      pipeline counts, fresh high-fit roles, and a bounded profile — from their migrated jobs
      database. With search filters, find public employer openings by title/description/company, city/ZIP
      and radius, including useHome:true for this user's saved Career matching area.
      Supports per/page pagination. These searches are read-only and do not change preferences.
    executor:
      executorType: builtin
      builtinKey: package
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        q: { type: string, maxLength: 240, description: "Job title, description, skill, or employer keywords" }
        title: { type: string, maxLength: 240 }
        company: { type: string, maxLength: 240 }
        description: { type: string, maxLength: 240 }
        state: { type: string, maxLength: 2 }
        near: { type: string, maxLength: 160, description: 'US city and state or ZIP, for example Destin, FL' }
        useHome: { type: boolean, description: Use only this user's saved Career matching-area center as home }
        radiusMiles: { type: number, minimum: 1, maximum: 250 }
        remote: { type: string, enum: [any, remote, on-site] }
        days: { type: integer, minimum: 1, maximum: 365 }
        sort: { type: string, enum: [relevant, recent, posted, salary, title] }
        per: { type: integer, minimum: 1, maximum: 200 }
        page: { type: integer, minimum: 1, maximum: 2001 }
    outputSchema: { type: object, additionalProperties: true }
    defaultAuthMode: auto
    usageInstructions: >-
      To FIND jobs near a location, call career_database with near (US city/state or ZIP)
      and radiusMiles. "Within 50 miles of my home" means useHome:true,radiusMiles:50.
      Home references only this user's saved Career matching area; ask for a city/ZIP if missing.
      Search results are public openings, not resume fit scores. Most relevant puts primary keyword
      matches in the title first, then orders by first seen and stable id. A chosen sort is retained.
      When search reports a limited sample, say older description-only matches may be omitted.
      Return the searchUrl and use
      page+1 until exhausted/capped. Distances are approximate straight-line miles, not driving time.
      A temporary radius does not change saved preferences. No refresh or scoring is required.
      q combines its words; for alternative role categories, make separate searches rather
      than combining every category into one query. Cover each requested category and report
      when it has no results. For recent postings use days:7 and state that window. If a
      category has no recent results, older active listings can be checked and clearly dated.
      With {}, career_database returns a read-only JSON snapshot of THIS user's saved hunt.
      The snapshot reports source timestamps, a bounded profile, scored topMatches, recentApplied,
      pipeline and freshHighFit. It does not refresh or score jobs. topGaps explicitly reports
      unavailable until a native gap reader exists. If the saved source is unavailable, report
      that refusal; never invent matches or claim that a refresh ran.
      freshHighFit.count = saved AI-scored roles with fit ≥70/100 first seen in the last 3 days,
      within the saved matching area and remote preference, excluding dismissed jobs.
      Keyword-only matches do not count as AI assessments. topMatches = saved best-fit
      roles (title/company/fit/salary/status); recentApplied = the user's MOST RECENTLY
      APPLIED jobs (title/company/fit/salary_max/applied_at), newest first; pipeline =
      applied/generated/promoted counts. For ANY question about jobs the user APPLIED to / recent applications, answer
      ONLY from recentApplied — NEVER from topMatches (those are best-FIT roles, not
      applications). ALWAYS call this before answering questions about their jobs, matches,
      applications, fit, or gaps. The data is already scoped to the signed-in user — never
      request another user's data or infer missing details.
      source.profileModifiedAt is null because retained/exported file mtimes are not résumé
      content revision dates. Never infer résumé edits or score staleness from source-file
      modification timestamps. Not-revalidated proves neither currentness nor staleness.
      topMatches and recentApplied carry fitAssessment: kind distinguishes AI, keyword and
      absent scores; assessedAt and model describe saved provenance. currentness is not-revalidated:
      never describe these as newly scored or current after a resume/job change without a new
      scoring receipt. Give the assessment date when relevant. A fit score is not a hiring probability.
  - name: career_resume_patch
    displayName: Change My Résumé or Work History
    type: api
    description: >-
      Apply at most 20 small exact edits to the current main résumé revision with backup and audit: text, lists,
      a job's bullets (add, change, move, remove, or split a pasted block into one bullet per line), and a job itself
      (its title, employer, start or end month; add, move or remove it). Every edit is numbered as the work history
      was read. Its card stays good after another change is saved, as long as every job and bullet it names still
      reads the same; My résumé's document and the Work history page both show the result.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/resume/master-edit"}
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        revision: {type: string, minLength: 64, maxLength: 64}
        edits:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            properties:
              op: {type: string, enum: [set, add, remove, move, split]}
              field: {type: string, enum: [headline, summary, clearance, competencies, skills, experience, role]}
              index: {type: integer, minimum: 0}
              roleIndex: {type: integer, minimum: 0}
              roleTitle: {type: string, description: 'the job, by its exact title as read'}
              roleOrg: {type: string, description: 'its employer as read'}
              key: {type: string, enum: [title, org, start, end]}
              to: {type: integer, minimum: 0}
              before: {type: string, description: "the exact current text it changes or goes before; '' for an add at the end or a new job"}
              value: {type: string, description: 'the new text; several lines become one bullet per line'}
              summary: {type: string, minLength: 1, maxLength: 300}
            required: [op, field, before, summary]
      required: [revision, edits]
    usageInstructions: >-
      Propose it once the person asked for the change; the card is their approval. Carry the exact revision from
      career_resume_section. Number every edit against the work history as you read it: earlier edits on the same card
      never renumber later ones, and Career follows each job and bullet through them. Every edit carries summary, one
      line in the person's words saying the change (for example: Start of Software Engineer at Sample Bank: Jun 2014 to
      Sep 2013); the card shows it. A job is named by roleTitle, its exact title as you read it, roleOrg, its employer as
      you read it, and roleIndex, its position as you read it (0 is first); a job this card adds is named by its title
      and the index its add gave it. A bullet, competency or skill is named by its exact text in before (for a long one,
      at least its first 30 characters are enough); index is only where you read it. field experience edits a job's
      bullets: add puts the new bullet before the bullet whose text is in before, or at the end, in the order written,
      when before is empty; set replaces the bullet in before; remove takes it out; move takes to, its new position;
      split, with before and no value, turns a bullet holding several lines (a pasted draft) into one bullet per line.
      A value of several lines also becomes one bullet per line. field role changes a job: set with key (title, org,
      start or end) and before its exact current value (end '' is present); add with index (its position in the work
      history as the card's earlier edits leave it, 0 is first) and value the title, then set its org and start (and
      end) in the same card; remove or move (to) with before the job's exact title, no index. Text fields accept set
      only. Months read YYYY-MM. set/add need value; remove, move and split omit it. Keep the entire request below 12
      KiB. A card written before another change was saved still applies when everything it names reads as it did; when
      something it names changed, it is refused naming the change and the job, and you read again and propose it
      again. All edits apply or none. Qualifications are not changed here; never add an unverified claim,
      employer, title or date the person did not give.
  - name: career_jobs
    displayName: List My Jobs by Stage
    type: api
    description: >-
      List the signed-in person's own jobs in one stage, a page at a time: status saved (Saved), queue (Getting ready),
      dismissed (Removed), tracked (every job applied to), interview, offer or rejected (Closed); or matches 1 for the
      new matches Career picked. Fifteen jobs a page, each with its id, title, employer, place, fit and status. Read-only.
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/jobs?status={input.status}&matches={input.matches}&q={input.q}&sort={input.sort}&page={input.page}&per=15"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        status: {type: string, enum: [saved, queue, dismissed, tracked, interview, offer, rejected]}
        matches: {type: string, enum: ['1'], description: 'new matches; send no status with it'}
        q: {type: string, maxLength: 120, description: 'words in the title or employer'}
        sort: {type: string, enum: [ai, posted, recent, salary, company, applied]}
        page: {type: integer, minimum: 1, maximum: 2000, description: 'fifteen jobs a page; ask for the next page for more'}
  - name: career_job_update
    displayName: Save or Remove a Job
    type: api
    description: >-
      Change one job on the person's own board: favorite true saves it (and puts a removed job back), favorite false
      unsaves it, status dismissed removes it from their lists, status new puts it back, status deferred sets it aside.
      Sends nothing to an employer.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/jobs/{input.postingId}/status"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        postingId: {type: integer, minimum: 1}
        favorite: {type: boolean}
        status: {type: string, enum: [new, dismissed, deferred]}
      required: [postingId]
  - name: career_draft
    displayName: Draft Application
    type: api
    description: >-
      Start fit scoring and tailored resume/cover generation for one selected job using its employer details and your recorded experience. Returns an acknowledgement, not finished documents.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/jobs/{input.postingId}/generate"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        postingId: {type: integer, minimum: 1}
        guidance: {type: string, maxLength: 2000}
        experienceIds: {type: array, maxItems: 12, uniqueItems: true, items: {type: string, pattern: '^[a-zA-Z0-9-]{8,80}$'}}
        experienceRevision: {type: string, pattern: '^[a-f0-9]{64}$'}
      required: [postingId]
    usageInstructions: >-
      Other experience is opt-in per application. Read career_experience_bank to obtain IDs
      and its current revision; pass experienceIds and experienceRevision only for entries the user
      chose. Otherwise use the core resume alone.
      Call career_draft with input.postingId (the posting id from the ticket or
      career_database) to produce the tailored resume + cover letter for that ONE job.
      Read career_job after the acknowledgement and wait for its board.completedAt receipt.
      The board.requestId must equal the requestId returned by this draft acknowledgement.
      A different requestId is an older packet receipt: report that this preparation is still in progress.
      A receipt with phase ready means documents exist; phase failed gives the observed error.
      Link the saved resume and cover from /api/career-hunter/resume?id=POSTING_ID&kind=resume or kind=cover.
  - name: career_submission_review
    displayName: Review an Application to Send
    type: api
    description: Read one prepared job's exact documents, packet digest and applicant facts before proposing submission.
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/submission-review/{input.postingId}"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        postingId: {type: integer, minimum: 1}
      required: [postingId]
    usageInstructions: Read this first. Show the job, employer, document links and application facts to the person. Never infer missing answers or claim submission happened.
  - name: career_settings
    displayName: Read My Settings
    type: api
    description: >-
      Read the person's Career settings: the job titles they are looking for, remote only, their matching area (town
      and miles), nightly matching and when titles were last matched. Read-only.
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/title-profile/state"}
    defaultAuthMode: auto
    inputSchema: {type: object, additionalProperties: false, properties: {}}
  - name: career_recruiters
    displayName: List My Recruiters
    type: api
    description: >-
      List the recruiters and firms the person keeps on the Recruiters page, each with its id, contact, status,
      follow-up date, next action and notes; status narrows the list. Read-only.
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/recruiters?status={input.status}"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        status: {type: string, enum: [To contact, Contacted, Replied, Call scheduled, Submitted me, On radar, Dead]}
  # ── jobs, matches and saved jobs ──
  - name: career_job
    displayName: Read a job and its preparation progress
    type: api
    description: Read one job's employer details, fit, private status, saved star and document-generation receipt.
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/jobs/{input.postingId}"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties: {postingId: {type: integer, minimum: 1}}
      required: [postingId]
    usageInstructions: >-
      job.fit_assessment distinguishes a saved AI assessment from a keyword-only match.
      Use its score, date and model provenance; an old or date-unknown assessment is not
      evidence that the current resume and job were rechecked. Retired land_prob/high_win
      fields are null. Never turn a fit score into a probability of being hired.
  - name: career_save
    displayName: Save and star a job
    type: api
    description: Add one selected job to your private saved board and star it. If the person enabled saved-job preparation, it queues that preparation. Sends no application.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/jobs/{input.postingId}/status"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        postingId: {type: integer, minimum: 1}
        favorite: {type: boolean, enum: [true]}
      required: [postingId, favorite]
  - name: career_promote
    displayName: Promote a job to the document queue
    type: api
    description: Move one selected job to your submission preparation queue and star it. With saved-job preparation off, select optional experience and request document generation as the next step. If enabled by the person, preparation runs automatically to review or ready; nothing is submitted.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/jobs/{input.postingId}/status"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        postingId: {type: integer, minimum: 1}
        status: {type: string, enum: [promoted]}
      required: [postingId, status]
  - name: career_job_track
    displayName: Record What Happened With an Application
    cardText: Record this on your own board. Nothing is sent to an employer.
    type: api
    description: >-
      Record what the person says happened with a job they applied to themselves: status applied (I applied), interview
      (with interview_at when they give the time), offer, or rejected (closed). Their statement only; never a claim
      that Career sent anything.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/jobs/{input.postingId}/status"}
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        postingId: {type: integer, minimum: 1}
        status: {type: string, enum: [applied, interview, offer, rejected]}
        interview_at: {type: string, maxLength: 40, description: 'ISO time with its zone, only with status interview'}
      required: [postingId, status]
  - name: career_documents
    displayName: Read one job's generated application documents
    type: api
    description: Read the actual saved resume and cover-letter content for one prepared job.
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/resume/doc?id={input.postingId}"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties: {postingId: {type: integer, minimum: 1}}
      required: [postingId]
  - name: career_draft_oshal
    displayName: Draft with saved independent experience
    type: api
    description: >-
      Legacy opt-in for the original owner's saved independent portfolio. Prefer career_experience_bank and career_draft for explicit other experience selection.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/jobs/{input.postingId}/generate"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        postingId: {type: integer, minimum: 1}
        oshal: {type: boolean, enum: [true]}
      required: [postingId, oshal]
    usageInstructions: >-
      Call career_draft_oshal ONLY when the ticket or operator explicitly approved the
      OSHAL/open-source variant for input.postingId. When in doubt, use career_draft.
      Use career_job to check completion, requiring the same requestId as this acknowledgement.
  - name: career_score
    displayName: Score Fresh Postings
    type: api
    description: >-
      Start a bounded fit-score pass for the signed-in user's recent saved target titles,
      including teaching/support roles, using their saved area and remote preference.
      An accepted run is not a finished pass.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/run/score"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        limit: {type: integer, minimum: 1, maximum: 50}
    usageInstructions: >-
      Start only when asked to score fresh postings. limit defaults to 50 and must be 1..50.
      The seven-day window uses the employer posted date, or first-seen date if undated.
      On native installations a 202 acknowledgement means accepted and running, not scored.
      Read career_runs and match this exact runId to a succeeded receipt before reporting its
      scored/skipped counts. Missing status or no receipt is unconfirmed; never invent completion.
      Unavailable or changed scoring configuration is a failure; previously saved fits are not new results.
  - name: career_runs
    displayName: Career Run Status
    type: api
    description: Read the signed-in user's actual active engine runs and retained manual-score success receipt.
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/runs"}
    defaultAuthMode: auto
    inputSchema: {type: object, additionalProperties: false, properties: {}}
    usageInstructions: >-
      Match the exact acknowledged runId. A running entry means still active. Only a succeeded
      entry with saved scored/skipped counts confirms a manual score pass. Absence does not
      establish success, failure or cancellation. These are personal engine runs, not the shared corpus ingest.
  - name: career_run_cancel
    displayName: Stop Career Engine Run
    type: api
    description: Request cancellation of one original-owner Career engine run identified by its start acknowledgement.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/_runtime/runs/{input.runId}/cancel"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        runId: {type: string, format: uuid}
      required: [runId]
    usageInstructions: >-
      Use only when the person requests stopping a specific in-progress engine task. Use the
      exact runId from that task's acknowledgement or the person's explicit selection; never
      guess which task an unidentified active id belongs to. Check career_runs and require
      that exact active entry's canCancel true before requesting a stop. A 202 cancelling response is only
      a stop request. Read career_runs for that exact id's cancelled receipt before confirming
      it stopped. A finishing response means publication already began: check the saved result.
      Stopped-run receipts are bounded and expire after 30 minutes or a kernel restart; missing
      evidence is unconfirmed, never success. This does not withdraw an employer application.
  - name: career_refresh
    displayName: Refresh Jobs Database
    type: api
    description: >-
      Request the existing authenticated refresh route. Native shared-corpus ingestion is
      installation-managed and this route refuses a personal refresh request explicitly.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/run/refresh"}
    defaultAuthMode: auto
    inputSchema: {type: object, additionalProperties: false, properties: {}}
    usageInstructions: >-
      Use only for an explicit refresh request. A native 409 installation-managed response
      means this action did not start anything; say that the shared pull is managed by the
      installation schedule. A 403 means refused, not started. Only an actual started response
      confirms a start; none of these establish completion. Do not shell out or bypass a refusal.
  - name: career_refresh_status
    displayName: Refresh Status
    type: api
    description: >-
      Read actual native pull state, last successful publication and its recorded counts;
      legacy installations retain their own refresh and corpus observations.
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/run/refresh"}
    defaultAuthMode: auto
    inputSchema: {type: object, additionalProperties: false, properties: {}}
    usageInstructions: >-
      Read the actual returned facts. With observationAvailable true, status describes the native
      scheduler: running, idle, failed, disabled or unavailable. A running pull is not published.
      lastPublishedAt and lastPublication describe the previous successful publication, including
      its recorded job and source counts; they do not describe current partial progress. Compare
      lastStartedAt with lastCompletedAt before claiming the latest pull finished. running:null
      means unavailable. corpusFreshAt is not supplied by the native scheduler; never substitute
      publication time for a row-freshness scan. Missing counts are unknown, not zero. Source
      failures remain separate from successful overall publication. This read starts no pull.
  - name: career_market
    displayName: Read the Job Market
    type: api
    description: >-
      Read the Job market page's numbers: the person's own search counts and the open jobs Career can see by employer,
      state and pay band, for the last 7, 30 or 90 days. Read-only.
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/analytics?days={input.days}"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        days: {type: integer, enum: [7, 30, 90]}
  # ── prepare, send, submission status and interviews ──
  - name: career_submission_approve
    displayName: Approve this application for auto-submit
    cardText: Authorize one application using the reviewed job, exact resume, cover letter and applicant facts. Career may press up to 4 buttons on the employer's site, one at a time, and stops at anything it does not recognise.
    type: api
    description: Approve one reviewed job packet for automatic submission. This saves consent and input but does not start a browser yet.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/submission-queue"}
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        postingId: {type: integer, minimum: 1}
        packetDigest: {type: string, minLength: 64, maxLength: 64}
        approved: {type: boolean, enum: [true]}
      required: [postingId, packetDigest, approved]
    usageInstructions: Use only the exact packetDigest just read from career_submission_review. Wait for the person's approval card. After approval returns its intent id, bind it, then start it; never say it was submitted until its retained result confirms it.
  - name: career_submission_bind
    displayName: Bind approved submission ticket
    type: api
    description: Save the native ticket reference of an already specifically approved submission intent. This cannot run a browser.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/submission-queue/{input.id}/bind"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, minLength: 36, maxLength: 36}
      required: [id]
  - name: career_submission_start
    displayName: Start approved browser submission
    type: api
    description: Start the original ticket with the already approved immutable packet. Repeated calls recover the same dispatch and cannot create another final-submit intent.
    usageInstructions: >-
      If approval, binding or start was interrupted, read career_submissions first.
      Reuse its exact intent id. Sync an existing ticket before binding or starting;
      only queued, unexpired approvals may resume. Never create a replacement intent
      to recover a lost acknowledgement, and never restart an unknown outcome.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/submission-queue/{input.id}/start"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, minLength: 36, maxLength: 36}
      required: [id]
  - name: career_submissions
    displayName: Read submission activity
    type: api
    description: Read the caller's own durable submission intents, exact states, missing questions and retained confirmation references.
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/submission-queue"}
    defaultAuthMode: auto
    inputSchema: {type: object, additionalProperties: false, properties: {}}
  - name: career_submission_sync
    displayName: Reconcile submission outcome
    type: api
    description: Read the exact native result and retained employer confirmation into application status without opening or submitting the form again.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/submission-queue/{input.id}/sync"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, minLength: 36, maxLength: 36}
      required: [id]
  - name: career_submission_answers
    displayName: Save employer question answers
    cardText: Save your answers for this specific employer. A fresh review and approval are required before another submission attempt.
    type: api
    description: Save only the person's explicit answers to the questions returned by this exact submission. No browser is started and its previous approved input is immutable.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/submission-queue/{input.id}/answers"}
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        id: {type: string, minLength: 36, maxLength: 36}
        answers: {type: object}
      required: [id, answers]
  - name: career_submission_cancel
    displayName: Stop a Submission
    type: api
    description: >-
      Stop one approved submission that has not been sent, by its id from the submission activity. A submission the
      employer already received is not withdrawn by this.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/submission-queue/{input.id}/cancel"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, minLength: 36, maxLength: 36}
      required: [id]
  - name: career_interview
    displayName: Read interview preparation and practice
    type: api
    description: Read your saved preparation guide, exact experience references, practice answers and feedback for one job. Reports whether the job or profile changed.
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/interview/{input.postingId}"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        postingId: {type: integer, minimum: 1}
      required: [postingId]
    usageInstructions: Read the persisted result. Questions are suggested practice, not the employer's actual interview script. Never claim preparation succeeded while only a background run is acknowledged.
  - name: career_interview_prepare
    displayName: Prepare for this job's interview
    type: api
    description: Start a job-specific guide using recorded candidate experience. Preserves earlier practice and does not change the resume profile.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/interview/{input.postingId}/prepare"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        postingId: {type: integer, minimum: 1}
      required: [postingId]
    usageInstructions: After acknowledgement, read career_interview until its operation receipt completes. Show experience citations and gaps honestly, with the workspace link /api/career-hunter/interview?postingId=POSTING_ID.
  - name: career_interview_practice
    displayName: Save an interview practice answer and get feedback
    type: api
    description: Assess the person's own answer to one saved question. Saves private feedback without treating new claims as verified profile facts.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/interview/{input.postingId}/practice"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        postingId: {type: integer, minimum: 1}
        planId: {type: string, minLength: 32, maxLength: 32}
        questionId: {type: string, enum: [q1, q2, q3, q4, q5, q6, q7, q8, q9, q10]}
        answer: {type: string, minLength: 1, maxLength: 8000}
      required: [postingId, planId, questionId, answer]
    usageInstructions: Use the current planId and questionId from career_interview and the person's actual answer. Do not invent an answer or achievements on their behalf. Read the saved receipt and feedback after the background run completes.
  # ── the main résumé and work history (one record: My résumé's Word document and Work history both show it) ──
  # career_resume_read checks it without text, career_resume_section reads it a page at a time, career_resume_patch
  # (above) changes it by an approval card, career_resume_undo puts the latest change back. career_resume_save keeps the
  # whole-document save for a job's tailored packet. Each save has a backup and an audit line.
  - name: career_resume_read
    displayName: Check Saved Resume
    type: api
    description: >-
      Check the signed-in person's saved main résumé: whether it is there, its exact revision, the revision before its
      latest change (previousRevision, for Undo), how many jobs it holds and its section headings, without its text.
      My résumé's Word document and the Work history page show this same main résumé.
      Returns My résumé as the upload/edit destination when absent; unreadable is unavailable, never absent.
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/resume/doc?id=master&view=status"}
    defaultAuthMode: auto
    inputSchema: {type: object, additionalProperties: false, properties: {}}
    usageInstructions: >-
      Call once for résumé presence questions. Use career_resume_section for requested text or edits;
      do not read the whole résumé for a status question. My résumé's Word document is this main résumé: it is
      brought up to date when a Career page is open, and what is typed there is saved here. Never infer
      credentials or experience from the headings.
  - name: career_resume_section
    displayName: Read Resume Section
    type: api
    description: >-
      Read one bounded page of the signed-in user's master profile, including read-only qualifications. The overview
      lists each job with its title, employer, start and end month (end '' is present).
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/resume/master-section?field={input.field}&index={input.index}&offset={input.offset}"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        field: {type: string, enum: [overview, headline, summary, clearance, competencies, skills, experience, education, certifications, licenses]}
        index: {type: integer, minimum: 0, maximum: 9999}
        offset: {type: integer, minimum: 0, maximum: 1000000}
      required: [field, index, offset]
    usageInstructions: >-
      Start with field overview, index 0, offset 0. For experience use the role's zero-based
      index; other fields require index 0. Follow nextOffset until complete. List entries have
      zero-based indices and each comes whole, never cut; for a list, offset counts entries (the
      next entry to read), and for headline, summary and clearance it counts Unicode code points. Every page names its exact
      revision. If revisions differ, reread affected sections. Qualifications are source statements,
      including expired or pending status, and read-only here. A job's title, employer and months change only
      through career_resume_patch field role, against their exact current values.
  - name: career_resume_undo
    displayName: Undo the Last Résumé Change
    type: api
    description: >-
      Put the main résumé and work history back to how they were before the latest change. Send revision and restore:
      the revision and previousRevision the résumé status read answers. Works only while nothing changed after that
      change; the same Undo the page offers.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/resume/master-undo"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        revision: {type: string, minLength: 64, maxLength: 64}
        restore: {type: string, minLength: 64, maxLength: 64}
      required: [revision, restore]
  - name: career_resume_save
    displayName: Save Resume Edits
    type: api
    description: >-
      Apply an edited resume document — 'master' saves the durable career profile through the
      whitelist write-back (backup snapshot + audit), a numeric postingId saves that job
      packet's tailored resume AND re-renders its PDF.
    executor: { executorType: api, apiEndpoint: "POST /api/career-hunter/resume/save" }
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        postingId:
          type: string
          maxLength: 32
          description: "'master' for the durable profile, or the numeric posting id for a job packet"
        resume:
          type: object
          description: The FULL edited resume document; prefer revision-checked career_resume_patch after reading bounded sections
        cover:
          type: object
          description: The full saved cover document, required when editing a job packet.
      required: [postingId, resume]
    usageInstructions: >-
      Call career_resume_save ONLY after the user approves the specific edits. For a numeric
      postingId send the FULL saved resume AND cover documents; this saves and re-renders that
      packet's PDF. For master edits prefer career_resume_patch so large profiles need not be
      round-tripped; this legacy master route accepts whitelisted fields. Report only the
      changelog/paths actually returned. A job's title, employer and months on the main résumé
      are not changed by this save: change them with career_resume_patch field role (the Work
      history page).
  - name: career_resume_local_export
    displayName: Export Master Resume for Local Editing
    type: api
    description: >-
      Export the signed-in owner's master resume as an OpenDocument Text (.odt) archive and
      structured plain text so it can be opened locally in a bound word processor (such as
      LibreOffice Writer) with the sidecar docked.
    executor: { executorType: api, apiEndpoint: "GET /api/career-hunter/resume/local-export" }
    defaultAuthMode: auto
    inputSchema: { type: object, additionalProperties: false, properties: {} }
    usageInstructions: >-
      Use when the person asks to open and edit their master resume locally on their computer.
      Returns the .odt file (base64), structured text, and current master fields without mutating
      the career profile.
  - name: career_resume_local_import
    displayName: Import Locally Edited Master Resume
    type: api
    description: >-
      Import an edited local resume (.odt archive or structured text) back into the signed-in
      owner's master career profile through the whitelisted base-save path, saving a new version
      while keeping the previous snapshot in backups/ and enrichment_log.jsonl.
    executor: { executorType: api, apiEndpoint: "POST /api/career-hunter/resume/local-import" }
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          maxLength: 96000
          description: The edited structured resume text from the local document.
        odtBase64:
          type: string
          maxLength: 262144
          description: Optional base64-encoded OpenDocument Text (.odt) archive from the local document.
    usageInstructions: >-
      Use when the person says they are ready to import their locally edited resume back into
      Career. Saves the new whitelisted master fields and preserves the previous version in backups/.
      Job titles, employers and months are not changed by an import; they change on the Work history page.
  - name: career_master_record
    displayName: Read everything Career keeps
    type: api
    description: >-
      Read everything Career keeps for the signed-in person, in pages of at most 12 KB: the counts, every role with its
      numbered bullets and skills, skills by group, other experience, education and certifications, evidence, the
      dated history of what was added, the answers given on Improve my résumé and snapshot dates, and the link to the Download my data page.
      Read-only.
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/master-record?page={input.page}"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        page: {type: integer, minimum: 1, maximum: 9999}
      required: [page]
    usageInstructions: >-
      Start with page 1; it carries the counts and the page link. When the person asks for everything (every bullet,
      every skill, the history of what they added), answer with the counts and the link to the Download my data page,
      where Download saves it all as one file and Print is in More. Do not paste the whole record into the chat. Read
      further pages (nextPage) only for the part the person asks about and quote it as saved. If revision differs
      between pages, the record changed: start again from page 1.
  - name: career_experience_bank
    displayName: Read other experience
    type: api
    description: Read the original owner's recorded optional projects, other work and skills, with IDs for per-application selection. Does not edit the core resume.
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/experience-bank?summary=1"}
    defaultAuthMode: auto
    inputSchema: {type: object, additionalProperties: false, properties: {}}
  - name: career_experience_save
    displayName: Change My Other Experience
    cardText: Save this to your Other experience library. It is used in an application only when you choose it.
    type: api
    description: >-
      Add or change one entry of the person's Other experience library (a project, other work, volunteering or skills),
      or archive or restore one. Send expectedRevision from the library read. Only what the person stated.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/experience-bank"}
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        operation: {type: string, enum: [save, archive, restore]}
        expectedRevision: {type: string, maxLength: 80}
        id: {type: string, maxLength: 80, description: 'an existing entry, for a change, archive or restore'}
        entry:
          type: object
          additionalProperties: false
          properties:
            title: {type: string, maxLength: 160}
            kind: {type: string, enum: [project, work, volunteer, skills]}
            organization: {type: string, maxLength: 160}
            period: {type: string, maxLength: 100}
            facts: {type: string, maxLength: 8000}
            skills: {type: array, maxItems: 64, items: {type: string, maxLength: 100}}
          required: [title, kind, facts]
      required: [operation, expectedRevision]
  - name: career_strengthen
    displayName: Read What Would Improve My Résumé
    type: api
    description: >-
      Read the Improve my résumé page: the themes many of the person's matched jobs ask for that their résumé does not
      show, each with how many jobs, the question to answer and whether they answered it. Read-only.
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/strengthen"}
    defaultAuthMode: auto
    inputSchema: {type: object, additionalProperties: false, properties: {}}
  - name: career_strengthen_answer
    displayName: Add My Answer to My Résumé
    cardText: Add your own answer to your main résumé. Career turns it into bullets under the job it belongs to.
    type: api
    description: >-
      Save the person's own answer to one Improve my résumé theme (key from the themes read, response their words).
      Career works it into their main résumé in the background. Never write the answer for them.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/strengthen/answer"}
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        key: {type: string, minLength: 1, maxLength: 120}
        response: {type: string, minLength: 1, maxLength: 6000}
      required: [key, response]
  # ── settings ──
  - name: career_titles_set
    displayName: Set the Job Titles I Want
    type: api
    description: >-
      Replace the list of job titles Career matches for the person (Settings, What I'm looking for): the whole new
      list, at most 16 titles of 3 to 60 characters. Read the settings first and keep the titles they did not ask to drop.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/settings/title-profile"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        terms: {type: array, maxItems: 16, items: {type: string, minLength: 3, maxLength: 60}}
      required: [terms]
  - name: career_area_set
    displayName: Set My Matching Area
    type: api
    description: >-
      Set where Career matches jobs for the person: scope with near (a US town and state, or a ZIP), radiusMiles (1 to
      250) and includeRemote (true to also match remote jobs).
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/settings/title-profile"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: object
          additionalProperties: false
          properties:
            near: {type: string, minLength: 2, maxLength: 160}
            radiusMiles: {type: integer, minimum: 1, maximum: 250}
            includeRemote: {type: boolean}
          required: [near, radiusMiles, includeRemote]
      required: [scope]
  - name: career_remote_only_set
    displayName: Set Remote Only
    type: api
    description: Turn remote-only matching on or off for the person (remoteOnly true or false).
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/settings/remote-only"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        remoteOnly: {type: boolean}
      required: [remoteOnly]
  - name: career_preparation
    displayName: Read My Preparation Choice
    type: api
    description: >-
      Read whether Career prepares a résumé and cover letter by itself for each saved job (enabled), and whether it
      stops for the person's review or goes on to ready (mode). Read-only.
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/application-workflow"}
    defaultAuthMode: auto
    inputSchema: {type: object, additionalProperties: false, properties: {}}
  - name: career_preparation_set
    displayName: Change My Preparation Choice
    cardText: Turning this on starts preparing documents for every job you have saved, which uses your AI allowance.
    type: api
    description: >-
      Turn saved-job preparation on or off (enabled) and choose review or automatic (mode). Turning it on starts
      preparing documents for every saved job; nothing is sent to an employer.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/application-workflow"}
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        enabled: {type: boolean}
        mode: {type: string, enum: [review, automatic]}
      required: [enabled, mode]
  - name: career_digest
    displayName: Read My Email Updates Setting
    type: api
    description: >-
      Read the person's Email updates setting: whether the daily digest is on, by email or text, the phone number for
      text, when the last one went and whether each channel is ready. Read-only.
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/digest/state"}
    defaultAuthMode: auto
    inputSchema: {type: object, additionalProperties: false, properties: {}}
  - name: career_digest_set
    displayName: Change My Email Updates
    type: api
    description: >-
      Turn the daily digest on or off and choose email or text. All three values are saved together, so read the
      setting first and send enabled, channel and (for text) the phone number as they should be after the change.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/settings/digest"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        enabled: {type: boolean}
        channel: {type: string, enum: [email, text]}
        phone: {type: string, maxLength: 20, description: 'E.164, for example +15551234567; only for text'}
      required: [enabled, channel]
  # ── companies and job sources (the person's own Companies I want; the shared sources for an administrator) ──
  - name: career_targets
    displayName: List the Companies I Want
    type: api
    description: >-
      List the employers the person added on Settings, Companies I want: each with its id, link, the job board Career
      found, its state and how many jobs it has. Read-only.
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/settings/targets"}
    defaultAuthMode: auto
    inputSchema: {type: object, additionalProperties: false, properties: {}}
  - name: career_target_add
    displayName: Add a Company I Want
    cardText: Career checks this employer's careers page and, when it can read it, adds its jobs for everyone here.
    type: api
    description: >-
      Add one employer to the person's Companies I want by the link to its careers page or job board (url). Career
      checks that it can read the board; an unsupported one is refused with the reason.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/settings/targets"}
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        url: {type: string, minLength: 4, maxLength: 512}
      required: [url]
  - name: career_target_remove
    displayName: Remove a Company I Want
    type: api
    description: Remove one employer from the person's Companies I want, by its id from the list.
    executor: {executorType: api, apiEndpoint: "DELETE /api/career-hunter/settings/targets/{input.id}"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id: {type: integer, minimum: 1}
      required: [id]
  - name: career_companies
    displayName: Find an Employer in the Job Sources
    type: api
    description: >-
      For a job source administrator: find employers in Career's shared job sources by name (q), each with its id, job
      board, how many open jobs it has and how its last pull went. Read-only.
    executor: {executorType: api, apiEndpoint: "GET /api/career-hunter/companies-admin/list?search=1&limit=15&q={input.q}"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        q: {type: string, minLength: 2, maxLength: 120, description: 'part of the employer name; at most fifteen employers come back'}
  - name: career_company_add
    displayName: Add an Employer to the Job Sources
    cardText: Add this employer to the shared job sources. The next nightly pull reads its jobs for everyone here.
    type: api
    description: >-
      For a job source administrator: add an employer to the shared job sources by its name and the link to its
      careers page or job board (url). The next nightly pull reads it.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/companies-admin/add"}
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 2, maxLength: 120}
        url: {type: string, minLength: 8, maxLength: 512}
      required: [name, url]
  - name: career_company_remove
    displayName: Remove an Employer from the Job Sources
    cardText: Remove this employer from the shared job sources at the next nightly pull. Put back undoes it.
    type: api
    description: >-
      For a job source administrator: remove one employer (companyId from the search) from the shared job sources at
      the next nightly pull.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/companies-admin/remove"}
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        companyId: {type: integer, minimum: 1}
      required: [companyId]
  - name: career_company_restore
    displayName: Put an Employer Back in the Job Sources
    cardText: Put this employer back in the shared job sources at the next nightly pull.
    type: api
    description: >-
      For a job source administrator: put a removed employer (companyId from the search) back in the shared job
      sources at the next nightly pull.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/companies-admin/restore"}
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        companyId: {type: integer, minimum: 1}
      required: [companyId]
  - name: career_company_board
    displayName: Set an Employer's Careers Link
    cardText: Point this employer at this job board. The next nightly pull reads its jobs from there.
    type: api
    description: >-
      For a job source administrator: set the job board or careers page link (board) Career reads one employer
      (companyId from the search) from; the next nightly pull applies it.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/companies-admin/seturl"}
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        companyId: {type: integer, minimum: 1}
        board: {type: string, minLength: 8, maxLength: 512}
      required: [companyId, board]
  # ── recruiters ──
  - name: career_recruiter_add
    displayName: Add a Recruiter
    type: api
    description: >-
      Add a recruiter or firm to the person's Recruiters list: firm (required), contact_name, contact_link, website,
      bucket and status. Only what the person gave; it starts as To contact.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/recruiters"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        firm: {type: string, minLength: 1, maxLength: 200}
        contact_name: {type: string, maxLength: 200}
        contact_link: {type: string, maxLength: 500}
        website: {type: string, maxLength: 500}
        bucket: {type: string, maxLength: 80}
        status: {type: string, enum: [To contact, Contacted, Replied, Call scheduled, Submitted me, On radar, Dead]}
      required: [firm]
  - name: career_recruiter_update
    displayName: Update a Recruiter
    type: api
    description: >-
      Change one recruiter on the person's list (id from the list): status, date_contacted, followup_date, next_action,
      notes, contact_name, contact_role, contact_link, channel, website, bucket or firm. Send only what changes.
    executor: {executorType: api, apiEndpoint: "POST /api/career-hunter/recruiters/{input.id}"}
    defaultAuthMode: auto
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id: {type: integer, minimum: 1}
        status: {type: string, enum: [To contact, Contacted, Replied, Call scheduled, Submitted me, On radar, Dead]}
        date_contacted: {type: string, maxLength: 20, description: 'YYYY-MM-DD'}
        followup_date: {type: string, maxLength: 20, description: 'YYYY-MM-DD'}
        next_action: {type: string, maxLength: 300}
        notes: {type: string, maxLength: 2000}
        contact_name: {type: string, maxLength: 200}
        contact_role: {type: string, maxLength: 200}
        contact_link: {type: string, maxLength: 500}
        channel: {type: string, maxLength: 80}
        website: {type: string, maxLength: 500}
        bucket: {type: string, maxLength: 80}
        firm: {type: string, maxLength: 200}
      required: [id]
  - name: career_recruiter_remove
    displayName: Remove a Recruiter
    cardText: Remove this recruiter and their notes from your list. This cannot be undone.
    type: api
    description: Remove one recruiter (id from the list) and their notes from the person's Recruiters list.
    executor: {executorType: api, apiEndpoint: "DELETE /api/career-hunter/recruiters/{input.id}"}
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        id: {type: integer, minimum: 1}
      required: [id]

# ─────────────────────────────────────────────────────────────────────────────
# UI SURFACES
#
# The `top` tray is SECTIONED by the optional `group:` label (see
# docs/ribbon-groups-adr-085-addendum.md). The cockpit ribbon buckets top items by that
# label, preserving group order by FIRST APPEARANCE and item order within a group; the
# entries below are listed in the order they render so the manifest reads like the rail.
#   (no group) Mobile — the pinned front door, deliberately the ungrouped lead band
#   Job Search  find jobs · my jobs · submissions · recruiters · job market — find work and watch it move
#   Resume      improve it · my résumé · other experience · download my data — the artifact you send
#   Presence    LinkedIn profile · portrait studio — how you look to a recruiter
# The labels are the names a person reads (1.55.0, tests/career-page-names.test.mjs); `group:` is the cockpit ribbon's band.
#
# `section: bottom` items are FORCED ungrouped by the renderer (they are the pinned base
# tray, already visually divided), so they carry no `group:` — adding one is a silent no-op:
#   approvals (bottom) — the human-in-the-loop application ticket queue, near Settings
#   companies (bottom) — admin-only corpus/ATS administration
#   settings  (bottom) — Anthropic click-to-connect + Firecrawl API-key field + cron toggles
#
# A deployment whose core predates the `group:` key drops it during profile synthesis and
# renders the same flat ribbon it renders today — degrade-to-flat, never a broken rail.
# ─────────────────────────────────────────────────────────────────────────────
ui:
  static:
    # Home leads: the first screen of Career as its own application. Every Career page loads the page frame
    # (tools/career-frame.js), which draws Career's top bar from this list as the person's own profile gives it.
    - toolName: career-home
      label: Home
      icon: codicon codicon-home
      iframeUrl: /api/career-hunter/home
      section: top
    - toolName: career-review
      label: Career Review
      icon: codicon codicon-briefcase
      iframeUrl: /api/career-hunter/review
      section: top
    # ── Job Search ──────────────────────────────────────────────────────────
    # Find jobs leads the group on purpose: it is the one screen in it that works
    # before anything is set up. My jobs below needs an indexed résumé to say
    # anything at all — this searches the shared corpus and never mentions a match.
    - toolName: career-search
      label: Find jobs
      icon: codicon codicon-search
      iframeUrl: /api/career-hunter/search-ui
      section: top
      group: Job Search
    # This one page (career-job-lists.html) is two sections of Career's own bar since 1.55.0
    # (tools/career-frame.js): My jobs is its stages New matches, Saved, Getting ready (?view=queue)
    # and Removed; Applications is Applied (?view=status), Interviewing, Offer and Closed. The row of
    # stages on the page shows the side it is on. To approve is not a stage: the jobs Career picked
    # lead Saved, and /approvals and ?view=approve still answer and open them there.
    # Prepare & submit, Application status, Approvals and Mobile left the menu in 1.48.1 (UX audit
    # 2026-11-06); their routes and addresses still answer. To bring one back, restore its entry
    # from git history (career-hunter 1.47.11).
    - toolName: career-board
      label: My jobs
      icon: codicon codicon-briefcase
      iframeUrl: /api/career-hunter/board-native
      section: top
      group: Job Search
    # Still a tile and still served, so a host can open it. Career's own bar lists it in no menu:
    # Applications links to it while something is being sent from the person's computer.
    - toolName: career-submission-activity
      label: Submission activity
      icon: codicon codicon-history
      iframeUrl: /api/career-hunter/submissions
      section: top
      group: Activity
    - toolName: career-recruiters
      label: Recruiters
      icon: codicon codicon-organization
      iframeUrl: /api/career-hunter/recruiters-ui
      section: top
      group: Connections
    # Job market (was Insights) is search ANALYTICS (pipeline funnel, open roles by company/state, salary
    # bands) — it reads the hunt, so it belongs with the hunt, not with the resume.
    - toolName: career-insights
      label: Job market
      icon: codicon codicon-graph-line
      iframeUrl: /api/career-hunter/insights-ui
      section: top
      group: Review
    # ── Resume ──────────────────────────────────────────────────────────────
    - toolName: career-strengthen
      label: Improve my résumé
      icon: codicon codicon-sparkle
      iframeUrl: /api/career-hunter/strengthen-ui
      section: top
      group: Resume
    - toolName: career-resume-studio
      label: My résumé
      icon: codicon codicon-edit
      iframeUrl: /api/career-hunter/resume-studio
      section: top
      group: Resume
    # Work history (1.61.0): the jobs the résumé is built from, each with its title, employer, months and bullets.
    - toolName: career-work-history
      label: Work history
      icon: codicon codicon-briefcase
      iframeUrl: /api/career-hunter/work-history
      section: top
      group: Resume
    - toolName: career-experience-library
      label: Other experience
      icon: codicon codicon-library
      iframeUrl: /api/career-hunter/experience-library
      section: top
      group: Resume
    # Download my data (the Master record of 1.51.0): everything Career keeps for the person, read-only, with Download and Print.
    - toolName: career-master-record
      label: Download my data
      icon: codicon codicon-book
      iframeUrl: /api/career-hunter/master-record-ui
      section: top
      group: Resume
    # ── Presence — how a recruiter sees you before they read the resume ──────
    # LinkedIn profile (was Profile Studio) — LinkedIn profile customization (plan -> approve -> desktop
    # browser-control apply via linkedin-profile-operator; no LinkedIn edit API exists).
    - toolName: career-profile-studio
      label: LinkedIn profile
      icon: codicon codicon-account
      iframeUrl: /api/career-hunter/profile-studio
      section: top
      group: Presence
    # Portrait Studio — a CROSS-APP tile into the separate portrait-studio package
    # (declared under dependencies.apps). The headshot is part of the same presence
    # story as the LinkedIn profile, so it is reachable without leaving the hunt.
    # NOTE: the ribbon derives a view's guest tier from the iframeUrl's app segment, so
    # this tile inherits portrait-studio's tier, NOT this package's guestTier: readonly.
    # The toolName is career-SCOPED on purpose: registerDynamicToolUI/deregisterDynamicToolUI
    # key the shared tile registry by toolName alone, so reusing the bare `portrait-studio`
    # name would let this package's activation repoint — and its unload DEREGISTER —
    # portrait-studio's own ribbon tile.
    - toolName: career-portrait-studio
      label: Portrait Studio
      icon: codicon codicon-device-camera
      iframeUrl: /api/portrait-studio/app
      section: top
      group: Presence
    # Admin only (server gates on CAREER_HUNTER_ADMIN_SUBS): view every company + its detected
    # board, paste a real careers URL to re-detect the ATS + scrape. Writes the SHARED corpus.
    - toolName: career-companies
      label: Companies
      icon: codicon codicon-globe
      iframeUrl: /api/career-hunter/companies-admin
      section: bottom
    - toolName: career-settings
      label: Settings
      icon: codicon codicon-settings-gear
      iframeUrl: /api/career-hunter/settings
      section: bottom

# ─────────────────────────────────────────────────────────────────────────────
# SURFACE — the surface-bridge op allow-list. FAIL-CLOSED: without this block the
# cockpit relay forwards NOTHING for this app, which is why the floating assistant
# could not see Resume Studio at all.
#   context  Resume Studio publishes WHICH resume is open + a digest of it, so the
#            floating Jarvis stops being blind to the screen the operator is on.
#   custom   Jarvis drives an edit back as {name:'resume_action', data:<action>} —
#            the SAME whitelisted action vocabulary the concierge already emits, so
#            it lands through the studio's existing applyAction() with no second
#            edit path to keep in sync.
#   notify   confirm an applied edit in the surface, not only in the chat bubble.
# Deliberately NOT declared: set_field/set_content (the sheet is a rendered preview,
# not a form — an edit must go through applyAction so it stays a real document
# mutation) and navigate (nothing here needs to move the ribbon).
# ─────────────────────────────────────────────────────────────────────────────
# Native egress keeps the original person's Gmail credential inside the kernel.
egress:
  - host: '*.myworkdayjobs.com'
  - host: gmail.googleapis.com
    credential: { connector: gmail, header: authorization, prefix: "Bearer " }

schedules:
  - id: career-application-updates
    cron: "7,22,37,52 * * * *"
    timezone: America/Chicago
    runsAs: user
    target: service-route
    route: /api/career-hunter/jobs/updates/check
    method: POST
    timeoutSeconds: 60
    # The original-person route resolves the declared Gmail egress credential on each check.
    # Native dependency-bound connection scheduling is unavailable; no credential is captured here.
    description: Read your submission mailbox for exact employer and job-title matches on submitted applications; retain acknowledgements and update interview, offer or rejection status. Sends no email and submits no applications.
  - id: career-nightly-matches
    cron: "*/30 * * * *"
    timezone: America/Chicago
    runsAs: user
    target: service-route
    route: /api/career-hunter/title-pass/run-now
    method: POST
    timeoutSeconds: 60
    description: After a new shared job corpus is published, keyword-match the last 14 days to your resume and AI-score up to 50 new or changed target-title jobs from the last 7 days using your saved matching area. Checks every 30 minutes; runs once per evening publication cycle. Creates no application submissions.
    body: { nightly: true }
  - id: career-source-maintenance
    cron: "15 7 * * *"
    timezone: America/Chicago
    runsAs: user
    target: service-route
    route: /api/career-hunter/companies-admin/maintenance-report
    method: POST
    timeoutSeconds: 60
    report: true
    # The original activated source administrator receives owner-bound decision tickets; no schedule is activated here.
    description: For Career administrators. Each morning, tell you what last night's source maintenance newly left for a person. Prepare or reconcile your own human approval tickets for current source decisions, and tell you what last night left for a person or developer. A confirmed decision waits for the next pull; this job never writes the shared corpus or approves a ticket.

surface:
  ops: [context, custom, notify]

# ─────────────────────────────────────────────────────────────────────────────
# ROUTES — mounted conditionally by the loader.
# ─────────────────────────────────────────────────────────────────────────────
routes:
  - module: lib/career-interview-routes.js
    factory: createCareerInterviewRoutes
    mountPath: /api/career-hunter
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false
  - module: lib/career-submission-routes.js
    factory: createCareerSubmissionRoutes
    mountPath: /api/career-hunter
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false
  - module: lib/native-career-read.js
    factory: createNativeCareerReadRoutes
    mountPath: /api/career-hunter
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false
  - module: routes/review.js
    factory: createReviewRoutes
    mountPath: /api/career-hunter
    auth: service-or-oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/career-hunter/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/career-hunter/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/career-hunter-routes.js
    factory: createCareerHunterRoutes
    mountPath: /api/career-hunter
    auth: service-or-oidc   # what server.ts ACTUALLY mounts (ADR-085 D2; drifted to oidc here when the mount gained the service path — the standing guard caught it)
    requiresAuth: true
    requiresContext: true

  # The Career worker rail (1.24.0; signed since 1.25.1): the engine's only model path, on the
  # kernel's signed-package-callbacks rail. The rail admits POST only and runs the package's
  # callbackVerifier before any other code: every completion must be signed with the per-run
  # grant the runner minted for that engine child (grant id, owner, timestamp, single-use nonce
  # and an HMAC over the method, path and body), and the verifier returns only the grant's
  # recorded owner subject and issuer. The kernel refreshes that owner and requires the
  # authorization.yaml permission bound to POST /complete (career.execute) before the handler
  # runs as them. No browser session, service secret or asserted subject header reaches the
  # handler. Its own mountPath because the loader forbids mixing auth modes on one mount.
  - module: routes/career-worker-rail.js
    factory: createCareerWorkerRailRoutes
    mountPath: /api/career-hunter/engine
    auth: public
    callbackVerifier: createCareerRailCallbackVerifier
    requiresContext: true
    requiresAi: true

# ─────────────────────────────────────────────────────────────────────────────
# DATABASE MIGRATIONS — applied idempotently on first load.
# ─────────────────────────────────────────────────────────────────────────────
  - module: routes/career-graph-routes.js
    factory: createCareerGraphRoutes
    mountPath: /api/career-hunter/graph
    auth: oidc

  # Storage-cutover observation status (1.25.0): operator-only, read-only view over the archive
  # engine/sync/observe_cutover.py writes. The handler also refuses anonymous (401) and
  # non-operator (403) callers itself, before it reads anything.
  - module: routes/career-cutover-status.js
    factory: createCareerCutoverStatusRoutes
    mountPath: /api/career-hunter/cutover
    auth: oidc
    requiresAuth: true
    requiresAi: false

# Package copies are idempotent (safe on DBs where the core migrations already ran).
# NEW career-rls.sql closes the 060 gap: career_digest_settings + career_score_settings
# shipped without owner RLS.
# 095-career-corpus.sql moves the jobs corpus INTO the swarm database, which is what
# makes this a normal install rather than a 1.9 GB SQLite file per user on a volume:
# ONE shared career_postings table ingested once for everyone, with each user's match
# scores and application progression in FORCE-RLS tables keyed by user_sub.
migrations:
  - migrations/031-career-hunter.sql
  - migrations/077-career-digest.sql
  - migrations/082-career-title-profile.sql
  - migrations/090-career-rls.sql
  - migrations/091-career-automation.sql
  # 100: each user's own scrape-target list (FORCE RLS, same shape as 091). Order-independent —
  # it creates only its own table — so it sits beside its sibling per-user setting tables.
  - migrations/100-career-user-targets.sql
  # 104: the per-user remote-only matching preference. Adds one defaulted column to the
  # 082 settings table, so it is order-independent beside its sibling per-user settings.
  - migrations/104-career-remote-only.sql
  - migrations/095-career-corpus.sql
  - migrations/096-career-corpus-complete.sql
  # 097 adds the `postings` / `companies` compatibility VIEWS. The engine's ~53
  # `FROM postings` and ~68 `FROM companies` reads resolved to a per-connection SQLite
  # TEMP view (temp shadows main and every ATTACHed schema); Postgres has no equivalent,
  # so the shadow becomes a real view and RLS on the per-user tables — not a WHERE clause
  # — scopes it to the acting user. Must run AFTER 096: it reads apply_active /
  # confirmation_path / hq / gsearched / referral and career_company_reputation.
  - migrations/097-career-postings-view.sql
  # 098 does for the PER-USER tables what 097 did for the shared corpus: compatibility
  # VIEWS named recruiter_firms / gap_themes / interview_assessments, so the engine's
  # existing reads work verbatim. Like 097 they are security_invoker, so FORCE RLS on the
  # underlying tables scopes them to the caller. Must run AFTER 096, which creates those
  # three tables.
  - migrations/098-career-peruser-views.sql
  # 099 gives interview_bank.py's three tables a Postgres home. They were missed by 095/096
  # because that module builds its own schema with executescript() instead of going through
  # db.py, so it never appeared in the SQLite dumps those migrations were derived from.
  # Shared (no RLS): a question bank is the same for everyone and posting tags are derived
  # deterministically from the posting itself. Must run AFTER 095 — career_posting_tags
  # carries an FK to career_postings.
  - migrations/099-career-interview-bank.sql
  - migrations/100-career-application-provenance.sql
  - migrations/101-career-apply-claim-lease.sql
  - migrations/102-career-apply-run-binding.sql
  - migrations/103-career-interview-source-identity.sql
  - migrations/105-career-home-evidence-indexes.sql
  # 107: the verified issuer of the owner who saved an automation opt-in, so the nightly chain can
  # mint that owner's callback grants for the signed engine rail (1.25.1). Nullable: a row saved
  # before 1.25.1 has none and the cron skips its model passes until the owner saves again.
  - migrations/107-career-automation-owner-issuer.sql
  # 106: the reverse-synchronization outbox (BACKEND-CUTOVER.md). Operator-only FORCE-RLS change
  # log + checkpoint, and transaction-local AFTER ROW capture triggers on the eight mutable tables
  # above that have a SQLite counterpart. Must run AFTER 095-103 (it attaches to their tables).
  # Inert while SQLite is authoritative: nothing but the loader writes those tables, and the
  # loader's operator replay session is not captured.
  - migrations/106-career-store-change-log.sql
  - migrations/native/001-career-hunter.sql
  # 108 needs the native table created above; keep the same index on both backends.
  - migrations/108-career-generated-queue-index.sql
  # 109 records the private score's semantic input identity without changing public job views.
  - migrations/109-career-score-freshness.sql
# The native kernel applies 031, 077, 082 and the native file above in place of 090-107, whose DO blocks, GRANTs and triggers are PostgreSQL-only.
nativeMigrations:
  - id: migrations/090-career-rls.sql
    native: skip
    reason: "It only enables row security and installs owner-or-operator policies through a DO loop, which is PostgreSQL-only; the native per-person scope and its owner-field check keep each person's rows their own."
  - id: migrations/091-career-automation.sql
    native: skip
    reason: "Its table is in migrations/native/001-career-hunter.sql; its RLS DO loop is PostgreSQL-only."
  - id: migrations/100-career-user-targets.sql
    native: skip
    reason: "Its table and indexes are in migrations/native/001-career-hunter.sql; its RLS DO loop is PostgreSQL-only."
  - id: migrations/104-career-remote-only.sql
    native: skip
    reason: "Its column is in migrations/native/001-career-hunter.sql; its column comment (two adjacent string literals) is documentation."
  - id: migrations/095-career-corpus.sql
    native: skip
    reason: "Its tables and indexes are in migrations/native/001-career-hunter.sql; its RLS DO loop and REVOKE statements are PostgreSQL-only."
  - id: migrations/096-career-corpus-complete.sql
    native: skip
    reason: "Its columns, tables and indexes are in migrations/native/001-career-hunter.sql; its RLS DO loop and REVOKE are PostgreSQL-only."
  - id: migrations/097-career-postings-view.sql
    native: skip
    reason: "Its compatibility views are in migrations/native/001-career-hunter.sql; its relkind guard and GRANT are PostgreSQL-only."
  - id: migrations/098-career-peruser-views.sql
    native: skip
    reason: "Its compatibility views are in migrations/native/001-career-hunter.sql; its relkind guard and GRANT are PostgreSQL-only."
  - id: migrations/099-career-interview-bank.sql
    native: skip
    reason: "Its tables, indexes and views are in migrations/native/001-career-hunter.sql; its app-role GRANT and relkind DO guards are PostgreSQL-only."
  - id: migrations/100-career-application-provenance.sql
    native: skip
    reason: "Its columns, backfills, source CHECKs (as DROP IF EXISTS + ADD) and postings view are in migrations/native/001-career-hunter.sql; its pg_constraint DO guard is PostgreSQL-only."
  - id: migrations/101-career-apply-claim-lease.sql
    native: skip
    reason: "Its column, CHECK and index are in migrations/native/001-career-hunter.sql; its pg_constraint DO guard and comment are PostgreSQL-only."
  - id: migrations/102-career-apply-run-binding.sql
    native: skip
    reason: "Its columns, CHECK and unique indexes are in migrations/native/001-career-hunter.sql; its pg_constraint DO guard and comments are PostgreSQL-only."
  - id: migrations/103-career-interview-source-identity.sql
    native: skip
    reason: "Its column, CHECK and unique index are in migrations/native/001-career-hunter.sql; its pg_constraint DO guard and comment are PostgreSQL-only."
  - id: migrations/105-career-home-evidence-indexes.sql
    native: skip
    reason: "Its indexes are in migrations/native/001-career-hunter.sql, after the tables they index."
  - id: migrations/107-career-automation-owner-issuer.sql
    native: skip
    reason: "Its column is in migrations/native/001-career-hunter.sql, after the table it alters."
  - id: migrations/106-career-store-change-log.sql
    native: skip
    reason: "Its change-log and checkpoint tables are in migrations/native/001-career-hunter.sql; its operator-only RLS policies, GRANTs and PL/pgSQL capture triggers belong to the PostgreSQL reverse-sync outbox and are PostgreSQL-only."

# ─────────────────────────────────────────────────────────────────────────────
# WORKFLOW — career-application tickets route to the career-hunter worker bot.
# Single-bot (no external reviewer): the persona self-gates. Human approval gates
# live in the Approvals surface (approval_required -> approved -> in_process_build).
# ─────────────────────────────────────────────────────────────────────────────
ticketType: career-application
workflow:
  name: Career Application Pipeline
  pipeline: career-application
  workerBot: career-hunter

workflows:
  - id: career-hunter:career-source-decision
    ticketType: career-source-decision
    name: Source archive decision
    phases:
      - {name: archive-source-decision, action: complete, approval: {approver: admin}}
  - id: career-hunter:career-submission
    ticketType: career-submission
    name: Approved Career Submission
    phases:
      - {name: submit-approved-application, bot: career-submission-browser}
      - {name: complete, action: complete}

# ─────────────────────────────────────────────────────────────────────────────
# THEMING
# ─────────────────────────────────────────────────────────────────────────────
# (sharedCss dropped at carve: surfaces load career-hunter.css via /api/career-hunter/static/,
#  served from this package tools/ — the field would point outside the package.)

# ─────────────────────────────────────────────────────────────────────────────
# RIBBON VISIBILITY — keep the native `tickets` view available (it is the queue);
# hide the rest of the framework chrome. `settings` always stays.
# ─────────────────────────────────────────────────────────────────────────────
ribbon:
  hideFrameworkItems:
    - tickets
    - chat
    - calendar
    - addressbook
    - dashboard
    - logs
    - operations
  defaultView: career-home

summary:
  path: /api/career-hunter/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items

integrations:
  offers:
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
    - id: prepare-social
      label: Prepare a networking draft
      targetApp: social
      targetAction: prepare-post
      contextType: communication-brief
      version: 1
  accepts:
    - id: prepare-brief
      contextType: research-brief
      version: 1
      surface: career-review
      fields:
        - title
        - notes
        - sourceUrl

# Addresses of this application that are plain published files. The kernel answers a GET of one itself, from
# the files it holds for the installed version, after the same sign-in and permission checks as the route,
# with no call into the package. Any other name still goes to the route. The list is the files this
# application's own pages, scripts and styles refer to at these addresses.
staticFiles:
  - route: /api/career-hunter/static/:file
    folder: tools
    files:
      - career-accounts.js
      - career-application.js
      - career-change-bar.js
      - career-concierge.css
      - career-concierge.mjs
      - career-frame.css
      - career-frame.js
      - career-hunter.css
      - career-job-actions.js
      - career-job-feedback.js
      - career-job-lists.js
      - career-journey.css
      - career-kit.css
      - career-leaflet.css
      - career-leaflet.js
      - career-local-sources.json
      - career-mark.svg
      - career-navigation.js
      - career-resume-office.js
      - career-search-map.js
      - career-search-memory.js
      - career-settings-support.js
      - career-stages.js
      - career-status-line.js
      - career-submit.js
      - career-theme.css
      - career-today.js
      - career-work-history-page.js
      - career-work-history.js
      - career-workflow-settings.js
      - mic.js
