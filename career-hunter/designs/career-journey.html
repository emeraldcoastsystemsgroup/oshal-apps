<div id="career-journey-redesign" aria-label="Intelligent Career process walkthrough">
  <header class="cc-chrome">
    <strong><i data-lucide="layers" aria-hidden="true"></i> Intelligent Career</strong>
    <span class="cc-caption">Design walkthrough · fictional jobs · no applications sent</span>
  </header>
  <nav class="cc-nav" aria-label="Career workspace"></nav>
  <main class="cc-main"></main>
  <p class="cc-message" role="status" aria-live="polite"></p>
</div>
<style>
#career-journey-redesign{--cc-bg:light-dark(#f7f8fc,#101018);--cc-surface:light-dark(#fff,#1a1a27);--cc-fg:light-dark(#20283b,#f0f0f8);--cc-secondary:light-dark(#586377,#b6b6ca);--cc-border:light-dark(#dce0ea,#39394f);--cc-accent:light-dark(#5452c6,#aaa1ff);--cc-onaccent:light-dark(#fff,#16112e);--cc-soft:light-dark(#edecfc,#2c2843);--cc-success:light-dark(#17634c,#8ed6b7);--cc-danger:light-dark(#a93436,#ffadae);font:14px/1.5 'Segoe UI',system-ui,sans-serif;color:var(--cc-fg);background:var(--cc-bg);border:1px solid var(--cc-border);border-radius:12px;overflow:hidden;text-align:left}
#career-journey-redesign *{box-sizing:border-box}
#career-journey-redesign .cc-chrome{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 24px;border-bottom:1px solid var(--cc-border);background:var(--cc-surface);padding-right:100px}
#career-journey-redesign .cc-chrome strong{display:flex;gap:10px;align-items:center;font-size:17px}
#career-journey-redesign .cc-caption,#career-journey-redesign small{font-size:12px;color:var(--cc-secondary)}
#career-journey-redesign .cc-nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 24px;background:var(--cc-surface);border-bottom:1px solid var(--cc-border)}
#career-journey-redesign button,#career-journey-redesign input,#career-journey-redesign select,#career-journey-redesign textarea{font:inherit}
#career-journey-redesign button{cursor:pointer}
#career-journey-redesign button:disabled{cursor:default;opacity:.5}
#career-journey-redesign .cc-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 14px;border:1px solid var(--cc-border);border-radius:7px;background:var(--cc-surface);color:var(--cc-fg);font-weight:500;text-decoration:none}
#career-journey-redesign .cc-primary{background:var(--cc-accent);border-color:var(--cc-accent);color:var(--cc-onaccent)}
#career-journey-redesign .cc-quiet{background:transparent;border-color:transparent;color:var(--cc-secondary)}
#career-journey-redesign .cc-nav button[aria-current=page]{background:var(--cc-soft);color:var(--cc-accent)}
#career-journey-redesign .cc-main{padding:26px;min-height:540px}
#career-journey-redesign h1{font-size:25px;line-height:1.2;margin:0 0 8px;font-weight:600}
#career-journey-redesign h2{font-size:19px;line-height:1.3;margin:0 0 12px;font-weight:600}
#career-journey-redesign h3{font-size:16px;margin:0 0 8px;font-weight:600}
#career-journey-redesign p{margin:6px 0 14px}
#career-journey-redesign .cc-muted{color:var(--cc-secondary)}
#career-journey-redesign .cc-heading{display:flex;align-items:start;justify-content:space-between;gap:20px;margin-bottom:20px}
#career-journey-redesign .cc-filters{display:grid;grid-template-columns:2fr 1.2fr .8fr 1fr;gap:12px;margin:20px 0}
#career-journey-redesign label{display:block;font-size:12px;font-weight:500}
#career-journey-redesign input:not([type=checkbox]),#career-journey-redesign select,#career-journey-redesign textarea{display:block;width:100%;min-width:0;border:1px solid var(--cc-border);border-radius:7px;padding:10px;background:var(--cc-surface);color:var(--cc-fg);margin-top:6px;font-size:14px}
#career-journey-redesign .cc-wide{grid-column:1/-1}
#career-journey-redesign .cc-inline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#career-journey-redesign .cc-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 0;border-top:1px solid var(--cc-border)}
#career-journey-redesign .cc-row .cc-body{flex:1;min-width:0}
#career-journey-redesign .cc-row p{margin-bottom:6px}
#career-journey-redesign .cc-title{padding:0;border:0;color:var(--cc-fg);background:transparent;text-align:left;font-size:17px;font-weight:600}
#career-journey-redesign .cc-title:hover{text-decoration:underline}
#career-journey-redesign .cc-state{display:inline-flex;align-items:center;gap:7px;color:var(--cc-success);font-size:12px;font-weight:500}
#career-journey-redesign .cc-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:24px;padding-top:18px;border-top:1px solid var(--cc-border)}
#career-journey-redesign .cc-paper{background:var(--cc-surface);border:1px solid var(--cc-border);padding:26px;border-radius:8px;min-height:240px;margin:18px 0}
#career-journey-redesign .cc-split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(200px,.8fr);gap:28px;align-items:start}
#career-journey-redesign .cc-facts{display:grid;grid-template-columns:130px 1fr;gap:12px;margin:18px 0}
#career-journey-redesign dt{color:var(--cc-secondary)}#career-journey-redesign dd{margin:0;overflow-wrap:anywhere}
#career-journey-redesign .cc-back{padding-left:0;margin-bottom:14px}
#career-journey-redesign .cc-steps{display:flex;gap:24px;list-style:none;padding:0;margin:22px 0;border-bottom:1px solid var(--cc-border);flex-wrap:wrap}
#career-journey-redesign .cc-steps li{padding:10px 0;color:var(--cc-secondary)}
#career-journey-redesign .cc-steps li[aria-current=step]{color:var(--cc-accent);border-bottom:3px solid var(--cc-accent);font-weight:600}
#career-journey-redesign .cc-choice{display:flex;gap:10px;align-items:start;margin:16px 0;font-size:14px;font-weight:400}
#career-journey-redesign .cc-choice input{margin-top:4px}
#career-journey-redesign .cc-choice span{display:block}
#career-journey-redesign .cc-note{border-left:3px solid var(--cc-accent);padding:10px 14px;background:var(--cc-soft);margin:18px 0}
#career-journey-redesign .cc-error{border-left-color:var(--cc-danger)}
#career-journey-redesign .cc-document-tabs button[aria-pressed=true]{background:var(--cc-soft);color:var(--cc-accent);border-color:var(--cc-accent)}
#career-journey-redesign .cc-activity{padding-left:20px}
#career-journey-redesign .cc-activity li{margin:16px 0}
#career-journey-redesign .cc-empty{text-align:center;padding:48px 16px}
#career-journey-redesign .cc-message{padding:0 26px;color:var(--cc-success)}
#career-journey-redesign .cc-message:empty{display:none}
#career-journey-redesign .cc-scenario{font-size:12px;color:var(--cc-secondary)}
@media(max-width:650px){#career-journey-redesign .cc-main{padding:18px}#career-journey-redesign .cc-chrome{padding:16px 100px 16px 18px}#career-journey-redesign .cc-nav{padding:8px}#career-journey-redesign .cc-nav button{flex:1 1 40%;font-size:12px}#career-journey-redesign .cc-filters{grid-template-columns:1fr 1fr}#career-journey-redesign .cc-heading,#career-journey-redesign .cc-row{align-items:stretch;flex-direction:column}#career-journey-redesign .cc-row .cc-inline{justify-content:flex-start}#career-journey-redesign .cc-split{grid-template-columns:1fr}#career-journey-redesign .cc-paper{padding:18px}#career-journey-redesign .cc-steps{gap:15px;font-size:12px}#career-journey-redesign .cc-facts{grid-template-columns:1fr;gap:4px}#career-journey-redesign dd{margin-bottom:10px}}
@media(pointer:coarse){#career-journey-redesign button{min-height:44px}#career-journey-redesign input:not([type=checkbox]),#career-journey-redesign select,#career-journey-redesign textarea{font-size:16px}}
</style>
<script>
(()=>{
  const root=document.getElementById('career-journey-redesign'),main=root.querySelector('main'),nav=root.querySelector('nav'),message=root.querySelector('.cc-message');
  const jobs=[
    {id:'developer',title:'Software Developer',company:'Sample software company',location:'Fully remote · US',remote:true,miles:0,pay:'$95,000–$135,000 / year',min:95000,max:135000,basis:'year',description:'Build and maintain business software in Python and TypeScript. Work with a small team on useful customer features, automated tests and service reliability.',requirements:['Python or TypeScript development','Practical experience maintaining production software','Collaboration with a small engineering team']},
    {id:'teaching',title:'Adjunct Instructor · Computer Science',company:'Sample college',location:'Local campus · 18 miles from home',remote:false,miles:18,pay:'$2,200–$4,500 / course · illustrative estimate',min:2200,max:4500,basis:'course',description:'Teach an introductory programming course. Prepare lessons, provide feedback and support adult learners. A relevant master’s degree is required.',requirements:['Relevant master’s degree','Clear explanations and practical programming examples','Availability for the stated teaching schedule']},
    {id:'architect',title:'Junior Solutions Architect',company:'Sample engineering company',location:'Local office · 46 miles from home',remote:false,miles:46,pay:'$78,000–$110,000 / year',min:78000,max:110000,basis:'year',description:'Help a delivery team plan small cloud integrations, document customer needs and implement working prototypes with senior engineers.',requirements:['Software and cloud fundamentals','Ability to turn requirements into working software','On-site collaboration within commuting range']}
  ];
  const defaults=()=>({version:1,page:'search',selected:'developer',step:'tailor',tab:'resume',editing:false,returnPage:'search',scenario:'Normal path',q:'',radius:'70',remote:false,basis:'year',payMin:'',payMax:'',saved:{},hidden:[],rules:[]});
  let s=defaults(),timer=0;
  const restore=value=>{const data=value?.privateContent;if(data?.version===1&&typeof data.saved==='object'){s={...defaults(),...data};if(!jobs.some(j=>j.id===s.selected))s.selected='developer';}};
  restore(window.openai?.widgetState);
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const job=()=>jobs.find(j=>j.id===s.selected),draft=()=>s.saved[s.selected];
  function persist(){window.openai?.setWidgetState?.({modelContent:{page:s.page,step:s.step,scenario:s.scenario,savedJobs:Object.keys(s.saved),selectedJob:s.selected},privateContent:s})?.catch(()=>{});}
  function say(text){message.textContent=text;}
  function go(page,id){if(page==='posting')s.returnPage=s.page==='board'?'board':'search';if(id)s.selected=id;s.page=page;s.editing=false;render();persist();}
  const button=(text,action,primary=false,extra='')=>`<button type="button" class="cc-button ${primary?'cc-primary':''}" data-action="${action}" ${extra}>${text}</button>`;
  const status=d=>({saved:'★ Saved',draft:'Draft · not submitted',ready:'Documents ready',submitting:'Submitting',needs_you:'Needs your answers',unknown:'Outcome needs checking',submitted:'Submitted · sample confirmation',interview:'Interview invitation'})[d?.state]||'Not saved';
  function meta(j){return `<p class="cc-muted">${esc(j.company)} · ${esc(j.location)}</p><p>${esc(j.pay)}</p>`;}
  function save(id){s.saved[id]||={state:'saved',guidance:'',experiences:[],revision:0,resumeText:'',coverText:'',events:[]};persist();}
  function empty(title,text,cta){return `<div class="cc-empty"><h2>${title}</h2><p class="cc-muted">${text}</p>${cta}</div>`;}
  function render(){
    const pending=Object.values(s.saved).filter(d=>['draft','ready','submitting','needs_you','unknown'].includes(d.state)).length,tracked=Object.values(s.saved).filter(d=>['submitted','interview'].includes(d.state)).length;
    nav.innerHTML=[['search','1 · Search jobs'],['board','2 · Job Board'],['queue',`3 · Prepare & submit${pending?' · '+pending:''}`],['status',`4 · Application status${tracked?' · '+tracked:''}`]].map(([key,label])=>button(label,'nav:'+key,false,`aria-current="${s.page===key||s.page==='application'&&key==='queue'||s.page==='posting'&&key===s.returnPage||s.page==='submitted-documents'&&key==='status'?'page':'false'}"`)).join('');
    main.innerHTML=s.page==='search'?search():s.page==='posting'?posting():s.page==='board'?board():s.page==='queue'?queue():s.page==='status'?tracking():s.page==='submitted-documents'?submittedDocuments():application();
    if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});
  }
  function search(){
    const words=s.q.toLowerCase().trim().split(/\s+/).filter(Boolean),rows=jobs.filter(j=>!s.hidden.includes(j.id)&&!s.rules.some(rule=>rule.kind==='company'?j.company===rule.value:rule.kind==='title'?j.title.toLowerCase().includes(rule.value.toLowerCase()):rule.kind==='location'?j.location===rule.value:false)&&words.every(w=>(j.title+' '+j.company+' '+j.description).toLowerCase().includes(w))&&(!s.remote||j.remote)&&(j.remote||j.miles<=Number(s.radius||70))&&(!(s.payMin||s.payMax)||j.basis===s.basis&&(!s.payMin||j.max>=Number(s.payMin))&&(!s.payMax||j.min<=Number(s.payMax))));
    return `<h1>Find a job you want to do.</h1><p class="cc-muted">Search every opening. Save the ones worth pursuing to your Job Board.</p>
    <form data-search><div class="cc-filters"><label class="cc-wide">Job title, company or description<input name="q" value="${esc(s.q)}" placeholder="Developer, adjunct, architect…" type="search"></label><label>Location<input value="Home location · sample" readonly aria-label="Sample home location"></label><label>Within<select name="radius">${[25,50,70,100].map(n=>`<option ${s.radius===String(n)?'selected':''} value="${n}">${n} miles</option>`).join('')}</select></label><label>Pay basis<select name="basis"><option value="year" ${s.basis==='year'?'selected':''}>Annual</option><option value="course" ${s.basis==='course'?'selected':''}>Per course</option></select></label><label>Work arrangement<select name="remote"><option value="any" ${!s.remote?'selected':''}>Local + remote</option><option value="remote" ${s.remote?'selected':''}>Fully remote only</option></select></label><label>Pay from<input name="payMin" type="number" min="0" value="${esc(s.payMin)}" placeholder="Any minimum"></label><label>Pay to<input name="payMax" type="number" min="0" value="${esc(s.payMax)}" placeholder="Any maximum"></label></div><div class="cc-inline">${button('Search jobs','search',true)}<small>Fictional openings for this walkthrough</small></div></form>${s.hidden.length||s.rules.length?`<details style="margin-top:16px"><summary>Hidden preferences (${s.hidden.length+s.rules.length})</summary><p>Openings matching your saved preferences are hidden.</p>${button('Restore hidden jobs','restore-hidden')}</details>`:''}
    <div style="margin-top:24px">${rows.length?rows.map(j=>`<article class="cc-row"><div class="cc-body"><button class="cc-title" data-action="posting:${j.id}">${esc(j.title)}</button>${meta(j)}<small>${s.saved[j.id]?'★ Saved on your Job Board':'Fit assessment available when saved'}</small></div><div class="cc-inline">${button(s.saved[j.id]?'View saved job':'★ Save to Job Board',(s.saved[j.id]?'saved:':'save:')+j.id,true)}${button('Not interested','hide:'+j.id)}</div></article>`).join(''):empty('No matching sample jobs','Try a wider radius, different words or a different pay basis.',button('Clear filters','clear',true))}</div>`;
  }
  function posting(){const j=job();return `${button(s.returnPage==='board'?'← Job Board':'← Search results','nav:'+s.returnPage)}<div class="cc-heading"><div><h1>${esc(j.title)}</h1>${meta(j)}</div>${button(s.saved[j.id]?'View saved job':'★ Save to Job Board',(s.saved[j.id]?'saved:':'save:')+j.id,true)}</div><div class="cc-split"><section><h2>The work</h2><p>${esc(j.description)}</p><h3>Requirements</h3><ul>${j.requirements.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></section><aside><h3>Fit with your experience</h3><p class="cc-muted">${s.saved[j.id]?'Sample assessment: relevant technical experience is identified; unverified employer requirements remain gaps. The full assessment includes its date and supporting evidence.':'Save this job to assess it against your résumé without generating application documents.'}</p><small>Employer details and source dates stay with the job.</small></aside></div>`;}
  function board(){const rows=jobs.filter(j=>s.saved[j.id]);return `<h1>Your Job Board</h1><p class="cc-muted">Your shortlist. Saving a job stars it here; recommended matches stay in Search.</p>${rows.length?rows.map(j=>{const d=s.saved[j.id];return `<article class="cc-row"><div class="cc-body"><button class="cc-title" data-action="posting:${j.id}">★ ${esc(j.title)}</button>${meta(j)}<span class="cc-state">${status(d)}</span></div>${button(['submitted','interview'].includes(d.state)?'View application':d.state==='saved'?'Prepare application':'Continue application',(['submitted','interview'].includes(d.state)?'track:':'prepare:')+j.id,true)}</article>`;}).join(''):empty('Save a job worth pursuing','Your Job Board is a shortlist, with a clear next action for each job.',button('Find jobs','nav:search',true))}`;}
  function queue(){const rows=jobs.filter(j=>s.saved[j.id]&&['draft','ready','submitting','needs_you','unknown'].includes(s.saved[j.id].state));return `<h1>Prepare & submit</h1><p class="cc-muted">Open an application to continue where you left off.</p>${rows.length?rows.map(j=>`<article class="cc-row"><div class="cc-body"><h3>${esc(j.title)}</h3><p class="cc-muted">${esc(j.company)}</p><span class="cc-state">${status(s.saved[j.id])}</span></div>${button(s.saved[j.id].state==='needs_you'?'Answer employer questions':'Continue application','prepare:'+j.id,true)}</article>`).join(''):empty('No applications in preparation','Choose a saved job when you are ready to prepare its application.',button('Open Job Board','nav:board',true))}`;}
  function application(){const j=job(),d=draft();if(!d)return empty('Choose a saved job','Applications start from your Job Board.',button('Open Job Board','nav:board',true));
    const active=['tailor','documents','review'].includes(s.step)?s.step:'review';
    const content=d.state==='submitting'||d.state==='needs_you'||d.state==='unknown'?execution(j,d):d.state==='submitted'||d.state==='interview'?result(j,d):active==='tailor'?tailor(j,d):active==='documents'?documents(j,d):review(j,d);
    return `${button('← Preparation list','nav:queue')}<div class="cc-heading"><div><h1>${esc(j.title)}</h1><p class="cc-muted">${esc(j.company)} · ${esc(j.location)}</p></div><span class="cc-state">${status(d)}</span></div>${!['submitting','needs_you','unknown','submitted','interview'].includes(d.state)?`<ol class="cc-steps" aria-label="Prepare this application">${[['tailor','1 · Tailor'],['documents','2 · Review documents'],['review','3 · Submit']].map(([key,label])=>`<li ${key===active?'aria-current="step"':''}>${label}</li>`).join('')}</ol>`:''}${content}`;
  }
  function tailor(j,d){return `<h2>What should this application emphasize?</h2><p class="cc-muted">Your core résumé supplies your verified work history. Add relevant experience for this job.</p><div class="cc-split"><section><label>Tailoring notes<textarea name="guidance" rows="4" placeholder="What do you want this employer to understand?">${esc(d.guidance)}</textarea></label><h3 style="margin-top:24px">Additional experience · optional</h3>${[['product','Independent product work','Projects and engineering work outside your core résumé.'],['teaching','Teaching & mentoring','Recorded workshops, instruction or mentoring experience.']].map(([id,title,description])=>`<label class="cc-choice"><input type="checkbox" name="experience" value="${id}" ${d.experiences.includes(id)?'checked':''}><span>${title}<br><small>${description}</small></span></label>`).join('')}</section><aside><h3>What the employer needs</h3><ul>${j.requirements.map(r=>`<li>${esc(r)}</li>`).join('')}</ul><small>Core résumé and additional experience are managed separately in your résumé library.</small></aside></div>${d.failed?'<div class="cc-note cc-error" role="alert">Generation failed. Your notes and any previous documents are still saved. Retry before continuing.</div>':''}<div class="cc-footer"><small>Draft stays with this job.</small>${button(d.failed?'Retry generation':'Generate résumé & cover letter','generate',true)}</div>`;}
  function documentText(j,d,kind){return kind==='cover'?`Dear hiring team,\n\nI am applying for ${j.title}.\n\n${d.guidance||'Connect relevant, verified experience to this employer’s requirements.'}\n\n${d.experiences.length?'Selected additional experience: '+d.experiences.map(x=>x==='product'?'Independent product work':'Teaching & mentoring').join(', ')+'.':''}\n\n[Illustrative cover letter — not a real application]`:`YOUR NAME\n${j.title}\n\nRELEVANT EXPERIENCE\n• Evidence from your core résumé, tailored to this role.\n${d.experiences.includes('product')?'• Relevant independent product work.\n':''}${d.experiences.includes('teaching')?'• Recorded teaching and mentoring experience.\n':''}\n${d.guidance?'TAILORING DIRECTION\n'+d.guidance+'\n\n':''}[Illustrative résumé — not a real application]`;}
  function documents(j,d){if(!d.revision){s.step='tailor';return tailor(j,d);}const kind=s.tab==='cover'?'cover':'resume',text=d[kind+'Text']||documentText(j,d,kind);return `<div class="cc-heading"><div><h2>Review the documents for this job</h2><small>Version ${d.revision} · core résumé${d.experiences.length?' + '+d.experiences.length+' additional experience selection(s)':''}</small></div><div class="cc-inline">${button('Download PDF','download')}${button(s.editing?'Save document edit':'Edit document',s.editing?'save-edit':'edit')}</div></div><div class="cc-inline cc-document-tabs">${button('Résumé','tab:resume',false,`aria-pressed="${kind==='resume'}"`)}${button('Cover letter','tab:cover',false,`aria-pressed="${kind==='cover'}"`)}</div>${s.editing?`<label style="margin-top:18px">${kind==='cover'?'Cover letter':'Résumé'} text<textarea name="documentEdit" rows="11">${esc(text)}</textarea></label>`:`<article class="cc-paper" aria-label="${kind==='cover'?'Cover letter':'Résumé'} preview"><div style="white-space:pre-wrap">${esc(text)}</div></article>`}<div class="cc-footer">${button('← Change tailoring','step:tailor')}${button('Continue to submission review','step:review',true,s.editing?'disabled':'')}</div>`;}
  function review(j,d){return `<h2>Approve this application</h2><p class="cc-muted">The employer receives this job’s reviewed documents and application details.</p><dl class="cc-facts"><dt>Employer</dt><dd>${esc(j.company)}</dd><dt>Position</dt><dd>${esc(j.title)}</dd><dt>Documents</dt><dd>Résumé + cover letter · version ${d.revision}</dd><dt>Experience</dt><dd>Core résumé${d.experiences.length?' + '+d.experiences.map(x=>x==='product'?'Independent product work':'Teaching & mentoring').join(', '):''}</dd><dt>Applicant details</dt><dd>Contact information from your saved profile · reviewable here</dd>${d.answer?`<dt>Employer answer</dt><dd>${esc(d.answer)}</dd>`:''}<dt>Submission browser</dt><dd>${s.scenario==='Worker unavailable'?'Not connected':'Ready'}</dd></dl>${s.scenario==='Worker unavailable'?'<div class="cc-note" role="status">Your application is ready. Connect the submission browser to send it; your documents and preparation are saved.</div>':'<div class="cc-note">Approval applies to these exact documents. Employer questions will return here for your answers.</div>'}<div class="cc-footer">${button('← Review documents','step:documents')}${s.scenario==='Worker unavailable'?button('Connect submission browser','connect-demo',true):button('Approve & submit','submit',true)}</div>`;}
  function execution(j,d){if(d.state==='submitting')return `<h2>Submitting your application</h2><p class="cc-muted">Opening the employer form with your approved documents.</p><ol class="cc-activity"><li>Documents and application details approved</li><li>Submission browser working</li><li>Waiting for the employer’s confirmation</li></ol><span class="cc-state">No action needed</span>`;
    if(d.state==='needs_you')return `<h2>The employer needs one answer</h2><p class="cc-muted">The application is not submitted yet. Answer the question, then review before sending.</p><label>When could you start?<textarea name="answer" rows="2" placeholder="Enter your answer">${esc(d.answer||'')}</textarea></label><div class="cc-footer"><small>Your answer applies only to this job.</small>${button('Review answer & submit','review-answer',true)}</div>`;
    return `<h2>Check the submission outcome</h2><div class="cc-note cc-error">The browser lost confirmation after the final action. We cannot tell whether the employer received the application.</div><p>Check the employer’s application history or confirmation email before deciding what happens next.</p><dl class="cc-facts"><dt>Approved documents</dt><dd>Version ${d.revision} retained</dd><dt>Latest action</dt><dd>Final submission attempted · outcome uncertain</dd></dl><div class="cc-footer"><small>Another submission is held to prevent a duplicate.</small>${button('Review retained activity','activity',true)}</div>`;
  }
  function result(j,d){return `<h2>Application submitted</h2><p class="cc-muted">A sample employer confirmation is attached to this walkthrough record.</p><ol class="cc-activity"><li>Résumé and cover letter version ${d.revision} approved</li><li>Employer confirmation retained</li><li>Application added to status tracking</li><li>Submission email monitored for employer updates</li></ol><div class="cc-footer"><small>Interview preparation belongs in the application record.</small>${button('View application status','track:'+j.id,true)}</div>`;}
  function tracking(){const rows=jobs.filter(j=>s.saved[j.id]&&['submitted','interview'].includes(s.saved[j.id].state));if(!rows.length)return `<h1>Application status</h1>${empty('No submitted applications yet','Prepared documents and approved work remain in Prepare & submit until the employer outcome is known.',button('Open preparation list','nav:queue',true))}`;const selected=rows.find(j=>j.id===s.selected)||rows[0],d=s.saved[selected.id];return `<div class="cc-heading"><div><h1>Application status</h1><p class="cc-muted">Confirmed submissions, employer updates and follow-ups.</p></div><span class="cc-state">Email monitoring active · sample</span></div><section><h2>${esc(selected.title)}</h2><p class="cc-muted">${esc(selected.company)} · ${esc(selected.location)}</p><span class="cc-state">${status(d)}</span><ol class="cc-activity"><li>Application submitted · sample confirmation retained</li>${d.state==='interview'?'<li>Employer email: interview invitation · sample update</li>':'<li>Watching the connected submission mailbox for updates</li>'}</ol><div class="cc-inline">${button('View submitted documents','submitted-docs:'+selected.id)}${button('Prepare for interview','interview:'+selected.id)}</div></section>${rows.length>1?`<details style="margin-top:28px"><summary>Other applications</summary>${rows.filter(j=>j.id!==selected.id).map(j=>`<article class="cc-row"><div class="cc-body"><button class="cc-title" data-action="track:${j.id}">${esc(j.title)}</button><p class="cc-muted">${esc(j.company)}</p><span class="cc-state">${status(s.saved[j.id])}</span></div></article>`).join('')}</details>`:''}`;}
  function submittedDocuments(){const j=job(),d=draft(),kind=s.tab==='cover'?'cover':'resume';return `${button('← Application status','nav:status')}<div class="cc-heading" style="margin-top:18px"><div><h1>Submitted documents</h1><p>${esc(j.title)} · ${esc(j.company)} · version ${d.revision}</p></div>${button('Download PDF','download')}</div><div class="cc-inline cc-document-tabs">${button('Résumé','readonly-tab:resume',false,`aria-pressed="${kind==='resume'}"`)}${button('Cover letter','readonly-tab:cover',false,`aria-pressed="${kind==='cover'}"`)}</div><article class="cc-paper" style="white-space:pre-wrap">${esc(d[kind+'Text']||documentText(j,d,kind))}</article><small>Read-only record of the submitted version.</small>`;}
  function hideDialog(id){const j=jobs.find(x=>x.id===id);main.innerHTML=`<h1>Not interested in this job?</h1><p>${esc(j.title)} · ${esc(j.company)}</p><label>Hide<select name="hideKind"><option value="job">Only this opening</option><option value="company">Jobs from this company</option><option value="title">Jobs with a title phrase</option><option value="location">Jobs in this location</option></select></label><label style="margin-top:16px">Title phrase, if selected<input name="hideValue" value="${esc(j.title)}"></label><div class="cc-footer">${button('Cancel','nav:search')}${button('Save preference','confirm-hide:'+id,true)}</div>`;}
  function startSubmission(){const d=draft();d.state='submitting';d.events.push('Approved exact version '+d.revision);render();persist();clearTimeout(timer);timer=setTimeout(()=>{if(d.state!=='submitting')return;d.state=s.scenario==='Employer questions'&&!d.answer?'needs_you':s.scenario==='Uncertain outcome'?'unknown':s.scenario==='Interview invitation'?'interview':'submitted';d.events.push(d.state);if(['submitted','interview'].includes(d.state)&&s.page==='application'){s.page='status';say('Sample application recorded. Employer email updates appear here.');}render();persist();},700);}
  root.addEventListener('input',event=>{const d=draft();if(event.target.name==='guidance'&&d){d.guidance=event.target.value.slice(0,2000);if(d.revision){d.dirty=true;d.state='draft';}}if(event.target.name==='answer'&&d)d.answer=event.target.value.slice(0,2000);if(['guidance','answer'].includes(event.target.name))persist();});
  root.addEventListener('change',event=>{if(event.target.name==='experience'&&draft()){if(draft().revision){draft().dirty=true;draft().state='draft';}draft().experiences=Array.from(main.querySelectorAll('[name=experience]:checked')).map(e=>e.value);persist();}});
  function run(action){const [type,id]=action.split(':');say('');
    if(type==='nav')return go(id);
    if(type==='posting')return go('posting',id);
    if(type==='save'){save(id);render();return say('★ Saved to your Job Board. Continue searching, or open your shortlist.');}
    if(type==='saved'){s.selected=id;return go('board');}
    if(type==='prepare'){s.selected=id;save(id);const d=draft();if(d.state==='saved')d.state='draft';s.step=d.revision&&!d.dirty?'documents':'tailor';return go('application');}
    if(type==='track')return go('status',id);
    if(type==='step'){if(id!=='tailor'&&(!draft()?.revision||draft()?.dirty))return;s.step=id;s.editing=false;render();return persist();}
    if(type==='tab'){if(s.editing){say('Save the current edit before changing documents.');return;}s.tab=id;render();return persist();}
    if(type==='generate'){const d=draft();d.guidance=main.querySelector('[name=guidance]')?.value||d.guidance;if(s.scenario==='Generation failure'&&!d.failed){d.failed=true;render();persist();return;}d.failed=false;d.dirty=false;d.revision++;d.state='ready';d.resumeText=documentText(job(),d,'resume');d.coverText=documentText(job(),d,'cover');s.step='documents';render();return persist();}
    if(type==='edit'){s.editing=true;render();return;}
    if(type==='save-edit'){draft()[(s.tab==='cover'?'cover':'resume')+'Text']=main.querySelector('[name=documentEdit]').value.slice(0,5000);draft().revision++;s.editing=false;render();return persist();}
    if(type==='submit'){if(draft()?.revision&&!draft()?.dirty&&s.scenario!=='Worker unavailable')startSubmission();return;}
    if(type==='connect-demo'){s.scenario='Normal path';render();persist();return say('Sample submission browser connected.');}
    if(type==='review-answer'){if(!draft().answer?.trim())return say('Enter an answer before continuing.');s.step='review';draft().state='ready';render();return persist();}
    if(type==='activity'){say('Retained activity: approved packet → employer form → final action attempted → confirmation unavailable. Submission remains held.');return;}
    if(type==='submitted-docs')return go('submitted-documents',id);
    if(type==='readonly-tab'){s.tab=id;render();return persist();}
    if(type==='download')return say('Sample document selected. In the live app this downloads the displayed document version.');
    if(type==='interview'){main.innerHTML=`${button('← Application status','nav:status')}<h1 style="margin-top:18px">Prepare for your interview</h1><p>${esc(jobs.find(j=>j.id===id).title)}</p><h2>Build on the application you submitted</h2><ul><li>Review the employer’s requirements and your submitted résumé.</li><li>Choose relevant examples from your recorded experience.</li><li>Prepare questions about the work, team and expectations.</li></ul>`;return;}
    if(type==='hide')return hideDialog(id);
    if(type==='confirm-hide'){const kind=main.querySelector('[name=hideKind]').value,j=jobs.find(x=>x.id===id);if(kind==='job')s.hidden.push(id);else s.rules.push({kind,value:kind==='company'?j.company:kind==='location'?j.location:main.querySelector('[name=hideValue]').value.trim()||j.title});go('search');return say('Preference saved. Matching openings are hidden in this walkthrough.');}
    if(type==='restore-hidden'){s.hidden=[];s.rules=[];render();return persist();}
    if(type==='clear'){Object.assign(s,{q:'',remote:false,radius:'70',payMin:'',payMax:''});render();return persist();}
    if(type==='search'){const form=main.querySelector('[data-search]');if(!form)return;const data=new FormData(form);for(const k of ['q','radius','basis','payMin','payMax'])s[k]=String(data.get(k)||'');s.remote=data.get('remote')==='remote';if(s.payMin&&s.payMax&&Number(s.payMin)>Number(s.payMax))return say('Pay from must be no higher than Pay to.');render();return persist();}
  }
  root.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(target&&!target.disabled)run(target.dataset.action);});
  root.addEventListener('submit',event=>{if(event.target.matches('[data-search]')){event.preventDefault();run('search');}});
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
  render();
  if(globalThis.Tweak){const config={scenario:s.scenario};const tweak=new Tweak({container:root,onChange:()=>{clearTimeout(timer);s={...defaults(),scenario:config.scenario};say('');render();persist();}});tweak.addSelect(config,'scenario',{label:'Walkthrough scenario',options:['Normal path','Generation failure','Worker unavailable','Employer questions','Uncertain outcome','Interview invitation']});}
})();
</script>
