version: 1
cases:
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its family (Home shell) and company (Business shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the family view reads only GET /api/game-show/home-summary, /leaderboard and /shows; never /rooms (its listing runs the ended-room retention DELETE), a room's state, sync, cost, QR or camera stills, and never a POST.
      - The stats are the three room counts in plain words plus the top score; rooms carry their plain status and update time; an unnamed room and each hall-of-fame score are named from the show catalog.
      - Failed scores or show names keep the rooms; a partly unreadable record, no game nights, a refusal and a failure each read as what they are.
      - Under an audience view the module script mounts no connected actions and reads nothing; the full page still does both.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: native-reads
    name: Side-effect-free lobby reads
    purpose: Drive the room service's lobby reads and room creation against a recording pool - no database, network or provider.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/native-reads.test.js
    expected:
      - listRooms, leaderboard and loadState issue only SELECT statements, so GET /rooms is admissible as a read on the native kernel.
      - The hall of fame reads only games that ended within the seven-day retention window.
      - Creating a room still runs the ended-room retention sweep.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: native-writes
    name: Podium owners and the sync tick under native admission
    purpose: Drive the room service against a pool that applies the native kernel's reader-admission and owner-field rules - no database, network or provider.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/native-writes.test.js
    expected:
      - AI and house podiums are the host's gameshow_podiums rows identified by seat_key, several beside the host's seat, under a double that fills a NULL owner with the caller and keeps uq_gameshow_seat as the native kernel does.
      - The host resolves to their own seat, never to one of their podiums.
      - GET /sync issues no write even when the round clock has lapsed.
      - POST /sync resolves the lapsed clock and answers the poll with the new rev.
      - An AI podium is read from its seat_key as an NPC and never as the caller's own seat; a row written before migration 002 still reads.
      - The surface polls with POST /sync, the route serves it, and migration 003 is declared.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: end-game-status
    name: The host desk End game ends the room
    purpose: Drive the real override route handler and room service against an in-memory room - no database, network or provider.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/end-game-status.test.js
    expected:
      - End game saves the outro and sets the room status to ended.
      - A clock override leaves the room live, and only the host can end the game.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: home-summary-dates
    name: Saved times read as local dates
    purpose: Run the home-summary route with a stubbed router and pool - no database or network.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/home-summary-dates.test.js
    expected:
      - The review evidence and the handed-off brief carry a local date with its zone and never an ISO timestamp.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: feud-intro-context
    name: The Family Feud open names the real teams and question
    purpose: Build the intro host prompt from a fresh room and from a room with a drawn survey - no database, network or provider.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/feud-intro-context.test.js
    expected:
      - The intro names Team A and Team B as the scoreboard does, forbids invented names, quotes the drawn question and carries the board context.
      - Before a question is drawn it says none is drawn and not to name a topic.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: host-desk-screen
    name: The Host Desk names the current question; posters are buttons
    purpose: >-
      Load the shipped stage.html and ui scripts in the shell's application frame in Chromium at 412x915 over a stub game API
      and read them with the kernel's real screen snapshot (crates/api/src/shell_screen_state.js).
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/host-desk-screen.test.js
    expected:
      - During round 2 of Family Feud the Host Desk reads "Round 2 question" with that round's question, above the answer key.
      - Each show poster in the lobby is a button the snapshot names with Play against the computer.
    prerequisites:
      - runner:node-test
      - dependency:playwright
      - browser:chromium
      - fixture:kernel-checkout
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 60000
    installation: never
  - id: round-caption
    name: Each round's host caption is that round's
    purpose: Drive the REAL host service and the real Whammy and Family Feud show modules over an in-memory room and a recording host bot - no database, network or provider.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/host-guards.test.js
    expected:
      - A later round's start replaces round 1's HOST line with the new round's milestone ("Round 2 - the question"), newer than the old caption so the speaker surface voices it.
      - The round caption makes no host-bot call; the open (round 0 to 1) is still captioned by the narrated intro.
      - Spoken lines are sanitized and host JSON is extracted tolerantly, as before.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: play-phone-layout
    name: On a phone the buzzer bar fits and the clock leaves the question readable
    purpose: >-
      Load the shipped stage.html, ui scripts and CSS in the shell's application frame in Chromium at 412x915 over a stub
      game API during a face-off with the buzzer open and the round clock running.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/play-phone-layout.test.js
    expected:
      - The BUZZ IN bar ends inside its dock and inside the 412 px screen.
      - The round clock does not overlap the question.
    prerequisites:
      - runner:node-test
      - dependency:playwright
      - browser:chromium
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 60000
    installation: never
  - id: repeat-question
    name: A played survey question is never played again
    purpose: >-
      Through the real host service and the real Family Feud show module with an in-memory room: round 3's start when the
      model repeats round 2's question (sweep 14: "Name something people often find stuck in their hair." twice).
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/repeat-question.test.js
    expected:
      - A repeat is asked for once more and the fresh question is played as round 3.
      - Two repeats are refused with 502 and the board stays on round 2; a fresh question first time costs one host call.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: solo-night-stage
    name: One press starts a game against the computer, and nothing freezes it
    purpose: >-
      Run the shipped stage.html, scripts and CSS in Chromium under a light theme stand-in over a stub game API: a poster reaches a
      started game in one press, a reload keeps the seat, no dead buttons, a half typed answer survives a re-render, every control
      can be read, and the game ends with the winner and Play again. The real kernel crossing is `npm run test:browser:solo`,
      a live scenario (all four shows, desktop and phone) that needs GS_BASE_URL and GS_PAT.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/solo-night.test.js
    expected:
      - A poster press seats the person at their own seat, then adds only computer players, then starts the show, in that order.
      - An empty stage offers the computer and never a Start button.
      - After a reload the clues can still be picked and the dock says it is your pick.
      - A half typed answer keeps its text and the keyboard when the page re-renders, and a new answer box already has the keyboard.
      - Whammy shows PRESS at a person's own seat and PRESS does not move; Feud hides the answer box while the other team holds the board.
      - Clue text, categories, letter buttons, Pass my spins and name plates are light ink on the dark set under a light theme.
      - A decided game offers Finish the show; a finished one names the winner and offers Play again.
    prerequisites:
      - runner:node-test
      - dependency:playwright
      - browser:chromium
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 120000
    installation: never
  - id: solo-night-engine
    name: AI podiums leave a person room to play; the open names real categories
    purpose: Run the real show modules and NPC engine with a seated person and without one - no database, network or provider.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/solo-night-engine.test.js
    expected:
      - Bots wait while a person reads a clue, leave them the first move on an unclaimed board and the first answer on their team, and never wait in an all-AI room.
      - The Jeopardy open names the drawn categories and asks the room for nothing.
      - Wheel standings stop counting round banks once a puzzle is solved.
      - The room's owner can start Fast Money from their own seat; another player cannot.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
