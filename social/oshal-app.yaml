# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | Declare the existing workflow bot and package-local reasoning persona with its dedicated-node posture.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Declare the native-kernel egress hosts the routes read: api.twitter.com (twitter), api.linkedin.com (linkedin) and graph.facebook.com (meta-business), each with the caller's own connection applied by the kernel as a Bearer token.
# 3 | maintainer@emeraldcoastsystemsgroup.com | The Workspace and Composer call the package's own /api/social/content routes (routes/social-content-routes.js, migrations/001-social-content.sql, credential-free egress to the public topic feeds) instead of the old platform's /api/content/*, which the native kernel does not serve; social-daily-digest targets the imported communications-bot by name (the agent id was neither declared nor imported, so the kernel refused the schedule).
# 4 | maintainer@emeraldcoastsystemsgroup.com | social-daily-digest targets social-writer (a0...0040), the phase bot of the one workflow social owns (linkedin-content-post): a fire opens the workflow whose bot is the target, and the imported communications-bot runs only email-summarizer's workflow, so every fire was refused WorkflowNotLoaded.
# 5 | maintainer@emeraldcoastsystemsgroup.com | social-writer runs inline (posture: inline, same UUID a0000000-0000-0000-0000-000000000040). As a dedicated-node bot bound to enrolled node 9a367ce4, every Composer and Workspace AI Draft and Refine (POST /api/social/draft, /api/social/content/*) was refused 502 "social-writer is bound to enrolled node ..., which answers it; this request cannot run it here" (live 2026-10-11): the kernel runs a route-called node bot only when no node is bound. The node binding itself is unchanged. Guarded by scripts/check-store-bots.mjs: the four social route entries left its PENDING list, so a node posture fails the store gate again.
# 6 | maintainer@emeraldcoastsystemsgroup.com | 1.5.5: declare social-writer as the chatBot, so a request from Jarvis that asks to make, build, order or plan something reaches it. A workflow application with no chatBot keeps every creation request with the assistant (jarvis_creation_kept), which answered without this application's tools.

# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — social (Social swarm, ADR-038)
# Carved out of OSHAL core 2026-07-19 (ADR-085 Wave 2, "skill with a surface" —
# ONLY the surface carves). What STAYS framework-resident per ADR-093 interim:
#   - the communications-bot REAL node (comms container + BOTH registry blocks
#     b0…0001 + core email-summarizer persona) — the app's chat/right-rail agent;
#   - the social-writer node (a0…0040) the ticket workerBot dispatches to;
#   - the Signals ENGINE: the inbox-ingest cron that fills oshal_inbox_messages
#     (category=social) from the connected Gmail — this package's Signals surface
#     is a VIEW over that shared store, not the ingest;
#   - the linkedin / twitter / meta-business (+ facebook, google) platform
#     connectors driven via the per-user broker;
#   - the kernel-resident LinkedIn AI Content Assistant at /api/linkedin-assistant
#     (draft→judge→refine→approve state machine + its own no-post gate) — this
#     app's "LinkedIn Assistant" tile is a VIEW onto that kernel surface.
# This package is the app: the Workspace/Signals/Composer surfaces + the
# /api/social routes + the workflow + a package persona COPY for the registrar.
# Framework: OSHAL (see docs/build-your-own-swarm-app.md)
# ─────────────────────────────────────────────────────────────────────────────

name: social
suite: ai-productivity   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 128, high: 512, basis: declared }
  features:
    - id: post-draft
      unit: post draft
      tier: T2
      generation: none
      degrade: disable
    - id: signals-briefing
      unit: weekly signals briefing
      tier: T2
      generation: none
      degrade: disable
    - id: daily-social-digest
      unit: daily digest
      tier: T3
      generation: none
      degrade: disable
    - id: linkedin-content-post
      unit: LinkedIn post ticket
      tier: T2
      generation: none
      degrade: disable
displayName: Social
description: >-
  Listens to your feeds, surfaces trends, and drafts posts and replies from your
  input — then publishes to multiple platforms at once (LinkedIn + Facebook + X).
  AI drafting runs on the comms bot; publishing uses your per-user connector
  tokens. Human-approved — nothing posts until you click Publish.
version: 1.5.5
status: active

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: social
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/social/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# The installer fingerprints and registers these recipes; execution retains each prerequisite.
testing:
  version: 1
  catalog: tests/test-lab.yaml

# Runtime connector allow-list — the platforms this app publishes to + the mailbox
# whose Social category feeds the Signals view, all via the per-user broker.
# ── ADR-141 per-user readiness (asked by the Intelligent Career group's setup page) ──
#   facebook — a Facebook Pages (meta-business) or facebook connection exists for the caller
#   signals  — at least one social notification has been captured in the last 30 days
readiness:
  - name: facebook
    path: /api/social/readiness
    readyPointer: /facebook/ready
    detailPointer: /facebook/detail
  - name: signals
    path: /api/social/readiness
    readyPointer: /signals/ready
    detailPointer: /signals/detail

# ── Cross-package prerequisites: what this package actually reaches ─────────
# email-summarizer owns the communications bot used by this app's shared chat (the digest runs on social-writer).
# The composer also links to that app's inbox. The bot owner is a required prerequisite.
dependencies:
  required:
    apps: [email-summarizer]
    bots:
      - app: email-summarizer
        name: communications-bot
    tools: []
    connectors: []
  optional:
    apps: []
    tools: []
    connectors: [linkedin, twitter, meta-business, facebook, google]

# Native kernel egress: the hosts the routes read when the package runs in the kernel's sandbox. The kernel
# applies the caller's own connection for the named connector as a Bearer token; the package never holds it.
egress:
  - host: api.twitter.com
    credential: { connector: twitter, header: authorization, prefix: "Bearer " }
  - host: api.linkedin.com
    credential: { connector: linkedin, header: authorization, prefix: "Bearer " }
  - host: graph.facebook.com
    credential: { connector: meta-business, header: authorization, prefix: "Bearer " }
  # Public topic feeds for the Workspace's FEED tab: read-only, no credential.
  - host: hn.algolia.com
  - host: techcrunch.com
  - host: feeds.arstechnica.com
  - host: www.theverge.com
  - host: simonwillison.net

# Kernel skills this app declares (ADR-090 uses: contract, fail-closed at load).
# `app-dependencies` is the compatibility floor for the tiered dependencies block above: a core
# that predates required/optional refuses this package instead of installing it without its
# required dependencies and without its connector allow-list.
uses:
  - app-dependencies
  - test-catalog

# Per-app skin (approved palette) — light-blue so the social workspace reads distinct.
theme: light-blue

# ─────────────────────────────────────────────────────────────────────────────
# LinkedIn Content Assistant — the social north-star orchestrated flow.
# A ticketType=linkedin-content-post ticket (queue intake / scheduled) routes via the
# generic single-bot worker dispatch (dispatchManifestWorkerTicket) straight to the
# social-writer persona (the drafting owner, registered globally as a0…0040 — stays
# framework-resident), where the kernel's bound LinkedIn queue worker turns the result into
# an owner-scoped pending-approval draft. Interactive drafting uses the direct/inline path in the
# kernel-resident linkedin-assistant-routes (draft -> quality-judge score -> one
# refine under SOCIAL_JUDGE_BAR -> pending-approval); the interactive path does not need a ticket.
# Nothing publishes without an explicit human Publish click.
# ─────────────────────────────────────────────────────────────────────────────
# The bot a Jarvis creation request goes to (its own workflow bot).
chatBot: social-writer

ticketType: linkedin-content-post
workflow:
  name: LinkedIn Content Assistant
  # `pipeline: manifest-worker` is the single-bot worker dispatch to social-writer. It is
  # declared, not implied: the kernel's bound LinkedIn queue worker accepts a ticket only when
  # the registered workflow names this pipeline, so omitting it makes every queued ticket fail.
  # The quality-judge SCORING step is an orchestration step inside the assistant flow, NOT a
  # second reviewer bot (one-bot-per-ticket-type).
  pipeline: manifest-worker
  workerBot: social-writer

# ─────────────────────────────────────────────────────────────────────────────
# SCHEDULES — a per-user "poll". scope: per-user means it is NOT system-wide; it
# registers for a specific user only when THEY connect the required connector
# (facebook). Runs only when the agent scheduler is on (ENABLE_AGENT_SCHEDULER=true).
# ─────────────────────────────────────────────────────────────────────────────
schedules:
  - id: social-daily-digest
    cron: "0 13 * * *"
    scope: per-user
    requiresConnection: facebook
    targetAgent: a0000000-0000-0000-0000-000000000040   # social-writer, the bot of social's own linkedin-content-post workflow
    description: Daily digest of your connected social signals.
    prompt: >-
      Summarize what happened across my connected social accounts in the last day:
      notable mentions, replies needing attention, and anything worth a post.

# Social owns its drafting bot. The shared communications bot is imported from email-summarizer.
bots:
  - agentId: a0000000-0000-0000-0000-000000000040
    name: social-writer
    persona: personas/social-writer.yaml
    posture: inline   # native kernel: the Composer/Workspace AI Draft and Refine routes run it as an application bot turn
    role: social/content-partner
    capabilities: ['post-drafting', 'voice-matching', 'content-refinement', 'personal-branding', 'linkedin-post-drafting', 'x-post-drafting', 'facebook-page-post-drafting', 'caption-writing', 'hook-and-cta-crafting']

ui:
  static:
    - toolName: social-composer
      label: Composer
      icon: codicon codicon-edit
      iframeUrl: /api/social/composer
      section: top
    - toolName: social-workspace
      label: Workspace
      icon: codicon codicon-edit
      iframeUrl: /api/social/workspace
      section: top
    - toolName: linkedin-assistant
      label: LinkedIn Assistant
      icon: codicon codicon-rocket
      iframeUrl: /api/linkedin-assistant/panel   # kernel-resident surface — stays framework-served
      section: top
    - toolName: social-signals
      label: Signals
      icon: codicon codicon-radio-tower
      iframeUrl: /api/social/signals/ui
      section: top
    - toolName: social-accounts
      label: Accounts
      icon: codicon codicon-account
      iframeUrl: /utilities   # core framework surface — stays kernel-mounted
      section: bottom

routes:
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/social/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/social/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/social-routes.js
    factory: createSocialRoutes
    mountPath: /api/social
    auth: oidc   # what core server.ts mounted (requiresAuth — ADR-085 D2)
    requiresAuth: true
    requiresContext: true

  - module: routes/social-content-routes.js
    factory: createSocialContentRoutes
    mountPath: /api/social/content
    auth: oidc
    requiresAuth: true
    requiresContext: true

  - module: routes/linkedin-content-queue.js
    factory: createLinkedInContentQueueRoutes
    mountPath: /api/social/linkedin-content-queue
    auth: oidc
    requiresAuth: true
    requiresContext: true

# No migrations: the Signals feed reads the shared oshal_inbox_messages store
# (filled by the framework inbox-ingest cron, category=social) and connected
# accounts — no app-owned Postgres tables; the store stays in place across the carve.

# The Workspace's per-person content store (focus, scan opt-in, dismissed articles, saved drafts).
migrations:
  - migrations/001-social-content.sql

ribbon:
  hideFrameworkItems:
    - tickets
    - chat
    - calendar
    - addressbook
    - dashboard
    - logs
    - operations
  defaultView: social-workspace

integrations:
  offers:
    - id: prepare-post
      label: Prepare a post
      targetApp: switchboard
      targetAction: prepare-post
      contextType: communication-brief
      version: 1
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
  accepts:
    - id: prepare-post
      contextType: communication-brief
      version: 1
      surface: social-composer
      fields:
        - title
        - notes
        - sourceUrl

summary:
  path: /api/social/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items
