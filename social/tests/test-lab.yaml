# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | Register the package's shipped suites: the existing metadata-only readiness smoke, the owner-bound LinkedIn queue intake guard, and the framework-coupled LinkedIn publish-rail guard.
# 2 | maintainer@emeraldcoastsystemsgroup.com | The queue intake case also pins the manifest contract the kernel queue binding admits (linkedin-content-post, pipeline manifest-worker, workerBot social-writer).
# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.5.2: register the audience view contract of the Composer (ADR-164 D6): the company view for the Business shell reads only database-backed routes on open, never the live profiles, and names each empty, refused and failed state. The linkedin-content-queue case now declares installation: never: a package node-test case cannot run during installation, and the core catalog loader (scripts/oshal-test-catalog.js loadPackageTestCatalog) refused the whole catalog for that one field ("cases[2].installation: local/core suites cannot execute during installation").
# 4 | maintainer@emeraldcoastsystemsgroup.com | 1.5.3: the family audience view registered beside the company one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
# 5 | maintainer@emeraldcoastsystemsgroup.com | Register the native-kernel egress case: X, LinkedIn and Facebook profile requests reach their declared hosts with no credential and map to the routes' rows; missing, lapsed or refused connections keep the 409s; the Page legs and LinkedIn publishing make no egress request.
# 6 | maintainer@emeraldcoastsystemsgroup.com | Register social-content-routes: the package-owned Workspace content routes and the daily digest bot target.
# 7 | maintainer@emeraldcoastsystemsgroup.com | Register draft-limit: an X draft over 280 characters is shortened before it reaches the composer, and one that never fits is said in words (sweep 14: 315 / 280).
# 8 | maintainer@emeraldcoastsystemsgroup.com | 1.6.0: register workspace-browser: the Signals tile merged into Workspace · Engage (UX audit social--social-signals) and the Workspace's phone layout (social--social-workspace).
# 9 | maintainer@emeraldcoastsystemsgroup.com | UX audit batch-7 (social--social-composer MERGE): register composer-merge for the Composer redirect to Workspace · Compose, business-experience surface resolution, refine chips, and path-free Connect copy.
# 10 | maintainer@emeraldcoastsystemsgroup.com | 1.7.0: Compose and Workspace are one application. composer-merge now proves one Workspace tile and no Composer tile, prepare-post and business-experience on social-workspace, tools/social-composer.html removed, the compiled router's 302 from /api/social/composer to Workspace Compose with every query parameter kept, and every Composer capability in Workspace Compose; workspace-browser adds the prefilled prepare-post link; social-content-routes reads the one Workspace screen.
# 11 | maintainer@emeraldcoastsystemsgroup.com | 1.7.2: register composer-handoff, and composer-merge expects the hand-off page: the old Composer address answered a 302, which a kernel does not relay from a package (HTTP 500 there).
# -----------------------------------------------------------------------------
version: 1
cases:
  - id: package-readiness
    name: Installed package readiness
    purpose: Retain the existing metadata-only installation probe without running a business workflow.
    level: integration
    runner:
      kind: smoke
      smoke: package-readiness
    expected:
      - The installed social metadata satisfies its existing manifest smoke assertions.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: safe-smoke
  - id: linkedin-publish-audit
    name: LinkedIn publish rail audit discipline
    purpose: >-
      Drive the compiled publish rail against the framework's own connector-action executor and the
      shipped LinkedIn connector definition, with only the database pool and the provider socket
      replaced by synthetic doubles, to prove the write is recorded before it happens and refused
      when it cannot be.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/publish.core.test.js
    expected:
      - The approved text is sent to the declared create-post action under the caller's own brokered credential, and the caller-scoped audit row is written before the provider call.
      - An unavailable audit trail refuses the publication and contacts no provider; the post text itself never enters the audit trail.
      - A caller with no connection, a caller whose credential is gone, and a publish without explicit confirmation are each refused with nothing published.
    prerequisites:
      - runner:node-test
      - fixture:core-checkout
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/publish-core.fixture.js
      cleanup: >-
        The runner removes the disposable container and staged files; the database pool and the
        provider socket are in-memory doubles and the global fetch override is restored per attempt.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 512
    installation: never
  - id: linkedin-content-queue
    name: LinkedIn content queue intake
    purpose: Prove the package creates owner-bound linkedin-content-post tickets, preserves bounded citation provenance, lists only the caller's queue, denies unauthenticated intake, and registers the workflow shape the kernel queue binding admits.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/linkedin-content-queue.core.test.js
    expected:
      - Queue intake uses the caller's OIDC subject and never accepts a caller-supplied owner.
      - Source citations are deduplicated and carried into the ticket metadata for the kernel binding.
      - Unauthenticated intake is denied before ticket creation.
      - The shipped manifest registers linkedin-content-post with pipeline manifest-worker and workerBot social-writer, and intake files tickets of exactly that type with no provider or target override.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell) and family (Home shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the company view reads only /readiness, /signals (7 days), /home-summary and /linkedin-content-queue; never /profiles, a draft, an organize, a queue write or a post.
      - The stats and notifications say what they count, the queue reads newest first with each ticket state named, and setup offers Connect only where something is missing.
      - A queue answered without JSON, a failed summary or setup read, a refusal and a failure each read as what they are.
      - Under an audience view the Composer fetches no profiles, adds no handoff listener, appends no section and fetches no connected-actions offer.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: kernel-egress
    name: Native kernel social egress
    purpose: Drive the compiled social routes with OSHAL_EGRESS=kernel, the bridge's inert framework stand-ins, synthetic connection metadata and a recording fetch - no network or credentials.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/kernel-egress.test.cjs
    expected:
      - The X post, timeline and follow requests and the LinkedIn, Facebook and X profile reads go to api.twitter.com, api.linkedin.com and graph.facebook.com with no Authorization and no access_token, and map to the routes' rows.
      - The X user id comes from GET /2/users/me under the kernel, never the connection table; readiness reads the Facebook connections from the connection metadata.
      - No, a lapsed or a kernel-refused X connection answers the same 409 no_twitter_connection.
      - The Facebook Page legs and LinkedIn publishing make no egress request under the kernel.
      - Outside the kernel the broker token still travels as a Bearer header and a Graph access_token.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: social-content-routes
    name: Workspace content routes and daily digest target
    purpose: Drive the compiled /api/social/content router with in-process framework stand-ins, a recording pool, a scripted fetch and a recording bot - no network, database or model.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/social-content-routes.test.cjs
    expected:
      - Every /api/social/content call the Workspace makes has a handler; no screen calls the old /api/content routes.
      - Topics come from declared egress hosts, match the caller's focus, skip dismissed articles, decode entities and read only; every source failing answers 502.
      - Focus, settings, dismissals and saved drafts are keyed to the caller; drafting, refining and notes run on the package's own social-writer.
      - The manifest mounts the router and its migration, and social-daily-digest names a bot the package declares or imports.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: draft-limit
    name: An X draft fits X's limit
    purpose: >-
      In Chromium at 412x915 the person drafts an X post in the shipped composer over the compiled social router with a
      scripted drafting bot (sweep 14: the draft came back at 315 / 280).
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/social-draft-limit.test.cjs
    expected:
      - A 315-character draft is sent back once with its length and the 250-character rewrite is the editor's text.
      - A bot that never fits is asked at most twice more and the composer says "This draft is 315 characters; X allows 280. Shorten it before publishing."
    prerequisites:
      - runner:node-test
      - dependency:playwright
      - browser:chromium
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
  - id: workspace-browser
    name: Workspace with Engage and the phone bottom bar
    purpose: >-
      Drive tools/social-workspace.html and the Signals address in Chromium over a loopback fixture of the Workspace
      routes, with no network, accounts or credentials and no publish (UX audit 2026-11-06, social--social-signals and
      social--social-workspace).
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/workspace-browser.test.cjs
    expected:
      - The Signals and Composer tiles are off the social menu and the workspace, marketing-suite and intelligent-career suites; their signals step opens the Workspace; Workspace is the one compose tile with its own icon.
      - /api/social/signals/ui leads to Workspace · Engage, which leads with the scan switch, never says ingest or cron, and keeps Organize with AI disabled with "No signals yet" until there are signals.
      - A signal's note opens in the one composer with Save, Copy and Publish.
      - At 412x915 touch a bottom bar Feed · Engage · Saved · Compose keeps Compose one tap away, tap to comment opens it with the article attached, the X tab chooses the 280 format before X is linked and Publish says "Connect X to publish"; Connect, source and the feed's dismiss are at least 44x44.
      - A saved draft opens from its ⋯ menu; the selected tab and Draft labels reach 4.5:1 on the Graphite accent.
      - The old Composer address with prepare-post title, notes and sourceUrl opens Workspace Compose with the draft prefilled and refinable, at 1440x900.
    prerequisites:
      - runner:node-test
      - dependency:playwright
      - browser:chromium
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: Close the loopback fixture server and the browser.
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
  - id: composer-handoff
    name: Old Composer address hand-off
    purpose: Prove the old /api/social/composer address answers a page that sends the browser to the Workspace, and that the route never calls a redirect, which a kernel does not relay from a package.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/composer-handoff.test.cjs
    expected:
      - The page carries one address on this site, a refresh at once, a link, and no script; a query's marks are written out.
      - An address on another site is refused.
      - The route source and the compiled route answer the page and contain no redirect call.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: composer-merge
    name: Compose and Workspace are one application
    purpose: >-
      Verify the social menu carries one Workspace tile and no Composer tile, prepare-post and the Business screen name
      social-workspace, no second compose page ships, the compiled router answers the old /api/social/composer address
      with a hand-off page to Workspace Compose keeping every query parameter, and Workspace Compose carries every Composer
      capability behind the full-page gate.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/composer-merge.test.cjs
    expected:
      - ui.static has social-workspace (Workspace, codicon-layout) and no social-composer; prepare-post and business-experience name social-workspace.
      - tools/social-composer.html is gone.
      - GET /api/social/composer answers a page (HTTP 200, no Location header) whose one address is /api/social/workspace with view=compose and every query parameter (handoff, title, notes, audience) kept; an explicit view is kept.
      - Workspace Compose carries Punchier, Shorter, More technical, Add CTA, End with a question, the free prompt, AI draft, LinkedIn/X/Facebook publish, prepare-post handoff, direct query prefill and connected-application offers, all gated on the full page.
      - Workspace never prints /utilities as visible copy or keeps the 54-word feed callout.
    prerequisites:
      - runner:node-test
      - dependency:express
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: Close the loopback router.
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
