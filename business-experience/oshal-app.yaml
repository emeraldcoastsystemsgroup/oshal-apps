name: business-experience
displayName: Business
description: Your schedule, projects, documents and explicitly connected business applications.
version: 1.0.2
status: active
suite: ai-productivity
rating:
  memoryMb: { low: 16, high: 64, basis: declared }
  features:
    - id: assistant-handoff
      unit: assistant request
      tier: T1
      generation: none
      degrade: disable
source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: business-experience
  ref: main
uses:
  - application-authorization
  - experience
  - experience-roles
  - app-dependencies
  - test-catalog
dependencies:
  required:
    apps:
      - presentations
      - email-summarizer
      - calendar
      - world
      - finance
      - switchboard
      - social
      - calling-assistant
      - marketing-engine
      - venture-plan
      - private-app-1
      - payroll
      - payments
      - identity
      - cad-studio
      - private-app-2
      - intelligent-sales
      - private-app-3
    tools: []
    connectors: []
  optional:
    apps: []
    tools: []
    connectors: []
