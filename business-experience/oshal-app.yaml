routes:
  - module: routes/experience.js
    factory: createExperienceRoutes
    mountPath: /api/business-experience
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/business-experience/_smoke
    auth: service
    requiresContext: true
    requiresAi: false
ui:
  static:
    - toolName: business-experience-main
      label: Business
      icon: codicon codicon-layout
      iframeUrl: /api/business-experience/app
      section: top
ribbon:
  hideFrameworkItems:
    - tickets
    - chat
    - calendar
    - addressbook
    - dashboard
smoke:
  - name: package-readiness
    method: GET
    path: /api/business-experience/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false
testing:
  version: 1
  catalog: tests/test-lab.yaml
connectors: []
chatBot: general-bot
