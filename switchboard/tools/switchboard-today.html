<!doctype html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Today — Switchboard</title>
<!-- ONE link gives this standalone surface every OSHAL theme; the active one is chosen by the
     data-theme on <html> above (and kept in sync live by surface-theme.js). Every colour below is
     DERIVED from a framework token with a hardcoded fallback, so the surface is native to all 11
     themes in-cockpit AND still renders if opened on its own (fallbacks = the midnight palette,
     with a light-scheme set under @media so a bare open respects the OS theme too). -->
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css" />
<link rel="stylesheet" href="/shared/ui/css/surface-glass.css" />
<script src="/shared/ui/js/surface-theme.js"></script>
<style>
  /* ── standalone fallback palette (only applies when framework tokens are absent) ──────────── */
  :root {
    --sb-bg:#0a0a12; --sb-surface:#12121e; --sb-card:rgba(28,28,48,.55); --sb-card-hover:rgba(40,40,68,.66);
    --sb-line:rgba(255,255,255,.09); --sb-text:#eeeef5; --sb-text2:#c8c8da; --sb-muted:#8a8aa0;
    --sb-accent:#7c7cff; --sb-ok:#00d3a7; --sb-warn:#f5b342; --sb-err:#ff6f5e; --sb-active:#4aa3ff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --sb-bg:#eef1f5; --sb-surface:#f6f8fb; --sb-card:#ffffff; --sb-card-hover:#fbfcfe;
      --sb-line:rgba(22,26,34,.10); --sb-text:#191c22; --sb-text2:#3a4048; --sb-muted:#5a606b;
      --sb-accent:#5a5af0; --sb-ok:#1f9d74; --sb-warn:#b3762e; --sb-err:#d94f3d; --sb-active:#2f77c9;
    }
  }

  /* ── aliases: framework token first, standalone fallback second ───────────────────────────── */
  :root {
    --bg:      var(--bg-primary,      var(--sb-bg));
    --surface: var(--bg-secondary,    var(--sb-surface));
    --card:    var(--bg-card,         var(--sb-card));
    --cardh:   var(--bg-card-hover,   var(--sb-card-hover));
    --line:    var(--border-color,    var(--sb-line));
    --lineh:   var(--border-color-hover, var(--sb-line));
    --text:    var(--text-primary,    var(--sb-text));
    --text2:   var(--text-secondary,  var(--sb-text2));
    --muted:   var(--text-muted,      var(--sb-muted));
    --accent:  var(--accent-primary,  var(--sb-accent));
    --accent-grad: var(--accent-gradient, linear-gradient(135deg, var(--accent), var(--sb-active)));
    --ok:      var(--status-success,  var(--sb-ok));
    --warn:    var(--status-warning,  var(--sb-warn));
    --err:     var(--status-error,    var(--sb-err));
    --active:  var(--status-active,   var(--sb-active));

    /* platform brand marks (fixed — like the social surface) */
    --gmail:#d64b3f; --li:#0a66c2; --x:#e9eaec; --fb:#1877f2; --ig:#d6297a;
    --sms:#2aa87d; --cal:#7857c9; --voice:#3f9e5a;

    --r-sm:10px; --r-md:16px; --r-lg:22px; --pill:999px;
    --ease:cubic-bezier(.32,.72,.24,1);
  }
  /* keep X's chip readable on light themes */
  @media (prefers-color-scheme: light) { :root { --x:#16181c; } }
  :root[data-theme="daylight"], :root[data-theme="gray"], :root[data-theme="light-blue"],
  :root[data-theme="sakura"], :root[data-theme="amber"] { --x:#16181c; }

  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.45;
  }
  .tnum { font-variant-numeric:tabular-nums; }
  a { color:var(--accent); text-decoration:none; }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted)}

  .wrap { max-width:940px; margin:0 auto; padding:30px 30px 70px; }
  /* workspace switcher — scopes the board to a brand desk (ADR-113) */
  .wsbar { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin:0 0 20px; }
  .wspill { display:flex; align-items:center; gap:7px; padding:6px 13px 6px 9px; border-radius:var(--pill); border:1px solid var(--line); background:var(--card); color:var(--muted); cursor:pointer; font-size:12.5px; font-weight:560; transition:all var(--ease) .15s; }
  .wspill:hover { border-color:var(--accent); color:var(--text); }
  .wspill.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .wspill .wd { width:9px; height:9px; border-radius:3px; }
  .wspill.all .wd { background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #000)); }

  /* ── header ───────────────────────────────────────────────────────────────────────────────── */
  .head { display:flex; align-items:flex-start; gap:16px; margin-bottom:24px; }
  .head .h-main { flex:1; min-width:0; }
  .greet { font-size:28px; font-weight:680; letter-spacing:-.025em; margin:0 0 6px; text-wrap:balance; }
  .subline { color:var(--muted); font-size:15px; margin:0; }
  .subline b { color:var(--text); font-weight:600; }
  .asof {
    display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px;
    white-space:nowrap; padding-top:8px;
  }
  .asof .live { width:7px; height:7px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .asof button {
    appearance:none; border:1px solid var(--line); background:var(--card); color:var(--muted);
    width:30px; height:30px; border-radius:9px; cursor:pointer; display:grid; place-items:center;
    transition:all var(--ease) .16s;
  }
  .asof button:hover { color:var(--accent); border-color:var(--accent); }
  .asof button svg { width:15px; height:15px; }
  .asof button.spin svg { animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* preview ribbon */
  .previewpill {
    display:none; align-items:center; gap:7px; font-size:12px; color:var(--warn);
    background:color-mix(in srgb, var(--warn) 12%, transparent); border:1px solid color-mix(in srgb, var(--warn) 40%, transparent);
    padding:5px 12px; border-radius:var(--pill); margin-bottom:18px; width:fit-content;
  }
  .previewpill.show { display:inline-flex; }
  .previewpill svg { width:13px; height:13px; }

  /* ── stat tiles ───────────────────────────────────────────────────────────────────────────── */
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:13px; margin-bottom:30px; }
  .tile {
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-md);
    padding:16px 18px; position:relative; overflow:hidden;
  }
  .tile .k { display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--muted); font-weight:550; }
  .tile .k .ic { width:28px; height:28px; border-radius:9px; display:grid; place-items:center; }
  .tile .k .ic svg { width:16px; height:16px; }
  .tile .v { font-size:32px; font-weight:720; letter-spacing:-.02em; margin-top:9px; line-height:1; }
  .tile .s { font-size:12px; color:var(--muted); margin-top:6px; }
  .tile.warn .ic { background:color-mix(in srgb,var(--warn) 15%,transparent); color:var(--warn); } .tile.warn .v { color:var(--warn); }
  .tile.active .ic { background:color-mix(in srgb,var(--active) 15%,transparent); color:var(--active); }
  .tile.ok .ic { background:color-mix(in srgb,var(--ok) 15%,transparent); color:var(--ok); }

  /* ── stream ───────────────────────────────────────────────────────────────────────────────── */
  .grouplbl {
    font-size:11px; font-weight:650; text-transform:uppercase; letter-spacing:.09em; color:var(--muted);
    margin:26px 2px 12px; display:flex; align-items:center; gap:9px;
  }
  .grouplbl:first-of-type { margin-top:4px; }
  .grouplbl .n { color:var(--muted); font-weight:600; opacity:.7; }
  .stream { display:flex; flex-direction:column; gap:10px; }

  .item {
    position:relative; display:grid; grid-template-columns:44px 1fr auto; gap:15px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-md);
    padding:15px 17px; cursor:pointer; overflow:hidden;
    transition:transform var(--ease) .16s, box-shadow var(--ease) .16s, border-color var(--ease) .16s;
    animation:rise .4s var(--ease) backwards;
  }
  .item:hover { transform:translateY(-2px); box-shadow:0 12px 30px rgba(0,0,0,.16); border-color:var(--lineh); }
  .item::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent; transition:background var(--ease) .16s; }
  .item.hot::before { background:var(--warn); }
  .item.over::before { background:var(--err); }
  @keyframes rise { from { opacity:0; transform:translateY(9px); } to { opacity:1; transform:none; } }

  .ava { width:44px; height:44px; border-radius:13px; display:grid; place-items:center; color:#fff; font-weight:650; font-size:15px; position:relative; }
  .ava .src {
    position:absolute; right:-5px; bottom:-5px; width:20px; height:20px; border-radius:50%;
    display:grid; place-items:center; background:var(--surface); box-shadow:0 1px 4px rgba(0,0,0,.3);
  }
  .ava .src svg { width:12px; height:12px; }
  .body { min-width:0; }
  .line1 { display:flex; align-items:center; gap:9px; margin-bottom:3px; flex-wrap:wrap; }
  .nm { font-weight:620; font-size:14.5px; letter-spacing:-.01em; }
  .chan { font-size:10.5px; font-weight:600; padding:2px 8px 2px 7px; border-radius:var(--pill); display:inline-flex; align-items:center; gap:5px; background:var(--line); color:var(--muted); white-space:nowrap; }
  .chan .sw { width:7px; height:7px; border-radius:2px; }
  .hotbadge { font-size:11px; font-weight:650; color:var(--warn); background:color-mix(in srgb,var(--warn) 14%,transparent); padding:2px 9px; border-radius:var(--pill); }
  .overbadge { color:var(--err); background:color-mix(in srgb,var(--err) 14%,transparent); }
  .sub { font-weight:550; font-size:13.5px; color:var(--text); margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .snip { color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .right { display:flex; flex-direction:column; align-items:flex-end; gap:9px; justify-content:space-between; }
  .t { color:var(--muted); font-size:12px; white-space:nowrap; }
  .verbs { display:flex; gap:6px; opacity:0; transform:translateY(3px); transition:all var(--ease) .18s; }
  .item:hover .verbs { opacity:1; transform:none; }
  .verb {
    appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font:inherit; font-size:12px; font-weight:550; padding:6px 11px; border-radius:var(--pill);
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:all var(--ease) .15s;
  }
  .verb svg { width:13px; height:13px; }
  .verb:hover { border-color:var(--accent); color:var(--accent); }
  .verb.primary { background:var(--accent); border-color:transparent; color:#fff; }
  .verb.primary:hover { filter:brightness(1.08); color:#fff; }

  /* meeting variant */
  .item.meet .ava { background:color-mix(in srgb,var(--active) 20%,var(--card)); color:var(--active); }

  /* ── states: loading / connect / empty / error ────────────────────────────────────────────── */
  .skel { background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:15px 17px; display:grid; grid-template-columns:44px 1fr; gap:15px; }
  .shimmer { position:relative; overflow:hidden; background:var(--line); border-radius:8px; }
  .shimmer::after { content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--text) 8%,transparent),transparent); animation:sh 1.4s infinite; }
  @keyframes sh { 100% { transform:translateX(100%); } }

  .hero {
    text-align:center; padding:56px 32px; background:var(--card); border:1px solid var(--line);
    border-radius:var(--r-lg); margin-top:8px;
  }
  .hero .badge { width:64px; height:64px; border-radius:19px; background:var(--accent-grad); display:grid; place-items:center; margin:0 auto 18px; box-shadow:0 12px 30px rgba(0,0,0,.2); }
  .hero .badge svg { width:32px; height:32px; color:#fff; }
  .hero h2 { font-size:22px; font-weight:680; letter-spacing:-.02em; margin:0 0 8px; }
  .hero p { color:var(--muted); font-size:14.5px; max-width:44ch; margin:0 auto 22px; line-height:1.55; }
  .hero .accts { display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin-bottom:24px; }
  .hero .accts .a { display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text2); background:var(--surface); border:1px solid var(--line); padding:7px 13px; border-radius:var(--pill); }
  .hero .accts .a .sw { width:9px; height:9px; border-radius:3px; }
  .cta {
    appearance:none; border:0; cursor:pointer; font:inherit; font-size:14.5px; font-weight:620;
    background:var(--accent-grad); color:#fff; padding:12px 26px; border-radius:var(--pill);
    display:inline-flex; align-items:center; gap:9px; box-shadow:0 10px 26px rgba(0,0,0,.18);
    transition:filter var(--ease) .15s, transform var(--ease) .15s;
  }
  .cta:hover { filter:brightness(1.06); transform:translateY(-1px); }
  .cta svg { width:16px; height:16px; }
  .empty { text-align:center; padding:44px 24px; color:var(--muted); }
  .empty svg { width:34px; height:34px; color:var(--ok); margin-bottom:12px; }
  .empty h3 { color:var(--text); font-size:17px; font-weight:620; margin:0 0 6px; }

  /* footer legend */
  .legend { display:flex; gap:18px; align-items:center; flex-wrap:wrap; margin-top:34px; padding-top:18px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); }
  .legend .k { display:flex; align-items:center; gap:6px; }
  .legend .sw { width:10px; height:10px; border-radius:3px; }
  .legend .bot { margin-left:auto; display:flex; align-items:center; gap:7px; color:var(--accent); }
  .legend .bot svg { width:13px; height:13px; }

  @media (max-width:620px) {
    .wrap { padding:20px 15px 50px; }
    .tiles { grid-template-columns:1fr; }
    .greet { font-size:23px; }
    .item { grid-template-columns:40px 1fr; }
    .item .right { grid-column:2; flex-direction:row; align-items:center; justify-content:space-between; }
    .verbs { opacity:1; transform:none; }
  }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>

<script>
(function () {
  "use strict";

  // ── channel metadata ──────────────────────────────────────────────────────
  var CH = {
    gmail:   { label:"Gmail",    icon:"#i-mail",  v:"--gmail" },
    outlook: { label:"Outlook",  icon:"#i-mail",  v:"--active" },
    linkedin:{ label:"LinkedIn", icon:"#i-dm",    v:"--li" },
    x:       { label:"X",        icon:"#i-at",    v:"--x" },
    facebook:{ label:"Facebook", icon:"#i-dm",    v:"--fb" },
    instagram:{label:"Instagram",icon:"#i-dm",    v:"--ig" },
    sms:     { label:"Text",     icon:"#i-sms",   v:"--sms" },
    voice:   { label:"Voice",    icon:"#i-phone", v:"--voice" },
    calendar:{ label:"Calendar", icon:"#i-cal",   v:"--cal" },
    social:  { label:"Social",   icon:"#i-at",    v:"--accent" }
  };
  var GROUPS = [ ["now","Now"], ["today","Earlier today"], ["week","This week"] ];

  function cssv(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#888"; }
  function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; }
  function initials(name){
    var p=(name||"?").trim().split(/\s+/);
    return ((p[0]||"?")[0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase();
  }
  // deterministic warm-neutral gradient per person, so avatars are stable + varied
  function avatarBg(seed){
    var h=0; for(var i=0;i<(seed||"").length;i++){ h=(h*31+seed.charCodeAt(i))>>>0; }
    var a=h%360, b=(a+24)%360;
    return "linear-gradient(145deg,hsl("+a+" 42% 46%),hsl("+b+" 46% 32%))";
  }
  function relTime(iso){
    var d=new Date(iso), now=new Date(), s=(now-d)/1000;
    if(isNaN(s)) return "";
    if(s<90) return "just now";
    if(s<3600) return Math.round(s/60)+" min";
    if(s<86400) return Math.round(s/3600)+"h";
    if(s<172800) return "yesterday";
    return d.toLocaleDateString(undefined,{weekday:"short"});
  }
  function clockTime(iso){ var d=new Date(iso); return isNaN(d)?"":d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
  function greetWord(){ var h=new Date().getHours(); return h<12?"Good morning":h<18?"Good afternoon":"Good evening"; }

  function chanChip(ch){
    var m=CH[ch]||{label:ch,v:"--muted"};
    return '<span class="chan"><span class="sw" style="background:var('+m.v+')"></span>'+esc(m.label)+'</span>';
  }
  function verbsFor(it){
    if(it.kind==="meeting") return '<button class="verb">View</button><button class="verb primary">Join</button>';
    if(it.kind==="call")    return '<button class="verb">Play</button><button class="verb">Call back</button>';
    if(it.kind==="mention") return '<button class="verb"><svg><use href="#i-bot"/></svg> Draft</button><button class="verb"><svg><use href="#i-check"/></svg></button>';
    return '<button class="verb primary"><svg><use href="#i-reply"/></svg> Reply</button><button class="verb"><svg><use href="#i-snooze"/></svg></button>';
  }

  function itemHTML(it, i){
    var m=CH[it.source]||CH.gmail;
    var cls="item"+(it.overdue?" over":it.hot?" hot":"")+(it.kind==="meeting"?" meet":"");
    var avatar = it.kind==="meeting"
      ? '<div class="ava"><svg style="width:20px;height:20px"><use href="#i-cal"/></svg><span class="src" style="color:var('+m.v+')"><svg><use href="'+m.icon+'"/></svg></span></div>'
      : '<div class="ava" style="background:'+avatarBg(it.person||it.handle||it.subject)+'">'+esc(initials(it.person))
          +'<span class="src" style="color:var('+m.v+')"><svg><use href="'+m.icon+'"/></svg></span></div>';
    var badge = it.overdue ? '<span class="hotbadge overbadge">'+esc(it.badge||"Overdue")+'</span>'
              : it.hot     ? '<span class="hotbadge">'+esc(it.badge||"Needs reply")+'</span>' : "";
    return ''
      + '<article class="'+cls+'" style="animation-delay:'+(i*45)+'ms">'
      +   avatar
      +   '<div class="body">'
      +     '<div class="line1"><span class="nm">'+esc(it.person||"—")+'</span>'+chanChip(it.source)+badge+'</div>'
      +     (it.subject?'<div class="sub">'+esc(it.subject)+'</div>':"")
      +     (it.snippet?'<div class="snip">'+esc(it.snippet)+'</div>':"")
      +   '</div>'
      +   '<div class="right"><span class="t">'+esc(it.kind==="meeting"?clockTime(it.ts):relTime(it.ts))+'</span>'
      +     '<div class="verbs">'+verbsFor(it)+'</div></div>'
      + '</article>';
  }

  function render(data){
    var items=data.items||[];
    document.getElementById("greet").textContent = greetWord()+(data.firstName?(", "+data.firstName):"")+".";
    var needs=data.counts&&data.counts.needsReply||0, meets=data.counts&&data.counts.meetings||0, done=data.counts&&data.counts.handled||0;
    var sub = needs
      ? '<b>'+needs+(needs===1?" person is":" people are")+'</b> waiting on you'
        + (meets?', you have <b>'+meets+(meets===1?" meeting":" meetings")+'</b>':'')
        + (done?', and the bot cleared <b>'+done+'</b> low-priority '+(done===1?"item":"items")+' for you':'')+'.'
      : (items.length? 'Nothing urgent — '+items.length+' '+(items.length===1?"thing":"things")+' on the board.' : 'Your board is clear.');
    document.getElementById("subline").innerHTML=sub;

    var asof=document.getElementById("asof"); asof.hidden=false;
    document.getElementById("asoftime").textContent = data.preview? "sample data" : ("as of "+new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}));

    var tiles=''
      + tile("warn","#i-reply","Needs a reply",needs, data.counts&&data.counts.timeSensitive? data.counts.timeSensitive+" time-sensitive":"caught up")
      + tile("active","#i-cal","On the calendar",meets, data.nextMeeting? "Next: "+esc(data.nextMeeting):"nothing today")
      + tile("ok","#i-check","Handled by bot",done,"receipts, promos, +1s");
    var html='<div class="tiles">'+tiles+'</div>';

    if(!items.length){
      html+='<div class="empty"><svg><use href="#i-check"/></svg><h3>You’re all caught up</h3><p>Nothing needs you right now. New mail, DMs, texts and mentions land here the moment they arrive.</p></div>';
    } else {
      GROUPS.forEach(function(g){
        var bucket=items.filter(function(x){return (x.group||"today")===g[0];});
        if(!bucket.length) return;
        html+='<div class="grouplbl">'+g[1]+'<span class="n">'+bucket.length+'</span></div><div class="stream">';
        bucket.forEach(function(it,i){ html+=itemHTML(it,i); });
        html+='</div>';
      });
    }
    html+=legend(data.preview);
    document.getElementById("content").innerHTML=html;
  }
  function tile(cls,icon,label,val,sub){
    return '<div class="tile '+cls+'"><div class="k"><span class="ic"><svg><use href="'+icon+'"/></svg></span>'+label+'</div>'
      +'<div class="v tnum">'+val+'</div><div class="s">'+sub+'</div></div>';
  }
  function legend(preview){
    var order=["gmail","linkedin","x","facebook","sms","voice","calendar"], out="";
    order.forEach(function(k){ out+='<span class="k"><span class="sw" style="background:var('+CH[k].v+')"></span>'+CH[k].label+'</span>'; });
    return '<div class="legend"><span class="k" style="color:var(--text2)"><b>One board:</b></span>'+out
      +'<span class="bot"><svg><use href="#i-bot"/></svg>Ranked &amp; drafted on the comms bot</span></div>';
  }

  function connectHero(){
    var accts=[["gmail","Gmail"],["linkedin","LinkedIn"],["x","X"],["facebook","Facebook"],["sms","Text"]];
    var chips=accts.map(function(a){return '<span class="a"><span class="sw" style="background:var('+CH[a[0]].v+')"></span>'+a[1]+'</span>';}).join("");
    document.getElementById("greet").textContent=greetWord()+".";
    document.getElementById("subline").textContent="Bring every conversation onto one board.";
    document.getElementById("content").innerHTML=
      '<div class="hero"><div class="badge"><svg><use href="#i-board"/></svg></div>'
      +'<h2>Wire up your lines</h2>'
      +'<p>Switchboard pulls your mail, DMs, texts, calls and social mentions into one prioritized stream — and drafts replies on your bot. Connect an account to light up your board.</p>'
      +'<div class="accts">'+chips+'</div>'
      +'<a class="cta" href="/utilities"><svg><use href="#i-board"/></svg> Connect accounts</a></div>';
  }

  // ── sample board (shown only when the live API is unreachable — clearly labelled) ───────────
  var now=Date.now();
  function ago(min){ return new Date(now-min*60000).toISOString(); }
  function at(h,m){ var d=new Date(); d.setHours(h,m,0,0); return d.toISOString(); }
  var SAMPLE={ preview:true, firstName:"Alex", nextMeeting:"10:40 AM",
    counts:{needsReply:4,timeSensitive:2,meetings:2,handled:17},
    items:[
      {group:"now",source:"gmail",kind:"mail",person:"Dana Alvarez",subject:"Re: SOW sign-off — legal needs the countersigned copy",snippet:"We’re good on our end. If you can get the signed SOW back before the 11am standup…",ts:ago(6),hot:true,overdue:true,badge:"Reply by 11:00"},
      {group:"now",source:"linkedin",kind:"dm",person:"Marcus Kwon",subject:"Intro to the platform-eng hiring manager?",snippet:"Saw your OSHAL post — we’re building something adjacent. Any chance you’d do a quick intro…",ts:ago(22),hot:true,badge:"Needs reply"},
      {group:"today",source:"calendar",kind:"meeting",person:"Platform sync — Hasbro",snippet:"4 guests · Google Meet · agenda drafted by bot from the thread",ts:at(10,40)},
      {group:"today",source:"x",kind:"mention",person:"@devtoolsdaily",subject:"Quoted your swarm-orchestration thread",snippet:"cleanest take on multi-agent routing I’ve seen — how does it handle back-pressure?",ts:ago(64)},
      {group:"today",source:"sms",kind:"sms",person:"Jess (contractor)",snippet:"Desktop worker’s back online — apply queue is draining again 👍",ts:ago(70),hot:true,badge:"Needs reply"},
      {group:"today",source:"voice",kind:"call",person:"Missed call · (850) 555-0148",snippet:"Voicemail transcribed — “Hi Alex, it’s the Duffel API team calling back about…”",ts:ago(120)},
      {group:"week",source:"facebook",kind:"dm",person:"Priya Nair",subject:"Loved the Switchboard teaser",snippet:"Is the unified inbox going to support Pages messaging too? Would be huge for us.",ts:ago(1500)}
    ]};

  // ── workspace switcher: scope the board to a brand desk (persisted; ADR-113) ──
  var WSHEX={brass:"#d99a4e",emerald:"#12a488",indigo:"#5b6ef5",magenta:"#c53b8e",slate:"#8892a0",teal:"#25b0a0",coral:"#f2704e",amber:"#e0a83a"};
  function selectedWs(){ try{ return localStorage.getItem("switchboard.ws")||""; }catch(e){ return ""; } }
  function renderWsBar(list){
    var bar=document.getElementById("wsbar");
    if(!list.length){ bar.hidden=true; return; }
    var sel=selectedWs();
    var html='<div class="wspill all'+(sel?"":" on")+'" data-ws=""><span class="wd"></span>All workspaces</div>';
    list.forEach(function(w){
      html+='<div class="wspill'+(sel===w.workspaceId?" on":"")+'" data-ws="'+esc(w.workspaceId)+'"><span class="wd" style="background:'+(WSHEX[w.color]||WSHEX.brass)+'"></span>'+esc(w.name)+'</div>';
    });
    bar.innerHTML=html; bar.hidden=false;
  }
  function loadWorkspaces(){
    fetch("/api/switchboard/workspaces",{headers:{Accept:"application/json"}})
      .then(function(r){ return r.ok? r.json() : Promise.reject(); })
      .then(function(d){ renderWsBar((d&&d.workspaces)||[]); })
      .catch(function(){ /* preview / not signed in — no switcher */ });
  }

  function load(showSpinner){
    var btn=document.getElementById("refreshBtn"); if(btn&&showSpinner) btn.classList.add("spin");
    var ws=selectedWs();
    fetch("/api/switchboard/feed?surface=1"+(ws?("&workspace="+encodeURIComponent(ws)):""),{headers:{Accept:"application/json"}})
      .then(function(r){ return r.ok? r.json() : Promise.reject(r.status); })
      .then(function(d){
        document.getElementById("previewpill").classList.remove("show");
        if(d && d.connected===false){ connectHero(); return; }
        render(d);
      })
      .catch(function(){
        // API not reachable (opened standalone / not deployed yet) → labelled sample board
        document.getElementById("previewpill").classList.add("show");
        render(SAMPLE);
      })
      .finally(function(){ if(btn) btn.classList.remove("spin"); });
  }

  document.addEventListener("click",function(e){
    var b=e.target.closest("#refreshBtn"); if(b){ load(true); return; }
    var p=e.target.closest(".wspill"); if(p){
      try{ localStorage.setItem("switchboard.ws", p.dataset.ws||""); }catch(err){}
      document.querySelectorAll(".wspill").forEach(function(x){ x.classList.toggle("on", x===p); });
      load(true);
    }
  });
  loadWorkspaces();
  load(false);
})();
</script>
</body>
</html>
