# 4 | maintainer@emeraldcoastsystemsgroup.com | Register native-schema-declarations: every INSERT target is created by a declared migration with a primary key, and the calendar and workspace migrations match the runtime bootstrap's final shape.
# 5 | maintainer@emeraldcoastsystemsgroup.com | Register streams-delete: the owner's confirmed DELETE /posts/:id removes the post with its variants and revisions; other people, unconfirmed and scheduled requests remove nothing; the surface offers Delete.
