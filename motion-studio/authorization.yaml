# CHANGE LOG
# 1 | maintainer@emeraldcoastsystemsgroup.com | Declare reviewed own-scoped Motion source contracts; installed acceptance remains open.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Preserve exact native integer transport and bind an approval-held exact edit tool.
# 3 | maintainer@emeraldcoastsystemsgroup.com | Bind read-only native effect index/schema tools on existing view grants.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Bind original-read exact key metadata and tick previews.
version: 1
resources:
  projects:
    scopes:
      - own
permissions:
  project.view:
    resource: projects
    effect: read
    minimumTier: viewer
  project.read:
    resource: projects
    effect: read
    minimumTier: viewer
  project.create:
    resource: projects
    effect: write
    minimumTier: editor
  project.change:
    resource: projects
    effect: write
    minimumTier: editor
  project.delete:
    resource: projects
    effect: write
    minimumTier: editor
  project.export:
    resource: projects
    effect: export
    minimumTier: editor
roles:
  viewer:
    tier: viewer
    grants:
      - permission: project.view
        scope: own
  reader:
    tier: viewer
    grants:
      - permission: project.view
        scope: own
      - permission: project.read
        scope: own
  creator:
    tier: editor
    grants:
      - permission: project.view
        scope: own
      - permission: project.read
        scope: own
      - permission: project.create
        scope: own
  editor:
    tier: editor
    grants:
      - permission: project.view
        scope: own
      - permission: project.read
        scope: own
      - permission: project.change
        scope: own
  exporter:
    tier: editor
    grants:
      - permission: project.view
        scope: own
      - permission: project.read
        scope: own
      - permission: project.export
        scope: own
  administrator:
    tier: admin
    grants:
      - permission: project.view
        scope: own
      - permission: project.read
        scope: own
      - permission: project.create
        scope: own
      - permission: project.change
        scope: own
      - permission: project.delete
        scope: own
      - permission: project.export
        scope: own
