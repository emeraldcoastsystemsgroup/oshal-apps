# -----------------------------------------------------------------------------
# 1   | maintainer@emeraldcoastsystemsgroup.com     | 1.1.2: register the audience view contract of the review page (ADR-164 D6) with its runner and isolation boundaries: the company view for the Business shell reads only GET /home-summary on open (the package's one saved-evidence read), is proved against the JSON the real compiled route builds, names the account's state, an unchecked source, a refusal and a failure for what they are, and leaves the full page's own start (connected actions, loaded-applications plan, refresh) running only when no audience view renders.
# 2 | maintainer@emeraldcoastsystemsgroup.com | 1.1.3: the family audience view registered beside the company one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
# -----------------------------------------------------------------------------
version: 1
cases:
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell) and family (Home shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the company view reads only GET /home-summary; it writes nothing, never starts a discovery run and never fetches the loaded-applications plan or a connected-actions offer.
      - Fed the JSON the real compiled route builds, the stats are the route's three counts with their tones and the runs table reads state and start from the route's detail and the latest step and saved output from its sentence (no step saved, untitled step, no saved output, long text clipped, a sentence cut short or without the fixed words).
      - The title names the account's state (runs needing review, runs active, completed in 5 days, none completed in 5 days, nothing recorded); an unchecked source, a 401, the route's operator 403, the route's 503, a non-JSON failure, a failure with its own error and a network failure each read as what they are.
      - Under an audience view the page's module script mounts no connected actions, binds no Refresh handler and reads nothing; without the audience it still runs every start step.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
