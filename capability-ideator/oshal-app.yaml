# CHANGE LOG
# 1 | maintainer@emeraldcoastsystemsgroup.com | 1.1.6: the review page no longer forces color-scheme: dark, so its native form controls follow the portal theme like the rest of the page.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Roger, 2026-11-04: the default look is now Light Blue, "the white background blue highlights"; this package declared midnight, so it now declares light-blue. A person's saved theme still wins.
# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.1.8: UX audit split (capability-ideation--capability-ideation-review): Brief by default, the composer first with one primary Develop this idea that sends the brief to the concierge and Save draft on this device; the Capability directory lists each application once with de-duplicated action chips, a search and a suite filter, and Use in a brief.
# 4 | maintainer@emeraldcoastsystemsgroup.com | 1.1.9: the review page's buttons are on the design standard's scale (docs/ux/design-standard.md §4.1; Roger F14, 2026-11-06: "not following the general sizing of objects"): body-size labels at 600 (15px on a desktop with a fine pointer), 44px tall with 16px sides, radius m, a solid secondary fill with the control edge, and the label on one line, so a button hugs its label instead of wrapping into a two-line bubble.
name: capability-ideator
suite: ai-engineering
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features:
    - id: capability-discovery
      unit: capability discovery report
      tier: T3
      generation: none
      degrade: disable
displayName: Capability Ideator
description: >-
  Discover sourced tools and integration opportunities for business processes, grounded in installed applications and
  explicit connection requirements.
version: 1.1.9
testing:
  version: 1
  catalog: tests/test-lab.yaml
status: active
scope: operator
source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: capability-ideator
  ref: main
theme: light-blue
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: []
    tools: []
    connectors: []

# Kernel skills this app declares (ADR-090 uses: contract, fail-closed at load).
# `app-dependencies` is the compatibility floor for the tiered dependencies block above: a core
# that predates required/optional refuses this package instead of installing it without its
# required dependencies and without its connector allow-list.
uses:
  - app-dependencies
  - test-catalog

smoke:
  - name: package-readiness
    method: GET
    path: /api/capability-ideator/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false
routes:
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/capability-ideator/_smoke
    auth: service
    requiresContext: true
    requiresAi: false
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/capability-ideator/home-summary
    auth: oidc
    requiresContext: true
    requiresAuth: true
    requiresAi: false
  - module: routes/review.js
    factory: createReviewRoutes
    mountPath: /api/capability-ideator/review
    auth: oidc
    requiresContext: true
    requiresAuth: true
    requiresAi: false
ui:
  static:
    - toolName: capability-ideator-review
      label: Capability Ideator
      icon: codicon codicon-lightbulb
      iframeUrl: /api/capability-ideator/review
      section: top
summary:
  path: /api/capability-ideator/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items
integrations:
  offers:
    - id: prepare-document
      label: Develop an implementation brief
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
    - id: explore-venture
      label: Explore the business process
      targetApp: venture-plan
      targetAction: research-idea
      contextType: research-brief
      version: 1
bots:
  - agentId: c1de0000-0000-0000-0000-000000000001
    name: capability-ideator
    persona: personas/capability-ideator.yaml
    role: ai-engineering/capability-ideation
    capabilities:
      - manifest-reading
      - capability-composition
      - proposal-generation
