# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | 1.0.2 (concierge audit T15, the store's PENDING list): the launcher's concierge is jarvis's oshal-assistant, the platform assistant that routes a request to the application that owns it and hands off to that application's own concierge (Identity Hub, Storage and Cloud each have one), instead of the platform general-bot, which holds none of their data. borrowed by name exactly as the general-bot reference it replaces: the shell resolves a chatBot the package does not declare the way /api/swarm/bots/{selector}/ask does (kernel ui_applications.rs borrowed_concierge), so no dependency is added. A Jarvis request that names this application now stays with the assistant (kernel jarvis_routing.rs owner_of keeps a request whose application's concierge is the assistant) instead of going to general-bot. No route, member or dependency change.

# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — system ("System")
# Pure launcher (operator decision 2026-07-31, same shape as games/oshal-app.yaml):
# owns no runtime, no data, no bots of its own. system.oshal.ai is the front door
# for the account-infrastructure apps — identity, storage, cloud — that are useful
# on their own but don't need their own dedicated subdomain each.
# Framework: OSHAL (see docs/adr/085-remote-app-packages-and-registries.md)
# ─────────────────────────────────────────────────────────────────────────────

name: system
suite: ai-productivity   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features: []   # no model in the loop (T0)
displayName: System
description: >-
  One desk for account infrastructure: Identity Hub, Storage, and Cloud accounts —
  each already its own app, gathered here so you don't have to hunt the full catalog.
version: 1.0.2
status: active
scope: public
theme: gray
# Every account application is optional, so the platform assistant (shipped with the kernel) is the stable rail: it hands a
# request to the member application that owns it.
chatBot: oshal-assistant

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: system
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
routes:
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/system/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

smoke:
  - name: package-readiness
    method: GET
    path: /api/system/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# No sibling is required: the launcher owns no runtime or data, so every one of them is OFFERED
# at install as an unchecked choice and never installed unasked.
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps:
      - identity
      - storage
      - cloud
    tools: []
    connectors: []

# Kernel skills this app declares (ADR-090 uses: contract, fail-closed at load).
# `app-dependencies` is the compatibility floor for the tiered dependencies block above: a core
# that predates required/optional refuses this package instead of installing it without its
# required dependencies and without its connector allow-list.
uses:
  - app-dependencies

# The launcher owns no runtime or data. Its surfaces route to the installed apps.
ui:
  static:
    - toolName: system-identity
      label: Identity Hub
      icon: codicon codicon-key
      iframeUrl: /api/identity/
      section: top
    - toolName: system-storage
      label: Storage
      icon: codicon codicon-database
      iframeUrl: /api/storage/assistant/ui
      section: top
    - toolName: system-cloud
      label: Cloud Accounts
      icon: codicon codicon-cloud
      iframeUrl: /utilities   # core framework surface — stays kernel-mounted (cloud's own tile matches)
      section: top

ribbon:
  hideFrameworkItems:
    - tickets
    - chat
    - calendar
    - addressbook
    - dashboard
    - logs
    - operations
  hideChatPanel: true
  defaultView: system-identity
