  - id: fantasy-boards-no-projection
    name: Season, Waivers and Trades name a missing projection feed instead of zero advice
    purpose: Drive the compiled management routes for a hand-typed league with ESPN's player feed refused and answering, and render the boards in a DOM double.
    level: unit
