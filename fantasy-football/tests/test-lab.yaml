      - Two scoring rule sets give two season values; the drop candidate is the least costly player; replacement level deepens with more teams.
      - The plan names weeks priced from their own feed and from the rate, applies the bye table, carries only lasting injuries forward, and rates a bye-week player from the nearest week read.
