  - id: fantasy-grading
    name: Week ledger grading
    purpose: Serve lineups through the compiled router, then grade the weeks from stored actuals, for a hand-typed league and an ESPN one.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/fantasy-grading.test.js
    expected:
      - A week still in progress is not graded, and a week whose actual lines are not stored yet stays open with no call settled at zero.
      - A completed week is graded from stored actuals, advised lineup against the lineup started, with its start/sit calls settled first.
      - An ESPN week is graded against the lineup ESPN holds for that week, not the one recorded at lineup time.
      - A request naming no league reads the caller's own most recently linked league, and a caller with none gets 400.
      - The own-lineup smoke as the manifest declares it passes for a linked league (league name, P(win) lineup, mean-maximising lineup and both win probabilities) and records nothing; POST /lineup/record registers the week once however often it runs.
    prerequisites:
