      - fixture:core-checkout
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/fantasy-leagues-fixture.js
        - tests/fantasy-routes-harness.js
        - tests/fantasy-manual-fixture.js
    limits:
      timeoutMs: 60000
      maxMemoryMb: 256
    installation: never
  - id: fantasy-isolation
    name: Cross-user denial on a real database
    purpose: >-
      Mount the packaged routes over loopback HTTP on the real kernel connection lookup and broker,
      against a disposable PostgreSQL where a NOBYPASSRLS runtime role owns the forced ff_* tables.
      ESPN is a recording fetch seam keyed by the cookie each request carries.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/isolation.core.test.js
    expected:
      - The runtime role owns every ff_* table, each forced with one exact-owner policy, and a forged row is refused.
      - A second user sees none of the first user's leagues, calls, cached projections or completed weeks.
      - A second user can neither unlink nor read the first user's league, and their reads carry only their own cookie.
      - An operator identity sees none of the first user's rows over HTTP or SQL.
      - A household-shared connection is refused and never sent; the owner's personal one is used although the shared row sorts first.
      - The refresh writes 522 completed player-weeks across the 500-row insert chunk, each person their own copy.
      - A hand-typed league serves every board on the real store with no cookie sent, and nobody else can read, list, replace, delete or build on it.
      - A completed week is graded from its owner's stored actuals by the real grading statements; another person's grading pass grades nothing of it.
      - GET /record with a league key returns only that league's calls and graded record, and deleting a hand-typed league removes its weeks and calls under the forced owner policy while the ESPN league's stay.
    prerequisites:
      - runner:vitest
      - harness:oshal-core-root
      - harness:core-test-fixtures
      - engine-container:disposable-postgres
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures:
        - tests/fantasy-isolation.spec.ts
        - tests/isolation.config.mjs
      cleanup: The suite closes its loopback server, restores fetch and its environment, and stops its own PostgreSQL container including anonymous volumes.
    limits:
      timeoutMs: 300000
      maxMemoryMb: 1024
    installation: never
