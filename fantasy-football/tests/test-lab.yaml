# CHANGE LOG
# 1 | maintainer@emeraldcoastsystemsgroup.com | Initial — the five fantasy cases moved from sports-edge with their suites (ADR-146 D1), renamed for this package, the two route suites also loading tests/fantasy-routes-harness.js; plus the readiness smoke, optimiser exactness against brute force, per-person ownership (migration, statements, own connection only), the served surface, and cross-user denial proved on a disposable PostgreSQL through the real routes.
# 2 | maintainer@emeraldcoastsystemsgroup.com | 0.2.0: register the season value, waiver board, trade finder, hand-typed league parity and week-ledger suites, the three read-only PAT smokes that read the caller's own real league from the installed package, and the isolation case's hand-typed league and grading expectations on the real store.
# 3 | maintainer@emeraldcoastsystemsgroup.com | fantasy-transport: a schedule read that throws and a failed player-week history read each keep their lineup fallback and are logged at ERROR.
# 4 | maintainer@emeraldcoastsystemsgroup.com | own-lineup: the PAT smoke for the caller's own real league's weekly P(win) lineup beside the mean-maximising one (the first P0 clause's automated acceptance); fantasy-transport and fantasy-grading gain the unread-league-shape refusals and the own-lineup smoke contract.
# 5 | maintainer@emeraldcoastsystemsgroup.com | Register fantasy-lineup-readonly: GET /lineup is a pure read (the native kernel admits a GET as a reader and refused its recording), POST /lineup/record grades and records, and an unavailable projection feed answers its reason with no lineup numbers. own-lineup's GET no longer registers the week.
# 6 | maintainer@emeraldcoastsystemsgroup.com | Register league-form: the hand-typed league is entered in labelled fields, not one raw-JSON text box.
# 7 | maintainer@emeraldcoastsystemsgroup.com | Register week-record-league: the record under a league lists its own weeks, and a deleted hand-typed league takes its weeks with it (sweep 8 listed other leagues' rows under a new league).
# 8 | maintainer@emeraldcoastsystemsgroup.com | week-record-league and fantasy-isolation also expect the record and call list split by league and a deleted hand-typed league's calls gone (the isolation case on the real PostgreSQL store).
# 9 | maintainer@emeraldcoastsystemsgroup.com | Register fantasy-zero-scoring: a scoring table that scores nothing is refused on save and, when saved earlier, every board answers the reason with no numbers and reads no feed; manual-form expects an empty scoring template that names its need.
# 10 | maintainer@emeraldcoastsystemsgroup.com | Register fantasy-open-slot: a lineup as set that leaves a starting slot empty names the starter that fills it, and the Start / sit card never says "already the best" beside a positive gain (sweep 13).
# 11 | maintainer@emeraldcoastsystemsgroup.com | Register slot-names: the Projected starters Slot column names each ESPN slot (QB, WR, FLEX), never the raw id (sweep 14).
version: 1
cases:
  - id: package-readiness
    name: Installed package readiness
    purpose: Verify the service-authenticated metadata readiness probe without provider or user-data access.
    level: integration
    runner:
      kind: smoke
      smoke: package-readiness
    expected:
      - The installed Fantasy Football identity satisfies its smoke assertions.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: safe-smoke
  - id: own-status
    name: Your own status on the installed package
    purpose: >-
      Read GET /api/fantasy-football/status on the installed package as the signed-in operator (PAT). Proves the
      data router is mounted behind the signed-in identity and answers with the caller's own state; read-only, no
      ESPN league read and no write.
    level: integration
    runner:
      kind: smoke
      smoke: own-status
    expected:
      - The operator receives 200 with the season, whether their OWN ESPN connection is present, and only their own linked leagues.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: own-lineup
    name: Your real league's weekly lineup, P(win) beside the mean-maximising lineup (installed)
    purpose: >-
      Read GET /api/fantasy-football/lineup on the installed package as the signed-in operator (PAT). Naming no
      league means the caller's most recently linked ESPN league, read with their own connection; read-only toward
      ESPN and writes nothing: a GET is a reader request. Recording the week's decision and start/sit calls is
      POST /api/fantasy-football/lineup/record, which the page calls when the Lineup board is opened.
    level: integration
    runner:
      kind: smoke
      smoke: own-lineup
    expected:
      - The operator receives 200 with their own league's name, the P(win) lineup, the mean-maximising lineup beside it (non-empty starters), and both win probabilities when the week has an opponent; a 400 means no league is linked yet.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 120000
    installation: never
  - id: own-season-value
    name: Your real league's rest-of-season value (installed)
    purpose: >-
      Read GET /api/fantasy-football/season on the installed package as the signed-in operator (PAT). Naming no
      league means the caller's most recently linked ESPN league, read with their own connection; read-only toward ESPN.
    level: integration
    runner:
      kind: smoke
      smoke: own-season-value
    expected:
      - The operator receives 200 with their own league's name and the season value of their own roster; a 400 means no league is linked yet.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 120000
    installation: never
  - id: own-waiver-board
    name: Your real league's waiver board (installed)
    purpose: >-
