# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — fantasy-football ("Fantasy Football")
# 0.1.0 | maintainer@emeraldcoastsystemsgroup.com | Initial — the fantasy management engine moved out of sports-edge into its own package (ADR-146 D1; operator decisions 2026-09-27: Q2 per-user ownership, Q4 package name, suite and group). Every table is user_sub-keyed under FORCED exact-owner row-level security with no operator arm; the ESPN connection used is the caller's own personal one, read through the fantasy-leagues kernel skill; the lineup optimiser is now exact (Hungarian assignment) where the moved greedy one lost points on 6 of 3,000 brute-force rosters.
# 0.2.0 | maintainer@emeraldcoastsystemsgroup.com | The P0 residuals (ADR-146 Amendment A): rest-of-season value SV/MV over the weeks that remain, a waiver board ranked by swap value with a FAAB bid (scarcity premium, reserve cap) and a drop on every row plus a one-week streaming lane, a two-sided trade finder that never surfaces a trade the other manager loses on, leagues typed in by hand that run every board with no ESPN connection (migration 002, ff_manual_leagues), and the week ledger (ff_weeks) graded from stored actuals against the lineup actually started. gradeCall's subtraction is typed: PostgreSQL refused the statement moved from sports-edge ('operator is not unique: unknown - unknown'), so no call could ever have been graded. Read-only PAT smokes for the season value, waiver board and trade finder of the caller's own most recently linked league, and an own-lineup PAT smoke for that league's weekly P(win) lineup beside the mean-maximising one. A season-long board whose league shape (budget, last week, playoff start) could not be read answers 503 or 502 instead of pricing on an assumed shape.
# 0.2.1 | maintainer@emeraldcoastsystemsgroup.com | Native provisioning: declare migrations/native/001-fantasy-football.sql (every table and index of 001-002) and skip 001 and 002 natively, whose pg_policy-guarded owner-policy loops and pg_class read-back DO blocks the native kernel refuses; the declared migrations stayed pending for every person. PostgreSQL still applies 001-002 and the native file is a no-op there.
# 0.3.0 | maintainer@emeraldcoastsystemsgroup.com | UX audit P0 SPLIT (2026-11-06): the page has two views. This week is the home: the league menu and a Lineup · Season · Waivers · Trades control with the chosen board directly under it, opening on the first saved league's Lineup. League setup holds connecting, linking and the hand-typed league, now a walkthrough of one group per step (League, Scoring, Roster slots, Schedule, Teams) with Back and Continue in a sticky bottom bar, opened by itself when no league exists. Edit and delete sit in a row menu and delete asks in the page; roster slots read as positions (QB x 1, FLEX x 1) and are stored as ESPN slot ids; the cookie steps are withheld where the installation cannot send them; the in-page title and tagline are gone.
# 0.3.1 | maintainer@emeraldcoastsystemsgroup.com | Trial walk of 0.3.0: Save league left This week empty (the saved league already matched the board on record, so no board was built); saving now opens that league's Lineup. The first-run walkthrough shows no Cancel, since there is nothing to go back to.
# 0.3.2 | maintainer@emeraldcoastsystemsgroup.com | Trial walk of 0.3.1 at 412x915: the Lineup board opened on load took longer than a tap on Waivers, then painted over it. Only the newest board request paints now.
# 0.3.3 | maintainer@emeraldcoastsystemsgroup.com | UX audit sweep (fantasy-football--fantasy-football, D1=glass, D2=c): add ESPN stat-id and 32-team NFL pro-team tables so Scoring rules read and accept stat names with a stat picker (Passing TD = 4) and Bye weeks read and accept NFL team abbreviations with a team picker (KC = 6) while storing ESPN numeric ids; drop manifest hardcoded theme: light-blue; replace window.alert in Link with an in-page status line (DS-30); declare DS-00 dashboard contract and align radii/type/touch targets to the token scale.
# 0.4.0 | maintainer@emeraldcoastsystemsgroup.com | Fantasy Quant concierge (F22): collapsible right-rail Concierge with bottom-pinned Jarvis composer, surface context bridge, inline fantasy-quant specialist persona, read-only start/sit, waiver, and matchup win-probability tools, and approval-card-gated lineup and waiver mutation tools.
#
# MANAGE THE TEAM YOU HAVE. The operator's draft went badly — "we picked up running backs first
# round 2 times that were specifically left over by the other team owners" — so the first thing
# this package does is fix a roster that already exists: the lineup with the best chance of beating
# the team you actually play this week, not the highest-projected one, with the safest lineup's own
# chance shown beside it so a recommendation that gives up points has to visibly buy something.
#
# OWNERSHIP IS PER PERSON (ADR-146 Q2): "only i can control my team.. no one else can see my team
# and connection." Every table here is keyed by the signed-in subject under FORCED exact-owner row
# security with no operator arm, and the ESPN connection is the caller's own — a household-shared
# connection is refused rather than spent.
#
# ⚠ THE CREDENTIAL IS NOT AN API KEY. ESPN publishes no OAuth for fantasy: the only credential is the
# SWID + espn_s2 BROWSER COOKIES, which authenticate the whole ESPN account. They are resolved per
# request from the encrypted connector broker, handed to the fantasy-leagues kernel skill's reads,
# and never logged, returned, cached, or placed anywhere a model can read.
#
# NOTHING IS SUBMITTED. There is no route that changes a lineup on ESPN, claims a player or proposes
# a trade. Every start/sit call is registered before kickoff and graded against what actually
# happened, with the projected gain kept beside the actual one.
#
# Grouped with sports-edge as the ADR-141 application group `intelligent-sports`.
#
# Framework: OSHAL (see docs/adr/085-remote-app-packages-and-registries.md, docs/adr/146-fantasy-football-draft-platform.md)
# ─────────────────────────────────────────────────────────────────────────────

name: fantasy-football
suite: ai-productivity   # ADR-097: primary catalog shelf (operator decision Q4, 2026-09-27)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features:
    - id: fantasy-quant-concierge
      unit: question
      tier: T2
      generation: hosted
      degrade: template
displayName: Fantasy Football
description: >-
  Manage the fantasy football team you actually have. It reads your own ESPN league with your own
  connection, scores ESPN's raw projections with your league's own scoring rules (ESPN publishes
  stats, not points, and this package holds no stat table), and sets the lineup with the best chance
  of beating the team you play this week - which starts the volatile player when you are an underdog
  and the steady one when you are favoured, always beside what the safest lineup would have won.
  It prices every roster move over the rest of the season: a waiver board with a bid and a drop on
  every row, trades both managers gain from, and a one-week streaming lane. A league typed in by hand
  works with no ESPN connection at all. Your team, your leagues and your ledger are yours alone: no
  other user, operator included, can see them. Every lineup is recorded before kickoff and graded
  against what was actually started. It advises; you act.
version: 0.4.0
status: active
chatBot: fantasy-quant

bots:
  - agentId: fa47a590-3e82-4b64-9c15-8d702a5f14e3
    name: fantasy-quant
    persona: personas/fantasy-quant.yaml
    posture: inline
    role: fantasy-football/quant
    capabilities:
      - start-sit-evaluation
      - waiver-pricing
      - matchup-winprob
    selectorDescriptor: >-
      Select for Fantasy Football start/sit flex decisions, projected points and floor/ceiling ranges,
      matchup win-probability swings, rest-of-season waiver FAAB bids, and hand-typed league lineup moves.
    routingKeywords:
      - fantasy football
      - start at flex
      - start or sit
      - waiver wire
      - faab bid
      - fantasy lineup
uses: [test-catalog, app-dependencies, fantasy-leagues]
testing:
  version: 1
  catalog: tests/test-lab.yaml

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: fantasy-football
  ref: main

# CORE-05 install readiness: service-authenticated, package metadata only. No user data, no
# provider call, no state mutation, no tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/fantasy-football/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false
  # The caller's OWN status on the installed package, read as the signed-in operator (the Test Lab's
  # operator automation PAT). Read-only: it resolves the caller's own ESPN connection and lists their
  # own linked leagues; it reads no league from ESPN and writes nothing.
  - name: own-status
    method: GET
    path: /api/fantasy-football/status
    auth: pat
    requiresUser: true
    expect:
      status: 200
      jsonPointer: /season
      rejectValues: [noop, stub, empty]
    requiresAi: false
  # The caller's OWN real league's weekly lineup, read as the signed-in operator: GET /lineup naming
  # no league means their most recently linked ESPN league, read with their own connection. This is
  # the P0 clause "a start/sit with the win probability it buys against the mean-maximising lineup":
  # a 200 carries the league (/league/name), the P(win) lineup (/optimal), the mean-maximising lineup
  # beside it (/meanOptimal) and both win probabilities (/matchup). Read-only toward ESPN. It DOES
  # write, to the caller's own rows only: the projection cache refresh every board does, and, in the
  # caller's own ledger, that week's decision (ff_weeks, one row per week, updated in place until
  # graded) and its start/sit calls (ff_calls, one row per pair), after grading the caller's own
  # completed weeks. That registration is the behaviour under test, and a repeat run re-registers the
  # same week rather than adding one. The smoke format holds one JSON pointer: /meanOptimal/starters,
  # non-empty only when the league resolved, the caller's own team was found, projections were read
  # and both lineups were built.
  - name: own-lineup
    method: GET
    path: /api/fantasy-football/lineup
    auth: pat
    requiresUser: true
    expect:
      status: 200
      jsonPointer: /meanOptimal/starters
      rejectValues: [noop, stub, empty]
    requiresAi: false
  # The caller's OWN real league, read as the signed-in operator: naming no league means their most
  # recently linked ESPN league, read with their own connection. Read-only toward ESPN (no claim, bid,
  # offer or lineup change); the only write is the caller's own projection cache refresh. Each fails
  # with 400 until a league is linked, which is itself the answer to "is there a real league here".
  - name: own-season-value
    method: GET
    path: /api/fantasy-football/season
    auth: pat
    requiresUser: true
    expect:
      status: 200
      jsonPointer: /league/name
      rejectValues: [noop, stub, empty]
    requiresAi: false
  - name: own-waiver-board
    method: GET
    path: /api/fantasy-football/waivers
    auth: pat
    requiresUser: true
    expect:
      status: 200
      jsonPointer: /league/name
      rejectValues: [noop, stub, empty]
    requiresAi: false
  - name: own-trade-finder
    method: GET
    path: /api/fantasy-football/trades
    auth: pat
    requiresUser: true
    expect:
      status: 200
      jsonPointer: /league/name
      rejectValues: [noop, stub, empty]
    requiresAi: false

# ONE connector, and only for a private league. The projection feed needs no credential.
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: []
    tools: []
    # The caller's OWN ESPN Fantasy cookies (SWID + espn_s2) for reading a private league.
    connectors: [espn-fantasy]

# OUTBOUND HOSTS. A native package has no network of its own: the kernel's fenced egress carries
# the fantasy-leagues reads and refuses any host not declared here. This is ESPN's fantasy read
# host; with it the current week and a public league can be read. It does NOT bring back the
# projection feed: ESPN serves the full feed only to a request carrying its x-fantasy-filter header
# (without it ESPN answers 50 players), and the kernel's package egress does not admit that header,
# so the feed stays unavailable until the kernel admits it: the Lineup board names that reason, and
# Season, Waivers and Trades have no projections to price. A private league and your own team
# cannot be read either: the egress carries no ESPN cookies.
egress:
  - host: lm-api-reads.fantasy.espn.com

# ─────────────────────────────────────────────────────────────────────────────
# TOOLS — route-backed specialist tools for fantasy-quant and main Jarvis.
# Read tools execute strictly read-only GET queries; mutations require approval.
# ─────────────────────────────────────────────────────────────────────────────
tools:
  - name: fantasy_quant_start_sit
    displayName: Fantasy start/sit and flex evaluation
    type: api
    category: productivity
    description: >-
      Evaluate who to start at FLEX or any roster slot in the caller's ESPN or hand-typed league.
      Returns candidate players with projected points, 10th/90th-percentile floor/ceiling range,
      NFL team, bye week, injury status, matchup posture, and expected win-probability swing. Read-only.
    executor:
      executorType: api
      apiEndpoint: "GET /api/fantasy-football/quant/start-sit?slot={input.slot}&leagueId={input.leagueId}&manualId={input.manualId}&season={input.season}"
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        slot: { type: string, description: "Target slot such as FLEX, QB, RB, WR, TE, D/ST, or K (defaults to FLEX)." }
        leagueId: { type: string, description: "Optional ESPN league id." }
        manualId: { type: string, description: "Optional hand-typed league id." }
        season: { type: integer, description: "Optional season year." }
    usageInstructions: Call for "who should I start at flex?" or any start/sit roster question.
    routingTags: [fantasy-football, flex, start-sit, lineup, projections]
    skills: [fantasy-football]
    tags: [fantasy-football, route-backed]

  - name: fantasy_quant_waivers
    displayName: Fantasy waiver wire and FAAB upgrades
    type: api
    category: productivity
    description: >-
      Evaluate rest-of-season waiver wire upgrades, recommended FAAB bids, drop candidates, and
      one-week streaming options for the caller's fantasy league. Read-only.
    executor:
      executorType: api
      apiEndpoint: "GET /api/fantasy-football/quant/waivers?leagueId={input.leagueId}&manualId={input.manualId}&season={input.season}"
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        leagueId: { type: string, description: "Optional ESPN league id." }
        manualId: { type: string, description: "Optional hand-typed league id." }
        season: { type: integer, description: "Optional season year." }
    usageInstructions: Call for "best waiver wire upgrades", FAAB bids, or one-week streaming questions.
    routingTags: [fantasy-football, waivers, faab, streaming, trades]
    skills: [fantasy-football]
    tags: [fantasy-football, route-backed]

  - name: fantasy_quant_matchup
    displayName: Fantasy weekly matchup win probability
    type: api
    category: productivity
    description: >-
      Break down this week's head-to-head fantasy matchup: win probability vs mean-maximising lineup
      win probability, projected score and 10th/90th range vs opponent, posture (favoured/underdog),
      variance swaps, and graded start/sit call ledger. Read-only.
    executor:
      executorType: api
      apiEndpoint: "GET /api/fantasy-football/quant/matchup?leagueId={input.leagueId}&manualId={input.manualId}&season={input.season}"
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        leagueId: { type: string, description: "Optional ESPN league id." }
        manualId: { type: string, description: "Optional hand-typed league id." }
        season: { type: integer, description: "Optional season year." }
    usageInstructions: Call for "matchup win probability breakdown" or weekly opponent comparisons.
    routingTags: [fantasy-football, matchup, win-probability, ledger]
    skills: [fantasy-football]
    tags: [fantasy-football, route-backed]

  - name: fantasy_quant_set_lineup
    displayName: Set or record Fantasy Football lineup
    cardText: Update your hand-typed league starters and record pre-kickoff start/sit calls for this week.
    type: api
    category: productivity
    description: >-
      Confirm-gated action to update starting players in a hand-typed league and record pre-kickoff
      start/sit calls in the weekly ledger (never modifies live ESPN directly). Requires user approval.
    executor: { executorType: api, apiEndpoint: "POST /api/fantasy-football/quant/set-lineup" }
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        manualId: { type: string, description: "Optional hand-typed league id." }
        leagueId: { type: string, description: "Optional ESPN league id (records ledger calls only)." }
        season: { type: integer, description: "Optional season year." }
        startPlayerId: { type: integer, description: "Optional ESPN player id to move into starting lineup." }
        sitPlayerId: { type: integer, description: "Optional ESPN player id to move to bench." }
    usageInstructions: Propose only when the user explicitly asks to set/update their lineup or record weekly calls.
    routingTags: [fantasy-football, set-lineup, record-calls]
    skills: [fantasy-football]
    tags: [fantasy-football, route-backed]

  - name: fantasy_quant_apply_waiver
    displayName: Apply Fantasy Football waiver swap
    cardText: Add and drop players on your hand-typed league roster with the specified FAAB bid.
    type: api
    category: productivity
    description: >-
      Confirm-gated action to add an unrostered player and drop a rostered player (recording any FAAB
      spend) in the caller's hand-typed league. Requires explicit user approval.
    executor: { executorType: api, apiEndpoint: "POST /api/fantasy-football/quant/apply-waiver" }
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        manualId: { type: string, description: "Optional hand-typed league id." }
        addPlayerId: { type: integer, description: "Positive ESPN player id to add." }
        dropPlayerId: { type: integer, description: "Positive ESPN player id on your roster to drop." }
        faabBid: { type: number, description: "Optional FAAB bid spent." }
      required: [addPlayerId, dropPlayerId]
    usageInstructions: Propose only when the user explicitly asks to apply a waiver add/drop to their hand-typed league.
    routingTags: [fantasy-football, apply-waiver, add-drop]
    skills: [fantasy-football]
    tags: [fantasy-football, route-backed]

# ROUTES — every data route is oidc: a person's team is never reachable by a service identity.
# Handlers ALSO self-gate via callerSub.
routes:
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/fantasy-football/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/fantasy-football/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/fantasy-routes.js
    factory: createFantasyFootballRoutes
    mountPath: /api/fantasy-football
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

# DATABASE MIGRATIONS — applied idempotently on load. The routes also self-heal the schema (with
# the same owner policies), so the app works whether or not APP_PACKAGE_MIGRATIONS is on.
migrations:
  - migrations/001-fantasy-football.sql
  - migrations/002-fantasy-manual-and-weeks.sql
  - migrations/native/001-fantasy-football.sql
# The native kernel applies the native file above in place of 001 and 002, whose policy loops and catalog read-backs are PostgreSQL-only.
nativeMigrations:
  - id: migrations/001-fantasy-football.sql
    native: skip
    reason: "Its tables and indexes are in migrations/native/001-fantasy-football.sql; its RLS ENABLE/FORCE, pg_policy-guarded owner-policy loop and pg_class read-back are PostgreSQL-only, and the native per-person scope keeps each person's rows their own."
  - id: migrations/002-fantasy-manual-and-weeks.sql
    native: skip
    reason: "Its tables and indexes are in migrations/native/001-fantasy-football.sql; its RLS ENABLE/FORCE, pg_policy-guarded owner-policy loop and pg_class read-back are PostgreSQL-only, and the native per-person scope keeps each person's rows their own."

# ─────────────────────────────────────────────────────────────────────────────
# COCKPIT UI SURFACE — one ribbon icon opens your team.
# ─────────────────────────────────────────────────────────────────────────────
ui:
  static:
    - toolName: fantasy-football
      label: Fantasy Football
      icon: codicon codicon-organization
      iframeUrl: /api/fantasy-football/
      section: top

ribbon:
  hideFrameworkItems:
    - tickets
    - calendar
    - addressbook
    - logs
    - operations
  defaultView: fantasy-football

surface:
  ops: [context, custom, notify]

summary:
  path: /api/fantasy-football/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items
