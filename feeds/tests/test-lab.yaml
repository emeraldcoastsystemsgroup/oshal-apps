version: 1
cases:
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell) and family (Home shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes; and, over a stub kit and
      stub fetch, that on open the view reads only /home-summary and /settings (never /messages, /status or /sync),
      paints the counts, sync age, newest saved entries and notes, names each empty, unavailable, partial, refused
      and failed state, and that the dashboard's own start does not run under a view.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the company view reads exactly the home summary and the settings; the indexing, token and sync routes are never called.
      - The no-index, unavailable, partial, 401, 403 and failed-read states are each named; the one action opens Feeds in the cockpit.
      - The dashboard script reads nothing and sets no live poll under a view, and starts as before without one or without the kit.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: settings-persist
    name: Feed settings save honestly
    purpose: >-
      Save says Saved only when the server answers with the stored settings, and the package declares the feed_settings migration.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/feeds-settings.test.js
    expected:
      - An empty 200 reads as not saved.
      - A stored save reads as saved and reads back its values.
      - The migration creates feed_settings and feed_messages.
      - The settings drawer names no cron, database or operator step.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: connect-copy
    name: Not connected names the Connect Slack button
    purpose: >-
      Read the served manifest tool instructions and the curator persona: when Slack is not connected they
      name the Connect Slack button the Feeds page renders and give no /utilities path (sweep 8 said
      'Connections (/utilities)').
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/feeds-connect-copy.test.js
    expected:
      - >-
        No model-read instruction in oshal-app.yaml or the curator persona gives the /utilities path; each
        names Connect Slack on the Feeds page.
      - >-
        tools/feeds.html renders the Connect Slack button.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
