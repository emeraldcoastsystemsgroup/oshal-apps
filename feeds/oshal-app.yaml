# CHANGE LOG
# 1 | maintainer@emeraldcoastsystemsgroup.com | Give feeds-curator route-backed reads over this package's own /api/feeds routes (feeds-status, feeds-messages). Its only declared tool is the legacy slack_feed CLI, which the native kernel does not run, so the concierge asked the person to paste their Slack data. Guarded by scripts/check-store-bots.test.mjs.
# 2 | maintainer@emeraldcoastsystemsgroup.com | The legacy slack_feed usageInstructions no longer say "never ask them to connect Slack": when Slack is not connected the person is told to connect it under Connections (/utilities), matching feeds-status/feeds-messages and the feeds-curator persona.
# 3 | maintainer@emeraldcoastsystemsgroup.com | Name the button, not the path. Sweep 8: the concierge told the person to go to 'Connections (/utilities)'. Every not-connected instruction now says to press Connect Slack on the Feeds page (or connect Slack on the Connections page). Guard: tests/feeds-connect-copy.test.js.
# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — feeds ("Feeds")
# Carved out of OSHAL core 2026-07-19 (ADR-085 Wave 3, "skill with a surface" —
# ONLY the surface carves). This package is the app: the /api/feeds routes + the
# dashboard + the manifest (ticketType 'feeds' + curation workflow) + a package COPY
# of the feeds-curator persona for the registrar.
#
# What STAYS framework-resident per ADR-093 (this package ships none of it):
#   - the feeds-indexing ENGINE + cron (startFeedsIndexingCron / ensureFeedsSchema /
#     indexUserFeed / getFeedSettings) that fills feed_messages from the connected
#     Slack — this package's surface is a VIEW over that shared store, not the ingest;
#   - scripts/oshal-feeds.js (the slack_feed tool's CLI) + 045-feeds-platform.sql
#     (the feed_messages schema + curator seed), both kernel-owned;
#   - the feeds-curator INLINE node (container: oshal-api, registered in BOTH
#     swarm-bot-registry blocks) — the app's reasoning owner; the persona here is a
#     package COPY for the registrar;
#   - the 'slack' platform connector driven via the per-user broker;
#   - the /feeds framework page (src/pages/feeds/index.html via server-ui-assets) and
#     its default toolbar tile in oshal-framework.json — a framework-resident surface
#     the app also self-serves at /api/feeds/dashboard for the installed tile.
# Framework: OSHAL (see docs/adr/085-remote-app-packages-and-registries.md)
# ─────────────────────────────────────────────────────────────────────────────

name: feeds
suite: ai-productivity   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features:
    - id: feeds-curation-ticket
      unit: feeds ticket
      tier: T3
      generation: none
      degrade: disable
displayName: Feeds
description: >-
  Your connected message feeds in one place — live stream, activity trends, hot
  channels, and trending topics over your own Slack messages. Other swarm bots can
  ask the curator "what did I miss" and get a signal-first summary.
version: 1.2.3
testing:
  version: 1
  catalog: tests/test-lab.yaml
status: active

theme: ocean

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: feeds
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/feeds/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# Runtime connector allow-list — the mailbox/message platform whose feed this app
# indexes + views, via the per-user broker.
dependencies:
  required:
    apps: []
    tools: []
    connectors: [slack]
  optional:
    apps: []
    tools: []
    connectors: []

# Kernel skills this app declares (ADR-090 uses: contract, fail-closed at load).
# `app-dependencies` is the compatibility floor for the tiered dependencies block above: a core
# that predates required/optional refuses this package instead of installing it without its
# required dependencies and without its connector allow-list.
uses:
  - app-dependencies
  - test-catalog

# ─────────────────────────────────────────────────────────────────────────────
# BOTS — one curator (inline on the api via the orchestrator; seeded by the kernel
# 045-feeds-platform.sql + registered in swarm-bot-registry). The persona here is a
# package COPY for the registrar; the inline node keeps using /app/ai-lab (core).
# ─────────────────────────────────────────────────────────────────────────────
bots:
  - agentId: fd000000-0000-0000-0000-000000000001
    name: feeds-curator
    persona: personas/feeds-curator.yaml
    role: communications/feeds
    capabilities:
      - feed-aggregation
      - feed-summarization
      - hot-area-detection
      - trend-analysis
      - sentiment-triage

# ─────────────────────────────────────────────────────────────────────────────
# TOOLS — what the curator (and Jarvis routing to it) can call. slack_feed reads the
# user's indexed Slack messages (the cron-built feed_messages index) via the kernel
# CLI at /app/scripts/oshal-feeds.js (framework-resident), scoped to the signed-in
# user by the dispatcher; no Slack token needed at call time.
# ─────────────────────────────────────────────────────────────────────────────
tools:
  - name: slack_feed
    displayName: Slack Feed
    type: cli
    description: >-
      Read the signed-in user's indexed Slack feed — recent messages across their channels
      and DMs, hottest channels, top voices, counts, and (if enabled) sentiment. Use it to
      answer "what did I miss", summarize Slack activity, or find what needs attention.
    executor:
      executorType: cli
      cliCommand: node /app/scripts/oshal-feeds.js query
    defaultAuthMode: auto
    usageInstructions: >-
      Call slack_feed (no arguments) for a JSON snapshot of THIS user's Slack: totalIndexed,
      activeChannels, peopleTalking, overallMood, mentionsOfYou, followSuggestions
      (ranked channels to follow — each with channel/messages/mentionsOfYou/reason),
      hotChannels, topVoices, and recent[] (channel/from/text/at/mood). It is already scoped
      to the signed-in user — never ask them for a channel list or to paste messages. If
      Slack is not connected, tell them to press Connect Slack on the Feeds page (or connect Slack on the Connections page). To answer "what should I follow / pay attention to", read
      followSuggestions in order (top = highest signal; mentions of the user rank first). If
      totalIndexed is 0, tell them to open Feeds and hit "Sync now".

  # Native kernel: route-backed reads (executorType api, inside /api/feeds) under the caller.
  - name: feeds-status
    displayName: Feed Status
    type: api
    category: communication
    description: Whether the person's Slack is connected for Feeds, and their feed settings.
    executor: { executorType: api, apiEndpoint: "GET /api/feeds/status" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: >-
      Call with {}. "connected":false means Slack is not connected: tell them to press Connect Slack on
      the Feeds page (or connect Slack on the Connections page), then use Sync now. Never ask them to paste messages
      and never give a path such as /utilities.
    tags: [feeds, route-backed]
  - name: feeds-messages
    displayName: Feed Messages
    type: api
    category: communication
    description: The person's indexed feed messages, newest first (channel, author, text, time, mood when enabled).
    executor: { executorType: api, apiEndpoint: "GET /api/feeds/messages" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: >-
      Call with {} to summarize, spot hot channels or answer "what did I miss". Use only these messages.
      An empty list with an error "not connected" means Slack is not connected; an empty list otherwise
      means nothing is indexed yet (open Feeds and use Sync now).
    tags: [feeds, route-backed]

# ─────────────────────────────────────────────────────────────────────────────
# COCKPIT UI SURFACE — one ribbon icon opens the Feeds dashboard, self-served by
# this package's route from tools/feeds.html (ctx.appPackageDir).
# ─────────────────────────────────────────────────────────────────────────────
ui:
  static:
    - toolName: feeds-dashboard
      label: Feeds
      icon: codicon codicon-rss
      iframeUrl: /api/feeds/dashboard
      section: top

# ─────────────────────────────────────────────────────────────────────────────
# ROUTES — the packaged surface router, mounted /api/feeds on activation. (In core
# server.ts this was createFeedsRoutes; it now mounts from this package.)
# ─────────────────────────────────────────────────────────────────────────────
summary:
  path: /api/feeds/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items

routes:
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/feeds/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/feeds/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/feeds-routes.js
    factory: createFeedsRoutes
    mountPath: /api/feeds
    auth: oidc   # what core server.ts mounted (requiresAuth — ADR-085 D2)
    requiresAuth: true
    requiresContext: true

# The package owns feed_messages and feed_settings: the native kernel has no boot bootstrap,
# so the settings the Feeds page saves persist only in tables this migration declares.
migrations:
  - migrations/045-feeds-platform.sql

# ─────────────────────────────────────────────────────────────────────────────
# WORKFLOW — tickets of type 'feeds' route to the curator (queue == app name).
# ─────────────────────────────────────────────────────────────────────────────
ticketType: feeds
workflow:
  name: Feeds Curation Pipeline
  pipeline: feeds
  workerBot: feeds-curator
  phases:
    - intake      # understand the ask ("what did I miss", "summarize #channel")
    - curate      # read the index, rank what matters, spot hot areas + trends
    - deliver     # present the signal-first summary, record history

# ─────────────────────────────────────────────────────────────────────────────
# RIBBON VISIBILITY — when /cockpit?app=feeds is focused, show the Feeds surface +
# the base framework items minus this hide-list. Chat panel stays (ask the curator).
# ─────────────────────────────────────────────────────────────────────────────
ribbon:
  hideFrameworkItems:
    - addressbook
    - logs
    - operations
  defaultView: feeds-dashboard

integrations:
  offers:
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
    - id: prepare-post
      label: Prepare a post
      targetApp: switchboard
      targetAction: prepare-post
      contextType: communication-brief
      version: 1
