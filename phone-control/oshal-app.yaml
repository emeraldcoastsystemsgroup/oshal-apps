# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — phone-control ("Phone & Device Control")
# Control your Android phone (adb over Wi-Fi: its screen, taps, keys, typing and
# apps) and your iPhone (as a Bluetooth keyboard and pointer) through your own
# computer running oshal Node, and control your computers' screens.
# CHANGE LOG
# 1 | maintainer@emeraldcoastsystemsgroup.com | phone-control 1.0.0 as delivered on 2026-11-05.
# 2 | maintainer@emeraldcoastsystemsgroup.com | 1.1.0, every control real or removed (Roger, 2026-11-06: "phone control fix it place"): the page drives each phone through the person's own computer with the kernel's /api/computers (ADR-205), and installs the phone bridge there itself. Removed tools and routes: the control contract, enrol device, apply actions, the keyword concierge, verify mirror key, the screenshot import and the artifacts list. The concierge reads; it does not act.
# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.1.1: the design standard as measured on production: solid controls with crisp edges, a view switch that is a selection, one primary per screen, and an empty screen that is one card with Set up a computer instead of an empty phone frame. No route, tool or permission changed.
# 4 | maintainer@emeraldcoastsystemsgroup.com | 1.1.2: the rail labels keep their caption size and hide while empty; the setup table says once when it was read. No route, tool or permission changed.
# 5 | maintainer@emeraldcoastsystemsgroup.com | 1.2.0: device features require the administrator tier (personal owner isolation unchanged); every Connect / Use this computer press answers in its own card; Fire TV / Android TV connection over network adb with a TV remote; explicit iPhone Bluetooth steps and Remove pairing.
# 6 | maintainer@emeraldcoastsystemsgroup.com | 1.3.0: real iPhone screen mirroring over AirPlay through UxPlay on the person's Linux computer, explicit Bluetooth peripheral pairing steps, merged Connect sheet (phone-control-config removed from ui.static; /api/phone-control/config/ui opens the Connect sheet), and full-frame remote-control session layout. Authorization contract unchanged.
# 7 | maintainer@emeraldcoastsystemsgroup.com | 1.4.0: deliver all 13 Reference-Product session features (RP-PHC-01..13) — direct computer pointer/keyboard control in touch or mouse mode, special keys & chords (Ctrl+Alt+Del, Super, F1-F12), file transfer, clipboard sync, multi-monitor switching, screenshot & session clip recording, picture quality presets, capability-gated privacy screen, lock-on-end, session chat, whiteboard annotations, switch sides, and concierge session tool parity.
# 8 | maintainer@emeraldcoastsystemsgroup.com | 1.4.1: screen-first studio session workspace with Sync, single Mirror toggle, Full screen stage (.is-fullscreen + parent event fallback + corner HUD), collapsible Concierge rail, compact TV remote + keyboard navigation, BlueZ bonded LE HID reconnect + non-flooding AssistiveTouch swipes + pre-mirror stage touchpad, Fire TV DRM protected-surface notice + fast post-action frame wakeups, gated RDP session polling, and guided Android pairing steps with Samsung Auto Blocker tip.
# 9 | maintainer@emeraldcoastsystemsgroup.com | 1.4.2: add phone-provision (POST /api/phone-control/provision) for one-click and Jarvis zero-touch ADB APK push & auto-sign-in over the enrolled Linux computer.
# 10 | maintainer@emeraldcoastsystemsgroup.com | 1.4.2: add phone-control-register-device (POST /api/phone-control/devices), phone-control-update-device (POST /api/phone-control/devices/{input.id}), and phone-control-execute-device (POST /api/phone-control/devices/{input.id}/execute) so the Swarm and device-concierge can register, configure, and execute single-step or multi-step device control actions in the background or foreground.
# 11 | maintainer@emeraldcoastsystemsgroup.com | 1.5.0: the computer bridge gains lan-discover and lan-control (bridge/oshal_phone_lan.py): the person's own computer finds TVs and streaming sticks on its home network and presses their buttons (Samsung Tizen, Roku, Android TV); Smart Home's TVs section and Jarvis use them. A device registered without a computer resolves to one of the caller's own computers or is refused in words; the fixed fallback computer id is gone. No route, tool or permission changed.
# 12 | maintainer@emeraldcoastsystemsgroup.com | 1.5.1: Connect in console is hidden until an RDP session backend exists (Roger, 2026-11-09: "rdp and we do support that but never really have a use for it"): nothing implements /api/rdp/sessions, so the RDP card keeps its setup scripts, Copy setup script and Check RDP port, the Connection Concierge offers Check RDP port only, and the description no longer promises live RDP desktops. No route, tool or permission changed.
# 13 | maintainer@emeraldcoastsystemsgroup.com | 1.5.2: Jarvis routing words (backlog P4-16k): device-concierge adds 'android', 'ipad' and 'iphone' (not 'phone' or 'device', words of this application's name that would take "Find my phone" and "My phone number changed"). "Connect my Android phone so I can control it from here" and "Register my iPad as a device I can drive from Jarvis" scored here but claimed nothing, because every keyword was a phrase; both reach Phone & Device Control now. No route, tool or permission changed.
# 14 | maintainer@emeraldcoastsystemsgroup.com | 1.5.3: Your devices reads again. tools/session-computer.js called isTvNode without importing it, so the page answered "Your devices could not be read: isTvNode is not defined" (Roger's phone, 2026-11-08 and 2026-11-09) whenever a saved Android phone or TV was not reachable through its computer and the person had a connected, controllable Android node with another name. The import is added, and tests/phone-control-module-names.test.cjs fails when any browser module of a store package calls a name that is neither declared, imported nor a browser global. No route, tool or permission changed.
# 15 | maintainer@emeraldcoastsystemsgroup.com | 1.5.4: Bluetooth pairing asks first (open-work audit 2026-11-10; Orbit Add hub 2.6 items 1-2): the bridge holds every pairing request until the person presses Allow or Reject on the page (no answer in 30 s is Reject, one Allow per window, a device that paired in the window without an Allow is removed when it closes), trusts and reconnects only devices the person allowed (ble-pair-answer, ble-keep for a device paired before), and the tests name no house address.
# 16 | maintainer@emeraldcoastsystemsgroup.com | 1.6.0: the first screen is a tree with details (Roger, 2026-11-10). Each computer is a row with the phones and TVs that connect through it, and its bound programs, under it; a device's Details show how it connects, through what, its state, its control switch and what it can do, in tables beside the tree (under the row on a phone); a saved phone or TV can be renamed there. Rows start at the left and the list fills the page. In Add a device every button shows all of its words.
# 17 | maintainer@emeraldcoastsystemsgroup.com | 1.6.1 (Roger, 2026-11-11: his Fire TV was on Prime Video; the page showed an old Marquee picture and the TV Concierge answered "The phone is not connected to this computer"). The computer's adb had lost the TV and nothing reconnected it; the page then showed the last picture the TV's own oshal app had sent as if it were live and hid the reason. Now every command and picture read reconnects a phone or TV reached over the network once before reporting anything; a device still not connected is named with its kind, its computer and Sync; a stored picture is shown only under a note that it is not live. No route, permission or data change.
# 18 | maintainer@emeraldcoastsystemsgroup.com | Release 1.7.0 (T45 part 3; Roger, 2026-11-11: "deep links that open the actual film on the TV"): Open a Link on a TV (phone-control-open-link, POST /devices/:id/open-link) opens a title's link on a saved Android or Fire TV inside its streaming app, waking the TV first; the bridge (1.7.0) carries oshal_phone_links.py.
# 19 | maintainer@emeraldcoastsystemsgroup.com | Release 1.8.0 (T45 part 4; Roger, 2026-11-10: "a way to control an app that is running in the background"): the bridge's lan-control on an Android or Fire TV reads what is playing and in which app, and play, pause, next, previous and stop reach the app playing even when another app is in front; the answer reads the TV's media sessions again and says what the press did. Smart Home 1.7.0 puts them on a TV's card and in Jarvis's TV tool. The bridge source budget is 240 KiB; the install command is ~81 KB and stays under the 100 KiB the honesty test allows. No route, tool, permission or egress changed.
# 20 | maintainer@emeraldcoastsystemsgroup.com | Release 1.9.0 (T45 part 2; Roger, 2026-11-10: "plays it on any device in his connected devices"): Open a Link on a TV also opens a Marquee page in the TV's oshal app (app oshal, Orbit for Android 0.8.6), so Marquee 1.28.0 plays the person's own copy on a TV; the bridge (1.9.0) sends it as oshal://open?path=... and says when the app is missing or older than 0.8.6. No permission or egress changed.
# 21 | maintainer@emeraldcoastsystemsgroup.com | Release 1.9.1 (concierge audit batch 1, Create concierge pattern): device-concierge carries runtime harness claude-code, as Create's create-editor does. The bridge says 1.9.1 with no verb changed (its version follows the package's), so a computer updates it on its next use.
# 22 | maintainer@emeraldcoastsystemsgroup.com | Release 1.10.0 (T27; Roger, 2026-11-10: "we should be able to rename connections"): Rename for a computer in the tree saves the kernel's given name (PATCH /api/computers/{id}), the name the Devices page shows. The bridge says 1.10.0 with no verb changed. No route, tool, permission or egress of this package changed.
# 23 | maintainer@emeraldcoastsystemsgroup.com | Release 1.11.0 (T80; Roger, 2026-11-12: "hey jarvis in the game room open rings of power season 3 where i left off .. make it do that"): Play a Show on a TV (phone-control-play-show, POST /devices/:id/play) plays a show or film by its name on a saved Android or Fire TV, the way a person does with the remote: Prime Video's search, the matching result, then Resume (where the person left off) or Play, answered with what the TV says is playing. The bridge (1.11.0) carries oshal_phone_play.py. Proven on the office Fire TV: Season 3, Episode 3 resumed where Roger was.
# 24 | maintainer@emeraldcoastsystemsgroup.com | Release 1.12.0 (T79, the device inventory, first slice): What a TV can play (phone-control-tv-apps, POST /devices/:id/apps) says which streaming apps a saved Android or Fire TV has, so Jarvis can answer "what can my TV play" and pick the app: the bridge (1.12.0) carries oshal_phone_apps.py, whose lan-control tv_apps reads the TV's package list once and maps it through a closed list (Netflix, Prime Video, Disney+, Max, Hulu, YouTube and the oshal TV app), answering each app's key, name and package and only a count of the other packages; nothing on the TV is pressed, woken or opened. Bound as Open a Link on a TV; no permission or egress changed. Tested against a scripted TV; not yet run on a real TV.
# 25 | maintainer@emeraldcoastsystemsgroup.com | Release 1.12.1 (T79): the tool Jarvis lists saved devices with is "List My Phones and TVs", and its description says it lists TVs too, with whether each is a phone or a TV. It already listed both; its name said phones only, so a request for a TV could pass it by. No route, permission or data changed.
# ─────────────────────────────────────────────────────────────────────────────

name: phone-control
suite: ai-productivity
runtime: process
lastingStorage: true
rating:
  memoryMb: { low: 48, high: 192, basis: declared }
  features:
    - id: phone-control-action
      unit: device control operation
      tier: T1
      generation: none
      degrade: disable

displayName: Phone & Device Control
description: >-
  Unified live-image console for computers (pointer in touch or mouse mode, keyboard,
  special keys, monitors, file transfer, clipboard, lock on end), RDP host setup with a port
  check, Android phones and Fire TV / Android TV over Wi-Fi, and iPhone AirPlay screen mirroring
  (UxPlay) with calibrated Bluetooth pointer & keyboard (OSHAL-KB), dedicated Phone/TV and
  Connection Concierge, screenshots, session recordings, quality presets, chat and whiteboard overlays.
  On a saved Android or Fire TV it plays a show or film by its name in Prime Video, resuming where the
  person left off, opens a title's link in its streaming app, and says what the TV is playing.
  It also says which streaming apps a saved Android or Fire TV has, among Netflix, Prime Video,
  Disney+, Max, Hulu, YouTube and the oshal TV app.
version: 1.12.1
status: active
scope: person
chatBot: device-concierge
theme: light-blue

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: phone-control
  ref: main

smoke:
  - name: package-readiness
    method: GET
    path: /api/phone-control/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

uses:
  - storage
  - app-dependencies
  - test-catalog
  - application-authorization
  - experience-roles

authorization:
  version: 1
  catalog: authorization.yaml
  roleTemplates:
    - id: admin
      version: 1
      label: Device Control Administrator
      members:
        - { app: phone-control, role: admin }
    - id: operator
      version: 1
      label: Device page only (device features are for the administrator)
      members:
        - { app: phone-control, role: operator }
    - id: viewer
      version: 1
      label: Device page only, read (device features are for the administrator)
      members:
        - { app: phone-control, role: reader }

testing:
  version: 1
  catalog: tests/test-lab.yaml

dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: []
    tools: []
    connectors: []

bots:
  - agentId: f518c3e9-92a4-47d6-85c1-d827a93c1058
    name: device-concierge
    persona: personas/device-concierge.yaml
    posture: inline
    role: operations/device-concierge
    capabilities:
      - phone-device-inspection
      - phone-session-collaboration
    selectorDescriptor: >-
      Select to inspect and manage the person's Phone & Device Control sessions: phones, TVs and
      computers, session preferences (touch/mouse mode, quality, lock on end), session chat,
      whiteboard annotations, saved screenshots/recordings, file transfers and action history.
    routingKeywords:
      - phone control
      - connect your phone
      - android phone control
      - iphone keyboard
      - device concierge
      - register device
      - enroll device
      - fire tv
      - dpad
      - move down one and select
      - android
      - ipad
      - iphone

migrations:
  - migrations/001_initial_phone_control.sql
  - migrations/native/001-phone-control.sql

nativeMigrations:
  - id: migrations/001_initial_phone_control.sql
    native: skip
    reason: >-
      Native tables and constraints are in migrations/native/001-phone-control.sql;
      PostgreSQL alone applies the forced-RLS policy loop.

routes:
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/phone-control/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/phone-control-routes.js
    factory: createPhoneControlRoutes
    mountPath: /api/phone-control
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

ui:
  static:
    - toolName: phone-control-execution
      label: Phone & Device Control
      icon: codicon codicon-device-mobile
      iframeUrl: /api/phone-control/ui
      section: top

ribbon:
  hideFrameworkItems:
    - terminal
    - tasks
    - problems
    - debug
    - ports
  hideChatPanel: false
  hideStatusBar: true
  defaultView: phone-control-execution

surface:
  ops: [context, notify]

summary:
  path: /api/phone-control/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items

tools:
  - name: phone-control-list-devices
    displayName: List My Phones and TVs
    type: api
    category: operations
    description: List this person's phones and TVs saved in Phone & Device Control, each with its name, whether it is a phone or a TV, its address, the computer it connects through and whether control is allowed.
    executor:
      executorType: api
      apiEndpoint: GET /api/phone-control/devices
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      additionalProperties: false
    usageInstructions: Choose a phone or TV returned here, by the name the person gave it; never guess an id.
    routingTags:
      - operations
      - phone-control
      - devices
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-read-device
    displayName: Read One Phone
    type: api
    category: operations
    description: Read one of this person's phones and the last things sent to it with whether each worked.
    executor:
      executorType: api
      apiEndpoint: GET /api/phone-control/devices/{input.id}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        id:
          type: string
          minLength: 3
          maxLength: 64
      required:
        - id
      additionalProperties: false
    usageInstructions: Use an id from the phone list.
    routingTags:
      - operations
      - phone-control
      - devices
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-hardware-status
    displayName: Read My Computers' Phone Tools
    type: api
    category: operations
    description: The last report each of this person's computers gave about its phone tools (Bluetooth, the iPhone keyboard, adb and its phones), with the time it was read.
    executor:
      executorType: api
      apiEndpoint: GET /api/phone-control/computers/reports
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      additionalProperties: false
    usageInstructions: Say when each report was read; it is what the computer said then, not now.
    routingTags:
      - operations
      - phone-control
      - configuration
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-history
    displayName: Read What Was Sent
    type: api
    category: operations
    description: The person's recent Phone & Device Control history - what the page sent to a phone or computer and what the computer answered.
    executor:
      executorType: api
      apiEndpoint: GET /api/phone-control/history
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      additionalProperties: false
    usageInstructions: Report failures in the words recorded; never claim something worked that the history says failed.
    routingTags:
      - operations
      - phone-control
      - history
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-session-preferences
    displayName: Read Session Preferences
    type: api
    category: operations
    description: Read this person's saved session preferences (touch or mouse mode, picture quality, lock on end, and active monitor) for one or all devices.
    executor:
      executorType: api
      apiEndpoint: GET /api/phone-control/sessions/preferences
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        target:
          type: string
          minLength: 5
          maxLength: 110
      additionalProperties: false
    usageInstructions: Pass target as phone:<id> or computer:<id> when reading a specific device's session settings.
    routingTags:
      - operations
      - phone-control
      - configuration
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-update-preferences
    displayName: Update Session Preferences
    type: api
    category: operations
    description: Update this person's session preferences for a phone or computer (inputMode touch|mouse, quality high|balanced|low, lockOnEnd, monitorIndex).
    executor:
      executorType: api
      apiEndpoint: POST /api/phone-control/sessions/preferences
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        targetKey:
          type: string
          minLength: 5
          maxLength: 110
        inputMode:
          type: string
          enum: [touch, mouse]
        quality:
          type: string
          enum: [high, balanced, low]
        lockOnEnd:
          type: boolean
        monitorIndex:
          type: integer
          minimum: 0
          maximum: 15
      required:
        - targetKey
      additionalProperties: false
    usageInstructions: Use targetKey formatted as phone:<id> or computer:<id>.
    routingTags:
      - operations
      - phone-control
      - configuration
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-list-chat
    displayName: Read Session Chat
    type: api
    category: operations
    description: Read the chat message thread for one device or computer session.
    executor:
      executorType: api
      apiEndpoint: GET /api/phone-control/sessions/chat?target={input.target}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        target:
          type: string
          minLength: 5
          maxLength: 110
      required:
        - target
      additionalProperties: false
    usageInstructions: Pass target as phone:<id> or computer:<id>.
    routingTags:
      - operations
      - phone-control
      - chat
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-send-chat
    displayName: Send Session Chat Message
    type: api
    category: operations
    description: Append a message to a device or computer session's chat log.
    executor:
      executorType: api
      apiEndpoint: POST /api/phone-control/sessions/chat
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        targetKey:
          type: string
          minLength: 5
          maxLength: 110
        body:
          type: string
          minLength: 1
          maxLength: 1000
      required:
        - targetKey
        - body
      additionalProperties: false
    usageInstructions: Records the message in the session thread; remote desktop popup notifications run when sent from the open session page.
    routingTags:
      - operations
      - phone-control
      - chat
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-list-whiteboard
    displayName: Read Session Whiteboard
    type: api
    category: operations
    description: Read the active whiteboard annotation strokes overlaid on a device or computer session.
    executor:
      executorType: api
      apiEndpoint: GET /api/phone-control/sessions/whiteboard?target={input.target}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        target:
          type: string
          minLength: 5
          maxLength: 110
      required:
        - target
      additionalProperties: false
    usageInstructions: Pass target as phone:<id> or computer:<id>.
    routingTags:
      - operations
      - phone-control
      - whiteboard
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-add-whiteboard
    displayName: Add Whiteboard Stroke
    type: api
    category: operations
    description: Add a normalized (0..1) annotation stroke to a session's whiteboard overlay.
    executor:
      executorType: api
      apiEndpoint: POST /api/phone-control/sessions/whiteboard
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        targetKey:
          type: string
          minLength: 5
          maxLength: 110
        color:
          type: string
          enum: [red, gold, green, blue]
        points:
          type: array
          minItems: 2
          maxItems: 600
          items:
            type: object
            properties:
              x: { type: number, minimum: 0, maximum: 1 }
              y: { type: number, minimum: 0, maximum: 1 }
            required: [x, y]
            additionalProperties: false
      required:
        - targetKey
        - points
      additionalProperties: false
    usageInstructions: Coordinates x and y are normalized 0..1 across the device frame.
    routingTags:
      - operations
      - phone-control
      - whiteboard
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-clear-whiteboard
    displayName: Clear Session Whiteboard
    type: api
    category: operations
    description: Clear all whiteboard strokes on a device or computer session.
    executor:
      executorType: api
      apiEndpoint: DELETE /api/phone-control/sessions/whiteboard?target={input.target}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        target:
          type: string
          minLength: 5
          maxLength: 110
      required:
        - target
      additionalProperties: false
    usageInstructions: Pass target as phone:<id> or computer:<id>.
    routingTags:
      - operations
      - phone-control
      - whiteboard
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-list-captures
    displayName: List Saved Screenshots and Recordings
    type: api
    category: operations
    description: List this person's saved session screenshots and video clips.
    executor:
      executorType: api
      apiEndpoint: GET /api/phone-control/sessions/captures
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        target:
          type: string
          minLength: 5
          maxLength: 110
        kind:
          type: string
          enum: [screenshot, recording]
      additionalProperties: false
    usageInstructions: Lists saved captures stored in the person's own package space.
    routingTags:
      - operations
      - phone-control
      - captures
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-list-transfers
    displayName: List Session File Transfers
    type: api
    category: operations
    description: List this person's recent and staged file transfers across device and computer sessions.
    executor:
      executorType: api
      apiEndpoint: GET /api/phone-control/sessions/transfers
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        target:
          type: string
          minLength: 5
          maxLength: 110
      additionalProperties: false
    usageInstructions: Shows completed, staged and refused transfers with honest status notes.
    routingTags:
      - operations
      - phone-control
      - files
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-stage-transfer
    displayName: Stage Session File Transfer
    type: api
    category: operations
    description: Stage a bounded base64 file in the person's Phone & Device Control transfer queue for sending or downloading in the session UI.
    executor:
      executorType: api
      apiEndpoint: POST /api/phone-control/sessions/transfers
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        targetKey:
          type: string
          minLength: 5
          maxLength: 110
        fileName:
          type: string
          minLength: 1
          maxLength: 118
        dataBase64:
          type: string
          minLength: 1
        note:
          type: string
          maxLength: 300
