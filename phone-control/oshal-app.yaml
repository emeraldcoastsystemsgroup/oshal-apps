# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — phone-control ("Phone & Device Control")
# Control your Android phone (adb over Wi-Fi: its screen, taps, keys, typing and
# apps) and your iPhone (as a Bluetooth keyboard and pointer) through your own
# computer running oshal Node, and control your computers' screens.
# CHANGE LOG
# 1 | maintainer@emeraldcoastsystemsgroup.com | phone-control 1.0.0 as delivered on 2026-11-05.
# 2 | maintainer@emeraldcoastsystemsgroup.com | 1.1.0, every control real or removed (Roger, 2026-11-06: "phone control fix it place"): the page drives each phone through the person's own computer with the kernel's /api/computers (ADR-205), and installs the phone bridge there itself. Removed tools and routes: the control contract, enrol device, apply actions, the keyword concierge, verify mirror key, the screenshot import and the artifacts list. The concierge reads; it does not act.
# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.1.1: the design standard as measured on production: solid controls with crisp edges, a view switch that is a selection, one primary per screen, and an empty screen that is one card with Set up a computer instead of an empty phone frame. No route, tool or permission changed.
# 4 | maintainer@emeraldcoastsystemsgroup.com | 1.1.2: the rail labels keep their caption size and hide while empty; the setup table says once when it was read. No route, tool or permission changed.
# 5 | maintainer@emeraldcoastsystemsgroup.com | 1.2.0: device features require the administrator tier (personal owner isolation unchanged); every Connect / Use this computer press answers in its own card; Fire TV / Android TV connection over network adb with a TV remote; explicit iPhone Bluetooth steps and Remove pairing.
# 6 | maintainer@emeraldcoastsystemsgroup.com | 1.3.0: real iPhone screen mirroring over AirPlay through UxPlay on the person's Linux computer, explicit Bluetooth peripheral pairing steps, merged Connect sheet (phone-control-config removed from ui.static; /api/phone-control/config/ui opens the Connect sheet), and full-frame remote-control session layout. Authorization contract unchanged.
# 7 | maintainer@emeraldcoastsystemsgroup.com | 1.4.0: deliver all 13 Reference-Product session features (RP-PHC-01..13) — direct computer pointer/keyboard control in touch or mouse mode, special keys & chords (Ctrl+Alt+Del, Super, F1-F12), file transfer, clipboard sync, multi-monitor switching, screenshot & session clip recording, picture quality presets, capability-gated privacy screen, lock-on-end, session chat, whiteboard annotations, switch sides, and concierge session tool parity.
# ─────────────────────────────────────────────────────────────────────────────

name: phone-control
suite: ai-productivity
runtime: process
lastingStorage: true
rating:
  memoryMb: { low: 48, high: 192, basis: declared }
  features:
    - id: phone-control-action
      unit: device control operation
      tier: T1
      generation: none
      degrade: disable

displayName: Phone & Device Control
description: >-
  Unified live-image console for computers (pointer in touch or mouse mode, keyboard,
  special keys, monitors, file transfer, clipboard, lock on end), live RDP desktops,
  Android phones and Fire TV / Android TV over Wi-Fi, and iPhone AirPlay screen mirroring
  (UxPlay) with calibrated Bluetooth pointer & keyboard (OSHAL-KB), dedicated Phone/TV/RDP
  Concierge, screenshots, session recordings, quality presets, chat and whiteboard overlays.
version: 1.4.0
status: active
scope: person
chatBot: device-concierge
theme: light-blue

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: phone-control
  ref: main

smoke:
  - name: package-readiness
    method: GET
    path: /api/phone-control/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

uses:
  - storage
  - app-dependencies
  - test-catalog
  - application-authorization
  - experience-roles

authorization:
  version: 1
  catalog: authorization.yaml
  roleTemplates:
    - id: admin
      version: 1
      label: Device Control Administrator
      members:
        - { app: phone-control, role: admin }
    - id: operator
      version: 1
      label: Device page only (device features are for the administrator)
      members:
        - { app: phone-control, role: operator }
    - id: viewer
      version: 1
      label: Device page only, read (device features are for the administrator)
      members:
        - { app: phone-control, role: reader }

testing:
  version: 1
  catalog: tests/test-lab.yaml

dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: []
    tools: []
    connectors: []

bots:
  - agentId: f518c3e9-92a4-47d6-85c1-d827a93c1058
    name: device-concierge
    persona: personas/device-concierge.yaml
    posture: inline
    role: operations/device-concierge
    capabilities:
      - phone-device-inspection
      - phone-session-collaboration
    selectorDescriptor: >-
      Select to inspect and manage the person's Phone & Device Control sessions: phones, TVs and
      computers, session preferences (touch/mouse mode, quality, lock on end), session chat,
      whiteboard annotations, saved screenshots/recordings, file transfers and action history.
    routingKeywords:
      - phone control
      - connect your phone
      - android phone control
      - iphone keyboard
      - device concierge

migrations:
  - migrations/001_initial_phone_control.sql
  - migrations/native/001-phone-control.sql

nativeMigrations:
  - id: migrations/001_initial_phone_control.sql
    native: skip
    reason: >-
      Native tables and constraints are in migrations/native/001-phone-control.sql;
      PostgreSQL alone applies the forced-RLS policy loop.

routes:
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/phone-control/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/phone-control-routes.js
    factory: createPhoneControlRoutes
    mountPath: /api/phone-control
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

ui:
  static:
    - toolName: phone-control-execution
      label: Phone & Device Control
      icon: codicon codicon-device-mobile
      iframeUrl: /api/phone-control/ui
      section: top

ribbon:
  hideFrameworkItems:
    - terminal
    - tasks
    - problems
    - debug
    - ports
  hideChatPanel: false
  hideStatusBar: true
  defaultView: phone-control-execution

surface:
  ops: [context, notify]

summary:
  path: /api/phone-control/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items

tools:
  - name: phone-control-list-devices
    displayName: List My Phones
    type: api
    category: operations
    description: List this person's phones in Phone & Device Control, each with the computer it connects through and whether control is allowed.
    executor:
      executorType: api
      apiEndpoint: GET /api/phone-control/devices
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      additionalProperties: false
    usageInstructions: Choose a phone returned here; never guess a phone id.
    routingTags:
      - operations
      - phone-control
      - devices
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-read-device
    displayName: Read One Phone
    type: api
    category: operations
    description: Read one of this person's phones and the last things sent to it with whether each worked.
    executor:
      executorType: api
      apiEndpoint: GET /api/phone-control/devices/{input.id}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        id:
          type: string
          minLength: 3
          maxLength: 64
      required:
        - id
      additionalProperties: false
    usageInstructions: Use an id from the phone list.
    routingTags:
      - operations
      - phone-control
      - devices
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-hardware-status
    displayName: Read My Computers' Phone Tools
    type: api
    category: operations
    description: The last report each of this person's computers gave about its phone tools (Bluetooth, the iPhone keyboard, adb and its phones), with the time it was read.
    executor:
      executorType: api
      apiEndpoint: GET /api/phone-control/computers/reports
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      additionalProperties: false
    usageInstructions: Say when each report was read; it is what the computer said then, not now.
    routingTags:
      - operations
      - phone-control
      - configuration
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-history
    displayName: Read What Was Sent
    type: api
    category: operations
    description: The person's recent Phone & Device Control history - what the page sent to a phone or computer and what the computer answered.
    executor:
      executorType: api
      apiEndpoint: GET /api/phone-control/history
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      additionalProperties: false
    usageInstructions: Report failures in the words recorded; never claim something worked that the history says failed.
    routingTags:
      - operations
      - phone-control
      - history
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-session-preferences
    displayName: Read Session Preferences
    type: api
    category: operations
    description: Read this person's saved session preferences (touch or mouse mode, picture quality, lock on end, and active monitor) for one or all devices.
    executor:
      executorType: api
      apiEndpoint: GET /api/phone-control/sessions/preferences
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        target:
          type: string
          minLength: 5
          maxLength: 110
      additionalProperties: false
    usageInstructions: Pass target as phone:<id> or computer:<id> when reading a specific device's session settings.
    routingTags:
      - operations
      - phone-control
      - configuration
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-update-preferences
    displayName: Update Session Preferences
    type: api
    category: operations
    description: Update this person's session preferences for a phone or computer (inputMode touch|mouse, quality high|balanced|low, lockOnEnd, monitorIndex).
    executor:
      executorType: api
      apiEndpoint: POST /api/phone-control/sessions/preferences
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        targetKey:
          type: string
          minLength: 5
          maxLength: 110
        inputMode:
          type: string
          enum: [touch, mouse]
        quality:
          type: string
          enum: [high, balanced, low]
        lockOnEnd:
          type: boolean
        monitorIndex:
          type: integer
          minimum: 0
          maximum: 15
      required:
        - targetKey
      additionalProperties: false
    usageInstructions: Use targetKey formatted as phone:<id> or computer:<id>.
    routingTags:
      - operations
      - phone-control
      - configuration
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-list-chat
    displayName: Read Session Chat
    type: api
    category: operations
    description: Read the chat message thread for one device or computer session.
    executor:
      executorType: api
      apiEndpoint: GET /api/phone-control/sessions/chat?target={input.target}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        target:
          type: string
          minLength: 5
          maxLength: 110
      required:
        - target
      additionalProperties: false
    usageInstructions: Pass target as phone:<id> or computer:<id>.
    routingTags:
      - operations
      - phone-control
      - chat
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-send-chat
    displayName: Send Session Chat Message
    type: api
    category: operations
    description: Append a message to a device or computer session's chat log.
    executor:
      executorType: api
      apiEndpoint: POST /api/phone-control/sessions/chat
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        targetKey:
          type: string
          minLength: 5
          maxLength: 110
        body:
          type: string
          minLength: 1
          maxLength: 1000
      required:
        - targetKey
        - body
      additionalProperties: false
    usageInstructions: Records the message in the session thread; remote desktop popup notifications run when sent from the open session page.
    routingTags:
      - operations
      - phone-control
      - chat
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-list-whiteboard
    displayName: Read Session Whiteboard
    type: api
    category: operations
    description: Read the active whiteboard annotation strokes overlaid on a device or computer session.
    executor:
      executorType: api
      apiEndpoint: GET /api/phone-control/sessions/whiteboard?target={input.target}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        target:
          type: string
          minLength: 5
          maxLength: 110
      required:
        - target
      additionalProperties: false
    usageInstructions: Pass target as phone:<id> or computer:<id>.
    routingTags:
      - operations
      - phone-control
      - whiteboard
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-add-whiteboard
    displayName: Add Whiteboard Stroke
    type: api
    category: operations
    description: Add a normalized (0..1) annotation stroke to a session's whiteboard overlay.
    executor:
      executorType: api
      apiEndpoint: POST /api/phone-control/sessions/whiteboard
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        targetKey:
          type: string
          minLength: 5
          maxLength: 110
        color:
          type: string
          enum: [red, gold, green, blue]
        points:
          type: array
          minItems: 2
          maxItems: 600
          items:
            type: object
            properties:
              x: { type: number, minimum: 0, maximum: 1 }
              y: { type: number, minimum: 0, maximum: 1 }
            required: [x, y]
            additionalProperties: false
      required:
        - targetKey
        - points
      additionalProperties: false
    usageInstructions: Coordinates x and y are normalized 0..1 across the device frame.
    routingTags:
      - operations
      - phone-control
      - whiteboard
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-clear-whiteboard
    displayName: Clear Session Whiteboard
    type: api
    category: operations
    description: Clear all whiteboard strokes on a device or computer session.
    executor:
      executorType: api
      apiEndpoint: DELETE /api/phone-control/sessions/whiteboard?target={input.target}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        target:
          type: string
          minLength: 5
          maxLength: 110
      required:
        - target
      additionalProperties: false
    usageInstructions: Pass target as phone:<id> or computer:<id>.
    routingTags:
      - operations
      - phone-control
      - whiteboard
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-list-captures
    displayName: List Saved Screenshots and Recordings
    type: api
    category: operations
    description: List this person's saved session screenshots and video clips.
    executor:
      executorType: api
      apiEndpoint: GET /api/phone-control/sessions/captures
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        target:
          type: string
          minLength: 5
          maxLength: 110
        kind:
          type: string
          enum: [screenshot, recording]
      additionalProperties: false
    usageInstructions: Lists saved captures stored in the person's own package space.
    routingTags:
      - operations
      - phone-control
      - captures
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-list-transfers
    displayName: List Session File Transfers
    type: api
    category: operations
    description: List this person's recent and staged file transfers across device and computer sessions.
    executor:
      executorType: api
      apiEndpoint: GET /api/phone-control/sessions/transfers
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        target:
          type: string
          minLength: 5
          maxLength: 110
      additionalProperties: false
    usageInstructions: Shows completed, staged and refused transfers with honest status notes.
    routingTags:
      - operations
      - phone-control
      - files
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-stage-transfer
    displayName: Stage Session File Transfer
    type: api
    category: operations
    description: Stage a bounded base64 file in the person's Phone & Device Control transfer queue for sending or downloading in the session UI.
    executor:
      executorType: api
      apiEndpoint: POST /api/phone-control/sessions/transfers
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        targetKey:
          type: string
          minLength: 5
          maxLength: 110
        fileName:
          type: string
          minLength: 1
          maxLength: 118
        dataBase64:
          type: string
          minLength: 1
        note:
          type: string
          maxLength: 300
      required:
        - targetKey
        - fileName
        - dataBase64
      additionalProperties: false
    usageInstructions: Stages the file in the person's own transfer list; pushing to a computer or Android phone runs from the open session page.
    routingTags:
      - operations
      - phone-control
      - files
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-plan-command
    displayName: Plan Device Pointer or Keyboard Command
    type: api
    category: operations
    description: Build the closed bridge command (screen, move, click, drag, type, key, or calibrate) and target computer node for one of this person's saved phones or TVs.
    executor:
      executorType: api
      apiEndpoint: POST /api/phone-control/devices/{input.id}/command-plan
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        id:
          type: string
          minLength: 3
          maxLength: 64
        action:
          type: string
          enum: [screen, move, click, drag, type, key, calibrate]
        x:
          type: integer
          minimum: 0
          maximum: 16384
        y:
          type: integer
          minimum: 0
          maximum: 16384
        x1:
          type: integer
          minimum: 0
          maximum: 16384
        y1:
          type: integer
          minimum: 0
          maximum: 16384
        x2:
          type: integer
          minimum: 0
          maximum: 16384
        y2:
          type: integer
          minimum: 0
          maximum: 16384
        width:
          type: integer
          minimum: 1
          maximum: 16384
        height:
          type: integer
          minimum: 1
          maximum: 16384
        holdMs:
          type: integer
          minimum: 0
          maximum: 4000
        text:
          type: string
          minLength: 1
          maxLength: 300
        enter:
          type: boolean
        key:
          type: string
          minLength: 1
          maxLength: 32
      required:
        - id
        - action
      additionalProperties: false
    usageInstructions: Use an id from List My Phones; shares the same move/click/drag/type/key primitive contract as interactive screen clicks and automation jobs.
    routingTags:
      - operations
      - phone-control
      - devices
    skills:
      - phone-device-control
    tags:
      - route-backed

  - name: phone-control-rdp-command
    displayName: Plan RDP Session Input Command
    type: api
    category: operations
    description: Build and validate an active RDP session input payload (click, drag, move, type, key, scroll, or snapshot) for the unified Phone & Device Control console and Jarvis RDP orchestration.
    executor:
      executorType: api
      apiEndpoint: POST /api/phone-control/rdp/command-plan
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        rdpSessionId:
          type: string
          minLength: 3
          maxLength: 96
        action:
          type: string
          enum: [click, drag, move, type, key, scroll, snapshot]
        x:
          type: integer
          minimum: 0
          maximum: 16384
        y:
          type: integer
          minimum: 0
          maximum: 16384
        x1:
          type: integer
          minimum: 0
          maximum: 16384
        y1:
          type: integer
          minimum: 0
          maximum: 16384
        x2:
          type: integer
          minimum: 0
          maximum: 16384
        y2:
          type: integer
          minimum: 0
          maximum: 16384
        text:
          type: string
          minLength: 1
          maxLength: 300
        enter:
          type: boolean
        key:
          type: string
          minLength: 1
          maxLength: 32
        amount:
          type: integer
          minimum: -50
          maximum: 50
      required:
        - rdpSessionId
        - action
      additionalProperties: false
    usageInstructions: Pass rdpSessionId from the active console context to validate click, drag, move, type, key, scroll, or screen snapshot inputs on an RDP desktop session.
    routingTags:
      - operations
      - phone-control
      - rdp
    skills:
      - phone-device-control
    tags:
      - route-backed
