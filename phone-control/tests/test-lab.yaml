  - id: phone-control-ble-takeover
    name: The iPhone keyboard takes over on the operator's computer
    purpose: After Set up this computer and Replace the earlier test keyboard on the computer with the bonded iPhone, record that the earlier keyboard is gone, the bridge's keyboard advertises, the iPhone is connected and subscribed, a typed line is sent, and the pairing window closes back to not pairable.
    level: live
    runner:
      kind: external
      scope: package
      files:
        - tests/live/ble-takeover.sh
    expected:
      - The receipt shows ble.registered and ble.advertising, a connected paired iPhone, its reports subscribed and ble-type answered sent true; the operator confirms the text on the phone.
    prerequisites:
      - device:bluetooth-adapter
      - device:bonded-iphone
    sideEffects: external-write
    isolation:
      mode: live
    limits:
      timeoutMs: 120000
    installation: never

  - id: phone-control-android-device
    name: An Android phone after pairing
    purpose: On the computer the phone is paired with, list it, read a picture whose aspect matches the phone, press Home and read the launcher, open an app and see it on screen.
    level: live
    runner:
