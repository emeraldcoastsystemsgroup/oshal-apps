  - id: phone-control-isolation
    name: Every person's own devices, and nobody else's, on a disposable kernel
    purpose: Boot a disposable Postgres and oshald with a Device Control administrator, a person who is not an administrator (the operator template) and a page-only account (the viewer template), proving the person who is not an administrator adds a TV on their own computer and presses it there, sees and reaches nothing of the administrator's, cannot give anyone a role, and that the page-only account is refused every device feature.
    level: integration
    runner:
      kind: external
      scope: package
      files:
        - tests/live/isolation-proof.sh
        - tests/live/isolation-proof.cjs
    expected:
      - Person B (not an administrator) gets empty lists and 404 on Person A's TV and mirrored iPhone, history, reports, computer run, mirror-frame and screen, with zero commands delivered to Person A's computer.
      - Person B then adds a TV on their own computer without naming one, presses it, and the kernel delivers that one command to Person B's computer and none to Person A's; Person A reads 404 on Person B's TV.
      - Person B is refused (403) when previewing or applying a role for themselves: giving access stays with the installation's administrators.
      - Person C (page only) gets 200 on /api/phone-control/ui with the Not available on your account card, and 403 on listing, adding and the bridge files.
      - POST /api/phone-control/provision without serverUrl answers server_required on the kernel's loopback address, also when the caller sends a public-origin header of its own; arriving on a public host name it plans https at that host; a named serverUrl is used as given.
    prerequisites:
      - service:docker
      - fixture:oshald-binary
    sideEffects: disposable
    isolation:
      mode: disposable
    limits:
      timeoutMs: 300000
    installation: never
    regressionTests:
      - { level: integration, file: tests/live/isolation-proof.cjs }

