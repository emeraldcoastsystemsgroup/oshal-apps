version: 1
cases:
  - id: package-readiness
    name: Installed package readiness
    purpose: Verify the readiness probe answers the package identity, its version and that its own store opens.
    level: integration
    runner:
      kind: smoke
      smoke: package-readiness
    expected:
      - The installed phone-control package answers its identity and version 1.19.0 with its store open.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: safe-smoke

  - id: phone-control-routes
    name: Routes over real HTTP and SQLite, owner isolation and the 1.0.0 cleanup
    purpose: Prove what remains answers, what 1.0.0 faked answers 404, records are the caller's own, history and reports validate, the bridge files match their sha256, and an existing 1.0.0 store loses its starter rows.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/phone-control-routes.test.cjs
    expected:
      - Fourteen removed 1.0.0 routes answer 404; no kernel caller is 401; a chosen tenant or owner is 400.
      - Another person reads a phone, its history and the reports as missing or empty.
      - Link, title, app-list and sequence plans return planned true and executed false, preserve the exact computer command and write no execution history; actual recorded success and failure remain owner-scoped.
      - The Connection Concierge never offers Connect in console; an RDP question gets Check RDP port only, and a model reply naming connect_rdp is dropped.
      - Every 1.0.0 device row (each carries the invented handshake), its frames and its blob files are deleted once; other rows stay.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
    installation: never
    regressionTests:
      - { level: integration, file: tests/phone-control-routes.test.cjs }

  - id: phone-control-honesty
    name: Honesty guard against fakes returning
    purpose: Go red if the package server reaches a network, process or radio, if a mirroring, receiver, key or OCR claim returns, if a public default secret returns, or if a button is not wired to a real call.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/phone-control-honesty.test.cjs
    expected:
      - Every page button and form has a handler; every key button names a key the bridge has; every page verb is a bridge verb.
      - Every route has exactly one catalog binding; the concierge's tools only read.
    prerequisites:
      - runner:node-test
      - runtime:store-pinned-toolchain
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 20000
    installation: never
    regressionTests:
      - { level: unit, file: tests/phone-control-honesty.test.cjs }

  - id: phone-control-module-names
    name: Every name a browser module uses resolves
    purpose: Go red when a page module calls a name that is neither declared, imported nor a browser global, or leaves a name a sibling module exports to the browser global of that name. 1.5.2 called isTvNode without importing it and Your devices could not be read.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/phone-control-module-names.test.cjs
    expected:
      - Every tools/*.js and tools/*.mjs parses under the store's pinned TypeScript checker with no unresolved name in running code.
      - No module leaves a sibling module's export to a browser global of the same name.
      - session-computer.js with isTvNode taken out of its import is reported at its isTvNode call; a module calling close() that a sibling exports is reported.
    prerequisites:
      - runner:node-test
      - runtime:store-pinned-toolchain
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
    installation: never
    regressionTests:
      - { level: unit, file: tests/phone-control-module-names.test.cjs }

  - id: phone-control-home-tree
    name: The first screen as a tree with details, rename, and Add a device buttons that fit
    purpose: Open the real page in Chromium over a stand-in for its routes, at desktop and phone size, and check that each computer lists the phones and TVs that connect through it, rows start at the left, a device's Details are tables beside the tree (under the row on a phone), Rename saves through the device route, and no button in Add a device cuts its words.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/phone-control-home-tree.test.mjs
    expected:
      - Search selects the matching child before its parent and connection help/control options preserve existing actions at 412px and desktop.
      - Computers are listed connected first, each with its phones and TVs under it; devices attached to no listed computer are grouped apart.
      - Details show How it connects, Through, State, Control and Address for a saved device, and What it can do for a computer.
      - Rename posts the new name to the device route and the tree shows it.
      - No button in the Add a device sheet has clipped text at 412 px or 1280 px.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 120000
    installation: never
    regressionTests:
      - { level: browser, file: tests/phone-control-home-tree.test.mjs }
  - id: phone-control-ux-batch7
    name: Merged Connect sheet, full-frame session sheet UX, and real UxPlay mirroring guard
    purpose: Verify single ui.static tile, Connect sheet ordering and 5s/2m auto-poll, full-frame session with 48px Session sheet handle, RP-PHC-01..13 backlog controls, real Start mirroring replacing RP-PHC-14, explicit Bluetooth peripheral pairing guidance, and lowercase oshal Node.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/phone-control-ux-batch7.test.cjs
    expected:
      - phone-control-config is merged into phone-control-execution while /config/ui opens the Connect sheet.
      - RP-PHC-14 and RP-PHC-01..13 ship as live controls with zero planned placeholders.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 20000
    installation: never
    regressionTests:
      - { level: unit, file: tests/phone-control-ux-batch7.test.cjs }

  - id: phone-control-native-relay
    name: Saved native phone-to-TV connections and Open Orbit
    purpose: Exercise the real mounted HTTP routes and SQLite with explicit native-intent and admission fixtures; actual original-Jarvis and native-device authority are verified separately by the core integration suite.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/native-relay.test.cjs
    expected:
      - Listing forwards an empty closed request and returns the native saved connection response unchanged.
      - Open Orbit requires an exact canonical target and binding, and any echoed binding must match its path.
      - Unknown fields, changed selectors and insufficient own permission are refused without a native action.
      - Missing or refused native execution stays unavailable or refused with no retry, alternate bridge or local success record.
      - Tool schemas, route bindings, the existing own-scope authorization and intent.run capability agree.
    prerequisites:
      - runner:node-test
      - runtime:store-pinned-toolchain
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
    installation: never
    regressionTests:
      - { level: integration, file: tests/native-relay.test.cjs }

  - id: phone-control-fire-tv-guide
    name: Fire TV phone-app guide (read only)
    purpose: Exercise the real mounted guide route over HTTP and SQLite with a native-intent fixture that throws if called; a phone following the guide and what a TV then plays are outside this case.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/remote-guides.test.cjs
    expected:
      - The guide answers a fixed packet marked not executed, with connection and playback unverified, and writes no history.
      - It names no phone, TV, address or saved connection, and both owners read the same text.
      - The existing remote and its centre or select step come before any content search, which is only for different content.
      - Any query field, an absent or inactive kernel caller and a chosen owner or scope are refused.
      - The tool takes no input and is bound, like its route, to the existing own-scope read permissions only.
    prerequisites:
      - runner:node-test
      - runtime:store-pinned-toolchain
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
    installation: never
    regressionTests:
      - { level: integration, file: tests/remote-guides.test.cjs }

  - id: phone-control-device-path
    name: The Fire TV guide declares a way the kernel's path planner can offer
    purpose: Check the guide tool's devicePath declaration against the closed lists the kernel accepts and against the guide's own package and steps; the kernel's reading of it and a real phone are outside this case.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/phone-control-device-path.test.cjs
    expected:
      - Exactly one tool declares devicePath, and it is the read-only Fire TV guide.
      - Every field and value is on the lists the kernel accepts; a field outside them fails the case.
      - The declared application is the package the guide answers, and the declared jobs are the wake and resume the guide's steps describe.
      - The declaration claims no read of the TV, as the guide says the phone's page is not the TV screen.
    prerequisites:
      - runner:node-test
      - runtime:store-pinned-toolchain
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
    installation: never
    regressionTests:
      - { level: unit, file: tests/phone-control-device-path.test.cjs }

  - id: phone-control-rp-features
    name: Session preferences, captures, transfers, chat, whiteboard, and concierge turn planner
    purpose: Verify owner-isolated SQLite persistence and binary payload storage under OSHAL_PACKAGE_DATA_DIR for RP-PHC-01..13 session routes and editor handoff snapshots.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/phone-control-rp-features.test.cjs
    expected:
      - Preferences, chat, whiteboard overlays, captures, and transfers validate inputs and enforce owner 404 isolation.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
    installation: never
    regressionTests:
      - { level: integration, file: tests/phone-control-rp-features.test.cjs }

  - id: phone-control-rp-browser
    name: Chromium proof for RP-PHC-01..13, Phone & TV Concierge, Fire TV 1-step loader, and RDP setup
    purpose: Verify in headless Chromium at 1440x900 and 412x743 that computer session tools, Phone & TV Concierge, BLE calibration, 1-step Fire TV Load oshal TV, and RDP setup/probe operate with zero console errors or 404s.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/phone-control-rp-browser.test.cjs
    expected:
      - Computer session dispatches desktop.control, monitor enumeration, captures, transfers, clipboard, chat, and whiteboard saves.
      - Phone & TV Concierge execute bounded actions, Load oshal TV polls unauthorized to device and installs APK, and RDP probe verifies X.224.
      - Connect in console and the RDP sign-in fields are hidden, Check RDP port answers through the bridge, and the Connect sheet makes no /api/rdp/sessions request.
    prerequisites:
      - runner:node-test
      - runtime:store-pinned-toolchain
      - runtime:chromium
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 60000
    installation: never
    regressionTests:
      - { level: browser, file: tests/phone-control-rp-browser.test.cjs }

  - id: phone-control-141
    name: Studio workspace, BLE sync & swipe, Fire TV DRM notice, gated RDP, and guided Android pairing
    purpose: Prove in Python, unit, and Chromium tests that 1.4.1 ships the compact screen-first studio toolbar, fullscreen stage + Escape exit, collapsible Concierge drawer, BLE 0x1801/connect_bonded/ble-sync and non-flooding swipes, pre-mirror iOS touchpad gestures, Fire TV protectedSurface notice + fast post-key frame wakeups, zero default /api/rdp/sessions calls, and guided Android pairing with IP prefill.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/phone-control-141.test.cjs
    expected:
      - Default load issues zero /api/rdp/sessions requests; studio toolbar toggles fullscreen, Concierge drawer, and BLE sync; pre-mirror iPhone touchpad swipes work.
      - Uniform black awake TV frames report protectedSurface with activePackage and show #protectedSurfaceNotice; guided Android pairing prefills host IP when mDNS is absent.
    prerequisites:
      - runner:node-test
      - runtime:python3
      - runtime:store-pinned-toolchain
      - runtime:chromium
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 60000
    installation: never
    regressionTests:
      - { level: browser, file: tests/phone-control-141.test.cjs }

  - id: phone-control-link
    name: Computer link commands run by real bash and python3
    purpose: Prove only a closed verb and base64 reach the shell, the install command installs exactly the package bridge and refuses a damaged file before writing any, and a picture read in parts is checked by sha256.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/phone-control-link.test.mjs
    expected:
      - Hostile typed text never appears in the command; nothing it names runs.
      - After install the bridge reports the manifest's sha256 for every file.
    prerequisites:
      - runner:node-test
      - runtime:python3
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
    installation: never
    regressionTests:
      - { level: integration, file: tests/phone-control-link.test.mjs }

  - id: phone-control-bridge
    name: The bridge on a computer with no Bluetooth
    purpose: Run the bridge with the system python3 where there is no system message bus and prove it says so, never answers sent, keeps its verb list closed, checks every argument before adb is touched and answers one bounded JSON line.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/phone-control-bridge.test.mjs
    expected:
      - Every iPhone verb answers ble_not_running and never sent; the resident keyboard refuses to start and leaves no socket.
    prerequisites:
      - runner:node-test
      - runtime:python3
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 60000
    installation: never
    regressionTests:
      - { level: integration, file: tests/phone-control-bridge.test.mjs }

  - id: phone-control-play
    name: A show plays by its name on a Fire TV, against a scripted TV
    purpose: Prove the bridge's lan-control play_title (bridge/oshal_phone_play.py) does what a person does with the remote and reads the screen after every move (T80, Roger 2026-11-12, "hey jarvis in the game room open rings of power season 3 where i left off").
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/phone-control-play.test.mjs
    expected:
      - Prime Video's search link opens its results; one Down moves onto the matching show; OK opens its page; OK presses Resume; the keys sent are wake, Down, OK, OK.
      - The answer names the button pressed (Resume Episode 3), the episode line (Season 3, Episode 3 - The Secret Fire) and playing true from Prime Video's own session.
      - A YouTube session left saying playing does not make it playing while Prime Video is paused.
      - No matching show, another app, a one-letter name and Prime Video not installed are refused in words (not_found, not_yet, bad_title, not_installed).
    prerequisites:
      - runner:node-test
      - runtime:python3
    sideEffects: none
    isolation: { mode: disposable, cleanup: "A scripted TV in memory; no adb, network or device is contacted." }
    limits: { timeoutMs: 120000, maxMemoryMb: 256 }
    installation: never
  - id: phone-control-apps
    name: Which streaming apps a TV has, against a scripted TV
    purpose: Prove the bridge's lan-control tv_apps (bridge/oshal_phone_apps.py) says which streaming apps an Android or Fire TV has from one read of its package list, through a closed list of known apps, and presses nothing on the TV (T79, the device inventory, first slice).
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/phone-control-apps.test.mjs
    expected:
      - A Fire TV answers Netflix, Prime Video (its own Fire TV package), YouTube and the oshal TV app with their keys and packages, and counts its four other packages without naming them.
      - The TV receives only reads (pm list packages, then its model and maker with getprop); no key, wake or app is sent. A property it cannot read, or one that is not a plain name, is left out and the apps are still answered.
      - A Google TV answers its own packages, and one service installed twice is one app.
      - An empty list and an adb failure are refused in words (no_app_list, not_connected); a Roku and a Samsung TV are refused in words (android_only), also by the installed bridge verb.
    prerequisites:
      - runner:node-test
      - runtime:python3
    sideEffects: none
    isolation: { mode: disposable, cleanup: "A scripted TV in memory; no adb, network or device is contacted." }
    limits: { timeoutMs: 120000, maxMemoryMb: 256 }
    installation: never
  - id: phone-control-inventory
    name: What a TV can play, kept in the person's device inventory
    purpose: Prove POST /devices/:id/apps/record (routes/phone-control-inventory.js) checks the one JSON line the TV's computer printed for What a TV can play, records it against the TV, and hands the kernel's device.inventory.record, as the person, the TV, its ADB route through its own computer, its applications with the services they reach, what was looked for and the others counted (T79, the device inventory).
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/phone-control-inventory.test.cjs
    expected:
      - The apps go through the closed list, each once, with a package only when it is a package name; a package outside the list never reaches the kernel; the read is recorded against the TV.
      - The kernel is told the TV by its saved id and name, a Fire TV from its model (only a TV when nothing says which), its ADB route through the TV's own computer that worked, that its applications can be listed, the apps and their services, the seven looked for and the others.
      - A read the TV refused records the route as down in the bridge's words and claims nothing else; a kernel that refuses, or has no inventory, is said in words while the apps are still answered.
      - A phone, an unknown TV, another person's TV and a missing or foreign reply are refused in words, and nothing refused reaches the kernel.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation: { mode: disposable, cleanup: "The package's own store in a throwaway folder and a stand-in kernel intent in memory; no device is contacted." }
    limits: { timeoutMs: 60000, maxMemoryMb: 256 }
    installation: never
  - id: phone-control-own-devices
    name: Every person uses their own devices; nothing reaches beyond them
    purpose: Prove, with the permission catalog deciding each request in front of the package's real routes and store, that a person who is not an administrator (the operator or the editor role) adds a TV on their own computer, renames it, presses it, writes history, reads the bridge files and removes it; that another person's device, history and computer stay out of reach; that a page-only account (viewer, reader) reads the page and is refused every device feature; and that the catalog keeps both resources at the own scope.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/phone-control-own-devices.test.cjs
    expected:
      - An operator and an editor each add a TV that their own computer connects (no computer named), rename it, press it (the command names their own computer), keep history, read the bridge manifest at the package version and remove it.
      - The other person's TV answers 404 to read, rename, press, plan, open a link and remove; their history and computer reports are not listed; a person with no computer of their own is refused in words, never given someone else's.
      - A viewer and a reader read the page with the Not available on your account card, which no longer names the administrator, and get 403 on every device feature.
      - The eight working permissions sit at the tier their effect needs, the operator, editor and admin roles grant all ten at the own scope, every route, tool and bot is open to a person who is not an administrator, and a resource with a wider scope would have to keep its permissions at the admin tier.
    prerequisites:
      - runner:node-test
      - runtime:store-pinned-toolchain
    sideEffects: none
    isolation: { mode: disposable, cleanup: "The package's own store in a throwaway folder; the catalog is read from the package; no device or kernel is contacted." }
    limits: { timeoutMs: 60000, maxMemoryMb: 256 }
    installation: never
    regressionTests:
      - { level: integration, file: tests/phone-control-own-devices.test.cjs }
      - { level: integration, file: tests/live/isolation-proof.cjs }
  - id: phone-control-installation-address
    name: A device is told the installation it is on, never a fixed one
    purpose: Prove over the real routes and real HTTP, with the headers the kernel hands a package, that POST /provision without a serverUrl plans the public origin the kernel declares for this installation, else the public host name the request arrived on as https whatever the request's protocol says, and otherwise answers server_required in words and plans nothing; that the page's four pushes of the oshal app send the page's own origin; and that no file the package runs names an installation.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/phone-control-installation-address.test.cjs
    expected:
      - A tool call (x-oshal-public-origin, no Host) plans that origin, and the command the computer runs carries it; a declared http origin with a port is kept as declared.
      - With no declared origin, a public host name is planned as https with protocol http on the request; the caller's serverUrl wins over both.
      - A loopback or home-network address, a bare name, no Host, and a public-origin header that is not an origin answer 400 server_required ("Say which server this TV should connect to.") with no plan.
      - The four pushes on the page send installationOrigin(), the page's own origin; outside a page there is none.
      - The guard catches a fixed installation address with and without a scheme, an unknown outside host and a house network address, lets reserved names through, and finds none in the package's runtime files.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation: { mode: disposable, cleanup: "The package's own store in a throwaway folder and a loopback server; no device or kernel is contacted." }
    limits: { timeoutMs: 60000, maxMemoryMb: 256 }
    installation: never
    regressionTests:
      - { level: integration, file: tests/phone-control-installation-address.test.cjs }
      - { level: integration, file: tests/live/isolation-proof.cjs }
  - id: phone-control-lan
    name: TVs and streaming sticks on the home network, against protocol fakes
    purpose: Prove the bridge's lan-discover and lan-control verbs (bridge/oshal_phone_lan.py) refuse any address that is not a private home-network address and any action outside the closed list, send the exact Wake-on-LAN bytes only to the MACs named, read a Samsung, Roku or Cast device read-only, press keys on a fake Roku ECP server and a fake Samsung TLS WebSocket TV, keep the Samsung pairing token 0600 on the computer, and find two fake TVs without running adb or installing anything.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/phone-control-lan.test.mjs
    expected:
      - A public address (8.8.8.8, 192.0.2.x, 100.64.x) answers public_address from the installed verb in one JSON line with exit 3.
      - The Wake-on-LAN packet received on a local UDP socket is six 0xFF bytes and the MAC sixteen times.
      - The fake Samsung TV gets no key before Allow ("Press Allow on the TV, then Retry."); after Allow the token is saved 0600 in a 0700 folder, never appears in an answer, and is used on the next connection.
      - The fake Roku records one POST /keypress/<Key> per press; a 403 answers roku_control_off in words.
      - Discovery of two fake TVs answers their kinds, names, power and MACs, sends no packet, and never calls adb.
      - 1.9.0 launch_url with app oshal opens only a Marquee page of the installation in the oshal TV app as oshal://open?path=...; an app older than 0.8.6 answers app_too_old and a missing one not_installed.
      - 1.8.0 On an Android TV, now_playing only reads (dumpsys media_session and dumpsys window) and names the app, the title, its state and that it is behind the home screen; pause, play, next, previous and stop send their media key and answer what the sessions say after; nothing played yet answers nothing_playing; a Roku or Samsung TV answers android_only.
    prerequisites:
      - runner:node-test
      - runtime:python3
      - runtime:openssl
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: The throwaway home, token folder, certificate and loopback servers are removed when the suite ends.
    limits:
      timeoutMs: 120000
    installation: never
    regressionTests:
      - { level: integration, file: tests/phone-control-lan.test.mjs }

  - id: phone-control-ble-pairing
    name: Bluetooth pairing asks first and trusts only what the person allowed
    purpose: Prove the resident Bluetooth bridge (bridge/oshal_phone_ble.py serve) answers no pairing by itself. Against a scripted BlueZ on a private dbus-daemon (tests/python/fake_bluez.py), each pairing request is held and listed with its name and number until Allow or Reject, no answer is Rejected after the limit, one Allow closes the window and turns the other requests away, only an allowed device is Trusted and written to the 0600 allow-list, a device paired before is never trusted or reconnected until Keep, and a device that paired in the window without an Allow is removed when the window closes.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/phone-control-ble-pairing.test.mjs
    expected:
      - A RequestConfirmation from a device nobody allowed stays pending, is listed with its passkey, and is answered org.bluez.Error.Rejected after OSHAL_BLE_PAIR_ANSWER_S; the device is never Trusted.
      - pair-answer allow=true answers the held request, sets Trusted on that device only, writes it to ble-allowed.json (mode 0600), rejects the other waiting request and any later one, and the window closes.
      - Reading status and the device list, syncing and closing the window never set Trusted on a device that was paired before; sync on it answers not_allowed; keep trusts it and lets it reconnect.
      - A device BlueZ pairs without asking the agent (Just Works) is listed as waiting within a second, is removed when nobody answers, and is kept and Trusted on Allow; a second one after that Allow is removed.
    prerequisites:
      - runner:node-test
      - runtime:python3
      - runtime:python3-dbus
      - runtime:dbus-daemon
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: The private bus, the scripted BlueZ, the bridge process and the throwaway home are removed after each case.
    limits:
      timeoutMs: 120000
    installation: never
    regressionTests:
      - { level: integration, file: tests/phone-control-ble-pairing.test.mjs }

