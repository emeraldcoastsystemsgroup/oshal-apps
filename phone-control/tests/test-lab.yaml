    installation: never

  - id: phone-control-chain
    name: The whole chain on a throwaway installation with the real OSHAL Node app
    purpose: Browser to kernel to command queue to the published OSHAL Node AppImage (real sign-in and Allow) to bash to the bridge to adb, pressed as a person presses it.
    level: browser
    runner:
      kind: external
      scope: package
      files:
        - tests/live/chain-proof.sh
        - tests/live/chain-browser.cjs
        - tests/live/chain-node.cjs
        - tests/live/chain-desktop.Dockerfile
    expected:
      - Set up this computer ends with Android tools ready and No Bluetooth adapter on this computer, and the bridge there has the package's sha256.
      - Pair with an address where no phone listens says the phone did not answer, and History records it as failed.
      - The computer's picture shows in Devices and inside the cockpit frame; Work on it opens the kernel's page; no removed route is requested; no sideways scroll at 412 px.
    prerequisites:
      - service:docker
      - runtime:chromium
      - fixture:oshald-binary
      - fixture:oshal-node-appimage
    sideEffects: disposable
    isolation:
      mode: disposable
    limits:
