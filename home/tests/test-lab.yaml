version: 1
cases:
  - id: home-connect-copy
    name: The chat names the Hubs tab and every schedule field is labelled
    purpose: Drive the compiled POST /assistant with a recording model double and read the persona and the page's New schedule form.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/home-connect-copy.test.cjs] }
    expected:
      - The prompt the home-bot receives names this app's Hubs tab and forbids a raw path such as /utilities.
      - The prompt calls the data what the person's Smart Home app has saved and never uses the word snapshot (sweep 14).
      - The persona's not-connected answer names the Hubs tab, not Connections (/utilities).
      - Action, When, Time, Repeat and the minutes offset each sit in their own label, hidden and shown with it.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: disposable, cleanup: The temporary home-data directory is removed and the module resolver is restored. }
    limits: { timeoutMs: 20000 }
    installation: never
  - id: kernel-egress-smartthings
    name: Native kernel SmartThings calls through the declared egress
    purpose: Drive the compiled refresh, control and scene-run handlers with OSHAL_EGRESS=kernel, a recording fetch and synthetic connection metadata.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/kernel-egress.test.cjs] }
    expected:
      - Refresh, control and scene run reach api.smartthings.com with no Authorization header and no key in the URL; the device index and command bodies are the same as before.
      - A kernel "not connected" refusal, or metadata with no usable smartthings connection, answers each route's own 409 without reaching the provider when the metadata says so.
      - A SmartThings failure under the kernel stays a 502.
      - Outside the kernel the brokered token is still sent as the Bearer header and a missing token still answers 409.
      - The manifest declares api.smartthings.com with the smartthings Bearer credential.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: disposable, cleanup: The temporary home-data directory is removed and the module resolver is restored. }
    limits: { timeoutMs: 20000 }
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its family (Home shell) and company (Business shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - Each schedule in the family view reads as the full page writes it (solar event with a signed minute offset, otherwise the cron's local time and the weekday suffix), never the trigger object.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: home-empty-state
    name: Smart Home with no hub, a refused refresh, and the dashboard order
    purpose: Drive the real Smart Home page in Chromium at 412 x 915, in the 392 x 641 cockpit frame and at 1440 x 900 with synthetic reads (UX audit 2026-11-05, home-dashboard).
    level: browser
    runner: { kind: node-test, scope: package, files: [tests/browser/home-empty-state.test.cjs] }
    expected:
      - With no hub the page is one empty state (No devices yet) with one primary, Connect a hub, which opens the SmartThings and Google Home rows with Not connected pills; no schedule form, no Refresh, no inline Ask bar, no heading.
      - A refused refresh (409) is an alert reading "SmartThings isn't connected yet. Connect it above." with Connect a hub, never a /utilities path.
      - With devices the Smart Home screen is devices then scenes; the SmartThings pill says when it was read; the diagnostic brief stays withheld while no connected action mounts.
      - Automations (?view=automations) holds the schedules and New schedule, or one empty state (No automations yet, Connect a hub) when nothing can run.
    prerequisites: [runner:node-test, dependency:playwright, browser:chromium]
    sideEffects: none
    isolation: { mode: none, cleanup: Each case closes its browser context; pages and answers are synthetic and served inside the browser with no network or server. }
    limits: { timeoutMs: 60000, maxMemoryMb: 1024 }
    installation: never
  - id: home-hubs-and-transcript
    name: Hubs view on a phone
    purpose: Drive the real Smart Home page in Chromium at 412 x 915 and in the 392 x 641 cockpit frame with synthetic reads.
    level: browser
    runner: { kind: node-test, scope: package, files: [tests/browser/home-hubs-and-transcript.test.cjs] }
    expected:
      - With ?view=hubs the page shows the SmartThings connect link, the Google Home set-up link and the hubs that reported devices, hides the dashboard and chat, fits the screen and writes nothing.
      - The plain dashboard keeps the hubs panel hidden and has no inline Ask bar, and the manifest Hubs tab opens /api/home/ui?view=hubs.
    prerequisites: [runner:node-test, dependency:playwright, browser:chromium]
    sideEffects: none
    isolation: { mode: none, cleanup: Each case closes its browser context; pages and answers are synthetic and served inside the browser with no network or server. }
    limits: { timeoutMs: 60000, maxMemoryMb: 1024 }
    installation: never
  - id: home-weather
    name: Weather forecast from the National Weather Service
    purpose: The compiled weather module answers NWS forecast periods with the source named, refuses a missing, unknown or uncovered
      place in words, and the manifest declares the keyless egress, the tool and weather routing words.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
      - tests/home-weather.test.js
    expected:
    - Every case passes with a stand-in fetch; no network is used.
    prerequisites:
    - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: home-device-inspect-and-guide
    name: SmartThings device capability inspection and persistent Operations Guide & Runbook
    purpose: Verify inspectSmartThingsDevices extracts Samsung Family Hub refrigerator ViewInside camera and temperature capabilities, Operations Guide persists discovered capabilities and operator notes, and the manifest declares the tools and routing words.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
      - tests/home-device-inspect-and-guide.test.js
    expected:
    - Every case passes with a stand-in fetch and temporary package data directory.
    prerequisites:
    - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: The temporary package data directory is removed after the test.
    limits:
      timeoutMs: 15000
    installation: never
  - id: home-lan-devices
    name: TVs and streaming sticks - plans, records and the network-TV refusal
    purpose: Drive the compiled home-lan-devices module and home-routes router with stand-in framework modules and a temporary data folder.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/home-lan-devices.test.cjs] }
    expected:
      - A scan and a press answer planned (never executed) with the closed phone-control bridge command; saved TVs are woken only when asked.
      - A press plan is built per kind with the closed action list; a Roku refuses Open oshal and Pair, a Samsung refuses the Android app, a Cast device refuses every press, in words.
      - A scan answer saves private-address TVs for that person only (a public address is dropped), merged by hardware address, and lists the Android TVs for Phone & Device Control.
      - A TV's power changes only when its own answer says the press worked; an answer for another TV or another press is refused.
      - POST /control answers a network TV 409 tv_needs_computer and leaves its saved switch as it was; the routes answer 401 without a person.
      - The manifest declares the four tools inside /api/home, TV routing words and no new egress.
    prerequisites: [runner:node-test, runtime:store-pinned-toolchain]
    sideEffects: none
    isolation: { mode: disposable, cleanup: The temporary data folder is removed and the module resolver is restored. }
    limits: { timeoutMs: 30000 }
    installation: never
    regressionTests:
      - { level: unit, file: tests/home-lan-devices.test.cjs }
  - id: home-tv-plans
    name: Jarvis presses TV buttons through computer.run_plan
    purpose: Pin the computerPlan declarations the kernel reads and check every command the compiled scan and press plan routes answer against the kernel's plan grammar (oshal-kernel crates/oshald/src/computer_plans.rs), so the kernel keeps the plan and computer.run_plan can run it.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/home-lan-devices.test.cjs] }
    expected:
      - home-lan-discover declares exactly {program phone-bridge, verbs [lan-discover]} and home-lan-control exactly {program phone-bridge, verbs [lan-control]}; no other tool declares a plan.
      - Every scan and press plan answers 200 with the bridge prefix, its own tool's declared verb and --b64 with canonical base64 of one JSON object of at most 4 KiB, and a computer the kernel can read; a scan never fits the press declaration, nor a press the scan one.
      - The grammar check refuses a second command, a redirection, another prefix or flag, an undeclared verb, unpadded or URL-safe base64, a JSON array or string and an oversized argument; the declaration check refuses another program, no verbs, an unknown verb and an extra key.
      - 1.7.0 On an Android TV, now_playing, play, pause, next, previous and stop are planned with bridge 1.8.0, a Samsung TV and a Roku refuse them in words, the recorded answer says what is playing (behind another app or not) and the TV keeps it across a new scan.
      - Both tool descriptions, the plans' next step and the persona say to pass the planId to computer.run_plan, then record the computer's answer with home-lan-record, and otherwise to say it is planned and point to the Smart Home TV buttons; none names computer.run or computer.list.
    prerequisites: [runner:node-test, runtime:store-pinned-toolchain]
    sideEffects: none
    isolation: { mode: disposable, cleanup: The temporary data folder is removed and the module resolver is restored. }
    limits: { timeoutMs: 30000 }
    installation: never
    regressionTests:
      - { level: unit, file: tests/home-lan-devices.test.cjs }
  - id: home-tvs
    name: TVs and streaming sticks on the Smart Home screen, in Chromium
    purpose: The real page and its module at 412 x 915 with phone-control's real computer link, the compiled package routes for every write, and the person's computer played by the test.
    level: browser
    runner: { kind: node-test, scope: package, files: [tests/browser/home-tvs.test.cjs] }
    expected:
      - 1.7.0 An Android TV's card has Previous, Pause, Play, Next and What's playing, each at least 44 x 44; Pause sends one closed lan-control pause and the card says what is playing behind another app and shows it on the Now playing line; a Samsung TV and a Roku have no media row.
      - The section shows with one Scan for TVs button that says what it does; the empty screen keeps one primary; opening the page writes nothing; no console error.
      - With no computer it says what to do and Scan is off.
      - Scan replaces an old bridge with phone-control's real install command, runs the planned scan, saves the TVs and adds the Android TV to Phone & Device Control.
      - A press says what the computer answered; a waiting Samsung reads "Press Allow on the TV, then Retry." with Retry, and its power stays as read; a Roku has no Open oshal.
      - A person whose Phone & Device Control access waits for re-approval reads that, Scan is off, nothing is requested from Phone & Device Control, and the saved TVs are listed without buttons.
    prerequisites: [runner:node-test, dependency:playwright, browser:chromium]
    sideEffects: none
    isolation: { mode: disposable, cleanup: Each case closes its browser context and the temporary data folder is removed; nothing leaves the browser. }
    limits: { timeoutMs: 90000, maxMemoryMb: 1024 }
    installation: never
    regressionTests:
      - { level: browser, file: tests/browser/home-tvs.test.cjs }
  - id: home-per-person-storage
    name: Smart Home files stay in each person's own folder
    purpose: The compiled storage helpers against a real temporary store folder; the 1.4.1 regression guard for the shared store-root copy that let one person read another's SmartThings token.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/home-per-person-storage.test.cjs] }
    expected:
      - A person with no token of their own reads none, never another person's; no copy is written at the store root.
      - A person with no saved devices sees none of another person's.
      - A copy an earlier version left at the store root is read as nobody's file.
      - The host-wide discovery snapshot is still read from the store root.
    prerequisites: [runner:node-test, runtime:store-pinned-toolchain]
    sideEffects: none
    isolation: { mode: disposable, cleanup: The temporary data folder is removed. }
    limits: { timeoutMs: 30000 }
    installation: never
    regressionTests:
      - { level: unit, file: tests/home-per-person-storage.test.cjs }
  - id: home-tiles
    name: Home is tiles in groups, with the person's connected devices
    purpose: Open tools/home.html in Chromium at 412 px against scripted reads and drive Home, a tile's page and Back - no hub, computer or TV is contacted.
    level: browser
    runner: { kind: node-test, scope: package, files: [tests/browser/home-tiles.test.cjs] }
    expected:
      - The refrigerator, TVs, switch cards, phones and computers show as groups that fit a phone, and no label names a provider key or a capability.
      - A tile opens its page and Back returns to Home; a phone or computer tile opens Phone & Device Control.
      - With Phone & Device Control waiting for re-approval it is asked for nothing and the tiles open the Devices page.
    prerequisites: [runner:node-test, dependency:playwright, browser:chromium]
    sideEffects: none
    isolation: { mode: disposable, cleanup: Each case closes its browser context; nothing leaves the browser. }
    limits: { timeoutMs: 90000, maxMemoryMb: 1024 }
    installation: never
    regressionTests:
      - { level: browser, file: tests/browser/home-tiles.test.cjs }
