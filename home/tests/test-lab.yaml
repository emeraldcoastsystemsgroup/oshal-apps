# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.2.4: the company audience view registered beside the family one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Register the native-kernel egress case: refresh, device control and scene run call the declared SmartThings host with no Authorization header, and a missing or unusable smartthings connection answers each route's own 409.
# 5 | maintainer@emeraldcoastsystemsgroup.com | Register the phone layout of the Ask bar (tests/browser/home-phone-layout.test.cjs): no page content paints over Send at any scroll position.
