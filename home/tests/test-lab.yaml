# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR                                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 18 | maintainer@emeraldcoastsystemsgroup.com | Register home-overview for the recovered experience and its actual data contracts.
# 1   | maintainer@emeraldcoastsystemsgroup.com     | Register the package's audience view contract test (ADR-164 D6) with its runner and isolation boundaries.
# 2   | maintainer@emeraldcoastsystemsgroup.com     | Name the family view's schedule-text behaviour the same test now asserts (the trigger object formatted as the full page does, under a fixed US time zone).
# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.2.4: the company audience view registered beside the family one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Register the native-kernel egress case: refresh, device control and scene run call the declared SmartThings host with no Authorization header, and a missing or unusable smartthings connection answers each route's own 409.
# 5 | maintainer@emeraldcoastsystemsgroup.com | Register the phone layout of the Ask bar (tests/browser/home-phone-layout.test.cjs): no page content paints over Send at any scroll position.
# 6 | maintainer@emeraldcoastsystemsgroup.com | Register home-hubs-and-transcript: the chat shows the person's own message above the reply, and the Hubs tab opens the page's hubs view.
# 7 | maintainer@emeraldcoastsystemsgroup.com | Register home-connect-copy: the chat names the Hubs tab instead of a raw /utilities path, and every New schedule field is labelled.
# 8 | maintainer@emeraldcoastsystemsgroup.com | Register home-reply-words: an assistant reply shows **bold** as bold text without asterisks, markup stays text, and the transcript sits off the screen edge at 412 px (demo sweep 1).
# 9 | maintainer@emeraldcoastsystemsgroup.com | home-connect-copy also expects the prompt to name the data as the Smart Home app's, never a snapshot (sweep 14).
# 10 | maintainer@emeraldcoastsystemsgroup.com | Register home-weather: the NWS forecast chain and its egress and tool declaration.
# 11 | maintainer@emeraldcoastsystemsgroup.com | UX audit 2026-11-05 (home-dashboard): the inline Ask bar is removed, so home-phone-layout and home-reply-words (which proved it) are retired; home-empty-state registers the empty state, the refused refresh and the dashboard order; home-hubs-and-transcript keeps its Hubs view cases.
# 12 | maintainer@emeraldcoastsystemsgroup.com | home-empty-state also covers the Automations screen (the split).
# 13 | maintainer@emeraldcoastsystemsgroup.com | Register home-device-inspect-and-guide: SmartThings capability/refrigerator camera inspection and persistent Operations Guide & Runbook.
# 14 | maintainer@emeraldcoastsystemsgroup.com | Expand home-device-inspect-and-guide with Samsung Family Hub weekly refrigerator assessment, week-over-week comparison, grocery cart starter, weekly meal list builder, and phone-control optional dependency.
# 15 | maintainer@emeraldcoastsystemsgroup.com | 1.4.0: register home-lan-devices (TV plans, records and the network-TV /control refusal against the compiled routes) and home-tvs (the TVs and streaming sticks section in Chromium at 412 x 915); home-device-inspect-and-guide also proves local discovery lists no made-up device and no TV. All run in store-ci's new home job. The press on a real TV is the person's own, from their own computer: no test sends one.
# 16 | maintainer@emeraldcoastsystemsgroup.com | 1.4.3: register home-tv-plans: Jarvis presses TV buttons through the kernel's computer.run_plan. The two plan tools' computerPlan declarations are pinned exactly and every command the compiled plan routes answer is checked against the kernel's plan grammar (mirrored from oshal-kernel computer_plans.rs, with negative controls); the descriptions, the next step and the persona name computer.run_plan and the planId. A real press still needs the person's own session and computer: no test sends one.
# 17 | maintainer@emeraldcoastsystemsgroup.com | 1.7.0 (T45 part 4): home-tv-plans and home-tvs expect what is playing and the media presses on an Android TV's card and in Jarvis's TV tool.
# 18 | maintainer@emeraldcoastsystemsgroup.com | 1.9.0: home-device-inspect-and-guide and home-empty-state expect no grocery list of Smart Home's own: the grocery actions are refused with where the list lives, the refrigerator page shows and changes Shopping's list, and items a person had on the refrigerator's own list are moved there or stay when Shopping does not answer.
# 19 | maintainer@emeraldcoastsystemsgroup.com | 1.9.1 (Lane TV1): register home-tv-direct (tests/home-lan-direct.test.cjs, which the home job's own glob runs): launch_app, list_apps and active_app on a Roku or a Samsung TV, planned, recorded and described. home-tv-plans expects 56 presses in the kernel grammar and bridge 1.20.0 on every plan. No test presses a real TV.
# 20 | maintainer@emeraldcoastsystemsgroup.com | Remove unsupported regressionTests keys from TV/storage/tile cases and quote the comma-containing cleanup string on home-tv-direct.
# 21 | maintainer@emeraldcoastsystemsgroup.com | 1.9.2: register product-name guard (tests/product-name.test.cjs) and align Show Open Swarm wording on home-lan-devices and home-tvs.
# -----------------------------------------------------------------------------
version: 1
cases:
  - id: home-connect-copy
    name: The chat names the Hubs tab and every schedule field is labelled
    purpose: Drive the compiled POST /assistant with a recording model double and read the persona and the page's New schedule form.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/home-connect-copy.test.cjs] }
    expected:
      - The prompt the home-bot receives names this app's Hubs tab and forbids a raw path such as /utilities.
      - The prompt calls the data what the person's Smart Home app has saved and never uses the word snapshot (sweep 14).
      - The persona's not-connected answer names the Hubs tab, not Connections (/utilities).
      - Action, When, Time, Repeat and the minutes offset each sit in their own label, hidden and shown with it.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: disposable, cleanup: The temporary home-data directory is removed and the module resolver is restored. }
    limits: { timeoutMs: 20000 }
    installation: never
  - id: kernel-egress-smartthings
    name: Native kernel SmartThings calls through the declared egress
    purpose: Drive the compiled refresh, control and scene-run handlers with OSHAL_EGRESS=kernel, a recording fetch and synthetic connection metadata.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/kernel-egress.test.cjs] }
    expected:
      - Refresh, control and scene run reach api.smartthings.com with no Authorization header and no key in the URL; the device index and command bodies are the same as before.
      - A kernel "not connected" refusal, or metadata with no usable smartthings connection, answers each route's own 409 without reaching the provider when the metadata says so.
      - A SmartThings failure under the kernel stays a 502.
      - Outside the kernel the brokered token is still sent as the Bearer header and a missing token still answers 409.
      - The manifest declares api.smartthings.com with the smartthings Bearer credential.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: disposable, cleanup: The temporary home-data directory is removed and the module resolver is restored. }
    limits: { timeoutMs: 20000 }
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its family (Home shell) and company (Business shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - Each schedule in the family view reads as the full page writes it (solar event with a signed minute offset, otherwise the cron's local time and the weekday suffix), never the trigger object.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: home-empty-state
    name: Smart Home with no hub, a refused refresh, and the dashboard order
    purpose: Drive the real Smart Home page in Chromium at 412 x 915, in the 392 x 641 cockpit frame and at 1440 x 900 with synthetic reads (UX audit 2026-11-05, home-dashboard).
    level: browser
    runner: { kind: node-test, scope: package, files: [tests/browser/home-empty-state.test.cjs] }
    expected:
      - With no hub the page is one empty state (No devices yet) with one primary, Connect a hub, which opens the SmartThings and Google Home rows with Not connected pills; no schedule form, no Refresh, no inline Ask bar, no heading.
      - A refused refresh (409) is an alert reading "SmartThings isn't connected yet. Connect it above." with Connect a hub, never a /utilities path.
      - With devices the Smart Home screen is devices then scenes; the SmartThings pill says when it was read; the diagnostic brief stays withheld while no connected action mounts.
      - Automations (?view=automations) holds the schedules and New schedule, or one empty state (No automations yet, Connect a hub) when nothing can run.
      - The refrigerator page's Grocery list card shows the person's list in Shopping, adds to it and ticks it off through Shopping's routes, and Smart Home's own state stays empty; there is no Start a grocery list (1.9.0).
      - Items a person had on the refrigerator's own list are moved to Shopping when the page opens and forgotten here; when Shopping refuses the account they stay and are shown (1.9.0).
    prerequisites: [runner:node-test, dependency:playwright, browser:chromium]
    sideEffects: none
    isolation: { mode: none, cleanup: Each case closes its browser context; pages and answers are synthetic and served inside the browser with no network or server. }
    limits: { timeoutMs: 60000, maxMemoryMb: 1024 }
    installation: never
  - id: home-hubs-and-transcript
    name: Hubs view on a phone
    purpose: Drive the real Smart Home page in Chromium at 412 x 915 and in the 392 x 641 cockpit frame with synthetic reads.
    level: browser
    runner: { kind: node-test, scope: package, files: [tests/browser/home-hubs-and-transcript.test.cjs] }
    expected:
      - With ?view=hubs the page shows the SmartThings connect link, the Google Home set-up link and the hubs that reported devices, hides the dashboard and chat, fits the screen and writes nothing.
      - The plain dashboard keeps the hubs panel hidden and has no inline Ask bar, and the manifest Hubs tab opens /api/home/ui?view=hubs.
    prerequisites: [runner:node-test, dependency:playwright, browser:chromium]
    sideEffects: none
    isolation: { mode: none, cleanup: Each case closes its browser context; pages and answers are synthetic and served inside the browser with no network or server. }
    limits: { timeoutMs: 60000, maxMemoryMb: 1024 }
    installation: never
  - id: home-weather
    name: Weather forecast from the National Weather Service
    purpose: The compiled weather module answers NWS forecast periods with the source named, refuses a missing, unknown or uncovered
      place in words, and the manifest declares the keyless egress, the tool and weather routing words.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
      - tests/home-weather.test.js
    expected:
    - Every case passes with a stand-in fetch; no network is used.
    prerequisites:
    - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: home-device-inspect-and-guide
    name: SmartThings device capability inspection and persistent Operations Guide & Runbook
    purpose: Verify inspectSmartThingsDevices extracts Samsung Family Hub refrigerator ViewInside camera and temperature capabilities, Operations Guide persists discovered capabilities and operator notes, and the manifest declares the tools and routing words.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
      - tests/home-device-inspect-and-guide.test.js
    expected:
    - Every case passes with a stand-in fetch and temporary package data directory.
    - The refrigerator answer carries no cart; the four grocery actions answer kept_by_shopping and write nothing; forget-earlier-list drops only what was moved (1.9.0).
    - The manifest declares no grocery word, its meal tool takes no grocery action, and the description says the grocery list is kept by Shopping (1.9.0).
    prerequisites:
    - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: The temporary package data directory is removed after the test.
    limits:
      timeoutMs: 15000
    installation: never
  - id: home-lan-devices
    name: TVs and streaming sticks - plans, records and the network-TV refusal
    purpose: Drive the compiled home-lan-devices module and home-routes router with stand-in framework modules and a temporary data folder.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/home-lan-devices.test.cjs] }
    expected:
      - A scan and a press answer planned (never executed) with the closed phone-control bridge command; saved TVs are woken only when asked.
      - A press plan is built per kind with the closed action list; a Roku refuses Show Open Swarm and Pair, a Samsung refuses the Android app, a Cast device refuses every press, in words.
      - A scan answer saves private-address TVs for that person only (a public address is dropped), merged by hardware address, and lists the Android TVs for Phone & Device Control.
      - A TV's power changes only when its own answer says the press worked; an answer for another TV or another press is refused.
      - POST /control answers a network TV 409 tv_needs_computer and leaves its saved switch as it was; the routes answer 401 without a person.
      - The manifest declares the four tools inside /api/home, TV routing words and no new egress.
    prerequisites: [runner:node-test, runtime:store-pinned-toolchain]
    sideEffects: none
    isolation: { mode: disposable, cleanup: The temporary data folder is removed and the module resolver is restored. }
    limits: { timeoutMs: 30000 }
    installation: never
  - id: home-tv-plans
    name: Jarvis presses TV buttons through computer.run_plan
    purpose: Pin the computerPlan declarations the kernel reads and check every command the compiled scan and press plan routes answer against the kernel's plan grammar (oshal-kernel crates/oshald/src/computer_plans.rs), so the kernel keeps the plan and computer.run_plan can run it.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/home-lan-devices.test.cjs] }
    expected:
      - home-lan-discover declares exactly {program phone-bridge, verbs [lan-discover]} and home-lan-control exactly {program phone-bridge, verbs [lan-control]}; no other tool declares a plan.
      - Every scan and press plan answers 200 with the bridge prefix, its own tool's declared verb and --b64 with canonical base64 of one JSON object of at most 4 KiB, and a computer the kernel can read; a scan never fits the press declaration, nor a press the scan one.
      - 1.9.1 The 56 presses the three saved TVs take all fit the grammar, launch_app, list_apps and active_app on the Samsung TV and the Roku among them, the Roku launch with a 255-character content id.
      - The grammar check refuses a second command, a redirection, another prefix or flag, an undeclared verb, unpadded or URL-safe base64, a JSON array or string and an oversized argument; the declaration check refuses another program, no verbs, an unknown verb and an extra key.
      - 1.7.0 On an Android TV, now_playing, play, pause, next, previous and stop are planned (every plan names bridge 1.20.0 since 1.9.1), a Samsung TV and a Roku refuse them in words, the recorded answer says what is playing (behind another app or not) and the TV keeps it across a new scan.
      - Both tool descriptions, the plans' next step and the persona say to pass the planId to computer.run_plan, then record the computer's answer with home-lan-record, and otherwise to say it is planned and point to the Smart Home TV buttons; none names computer.run or computer.list.
    prerequisites: [runner:node-test, runtime:store-pinned-toolchain]
    sideEffects: none
    isolation: { mode: disposable, cleanup: The temporary data folder is removed and the module resolver is restored. }
    limits: { timeoutMs: 30000 }
    installation: never
  - id: home-tv-direct
    name: An application opened, listed and read in front on a Roku or a Samsung TV
    purpose: Drive the compiled home-lan-devices module with a temporary data folder and read the manifest and the persona, for the three application presses Jarvis plans on a Roku or a Samsung TV (Lane TV1; Roger, 2026-11-13, asked that Jarvis open an application such as Netflix on those TVs and know where it is).
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/home-lan-direct.test.cjs] }
    expected:
      - launch_app is planned as the closed lan-control command with the application's checked id, a Roku title as contentId and mediaType, and bridge 1.20.0; list_apps and active_app carry no free text.
      - A missing or unknown application, an id or content id outside its closed shape (a web address, a space, a separator), an unknown media type, a title on a Samsung TV, active_app on a Samsung TV with no application named, an Android TV and a Cast device plan nothing and are refused in words.
      - The applications a TV listed are kept on that TV for that person only, at most a hundred, across a new scan; an application is then planned by its name, a name that fits two is asked about, and a refused read leaves the saved list as it was.
      - A recorded answer says only what the TV reported, in front, not in front with what was, running but not in front, not running, or not said; a Roku title is said as asked for, never as showing; what was in front is kept on the TV.
      - A refusal is said in the TV's words; a computer whose bridge answers bad_action is told to press Scan for TVs once; an answer for another TV or press is refused; a Samsung TV counts as paired only after its remote channel was used.
      - The tool, the application's description and the persona say a Roku and a Samsung TV are buttons only, with no screenshot and no on-screen text, that an Android or Fire TV that runs Orbit shows its screen through the person's computer tools, and no routing word or egress was added.
    prerequisites: [runner:node-test, runtime:store-pinned-toolchain]
    sideEffects: none
    isolation: { mode: disposable, cleanup: "The temporary data folder is removed. No TV, computer or network is contacted." }
    limits: { timeoutMs: 30000 }
    installation: never
  - id: home-tvs
    name: TVs and streaming sticks on the Smart Home screen, in Chromium
    purpose: The real page and its module at 412 x 915 with phone-control's real computer link, the compiled package routes for every write, and the person's computer played by the test.
    level: browser
    runner: { kind: node-test, scope: package, files: [tests/browser/home-tvs.test.cjs] }
    expected:
      - 1.7.0 An Android TV's card has Previous, Pause, Play, Next and What's playing, each at least 44 x 44; Pause sends one closed lan-control pause and the card says what is playing behind another app and shows it on the Now playing line; a Samsung TV and a Roku have no media row.
      - The section shows with one Scan for TVs button that says what it does; the empty screen keeps one primary; opening the page writes nothing; no console error.
      - With no computer it says what to do and Scan is off.
      - Scan replaces an old bridge with phone-control's real install command, runs the planned scan, saves the TVs and adds the Android TV to Phone & Device Control.
      - A press says what the computer answered; a waiting Samsung reads "Press Allow on the TV, then Retry." with Retry, and its power stays as read; a Roku has no Show Open Swarm.
      - A person whose Phone & Device Control access waits for re-approval reads that, Scan is off, nothing is requested from Phone & Device Control, and the saved TVs are listed without buttons.
    prerequisites: [runner:node-test, dependency:playwright, browser:chromium]
    sideEffects: none
    isolation: { mode: disposable, cleanup: Each case closes its browser context and the temporary data folder is removed; nothing leaves the browser. }
    limits: { timeoutMs: 90000, maxMemoryMb: 1024 }
    installation: never
  - id: home-per-person-storage
    name: Smart Home files stay in each person's own folder
    purpose: The compiled storage helpers against a real temporary store folder; the 1.4.1 regression guard for the shared store-root copy that let one person read another's SmartThings token.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/home-per-person-storage.test.cjs] }
    expected:
      - A person with no token of their own reads none, never another person's; no copy is written at the store root.
      - A person with no saved devices sees none of another person's.
      - A copy an earlier version left at the store root is read as nobody's file.
      - The host-wide discovery snapshot is still read from the store root.
    prerequisites: [runner:node-test, runtime:store-pinned-toolchain]
    sideEffects: none
    isolation: { mode: disposable, cleanup: The temporary data folder is removed. }
    limits: { timeoutMs: 30000 }
    installation: never
  - id: home-tiles
    name: Home is tiles in groups, with the person's connected devices
    purpose: Open tools/home.html in Chromium at 412 px against scripted reads and drive Home, a tile's page and Back - no hub, computer or TV is contacted.
    level: browser
    runner: { kind: node-test, scope: package, files: [tests/browser/home-tiles.test.cjs] }
    expected:
      - The refrigerator, TVs, switch cards, phones and computers show as groups that fit a phone, and no label names a provider key or a capability.
      - A tile opens its page and Back returns to Home; a phone or computer tile opens Phone & Device Control.
      - With Phone & Device Control waiting for re-approval it is asked for nothing and the tiles open the Devices page.
    prerequisites: [runner:node-test, dependency:playwright, browser:chromium]
    sideEffects: none
    isolation: { mode: disposable, cleanup: Each case closes its browser context; nothing leaves the browser. }
    limits: { timeoutMs: 90000, maxMemoryMb: 1024 }
    installation: never
  - id: home-overview
    name: Searchable Smart Home overview and reported device controls
    purpose: Exercise the shipped overview and extracted assets at desktop, phone and framed-phone sizes with synthetic reads and controlled refusal
      responses.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
      - tests/browser/home-overview.test.cjs
    prerequisites:
    - runner:node-test
    - dependency:playwright
    - browser:chromium
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: Synthetic browser contexts close after every case; no real person, provider or device is contacted.
    limits:
      timeoutMs: 90000
      maxMemoryMb: 1024
    installation: never
    expected:
    - Search, room groups and selected-device detail preserve existing actions and connection setup.
    - Missing switch or brightness stays unknown; refused brightness restores the last reported value.
    - Scenes use keyboard-accessible controls; phone controls fit and unsupported actions are not invented.
  - id: product-name
    name: Person-facing Smart Home text names the product Open Swarm
    purpose: Drive compiled TV action labels, refusals and card buttons, inspect the manifest and persona, and scan routes, TypeScript sources and tools outside comments.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/product-name.test.cjs] }
    expected:
      - Action labels, Samsung open_app refusals and TV card buttons say Open Swarm while preserving oshal TV app and oshal Node component wording.
      - The manifest, tool descriptions, routingKeywords and home-bot persona name Open Swarm in person-facing and model-facing copy.
      - Shipped routes, TypeScript route sources and tools files contain no product-name OSHAL or oshal outside comments.
    prerequisites: [runner:node-test, runtime:store-pinned-toolchain]
    sideEffects: none
    isolation: { mode: disposable, cleanup: The temporary data directory is removed. }
    limits: { timeoutMs: 20000 }
    installation: never
