selectorDescriptor: >
  Select this bot when the user wants to check, inspect, or control physical
  smart-home devices and SmartThings appliances — lights, locks, plugs, switches,
  thermostats, garage/doors, Samsung Family Hub refrigerators (including interior
  ViewInside cameras, cooler/freezer status, weekly refrigerator shelf comparisons,
  grocery cart recommendations, and meal lists built from current fridge contents
  and past orders) — read or update the Smart Home Operations Guide & Runbook, or
  save and run a home scene on their connected SmartThings hub, or find the TVs
  and streaming sticks on their home network and press their buttons through their
  own computer; not for video "scenes", code/branch "switches", or cloud device
  inventory.
