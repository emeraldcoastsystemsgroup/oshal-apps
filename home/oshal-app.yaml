# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — home (Smart Home bundle, ADR-038)
# Carved out of OSHAL core 2026-07-19 (ADR-085 Wave 2). The home-bot REAL bot
# node (home-bot container, BOTH registry blocks d0…0001, core persona,
# scripts/oshal-smartthings.js + the smart-home toolkit), the shared home-data
# volume (bot :rw / api :ro), the smartthings + google-home platform connectors,
# the manifest-worker connector scope, and the kernel scheduler's home-control
# branch (home-schedule-dispatch — fires with NO user session, so it lives with
# the scheduler) ALL stay framework-resident per ADR-093 interim. This package
# is the app: the dashboard surface + /api/home routes + workflow + a package
# persona COPY for the registrar.
#
# Coverage: SmartThings is the broad hub (lights/locks/plugs/switches/sensors/
# scenes). Nest covers thermostat/camera/doorbell. Alexa is staged (no public
# third-party device API) — see docs/partner-app-registration.md.
# Framework: OSHAL (see docs/build-your-own-swarm-app.md)
# ─────────────────────────────────────────────────────────────────────────────

name: home
suite: ai-home   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 64, high: 256, basis: declared }
  features:
    - id: home-assistant
      unit: home assistant request
      tier: T2
      generation: none
      degrade: disable
    - id: scheduled-home-control
      unit: timer firing
      tier: T2
      generation: none
      degrade: disable
displayName: Smart Home
lastingStorage: true
description: >-
  Control your smart home by chat. Connect a hub at /utilities (SmartThings or
  Google Nest); the home-bot reads your real devices + scenes via your connector
  token, inspects SmartThings appliances and Samsung Family Hub refrigerators
  (interior camera ViewInside / samsungce.viewInside snapshots, cooler/freezer
  temperatures, door sensors and live component capabilities), keeps your own
  grocery list, logged orders and meals beside the refrigerator's weekly check
  (what is inside the refrigerator is not read yet), keeps a
  persistent Smart Home Operations Guide & Runbook, and turns "turn off the
  living room lights" into the right commands. Destructive actions (locks,
  garage, thermostat) are confirmed first. It also gives the weather forecast
  for any US city, address or ZIP code from the National Weather Service
  (weather.gov): today, tonight and the coming days. It finds the TVs and
  streaming sticks on your home network through your own computer (Samsung,
  Roku, Android, Google and Fire TV) and presses their buttons: wake, turn off,
  volume, mute, arrows, OK, Home, Back, and opening oshal on the TV.
version: 1.8.0
testing:
  version: 1
  catalog: tests/test-lab.yaml
status: active
chatBot: home-bot # The canonical concierge borrowed by Home Workspace.

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: home
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/home/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# Runtime connector allow-list — the hubs this app drives via the per-user broker.
# ── Cross-package prerequisites: what this package actually reaches ─────────
# ALL OPTIONAL — the ribbon frames five sibling surfaces:
#   drone    oshal-app.yaml:125  /api/drone/app      sat-ops  :130  /api/sat/app  (mount is /api/sat)
#   pumpkin  oshal-app.yaml:135  /api/pumpkin/app    spaces   :140  /api/spaces/app
#   camera   oshal-app.yaml:145  /api/camera/app
# An absent target leaves that one tab empty. The dashboard, /api/home, the workflow and the
# smart-home control path do not read any of them, so none is required.
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: [drone, sat-ops, pumpkin, spaces, camera, phone-control]   # five tabs FRAME these apps' own surfaces; phone-control assists optical Family Hub camera capture
    tools: []
    connectors: [smartthings, google-home]

# Kernel skills this app declares (ADR-090 uses: contract, fail-closed at load).
# `app-dependencies` is the compatibility floor for the tiered dependencies block above: a core
# that predates required/optional refuses this package instead of installing it without its
# required dependencies and without its connector allow-list.
uses:
  - app-dependencies
  - test-catalog

# Scheduled / swarm-initiated home control (e.g. a cron "morning routine") routes a
# ticketType=home-control ticket via the generic single-bot worker dispatch straight
# to the home-bot over the mesh. Interactive control uses chat (no ticket). Same bot.
ticketType: home-control

workflow:
  name: Home Control
  workerBot: home-bot
  # One-and-done: the persona is its own quality gate (device resolution + the
  # confirm-before-destructive rule are baked in). No reviewer.

# The home-bot NODE (home-bot container + static registry blocks) is framework-
# resident (ADR-093); the persona here is a package COPY for the registrar — the
# container keeps using /app/ai-lab.
bots:
  - agentId: d0000000-0000-0000-0000-000000000001
    name: home-bot
    posture: inline   # native kernel: an application bot with the route-backed tools below; no dedicated node
    persona: personas/home-bot.yaml
    role: smart-home/device-control
    capabilities:
      - smart-home-control
      - smartthings
      - device-control
      - scene-execution
      - home-automation
    routingKeywords:
      - smart home
      - lights
      - thermostat
      - smartthings
      - turn on
      - turn off
      - dim
      - lock the door
      - weather
      - forecast
      - temperature
      - is it going to rain
      - the weather
      - weather like
      - weather in
      - weather today
      - weather forecast
      - will it rain
      - refrigerator
      - refriderator
      - fridge
      - family hub
      - viewinside
      - view inside
      - inside the fridge
      - inside the refrigerator
      - view inside my refrigerator
      - view inside the fridge
      - samsungce.viewinside
      - check smartthings devices
      - fridge camera
      - refrigerator camera
      - smartthings camera
      - smart home camera
      - appliance
      - appliances
      - samsung
      - smarthings
      - operations guide
      - runbook
      - meal list
      - meal plan
      - grocery cart
      - start a cart
      - what is in the fridge
      - what's in the fridge
      - weekly fridge
      - fridge assessment
      - grocery list
      - shopping cart
      - tv
      - tvs
      - the tv
      - my tv
      - roku
      - streaming stick
      - streaming sticks
      - samsung tv
      - scan my network
      - scan for tvs
      - volume up
      - volume down
      - mute the tv
      - open oshal on
      - lock
      - door

# Route-backed tools for home-bot (native kernel: executorType api, inside /api/home). Reads run
# under the caller; device and scene actions are held for the person's approval and then sent with
# confirm: true to the same deterministic routes the dashboard buttons use.
tools:
  - name: home-weather
    displayName: Weather Forecast
    type: api
    category: home
    description: The National Weather Service forecast for a US city, address or ZIP code - today, tonight and the coming days, with temperature, wind, chance of rain and the forecast text. Read-only.
    executor: { executorType: api, apiEndpoint: "GET /api/home/weather?location={input.location}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        location: { type: string, minLength: 1, maxLength: 200, description: The US place as the person named it, such as "Seattle, WA" or a ZIP code. }
      required: [location]
    usageInstructions: >-
      Call with {"location"} for any weather or forecast question. With no place in the question, use the person's
      home city when the conversation gives it, otherwise ask which city. Answer from the returned periods only and end
      with "Source: National Weather Service (weather.gov)".
    tags: [home, route-backed]

  - name: home-devices
    displayName: Home Devices
    type: api
    category: smart-home
    description: The person's indexed smart-home devices (name, room, hub, state) and when the index was built.
    executor: { executorType: api, apiEndpoint: "GET /api/home/devices" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} before naming any device. "empty":true means nothing is indexed yet; call home-refresh to read the hub.
    tags: [home, route-backed]
  - name: home-scenes
    displayName: Home Scenes
    type: api
    category: smart-home
    description: The person's saved home scenes and their steps.
    executor: { executorType: api, apiEndpoint: "GET /api/home/scenes" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} before naming or running a scene.
    tags: [home, route-backed]
  - name: home-refresh
    displayName: Refresh Devices
    type: api
    category: smart-home
    description: Read the person's devices from their connected SmartThings hub now.
    executor: { executorType: api, apiEndpoint: "POST /api/home/refresh" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} when the index is empty or stale. A 409 "SmartThings not connected" means the hub is not connected under Connections.
    tags: [home, smartthings, route-backed]
  - name: home-device-inspect
    displayName: Inspect SmartThings Device
    type: api
    category: smart-home
    description: Inspect connected SmartThings devices, full component capabilities (/v1/devices/{id}), and live status (/v1/devices/{id}/status), including Samsung Family Hub refrigerator interior cameras (samsungce.viewInside, imageCapture), cooler/freezer temperatures, door sensors, and appliance modes. Read-only.
    executor: { executorType: api, apiEndpoint: "GET /api/home/device-inspect?device={input.device}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        device: { type: string, minLength: 1, maxLength: 160, description: Device key, name, or category such as "refrigerator", "fridge", "family hub", "camera", or "all". }
      required: [device]
    usageInstructions: >-
      Call with {"device": "refrigerator"} (or "all" or a device name) whenever the person asks about a refrigerator,
      fridge camera, Family Hub, SmartThings API capabilities, or detailed live status of any connected device.
    tags: [home, smartthings, route-backed]
  - name: home-view-inside
    displayName: Refrigerator View Inside Camera
    type: api
    category: smart-home
    description: Read-only SmartThings samsungce.viewInside operation for Samsung Family Hub refrigerators. Reads upper, middle, and lower interior camera bay snapshots (contents, supportedFocusAreas, lastUpdatedTime) and returns preview image URLs for the app and Jarvis.
    executor: { executorType: api, apiEndpoint: "GET /api/home/view-inside?device={input.device}" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        device: { type: string, minLength: 1, maxLength: 120, pattern: "^[A-Za-z0-9_. -]+$", description: Target refrigerator device key or "refrigerator". }
      required: [device]
    usageInstructions: >-
      Call with {"device": "refrigerator"} whenever the person asks to view inside their refrigerator, check
      samsungce.viewInside camera snapshots, or see interior shelf bay images from SmartThings. Include the returned
      markdownPreview image links in your reply so Jarvis renders the interior bay snapshots directly.
    tags: [home, smartthings, route-backed]
  - name: home-fridge-assessment
    displayName: Weekly Fridge Assessment & Cart
    type: api
    category: smart-home
    description: Read what is known about the refrigerator. That is the weekly check's day and time, a temperature when the hub reported one, and the person's own grocery list, logged orders and meals. What is inside is not read yet, so no shelf list, comparison with last week or meal idea exists; the answer says so in `reading.words`. Read-only.
    executor: { executorType: api, apiEndpoint: "GET /api/home/fridge-assessment" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: >-
      Call with {} whenever the person asks what is in the fridge, how this week compares to last week, what groceries
      are running low, or for a meal list or their grocery list. When `reading.read` is false, tell them in the answer's
      own words that nothing has been read from the refrigerator yet; never name an item that is not in the answer.
    tags: [home, smartthings, route-backed]
  - name: home-fridge-assessment-run
    displayName: Run Fridge Assessment
    type: api
    category: smart-home
    description: Run the refrigerator's check now. It records the run and the temperatures the hub reports. It does not read what is inside and makes no list or meal idea.
    executor: { executorType: api, apiEndpoint: "POST /api/home/fridge-assessment" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        focus: { type: string, enum: ["use-first", "high-protein", "quick-prep"], description: "Optional meal-plan focus." }
    usageInstructions: >-
      Call with {} or {"focus": "use-first"} when the person asks to run the refrigerator's check now. Say what the
      answer holds; when `reading.read` is false nothing inside was read.
    tags: [home, smartthings, route-backed]
  - name: home-fridge-meal-cart
    displayName: Start Cart or Meal List
    type: api
    category: smart-home
    description: Start or update the person's own grocery list (add, remove or tick an item), log an item they ordered, set the weekly check's day and time, or add a meal they describe. It suggests nothing from what is inside the refrigerator, which is not read yet.
    executor: { executorType: api, apiEndpoint: "POST /api/home/fridge-meal-plan" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        action: { type: string, enum: ["start-cart", "add-cart-item", "remove-cart-item", "toggle-cart-item", "build-meal-list", "log-order", "set-weekly-schedule"], description: "Cart or meal-plan action to perform." }
        name: { type: string, maxLength: 160, description: "Item name when adding/removing/toggling a cart item or logging an order." }
        quantity: { type: string, maxLength: 80, description: "Optional quantity such as 1 dozen or 2 packs." }
        focus: { type: string, maxLength: 80, description: "Meal focus when action is build-meal-list (use-first, high-protein, quick-prep)." }
      required: [action]
    usageInstructions: >-
      Call with {"action": "start-cart"} when the person wants to start a grocery cart from the fridge recommendations,
      {"action": "add-cart-item", "name": "..."} to add an item, or {"action": "build-meal-list", "focus": "use-first"}
      to build or adjust the weekly meal list.
    tags: [home, smartthings, route-backed]
  - name: home-operations-guide
    displayName: Smart Home Operations Guide & Runbook
    type: api
    category: smart-home
    description: Read the persistent Smart Home Operations Guide & Runbook, including SmartThings API playbooks (Samsung Family Hub ViewInside camera, multi-zone appliances), auto-discovered device capabilities, and operator/concierge notes. Read-only.
    executor: { executorType: api, apiEndpoint: "GET /api/home/operations-guide" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: >-
      Call with {} to read the Smart Home Operations Guide, discovered SmartThings device capabilities, and saved
      runbook notes before answering questions about SmartThings APIs, appliances, or troubleshooting.
    tags: [home, smartthings, route-backed]
  - name: home-operations-guide-update
    displayName: Update Smart Home Operations Guide
    type: api
    category: smart-home
    description: Add or update an operational note, device capability finding, or runbook entry in the persistent Smart Home Operations Guide ($OSHAL_PACKAGE_DATA_DIR/operations-guide.json).
    executor: { executorType: api, apiEndpoint: "POST /api/home/operations-guide" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200, description: Short heading for the runbook note. }
        content: { type: string, minLength: 1, maxLength: 4000, description: Operational finding, API behavior, capability note, or runbook instruction to save. }
        device: { type: string, maxLength: 120, description: Optional device key or name (e.g. "refrigerator"). }
        category: { type: string, maxLength: 80, description: Optional category such as "appliances", "smartthings-api", or "runbook". }
      required: [title, content]
    usageInstructions: >-
      Call with {"title", "content", "device"} whenever you discover a device capability, SmartThings API behavior,
      or when the person asks you to save a note in the Smart Home Operations Guide / Runbook.
    tags: [home, smartthings, route-backed]
  - name: home-local-discover
    displayName: Local Appliances Named by This Installation (Bluetooth / LAN)
    type: api
    category: smart-home
    description: List the local Bluetooth and LAN appliances this installation's own discovery file names, ready to register ($0 cloud API cost). It scans nothing and never lists a TV; TVs and streaming sticks are found with home-lan-discover. Read-only.
    executor: { executorType: api, apiEndpoint: "GET /api/home/local-discover" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: >-
      Call with {} when the person wants to register a local Bluetooth or LAN appliance directly with the Swarm
      without a cloud API. For TVs and streaming sticks use home-lan-discover instead.
    tags: [home, route-backed]
  - name: home-device-register
    displayName: Register Local Swarm Device
    type: api
    category: smart-home
    description: Register a local Bluetooth or LAN appliance (such as a Samsung Family Hub refrigerator, a speaker, or another appliance) directly into the Smart Home device index ($0 cloud API cost). Not for TVs or streaming sticks, which a scan adds (home-lan-discover).
    executor: { executorType: api, apiEndpoint: "POST /api/home/devices/register" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160, description: "Human-friendly device name such as Samsung Family Hub Refrigerator." }
        category: { type: string, maxLength: 80, description: "Category such as Refrigerator or TV or Appliance or Speaker or Light." }
        protocol: { type: string, enum: ["bluetooth", "android-adb", "lan-http", "swarm-node"], description: "Local transport protocol." }
        address: { type: string, maxLength: 160, description: "Bluetooth MAC or LAN IP or Swarm node ID." }
        room: { type: string, maxLength: 120, description: "Room name such as Kitchen or Living Room." }
      required: [name]
    usageInstructions: >-
      Call with {"name", "category", "protocol", "address", "room"} when the person asks to register a Bluetooth,
      Android, or LAN device directly with the Swarm.
    tags: [home, route-backed]
  - name: home-lan-devices
    displayName: TVs and Streaming Sticks
    type: api
    category: smart-home
    description: The TVs and streaming sticks saved in Smart Home - name, kind (Samsung, Roku, Android TV, Google Cast), address, room, the person's computer that found them, power when that computer last read it, and the last answer from that computer. Read-only.
    executor: { executorType: api, apiEndpoint: "GET /api/home/lan/devices" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} before naming a TV. An empty list means no scan has found one yet; plan one with home-lan-discover.
    tags: [home, tv, route-backed]
  - name: home-lan-discover
    displayName: Plan a Scan for TVs
    type: api
    category: smart-home
    description: >-
      Scan the person's home network for TVs and streaming sticks (Samsung, Roku, Android, Google and Fire TV) with
      their own computer, through Phone & Device Control's bridge (read-only, installs nothing). Its answer is a plan:
      nothing has run when it answers. When computer.run_plan is offered to you, the scan runs at once on the person's
      own computer: pass the planId from this tool's answer to computer.run_plan, then record the computer's answer
      with home-lan-record (op discover, the computer that computer.run_plan names, and the one JSON line the computer
      printed as reply). When computer.run_plan is not offered or the answer has no planId, say the scan is planned
      and that Scan for TVs under TVs and streaming sticks on the Smart Home screen runs it on their computer.
    executor: { executorType: api, apiEndpoint: "POST /api/home/lan/discover-plan" }
    computerPlan: { program: phone-bridge, verbs: [lan-discover] }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        computer: { type: string, maxLength: 80, description: "Only when the person named one of their own computers for the scan: its name. Leave it out otherwise." }
        wakeSaved: { type: boolean, description: "true only when the person asked to wake their saved TVs first; waking can turn a TV's screen on." }
    usageInstructions: >-
      This only plans the scan: say it is planned, never that it ran, until home-lan-record answers. When
      computer.run_plan is among your tools, call it with {"plan": "<the planId this answer carries>"}, then call
      home-lan-record with {"op": "discover", "computer": "<the computer computer.run_plan names>", "reply": "<the one
      JSON line the computer printed>"} and report only what home-lan-record answers. Without computer.run_plan or a
      planId, say the scan is planned and that Scan for TVs under TVs and streaming sticks on the Smart Home screen runs
      it on their computer.
    tags: [home, tv, route-backed]
  - name: home-lan-control
    displayName: Plan a TV Button Press
    type: api
    category: smart-home
    description: >-
      Press one button on one saved TV or streaming stick - wake, turn off, volume up or down, mute, the arrows, OK,
      Home, Back, play or pause, open oshal on the TV, open the oshal TV app (Android), or pair (Samsung) - with the
      person's own computer. On an Android or Fire TV it also reads what is playing and in which app (now_playing), and
      sends play, pause, next, previous or stop to the app playing even when another app is in front; the recorded
      answer says what is playing after the press. Its answer is a plan: nothing has happened on the TV when it answers. When
      computer.run_plan is offered to you, the press runs at once on the person's own computer: pass the planId from
      this tool's answer to computer.run_plan, then record the computer's answer with home-lan-record (op control, the
      device id and action the plan returned, and the one JSON line the computer printed as reply) and say what
      home-lan-record answers. When computer.run_plan is not offered or the answer has no planId, say the press is
      planned and that the TV's buttons under TVs and streaming sticks on the Smart Home screen press it.
    executor: { executorType: api, apiEndpoint: "POST /api/home/lan/control-plan" }
    computerPlan: { program: phone-bridge, verbs: [lan-control] }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        device: { type: string, minLength: 1, maxLength: 120, description: "The TV as home-lan-devices names it: its id, its name or part of it (\"the Samsung\", \"guest room Roku\")." }
        action: { type: string, enum: [wake, off, volume_up, volume_down, mute, up, down, left, right, select, home, back, play_pause, launch_url, open_app, pair, now_playing, play, pause, next, previous, stop] }
        url: { type: string, maxLength: 256, description: "For launch_url only: the https page to open; leave out to open this installation." }
      required: [device, action]
    usageInstructions: >-
      This only plans the press: say it is planned, never that it happened, until home-lan-record answers. When
      computer.run_plan is among your tools, call it with {"plan": "<the planId this answer carries>"}, then call
      home-lan-record with {"op": "control", "device": "<the returned device id>", "action": "<the action>", "reply":
      "<the one JSON line the computer printed>"} and say what home-lan-record answers. A Samsung TV may answer "Press
      Allow on the TV, then Retry": tell the person exactly that. Without computer.run_plan or a planId, say the press
      is planned and that the TV's card under TVs and streaming sticks on the Smart Home screen presses it.
    tags: [home, tv, route-backed]
  - name: home-lan-record
    displayName: Record What the Computer Answered
    type: api
    category: smart-home
    description: Record the answer the person's computer printed for a planned TV scan or button press, so Smart Home saves the TVs found and each press's result. A TV's on or off state changes only when that answer says the press worked.
    executor: { executorType: api, apiEndpoint: "POST /api/home/lan/record" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        op: { type: string, enum: [discover, control] }
        device: { type: string, maxLength: 120, description: For control - the device id the plan returned. }
        action: { type: string, maxLength: 20, description: For control - the action that was planned. }
        computer: { type: string, maxLength: 80, description: "The name of the computer that ran the command." }
        reply: { type: string, minLength: 2, maxLength: 20000, description: The one JSON line the command printed. }
      required: [op, reply]
    usageInstructions: >-
      Call right after computer.run_plan ran a plan from home-lan-discover or home-lan-control, with the line the
      computer printed. Say what this answers ("said"), in its words; when it answers a hint, give the person that hint.
    tags: [home, tv, route-backed]
  - name: home-control
    displayName: Control a Device
    type: api
    category: smart-home
    description: Turn a device on or off or set a level. Held for the person's approval.
    executor: { executorType: api, apiEndpoint: "POST /api/home/control" }
    defaultAuthMode: auto
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        device: { type: string, description: the device key from home-devices }
        cmd: { type: string, enum: ["on", "off", "set"] }
        capability: { type: string }
        command: { type: string }
        arg: { type: number }
        confirm: { type: boolean, const: true }
      required: [device, cmd, confirm]
    usageInstructions: Use a device key returned by home-devices, never a guess. Send confirm true; the person approves before it runs. A TV or streaming stick answers 409 tv_needs_computer here; press it with home-lan-control.
    tags: [home, route-backed]
  - name: home-scene-run
    displayName: Run a Scene
    type: api
    category: smart-home
    description: Run one of the person's saved scenes. Held for the person's approval.
    executor: { executorType: api, apiEndpoint: "POST /api/home/scene/run" }
    defaultAuthMode: auto
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        name: { type: string }
        confirm: { type: boolean, const: true }
      required: [name, confirm]
    usageInstructions: Use a scene name returned by home-scenes. Send confirm true; the person approves before it runs.
    tags: [home, route-backed]

# (toolsDir dropped at the carve: the field is inert — D12 — and the smart-home
#  toolkit stays framework-resident with the home-bot's chain.)

# Cockpit surface. The home-bot is a CHAT bot — talk to it to control devices.
# Accounts opens the connectors hub to connect/disconnect a hub.
ui:
  static:
    # Primary surface: the device dashboard (devices + status + scenes + a chat bar).
    # A VIEW over the home-bot's store (GET /api/home/devices, cheap; no LLM). Reasoning
    # and scene creation go through the chat bar → the bot (fast loop, cost-tracked).
    - toolName: home-dashboard
      label: Smart Home
      icon: codicon codicon-home
      iframeUrl: /api/home/ui
      section: top
    # Automations (UX audit 2026-11-05 split): schedules by time or sunset and Add schedule, off the device screen.
    - toolName: home-automations
      label: Automations
      icon: codicon codicon-watch
      iframeUrl: /api/home/ui?view=automations
      section: top
    # iot.oshal.ai bundle (operator decision 2026-07-31): every physical-device/IoT app
    # surfaces here instead of standing alone. Distinct toolNames from each sibling app's
    # own tile (ADR-085 D11).
    - toolName: home-drone
      label: Drone Ops
      icon: codicon codicon-radio-tower
      iframeUrl: /api/drone/app
      section: top
    - toolName: home-sat-ops
      label: Sat Ops
      icon: codicon codicon-satellite
      iframeUrl: /api/sat/app
      section: top
    - toolName: home-pumpkin
      label: Pumpkin
      icon: codicon codicon-flame
      iframeUrl: /api/pumpkin/app
      section: top
    - toolName: home-spaces
      label: Spaces
      icon: codicon codicon-symbol-namespace
      iframeUrl: /api/spaces/app
      section: top
    - toolName: home-camera
      label: Camera Ops
      icon: codicon codicon-device-camera
      iframeUrl: /api/camera/app
      section: top
    - toolName: home-accounts
      label: Hubs
      icon: codicon codicon-plug
      iframeUrl: /api/home/ui?view=hubs   # the Smart Home hub connections (SmartThings, Google Home), not the whole connector catalog
      section: bottom

# Native kernel egress: inside the kernel's package sandbox the device controls, scene runs and
# live refresh call the SmartThings API through the kernel's fenced egress, which applies the
# caller's own smartthings connection as the Authorization header. This package never holds the token.
egress:
  # Weather forecasts (routes/home-weather.js): public and keyless, no credential attached.
  - host: nominatim.openstreetmap.org
  - host: api.weather.gov
  - host: api.smartthings.com
    credential: { connector: smartthings, header: authorization, prefix: "Bearer " }

routes:
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/home/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/home-routes.js
    factory: createHomeRoutes
    mountPath: /api/home
    auth: oidc   # what core server.ts mounted (requiresAuth — ADR-085 D2)
    requiresAuth: true
    requiresContext: true

# No migrations: the per-user store is FILES on the shared home-data volume
# (bot :rw, api :ro) — no Postgres tables; the store stays in place across the carve.

ribbon:
  # Keep the dashboard (default), Tickets (home-control, user-scoped), Calendar
  # (scheduled timers — when devices turn on/off), and Chat. Hide the rest.
  hideFrameworkItems:
    - addressbook
    - dashboard
    - logs
    - operations
  defaultView: home-dashboard

summary:
  path: /api/home/home-summary
  metricsPointer: /metrics
  tilesPointer: /tiles
  itemsPointer: /items
integrations:
  offers:
    - id: prepare-document
      label: Prepare a diagnostic brief
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
