# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | Register every shipped Rides suite (TLAB-07 "adopt existing suites": the two map suites) plus the commerce-surface suites: the readiness smoke, the map route and surface contracts, the chat-proposal hand-off boundary, the assistant-rail contract, and the 390 px Chromium commerce smoke with its real prerequisites.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Register the audience view contract (ADR-164 D6): the map page's family view for the Home shell over the shared kit, the reads it makes on open, its named states and the three gated start paths.
# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.5.2: the company audience view registered beside the family one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Register the not-connected / honest-state surface test added with the native provider rails.
# 5 | maintainer@emeraldcoastsystemsgroup.com | Register the keyless rail (no Uber connector): pin-priced estimates, the Nominatim lookup and its refusal, the public hand-off link, the concierge turn and /config; not-connected also pins the surface sending its map pins.
# 6 | maintainer@emeraldcoastsystemsgroup.com | Register the first-tap race: a typed address's blur lookup and Show rides start on the same tap; the estimate settles the lookup, sends its pin, and a late lookup no longer retracts the fares it drew.
# 7 | maintainer@emeraldcoastsystemsgroup.com | Register persona-approval: the held ride hand-off is proposed, never said prepared before approval (sweep 9).
# 8 | maintainer@emeraldcoastsystemsgroup.com | Sweep 10: keyless expects the hand-off answer to carry url and where (the approved card had no link); persona-approval expects the fixed proposing sentence with no proposal id and named places used as given.
# 9 | maintainer@emeraldcoastsystemsgroup.com | The persona-approval case also expects a named trip asked to be prepared to get its card and a done card to point to its link (sweep 13).
# 10 | maintainer@emeraldcoastsystemsgroup.com | Register recent-distinct: Recent trips and the destination suggestions list each trip once, newest copy first (sweep 14: one row per Show rides).
# 11 | maintainer@emeraldcoastsystemsgroup.com | Register saved-places: home and work come from the rider's profile, a missing one is asked for, and a dropoff farther than a car ride is refused.
# -----------------------------------------------------------------------------
version: 1
cases:
  - id: package-readiness
    name: Installed package readiness
    purpose: Verify the existing metadata-only readiness probe without provider or user-data access.
    level: integration
    runner:
      kind: smoke
      smoke: package-readiness
    expected:
      - The installed rides package identity satisfies its manifest smoke assertions.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: safe-smoke
  - id: map-routes
    name: Map configuration, geocoding proxy and estimate pass-through
    purpose: Drive the compiled Rides routes with stubbed framework imports - the keyless map provider is a real OpenStreetMap config, a Google key upgrades it, the vendored Leaflet is mounted, geocode and reverse validate input and refuse anonymous callers, and the estimate hands the map its pins and measurement.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/rides-map-routes.test.js
    expected:
      - With no Google key the provider is osm with a usable tile URL; an operator tile server replaces it.
      - Geocode and reverse refuse empty, oversized or out-of-range input and anonymous callers before any provider call.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: map-surface
    name: Map surface contract
    purpose: Parse every inline script of the served surface and pin the real map - vendored Leaflet, no remote assets, no decorative fake map, on-demand geocoding, null fares shown as no estimate, and a retracted fare when a pin moves.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/rides-map-surface.test.js
    expected:
      - Every inline script parses; Leaflet ships inside the package with its licence; no CDN is referenced.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: chat-proposal-handoff
    name: Chat booking becomes a proposal; the confirm hands off
    purpose: Drive the compiled Rides routes with an in-memory pool and a recording provider through a chat booking, an unknown ride type, an unresolved address, a planning turn, the confirmed request and the anonymous refusal.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/rides-chat-proposal.test.js
    expected:
      - A chat booking returns a proposal priced by the estimate for the named ride type and makes no ride deep-link call and no rides_requests write.
      - An address that did not resolve proposes no fare; POST /request builds the link once and records it; an anonymous caller is 401 before any query.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/rides-routes-harness.js
    limits:
      timeoutMs: 60000
      maxMemoryMb: 256
    installation: never
  - id: commerce-bridge
    name: Rides assistant rail contract
    purpose: Prove the manifest declares its surface-bridge ops from the closed vocabulary, the page loads the shared client and producer, advertises exactly the custom ops it applies, opens Uber only from the explicit request, selects the proposed ride before its card, and keeps its context digest under the contract cap.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/rides-commerce-bridge.test.js
    expected:
      - surface.ops lists context, set_field, field_change, custom, propose, submit and notify, all from the bridge vocabulary.
      - The only window.open is inside requestRide(); a 300-option digest stays at or under 4000 characters.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: surface-mobile-commerce
    name: Rides at phone width in Chromium
    purpose: Drive the actual Rides surface and its vendored Leaflet map at 390 x 844 inside a parent frame over the compiled router and the real core bridge client - destination search and priced options, a chat booking that waits for Confirm, the floating assistant's relayed ops, and the context envelopes the parent receives.
    level: browser
    runner:
      kind: playwright
      scope: package
      files:
        - tests/surface.core.spec.mjs
    expected:
      - No horizontal overflow; typing a destination filters the suggestions and picking one prices four rides the page scrolls to.
      - A chat booking selects Comfort and renders a confirm card with no hand-off POST and no window.open; Confirm fires exactly one POST /request and opens Uber once; Cancel on a relayed proposal hands off nothing.
      - The parent frame receives context envelopes with the trip, the selected ride and its fare and a submit for the confirm; the page raises no errors.
    prerequisites:
      - runner:playwright
      - harness:oshal-core-root
      - browser:chromium
      - core:dependencies
      - core:surface-bridge
      - core:shared-theme-assets
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures:
        - tests/surface.core.fixture.mjs
        - tests/rides-routes-harness.js
      cleanup: Close the owned Chromium process and the loopback HTTP server and restore OSHAL_MAP_TILE_URL; trips stay in the disposable in-memory pool and map tiles come from the fixture, with no database, provider, model or tile server.
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its family (Home shell) and company (Business shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the family view reads only GET /api/rides/history and /home-summary, never the map config, address lookup, fare estimate, Uber link, concierge or profile, and no saved ride opens anything.
      - The empty, capped, unknown-summary, partial, 401, 403 and failed-read states are each named; the map page's boot, the assistant rail and the handoff and connected-actions module start only without a view.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: not-connected
    name: Uber not connected
    purpose: >-
      A refused Uber Rides call (HTTP 503) reads as not connected on the Rides page, never as an address that did not resolve.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/rides-not-connected.test.js
    expected:
      - A refused estimate, hand-off and concierge turn say the installation has no Uber rail, never that a connection can be added.
      - The estimate sends the pins whose fields still name them, and never prices a newly typed address from an old pin.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: keyless-rail
    name: Rides with no Uber connector
    purpose: >-
      Where the runtime reports Uber not connected, the compiled routes price two map pins locally (haversine x 1.3 and the
      fare model), resolve typed addresses through Nominatim, build Uber's public hand-off link, let the concierge answer,
      and never call the refusing provider operation.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/rides-keyless.test.js
    expected:
      - Two pins give a distance and labelled modelled fares with no provider call and no lookup.
      - A refused lookup says the lookup is unavailable here; no fare is invented.
      - The concierge turn answers (no 503) and its prompt forbids telling the rider to connect Uber.
      - The hand-off answer carries url (the https web link an approval card offers) and where (open it to see the price and request; also under Trips).
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
    installation: never
  - id: first-tap-geocode-race
    name: Show rides keeps its fares when the field lookup answers late
    purpose: >-
      Execute the shipped setPoint, geocodeField, settleGeocodes and estimate with a network answered in a chosen order:
      a blur lookup in flight at the tap lands its pin before /estimate and is sent with it, a lookup slower than the
      bounded wait answers after /estimate without wiping the options, and a lookup started later still retracts the old fare.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/rides-geocode-race.test.js
    expected:
      - The first Show rides tap after typing an address leaves the priced options drawn and the hand-off enabled.
      - A newly typed destination still moves the pin and retracts the fare for the old one.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
    installation: never
  - id: persona-approval
    name: A held ride hand-off is only proposed until approved
    purpose: Read the shipped manifest and the persona the kernel loads for rides-concierge.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/rides-persona-approval.test.js
    expected:
      - "A rider who names both places and asks to prepare, book or request gets the hand-off card (the map button does not gate it), and after a done card the reply points to the link on that card instead of asking for approval again (sweep 13)."
      - prepare-ride-booking is held for approval.
      - The persona says the hand-off is proposed and waiting on its card, never prepared or booked before the tool answers.
      - The proposing reply has one fixed shape ("Approve the card to make the Uber link ..."), shows no proposal id, tool name or bracketed card, and uses a named pickup and drop-off as given.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: recent-distinct
    name: Recent trips lists each trip once
    purpose: >-
      In Chromium at 412x915 the shipped Rides page opens over a history holding one trip four times and another once
      (sweep 14: "Pensacola Beach / Pensacola International Airport" was listed four times).
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/rides-recent-distinct.test.js
    expected:
      - Recent trips lists Pensacola International Airport once and Downtown Library once, newest first; the suggestions list the airport once.
    prerequisites:
      - runner:node-test
      - dependency:playwright
      - browser:chromium
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
  - id: saved-places
    name: Saved places and car-ride distance
    purpose: On the keyless rail, "home" and "work" come from the rider's profile (refused and asked for when not saved), and
      a dropoff that geocodes farther than a car ride is refused naming where it landed.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
      - tests/rides-saved-places.test.js
    expected:
    - No lookup of the word home; Helsinki is refused; a nearby airport builds the link.
    prerequisites:
    - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
    installation: never
