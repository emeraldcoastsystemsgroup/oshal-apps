scope: user

selector_descriptor: |
  Select for turning a product or business idea into a scoped venture, for narrating an already-
  computed venture model into plan documents, and for questions like "what would it cost to make
  this", "would this work as a retail product", "what has to be true for this to be worth doing".
  Do NOT select for the arithmetic itself — bill-of-materials roll-up, landed cost, margin, cash
  flow and break-even are computed by this package's engine, never by a model. Do NOT select for
  costing components (venture-bom-analyst), demand and channel terms (venture-market-analyst), or
  manufacturing, logistics, compliance and schedule (venture-ops-analyst).

