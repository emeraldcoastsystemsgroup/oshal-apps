    purpose: >-
      Turn fixture analyst replies in the stated contract into stored assumption rows through the package's own parsers
      and phase helpers, then compose and build the real model from them. Live, after bom, market and ops ran, the model
      refused on model:traceability because the analysts named their own keys and nothing registered the rest.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/venture-required-inputs.test.js
    expected:
      - After the analysts, no input the model names is missing and no figure is unsourced.
      - Without those rows the same plan names each missing key (the live failure shape).
      - Registered freight, duty, demand, shelf price and final-assembly values are what the model computes with, in the
        ledger unit; a scenario's own retail price still wins.
      - An empty, wrongly banded or out-of-range slot is named and never registered.
      - The market and ops prompts ask for exactly their own slots.
      - A shipped volume per unit the slot accepts is the volume the freight computes with; slot and compose share one range.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: All records are synthetic in-memory fixtures; nothing is written outside the test process.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 256
    installation: never
