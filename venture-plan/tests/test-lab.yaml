version: 1
cases:
  - id: package-readiness
    name: Installed package readiness
    purpose: Retain the existing metadata-only installation probe without running a business workflow.
    level: integration
    runner:
      kind: smoke
      smoke: package-readiness
    expected:
      - The installed venture-plan metadata satisfies its existing manifest smoke assertions.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: safe-smoke
  - id: venture-bom
    name: Bill-of-materials rollup
    purpose: Evaluate synthetic component trees with the compiled BOM engine.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/venture-bom.test.js
    expected:
      - Scrap, quantity breaks and vendor costs produce hand-derived totals.
      - Invalid references and malformed quantities cannot become plausible costs.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/fixture-venture.js
      cleanup: >-
        The runner removes the disposable container and staged files; all business records are synthetic
        in-memory fixtures.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 256
    installation: never
