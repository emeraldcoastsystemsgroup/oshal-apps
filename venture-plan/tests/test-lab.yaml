# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | Register every shipped Node test suite with exact files and honest fixture boundaries; retain readiness smoke identity.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Register the company audience view contract (ADR-164 D6, 1.4.3): kit placement and boot, the console start and both module scripts gated, the bounded reads and what the view paints, and its named refusals.
# 3 | maintainer@emeraldcoastsystemsgroup.com | Correct the audience-view expectation: the evidence section had been described as repeating the headers while it read confidence words the header never sends; it now counts coverage.bySourceKind, checked against SOURCE_KINDS and the real coverageOf.
# 4 | maintainer@emeraldcoastsystemsgroup.com | 1.4.4: the family audience view registered beside the company one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
# 5 | maintainer@emeraldcoastsystemsgroup.com | 1.5.0, the authorization catalog: catalog-bindings (every route bound once under the kernel's segment rule, the tick and bots pinned), kernel-catalog-activation (the real kernel loader, enforce-mode authorization runtime, route mounter, ADR-157 activation and tick runner over the package), rebaseline-live-acceptance-doubles (the live walk against a loopback api and scheduler double) and rebaseline-live-acceptance (the dated live walk itself, run after install as the operator automation identity and a second caller).
# 6 | maintainer@emeraldcoastsystemsgroup.com | 1.5.1: schema-bootstrap-postgres, the two schema bootstraps one api boot starts (console and rebaseline-tick routers) against a uniquely labelled disposable PostgreSQL, round after round from a fresh schema; an external case like the other disposable-PostgreSQL suites in the store.
# 7 | maintainer@emeraldcoastsystemsgroup.com | venture-run-native: on the native kernel an authoring run is driven and closed inside its request (host calls after the response are refused there); a cut-off reply fails its phase with that reason, analysts one request cannot fit are deferred and the next run continues from them, and a run an earlier request left running is closed as interrupted.
# 8 | maintainer@emeraldcoastsystemsgroup.com | venture-run-native also reads a run whose request was abandoned as interrupted once past the request deadline, writing nothing (venture-routes asserts the same against a pool that refuses writes, as the kernel does on a read); new venture-analyst-budget (each analyst contract's largest reply fits the explicit output cap, which fits one native request) and venture-run-ui (the console's running banner before the POST answers and each phase's reason after a run closes).
# 9 | maintainer@emeraldcoastsystemsgroup.com | venture-numbers-ui: the Numbers tab groups the stored flat waterfall rows into one card per channel with the engine's contribution figure, the sensitivity table shows the sweep's own baseline and each assumption in its unit and names a stale saved model, and Delete removes a venture only after a confirm.
# 10 | maintainer@emeraldcoastsystemsgroup.com | venture-verdicts-ui: the "What would have to be true" rows compare each threshold with the plan values the tiles show (sell-through headroom read higher-is-better, the planned run from the inversion answer), and the publish banner, stage strip and posture strip agree with the stored "[severity] where: message" issues and the guessed chips.
# 11 | maintainer@emeraldcoastsystemsgroup.com | venture-verdicts-ui: the sell-through row compares the threshold with the share the plan's demand sells (not a fixed 100%), checked against the compiled engine on a money-losing plan; above 100% reads impossible.
# 12 | maintainer@emeraldcoastsystemsgroup.com | New venture-required-inputs (fixture analyst replies register every input the model names and the real composed model traces with no unsourced figure, computing with the registered values); venture-run-native adds resume from a failed or gap-left analyst, a named unsupplied slot, and documents stored from the computed numbers on a native full run; venture-analyst-budget counts the required slots.
# 13 | maintainer@emeraldcoastsystemsgroup.com | New analyst-run-keeps-evidence (disposable PostgreSQL): an ops run keeps a recorded vendor quote and a person's own entry on its required slots, the composed freight and duty are the quoted and entered values, a held slot is no gap, and the analyst still revises its own estimate.
# 14 | maintainer@emeraldcoastsystemsgroup.com | New venture-registered-terms: the registered cost per direct order and container fill are what the plan computes with (the live -$33.24 contribution reproduced on the parent shape), analyst units are converted or refused, GET /assumptions answers each row's grade and the console tallies and edits in the server's vocabulary. analyst-run-keeps-evidence adds the BOM redraft case: the BOM analyst's estimates for lines and vendors a redraft no longer has are closed, a person's entry stays.
# 15 | maintainer@emeraldcoastsystemsgroup.com | venture-required-inputs expects one range for the shipped volume per unit (slot and compose agree).
# 16 | maintainer@emeraldcoastsystemsgroup.com | New documents-carry-current-numbers (disposable PostgreSQL + the kernel runtime's Office renderer): narrated figure tokens render, an unknown token rejects only its section, the computed document set is one batched INSERT, a document from an earlier computation is marked stale and print/export use the current numbers, and plan.docx has no Markdown markers. venture-run-native adds the batched write and the document deadline; venture-run-ui and venture-verdicts-ui the Documents banner line and Step 4 with documents stored.
# 17 | maintainer@emeraldcoastsystemsgroup.com | Sweep 10: venture-run-native adds the strict retry of an analyst reply that did not parse (once, only when it fits the request, never for a cut-off reply) and Regenerate prose with an unreachable break-even; new venture-prose-claims (real catalogue: unreachable figures named to the strategist, a sentence claiming one removed, STRICT_JSON on the retry only).
# 18 | maintainer@emeraldcoastsystemsgroup.com | Review of sweep 10: venture-prose-claims expects conditional sentences ("would have to", "need", "if", "to reach") kept and only assertions that break-even is reached removed, and an emptied section kept with a note; venture-run-native stores those conditions through Regenerate prose.
# 19 | maintainer@emeraldcoastsystemsgroup.com | Round 14: no narrated sentence is deleted. venture-prose-claims expects break-even facts from the real engine (reached month and run size, or not reached with the horizon net income as the gap) in the narrate prompt, conditions kept with no note, claims (including the round-13 modal forms) kept with the visible check note, and no note on a reached model; venture-run-native stores them that way through Regenerate prose.
# 20 | maintainer@emeraldcoastsystemsgroup.com | Register venture-landed-label: the landed figures' labels say the BOM cost is included, so a summary no longer adds the landed cost on top of the factory cost (sweep 13).
# 21 | maintainer@emeraldcoastsystemsgroup.com | Register venture-figure-units: narrated figures read with their unit words, a ratio as a rounded percent, and a rejected section names no machine id (sweep 14); venture-numbers-ui also expects Delete to clear the deleted venture's banners.
