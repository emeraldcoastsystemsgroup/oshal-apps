  - id: venture-run-native
    name: Analyst runs finish on the native kernel
    purpose: >-
      Run the compiled orchestrator against store and bot doubles that refuse every call once the request has
      answered, as the native kernel does.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/venture-run-native.test.js
    expected:
      - A run is closed inside its request and nothing is attempted after the response.
      - A BOM reply cut off before its JSON closed fails the phase with that reason, never leaving it running.
      - Analysts that one 60-second request cannot fit are deferred, and the next run continues from them.
      - A run an earlier request left running is closed as interrupted before a new run opens.
      - A run whose request was abandoned mid-call is read as interrupted once it is past the request deadline plus a
        margin, without any write; a fresh run, a run this process drives and any run off the native kernel read as stored.
      - Run continues from the first analyst the latest full run deferred, failed or left with an unsupplied input, and
        starts over only after a clean cycle.
      - A market reply that leaves a required slot empty finishes the phase with that slot named on the phase and run.
      - A native full run stores every catalogue document rendered from the computed numbers with no narration call.
      - A BOM reply that does not parse is asked for once more with the strict JSON rule and the run goes on with it; a slow
        reply that leaves no room, or a cut-off reply, is not retried and fails with its reason.
      - Regenerate prose gives the strategist break-even as computed and stores a sentence claiming it is reached as written,
        with the visible check note after its section.
      - Regenerate prose stores the conditions for breaking even exactly as written with no note, and a section whose only
        sentence claimed break-even is kept with the check note.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: All records are synthetic in-memory fixtures; nothing is written outside the test process.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 256
    installation: never
