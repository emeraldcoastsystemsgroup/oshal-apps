version: 1
cases:
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell) and family (Home shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the company view makes two reads, GET /api/sat/fleet and GET /api/sat/catalog, and the real routes behind them only list the in-memory fleet registry and TLE catalog; it never asks for a track, a pass window, a conjunction screen, the concierge or a node command.
      - Fed by the package's real routes, the fleet reads as four stats (sim nodes, recent and stale heartbeats, orbits loaded), a title naming the fleet's state, a fleet table of each node's last report with recent nodes first, and an orbit catalog table joined to its attitude nodes by sat id, newest registration first; no row opens, commands or changes anything.
      - Odd rows (no telemetry yet, never heard, an unknown engine, a catalog row without name or number) and a catalog that could not be read (the fleet still shows, the orbit count reads Could not check) each read as what they are; so do signed out, refused, the fleet route's failure, an unreadable answer and an unreachable server.
      - Under the company view the page's main script and connected-actions script bind no listener or click handler, read nothing, start no poll or render loop and mount no offer; the full page still runs every start step.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: pass-times-iso
    name: Pass windows answer ISO-8601 times the concierge quotes
    purpose: >-
      The concierge converted epoch milliseconds itself and gave the wrong next-pass dates. Verify the real compiled POST /passes
      route returns riseUtc, culminationUtc, setUtc and startUtc as ISO-8601 UTC beside the millisecond values, the TypeScript
      source does the same, and the Sat Operator persona quotes them verbatim and never converts milliseconds.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sat-passes-iso.test.cjs
    expected:
      - A pass with riseUtcMs 1791720773730 answers riseUtc 2026-10-11T12:12:53.730Z, with culminationUtc and setUtc beside their ms values.
      - startUtc is the ISO form of the request's start and the engine tag is kept.
      - The persona names riseUtc, culminationUtc and setUtc and forbids converting milliseconds.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: chat-screen
    name: Sat Operator chat answers from the screen
    purpose: Drive the compiled POST /chat with framework stand-ins and a stub orchestrator, and read the page script - no network, database or model.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sat-chat-screen.test.cjs
    expected:
      - The ground station and the Pass windows table the page sends reach the prompt as GROUND STATION and PASS WINDOWS ON SCREEN lines, with the rule never to ask for coordinates the screen gives.
      - A turn without screen state carries no screen lines; an empty prediction says none above the mask.
      - Out-of-range or non-numeric input is dropped, at most 12 passes are kept and the sat id is stripped.
      - The page sends its station and last prediction with every chat turn.
      - The prompt carries a NOW (UTC) line and each pass on screen reads today, tomorrow or its UTC date against the current UTC day (sweep 8 called a same-day pass 'tomorrow').
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: sat-register-form
    name: "The register form starts empty under its own label"
    purpose: "Read the shipped page and run its Register TLE handler over a stub DOM - no browser, network or engine."
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sat-register-form.test.cjs
    expected:
      - "The sat id field has no prefilled value and is labelled New satellite id; Register TLE with it empty refuses and sends nothing."
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 60000
      maxMemoryMb: 256
    installation: never
