version: 1
cases:
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell) and family (Home shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the company view makes two reads, GET /api/sat/fleet and GET /api/sat/catalog, and the real routes behind them only list the in-memory fleet registry and TLE catalog; it never asks for a track, a pass window, a conjunction screen, the concierge or a node command.
      - Fed by the package's real routes, the fleet reads as four stats (sim nodes, recent and stale heartbeats, orbits loaded), a title naming the fleet's state, a fleet table of each node's last report with recent nodes first, and an orbit catalog table joined to its attitude nodes by sat id, newest registration first; no row opens, commands or changes anything.
      - Odd rows (no telemetry yet, never heard, an unknown engine, a catalog row without name or number) and a catalog that could not be read (the fleet still shows, the orbit count reads Could not check) each read as what they are; so do signed out, refused, the fleet route's failure, an unreadable answer and an unreachable server.
      - Under the company view the page's main script and connected-actions script bind no listener or click handler, read nothing, start no poll or render loop and mount no offer; the full page still runs every start step.
      - Under a view the page's own module loads and mounts nothing; without the audience, and without the kit, it loads /shared/ui/js/jarvis-chat-frame.js and mounts the one chat window into the Sat operator section as Sat Ops' concierge (sat-operator, four starter prompts, no Close).
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: pass-times-iso
    name: Pass windows answer ISO-8601 times the concierge quotes
    purpose: >-
      The concierge converted epoch milliseconds itself and gave the wrong next-pass dates. Verify the real compiled POST /passes
      route returns riseUtc, culminationUtc, setUtc and startUtc as ISO-8601 UTC beside the millisecond values, the TypeScript
      source does the same, and the Sat Operator persona quotes them verbatim and never converts milliseconds.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sat-passes-iso.test.cjs
    expected:
      - A pass with riseUtcMs 1791720773730 answers riseUtc 2026-10-11T12:12:53.730Z, with culminationUtc and setUtc beside their ms values.
      - startUtc is the ISO form of the request's start and the engine tag is kept.
      - The persona names riseUtc, culminationUtc and setUtc and forbids converting milliseconds.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: chat-screen
    name: Sat Operator chat answers from the screen
    purpose: Drive the compiled POST /chat with framework stand-ins and a stub orchestrator, and read the page script - no network, database or model.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sat-chat-screen.test.cjs
    expected:
      - The ground station and the Pass windows table the page sends reach the prompt as GROUND STATION and PASS WINDOWS ON SCREEN lines, with the rule never to ask for coordinates the screen gives.
      - A turn without screen state carries no screen lines; an empty prediction says none above the mask.
      - Out-of-range or non-numeric input is dropped, at most 12 passes are kept and the sat id is stripped.
      - Every turn of the Sat operator window carries the page's station and last prediction in exactly the GROUND STATION and PASS WINDOWS ON SCREEN lines the route builds, and the page sends no POST /chat of its own.
      - The prompt carries a NOW (UTC) line and each pass on screen reads today, tomorrow or its UTC date against the current UTC day (sweep 8 called a same-day pass 'tomorrow').
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: sat-register-form
    name: "The register form starts empty under its own label"
    purpose: "Read the shipped page and run its Register TLE handler over a stub DOM - no browser, network or engine."
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sat-register-form.test.cjs
    expected:
      - "The sat id field has no prefilled value and is labelled New satellite id; Register TLE with it empty refuses and sends nothing."
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 60000
      maxMemoryMb: 256
    installation: never
  - id: one-chat-window
    name: The Sat operator is the one chat window, with the screen on every turn
    purpose: >-
      Serve the shipped page with the kernel's one chat window from a kernel platform export (OSHAL_KERNEL_PLATFORM) and its
      stand-in kernel over a local fixture server, a made-up simulated fleet and no provider; requests off the loopback are
      refused.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sat-ops-one-chat-window.test.mjs
    expected:
      - At 1440x900 and 412x915 the Sat operator section is the window (concierge sat-ops, bot sat-operator) between Selected sat and Pass windows, inside the right pane, with its model menu, Files, Tap to talk, Keep trying and conversations; nothing runs sideways.
      - A model picked in the window rides on the turn; the person's words alone reach sat-operator's door with context.app sat-ops.
      - context.screen_state carries the fleet, the catalog, the selected sat and its console, the ground station and the Pass windows table as the page shows them; no document is named.
      - The page draws no transcript, message box or draft button of its own and sends no POST /api/sat/chat; no page error.
      - A command the bot proposes is the window's approval card; nothing is sent before Approve, Approve sends exactly the held point command, and the page reads the fleet again for each Sat Ops card that ran.
    prerequisites: [runner:node-test, runtime:chromium, 'source:shared-ui']
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: Stop the fixture server.
    limits:
      timeoutMs: 120000
    installation: never
  - id: ux-layout
    name: The brief panel sits in the right pane and controls are 44px
    purpose: >-
      UX audit 2026-11-06: the diagnostic brief panel is docked into the right pane in theme colours, four controls are 44px on touch and phone widths, and the title is named once.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/ux-layout.test.cjs
    expected:
      - The handoff dock is position static and moved into #right.
      - The controls btnAutoRot, btnFrame, catAdd and Remove are 44px under coarse pointers.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never

  - id: sat-bot-tools-contract
    name: Inline concierge posture, tool schemas, plain-prose rule, and tool_call fence
    purpose: Verify sat-operator declares explicit inline posture, chatBot binding, object inputSchemas on all eight tools, and plain-prose + ```tool_call {"tool": ...} instructions for oshald.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sat-bot-tools-contract.test.cjs
    expected:
      - sat-operator declares posture inline and chatBot sat-operator with explicit object inputSchemas on all eight tools.
      - personas/sat-operator.yaml teaches plain prose and the ```tool_call fence using "tool".
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
