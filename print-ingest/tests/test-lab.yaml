version: 1
cases:
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell) and family (Home shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the company view makes two reads, GET /api/print-ingest/documents and /home-summary, and the real routes behind them (the whole print-ingest router and the Home summary route) only SELECT the caller's own rows; it never approves, rejects, imports, reads the destinations or the readiness count, and writes nothing.
      - Fed by the package's real routes, the inbox reads as four stats (awaiting approval, failed or partial, received in 5 days, fully filed), a title ladder, a table of the newest ten with state, origin, characters, the machine's proposal or where each copy went and the receipt time, a failed-or-partly-filed list with the route's reasons and the route's notes; the declared user, client address and document text never reach the view.
      - A full 200-row list, odd rows, counts the summary could not check, signed out, refused (the catalog-less admin-only admission named), the route's own failure, an unreadable answer and an unreachable server each read as what they are; the one action opens the full Print Inbox in the frame without the audience.
      - Under the company view the body script binds no approve, reject or tab listener and reads nothing; the full page, and a core without the kit, still run the inbox read and every listener, and the full page keeps its own colour scheme under the theme bootstrap.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: description
    name: The package says what it is
    purpose: Read the shipped manifest, marketplace.json and README so Jarvis's catalog never describes Print Ingest as a way to print on paper.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/description.test.cjs
    expected:
      - The description begins "An inbound virtual printer for the swarm", says documents are never printed on paper and that it cannot print to a home or office printer, and keeps the approval rule.
      - marketplace.json carries the same description and the README no longer opens with "Print a document to the swarm".
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: ux-inbox
    name: The Print Inbox keeps Approve the one primary and reads in words
    purpose: >-
      UX audit 2026-11-06 (P2): the page's own functions in a sandbox and its CSS: Match words, one readers line per group, the selected tab's count in inverted ink, the editable title as the heading with a 3-line excerpt, sticky actions on a phone.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/ux-inbox.test.cjs
    expected:
      - MEDIUM reads Match medium and a shared readers line appears once.
      - The selected tab shows its count and is not accent-filled.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: printed-collect
    name: Documents printed to the owner's computers are taken into the inbox awaiting approval
    purpose: >-
      T11: POST /api/print-ingest/printed/collect over the package's real compiled router, with the kernel's
      print_jobs.list and print_jobs.take as a stand-in queue: each printed job is filed as the caller's own intake row
      awaiting approval with the computer it was printed to, the sending address, pages, size and time, and taken from
      the kernel only after its row exists.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/printed-collect.test.cjs
    expected:
      - Two waiting jobs become two rows owned by the caller, at their default state (awaiting approval), with a printer sidecar; print_jobs.take names both after the inserts; nothing is updated, approved or written to a corpus.
      - The same text filed before is a duplicate and is still taken; a failed insert takes nothing, so the jobs wait in the kernel for the next try (502 in words).
      - Seven waiting jobs are taken in two rounds of at most five; signed out is 401 and a kernel without intents 503, neither touching the queue.
      - authorization.yaml binds POST /api/print-ingest/printed/collect to app.open and intake.write.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: printed-row
    name: A printed document says it came from a printer, and the inbox takes printed documents before it lists
    purpose: >-
      T11: the page's own functions in a sandbox: the printed row (Came from a printer, printed to which computer from
      which address, pages, size, time, all as text), the collect-then-list start of the full page and each tab, and the
      company view naming the computer but never the sending address.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/printed-row.test.cjs
    expected:
      - A printed document reads "Came from a printer", "Printed to Office PC from 192.168.1.20", its pages, size and time; a hostile name is escaped; its meta line does not say unknown machine.
      - A document from anywhere else is unchanged.
      - The full inbox and each tab call POST /printed/collect, then list; a failed take says the documents still wait.
      - The company view's origin for a printed document is the computer's name only.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
