/* ---------- binary STL parse (skip stored normals, recompute flat) ------- */
function parseSTL(b64){
  var raw = atob(b64), N = raw.length;
  var u8 = new Uint8Array(N);
  for (var i = 0; i < N; i++) u8[i] = raw.charCodeAt(i);
  var dv = new DataView(u8.buffer);
  var n = dv.getUint32(80, true);
  var pos = new Float32Array(n * 9), nrm = new Float32Array(n * 9);
  var off = 84, lo = [1e30,1e30,1e30], hi = [-1e30,-1e30,-1e30];
  for (var t = 0; t < n; t++){
    var p = off + 12, v = [];
    for (var k = 0; k < 9; k++){
      var f = dv.getFloat32(p + 4*k, true); v.push(f);
      var a = k % 3;
      if (f < lo[a]) lo[a] = f;
      if (f > hi[a]) hi[a] = f;
    }
    var ux = v[3]-v[0], uy = v[4]-v[1], uz = v[5]-v[2];
    var wx = v[6]-v[0], wy = v[7]-v[1], wz = v[8]-v[2];
    var nx = uy*wz - uz*wy, ny = uz*wx - ux*wz, nz = ux*wy - uy*wx;
    var l = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
    nx /= l; ny /= l; nz /= l;
    for (var j = 0; j < 3; j++){
      pos.set(v.slice(3*j, 3*j+3), t*9 + j*3);
      nrm[t*9+j*3] = nx; nrm[t*9+j*3+1] = ny; nrm[t*9+j*3+2] = nz;
    }
    off += 50;
  }
  return {pos: pos, nrm: nrm, n: n, lo: lo, hi: hi, bytes: N};
}

/* ------------------------------ mat4 helpers ----------------------------- */
function m4mul(a, b){
  var o = new Float32Array(16);
  for (var c = 0; c < 4; c++) for (var r = 0; r < 4; r++){
    var s = 0;
    for (var k = 0; k < 4; k++) s += a[k*4+r] * b[c*4+k];
    o[c*4+r] = s;
  }
  return o;
}
function m4persp(fovy, asp, zn, zf){
  var f = 1/Math.tan(fovy/2), o = new Float32Array(16);
  o[0]=f/asp; o[5]=f; o[10]=(zf+zn)/(zn-zf); o[11]=-1;
  o[14]=2*zf*zn/(zn-zf);
  return o;
}
function m4look(eye, ctr, up){
  var zx=eye[0]-ctr[0], zy=eye[1]-ctr[1], zz=eye[2]-ctr[2];
  var zl=Math.sqrt(zx*zx+zy*zy+zz*zz); zx/=zl; zy/=zl; zz/=zl;
  var xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx;
  var xl=Math.sqrt(xx*xx+xy*xy+xz*xz)||1; xx/=xl; xy/=xl; xz/=xl;
  var yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  return new Float32Array([xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0,
    -(xx*eye[0]+xy*eye[1]+xz*eye[2]),
    -(yx*eye[0]+yy*eye[1]+yz*eye[2]),
    -(zx*eye[0]+zy*eye[1]+zz*eye[2]), 1]);
}

var cv = document.getElementById("c");
var gl = cv.getContext("webgl") || cv.getContext("experimental-webgl");
if (!gl){ document.getElementById("err").style.display = "block"; }
else {
var mesh = parseSTL(STL_B64);
var ctr = [(mesh.lo[0]+mesh.hi[0])/2, (mesh.lo[1]+mesh.hi[1])/2,
           (mesh.lo[2]+mesh.hi[2])/2];
var diag = Math.sqrt(
  Math.pow(mesh.hi[0]-mesh.lo[0],2) + Math.pow(mesh.hi[1]-mesh.lo[1],2) +
  Math.pow(mesh.hi[2]-mesh.lo[2],2));

function sh(type, src){
  var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw gl.getShaderInfoLog(s);
  return s;
}
function prog(vs, fs){
  var p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p); return p;
}

var meshProg = prog(
  "attribute vec3 aP; attribute vec3 aN; uniform mat4 uMVP;" +
  "varying vec3 vN; void main(){ vN = aN;" +
  " gl_Position = uMVP * vec4(aP, 1.0); }",
  "precision mediump float; varying vec3 vN; uniform vec3 uL;" +
  "void main(){ vec3 n = normalize(vN);" +
  " float d = max(dot(n, normalize(uL)), 0.0);" +          /* key light  */
  " float h = 0.5 + 0.5 * n.z;" +                           /* hemisphere */
  " vec3 base = vec3(0.52, 0.62, 0.72);" +
  " vec3 col = base * (0.22 + 0.62 * d) + vec3(0.10, 0.12, 0.15) * h;" +
  " gl_FragColor = vec4(col, 1.0); }");

var gridProg = prog(
  "attribute vec3 aP; uniform mat4 uMVP;" +
  "void main(){ gl_Position = uMVP * vec4(aP, 1.0); }",
  "precision mediump float; uniform vec4 uC;" +
  "void main(){ gl_FragColor = uC; }");

/* mesh buffers */
var bPos = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, bPos);
gl.bufferData(gl.ARRAY_BUFFER, mesh.pos, gl.STATIC_DRAW);
var bNrm = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, bNrm);
gl.bufferData(gl.ARRAY_BUFFER, mesh.nrm, gl.STATIC_DRAW);

/* grid: x-y plane lines at z just under the pod, 250 mm pitch */
var gz = mesh.lo[2] - 30, gv = [], ext = 2250, step = 250;
for (var g = -ext; g <= ext; g += step){
  gv.push(ctr[0]+g, ctr[1]-ext, gz, ctr[0]+g, ctr[1]+ext, gz);
  gv.push(ctr[0]-ext, ctr[1]+g, gz, ctr[0]+ext, ctr[1]+g, gz);
}
var gridN = gv.length / 3;
var bGrid = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, bGrid);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(gv), gl.STATIC_DRAW);

/* orbit state */
var yaw0 = 0.9, pitch0 = 0.42, dist0 = diag * 1.25;
var yaw = yaw0, pitch = pitch0, dist = dist0, drag = null;
cv.addEventListener("mousedown", function(e){
  drag = [e.clientX, e.clientY]; cv.classList.add("drag"); });
window.addEventListener("mouseup", function(){
  drag = null; cv.classList.remove("drag"); });
window.addEventListener("mousemove", function(e){
  if (!drag) return;
  yaw += (e.clientX - drag[0]) * 0.008;
  pitch += (e.clientY - drag[1]) * 0.008;
  pitch = Math.max(-1.45, Math.min(1.45, pitch));
  drag = [e.clientX, e.clientY]; draw();
});
cv.addEventListener("wheel", function(e){
  e.preventDefault();
  dist *= Math.pow(1.0015, e.deltaY);
  dist = Math.max(diag*0.25, Math.min(diag*6, dist)); draw();
}, {passive:false});
cv.addEventListener("dblclick", function(){
  yaw = yaw0; pitch = pitch0; dist = dist0; draw(); });
/* one-finger touch orbit, pinch zoom */
var tPrev = null;
cv.addEventListener("touchstart", function(e){ tPrev = snapT(e); }, {passive:true});
cv.addEventListener("touchmove", function(e){
  e.preventDefault();
  var t = snapT(e);
  if (tPrev && t.n === 1 && tPrev.n === 1){
    yaw += (t.x - tPrev.x) * 0.008; pitch += (t.y - tPrev.y) * 0.008;
    pitch = Math.max(-1.45, Math.min(1.45, pitch));
  } else if (tPrev && t.n === 2 && tPrev.n === 2 && t.d > 0 && tPrev.d > 0){
    dist *= tPrev.d / t.d;
    dist = Math.max(diag*0.25, Math.min(diag*6, dist));
  }
  tPrev = t; draw();
}, {passive:false});
function snapT(e){
  var T = e.touches;
  if (T.length >= 2){
    return {n:2, x:0, y:0,
      d: Math.hypot(T[0].clientX-T[1].clientX, T[0].clientY-T[1].clientY)};
  }
  return T.length === 1 ? {n:1, x:T[0].clientX, y:T[0].clientY, d:0}
                        : null;
}

function draw(){
  var w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * devicePixelRatio){
    cv.width = w * devicePixelRatio; cv.height = h * devicePixelRatio;
  }
  gl.viewport(0, 0, cv.width, cv.height);
  gl.clearColor(0.055, 0.07, 0.094, 1);
  gl.enable(gl.DEPTH_TEST);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  var cp = Math.cos(pitch), eye = [
    ctr[0] + dist * cp * Math.cos(yaw),
    ctr[1] + dist * cp * Math.sin(yaw),
    ctr[2] + dist * Math.sin(pitch)];
  var V = m4look(eye, ctr, [0, 0, 1]);
  var P = m4persp(0.7, w / h, diag * 0.01, diag * 12);
  var MVP = m4mul(P, V);

  /* grid first (no depth write so the model always wins ties) */
  gl.useProgram(gridProg);
  gl.uniformMatrix4fv(gl.getUniformLocation(gridProg, "uMVP"), false, MVP);
  gl.uniform4f(gl.getUniformLocation(gridProg, "uC"), 0.16, 0.20, 0.26, 1);
  gl.bindBuffer(gl.ARRAY_BUFFER, bGrid);
  var aG = gl.getAttribLocation(gridProg, "aP");
  gl.enableVertexAttribArray(aG);
  gl.vertexAttribPointer(aG, 3, gl.FLOAT, false, 0, 0);
  gl.depthMask(false);
  gl.drawArrays(gl.LINES, 0, gridN);
  gl.depthMask(true);

  /* mesh */
  gl.useProgram(meshProg);
  gl.uniformMatrix4fv(gl.getUniformLocation(meshProg, "uMVP"), false, MVP);
  gl.uniform3f(gl.getUniformLocation(meshProg, "uL"), 0.45, 0.3, 0.85);
  gl.bindBuffer(gl.ARRAY_BUFFER, bPos);
  var aP = gl.getAttribLocation(meshProg, "aP");
  gl.enableVertexAttribArray(aP);
  gl.vertexAttribPointer(aP, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, bNrm);
  var aN = gl.getAttribLocation(meshProg, "aN");
  gl.enableVertexAttribArray(aN);
  gl.vertexAttribPointer(aN, 3, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, mesh.n * 3);
}
window.addEventListener("resize", draw);
draw();
}
</script></body></html>
