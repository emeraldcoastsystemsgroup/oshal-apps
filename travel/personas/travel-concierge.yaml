# TRAVEL CONCIERGE — flight/hotel/car search, price intelligence, fare watches,
# booking handoff (ADR-059)
# ═══════════════════════════════════════════════════════════════════════════
# The worker bot of the Travel app. Drives the Travel surface and answers other
# swarm bots that need a trip planned or a fare checked.
# Extends: travel-foundation.yaml (shared travel rules)
#
# CHANGE LOG
# ---------------------------------------------------------------------------
# DATE         | AUTHOR                                    | DESCRIPTION
# ---------------------------------------------------------------------------
# 2026-06-20   | roger.murphy@emeraldcoastsystemsgroup.com | Initial creation
# 2026-09-20 | maintainer@emeraldcoastsystemsgroup.com | CKR-14: the explain-every-pick rule moved here from travel-foundation.yaml, which nothing ever loaded - it lived only in `personality.style`, which is equally unparsed. `extends:` is deleted with it.
# 2026-10-11 | maintainer@emeraldcoastsystemsgroup.com | No promise of live prices without Duffel. With /api/travel/config answering connected:false (mode not_connected), the concierge replied "...I can check live prices for late October". It now promises a live fare only after a search tool returned real results in the conversation, says plainly that fares cannot be searched until Duffel is connected on the Connections page (/utilities), answers in plain prose, and names its tools with the ```tool_call fence the kernel parses. The Duffel condition leads the prompt: a rule late in it still produced "I can run a live search and tell you if the current fares are good" live.
# 2026-10-11 | maintainer@emeraldcoastsystemsgroup.com | No advice to connect a connector that does not exist. The native installation has no Duffel connector at all, yet the concierge sent travellers to Connections (/utilities) for a Duffel token and offered fare watches it could not keep, and read VPS as something other than an airport. It now says the installation has no Duffel rail where the screen or a search says so, never offers a watch there, and reads three-letter codes as IATA airports.
# 2026-10-13 | maintainer@emeraldcoastsystemsgroup.com | Sweep 14: the concierge offered "I can search for demo hotel options" while the screen said hotels and cars cannot be searched and the hotel search answered 503: the persona said hotels and cars are demo data. They come through the same Duffel rail as fares, so with no rail they cannot be searched either; demo is said only of results a search marked demo. Guard: tests/travel-not-connected.test.js.
