version: 1
cases:
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its family (Home shell) and company (Business shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the family view reads only /api/travel/config and /watches; never a flight, hotel or car search and never the concierge.
      - Trip dates go to AppView.day as the stored calendar day, checks and saves to AppView.when; a trip today is coming up and one gone by reads Date passed.
      - Tripped watches read as Price dropped or Reached target; demo, test-token, live and unknown prices are each named, with the connect action only in demo.
      - An empty radar, a refusal and a failed read each read as what they are.
      - Under an audience view the module script adds no handoff listener, appends no section and fetches no connected-actions offer.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: not-connected
    name: Duffel not connected and travel tables declared
    purpose: >-
      A refused Duffel search (HTTP 503) reads as not connected, and the package migration creates every table its routes query.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/travel-not-connected.test.js
    expected:
      - A refused search says the installation has no Duffel rail, never to connect Duffel; the screen the concierge window is told of leads with that notice, and its help line is the no-rail greeting.
      - The audience view says None here and offers no Connect button where no Duffel connector exists.
      - Other apps can plan around the typed trip before a search, labelled not searched; at phone width the page flows.
      - Every travel_* table the routes query is created by a declared migration.
      - The persona says hotels and cars need the Duffel rail too and calls only search-marked results demo (sweep 14).
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: chat-rail
    name: Travel concierge with no Duffel rail
    purpose: >-
      Where the runtime reports Duffel not connected, the compiled chat route runs no search and opens no fare watch, and its prompt
      says fares cannot be searched or watched here, never to connect Duffel, and reads VPS as an airport; with a rail it searches.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/travel-chat-rail.test.js
    expected:
      - No search reaches the refusing Duffel operation and no travel_watches row is written.
      - With a rail the flight search runs and its offer is shown.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 15000
    installation: never
  - id: form-state
    name: Travel form state and hand-off text
    purpose: >-
      Execute the shipped FORMS, switchTab(), typedTrip(), tripOfferContext() and applyHandoffTrip() against a DOM double
      whose form rebuild resets every field to the markup's own value, as a browser does.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/travel-form-state.test.js
    expected:
      - The place fields are empty with an example placeholder; an untouched form is no trip and nothing is handed off.
      - A typed VPS -> DCA trip and a typed hotel city survive a Hotels -> Cars -> Flights round trip.
      - With no Duffel rail every tab keeps the unavailable notice instead of "Search to see options.".
      - Hand-off notes read "From VPS to DCA, depart ..., economy cabin." and never JSON; a tab switch drops the other tab's search.
      - A Rides hand-off to an airport fills the flight From; another destination fills the hotel and car city; the brief goes into the concierge window's message box.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: search-handoff
    name: Search handoff with no Duffel rail
    purpose: With no Duffel rail, /flights, /hotels and /cars answer the Google Flights, Booking.com and Kayak links for the
      exact trip with no fares; with a rail the provider answers.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
      - tests/travel-search-handoff.test.js
    expected:
    - Exact links, no items, no provider call; the provider answers when a rail exists.
    prerequisites:
    - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 15000
    installation: never
  - id: duffel-egress
    name: Duffel flight search through the native kernel's egress
    purpose: On the native kernel /flights searches Duffel through the fenced egress with the kernel-held key, labels a
      test key's offers as Duffel test fares and keeps them out of the price history, and answers the booking-site link
      when no key is configured or Duffel rejects the trip.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
      - tests/travel-duffel-egress.test.js
    expected:
    - Requests to api.duffel.com carry Duffel-Version v2 and no package credential; offers come back cheapest first.
    - A test key answers source duffel-test with the test-fare note and records nothing; a live key records its fares.
    - No key or a rejected trip answers the Google Flights link with the reason; hotels and cars stay links.
    - The concierge prompt tells it to call test fares Duffel test fares.
    prerequisites:
    - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 15000
    installation: never
  - id: ux-watch-and-tabs
    name: Travel Watch shows that it is watching, with a Watched routes list
    purpose: >-
      UX audit 2026-11-06: run the shipped watchThis(), renderWatches() and stopWatching(); check the tablist, cabin words, the dateless greeting and hideAssistant.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/travel-watch-and-tabs.test.js
    expected:
      - A stored watch turns the button to Watching with aria-pressed true and lists it with Stop watching.
      - A refused watch leaves Watch and says the watch was not saved, in the status line under the results.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: phone-first-screen
    name: Travel keeps the flight search compact on a phone and its options near the top after a search
    purpose: "Guard 1.3.4 (lane mobilesweep2): the real page in a stand-in for Today with test-fare answers, a search for three synthetic options, at 412x915, 390x844 and 360x780 with touch and at 1440x900."
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/travel-phone-first-screen.test.js
    expected:
      - On a phone the flight search is four rows starting within the top 30% (From and To with a whole 44 px Swap beside them, Depart and Return, Cabin and Search flights), the tagline is not drawn and the empty results line shows on the first screen (it was at 68%).
      - After a search that found options the form folds into one line naming the trip with Edit search, and the first option starts within the top 30%; Edit search opens the form with the typed trip.
      - The desktop keeps the form open and the tagline; nothing scrolls sideways; the Travel concierge button covers nothing at the end; searching writes nothing.
    prerequisites:
      - runner:node-test
      - runtime:store-pinned-toolchain
      - runtime:chromium
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 120000
    installation: never
  - id: one-chat-window
    name: The Travel Concierge is the kernel's one chat window
    purpose: >-
      In Chromium at 1440x900 and 412x915 the shipped Travel page over the compiled router (an in-memory pool, Duffel test fares
      and a typical price read), beside the kernel's one chat window served from a kernel platform export with its stand-in kernel.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/travel-one-chat-window.test.js
    expected:
      - After a VPS to DCA search the concierge column (on a phone the sheet behind its button) holds the window (concierge=travel, bot=travel-concierge) with its model menu, Files, Tap to talk, Keep trying and conversations.
      - A turn reaches travel-concierge with context.app travel, the picked model and the screen (the trip in the form, the trip searched, the price read, the test-fare notice, the options with their ids and prices); no POST /api/travel/chat and no message box on the page.
      - A watch the concierge opens during a turn shows under Watched routes once the answer is done, without a reload.
      - The window and its message box sit inside the column or sheet and on the screen; nothing scrolls sideways; on a phone the sheet's Done closes it.
    prerequisites:
      - runner:node-test
      - dependency:playwright
      - browser:chromium
      - harness:kernel-platform-export
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/travel-routes-harness.js
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
  - id: concierge-tools
    name: The Travel Concierge's tools are routes this router answers
    purpose: >-
      Read the manifest and persona and drive the compiled routes: what the page's chat route did for the page is the concierge's tools.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/travel-tools.test.js
        - tests/travel-routes-harness.js
    expected:
      - Every tool the manifest declares names a method and path the compiled router answers, and the persona names each one.
      - GET /notes returns the traveller's remembered notes and the profile's preferences, and no other traveller's.
      - POST /notes keeps a preference the traveller states in their own words, once; one they did not state is not kept; a call without a note or words is refused.
      - create-fare-watch keeps the return date, cabin and the fare the traveller saw, and list-fare-watches returns the watch.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/travel-routes-harness.js
    limits:
      timeoutMs: 15000
    installation: never
