version: 1
cases:
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its family (Home shell) and company (Business shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the family view reads only /api/travel/config and /watches; never a flight, hotel or car search and never the concierge.
      - Trip dates go to AppView.day as the stored calendar day, checks and saves to AppView.when; a trip today is coming up and one gone by reads Date passed.
      - Tripped watches read as Price dropped or Reached target; demo, test-token, live and unknown prices are each named, with the connect action only in demo.
      - An empty radar, a refusal and a failed read each read as what they are.
      - Under an audience view the module script adds no handoff listener, appends no section and fetches no connected-actions offer.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: not-connected
    name: Duffel not connected and travel tables declared
    purpose: >-
      A refused Duffel search (HTTP 503) reads as not connected, and the package migration creates every table its routes query.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/travel-not-connected.test.js
    expected:
      - A refused search and concierge turn say the installation has no Duffel rail, never to connect Duffel.
      - The audience view says None here and offers no Connect button where no Duffel connector exists.
      - Other apps can plan around the typed trip before a search, labelled not searched; at phone width the page flows.
      - Every travel_* table the routes query is created by a declared migration.
      - The persona says hotels and cars need the Duffel rail too and calls only search-marked results demo (sweep 14).
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: chat-rail
    name: Travel concierge with no Duffel rail
    purpose: >-
      Where the runtime reports Duffel not connected, the compiled chat route runs no search and opens no fare watch, and its prompt
      says fares cannot be searched or watched here, never to connect Duffel, and reads VPS as an airport; with a rail it searches.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/travel-chat-rail.test.js
    expected:
      - No search reaches the refusing Duffel operation and no travel_watches row is written.
      - With a rail the flight search runs and its offer is shown.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 15000
    installation: never
  - id: form-state
    name: Travel form state and hand-off text
    purpose: >-
      Execute the shipped FORMS, switchTab(), typedTrip(), tripOfferContext() and applyHandoffTrip() against a DOM double
      whose form rebuild resets every field to the markup's own value, as a browser does.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/travel-form-state.test.js
    expected:
      - The place fields are empty with an example placeholder; an untouched form is no trip and nothing is handed off.
      - A typed VPS -> DCA trip and a typed hotel city survive a Hotels -> Cars -> Flights round trip.
      - With no Duffel rail every tab keeps the unavailable notice instead of "Search to see options.".
      - Hand-off notes read "From VPS to DCA, depart ..., economy cabin." and never JSON; a tab switch drops the other tab's search.
      - A Rides hand-off to an airport fills the flight From; another destination fills the hotel and car city.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: search-handoff
    name: Search handoff with no Duffel rail
    purpose: With no Duffel rail, /flights, /hotels and /cars answer the Google Flights, Booking.com and Kayak links for the
      exact trip with no fares; with a rail the provider answers.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
      - tests/travel-search-handoff.test.js
    expected:
    - Exact links, no items, no provider call; the provider answers when a rail exists.
    prerequisites:
    - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 15000
    installation: never
