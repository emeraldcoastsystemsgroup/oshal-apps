#
# ─────────────────────────────────────────────────────────────────────────────
# OSHAL App Package — Dungeon Master (AI D&D at the table)
# Format: ADR-085 (remote app packages). Every path below is RELATIVE TO THIS
# PACKAGE. Installing this package clones it into the swarm's deployed-apps/ and
# hot-loads it — nothing is compiled into the core image.
#
# What this is: a tablet-first, lay-it-flat-on-the-table Dungeons & Dragons
# surface with an AI Dungeon Master. The DM narrates, free-talks, and adjudicates;
# the surface is a grid battle map with a full turn loop (highlight the active
# character → tap → movement radius lights up → move → pick a weapon/spell from
# their sheet → resolve → the DM narrates the outcome and archives the story).
#
# RULES CONTENT IS OPEN: everything the DM reasons over — monsters, spells,
# weapons, actions — comes from the D&D System Reference Document (SRD 5.1),
# released by Wizards of the Coast under CC-BY-4.0. This package ships no
# proprietary Wizards content. See data/LICENSE-SRD.md.
# ─────────────────────────────────────────────────────────────────────────────

name: dnd
suite: ai-creative   # ADR-097: primary catalog shelf (games/entertainment live under creative)
displayName: Dungeon Master
description: >-
  Play Dungeons & Dragons at the table with an AI Dungeon Master. Lay the tablet
  flat, share a join code, and let each signed-in player claim a hero. The DM
  narrates the story and runs the battle map while a persistent turn row names
  who acts next, blue tiles show legal movement, and character sheets expose
  inventory, abilities, and spells. You control only your claimed hero; clearly
  labeled AI companions run empty seats. Choose a bundled SRD hero or import
  your own PDF/JSON character sheet. Rules run on the open CC-BY D&D SRD 5.1.
version: 0.19.1
status: active
theme: black

# The app TILE is public so every signed-in player sees it in the ribbon (a
# person-scoped app auto-loaded at boot has no owner stamped, so RLS hides it
# from every session — the little-monsters lesson). Per-PLAYER data isolation is
# NOT this flag: it is enforced in the app's own dnd_* tables, which carry
# user_sub and are filtered on it in every query.
scope: public

# Where this package came from — the installer pins ref+sha at install time.
source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: dnd
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/dnd/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# ── ADR-090 D8: kernel SKILLS this app calls ────────────────────────────────
# The DM bot uses the shared LLM/harness access (tool-registry) for reasoning and
# the pluggable voice layer to read the story aloud at the table.
uses:
  - tool-registry
  - voice
  - media-generation   # AI cutaway illustrations at story milestones (fail-soft when unconfigured)

# ── ADR-085: dependencies ───────────────────────────────────────────────────
# Self-contained: the open SRD rules pack and the starter adventure are bundled.
dependencies:
  apps: []
  tools: []
  connectors: []

# ─────────────────────────────────────────────────────────────────────────────
# BOTS — one accountable Dungeon Master. agentId is this app's OWN (dd0000…) and
# must not collide with another installed app (ADR-085 exclusive-ownership rule).
# ─────────────────────────────────────────────────────────────────────────────
bots:
  - agentId: dd000000-0000-0000-0000-000000000001
    name: dungeon-master
    harnessType: codex-cli
    apiType: openai-codex
    persona: personas/dungeon-master.yaml
    role: games/dungeon-master
    capabilities: [narration, encounter-adjudication, npc-roleplay, rules-lookup, story-archival, text-to-speech]

# Shared persona layered underneath the DM.
foundation:
  persona: personas/dnd-foundation.yaml

# ─────────────────────────────────────────────────────────────────────────────
# UI SURFACES — the tabletop is the app. It is a VIEW over the DM's per-user
# encounter store (ADR-036): the surface renders board state and posts player
# actions; all reasoning/narration runs on the DM bot.
# ─────────────────────────────────────────────────────────────────────────────
ui:
  static:
    - { toolName: dnd-table,  label: The Table, icon: codicon codicon-game,      iframeUrl: /api/dnd/table,          section: top }
    - { toolName: dnd-party,  label: Party,     icon: codicon codicon-organization, iframeUrl: /api/dnd/table?panel=party, section: top }
    - { toolName: dnd-tv,     label: TV Mode,   icon: codicon codicon-device-desktop, iframeUrl: /api/dnd/table?mode=tv, section: top }
    - { toolName: dnd-help,   label: How to Play, icon: codicon codicon-book,     iframeUrl: /api/dnd/table?panel=help, section: bottom }

# ─────────────────────────────────────────────────────────────────────────────
# ROUTES — compiled JS bundled in this package, mounted in-process at activation
# (ADR-085 P1, flag APP_PACKAGE_DYNAMIC_ROUTES). This module is self-contained
# except for the framework AppContext it receives (pool, botNodeClient).
# ─────────────────────────────────────────────────────────────────────────────
routes:
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/dnd/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - { module: routes/dnd-routes.js, factory: createDndRoutes, mountPath: /api/dnd, requiresAuth: true, requiresContext: true }

# ─────────────────────────────────────────────────────────────────────────────
# MIGRATIONS — this app's OWN schema, applied idempotently on install and scoped
# per user (every row carries user_sub; every query filters on it).
# ─────────────────────────────────────────────────────────────────────────────
migrations:
  - migrations/001-dnd.sql
  - migrations/002-multiplayer.sql
  - migrations/003-snapshots.sql
  - migrations/004-character-library.sql
  - migrations/005-roll-events.sql
  - migrations/006-owner-rls.sql

# Read-the-story-aloud requires the configured natural server provider; the game
# reports narration unavailable instead of falling back to a robotic browser voice.
voice:
  tts: { provider: google-cloud-tts }

# Shared CSS loaded into the app's surfaces (the surface also styles itself).
sharedCss: ui/dnd.css

# Ribbon shape when /cockpit?app=dnd is focused — clear the office chrome, this is
# a game table.
ribbon:
  hideFrameworkItems: [tickets, chat, calendar, addressbook, dashboard, echo, logs, operations]
  hideChatPanel: true
  hideAssistant: true
  defaultView: dnd-table
