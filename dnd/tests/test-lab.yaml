  - id: spellcasting
    name: Deeper spellcasting rules and server guard
    purpose: "Verify sphere AoE templates (Fireball, Shatter), concentration tracking and Constitution saves, canonical SRD 5.1 conditions with advantage/disadvantage and speed rules, per-round reactions (Shield, Opportunity Attack, Counterspell), and multiplayer-guard persistence."
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/dnd-spellcasting.test.js
    expected:
      - "Sphere AoE templates compute exact 5ft-grid cells and targets, roll shared damage once, apply save-for-half, respect friendlyFire and team targeting, and spend the spell slot."
      - "Concentration drops any prior spell and strips its linked conditions, checks Con saves DC = max(10, floor(damage / 2)) with Bless support on damage, and breaks automatically at 0 HP."
      - "Conditions enforce Bless +1d4, blinded/poisoned/frightened/restrained/prone/invisible advantage and disadvantage with cancellation, speed limits, and turn-start expiry."
      - "Reactions enforce Shield (+5 AC turning hits to misses), Opportunity Attack (skipped on Disengage or spent reaction), and Counterspell (auto <=3rd level, ability check above), while multiplayer-guard preserves and validates all fields."
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
