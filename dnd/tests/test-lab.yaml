# -----------------------------------------------------------------------------
# 1   | maintainer@emeraldcoastsystemsgroup.com     | 0.21.4: register the audience view contract of the review page (ADR-164 D6) with its runner and isolation boundaries: the family view for the Home shell reads only GET /campaigns, /characters and /home-summary on open, never paints a join code, names a heroes or story read that failed on its own, a refusal and a failure for what they are, and leaves the full page's own start (connected actions, refresh) ungated only when no audience view renders.
# 2   | maintainer@emeraldcoastsystemsgroup.com     | 0.21.5: the case also covers the table (ui/table.html, the games group's first surface): its family view reads only GET /campaigns, /characters and /content on open, names each game's adventure and chapter as the route resolves them, and is proved over the package's real router with a recording pool; the tabletop start paths (boot, animation loop, narrator status, glitch banner, audio unlock, immersive wiring) run only when no audience view renders.
# 3 | maintainer@emeraldcoastsystemsgroup.com | 0.21.6: the company audience view registered beside the family one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
