  - id: leveling-arc
    name: Level 3-5 SRD progression and five-chapter Ashen Citadel campaign arc
    purpose: "Verify SRD 5.1 Level 2-5 progression across all eight hero classes, exact server/client applyLevelUp parity, Level 5 Fireball/Counterspell/Spirit Guardians/Mass Healing Word/3d6 Sneak Attack/Extra Attack execution, and full five-chapter Ashen Citadel advancement."
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/dnd-leveling-arc.test.js
    expected:
      - "srd-leveling.json covers all eight hero classes across Levels 2-5 with monotonic XP thresholds (300, 900, 2700, 6500) and proficiency scaling (+2 to +3 at Level 5)."
      - "Server applyLevelUp (lib/dnd-timeline-service.js) and client DnDEngine.applyLevelUp (ui/engine.js) produce identical sheets, levelUps records, and notes across both step-by-step and multi-threshold jumps."
      - "Level 5 Wizard Fireball and Counterspell, Cleric Mass Healing Word, Rogue 3d6 Sneak Attack, and Fighter Extra Attack resolve cleanly through DnDEngine."
      - "The Ashen Citadel 5-chapter arc has walkable boards, valid bestiary monsters, bundled map art, and durable POST /advance progression leveling a party cleanly from Level 1 through Level 5."
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: level3-arc-browser
    name: Ashen Citadel adventure shelf card and Level 3-5 character sheets in Chromium
    purpose: "Load the shipped table.html, dnd.css, and tabletop bundle in headless Chromium at 1440x900 and 412x915 to verify The Ashen Citadel campaign card, Level 3/5 XP progress, proficiency bonus, and 1st/2nd/3rd-level spell slots with zero page errors and zero horizontal overflow."
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/browser/dnd-level3-arc-browser.test.cjs
    expected:
      - "Adventure shelf renders The Ashen Citadel card with Level 1-5 Campaign Arc label and 1 investigation · 4 battles summary."
      - "Leveled character sheets render Level 3 XP progress, Level 5 (Max) progress, +3 Prof, 1st/2nd/3rd-level spell slots, and unlocked Level 3-5 spells cleanly."
      - "Both 1440x900 and 412x915 viewports keep zero horizontal overflow, zero writes, and zero page errors."
    prerequisites:
      - runner:node-test
      - dependency:playwright
      - browser:chromium
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 60000
    installation: never
  - id: cutaway-beats
    name: Big combat cutaway beats, local transitions, and enforced per-campaign cutaway cap
    purpose: "Verify combat beat classification (six big beats vs local transitions), per-campaign cutaway cap enforcement after deduplication and before image provider calls, and seat-checked read-only GET /api/dnd/cutaway-budget."
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/dnd-cutaway-beats.test.js
    expected:
      - "All six big combat beats (nat20, nat1, first-blood, hero-down, level-up, boss-reveal) classify as generated with deterministic deduplication keys."
      - "Common beats (hit, miss, spell, heal, advance) classify as local transitions with null keys and empty prompts and never request generated art."
      - "dnd-media-service enforces the per-campaign cutaway cap (default 20, configurable 1..50) after deduplication and before provider calls, refusing new keys fail-soft with capped true and zero provider calls while cached replays still succeed."
      - "GET /api/dnd/cutaway-budget returns exact used, cap, and remaining counters for seated members, refuses outsiders with 403, rejects missing campaignId with 400, and performs zero DB writes."
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: "Temporary cutaway directories under os.tmpdir() are removed after each case."
    limits:
      timeoutMs: 15000
    installation: never
  - id: cutaway-beats-browser
    name: Visible Art X/20 cutaway budget badge and non-blocking local beat banner in Chromium
    purpose: "Load the shipped table.html, dnd.css, cutaway-beats.js, and table-cutaway-beats.js in headless Chromium at 1440x900 and 412x915 to verify the visible Art X/20 budget badge, cap-reached fallback, and non-blocking local transition banner with zero page errors and zero horizontal overflow."
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/browser/dnd-cutaway-beats-browser.test.cjs
    expected:
      - "The initiative bar and More menu display live Art 3/20 and Art 20/20 (cap reached) indicators with accessible labels."
      - "Common combat beats and capped big beats display the non-blocking #localBeatBanner transition without issuing POST /api/dnd/cutaway."
      - "Both 1440x900 and 412x915 viewports keep zero horizontal overflow, zero writes, and zero page errors."
    prerequisites:
      - runner:node-test
      - dependency:playwright
      - browser:chromium
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 60000
    installation: never
  - id: tabletop-runtime
    name: Game-neutral tabletop runtime and ruleset pack contract
    purpose: "Verify versioned GameDefinition validation, zero D&D leakage in lib/tabletop-runtime.js, D&D 5e SRD pack registration and execution, synthetic non-D&D starship-skirmish second pack loops, and authenticated read-only GET /api/dnd/runtime."
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/dnd-tabletop-runtime.test.js
    expected:
      - "Static hygiene guard confirms lib/tabletop-runtime.js contains zero D&D-specific ruleset terms or imports."
      - "validateGameDefinition enforces schemaVersion 1, slug id, semver version, capabilities, rulesAdapter, narratorAdapter, contentPack, and duplicate-registration refusal."
      - "D&D 5e SRD (dnd-5e-srd) and a synthetic non-D&D starship-skirmish ruleset pack both run turns, beats, narration, media, progression, and rewind loops cleanly on the same TabletopRuntime."
      - "GET /api/dnd/runtime returns 200 with schemaVersion 1 and activeGameId dnd-5e-srd, performs zero DB reads or writes, returns 404 on unknown gameId, and refuses unauthenticated callers with 401."
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
