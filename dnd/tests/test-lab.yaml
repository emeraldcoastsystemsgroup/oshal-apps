version: 1
cases:
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify both pages that provide the family (Home shell) audience view through the shared kit, the review page
      and the table (the games group's first surface): kit loaded after the theme bootstrap, boot with this
      application's own name and exactly its audiences, full-page start gated on the kit's decision, head block
      parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the family view reads only GET /campaigns, /characters and /home-summary; it writes nothing, never fetches the connected-actions plan and never names a board, sync, playback, archive, model or media route.
      - The stats, title and lede name the saved games; each game reads as the table's own place in plain words with its players and the caller's role; the story beats come from the route's own offer notes; the join code is never painted and no item links out.
      - A heroes or story read failing on its own is named as not checked while the games still show; a 401, a 403, a 5xx, a non-JSON failure and a failure with its own error each read as what they are.
      - Under an audience view the page's module script mounts no connected actions and reads nothing; without the audience it still runs every start step.
      - The table boots the kit in its head before the tabletop bundle, in the page and in the route's script-inlined document; on open its family view reads only GET /campaigns, /characters and /content.
      - The table view names each game's adventure and chapter as the route resolves them, where it stands, its players and the caller's role, the saved heroes and the adventure shelf; over the package's real router it makes exactly two SELECTs pinned to the caller and never paints the join code.
      - A heroes or shelf read failing on its own is named as not checked; a 401, a 403, a 5xx, a non-JSON failure, a failure with its own error, no session and no database each read as what they are.
      - Under the table's family view no boot read, animation loop, narrator status, glitch banner, audio-unlock listener, legacy voice-key removal or immersive wiring runs; without the view, or without the kit, each one still runs.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: art-manifest
    name: The table asks only for bundled art
    purpose: Drive GET /content and GET /art/* through the package's real router and run the table's own art block from the served runtime script against the served bundle - no browser, database or network.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/dnd-art-manifest.test.js
    expected:
      - GET /content lists in art.tokens and art.maps exactly the bundled files serveArt answers with an image.
      - The table's art loader requests only listed ids, and every request it makes answers 200; a monster without a portrait is never requested and yields no URL.
      - A bundle without the list keeps the earlier behaviour, and no surface script builds a portrait URL outside tokenArtUrl.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: campaign-delete
    name: The host deletes a campaign from My Games
    purpose: Drive the campaign service against plain rows with no foreign-key cascade, as the native kernel stores them - no database, network or provider.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/dnd-campaign-delete.test.js
    expected:
      - A confirmed host delete removes the campaign, its encounter, seats, archive, snapshots and seated characters; saved library characters stay.
      - A player, an unconfirmed request and a missing campaign remove nothing.
      - POST /campaign/delete is routed and My Games shows Delete Campaign to the host only.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: cutaway-fail-soft
    name: Quest-start art never fails the table
    purpose: Drive the media service and the package's real router with an unwritable cutaway workspace, a failing seat lookup and a failing render - no database, network or provider.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/dnd-cutaway-fail-soft.test.js
    expected:
      - An unwritable workspace, a failing seat lookup and a failing render each answer ok false, soft true, in plain words with no raw error text, and nothing is rendered or archived before the failure.
      - Each failure is journaled with its stage, through the context logger or the framework logger when the context has none.
      - POST /cutaway answers 200 fail-soft instead of 500 when the store fails; an unexpected route failure on another route is still 500 and is journaled.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: cutaway-native-root
    name: Cutaways never write into the package folder
    purpose: Drive the media service with CLINE_WORKSPACE_ROOT unset from inside a read-only directory (as the native package's /package is), and with the native runtime's own image provider from the kernel bridge (crates/host-process/bridge/video_generation.js).
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/dnd-cutaway-native-root.test.js
    expected:
      - With no workspace root and a read-only working directory, the cutaway is written under os.tmpdir() (never under the working directory), the mkdir succeeds and nothing is journaled.
      - An operator CLINE_WORKSPACE_ROOT still decides the directory.
      - The native runtime's image provider (configured false) answers ok false, soft true, 'Cutaway art is not available on this swarm.', makes no directory, archives nothing and journals no error.
    prerequisites:
      - runner:node-test
      - fixture:kernel-checkout
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: Temporary directories under os.tmpdir() are removed after each case.
    limits:
      timeoutMs: 15000
    installation: never
  - id: home-summary-dates
    name: Saved times read as local dates
    purpose: Run the home-summary route with a stubbed router and pool - no database or network.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/dnd-home-summary-dates.test.js
    expected:
      - The review evidence and the handed-off brief carry a local date with its zone and never an ISO timestamp.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: dnd-caption-phone
    name: The voiceover caption and the TV lobby on a phone
    purpose: Lay the real table (ui/table.html, ui/dnd.css, its own layout(), caption() and showTvLobby()) out in Chromium at 412 x 915 and in the 392 x 641 cockpit frame with a 260-character narration line, and open the TV lobby for a named campaign.
    level: browser
    runner: { kind: node-test, scope: package, files: [tests/browser/dnd-caption-phone.test.cjs] }
    expected:
      - The caption spans the table (within 24px of its width), stays inside the stage, covers at most a quarter of the board's height and shows every word (no clipped text).
      - The TV lobby names the campaign and its join code, escaped; on a TV the initiative bar names the campaign before the scene.
      - During an AI turn (turn panel, view-only dock) at 412 x 915, 412 x 859 and 392 x 641, at the top of the page and scrolled, the caption ends above the sticky dock and takes taps at its top, middle and bottom.
      - Narration with Markdown marks ("**What do you do?**") shows as its words, with no asterisks (sweep 14).
      - Nothing is written.
    prerequisites: [runner:node-test, dependency:playwright, browser:chromium]
    sideEffects: none
    isolation: { mode: none, cleanup: Each case closes its browser context; pages are synthetic and served inside the browser with no network or server. }
    limits: { timeoutMs: 60000, maxMemoryMb: 1024 }
    installation: never
  - id: dnd-phone-layout
    name: The battle map on a phone
    purpose: Lay the real table (ui/table.html, ui/dnd.css and its own layout()) out in Chromium in the battle layout - turn panel, drawer open and closed - at 412 x 915 and in the 392 x 641 cockpit frame.
    level: browser
    runner: { kind: node-test, scope: package, files: [tests/browser/dnd-phone-layout.test.cjs] }
    expected:
      - The map row under the toolbar is at least 300px and the 18 x 12 board is drawn at the full width inside it.
      - No toolbar button touches the board or another button; the turn panel, board and Dungeon Master drawer follow each other down the page.
      - Nothing is wider than the screen and nothing is written.
      - With the drawer closed and open, the dock's first action and End Turn are inside the visible screen and take the tap; the Ask DM input scrolled into view is not covered by the dock.
      - While a screen card is open the dock rests below the board, not over it.
      - My Games' Delete Campaign and Leave Campaign have an opaque background and read at 4.5:1 or better under the dark and a light cockpit theme.
      - With two and with four actions every action is inside the visible screen and its width and takes the tap (they wrap in rows, no sideways scroll); the whole board and the dock fit one screen together, and with two actions the board is clear of the dock at the top of the page.
      - With the drawer open the Ask DM input starts within 150px of the board's bottom, and focused from the top of the page it is on screen above the dock.
      - With 10 and with 32 actions on a player's own turn, and while watching another player's four-action hero (view-only note above the cards), the dock is at most 220px, the whole board and the dock fit one screen together, End Turn and the first action are on screen (and the first action takes the tap on the player's own turn), and every action scrolled into the dock's list is on screen inside the width and takes the tap, without moving the page.
    prerequisites: [runner:node-test, dependency:playwright, browser:chromium]
    sideEffects: none
    isolation: { mode: none, cleanup: Each case closes its browser context; pages and answers are synthetic and served inside the browser with no network or server. }
    limits: { timeoutMs: 60000, maxMemoryMb: 1024 }
    installation: never
  - id: dm-directive-lines
    name: Directive lines never show as story text
    purpose: >-
      Drive the Dungeon Master service with a scripted storyteller in combat, recap and opening modes, and
      read the served persona: a CHOICES or ROLL line is stripped from the archived and returned prose and
      acts on nothing, and the persona keeps those lines to the table's own story requests (sweep 8 showed
      'CHOICES: ...' in the combat log and in a concierge answer).
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/dnd-dm-fast-path.test.js
        - tests/dnd-persona-directives.test.js
    expected:
      - >-
        In combat, recap and opening modes the narration and the archive carry no CHOICES or ROLL line,
        choices/roll/grant stay empty and the board is unchanged.
      - >-
        The persona scopes CHOICES, ROLL and GRANT to the D&D table and forbids them in combat highlights and
        concierge answers.
      - >-
        No line of the served persona begins with CHOICES:, ROLL: or GRANT: (sweep 11: the concierge copied the
        persona's own template line); the table's TABLE CONVERSATION request still carries all three formats.
      - >-
        The persona says a new campaign needs no saved character, and screen answers read each combatant's marked
        side, give a final reading without working and name only controls the screen shows.
      - >-
        Screen answers take whose turn it is from the "<Name>'s turn" line (YOU is the person's own hero, not
        always the one acting), read the latest Result line as what just happened and never think aloud.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: initiative-sides
    name: The initiative bar says which side each combatant is on
    purpose: Draw the real table's initiative bar in Chromium at 412 x 915 and read it with the kernel's real screen snapshot (crates/api/src/shell_screen_state.js).
    level: browser
    runner: { kind: node-test, scope: package, files: [tests/browser/dnd-initiative-sides.test.cjs] }
    expected:
      - The monster chip reads "(enemy)" and the AI companion's reads "(party)" in the snapshot the concierge receives.
      - The mark is visually hidden and nothing is written.
      - With eight combatants the strip scrolls inside itself and the page is exactly the screen wide at 412 and 392 px.
      - Showing an AI turn's result repaints the bar from the board it reports (Enemies 3/4, the defeated goblin reads Defeated).
    prerequisites: [runner:node-test, dependency:playwright, browser:chromium, fixture:kernel-checkout]
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 60000 }
    installation: never
