# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR                                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1   | maintainer@emeraldcoastsystemsgroup.com     | 0.21.4: register the audience view contract of the review page (ADR-164 D6) with its runner and isolation boundaries: the family view for the Home shell reads only GET /campaigns, /characters and /home-summary on open, never paints a join code, names a heroes or story read that failed on its own, a refusal and a failure for what they are, and leaves the full page's own start (connected actions, refresh) ungated only when no audience view renders.
# 2   | maintainer@emeraldcoastsystemsgroup.com     | 0.21.5: the case also covers the table (ui/table.html, the games group's first surface): its family view reads only GET /campaigns, /characters and /content on open, names each game's adventure and chapter as the route resolves them, and is proved over the package's real router with a recording pool; the tabletop start paths (boot, animation loop, narrator status, glitch banner, audio unlock, immersive wiring) run only when no audience view renders.
# 3 | maintainer@emeraldcoastsystemsgroup.com | 0.21.6: the company audience view registered beside the family one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Register art-manifest: GET /content lists the bundled portraits and maps, and the table asks only for those, so no art request answers 404.
# 5 | maintainer@emeraldcoastsystemsgroup.com | Register campaign-delete (the host deletes a campaign and its rows; players, unconfirmed and missing deletes remove nothing) and home-summary-dates (saved times read as local dates).
# 6 | maintainer@emeraldcoastsystemsgroup.com | Register the phone layout of the battle map (tests/browser/dnd-phone-layout.test.cjs): a 300px map row under a toolbar in the page flow, nothing over the board.
# 7 | maintainer@emeraldcoastsystemsgroup.com | Phone layout case: the turn actions and End Turn stay on screen (drawer open and closed), the Ask DM input is not covered, and a screen card keeps the dock below the board.
# 8 | maintainer@emeraldcoastsystemsgroup.com | Phone layout case: two and four actions, every action on screen with no sideways scroll; the board and dock fit one screen (with two actions the board is clear of the dock); Ask DM opens the drawer right under the board and stops above the dock when focused.
# 9 | maintainer@emeraldcoastsystemsgroup.com | Phone layout case: the dock stays bounded with 10 and 32 actions (the import cap) and while watching another player's four-action hero; every action can be scrolled into the dock's list and takes the tap.
# 10 | maintainer@emeraldcoastsystemsgroup.com | K4: cutaway-fail-soft - the quest-start cutaway never 500s; an unwritable workspace, a failed seat lookup and a failed render answer fail-soft in plain words and are journaled, with the framework logger when the context has none.
# 11 | maintainer@emeraldcoastsystemsgroup.com | K4: dnd-caption-phone - the voiceover caption spans the table at phone width without clipping and covers at most a quarter of the board; the TV lobby and bar name the campaign the TV joined.
# 12 | maintainer@emeraldcoastsystemsgroup.com | Native runtime: cutaway-native-root (with no workspace root and a read-only cwd the cutaway is written under the temporary directory; the native runtime's own unconfigured image provider answers not available); dnd-caption-phone adds the AI turn (the caption is above the sticky dock); dnd-phone-layout adds Delete / Leave Campaign contrast on dark and light themes.
# 13 | maintainer@emeraldcoastsystemsgroup.com | Register dm-directive-lines: directive lines are stripped in every DM mode and the persona forbids them in concierge answers (sweep 8).
# 14 | maintainer@emeraldcoastsystemsgroup.com | Register initiative-sides (the snapshot reads enemy/party on each chip) and extend the persona case (no saved character needed; screen answers read sides, no working, only real controls) - sweep 9.
# 15 | maintainer@emeraldcoastsystemsgroup.com | Sweep 10: initiative-sides adds the full eight-chip bar (the page never scrolls sideways at 412 and 392 px) and the Result stage repainting the bar (Enemies 3/4, Defeated); the persona case adds the turn line, the Result line and no thinking aloud.
# 16 | maintainer@emeraldcoastsystemsgroup.com | Sweep 11: dm-directive-lines also expects no directive template line anywhere in the served persona.
# 17 | maintainer@emeraldcoastsystemsgroup.com | dnd-caption-phone also expects the caption to show narration without Markdown marks (sweep 14).
