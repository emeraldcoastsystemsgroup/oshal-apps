      - My Games' heading, rows, Resume, the row's ⋯ menu and Delete Campaign read at 4.5:1 on an opaque card under every theme.
      - Under both light-blue and midnight the same holds at 412 px and at 1440 px, and nothing is written.
    prerequisites:
      - runner:node-test
      - dependency:playwright
      - browser:chromium
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 180000
    installation: never
