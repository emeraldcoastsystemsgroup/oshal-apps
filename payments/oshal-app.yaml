# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — payments ("Payments")
# Carved out of OSHAL core 2026-07-17 (ADR-085 Wave 1 carve #4).
#
# Take payments through a connected merchant account. The user connects their own
# Square and/or PayPal account on /utilities (the 'payments' connector category);
# this app charges ON THEIR BEHALF using their per-user brokered token. Pluggable:
# each provider is a connector + a MerchantPaymentAdapter — adding another rail is
# one connector + one adapter, no app change.
#
# STRIPE (native rail): the person pastes their own Stripe key (a restricted key, test first) on the
# Connections page; the kernel seals it per person and places it itself on every request to the one
# declared host below. The package never holds it. Operations: a hosted Checkout Session for an amount
# + description, its status, recent charges, a FULL refund. Test/LIVE comes from Stripe's own `livemode`;
# every money-shaped action needs confirm:true, and confirmLive:true unless Stripe says the key is test.
#
# Each rail charges the way its API supports: Square = a direct card charge (a
# Web Payments SDK card token; Sandbox test token cnon:card-nonce-ok); PayPal =
# create + send an invoice the customer pays (the hosted invoice URL is returned).
#
# Deterministic I/O — no LLM, no bot. The surface calls /api/payments directly.
# Sandbox by default (SQUARE_ENV / PAYPAL_ENV) so the whole flow is testable.
#
# KERNEL DEPENDENCY NOTE: the MerchantPaymentAdapter registry lives in the CORE
# feature slice @/features/payments (a documented kernel skill — finance imports
# its Stripe half, this app its merchant half). The packaged route imports it
# from core; the Square/PayPal OAuth connectors are core connector-catalog infra.
# ─────────────────────────────────────────────────────────────────────────────

name: payments
suite: ai-productivity   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features: []   # no model in the loop (T0)
displayName: Payments
description: >-
  Take payments through your own Stripe, Square or PayPal account. Stripe: paste your own
  Stripe key on the Connections page, then create a Stripe payment page for an amount and a
  description, see recent payments and refund one; a test key runs in Stripe test mode, a live
  key is shown as LIVE and every money action asks you to confirm. Square runs a card payment,
  PayPal sends the customer an invoice.
version: 1.1.4
testing:
  version: 1
  catalog: tests/test-lab.yaml
status: active

theme: ocean
# Payment execution stays deterministic and confirm-gated; the framework concierge owns the rail.
chatBot: general-bot

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: payments
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/payments/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# Kernel skills + core connector infra only — no app, tool, or connector-install deps.
# (dependencies.connectors is the runtime connector ALLOW-LIST: this app's surfaces
# offer Stripe (a pasted key) and the two merchant rails.)
# Kernel skills this package IMPORTS (ADR-085 §2). Declared because an undeclared import is
# invisible to the prune guard: the first carve that drops the skill would break this app at
# MOUNT time, not at compile time. See docs/apps/kernel-skills.md.
uses:
  - payments         # payments-routes.js calls the kernel payments engine (ADR-093: only the surface carved)
  - app-dependencies # compatibility floor for the tiered dependencies block (ADR-085 addendum)
  - test-catalog

dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: []
    tools: []
    connectors: [stripe, square, paypal]

# OUTBOUND HOSTS (native kernel fenced egress). The sandbox has no network: the kernel admits only
# this host for this package and places the CALLER'S OWN saved Stripe key (connector `stripe`, a
# pasted key sealed per person) in the Authorization header itself. The package never sees the key;
# a caller with no saved key is refused as not connected (there is no installation-wide Stripe key).
egress:
  - host: api.stripe.com
    credential: { connector: stripe, header: authorization, prefix: "Bearer " }

# Guests never reach the charge surface (was hardcoded core Tier-C pre-carve).
# Declaring it here is a REQUEST (ADR-085 D4) — the unapproved default already
# blocks guest writes.
guestTier: blocked

# Compiled-JS route (built from src-routes/ by `oshal-app build`). One OIDC mount;
# every route also self-checks callerSub, and POST /charge additionally requires
# the explicit write confirmation (428 without it).
routes:
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/payments/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/payments/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/payments-routes.js
    factory: createPaymentsRoutes
    mountPath: /api/payments
    auth: oidc
    requiresContext: true

# No ticketType / bots — payments is a deterministic controller-side app (the charge
# runs on the merchant's brokered token), not an LLM workflow.

# No migrations: the owner-scoped audit table (oshal_merchant_payments) is created
# lazily by the route at first use, with tier-1 owner RLS applied at the chokepoint.
# The merchant-payments audit table is declared here AND created lazily by the route: the legacy
# platform applies the lazy DDL, the native kernel provisions the declaration in each person's
# scope before their first read or write and verifies the route's DDL against it.
migrations:
  - migrations/001-merchant-payments.sql

# ─────────────────────────────────────────────────────────────────────────────
# COCKPIT UI SURFACE — one ribbon icon opens the Payments page (served by
# createPaymentsRoutes from this package's tools/).
# ─────────────────────────────────────────────────────────────────────────────
ui:
  static:
    - toolName: payments-home
      label: Payments
      icon: codicon codicon-credit-card
      iframeUrl: /api/payments/
      section: top

ribbon:
  hideFrameworkItems:
    - tickets
    - chat
    - calendar
    - addressbook
    - dashboard
    - logs
    - operations
  defaultView: payments-home

summary:
  path: /api/payments/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items
integrations:
  offers:
    - id: review-finance
      label: Review with Finance
      targetApp: finance
      targetAction: review-context
      contextType: financial-review
      version: 1
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
