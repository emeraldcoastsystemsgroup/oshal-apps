# 1   | maintainer@emeraldcoastsystemsgroup.com     | Register the package's audience view contract test (ADR-164 D6) with its runner and isolation boundaries.
# 2 | maintainer@emeraldcoastsystemsgroup.com | 1.1.4: the family audience view registered beside the company one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
# 3 | maintainer@emeraldcoastsystemsgroup.com | Register the audience rails suite: the view's heading and action agree with the rails /providers lists (no "Take a payment" without a connected rail).
# 4 | maintainer@emeraldcoastsystemsgroup.com | Register continue-panel: the Continue from a payment panel shows only when Recent payments holds a payment (it asked to select a saved payment below with no list on the page).
# 5 | maintainer@emeraldcoastsystemsgroup.com | Register the Stripe rail suites: stripe-rail (routes against a local fake Stripe server: request shapes, mode, confirmations, isolation, no key in answers or logs) and stripe-page (the panel's mode badges and two-step LIVE confirmation).
