    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sheet/linux-sources.test.cjs
    expected:
      - The programs and their order are Lane G's; each program not named as amended equals Lane G's entry; each amended one cites 6602c84d.
      - Every test title a Linux fact cites is in the kernel's Linux suites.
    prerequisites:
      - runner:node-test
      - fixture:pack-inputs
      - fixture:kernel-checkout
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
