    purpose: Prove that Chrome, Firefox, Thunderbird, VS Code, Mousepad, Document Viewer, Files, Thunar, Okular, Image Viewer and Xfce
      Terminal each have measured facts, that Chrome, VS Code, Firefox and Thunderbird say Orbit starts them readable when it opens
      them and how a copy started unreadable is refused, that the committed Linux entries are exactly what
      inputs/linux-pack-inputs.json gives, and that every Linux request leaves room to be asked once more. Stand-in kernel rails as
