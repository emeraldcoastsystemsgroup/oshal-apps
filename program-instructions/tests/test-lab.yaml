    runner:
      kind: node-test
      scope: package
      files:
        - tests/linux-programs.test.cjs
    expected:
      - Each of the eleven programs has facts for linux and linux-atspi.
      - Each of Lane LX1's nineteen everyday programs has facts for linux and linux-atspi, each citing test-linux-everyday-programs.cjs.
      - qBittorrent, Claude and ChatGPT quote the started-without-accessibility refusal and computer.open in their first fact; File Roller says its file list is not published; Document Scanner and Transmission never act without the person asking.
      - The four programs Orbit starts readable require started without accessibility and quote G4's refusal in their first fact.
      - The committed Linux entries equal what inputs/linux-pack-inputs.json gives, and each Linux request and its second ask fit under 8 KiB.
      - A Firefox text holding the measured words is published; one without started without accessibility is reported invalid-output.
    prerequisites:
      - runner:node-test
      - dependency:express
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
    installation: never
  - id: linux-sources
    name: The package's Linux inputs are Lane G's, amended only by Lane G4
    purpose: Hold inputs/linux-pack-inputs.json to Lane G's pack-inputs.json at its handover path (every program not named as amended
