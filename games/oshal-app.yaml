# CHANGE LOG
# -----------------------------------------------------------------------------
# DATE/TIME           | AUTHOR                  | DESCRIPTION
# -----------------------------------------------------------------------------
# 2026-07-24 22:30:00 | @codex-games-toolbar    | Add the Games launcher toolbar for D&D and Game Show.
# 2026-09-23 00:00:00 | maintainer@emeraldcoastsystemsgroup.com | 1.1.1: explicitly bind the launcher right rail to the stable framework general-bot; both game applications remain optional.
# 2026-10-11 00:00:00 | maintainer@emeraldcoastsystemsgroup.com | The launcher's concierge is the optional member dnd's dungeon-master (imported under dependencies.optional.bots), which knows the table's Start New Campaign, Import Character and My Games, instead of the platform general-bot, which told a person this installation cannot run D&D and sent them to Roll20 or Foundry. Guarded by scripts/check-store-bots.mjs (no general-bot concierge).

name: games
suite: ai-creative
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features: []   # no model in the loop (T0)
displayName: Games
description: >-
  One focused cockpit toolbar for OSHAL games. Open the AI Dungeon Master table
  or Game Show directly without hunting through the full application catalog.
version: 1.1.1
status: active
scope: public
theme: aurora
# The concierge is the D&D table's own dungeon-master, imported from the optional member dnd.
chatBot: dungeon-master

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: games
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
routes:
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/games/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

smoke:
  - name: package-readiness
    method: GET
    path: /api/games/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# Neither game is required: the launcher owns no runtime or data, so both are OFFERED at install
# as unchecked choices and never installed unasked.
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps:
      - dnd
      - game-show
    bots: [{ app: dnd, name: dungeon-master }]   # the launcher's concierge (chatBot)
    tools: []
    connectors: []

# Kernel skills this app declares (ADR-090 uses: contract, fail-closed at load).
# `app-dependencies` is the compatibility floor for the tiered dependencies block above: a core
# that predates required/optional refuses this package instead of installing it without its
# required dependencies and without its connector allow-list.
uses:
  - app-dependencies

# The launcher owns no runtime or data. Its surfaces route to the installed games.
ui:
  static:
    - toolName: games-dnd
      label: D&D
      icon: codicon codicon-game
      iframeUrl: /api/dnd/table
      section: top
    - toolName: games-game-show
      label: Game Show
      icon: codicon codicon-device-camera-video
      iframeUrl: /api/game-show/stage
      section: top

ribbon:
  hideFrameworkItems:
    - tickets
    - forge
    - chat
    - calendar
    - addressbook
    - dashboard
    - logs
    - operations
  hideChatPanel: true
  hideAssistant: true
  defaultView: games-dnd
