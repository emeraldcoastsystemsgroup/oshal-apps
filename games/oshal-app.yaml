# 2026-07-24 22:30:00 | @codex-games-toolbar    | Add the Games launcher toolbar for D&D and Game Show.

name: games
suite: ai-creative
displayName: Games
description: >-
  One focused cockpit toolbar for OSHAL games. Open the AI Dungeon Master table
  or Game Show directly without hunting through the full application catalog.
version: 1.1.0
status: active
scope: public
theme: aurora

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: games
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
routes:
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/games/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

smoke:
  - name: package-readiness
    method: GET
    path: /api/games/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# Installing this launcher also resolves both playable packages.
dependencies:
  apps:
    - dnd
    - game-show
  tools: []
  connectors: []

# The launcher owns no runtime or data. Its surfaces route to the installed games.
ui:
  static:
    - toolName: games-dnd
      label: D&D
      icon: codicon codicon-game
      iframeUrl: /api/dnd/table
      section: top
    - toolName: games-game-show
      label: Game Show
      icon: codicon codicon-device-camera-video
      iframeUrl: /api/game-show/stage
      section: top

ribbon:
  hideFrameworkItems:
    - tickets
    - forge
    - chat
    - calendar
    - addressbook
    - dashboard
    - logs
    - operations
  hideChatPanel: true
  hideAssistant: true
  defaultView: games-dnd
