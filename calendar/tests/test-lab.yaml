# CHANGE LOG: 1 | maintainer@emeraldcoastsystemsgroup.com | Register the meeting-brief agent's honesty, consent and delivery-parity evidence as runnable Test Lab cases.
# CHANGE LOG: 2 | maintainer@emeraldcoastsystemsgroup.com | Restate the registered evidence after the privacy fixes: the assembler cites recorded conversation instead of quoting it, the consent question is settled before anything is read, and the per-speaker consent gate decides which voices may be cited at all.
# CHANGE LOG: 3 | maintainer@emeraldcoastsystemsgroup.com | 1.1.3: register the audience view contract of the review page (ADR-164 D6): the company view for the Business shell reads only GET /home-summary and GET /meeting-briefs on open, never POSTs /sync, names not synced, empty, refused and failed states for what they are, and leaves the full page's own start ungated only when no audience view renders.
# CHANGE LOG: 4 | maintainer@emeraldcoastsystemsgroup.com | 1.1.4: the audience-view case also covers the family view for the Jarvis shell: the same two reads (proved over the package's real home-summary and meeting-brief handlers, only SELECTs pinned to the caller), "Coming up" in plain words with all-day and timed starts formatted by their shape, and every named state.
version: 1
cases:
  - id: native-independent-load
    name: Independent reads with optional services unavailable
    purpose: Exercise real Calendar HTTP route factories without legacy connector or briefing modules.
    level: integration
    runner: { kind: node-test, scope: package, files: [tests/native-load.test.cjs] }
    expected:
      - The review page loads without resolving optional connector or briefing services.
      - Unconfirmed sync performs no optional import or storage operation.
      - Confirmed sync and briefing collection report failure when their real services are absent.
    prerequisites: [runner:node-test, fixture:core-checkout]
    sideEffects: none
    isolation: { mode: disposable, cleanup: Loopback HTTP closes and the module resolver is restored. }
    limits: { timeoutMs: 20000 }
    installation: never
  - id: package-readiness
    name: Installed package readiness
    purpose: Read package metadata without syncing a calendar, assembling a brief or contacting a provider.
    level: integration
    runner: { kind: smoke, smoke: package-readiness }
    expected: [The installed package readiness marker satisfies the manifest assertions.]
    prerequisites: []
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 15000 }
    installation: safe-smoke
  - id: meeting-brief-honesty
    name: A brief never invents background
    purpose: Exercise the compiled brief assembler with explicit synthetic material and no database.
    level: unit
    runner: { kind: node-test, scope: package, files: [tests/meeting-brief.test.js] }
    expected:
      - Every claim names the recorded row that produced it.
      - Material that cannot be cited is dropped rather than rendered without a source.
      - A meeting with no recorded material states that plainly instead of producing background.
      - Recorded conversation is cited by its row id and never copied into the brief.
      - The assembler is handed recorded words on purpose and renders none of them.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 20000 }
    installation: never
  - id: meeting-brief-agent
    name: Consent before reading, delivery parity, and the ambient consent gates
    purpose: Drive the compiled collector, surface read and real briefing service over synthetic SQL and loopback HTTP.
    level: integration
    runner: { kind: node-test, scope: package, files: [tests/meeting-briefs.core.test.js] }
    expected:
      - An owner who never enabled this source has nothing of theirs read, delivered or stored.
      - The stored brief carries the exact bytes delivered, and the surface returns those bytes.
      - With ambient capture off the transcript and review tables are never read.
      - A voice that declined, was never asked, is a minor, or is unattributed is never cited.
      - Neither the query, the delivered notification nor the stored row carries the recorded words.
      - The scheduled handler returns only the bounded summary the scheduler accepts.
    prerequisites: [runner:node-test, fixture:core-checkout]
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures: [tests/meeting-briefs.fixture.js]
      cleanup: Synthetic SQL maps are discarded; loopback connections close; the composed briefing runtime is restored. No live database is used.
    limits: { timeoutMs: 30000 }
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shells) and family (Jarvis shell) audience views through the
      shared kit: kit loaded after the theme bootstrap, boot with this application's own name and exactly its
      audiences, full-page start gated on the kit's decision, head block parses and reads only this package's own
      routes; the family view also runs over the package's real home-summary and meeting-brief handlers.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the company view reads only GET /home-summary and GET /meeting-briefs; it never POSTs /sync (the one write on this page, which asks Google) and never fetches connected-actions offers.
      - The stats are the route's own saved-event tiles plus the last sync; the events table names each saved event's day and its clock time or all day from the route's detail string; the briefs list names the meeting, its time and whether it was cited, newest first as the route orders them, capped at ten.
      - Not synced, an empty snapshot, no delivered brief, a 401, a 403, a failed summary read and a failed briefs read each read as what they are, and a failed briefs read never hides the calendar.
      - On open the family view reads only GET /home-summary and GET /meeting-briefs, and over the real handlers those routes run only SELECTs pinned to the caller; it never POSTs /sync.
      - The family view lists "Coming up" in plain words, an all-day start as its calendar day and a timed start as a local date, clock and relative time, says when only the next few of the saved events are shown, and names the briefs plainly, capped at five.
      - In the family view not synced ("Nothing on the calendar yet", with the full page's own Google link in a new tab), an empty snapshot, nothing in five days, no brief, a 401, a 403, a failed summary read and a failed briefs read each read as what they are.
      - Under an audience view the page's module script mounts no connected actions and reads nothing; without the audience it still runs every start step.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
