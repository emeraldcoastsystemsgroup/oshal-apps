# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | 1.1.1: declare cloud-ops-bot as the chatBot, so a request from Jarvis that asks to make, build, order or plan something reaches it. A workflow application with no chatBot keeps every creation request with the assistant (jarvis_creation_kept), which answered without this application's tools.
# 2 | maintainer@emeraldcoastsystemsgroup.com | 1.1.2: cloud-ops-bot declares routing words (cloud, gcp, google cloud, cloud resources, ...): asked from Jarvis, the request went to another application (Video Studio, Scan to Print) or to none. Guarded by the kernel's jarvis_routing_store_tests sweep_requests_reach_the_application_that_does_the_work.
# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.2.0: Cloud opens on its own Cloud Accounts screen (UX audit 2026-11-05, cloud-accounts, D). ribbon.defaultView was `chat`, so opening Cloud showed the global list of every Jarvis conversation, and the accounts tile (in the bottom section, behind the menu on a phone) framed the whole platform Connections page. The tile now opens ui/index.html from this package's own assets: Google Cloud not connected, one primary Connect Google Cloud; connected, the account tiles from /api/cloud/home-summary and one primary Ask the cloud bot. It sits in the top section and is the default view.
# 4 | maintainer@emeraldcoastsystemsgroup.com | 1.2.1: a refused connect is said on the Cloud screen. Where the kernel refuses Google Cloud (the trial has no public web address) the connect window landed on Connections with the reason while this screen kept saying to finish signing in; it now shows the reason the Connections page announces (oshal-connections channel) as an alert.
# 5 | maintainer@emeraldcoastsystemsgroup.com | 1.2.2: UX design-standard sweep (D1=glass, D2=c, cloud--cloud-accounts): declare DS-00 dashboard contract, load surface-glass.css, align card/tile radii and typography to the standard scale, keep controls opaque, and tighten empty-state copy within the phone word budget.
# 6 | maintainer@emeraldcoastsystemsgroup.com | Release 1.3.0 (T73; Roger, 2026-11-12: "tell me what projects are there and which projects have a real billing account"): the cloud-gcp-projects tool and GET /api/cloud/gcp/projects read the person's Google Cloud projects, each project's billing and their billing accounts with their own GCP connection (egress to cloudresourcemanager.googleapis.com and cloudbilling.googleapis.com, which the kernel allows for gcp since 07cb278c). Read-only.
# 7 | maintainer@emeraldcoastsystemsgroup.com | Release 1.3.1 (T73): the Cloud Accounts screen lists the person's projects with each one's billing and offers Reconnect Google Cloud when Google hides billing from the saved connection (made before the billing permission was asked for), so it can be granted from there; a read without a connection, or with one that could not be renewed, is said with the button that fixes it.
# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — cloud (DevOps/Cloud bundle, ADR-038)
# Carved out of OSHAL core 2026-07-19 (ADR-085 Wave 3, "skill with a surface" —
# ADR-093). A THIN carve: this package is the app manifest (ticketType `cloud-op` +
# the Cloud Op workflow + the /utilities accounts tile) + a package COPY of the
# cloud-ops-bot persona for the registrar. There was NO app-owned route or html in
# the kernel — the app's only surface tile points at the core /utilities connectors
# hub, which STAYS framework-resident.
#
# What STAYS framework-resident per ADR-093 (this package ships none of it):
#   - the cloud-ops-bot NODE (own container, registered in BOTH swarm-bot-registry
#     blocks; CODEX so its sandbox can shell out) — the app's reasoning owner; the
#     persona here is a package COPY for the registrar, the container keeps /app/ai-lab;
#   - the GCP tool chain: scripts/oshal-gcp.js + the private scripts/oshal-gcp-diag.js
#     and the gcp toolkit (any-bot/server/services/tools/gcp/) the bot runs in its
#     sandbox — kernel-owned, like every provider CLI (ADR-038);
#   - the `gcp` platform connector + the per-user token broker (OSHAL_CRED_GCP) that
#     hands the bot the signed-in user's web-OAuth token;
#   - the /utilities connectors hub this app's tile opens.
#
# Connect Google Cloud (GCP) at /utilities (web OAuth, cloud-platform scope), then
# chat with the cloud-ops-bot to inspect/operate your GCP — the API-based path that
# works for a REMOTE user (no interactive gcloud login on the host). The bot owns the
# domain (ADR-036): it runs scripts/oshal-gcp.js with the user's connector token and
# reasons over the real Cloud REST API responses.
#
# Adding another cloud provider = a connector + a scripts/oshal-<cloud>.js CLI + a tool
# kit, never a new app (ADR-038). gcloud is just a wrapper over these REST APIs.
# Framework: OSHAL (see docs/adr/085-remote-app-packages-and-registries.md)
# ─────────────────────────────────────────────────────────────────────────────

name: cloud
suite: ai-engineering   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 64, high: 256, basis: declared }
  features:
    - id: cloud-op
      unit: cloud operation ticket
      tier: T4
      generation: none
      degrade: disable
displayName: Cloud
description: >-
  Inspect and operate your Google Cloud by chat. Connect GCP at /utilities; the
  cloud-ops-bot reads your projects/services/instances via your connector token and
  acts on your behalf (read-only by default). The API-based replacement for gcloud.
version: 1.3.1
status: active

# (theme dropped at the carve: core declared `theme: blue`, which is NOT a known
#  cockpit skin — the cockpit already fell back to the default; same render, clean
#  validate.)

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: cloud
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
routes:
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/cloud/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/gcp-projects.js
    factory: createGcpProjectsRoutes
    mountPath: /api/cloud/gcp/projects
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/cloud/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

smoke:
  - name: package-readiness
    method: GET
    path: /api/cloud/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# Runtime connector allow-list — the cloud platform the bot drives via the per-user
# broker (web OAuth at /utilities, cloud-platform scope).
dependencies:
  required:
    apps: []
    tools: []
    connectors: [gcp]
  optional:
    apps: []
    tools: []
    connectors: []

# Kernel skills this app declares (ADR-090 uses: contract, fail-closed at load).
# `app-dependencies` is the compatibility floor for the tiered dependencies block above: a core
# that predates required/optional refuses this package instead of installing it without its
# required dependencies and without its connector allow-list.
uses:
  - app-dependencies

# The bot a Jarvis creation request goes to (its own workflow bot).
chatBot: cloud-ops-bot

ticketType: cloud-op

workflow:
  name: Cloud Op
  workerBot: cloud-ops-bot

# ─────────────────────────────────────────────────────────────────────────────
# BOTS — the cloud-ops-bot (dedicated any-bot node; container + BOTH registry
# entries stay framework-resident). The persona here is a package COPY for the
# registrar; the running node keeps using /app/ai-lab (core).
# ─────────────────────────────────────────────────────────────────────────────
bots:
  - agentId: d0000000-0000-0000-0000-000000000002
    name: cloud-ops-bot
    routingKeywords:
      - cloud
      - gcp
      - google cloud
      - cloud resources
      - cloud project
      - vm instances
      - cloud costs
      - cloud status
    persona: personas/cloud-ops-bot.yaml
    role: devops/cloud
    capabilities:
      - gcp-inventory
      - gcp-projects
      - gcp-compute
      - gcp-enabled-apis
      - gcp-cost-optimization
      - gcp-health-audit
      - gcp-iam-audit

# (toolsDir dropped at the carve: the field is inert — D12 — and the gcp toolkit
#  (any-bot/server/services/tools/gcp/ over scripts/oshal-gcp.js) stays
#  framework-resident with the cloud-ops-bot's chain.)

ui:
  static:
    - toolName: cloud-accounts
      label: Cloud Accounts
      icon: codicon codicon-cloud
      iframeUrl: /apps/cloud/ui/index.html   # this package's own screen: connect Google Cloud, or ask the cloud bot
      section: top

# The screen is a static page from this package's assets; it reads only GET /api/cloud/home-summary and
# hands a question to the concierge through the cockpit. Connecting goes through the kernel's
# /api/connect/gcp/start. No migrations: the bot's store is its own node-side state.

ribbon:
  # Keep Chat (the interface) + Tickets (scheduled cloud ops); hide the rest.
  hideFrameworkItems:
    - calendar
    - addressbook
    - dashboard
    - logs
    - operations
  defaultView: cloud-accounts   # its own screen, never the global chat list

summary:
  path: /api/cloud/home-summary
  metricsPointer: /metrics
  tilesPointer: /tiles
  itemsPointer: /items

# 1.3.0 (T73): Google Cloud projects and billing, read with the person's own GCP connection. The kernel places that
# connection only on the hosts the gcp connector names (connectors/gcp.yaml apiHosts, kernel 07cb278c).
egress:
  - host: cloudresourcemanager.googleapis.com
    credential: { connector: gcp, header: authorization, prefix: "Bearer " }
  - host: cloudbilling.googleapis.com
    credential: { connector: gcp, header: authorization, prefix: "Bearer " }

tools:
  - name: cloud-gcp-projects
    displayName: Google Cloud Projects and Billing
    type: api
    category: cloud
    description: >-
      List the person's Google Cloud projects with each project's billing (enabled or not, the billing account it is
      linked to, and whether that account is open or closed), and every billing account they can see, read with their
      own Google Cloud connection. Read-only.
    executor: { executorType: api, apiEndpoint: "GET /api/cloud/gcp/projects" }
    defaultAuthMode: auto
    requiresApproval: false
    usageInstructions: >-
      Read-only. Answer project and billing questions from what it returns: status "real billing", "linked to a closed
      billing account", "no billing", or "billing not visible" (then say: reconnect Google Cloud on the Cloud Accounts
      screen so this app can read billing). A refusal is said in its own words; never suggest gcloud when this tool can answer.
    routingTags: [cloud, gcp, google-cloud, projects, billing]
    tags: [cloud, route-backed]

