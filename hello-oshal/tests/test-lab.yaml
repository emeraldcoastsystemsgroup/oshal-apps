version: 1
cases:
  - id: package-readiness
    name: Installed package readiness
    purpose: Verify the existing metadata-only package smoke without user data or provider calls.
    level: integration
    runner: { kind: smoke, smoke: package-readiness }
    expected: [The installed hello-oshal readiness marker satisfies the manifest assertions.]
    prerequisites: []
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 15000 }
    installation: safe-smoke
  - id: hello-http
    name: Hello route and surface behavior
    purpose: Exercise the shipped route over an ephemeral loopback HTTP server using Node built-ins.
    level: integration
    runner:
      kind: node-test
      scope: package
      files: [tests/hello.test.js]
    expected:
      - Ping returns the correct package identity and reflects real context availability.
      - The app serves its readiness surface and unknown paths fall through.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: The test closes all fixture HTTP connections and its ephemeral server in finally.
    limits: { timeoutMs: 30000, maxMemoryMb: 256 }
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell) and family (Home shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the company view makes one plain GET of /api/hello-oshal/ping through the package's real route factory and nothing else; it writes nothing.
      - A responding route shows its state, the answer time it reports and whether the factory received the swarm context; unreachable, 401, 403, a failing status, a non-JSON answer and an answer without the hello-oshal identity each read as what they are, never as responding.
      - The list of what the package ships matches its manifest (one surface, the first ui.static entry; two route modules; no migrations, bots or schedules).
      - Under an audience view the page's status script reads nothing; without the audience, with or without the kit, it still reads the route and paints its status.
      - The route serves the source template byte for byte, and the full page's centred layout does not box the kit's root.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
