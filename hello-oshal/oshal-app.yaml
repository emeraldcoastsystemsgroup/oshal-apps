# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | 1.2.5 (concierge audit T15, the store's PENDING list): the example's concierge is jarvis's oshal-assistant, the platform assistant, instead of the platform general-bot, which holds none of an application's data. It still declares no bot and no dependency: borrowed by name exactly as the general-bot reference it replaces: the shell resolves a chatBot the package does not declare the way /api/swarm/bots/{selector}/ask does (kernel ui_applications.rs borrowed_concierge), so no dependency is added. A Jarvis request that names this application now stays with the assistant (kernel jarvis_routing.rs owner_of keeps a request whose application's concierge is the assistant) instead of going to general-bot. No route or permission change.

# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — hello-oshal (the minimal working example)
#
# The smallest real extension: one self-contained route + one ribbon surface.
# Install it to prove the loop end-to-end:
#   node scripts/oshal-app.js install hello-oshal
#   → lands in deployed-apps/hello-oshal/ → the loader mounts /api/hello-oshal
#   → GET /api/hello-oshal/ping responds.
#
# Copy this folder as the starting point for a new extension. See BUILDING-EXTENSIONS.md.
# ─────────────────────────────────────────────────────────────────────────────

name: hello-oshal
suite: ai-engineering   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features: []   # no model in the loop (T0)
displayName: Hello OSHAL
description: The minimal working OSHAL app package — one JSON route, one themed ribbon surface.
version: 1.2.5
status: active
scope: person
chatBot: oshal-assistant

uses: [test-catalog, app-dependencies]
testing:
  version: 1
  catalog: tests/test-lab.yaml

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: hello-oshal
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/hello-oshal/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# No packaged bot, no migrations, no dependencies — the smallest possible package. `chatBot`
# borrows the platform assistant (jarvis's oshal-assistant) by name rather than declaring another agent.
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: []
    tools: []
    connectors: []

# ADR-085 §5: RAG collections this app owns — surfaced in uninstall-impact and
# deleted at uninstall only under the operator's explicit ?dropData=true.
ragCollections:
  - "hello-oshal-*"

# One ribbon tile that opens the route.
ui:
  static:
    - toolName: hello-oshal
      label: Hello OSHAL
      icon: codicon codicon-rocket
      iframeUrl: /api/hello-oshal/app
      section: top

# One route module, compiled JS, mounted in-process at activation.
# NOTE: this example sets requiresAuth: false so it's trivially reachable in a demo.
# Real apps should leave requiresAuth on (the default).
routes:
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/hello-oshal/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/hello.js
    factory: createHelloRoutes
    mountPath: /api/hello-oshal
    requiresAuth: false
    requiresContext: false

theme: light-blue
