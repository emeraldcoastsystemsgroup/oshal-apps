# CHANGE LOG: request-key | maintainer@emeraldcoastsystemsgroup.com | 1.2.3: issue fresh contract request keys and reject edit keys outside the existing backend UUID contract.
# 1.2.2 | maintainer@emeraldcoastsystemsgroup.com | Admit own source editing through named grants; keep generation and optional Vids authority separate.
# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | 1.1.3: declare brand-graphics as the chatBot, so a request from Jarvis that asks to make, build, order or plan something reaches it. A workflow application with no chatBot keeps every creation request with the assistant (jarvis_creation_kept), which answered without this application's tools.
# 2 | maintainer@emeraldcoastsystemsgroup.com | 1.1.5: the review page paints with the portal theme tokens instead of its own fixed dark palette (page, panels, fields, buttons, accent ink), so it follows every portal theme; found when Today's calendar tile stayed dark on a light theme.
# 3 | maintainer@emeraldcoastsystemsgroup.com | Roger, 2026-11-04: the default look is now Light Blue, "the white background blue highlights"; this package declared midnight, so it now declares light-blue. A person's saved theme still wins.
# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — brand-graphics (carved out of core 2026-07-17, ADR-085 Wave 1)
#
# A specialist bot that turns a short brief into an ON-BRAND OSHAL motion graphic
# (the validated electric-"oshal" intro look) by driving Google Vids — REUSING the
# vids app's @oshal/vids-operator package and its signed-in remote Chrome. The look
# + the filter-safe rules live with the vids app (BRAND-THEME.md in the framework's
# packages/oshal-vids-operator/); the builder is that package's src/brand/graphics.js
# (makeIntro / makeBrandGraphic), exposed by the same Vids worker.
#
# STATUS: inactive (parity with how it shipped in core). Activation needs the vids
# app's /api/vids routes live (they are, in today's kernel) and a registered Vids
# worker; toggle active via the swarm-apps API or cockpit when a worker is signed in.
# ─────────────────────────────────────────────────────────────────────────────

# 4 | maintainer@emeraldcoastsystemsgroup.com | 1.2.0: durable original-owned editable source projects, typed operations, saved AI selection and compact shared editor.
name: brand-graphics
suite: ai-creative   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features:
    - id: brand-graphic
      unit: brand motion graphic
      tier: T2
      generation: hosted
      degrade: disable
displayName: Brand Graphics
description: "Edit and save brand briefs with an AI partner, retain generated evidence, and hand the source into document and graphics editing."
version: 1.2.4
authorization:
  version: 1
  catalog: authorization.yaml
testing:
  version: 1
  catalog: tests/test-lab.yaml
status: inactive

theme: light-blue

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: brand-graphics
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
routes:
  - module: routes/source-projects.mjs
    factory: createSourceProjectRoutes
    mountPath: /api/brand-graphics
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false
  - module: routes/review.js
    factory: createReviewRoutes
    mountPath: /api/brand-graphics
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/brand-graphics/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/brand-graphics/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

smoke:
  - name: package-readiness
    method: GET
    path: /api/brand-graphics/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# Rendering uses the separately authorized optional Vids integration; source editing is self-contained.
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: [vids]
    tools: []
    connectors: []

# Kernel skills this app declares (ADR-090 uses: contract, fail-closed at load).
# `app-dependencies` is the compatibility floor for the tiered dependencies block above: a core
# that predates required/optional refuses this package instead of installing it without its
# required dependencies and without its connector allow-list.
uses:
  - app-dependencies
  - application-authorization
  - test-catalog

# The brand specialist bot — upserted + registered in the ACTIVE bot registry by the
# loader from this manifest (ADR-085; zero core-registry edits).
#
# THE agentId IS THIS PACKAGE'S OWN AND MUST STAY UNIQUE. Until 1.1.1 this block declared
# a bot named `brand-graphics` under b00f0000-...-0001, which is the drone package's
# `drone-operator`. The loader upserts a declared bot BY agentId, so activating this package
# would have renamed drone-operator to brand-graphics and taken the drone app's bot with it —
# the same displacement that put portrait-studio on top of drone-operator during the ADR-085
# carve. Never reuse another package's agentId to reach its bot; declare `workflow.workerBot`
# by NAME, which the loader resolves, or `uses:` a kernel skill.
bots:
  - agentId: b0110000-0000-0000-0000-000000000001
    name: brand-graphics
    persona: personas/brand-graphics.yaml
    role: media/brand-graphics
    capabilities:
      - brand-graphics
      - veo-prompt-craft
      - vids-generate
      - vids-operate

# CLI tool (backs the brand_graphic registered tool). Enqueues a brand-graphic job
# to the registered Vids worker via the LOCAL /api/vids API (same container), which
# hands it to the vids-operator's src/brand/graphics.js on the worker's Chrome.
# {packageDir} resolves to this package's install directory at activation — the
# script ships IN the package, nothing in core scripts/.
tools:
  - name: brand-graphics-source-list
    displayName: Source List
    type: api
    category: creative
    description: List this original owner’s saved editable source projects.
    executor:
      executorType: api
      apiEndpoint: GET /api/brand-graphics/source-projects
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    usageInstructions: Read the source-contract and source-read first. Use returned IDs and revision, copy requestKey from the just-read source-contract response for each exact edit intent, and retry an uncertain result with the identical requestKey and body. A conflict changes nothing; reread before proposing changes. The browser saves before assistant handoff and refreshes only when its draft is unchanged.
    routingTags: [creative, editing, storyboard, source]
  - name: brand-graphics-source-contract
    displayName: Source Contract
    type: api
    category: creative
    description: Read the typed source edit contract before changing briefs or storyboard scenes.
    executor:
      executorType: api
      apiEndpoint: GET /api/brand-graphics/source-projects/contract
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    usageInstructions: Read the source-contract and source-read first. Use returned IDs and revision, copy requestKey from the just-read source-contract response for each exact edit intent, and retry an uncertain result with the identical requestKey and body. A conflict changes nothing; reread before proposing changes. The browser saves before assistant handoff and refreshes only when its draft is unchanged.
    routingTags: [creative, editing, storyboard, source]
  - name: brand-graphics-source-read
    displayName: Source Read
    type: api
    category: creative
    description: Read the actual owned source project, stable scene IDs, current revision and immutable history.
    executor:
      executorType: api
      apiEndpoint: GET /api/brand-graphics/source-projects/{input.id}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {id: {type: string, minLength: 36, maxLength: 36}}
      required: [id]
      additionalProperties: false
    usageInstructions: Read the source-contract and source-read first. Use returned IDs and revision, copy requestKey from the just-read source-contract response for each exact edit intent, and retry an uncertain result with the identical requestKey and body. A conflict changes nothing; reread before proposing changes. The browser saves before assistant handoff and refreshes only when its draft is unchanged.
    routingTags: [creative, editing, storyboard, source]
  - name: brand-graphics-source-edits
    displayName: Source Edits
    type: api
    category: creative
    description: >-
      Apply bounded typed source operations to an owned project at the exact revision.
      A scene text change uses {"op":"set-scene","id":"actual scene UUID","values":{"text":"requested text"}} in operations.
      Use op, never type, and substitute the actual source-read ID. Never renders or changes generated evidence.
    executor:
      executorType: api
      apiEndpoint: POST /api/brand-graphics/source-projects/{input.id}/edits
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties: {id: {type: string, minLength: 36, maxLength: 36}, baseRevision: {type: integer, minimum: 1, maximum: 99}, requestKey: {description: "Copy requestKey unchanged from the just-read editing contract response for this new edit; never invent it. Read a fresh contract for each new intent; retry an uncertain result with the identical key and body.", type: string, format: uuid, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$', minLength: 36, maxLength: 36}, operations: {type: array, minItems: 1, maxItems: 16, items: {type: object}}}
      required: [id, baseRevision, requestKey, operations]
      additionalProperties: false
    usageInstructions: Read the source-contract and source-read first. Use returned IDs and revision, copy requestKey from the just-read source-contract response for each exact edit intent, and retry an uncertain result with the identical requestKey and body. A conflict changes nothing; reread before proposing changes. The browser saves before assistant handoff and refreshes only when its draft is unchanged.
    routingTags: [creative, editing, storyboard, source]
  - name: brand_graphic
    displayName: Make an OSHAL brand graphic
    type: cli
    category: media
    description: >-
      Create an on-brand OSHAL motion graphic / intro clip from a short brief
      (e.g. "intro for daily trade recap"). Produces the validated electric-"oshal"
      look in Google Vids — graphic, optional Tyra voiceover, optional serious
      evening-news music — and returns the project URL. Runs on the remote Vids
      worker machine's signed-in Chrome.
    executor:
      executorType: cli
      cliCommand: node {packageDir}/tools/oshal-brand.js intro {input}
    defaultAuthMode: ask
    requiresApproval: true
    timeoutMs: 600000
    inputSchema:
      type: object
      properties:
        brief: { type: string, description: "Short brief, e.g. 'intro for daily trade recap'" }
        subject: { type: string, description: "What the graphic is for (flavors the mood; defaults to the brief)" }
        voiceover: { type: string, description: "Spoken line; if set, the Tyra voiceover is added ('oshal' is spoken 'Oh-shal')" }
        music: { type: boolean, description: "Add the serious evening-news music bed (default true for an intro)" }
      required: [brief]
    usageInstructions: >-
      Call with {brief}. Keep any spoken finance line filter-safe: percentages +
      industry names only — never company names, never the words "dollars"/"trades".
      Never request a talking on-screen anchor (Veo refuses it). Returns {ok,url}.
    routingTags: [brand, graphics, intro, motion-graphic, vids, veo]
    skills: [brand-graphics, veo-prompt-craft, browser-operate]
    tags: [brand-graphics]

# Cockpit ribbon tile + embedded surface. Reuses the Vids Studio job-queue surface
# (the brand jobs run through the same worker), served by the vids app's routes.
ui:
  static:
    - toolName: brand-graphics
      label: Brand Graphics
      icon: codicon codicon-symbol-color
      iframeUrl: /api/brand-graphics/review
      section: top

# Tickets of type 'brand-graphics' route to the brand specialist bot.
# The bot a Jarvis creation request goes to (its own workflow bot).
chatBot: brand-graphics

ticketType: brand-graphics
workflow:
  name: Brand Graphics Pipeline
  pipeline: brand-graphics
  workerBot: brand-graphics
  phases:
    - intake     # scope the brief into an on-brand graphic
    - plan       # shape it onto the brand templates (filter-safe)
    - generate   # drive the remote Chrome to render + place the layers
    - deliver    # report the project URL + what was built

ribbon:
  hideFrameworkItems:
    - addressbook
    - logs
    - operations
  defaultView: brand-graphics

summary:
  path: /api/brand-graphics/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items

integrations:
  offers:
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
    - id: prepare-episode
      label: Prepare a video episode
      targetApp: video
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
  accepts:
    - id: prepare-brief
      contextType: research-brief
      version: 1
      surface: brand-graphics
      fields:
        - title
        - notes
        - sourceUrl

# Source projects require explicit named grants and retain the exact original owner.
migrations:
  - migrations/006-editor-source-projects.sql
  - migrations/native/006-editor-source-projects.sql
nativeMigrations:
  - id: migrations/006-editor-source-projects.sql
    native: skip
    reason: Native final schema retains physical original-person scope; PostgreSQL additionally forces owner RLS.
