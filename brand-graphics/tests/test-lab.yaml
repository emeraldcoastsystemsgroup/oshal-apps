version: 1
cases:
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its family (Home shell) audience view through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: review-links
    name: Review page hands off to other apps through the cockpit
    purpose: >-
      Read the shipped review page: Open Vids Studio goes to /cockpit/?app=vids at the top level (it loaded Vids inside
      the Brand Graphics frame), and no link opens another app's screen inside this frame.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/review-links.test.cjs
    expected:
      - Open Vids Studio has href /cockpit/?app=vids and target _top.
      - No same-origin link points at another package's /api/ screen, and every /cockpit/ link targets _top.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never

  - id: workspace-foundation
    name: Brief controls and catalog-checked source handoffs
    purpose: Exercise the actual shared editor shell and package source controls in real Chromium on isolated fixtures.
    level: browser
    runner: {kind: node-test, scope: package, files: [tests/workflow-foundation.test.mjs]}
    expected:
      - Shared properties edit the actual source controls and preserve the native domain command path.
      - Phone navigation and inspector remain usable without horizontal overflow or provider calls.
      - Resize hands 9:16 to Video Studio with the format first in the brief, Schedule or post hands the brief to Switchboard Compose, and a scene's Edit on canvas hands that scene to AI Office, each through the cockpit's hand-off with no POST.
    prerequisites: [runner:node, browser:chromium, source:core-dependencies, source:kernel-shared-ui]
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: Close the exact owned browser and loopback fixture. Only synthetic data is used.
    limits: {timeoutMs: 120000, maxMemoryMb: 1536}
    installation: never

  - id: durable-source-projects
    name: Durable owned source and assistant handoff
    purpose: Drive real Chromium through the package typed HTTP routes into disposable application-owned FORCE-RLS PostgreSQL.
    level: browser
    runner: {kind: node-test, scope: package, files: [tests/source-projects-browser.test.mjs]}
    expected:
      - Focused edits save and reopen with stable source object IDs and immutable revisions.
      - Assistant edits refresh the same document while concurrent browser drafts remain untouched.
      - The AI panel sends actual saved identity and selection and reports an unavailable provider honestly.
      - Original grants and owner isolation remain enforced; generation is never invoked by saving source.
      - A comment on a scene, its reply and Resolve each save one owner-scoped SQL revision; Undo keeps a posted comment; a reload reopens the resolved thread; the assistant's add-comment operation goes through the edits route; another owner reads nothing.
    prerequisites: [runner:node, browser:chromium, runtime:canonical-store-toolchain, service:docker-local-postgres16, source:kernel-shared-ui]
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures: [tests/fixtures/editor-source-postgres.fixture.mjs]
      cleanup: Close Chromium and pools; verify the fixture container label before removing that exact disposable container.
    limits: {timeoutMs: 120000, maxMemoryMb: 2048}
    installation: never

  - id: bounded-source-contract
    name: Bounded native source operation contract
    purpose: Execute the actual closed operation examples and keep model-facing contract responses within an 8KiB observation budget.
    level: unit
    runner: {kind: node-test, scope: package, files: [tests/source-contract.test.mjs]}
    expected:
      - Contract and native held-tool description examples execute through the actual package validator.
      - Invented operation aliases, type discriminators and unrelated fields remain refused.
      - Comment threads add, reply, resolve, reopen, remove and replace as typed operations; an older model without comments validates; duplicates, blank text, bad times, unknown fields and the limits are refused.
    prerequisites: [runner:node, runtime:canonical-store-toolchain]
    sideEffects: none
    isolation:
      mode: none
    limits: {timeoutMs: 15000, maxMemoryMb: 256}
    installation: never

  - id: source-editor-authority
    name: Owned source editor authority
    purpose: Exercise the actual source access guard with explicit named decision seams and compare privileged operation bindings.
    level: unit
    runner: {kind: node-test, scope: package, files: [tests/authorization-catalog.test.mjs]}
    expected:
      - Source edits require the original active owner and current named permissions.
      - Provider generation, training, printer control and sending are not conferred by the source editor role.
      - Existing privileged roles retain their reviewed operations.
    prerequisites: [runner:node, runtime:canonical-store-toolchain]
    sideEffects: none
    isolation: {mode: none}
    limits: {timeoutMs: 15000, maxMemoryMb: 512}
    installation: never

  - id: design-standard
    name: The design standard on the brief editor
    purpose: >-
      Drive the real page in real Chromium inside a Today-like frame at 1440x900 and 412x743, with the real shared editor
      and loopback stand-ins for the routes: the declared contract, one primary in one app row, the name once, one copy of
      each field, layers the browser's Back closes, in-page asks, and the seven reference functions as working controls.
    level: browser
    runner: {kind: node-test, scope: package, files: [tests/design-standard-browser.test.mjs]}
    expected:
      - The page declares category editor and first action type, and the brief text is inside data-ds-work.
      - Exactly one primary is visible and the app row is one row; the Today bar's name is not repeated.
      - With no render computer online a Render press says why and sends no render request.
      - The More menu, a scene's row menu and a phone pane close on the browser's Back and stay in the app.
      - Replacing an unsaved brief asks in the page; no native alert, confirm or prompt opens.
      - No control is greyed as not available yet; Templates, Comment, Resize for other formats, Schedule or post and Edit on canvas are enabled controls.
      - Templates opens six prefilled briefs; a choice becomes a new unsaved brief with its storyboard and build kind, sends nothing, and Back closes the gallery.
      - Brand kit writes the person's Create kit into the brief once and Undo removes it; without a kit it offers Make a brand kit; refused by Create it is not drawn.
      - Download appears only for a finished build whose file Vids holds and downloads it; where Vids keeps no file the page says why.
      - Posting a comment saves it with the source and the app row counts the open thread.
      - At 412x915 with touch every button keeps its label on one line and hugs it at 44px, 16px, weight 600 and radius 10, the one primary included; Undo, Redo and More have no fill or edge.
      - At 1440x900 the app row is a 36px toolbar at 15px, content buttons are 44px at 15px with Refresh evidence on one line, and a saved source project is a list row.
      - At 1080x800, where the Saved pane is 180px, every page button keeps one line and stays inside its pane.
    prerequisites: [runner:node, browser:chromium, runtime:canonical-store-toolchain, source:kernel-shared-ui]
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: Close the exact owned browser and loopback fixture. Only synthetic data is used.
    limits: {timeoutMs: 120000, maxMemoryMb: 1536}
    installation: never
