  brand-graphics: "approval"
  brand_graphic: "approval"
  brand-graphics-job-status: "auto"
  veo-prompt-craft: "auto"
  vids-generate: "approval"
  vids-operate: "approval"
  read_file: "auto"
  write_file: "auto"
  bash: "off"
  google_search: "off"
  fetch: "off"
  brand-graphics-source-list: "auto"
  brand-graphics-source-contract: "auto"
  brand-graphics-source-read: "auto"
  brand-graphics-source-edits: "approval"

