# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | 1.2.1: register every shipped test and preserve the existing readiness smoke for versioned Test Lab discovery.
# 2 | maintainer@emeraldcoastsystemsgroup.com | 1.2.2: declare the three apps the ribbon FRAMES (optional — an absent target leaves one tab empty, it does not break finance).
# -----------------------------------------------------------------------------
# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — finance ("Finance")
# Carved out of OSHAL core 2026-07-17 (ADR-085 Wave 1 carve #5 — the FINALE).
#
# Read-only money aggregation. The user links banks + brokerages through Plaid
# (one connection → ~12,000 institutions); the app reads balances, investment
# holdings, and transactions and turns them into a plain-English money brief:
# net worth, portfolio (with concentration/drift flags), spending trends,
# watch-outs. Plus the ADR-048 money-movement addendum: idempotency-keyed
# transfers via the provider-agnostic PaymentAdapter (Stripe), explicit-confirm
# gated (428 no-charge), owner-scoped audit table.
#
# v1 scope: READ-ONLY aggregation + gated transfers. NO trade execution
# (broker-dealer territory), NO crypto.
#
# Plaid is intentionally NOT a generic connectors-routes provider: it uses Link
# (a public_token exchange), not a redirect OAuth handshake. Connect happens on
# the Finance surface, not /utilities.
#
# BOT NOTE (ADR-093 interim): finance-analyst (a0…0044) is a REAL bot-node —
# its own compose container (finance-bot, codex, requiresOwnNode), echo-registry
# entry, persona, and the oshal-plaid.js CLI it shells. The manifest bot mapper
# only expresses inline concierges, so the heavy-bot quadruple STAYS in the
# framework repo as the operator-applied fragment (vids-operator precedent).
# This manifest therefore declares NO bots; the workflow's workerBot resolves
# via the framework's static registry.
#
# KERNEL DEPENDENCY: @/features/payments is a PINNED kernel skill (11th, added
# at this carve) — this package imports the Stripe half, the payments package
# the merchant half; both resolve it from the running framework dist.
# ─────────────────────────────────────────────────────────────────────────────

name: finance
suite: ai-finance   # ADR-097: primary catalog shelf (tools keep their own category:)
displayName: Finance
description: >-
  Link your banks and brokerages (via Plaid — OSHAL never sees your bank password)
  and see everything in one place: net worth, accounts, holdings, and spending, with
  a plain-English brief. Read-only — nothing is traded or moved. No crypto.
version: 1.2.2
testing:
  version: 1
  catalog: tests/test-lab.yaml
status: active

# Neutral steel-glass skin (cockpit built-in — see COCKPIT_THEMES in theme-manager.js).
# Operator decision 2026-07-31: finance defaults to graphite ("I like the graphite view
# for finance"). Graphite came from switchboard, which took finance's freed forest — the
# 2026-07-31 bundle-theme canon stays 11 distinct themes, no repeats.
theme: graphite

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: finance
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/finance/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# Plaid links on the app's own surface (not the connector hub) → empty connector
# allow-list is correct; no TOOL deps. The app deps below are the framed tabs, not data reads.
# ── Cross-package prerequisites: what this package actually reaches ─────────
# ALL OPTIONAL — this is a launcher. Three ribbon tabs frame another package's surface:
#   intelligent-trades  oshal-app.yaml:162  iframeUrl: /api/trading/     (NOTE the mount is /api/trading)
#   world               oshal-app.yaml:167  iframeUrl: /api/world/app
#   kalshi              oshal-app.yaml:172  iframeUrl: /api/kalshi/
# A framed target that is not installed leaves that one tab empty; finance's own surface, routes
# and workflows are unaffected. REQUIRED would mean install refuses to orphan them, which is the
# defect gen-catalog-dependencies.mjs had to fix when the launchers advertised route-to targets
# as hard dependencies — so these are declared where games, life, system and create declare theirs.
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: [intelligent-trades, world, kalshi]   # three tabs FRAME these apps' own surfaces; absent, that tab is empty and the rest of finance works
    tools: []
    connectors: []

# Kernel skills this app CALLS (ADR-090 uses: contract, fail-closed at load).
uses:
  - test-catalog
  - payments
  - app-dependencies   # compatibility floor for the tiered dependencies block (ADR-085 addendum)

ticketType: finance-brief

workflow:
  name: Finance Brief
  # No `pipeline:` — single-bot worker dispatch. Interactive work (link → sync → brief)
  # uses the direct BotNodeClient path in the packaged routes; a ticketType=finance-brief
  # ticket routes to the same bot over the mesh. The bot itself is the framework-resident
  # finance-analyst node (see BOT NOTE above).
  workerBot: finance-analyst

# Compiled-JS route (built from src-routes/ by `oshal-app build`). One OIDC mount;
# every route self-checks the caller, POST /pay additionally requires the explicit
# write confirmation (428 no-charge) and is idempotency-keyed.
routes:
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/finance/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/finance/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/finance-routes.js
    factory: createFinanceRoutes
    mountPath: /api/finance
    auth: oidc
    requiresContext: true

# No migrations: all three owner-scoped stores (oshal_finance_items/data/payments)
# are created lazily by the route at first use with tier-1 owner RLS at the chokepoint.
migrations: []

# ─────────────────────────────────────────────────────────────────────────────
# COCKPIT UI SURFACE — one ribbon icon opens the Finance page (served by
# createFinanceRoutes from this package's tools/). The page handles linking,
# sync, the dashboard, and the rendered brief for the signed-in user.
# ─────────────────────────────────────────────────────────────────────────────
ui:
  static:
    - toolName: finance-home
      label: Finance
      icon: codicon codicon-graph-line
      iframeUrl: /api/finance/
      section: top
    # Money bundle (operator decision 2026-07-31): finance.oshal.ai is the front door for
    # everything money — trading, macro/geo context, prediction markets. Distinct toolNames
    # from each sibling app's own tile (ADR-085 D11: tile/tool names are effectively global).
    - toolName: finance-trading
      label: Intelligent Trades
      icon: codicon codicon-pulse
      iframeUrl: /api/trading/
      section: top
    - toolName: finance-world
      label: World Intelligence
      icon: codicon codicon-globe
      iframeUrl: /api/world/app
      section: top
    - toolName: finance-kalshi
      label: Kalshi Edge
      icon: codicon codicon-graph
      iframeUrl: /api/kalshi/
      section: top

ribbon:
  hideFrameworkItems:
    - tickets
    - chat
    - calendar
    - addressbook
    - dashboard
    - echo
    - logs
    - operations
  defaultView: finance-home

summary:
  path: /api/finance/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items
integrations:
  offers:
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
  accepts:
    - id: review-context
      contextType: financial-review
      version: 1
      surface: finance-home
      fields:
        - title
        - notes
        - sourceUrl
