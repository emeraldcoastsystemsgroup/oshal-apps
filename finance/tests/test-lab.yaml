# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | Register all shipped package tests with explicit runner and fixture boundaries; retain readiness smoke identity.
# -----------------------------------------------------------------------------
version: 1
cases:
  - id: package-readiness
    name: Installed package readiness
    purpose: Verify the existing metadata-only readiness probe without provider or user-data access.
    level: integration
    runner:
      kind: smoke
      smoke: package-readiness
    expected:
      - The installed finance package identity satisfies its manifest smoke assertions.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: safe-smoke
  - id: session-crypto
    name: Token encryption contract
    purpose: Exercise the compiled encryption helper with synthetic secrets and inspect finance route wiring.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/session-crypto.test.mjs
    expected:
      - Missing SESSION_SECRET fails closed and randomized authenticated envelopes round-trip.
      - Compiled token writes and reads use the fail-closed helper.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its family (Home shell) and company (Business shell) audience view through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
