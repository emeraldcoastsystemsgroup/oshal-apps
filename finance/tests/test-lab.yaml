version: 1
cases:
  - id: package-readiness
    name: Installed package readiness
    purpose: Verify the existing metadata-only readiness probe without provider or user-data access.
    level: integration
    runner:
      kind: smoke
      smoke: package-readiness
    expected:
      - The installed finance package identity satisfies its manifest smoke assertions.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: safe-smoke
  - id: session-crypto
    name: Token encryption contract
    purpose: Exercise the compiled encryption helper with synthetic secrets and inspect finance route wiring.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/session-crypto.test.mjs
    expected:
      - Missing SESSION_SECRET fails closed and randomized authenticated envelopes round-trip.
      - Compiled token writes and reads use the fail-closed helper.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its family (Home shell) and company (Business shell) audience view through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: finance-facts
    name: Analyst facts and Jarvis routing words
    purpose: >-
      Read the compiled specialist-context reader against an in-memory pool and the shipped manifest and
      persona: the finance-analyst answers a Jarvis question from the caller's saved finance state, and a
      question about the person's own money carries a declared Finance word. No model, Plaid or database
      is reached; the live hand-off is checked separately with POST /api/jarvis/ask.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/finance-facts.test.cjs
    expected:
      - Missing, malformed or explicitly incomplete holdings inventory yields unknown count and value; complete empty or reported zero stays zero, with original-owner read-only queries preserved.
      - The reader returns exactly the declared scalar keys, owner-scoped by the principal sub, for no link, linked but unsynced, a synced snapshot and a mixed-currency snapshot.
      - A failed read returns every fact null with facts.complete false and reports the error, never throwing.
      - The manifest declares uses specialist-context, the finance_facts tool and the finance-analyst bot, and the route factory registers the reader.
      - The persona authorizes finance_facts, answers a conversation from the facts without asking for data, and declares finance, my finances, my money, my accounts, my spending and my budget.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
    installation: never
  - id: plaid-link
    name: Plaid Link, sync and disconnect
    purpose: >-
      Exercise the compiled Plaid module and finance routes against recorded doubles shaped like Plaid's
      documented responses: the Link request, a paged transaction sync, the Plaid-side disconnect and the
      per-person linked-institution list. No credential, network or database is used; the live link-token
      creation against the installation's configured Plaid environment is checked separately with POST /api/finance/link-token.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/plaid-link.test.cjs
    expected:
      - Link asks for transactions with investments optional and sends PLAID_REDIRECT_URI only when it is set.
      - Partial, malformed, repeated or missing transaction evidence retains available rows and coverage notices while withholding full-window spending and income.
      - Complete empty and exact-page controls retain known zero; saved summaries, analysis and specialist facts enforce the same coverage boundary.
      - Sync reads /accounts/get and at most four transaction pages; only consistent complete coverage permits full-window totals. Missing balances or inventory remain unknown, and reported zero stays known.
      - removeItem treats an already-gone item as removed and surfaces any other Plaid refusal.
      - GET /status lists only the caller's linked institutions with their item ids.
      - DELETE /items/:itemId disconnects at Plaid before deleting the row, clears the saved snapshot, keeps the row on a Plaid refusal, removes an unreadable legacy link locally and does not find another person's link.
      - The page offers Add account, Disconnect per institution and resumes an OAuth redirect with the saved link token.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
    installation: never
  - id: hand-on-notice
    name: The hand-on notice clears once the review draft is filled
    purpose: >-
      Run the shipped settleHandOnNotice from the Finance page: the 'Nothing on this screen to hand on yet' notice is
      replaced once the review title and evidence are both filled (it stayed on screen), and no other status changes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/hand-on-notice.test.cjs
    expected:
      - With title and evidence the notice reads 'Ready to hand on. Choose the action again.'; with one missing it stays.
      - A different status, or no status element, is left alone.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: brief-refresh
    name: Re-analyze writes on POST; reads never write
    purpose: >-
      Exercise the compiled finance routes with a pool double that refuses any mutation during a GET using the native
      kernel's own refusal text: GET /brief only reads the saved brief, Sync preserves its original date, and POST /brief/refresh runs the analyst and returns the persisted saved date.
      The analyst double records the prompt so the exact totals it is given can be checked. The live re-drive on the
      installed kernel (Re-analyze at 412x915) is the companion proof for the kernel's read admission.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/brief-refresh.test.cjs
    expected:
      - A concurrent Sync cannot publish analysis for an older aggregate as current; the previous saved analysis date is preserved.
      - GET /brief, with or without ?refresh=1, returns the saved brief or 404 no_saved_brief and never asks the analyst or issues a mutation.
      - POST /brief/refresh runs the analyst once, saves the brief with one UPDATE and the next GET returns it; before any sync it answers 409 no_data.
      - Totals are summed in cents by account group (Plaid Sandbox accounts give cash and deposits 62589 and total assets 86541.74); the saved brief opens with them written in code and the review prompt carries them as VERIFIED TOTALS.
      - A missing payment rail names Connections and Payments and never an environment variable.
      - The page reads with GET /brief?cached=1, requests analysis with POST /brief/refresh, shows no saved brief as a notice and keeps older analysis visibly dated after Sync.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
    installation: never
  - id: analysis-deadline
    name: Request analysis answers before the kernel ends the request
    purpose: >-
      Drive the compiled POST /brief/refresh on a simulated clock against the native kernel's 60-second package call
      (host CALL_DEADLINE). The analyst and the pool are doubled; the budget, the rewrite rule and the words the person
      reads are the code under test. The judge read "HTTP 503" after 60 s on blue, twice, with nothing saved.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/analysis-deadline.test.cjs
    expected:
      - A silent analyst gives 504 analysis_timeout within 45 simulated seconds, in words, with nothing saved and the earlier analysis kept.
      - A first answer that took 35 seconds is saved without a rewrite; a sentence with an unlisted amount is left out with the visible note.
      - A quick answer with an unlisted amount is still asked once to rewrite.
      - A refused analyst gives 502 analyst_unavailable in words without the engine's text, and nothing is saved.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
    installation: never
  - id: analysis-background
    name: Request analysis runs after the press has answered
    purpose: >-
      Drive the compiled POST /brief/refresh, POST /brief/analysis-result, GET /brief/analysis and GET /brief with the
      store and the kernel's background-run port doubled. One turn of a slow model takes longer than the 60 seconds a
      package request may last, so the kernel is asked for the analyst's turn and hands the answer back as the same
      person. The request row, the fence to the snapshot and the words the person reads are the code under test.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/analysis-background.test.cjs
    expected:
      - The press records the request as working with the exact snapshot it read, asks the kernel for one turn of the analyst and answers 202; the analyst is not asked inside the request and the earlier analysis is untouched.
      - The kernel's hand-over saves the analysis over that snapshot with the figures written in code and an unlisted amount left out; the request then reads done.
      - A hand-over without the kernel's header, for another run or for a closed request is refused and saves nothing.
      - A late, refused or empty answer and a changed snapshot save nothing and read as failed in words, without the kernel's own text.
      - A second press while one is working starts nothing; a kernel still holding an earlier turn of the person is said in words.
      - A request the kernel no longer holds, or one past its time, reads as not finished and the person can ask again.
      - Without the kernel's port, without its function, or when it cannot start the turn, the 45 second path answers in the same press as before.
      - The cached saved read answers exactly as before (a plain 404 or the saved analysis) when the request's module or table cannot be read, and with a request working it only reads and initialises nothing.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
    installation: never
  - id: brief-figures
    name: The brief's figures come from the accounts, never the model
    purpose: >-
      Drive the compiled POST /brief/refresh with the real finance-brief module and a recorded analyst answering the
      sweep-11 commentary (a misread loan balance, invented totals and its own working). The kernel and the model are
      doubled; the figure check itself is the code under test.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/brief-figures.test.cjs
    expected:
      - Unknown or different currency units are not combined or relabeled by commentary; known per-account units and signed asset balances remain visible.
      - The saved brief opens with net worth, total assets, total owed and every account's balance written in code from the stored accounts (Plaid Student Loan $65,262.00 owed).
      - A commentary that states an amount not listed ($6,526.20, $99,540.09, ~$105k) or narrates its working is asked once to rewrite, and a clean rewrite is saved after the figures.
      - When it repeats them, each offending sentence is left out with a visible note while correct sentences stay.
      - A sentence left out after an abbreviation ("Inc.") goes whole; its tail is never kept as a fragment (sweep 14).
      - A commentary quoting listed amounts, whole dollars or a listed amount at its scale is saved as written; mixed currencies are never summed; missing account amounts stay unavailable in code-written figures and are not admitted as quotable zero.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
    installation: never
  - id: accounts-phone
    name: Accounts table at phone width in Chromium
    purpose: Render the page's own stylesheet and renderAccounts in headless Chromium at 412 x 915 and at 1280 px - no server, database or provider.
    level: browser
    runner:
      kind: playwright
      scope: package
      files:
        - tests/accounts-phone.core.spec.mjs
    expected:
      - At 412 px the Accounts table fits inside its card and every Balance cell shows whole ($110, $210, $410, $43,200, $1,000).
      - At 412 px the Institution column is hidden and each institution reads under its account name.
      - At 1280 px the Institution column shows as before.
    prerequisites:
      - runner:playwright
      - harness:oshal-core-root
      - browser:chromium
      - core:dependencies
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: Close the owned Chromium process; the page is set from the packaged file with no network.
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
  - id: summary-tool
    name: Spending questions read the saved aggregate
    purpose: finance-summary is an authorized automatic read onto GET /api/finance/summary; the compiled route answers the caller's
      own aggregate, 404 when nothing is synced and 401 without a caller.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
      - tests/finance-summary-tool.test.cjs
    expected:
    - The caller's categorized transactions, never another person's; 404 and 401 as stated.
    prerequisites:
    - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
    installation: never
  - id: demo-data
    name: Demo installations get a labelled sample household
    purpose: POST /api/finance/demo-data answers 404 until the installation sets FINANCE_DEMO_DATA, requires a signed-in
      caller, and writes that caller's sample aggregate - positive net worth, named banks (never a Plaid placeholder),
      a note saying it is sample data, dates relative to now, the saved brief cleared so Re-analyze runs the real analyst.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
      - tests/demo-data.test.cjs
    expected:
    - 404 with nothing written when the setting is off; 401 unauthenticated; the recorded INSERT carries the labelled solvent aggregate.
    prerequisites:
    - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
    installation: never
  - id: overview-layout
    name: Finance overview is read only with the brief under the tiles
    purpose: The shipped finance page (UX audit 2026-11-05, a live trial door) - the brief directly under the four tiles, no money-sending form or typed payment-method id, Accounts as Assets and Liabilities with owed amounts negative, one primary, Linked banks as its own screen, two columns from 1040 px.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
      - tests/overview-layout.test.cjs
    expected:
    - The brief panel follows the tiles and precedes Accounts, Holdings and Spending; Request analysis explicitly posts /brief/refresh.
    - No pm_ text, no transfer form and no POST /pay anywhere; liabilities read negative in their own group; Linked banks holds Add account and the transfer history.
    prerequisites:
    - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: finance-app
    name: Finance opens as its own application
    purpose: The manifest opens Finance on the application page (finance-app first and the default view, Money, Trades, World, Markets and
      the Daily recap after it), the compiled route serves the page at GET /api/finance/app, and the page's own code words a job's
      schedule, a net worth and a job's name the way a person reads them. The page only reads.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
      - tests/finance-app.test.cjs
    expected:
    - finance-app is the first tool and ribbon.defaultView; the route serves tools/finance-app.html.
    - The real crons of the finance jobs read as words; text that is not a schedule reads as "On its own schedule".
    - A stored net worth reads as money with what is owned and owed; the page holds no POST, PUT, PATCH or DELETE.
    prerequisites:
    - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: finance-app-browser
    name: The Finance application in a browser, desktop and phone
    purpose: Open tools/finance-app.html in Chromium with stand-in answers in the shapes the kernel gives (the menu profile, the jobs list,
      the four home summaries, the signed-in person) - no server, bank, exchange or order. Desktop 1280 x 900, phone 390 x 844, and
      inside a cockpit-like page.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
      - tests/browser/finance-app.browser.test.cjs
    expected:
    - The bar reads Home, Bank accounts, Trades, More; authorized optional applications remain in More. Home shows account summaries and finance jobs grouped by application
      with last run, result, next run and run counts, another application's job left out, and what needs attention first.
    - A section opens inside the page, the address keeps it across a reload, and Bank accounts keeps its Overview and Linked banks views.
    - A phone gets a bottom bar with controls at least 44 x 44 and no sideways scroll; inside the cockpit the cockpit's header and menu are hidden for this frame and restored when it is removed.
    - The page makes GET requests only.
    - A summary that does not answer is said in words and the other summaries and the jobs still show.
    - Inside a page with the cockpit's own layout the Concierge's chat panel is hidden only while closed; opened, it sits beside Finance on a computer (at least 300 px, the page keeps the rest) and covers the screen as a sheet on a phone.
    prerequisites:
    - runner:node-test
    - dependency:playwright
    - browser:chromium
    sideEffects: none
    isolation:
      mode: none
      cleanup: Each case closes its browser context; pages and answers are synthetic and served inside the browser with no network or server.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 1024
    installation: never
  - id: bank-snapshot-browser
    name: Dated bank snapshot, explicit Sync and saved analysis
    purpose: Exercise the actual bank page with independent persisted snapshot and analysis dates, synthetic Link callbacks and explicit failures.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
      - tests/browser/finance-bank-snapshot.browser.test.cjs
    prerequisites:
    - runner:node-test
    - dependency:playwright
    - browser:chromium
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: Synthetic browser contexts close after every case; no real person, provider or device is contacted.
    limits:
      timeoutMs: 90000
      maxMemoryMb: 1024
    installation: never
    expected:
      - Withheld totals remain Unknown, reported zero remains zero, and an analysis conflict preserves the previous dated analysis with a visible retry.
      - Opening reads only; source and snapshot dates stay visible and unknown amounts differ from known zero.
      - Sync preserves the older dated analysis; Request analysis returns the actual saved date and reload retains it.
      - Link and OAuth never silently request analysis; failures preserve context and phone controls remain usable.
      - When the kernel ends a slow analysis with only a status code (empty or store_unavailable), the panel says in words that nothing was saved and the earlier analysis is unchanged, never HTTP 503; the wait says up to a minute and a second press cannot start meanwhile.
      - Spending categories read as words (Transfers out, Loan payments, Food and drink); an unknown all-capitals code reads in sentence case and other names stay as they came.
      - When Request analysis is answered at once, the panel says the analyst is working above the earlier analysis, the button and Sync wait, and the page asks every five seconds until the new analysis is saved and shown.
      - An analysis that fails after the press is said in words with the earlier analysis kept; opening the page during a request shows it without pressing anything; a failure newer than the saved analysis is said on opening and an older one is not; a phone's width holds the working notice.
