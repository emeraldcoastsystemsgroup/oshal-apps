<!DOCTYPE html>
<!--
  Finance surface — read-only money aggregation (Plaid). Self-contained iframe page
  (served by createFinanceRoutes at /api/finance/). States: not-connected (link a bank /
  brokerage, or demo-connect in Sandbox) and dashboard (net worth, accounts, holdings,
  spending, + the AI brief). All work is auth-gated server-side; this page calls the JSON API.
  Read-only: nothing is traded or moved. Theme syncs to the cockpit.
  Bank connections: ?view=banks lists each bank with Disconnect (Plaid /item/remove, then
  re-sync) and an Add account button. OAuth banks that return through PLAID_REDIRECT_URI land
  here with ?oauth_state_id=…; the page resumes Link with the token saved before it opened.
  Brief: the page reads the saved brief (GET /brief?cached=1; none saved is a plain notice, not an
  error) and Request analysis asks for a new one with POST /brief/refresh. The server saves it and
  answers with it, or answers at once that the analyst is working and the page asks GET
  /brief/analysis until the new one is saved. Sync and
  a completed bank link do not request analysis. A missing payment
  rail is said in words with where to go (Connections, Payments), never an environment variable.
  First screen: the money view whenever there is money to show (startScreen: linked items OR a saved
  aggregate - a demo installation's sample household, or banks disconnected after a sync); the connect
  card only greets a person with nothing saved (1.3.0).
  The saved snapshot names its source and date. Unknown balances stay unknown. Accounts are grouped into Assets
  and Liabilities (owed amounts shown negative) with the independently dated saved analysis beside them on desktop.
  Holdings, spending and transfer history are secondary details. Linked banks and Add account remain at ?view=banks. The
  money-sending form is withheld: POST /pay takes only a typed payment-method id and no route lists the person's own
  payment methods, so it cannot offer a funding-source select (and no installation has a payment rail today).
-->
<html lang="en" data-theme="midnight" data-ds-category="dashboard" data-ds-first-action="tap">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Finance</title>
<!--
  CHANGE LOG
  -----------------------------------------------------------------------------
  SEQ | AUTHOR                                  | DESCRIPTION
  -----------------------------------------------------------------------------
  1   | maintainer@emeraldcoastsystemsgroup.com | Apply Design Standard v1.2 dashboard contract, solid button states, and tabular figures.
  2   | maintainer@emeraldcoastsystemsgroup.com | Pass individual sortable table elements to KernelTable.enhance instead of container elements (<main> / <div>) and default missing aggregate arrays so the overview never throws on .length.
  3   | maintainer@emeraldcoastsystemsgroup.com | Make the saved bank snapshot readable with source and dates, preserve unknown amounts, separate account sync from explicit analysis, and retain saved context when a refresh fails.
  4 | maintainer@emeraldcoastsystemsgroup.com | Explain partial or unknown transaction windows and withhold full-window spending in bank, household and company views while retaining balances and available activity.
  5 | maintainer@emeraldcoastsystemsgroup.com | 1.6.4: Request analysis says the true wait (up to a minute) and, when the request ends with only a status code (the kernel's 60 s cut read as "HTTP 503" on blue, judge defect 4), says in words that nothing was saved and the earlier analysis is unchanged.
  6 | maintainer@emeraldcoastsystemsgroup.com | 1.6.4: spending categories read as words ("Transfers out", "Loan payments") in the bank page and the household and company views, never the bank's codes (judge defect 11).
  7 | maintainer@emeraldcoastsystemsgroup.com | 1.6.5: Request analysis may be answered at once while the analyst works after the press (Roger, 2026-11-14: "yes background analysis"). The panel then says the analyst is working, above the earlier analysis, which stays until the new one is saved; the page asks every five seconds and shows the new analysis when it is saved, or the reason in words when nothing was. Opening the page while a request is working shows the same, and a request that failed after the saved analysis says so once the page opens. A server that answers with the analysis itself is shown as before.
-->

<script>try{if(window.parent!==window)document.documentElement.classList.add('in-shell');}catch(_){document.documentElement.classList.add('in-shell');}</script>

     Theme files scope to [data-theme="…"] with NO :root fallback, so the default on <html> above
     matters — without it the surface would have no colors at all. -->

<!-- Audience views (ADR-164 D6). The Home shell opens this page with ?audience=family (household money: net
     worth, where it goes, recent activity) and the Business shell with ?audience=company (cash position:
     accounts, holdings, month by month, transfers). Both read the SAME routes as the full page and are painted
     by the shared kit; any other request runs the full Finance page below unchanged. -->
<link rel="stylesheet" href="/shared/ui/css/app-view.css" />
<script src="/shared/ui/js/app-view.js"></script>
<script>
'use strict';
/** Plaid's primary spending categories in a person's words (judge defect 11: "TRANSFER_OUT" was printed as it came). */
const FINANCE_CATEGORY_WORDS = { INCOME: 'Income', TRANSFER_IN: 'Transfers in', TRANSFER_OUT: 'Transfers out', LOAN_PAYMENTS: 'Loan payments',
  BANK_FEES: 'Bank fees', ENTERTAINMENT: 'Entertainment', FOOD_AND_DRINK: 'Food and drink', GENERAL_MERCHANDISE: 'General merchandise',
  HOME_IMPROVEMENT: 'Home improvement', MEDICAL: 'Medical', PERSONAL_CARE: 'Personal care', GENERAL_SERVICES: 'General services',
  GOVERNMENT_AND_NON_PROFIT: 'Government and nonprofit', TRANSPORTATION: 'Transportation', TRAVEL: 'Travel', RENT_AND_UTILITIES: 'Rent and utilities' };
/** A spending category as a person reads it: a known code in words, another all-capitals code in sentence case, anything else as it came. */
function financeCategoryName(code) {
  const text = String(code === null || code === undefined ? '' : code).trim();
  if (Object.prototype.hasOwnProperty.call(FINANCE_CATEGORY_WORDS, text)) return FINANCE_CATEGORY_WORDS[text];
  if (!/^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+$/.test(text)) return text;
  const words = text.toLowerCase().replace(/_/g, ' ');
  return words.charAt(0).toUpperCase() + words.slice(1);
}
/** Saved coverage is positive evidence; missing legacy metadata never means an empty window. */
function financeTransactionCoverage(a) {
  const c = a && a.transactionCoverage;
  const count = n => Number.isSafeInteger(n) && n >= 0;
  const rows = c && Array.isArray(c.institutions) ? c.institutions : [];
  const valid = r => r && typeof r.institution === 'string' && r.institution.trim() && r.institution.length <= 200
    && count(r.returned) && r.returned <= 2000 && count(r.total) && r.total >= r.returned
    && (r.state === 'complete' && r.total === r.returned && r.reason === null && r.pages === Math.max(1, Math.ceil(r.returned / 500))
      || r.state === 'partial' && r.total > r.returned && r.returned === 2000 && r.pages === 4 && r.reason === 'page_limit');
  let state = 'unknown';
  if (c && count(c.returned) && count(c.total) && rows.length > 0 && rows.length <= 100 && rows.every(valid)) {
    const partial = rows.some(r => r.state === 'partial');
    const total = rows.reduce((sum, r) => sum + r.total, 0);
    if (Number.isSafeInteger(total) && total === c.total && rows.reduce((sum, r) => sum + r.returned, 0) === c.returned
      && c.state === (partial ? 'partial' : 'complete') && a.transactionsComplete === !partial) state = c.state;
  }
  const counts = state === 'partial' ? ': ' + c.returned.toLocaleString('en-US') + ' of ' + c.total.toLocaleString('en-US') + ' reported transactions were read' : '';
  return { complete: state === 'complete', notice: state === 'complete' ? '' : 'Transaction coverage is ' + state + counts + '. Full-window spending and income totals are unavailable.' };
}
{
  const A = window.AppView;
  if (A) {
  function call(path, body) {
    var opt = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' } : { credentials: 'same-origin' };
    return fetch('/api/finance' + path, opt).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.message || j.error || ('HTTP ' + r.status)); e.code = j.error; e.status = r.status; throw e; } return j; }); });
  }
  function openFull() { window.location.assign(window.location.pathname); }
  function syncAction(ctx) { return { label: 'Sync accounts', onClick: function () { call('/sync', {}).then(ctx.refresh, function (e) { alert(e.message); }); } }; }
  function monthLabel(m) { var d = new Date(String(m).length === 7 ? m + '-01T00:00:00' : m); return isNaN(d) ? String(m) : d.toLocaleDateString(undefined, { month: 'short', year: '2-digit' }); }
  /** The shared read: status first, then the aggregate; a not-linked or not-synced answer becomes a model instead of an error. */
  function picture(ctx, audience) {
    return call('/status').then(function (st) {
      if (!st.connected && !st.hasData) return { setup: 'link', st: st }; // money to show (a saved aggregate) beats the connect card here too
      return call('/summary').then(function (sum) { return { st: st, sum: sum }; }, function (e) { if (e.code === 'no_data' || e.status === 404) return { setup: 'sync', st: st }; throw e; });
    }).then(function (r) {
      var kicker = audience === 'company' ? 'Finance' : 'Money at home';
      if (r.setup === 'link') return { kicker: kicker, title: 'Connect a bank or brokerage', lede: 'Nothing is linked yet. Finance links your accounts with your consent and reads balances and activity; it never moves money on its own.', actions: [{ label: 'Connect in Finance', primary: true, onClick: openFull }] };
      if (r.setup === 'sync') return { kicker: kicker, title: 'Linked, not synced yet', lede: (r.st.institutions || []).length + ' institution(s) linked. Run a sync to read balances and activity.', actions: [{ label: 'Sync now', primary: true, onClick: syncAction(ctx).onClick }] };
      return r;
    });
  }
  function family(ctx) {
    return picture(ctx, 'family').then(function (r) {
      if (!r.sum) return r;
      var a = r.sum.aggregate, coverage = financeTransactionCoverage(a), cur = a.currency || 'USD', nw = a.netWorth || {}, months = coverage.complete ? a.spendByMonth || [] : [], last = months[months.length - 1] || {}, top = coverage.complete ? a.topSpending || [] : [], max = top.reduce(function (m, t) { return Math.max(m, Number(t.total) || 0); }, 0);
      return {
        kicker: 'Money at home', title: A.money(nw.net, cur), lede: (a.accounts || []).length + ' accounts at ' + (r.st.institutions || []).length + ' institution(s) · synced ' + A.when(r.sum.syncedAt),
        actions: [syncAction(ctx)],
        stats: [
          { id: 'net', label: 'Net worth', value: A.money(nw.net, cur), tone: Number(nw.net) < 0 ? 'bad' : 'ok' },
          { id: 'assets', label: 'What we have', value: A.money(nw.assets, cur) },
          { id: 'debts', label: 'What we owe', value: A.money(nw.liabilities, cur), tone: Number(nw.liabilities) > 0 ? 'warn' : null },
          { id: 'spend', label: last.month ? 'Spent in ' + monthLabel(last.month) : 'Spent this month', value: coverage.complete ? A.money(last.spend, cur) : 'Unknown' }
        ],
        sections: [
          { kind: 'progress', id: 'spending', title: 'Where the money goes', note: coverage.complete ? 'Top categories in the last ' + (a.transactionWindowDays || 30) + ' days.' : coverage.notice, empty: coverage.notice || 'No spending categories in the complete reported window.', items: top.slice(0, 6).map(function (t) { return { label: financeCategoryName(t.category), value: max ? (Number(t.total) || 0) / max : 0, text: A.money(t.total, cur) }; }) },
          { kind: 'list', id: 'accounts', title: 'Accounts', empty: 'No accounts yet.', items: (a.accounts || []).map(function (x) { return { title: x.name + (x.mask ? ' ····' + x.mask : ''), text: [x.institution, x.subtype || x.type].filter(Boolean).join(' · '), meta: A.money(x.balance, cur) }; }) },
          { kind: 'table', id: 'recent', title: 'Recent activity', wide: true, empty: coverage.complete ? 'No transactions in the reported window.' : 'No available transactions were read; coverage is unconfirmed.', columns: ['When', 'Who', 'Category', { label: 'Amount', align: 'right' }], rows: (a.recentTransactions || []).slice(0, 10).map(function (t) { return [A.date(t.date), t.name, financeCategoryName(t.category), { text: A.money(t.amount, cur), tone: Number(t.amount) < 0 ? 'ok' : null }]; }) }
        ]
      };
    });
  }
  function company(ctx) {
    return Promise.all([picture(ctx, 'company'), call('/payments').catch(function () { return { payments: [] }; })]).then(function (res) {
      var r = res[0], payments = res[1].payments || [];
      if (!r.sum) return r;
      var a = r.sum.aggregate, coverage = financeTransactionCoverage(a), cur = a.currency || 'USD', nw = a.netWorth || {}, months = coverage.complete ? (a.spendByMonth || []).slice(-6) : [], last = months[months.length - 1] || {}, holdings = a.holdings || [], hv = holdings.reduce(function (m, h) { return m + (Number(h.value) || 0); }, 0);
      return {
        kicker: 'Finance', title: 'Cash position', lede: (a.accounts || []).length + ' accounts · ' + (r.st.institutions || []).length + ' institution(s) · synced ' + A.when(r.sum.syncedAt) + (a.sourceEnvironment ? ' · ' + a.sourceEnvironment : ''),
        actions: [syncAction(ctx)],
        stats: [
          { id: 'net', label: 'Net', value: A.money(nw.net, cur), tone: Number(nw.net) < 0 ? 'bad' : null },
          { id: 'assets', label: 'Assets', value: A.money(nw.assets, cur) },
          { id: 'liabilities', label: 'Liabilities', value: A.money(nw.liabilities, cur) },
          { id: 'income', label: last.month ? 'Income ' + monthLabel(last.month) : 'Income', value: coverage.complete ? A.money(last.income, cur) : 'Unknown' },
          { id: 'spend', label: last.month ? 'Spend ' + monthLabel(last.month) : 'Spend', value: coverage.complete ? A.money(last.spend, cur) : 'Unknown' },
          { id: 'holdings', label: 'Holdings', value: A.money(hv, cur), hint: holdings.length + ' positions' }
        ],
        sections: [
          { kind: 'table', id: 'accounts', title: 'Accounts', empty: 'No accounts yet.', columns: ['Account', 'Institution', 'Type', { label: 'Balance', align: 'right' }], rows: (a.accounts || []).map(function (x) { return [x.name + (x.mask ? ' ····' + x.mask : ''), x.institution || '', x.subtype || x.type || '', { text: A.money(x.balance, cur) }]; }) },
          { kind: 'table', id: 'months', title: 'Month by month', empty: coverage.notice || 'No monthly history in the complete reported window.', columns: ['Month', { label: 'Income', align: 'right' }, { label: 'Spend', align: 'right' }, { label: 'Net', align: 'right' }], rows: months.map(function (m) { var n = (Number(m.income) || 0) - (Number(m.spend) || 0); return [monthLabel(m.month), { text: A.money(m.income, cur) }, { text: A.money(m.spend, cur) }, { text: A.money(n, cur), tone: n < 0 ? 'bad' : 'ok' }]; }) },
          { kind: 'table', id: 'holdings', title: 'Holdings', empty: 'No holdings.', columns: ['Position', 'Ticker', { label: 'Qty', align: 'right' }, { label: 'Value', align: 'right' }], rows: holdings.slice(0, 10).map(function (h) { return [h.name, h.ticker || '—', { text: A.num(h.quantity) }, { text: A.money(h.value, cur) }]; }) },
          { kind: 'table', id: 'transfers', title: 'Recent transfers', empty: 'No transfers sent.', columns: ['When', 'Payee', { label: 'Amount', align: 'right' }, 'Status'], rows: payments.slice(0, 8).map(function (p) { return [A.date(p.created_at), p.payee || p.description || '', { text: A.money((Number(p.amount_cents) || 0) / 100, p.currency || cur) }, { text: (p.status || '') + (p.test_mode ? ' (test)' : ''), tone: /fail|return|cancel/i.test(p.status || '') ? 'bad' : /paid|complete|succeed/i.test(p.status || '') ? 'ok' : null }]; }) }
        ]
      };
    });
  }
  A.boot({ app: 'finance', escapeLabel: 'Open Finance in the cockpit', audiences: { family: family, company: company } });
  }
}
</script>
<style>

     literal (#0f1713 …), which is why it only ever looked right in a dark theme. Semantic status
     colors come from the theme too; the fallbacks after the comma keep the surface legible if a

  }

<body>
<div class="page">
  <div class="head">
    <span class="badge">💵</span>

    <label for="reviewTitle">Title</label><input id="reviewTitle" maxlength="2000">

</div>

<!-- Plaid Link (loaded lazily only when the user clicks Connect a bank). -->
<script>
const $ = (id) => document.getElementById(id);
const main = $('main');
const money = (n, cur = 'USD') => Number.isFinite(n) ? new Intl.NumberFormat(undefined, { style: 'currency', currency: /^[A-Z]{3}$/.test(cur) ? cur : 'USD', maximumFractionDigits: 0 }).format(n) : 'Unknown';
const fmtDate = (iso) => { const d = iso ? new Date(iso) : null; return d && Number.isFinite(d.getTime()) ? d.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : 'Date unknown'; };
const escapeHtml = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let snapshotAt = null;
let hasSnapshot = false;
let briefBusy = false;
let syncBusy = false;
function sourceLabel(source) { return source === 'sample' ? 'Sample data' : source === 'sandbox' ? 'Test bank data' : source === 'production' ? 'Bank data' : 'Source unknown'; }
function setBusy() { $('briefBtn').disabled = !hasSnapshot || briefBusy || syncBusy; $('syncIcon').disabled = briefBusy || syncBusy; }
function syncMessage(text, failed = false) { const node = $('syncStatus') || linkMsg(); node.className = failed ? 'err' : 'sub'; node.textContent = text; }
/** Where Link reports progress: the connect screen's line, else the linked-institutions panel's. */
const linkMsg = () => $('cmsg') || $('lmsg') || document.createElement('div');
/** The link token is kept briefly so an OAuth bank that returns by redirect resumes the same Link session. */
const LINK_KEY = 'finance.plaidLink';
function saveLinkToken(token) { try { localStorage.setItem(LINK_KEY, JSON.stringify({ token, at: Date.now() })); } catch {} }
function takeLinkToken() {
  try {
    const saved = JSON.parse(localStorage.getItem(LINK_KEY) || 'null');
    localStorage.removeItem(LINK_KEY);
    return saved && Date.now() - saved.at < 30 * 60 * 1000 ? saved.token : null;
  } catch { return null; }
}

/** Tiny Markdown → HTML for the brief. */
function renderMarkdown(md) {
  const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  const lines = String(md || '').split(/\r?\n/);
  let html = '', inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) { closeList(); continue; }
    if (line.startsWith('## ')) { closeList(); html += '<h2>' + inline(line.slice(3)) + '</h2>'; }
    else if (line.startsWith('### ')) { closeList(); html += '<h3>' + inline(line.slice(4)) + '</h3>'; }
    else if (/^[-*]\s+/.test(line)) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + inline(line.replace(/^[-*]\s+/,'')) + '</li>'; }
    else { closeList(); html += '<p>' + inline(line) + '</p>'; }
  }
  closeList();
  return html;
}

async function api(path, opts) {
  const r = await fetch('/api/finance' + path, Object.assign({ credentials: 'include' }, opts || {}));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const err = new Error(j.message || j.error || ('HTTP ' + r.status)); err.code = j.error; err.status = r.status; err.body = j; err.said = typeof j.message === 'string' && j.message.trim() !== ''; throw err; }
  return j;
}

/** Not-connected screen — link a real bank/brokerage, or demo-connect in Sandbox. */
function renderConnect(status) {
  $('actions').style.display = 'none';
  const demo = status.env === 'sandbox';
  main.innerHTML = `
    <div class="panel">
      <h2>Connect a bank or brokerage</h2>
      <div class="sub" style="margin-bottom:16px">Plaid links read-only balances, holdings, and transactions. ${status.configured ? '' : '<span class="err">Bank linking is not set up on this installation yet.</span>'}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="connectBtn" ${status.configured ? '' : 'disabled'}>Connect a bank / brokerage</button>
      ${demo ? '<button class="btn ghost" id="demoBtn" ' + (status.configured ? '' : 'disabled') + '>Demo-connect (Sandbox)</button>' : ''}</div>
      <div id="cmsg" style="margin-top:14px;font-size:14px;"></div>
      <div class="foot">Environment: ${escapeHtml(status.env)}. ${demo && status.configured ? 'This installation uses Plaid Sandbox (test credentials: user_good / pass_good).' : ''}</div>
    </div>`;
  $('connectBtn').onclick = startLink;
  if (demo) $('demoBtn').onclick = demoConnect;
}

/** Open Plaid Link for a real institution. */
async function startLink() {
  const msg = linkMsg();
  msg.className = ''; msg.style.color = 'var(--muted)'; msg.innerHTML = '<span class="dot"></span> Preparing secure link…';
  try {
    const { linkToken } = await api('/link-token', { method: 'POST' });
    saveLinkToken(linkToken);
    await openLink(linkToken, null, msg);
  } catch (e) { msg.className = 'err'; msg.textContent = e.message; }
}

/** Open Link; with receivedRedirectUri it resumes an OAuth bank's redirect back to this page. */
async function openLink(token, receivedRedirectUri, msg) {
  await ensurePlaidScript();
  const handler = window.Plaid.create({
    token, ...(receivedRedirectUri ? { receivedRedirectUri } : {}),
    onSuccess: async (publicToken) => {
      takeLinkToken();
      msg.innerHTML = '<span class="dot"></span> Linking…';
      try { const r = await api('/exchange', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ publicToken }) });
        msg.style.color = 'var(--accent2)'; msg.textContent = 'Linked ' + r.institution + '. Syncing…'; await afterConnect();
      } catch (e) { msg.className = 'err'; msg.textContent = e.message; }
    },
    onExit: (err) => { takeLinkToken(); if (err) { msg.className = 'err'; msg.textContent = err.display_message || err.error_message || 'Link cancelled.'; } else { msg.textContent = ''; } },
  });
  handler.open();
}

/** Back from an OAuth bank (?oauth_state_id=…): resume the saved Link session, then clean the address. */
async function resumeOAuth() {
  if (!new URLSearchParams(location.search).has('oauth_state_id')) return false;
  const token = takeLinkToken();
  const returned = location.href;
  history.replaceState(null, '', location.pathname);
  if (!token) return false;
  saveLinkToken(token);
  main.innerHTML = '<div class="panel"><h2>Finishing your bank link</h2><div id="cmsg" style="font-size:13px"></div></div>';
  try { await openLink(token, returned, $('cmsg')); } catch (e) { $('cmsg').className = 'err'; $('cmsg').textContent = e.message; }
  return true;
}

/** Linked institutions with a Disconnect for each, from /status. */
async function loadLinks() {
  const host = $('linksPanel');
  if (!host) return;
  let st;
  try { st = await api('/status'); } catch (e) { host.innerHTML = '<div class="notice err">' + escapeHtml(e.message) + '</div>'; return; }
  const items = Array.isArray(st.items) ? st.items.filter(Boolean) : [];
  host.innerHTML = `<div class="panel"><div class="snapshot-head"><h2>Bank connections</h2><span class="snapshot-source">${sourceLabel(st.env)}</span></div><p class="sub">${items.length} saved institution link${items.length === 1 ? '' : 's'}. Sync accounts checks for newer data.</p><table><tbody>` +
    items.map((it) => `<tr><td>${escapeHtml(it.institution)}</td><td class="sub">Linked ${escapeHtml(fmtDate(it.linkedAt))}</td><td class="num"><button class="btn ghost" data-item="${escapeHtml(it.itemId)}" data-name="${escapeHtml(it.institution)}">Disconnect</button></td></tr>`).join('') +
    `</tbody></table><div id="lmsg" role="status" style="margin-top:10px;font-size:13px"></div><div class="foot">Add account links another bank or brokerage through Plaid.</div></div>`;
  host.querySelectorAll('button[data-item]').forEach((b) => { b.onclick = () => disconnect(b.dataset.item, b.dataset.name); });
}

/** Disconnect one institution at Plaid, asking in the page first (DS-30: never window.confirm), then re-sync what remains. */
function disconnect(itemId, name) {
  const msg = linkMsg();
  msg.className = ''; msg.style.color = 'var(--text)';
  msg.innerHTML = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span>Disconnect ${escapeHtml(name)}? Plaid stops sharing its data with Finance.</span><button class="btn danger" id="discYes" type="button">Disconnect</button><button class="btn ghost" id="discNo" type="button">Cancel</button></div>`;
  $('discNo').onclick = () => { msg.innerHTML = ''; };
  $('discYes').onclick = async () => {
    msg.style.color = 'var(--muted)'; msg.innerHTML = '<span class="dot"></span> Disconnecting…';
    try {
      const r = await api('/items/' + encodeURIComponent(itemId), { method: 'DELETE' });
      if (r.remaining > 0) await doSync();
      else renderConnect(await api('/status'));
    } catch (e) { msg.className = 'err'; msg.textContent = e.message; }
  };
}

/** Sandbox demo connect — no widget, no real bank. */
async function demoConnect() {
  const msg = $('cmsg');
  msg.className = ''; msg.style.color = 'var(--muted)'; msg.innerHTML = '<span class="dot"></span> Linking a Sandbox test bank…';
  try {
    const r = await api('/link-sandbox', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    msg.style.color = 'var(--accent2)'; msg.textContent = 'Linked ' + r.institution + '. Syncing…';
    await afterConnect();
  } catch (e) { msg.className = 'err'; msg.textContent = e.message; }
}

/** Lazy-load the Plaid Link script once. */
function ensurePlaidScript() {
  return new Promise((resolve, reject) => {
    if (window.Plaid) return resolve();
    const s = document.createElement('script');
    s.src = 'https://cdn.plaid.com/link/v2/stable/link-initialize.js';
    s.onload = () => resolve(); s.onerror = () => reject(new Error('Could not load Plaid Link.'));
    document.head.appendChild(s);
  });
}

/** A completed link and the first sync are separate results; analysis needs its own request. */
async function afterConnect() {
  let failure = null;
  try { await api('/sync', { method: 'POST' }); } catch (e) { failure = e; }
  await renderDashboard();
  syncMessage(failure ? 'Bank linked. Sync failed: ' + failure.message : 'Bank linked and account snapshot refreshed.', Boolean(failure));
}

/** Enhance every sortable table inside a container without passing a non-table node to KernelTable.enhance. */
function enhanceTables(scope) {
  if (!window.KernelTable?.enhance || !scope?.querySelectorAll) return;
  scope.querySelectorAll('table[data-sortable], .table-scroll table, .scroll table').forEach((t) => window.KernelTable.enhance(t));
}

/** Saved bank snapshot. Opening this view never requests a fresh analysis. */
async function renderDashboard() {
  $('actions').style.display = 'flex';
  const retaining = hasSnapshot && Boolean($('syncStatus'));
  if (!retaining) main.innerHTML = '<div class="spin"><span class="dot"></span> Loading your finances…</div>';
  let summary;
  try { summary = await api('/summary'); }
  catch (e) {
    if (retaining) throw e;
    hasSnapshot = false; setBusy();
    if (e.code === 'no_data' || e.status === 404) { main.innerHTML = '<div class="panel"><h2>Linked, but not synced yet</h2><p>Sync accounts to save balances and activity here.</p><div id="syncStatus" role="status"></div></div><div id="linksPanel"></div>'; loadLinks(); return; }
    main.innerHTML = '<div class="notice err">' + escapeHtml(e.message) + '</div>'; return;
  }
  const a = summary.aggregate || {}; const cur = a.currency || 'USD';
  a.netWorth = a.netWorth && typeof a.netWorth === 'object' ? a.netWorth : {};
  a.accounts = Array.isArray(a.accounts) ? a.accounts : [];
  a.holdings = Array.isArray(a.holdings) ? a.holdings : [];
  const coverage = financeTransactionCoverage(a);
  a.topSpending = coverage.complete && Array.isArray(a.topSpending) ? a.topSpending : [];
  a.notes = Array.isArray(a.notes) ? a.notes : [];
  const nwClass = a.netWorth.net < 0 ? 'neg' : ''; snapshotAt = summary.syncedAt; hasSnapshot = true;
  main.innerHTML = `
    <div class="snapshot-head"><span class="snapshot-source">${sourceLabel(a.sourceEnvironment)}</span><span class="snapshot-date">${fmtDate(summary.syncedAt) === 'Date unknown' ? 'Snapshot date unknown' : 'Snapshot saved ' + escapeHtml(fmtDate(summary.syncedAt))}</span></div>
    <p class="snapshot-note">A saved view of balances and activity. Your bank may have newer information.</p>
    ${coverage.notice ? `<div class="notice transaction-coverage" role="status">${escapeHtml(coverage.notice)}</div>` : ''}
    <div class="stats">
      <div class="stat"><div class="n ${Number.isFinite(a.netWorth.net) ? nwClass : 'unknown'}">${money(a.netWorth.net, cur)}</div><div class="l">net worth</div></div>
      <div class="stat"><div class="n${Number.isFinite(a.netWorth.assets) ? '' : ' unknown'}">${money(a.netWorth.assets, cur)}</div><div class="l">assets</div></div>
      <div class="stat"><div class="n${Number.isFinite(a.netWorth.liabilities) ? '' : ' unknown'}">${money(a.netWorth.liabilities, cur)}</div><div class="l">amount owed</div></div>
      <div class="stat"><div class="n">${a.accounts.length}</div><div class="l">saved accounts</div></div>
    </div>
    <div id="syncStatus" role="status" aria-live="polite"></div>
    <div class="snapshot-links"><a href="?view=banks">Manage bank connections</a></div>
    ${a.notes.length ? '<div class="panel sub">' + a.notes.map(escapeHtml).join('<br>') + '</div>' : ''}
    <div class="cols">
      <div>${renderAccounts(a, cur)}</div>
      <div class="panel brief" id="briefPanel"><div class="spin">Reading saved analysis…</div></div>
    </div>
    ${a.holdings.length || a.topSpending.length ? '<details class="bank-details"><summary>Holdings and spending</summary><div class="detail-content">' + (a.holdings.length ? renderHoldings(a, cur) : '') + (a.topSpending.length ? renderSpending(a, cur) : '') + '</div></details>' : ''}`;
  setBusy();
  enhanceTables(main);
  await loadBrief(false);
}

/** Linked banks (?view=banks): each linked institution with Disconnect, Add account, and the transfer history. */
async function renderBanks() {
  $('actions').style.display = 'none';
  const status = await api('/status');
  main.innerHTML = `<div id="linksPanel"><div class="spin"><span class="dot"></span> Loading your linked banks…</div></div>
    <div class="snapshot-links"><a href="/api/finance/">Back to bank accounts</a></div>
    <div><button class="btn primary" id="addAccount" type="button" ${status.configured ? '' : 'disabled'}>Add account</button></div>
    ${status.configured ? '' : '<p class="sub">Bank linking is not set up on this installation yet.</p>'}
    <details class="bank-details"><summary>Transfer history</summary><div class="detail-content" id="payPanel"></div></details>`;
  $('addAccount').onclick = startLink;
  await loadLinks();
  loadPayHistory();
}

/** Transfer history on the Linked banks screen. Sending money is withheld: POST /pay takes only a typed payment-method
 *  id and no route lists the person's own payment methods, so no funding-source select can be offered (UX audit). */
async function loadPayHistory() {
  const host = $('payPanel');
  if (!host) return;
  let hist = { payments: [] };
  try { hist = await api('/payments'); } catch (e) { /* history optional */ }
  const rows = renderPayHistory(Array.isArray(hist.payments) ? hist.payments : []);
  host.innerHTML = rows ? `<div class="panel">${rows}</div>` : '';
  enhanceTables(host);
}

function renderPayHistory(payments) {
  if (!Array.isArray(payments) || !payments.length) return '';
  return `<div><h2 style="font-size:14px">Recent transfers</h2><table data-sortable><thead><tr><th>Date</th><th>To</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody>` +
    payments.map((p) => `<tr><td>${fmtDate(p.created_at)}</td><td>${p.payee || p.description || '—'}</td><td class="num">${money((p.amount_cents||0)/100)}</td><td>${p.status}${p.test_mode ? ' <span class="sub">(test)</span>' : ''}</td></tr>`).join('') +
    `</tbody></table></div>`;
}

// At phone width the Institution column folds under the account name (.acct-inst-line), so the Balance column fits
// the card instead of being cut at its edge (sweep 8: 'BALANC', '$11' for $110 at 412 px).
// Plaid reports credit and loan balances as amounts owed: they are the Liabilities group and read negative (UX audit).
function renderAccounts(a, cur) {
  const accounts = Array.isArray(a && a.accounts) ? a.accounts.filter((x) => x && typeof x === 'object') : [];
  const owed = (x) => x.type === 'credit' || x.type === 'loan';
  const balance = (x) => owed(x) && Number.isFinite(x.balance) && x.balance !== 0 ? '−' + money(Math.abs(x.balance), x.currency || cur) : money(x.balance, x.currency || cur);
  const row = (x) => `<tr><td>${escapeHtml(x.name || 'Unnamed account')}${x.mask ? ' ····' + escapeHtml(x.mask) : ''}${x.institution ? `<span class="acct-inst-line">${escapeHtml(x.institution)}</span>` : ''}</td><td class="acct-inst">${escapeHtml(x.institution)}</td><td>${escapeHtml(x.subtype || x.type)}</td><td class="num${owed(x) ? ' owed' : ''}${Number.isFinite(x.balance) ? '' : ' unknown'}">${balance(x)}</td></tr>`;
  const group = (label, list) => list.length ? `<div class="accounts-group"><span>${label}</span></div><table class="accounts" data-sortable><thead><tr><th>Account</th><th class="acct-inst">Institution</th><th>Type</th><th class="num">Balance</th></tr></thead><tbody>${list.map(row).join('')}</tbody></table>` : '';
  return `<div class="panel"><h2>Accounts</h2>${accounts.length ? group('Assets', accounts.filter((x) => !owed(x))) + group('Liabilities', accounts.filter(owed)) : '<p class="sub">No accounts in this saved snapshot.</p>'}</div>`;
}
function renderHoldings(a, cur) {
  const holdings = Array.isArray(a && a.holdings) ? a.holdings : [];
  return `<div class="panel"><h2>Holdings</h2><table data-sortable><thead><tr><th>Holding</th><th>Ticker</th><th class="num">Qty</th><th class="num">Value</th></tr></thead><tbody>` +
    holdings.filter(Boolean).slice(0, 25).map((h) => `<tr><td>${escapeHtml(h.name)}</td><td>${escapeHtml(h.ticker || '—')}</td><td class="num">${Number.isFinite(h.quantity) ? h.quantity.toLocaleString() : 'Unknown'}</td><td class="num">${money(h.value, cur)}</td></tr>`).join('') +
    `</tbody></table></div>`;
}
function renderSpending(a, cur) {
  const topSpending = Array.isArray(a && a.topSpending) ? a.topSpending : [];
  return `<div class="panel"><h2>Top spending (last ${a.transactionWindowDays || 90} days)</h2><table data-sortable><thead><tr><th>Category</th><th class="num">Spent</th><th class="num">#</th></tr></thead><tbody>` +
    topSpending.filter(Boolean).map((s) => `<tr><td>${escapeHtml(financeCategoryName(s.category))}</td><td class="num">${money(s.total, cur)}</td><td class="num">${Number.isFinite(s.count) ? s.count : 'Unknown'}</td></tr>`).join('') +
    `</tbody></table></div>`;
}

/** Said when no payment rail is set up: where to go, never an environment variable. */
const PAYMENTS_UNAVAILABLE = 'Sending money from Finance is not set up on this installation. To take payments, connect Stripe on the Connections page and use the Payments app.';
/** Said when no brief has been saved yet. */
const NO_SAVED_BRIEF = 'No saved analysis yet. Choose Request analysis to ask for one.';
/** Said while the analyst works: the server answers within a minute (the kernel ends a package request at 60 seconds). */
const ANALYSIS_WAIT = 'Your finance analyst is reading your saved accounts. This can take up to a minute.';
/** Said when the request ended with only a status code, such as the kernel ending it at 60 seconds. */
const ANALYSIS_UNFINISHED = 'The analysis did not finish, so nothing was saved. Your earlier analysis, if any, is unchanged. Try Request analysis again in a few minutes.';

/** Said while a requested analysis runs after the press has answered. */
const ANALYSIS_WORKING = 'Your finance analyst is working on a new analysis. It appears here when it is ready, usually within a few minutes. You can leave this page.';
/** How often the page asks whether a working analysis has finished. */
const ANALYSIS_POLL_MS = 5000;
/** The saved analysis as last painted (or the no-saved notice). A notice above it never replaces it. */
let savedAnalysis = '';
let savedBriefAt = null;
let analysisTimer = null;
const workingNotice = (text) => '<div class="spin" role="status"><span class="dot"></span> ' + text + '</div>';
const failedNotice = (text) => '<div class="notice err" role="status">' + escapeHtml(text) + '</div>';
/** Paint the analysis panel: a notice, if any, then the saved analysis, which stays until a new one is saved. */
function paintBrief(notice) { const panel = $('briefPanel'); if (panel) panel.innerHTML = (notice || '') + savedAnalysis; }
/** The saved analysis with its date, and a line when it is older than the account snapshot. */
function savedAnalysisHtml(j) {
  const stale = new Date(j.briefAt).getTime() < new Date(snapshotAt).getTime();
  return '<div class="analysis-head"><h2>Saved analysis</h2><span class="analysis-date">' + (fmtDate(j.briefAt) === 'Date unknown' ? 'Analysis date unknown' : 'Saved ' + escapeHtml(fmtDate(j.briefAt))) + '</span></div>' + (stale ? '<p class="analysis-stale">This analysis was saved before the account snapshot. Request analysis to review the refreshed data.</p>' : '') + renderMarkdown(j.brief);
}

/** Show what the latest analysis request reads as: working (and ask again shortly), failed in words when that is
 *  newer than the saved analysis, or nothing. Request analysis and Sync wait while a request is working. */
function showAnalysis(view) {
  clearTimeout(analysisTimer); analysisTimer = null;
  const working = Boolean(view && view.state === 'working');
  briefBusy = working; setBusy();
  if (working) { paintBrief(workingNotice(ANALYSIS_WORKING)); analysisTimer = setTimeout(pollAnalysis, ANALYSIS_POLL_MS); return; }
  const failedAt = view && view.state === 'failed' ? new Date(view.finishedAt || view.requestedAt || 0).getTime() : NaN;
  const unseen = Number.isFinite(failedAt) && !(savedBriefAt && failedAt <= new Date(savedBriefAt).getTime());
  paintBrief(unseen ? failedNotice(view.message || ANALYSIS_UNFINISHED) : '');
}

/** Ask whether the working analysis has finished: show the new analysis once it is saved, or why nothing was. */
async function pollAnalysis() {
  if (!$('briefPanel')) return;
  let view;
  try { view = (await api('/brief/analysis')).analysis; }
  catch { analysisTimer = setTimeout(pollAnalysis, ANALYSIS_POLL_MS); return; }
  if (view && view.state === 'done') { await loadBrief(false); return; }
  showAnalysis(view);
}

/** Load the analysis into its panel: the saved one, or (Request analysis) a new one. The server either answers with the
 *  new analysis it saved, or answers at once that the analyst is working; the earlier analysis stays until then. */
async function loadBrief(forceRefresh) {
  if (!$('briefPanel')) return;
  if (forceRefresh) { clearTimeout(analysisTimer); analysisTimer = null; briefBusy = true; setBusy(); paintBrief(workingNotice(ANALYSIS_WAIT)); }
  try {
    const j = forceRefresh
      ? await api('/brief/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
      : await api('/brief?cached=1');
    if (forceRefresh && j.analysis && typeof j.brief !== 'string') { showAnalysis(j.analysis); return; }
    savedBriefAt = j.briefAt || null; savedAnalysis = savedAnalysisHtml(j);
    showAnalysis(forceRefresh ? null : j.analysis);
  } catch (e) {
    if (!forceRefresh && (e.code === 'no_saved_brief' || e.status === 404)) { savedBriefAt = null; savedAnalysis = '<div class="notice">' + NO_SAVED_BRIEF + '</div>'; showAnalysis(e.body && e.body.analysis); return; }
    briefBusy = false; setBusy();
    paintBrief(failedNotice(forceRefresh && !e.said ? ANALYSIS_UNFINISHED : e.message));
  }
}

async function doSync() {
  if (syncBusy || briefBusy) return;
  syncBusy = true; setBusy(); syncMessage('Syncing accounts…');
  try { await api('/sync', { method: 'POST' }); await renderDashboard(); syncMessage('Account snapshot refreshed. Saved analysis has not been changed.'); }
  catch (e) { syncMessage(e.message, true); }
  finally { syncBusy = false; setBusy(); }
}

$('briefBtn').onclick = () => loadBrief(true);
$('syncIcon').onclick = doSync;

/** The first screen: the money view whenever there is money to show (linked items, or a saved aggregate such as a
 *  demo installation's sample household or a person whose banks were disconnected after a sync); connect otherwise. */
function startScreen(st) { return (st.connected > 0 || st.hasData) ? 'dashboard' : 'connect'; }
/** Boot: dashboard if connected, else the connect screen. */
// The full page only: under an audience view the shared kit paints instead (see the head script).
if (!window.AppView || !AppView.active()) (async function init() {
  try {
    if (await resumeOAuth()) return;
    if (new URLSearchParams(location.search).get('view') === 'banks') { await renderBanks(); return; }
    const st = await api('/status');
    if (startScreen(st) === 'dashboard') await renderDashboard();
    else renderConnect(st);
  } catch (e) {
    main.innerHTML = '<div class="notice err">Could not load: ' + e.message + '</div>';
  }
})();
</script>
<style>#reviewPanel input,#reviewPanel textarea{display:block;box-sizing:border-box;width:100%;margin:8px 0 16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font:inherit}#reviewStatus{white-space:pre-wrap}</style>
<script type="module">
import {receiveHandoff} from '/cockpit/js/app-handoff.js';
import {mountConnectedActions} from '/cockpit/js/app-workflows.js';
const field=id=>document.getElementById(id);
const draft=()=>({title:field('reviewTitle').value.trim(),notes:field('reviewNotes').value.trim(),...(field('reviewSource').value.trim()?{sourceUrl:field('reviewSource').value.trim()}:{})});
receiveHandoff({app:'finance',action:'review-context',contextType:'financial-review',version:1,fields:['title','notes','sourceUrl']},context=>{
 field('reviewTitle').value=context.title||'';field('reviewNotes').value=context.notes||'';field('reviewSource').value=context.sourceUrl||'';
 field('reviewPanel').hidden=false;field('reviewTitle').focus();field('reviewResult').textContent='';
 field('reviewStatus').textContent='Draft ready. Review uses saved account data and produces advice. It does not move funds.';
});
field('reviewBtn').onclick=async()=>{
 const context=draft();if(!context.title||!context.notes){field('reviewStatus').textContent='Add a title and evidence to review.';return;}
 field('reviewBtn').disabled=true;field('reviewStatus').textContent='Reviewing against your saved snapshot…';
 try{const r=await api('/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...context,confirm:true})});field('reviewResult').innerHTML=renderMarkdown(r.brief);field('reviewStatus').textContent='Advisory review complete. Account snapshot: '+(r.snapshotAt||'date unknown')+'.';}
 catch(e){field('reviewStatus').textContent=e.message;}finally{field('reviewBtn').disabled=false;}
};
const element=document.querySelector('.connected-app-actions');
// The work handed on is the review draft, else the loaded brief. With neither, the draft panel opens so the
// work can be entered here, and the person is told exactly that instead of "Select or enter the work".
const NOTHING_TO_HAND_ON='Nothing on this screen to hand on yet. Write a title and the evidence under “Review with your saved accounts” above (or load your brief), then choose the action again.';
void mountConnectedActions({app:'finance',element,contextForOffer:()=>{
 if(!field('reviewPanel').hidden){const d=draft();if(d.title&&d.notes)return d;field('reviewTitle').focus();throw Error(NOTHING_TO_HAND_ON);}
 const notes=field('briefPanel')?.innerText.trim();if(notes&&!field('briefPanel').querySelector('.notice,.spin'))return {title:'My saved financial brief',notes:notes.slice(0,2000)};
 field('reviewPanel').hidden=false;field('reviewTitle').focus();throw Error(NOTHING_TO_HAND_ON);
}}).then(()=>element.querySelectorAll('button').forEach(b=>b.classList.add('btn','ghost')));
/* hand-on-notice:start */
// The refusal above stayed on screen after the person filled in the title and evidence it asked for. Once both are
// there, the notice says the work is ready; it is left alone for any other status.
function settleHandOnNotice(status,d){
 if(!status||!String(status.textContent).startsWith('Nothing on this screen to hand on yet'))return;
 if(d.title&&d.notes)status.textContent='Ready to hand on. Choose the action again.';
}
/* hand-on-notice:end */
['reviewTitle','reviewNotes'].forEach(id=>field(id).addEventListener('input',()=>settleHandOnNotice(element.querySelector('[role="status"]'),draft())));
</script>
