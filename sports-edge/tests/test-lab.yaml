# CHANGE LOG
# 1 | maintainer@emeraldcoastsystemsgroup.com | Register all package behavior suites and the new fixture-only coach refresh proof, preserving the readiness smoke.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Register the fantasy transport suite: the compiled lineup route driven with a throwing fetch, so an unreachable ESPN can never again be reported as a missing connection.
# 3 | maintainer@emeraldcoastsystemsgroup.com | Register the scoring-history suite: the matched underdog/favourite pair each with a history-withheld companion, plus the feed extraction and the store statements' scope.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Say that the scoring-history suite now drives the registered lineup route itself. The earlier expectations were all one level below the defect, so a catalog reader could not tell that reverting the route wiring left them green.
# 5 | maintainer@emeraldcoastsystemsgroup.com | The four fantasy suites drive the fantasy-leagues kernel skill (ADR-146 D2) loaded from the framework source, so they declare fixture:core-checkout and the loader fixture. Register the skill-boundary suite: the private client is gone, no module names the fantasy host or builds the cookie header, and the manifest declares the skill.
# 6 | maintainer@emeraldcoastsystemsgroup.com | 0.11.0: the five fantasy cases moved with their suites to fantasy-football/tests/test-lab.yaml (ADR-146 D1); register sports-fantasy-moved, which proves the old routes answer 410 with the new address and that no fantasy engine module or declaration remains here.
# 7 | maintainer@emeraldcoastsystemsgroup.com | Register sports-preview-readonly: GET /preview only reads (the native kernel admits a GET as a reader and refused its build), POST /preview/:eventId/build builds.
# 8 | maintainer@emeraldcoastsystemsgroup.com | Register games-next: an empty Games list names its 8-day window and the next game within 35 days (a bye week read as a broken schedule); the audience-view case also expects the followed teams named instead of 'No saved work yet'.
# 9 | maintainer@emeraldcoastsystemsgroup.com | UX audit 2026-11-06: register ux-home-and-review: the app opens on Games once a team is followed, the review left the menu and hides its brief without a connected action.
# 10 | maintainer@emeraldcoastsystemsgroup.com | 0.12.0 (F22): register sports-quant (outlier-trimmed robustness and read-only quant routes) and sports-quant-browser (collapsible Sports Quant Concierge rail across 1440x900 and 412x915).
# 11 | maintainer@emeraldcoastsystemsgroup.com | 0.12.2 (Roger, 2026-11-16: every concierge is the core Jarvis chat window): the Concierge rail is the kernel's one chat window. Register sports-edge-one-chat-window (the window in the rail at 1440x900 and 412x915 touch, the model pick on the turn, the board on context.screen_state, an approved card reloading the Record) in place of sports-quant-browser, whose suite is retired with the rail's own chat it tested; sports-quant also expects the mount.
# 12 | maintainer@emeraldcoastsystemsgroup.com | 0.12.3 (BACKLOG Item A): register sports-wire-walk-forward (zero-lookahead walk-forward benchmark of archived world_items candidate signals vs Control and verification that unused refreshWorld wire ingest is retired at zero cost).
version: 1
cases:
  - id: package-readiness
    name: Installed package readiness
    purpose: Verify existing service-authenticated metadata readiness without provider or user-data access.
    level: integration
    runner:
      kind: smoke
      smoke: package-readiness
    expected:
      - The installed Sports Edge identity satisfies its existing smoke assertions.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: safe-smoke
  - id: sports-coach
    name: Coach discovery and ingestion
    purpose: >-
      Run the actual compiled refresh and public ESPN client with synthetic transport, World service and
      persistence boundaries.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-coach.test.js
    expected:
      - Missing or ambiguous staff produces no person subject.
      - Current coach changes follow the team cooldown and preserve prior history.
      - Follow ownership, fixed provider URLs, credential isolation and the pass budget remain intact.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/sports-coach-fixture.js
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-espn
    name: ESPN payload normalization
    purpose: Exercise fixed public read parsers and retry behavior with synthetic HTTP responses.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-espn.test.js
    expected:
      - Odds are attributed to the correct team.
      - Transient reads retry while final failures remain visible.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-world
    name: World subject contracts
    purpose: Verify stable subject IDs and shared-feed ingestion using in-memory outcomes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-world.test.js
    expected:
      - Entities remain stable and disambiguated.
      - Persistent timestamps determine cooldown; failed ingestion is reported.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-odds
    name: Odds arithmetic
    purpose: Verify probability, price, edge and zero-stake arithmetic.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-odds.test.js
    expected:
      - Odds conversions and model probabilities preserve their numerical contracts.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-ratings
    name: Team ratings
    purpose: Measure Elo, power ratings and season carry-over against synthetic games.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-ratings.test.js
    expected:
      - Ratings are finite, correctly attributed and preserve season carry-over.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-ensemble
    name: Game ensemble
    purpose: Test deterministic model contributions and injury/unit adjustments.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-ensemble.test.js
    expected:
      - Unavailable model data does not become a vote.
      - Production-weighted injuries and unit matchups are bounded.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-ledger
    name: Forward-test ledger
    purpose: Grade synthetic pregame predictions without placing orders.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-ledger.test.js
    expected:
      - Settled outcomes retain calibration and closing-line evidence.
      - Unproven strategies cannot claim a staking gate pass.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-line-history
    name: Observed line movement
    purpose: Exercise movement calculations and actual capture-store calls with an in-memory query fixture.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-line-history.test.js
    expected:
      - Only changed prices are captured.
      - The first observed price is never presented as a proven opening line.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-fantasy-moved
    name: Fantasy moved to its own app
    purpose: >-
      Drive the compiled retirement route and read the package's own sources and manifest to prove the
      fantasy half left for the fantasy-football package and its old routes say so.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-fantasy-moved.test.js
    expected:
      - Every method under /fantasy answers 410 with the fantasy-football address.
      - No fantasy engine module remains here, as source or as compiled route.
      - The router mounts the retirement route and not the engine.
      - The manifest no longer declares the fantasy-leagues skill or the espn-fantasy connector.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-surface
    name: Surface syntax and routes
    purpose: Parse packaged HTML and compiled route text without launching a browser.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-surface.test.js
    expected:
      - Classic scripts parse and page endpoints exist.
      - The Fantasy tab names the new app, links to it and calls no retired fantasy route.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell) and family (Home shell) audience view through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - With teams followed and no preview built, the notes name the followed teams and say no preview is built yet, never "No saved work yet".
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: sports-preview-readonly
    name: Preview reads on GET, builds on POST
    purpose: Drive the compiled preview routes with a reader-admission pool that refuses every write, as the native kernel does for a GET.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-preview-readonly.test.js
    expected:
      - GET /preview with nothing stored answers built false and never reads ESPN or writes.
      - GET /preview with a stored preview answers it and its calls.
      - POST /preview/:eventId/build is mounted, refuses anonymous callers and unknown leagues.
      - The page reads with GET and builds or rebuilds with POST.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: games-next
    name: An empty Games list names its window and the next game
    purpose: Run the compiled GET /games with framework stand-ins, a pool where the caller follows one team and a stubbed ESPN scoreboard, plus the page's emptyGamesText - no network, database or browser.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-games-next.test.js
    expected:
      - A bye week answers horizonDays 8, nextGameLookaheadDays 35 and the next game for the followed team.
      - A failed schedule read answers no next game; a game inside the window is listed with no look-ahead read.
      - 'The page says "No games for your teams in the next 8 days. Next: <away> @ <home>, <when>." and no longer says "inside the horizon".'
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: ux-home-and-review
    name: Sports Edge opens on its own screens (UX audit 2026-11-06)
    purpose: >-
      Check the shipped home page and review page against DOM doubles: where a person lands, the team picker,
      the app's own refresh toggle and the review's hidden dead brief.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/home-page.test.js
        - tests/review-page.test.js
    expected:
      - A person with a followed team opens on Games; a first-run person opens on My Teams.
      - No banner sends people to the Jobs screen; Games has a background-refresh toggle and one Refresh now.
      - The review is off the menu and its brief shows only with a connected action.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
      maxMemoryMb: 128
    installation: never
  - id: sports-quant
    name: Sports Quant outlier-trimmed robustness and read-only quant routes
    purpose: >-
      Verify outlier-trimmed ROI and CLV robustness (WINNERS_REMOVED = 0.2), numeric read-only GET /quant/tonight,
      /quant/roi, and /quant/game endpoints under reader admission, and approval gating on sports_edge_record_pick.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-quant.test.js
    expected:
      - Removing the top 20% winners separates a lucky longshot from durable positive-CLV, lower-Brier edge.
      - GET /quant/tonight, /quant/roi, and /quant/game return numeric vig, edge, quarter-Kelly, and movement with zero SQL writes.
      - Manifest and persona bind sports-quant and require approval before recording forward-test picks.
      - The page keeps the Concierge rail and draws no chat of its own; concierge.js mounts the kernel's one chat window as sports-edge's concierge for sports-quant with the starter prompts and the board as screen_state, and sends no turn of its own.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-edge-one-chat-window
    name: The Concierge rail is the one chat window as Sports Quant's concierge
    purpose: >-
      Drive the shipped page in headless Chromium at 1440x900 and at 412x915 on a touch screen, with the kernel's one
      chat window served from a kernel platform export (OSHAL_KERNEL_PLATFORM; refused, never skipped, without one), a
      scripted model and page-shaped Sports Edge reads.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-edge-one-chat-window.test.js
    expected:
      - The rail holds the window (concierge=sports-edge, bot=sports-quant), which fills it (the right column at full height on a desktop, the whole screen on a phone) and shows its model menu, Files, Tap to talk, Keep trying and New and Recent conversations.
      - A model picked for the request rides on the turn, which reaches sports-quant's door as sports-edge with the board on context.screen_state - the tab, the followed teams, the game in the Preview tab with its event id and the games the Games tab lists.
      - The page draws no transcript, composer or chat request of its own, nothing scrolls sideways, no page error; the window's Close hides the rail and the Concierge button brings the same conversation back.
      - A record_pick card runs only after Approve, once, and the Record tab on screen is read again.
    prerequisites:
      - runner:node-test
      - runtime:store-pinned-toolchain
      - runtime:chromium
      - harness:kernel-platform-export
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: Stop the fixture server.
    limits:
      timeoutMs: 120000
    installation: never
  - id: sports-wire-walk-forward
    name: Wire signal walk-forward benchmark and ingest retirement (Item A)
    purpose: >-
      Verify strict pre-kickoff zero-lookahead walk-forward evaluation of archived world_items
      candidate signals against the current ensemble (Control), confirm the negative result, and
      prove refreshWorld retires unused World wire ingest at zero feed/SQL/LLM cost.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-wire-walk-forward.test.js
    expected:
      - Pre-kickoff windows exclude same-day and post-game buckets (zero lookahead).
      - De-biased sentiment delta and injury-wire burst fail to beat Control Brier and MAE.
      - refreshWorld is retired and makes zero World service, ingestFeeds, or sports_world_pulls calls.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/walk-forward-wire-signal.mjs
        - tests/walk-forward-wire-signal-data.json
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
