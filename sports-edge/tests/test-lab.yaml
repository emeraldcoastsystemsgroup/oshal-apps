# CHANGE LOG
# 1 | maintainer@emeraldcoastsystemsgroup.com | Register all package behavior suites and the new fixture-only coach refresh proof, preserving the readiness smoke.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Register the fantasy transport suite: the compiled lineup route driven with a throwing fetch, so an unreachable ESPN can never again be reported as a missing connection.
# 3 | maintainer@emeraldcoastsystemsgroup.com | Register the scoring-history suite: the matched underdog/favourite pair each with a history-withheld companion, plus the feed extraction and the store statements' scope.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Say that the scoring-history suite now drives the registered lineup route itself. The earlier expectations were all one level below the defect, so a catalog reader could not tell that reverting the route wiring left them green.
# 5 | maintainer@emeraldcoastsystemsgroup.com | The four fantasy suites drive the fantasy-leagues kernel skill (ADR-146 D2) loaded from the framework source, so they declare fixture:core-checkout and the loader fixture. Register the skill-boundary suite: the private client is gone, no module names the fantasy host or builds the cookie header, and the manifest declares the skill.
# 6 | maintainer@emeraldcoastsystemsgroup.com | 0.11.0: the five fantasy cases moved with their suites to fantasy-football/tests/test-lab.yaml (ADR-146 D1); register sports-fantasy-moved, which proves the old routes answer 410 with the new address and that no fantasy engine module or declaration remains here.
version: 1
cases:
  - id: package-readiness
    name: Installed package readiness
    purpose: Verify existing service-authenticated metadata readiness without provider or user-data access.
    level: integration
    runner:
      kind: smoke
      smoke: package-readiness
    expected:
      - The installed Sports Edge identity satisfies its existing smoke assertions.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: safe-smoke
  - id: sports-coach
    name: Coach discovery and ingestion
    purpose: >-
      Run the actual compiled refresh and public ESPN client with synthetic transport, World service and
      persistence boundaries.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-coach.test.js
    expected:
      - Missing or ambiguous staff produces no person subject.
      - Current coach changes follow the team cooldown and preserve prior history.
      - Follow ownership, fixed provider URLs, credential isolation and the pass budget remain intact.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/sports-coach-fixture.js
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-espn
    name: ESPN payload normalization
    purpose: Exercise fixed public read parsers and retry behavior with synthetic HTTP responses.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-espn.test.js
    expected:
      - Odds are attributed to the correct team.
      - Transient reads retry while final failures remain visible.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-world
    name: World subject contracts
    purpose: Verify stable subject IDs and shared-feed ingestion using in-memory outcomes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-world.test.js
    expected:
      - Entities remain stable and disambiguated.
      - Persistent timestamps determine cooldown; failed ingestion is reported.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-odds
    name: Odds arithmetic
    purpose: Verify probability, price, edge and zero-stake arithmetic.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-odds.test.js
    expected:
      - Odds conversions and model probabilities preserve their numerical contracts.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-ratings
    name: Team ratings
    purpose: Measure Elo, power ratings and season carry-over against synthetic games.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-ratings.test.js
    expected:
      - Ratings are finite, correctly attributed and preserve season carry-over.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-ensemble
    name: Game ensemble
    purpose: Test deterministic model contributions and injury/unit adjustments.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-ensemble.test.js
    expected:
      - Unavailable model data does not become a vote.
      - Production-weighted injuries and unit matchups are bounded.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-ledger
    name: Forward-test ledger
    purpose: Grade synthetic pregame predictions without placing orders.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-ledger.test.js
    expected:
      - Settled outcomes retain calibration and closing-line evidence.
      - Unproven strategies cannot claim a staking gate pass.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-line-history
    name: Observed line movement
    purpose: Exercise movement calculations and actual capture-store calls with an in-memory query fixture.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-line-history.test.js
    expected:
      - Only changed prices are captured.
      - The first observed price is never presented as a proven opening line.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-fantasy-moved
    name: Fantasy moved to its own app
    purpose: >-
      Drive the compiled retirement route and read the package's own sources and manifest to prove the
      fantasy half left for the fantasy-football package and its old routes say so.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-fantasy-moved.test.js
    expected:
      - Every method under /fantasy answers 410 with the fantasy-football address.
      - No fantasy engine module remains here, as source or as compiled route.
      - The router mounts the retirement route and not the engine.
      - The manifest no longer declares the fantasy-leagues skill or the espn-fantasy connector.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-surface
    name: Surface syntax and routes
    purpose: Parse packaged HTML and compiled route text without launching a browser.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-surface.test.js
    expected:
      - Classic scripts parse and page endpoints exist.
      - The Fantasy tab names the new app, links to it and calls no retired fantasy route.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell) and family (Home shell) audience view through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
