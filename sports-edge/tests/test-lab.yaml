# CHANGE LOG
# 1 | maintainer@emeraldcoastsystemsgroup.com | Register all package behavior suites and the new fixture-only coach refresh proof, preserving the readiness smoke.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Register the fantasy transport suite: the compiled lineup route driven with a throwing fetch, so an unreachable ESPN can never again be reported as a missing connection.
# 3 | maintainer@emeraldcoastsystemsgroup.com | Register the scoring-history suite: the matched underdog/favourite pair each with a history-withheld companion, plus the feed extraction and the store statements' scope.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Say that the scoring-history suite now drives the registered lineup route itself. The earlier expectations were all one level below the defect, so a catalog reader could not tell that reverting the route wiring left them green.
version: 1
cases:
  - id: package-readiness
    name: Installed package readiness
    purpose: Verify existing service-authenticated metadata readiness without provider or user-data access.
    level: integration
    runner:
      kind: smoke
      smoke: package-readiness
    expected:
      - The installed Sports Edge identity satisfies its existing smoke assertions.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: safe-smoke
  - id: sports-coach
    name: Coach discovery and ingestion
    purpose: >-
      Run the actual compiled refresh and public ESPN client with synthetic transport, World service and
      persistence boundaries.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-coach.test.js
    expected:
      - Missing or ambiguous staff produces no person subject.
      - Current coach changes follow the team cooldown and preserve prior history.
      - Follow ownership, fixed provider URLs, credential isolation and the pass budget remain intact.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/sports-coach-fixture.js
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-espn
    name: ESPN payload normalization
    purpose: Exercise fixed public read parsers and retry behavior with synthetic HTTP responses.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-espn.test.js
    expected:
      - Odds are attributed to the correct team.
      - Transient reads retry while final failures remain visible.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-world
    name: World subject contracts
    purpose: Verify stable subject IDs and shared-feed ingestion using in-memory outcomes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-world.test.js
    expected:
      - Entities remain stable and disambiguated.
      - Persistent timestamps determine cooldown; failed ingestion is reported.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-odds
    name: Odds arithmetic
    purpose: Verify probability, price, edge and zero-stake arithmetic.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-odds.test.js
    expected:
      - Odds conversions and model probabilities preserve their numerical contracts.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-ratings
    name: Team ratings
    purpose: Measure Elo, power ratings and season carry-over against synthetic games.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-ratings.test.js
    expected:
      - Ratings are finite, correctly attributed and preserve season carry-over.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-ensemble
    name: Game ensemble
    purpose: Test deterministic model contributions and injury/unit adjustments.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-ensemble.test.js
    expected:
      - Unavailable model data does not become a vote.
      - Production-weighted injuries and unit matchups are bounded.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-ledger
    name: Forward-test ledger
    purpose: Grade synthetic pregame predictions without placing orders.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-ledger.test.js
    expected:
      - Settled outcomes retain calibration and closing-line evidence.
      - Unproven strategies cannot claim a staking gate pass.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-line-history
    name: Observed line movement
    purpose: Exercise movement calculations and actual capture-store calls with an in-memory query fixture.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-line-history.test.js
    expected:
      - Only changed prices are captured.
      - The first observed price is never presented as a proven opening line.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-fantasy
    name: Fantasy scoring
    purpose: Apply synthetic league rules, roster availability and fixture-only credential transport.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-fantasy.test.js
    expected:
      - Each league scores its own raw projection rows.
      - Unavailable players are excluded and private cookie data stays in the transport.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-fantasy-winprob
    name: Fantasy matchup optimization
    purpose: Optimize synthetic lineups against the actual fixture opponent.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-fantasy-winprob.test.js
    expected:
      - Lineups maximize matchup win probability with legal positions.
      - Opponent identity and scoring distributions remain consistent.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-fantasy-transport
    name: Fantasy read-failure reporting
    purpose: >-
      Drive the compiled lineup route with a synthetic transport that throws, proving an unreachable
      ESPN is reported as a transport fault while a refusal keeps its credential message.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-fantasy-transport.test.js
    expected:
      - A read that never reaches ESPN is answered as a transport fault, with or without a stored credential.
      - A refusal still names the credential or the league.
      - A failed schedule read and a bye render different surface copy.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-fantasy-history
    name: Fantasy scoring history
    purpose: Accumulate completed weeks from the player feed and feed them to the spread model.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-fantasy-history.test.js
    expected:
      - Completed weeks are kept per player; projections, season totals and prior seasons are not.
      - Weekly points are computed from the league's own scoring rules.
      - An underdog moves to the volatile player and a favourite to the steady one.
      - Withholding the history returns the highest-projected lineup unchanged.
      - The history read is scoped to one season, the weeks already played, and the roster.
      - The registered GET /fantasy/lineup handler itself stores the completed weeks and reads them back.
      - That same route serves the volatile player to an underdog, and the highest-projected lineup when nothing was played.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sports-surface
    name: Surface syntax and routes
    purpose: Parse packaged HTML and compiled route text without launching a browser.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sports-surface.test.js
    expected:
      - Classic scripts parse and page endpoints exist.
      - The surface preserves its credential warning and never collects ESPN cookies.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
