# 24 | maintainer@emeraldcoastsystemsgroup.com     | Run the marketing-engine package's suites: the app's only dangerous powers are posting under someone's name and moving their budget, so the guards are the consent gates (absent or garbage authorization row = OFF, cap 0 = never, count at cap = skipped), the import-never-arms-spend stripping, UTM validation/encoding, the 20% reallocation cap + channel floors, and honest no_data scorecard marking. Same dependency-free plain-node contract, against the COMPILED pure model. NOTE THE GLOB: these suites are .mjs.
# 25 | maintainer@emeraldcoastsystemsgroup.com     | Run the sports-edge package's suites: the app's only dangerous power is a confident line, and its two worst bugs shipped GREEN through 74 unit tests — a seeded Elo call with an empty tape silently discarded every carried-over rating, and a model with no games voted a zero that averaged a real signal most of the way to nothing. The guards that matter are therefore the invariants those bugs violated: strength models AVERAGED while context is ADDED, a dataless model abstaining instead of voting, a seed materialising without games, a spread graded against the price TAKEN, and the staking gate refusing to promote on one bar. Same dependency-free plain-node contract, against the COMPILED modules. GLOB: tests/*.test.js is correct here (all five suites are .test.js).

# 26 | Codex | Run compiled Home extractor session/owner/read-only/failure boundaries for Feeds, Email and Switchboard.
# 27 | maintainer@emeraldcoastsystemsgroup.com     | Narrow the spaces glob to tests/spaces-*.test.js: the new upload-identity.core.test.js drives the compiled router over real HTTP with express + multer resolved from a framework checkout (OSHAL_CORE_DIR), which this bare-checkout job does not have — same *.core.test.js convention as cad-studio and circuit-lab. Run locally with the framework checkout present.
# 28 | maintainer@emeraldcoastsystemsgroup.com     | Run the animatronics package's dependency-free suites (engine, protocol, prop-kind seam, Web Serial link) with the house one-glob contract; routes.core and surface.core stay local with the framework checkout.
# 29 | maintainer@emeraldcoastsystemsgroup.com     | Keep the scan-to-print core suite out of this bare-checkout job by NAME rather than by widening the glob. `tests/*-*.test.js` matched upload-identity.core.test.js only because that filename carried a hyphen, and that suite resolves express, multer and request-identity.ts from a framework checkout (OSHAL_CORE_DIR) this job does not have. The house contract is one glob per package (check-store-test-discovery.mjs enforces it), and every other package on tests/*-*.test.js already keeps its core suites hyphen-free - cad-studio and animatronics use routes.core.test.js, and a hyphenated one uses .core.spec.mjs. scan-to-print now matches: the file is identity.core.test.js beside routes.core.test.js and freshness.core.test.js. Glob unchanged.
# 30 | maintainer@emeraldcoastsystemsgroup.com     | Run the calendar package's brief-honesty suite. The meeting-brief agent's only dangerous power is a confident sentence nobody recorded, so the guard that matters is the citation-or-drop rule and the fixed no-prior-context sentence, asserted against the COMPILED pure model. NOTE THE PATH: this names one file rather than a glob, because the package's other suite (meeting-briefs.core.test.js) resolves core from a framework checkout this bare-checkout job does not have; it runs in the framework-coupled gate.
# 30 | maintainer@emeraldcoastsystemsgroup.com     | Hold every package-owned engine container to the pattern BUILDING-EXTENSIONS.md now documents. Four packages (aero-lab, cad-studio, circuit-lab, embodied) arrived at the same shape independently and nothing kept them or the doc in step: the compose project must be the package's own and asserted after `up` (an inherited COMPOSE_PROJECT_NAME put the first one in the core project, where the next core deploy swept it), no `oshal.tier` label (Prometheus' docker_sd selector), no published host port, and a stale container refused with the install command rather than answered with stale results. Mutation-proved, and the gate also runs against this repository's real compose files, installers and doc so the fixtures cannot pass while the shipped engines diverge.

# 31 | maintainer@emeraldcoastsystemsgroup.com     | Run the attribution guard, and land it GREEN. The operator's standing directive is that work identifies the LANE, never a model; core has enforced it in the tree and at push time since the 2026-09-12 history scrub and this repo enforced it nowhere, so recurrence was invisible until someone grepped - and it had recurred in 165 lines. The gate ships with the tree already clean rather than red on arrival: a gate that fails on every PR from the day it lands trains everyone to ignore red, which is the opposite of a guard. The bylines were rewritten to name the lane and the Change Log AUTHOR columns to name the house identity; no pattern was narrowed to the files that tripped it. See CONTRIBUTING.md.
# 32 | maintainer@emeraldcoastsystemsgroup.com     | Run the catalog dependency-mirror mutation suite beside the catalog gate. marketplace.json copies each manifest's dependency block and nothing ever compared the two, so the whole tiered-dependency migration left all 61 catalog entries on the pre-tier flat shape - creative-studio advertising one dependency where its manifest lists four, and the launchers advertising as required the apps they merely route to. The block is generated now, and this is the guard that keeps it generated.
# 33 | maintainer@emeraldcoastsystemsgroup.com     | Drop the `pull_request:` trigger and move the gate on-box. This repository is PRIVATE, so every run is billed, and this workflow is the org's largest line item: ~30 jobs, each billed rounded UP to a whole minute, 217 runs in the first sixteen days of September (100% pull_request) at ~18.9 billed minutes apiece - ~4,100 minutes to date, on a pace for ~7,700 a month (~$62 at the published $0.008/min Linux rate). That is the SPEND, not the percentage of the limit the operator's 75% warning was measured against: the included-minutes allowance cannot be read, because the Actions billing endpoints return Not Found for this token and plan. Skipped jobs are excluded from the figure - they never allocate a runner. Removing a trigger without replacing the gate would just delete the checks, so this lands with scripts/store-ci-local.sh: it PARSES this file rather than restating it, mirrors every job in declaration order, enforces the same `needs:` gating (a failed test-discovery/catalog-parity BLOCKS the package checks instead of letting them report green), fails any suite whose TAP summary shows zero tests, and refuses to run at all when it meets a job, command or glob it has no policy for. A check that could not run exits NON-ZERO (`--allow-skips` is the deliberate opt-out) - the first cut printed "never treat SKIPPED as green" and then exited 0, which on any clone without a sibling kernel checkout silently dropped the little-monsters security suite, kalshi and career-hunter. Wired into .githooks/pre-push, which is now the only automatic gate here; workflow_dispatch stays for a deliberate cloud run.
# 34 | maintainer@emeraldcoastsystemsgroup.com     | Run the trading package's Vitest specs. `grep -rn "trading" .github/workflows/` returned NOTHING and scripts/security/framework-coupled.vitest.config.mjs includes only lora/tests and vids/tests, so seventeen spec files for the package that places real orders with the operator's money ran in no gate at all - two guards landed on 2026-09-16 that would never have executed on a push, and ten cases had been failing on main since the kernel moved its lazy trading bootstraps onto the advisory-locked path with nobody able to see it. The specs need a framework checkout for their @/ alias, which no other job here has, so this job checks the (public) framework out and calls one script: scripts/run-trading-specs.mjs, which refuses a spec tree naming the LIVE trading database, refuses an environment already pointing at it, pins the child to a DSN that cannot connect, and fails a run that executed zero tests. The step before it drives that script over disposable fixture packages so the gate's own refusals are proven rather than assumed. Trigger unchanged: this file stays workflow_dispatch and scripts/store-ci-local.sh mirrors the new job like every other.
# 35 | maintainer@emeraldcoastsystemsgroup.com     | Check every scheduled service's ADR-157 activation declaration. A deterministic service-route schedule of a protected application now runs only under a principal a person activated, and the class it may be activated as is the one its manifest proposes - so an undeclared schedule is one nobody can turn on, which is the same silent nothing the ADR exists to end (five of them had been refused on the operator's box every tick since 2026-09-10 with one unread ERROR line each). The second half matters more: a `requires:` naming a permission the package's own imported authorization catalog does not define makes the KERNEL LOADER refuse the whole manifest, so a mistyped permission does not break the job, it takes the application down at install. Structural discovery, not a list - a package is covered the moment it declares target: service-route - and the mutation suite beside it proves the gate goes red for each shape rather than being trusted to.
# 36 | maintainer@emeraldcoastsystemsgroup.com     | Refuse a package that declares no connector allow-list. `dependencies.connectors` doubles as the app's RUNTIME allow-list, and for it absent is not empty: the kernel forwards the key to the cockpit, which reads an absent one as UNFILTERED - it pins the platform Connectors tile and offers the WHOLE provider catalog inside that app (RibbonNav.js connectorsAllowed, cockpit-view-controller.js renderConnectorDiscoverView). Three packages were shipping exactly that. catalog-parity cannot catch it, because marketplace.json's dependency block is GENERATED from the manifests - a key that leaves a manifest leaves the mirror with it and the parity check stays green - so the check is a gate of its own, with a mutation test whose regression case is the DISAPPEARANCE: a package that declared an allow-list and stops.
# 37 | maintainer@emeraldcoastsystemsgroup.com     | Add the cross-package dependency gate to catalog-parity. Only 12 of 61 packages declared an app prerequisite and nothing enforced declaring: marketplace.json's dependency block is GENERATED from the manifest, so a package that declares nothing produces a mirror that says nothing and gen-catalog-dependencies.mjs --check reports "current". It runs here because catalog-parity is a needs: gate for the package jobs, and because the check is dependency-free (bare checkout, no npm install).
# 38 | maintainer@emeraldcoastsystemsgroup.com     | Make cockpit concierge coverage a manifest contract. Whole-tree structural discovery grades every non-empty ui.static, ui.dynamic and ADR-141 toolbar surface; comments, blank values and nested lookalikes do not count, and there is no exception list. The 13 uncovered packages now declare an explicit right-rail owner, while mutation fixtures prove every supported surface and concierge rail shape.

name: store-ci

# MANUAL ONLY - do not add pull_request / push / schedule here.
#
# PRIVATE repository: Actions minutes are billed, and this workflow is the most expensive thing
# in the org. It fans out to ~30 jobs, and GitHub bills each JOB rounded UP to a full minute - so
# a run whose real wall time is a few minutes is billed at roughly nineteen.
#
# Measured over the first sixteen days of September 2026: 217 runs, every one of them a
# `pull_request` event, ~18.9 billed minutes each = ~4,100 billed minutes, on a pace for ~7,700 a
# month (~$62 at the published $0.008/min Linux rate). Basis: per-job started_at/completed_at from
# actions/runs/{id}/jobs over a 55-run sample, each job rounded up to a minute, with `skipped` jobs
# EXCLUDED - they never allocate a runner. That is the SPEND. It is not the percentage of the
# limit the operator's 75% warning was measured against: the included-minutes allowance could not
# be read, because the Actions billing endpoints return Not Found for this token and plan.
#
# security.yml and scripts/publish-store.sh already carry this same constraint; this file was the
# hole.
#
# THE GATE IS NOW LOCAL: `bash scripts/store-ci-local.sh` runs every job below against the
# working tree, in the same order, honouring the same `needs:` gating, before you push. It does
# not restate this file - it PARSES it, and refuses to run when it meets a job, command or glob
# it has no policy for, so the local gate cannot quietly drift away from this one.
#
# It is wired into .githooks/pre-push, which is the ONLY automatic gate this repository has left.
# That hook is opt-in per clone and does nothing until you run, once:
#     git config core.hooksPath .githooks
# Without that line there is no gate here at all. See CONTRIBUTING.md.
#
# Use workflow_dispatch for a deliberate cloud run (a second opinion on clean Linux runners, or
# a check that genuinely needs a service container).
on:
  workflow_dispatch:

jobs:
  home-summary:
    name: compiled Home summary boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test scripts/home-summary.test.cjs
      - run: node --test scripts/household-home.test.cjs
      - run: node --test scripts/business-home.test.cjs
      - run: node --test scripts/market-home.test.cjs
      - run: node --test scripts/creative-home.test.cjs
      - run: node --test scripts/career-home.test.cjs
      - run: node --test scripts/learning-home.test.cjs
      - run: node --test scripts/final-home.test.cjs
      - run: node --test scripts/operations-home.test.cjs
      - run: node --test scripts/media-home.test.cjs
      - run: node --test world/tests/home-summary.test.cjs
      - run: node --test vids/tests/integration-surface.test.js

  test-discovery:
    name: non-empty package test discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Refuse missing or empty package test commands
        run: node scripts/security/check-store-test-discovery.mjs

  catalog-parity:
    name: catalog, manifests, and generated README agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate every package catalog entry and generated README row
        run: node scripts/check-catalog.mjs
      - name: Mutation-test catalog drift detection
        run: node --test scripts/check-catalog.test.mjs
      - name: Mutation-test the generated catalog dependency mirror
        run: node --test scripts/gen-catalog-dependencies.test.mjs
      # Not parity: the mirror is GENERATED from the manifests, so a connector allow-list that
      # disappears from a manifest disappears from marketplace.json with it and parity stays
      # green. Absent is not empty — the cockpit reads an absent key as UNFILTERED and offers
      # the whole provider catalog inside that app.
      - name: Refuse a package that declares no connector allow-list
        run: node scripts/check-connector-declarations.mjs
      - name: Mutation-test the connector-declaration gate
        run: node --test scripts/check-connector-declarations.test.mjs
      # A package that owns a cockpit surface must also name the concierge responsible for its
      # right rail. Whole-tree discovery covers static, dynamic and ADR-141 group toolbars with no
      # allowlist; the parser ignores comments and requires an actual nonblank declaration.
      - name: Refuse a cockpit surface that declares no concierge
        run: node scripts/check-concierge-coverage.mjs
      - name: Mutation-test the concierge-coverage gate
        run: node --test scripts/check-concierge-coverage.test.mjs
      - name: Every cross-package edge is declared
        run: node --test scripts/app-dependency-declarations.test.mjs

  service-activations:
    name: every scheduled service declares the principal it runs as
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # ADR-157. A deterministic service-route schedule runs under a principal a person activated,
      # and the class it may be activated as is the one its manifest proposes. Both halves of this
      # gate fail at INSTALL rather than here if they are missed: an unclassified schedule cannot be
      # activated at all (it skips forever, silently, which is the failure ADR-157 exists to end),
      # and a `requires` naming a permission the package's own catalog does not define makes the
      # kernel loader refuse the WHOLE manifest — taking the app down, not just the job. Structural
      # discovery, not a list: a package is covered the moment it declares target: service-route.
      - name: Check every scheduled service's activation declaration
        run: node scripts/check-service-activations.mjs
      - name: Mutation-test the scheduled-service declaration gate
        run: node --test scripts/check-service-activations.test.mjs

  engine-container-pattern:
    name: package-owned engine containers follow the documented pattern
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # Structural discovery, not a list: a package is covered the moment it commits
      # engine/container/compose.yaml, so a fifth engine cannot be hand-rolled unnoticed.
      - name: Check every engine container against BUILDING-EXTENSIONS.md
        run: node scripts/check-engine-container-pattern.mjs
      - name: Mutation-test the engine-container gate
        run: node --test scripts/check-engine-container-pattern.test.mjs

  forced-rls:
    name: every walled package table is FORCEd, not only ENABLEd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # PostgreSQL exempts a table's OWNER from its own row security unless the table is FORCEd,
      # and the api both owns every public table and is the role that reads them. ENABLE alone
      # therefore installs a policy that reads as protection in every audit and never runs. The
      # gate replays each package's migration set rather than grepping for the word, because the
      # four create_project* tables were enabled inside an EXECUTE format() loop.
      - name: Refuse a migration that enables row security without forcing it
        run: node scripts/check-forced-rls.mjs
      - name: Mutation-test the forced row-security gate
        run: node --test scripts/check-forced-rls.test.mjs

  attribution:
    name: no model attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Refuse model attribution in tracked files
        run: node --test scripts/check-no-model-attribution.test.mjs

  store-ci-local:
    name: the local gate's own exit-code contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # scripts/store-ci-local.sh is the gate now, so the way IT fails is release-critical. Its
      # first cut printed "never treat SKIPPED as green" and exited 0 anyway, which on any clone
      # without a sibling kernel checkout silently dropped the little-monsters SECURITY suite,
      # kalshi and career-hunter. These cases drive the real runner over a disposable fixture
      # store and pin both halves: a prerequisite-missing run is non-zero, and --allow-skips
      # returns zero while still naming what did not run.
      - name: Pin the local gate's skip and exit-code contract
        run: node --test scripts/store-ci-local.test.mjs

  little-monsters:
    name: little-monsters security suites
    needs: [test-discovery, catalog-parity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # This intentionally names the full *.test.cjs set, not one hand-picked
      # file. The compiled-route suites exercise the bytes mounted by the loader;
      # source-side guards lock down final SQL/transaction shapes and boundaries
      # whose safety depends on authorization and mutation remaining adjacent.
      # All suites are dependency-free plain node, so no install step can mask a
      # missing guard or substitute a framework checkout for the packaged code.
      # The one exception is a TypeScript compiler: the source-side guards
