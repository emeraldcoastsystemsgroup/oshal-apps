# 1 | roger.murphy@emeraldcoastsystemsgroup.com  | Store-repo CI (game-show backlog #12): the package suites finally run somewhere a human doesn't have to type them. PR + manual dispatch ONLY — push:/schedule: triggers are banned in this org (Actions billing, see core repo ci-disabled-pending-billing). Node-only, no npm install: the suites are dependency-free by design.
