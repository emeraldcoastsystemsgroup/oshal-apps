  trading:
    name: trading package specs, against a framework checkout
    needs: [test-discovery, catalog-parity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The trading specs are Vitest, and they resolve @/ (plus express, js-yaml and acorn) out of
      # a framework checkout — trading/vitest.config.mjs is where that mapping lives. Every other
      # job here is bare-checkout plain node, which is exactly why this package had no job at all
      # and its 17 spec files ran nowhere. The framework is PUBLIC, so no token is involved.
      - name: Check out the framework the specs resolve against
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: emeraldcoastsystemsgroup/oshal
          ref: main
          path: framework
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: framework/package-lock.json
      - name: Provide the framework checkout's locked Vitest
        run: npm ci --legacy-peer-deps --no-audit --no-fund --prefix framework
      # These cases drive the gate script itself over disposable fixture packages with a REAL
      # Vitest: no spec files is non-zero, a suite that declares no cases is non-zero, a spec
      # naming the live trading database is refused before Vitest starts, and a passing fixture
      # still returns zero. They run BEFORE the real specs so a broken gate fails as a gate.
      - name: Pin the trading gate's zero-test and live-database refusals
        env:
          OSHAL_FRAMEWORK: framework
        run: node --test scripts/run-trading-specs.test.mjs
      # This is the package that places real orders with the operator's money. The runner refuses
      # any spec tree that names the live trading database, refuses an environment already pointing
      # at it, pins the child to a DSN that cannot connect to anything, and fails a run that
      # executed zero tests.
      - name: Run every trading spec with the live-database refusal in force
        env:
          OSHAL_FRAMEWORK: framework
        run: node scripts/run-trading-specs.mjs
