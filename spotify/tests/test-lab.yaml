version: 1
cases:
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its family (Home shell) and company (Business shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the family view reads /api/spotify/config and /profile, and /now-playing and /playlists only once the connection answers ok; never top tracks, search, the conversation or the concierge.
      - Not connected, the Development Mode allowlist and a Spotify error each show their own gate with the one action that fits, and saved taste still shows.
      - Playing, paused, nothing playing, an unreadable read, empty playlists, a refusal and a failure each read as what they are; only open.spotify.com links open, in a new tab.
      - Under an audience view the module script adds no handoff listener and fetches no connected-actions offer.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: kernel-egress
    name: Native kernel Spotify egress
    purpose: Drive the compiled Spotify routes with OSHAL_EGRESS=kernel, the bridge's inert framework stand-ins, synthetic connection metadata and a recording fetch - no network or credentials.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/kernel-egress.test.cjs
    expected:
      - Every Web API request goes to https://api.spotify.com/v1 with only a Content-Type header - no Authorization and no key in the URL.
      - Profile, search, now playing (including 204), playlists and top tracks map to the same shapes the framework client returns; building a playlist posts the same JSON to /users/:id/playlists and /playlists/:id/tracks.
      - The concierge chat runs on live search candidates and builds the playlist the brain asks for.
      - No, revoked or lapsed spotify connection in the connection metadata, and a kernel "not connected" refusal, give each route its existing not-connected answer.
      - Outside the kernel the broker token still reaches the framework client and the package sends nothing itself.
      - The manifest declares api.spotify.com with the spotify connector as a Bearer credential.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: connect-gate
    name: Connect card signs in at the top level and Refresh answers
    purpose: >-
      Read and run the served connect card: Connect Spotify opens the kernel start route at the top level with a return to /cockpit/?app=spotify, Refresh is a real button that says Checking and then what it found, and the button ink follows the theme.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/spotify-connect-gate.test.cjs
    expected:
      - Connect Spotify targets the top window at /api/connect/spotify/start with return=/cockpit/?app=spotify.
      - Both Refresh controls are buttons; pressing one shows Checking, disables it, then names the connection state in a status line.
      - Button ink is the on-accent token, a link button has no underline, and the inner header repeating the app name is gone.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: one-chat-window
    name: The Music Concierge is the kernel's one chat window
    purpose: >-
      In Chromium at 1440x900 and 412x915 the shipped Spotify page over the compiled router (a connected Spotify double under
      the native kernel), beside the kernel's one chat window served from a kernel platform export with its stand-in kernel.
    level: browser
    runner:
      kind: node-test
      scope: package
      files:
        - tests/spotify-one-chat-window.test.cjs
    expected:
      - The Music Concierge box under the tracks holds the window (concierge=spotify, bot=spotify-concierge) with its model menu, Files, Tap to talk, Keep trying and conversations.
      - A turn reaches spotify-concierge with context.app spotify, the picked model and the screen (what is playing, the tracks with their URIs, the track picked for a playlist and its name, the playlists); no POST /api/spotify/chat and no message box on the page.
      - The window and its message box sit inside the box and on the screen, and nothing scrolls sideways.
      - A playlist the concierge proposes is created only when its card is approved, once, with the card's tracks, and Your playlists shows it without a reload.
    prerequisites:
      - runner:node-test
      - dependency:playwright
      - browser:chromium
      - harness:kernel-platform-export
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/spotify-routes-harness.cjs
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
  - id: concierge-tools
    name: The Music Concierge's tools are routes this router answers
    purpose: >-
      Read the manifest and persona and drive the compiled routes: what the page's chat route did for the page is the concierge's tools.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/spotify-tools.test.cjs
        - tests/spotify-routes-harness.cjs
    expected:
      - Every tool the manifest declares names a method and path the compiled router answers, and the persona names each one.
      - top-tracks returns the listener's tracks with the URIs build-playlist takes.
      - GET /notes returns the listener's remembered notes and the profile's tastes, and no other listener's.
      - POST /notes keeps a taste the listener states in their own words, once; one they did not state is not kept; a call without a note or words is refused.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/spotify-routes-harness.cjs
    limits:
      timeoutMs: 15000
    installation: never
