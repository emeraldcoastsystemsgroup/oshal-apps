# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | Register every shipped Node test suite with exact files and honest fixture boundaries; retain readiness smoke identity.
# -----------------------------------------------------------------------------
version: 1
cases:
  - id: package-readiness
    name: Installed package readiness
    purpose: Retain the existing metadata-only installation probe without running a business workflow.
    level: integration
    runner:
      kind: smoke
      smoke: package-readiness
    expected:
      - The installed payroll metadata satisfies its existing manifest smoke assertions.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: safe-smoke
  - id: payroll-ach-returns
    name: ACH returns and notifications
    purpose: Parse synthetic return and notification records using the compiled ACH module.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/payroll-ach-returns.test.mjs
    expected:
      - Return and NOC codes retain their distinct meanings and field layouts.
      - Malformed records are refused and generated trace numbers round-trip through return parsing.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: >-
        The runner removes the disposable container and staged files; all business records are synthetic
        in-memory fixtures.
    limits:
      timeoutMs: 60000
      maxMemoryMb: 256
    installation: never
  - id: payroll-calendar
    name: Versioned payroll calendars
