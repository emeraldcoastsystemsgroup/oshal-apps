# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | Register every shipped package test with explicit runner and fixture boundaries; retain the readiness smoke identity. The framework-coupled route suite is registered with its real prerequisite (a framework checkout), and the real-kernel Python suite with its (the engine image) — neither is hidden.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Use canonical prerequisites, declare temporary HTTP fixture writes and keep the Python engine suite on the explicitly unavailable external-runner boundary.
# 3 | maintainer@emeraldcoastsystemsgroup.com | Register actual-page selection and preview lifecycle regression with its isolated browser prerequisite.
# 4 | maintainer@emeraldcoastsystemsgroup.com | revolve, sweep and loft (BACKLOG B1): sixteen feature types, the worker-registry parity guard, 24 real-kernel cases, and the generated form authoring the new parameter shapes.
# 5 | maintainer@emeraldcoastsystemsgroup.com | Per-feature budget and cancel (BACKLOG B5): the worker orchestration suite with the kernel stubbed out, the client and route cancel cases, 28 real-kernel cases, and Stop rebuild in the editor.
# 6 | maintainer@emeraldcoastsystemsgroup.com | Rename the drifted framework-checkout prerequisites to the Test Lab's own vocabulary so these cases can run: node-test cases declare fixture:core-checkout (the sealed Node profile runs on the oshal image, where /app is the checkout); browser cases declare harness:oshal-core-root and core:dependencies, as create does. A case that imports core's tests/fixtures, which the image does not ship, also declares harness:core-test-fixtures and stays pending with that exact reason instead of an unknown name.
# 7 | maintainer@emeraldcoastsystemsgroup.com | 0.2.3: the family audience view registered beside the company one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
# 8 | maintainer@emeraldcoastsystemsgroup.com | Register sql-declared-keys: the create path's INSERTs and every INSERT target in routes/ checked against the primary keys the listed migration declares, the rule the native kernel enforces on insert.
# 9 | maintainer@emeraldcoastsystemsgroup.com | Register part-list-names: parts sharing a title carry 'made <date>' in the list (sweep 8: two identical rows read as one model).
# 10 | maintainer@emeraldcoastsystemsgroup.com | Register engine-down-words: with no engine the page says once, in words, that the CAD engine is not answering on this installation, never the host's install command (demo sweep 1).
# 11 | maintainer@emeraldcoastsystemsgroup.com | Register document-handoff: the person and the concierge edit the same part in turn through the shared document handoff, over the compiled routes and a disposable PostgreSQL database.
# -----------------------------------------------------------------------------
version: 1
cases:
  - id: package-readiness
    name: Installed package readiness
    purpose: Verify the existing metadata-only readiness probe without provider or user-data access.
    level: integration
    runner:
      kind: smoke
      smoke: package-readiness
    expected:
      - The installed cad-studio package identity satisfies its manifest smoke assertions.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: safe-smoke
  - id: contract-features
    name: Feature contract and engine build hash
    purpose: Prove the model contract the routes, tools and engine share — every base and feature type normalises, ranges and selectors are enforced with the field named, unknown parameters are refused, ids are kept on update, the list refuses duplicates and the cap, the published contract lists the engine's names — and that the Node and Python engine build hashes agree.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/contract-features.test.js
    expected:
      - Sixteen feature types and five base kinds validate; a typo'd parameter is refused naming the field.
      - The worker's FEATURES registry and PLANE_AXES, read from cad_worker.py's source, equal the contract's.
      - settings.featureBudgetMs outside 1..600000 whole ms is refused naming the field, and the range equals the worker's.
      - engine-build-hash.js and cad_engine_bridge.py --build-hash produce the same digest.
    prerequisites:
      - runner:node-test
      - python3
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: engine-client
    name: Engine transport against a fake bridge
    purpose: Prove the api's engine client over the real wire protocol on loopback — hello verification (protocol, build hash, busy), serialised requests answered by id, typed refusals, timeout kills and reconnects, a dropped bridge fails the queue, the bounded queue and the address parser.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/engine-client.test.js
    expected:
      - A stale build hash is capability_unavailable naming the install command; a timeout is engine_timeout and the next request reconnects.
      - Cancelling the in-flight request closes its connection while another caller's queued request is answered on a fresh one.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: sql-declared-keys
    name: Create-path SQL against the declared primary keys
    purpose: Prove the native kernel's insert rule holds for this package — the create path's actual INSERTs (a part, then the revision row a recorded build writes) and every INSERT target in routes/ name a table that a listed migration declares with a primary key, and every key column is supplied non-null or declared with a default.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/sql-declared-keys.test.js
    expected:
      - cad_model is keyed by a defaulted model_id and cad_revision by (model_id, revision); the create path's INSERTs raise no problem.
      - The checker refuses an undeclared table, a keyless table, an omitted key column and a null key value.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: routes-http
    name: Packaged routes over loopback HTTP
    purpose: Drive the compiled routes with express and multer from a framework checkout and the real engine client against a fake bridge — caller gate, create/build, the feature operations as revisions, owner scoping, artifacts by revision, mesh base upload, Home summary, deletion, and the 503 with the install command when the bridge is gone.
    level: integration
    runner:
      kind: node-test
      scope: package
      files:
        - tests/routes.core.test.js
    expected:
      - 401 without a caller, 404 across owners, 400 with the field for bad input, 422 for a refused base, 503 naming install-engine.sh when the bridge is gone.
      - A cancel mid-rebuild answers the triggering request 409 and keeps the last good revision, and another subject's cancel is 404.
    prerequisites:
      - runner:node-test
      - fixture:core-checkout
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: Close the loopback HTTP server and fake engine bridge and remove the temporary model directory; module hooks remain confined to the disposable Node process, with no real database or CAD engine.
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
  - id: worker-logic
    name: Worker orchestration with the kernel stubbed out
    purpose: Run cad_worker's own bookkeeping under python with a stub in place of CadQuery that raises if the kernel is reached — the per-feature budget refuses and discards a slow feature while the next still runs, the budget parse, and every revolve, sweep and loft refusal happening before any kernel call (a valid loft is the positive control). Branch logic only; geometry is the engine-kernel case.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/worker-logic.test.js
    expected:
      - A feature past its budget reports budget_exceeded with its ms and the previous solid stays.
      - No revolve, sweep or loft refusal reaches the stubbed kernel.
    prerequisites:
      - runner:node-test
      - python3
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/worker_logic_harness.py
    limits:
      timeoutMs: 30000
      maxMemoryMb: 256
    installation: never
  - id: engine-kernel
    name: Real-kernel worker suite (engine image)
    purpose: Prove the worker on the real OCCT kernel — every base and feature builds to analytic volumes, a refused feature is reported and skipped, STEP is byte-stable across rebuilds, a mesh round-trips through sewing, and the protocol answers every line. Runs inside the engine container, not under node.
    level: integration
    runner:
      kind: external
      scope: package
      files:
        - engine/tests/test_cad_worker.py
    expected:
      - 28 unittest cases pass under `python -m unittest discover -s tests` in oshal-cad-studio-engine, including revolve, sweep and loft to analytic volumes and the per-feature budget.
    prerequisites:
      - engine-container:oshal-cad-studio-engine
    sideEffects: none
    isolation:
      mode: disposable
    limits:
      timeoutMs: 300000
      maxMemoryMb: 3072
    installation: never
  - id: surface-lifecycle
    name: Current part and revision in the CAD editor
    purpose: Drive the actual packaged editor and shared STL viewer in Chromium while holding synthetic detail, preview, rebuild, revision-list and deletion responses across selection changes.
    level: browser
    runner:
      kind: playwright
      scope: package
      files:
        - tests/surface-lifecycle.core.spec.mjs
    expected:
      - A late response for another part or retired revision cannot replace the selected part or its preview.
      - Deletion clears the selected preview while late deletion replies cannot hide another part.
      - Background refresh preserves newer unsaved feature input.
      - The generated form sends revolve, sweep and loft with JSON path and sections, a plane select and a boolean ruled.
      - Stop rebuild shows only while the selected part rebuilds and cancels that part.
    prerequisites:
      - runner:playwright
      - harness:oshal-core-root
      - browser:chromium
      - core:dependencies
      - harness:core-test-fixtures
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures:
        - tests/surface-lifecycle.core.fixture.mjs
      cleanup: Close the owned Chromium process and loopback fixture; synthetic models and API responses remain in the disposable fixture, with no live database or CAD engine.
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its company (Business shell) and family (Home shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: part-list-names
    name: Parts that share a name read differently
    purpose: >-
      Run the served tools/cad-studio.js: in the parts list a title that another part repeats carries the date
      it was made (and the short id on a same-minute tie); sweep 8 found two identical rows the concierge
      called the same model.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/part-list-names.test.js
    expected:
      - >-
        Two same-named parts made a day apart carry different 'made' notes; a unique title carries none.
      - >-
        Same-named parts made in the same minute add the short part id.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: engine-down-words
    name: "An engine that is not answering is told in words, not an install command"
    purpose: "Run the shipped page's renderEngine and buildWords in a VM over the routes' no-engine answers - no browser, network or engine."
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/engine-down-words.test.js
    expected:
      - "The banner says once that the CAD engine is not answering on this installation, with no address, setting or install command."
      - "A failed build toast names the engine in a short sentence; an engine's own refusal sentence is still shown."
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
  - id: document-handoff
    name: Manual and concierge part handoff
    purpose: >-
      Drive the actual CAD page and the shared document-handoff module over the compiled routes, a disposable PostgreSQL
      database built from the package migration and the real engine client against a loopback wire-protocol bridge: the
      handoff saves the person's unsaved work before an assistant reads, and refresh draws the concierge's saved change.
    level: browser
    runner:
      kind: playwright
      scope: package
      files:
        - tests/document-handoff.core.spec.mjs
    expected:
      - An unsaved hole in the feature form is saved as revision 2 before reading; the context carries the part id and revision 2.
      - A feature change made through the routes is drawn by refresh as revision 3; the next unsaved density reaches revision 4 and the next context.
      - A density the person is still typing survives refresh and the toast says it is kept; a refused feature save keeps the form and the part unchanged.
    prerequisites:
      - runner:playwright
      - harness:oshal-core-root
      - browser:chromium
      - core:dependencies
      - harness:core-test-fixtures
      - core:shared-theme-assets
      - fixture:postgres-35689
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: Drop the uniquely named fixture database, close the loopback server, the fake bridge and the owned Chromium, and remove the temporary model directory; preserve shared PostgreSQL and never use live data.
    limits:
      timeoutMs: 180000
      maxMemoryMb: 1536
    installation: never
