# CAD Studio engine -- its OWN compose project (never the core stack's: a core deploy's
# --remove-orphans would sweep it), joined to the stack network under the alias the api's
# adapter dials. No host port: only containers on the stack network can reach the bridge.
name: oshal-cad-studio-engine
services:
  cad-studio-engine:
    image: oshal-cad-studio-engine:local
    container_name: oshal-cad-studio-engine
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${CAD_ENGINE_MEM_LIMIT:-3g}
    labels:
      oshal.app: cad-studio
    networks:
      oshal:
        aliases:
          - cad-studio-engine
networks:
  oshal:
    external: true
    name: ${OSHAL_NETWORK:-oshal-local_oshal}
