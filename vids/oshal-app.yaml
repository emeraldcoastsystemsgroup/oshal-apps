# -----------------------------------------------------------------------------
# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — vids ("Vids Studio")
# Carved out of OSHAL core 2026-07-19 (ADR-085 Wave 3, "skill with a surface" —
# ONLY the surface carves). This package is the app: the /api/vids routes
# (routes/vids-routes.js built from src-routes/ — job/story dispatch to the
# registered remote Vids worker + the self-contained job-queue surface at
# /api/vids/app), the vids_generate CLI tool, the manifest (ticketType 'vids' +
# the studio pipeline), a package COPY of the vids-operator persona for the
# registrar, and a migrations/ COPY of 059 for fresh installs.
#
# What STAYS framework-resident per ADR-093 (this package ships none of it):
#   - the SHARED vids-operator remote-client desktop worker
#     (packages/oshal-vids-operator → `npx oshal-vids worker`) + its registry
#     entries in BOTH swarm-bot-registry blocks — all four vids-family apps
#     reference it (the ADR-080 Extend-story content library + production engine
#     lives in the worker's content.* tools, NOT in these routes);
#   - the remote-client registry/mesh (src/app/routes/remote-client-routes.ts)
#     these routes enqueue into — reached via the @/ alias;
#   - scripts/oshal-vids.js (the CLI backing vids_generate + the creative_*
#     tools) — kernel-owned;
#   - scripts/migrations/059-vids-platform.sql (kernel-owned history; the COPY
#     here creates vids_jobs + seeds the worker bot row on fresh installs).
# Framework: OSHAL (see docs/adr/085-remote-app-packages-and-registries.md)
# ─────────────────────────────────────────────────────────────────────────────

name: vids
suite: ai-creative   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features:
    - id: clip-generate
      unit: Veo clip
      tier: T2
      generation: hosted
      degrade: disable
    - id: story-produce
      unit: multi-scene story
      tier: T2
      generation: hosted
      degrade: disable
    - id: brand-graphic
      unit: brand graphic
      tier: T2
      generation: hosted
      degrade: disable
    - id: vids-ticket
      unit: vids ticket
      tier: T4
      generation: hosted
      degrade: disable
displayName: Vids Studio
description: >-
  Turn an idea into generated video. The Veo specialist drives Google Vids by
  clicking — describes the shot, generates the clip, places it on the timeline —
  on a remote operator machine, and learns what works over time.
version: 1.6.8
authorization:
  version: 1
  catalog: authorization.yaml
testing:
  version: 1
  catalog: tests/test-lab.yaml
status: active

theme: light-blue

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: vids
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/vids/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: []
    tools: []
    connectors: []

# Kernel skills this app declares (ADR-090 uses: contract, fail-closed at load).
# `app-dependencies` is the compatibility floor for the tiered dependencies block above: a core
# that predates required/optional refuses this package instead of installing it without its
# required dependencies and without its connector allow-list.
uses:
  - app-dependencies
  - test-catalog
  - package-anonymous-routes
  - package-anonymous-catalog-reads
  - application-authorization

# ─────────────────────────────────────────────────────────────────────────────
# BOTS — reuses the already-registered SHARED vids-operator worker (registered in
# BOTH swarm-bot-registry blocks, kernel-resident; seeded by migration 059). The
# persona here is a package COPY for the registrar.
# ─────────────────────────────────────────────────────────────────────────────
bots:
  - agentId: b00e0000-0000-0000-0000-000000000001
    name: vids-operator
    posture: inline
    persona: personas/vids-operator.yaml
    role: media/video
    capabilities:
      - veo-prompt-craft
      - vids-generate
      - vids-operate
      - shot-planning

# CLI tool (backs the vids_generate registered tool). Enqueues a generate-job to
# the registered Vids worker via the LOCAL /api/vids API (same container — this
# package's own route), which hands it to the remote-client registry the worker
# polls. The CLI itself is kernel-resident (scripts/oshal-vids.js).
tools:
  - name: vids-source-list
    displayName: Vids Source List
    type: api
    category: creative
    description: List actual original-owned saved generation briefs and revisions.
    executor: {executorType: api, apiEndpoint: "GET /api/vids/source-projects"}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    usageInstructions: Read the source contract and actual saved source first. Use returned IDs and baseRevision, and requestKey copied unchanged from the just-read source-contract response per exact edit intent. Retry an uncertain result unchanged. Brief edits never generate a clip; generation requires a separate explicit request and its existing approval.
    tags: [vids, editing, source]

  - name: vids-source-contract
    displayName: Vids Source Contract
    type: api
    category: creative
    description: Read the typed generation-brief editing contract.
    executor: {executorType: api, apiEndpoint: "GET /api/vids/source-projects/contract"}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    usageInstructions: Read the source contract and actual saved source first. Use returned IDs and baseRevision, and requestKey copied unchanged from the just-read source-contract response per exact edit intent. Retry an uncertain result unchanged. Brief edits never generate a clip; generation requires a separate explicit request and its existing approval.
    tags: [vids, editing, source]

  - name: vids-source-read
    displayName: Vids Source Read
    type: api
    category: creative
    description: Read one actual owned brief, current revision and immutable history.
    executor: {executorType: api, apiEndpoint: "GET /api/vids/source-projects/{input.id}"}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {id: {type: string, minLength: 36, maxLength: 36}}
      required: [id]
      additionalProperties: false
    usageInstructions: Read the source contract and actual saved source first. Use returned IDs and baseRevision, and requestKey copied unchanged from the just-read source-contract response per exact edit intent. Retry an uncertain result unchanged. Brief edits never generate a clip; generation requires a separate explicit request and its existing approval.
    tags: [vids, editing, source]

  - name: vids-source-edits
    displayName: Vids Source Edits
    type: api
    category: creative
    description: >-
      Apply typed edits to an actual saved generation brief at its exact revision.
      A prompt change uses {"op":"set-brief","values":{"prompt":"requested prompt"}} in operations.
      Use op, never type; prompt belongs inside values. Never dispatches generation or changes finished media.
    executor: {executorType: api, apiEndpoint: "POST /api/vids/source-projects/{input.id}/edits"}
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties: {id: {type: string, minLength: 36, maxLength: 36}, baseRevision: {type: integer, minimum: 1, maximum: 99}, requestKey: {description: "Copy requestKey unchanged from the just-read editing contract response for this new edit; never invent it. Read a fresh contract for each new intent; retry an uncertain result with the identical key and body.", type: string, format: uuid, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$', minLength: 36, maxLength: 36}, operations: {type: array, minItems: 1, maxItems: 16, items: {type: object}}}
      required: [id, baseRevision, requestKey, operations]
      additionalProperties: false
    usageInstructions: Read the source contract and actual saved source first. Use returned IDs and baseRevision, and requestKey copied unchanged from the just-read source-contract response per exact edit intent. Retry an uncertain result unchanged. Brief edits never generate a clip; generation requires a separate explicit request and its existing approval.
    tags: [vids, editing, source]

  - name: vids-jobs
    displayName: My Vids Jobs
    type: api
    category: creative
    description: The person's Vids clip, story and brand jobs, newest first, with each job's status, prompt and result. Read-only.
    executor: { executorType: api, apiEndpoint: "GET /api/vids/jobs" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema: { type: object, properties: {} }
    usageInstructions: Call with {} when the person asks what videos they have made or how a job is doing. Name only jobs this returns.
    tags: [vids, route-backed]

  - name: vids-generate-clip
    displayName: Generate a Veo clip
    cardText: Makes one Veo video clip from this prompt on your Vids worker. A clip uses your Google Vids generation quota.
    type: api
    category: creative
    description: Generate one Veo video clip from a shaped prompt on the person's registered Vids worker. Held for the person's approval; a clip uses their Google Vids quota.
    executor: { executorType: api, apiEndpoint: "POST /api/vids/jobs" }
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        prompt: { type: string, minLength: 1, maxLength: 10000, description: The shaped Veo prompt (subject, action, setting, camera, lighting, mood). }
        orientation: { type: string, enum: [Landscape, Portrait, Square], description: "Landscape, Portrait, or Square." }
        insertMode: { type: string, enum: [Insert, Extend, none], description: "How to place the clip on the timeline: Insert (new scene), Extend (continue last scene), or none (do not place)." }
      required: [prompt]
    usageInstructions: >-
      Shape the prompt first, then call this once for the clip the person asked for; the approval card is their
      confirmation. A 503 answer means no Vids worker is online: say so plainly. Never say a clip was made until
      vids-jobs shows it done.
    tags: [vids, route-backed, approval-required]

  - name: vids-brand-graphic
    displayName: Make a brand intro or graphic
    cardText: Makes a brand intro or graphic from this brief on your Vids worker.
    type: api
    category: creative
    description: Make a brand intro (brandMode intro) or a still brand graphic (brandMode graphic) from a brief on the person's Vids worker. Held for the person's approval.
    executor: { executorType: api, apiEndpoint: "POST /api/vids/brand" }
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        confirm: { type: boolean, const: true }
        brief: { type: string, minLength: 1, maxLength: 2000 }
        brandMode: { type: string, enum: [intro, graphic], description: "intro or graphic." }
      required: [confirm, brief]
    usageInstructions: Call once with {"confirm":true,"brief":...,"brandMode":"intro"|"graphic"}. A 503 answer means no Vids worker is online; say so.
    tags: [vids, route-backed, approval-required]

  - name: vids-generate-story
    displayName: Produce a multi-scene story
    cardText: Queues a multi-scene story video on your Vids worker. Story generation uses your Google Vids generation quota.
    type: api
    category: creative
    description: Produce a multi-scene Extend story on the person's registered Vids worker. Supply a library storyId, a custom title and script, or leave both empty for the next unproduced library story. Held for the person's approval.
    executor: { executorType: api, apiEndpoint: "POST /api/vids/story" }
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        storyId: { type: string, minLength: 1, maxLength: 256, description: "Library story slug (e.g. tortoise-and-hare). Omit to use title and script or the next library story." }
        title: { type: string, minLength: 1, maxLength: 1000, description: "Custom story title (pair with script)." }
        script: { type: string, minLength: 1, maxLength: 50000, description: "Custom story script (pair with title)." }
        orientation: { type: string, enum: [Landscape, Portrait, Square], description: "Landscape, Portrait, or Square." }
        beats: { type: integer, minimum: 1, maximum: 100, description: "Optional scene count (1 to 100)." }
      additionalProperties: false
    usageInstructions: >-
      Call once with storyId, title and script, or {} for the next library story; the approval card is their
      confirmation. A 503 answer means no Vids worker is online: say so plainly. Never say a story was made until
      vids-jobs shows it done.
    tags: [vids, route-backed, approval-required]

  - name: vids-export-status
    displayName: Finished export status
    type: api
    category: creative
    description: Read the attach and publication status (including SHA-256 digest, previewUrl and publicUrl) for a finished Vids job's export. Read-only.
    executor: { executorType: api, apiEndpoint: "GET /api/vids/jobs/{input.id}/artifact" }
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        id: { type: string, format: uuid, minLength: 36, maxLength: 36, description: "The finished job's job_id UUID from vids-jobs." }
      required: [id]
      additionalProperties: false
    usageInstructions: Call with the finished job's job_id from vids-jobs before proposing publish, revoke, or remove. Report whether an export is attached, whether attachments are supported on this installation, and whether a public link is active.
    tags: [vids, route-backed]

  - name: vids-publish-export
    displayName: Publish a finished export link
    cardText: Publishes a revocable public link for this finished video export after verifying its SHA-256 digest.
    type: api
    category: creative
    description: Publish a revocable public video link for a finished Vids job export using its reviewed SHA-256 digest. Held for the person's approval.
    executor: { executorType: api, apiEndpoint: "POST /api/vids/jobs/{input.id}/artifact/publish" }
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        id: { type: string, format: uuid, minLength: 36, maxLength: 36, description: "The finished job's job_id UUID." }
        confirm: { type: boolean, const: true }
        sha256: { type: string, minLength: 64, maxLength: 64, pattern: '^[a-f0-9]{64}$', description: "The exact 64-hex SHA-256 digest returned by vids-export-status." }
      required: [id, confirm, sha256]
      additionalProperties: false
    usageInstructions: >-
      Call vids-export-status first to read the attached export's exact sha256, then call vids-publish-export
      once with {"id":...,"confirm":true,"sha256":...}. Never invent a digest.
    tags: [vids, route-backed, approval-required]

  - name: vids-revoke-export
    displayName: Revoke a published export link
    cardText: Revokes the public link for this finished video export immediately.
    type: api
    category: creative
    description: Revoke the active public video link for a finished Vids job export. Held for the person's approval.
    executor: { executorType: api, apiEndpoint: "POST /api/vids/jobs/{input.id}/artifact/unpublish" }
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        id: { type: string, format: uuid, minLength: 36, maxLength: 36, description: "The finished job's job_id UUID." }
        confirm: { type: boolean, const: true }
      required: [id, confirm]
      additionalProperties: false
    usageInstructions: >-
      Call vids-export-status first to confirm the export has a public link, then call vids-revoke-export
      once with {"id":...,"confirm":true}.
    tags: [vids, route-backed, approval-required]

  - name: vids-remove-export
    displayName: Remove an attached finished export
    cardText: Permanently removes the private finished MP4 export attached to this job. Revoke any public link first.
    type: api
    category: creative
    description: Remove the attached private finished MP4 export for a Vids job (must be unpublished first). Held for the person's approval.
    executor: { executorType: api, apiEndpoint: "DELETE /api/vids/jobs/{input.id}/artifact" }
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        id: { type: string, format: uuid, minLength: 36, maxLength: 36, description: "The finished job's job_id UUID." }
        confirm: { type: boolean, const: true }
      required: [id, confirm]
      additionalProperties: false
    usageInstructions: >-
      Call vids-export-status first. If publicUrl is active, revoke it with vids-revoke-export before calling
      vids-remove-export with {"id":...,"confirm":true}.
    tags: [vids, route-backed, approval-required]

  - name: vids-cancel-job
    displayName: Cancel a Vids job
    cardText: Cancels this queued or running Vids job and asks the worker to stop it.
    type: api
    category: creative
    description: Cancel an owned queued or running Vids job by job_id. Held for the person's approval.
    executor: { executorType: api, apiEndpoint: "POST /api/vids/jobs/{input.id}/cancel" }
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        id: { type: string, format: uuid, minLength: 36, maxLength: 36, description: "The queued or running job's job_id UUID from vids-jobs." }
        reason: { type: string, minLength: 1, maxLength: 500, description: "Optional reason for cancelling the job." }
      required: [id]
      additionalProperties: false
    usageInstructions: >-
      Call vids-jobs first to confirm the job_id and that it is queued or running, then call vids-cancel-job once.
    tags: [vids, route-backed, approval-required]

  - name: vids-retry-job
    displayName: Retry a Vids job
    cardText: Retries this failed or cancelled Vids job as a new queued job on your Vids worker.
    type: api
    category: creative
    description: Retry an owned failed or cancelled Vids job by job_id, queuing a new job while preserving the original job row. Held for the person's approval.
    executor: { executorType: api, apiEndpoint: "POST /api/vids/jobs/{input.id}/retry" }
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        id: { type: string, format: uuid, minLength: 36, maxLength: 36, description: "The failed or cancelled job's job_id UUID from vids-jobs." }
      required: [id]
      additionalProperties: false
    usageInstructions: >-
      Call vids-jobs first to confirm the job_id and that its status is failed or cancelled, then call
      vids-retry-job once. A 503 box_required answer means no Vids worker is online: say so plainly.
    tags: [vids, route-backed, approval-required]

  - name: vids_generate
    displayName: Generate a Veo clip
    type: cli
    category: media
    description: >-
      Generate an AI video clip in Google Vids from a prompt and place it on the
      timeline. Runs on the remote Vids worker machine's Chrome.
    executor:
      executorType: cli
      cliCommand: node /app/scripts/oshal-vids.js generate {input}
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        prompt: { type: string, description: "What to generate (the bot will optimize it)" }
        orientation: { type: string, description: "Landscape | Portrait | Square" }
        insertMode: { type: string, description: "Insert | Extend | none" }
      required: [prompt]
    routingTags: [vids, veo, video, generate]
    skills: [veo-prompt-craft, browser-operate]
    tags: [vids-studio]

# ─────────────────────────────────────────────────────────────────────────────
# ROUTES — the packaged surface router, mounted /api/vids on activation. (In core
# server.ts this was createVidsRoutes behind serviceSecretOr(requiresAuth); the
# same posture here so browsers use OIDC while in-container vids_generate / creative_*
# callers present BOTH X-Service-Secret and the canonical X-Oshal-User-Sub-B64 owner
# assertion. Fleet authentication alone never selects a user's queue — ADR-085 D2.)
# ─────────────────────────────────────────────────────────────────────────────
routes:
  - module: routes/source-projects.mjs
    factory: createSourceProjectRoutes
    mountPath: /api/vids
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/vids/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/vids/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/vids-routes.js
    factory: createVidsRoutes
    mountPath: /api/vids
    auth: service-or-oidc   # what core server.ts mounted (ADR-085 D2)
    requiresAuth: true
    requiresContext: true
  # Public, read-only finished-vids surface. Its one route is GET /<token>/video.mp4, where the
  # token is a random 64-hex value minted per artifact when the owner publishes a finished export.
  # Attach, publish, revoke (unpublish) and remove are owner-authenticated controls under
  # /api/vids/jobs/<jobId>/artifact above: publish needs explicit confirmation plus the reviewed
  # SHA-256 digest, revoke clears the token, and a published export cannot be removed until it is
  # revoked. The anonymous lookup runs with no owner or operator identity and reads the forced-RLS
  # vids_artifacts row by that token alone, then serves only its immutable MP4 bytes. There is no
  # directory, listing, job, prompt or queue data here; a malformed, unknown or revoked token is a
  # 404 and responses are never cached. Mounted under /api/ (NOT /public) because the loader (D2)
  # requires a public mount at /api/<name>.
  - module: routes/vids-public-routes.js
    factory: createVidsPublicRoutes
    mountPath: /api/vids-public
    auth: public
    requiresAuth: false
    requiresContext: true
    anonymousRoutes:
      - method: GET
        path: /:token/video.mp4
      - method: HEAD
        path: /:token/video.mp4

# Cockpit ribbon tile + embedded surface (the job queue, served by the route above).
ui:
  static:
    - toolName: vids-studio
      label: Vids Studio
      icon: codicon codicon-device-camera-video
      iframeUrl: /api/vids/app
      section: top

# The vids_jobs ledger + worker-bot seed. COPY of the kernel-owned 059 creates fresh
# installs; 100 upgrades installations that already recorded 059. Both make ownership
# mandatory and enforce owner/operator access with FORCE RLS.
migrations:
  - migrations/006-editor-source-projects.sql
  - migrations/native/006-editor-source-projects.sql
  - migrations/059-vids-platform.sql
  - migrations/100-vids-owner-rls.sql
  - migrations/101-vids-artifact-publication.sql
  - migrations/native/001-vids.sql
# The native kernel applies the native file above in place of 059-101 (agents-table seed, RLS policies and a pg_roles-guarded GRANT are PostgreSQL-only).
nativeMigrations:
  - id: migrations/006-editor-source-projects.sql
    native: skip
    reason: Native final schema retains physical original-person scope; PostgreSQL additionally forces owner RLS.
  - id: migrations/059-vids-platform.sql
    native: skip
    reason: "Its job table and indexes are in migrations/native/001-vids.sql; it seeds the platform agents table, which is not a package table (the native kernel registers vids-operator from this manifest's bots: block), and its RLS policy is PostgreSQL-only."
  - id: migrations/100-vids-owner-rls.sql
    native: skip
    reason: "It backfills legacy blank owners, sets user_sub NOT NULL (native 001 declares it NOT NULL from the start) and installs RLS policies, which are PostgreSQL-only; the native per-person scope keeps each person's jobs their own."
  - id: migrations/101-vids-artifact-publication.sql
    native: skip
    reason: "Its artifact table and exact-owner unique key are in migrations/native/001-vids.sql; its RLS policies and pg_roles-guarded GRANT are PostgreSQL-only."

# Tickets of type 'vids' route to the operator bot.
# The bot a Jarvis creation request goes to (its own workflow bot).
chatBot: vids-operator

ticketType: vids
workflow:
  name: Vids Studio Pipeline
  pipeline: vids
  workerBot: vids-operator
  phases:
    - intake     # scope the idea + inputs into a shot
    - plan       # optimize into a Veo prompt + settings
    - generate   # drive the remote Chrome to render + place the clip
    - deliver    # report the placed clip + what was learned

ribbon:
  hideFrameworkItems:
    - addressbook
    - logs
    - operations
  defaultView: vids-studio

integrations:
  offers:
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
    - id: prepare-episode
      label: Prepare a video episode
      targetApp: video
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
  accepts:
    - id: prepare-brief
      contextType: research-brief
      version: 1
      surface: vids-studio
      fields:
        - title
        - notes
        - sourceUrl

summary:
  path: /api/vids/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items
