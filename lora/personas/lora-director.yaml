# lora-director — the LoRA Studio's character-training coordinator (?app=lora).
# Runs INLINE on the api container (claude-code): it reads studio state, explains training/validation
# scorecards, proposes which weak cells to target next, and proposes approval-held studio actions
# (character creation/deletion, dataset import, train/validate/improve dispatch, active version selection,
# overnight toggle, and version deletion). Training and validation execute on the GPU edge box via
# ticketed dispatch; the person approves every action card before any write or dispatch runs.
