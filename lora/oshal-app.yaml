# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — lora ("LoRA Studio")
# Carved out of OSHAL core 2026-07-17 (ADR-085 Wave 1 carve #3).
#
# Train and iteratively improve a REUSABLE CHARACTER (a "sprite") so it stays
# consistent across many generated images and short videos for building stories.
#
# The lora-director bot reasons over the pipeline (explains scorecards, recommends
# which weak poses/angles to target next). The actual work runs off the api:
# dataset generation + validation go over the GPU box's ComfyUI HTTP API (free),
# and LoRA training (kohya) runs on the GPU box ONLY via the worker node's gated
# shell.exec (ADR-070 privilege rule), dispatched through the shared remote-client
# registry. The controller stores version + score metadata (oshal_lora_*); the box
# keeps the heavy artifacts (.safetensors / datasets / samples).
#
# AUTH SHAPE (first package to exercise the D2 split-mountPath pattern): the
# box→controller callback mounts at /api/lora/ingest with auth: public on the kernel's
# signed-package-callbacks rail (1.7.0). The rail admits POST only and runs the
# package's callbackVerifier before any other code: POST /, POST /cell-image and the
# worker's staged-image download (POST /dataset-download/:id) must carry a
# per-dispatch callback grant (lora-callback-grants.ts). Every train/validate/improve/
# overnight/dataset dispatch mints one grant bound to its owner (subject AND issuer),
# character, ticket and callback kinds, hands it to the worker in the
# OSHAL_LORA_CALLBACK_GRANT environment variable, and each request is HMAC-signed with a
# fresh nonce and timestamp. Expired, revoked, replayed, cross-owner, cross-character and
# wrong-kind requests are refused, and the fleet service secret alone is not accepted.
# The verifier returns only the grant owner; the kernel refreshes that owner, requires
# the authorization.yaml permission bound to the route (lora.execute) and runs the
# handler as that owner. The studio mounts at /api/lora with auth: oidc.
# The loader forbids mixing modes on ONE mountPath — splitting is the sanctioned
# carve shape (see swarm-app-loader.ts's own /api/lora comment).
#
# Box-side scripts (train-lora.py / validate-lora.py / make-targeted-batch.py /
# overnight-loop.py) stay in the FRAMEWORK repo's scripts/comfyui-edge/ (a dir
# shared with Video Studio, deployed to the box's repo clone) — the dispatch
# references them by name on the box, not by package path.
# ─────────────────────────────────────────────────────────────────────────────

name: lora
suite: ai-creative   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features:
    - id: training-ticket-review
      unit: training loop ticket
      tier: T2
      generation: local
      degrade: disable
displayName: LoRA Studio
description: >-
  Train a reusable character (a "sprite") from images and captions, validate it on a fixed held-out
  matrix, and improve it by regenerating data aimed at its weak spots and retraining — with every
  version scored objectively so "better" is a number. Generation/validation run free on your GPU box;
  paid escalation never happens without an approval gate.
version: 1.7.4
status: active

# Per-app skin — indigo so the model-lab reads distinct from the sakura Video Studio.
theme: indigo

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: lora
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
smoke:
  - name: package-readiness
    method: GET
    path: /api/lora/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# Kernel skills only (logger, database bootstrap, authz, remote-client registry via
# @/app alias) — no app, tool, or connector dependencies.
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: []
    tools: []
    connectors: []

# Kernel skills this app declares (ADR-090 uses: contract, fail-closed at load).
# `app-dependencies` is the compatibility floor for the tiered dependencies block above: a core
# that predates required/optional refuses this package instead of installing it without its
# required dependencies and without its connector allow-list.
uses:
  - app-dependencies
  - test-catalog
  # The dataset import redeems a Send-to handle through core's handle routes with the caller's own
  # cookie or PAT; core's authenticated relay then rechecks the exact principal and source rights.
  # Naming the skill makes a core without that relay refuse this package.
  - authenticated-artifacts
  # ADR-149 permissions: authorization.yaml binds every route, the director bot and the worker
  # callbacks to named permissions. The loader admits a callbackVerifier only with a catalog.
  - application-authorization
  # The GPU worker has no browser or PAT identity. Its callbacks are admitted by this package's
  # verifier (routes/lora-ingest-routes.js) and run as the grant owner the kernel refreshes; a core
  # without the rail refuses this package instead of refusing every worker request at runtime.
  - signed-package-callbacks

authorization: { version: 1, catalog: authorization.yaml }

testing:
  version: 1
  catalog: tests/test-lab.yaml

# ADR-139 — an image sent from Portrait Studio or another owner-visible source opens LoRA Studio
# so the operator chooses the named character. Import redeems the handle as that signed-in caller,
# checks the bytes (PNG/JPEG/WebP, 10 MiB), stages them owner-scoped and expiring, and the GPU
# worker downloads them with a signed POST to /api/lora/ingest/dataset-download/:id under that
# import's callback grant.
artifacts:
  accepts:
    - id: dataset-image
      label: Add to LoRA dataset
      icon: 🧬
      types: [image/*]
      mode: open
      keywords: [lora, character, dataset, training]
      useWhen: Choose a character in LoRA Studio, then import this owner-owned image into its curated training set.

# Guests never reach the studio (was hardcoded core Tier-C pre-carve). Declaring it
# here is a REQUEST (ADR-085 D4) — unapproved default already blocks guest writes.
guestTier: blocked

# Server-side TTS defers to the swarm default (the studio is text/visual, no narration of its own).
voice:
  tts:
    provider: swarm-default

# The LoRA Studio's bot — reason-only, inline on the api (claude-code), own agent_id
# (own cost line), registered by the loader from this manifest (zero core-registry edits).
bots:
  - agentId: a0000000-0000-0000-0000-000000000065
    name: lora-director
    persona: personas/lora-director.yaml
    role: lora/model-trainer
    capabilities:
      - lora-training-direction
      - dataset-curation
      - validation-analysis
      - character-consistency

# Compiled-JS routes (built from src-routes/ by `oshal-app build`). Split mounts —
# see the AUTH SHAPE note in the header.
routes:
  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/lora/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/lora/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

  - module: routes/lora-ingest-routes.js
    factory: createLoraIngestRoutes
    callbackVerifier: createLoraCallbackVerifier   # signed-package-callbacks: POST only, grant-signed, runs as the grant owner
    mountPath: /api/lora/ingest
    auth: public
    requiresContext: true
  - module: routes/bot-lora-routes.js
    factory: createBotLoraRoutes
    mountPath: /api/lora
    auth: oidc
    requiresContext: true

  - module: routes/bot-lora-routes.js
    factory: createLoraScheduleRoutes
    mountPath: /api/lora/schedule
    auth: service
    requiresContext: true

schedules:
  - id: lora-autonomous-overnight
    cron: "0 2 * * *"
    description: Run owner-enabled LoRA overnight improvement loops and park morning reviews.
    target: service-route
    runsAs: system
    route: /api/lora/schedule
    handler: runLoraOvernightSchedule
    body: {}

ui:
  static:
    - toolName: lora-studio
      label: LoRA Studio
      icon: codicon codicon-circuit-board
      iframeUrl: /api/lora/ui
      section: top

# Trim the ribbon to the studio + the essentials. Hide the generic framework items.
ribbon:
  hideFrameworkItems:
    - chat
    - calendar
    - addressbook
    - dashboard
    - operations
  defaultView: lora-studio

# DATABASE MIGRATIONS — applied idempotently on install/activation
# (app_package_migrations tracks them). The route ALSO carries the identical lazy
# ensureLoraSchema as belt-and-braces, matching core behavior. Migration 100 upgrades
# installations that already recorded 058; both enforce mandatory ownership + FORCE RLS.
# Migration 102 adds the rest of a character identity - its own negative prompt and its own
# contrastive structural pair - which the box scripts used to carry as constants.
# Migration 105 adds the per-dispatch callback grants and their single-use nonces. Migration 106
# records the issuer of each grant's owner (and of the owner who enabled autonomous mode), which
# the signed-callback verifier returns for the kernel to refresh.
migrations:
  - migrations/058-lora-studio.sql
  - migrations/100-lora-owner-rls.sql
  - migrations/101-lora-cell-images.sql
  - migrations/102-lora-character-identity.sql
  - migrations/103-lora-dataset-images.sql
  - migrations/104-lora-dataset-staging.sql
  - migrations/105-lora-callback-grants.sql
  - migrations/106-lora-callback-identity.sql

# WORKFLOW — training tickets of type 'lora-train' route to the director, which authorizes the
# box-side kohya run via the worker node's gated shell.exec (lora-train-dispatch, vendored).
ticketType: lora-train
workflow:
  name: LoRA Training Pipeline
  workerBot: lora-director

summary:
  path: /api/lora/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items

integrations:
  offers:
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
