# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | Register all shipped package tests with explicit runner and fixture boundaries; retain readiness smoke identity.
# 2 | maintainer@emeraldcoastsystemsgroup.com | 1.1.3: register the company audience view contract and behaviour test (ADR-164 D6) for the Business shells.
# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.1.4: the family audience view registered beside the company one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
# 4 | maintainer@emeraldcoastsystemsgroup.com | Register the says-what-exists suite: the home summary never says "No saved work" beside a saved benchmark, and "Ask the analyst" waits for a finished run.
# 5 | maintainer@emeraldcoastsystemsgroup.com | Register the job-edit suite: Save edits the selected job through PATCH /jobs/:id (owner only) instead of creating a duplicate, and Delete asks first.
# 6 | maintainer@emeraldcoastsystemsgroup.com | job-edit also covers the run-spec guard: a job with a run refuses a changed prompt, rubric or reference (409 spec-has-runs) so its report keeps pairing the run with the prompt it raced, and Save offers to save the changes as a new job.
# 7 | maintainer@emeraldcoastsystemsgroup.com | Register the stale-report suite: a report whose run started before the job's prompt, rubric or reference last changed is marked out of date, and the console marks unsaved edits to them as not yet run.
# 8 | maintainer@emeraldcoastsystemsgroup.com | Register the review-eyebrow suite: the Review page's eyebrow names the manifest suite's room (sweep 8 read 'Learning and recreation' on an Engineering app).
