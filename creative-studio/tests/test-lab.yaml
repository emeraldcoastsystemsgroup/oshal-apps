# 2 | maintainer@emeraldcoastsystemsgroup.com | Register the family audience view contract (ADR-164 D6): the static kit contract plus the behaviour over the real home-summary route (one read, plain stats and story tiles, every named state, the module script gated).
# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.2.3: the company audience view registered beside the family one (ADR-164 D6); the audience-view case covers both and the browser fixture expects the same card under each.
version: 1
cases:
  - id: creative-theme-browser
    name: Stories follows the portal palette
    purpose: Render the actual review page with real shared theme and handoff modules using only synthetic saved evidence.
    level: browser
    runner:
      kind: playwright
      scope: package
      files:
        - tests/browser/creative-theme-proof.mjs
    expected:
      - All twelve live portal palettes retain the original document and unsent title, brief and source link.
      - Standalone and optional Create colors follow the shared contract without persisting inherited preferences.
      - Recorded evidence and edited connected drafts retain their existing handoff behavior without business writes.
      - Controls remain readable across palettes and usable at mobile and laptop widths.
    prerequisites:
      - runner:playwright
      - browser:chromium
      - core:shared-theme-assets
      - fixture:create-theme-css
    sideEffects: none
    isolation:
      mode: disposable
      fixtures:
        - tests/browser/creative-theme-fixture.mjs
      cleanup: Close every browser context and ephemeral HTTP server; reject external requests and every business mutation.
    limits:
      timeoutMs: 120000
      maxMemoryMb: 1024
    installation: never
  - id: package-readiness
    name: Installed package readiness
    purpose: Check the existing metadata-only smoke without providers or user-data reads.
    level: integration
    runner:
      kind: smoke
      smoke: package-readiness
    expected:
      - The installed creative-studio identity satisfies the manifest smoke assertions.
    prerequisites: []
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: safe-smoke
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its family (Home shell) and company (Business shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the family view makes one read, GET /api/creative-studio/home-summary; it never writes, never fetches the connected-actions plan and never starts a story.
      - Fed by the package's real home-summary route, the story counts read as plain stats and the newest stories as tiles with plain status words and timestamps; no tile starts or hands off anything.
      - Waiting or being made (one count, since the route counts queued and running together), finished in five days, nothing waiting or being made, no story videos yet and a count that could not be checked each read as what they are.
      - When the only active story is queued, neither the title nor any stat says a story is being made; its tile reads Waiting its turn.
      - Signed out, refused, every source failed, a non-JSON failure and an unreachable server each read as what they are.
      - Under the family view the module script binds no handoff listener, mounts no connected actions, binds no Refresh handler and reads nothing; the full page still runs every start step.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never
