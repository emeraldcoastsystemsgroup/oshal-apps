# CHANGE LOG: request-key | maintainer@emeraldcoastsystemsgroup.com | 1.3.4: issue fresh contract request keys and reject edit keys outside the existing backend UUID contract.
# 1.3.3 | maintainer@emeraldcoastsystemsgroup.com | Own the production coordinator while keeping Vids optional and source editing independent.
# 1.3.2 | maintainer@emeraldcoastsystemsgroup.com | Admit owned story source editing through named grants; keep production and optional Vids authority separate.
# CHANGE LOG
# 1 | maintainer@emeraldcoastsystemsgroup.com | Import the shared rendering worker from its single owner, vids, instead of overwriting bot ownership.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Name the screen's concierge (chatBot: vids-operator, the required vids bot this app already imports) so the shell offers a live conversation beside the Creative Studio screen; it declared no bot or chatBot, so its concierge panel was hidden.
# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.2.6: the review page no longer forces color-scheme: dark, so its native form controls follow the portal theme like the rest of the page.

# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — creative-studio ("Creative Studio")
# Carved out of OSHAL core 2026-07-19 (ADR-085 Wave 3, "skill with a surface" —
# ONLY the surface carves; this app never had a route of its own). This package is
# the app: the manifest (ticketType 'creative-story' + the graph workflow), the
# three creative_* CLI tools, the Creative Studio ribbon tile (a view over the Vids
# job queue at /api/vids/app), and a package COPY of the vids-operator persona for
# the registrar.
#
# What STAYS framework-resident per ADR-093 (this package ships none of it):
#   - the SHARED vids-operator remote-client desktop worker
#     (packages/oshal-vids-operator → `npx oshal-vids worker`) + its registry
#     entries in BOTH swarm-bot-registry blocks — all four vids-family apps
#     reference it (the social/communications-bot precedent);
#   - scripts/oshal-vids.js (the CLI the creative_* tools shell to) — kernel-owned;
#   - the /api/vids dispatch surface + vids_jobs ledger (migration 059) this app's
#     tile reads — owned by the 'vids' app (declared in dependencies.apps);
#   - the ADR-080 Extend-story content library + production engine, which lives in
#     the desktop worker package (content.next / content.produce tools), not here.
# Framework: OSHAL (see docs/adr/085-remote-app-packages-and-registries.md)
# ─────────────────────────────────────────────────────────────────────────────

# 4 | maintainer@emeraldcoastsystemsgroup.com | 1.3.0: durable original-owned editable source projects, typed operations, saved AI selection and compact shared editor.
# 5 | maintainer@emeraldcoastsystemsgroup.com | 1.4.0: the design standard (docs/ux/design-standard.md; UX audit decision creative-studio--creative-studio; REFP CONVENTIONS §5.7). The story brief is the work under one app row with Open episode workflow as its one primary; no generic subtitle; the page declares its contract and does not repeat the name under the Today bar; one copy of each field; scenes are list rows with a ⋯ row menu; the counters are one meta line; Open Vids Studio leaves the frame for the cockpit; menus are opaque popovers that Back closes; "discard unsaved changes?" asks in the page. The seven reference-product functions are greyed "Not available yet" controls in their reference places (RP-CRS-01 to -07).
# 6 | maintainer@emeraldcoastsystemsgroup.com | 1.4.1: the review page's buttons are on the design standard's scale (docs/ux/design-standard.md §4.1; Roger F14, 2026-11-06: "not following the general sizing of objects"): body-size labels at 600 (15px on a desktop with a fine pointer), 44px tall with 16px sides, radius m, a solid secondary fill with the control edge, and the label on one line, so a button hugs its label instead of wrapping into a two-line bubble. The app row is a toolbar: 36px with 12px sides on a desktop with a fine pointer and 4px gaps on a phone, so the one primary keeps its label on one line; Undo, Redo and More are icon buttons with no fill or edge; a saved source project is a list row, not a bordered button three lines tall.
# 7 | maintainer@emeraldcoastsystemsgroup.com | 1.4.2: the Saved pane is 180px beside an open concierge and under 1100px, narrower than "Refresh evidence" at 15px, so a page button now ends in an ellipsis instead of running past the pane (found on the trial at 1440x900 with the concierge open: the button ran over the pane's edge). The browser case at 1080x800 guards it.
# 8 | maintainer@emeraldcoastsystemsgroup.com | 1.4.3: save titled story briefs and scene edits automatically with a Saved caption in the app row instead of a Save source button (UX audit creative-studio--creative-studio).
name: creative-studio
suite: ai-creative   # ADR-097: primary catalog shelf (tools keep their own category:)
chatBot: story-editor # Source editing is owned here; generation still uses the declared Vids worker.
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features:
    - id: story-video
      unit: story video
      tier: T2
      generation: hosted
      degrade: disable
displayName: Creative Studio
status: active
description: "Edit and save story briefs and selectable storyboard scenes, with revision history, an AI partner and real editing handoffs."
scope: public
ticketType: creative-story
theme: amber
version: 1.4.3
authorization:
  version: 1
  catalog: authorization.yaml
testing:
  version: 1
  catalog: tests/test-lab.yaml
uses: [test-catalog, app-dependencies, application-authorization]

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: creative-studio
  ref: main

# CORE-05 install readiness is service-authenticated and reads package metadata only. It never
# touches user data, calls a provider, mutates state, or spends tokens.
routes:
  - module: routes/source-projects.mjs
    factory: createSourceProjectRoutes
    mountPath: /api/creative-studio
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false
  - module: routes/review.js
    factory: createReviewRoutes
    mountPath: /api/creative-studio
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/home-summary.js
    factory: createHomeSummaryRoutes
    mountPath: /api/creative-studio/home-summary
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/creative-studio/_smoke
    auth: service
    requiresContext: true
    requiresAi: false

smoke:
  - name: package-readiness
    method: GET
    path: /api/creative-studio/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# Source editing is self-contained. Generation uses the separately authorized optional Vids integration.
dependencies:
  required:
    apps: []
    bots: []
    tools: []
    connectors: []
  optional:
    apps: [video, portrait-studio, lora, vids]
    bots:
      - app: vids
        name: vids-operator
    tools: []
    connectors: []

# ─────────────────────────────────────────────────────────────────────────────
# Vids owns its optional remote worker. The production coordinator below belongs here.
tools:
  - name: creative-studio-source-list
    displayName: Source List
    type: api
    category: creative
    description: List this original owner’s saved editable source projects.
    executor:
      executorType: api
      apiEndpoint: GET /api/creative-studio/source-projects
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    usageInstructions: Read the source-contract and source-read first. Use returned IDs and revision, copy requestKey from the just-read source-contract response for each exact edit intent, and retry an uncertain result with the identical requestKey and body. A conflict changes nothing; reread before proposing changes. The browser saves before assistant handoff and refreshes only when its draft is unchanged.
    routingTags: [creative, editing, storyboard, source]
  - name: creative-studio-source-contract
    displayName: Source Contract
    type: api
    category: creative
    description: Read the typed source edit contract before changing briefs or storyboard scenes.
    executor:
      executorType: api
      apiEndpoint: GET /api/creative-studio/source-projects/contract
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    usageInstructions: Read the source-contract and source-read first. Use returned IDs and revision, copy requestKey from the just-read source-contract response for each exact edit intent, and retry an uncertain result with the identical requestKey and body. A conflict changes nothing; reread before proposing changes. The browser saves before assistant handoff and refreshes only when its draft is unchanged.
    routingTags: [creative, editing, storyboard, source]
  - name: creative-studio-source-read
    displayName: Source Read
    type: api
    category: creative
    description: Read the actual owned source project, stable scene IDs, current revision and immutable history.
    executor:
      executorType: api
      apiEndpoint: GET /api/creative-studio/source-projects/{input.id}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {id: {type: string, minLength: 36, maxLength: 36}}
      required: [id]
      additionalProperties: false
    usageInstructions: Read the source-contract and source-read first. Use returned IDs and revision, copy requestKey from the just-read source-contract response for each exact edit intent, and retry an uncertain result with the identical requestKey and body. A conflict changes nothing; reread before proposing changes. The browser saves before assistant handoff and refreshes only when its draft is unchanged.
    routingTags: [creative, editing, storyboard, source]
  - name: creative-studio-source-edits
    displayName: Source Edits
    type: api
    category: creative
    description: >-
      Apply bounded typed source operations to an owned project at the exact revision.
      A scene text change uses {"op":"set-scene","id":"actual scene UUID","values":{"text":"requested text"}} in operations.
      Use op, never type, and substitute the actual source-read ID. Never renders or changes generated evidence.
    executor:
      executorType: api
      apiEndpoint: POST /api/creative-studio/source-projects/{input.id}/edits
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties: {id: {type: string, minLength: 36, maxLength: 36}, baseRevision: {type: integer, minimum: 1, maximum: 99}, requestKey: {description: "Copy requestKey unchanged from the just-read editing contract response for this new edit; never invent it. Read a fresh contract for each new intent; retry an uncertain result with the identical key and body.", type: string, format: uuid, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$', minLength: 36, maxLength: 36}, operations: {type: array, minItems: 1, maxItems: 16, items: {type: object}}}
      required: [id, baseRevision, requestKey, operations]
      additionalProperties: false
    usageInstructions: Read the source-contract and source-read first. Use returned IDs and revision, copy requestKey from the just-read source-contract response for each exact edit intent, and retry an uncertain result with the identical requestKey and body. A conflict changes nothing; reread before proposing changes. The browser saves before assistant handoff and refreshes only when its draft is unchanged.
    routingTags: [creative, editing, storyboard, source]
  # Produce the NEXT unproduced story from the rotating library (the cycler entry).
  - name: creative_produce_next
    displayName: Produce the next story video
    type: cli
    category: media
    description: >-
      Make the next unproduced kid-safe story video: rotate the library (fables /
      fairytales / famous sayings), animate the ~100-word story across ~10
      continuous Google Vids EXTEND scenes on the remote node, download the MP4,
      and save it to the content folder + Google Drive. Returns which story was
      made, scene count, local path, and Drive status. Never fabricates a result.
    executor:
      executorType: cli
      cliCommand: node /app/scripts/oshal-vids.js story-next {input}
    defaultAuthMode: auto
    timeoutMs: 2400000
    inputSchema:
      type: object
      properties:
        beats: { type: number, description: "Scenes per story (default 10)" }
        node: { type: string, description: "Override the Vids worker (clientId or name); default auto-picks it" }
    usageInstructions: >-
      Call with no arguments ({}) to produce the next story in the rotation. The
      library rotates across fables, fairytales, and famous sayings so the feed
      stays varied; already-produced stories are skipped.
    routingTags: [creative, story, video, kids, vids]
    skills: [veo-prompt-craft, browser-operate]
    tags: [creative-studio]

  # Produce a SPECIFIC story (by library id) or an ad-hoc idea.
  - name: creative_produce
    displayName: Produce a specific story video
    type: cli
    category: media
    description: >-
      Animate a specific story across ~10 continuous Extend scenes in Google Vids
      and save it. Pass a library storyId (e.g. tortoise-and-hare,
      raining-cats-and-dogs) or an ad-hoc {title, script}. Returns the local path
      + Drive status.
    executor:
      executorType: cli
      cliCommand: node /app/scripts/oshal-vids.js story {input}
    defaultAuthMode: ask
    requiresApproval: true
    timeoutMs: 2400000
    inputSchema:
      type: object
      properties:
        storyId: { type: string, description: "A library story id" }
        title: { type: string, description: "Ad-hoc story title (with script)" }
        script: { type: string, description: "Ad-hoc ~100-word narration to animate" }
        beats: { type: number, description: "Scenes (default 10)" }
        orientation: { type: string, description: "Landscape | Portrait | Square" }
    routingTags: [creative, story, video]
    skills: [veo-prompt-craft, browser-operate]
    tags: [creative-studio]

  # List what's already been produced (from the content-folder manifests).
  - name: creative_list
    displayName: List produced story videos
    type: cli
    category: media
    description: Read back the dispatched story/clip jobs and their status (from the vids_jobs ledger). The node's own `oshal-vids story --list` reads the content-folder manifests directly.
    executor:
      executorType: cli
      cliCommand: node /app/scripts/oshal-vids.js jobs {input}
    defaultAuthMode: auto
    timeoutMs: 60000
    inputSchema:
      type: object
      properties:
        limit: { type: number, description: "Max entries (default 50)" }
    routingTags: [creative, list]
    tags: [creative-studio]

# Cockpit tile — reuse the Vids job-queue surface (story jobs land in vids_jobs too).
ui:
  static:
    - toolName: creative-studio
      label: Creative Studio
      icon: codicon codicon-sparkle
      iframeUrl: /api/creative-studio/review
      section: top
    # creative.oshal.ai bundle (operator decision 2026-07-31). NOTE: no separate "Vids
    # Studio" tile here — the tile above already IS the vids job-queue surface
    # (dependencies.apps: [vids]), so a second tile at the same iframeUrl would just
    # duplicate it under a different label. Distinct toolNames from each sibling app's
    # own tile (ADR-085 D11).
    - toolName: creative-video
      label: Video Studio
      icon: codicon codicon-device-camera-video
      iframeUrl: /api/video/ui
      section: top
    - toolName: creative-portrait
      label: Portrait Studio
      icon: codicon codicon-person
      iframeUrl: /api/portrait-studio/app
      section: top
    - toolName: creative-lora
      label: LoRA Studio
      icon: codicon codicon-symbol-color
      iframeUrl: /api/lora/ui
      section: top

# A creative-story ticket routes to this package's production coordinator, which calls
# creative_produce_next and reports what it made. autoStart so a scheduled fire
# runs without a human promoting the ticket.
workflow:
  name: Creative Studio Pipeline
  pipeline: graph
  workerBot: creative-producer
  stages:
    - bot: creative-producer
      name: Produce the next story video
  processDefinition:
    name: Creative Studio
    nodeGraph:
      nodes:
        - id: n-start
          type: start
          title: Start
          config:
            triggerMode: manual
        - id: n-produce
          type: execute-agent
          title: Produce the next story video
          config:
            agentBinding: creative-producer
            workType: authored
        - id: n-deliver
          type: deliver
          title: Deliver
          config:
            deliveryMode: standard
      edges:
        - id: e-start-produce
          source: n-start
          target: n-produce
        - id: e-produce-deliver
          source: n-produce
          target: n-deliver
      topologicalOrder:
        - n-start
        - n-produce
        - n-deliver
  autoStart: true

ribbon:
  hideFrameworkItems:
    - addressbook
    - logs
    - operations
  defaultView: creative-studio

summary:
  path: /api/creative-studio/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items

integrations:
  offers:
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
    - id: prepare-episode
      label: Prepare a video episode
      targetApp: video
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
  accepts:
    - id: prepare-brief
      contextType: research-brief
      version: 1
      surface: creative-studio
      fields:
        - title
        - notes
        - sourceUrl

# Source projects require explicit named grants and retain the exact original owner.
migrations:
  - migrations/006-editor-source-projects.sql
  - migrations/native/006-editor-source-projects.sql
nativeMigrations:
  - id: migrations/006-editor-source-projects.sql
    native: skip
    reason: Native final schema retains physical original-person scope; PostgreSQL additionally forces owner RLS.

bots:
  - agentId: f0e5b11c-3d1a-42be-899c-90afcb22b536
    name: story-editor
    persona: personas/story-editor.yaml
    role: creative/source-editing
    capabilities: [storyboard-editing, brief-editing]
  - agentId: 5fb9f7fe-5327-4564-9608-d177ecf60598
    name: creative-producer
    persona: personas/creative-producer.yaml
    role: creative/production-coordination
    capabilities: [story-production]
