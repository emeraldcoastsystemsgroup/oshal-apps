# 1.1.6 | maintainer@emeraldcoastsystemsgroup.com | Declare restricted source editing with paired native public-share and typed-object authorization.
# 1.1.5 | maintainer@emeraldcoastsystemsgroup.com | Preserve existing Brand and Stories administrator members through their named source catalogs.
# 1.1.4 | maintainer@emeraldcoastsystemsgroup.com | Preserve the installed effective Portrait and Video member roles when loading the complete editor catalogs.
