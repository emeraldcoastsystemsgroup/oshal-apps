version: 1
cases:
  - id: package-readiness
    name: Installed package readiness
    purpose: Verify the existing metadata-only package smoke without user data or provider calls.
    level: integration
    runner: { kind: smoke, smoke: package-readiness }
    expected: [The installed portrait-studio readiness marker satisfies the manifest assertions.]
    prerequisites: []
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 15000 }
    installation: never
  - id: catalog-invariants
    name: Style catalog and prompt assertions
    purpose: Verify the compiled style catalog and prompt builder using the existing exported-function harness.
    level: unit
    runner:
      kind: external
      scope: package
      files: [tests/run.js, tests/catalog-invariants.spec.js]
    expected:
      - Preset layer IDs exist and overrides reach the generated prompt.
      - Invalid selections are rejected and notes are sanitized.
    prerequisites: [runner:node, harness:portrait-exported-function]
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 30000, maxMemoryMb: 256 }
    installation: never
  - id: operational-primitives
    name: Retry, timeout and concurrency behavior
    purpose: Exercise the compiled operations primitives without contacting a provider.
    level: unit
    runner:
      kind: external
      scope: package
      files: [tests/run.js, tests/ops.spec.js]
    expected:
      - Only transient failures retry and exhausted attempts propagate their last error.
      - Timeouts reject slow work and the semaphore bounds concurrent work in FIFO order.
    prerequisites: [runner:node, harness:portrait-exported-function]
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 30000, maxMemoryMb: 256 }
    installation: never
  - id: photo-capture-rules
    name: Photo capture and group geometry rules
    purpose: Test the same capture module used by the package surface across supported capability combinations.
    level: unit
    runner:
      kind: external
      scope: package
      files: [tests/run.js, tests/capture.spec.js]
    expected:
      - Live camera, camera-app and upload-only modes reflect available browser capabilities.
      - Image validation, lens selection and group face boxes obey the shared rules.
    prerequisites: [runner:node, harness:portrait-exported-function]
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 30000, maxMemoryMb: 256 }
    installation: never
  - id: export-email-inputs
    name: Export geometry and email input validation
    purpose: Test the closed export-size catalog and recipient validation without generating or sending anything.
    level: unit
    runner:
      kind: external
      scope: package
      files: [tests/run.js, tests/export-email.spec.js]
    expected:
      - Only declared export sizes and exact pixel geometry are accepted.
      - Recipient validation rejects malformed and header-injection inputs.
    prerequisites: [runner:node, harness:portrait-exported-function]
    sideEffects: none
    isolation: { mode: none }
    limits: { timeoutMs: 30000, maxMemoryMb: 256 }
    installation: never
  - id: camera-browser
    name: Camera capture in Chromium
    purpose: Exercise the real package DOM under the Node test harness, over Chromium's own fake capture device and the shared picker asset resolved from the framework checkout.
    level: browser
    runner:
      kind: playwright
      scope: package
      files: [tests/browser/camera-proof.js]
    expected:
      - A secure page with a camera chooses live capture and the modal shows decoded, mirrored frames.
      - A snap replaces the dropzone with the crop stage, offers a retake, and closing the modal ends every camera track.
      - Desktop and phone fallback paths show working controls with accurate explanations and the right lens.
    prerequisites: [runner:playwright, browser:chromium, core:dependencies, harness:oshal-core-root]
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: The recipe closes its browser contexts and ephemeral loopback server; no real camera device is requested.
    limits: { timeoutMs: 120000, maxMemoryMb: 1024 }
    installation: never
  - id: shared-artifact-picker
    name: Shared artifact picker and owner-bound file handoff
    purpose: Reference the core-owned real HTTP, filesystem, handle and Chromium proof against this installed package source.
    level: browser
    runner:
      kind: vitest
      scope: core
      revision: 7ca9d81b6f54e1086bdd8c260f03ecd4d8bbca1a
      files: [tests/unit/artifact-picker.spec.ts]
    expected:
      - Source discovery and file handle redemption respect the caller's ownership and visibility.
      - A real image reaches the package crop stage and cancellation or invalid sources do not mint handles.
    prerequisites: [runner:vitest, browser:chromium, package:portrait-studio]
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: The core suite closes fixture browsers and HTTP services, removes its temporary files and retracts registry entries.
    limits: { timeoutMs: 120000, maxMemoryMb: 1024 }
    installation: never
  - id: local-face-cascade
    name: Bundled face cascade integrity and bounds
    purpose: Reconstruct the exact pinned upstream model and exercise the real classifier on bounded no-face inputs.
    level: unit
    runner:
      kind: node-test
      scope: package
      files: [tests/face-cascade.test.js]
    expected:
      - Every bundled tree reconstructs the original upstream binary hash without network access.
      - Uniform images produce no invented faces, and malformed models or unbounded inputs are refused.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: disposable }
    limits: { timeoutMs: 30000, maxMemoryMb: 256 }
    installation: never
  - id: local-face-browser
    name: Local face finding in Chromium, Firefox and WebKit
    purpose: Load the real public-domain face fixture through the actual protected page and run the bundled worker without image uploads.
    level: browser
    runner:
      kind: vitest
      scope: package
      files: [tests/face-browser.spec.ts, tests/face.config.mjs, tests/authorization.config.mjs, tests/authorization.fixture.ts]
    expected:
      - The real local cascade locates the fixture face in all three browser engines; only fixed same-origin assets are fetched.
      - No-face, model failure, cancellation and newer manual/photo/mode/permission changes preserve the user's current boxes.
      - The four exact asset routes require the current principal's view grant without exposing arbitrary files.
    prerequisites: [runner:vitest, browser:chromium, browser:firefox, browser:webkit, fixture:portrait-public-domain-photo, core:application-authorization, input:oshal-core-root]
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures: [tests/fixtures/astronaut.png, tests/fixtures/README.md]
      cleanup: The suite terminates workers, closes browsers and loopback HTTP fixtures, and removes temporary fixture records and files. No providers or real camera are used.
    limits: { timeoutMs: 180000, maxMemoryMb: 1024 }
    installation: never
  - id: application-permission-http
    name: Application CRUD and independent ownership
    purpose: Verify real core policy and package HTTP across exact principals without contacting a provider.
    level: integration
    runner:
      kind: vitest
      scope: package
      files: [tests/authorization.spec.ts, tests/authorization.fixture.ts, tests/authorization.config.mjs]
    expected:
      - View, read, create, change and delete grants remain independent and deny blocks the entire component.
      - The actual manifest route mounter admits a named manager without a legacy assignment and refuses unassigned or revoked principals.
      - Two users and a second issuer sharing a subject cannot read or change one another's portraits.
      - Revoked generation cannot publish and unsafe CLI or mailbox transports fail before their effects.
      - The operator-only antigravity-cli rail serves the operator; anyone else, or a provider not available to the caller, is refused portrait_provider_unavailable before a row with one resolve and no other provider; codex-cli stays refused.
    prerequisites: [runner:vitest, core:application-authorization, input:oshal-core-root]
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: The suite closes loopback HTTP servers and removes its temporary image directories; policy and record stores are isolated memory fixtures.
    limits: { timeoutMs: 120000, maxMemoryMb: 1024 }
    installation: never
  - id: application-permission-browser
    name: Permission-aware Portrait UI
    purpose: Exercise the actual page against real authorization and HTTP in disposable Chromium contexts.
    level: browser
    runner:
      kind: vitest
      scope: package
      files: [tests/authorization-browser.spec.ts, tests/authorization.fixture.ts, tests/authorization.config.mjs]
    expected:
      - Readers see their own gallery and cannot access create, rename, delete or export controls.
      - Editors rename only their own titles and live role revocation hides unavailable controls.
    prerequisites: [runner:vitest, browser:chromium, core:application-authorization, input:oshal-core-root]
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: The suite closes its Chromium contexts and loopback services and removes all fixture files.
    limits: { timeoutMs: 120000, maxMemoryMb: 1024 }
    installation: never
  - id: brand-colors
    name: Use my brand colors in portrait notes
    purpose: Run the surface's own brand button script against a stubbed session and field.
    level: unit
    runner:
      kind: node-test
      scope: package
      files: [tests/portrait-brand.test.js]
    expected:
      - Without Create access or a kit the button stays hidden.
      - With a kit it appends the brand's colors in words once, within the notes limit.
      - Under an audience view the brand kit is never read and the button stays hidden.
    prerequisites: [runner:node-test]
    sideEffects: none
    isolation: { mode: disposable }
    limits: { timeoutMs: 30000, maxMemoryMb: 256 }
    installation: never
  - id: audience-view
    name: Audience view contract
    purpose: >-
      Verify the page provides its family (Home shell) and company (Business shell) audience views through the shared kit: kit loaded after the
      theme bootstrap, boot with this application's own name and exactly its audiences, full-page start gated
      on the kit's decision, head block parses and reads only this package's own routes.
    level: unit
    runner:
      kind: node-test
      scope: package
      files:
        - tests/audience-view.test.cjs
    expected:
      - The shared kit stylesheet and script follow the theme bootstrap exactly once.
      - The boot names this application and exactly the audiences the page provides, with an escape label.
      - The full page start runs only when the kit renders no audience, and when the kit is absent.
      - The head block parses, reads only this package's routes and builds no HTML from data.
      - On open the family view makes two reads, GET /api/portrait-studio/portraits and /catalog; it never probes the image provider, reads permissions, the brand kit or an artifact handle, and never writes.
      - The saved ready, waiting-or-being-made and did-not-finish counts read as plain stats; a queued portrait is waiting, never called being made; a ready portrait is a tile that opens its picture in a new tab.
      - On the way, ready to see, at least N when the route's 60-row list is full, no finished portraits and no portraits each read as what they are; style names fall back to the style id and a data key stays a word.
      - Signed out, refused, a failed read, a non-JSON answer and an unreachable server each read as what they are.
      - Under the family view neither inline body script starts (no brand-kit read, no studio start); with the kit idle or absent the full studio starts as before, and the two modules loaded by src only define their globals.
    prerequisites:
      - runner:node-test
    sideEffects: none
    isolation:
      mode: none
    limits:
      timeoutMs: 15000
    installation: never

  - id: workspace-foundation
    name: Real photo crop properties and local history
    purpose: Exercise the actual shared editor shell and package source controls in real Chromium on isolated fixtures.
    level: browser
    runner: {kind: node-test, scope: package, files: [tests/workspace-foundation.test.mjs]}
    expected:
      - Shared properties edit the actual source controls and preserve the native domain command path.
      - Phone navigation and inspector remain usable without horizontal overflow or provider calls.
    prerequisites: [runner:node, browser:chromium, source:core-dependencies, source:kernel-shared-ui]
    sideEffects: fixture-write
    isolation:
      mode: disposable
      cleanup: Close the exact owned browser and loopback fixture. Only synthetic data is used.
    limits: {timeoutMs: 120000, maxMemoryMb: 1536}
    installation: never

  - id: studio-steps
    name: Three steps with Generate in reach
    purpose: Drive the real page in Chromium at 412x915 and 1440x900 over synthetic reads and a recording fake for POST /portraits.
    level: browser
    runner: {kind: node-test, scope: package, files: [tests/studio-steps.test.mjs]}
    expected:
      - Once a photo and a style are chosen, Generate portrait starts within the first two 915px phone screens.
      - Generate sends Step 3's notes and settings; the inspector carries no second copy of them, and each setting appears once.
      - The stepper shows one step's controls at a time; the source commands open from one document menu and undo and redo crop appear once a photo is loaded.
      - Mode's selected segment is inverted ink; Style is a tile grid with 44px chips and one description on tap; the engine line sits beside Generate only while the model is asleep.
      - With portraits, Your portraits is the first screen with one New portrait at the bottom right; with none the studio opens on Step 1 with Add a photo in the top third and no embedded concierge column.
      - Generate is drawn, on screen and uncovered at Step 3 for everyone; without the create permission or without an image model it is disabled with one line beside it saying why and what makes it work (Roger, 2026-11-06, F15).
      - The stepper is numbered circles with the current step filled; Step 1 names the next two steps; each step bar is marked data-ef-floating; the native kernel's asleep answer shows the line beside Generate.
      - A press whose first answer only woke the image model waits for it and sends the same portrait once more, removing the empty record the wake left.
      - Uploading landscape or tall portrait photos keeps Step 1's crop canvas bounded (<=460x340px) with Next: Style on screen, and Step 3 pairs a live cropped/generated preview beside a two-column minor-adjustment grid with Generate on screen.
    prerequisites: [runner:node, browser:chromium, source:core-dependencies, source:kernel-shared-ui]
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: Close the exact owned browser contexts and loopback fixture. Only synthetic data is used; no image model is called.
    limits: {timeoutMs: 120000, maxMemoryMb: 1536}
    installation: never

  - id: durable-source-projects
    name: Durable owned source and assistant handoff
    purpose: Drive real Chromium through the package typed HTTP routes into disposable application-owned FORCE-RLS PostgreSQL.
    level: browser
    runner: {kind: node-test, scope: package, files: [tests/source-projects-browser.test.mjs]}
    expected:
      - Focused edits save and reopen with stable source object IDs and immutable revisions.
      - Assistant edits refresh the same document while concurrent browser drafts remain untouched.
      - The document session the shell Concierge reads carries the actual saved identity, revision and selection; the page embeds no second concierge.
      - Original grants and owner isolation remain enforced; generation is never invoked by saving source.
    prerequisites: [runner:node, browser:chromium, runtime:canonical-store-toolchain, service:docker-local-postgres16, source:kernel-shared-ui]
    sideEffects: fixture-write
    isolation:
      mode: disposable
      fixtures: [tests/fixtures/editor-source-postgres.fixture.mjs]
      cleanup: Close Chromium and pools; verify the fixture container label before removing that exact disposable container.
    limits: {timeoutMs: 120000, maxMemoryMb: 2048}
    installation: never

  - id: bounded-source-contract
    name: Bounded native source operation contract
    purpose: Execute the actual closed operation examples and keep model-facing contract responses within an 8KiB observation budget.
    level: unit
    runner: {kind: node-test, scope: package, files: [tests/source-contract.test.mjs]}
    expected:
      - Contract and native held-tool description examples execute through the actual package validator.
      - Invented operation aliases, type discriminators and unrelated fields remain refused.
      - Authorized HTTP reads return exact bounded catalog IDs; denied reads reveal no contract, with no SQL or generation calls.
    prerequisites: [runner:node, runtime:canonical-store-toolchain, source:core-dependencies]
    sideEffects: none
    isolation:
      mode: disposable
      cleanup: Close the exact loopback contract server; no database, browser, worker or generated outputs are created.
    limits: {timeoutMs: 15000, maxMemoryMb: 256}
    installation: never

  - id: source-editor-authority
    name: Owned source editor authority
    purpose: Exercise the actual source access guard with explicit named decision seams and compare privileged operation bindings.
    level: unit
    runner: {kind: node-test, scope: package, files: [tests/editor-role-closure.test.mjs]}
    expected:
      - Source edits require the original active owner and current named permissions.
      - Provider generation, training, printer control and sending are not conferred by the source editor role.
      - Existing privileged roles retain their reviewed operations.
    prerequisites: [runner:node, runtime:canonical-store-toolchain]
    sideEffects: none
    isolation: {mode: none}
    limits: {timeoutMs: 15000, maxMemoryMb: 512}
    installation: never
