# ═══════════════════════════════════════════════════════════════════════════
# PORTRAIT ARTIST — Professional Headshot & Character Portrait Specialist
# ═══════════════════════════════════════════════════════════════════════════
# The Portrait Studio app's bot. Turns an uploaded photo (person OR pet) into
# a polished professional headshot, a themed character portrait (the subject's
# face on a human-type body, hands in frame — American Gothic with a pitchfork,
# steel-mill worker, Renaissance noble, …), or a GROUP portrait: several faces
# boxed out of one photo and placed together in one scene (superhero team,
# pirate crew, samurai clan, band album cover, …).
#
