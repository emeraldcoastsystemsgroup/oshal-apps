# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — Portrait Studio
#
# Take or upload a photo, crop the head, and generate a portrait:
#   • Professional mode — a studio-quality headshot (backdrop, attire, framing).
#   • Character mode — the fun side: the subject's face (person OR pet) on a
#     human-type body, hands in frame, in a themed scene — American Gothic with
#     a pitchfork, steel-mill worker, Renaissance noble, astronaut, …
#   • Group mode — box every face in ONE photo (2–6); the browser tiles them into
#     a numbered reference sheet and one generation places all of them in a
#     scene: superhero team, pirate crew, samurai clan, band album cover, …
#
# ADR-085 package: self-contained, installed from the oshal-apps store,
# nothing compiled into the swarm core. Every path below is package-relative.
# ─────────────────────────────────────────────────────────────────────────────

name: portrait-studio
suite: ai-creative   # ADR-097: primary catalog shelf (tools keep their own category:)
displayName: Portrait Studio
description: >-
  Turn any photo into a portrait worth framing — a professional studio
  headshot, your pet's face on a human body holding a pitchfork, or the
  whole crew from one group shot placed in a scene as a superhero team.
  Take the photo with your camera or upload one, crop the head (or every
  head), pick a style, generate.
version: 1.15.1
status: active
# Deployment-wide tile visibility (the little-monsters lesson: person-scope hid
# the installed row from every other user). Portrait DATA stays strictly
# per-user — every route filters ps_portraits by the caller's user_sub.
scope: public

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: portrait-studio
  ref: main

# CORE-05 readiness requires a verified user with portrait.view. Installation reports pending
# until a user PAT is supplied; this metadata read never calls a provider or mutates data.
smoke:
  - name: package-readiness
    method: GET
    path: /api/portrait-studio/_smoke
    auth: pat
    requiresUser: true
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# ── Kernel skills this app calls (ADR-090 D8) — derived from actual imports ──
#   @/features/video-generation → media-generation (storyboard image providers:
#                                 the vendor-abstracted image-to-image engine)
#   @/features/llm-provider     → tool-registry    (swarm credential resolver)
uses:
  - media-generation
  - tool-registry
  - test-catalog
  - application-authorization
  - authenticated-artifacts
  - app-dependencies   # compatibility floor for the tiered dependencies block (ADR-085 addendum)

authorization:
  version: 1
  catalog: authorization.yaml

# Named application permissions above own admission. The retired subject-only
# access.defaultTier would deny legitimate named-role holders before that policy.

testing:
  version: 1
  catalog: tests/test-lab.yaml

# Connector dependencies remain declared for future issuer-qualified mail capability.
# Email currently refuses with 503 before the subject-only credential broker is called.
# ── ADR-141 per-user readiness (asked by the Intelligent Career group's setup page) ──
readiness:
  - name: portrait
    path: /api/portrait-studio/readiness
    readyPointer: /portrait/ready
    detailPointer: /portrait/detail

# ── Cross-package prerequisites: what this package actually reaches ─────────
# OPTIONAL, NOT REQUIRED: tools/portrait-studio.html:329 reads /api/create/brand-kit to offer the
# "brand colours" chip. The code already hides the chip when the read does not return a kit, so
# without Create — or without access to it — the studio is the same studio minus one shortcut.
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: [create]   # owns the brand kit the brand chips read; absent, the chips stay hidden
    tools: []
    connectors: [google, microsoft]

ragCollections: []

# ── ADR-139 artifact exchange — this app as a "Send to…" DESTINATION ─────────
# Any image anywhere in the swarm can be sent here: the cockpit navigates to
# /cockpit/?app=portrait-studio&artifact=<ref> and the surface loads the image
# straight into Step 1 (crop). Open mode needs no endpoint (Amendment A).
artifacts:
  provides:
    - label: Portrait Studio
      types: [image/png]
      list: /api/portrait-studio/artifacts
  accepts:
    - id: restyle
      label: Restyle in Portrait Studio
      icon: 🎨
      types: [image/*]
      mode: open

settings:
  schema:
    dailyCap:
      type: integer
      default: 25
      label: Portrait generations per user per day

# ── The app's bot — prompt-craft rules + quality gate live in the persona.
# Reason-only concierge (registered inline via the manifest bot registrar);
# the interactive generate path is deterministic template + media-generation
# kernel skill, same shape as deck-generation.
bots:
  - agentId: b0100000-0000-0000-0000-000000000001
    name: portrait-artist
    persona: personas/portrait-artist.yaml
    role: media/portrait-generation
    capabilities: [portrait-generation, headshot-styling, identity-preservation, image-prompt-craft]

# ── Ribbon surface ────────────────────────────────────────────────────────────
ui:
  static:
    - toolName: portrait-studio
      label: Portrait Studio
      icon: codicon codicon-device-camera
      iframeUrl: /api/portrait-studio/app
      section: top

# ── Routes — compiled JS bundled in this package, mounted in-process ─────────
# service-or-oidc: browser users sign in via OIDC; internal service calls
# (Jarvis / operator tools / smoke tests) pass X-Service-Secret + X-OSHAL-User-Sub,
# which the mounter resolves into the caller sub (same pattern as eats/rides/spotify).
routes:
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/portrait-studio/_smoke
    auth: oidc
    requiresContext: true
    requiresAi: false

  - module: routes/portrait-studio-routes.js
    factory: createPortraitStudioRoutes
    mountPath: /api/portrait-studio
    auth: service-or-oidc
    requiresContext: true

# ── This app's own schema, applied idempotently on install ───────────────────
migrations:
  - migrations/001-portrait-studio.sql
  - migrations/002-cost-and-resilience.sql
  - migrations/003-verified-portrait-ownership.sql

theme: midnight

ribbon:
  defaultView: portrait-studio

summary:
  path: /api/portrait-studio/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items

integrations:
  offers:
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1
