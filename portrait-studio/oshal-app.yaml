# CHANGE LOG: request-key | maintainer@emeraldcoastsystemsgroup.com | 1.16.3: issue fresh contract request keys and reject edit keys outside the existing backend UUID contract.
# 1.16.2 | maintainer@emeraldcoastsystemsgroup.com | Separate owned source creation from provider generation while preserving existing creator and manager operations.
# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | 1.15.5: portrait-artist declares routing words (portrait, portrait studio, headshot, pet portrait, ...): asked from Jarvis, the request went to another application (Video Studio, Scan to Print) or to none. Guarded by the kernel's jarvis_routing_store_tests sweep_requests_reach_the_application_that_does_the_work.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Roger, 2026-11-04: the default look is now Light Blue, "the white background blue highlights"; this package declared midnight, so it now declares light-blue. A person's saved theme still wins.
# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — Portrait Studio
#
# Take or upload a photo, crop the head, and generate a portrait:
#   • Professional mode — a studio-quality headshot (backdrop, attire, framing).
#   • Character mode — the fun side: the subject's face (person OR pet) on a
#     human-type body, hands in frame, in a themed scene — American Gothic with
#     a pitchfork, steel-mill worker, Renaissance noble, astronaut, …
#   • Group mode — box every face in ONE photo (2–6); the browser tiles them into
#     a numbered reference sheet and one generation places all of them in a
#     scene: superhero team, pirate crew, samurai clan, band album cover, …
#
# ADR-085 package: self-contained, installed from the oshal-apps store,
# nothing compiled into the swarm core. Every path below is package-relative.
# ─────────────────────────────────────────────────────────────────────────────

# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.16.0: durable original-owned editable source projects, typed operations, saved AI selection and compact shared editor.
# 4 | maintainer@emeraldcoastsystemsgroup.com | 1.17.0, UX audit 2026-11-06: one set of generation settings (the duplicate column is gone), a 1 Photo, 2 Style, 3 Generate stepper with Generate portrait in reach, Your portraits first once portraits exist, the source commands in one document menu; no route or permission change.
# 5 | maintainer@emeraldcoastsystemsgroup.com | 1.17.1, the production check: Generate portrait rides Step 3's sticky step bar beside Back, so it is on a phone's first screen without a scroll; no route or permission change.
# 6 | maintainer@emeraldcoastsystemsgroup.com | 1.17.2: New portrait carries data-ef-floating (kernel PR #197) so the shell orb rests above it on a phone.
# 7 | maintainer@emeraldcoastsystemsgroup.com | 1.17.3: Roger, 2026-11-06 (F15): Generate is always drawn at Step 3, disabled with the reason beside it when it cannot run (no create access, no image model); a numbered stepper and a Step 1 line that names the next two steps; a first press that only wakes the image model makes the portrait without a second press.
# 8 | maintainer@emeraldcoastsystemsgroup.com | 1.17.4: Roger, 2026-11-06: bounded Step 1 cropper (<=460x340px), compact Step 3 two-column minor-adjustment grid paired with a live image preview, plus Roman Soldier armor preset and Gladiator armor fix.
name: portrait-studio
suite: ai-creative   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features:
    - id: portrait-generation
      unit: portrait
      tier: T0
      generation: hosted
      degrade: disable
displayName: Portrait Studio
description: "Edit face crops and generation settings in a saved source project, retain original photos, and hand rendered results into the image editor."
version: 1.17.4
status: active
# Deployment-wide tile visibility (the little-monsters lesson: person-scope hid
# the installed row from every other user). Portrait DATA stays strictly
# per-user — every route filters ps_portraits by the caller's user_sub.
scope: public
# On the native kernel the package folder is read-only: photos and generated portraits are kept
# in the package's own lasting directory (OSHAL_PACKAGE_DATA_DIR), still one hashed folder per person.
lastingStorage: true

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: portrait-studio
  ref: main

# CORE-05 readiness requires a verified user with portrait.view. Installation reports pending
# until a user PAT is supplied; this metadata read never calls a provider or mutates data.
smoke:
  - name: package-readiness
    method: GET
    path: /api/portrait-studio/_smoke
    auth: pat
    requiresUser: true
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# ── Kernel skills this app calls (ADR-090 D8) — derived from actual imports ──
#   @/features/video-generation → media-generation (storyboard image providers:
#                                 the vendor-abstracted image-to-image engine)
#   @/features/llm-provider     → tool-registry    (swarm credential resolver)
uses:
  - media-generation
  - tool-registry
  - test-catalog
  - application-authorization
  - authenticated-artifacts
  - app-dependencies   # compatibility floor for the tiered dependencies block (ADR-085 addendum)
  - experience-roles

authorization:
  version: 1
  catalog: authorization.yaml
  roleTemplates:
    - id: manager
      version: 1
      label: Portrait Studio Manager
      members:
        - { app: portrait-studio, role: manager }
        - { app: create, role: admin }
    - id: creator
      version: 1
      label: Portrait Creator
      members:
        - { app: portrait-studio, role: creator }
        - { app: portrait-studio, role: editor }
        - { app: portrait-studio, role: deleter }
        - { app: portrait-studio, role: mailer }
        - { app: portrait-studio, role: artist }
        - { app: create, role: creator }

# Named application permissions above own admission. The retired subject-only
# access.defaultTier would deny legitimate named-role holders before that policy.

testing:
  version: 1
  catalog: tests/test-lab.yaml

# Connector dependencies remain declared for future issuer-qualified mail capability.
# Email currently refuses with 503 before the subject-only credential broker is called.
# ── ADR-141 per-user readiness (asked by the Intelligent Career group's setup page) ──
readiness:
  - name: portrait
    path: /api/portrait-studio/readiness
    readyPointer: /portrait/ready
    detailPointer: /portrait/detail

# ── Cross-package prerequisites: what this package actually reaches ─────────
# OPTIONAL, NOT REQUIRED: tools/portrait-studio.html:444 reads /api/create/brand-kit to offer the
# "brand colours" chip. The code already hides the chip when the read does not return a kit, so
# without Create — or without access to it — the studio is the same studio minus one shortcut.
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: [create]   # owns the brand kit the brand chips read; absent, the chips stay hidden
    tools: []
    connectors: [google, microsoft]

ragCollections: []

# ── ADR-139 artifact exchange — this app as a "Send to…" DESTINATION ─────────
# Any image anywhere in the swarm can be sent here: the cockpit navigates to
# /cockpit/?app=portrait-studio&artifact=<ref> and the surface loads the image
# straight into Step 1 (crop). Open mode needs no endpoint (Amendment A).
artifacts:
  provides:
    - label: Portrait Studio
      types: [image/png]
      list: /api/portrait-studio/artifacts
  accepts:
    - id: restyle
      label: Restyle in Portrait Studio
      icon: 🎨
      types: [image/*]
      mode: open

settings:
  schema:
    dailyCap:
      type: integer
      default: 25
      label: Portrait generations per user per day

# ── The app's bot — prompt-craft rules + quality gate live in the persona.
# Reason-only concierge (registered inline via the manifest bot registrar);
# the interactive generate path is deterministic template + media-generation
# kernel skill, same shape as deck-generation.
bots:
  - agentId: b0100000-0000-0000-0000-000000000001
    name: portrait-artist
    routingKeywords:
      - portrait
      - portrait studio
      - headshot
      - pet portrait
      - avatar
      - portrait of
    persona: personas/portrait-artist.yaml
    role: media/portrait-generation
    capabilities: [portrait-generation, headshot-styling, identity-preservation, image-prompt-craft]

# ── Ribbon surface ────────────────────────────────────────────────────────────
ui:
  static:
    - toolName: portrait-studio
      label: Portrait Studio
      icon: codicon codicon-device-camera
      iframeUrl: /api/portrait-studio/app
      section: top

# ── Routes — compiled JS bundled in this package, mounted in-process ─────────
# service-or-oidc: browser users sign in via OIDC; internal service calls
# (Jarvis / operator tools / smoke tests) pass X-Service-Secret + X-OSHAL-User-Sub,
# which the mounter resolves into the caller sub (same pattern as eats/rides/spotify).
routes:
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/portrait-studio/_smoke
    auth: oidc
    requiresContext: true
    requiresAi: false

  - module: routes/portrait-studio-routes.js
    factory: createPortraitStudioRoutes
    mountPath: /api/portrait-studio
    auth: service-or-oidc
    requiresContext: true

  - module: routes/source-projects.mjs
    factory: createSourceProjectRoutes
    mountPath: /api/portrait-studio
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

# ── This app's own schema, applied idempotently on install ───────────────────
migrations:
  - migrations/001-portrait-studio.sql
  - migrations/002-cost-and-resilience.sql
  - migrations/003-verified-portrait-ownership.sql
  - migrations/006-editor-source-projects.sql
  - migrations/native/006-editor-source-projects.sql

theme: light-blue

ribbon:
  defaultView: portrait-studio

summary:
  path: /api/portrait-studio/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items

integrations:
  offers:
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1

nativeMigrations:
  - id: migrations/006-editor-source-projects.sql
    native: skip
    reason: Native schema retains physical original-person scope; PostgreSQL additionally forces owner RLS.

tools:
  - name: portrait-studio-source-list
    displayName: Source List
    type: api
    category: creative
    description: List this original owner’s saved editable source projects.
    executor:
      executorType: api
      apiEndpoint: GET /api/portrait-studio/source-projects
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    usageInstructions: Read the source-contract and source-read first. Use returned IDs and revision, copy requestKey from the just-read source-contract response for each exact edit intent, and retry an uncertain result with the identical requestKey and body. A conflict changes nothing; reread before proposing changes. The browser saves before assistant handoff and refreshes only when its draft is unchanged.
    routingTags: [creative, editing, portrait, source]
  - name: portrait-studio-source-contract
    displayName: Source Contract
    type: api
    category: creative
    description: Read the compact closed operation contract before changing photo crops and generation settings. Omit section for operation shapes and examples; set section to read one bounded actual catalog of allowed IDs.
    executor:
      executorType: api
      apiEndpoint: GET /api/portrait-studio/source-projects/contract?section={input.section}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        section: {type: string, enum: [styles, background, attire, headwear, prop, finish, framing]}
      required: []
      additionalProperties: false
    usageInstructions: Read the source-contract and source-read first. Use returned IDs and revision, copy requestKey from the just-read source-contract response for each exact edit intent, and retry an uncertain result with the identical requestKey and body. A conflict changes nothing; reread before proposing changes. The browser saves before assistant handoff and refreshes only when its draft is unchanged.
    routingTags: [creative, editing, portrait, source]
  - name: portrait-studio-source-read
    displayName: Source Read
    type: api
    category: creative
    description: Read the actual owned source project, stable photo and crop IDs, current revision and immutable history.
    executor:
      executorType: api
      apiEndpoint: GET /api/portrait-studio/source-projects/{input.id}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {id: {type: string, minLength: 36, maxLength: 36}}
      required: [id]
      additionalProperties: false
    usageInstructions: Read the source-contract and source-read first. Use returned IDs and revision, copy requestKey from the just-read source-contract response for each exact edit intent, and retry an uncertain result with the identical requestKey and body. A conflict changes nothing; reread before proposing changes. The browser saves before assistant handoff and refreshes only when its draft is unchanged.
    routingTags: [creative, editing, portrait, source]
  - name: portrait-studio-source-edits
    displayName: Source Edits
    type: api
    category: creative
    description: >-
      Apply bounded typed source operations to an owned project at the exact revision.
      Every operations item uses op, never type. Crop example: {"op":"set-crop","id":"actual crop UUID","values":{"x":17}}.
      Notes example: {"op":"set-brief","values":{"notes":"requested notes"}}.
      Substitute actual source-read IDs. Never renders or changes generated evidence.
    executor:
      executorType: api
      apiEndpoint: POST /api/portrait-studio/source-projects/{input.id}/edits
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties: {id: {type: string, minLength: 36, maxLength: 36}, baseRevision: {type: integer, minimum: 1, maximum: 99}, requestKey: {description: "Copy requestKey unchanged from the just-read editing contract response for this new edit; never invent it. Read a fresh contract for each new intent; retry an uncertain result with the identical key and body.", type: string, format: uuid, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$', minLength: 36, maxLength: 36}, operations: {type: array, minItems: 1, maxItems: 16, items: {type: object}}}
      required: [id, baseRevision, requestKey, operations]
      additionalProperties: false
    usageInstructions: Read the source-contract and source-read first. Use returned IDs and revision, copy requestKey from the just-read source-contract response for each exact edit intent, and retry an uncertain result with the identical requestKey and body. A conflict changes nothing; reread before proposing changes. The browser saves before assistant handoff and refreshes only when its draft is unchanged.
    routingTags: [creative, editing, portrait, source]
