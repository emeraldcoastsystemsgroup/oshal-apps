# CHANGE LOG: request-key | maintainer@emeraldcoastsystemsgroup.com | 1.16.3: issue fresh contract request keys and reject edit keys outside the existing backend UUID contract.
# 1.16.2 | maintainer@emeraldcoastsystemsgroup.com | Separate owned source creation from provider generation while preserving existing creator and manager operations.
# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ | AUTHOR | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com | 1.15.5: portrait-artist declares routing words (portrait, portrait studio, headshot, pet portrait, ...): asked from Jarvis, the request went to another application (Video Studio, Scan to Print) or to none. Guarded by the kernel's jarvis_routing_store_tests sweep_requests_reach_the_application_that_does_the_work.
# 2 | maintainer@emeraldcoastsystemsgroup.com | Roger, 2026-11-04: the default look is now Light Blue, "the white background blue highlights"; this package declared midnight, so it now declares light-blue. A person's saved theme still wins.
# ─────────────────────────────────────────────────────────────────────────────
# OSHAL app package — Portrait Studio
#
# Take or upload a photo, crop the head, and generate a portrait:
#   • Professional mode — a studio-quality headshot (backdrop, attire, framing).
#   • Character mode — the fun side: the subject's face (person OR pet) on a
#     human-type body, hands in frame, in a themed scene — American Gothic with
#     a pitchfork, steel-mill worker, Renaissance noble, astronaut, …
#   • Group mode — box every face in ONE photo (2–6); the browser tiles them into
#     a numbered reference sheet and one generation places all of them in a
#     scene: superhero team, pirate crew, samurai clan, band album cover, …
#
# ADR-085 package: self-contained, installed from the oshal-apps store,
# nothing compiled into the swarm core. Every path below is package-relative.
# ─────────────────────────────────────────────────────────────────────────────

# 3 | maintainer@emeraldcoastsystemsgroup.com | 1.16.0: durable original-owned editable source projects, typed operations, saved AI selection and compact shared editor.
# 4 | maintainer@emeraldcoastsystemsgroup.com | 1.17.0, UX audit 2026-11-06: one set of generation settings (the duplicate column is gone), a 1 Photo, 2 Style, 3 Generate stepper with Generate portrait in reach, Your portraits first once portraits exist, the source commands in one document menu; no route or permission change.
# 5 | maintainer@emeraldcoastsystemsgroup.com | 1.17.1, the production check: Generate portrait rides Step 3's sticky step bar beside Back, so it is on a phone's first screen without a scroll; no route or permission change.
# 6 | maintainer@emeraldcoastsystemsgroup.com | 1.17.2: New portrait carries data-ef-floating (kernel PR #197) so the shell orb rests above it on a phone.
# 7 | maintainer@emeraldcoastsystemsgroup.com | 1.17.3: Roger, 2026-11-06 (F15): Generate is always drawn at Step 3, disabled with the reason beside it when it cannot run (no create access, no image model); a numbered stepper and a Step 1 line that names the next two steps; a first press that only wakes the image model makes the portrait without a second press.
# 8 | maintainer@emeraldcoastsystemsgroup.com | 1.17.4: Roger, 2026-11-06: bounded Step 1 cropper (<=460x340px), compact Step 3 two-column minor-adjustment grid paired with a live image preview, plus Roman Soldier armor preset and Gladiator armor fix.
# 9 | maintainer@emeraldcoastsystemsgroup.com | 1.17.5: Jarvis routing words (backlog P4-16g): portrait-artist adds 'headshot from'. "Make a professional headshot from this photo of me" tied Camera Ops on 'photo' and now reaches Portrait Studio; "Take a photo of me with the webcam" stays with Camera Ops. No route, tool or permission changed.
# 10 | maintainer@emeraldcoastsystemsgroup.com | Release 1.17.6 (concierge audit batch 1, store PR of 2026-11-12): the side-chat bot runs inline and its persona follows Create's create-editor (plain-prose rule, ```tool_call fence, runtime harness claude-code). This entry was missing from that release.
# 11 | maintainer@emeraldcoastsystemsgroup.com | 1.17.7: the catalog description says what the studio makes. Jarvis names an application from its description (kernel ADR-212), and this one said only "Edit face crops and generation settings in a saved source project ...": on blue (kernel f86cd306, routing scoreboard r1-before, 3 of 3 runs) "Create a pet portrait of my golden retriever as an astronaut" went to Create, and Jarvis wrote that Portrait Studio is "built for editing face crops and generation settings on saved photos". It now says it turns a person's or pet's photo into a professional headshot, a character portrait in a themed scene, or one group scene (the three modes of routes/portrait-catalog.js and the persona), and keeps what the old sentence said. Routed to Portrait Studio 3 of 3 after. No route, tool, bot or permission change.
# 12 | maintainer@emeraldcoastsystemsgroup.com | 1.17.8 (Roger, 2026-11-17, production: "portrait has a jarvis ball that opens create-editor not a concierge"): the page carries Portrait Studio's own concierge again, the kernel's one Jarvis chat window as portrait-artist in the shared editor, as every Create studio does, so Today hides its ball and its bar's Concierge opens Portrait's own window, alone or as Create's Portrait screen. Presentation only: no route, tool, bot, binding or permission changed. Guarded by tests/portrait-studio-one-chat-window.test.mjs (Test Lab case one-chat-window).
# 13 | maintainer@emeraldcoastsystemsgroup.com | 1.17.9: enforce portrait.view and portrait.read before querying ps_portraits in routes/home-summary.js (preserving post-read revocation recheck), verify live Production 200 home-summary tile, and close BACKLOG.md Item E. Guarded by tests/home-summary-authz.test.cjs.
# 14 | maintainer@emeraldcoastsystemsgroup.com | 1.17.10: tool parity (CREATE-TOOL-PORTRAIT-01, -02, -03, -09): concierge read tools (portrait-list, portrait-read, portrait-catalog, portrait-provider-status), approval-held portrait-create from owned photo references, Run again button + POST /portraits/:id/rerun + portrait-rerun on finished and failed gallery rows, and gallery tools (portrait-rename, portrait-delete, portrait-export, portrait-handoff) bound exclusively to existing permissions.
name: portrait-studio
suite: ai-creative   # ADR-097: primary catalog shelf (tools keep their own category:)
# Rating label (core ADR-170): container memory in MiB and each model-touching feature.
# After editing, run `node scripts/ai-usage-ledger.mjs --write` (ledger + README section).
rating:
  memoryMb: { low: 32, high: 128, basis: declared }
  features:
    - id: portrait-generation
      unit: portrait
      tier: T0
      generation: hosted
      degrade: disable
displayName: Portrait Studio
description: "Turn your own photo of a person or a pet into a portrait worth framing: a professional headshot, a character portrait with the face in a themed costume and scene, or one group scene with every face from a single photo. It keeps your original photos and saved projects, where you can edit each face crop and the generation settings, and hands finished portraits to the image editor."
version: 1.17.10
chatBot: portrait-artist
status: active
# Deployment-wide tile visibility (the little-monsters lesson: person-scope hid
# the installed row from every other user). Portrait DATA stays strictly
# per-user — every route filters ps_portraits by the caller's user_sub.
scope: public
# On the native kernel the package folder is read-only: photos and generated portraits are kept
# in the package's own lasting directory (OSHAL_PACKAGE_DATA_DIR), still one hashed folder per person.
lastingStorage: true

source:
  type: git-subdir
  url: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  path: portrait-studio
  ref: main

# CORE-05 readiness requires a verified user with portrait.view. Installation reports pending
# until a user PAT is supplied; this metadata read never calls a provider or mutates data.
smoke:
  - name: package-readiness
    method: GET
    path: /api/portrait-studio/_smoke
    auth: pat
    requiresUser: true
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false

# ── Kernel skills this app calls (ADR-090 D8) — derived from actual imports ──
#   @/features/video-generation → media-generation (storyboard image providers:
#                                 the vendor-abstracted image-to-image engine)
#   @/features/llm-provider     → tool-registry    (swarm credential resolver)
uses:
  - media-generation
  - tool-registry
  - test-catalog
  - application-authorization
  - authenticated-artifacts
  - app-dependencies   # compatibility floor for the tiered dependencies block (ADR-085 addendum)
  - experience-roles

authorization:
  version: 1
  catalog: authorization.yaml
  roleTemplates:
    - id: manager
      version: 1
      label: Portrait Studio Manager
      members:
        - { app: portrait-studio, role: manager }
        - { app: create, role: admin }
    - id: creator
      version: 1
      label: Portrait Creator
      members:
        - { app: portrait-studio, role: creator }
        - { app: portrait-studio, role: editor }
        - { app: portrait-studio, role: deleter }
        - { app: portrait-studio, role: mailer }
        - { app: portrait-studio, role: artist }
        - { app: create, role: creator }

# Named application permissions above own admission. The retired subject-only
# access.defaultTier would deny legitimate named-role holders before that policy.

testing:
  version: 1
  catalog: tests/test-lab.yaml

# Connector dependencies remain declared for future issuer-qualified mail capability.
# Email currently refuses with 503 before the subject-only credential broker is called.
# ── ADR-141 per-user readiness (asked by the Intelligent Career group's setup page) ──
readiness:
  - name: portrait
    path: /api/portrait-studio/readiness
    readyPointer: /portrait/ready
    detailPointer: /portrait/detail

# ── Cross-package prerequisites: what this package actually reaches ─────────
# OPTIONAL, NOT REQUIRED: tools/portrait-studio.html:444 reads /api/create/brand-kit to offer the
# "brand colours" chip. The code already hides the chip when the read does not return a kit, so
# without Create — or without access to it — the studio is the same studio minus one shortcut.
dependencies:
  required:
    apps: []
    tools: []
    connectors: []
  optional:
    apps: [create]   # owns the brand kit the brand chips read; absent, the chips stay hidden
    tools: []
    connectors: [google, microsoft]

ragCollections: []

# ── ADR-139 artifact exchange — this app as a "Send to…" DESTINATION ─────────
# Any image anywhere in the swarm can be sent here: the cockpit navigates to
# /cockpit/?app=portrait-studio&artifact=<ref> and the surface loads the image
# straight into Step 1 (crop). Open mode needs no endpoint (Amendment A).
artifacts:
  provides:
    - label: Portrait Studio
      types: [image/png]
      list: /api/portrait-studio/artifacts
  accepts:
    - id: restyle
      label: Restyle in Portrait Studio
      icon: 🎨
      types: [image/*]
      mode: open

settings:
  schema:
    dailyCap:
      type: integer
      default: 25
      label: Portrait generations per user per day

# ── The app's bot — prompt-craft rules + quality gate live in the persona.
# Reason-only concierge (registered inline via the manifest bot registrar);
# the interactive generate path is deterministic template + media-generation
# kernel skill, same shape as deck-generation.
bots:
  - agentId: b0100000-0000-0000-0000-000000000001
    name: portrait-artist
    posture: inline
    routingKeywords:
      - portrait
      - portrait studio
      - headshot
      - pet portrait
      - avatar
      - portrait of
      - headshot from
    persona: personas/portrait-artist.yaml
    role: media/portrait-generation
    capabilities: [portrait-generation, headshot-styling, identity-preservation, image-prompt-craft]

# ── Ribbon surface ────────────────────────────────────────────────────────────
ui:
  static:
    - toolName: portrait-studio
      label: Portrait Studio
      icon: codicon codicon-device-camera
      iframeUrl: /api/portrait-studio/app
      section: top

# ── Routes — compiled JS bundled in this package, mounted in-process ─────────
# service-or-oidc: browser users sign in via OIDC; internal service calls
# (Jarvis / operator tools / smoke tests) pass X-Service-Secret + X-OSHAL-User-Sub,
# which the mounter resolves into the caller sub (same pattern as eats/rides/spotify).
routes:
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/portrait-studio/_smoke
    auth: oidc
    requiresContext: true
    requiresAi: false

  - module: routes/portrait-studio-routes.js
    factory: createPortraitStudioRoutes
    mountPath: /api/portrait-studio
    auth: service-or-oidc
    requiresContext: true

  - module: routes/source-projects.mjs
    factory: createSourceProjectRoutes
    mountPath: /api/portrait-studio
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false

# ── This app's own schema, applied idempotently on install ───────────────────
migrations:
  - migrations/001-portrait-studio.sql
  - migrations/002-cost-and-resilience.sql
  - migrations/003-verified-portrait-ownership.sql
  - migrations/006-editor-source-projects.sql
  - migrations/native/006-editor-source-projects.sql

theme: light-blue

ribbon:
  defaultView: portrait-studio

summary:
  path: /api/portrait-studio/home-summary
  tilesPointer: /tiles
  metricsPointer: /metrics
  itemsPointer: /items

integrations:
  offers:
    - id: prepare-document
      label: Prepare a document
      targetApp: presentations
      targetAction: prepare-brief
      contextType: research-brief
      version: 1

nativeMigrations:
  - id: migrations/006-editor-source-projects.sql
    native: skip
    reason: Native schema retains physical original-person scope; PostgreSQL additionally forces owner RLS.

tools:
  - name: portrait-studio-source-list
    displayName: Source List
    type: api
    category: creative
    description: List this original owner’s saved editable source projects.
    executor:
      executorType: api
      apiEndpoint: GET /api/portrait-studio/source-projects
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    usageInstructions: Read the source-contract and source-read first. Use returned IDs and revision, copy requestKey from the just-read source-contract response for each exact edit intent, and retry an uncertain result with the identical requestKey and body. A conflict changes nothing; reread before proposing changes. The browser saves before assistant handoff and refreshes only when its draft is unchanged.
    routingTags: [creative, editing, portrait, source]
  - name: portrait-studio-source-contract
    displayName: Source Contract
    type: api
    category: creative
    description: Read the compact closed operation contract before changing photo crops and generation settings. Omit section for operation shapes and examples; set section to read one bounded actual catalog of allowed IDs.
    executor:
      executorType: api
      apiEndpoint: GET /api/portrait-studio/source-projects/contract?section={input.section}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        section: {type: string, enum: [styles, background, attire, headwear, prop, finish, framing]}
      required: []
      additionalProperties: false
    usageInstructions: Read the source-contract and source-read first. Use returned IDs and revision, copy requestKey from the just-read source-contract response for each exact edit intent, and retry an uncertain result with the identical requestKey and body. A conflict changes nothing; reread before proposing changes. The browser saves before assistant handoff and refreshes only when its draft is unchanged.
    routingTags: [creative, editing, portrait, source]
  - name: portrait-studio-source-read
    displayName: Source Read
    type: api
    category: creative
    description: Read the actual owned source project, stable photo and crop IDs, current revision and immutable history.
    executor:
      executorType: api
      apiEndpoint: GET /api/portrait-studio/source-projects/{input.id}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {id: {type: string, minLength: 36, maxLength: 36}}
      required: [id]
      additionalProperties: false
    usageInstructions: Read the source-contract and source-read first. Use returned IDs and revision, copy requestKey from the just-read source-contract response for each exact edit intent, and retry an uncertain result with the identical requestKey and body. A conflict changes nothing; reread before proposing changes. The browser saves before assistant handoff and refreshes only when its draft is unchanged.
    routingTags: [creative, editing, portrait, source]
  - name: portrait-studio-source-edits
    displayName: Source Edits
    type: api
    category: creative
    description: >-
      Apply bounded typed source operations to an owned project at the exact revision.
      Every operations item uses op, never type. Crop example: {"op":"set-crop","id":"actual crop UUID","values":{"x":17}}.
      Notes example: {"op":"set-brief","values":{"notes":"requested notes"}}.
      Substitute actual source-read IDs. Never renders or changes generated evidence.
    executor:
      executorType: api
      apiEndpoint: POST /api/portrait-studio/source-projects/{input.id}/edits
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties: {id: {type: string, minLength: 36, maxLength: 36}, baseRevision: {type: integer, minimum: 1, maximum: 99}, requestKey: {description: "Copy requestKey unchanged from the just-read editing contract response for this new edit; never invent it. Read a fresh contract for each new intent; retry an uncertain result with the identical key and body.", type: string, format: uuid, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$', minLength: 36, maxLength: 36}, operations: {type: array, minItems: 1, maxItems: 16, items: {type: object}}}
      required: [id, baseRevision, requestKey, operations]
      additionalProperties: false
    usageInstructions: Read the source-contract and source-read first. Use returned IDs and revision, copy requestKey from the just-read source-contract response for each exact edit intent, and retry an uncertain result with the identical requestKey and body. A conflict changes nothing; reread before proposing changes. The browser saves before assistant handoff and refreshes only when its draft is unchanged.
    routingTags: [creative, editing, portrait, source]
  - name: portrait-list
    displayName: List My Portraits
    type: api
    category: creative
    description: List the signed-in owner's portraits in Portrait Studio, including id, title, status, mode, style, timestamps, result link, and error when failed.
    executor:
      executorType: api
      apiEndpoint: GET /api/portrait-studio/portraits
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    usageInstructions: Call portrait-list before answering questions about what portraits exist or whether the latest run finished.
    routingTags: [creative, portrait, gallery, read]
  - name: portrait-read
    displayName: Read Portrait Details
    type: api
    category: creative
    description: Read one owned portrait's exact state, style, layer swaps, error if failed, and download/export links.
    executor:
      executorType: api
      apiEndpoint: GET /api/portrait-studio/portraits/{input.id}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        id: { type: string, format: uuid, minLength: 36, maxLength: 36, description: "Owned portrait UUID from portrait-list." }
      required: [id]
      additionalProperties: false
    usageInstructions: Call portrait-list first to obtain an exact owned portrait UUID, then call portrait-read.
    routingTags: [creative, portrait, gallery, read]
  - name: portrait-catalog
    displayName: Portrait Style Catalog
    type: api
    category: creative
    description: Read the Portrait Studio style presets, swappable layers (background, attire, headwear, prop, finish, framing), group limits, and named export sizes.
    executor:
      executorType: api
      apiEndpoint: GET /api/portrait-studio/catalog
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    usageInstructions: Call portrait-catalog to look up exact valid style, background, attire, headwear, prop, finish, framing, and export size IDs before calling portrait-create or portrait-export.
    routingTags: [creative, portrait, catalog, read]
  - name: portrait-provider-status
    displayName: Portrait Provider & Daily Cap Status
    type: api
    category: creative
    description: Read whether an image-generation provider is currently configured and available for this person, along with their 24-hour daily portrait cap usage and remaining count.
    executor:
      executorType: api
      apiEndpoint: GET /api/portrait-studio/provider-status
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    usageInstructions: Call portrait-provider-status to check image provider availability and daily cap remaining count before proposing portrait-create or portrait-rerun.
    routingTags: [creative, portrait, status, read]
  - name: portrait-create
    displayName: Create Portrait
    cardText: Generate a new portrait from your saved photo reference with the selected style and swaps (counts toward your daily portrait cap).
    type: api
    category: creative
    description: Create and queue a new portrait from an owned saved source project (sourceProjectId), uploaded source photo (sourceAssetId), or existing portrait crop (portraitId) using the same daily cap and provider checks as the screen. Held for approval.
    executor:
      executorType: api
      apiEndpoint: POST /api/portrait-studio/portraits
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        sourceProjectId: { type: string, format: uuid, minLength: 36, maxLength: 36, description: "Owned saved source project UUID (uses its saved photo crop and defaults)." }
        sourceAssetId: { type: string, format: uuid, minLength: 36, maxLength: 36, description: "Owned uploaded source asset UUID." }
        portraitId: { type: string, format: uuid, minLength: 36, maxLength: 36, description: "Owned existing portrait UUID whose saved cropped photo will be reused." }
        mode: { type: string, enum: [professional, character, group], description: "Portrait mode." }
        style: { type: string, minLength: 1, maxLength: 80, description: "Exact style preset ID from portrait-catalog." }
        background: { type: string, maxLength: 80, description: "Optional background layer ID override." }
        attire: { type: string, maxLength: 80, description: "Optional clothing/attire layer ID override." }
        headwear: { type: string, maxLength: 80, description: "Optional headwear/hat layer ID override." }
        prop: { type: string, maxLength: 80, description: "Optional prop layer ID override." }
        finish: { type: string, maxLength: 80, description: "Optional finish layer ID override." }
        framing: { type: string, maxLength: 80, description: "Optional framing layer ID override." }
        notes: { type: string, maxLength: 300, description: "Optional free-text notes (up to 300 characters)." }
        subjects: { type: integer, minimum: 2, maximum: 6, description: "Number of faces in group mode (2 to 6)." }
        title: { type: string, maxLength: 120, description: "Optional portrait title (up to 120 characters)." }
      required: []
      additionalProperties: false
    usageInstructions: Check portrait-provider-status and portrait-catalog (plus portrait-studio-source-list or portrait-list for an owned photo reference) first, then propose portrait-create with exact IDs.
    routingTags: [creative, portrait, generate, write]
  - name: portrait-rerun
    displayName: Run Portrait Again
    cardText: Run this portrait again using the exact same cropped photo, style, and settings (counts toward your daily portrait cap).
    type: api
    category: creative
    description: Run an owned finished or failed portrait again using its saved cropped photo, mode, style, swaps, and title without re-cropping. Counts toward the daily cap and is held for approval.
    executor:
      executorType: api
      apiEndpoint: POST /api/portrait-studio/portraits/{input.id}/rerun
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        id: { type: string, format: uuid, minLength: 36, maxLength: 36, description: "Owned finished or failed portrait UUID from portrait-list." }
      required: [id]
      additionalProperties: false
    usageInstructions: Call portrait-list first to confirm the portrait UUID, and check portrait-provider-status if needed, then call portrait-rerun once.
    routingTags: [creative, portrait, rerun, write]
  - name: portrait-rename
    displayName: Rename Portrait
    cardText: Rename this portrait in your Portrait Studio gallery.
    type: api
    category: creative
    description: Rename an owned portrait in the Portrait Studio gallery (up to 120 characters). Held for approval.
    executor:
      executorType: api
      apiEndpoint: PATCH /api/portrait-studio/portraits/{input.id}
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        id: { type: string, format: uuid, minLength: 36, maxLength: 36, description: "Owned portrait UUID from portrait-list." }
        title: { type: string, minLength: 0, maxLength: 120, description: "New portrait title (up to 120 characters)." }
      required: [id, title]
      additionalProperties: false
    usageInstructions: Call portrait-list first to confirm the exact owned portrait UUID before calling portrait-rename.
    routingTags: [creative, portrait, gallery, write]
  - name: portrait-delete
    displayName: Delete Portrait
    cardText: Permanently delete this portrait and its saved image files from your Portrait Studio gallery.
    type: api
    category: creative
    description: Permanently delete an owned portrait and its saved files from Portrait Studio. Held for approval.
    executor:
      executorType: api
      apiEndpoint: DELETE /api/portrait-studio/portraits/{input.id}
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        id: { type: string, format: uuid, minLength: 36, maxLength: 36, description: "Owned portrait UUID from portrait-list." }
      required: [id]
      additionalProperties: false
    usageInstructions: Call portrait-list first to verify the exact owned portrait UUID before proposing portrait-delete.
    routingTags: [creative, portrait, gallery, delete]
  - name: portrait-export
    displayName: Export Portrait Size
    type: api
    category: creative
    description: Return the owner-guarded download URL and pixel size metadata for a finished portrait in a named export preset (original, linkedin, square, passport, 300, 600, print, 4x6, portrait, 6x4, landscape).
    executor:
      executorType: api
      apiEndpoint: GET /api/portrait-studio/portraits/{input.id}/export-link?size={input.size}
    defaultAuthMode: auto
    requiresApproval: false
    inputSchema:
      type: object
      properties:
        id: { type: string, format: uuid, minLength: 36, maxLength: 36, description: "Owned finished portrait UUID from portrait-list." }
        size: { type: string, enum: [original, linkedin, square, passport, "300", "600", print, 4x6, portrait, 6x4, landscape], description: "Named export size preset." }
      required: [id, size]
      additionalProperties: false
    usageInstructions: Call portrait-list first to confirm the portrait is finished (done), then call portrait-export with the requested named size.
    routingTags: [creative, portrait, export, read]
  - name: portrait-handoff
    displayName: Send Portrait to Another App
    cardText: Prepare a handoff link to open this finished portrait in another Create application.
    type: api
    category: creative
    description: Prepare an owner-scoped artifact and open link to send a finished portrait to another Create app (create, publishing-studio, video, presentations, design-studio, or brand-graphics). Held for approval.
    executor:
      executorType: api
      apiEndpoint: POST /api/portrait-studio/portraits/{input.id}/handoff
    defaultAuthMode: ask
    requiresApproval: true
    inputSchema:
      type: object
      properties:
        id: { type: string, format: uuid, minLength: 36, maxLength: 36, description: "Owned finished portrait UUID from portrait-list." }
        targetApp: { type: string, enum: [create, publishing-studio, video, presentations, design-studio, brand-graphics], description: "Destination application slug." }
        size: { type: string, enum: [original, linkedin, square, passport, "300", "600", print, 4x6, portrait, 6x4, landscape], description: "Optional export size preset (defaults to original)." }
      required: [id, targetApp]
      additionalProperties: false
    usageInstructions: Call portrait-list first to confirm the portrait is finished (done), then call portrait-handoff with the target app.
    routingTags: [creative, portrait, handoff, export]
