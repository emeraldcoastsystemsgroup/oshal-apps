routes:
  - module: routes/experience.js
    factory: createExperienceRoutes
    mountPath: /api/jarvis-experience
    auth: oidc
    requiresAuth: true
    requiresContext: true
    requiresAi: false
  - module: routes/package-smoke.js
    factory: createPackageSmokeRoutes
    mountPath: /api/jarvis-experience/_smoke
    auth: service
    requiresContext: true
    requiresAi: false
ui:
  static:
    - toolName: jarvis-experience-main
      label: Jarvis
      icon: codicon codicon-layout
      iframeUrl: /api/jarvis-experience/app
      section: top
ribbon:
  hideFrameworkItems:
    - tickets
    - chat
    - calendar
    - addressbook
    - dashboard
smoke:
  - name: package-readiness
    method: GET
    path: /api/jarvis-experience/_smoke
    auth: service
    expect:
      status: 200
      jsonPointer: /package
      rejectValues: [noop, stub, empty]
    requiresAi: false
testing:
  version: 1
  catalog: tests/test-lab.yaml
connectors: []
chatBot: general-bot
